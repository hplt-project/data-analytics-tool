sample: '["\"\\\"M\u00e1s rud \u00e9 amh\u00e1in\\\" agus \\\"Ba ch\u00f3ir liom go
  bhfuil\\\" were the phrases I uttered when I used GSI Outdoors Commuter Javapress
  for the first time.\\nFeiceann t\u00fa, nuair a bh\u00ed m\u00e9 ag taisteal ar
  fud an domhain, bh\u00ed laethanta countless nuair a bh\u00ed m\u00e9 a \u00f3l
  an toirt crappy, caife lag sugary, which I call \u2018crapachino\u2019.\\nBh\u00ed
  m\u00e9 go mairfidh an ''crapachino\u2019 laethanta. Go h\u00e1irithe, an 4 straight
  days on the Trans-Siberian railroad going from Moscow to Irkutsk, ag lean\u00faint
  ansin leis an 2 laethanta ar an railroad Tras-Mong\u00f3ilis \u00f3 Irkutsk go Ulan
  Bator, then 2 more days onto Beijing.\\nThe train ride took a total of seven nights
  and spanned over 4700 m\u00edle, n\u00ed comhaireamh na laethanta ag na cinn scr\u00edbe
  ar an mbealach. Bh\u00ed s\u00e9 turas iontach ach le rud amh\u00e1in ann: Caife
  freshly brewed!\\nIs GSI Outdoors Comait\u00e9ara Javapress an freagra ar a caife
  \u00far ar an dul. Seo iniompartha \u00e9asca le h\u00fas\u00e1id, 15 fl. unsa.
  Beidh Fraincis caife preas mug teaglaim d\u00e9ant\u00f3ir / taistil sweeten do
  laethanta ar an mb\u00f3thar in \u00e1iteanna iarg\u00falta ar an domhan ina bhfuil
  caife \u00far chomh luachmhar mar uisce glan.\\nSon:\\n- Oibr\u00edonn s\u00e9 d\u00edreach
  cos\u00fail Bodum Fraincis press\\n- Feidhmeanna mar d\u00e9ant\u00f3ir caife agus
  mug\\n- Great for minimalists who prefer gear with multiple functions\\n- Oibr\u00edonn
  an mogalra sa carafe istigh fi\u00fa go maith le p\u00f3nair\u00ed caife talamh
  m\u00edn\\n- Uimh fuss, aon slat plunger agus \u00e9asca le h\u00fas\u00e1id\\n-
  Inaistrithe\\n- T\u00e1 lid sealable le l\u00fab\\n- \u00c9asca a ghlanadh\\n- Weighs
  ach 9.6 unsa.\\n- Chum inslithe inbhainte go gcuireann dath chun an mug\\n- Inbhainte
  chos neamh-duill\u00edn\\n- \u00cdocann t\u00fa an praghas amh\u00e1in agus fh\u00e1il
  ar dh\u00e1 - d\u00e9ant\u00f3ir caife agus a mug taistil\\n- An f\u00e9idir \u00e9
  a \u00fas\u00e1id le haghaidh tae scaoilte\\nT\u00e1 m\u00e9 ag t\u00e1st\u00e1il
  GSI Outdoors Comait\u00e9ireachta Javapress do 10 laethanta anois. N\u00ed raibh
  m\u00e9 ag aon fadhbanna le doirteadh dt\u00ed an l\u00e1 amh\u00e1in nuair nach
  raibh m\u00e9 a bhr\u00fa ar an carafe istigh l\u00e9ir ar an mbealach s\u00edos.
  Thug m\u00e9 \u00e9 ar thuras b\u00f3thair a Montauk Point Lighthouse. N-oireann
  s\u00e9 bre\u00e1 i sealbh\u00f3ir cup\u00e1n. Ghlac m\u00e9 \u00e9 ar mo thuras
  go dt\u00ed Manhattan tr\u00ed bus agus traenach.\\nCONS:\\n- Gan inslithe\\n- Beidh
  spill mura carafe istigh bhr\u00fa l\u00e9ir ar an mbealach s\u00edos (fadhb bheag)\\nTagann
  GSI Amuigh faoin aer Comait\u00e9ara Javapress chum inslithe i 5 dathanna - dearg,
  glas, gorm, or\u00e1iste agus graif\u00edt. So each family member can identify their
  mug and you\u2019ll always know which mug is yours on a table or in the campervan.\\nTagann
  Do GSI Outdoors Comait\u00e9ara Javapress le \u00e9asca conas \u00e9 a \u00fas\u00e1id
  agus treoracha c\u00faraim.\\nAn f\u00edorasc:\\nThe GSI Outdoors Commuter Javapress
  is the answer for travelers wanting freshly brewed coffee on the go. T\u00e1 s\u00e9
  oiri\u00fanach le haghaidh lucht si\u00fail fad-t\u00e9arma, fiontar\u00f3ir\u00ed,
  campers, b\u00f3thar-trippers, tiom\u00e1naithe leora\u00ed agus comait\u00e9ir\u00ed.\\nIf
  you don\u2019t have the time to brew a fresh cup of coffee at home and find yourself
  queuing in Starbucks paying about $4.50 gach maidin, b''fh\u00e9idir gur mhaith
  leat a mheas ag f\u00e1il an GSI faoin aer Comait\u00e9ireachta Javapress. It is
  one way to conserve paper cups and save money.\\nSmaoinigh ar seo: $4.50 x 5 l\u00e1
  sa tseachtain = $22.50 per week spent on Starbucks coffee. (Timpeall $90 in aghaidh
  na m\u00edosa.)\\nAn 15 unsa. GSI Outdoors Commuter Javapress cost retail $22.95,
  rud a chialla\u00edonn m\u00e1 t\u00e1 t\u00fa in ionad do chostais Starbucks le
  caife homemade ag baint \u00fas\u00e1ide as an Javapress, Feicfidh t\u00fa a sh\u00e1bh\u00e1il
  beagnach an costas ioml\u00e1n an Javapress i seachtain.\\nGSI Outdoors Commuter
  Javapress Ratings\\n-\\nDearadh - 9/10\\n9/10\\n-\\n\u00c9asca le \u00das\u00e1id
  - 9/10\\n9/10\\n-\\nLuach - 9/10\\n9/10\\nC\u00e1 h\u00e1it a Faigh s\u00e9:\\n-
  Is f\u00e9idir leat a fh\u00e1il ar an Comait\u00e9ara Java Preas ag GSIOutdoors.com\\n-
  Chomh maith leis sin ar Amazon.com\\nAn raibh t\u00fa riamh fadhbanna caife nuair
  a th\u00e9ann t\u00fa? F\u00e1g do n\u00f3ta tr\u00e1chta th\u00edos.\\nThe GSI
  Outdoors Commuter Javapress was provided for this review. Mar i gc\u00f3na\u00ed,
  T\u00e1 an t-athbhreithni\u00fa GSI Outdoors Comait\u00e9ara Javapress ach mo thuairim\u00ed
  agus tuairim\u00ed mac\u00e1nta. \ud83d\ude42\\nLeave a Reply\"", "\"3. LLDPE\\nT\u00e1
  LLDPE neamh-tocsaineach, gan blas agus gan bholadh, agus t\u00e1 a dhl\u00fas idir
  0.915 agus 0.935g/cm3.Is copolymer eitil\u00e9ine \u00e9 agus m\u00e9id beag a-olefin
  ard-ghr\u00e1d faoi ghn\u00edomha\u00edocht chatala\u00edoch, at\u00e1 polaim\u00e9irithe
  ag br\u00fa ard n\u00f3 br\u00fa \u00edseal.Is sainair\u00edonna \u00e9 strucht\u00far
  m\u00f3il\u00edneach traidisi\u00fanta LLDPE n\u00e1 a chn\u00e1mh droma l\u00edneach
  le beag\u00e1n n\u00f3 gan brains\u00ed fada, ach t\u00e1 roinnt brains\u00ed gearra
  ann.D\u00e9anann easpa brains\u00ed slabhra fada an polaim\u00e9ir n\u00edos criostalach.\\nI
  gcompar\u00e1id le LDPE, t\u00e1 na bunt\u00e1ist\u00ed a bhaineann le neart ard,
  toughness maith, rigidity l\u00e1idir, friota\u00edocht teasa agus friota\u00edocht
  fuar ag baint le LLDPE.\\nAchoimre\\nGo hachomair, imr\u00edonn na tr\u00ed \u00e1bhar
