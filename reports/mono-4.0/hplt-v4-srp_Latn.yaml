  nisu verovali da rad donosi rezultate, ve\u0107 da prevarama i neistinama ne\u010diji
  rad mo\u017ee da se ospori. Oni ne znaju da naporan rad donosi rezultate - ka\u017ee
  Vu\u010di\u0107.\\nPredsednik Srbije Aleksandar Vu\u010di\u0107 rekao je danas da
  je veoma zabrinut zbog poslednjih doga\u0111aja na Kosovu i Metohiji, i da se pla\u0161i
