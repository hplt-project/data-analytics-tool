  nedu\u017ene. \u010cini mi se da je on sino\u0107 ustao da upozorava tako da moramo
  te stvari da pre\u0111emo.\\nIskreno, ja pri\u017eeljkujem da se igra peta utakmica.
  Time ne optere\u0107ujem trenere i igra\u010de, njima \u010destitam \u0161ta su
