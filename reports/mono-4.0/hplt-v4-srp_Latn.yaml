  \u201eStar sam i ne mogu da obavljam nikakvu du\u017enost.\u201c Zapravo, postoje
  mnoge du\u017enosti koje mo\u017ee\u0161 da obavlja\u0161 u skladu sa svojim sposobnostima.
  Ako ne obavlja\u0161 nikakvu du\u017enost, ve\u0107 se umesto toga razme\u0107e\u0161
  svojim poznim godinama, u \u017eelji da drugima dr\u017ei\u0161 pridike, ko bi onda
  \u017eeleo da te slu\u0161a? Niko. Stalno govori\u0161: \u201ePa, vi mladi ni\u0161ta
  ne shvatate!\u201c, \u201eVi mladi ste tako sebi\u010dni!\u201c, \u201eVi mladi
  ste tako nadmeni!\u201c i \u201eVi mladi ste prave len\u0161tine. Mi stariji smo
  radni i vredni i, u moje vreme, bili smo takvi i takvi.\u201c Koja je korist od
