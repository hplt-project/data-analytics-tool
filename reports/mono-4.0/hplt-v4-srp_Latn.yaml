sample: '["\"U maju su u pojedinim op\u0161tinama u Srbiji cene kvadrata padale a
  u nekima su rasle, ali uglavnom ne dovoljno da pristignu prethodni pad. Kako ka\u017eu
  stru\u010dnjaci, to bi mogao biti jedan od signala da se tr\u017ei\u0161te nekretnina
  polako stabilizuje.\\nOvde treba napomenuti da su mesta u kojima su nekretnine pro\u0161log
  meseca poskupele, pre toga bele\u017eila pad cene kvadrata, pi\u0161e portal nekretnine.rs
  i daje pregled po gradovima.\\nBeograd\\nNajve\u0107i pad cene kvadrata, od 7,7
  odsto, zabele\u017een je na op\u0161tini Palilula gde je prose\u010dna cena za maj
  iznosila 2.300 evra po kvadratu, \u0161to je za ovu lokaciju najni\u017ea cena od
  po\u010detka godine. Pore\u0111enja radi, na ovoj op\u0161tini prose\u010dna cena
  u februaru iznosila je 2.963 evra po kvadratu.\\nPad cene od 2,27 odsto zabele\u017eio
  je i Novi Beograd \u0161to za rezultat ima prose\u010dnu cenu od 2.707 evra po kvadratu,
  koja je za oko 70 evra manja u odnosu na april mesec.\\nNo, na Mirijevu je cena
  kvadratnog metra u maju iznosila 1.881 evra, \u0161to je rast za 1,62% odsto u odnosu
  na prethodni mesec. U aprilu je pak Mirijevo zabele\u017eilo pad i to za blagih
  0,3 odsto.\\nNa Vo\u017edovcu je prose\u010dna cena iznosila 2.469e/m2, \u0161to
  je blagi rast, od 0,28 odsto.\\nCentar i Vra\u010dar, najatraktivnije gradske lokacije
  u prestonici, u maju su bele\u017eile porast cenepa je prose\u010dna cena kvadratnog
  metra u centru sa rastom od 1,19 odsto iznosila 3.388 evra po kvadratu, dok je Vra\u010dar
  sa blagim rastom od 0,31% imao prose\u010dnu cenu od 3.260 evra. I ove centralne
  op\u0161tine su u aprilu zabele\u017eile pad od oko 2 odsto.\\nNovi Sad\\nU Novom
  Sadu dve lokacije tako\u0111e bele\u017ee pad cene kvadratnog metra. Centar Novog
  Sada u maju je imao blagi pad od 0,04 odsto, osnosno cenu od 2.681 evra po kvadratu.
  Zatim, Podbara sa zabele\u017eenim padom cene za 1,50 odsto, ta\u010dnije sa prose\u010dnom
  cenom od 2.567e/m2.\\nNa ostalim lokacijama zabele\u017een je rast cene. Novo naselje
  bele\u017ei blagi rast cene za 0,56 odsto sa cenom od 2.143e/m2, dok Grbavica sa
  cenom od 2.674 evra po kvadratu bele\u017ei rast od 1,91 odsto.\\nNi\u0161\\nU Ni\u0161u
  je gradska lokacija Pantelej zadr\u017eala isti nivo prose\u010dne cene od 1.547e/m2
  kao i u aprilu.\\nPalilula je nakon dva meseca pada cene u maju bele\u017eila rast
  od 5,26 odsto i dostigla najvi\u0161u cenu kvadratnog metra od po\u010detka godine
  koja je iznosila 1.523e/m2.\\nRast cene imala je i gradska lokacija Durlan i to
  od 1,51 odsto sa cenom od 1.345e/m2.\\nPrema ogla\u0161enoj ponudi najskuplja lokacija
  u Ni\u0161u je Bulevar Nemanji\u0107a koja bez obzira na pojeftinjenje od 2,50 odsto
  bele\u017ei cenu od 1.753e/m2.\\nKragujevac i Pan\u010devo\\nKragujevac je na gradskoj
  lokaciji imao porast cene od 1,38 odsto sa prose\u010dnom cenom od 1.400e/m2. I
  za ovu lokaciju mo\u017eemo da konstatujemo da cena kvadratnog metra raste iz meseca
  u mesec i da je cena od 1.400e/m2 najvi\u0161a cena od po\u010detka godine.\\nPonuda
  na gradskoj lokaciji Pan\u010devo bele\u017ei pad za 0,43 odsto sa prose\u010dnom
  cenom od 1.404e/m2.\\nIzvor: nekretnine.rs\\nFoto: Alex Rodriguez, Unsplash\"",
  "\"Nakon medijskog napada na verenika Egora Tarabasova, Lindsay Lohan se putem Instagrama
  izvinila svim fanovima.\\nLindsay je obavestila obo\u017eavaoce da je dobro i izvinila
  se: \u201cDragi prijatelji. U redu sam i dobro sam. Trenutno mi treba vreme za sebe
  i dobre prijatelje. \u017dao mi je \u0161to sam nedavno otkrila neke privatne stvari.
  Reagovala sam tako iz straha i jer sam bila tu\u017ena.. Svi gre\u0161imo. Na\u017ealost,
  moje gre\u0161ke su uvek bile javne\u201d, napisala je ona i otkrila da je radila
  na preispitivanju same sebe.\\n\u201cMo\u017eda se stvari mogu popraviti\u2026 Mo\u017eda
  ne\u2026 Nadam se da mogu\u201d, dodala je ona i post zavr\u0161ila re\u010dima:
  \u201c\u017divot se radi o ljubavi i svetlosti. Ne ljutnji. Hvala vama koji ste
  uz mene.\u201d\\nPodsetimo, Lohanova je pre nekoliko dana objavila nekoliko postova
  na dru\u0161tvenim mre\u017eama kojima je optu\u017eila verenika Egora za neverstvo
  i aludirala na mogu\u0107u trudno\u0107u.\"", "\"Stipendija koju je pre dve godine
  dobio za master program iz bioin\u017eenjerstva otvorila je mladom Novosa\u0111aninu,
  Stefanu \u0110uki\u0107u, vrata u svet. Ta\u010dnije dvoje njih budu\u0107i da je
  u okviru programa godinu dana proveo u gradi\u0107u na severu Holandije, a narednu,
  gde se i danas nalazi, u Irskoj. Mladost, optimizam i \u017eelja, kako za usavr\u0161avanjem
  tako i za kulturolo\u0161kim \u0161irinama i spoznajama sveta van granica na\u0161e
  zemlje, u\u010dinili su da Stefan sa lako\u0107om prigrli tu priliku, ali i da je
  napornim radom i zalaganjem u potpunosti opravda. Vi\u0161e o njegovom iskustvu
  i zapa\u017eanjima pro\u010ditajte u nastavku intervjua.\\nKada si oti\u0161ao iz
  Srbije i koji je bio razlog tvog odlaska?\\nIz Srbije sam oti\u0161ao u septembru
  2014, pre ta\u010dno dve godine, a razlog mog odlaska je bilo \u0161kolovanje. Odlu\u010dio
  sam da, dok me jo\u0161 uvek ni\u0161ta jako ne vezuje za Srbiju, odem u \u201cbeli
  svet\u201d i da nau\u010dim ne\u0161to \u0161to nisam mogao u Srbiji. \u017deleo
  sam i da upoznam nove ljude, kulturu, jezik\u2026 i povrh svega, da vidim da li
  je zaista \u017eivot bolji na Zapadu.\\n\u010cime se bavi\u0161 i da li zemlja u
  kojoj danas \u017eivi\u0161 pru\u017ea mogu\u0107nost da se razvija\u0161 i ostvari\u0161
  na tom polju?\\nPre svega mesec dana zavr\u0161io sam master studije iz neuroin\u017eenjerstva
  na Triniti koled\u017eu u Dablinu, a potom su me, sedam dana kasije, zaposlili kao
  asistenta istra\u017eiva\u010da na departmanu za neurologiju u okviru istog fakulteta.
  Moja istra\u017eiva\u010dka grupa je fokusirana na ALS-u (Amiotrofi\u010dka lateralna
  skleroza), i moj tim radi na metodama koje \u0107e jednog dana pomo\u0107i u razumevanju,
  dijagnostici i nadam se, prevenciji ove bolesti. \u0160to se ti\u010de usavr\u0161avanja,
  mislim da Irska sasvim dovoljno ula\u017ee u obrazovanje i istra\u017eivanje. Pritom
  direktorka mog departmana, Orla Hardiman, veoma prijatna \u017eena i iskusna profesorka,
  ume da privu\u010de velike fondove i dobre istra\u017eiva\u010de. A fondovi za istra\u017eivanje
  i iskusan tim je ono \u0161to mi je ve\u0107 u prvih par dana omogu\u0107ilo da
  nau\u010dim mnogo toga.\\nKoliko te je ta \u017eivotna avantura promenila i da li
  \u017eali\u0161 \u0161to si oti\u0161ao?\\nSlobodno mogu da ka\u017eem da me je
  odlazak iz Srbije naterao da sazrim br\u017ee, i na vreme. I povrh svega toga da
  drasti\u010dno smanjim period vremena koji mi je neophodan da se priviknem na novu
  sredinu. U po\u010detku sam morao da se naviknem na to da nema mame da mi kuva hranu,
  opere i ispegla ode\u0107u, da nema tate da mi da d\u017eeparac, kao ni starih prijetelja
  da iza\u0111emo u grad za vikend. Me\u0111utim, sve se to dalo nau\u010diti i nadoknaditi.
  Apsolutno ne postoji ni jedan razlog zbog kog bih mogao da za\u017ealim \u0161to
  sam upisao studije van Srbije.\\n\u0160ta ti se najvi\u0161e dopada u novoj sredini?\\nOno
  \u0161to mi se ovde najvi\u0161e dopada je \u010dinjenica da ima mesta za svakoga.
  \u0160ta god da je to \u0161to \u017eeli\u0161 da bude\u0161 i \u010dime god \u017eeli\u0161
  da se bavi\u0161, uz dovoljno truda, ovde mo\u017ee\u0161 da uspe\u0161. Ne postoje
  samo odre\u0111eni \u201cprofili gde ima novca\u201d. Naime, ja sa mojom strukom
  u Srbiji ne bih mogao da radim nigde drugde osim na fakultetu, sa nadom da \u0107u
  jednog dana postati profesor. Me\u0111utim, moja \u017eelja je da u budu\u0107nosti
  radim u nekoj kompaniji. Trenutno u Irskoj radim kao istra\u017eiva\u010d, a potom
  planiram da pre\u0111em u neko preduze\u0107e koje se bravi, na primer, neuromarketingom.\\nKako
  je izgledao proces prilago\u0111avanja i \u0161ta ti je najte\u017ee palo?\\nMislim
  da sam ja imao mnogo sre\u0107e na samom po\u010detku jer sam prvo oti\u0161ao u
  Holandiju, u omanji studentski grad. Prona\u0107i sme\u0161taj u velikim, glavnim
  gradovima je ogroman problem, ma kako se banalno to \u010dinilo ljudima, naro\u010dito
  ako si nov u gradu ili student. U Dablinu, na primer, stanodavci ne vole studente,
  cene stanova su apsurdno visoke, i veoma je te\u0161ko prona\u0107i sobu koja je
  prihvatljivog kvaliteta, lokacije i cene. Prvih mesec dana, nakon \u0161to sam oti\u0161ao
  od ku\u0107e i iz Srbije, najte\u017ee mi je bilo to \u0161to se nekako sve odjednom
  promenilo. Odjednom sam sam morao da raspola\u017eem svojim novcem, sam da kuvam
  za sebe, sam da perem svoj ve\u0161, da pri\u010dam konstantno na engleskom, da
  se privikavam na novi obrazovni sistem i da budem non-stop ekstravertan. Moram da
  napomenem da ustaljeno mi\u0161ljenje i predrasuda o tome kako su ljudi na Zapadu
  hladni, uop\u0161te nije ta\u010dna. Kada si nov u gradu, pogotovo student, vrlo
  lako na\u0111e\u0161 nove drugare koji su isto kao i ti internacionalni studenti,
  u potrazi za prijateljstvima. Lokalci imaju svoje stare drugare pa nisu primorani
  da budu tako otovreni, \u0161to je po mom mi\u0161ljenu savim razumljivo. Ali vremenom
  se i to promeni. Ja sam u poslednje dve godine stekao nekoliko dobrih drugara lokalaca
  u obe dr\u017eave.\\nKako izgleda jedan tvoj dan i kako provodi\u0161 slobodno vreme?\\nDo
  pre mesec dana manje-vi\u0161e po ceo dan provodio sam rade\u0107i na master radu.
  Od kada sam pak dobio posao, dan mi po\u010dinje oko 8 ujutru kako bih stigao do
  9 na svoje radno mesto. Tamo sam do 17h, potom odlazim u teretanu, a zatim ku\u0107i
  da ve\u010deram i spremim hranu za sutra. Ako nisam jako umoran uvek poku\u0161am
  da se na\u0111em sa dru\u0161tvom, bar na kratko. Iako ve\u0107 ovo deluje kao da
  sam poprili\u010dno zauzet, ovih dana sam po\u010deo da uvodim i veslanje u svoj
  raspored. U svakom slu\u010daju, vikendom me definitivno ne\u0107ete na\u0107i ku\u0107i
  \u2013 ili sam na izletu ili u izlasku sa ekipom.\\nKoliko je tamo\u0161nji \u017eivot
  druga\u010diji od onog koji mi ovde poznajemo?\\nImam utisak da su ljudi sre\u0107niji
  i zadovoljniji. Ne mogu da ka\u017eem da je ovde med i mleko, ali ljudi nemaju iste
  probleme koje na\u0161 narod ima \u2013 imati novca i prilike da radi\u0161, ili
  se usavr\u0161ava\u0161 u onome \u0161to voli\u0161 i bude\u0161 svoj je ovde mogu\u0107e.
  Nije uvek lako i ne uspe iz prve, ali je uz trud realizacija tih \u017eelja i snova
  izvesna. Sa druge strane, to za sobom, kao posledicu, povla\u010di \u010dinjenicu
  da su ljudi jako zauzeti. Vikend je uglavnom jedini deo sedmice kada mogu da posvetim
  vi\u0161e pa\u017enje ljudima. Mislim da je sasvim razumno da se jedino radom mo\u017ee
  do\u0107i do novca, ali nekad imam ose\u0107aj da nama jo\u0161 uvek ne prija taj
  tempo.\\nKoliko \u010desto te hvata nostalgija i kako se bori\u0161 sa njom?\\nU
  principu, nostalgija me i ne hvata ne\u0161to \u010desto. Ako se i desi, uglavnom
  je re\u010d o situacijama kada mi se de\u0161ava ne\u0161to lepo u \u017eivotu,
  a porodica i prijatelji nisu tu da u tome zajedno u\u017eivamo. Sre\u0107om, to
  se donekle nadoknadi modernom tehnologijom. Zaista mi se nikada nije desilo da sam
  pomislio da odustanem i da kupim kartu u jednom pravcu za Srbiju. Mislim da sam
  se savim lepo sna\u0161ao ovde, te da stoga nemam problema sa nostalgijom.\\n\u0160ta
  ti najvi\u0161e nedostaje iz Novog Sada i koliko mu se \u010desto vra\u0107a\u0161?\\nVrela
  leta i Egzit. Definitivno. Na\u017ealost obaveze mi nisu dozvoljavale da mu se \u010desto
  vratim, tako da je Novi Sad svaki put morao da \u010deka po godinu dana da bi me
  opet video. Ove godine dolazim u oktobru. I jedva \u010dekam. A usput, u procesu
  planiranja je i poseta za vreme slede\u0107eg Egzita.\\nDa li planira\u0161 da se
  vrati\u0161 u Srbiju ili misli\u0161 da te definitivno \u010deka \u017eivot negde
  van granica zemlje u kojoj si ro\u0111en?\\nMislim da su veoma male \u0161anse da
  se vratim u Srbiju. Kada god po\u010dnem da stavljam pluseve i minuseve, definitvno
  plusevi preovladaju. Radim ono \u0161to volim i imam dovoljno prihoda da mogu da
  nadoknadim ono \u0161to mi nedostaje \u2013 da posetim porodicu i prijatelje u Srbiji.
  Iako sam trenutno u Irskoj i ne postoje razlozi zbog kog bih \u017eeleo da je uskoro
  napustim, mislim da me definitvno \u017eivot ipak \u010deka negde u blizini Amsterdama.\\nAutor:
  Marija Milo\u0161evi\u0107\\nFoto: Privatna arhiva\\nBravo Stefi, super intervju!
  \ud83d\ude42\"", "\"Voditeljka Jovana Jeremi\u0107 u\u017eiva u luksuznoj vili u
  Grockoj koju je dobila od svog de\u010dka biznismena Dragana Stankovi\u0107a.\\nOvog
  puta Jovana je pokazala kako trenira pokraj bazena, a od ve\u017ebi je radila sklekove,
  trbu\u0161njake, \u0161pagu i za kraj istezanje.\\nKraljica \u0161era je u opisu
  snimka kratko napisala:\\n\u2013 Moje telo je hram gde obitava moja du\u0161a. Ja
  je ljubomorno \u010duvam i zato moje telo mora biti moj pancir. Svakog dana se trudim
  da pobedim sebe, makar za 5 minuta ili 100 godina vi\u0161e. Takva sam. Volim da
  napredujem jer ako ne napreduje\u0161, stagnira\u0161 \u2013 stoji u opisu Jovaninog
  treninga.\\n\u201eKoja snaga duha! Bravo!\u201c, \u201eSamo trening kraljice\u201c,
  \u201eJa razumem da je ne volite, ali da imate ne\u0161to protiv ovoga nemam komentar
  , ljudi moji za ovo treba imati snage\u201c. \u201eSamo red, rad i disciplina, svaka
  \u010dast\u201c\u2026 neki su od komentara fanova ispod objave.\\nTekst: Svet Dijaspore\"",
  "\"Cela Srbija je uz Novaka \u0110okovi\u0107a, najbolji teniser sveta ima podr\u0161ku
  od predsednika Aleksandra Vu\u010di\u0107a\\nGlavni i odgovorni urednik dnevnog
  lista Informer Dragan J. Vu\u010di\u0107evi\u0107 otkrio je da se predsednik Srbije
  Aleksandar Vu\u010di\u0107 i jutros \u010duo sa najboljim svetskim teniserom Novakom
  \u0110okovi\u0107em.\\nVu\u010di\u0107 je i sino\u0107 razgovarao telefonom sa Novakom
  \u0110okovi\u0107em. Predsednik je uspeo da dobije \u0110okovi\u0107a i da mu li\u010dno
  prenese \u0161ta je sve dr\u017eava Srbija uradila da bi on bio hitno oslobo\u0111en.\\nNovak
  \u0107e kako sada stvari stoje ostati do ponedeljak u Australiji, a njegov tim advokata
  ulo\u017eio je \u017ealbu i ostaje da se vidi da li \u0107e uspti da urade ne\u0161to
  i okrenu stvari u Noletov korist.\\nIzvor:Alo/M.R.\"", "\"Ah, ta ljubav...\\nIstinita
  pri\u010da: \\\"Posle dva razvoda znam \u0160TA UNI\u0160TAVA BRAK\\\"\\n\\\"Danas
  sam se razveo. Ponovo. Proces je bio iznena\u0111uju\u0107e jednostavan. U maloj
  kancelariji sudija i ja, a moja biv\u0161a, koja \u017eivi u inostranstvu, bila
  je na Zoom-u. Sudija nam je oboma postavio nekoliko pitanja. Potpisao sam papir
  i ''bum!'' \u2013 brak od 15 godina razveden je za samo 20 minuta!\\\"\\nOvako je
  zapo\u010deo svoju pri\u010du na TikTok-u jedan sve\u017ee razvedeni mu\u0161karac
  koji je potom objasnio da je to njegov drugi razvod, a da je bio brz i jednostavan
  jer u tom braku nije bilo dece, niti zajedni\u010dke imovine.\\n\\\"Oboje smo mislili
  da \u0107e na\u0161a ljubav trajati. U\u017eivali smo zajedno u mnogo sre\u0107nih
  godina, izgra\u0111uju\u0107i potkrepljuju\u0107e dokaze koji su ukazivali na zauvek.
  A onda smo po\u010deli da se rastajemo... Verbalno, kao i nekim gestovima, povre\u0111ivali
  smo jedan drugoga... I to za mene nije bilo prvo takvo iskustvo\u201c, pri\u010da
  sve\u017ee razvedeni mu\u0161karac i dalje obja\u0161njava da se prvi put ven\u010dao
  kada je imao samo 19 godina.\\n\\\"Sada u svojim kasnim tridesetim, tek nakon svog
  drugog razvoda, za koji nisam o\u010dekivao da \u0107e se desiti, imam mnogo toga
  da podelim sa drugima o tome \u0161ta \u010dini brak naprednim, a \u0161ta ga ubija.\u201c\\nNEKOMPATIBILNOST\\n\\\"Oba
  moja razvoda su bila na osnovu nekompatibilnosti, \u0161to se \u010desto koristi
  naizmeni\u010dno sa \u2019nepomirljivim razlikama\u2019. To zna\u010di da je veza
  nepopravljivo prekinuta. Ili, u najmanju ruku, da nijedna strana u braku ne \u017eeli
  da to popravi.\u201c\\nOn obja\u0161njava da se nekompatibilnost o\u010ditava u
  razli\u010ditim stvarima, a najvi\u0161e u planovima za zajedni\u010dku budu\u0107nost,
  za vaspitanje dece, raspodelu prihoda...\\n\\\"To je bio slu\u010daj u mom prvom
  braku. Znao sam da \u0107emo se suo\u010diti sa velikim delom izazova sa na\u0161im
  nekompatibilnostima, ali sam mislio (pogre\u0161no) da bismo mogli da ih prevazi\u0111emo.\u201c\\nKada
  ste dovoljno dugo sa nekim, oboje rastete i menjate se. Razvijate nova interesovanja.
  Postajete stariji i mudriji. Sve te stvari - usponi i padovi, stres na poslu, traume,
  pa \u010dak i dobre stvari - mogu promeniti osobu. Ili \u0107e mo\u017eda jedan
  partner rasti i menjati se dok drugi ostaje potpuno isti. A onda to postaje problem.\\nBez
  obzira na to da li ste znali za nekompatibilnosti pre braka, ili ako se suo\u010davate
  sa velikim razlikama koje nikada niste videli - mnogi parovi se u nekom trenutku
  na\u0111u na ra\u010dvanju puta: ostati zajedno ili ne?\\nMo\u017eete li zajedno
  da se bavite nekompatibilnostima \u2013 osnovno je pitanje.\\nMo\u017eda ostanete
  u braku, sre\u0107no re\u0161avaju\u0107i svoje nesuglasice i le\u010de\u0107i rane
  koje su rezultat va\u0161ih nekompatibilnosti. Ili je mo\u017eda razvod najbolje
  re\u0161enje za oboje.\\n\\\"Razvod ne razbija uvek va\u0161u porodicu. U mom slu\u010daju,
  na primer, razvod je pomogao da svi budemo sre\u0107niji\u201c, ka\u017ee tiktoker.\\nKOMPROMISI
  I KOMUNIKACIJA\\nU redu je praviti kompromise, ali samo ako i dalje ostajete sre\u0107ni,
  savetuju stru\u010dnjaci za veze.\\n\\\"Kada sam po\u010deo da da se menjam, moj
  partner nije. Diplomirao sam, na\u0161ao bolji posao, dok moja supruga u tim segmentima
  ni\u0161ta nije promenila i bila je veoma nezadovoljna. Po\u010deo sam da prime\u0107ujem
  kako ona kri\u0161om gleda rijaliti programe, veruje u teorije zavere. Hteo sam
  da razgovaramo o tome ali je ona ti izbegavala\u201c, iskren je \u201esamac\u201c.\\nPsiholozi
  ka\u017eu da je brak ili veza en mogu da uspeju ako par nije spreman na komunikaciju
  i kompromise.\\nLjubav nije dovoljna, neophodnno je po\u0161tovanje i to obostrano.\\n\\\"Mislim
  da je naj\u010de\u0161\u0107a stvar koja se de\u0161ava da ljudi misle da mogu da
  naprave kompromis, a onda na kraju postanu veoma nesre\u0107ni \u0161to su to uradili.
  Njihove namere su dobre. Oni istinski veruju da \u0107e to mo\u0107i da promene
  kod sebe ali nekompatibilnosti se ne mogu uvek ispraviti.\\nRazumevanje da nijedna
  veza nije besmrtna zna\u010di razumeti da se morate pravilno brinuti o njoj i negovati
  je. Morate biti fleksibilni i raditi zajedno ako \u017eelite da ostanete u sre\u0107nom,
  zdravom braku. \u010cak i kada ostanemo u braku ili u porodi\u010dnom partnerstvu,
  mi smo i dalje pojedinci. Imamo individualne potrebe, \u017eelje i na\u010dine da
  prevazi\u0111emo izazove.\u201c\"", "\"\u0160ta zna\u010di stremiti ka istini (1)\\nTema
  dana\u0161njeg razgovora u zajedni\u0161tvu svima je dobro poznata. Ona je usko
  povezana s \u010dovekovom verom u Boga i \u010dovekovim te\u017enjama, i to je tema
  s kojom se ljudi svakodnevno susre\u0107u i o kojoj slu\u0161aju. O \u010demu se,
  dakle, radi? Tema je \u0161ta zna\u010di stremiti ka istini. Kakvo je va\u0161e
  mi\u0161ljenje o ovoj temi? Da li je ona za vas u dovoljnoj meri nova? Je li vam
  ubedljiva? Bez obzira na to u kolikoj vam je meri ova tema ubedljiva, znam da je
  za svakog od vas bitna; ona je bitna za spasenje ljudi, za njihov ulazak u stvarnost
  Bo\u017ejih re\u010di i promenu njihove naravi, kao i za njihov budu\u0107i ishod
  i odredi\u0161te. Ve\u0107ina vas je sada spremna da stremi ka istini i po\u010deli
  ste da se budite, ali jo\u0161 uvek niste sigurni \u0161ta zna\u010di stremiti ka
  istini, niti kako ka istini treba stremiti. Stoga je neophodno da dana\u0161nji
  razgovor posvetimo upravo ovoj temi. Stremljenje ka istini je tema s kojom se ljudi
  \u010desto susre\u0107u u svom svakodnevnom \u017eivotu; radi se o prakti\u010dnom
  problemu s kojim se ljudi suo\u010davaju kada ih ne\u0161to zadesi u svakodnevnom
  \u017eivotu, dok obavljaju svoje du\u017enosti i tome sli\u010dno. Kad im se ne\u0161to
  desi, ljudi se u ve\u0107ini slu\u010dajeva naprosto samoinicijativno trude da \u010ditaju
  Bo\u017eje re\u010di i paze na to da im misli ne postanu negativne, nadaju\u0107i
  se da \u0107e na taj na\u010din prestati da uranjaju u negativnost i pogre\u0161no
  razumevanje Boga, te da \u0107e biti u stanju da se pot\u010dine Njegovom delu.
  Oni koji su boljeg kova sposobni su da pozitivno i proaktivno tragaju za svim aspektima
  istine u Bo\u017ejim re\u010dima; oni tragaju za na\u010delima, Bo\u017ejim zahtevima
  i putevima prakti\u010dnog delovanja. Ili su, pak, u stanju da analiziraju sebe,
  da kontempliraju i sti\u010du znanja kroz ono \u0161to im se de\u0161ava, te da
  na taj na\u010din razumeju istina-na\u010dela i zakora\u010de u istina-stvarnost.
  To, me\u0111utim, za ve\u0107inu ljudi i dalje predstavlja veliku prepreku i neizvesno
  je da li \u0107e oni to mo\u0107i da postignu. Ve\u0107ina ljudi jo\u0161 uvek nije
  zakora\u010dila u taj aspekt stvarnosti. Vama, dakle, \u010dak i ako budete imali
  vremena da o tome kontemplirate, ne\u0107e biti lako da do\u0111ete do prakti\u010dnog,
  objektivnog i istinskog razumevanja ove obi\u010dne, svakodnevne i konkretne teme.
  Vra\u0107aju\u0107i se na na\u0161u glavnu temu, hajde da malo u zajedni\u0161tvu
  popri\u010damo o tome \u0161ta zna\u010di stremiti ka istini. Mada niste ve\u0161ti
  u kontemplaciji, nadam se da umete dobro da slu\u0161ate \u2013 ne samo u\u0161ima,
  ve\u0107 i srcem. Nadam se da \u0107e\u0161 svoje srce ulo\u017eiti u shvatanje
  i razumevanje ovoga, te da \u0107e\u0161 sve \u0161to si u stanju da shvati\u0161
  i sve \u0161to odgovara tvom stanju, tvojoj naravi i svakom aspektu situacije u
  kojoj se nalazi\u0161, primiti k srcu kao ne\u0161to va\u017eno. Ujedno se nadam
  i da \u0107e\u0161, nakon toga, po\u010deti da popravlja\u0161 svoju iskvarenu narav
  i nastojati da sva na\u010dela prakti\u010dnog delovanja primi\u0161 k srcu kako
  bi, kad iskrsnu sli\u010dni problemi, imao put koji \u0107e\u0161 slediti i bio
  u stanju da Bo\u017eje re\u010di tretira\u0161 kao put prakti\u010dnog delovanja,
  te da \u0107e\u0161 ih, kao takve, sprovoditi u delo i povinovati im se. To bi bilo
  najbolje.\\n\u0160ta zna\u010di stremiti ka istini? Ovo mo\u017ee biti konceptualno
  pitanje, ali je ono ujedno i najprakti\u010dnije pitanje u vezi sa verom u Boga.
  To da li su ljudi u stanju da streme ka istini ili ne, direktno je povezano sa njihovim
  sklonostima, njihovim kovom i njihovim stremljenjem. Stremljenje ka istini obuhvata
  mnoge prakti\u010dne elemente. Trebalo bi da u zajedni\u0161tvu o svakom od njih
  pojedina\u010dno razgovaramo, kako biste \u0161to pre mogli da razumete istinu i
  da saznate \u0161ta ta\u010dno zna\u010di stremiti ka njoj i koja se pitanja odnose
  na to stremljenje. Na taj na\u010din \u0107ete na kraju mo\u0107i da razumete \u0161ta
  zna\u010di stremiti ka istini. Hajde da najpre popri\u010damo o slede\u0107em: da
  li vi ka istini stremite slu\u0161aju\u0107i ovu propoved? (Ne ba\u0161.) Slu\u0161anje
  propovedi je samo preduslov i pripremna radnja za stremljenje ka istini. Koje elemente
  obuhvata stremljenje ka istini? Mnogo je tema koje se doti\u010du stremljenja ka
  istini, a i kod ljudi se prirodno javljaju mnogi problemi o kojima ovde treba da
  razgovaramo. Primera radi, ima ljudi koji ka\u017eu: \u201eAko neko svakog dana
  jede i pije Bo\u017eje re\u010di i u zajedni\u0161tvu razgovara o istini, ako je
  u stanju da normalno obavlja svoju du\u017enost, ako radi sve \u0161ta mu crkva
  odredi i nikada ne pravi nikakve smetnje ni poreme\u0107aje \u2013 a \u010dak i
  ako ponekad mo\u017eda i prekr\u0161i istina-na\u010dela, to ne \u010dini svesno
  niti namerno \u2013 zar to onda ne pokazuje da takva osoba stremi ka istini?\u201c
  To je dobro pitanje. Mnogi ljudi upravo tako razmi\u0161ljaju. Pre svega, morate
  shvatiti da li neko mo\u017ee da dostigne razumevanje istine i da stekne istinu
  tako \u0161to \u0107e dosledno postupati na ovaj na\u010din. Podelite s nama svoja
  razmi\u0161ljanja o tome. (Mada je ispravno postupati na ovaj na\u010din, \u010dini
  se da je to vi\u0161e u skladu s verskim obredom \u2013 tu se po\u0161tuju pravila.
  To ne mo\u017ee dovesti do razumevanja, niti do zadobijanja istine.) O kakvim se
  pona\u0161anjima ovde zapravo radi? (Radi se o pona\u0161anjima koja su samo povr\u0161no
  dobra.) Dopada Mi se taj odgovor. To su samo dobra pona\u0161anja koja se kod neke
  osobe ra\u0111aju nakon \u0161to ona poveruje u Boga, na temelju savesti i razuma
  te osobe, kao posledica uticaja raznih dobrih i pozitivnih u\u010denja. Ali to su
  ipak samo dobra pona\u0161anja i ni\u0161ta vi\u0161e, i daleko su od stremljenja
  ka istini. \u0160ta je, onda, koren tih dobrih pona\u0161anja? \u0160ta ih izaziva?
  Ona proizlaze iz \u010dovekove savesti i razuma, iz njegove moralnosti, njegovih
  pozitivnih ose\u0107anja prema veri u Boga i njegove suzdr\u017eanosti. Po\u0161to
  se radi o dobrim pona\u0161anjima, ona nemaju veze sa istinom i zasigurno nisu ista
  stvar. Dobro pona\u0161anje nije isto \u0161to i praktikovanje istine, a ako se
  neka osoba pona\u0161a dobro, to ne zna\u010di da ona ima odobrenje od Boga. Dobro
  pona\u0161anje i praktikovanje istine dve su razli\u010dite stvari \u2013 one nemaju
  nikakvog uticaja jedna na drugu. Praktikovanje istine je Bo\u017eji zahtev i potpuno
  je u skladu s Njegovim namerama; dobro pona\u0161anje ra\u0111a se iz \u010dovekove
  volje i nosi sa sobom \u010dovekove namere i motive \u2013 to je ne\u0161to \u0161to
  \u010dovek smatra dobrim. Iako dobra pona\u0161anja nisu zlodela, ona su u suprotnosti
  sa istina-na\u010delima i nemaju nikakve veze sa istinom. Ma koliko da su ta pona\u0161anja
  dobra i ma koliko da su ona u skladu s ljudskim predstavama i zamislima, ona nemaju
  veze sa istinom. Prema tome, nijedno dobro pona\u0161anje ne mo\u017ee dobiti odobrenje
  od Boga. Po\u0161to je dobro pona\u0161anje na ovaj na\u010din definisano, jasno
  je da se ono ne odnosi na praktikovanje istine. Ako bismo ljude razvrstali na tipove
  prema njihovom pona\u0161anju, njihova bi dobra pona\u0161anja, u najboljem slu\u010daju,
  predstavljala dela lojalnih slu\u017ebenika i ni\u0161ta vi\u0161e. Ona nemaju nikakve
  veze s praktikovanjem istine, niti sa istinskim pot\u010dinjavanjem Bogu. Ona naprosto
  predstavljaju vrstu pona\u0161anja i potpuno su nebitna sa aspekta promene ljudske
  naravi, njihovog pot\u010dinjavanja istini i njenog prihvatanja, sa aspekta straha
  od Boga i izbegavanje zla, kao i sa aspekta bilo kog drugog prakti\u010dnog elementa
  koji se zaista ti\u010de istine. Za\u0161to ih onda uop\u0161te nazivamo dobrim
  pona\u0161anjima? Evo obja\u0161njenja, koje ujedno predstavlja i obja\u0161njenje
  su\u0161tine ovog pitanja. Ono glasi da ova pona\u0161anja proizlaze jedino iz ljudskih
  predstava, iz njihovih sklonosti, njihove volje i samoinicijativnog truda. Ona nisu
  manifestacije kajanja koje se javlja sa sticanjem istinske samospoznaje prihvatanjem
  istine, suda i grdnje od Bo\u017ejih re\u010di, niti su to pona\u0161anja ili postupci
  sprovo\u0111enja istine u delo, koji se javljaju onda kad ljudi poku\u0161avaju
  da se pot\u010dine Bogu. Razumete li to? To zna\u010di da ta dobra pona\u0161anja
  ni na koji na\u010din ne podrazumevaju promenu ne\u010dije naravi, niti ona proizlaze
  iz podvrgavanja sudu i grdnji od Bo\u017ejih re\u010di, kao ni iz istinskog kajanja
  usled spoznaje vlastite iskvarene naravi. Ona se svakako ne odnose na \u010dovekovo
  istinsko pot\u010dinjavanje Bogu i istini, a jo\u0161 manje na to da u svom srcu
  gaji strah i ljubav prema Bogu. Dobra pona\u0161anja nemaju s tim nikakve veze;
  ona su naprosto ne\u0161to \u0161to dolazi od \u010doveka i ne\u0161to \u0161to
  \u010dovek smatra dobrim. Pa ipak, ta dobra pona\u0161anja mnogi ljudi vide kao
  znak da neko praktikuje istinu. To je stra\u0161na gre\u0161ka i predstavlja apsurdan
  stav i razumevanje. Ta dobra pona\u0161anja nisu ni\u0161ta drugo do obavljanje
  verskog obreda i mahinalna radnja. Ona nemaju nikakve veze sa sprovo\u0111enjem
  istine u delo. Iako ih Bog mo\u017eda ne osu\u0111uje direktno, On ih apsolutno
  ne odobrava; to je izvesno. Treba da znate da ovi spolja\u0161nji postupci koji
  su u skladu s ljudskim predstavama i ova dobra pona\u0161anja nisu praktikovanje
  istine, niti su manifestacija stremljenja ka istini. Nakon \u0161to ste odslu\u0161ali
  sve \u0161to je re\u010deno tokom dana\u0161njeg razgovora, stekli ste tek ne\u0161to
  malo konceptualnog znanja o tome \u0161ta zna\u010di stremiti ka istini, odnosno,
  stekli ste po\u010detno razumevanje jednostavnog koncepta stremljenja ka istini.
  Ako \u017eelite da uistinu razumete \u0161ta zna\u010di stremiti ka istini, moramo
  u zajedni\u0161tvu pri\u010dati o jo\u0161 nekim stvarima.\\nDa bi stremio ka istini,
  \u010dovek je mora razumeti; samo kroz razumevanje istine, \u010dovek je mo\u017ee
  sprovoditi u delo. Da li su dobra pona\u0161anja ljudi povezana s praktikovanjem
  istine? Da li se dobra pona\u0161anja ra\u0111aju iz stremljenja ka istini? Koje
  manifestacije i radnje spadaju u praktikovanje istine? Koje manifestacije poseduju
  ljudi koji streme ka istini? Morate razumeti ova pitanja. Da bismo u zajedni\u0161tvu
  razgovarali o stremljenju ka istini, najpre moramo govoriti o pote\u0161ko\u0107ama
  i pogre\u0161nim stavovima ljudi prema njoj. Neophodno je na samom po\u010detku
  razre\u0161iti ove probleme. Ima ljudi \u010dije je razumevanje \u010disto i koji
  imaju relativno jasan stav o tome \u0161ta je istina. Oni poseduju put kojim \u0107e
  stremiti ka istini. Ima, me\u0111utim, i onih koji ne razumeju \u0161ta je istina
  i koji, mada ih to zanima, ne znaju kako da je sprovode u delo. Oni misle da je
  \u010diniti dobre stvari i dobro se pona\u0161ati isto \u0161to i sprovoditi istinu
  u delo \u2013 da praktikovati istinu zna\u010di \u010diniti dobre stvari. Tek kad
  pro\u010ditaju mnoge Bo\u017eje re\u010di, oni shvataju da se \u010dinjenje dobrih
  stvari i dobro pona\u0161anje potpuno razlikuje od praktikovanja istine. Vidite
  koliko su ljudske predstave i ma\u0161tarije apsurdne \u2013 oni koji ne razumeju
  istinu ni\u0161ta ne mogu da vide jasno! Mnogi godinama obavljaju svoju du\u017enost,
  svakodnevno su zauzeti i prevladali su mnogobrojne nevolje, te stoga sebe smatraju
  ljudima koji praktikuju istinu i koji poseduju istina-stvarnost. Oni, me\u0111utim,
  ne mogu da ponude nikakvo iskustveno svedo\u010denje. O kakvom se problemu ovde
  radi? Za\u0161to oni, ako ve\u0107 razumeju istinu, ne mogu da govore o svojim stvarnim
  iskustvima? Zar u tome nema izvesne protivre\u010dnosti? Neki \u0107e re\u0107i:
  \u201eRanije, dok sam obavljao svoju du\u017enost, nisam stremio ka istini, niti
  sam u svojim molitvama pa\u017eljivo \u010ditao Bo\u017eje re\u010di. Mnogo sam
  vremena protra\u0107io. Bio sam toliko zaokupljen svojim poslom, misle\u0107i da
  je revnosno obavljanje vlastite du\u017enosti isto \u0161to i praktikovanje istine
  i pokoravanje Bo\u017ejem delu \u2013 a zapravo sam samo gubio vreme.\u201c \u0160ta
  se pod ovim podrazumeva? Podrazumeva se da su ti ljudi odlagali stremljenje ka istini
  zato \u0161to su bili prezauzeti obavljanjem svojih du\u017enosti. Da li je zaista
  tako? Neki apsurdni ljudi veruju da, dokle god su zaokupljeni svojim du\u017enostima,
  njihova iskvarena narav ne\u0107e imati kad da se poka\u017ee, da oni ne\u0107e
  vi\u0161e pokazivati svoju iskvarenu narav, niti \u0107e \u017eiveti u stanju iskvarenosti,
  te da stoga ne moraju da jedu i piju Bo\u017eje re\u010di kako bi popravili tu svoju
  iskvarenu narav. Da li je ovakvo mi\u0161ljenje ispravno? Je li zaista ta\u010dno
  da ljudi ne otkrivaju svoju iskvarenu narav dok marljivo obavljaju svoje du\u017enosti?
  To je apsurdna ideja i besramna la\u017e. Oni ka\u017eu da nemaju vremena da streme
  ka istini jer su zauzeti svojim obavezama. To je \u010dista zabluda i oni zauzetost
  koriste kao izgovor. Mnogo smo puta razgovarali o istinama u vezi sa ulaskom u \u017eivot
  i sa obavljanjem du\u017enosti: samo ako tragaju za istinom radi re\u0161avanja
  problema dok obavljaju svoju du\u017enost, ljudi mogu ostvariti \u017eivotni rast.
  Prema tome, ako tokom obavljanja svoje du\u017enosti \u010dovek isklju\u010divo
  nastoji da bude \u0161to vi\u0161e zauzet, a pritom ne traga za istinom radi re\u0161avanja
  problema, on istinu nikada ne\u0107e razumeti. Neki ljudi koji ne vole istinu zadovoljavaju
  se samo slu\u017ebovanjem i nadaju se da \u0107e zauzvrat dobiti blagoslove carstva
  nebeskog. Na kraju se izgovaraju time da su toliko zauzeti obavljanjem svoje du\u017enosti
  da nemaju vremena da streme ka istini; \u010dak ka\u017eu da su time toliko zauzeti
  da ne otkrivaju svoju iskvarenu narav. Time \u017eele da ka\u017eu kako je, zbog
  toga \u0161to su zauzeti svojom du\u017eno\u0161\u0107u, njihova iskvarena narav
  nestala, da vi\u0161e ne postoji. To je la\u017e, zar ne? Da li je njihova tvrdnja
  u skladu sa \u010dinjenicama? Nimalo \u2013 to bi se \u010dak moglo nazvati najve\u0107om
  od svih la\u017ei. Kako bi to moglo da se iskvarena narav vi\u0161e ne otkriva zato
  \u0161to je osoba zauzeta svojom du\u017eno\u0161\u0107u? Postoje li takvi ljudi?
  Postoji li takvo iskustveno svedo\u010danstvo? Sigurno ne. Sotona je ljude duboko
  iskvario; svi oni imaju sotonsku prirodu i svi \u017eive u sotonskoj naravi. Ima
  li u \u010doveku i\u010deg pozitivnog, i\u010dega osim iskvarenosti? Postoji li
  iko ko je ro\u0111en bez iskvarene naravi? Ima li ikoga ko je od ro\u0111enja sposoban
  da odano vr\u0161i svoju du\u017enost? Ima li ikoga ko je od ro\u0111enja sposoban
  da se pokori Bogu i da Ga voli? Naravno da nema. Po\u0161to svi ljudi imaju sotonsku
  prirodu i ispunjeni su iskvarenom naravi, ukoliko nisu u stanju da razumeju i praktikuju
  istinu, oni mogu da \u017eive jedino u skladu sa svojom iskvarenom naravi. Prema
  tome, apsurdno je i pogre\u0161no re\u0107i da neka osoba ne\u0107e razotkriti svoju
  iskvarenu narav ukoliko je zauzeta obavljanjem svoje du\u017enosti. To je drska
  la\u017e, \u010diji je cilj obmanjivanje ljudi. Bilo da su zauzeti obavljanjem svoje
  du\u017enosti ili ne, bilo da imaju vremena da \u010ditaju Bo\u017eje re\u010di
  ili ne, ljudi koji ne vole istinu na\u0107i \u0107e razloge i izgovore da ne streme
  ka njoj. Ti su ljudi, prostim jezikom re\u010deno, slu\u017ebenici. Ako neki slu\u017ebenik
  ne jede i ne pije Bo\u017eje re\u010di i ako ne prihvata istinu, ho\u0107e li mo\u0107i
  dobro da slu\u017ebuje? Sigurno da ne\u0107e. Svi oni koji ne prihvataju istinu
  li\u0161eni su savesti i razuma, to su ljudi koji bi \u017eiveli u skladu sa svojom
  iskvarenom naravi i \u010dinili brojna zlodela. Oni ni u kom slu\u010daju ne mogu
  biti odani slu\u017ebenici i u njima nema ni\u010deg velikog, uprkos tome \u0161to
  slu\u017ebuju. U to mo\u017eete biti sasvim sigurni.\\nNeki su ljudi previ\u0161e
  zapetljani u porodi\u010dne veze i \u010desto su obuzeti strepnjom. Kad vide mla\u0111u
  bra\u0107u i sestre koji su se odrekli porodice i karijere da bi sledili Boga i
  obavljali svoje du\u017enosti, oni sa zavi\u0161\u0107u ka\u017eu: \u201eBog je
  bio milostiv prema ovim mladim ljudima. Po\u010deli su da veruju u Njega dok su
  jo\u0161 bili mladi, pre no \u0161to su se ven\u010dali i dobili decu; oni nisu
  vezani porodicom, niti moraju da brinu kako \u0107e se sna\u0107i u \u017eivotu.
  Nemaju nikakvih briga koje bi ih spre\u010davale da slede Boga i da vr\u0161e svoju
  du\u017enost. Do\u0161li su ba\u0161 na vreme da bi prisustvovali Bo\u017ejem delu
  i Njegovom \u0161irenju jevan\u0111elja u poslednjim danima \u2013 Bog im je obezbedio
  tako povoljne okolnosti. Du\u0161om i telom mogu da se posvete obavljanju svojih
  du\u017enosti. Oni mogu da streme ka istini, ali za mene to ne va\u017ei. Za mene
  Bog nije uredio pogodno okru\u017eenje \u2013 previ\u0161e sam vezan za porodicu
  i moram da je izdr\u017eavam. Tu le\u017ee moji pravi problemi. Zbog toga ja nemam
  vremena da stremim ka istini. Stremljenje ka istini je za ljude koji svoju du\u017enost
  obavljaju puno radno vreme i koji ni\u010dim nisu vezani. Optere\u0107en sam porodi\u010dnim
  problemima, a srce mi je ispunjeno bezna\u010dajnim sitnicama svakodnevnog snala\u017eenja,
  tako da mi ne preostaje ni snage ni vremena da jedem i pijem Bo\u017eje re\u010di,
  niti da obavljam svoju du\u017enost. Sa ma koje strane da razmotrite okolnosti u
  kojima \u017eivim, ne postoji na\u010din da stremim ka istini. Ne mo\u017eete me
  kriviti zbog toga. Naprosto mi nije su\u0111eno da stremim ka istini, a okolnosti
  mi ne dozvoljavaju da obavljam svoju du\u017enost. Sve \u0161to mogu da uradim jeste
  da sa\u010dekam da se moji porodi\u010dni problemi razre\u0161e, da mi se deca osamostale
  i da se ja penzioni\u0161em i re\u0161im svojih materijalnih briga \u2013 onda \u0107u
  stremiti ka istini.\u201c Ovakvi ljudi imaju pote\u0161ko\u0107a u svakodnevnom
  \u017eivotu i povremeno ose\u0107aju kako im se vlastita iskvarena narav izliva
  kroz bezna\u010dajne stvari u svakodnevnom \u017eivotu. Oni to mogu da osete, ali,
  budu\u0107i da su uhva\u0107eni u zamku sekularnog sveta, misle da im sasvim dobro
  ide, jer \u017eive, veruju u Boga, slu\u0161aju propovedi i udoban im je takav na\u010din
  \u017eivota. Veruju da stremljenje ka istini mo\u017ee da sa\u010deka i da ne\u0107e
  biti prekasno ni ako se svoje iskvarene naravi re\u0161e kroz par godina. Na taj
  na\u010din, oni stalno iznova odla\u017eu va\u017enu stvar stremljenja ka istini.
  \u0160ta oni uvek govore? \u201eNikad nije kasno za stremljenje ka istini. Po\u010de\u0107u
  s tim za par godina. Sve dok Bo\u017eje delo ne bude okon\u010dano, jo\u0161 uvek
  ima vremena \u2013 jo\u0161 uvek imam \u0161ansu.\u201c \u0160ta mislite o ovakvom
  stavu? (Pogre\u0161an je.) Da li su oni na sebe preuzeli breme stremljenja ka istini?
  (Nisu.) Pa, kakvo su onda breme preuzeli na sebe? Nije li to breme pre\u017eivljavanja,
  staranja o svojoj porodici, odgajanja dece? Svu svoju energiju posve\u0107uju deci,
  porodici, vlastitim \u017eivotima i svakodnevici, a sa stremljenjem ka istini planiraju
  da zapo\u010dnu tek kad se za sve to pobrinu. Jesu li, dakle, ti njihovi izgovori
  valjani? Zar oni nisu kamen spoticanja u njihovom stremljenju ka istini? (Jesu.)
  Iako ti ljudi veruju u Bo\u017eju suverenost i Njegova ure\u0111enja, oni se ujedno
  \u017eale na okru\u017eenje koje je Bog za njih uredio. Oni zanemaruju Bo\u017eje
  zahteve i uop\u0161te nisu proaktivni u saradnji s njima. Umesto toga, stalo im
  je samo do toga da udovolje svom telu, svojim porodicama i rodbini. \u0160ta navode
  kao razlog zbog kojeg ne streme ka istini? \u201ePrevi\u0161e smo zauzeti i iscrpljeni
  poku\u0161ajima da se odr\u017eimo u \u017eivotu. Nemamo kad da stremimo ka istini;
  nedostaje nam odgovaraju\u0107e okru\u017eenje za stremljenje ka istini.\u201c Kakvo
  je njihovo stanovi\u0161te? (Nikad nije kasno za stremljenje ka istini.) \u201eNikad
  nije kasno za stremljenje ka istini. Pozabavi\u0107u se time za par godina.\u201c
  Zar to nije glupo? (Jeste.) To je glupo \u2013 oni sami sebe zavaravaju takvim izgovorima.
  Da li \u0107e Bo\u017eje delo \u010dekati na tebe? (Ne\u0107e.) \u201ePo\u010de\u0107u
  s tim kroz par godina\u201c \u2013 \u0161ta ta\u010dno zna\u010di \u201eza par godina\u201c?
  To zna\u010di da \u0107e\u0161 manje mo\u0107i da se nada\u0161 spasenju i da \u0107e\u0161
  imati manje vremena da do\u017eivi\u0161 Bo\u017eje delo. Par godina \u0107e proleteti,
  a zatim i slede\u0107ih nekoliko, i tako \u0107e neosetno pro\u0107i \u010ditavih
  deset godina, a ti ne\u0107e\u0161 razumeti istinu, niti zakora\u010diti u istina-stvarnost,
  i tvoja iskvarena narav ne\u0107e se ni za dlaku popraviti. Te\u0161ko ti je da
  izgovori\u0161 jednu jedinu iskrenu re\u010d. Zar to nije opasno? Nije li to prava
  \u0161teta? (Jeste.) Kome ljudi, na kraju krajeva, nanose \u0161tetu nude\u0107i
  sve te izgovore i pravdaju\u0107i se zbog toga \u0161to ne streme ka istini? (Sebi.)
  Tako je \u2013 oni, na kraju krajeva, sami sebi nanose \u0161tetu. A na samrtnoj
  postelji, prezira\u0107e sebe zato \u0161to istinu nisu stekli tokom dugih godina
  vere u Boga i kaja\u0107e se zbog protra\u0107enog \u017eivota!\\nNeki od njih imaju
  donekle dobro obrazovanje, ali su ipak slabog kova i ne poseduju duhovno razumevanje.
  Koliko god propovedi da su odslu\u0161ali, nisu u stanju da razumeju istinu. Uvek
  imaju vlastite \u017eelje i ambicije i uvek se nadme\u0107u oko statusa. Ako ne
  dobiju \u017eeljeni status, oni ne\u0107e stremiti ka istini. Re\u0107i \u0107e:
  \u201eBo\u017eja ku\u0107a mi nikad ne dodeljuje du\u017enosti u skladu s mojim
  sposobnostima, poput ure\u0111ivanja tekstova, audiovizuelnog rada, du\u017enosti
  crkvenog vo\u0111e ili nadzornika grupe. Ne daju mi da radim nikakav va\u017ean
  posao. Bo\u017eja ku\u0107a mi ne nudi unapre\u0111enja, niti me vaspitava, a svaki
  put kad se u crkvi odr\u017eavaju izbori, niko ne glasa za mene i niko me ne voli.
  Zar stvarno ne posedujem nijedan od po\u017eeljnih kvaliteta? Ja sam visoko-obrazovani
  intelektualac, ali Bo\u017eja ku\u0107a me nikad ne unapre\u0111uje niti me vaspitava,
  te stoga nisam motivisan da stremim ka istini. Sva bra\u0107a i sestre koji su u
  Boga po\u010deli da veruju otprilike u isto vreme kad i ja obavljaju va\u017ene
  du\u017enosti i slu\u017ee kao vo\u0111e i radnici \u2013 kako to da sam samo ja
  uvek besposlen? Dodeljuju mi tek sporednu ulogu da s vremena na vreme \u0161irim
  jevan\u0111elje, a ne dozvoljavaju mi ni da svedo\u010dim. Kad god Bo\u017eja ku\u0107a
  neke ljude promovi\u0161e na va\u017ene du\u017enosti, ja izvisim; ne dopu\u0161taju
  mi \u010dak ni da predvodim skupove i ne daju mi nikakve obaveze. Sve to ose\u0107am
  kao veliku nepravdu. To je okru\u017eenje koje mi je Bog uredio. Za\u0161to ne ose\u0107am
  da moje postojanje ima neku vrednost? Za\u0161to Bog voli druge, a mene ne voli?
  Za\u0161to Bog druge ljude vaspitava, a mene ne? Trebalo bi da mi Bo\u017eja ku\u0107a
  natovari na le\u0111a vi\u0161e posla i da me postavi za nadzornika ili tome sli\u010dno.
  Na taj bih na\u010din bio barem malo motivisan da stremim ka istini. Kako da stremim
  ka istini ako za to nemam motivacije? Ljudima uvek treba malo motivacije da bi stremili
  ka istini; moramo biti u stanju da vidimo neku korist od toga. Znam da ljudi imaju
  iskvarenu narav koju treba promeniti i da je stremljenje ka istini dobra stvar,
  da nam omogu\u0107ava da budemo spaseni i usavr\u0161eni \u2013 ali ja nikad nisam
  upotrebljen ni za \u0161ta va\u017eno i stoga ne ose\u0107am nikakav podsticaj u
  pogledu stremljenja ka istini! Po\u010de\u0107u da stremim ka istini onda kad me
  bra\u0107a i sestre budu po\u0161tovali i podr\u017eavali \u2013 ne\u0107e to biti
  prekasno.\u201c Zar nije ta\u010dno da postoji ovakva vrsta ljudi? (Ta\u010dno je.)
  \u0160ta je problemati\u010dno u vezi s njima? Problem je u tome \u0161to \u017eele
  status i ugled. O\u010digledno je da oni istinu ne vole, ali bi ipak hteli da steknu
  ugled i svoje mesto za stolom u Bo\u017ejoj ku\u0107i. Zar to nije besramno? Sasvim
  je u redu da bude\u0161 slu\u017ebenik; ostaje, me\u0111utim, da se vidi da li si
  u stanju da se uzdigne\u0161 do statusa odanog slu\u017ebenika. Kako ti to nije
  jasno? Misli\u0161 li da \u0107e\u0161 biti spasen ako stekne\u0161 status i ugled?
  Da \u0107e\u0161 postati neko ko stremi ka istini? Jesu li ta tvoja ose\u0107anja
  valjana? (Nisu.) Ti ljudi \u017eele da se istaknu i da njihovo prisustvo bude prime\u0107eno;
  ako im se ta \u017eelja ne ispuni, \u017eale se da je Bog nepravedan i da ne tretira
  sve ljude podjednako, da ih Njegova ku\u0107a ne promovi\u0161e i da ih njihova
  bra\u0107a i sestre ne biraju na va\u017ene funkcije \u2013 sve to svakako nije
  osnova koja je \u010doveku potrebna da bi stremio ka istini, zar ne? Da li se igde
  u Bo\u017ejim re\u010dima ka\u017ee da svi koji streme ka istini moraju biti prihva\u0107eni
  i po\u0161tovani od svoje bra\u0107e i sestara? Ili da moraju biti u stanju da stupaju
  na va\u017ene du\u017enosti i da obavljaju va\u017ene poslove, kao i da zna\u010dajno
  doprinose Bo\u017ejoj ku\u0107i? Ka\u017eu li Bo\u017eje re\u010di da jedino takvi
  ljudi mogu da streme ka istini, da su samo oni sposobni za stremljenje ka istini?
  Da li Njegove re\u010di ka\u017eu da samo takvi ljudi ispunjavaju kriterijume stremljenja
  ka istini, da samo oni mogu da zakora\u010de u istina-stvarnost ili da \u0107e,
  na kraju, samo oni mo\u0107i da budu spaseni? Da li je to igde u Bo\u017ejim re\u010dima
  zapisano? (Nije.) O\u010digledno je da tvrdnje ovakvih ljudi nisu validne. Zbog
  \u010dega, dakle, oni iznose takve tvrdnje? Nisu li to njihovi izgovori za to \u0161to
  ne streme ka istini? (Jesu.) Oni vole status i presti\u017e. Stalo im je samo do
  trke za ugledom i li\u010dnim dobitkom, kao i do sticanja statusa u svojoj veri
  u Boga. Stide se da to glasno ka\u017eu, pa stoga smi\u0161ljaju gomilu opravdanja,
  brane\u0107i se \u0161to ne streme ka istini i svaljuju\u0107i krivicu na crkvu,
  na svoju bra\u0107u i sestre i na Boga. Zar to nije zlo? Nisu li to zli ljudi koji
  upiru prstom u nevine? (Jesu.) Oni bez razloga prave probleme i maltretiraju druge
  svojim nelogi\u010dnim zahtevima; nemaju nimalo savesti ni razuma! Iako je to \u0161to
  ne streme ka istini samo po sebi dovoljno ozbiljan problem, oni uz to poku\u0161avaju
  da se raspravljaju i da ote\u017eaju drugima \u2013 to je zaista nerazumno, zar
  ne? Stremljenje ka istini je stvar dobre volje. Ako voli\u0161 istinu, Sveti Duh
  \u0107e delovati u tebi. Ako voli\u0161 istinu, ako se moli\u0161 Bogu i zavisi\u0161
  od Njega, ako razmi\u0161lja\u0161 o sebi i nastoji\u0161 da sebe spozna\u0161 bez
  obzira na progone i nevolje koji te zadese, i ako aktivno traga\u0161 za istinom
  kako bi otklonio probleme koje si u sebi otkrio, i u stanju si adekvatno da obavlja\u0161
  svoju du\u017enost, bi\u0107e\u0161 postojan u svom svedo\u010denju. Kad ljudi vole
  istinu, kod njih se sve ovo ispoljava prirodno. Te se manifestacije javljaju dobrovoljno,
  rado i bez prinude, bez ikakvih dodatnih uslova. Ako su u stanju da na ovaj na\u010din
  slede Boga, ljudi \u0107e na kraju ste\u0107i istinu i \u017eivot, zakora\u010di\u0107e
  u istina-stvarnost i pro\u017eive\u0107e \u017eivot u liku \u010doveka. Treba li
  da budu ispunjeni jo\u0161 neki dodatni uslovi da bi po\u010deo da stremi\u0161
  ka istini? Ne. Vera u Boga je dobrovoljna, to je ne\u0161to \u0161to \u010dovek
  sam bira, a stremljenje ka istini je savr\u0161eno prirodno i opravdano; Bog to
  odobrava. Oni koji ne streme ka istini nerado se odri\u010du telesnih zadovoljstava,
  ali bi ipak hteli da steknu Bo\u017eje blagoslove; me\u0111utim, \u010dim se suo\u010de
  s nevoljama i progonom, \u010dim po\u010dnu da ih ismevaju i klevetaju, oni postaju
  negativni i slabi, ne \u017eele\u0107i vi\u0161e da veruju u Boga, niti da Ga slede.
  Ponekad Ga \u010dak i okrivljuju i odri\u010du Ga se. Nije li sve to besmisleno?
  Hteli bi da budu blagosloveni, ali ipak i dalje te\u017ee telesnim zadovoljstvima,
  a kada ih sna\u0111u bilo kakve nevolje ili progoni, oni Boga krive za to. Eto koliko
  su nerazumni ljudi koji ne vole istinu. Bi\u0107e im te\u0161ko da Boga slede do
  samog kraja; \u010dim ih zadesi neka nevolja ili progon, bi\u0107e razotkriveni
  i isklju\u010deni. Previ\u0161e je ovakvih ljudi. Bez obzira na razlog zbog kojeg
  veruje\u0161 u Boga, Bog \u0107e na kraju tvoj ishod odrediti na osnovu toga da
  li si stekao istinu. Ako ne bude\u0161 stekao istinu, nijedno tvoje opravdanje ili
  izgovor ne\u0107e dr\u017eati vodu. Mo\u017ee\u0161 ti da rezonuje\u0161 kako god
  \u017eeli\u0161, mo\u017ee\u0161 koliko ho\u0107e\u0161 da se zapli\u0107e\u0161
  \u2013 da li \u0107e Bog mariti za to? Da li \u0107e Bog razgovarati s tobom? Ho\u0107e
  li raspravljati i savetovati se s tobom? Ho\u0107e li se s tobom konsultovati? Koji
  je odgovor? Ne\u0107e. Sasvim je sigurno da ne\u0107e. Ma koliko da su tvoji razlozi
  \u010dvrsti, oni ne\u0107e biti prihva\u0107eni. Ne sme\u0161 pogre\u0161no razumeti
  Bo\u017eje namere i misliti da ne mora\u0161 da stremi\u0161 ka istini ukoliko ponudi\u0161
  raznorazne razloge i izgovore. Bog \u017eeli da bude\u0161 u stanju da za istinom
  traga\u0161 u svakom mogu\u0107em okru\u017eenju i ma \u0161ta da te zadesi, te
  da kona\u010dno uspe\u0161 da zakora\u010di\u0161 u istina-stvarnost i da zadobije\u0161
  istinu. Bez obzira na okolnosti koje je Bog za tebe uredio, bez obzira na kakve
  ljude i doga\u0111aje nailazi\u0161 i u kakvom se okru\u017eenju nalazi\u0161, ti
  treba da se moli\u0161 Bogu i da traga\u0161 za istinom kako bi se s njima suo\u010dio.
  Upravo su to lekcije koje treba da nau\u010di\u0161 tokom svog stremljenja ka istini.
  Ako stalno tra\u017ei\u0161 izgovore da iz tih okolnosti iza\u0111e\u0161, da ih
  izbegne\u0161, da ih odbije\u0161 ili da im se odupre\u0161, Bog \u0107e di\u0107i
  ruke od tebe. Besmisleno je iznalaziti razloge, biti tvrdoglav i naporan \u2013
  ukoliko se Bog ne pobrine za tebe, izgubi\u0107e\u0161 svaku \u0161ansu za spasenje.
  Za boga ne postoji problem koji ne mo\u017ee da se re\u0161i; On je za svaku osobu
  stvorio odgovaraju\u0107e ure\u0111enje i zna kako da postupa sa svakim \u010dovekom.
  On s tobom ne\u0107e raspravljati o tome da li su tvoji razlozi i izgovori opravdani.
  On ne\u0107e slu\u0161ati ni ocenjivati da li su argumenti kojima se brani\u0161
  racionalni. Pita\u0107e te samo \u201eJesu li Bo\u017eje re\u010di istinite? Je
  li tvoja narav iskvarena? Treba li da stremi\u0161 ka istini?\u201c Jedna jedina
  \u010dinjenica treba da ti bude jasna: Bog je istina, a ti si iskvareno ljudsko
  bi\u0107e, te stoga treba da preuzme\u0161 na sebe traganje za istinom. Nijedan
  problem ni pote\u0161ko\u0107a, nikakav razlog ni izgovor ne stoji \u2013 ukoliko
  ne prihvati\u0161 istinu, nastrada\u0107e\u0161. \u010coveku se isplati da plati
  bilo koju cenu da bi stremio ka istini i zakora\u010dio u istina-stvarnost. Ljudi
  treba da ostave po strani sve svoje izgovore, sva opravdanja i sve nevolje, kako
  bi prihvatili istinu i zadobili \u017eivot, jer Bo\u017eje re\u010di i istina jesu
  \u017eivot koji oni treba da steknu, i to je \u017eivot koji se ni za \u0161ta ne
  mo\u017ee menjati. Ako propusti\u0161 ovu priliku, ne samo da \u0107e\u0161 se zbog
  toga \u010ditavog \u017eivota kajati \u2013 ovde nije re\u010d samo o kajanju \u2013
  ve\u0107 \u0107e\u0161 samog sebe sasvim upropastiti. Za tebe vi\u0161e ne\u0107e
  biti ni ishoda ni odredi\u0161ta, i ti \u0107e\u0161, kao stvoreno bi\u0107e, do\u0107i
  do kraja puta. Nikada vi\u0161e ne\u0107e\u0161 imati priliku da bude\u0161 spasen.
  Razumete li? (Razumemo.) Nemojte tra\u017eiti izgovore i razloge da ne stremite
  ka istini. Od njih nema nikakve koristi i njima samo zavaravate sami sebe.\\nPojedini
  vo\u0111e nikad ne deluju u skladu s na\u010delima, ve\u0107 su sami sebi zakon,
  svojevoljni su i plahoviti. Njihova bra\u0107a i sestre im to mogu napomenuti slede\u0107im
  re\u010dima: \u201eRetko se konsultuje\u0161 bilo s kim pre no \u0161to ne\u0161to
  preduzme\u0161. O tvojim sudovima i odlukama saznajemo tek nakon \u0161to ih donese\u0161.
  Za\u0161to ni sa kim ne razgovara\u0161 o njima? Za\u0161to nas unapred ne obave\u0161tava\u0161
  o odlukama koje donosi\u0161? \u010cak i ako je to \u0161to radi\u0161 ispravno
  i ako si boljeg kova od nas, ipak bi trebalo da nas najpre obavesti\u0161 o tome.
  U najmanju ruku, imamo pravo da znamo \u0161ta se de\u0161ava. Time \u0161to se
  uvek pona\u0161a\u0161 kao da si sam sebi zakon, ti kora\u010da\u0161 putem antihrista!\u201c
  A \u0161ta bi ti vo\u0111a na to odgovorio? \u201eU svojoj ku\u0107i, ja sam gazda.
  O svim stvarima, velikim i malim, odlu\u010dujem ja. Tako sam navikao. Kad neko
  iz moje \u0161ire porodice ima neki problem, on dolazi kod mene i tra\u017ei da
  odlu\u010dim \u0161ta treba u\u010diniti. Oni znaju da sam dobar u re\u0161avanju
  problema. Zato sam upravo ja zadu\u017een za poslove svoje porodice. Kad sam pri\u0161ao
  crkvi, mislio sam da vi\u0161e ne\u0107u morati da se bavim ovozemaljskim stvarima,
  ali onda su me izabrali za vo\u0111u. \u0160ta ja tu mogu \u2013 tako mi je su\u0111eno.
  Bog mi je podario tu sposobnost. Ro\u0111en sam da donosim odluke i da govorim drugima
  \u0161ta da rade.\u201c Ovde se podrazumeva da su oni na neki na\u010din predodre\u0111eni
  da budu zvani\u010dnici, dok su drugi ro\u0111eni da budu pe\u0161adinci i robovi.
  Smatraju da je njihova poslednja, dok svi ostali treba da ih slu\u0161aju. \u010cak
  i kada bra\u0107a i sestre uvide problem kod takvih vo\u0111a i uka\u017eu im na
  to, oni to ne\u0107e prihvatiti, niti \u0107e prihvatiti orezivanje. Bori\u0107e
  se i pru\u017eati otpor sve dok bra\u0107a i sestre ne zatra\u017ee njihovu smenu.
  Za sve to vreme, takav \u0107e vo\u0111a ovako razmi\u0161ljati: \u201eBudu\u0107i
  ovako \u010dvrstog kova, su\u0111eno mi je da budem glavni gde god da se pojavim.
  A vi \u0107ete, shodno vlastitom kovu, uvek biti robovi i sluge. Su\u0111eno vam
  je da primate nare\u0111enja od drugih ljudi.\u201c Kakvu narav oni otkrivaju time
  \u0161to \u010desto ovako govore? O\u010digledno je da se radi o iskvarenoj naravi,
  aroganciji, samoljublju i krajnjem egoizmu, ali oni sve to besramno pokazuju i razme\u0107u
  se time kao da im je to ja\u010da strana i neka naro\u010dita prednost. Kad neka
  osoba u sebi otkrije iskvarenu narav, ona treba da razmisli o sebi, da spozna svoju
  iskvarenu narav, te da se zatim pokaje i pobuni protiv takve naravi, i treba da
  stremi ka istini sve dok ne bude u stanju da deluje u skladu s na\u010delima. Ali,
  takvi vo\u0111e ne postupaju tako. Umesto toga, oni ostaju nepopravljivi i uporno
  se dr\u017ee vlastitih gledi\u0161ta i metoda. Na osnovu takvih pona\u0161anja,
  mo\u017ee se videti da oni uop\u0161te ne prihvataju istinu i da ni u kom slu\u010daju
  nisu ljudi koji streme ka istini. Ne slu\u0161aju nikoga ko ih razotkriva i ko ih
  orezuje, ve\u0107 za sebe uvek imaju opravdanje: \u201eE pa, naprosto sam takav!
  To se zove stru\u010dnost i talenat \u2013 ima li ih iko od vas? Su\u0111eno mi
  je da budem glavni. Kud god da krenem, svuda sam vo\u0111a. Navikao sam da moja
  re\u010d bude poslednja i da o svemu samostalno odlu\u010dujem, bez konsultacija
  s drugim ljudima. Jednostavno sam takav i u tome je moj li\u010dni \u0161arm.\u201c
  Nije li ovo razuzdana bestidnost? Oni ne priznaju da im je narav iskvarena i o\u010dito
  ne priznaju Bo\u017eje re\u010di koje \u010doveku sude i razotkrivaju ga. Naprotiv,
  oni svoje jeresi i zablude smatraju istinom i poku\u0161avaju da sve ostale nateraju
  da ih prihvate i po\u0161tuju. U dubini du\u0161e, veruju kako u Bo\u017ejoj ku\u0107i
  treba da vladaju oni, a ne istina, da u njoj oni treba da donose odluke. Zar to
  nije drska bestidnost? Ka\u017eu da \u017eele da streme ka istini, ali se pona\u0161aju
  sasvim suprotno. Ka\u017eu da su pokorni Bogu i istini, ali stalno \u017eele da
  budu na vlasti, da njihova uvek bude poslednja i da im se sva ostala bra\u0107a
  i sestre pot\u010dinjavaju i da ih slu\u0161aju. Nikome ne dozvoljavaju da ih nadgleda
  niti savetuje, bez obzira da li je ono \u0161to rade prikladno i u skladu s na\u010delima.
  Umesto toga, misle da svi ostali moraju da ih slu\u0161aju i da se povinuju njihovim
  re\u010dima i odlukama. Oni se uop\u0161te ne osvr\u0107u na svoje postupke. Ma
  koliko da ih bra\u0107a i sestre savetuju i poma\u017eu im, ma koliko da ih Bo\u017eja
  ku\u0107a orezuje, pa \u010dak ni kad ih vi\u0161e puta razre\u0161e du\u017enosti,
  oni se uop\u0161te ne bave svojim problemima. U svim prilikama, uporno ponavljaju
  jedno te isto: \u201eU svojoj ku\u0107i, ja sam gazda. O svemu odlu\u010dujem ja.
  Po svim pitanjima jedino je moja re\u010d poslednja. Na to sam navikao i to se nikako
  ne mo\u017ee izbe\u0107i.\u201c Zaista su nerazumni i nepopravljivi! Sve svoje negativne
  postupke propagiraju kao ne\u0161to pozitivno i sve vreme imaju veoma visoko mi\u0161ljenje
  o sebi. Oni su tako bestidni! Ti ljudi uop\u0161te ne prihvataju istinu i potpuno
  su nepopravljivi \u2013 stoga mo\u017eete biti sigurni da oni istinu ne vole, niti
  streme ka njoj. Duboko u srcu im je odbojna istina i neprijateljski su raspolo\u017eeni
  prema njoj. Cena koju pla\u0107aju i te\u0161ko\u0107e kroz koje prolaze da bi udovoljili
  svojim \u017eeljama i stekli status potpuno su uzaludne. Ni\u0161ta od toga Bog
  ne odobrava i gnu\u0161a se toga. Na taj se na\u010din ispoljava njihovo protivljenje
  istini i otpor prema Bogu. U to mo\u017eete biti potpuno sigurni, a svi koji razumeju
  istinu u stanju su da to raspoznaju.\\nIma tako\u0111e i ljudi koji godinama veruju
  u Boga, a ipak ne poseduju nikakvu istina-stvarnost; godinama slu\u0161aju propovedi,
  ali i dalje ne razumeju istinu. Iako su lo\u0161eg kova, oni poseduju \u201etalente\u201c
  u kojima su bez premca: laganje i prikrivanje la\u017ei, te varanje i obmanjivanje
  drugih ki\u0107enim re\u010dima. U stanju su da u desetak re\u010denica izgovore
  isto toliko la\u017ei \u2013 svaka je njihova re\u010denica u izvesnoj meri ukaljana.
  Preciznije govore\u0107i, ni\u0161ta \u0161to ka\u017eu nije istinito. Me\u0111utim,
  po\u0161to su lo\u0161eg kova i naizgled se prili\u010dno dobro vladaju, oni ovako
  razmi\u0161ljaju: \u201ePo prirodi sam pla\u0161ljiv, naivan i lo\u0161ega kova.
  Kud god da krenem, ljudi me maltretiraju, a ja to naprosto moram da trpim i da patim.
  Ne usu\u0111ujem se da im uzvratim uvrede, niti da se s njima potu\u010dem \u2013
  sve \u0161to mogu da uradim jeste da se sakrijem, da se predam i progutam njihove
  uvrede. Ja sam onaj \u2019po\u0161ten, ali neuk \u010dovek\u2019 o kojem govore
  Bo\u017eje re\u010di, ja sam pripadnik Njegovog naroda.\u201c Ako takvog \u010doveka
  neko pita: \u201eZa\u0161to onda la\u017ee\u0161?\u201c Odgovori\u0107e: \u201eKad
  sam ja to slagao? Koga sam prevario? Nisam lagao! Kako bih ja, ovako naivan, mogao
  da sla\u017eem? Mozak mi sporo reaguje, a nisam ni naro\u010dito obrazovan \u2013
  ja ni ne znam da sla\u017eem! Ima na svetu la\u017eljivaca koji za tren oka mogu
  da smisle nekoliko podlih ideja i spletki. Ali ja nisam tako lukav i mene drugi
  stalno maltretiraju. Ja sam, dakle, ona po\u0161tena osoba o kojoj Bog govori i
  vi me bez osnova nazivate la\u017eovom i prevarantom. Nema u tome ni\u0161ta posebno,
  nego vi samo poku\u0161avate da me oklevetate. Znam da me svi gledate sa visine:
  mislite da sam glup i da sam lo\u0161ega kova, pa zato \u017eelite da me maltretirate.
  Jedino me Bog ne maltretira, ve\u0107 je milostiv prema meni.\u201c Takvi ljudi
  ne\u0107e priznati da la\u017eu, nego drsko tvrde da upravo oni predstavljaju po\u0161tene
  ljude o kojima Bog govori, te tom izjavom sebe uzdi\u017eu direktno na presto. Veruju
  da su po prirodi po\u0161teni, ali neuki ljudi, koje Bog voli. Misle da ne moraju
  da streme ka istini, niti da razmi\u0161ljaju o sebi. Misle da od ro\u0111enja nisu
  izgovorili ni jednu jedinu la\u017e. Ma \u0161ta drugi ljudi o njima govorili, oni
  ne priznaju da la\u017eu, ve\u0107 se umesto toga sva\u0111aju i brane, stalno pote\u017eu\u0107i
  jedne te iste otrcane izgovore. Da li su ikada analizirali sami sebe? U izvesnom
  smislu, jesu. I kakav je rezultat te njihove \u201esamoanalize\u201c? \u201eJa sam
  onaj po\u0161ten, ali neuk \u010dovek, o kojem Bog govori. Mo\u017eda sam donekle
  i neuk, ali sam zato po\u0161ten \u010dovek.\u201c Kao da se kite ordenjem? Oni
  ne ka\u017eu nedvosmisleno da li su neznalice ili po\u0161tenja\u010dine, ali sebe
  ipak smatraju po\u0161tenim osobama. Imaju li oni uop\u0161te samosvesti? Ako je
  neko budala koju svi maltretiraju i koja \u017eivi kukavi\u010dkim \u017eivotom,
  da li to nu\u017eno zna\u010di da se radi o dobroj osobi? A ako nekoga drugi ljudi
  smatraju dobrim \u010dovekom, zna\u010di li to da on ne treba da stremi ka istini?
  Da li su takvi ljudi, na neki na\u010din, prirodno obdareni istinom? Neki ka\u017eu:
  \u201eJa sam prili\u010dno naivna osoba i uvek se trudim da govorim istinu, ali
  sam uz to pomalo neuk. Ne moram da stremim ka istini, zato \u0161to ve\u0107 jesam
  dobar i po\u0161ten \u010dovek.\u201c Zar oni na taj na\u010din ne \u017eele da
  uvijeno ka\u017eu da poseduju istinu i da im narav nije iskvarena? Sotona je temeljno
  iskvario \u010ditav ljudski rod. Svi ljudi imaju iskvarenu narav, a kad je ne\u010dija
  narav iskvarena, ta osoba mo\u017ee da la\u017ee, vara i da druge obmanjuje kad
  god joj se prohte. Mo\u017ee se \u010dak hvaliti nekim svojim bezna\u010dajnim dostignu\u0107em
  ili doprinosom, prosipaju\u0107i unaokolo svoju nadmenu narav. Za sve to vreme,
  puni su predstava o Bogu i preteranih zahteva prema Njemu, i poku\u0161avaju da
  se s Njim ube\u0111uju. Zar u tome ne le\u017ei njihov problem? Zar njihova narav
  nije iskvarena? Zar to ne zahteva dublju analizu? Naravno da zahteva. Pa ipak, ti
  su ljudi sami sebe ve\u0107 miropomazali i proglasili se po\u0161tenim ljudima,
  koji nikad ne la\u017eu niti varaju druge; javno tvrde kako nemaju narav prevaranta,
  te da stoga ni ne moraju da streme ka istini. Prema tome, niko ko se tako pona\u0161a
  ne stremi ka istini, niti je iko od njih zakora\u010dio u istina-stvarnost. Dok
  se Bogu mole, oni \u010desto gorke suze liju zbog vlastite gluposti, zbog toga \u0161to
  ih drugi stalno maltretiraju i zbog svog naro\u010dito lo\u0161eg kova: \u201eBo\u017ee,
  jedino me Ti voli\u0161; jedino me Ti sa\u017ealjeva\u0161 i postupa\u0161 milostivo
  prema meni. Svi me ljudi maltretiraju i govore da sam la\u017eov \u2013 ali ja nisam
  la\u017eov!\u201c Kad se, nakon molitve, usprave, obri\u0161u suze i pogledaju druge
  ljude, oni misle: \u201eNikoga od vas Bog ne voli. On voli samo mene.\u201c Takvi
  ljudi imaju visoko mi\u0161ljenje o sebi i negiraju tvrdnje da pokazuju ikakve znake
  raznovrsnih pona\u0161anja i izliva iskvarene naravi o kojima Bog govori. \u010cak
  i kad ih zadesi neki konkretan problem, koji ih dovodi do iskvarenog stanja ili
  izliva besa, oni to, nakon kra\u0107eg razmi\u0161ljanja, samo verbalno konstatuju,
  i na tome se sve zavr\u0161ava. Oni uop\u0161te ne tragaju za istinom, niti prihvataju
  \u010dinjenicu da nose iskvarenost u sebi i da su iskvarena ljudska bi\u0107a. Naravno,
  jo\u0161 su manje skloni da priznaju da su u bilo kom konkretnom slu\u010daju prosuli
  svoju iskvarenu narav. Ma koliko problema da stvaraju i ma koliko iskvarene naravi
  da prospu, oni naposletku uvek ponavljaju jedno te isto: \u201eJa sam onaj po\u0161ten,
  ali neuk \u010dovek, o kojem Bog govori. Predmet sam Njegovog sa\u017ealjenja i
  On \u0107e me obilno blagosiljati.\u201c I tako, izgovaraju\u0107i ove re\u010di,
  ose\u0107aju kako uop\u0161te ni ne moraju da streme ka istini; te su re\u010di
  takvim ljudima izgovor za to \u0161to ne streme ka istini. Zar nisu apsurdni? (Jesu.)
  Apsurdni su i neuki. Koliko su, zapravo, apsurdni? Toliko da se hvataju za jednu
  jedinu frazu iz Bo\u017ejih re\u010di koja im ide u prilog i koriste je kao znamen
  kojim bi prisilili Boga i opravdali sebe zbog toga \u0161to ne streme ka istini,
  dok se prema Bo\u017ejim re\u010dima koje \u010doveka razotkrivaju i osu\u0111uju
  ophode kao da nemaju nikakve veze s njima. Misle da te re\u010di ne moraju da slu\u0161aju
  zato \u0161to oni ve\u0107 jesu po\u0161teni. Preciznije govore\u0107i, takvi su
  ljudi bedni pa\u0107enici. Lo\u0161eg su kova, nerazumni su i skoro da nemaju stida,
  ali bi ipak hteli da steknu blagoslove. I uprkos tome \u0161to su lo\u0161eg kova,
  \u0161to nemaju ni razuma ni stida, veoma su ponosni i na obi\u010dne ljude gledaju
  sa visine. Oni nemaju po\u0161tovanja prema ljudima dobrog kova koji su u stanju
  da streme ka istini i koji mogu da u zajedni\u0161tvu razgovaraju o istina-stvarnosti.
  Oni ovako razmi\u0161ljaju: \u201eKakva je uop\u0161te korist od tih va\u0161ih
  prednosti? Ako ve\u0107 svi vi stremite ka istini i poznajete sami sebe, ne moram
  i ja da radim te stvari. Po\u0161ten sam \u010dovek; mo\u017eda sam pomalo neuk,
  ali to ne vidim kao neki problem. A ni iskvarena narav, koju tako obilno prosipam,
  nije ne\u0161to \u0161to treba da vas zabrinjava. Dokle god pokazujem dobro vladanje,
  sve \u0107e biti u redu.\u201c \u0160ta oni zahtevaju od sebe? \u201eU svakom slu\u010daju,
  Bog poznaje moje srce, a moja vera u Njega je iskrena. To je dovoljno. Kakva korist
  od toga da po vasceli dan pri\u010damo o iskustvenim svedo\u010denjima i o poznavanju
  Bo\u017ejih re\u010di? Kad se sve uzme u obzir, sasvim je dovoljno iskreno verovati
  u Boga.\u201c Zar to nije glupo da ne mo\u017ee biti gluplje? Kao prvo, takve ljude
  istina uop\u0161te ne zanima; kao drugo, po\u0161teno je re\u0107i da oni nisu sposobni
  da shvate ni istinu ni Bo\u017eje re\u010di. Pa ipak, oni i dalje imaju veoma visoko
  mi\u0161ljenje o sebi i nastupaju tako uzvi\u0161eno i mo\u0107no. Nastoje da prona\u0111u
  opravdanje za to \u0161to ne streme ka istini, da prona\u0111u neki metod traganja
  ili ne\u0161to \u0161to smatraju predno\u0161\u0107u kojom \u0107e zameniti stremljenje
  ka istini. Zar to nije glupo? (Jeste.)\\nNeki od onih koji ne streme ka istini nemaju
  ve\u0107ih problema u smislu svoje ljudskosti. Pridr\u017eavaju se pravila i dobro
  se pona\u0161aju. Ako se radi o \u017eenama, one su ne\u017ene i \u010dedne, otmene
  i pristojne, i ne \u0161vrljaju unaokolo. Pred svojim su roditeljima dobre devojke,
  u porodi\u010dnom \u017eivotu su dobre \u017eene i majke, koje savesno provode dane
  brinu\u0107i o doma\u0107instvu. Ako je re\u010d o mu\u0161karcima, oni su bezazleni
  i savesni, i dobro se pona\u0161aju; svojim su roditeljima poslu\u0161ni sinovi,
  ne piju i ne pu\u0161e, ne kradu i ne otimaju, ne kockaju se i ne kurvaju \u2013
  uzorni su mu\u017eevi, a van ku\u0107e se sa drugima retko sva\u0111aju ili spore
  oko toga ko je u pravu. Neki ljudi misle da je, za nekoga ko veruje u Boga, ovo
  sasvim dovoljno, te da oni koji ovako postupaju predstavljaju standardno i prihvatljivo
  dobre ljude. Na osnovu toga \u0161to su milosrdni i uslu\u017eni, ponizni i strpljivi,
  \u0161to su postali tolerantni nakon \u0161to su poverovali u Boga i \u0161to sve
  poslove koje im crkva dodeli obavljaju marljivo i dobro, ne pokazuju\u0107i povr\u0161nost,
  ti ljudi smatraju da su time ve\u0107 dostigli istina-stvarnost i da su veoma blizu
  ispunjenja Bo\u017ejih zahteva. Misle da se stremljenje ka istini sastoji u tome
  da dobro zagreju stolicu i malo vi\u0161e se potrude, da \u010ditaju vi\u0161e Bo\u017ejih
  re\u010di i da iz njih upamte \u0161to ve\u0107i broj fraza, koje \u0107e zatim
  \u0161to \u010de\u0161\u0107e propovedati drugima. Oni, me\u0111utim, ne prepoznaju
  vlastite izlive iskvarenosti, ne znaju kakvu iskvarenu narav imaju, a jo\u0161 manje
  znaju kako iskvarena narav nastaje, odnosno kako je treba upoznati i osloboditi
  je se. Oni ni\u0161ta od toga ne znaju. Ima li takvih ljudi? (Ima.) Svoju prirodnu
  \u201edobrotu\u201c smatraju standardom koji treba da dostignu oni koji streme ka
  istini. Ako bi im neko rekao da su nadmeni, la\u017eljivi i r\u0111avi, oni to ne
  bi otvoreno osporavali, ve\u0107 bi se pretvarali da su ponizni, strpljivi i prijem\u010divi.
  Duboko u sebi, me\u0111utim, oni to ne bi shvatili ozbiljno, ve\u0107 bi se tome
  opirali: \u201eZar sam ja nadmen? Ako sam ja nadmen, onda na kugli zemaljskoj nema
  nijedne dobre osobe! Ako sam ja la\u017eljiv, onda na svetu nema po\u0161tenih ljudi!
  Ako sam ja r\u0111av, onda niko na svetu nije pristojan! Zar je danas lako na\u0107i
  nekoga ko je dobar kao ja? Ne, to nije mogu\u0107e!\u201c Njima ne vredi govoriti
  da su la\u017eljivi i nadmeni, ili da ne vole istinu, a svakako ih ne vredi nazivati
  bezvernicima. Oni \u0107e naprosto lupiti rukom o sto i krenuti da se raspravljaju:
  \u201eZna\u010di, ka\u017eete da sam bezvernik? Ako ja ne mogu da budem spasen,
  sigurno ne mo\u017ee niko od vas!\u201c Neko \u0107e mo\u017eda poku\u0161ati da
  ih razotkrije tako \u0161to \u0107e im re\u0107i: \u201eTi ne prihvata\u0161 istinu.
  Kad ti drugi uka\u017eu na probleme koje ima\u0161, pretvara\u0161 se da si ponizan
  i strpljiv, ali duboko u sebi sve to odbacuje\u0161. Mada ono \u0161to propoveda\u0161
  kada u zajedni\u0161tvu razgovaramo o istini zaista jeste ta\u010dno, \u010dinjenica
  je da ti ne prihvata\u0161 nijednu od Bo\u017ejih re\u010di kojima se razotkriva
  i sudi o \u010dovekovoj iskvarenoj narav-su\u0161tini. Tim se Bo\u017ejim re\u010dima
  opire\u0161 i ima\u0161 averziju prema njima. Ima\u0161 zlobnu narav.\u201c Ako
  ih nazovete \u201ezlobnim\u201c, oni to jednostavno ne mogu da prihvate. \u201eImam
  zlobnu narav, ka\u017eete? Da sam zloban, odavno bih vas sve izgazio! Da sam zloban,
  sve bih vas ve\u0107 uni\u0161tio!\u201c Oni nisu u stanju da pravilno shvate ni\u0161ta
  od onoga \u0161to iznosite o njima ili \u0161to im u razgovoru saop\u0161tavate.
  \u0160ta zna\u010di pravilno shvatati stvari? To zna\u010di da svaki problem koji
  neko otkrije u vama upore\u0111ujete s Bo\u017ejim re\u010dima, kako biste ustanovili
  da li je u va\u0161im namerama i mislima zaista bilo gre\u0161aka, te da, bez obzira
  na broj problema otkrivenih u vama, svim tim problemima pristupate sa prihvatanjem
  i pokorno\u0161\u0107u. Upravo tako \u010dovek zaista mo\u017ee da stekne znanje
  o vlastitim problemima. Vlastitu iskvarenu narav nije mogu\u0107e spoznati koriste\u0107i
  vlastite predstave i ma\u0161tarije, ve\u0107 se to mora u\u010diniti na osnovu
  Bo\u017ejih re\u010di. Koji je, dakle, preduslov za samospoznaju? Morate priznati
  \u010dinjenicu da je Sotona naveo na pogre\u0161an put i iskvario ljudski rod, te
  da svi ljudi imaju iskvarenu narav. Tek nakon \u0161to prihvatite ovu \u010dinjenicu,
  mo\u0107i \u0107ete da o sebi razmi\u0161ljate u skladu s otkrovenjem Bo\u017ejih
  re\u010di i da, tokom ovog procesa samorefleksije, postepeno otkrijete vlastite
  probleme. Ti \u0107e problemi tada, bez tvog znanja, malo po malo isplivati na povr\u0161inu,
  i onda \u0107e\u0161 jasno razumeti koliko je tvoja narav iskvarena. Na temelju
  toga, ste\u0107i \u0107e\u0161 saznanje o tome kojoj vrsti ljudi pripada\u0161 i
  \u0161ta je tvoja su\u0161tina. Time \u0107e\u0161 ujedno prihvatiti sve \u0161to
  Bog ka\u017ee i \u0161to otkriva, a zatim \u0107e\u0161 u Njegovim re\u010dima prona\u0107i
  put prakti\u010dnog delovanja koji je On \u010doveku odredio i nastavi\u0107e\u0161
  da deluje\u0161 i da \u017eivi\u0161 u skladu s Njegovim re\u010dima. A upravo to
  zna\u010di stremiti ka istini. Da li, me\u0111utim, takve osobe ovako primaju Bo\u017eje
  re\u010di? Ne \u2013 one mo\u017eda ka\u017eu kako priznaju da su Bo\u017eje re\u010di
  istina i da sve Njegove re\u010di kojima se razotkriva iskvarenost \u010dove\u010danstva
  predstavljaju \u010dinjenice, ali ako od njih zatra\u017eite da spoznaju svoju iskvarenu
  narav, one to ne\u0107e prihvatiti ni priznati. Takvi ljudi veruju da to nema nikakve
  veze s njima. To je zato \u0161to sebe smatraju dostojanstvenim i pristojnim ljudima
  \u2013 ljudima od po\u0161tenja i \u010dasti. Da li biti \u010dastan ujedno zna\u010di
  posedovati istinu? Biti \u010dastan samo je pozitivna manifestacija ne\u010dije
  ljudskosti; \u010dasnost ne predstavlja istinu. Prema tome, to \u0161to poseduje\u0161
  jednu karakteristiku normalne ljudskosti ne zna\u010di da ne mora\u0161 da stremi\u0161
  ka istini, niti zna\u010di da si istinu ve\u0107 stekao \u2013 a jo\u0161 manje
  zna\u010di da si ti osoba koju Bog voli. Zar nije tako? (Jeste.) Ovi takozvani \u201e\u010dasni
  ljudi\u201c veruju da im narav nije nadmena i la\u017eljiva, da im istina nije odbojna,
  te da zasigurno nemaju r\u0111avu i opaku narav. Misle da u njima nema niti jedne
  od ovih iskvarenih naravi, jer sebe smatraju \u010dasnim ljudima, koji su po prirodi
  po\u0161teni i ljubazni, koje uvek drugi maltretiraju, te da su, iako lo\u0161ega
  kova i neuki, oni nadasve po\u0161teni. To njihovo \u201epo\u0161tenje\u201c, me\u0111utim,
  nije pravo po\u0161tenje, ve\u0107 naivnost, stra\u0161ljivost i neukost. Zar takvi
  ljudi nisu velike budale? Svi ih smatraju dobrim ljudima. Da li je takvo mi\u0161ljenje
  ispravno? Da li ljudi za koje drugi misle da su dobri imaju iskvarenu narav? Odgovor
  ne ovo pitanje je, bez imalo sumnje, potvrdan. Zar naivni ljudi ne la\u017eu? Zar
  ne varaju druge, niti se pretvaraju? Nisu li i oni sebi\u010dni? Nisu li pohlepni?
  Zar ne \u017eude za va\u017enim funkcijama? Da li su oni li\u0161eni preteranih
  \u017eelja? Naravno da nisu. Jedini razlog zbog kojeg nisu po\u010dinili neko zlodelo
  jeste taj \u0161to im se nije pru\u017eila prava prilika za to. Oni se \u010dak
  i ponose time \u2013 sami sebe progla\u0161avaju za \u010dasne ljude i smatraju
  da im narav nije iskvarena. I tako, ako bi im neko ukazao na njihovu iskvarenu narav,
  na izliv pokvarenosti ili nekakvo stanje u njima, oni bi to opovrgli re\u010dima:
  \u201eNisam iskvaren! Ja nisam takav, ne pona\u0161am se tako, niti kako mislim.
  Pogre\u0161no ste me razumeli. Svi me smatrate naivnim, glupim i stra\u0161ljivim,
  pa me zato i maltretirate.\u201c \u0160ta \u010diniti sa ovakvim ljudima, koji su
  u stanju da tako drsko odgovaraju? Ako bi se neko i usudio da takvu osobu iznervira,
  ona bi ga doveka proganjala. Takva osoba nikad ne bi prestala da se sva\u0111a i
  \u010dovek ne bi mogao da je se otrese, ma koliko poku\u0161avao. Ovi nerazumni,
  neumorno naporni ljudi sebe i dalje smatraju onima koji streme ka istini, bezazlenim
  i neukim ljudima, \u010dija narav nije iskvarena. \u010cesto \u010dak ka\u017eu:
  \u201eMo\u017eda sam neuk, ali sam zato bezazlen \u2013 po\u0161ten sam \u010dovek
  i Bog me voli!\u201c Za njih su to stvari koje treba iskoristiti. Nije li to ipak
  pomalo bestidno? Ka\u017ee\u0161 da te Bog voli. Ma nemoj? Ima\u0161 li osnova za
  takvu tvrdnju? Poseduje\u0161 li delo Svetoga Duha? Je li Bog kazao da \u0107e te
  usavr\u0161iti? Planira li Bog da te upotrebi? Ako ti Bog ni\u0161ta od toga nije
  rekao, ne mo\u017ee\u0161 tvrditi da te voli \u2013 mo\u017ee\u0161 jedino da ka\u017ee\u0161
  da te On sa\u017ealjeva, \u0161to je ve\u0107 samo po sebi velika stvar. Ako ka\u017ee\u0161
  da te Bog voli, to je samo tvoje li\u010dno mi\u0161ljenje, ali ne i dokaz da te
  Bog zaista voli. Mo\u017ee li Bog voleti osobu koja ne stremi ka istini? Mo\u017ee
  li Bog voleti neuku i stra\u0161ljivu osobu? Ta\u010dno je, dodu\u0161e, da Bog
  sa\u017ealjeva neuke ljude i stra\u0161ljivce. Bog voli one koji su uistinu po\u0161teni,
  koji streme ka istini, koji su u stanju da istinu sprovode u delo i da Mu se pokoravaju,
  koji Ga veli\u010daju i svedo\u010de za Njega, koji vode ra\u010duna o Njegovim
  namerama i koji Ga iskreno vole. Bo\u017eju ljubav imaju samo oni koji su u stanju
  da zaista daju sebe za Njega i da odano vr\u0161e svoju du\u017enost; Bo\u017eju
  ljubav imaju samo oni koji mogu da prihvate istinu, kao i da budu orezani. Bog se
  gnu\u0161a i odbacuje one koji ne prihvataju istinu, koji ne prihvataju da budu
  orezani. Ako ti je istina odbojna i ako se opire\u0161 svim re\u010dima koje je
  Bog izgovorio, onda \u0107e\u0161 i ti Njemu biti odbojan i On \u0107e te se gnu\u0161ati
  i odbaciti te. Da li \u0107e te Bog voleti ako sebe smatra\u0161 dobrom osobom,
  prostodu\u0161nom i naivnom osobom koja je dostojna sa\u017ealjenja, ali koja pritom
  ne stremi ka istini? To je nemogu\u0107e; za to u Njegovim re\u010dima nema nikakvog
  osnova. Bog ne gleda da li si ti naivan, niti Ga zanima s kakvom si ljudsko\u0161\u0107u
  ili kvalitetima ro\u0111en \u2013 Njega samo zanima da li Njegove re\u010di, nakon
  \u0161to ih saslu\u0161a\u0161, prihvata\u0161 ili ignori\u0161e\u0161, da li im
  se pokorava\u0161 ili im se opire\u0161. On posmatra da li Njegove re\u010di uti\u010du
  na tebe i ra\u0111aju li plodove u tebi, kao i da li si u stanju da uistinu svedo\u010di\u0161
  o mno\u0161tvu re\u010di koje je On izgovorio. Ako se tvoje iskustvo na kraju uvek
  svodi na to da ka\u017ee\u0161: \u201eJa sam bezazlen i stra\u0161ljiv, maltretira
  me svaka osoba koju sretnem. Svi me gledaju sa visine\u201c, Bog \u0107e onda kazati
  da to nije svedo\u010denje. Ako tome doda\u0161: \u201eJa sam onaj po\u0161ten,
  ali neuk \u010dovek, o kojem Bog govori\u201c, Bog \u0107e re\u0107i da si ispunjen
  la\u017eima i da iz tvojih usta ne mo\u017ee iza\u0107i nijedna istinita re\u010d.
  Ako se ne pokorava\u0161 zahtevima koje Bog pred tebe postavlja, a pritom jo\u0161
  poku\u0161ava\u0161 da se raspravlja\u0161 s Njim i da za sebe izna\u0111e\u0161
  opravdanja, govore\u0107i: \u201ePropatio sam, platio cenu i volim Boga\u201c, to
  ti ne\u0107e pro\u0107i. Stremi\u0161 li ka istini? Gde je tvoje istinsko iskustveno
  svedo\u010denje? Kako se ispoljava tvoja ljubav prema Bogu? Nikoga ne mo\u017ee\u0161
  ubediti ukoliko ne pru\u017ei\u0161 dokaze. Ka\u017ee\u0161: \u201eJa sam \u010dasna
  osoba i pona\u0161am se pristojno. Ne upu\u0161tam se u bludne radnje i delujem
  u skladu sa svim postoje\u0107im pravilima. Ja sam lepo vaspitana osoba. Ne idem
  po kafanama da pijem, ne kurvam se i ne kockam. Ne pravim smetnje niti poreme\u0107aje
  u Bo\u017ejoj ku\u0107i i ne sejem razdor, ve\u0107 trpim patnju i naporno radim.
  Zar sve to nisu pokazatelji mog stremljenja ka istini? Ja, zapravo, ve\u0107 stremim
  ka istini.\u201c A Bog \u0107e na to re\u0107i: Jesi li se oslobodio svoje iskvarene
  naravi? Gde je svedo\u010danstvo tvog stremljenja ka istini? Mo\u017eete li ste\u0107i
  odobravanje i divljenje od strane izabranog Bo\u017ejeg naroda? Ako nisi u stanju
  da ponudi\u0161 nikakvo iskustveno svedo\u010denje, a ipak tvrdi\u0161 da si po\u0161ten
  i da voli\u0161 Boga, ti zapravo navodi\u0161 druge ljude na pogre\u0161an put krivim
  re\u010dima \u2013 ti si nerazumni \u0111avo i Sotona i zaslu\u017euje\u0161 prokletstvo.
  Sve \u0161to ti sleduje jeste da bude\u0161 osu\u0111en i isklju\u010den od Boga.\\nNeki
  ljudi, pri obavljanju svoje du\u017enosti, \u010desto postupaju samovoljno i nepromi\u0161ljeno.
  Oni su do krajnosti hiroviti: kad su sre\u0107ni, obavljaju pomalo od svoje du\u017enosti,
  a kada nisu, oni se dure i ka\u017eu: \u201eDanas sam lo\u0161e volje. Ne\u0107u
  ni\u0161ta jesti i ne\u0107u obavljati svoju du\u017enost.\u201c Ostali onda moraju
  da pregovaraju s njima, govore\u0107i im: \u201eTo ne mo\u017ee tako. Ne sme\u0161
  da bude\u0161 tako hirovit.\u201c A \u0161ta oni na to odgovaraju? \u201eZnam da
  ne mo\u017ee, ali ja sam odrastao u bogatoj, povla\u0161\u0107enoj porodici. Razmazili
  su me baka, deka i tetke, a roditelji su mi bili jo\u0161 gori. Bio sam njihovo
  mezim\u010de i zenica oka, u svemu su mi povla\u0111ivali i tako me razmazili. Zbog
  takvog vaspitanja sam ovako \u0107udljiv, tako da, dok obavljam du\u017enost u Bo\u017ejoj
  ku\u0107i, ni sa kim ne\u0107u ni o \u010demu razgovarati, ne\u0107u tragati za
  istinom, niti se pokoravati Bogu. Treba li me zbog toga kriviti?\u201c Da li je
  njihovo shvatanje ispravno? Predstavlja li njihov stav stremljenje ka istini? (Ne.)
  Kad god neko pomene neku sitnu manu takvog \u010doveka \u2013 na primer, da pri
  obrocima za sebe bira najbolje komade hrane, da brine samo o sebi i da ne razmi\u0161lja
  o drugima, on to ovako opravdava: \u201eTakav sam od malih nogu. Navikao sam da
  tako postupam. Nikada nisam razmi\u0161ljao o drugima. Oduvek sam \u017eiveo povla\u0161\u0107enim
  \u017eivotom, a moji roditelji, bake i deke me obo\u017eavaju. Za celu moju porodicu
  ja sam zenica oka.\u201c Ovo je ni\u0161ta drugo do gomila gluposti i zabluda. Nije
  li sve to malo drsko i besramno? Ako te roditelji obo\u017eavaju, da li to zna\u010di
  da i svi ostali moraju da te vole? Da li je to \u0161to te rodbina obo\u017eava
  i obasipa pa\u017enjom opravdan razlog da se ti u Bo\u017ejoj ku\u0107i pona\u0161a\u0161
  nepromi\u0161ljeno i samovoljno? Je li to valjan razlog? Je li to ispravan stav
  prema vlastitoj iskvarenoj naravi? Je li to stav stremljenja ka istini? (Nije.)
  Kad se ovim ljudima bilo \u0161ta desi, kad nai\u0111u na bilo kakav problem u vezi
  sa svojom iskvarenom naravi ili sa svojim \u017eivotom, oni tra\u017ee objektivna
  opravdanja kako bi na to odgovorili, kako bi to objasnili ili opravdali. Oni nikad
  ne tra\u017ee istinu, ne mole se Bogu, niti dolaze pred Boga da bi preispitali sami
  sebe. Mogu li se bez samoanalize spoznati vlastiti problemi i vlastita iskvarenost?
  (Ne mogu.) A mogu li se ti ljudi pokajati ukoliko nisu svesni vlastite iskvarenosti?
  (Ne mogu.) Ako neko nije sposoban da se pokaje, u kakvom \u0107e stanju on neprestano
  \u017eiveti? Zar to ne\u0107e biti stanje samopra\u0161tanja? Ose\u0107aj da, uprkos
  tome \u0161to su prosuli svoju iskvarenost, ipak nisu po\u010dinili nikakvo zlo,
  niti prekr\u0161ili upravne odluke \u2013 da taj izliv iskvarenosti, iako u neskladu
  s na\u010delima istine, nije u\u010dinjen namerno, i da im se zato mo\u017ee oprostiti?
  (Da.) Treba li, dakle, u takvom stanju da se na\u0111e neko ko stremi ka istini?
  (Ne.) Ako se \u010dovek nikada iskreno ne pokaje i neprestano \u017eivi u takvom
  stanju, ho\u0107e li mo\u0107i da se preokrene? Ne, on to nikad ne\u0107e mo\u0107i
  da u\u010dini. A ukoliko se ne preokrene, ne\u0107e mo\u0107i ni da se uistinu oslobodi
  od vlastitog zla. \u0160ta zna\u010di nesposobnost istinskog osloba\u0111anja od
  vlastitog zla? To zna\u010di nemogu\u0107nost istinskog praktikovanja istine i ulaska
  u istina-stvarnost. To je o\u010digledan ishod. Ako ne mo\u017ee\u0161 da se oslobodi\u0161
  vlastitog zla, da istinu sprovodi\u0161 u delo ili da zakora\u010di\u0161 u stvarnost,
  da li \u0107e\u0161 onda Boga mo\u0107i da privoli\u0161 da promeni mi\u0161ljenje
  o tebi, ho\u0107e\u0161 li mo\u0107i da zadobije\u0161 delo Svetog Duha, da stekne\u0161
  Bo\u017eje prosve\u0107enje i prosvetljenje, te da od Boga dobije\u0161 oprost za
  svoje grehove i razre\u0161enje vlastite iskvarenosti? (Ne\u0107e\u0161.) A ako
  to nije mogu\u0107e, mo\u017ee li onda tvoja vera u Boga dovesti do tvog spasenja?
  (Ne mo\u017ee.) Ako neka osoba \u017eivi u stanju samopra\u0161tanja i divljenja
  samoj sebi, onda je ona miljama daleko od stremljenja ka istini. Stvari kojima se
  bavi, ono \u0161to gleda, slu\u0161a i na \u010demu marljivo radi, mogu biti donekle
  povezane s verom u Boga, ali one ne\u0107e imati nikakve veze sa stremljenjem ka
  istini, niti s njenim sprovo\u0111enjem u delo. Takav ishod je o\u010digledan. A
  budu\u0107i da one nemaju veze sa stremljenjem ka istini, niti sa njenim praktikovanjem,
  ta osoba ne\u0107e analizirati sebe, niti \u0107e imati znanje o samoj sebi. Ne\u0107e
  znati u kojoj je meri iskvarena, niti kako da praktikuje pokajanje, te je stoga
  jo\u0161 manje verovatno da \u0107e posti\u0107i istinsko pokajanje i privoleti
  Boga da promeni Svoje mi\u0161ljenje o njoj. Ako \u017eivi\u0161 u takvom stanju,
  a \u017eeli\u0161 da Bog preispita Svoj stav prema tebi, da te pomiluje i da te
  prizna, to \u0107e zaista biti te\u0161ko. \u0160ta ovde zna\u010di \u201eda te
  prizna\u201c? To zna\u010di da Bog priznaje ono \u0161to radi\u0161, da to odobrava
  i pamti. Ako nisi u stanju da stekne\u0161 i\u0161ta od toga, to dokazuje da ti,
  u onome \u0161to radi\u0161, u svojim naporima, izlivima svoje naravi i svom pona\u0161anju,
  ne stremi\u0161 ka istini. Pritom nije va\u017eno \u0161ta ti misli\u0161, a \u010dak
  i ako si u stanju da se donekle dobro pona\u0161a\u0161, to tvoje pona\u0161anje
  samo dokazuje da u tvojoj ljudskosti ima ne\u0161to savesti i razuma. Ta dobra pona\u0161anja,
  me\u0111utim, nisu manifestacija stremljenja ka istini, jer tvoja po\u010detna ta\u010dka,
  tvoje namere i motivi ne ukazuju na to da stremi\u0161 ka istini. Na osnovu \u010dega
  to ka\u017eem? Na osnovu toga da nijedna tvoja misao, postupak ili delo nemaju za
  cilj stremljenje ka istini i da oni sa istinom nemaju nikakve veze. Ako sve \u0161to
  \u010dovek \u010dini nije usmereno ka sticanju Bo\u017ejeg odobrenja i priznanja,
  onda ni\u0161ta od onoga \u0161to on uradi ne\u0107e mo\u0107i da dobije odobrenje
  ni priznanje od Boga, i o\u010dito je da se sva ta pona\u0161anja i postupci mogu
  nazvati samo dobrim ljudskim pona\u0161anjima. Ona ne ukazuju na to da taj \u010dovek
  praktikuje istinu, a svakako ne ukazuju da on ka istini stremi. Ljudi koji su naro\u010dito
  hiroviti i koji se \u010desto pona\u0161aju nepromi\u0161ljeno i samovoljno ne prihvataju
  sud i grdnju Bo\u017ejih re\u010di, niti prihvataju da budu orezani. Pored toga,
  oni \u010desto tra\u017ee izgovore za to \u0161to ne streme ka istini i \u0161to
  nisu u stanju da prihvate orezivanje. Kakva je, onda, njihova narav? O\u010digledno
  je da se radi o naravi kojoj je istina odbojna \u2013 o naravi Sotone. \u010covek
  je zaposednut Sotoninom prirodom i njegovom naravi, te stoga nema sumnje da ljudi
  pripadaju Sotoni. Oni su \u0111avoli, potomci Sotone i velike crvene a\u017edaje.
  Neki od njih su u stanju da priznaju da su \u0111avoli, Sotone i potomci velike
  crvene a\u017edaje, i veoma lepo govore o toj svojoj samospoznaji. Me\u0111utim,
  kad poka\u017eu svoju iskvarenu narav i kad ih neko razotkrijei ore\u017ee, oni
  \u0107e svim silama nastojati da se opravdaju i nikako ne\u0107e prihvatati istinu.
  O kakvom se problemu tu radi? Ovde oni bivaju potpuno razotkriveni. Ako ve\u0107
  tako lepo govore o vlastitoj samospoznaji, za\u0161to onda, kad se suo\u010de sa
  orezivanjem, ne mogu da prihvate istinu? Tu se javlja problem. Zar ovo nije prili\u010dno
  uobi\u010dajeno? Je li to lako uo\u010diti? Zapravo, jeste lako. Ima dosta ljudi
  koji, kad govore o samospoznaji, priznaju da su \u0111avoli i Sotone, ali se nakon
  toga niti kaju, niti menjaju. Da li je, dakle, ta samospoznaja o kojoj govore istinita
  ili la\u017ena? Jesu li oni uistinu spoznali sami sebe ili je to samo lukavstvo
  kojim \u017eele da druge ljude obmanu? Odgovor se name\u0107e sam po sebi. Prema
  tome, da biste saznali da li je neka osoba uistinu spoznala sebe, ne treba samo
  da je slu\u0161ate dok o tome pri\u010da \u2013 treba da vidite kakav je njen stav
  prema orezivanju, te da li je ona u stanju da prihvati istinu. To je ono \u0161to
  je najva\u017enije. Ko god ne prihvata orezivanje, taj u su\u0161tini ne prihvata
  istinu, odnosno, odbija da je prihvati, a narav mu je takva da joj je istina odbojna.
  U to nema nikakve sumnje. Pojedini ljudi ne dozvoljavaju drugima da ih ore\u017eu,
  bez obzira na koli\u010dinu iskvarenosti koju su razotkrili \u2013 niko ne sme da
  ih orezuje. O vlastitoj samospoznaji mogu govoriti kako im volja, ali ako ih neko
  drugi razotkrije, ako ih kritikuje ili orezuje, oni to ne\u0107e prihvatiti, ma
  koliko da je objektivno ili u skladu sa \u010dinjenicama. Ma kakav izliv iskvarene
  naravi da neko drugi razotkrije u njima, oni \u0107e prema toj osobi biti krajnje
  antagonisti\u010dki nastrojeni i stalno \u0107e davati la\u017ena opravdanja, bez
  imalo istinske pokornosti. Ako takvi ljudi ne streme ka istini, bi\u0107e nevolje.
  Unutar crkve, oni su nedodirljivi i besprekorni. Ako ljudi ka\u017eu ne\u0161to
  lepo o njima, to \u0107e ih usre\u0107iti; ako pak uka\u017eu na ne\u0161to lo\u0161e
  u vezi s njima, naljuti\u0107e se. Ako ih neko razotkrije i ka\u017ee im: \u201eTi
  si jedna dobra, ali veoma hirovita osoba. Uvek postupa\u0161 samovoljno i nepromi\u0161ljeno.
  Mora\u0161 prihvatiti da bude\u0161 podvrgnut orezivanju. Zar ne bi bolje bilo da
  se ratosilja\u0161 tih svojih mana i svoje iskvarene naravi?\u201c, oni \u0107e
  na to odgovoriti: \u201eNisam po\u010dinio nikakvo zlo. Nisam zgre\u0161io. Za\u0161to
  me orezuje\u0161? Kod ku\u0107e su mi od malih nogu svi uga\u0111ali, po\u010dev
  od mojih roditelja, pa do bake i deke. Ja sam njihovo mezim\u010de, zenica oka.
  A sada i ovde, u Bo\u017ejoj ku\u0107i, niko mi ni u \u010demu ne uga\u0111a \u2013
  nije nimalo zabavno \u017eiveti ovde! Stalno mi zamerate zbog neke od mojih mana
  i poku\u0161avate da me ore\u017eete. Kako da \u017eivim pod takvim okolnostima?\u201c
  O kakvom se problemu ovde radi? Oni pronicljiviji \u0107e odmah uvideti da su te
  ljude razmazili njihovi roditelji i porodica, te da oni \u010dak ni sada ne znaju
  da se pona\u0161aju niti da \u017eive samostalno. Porodica te je obo\u017eavala
  kao idola, a ti ne zna\u0161 svoje mesto u vaseljeni. U sebi si razvio poroke nadmenosti,
  samopravednosti i krajnje hirovitosti, kojih uop\u0161te nisi svestan i ne zna\u0161
  kako da ih preispita\u0161. Veruje\u0161 u Boga, ali ne slu\u0161a\u0161 Njegove
  re\u010di, niti sprovodi\u0161 istinu u delo. Mo\u017ee\u0161 li da stekne\u0161
  istinu s takvim verom u Boga? Mo\u017ee\u0161 li da zakora\u010di\u0161 u istina-stvarnost?
  Mo\u017ee\u0161 li da pro\u017eivi\u0161 istinsko obli\u010dje ljudskog bi\u0107a?
  Naravno da ne mo\u017ee\u0161. Ako veruje\u0161 u Boga, mora\u0161 barem da prihvati\u0161
  istinu i da spozna\u0161 samoga sebe. Jedino tako \u0107e\u0161 mo\u0107i da se
  promeni\u0161. Ako se u svojoj veri stalno oslanja\u0161 na vlastite predstave i
  ma\u0161tarije, ako tra\u017ei\u0161 samo mir i sre\u0107u, umesto da stremi\u0161
  ka istini, ako nisi sposoban da se iskreno pokaje\u0161 i ako ni za dlaku ne menja\u0161
  svoju \u017eivotnu dispoziciju, onda tvoja vera u Boga nema nikakvog smisla. Ako
  veruje\u0161 u Boga, mora\u0161 razumeti istinu. Mora\u0161 se potruditi da spozna\u0161
  samoga sebe. Ma \u0161ta da te zadesi, mora\u0161 tragati za istinom, mora\u0161
  se osloboditi svih oblika iskvarene naravi koja se iz tebe izliva, i to tako \u0161to
  \u0107e\u0161 sa drugima iskreno razgovarati o istini, u skladu s Bo\u017ejim re\u010dima.
  Ako ti neko uka\u017ee na tvoju iskvarenu narav ili ako samoinicijativno odlu\u010di\u0161
  da je li\u010dno istra\u017ei\u0161, ako si u stanju da je svesno uporedi\u0161
  s Bo\u017ejim re\u010dima, da se zagleda\u0161 u sebe, da samog sebe analizira\u0161
  i spozna\u0161, te da se zatim oslobodi\u0161 svog problema i da se pokaje\u0161,
  tada \u0107e\u0161 biti sposoban da \u017eivi\u0161 kao ljudsko bi\u0107e. Oni koji
  veruju u Boga moraju razumeti istinu. Ako, pak, sve vreme u\u017eiva\u0161 u tome
  da te \u010dlanovi porodice obo\u017eavaju, ako ti je drago \u0161to te smatraju
  zenicom oka i svojim mezim\u010detom, \u0161ta \u0107e\u0161 imati od toga? Ma koliko
  da te porodica smatra zenicom oka i svojim mezim\u010detom, ako ne poseduje\u0161
  istina-stvarnost, ti si obi\u010dno sme\u0107e. Vera u Boga ima vrednost samo ukoliko
  stremi\u0161 ka istini. Kad bude\u0161 razumeo istinu, zna\u0107e\u0161 kako da
  se pona\u0161a\u0161 i zna\u0107e\u0161 kako treba da \u017eivi\u0161 da bi iskusio
  istinsku sre\u0107u i postao bogougodna osoba. Nema tog porodi\u010dnog okru\u017eenja,
  nema te li\u010dne snage, zasluge ili dara, koji bi mogli da zamene istina-stvarnost,
  niti bi i\u0161ta od toga trebalo da ti slu\u017ei kao izgovor \u0161to ne stremi\u0161
  ka istini. Zadobijanje istine je jedina stvar koja ljudima mo\u017ee doneti istinsku
  sre\u0107u, omogu\u0107iti im da \u017eive smislenim \u017eivotom i pru\u017eiti
  im predivno odredi\u0161te. To su neosporne \u010dinjenice.\\nNeki ljudi, nakon
  \u0161to postanu vo\u0111e i delatnici unutar crkve, poveruju da su od zlata i da
  su time kona\u010dno dobili priliku da zablistaju punim sjajem. Zadovoljni su samima
  sobom i po\u010dinju da koriste svoje prednosti; pu\u0161taju na volju vlastitim
  ambicijama i pokazuju sve svoje sposobnosti. To su ljudi vi\u0161eg stale\u017ea
  i visoko obrazovani, ljudi koji imaju organizacione sposobnosti, kao i manire i
  dr\u017eanje vo\u0111e. Bili su najbolji \u0111aci u razredu i lideri saveza studenata,
  bili su direktori ili predsednici kompanija u kojima su radili, a kad su po\u010deli
  da veruju u Boga i zakora\u010dili u Njegovu ku\u0107u, izabrani su za vo\u0111e,
  te stoga ovako misle o sebi: \u201eNebo me nikad nije izneverilo. Neko ko je sposoban
  poput mene te\u0161ko uspeva da ne privu\u010de pa\u017enju okoline. \u010cim sam
  se povukao sa funkcije predsednika kompanije, do\u0161ao sam u Bo\u017eju ku\u0107u
  i preuzeo ulogu vo\u0111e. Ne bih mogao da budem obi\u010dan \u010dovek \u010dak
  ni kad bih to hteo. Ovim me Bog veli\u010da, ovo je ono \u0161to mi je On odredio
  da uradim, te \u0107u se tome pokoriti.\u201c Nakon \u0161to postanu vo\u0111e,
  oni koriste svoje iskustvo, znanje, organizacione sposobnosti i vlastiti stil rukovo\u0111enja.
  Sebe smatraju sposobnim i hrabrim, te istinski ve\u0161tim i nadarenim pojedincima.
  \u0160teta je, me\u0111utim, \u0161to u svemu tome ima jedan problem. \u0160ta ovi
  ve\u0161ti, nadareni vo\u0111e, sa uro\u0111enom sposobno\u0161\u0107u rukovo\u0111enja,
  najbolje rade u crkvi? Oni tu uspostavljaju svoje nezavisno carstvo, prisvajaju
  celokupnu vlast i vode glavnu re\u010d u svim raspravama. Nakon \u0161to postanu
  vo\u0111e, oni neprestano ne\u0161to rade, jurcaju unaokolo, trpe nevolje i pla\u0107aju
  visoku cenu, a sve zarad vlastitog presti\u017ea i statusa. Ni do \u010dega drugog
  im nije stalo. Veruju da su njihova marljivost i rad u skladu s Bo\u017ejim namerama,
  da nemaju iskvarenu narav, te da su kao takvi uvek potrebni crkvi, kao i svojoj
  crkvenoj bra\u0107i i sestrama. Veruju da nijedan posao ne bi mogao da se obavi
  bez njih, da sve mogu da preuzmu na sebe i da imaju monopol nad vla\u0161\u0107u.
  Uz to, veoma su ve\u0161ti u stvaranju vlastitog nezavisnog carstva. Sposobni su
  za sve \u0161to je inventivno i novo, naro\u010dito se dobro snalaze u ulozi zvani\u010dnika
  i u javnim obra\u0107anjima, a uve\u017ebani su i da drugima dr\u017ee predavanja
  sa visine. Ima, me\u0111utim, jedna va\u017ena stvar za koju nisu sposobni: nakon
  \u0161to postanu vo\u0111e, oni vi\u0161e nisu u stanju da sa drugima iskreno razgovaraju,
  da spoznaju sebe, da uo\u010de vlastitu iskvarenost, niti da saslu\u0161aju predloge
  svoje bra\u0107e i sestara. Ako neko tokom radnih diskusija iznese druga\u010dije
  ideje, ovi vo\u0111e \u0107e te ideje ne samo odbaciti, ve\u0107 \u0107e to odbacivanje
  ovako pravdati: \u201eNiste dobro promislili o svom predlogu. Ja sam crkveni vo\u0111a
  \u2013 ako postupim kako mi predla\u017eete i ni\u0161ta ne krene po zlu, sve \u0107e
  biti u redu, ali, ako i\u0161ta krene naopako, odgovornost \u0107u snositi samo
  ja. Prema tome, vi u ve\u0107ini slu\u010dajeva mo\u017eete slobodno da iznosite
  svoje mi\u0161ljenje \u2013 mi po\u0161tujemo tu formalnost \u2013 ali se na kraju
  jedino ja pitam i jedino ja odlu\u010dujem o na\u010dinu rada.\u201c S vremenom
  \u0107e ve\u0107ina bra\u0107e i sestara prestati da u\u010destvuje u diskusijama
  i razgovorima u vezi sa poslom, a njihovi se vo\u0111e ne\u0107e ni truditi da s
  njima razgovaraju o bilo kakvim problemima u radu. Nastavi\u0107e da donose odluke
  i da presu\u0111uju, ne govore\u0107i nikome ni re\u010d o tome, te \u0107e i dalje
  iznalaziti razna opravdanja za svoje postupke. Oni ovako razmi\u0161ljaju: \u201eCrkva
  pripada crkvenom vo\u0111i, a vo\u0111a je taj koji zacrtava kurs. Vo\u0111a ima
  poslednju re\u010d o pravcu u kom bra\u0107a i sestre idu i o stazi kojom kora\u010daju.\u201c
  Naravno, ovi vo\u0111e tada preuzimaju kontrolu nad ulaskom svoje bra\u0107e i sestara
  u \u017eivot, nad putem kojim oni idu i nad pravcem njihovog stremljenja. Kad jednom
  dobiju \u201ekapetanski \u010din\u201c, oni preuzimaju monopol nad vla\u0161\u0107u
  i stvaraju nezavisno carstvo. U njihovim potezima nema transparentnosti, i oni nesvesno
  potiskuju neke ljude i isklju\u010duju iz crkve pojedinu bra\u0107u i sestre koji
  streme ka istini i koji imaju sposobnost da je shvate. Za sve to vreme, oni i dalje
  smatraju da na taj na\u010din \u0161tite crkveno delo i interese Bo\u017ejeg izabranog
  naroda. Sve \u0161to rade je tako precizno obrazlo\u017eeno i pra\u0107eno tolikim
  obiljem opravdanja i izgovora \u2013 a kakva korist, na kraju, ispadne od toga?
  Sve je to usmereno isklju\u010divo ka za\u0161titi vlastitog statusa i monopola
  nad vla\u0161\u0107u. Oni svoja na\u010dela, na\u010din \u017eivota i pona\u0161anja
  iz sekularnog dru\u0161tva i vlastitog porodi\u010dnog \u017eivota donose u Bo\u017eju
  ku\u0107u, misle\u0107i da time \u0161tite njene interese. Pa ipak, oni nikad ne
  uspevaju da spoznaju same sebe, niti sebe preispituju. \u010cak i kad bi im neko
  ukazao na to da kr\u0161e istina-na\u010dela, \u010dak i kad bi se suo\u010dili
  s Bo\u017ejim prosve\u0107enjem, dovo\u0111enjem u red i grdnjom, oni toga uop\u0161te
  ne bi bili svesni. U \u010demu je njihov problem? Od onog dana kad preuzmu poziciju
  vo\u0111e, oni na svoju du\u017enost gledaju kao na karijeru, te su upravo stoga
  osu\u0111eni da idu putem antihrista i neminovno ostaju nesposobni da streme ka
  istini. Pa ipak, tokom \u010ditave te svoje \u201ekarijere\u201c, oni veruju da
  je sve \u0161to rade usmereno ka stremljenju ka istini. Kako oni gledaju na stremljenje
  ka istini? Tobo\u017ee \u0161tite\u0107i interese svoje bra\u0107e i sestara, kao
  i interese Bo\u017eje ku\u0107e, oni zapravo \u010duvaju sopstveni status i autoritet,
  veruju\u0107i da upravo time ispoljavaju svoje stremljenje ka istini. Ne znaju apsolutno
  ni\u0161ta o iskvarenoj naravi koja se iz njih manifestuje i izliva dok se nalaze
  na toj funkciji. \u010cak i ako im se ponekad nakratko u\u010dini da imaju iskvarenu
  narav koje se Bog gnu\u0161a, da im je narav zlobna i nepopustljiva, brzo \u0107e
  se predomisliti i re\u0107i \u0107e sebi: \u201eTo ne mo\u017ee tako. Ja sam vo\u0111a
  i moram biti dostojanstven poput vo\u0111e. Ne smem da dozvolim da moja bra\u0107a
  i sestre vide kako se iz mene izliva iskvarena narav.\u201c I tako, premda shvataju
  da su iz sebe izlili veliku koli\u010dinu iskvarenosti i da su mnogo toga radili
  suprotno na\u010delima samo da bi o\u010duvali vlastiti status i autoritet, kad
  ih neko razotkrije, oni pribegavaju govorni\u010dkim trikovima ili poku\u0161avaju
  to da spre\u010de, kako niko drugi ne bi saznao. \u010cim steknu autoritet i status,
  stavljaju se u polo\u017eaj neprikosnovenog sveca, smatraju\u0107i sebe velikim,
  ispravnim, besprekornim i van svake sumnje. Zauzev\u0161i takav polo\u017eaj, jednako
  se opiru i odbijaju svako suprotno mi\u0161ljenje, svaku sugestiju ili savet, koji
  bi mogli biti od koristi bra\u0107i i sestrama prilikom ulaska u \u017eivot, te
  doprineti crkvenom delu. Koje izgovore oni nude za to \u0161to ne streme ka istini?
  Ka\u017eu: \u201eJa posedujem status i ugledna sam osoba \u2013 to zna\u010di da
  imam dostojanstvo i da sam neprikosnoveni svetac.\u201c Mogu li oni da streme ka
  istini, budu\u0107i da iznalaze takve razloge i izgovore? (Ne.) Ne mogu. Oni uvek
  govore i deluju sa svog uzvi\u0161enog polo\u017eaja, dok istovremeno u\u017eivaju
  u pogodnostima svog statusa. \u010cine\u0107i to, oni su neprestano na udaru, usled
  \u010dega je neophodno da budu razotkriveni. Zar takvi ljudi nisu za \u017ealjenje?
  Jadni su i mizerni, a tako\u0111e i mrski \u2013 odvratni su! Kao vo\u0111e, oni
  se odenu u lik svetitelja. Svetac, veli\u010danstvena, slavna i ispravna osoba \u2013
  \u0161ta uop\u0161te zna\u010de sve te titule? One predstavljaju okove, i ko god
  ih na sebe stavi, taj vi\u0161e ne mo\u017ee da stremi ka istini. Ako neko samom
  sebi stavi te okove, on na taj na\u010din gubi svaku vezu sa stremljenjem ka istini.
  Koji je glavni razlog zbog kojeg ti ljudi ne streme ka istini? Razlog je, zapravo,
  u tome \u0161to su sputani svojim statusom. Oni u sebi uvek ovako razmi\u0161ljaju:
  \u201eJa sam vo\u0111a. Ja sam ovde glavni. Ja sam osoba od ugleda i statusa. Dostojanstvena
  sam osoba. Moja narav ne mo\u017ee biti nadmena, niti r\u0111ava. Ne mogu ja da
  otvorim du\u0161u i da u zajedni\u0161tvu raspravljam o svojoj iskvarenoj naravi
  \u2013 moram da sa\u010duvam svoje dostojanstvo i presti\u017e. Moram da nateram
  ljude da se ugledaju na mene i da me po\u0161tuju.\u201c Uvek su sputani ovim stvarima,
  tako da nisu u stanju da otvore du\u0161u, niti da se preispitaju i spoznaju sami
  sebe. To ih uni\u0161tava. Da li su njihovi stavovi i pogled na svet u skladu sa
  istinom? Sasvim je o\u010digledno da nisu. Da li pona\u0161anja koja oni obi\u010dno
  pokazuju prilikom izvr\u0161avanja svojih du\u017enosti \u2013 nadmenost i samopravednost,
  stavljanje sebe iznad zakona, pretvaranje, lukavstvo i tome sli\u010dno \u2013 da
  li ti postupci predstavljaju stremljenje ka istini? (Ne.) Jasno je kao dan da ni\u0161ta
  od toga ne predstavlja stremljenje ka istini. A \u0161ta navode kao opravdanje,
  odnosno razlog zbog kojeg ne streme ka istini? (Oni misle da su vo\u0111e zapravo
  dostojanstveni ljudi visokog statusa, te da se, \u010dak i ako imaju iskvarenu narav,
  ta njihova narav ne mo\u017ee razotkriti.) Zar to nije krajnje apsurdno stanovi\u0161te?
  Ako neka osoba priznaje da ima iskvarenu narav, ali pritom ne dopu\u0161ta da se
  ona razotkrije, da li je onda ta osoba neko ko prihvata istinu? Ako ti, kao vo\u0111a,
  nisi u stanju da prihvati\u0161 istinu, kako \u0107e\u0161 onda iskusiti Bo\u017eje
  delo? Kako da tvoja iskvarenost bude o\u010di\u0161\u0107ena? A ako tvoja iskvarenost
  ne mo\u017ee da se o\u010distiti i ti nastavlja\u0161 da \u017eivi\u0161 sa svojom
  iskvarenom naravi, ti si onda vo\u0111a koji ne mo\u017ee prakti\u010dno da deluje
  \u2013 ti si la\u017eni vo\u0111a. Ta\u010dno je da, kao vo\u0111a, poseduje\u0161
  status, ali tu se samo radi o druga\u010dijem poslu, druga\u010dijoj du\u017enosti
  \u2013 to ne zna\u010di da si postao \u010dovek od ugleda. To \u0161to si stekao
  takav status i \u0161to obavlja\u0161 druga\u010diju du\u017enost ne zna\u010di
  da si dostojanstveniji od drugih, niti da si postao osoba od naro\u010ditog ugleda.
  Ako zaista postoje ljudi koji ovako razmi\u0161ljaju, zar oni nisu bestidni? (Jesu.)
  Kako bi se to moglo kazati da zvu\u010di vi\u0161e \u017eargonski? Oni su drski
  i bezobrazni, zar ne? Kad nisu na poziciji vo\u0111e, oni se prema drugima pona\u0161aju
  iskreno; u stanju su da otvoreno govore o svojim izlivima iskvarenosti i da detaljno
  analiziraju svoju iskvarenu narav. Me\u0111utim, \u010dim zauzmu vode\u0107u poziciju,
  oni postaju potpuno druga\u010dije osobe. Za\u0161to ka\u017eem da postaju potpuno
  druga\u010dije osobe? Zato \u0161to na lice navla\u010de masku, iza koje ostaje
  skrivena njihova prava li\u010dnost. Ta maska ne odaje nikakve izraze, ni pla\u010d
  ni smeh, ni zadovoljstvo ni bes, ni tugu ni radost, nikakve emocije ni \u017eelje
  \u2013 a svakako ne odaje ni njihovu iskvarenu narav. U svakom trenutku, stanje
  i izraz maske ostaju isti, dok sva istinska stanja vo\u0111e, njegove privatne misli
  i ideje, ostaju skriveni iza maske, gde niko ne mo\u017ee da ih vidi. Ima crkvenih
  vo\u0111a i delatnika koji za sebe uvek misle da imaju visok ugled i status. U\u017easavaju
  se od mogu\u0107nosti da izgube dostojanstvo prilikom orezivanja, te stoga ne prihvataju
  istinu. Iz svog statusa i autoriteta crpe nadahnu\u0107e za sladunjave, la\u017ene
  re\u010di, kojima prikrivaju svoju iskvarenu narav. U isto vreme, pogre\u0161no
  veruju da ih njihov status izdvaja od drugih i \u010dini svetijim, te da stoga ne
  moraju da streme ka istini \u2013 da ka istini treba da streme drugi. Takvo je razmi\u0161ljanje
  pogre\u0161no, a donekle i besramno i nerazumno. Eto, tako se ovakve osobe pona\u0161aju.
  U svojoj su\u0161tini, pona\u0161anje takvih ljudi jasno pokazuje da oni ne streme
  ka istini. Umesto toga, oni te\u017ee statusu i presti\u017eu. Dok delaju, oni \u010duvaju
  svoj status i autoritet, i zavaravaju se misle\u0107i da streme ka istini. Nalik
  su Pavlu, jer \u010desto prave rezime poslova koje su obavili i du\u017enosti koje
  su izvr\u0161ili, zadataka koje su u okviru crkvene delatnosti ispunili, kao i svojih
  postignu\u0107a tokom obavljanja dela Bo\u017eje ku\u0107e. Oni sve to \u010desto
  sumiraju, ba\u0161 kao kad je Pavle rekao: \u201eDobru sam bitku izborio, trku sam
  dovr\u0161io, veru sam sa\u010duvao. Osim toga, ve\u0107 mi je pripravljen venac
  pravednosti\u201c (2. Timoteju 4:7-8). Time je zapravo hteo da ka\u017ee da je,
  nakon \u0161to je dovr\u0161io svoju trku i dobro se izborio, do\u0161lo vreme da
  se izra\u010duna kolika mu je \u0161ansa za spasenje, koliki je njegov doprinos
  i kolika \u0107e mu biti nagrada, kao i da zamoli Boga da nagradi njegov doprinos.
  Hteo je da ka\u017ee da Boga ne\u0107e smatrati pravednim Bogom ukoliko ga On ne
  nagradi krunom, da \u0107e odbiti da Mu se pokori i da \u0107e se \u010dak i po\u017ealiti
  na nepravednost Bo\u017eju. Da li jedna ovakva osoba, s takvim na\u010dinom razmi\u0161ljanja
  i takvom naravi, stremi ka istini? Je li to neko ko se zaista pokorava Bogu? Mogu
  li takvi ljudi da sebe prepuste na milost i nemilost Bo\u017ejim orkestracijama?
  Zar to nije ve\u0107 na prvi pogled o\u010digledno? Misle da to \u0161to tr\u010de
  svoje trke i \u0161to vojuju bitke predstavlja stremljenje ka istini, a zapravo
  ih istina uop\u0161te ne zanima i oni ni\u010dim ne pokazuju da zaista streme ka
  njoj \u2013 oni, dakle, nisu ljudi koji streme ka istini.\\nKoje smo od \u010dovekovih
  problema, kroz ovaj na\u0161 razgovor, primarno razotkrili? Konkretnije govore\u0107i,
  koje smo iskvarene ljudske naravi prvenstveno razotkrili tokom dana\u0161njeg razgovora?
  Osnovna odlika te naravi jeste da je \u010doveku istina odbojna i da on odbija da
  je prihvati; to je jedna vrlo specifi\u010dna vrsta pona\u0161anja. Slede\u0107a
  glavna odlika je ne\u0161to \u0161to postoji u narav-su\u0161tini svakog \u010doveka:
  nepopustljivost. Ona se tako\u0111e ispoljava sasvim konkretno i o\u010digledno,
  zar ne? (Tako je.) Ovo su dva glavna na\u010dina ispoljavanja i izlivanja \u010dovekove
  iskvarene naravi. Te specifi\u010dne vrste pona\u0161anja, ti specifi\u010dni pogledi
  na svet, stavovi i tome sli\u010dno, istinito i ta\u010dno ilustruju \u010dinjenicu
  da u iskvarenoj ljudskoj naravi zaista ima elemenata odbojnosti prema istini. Naravno,
  ono \u0161to je u \u010dovekovoj naravi izrazitije jesu manifestacije nepopustljivosti:
  \u0161ta god da Bog govori i kakve god se iskvarene ljudske naravi razotkrivaju
  tokom obavljanja Bo\u017ejeg dela, ljudi tvrdoglavo odbijaju da to priznaju i opiru
  se tome. Naravno, osim o\u010diglednog otpora i prezrivog odbacivanja, postoji jo\u0161
  jedna vrsta pona\u0161anja, koja se ogleda u tome da se ljudi uop\u0161te ne bave
  Bo\u017ejim delom, kao da ono nema nikakve veze s njima. \u0160ta zapravo zna\u010di
  ne baviti se Bogom? To je ono kad neko ka\u017ee: \u201eMo\u017ee\u0161 Ti da pri\u010da\u0161
  \u0161ta ho\u0107e\u0161 \u2013 to se mene uop\u0161te ne ti\u010de. Ni\u0161ta
  od Tvog suda i razotkrivanja nema nikakve veze sa mnom. Ja to ne prihvatam, niti
  priznajem.\u201c Mo\u017eemo li ovakav stav nazvati \u201enepopustljivim\u201c?
  (Mo\u017eemo.) To je ispoljavanje nepopustljivosti. Takvi \u0107e ljudi re\u0107i:
  \u201e\u017divim kako mi se prohte, na na\u010din koji je za mene udoban i koji
  me \u010dini sre\u0107nim. \u010cak i ako ispoljavam pona\u0161anja o kojima Ti
  govori\u0161, kao \u0161to su nadmenost, la\u017eljivost, odbojnost prema istini,
  r\u0111avost, pakost i tome sli\u010dno \u2013 pa \u0161ta onda? Ne\u0107u ih analizirati,
  upoznavati niti prihvatati. Ja, naprosto, tako verujem u Boga, i \u0161ta mi mo\u017ee\u0161?\u201c
  U ovakvom se stavu ogleda nepopustljivost. Ako se ljudi ne bave Bo\u017ejim re\u010dima
  i ako na njih ne obra\u0107aju pa\u017enju, \u0161to zna\u010di da jednodu\u0161no
  ignori\u0161u Boga ma \u0161ta da On govori, bilo da im se obra\u0107a u formi podse\u0107anja,
  upozorenja ili saveta \u2013 bez obzira na na\u010din govora koji koristi i bez
  obzira na izvore i ciljeve Njegovog govora \u2013 onda je stav takvih ljudi nepopustljiv.
  To zna\u010di da oni ne obra\u0107aju pa\u017enju na goru\u0107u nameru Bo\u017eju,
  a jo\u0161 manje na Njegovu iskrenu i dobronamernu \u017eelju da ljude spase. \u0160ta
  god Bog \u010dinio, ljudi nisu re\u0161eni da u tome sara\u0111uju i nisu voljni
  da te\u017ee ka istini. \u010cak i ako priznaju da su Bo\u017eji sud i otkrivenje
  u potpunosti istiniti, u njihovim srcima nema kajanja i oni nastavljaju da veruju
  kao i pre. Na kraju, nakon \u0161to su odslu\u0161ali brojne propovedi, oni i dalje
  ponavljaju jedno te isto: \u201eJa sam, u svakom slu\u010daju, istinski vernik,
  nisam lo\u0161 \u010dovek, nikome ne bih namerno u\u010dinio ni\u0161ta na\u017eao,
  u stanju sam da se odreknem nekih stvari, mogu da istrpim neda\u0107e i spreman
  sam da platim cenu za svoju veru. Bog me ne\u0107e napustiti.\u201c Zar nije i Pavle
  upravo tako govorio: \u201eDobru sam bitku izborio, trku sam dovr\u0161io, veru
  sam sa\u010duvao. Osim toga, ve\u0107 mi je pripravljen venac pravednosti\u201c?
  Ljudi imaju takav stav. A kakva se narav krije iza takvog stava? Nepopustljiva narav.
  Je li te\u0161ko promeniti nepopustljivu narav? Ima li na\u010dina da se to postigne?
  Najjednostavniji i najneposredniji metod jeste da promeni\u0161 svoj stav prema
  Bo\u017ejim re\u010dima i prema S\u0203mom Bogu. Kako da preina\u010di\u0161 taj
  svoj stav? Tako \u0161to \u0107e\u0161 detaljno analizirati i spoznati stanja i
  na\u010dine razmi\u0161ljanja koji proizlaze iz tvog nepopustljivog stava, i tako
  \u0161to \u0107e\u0161 razmotriti koji se tvoji postupci i re\u010di, koja stanovi\u0161ta
  i namere, pa \u010dak i koje od konkretnih misli i ideja koje izliva\u0161, nalaze
  pod uticajem tvoje nepopustljive naravi. Dobro prou\u010di i pojedina\u010dno razre\u0161i
  svako od tih pona\u0161anja, izliva i stanja, a zatim ih okreni naopa\u010dke \u2013
  \u010dim neko od njih otkrije\u0161 i prou\u010di\u0161, po\u017euri da ga \u0161to
  pre izokrene\u0161. Primera radi, ba\u0161 smo malo\u010das razgovarali o delanju
  na osnovu vlastitih sklonosti i raspolo\u017eenja, \u0161to je definicija hirovitosti.
  Hirovita narav nosi sa sobom odbojnost prema istini. Ako ustanovi\u0161 da i sam
  pripada\u0161 takvoj vrsti ljudi, s tako iskvarenom naravi, ako ne preispituje\u0161
  sebe niti traga\u0161 za istinom kako bi se takve naravi oslobodio, tvrdoglavo umi\u0161ljaju\u0107i
  da je s tobom sve u redu, to je nepopustljivost. Mo\u017eda \u0107e\u0161, nakon
  ove propovedi, iznenada shvatiti: \u201eI ja sam takve stvari govorio i imam takve
  stavove. Moja je narav takva da mi je istina odbojna. Po\u0161to tako stoje stvari,
  pristupi\u0107u razre\u0161enju svoje naravi.\u201c Kako \u0107e\u0161, dakle, pristupiti
  tom razre\u0161enju? Za po\u010detak, odrekni se tog svog ose\u0107aja nadmo\u0107i,
  svoje hirovitosti i svoje samovolje; bez obzira da li si dobro ili lo\u0161e raspolo\u017een,
  pogledaj \u0161ta to Bog od tebe zahteva. Ako si u stanju da se pobuni\u0161 protiv
  tela i da deluje\u0161 u skladu s Bo\u017ejim zahtevima, kako \u0107e On gledati
  na tebe? Ako zaista mo\u017ee\u0161 da zapo\u010dne\u0161 sa re\u0161avanjem svoje
  iskvarene naravi, to je znak da pozitivno i proaktivno sara\u0111uje\u0161 sa Bo\u017ejim
  delom. Po\u010de\u0107e\u0161 svesno da se buni\u0161 protiv naravi kojoj je istina
  odbojna i da je se osloba\u0111a\u0161, a ujedno \u0107e\u0161 se re\u0161iti i
  svoje nepopustljive naravi. Kad se bude\u0161 re\u0161io obeju svojih iskvarenih
  naravi, mo\u0107i \u0107e\u0161 da se pokori\u0161 Bogu i da Mu udovolji\u0161,
  a to \u0107e se Njemu jako dopasti. Ako ste razumeli sadr\u017eaj ove besede i ako
  na ovaj na\u010din budete praktikovali pobunu protiv tela, bi\u0107u veoma sre\u0107an
  zbog toga. To \u0107e zna\u010diti da vam nisam uzalud sve ovo govorio.\\nNepopustljivost
  je problem koji proizlazi iz iskvarene naravi; to je ne\u0161to \u0161to postoji
  u \u010dovekovoj prirodi i \u0161to nije lako razre\u0161iti. Kad neko ima nepopustljivu
  narav, to se uglavnom ispoljava kroz sklonost ka iznala\u017eenju opravdanja i klimavih
  argumenata, ka upornom pridr\u017eavanju vlastitih ideja i te\u0161kom prihvatanju
  novina. Ima trenutaka kad ljudi shvate da su im ideje pogre\u0161ne, ali ih se i
  dalje uporno dr\u017ee zbog vlastite sujete i ponosa, ostaju\u0107i do kraja tvrdoglavi.
  Takvu nepopustljivu narav je te\u0161ko transformisati, \u010dak i kada je \u010dovek
  svestan nje. Da bi razre\u0161io problem nepopustljivosti, \u010dovek mora da poznaje
  nadmenost, la\u017eljivost, zlobu, odbojnost prema istini i druge sli\u010dne naravi.
  Kad \u010dovek spozna vlastitu nadmenost, la\u017eljivost, zlobu, kad shvati da
  mu je istina odbojna, da ne \u017eeli da se pobuni protiv svog tela uprkos tome
  \u0161to \u017eeli da primenjuje istinu, kad shvati da se stalno pravda i da drugima
  obja\u0161njava svoje te\u0161ko\u0107e iako \u017eeli da se pokori Bogu, bi\u0107e
  mu lako da prizna kako ima problem sa nepopustljivo\u0161\u0107u. Da bi taj problem
  razre\u0161io, \u010dovek najpre mora imati normalan ljudski razum i mora po\u010deti
  tako \u0161to \u0107e nau\u010diti da slu\u0161a Bo\u017eje re\u010di. Ako \u017eeli\u0161
  da bude\u0161 Bo\u017eja ovca, mora\u0161 nau\u010diti da slu\u0161a\u0161 Njegove
  re\u010di. A kako treba da ih slu\u0161a\u0161? Tako \u0161to \u0107e\u0161 slu\u0161ati
  sve one, za tebe bitne, probleme koje On u Svojim re\u010dima razotkriva. Kad god
  nai\u0111e\u0161 na neki takav problem, treba da ga prihvati\u0161; ne sme\u0161
  verovati da je to problem nekih drugih ljudi, problem koji svi ljudi imaju, ili
  problem \u010ditavog \u010dove\u010danstva, koji s tobom nema nikakve veze. Bilo
  bi pogre\u0161no da u tako ne\u0161to poveruje\u0161. Treba da se preispita\u0161
  kako bi, kroz otkrivenje Bo\u017ejih re\u010di, uvideo da li i s\u0203m poseduje\u0161
  neka od iskvarenih stanja ili iskrivljenih stavova koje Bog razotkriva. Primera
  radi, kad \u010duje\u0161 Bo\u017eje re\u010di kojima se otkrivaju manifestacije
  nadmene naravi koja se iz \u010doveka izliva, treba da se zapita\u0161: \u201ePokazujem
  li i ja znakove nadmenosti? Po\u0161to sam i s\u0203m iskvareno ljudsko bi\u0107e,
  mora da i ja pokazujem neke od tih manifestacija; treba da se preispitam u vezi
  s tim. Ljudi ka\u017eu da sam nadmen, da se uvek pona\u0161am kao da sam bolji i
  ja\u010di od drugih, da sputavam ljude dok govorim. Je li moja narav zaista takva?\u201c
  Putem takvog preispitivanja, na kraju \u0107e\u0161 shvatiti da je otkrivenje Bo\u017ejih
  re\u010di u potpunosti ta\u010dno \u2013 da si ti jedna nadmena osoba. A budu\u0107i
  da je otkrivenje Bo\u017ejih re\u010di sasvim ta\u010dno, da se savr\u0161eno i
  bez trunke neslaganja poklapa s tvojom situacijom, te da se nakon dubljeg razmi\u0161ljanja
  \u010dini jo\u0161 ta\u010dnijim, treba da prihvati\u0161 sud i grdnju iz Njegovih
  re\u010di i da, u skladu s njima, razazna\u0161 i spozna\u0161 su\u0161tinu svoje
  iskvarene naravi. Tek tada \u0107e\u0161 mo\u0107i da oseti\u0161 iskreno kajanje.
  Veruju\u0107i u Boga, samog sebe mo\u017ee\u0161 spoznati jedino tako \u0161to \u0107e\u0161
  jesti i piti Njegove re\u010di. Da bi re\u0161io svoje iskvarene naravi, mora\u0161
  prihvatiti sud i razotkrivanje posredstvom Bo\u017ejih re\u010di. Ako nisi u stanju
  da to uradi\u0161, ni na koji na\u010din ne\u0107e\u0161 mo\u0107i da odbaci\u0161
  svoje iskvarene naravi. Ako si pametan i ako uvi\u0111a\u0161 da je otkrivenje Bo\u017ejih
  re\u010di, u osnovi, ta\u010dno, ili priznaje\u0161 da je barem polovina Njegovih
  re\u010di ta\u010dna, onda treba odmah da ih prihvati\u0161 i da se pokori\u0161
  Bogu. Osim toga, mora\u0161 se moliti Bogu i preispitivati s\u0203mog sebe. Tek
  tada \u0107e\u0161 shvatiti da su sve Bo\u017eje re\u010di otkrivenja ta\u010dne,
  da sve te re\u010di predstavljaju ni\u0161ta manje do su\u0161te \u010dinjenice.
  Jedino kroz pokoravanje Bogu bogoboja\u017eljivim srcem, ljudi mogu istinski preispitivati
  sebe. Tek tada \u0107e mo\u0107i da u sebi otkriju raznorazne iskvarene naravi i
  da shvate da su uistinu nadmeni i samopravedni, bez trunke razuma. Ako \u010dovek
  ljubi istinu, mo\u0107i \u0107e da padne ni\u010dice pred Boga, mo\u0107i \u0107e
  da Mu prizna svoju duboku iskvarenost i bi\u0107e spreman da prihvati Njegov sud
  i grdnju. Na taj na\u010din, ljudima \u0107e se u srcu javiti kajanje, po\u010de\u0107e
  da negiraju i mrze sami sebe i za\u017eali\u0107e \u0161to nisu ranije po\u010deli
  da streme ka istini, misle\u0107i: \u201eZa\u0161to nisam mogao da prihvatim sud
  i grdnju Bo\u017ejih re\u010di \u010dim sam po\u010deo da ih \u010ditam? Moj stav
  prema Njegovim re\u010dima bio je nadmen, zar ne? Kako sam mogao da budem toliko
  nadmen?\u201c Nakon \u0161to u nekom periodu budu \u010desto preispitivali sebe
  na ovaj na\u010din, shvati\u0107e da su zaista nadmeni, da ne mogu u potpunosti
  da priznaju da su Bo\u017eje re\u010di istinite i \u010dinjeni\u010dne, te da zaista
  nemaju ni trunke razuma. Spoznati samog sebe, me\u0111utim, nije nimalo lako. Svaki
  put kad preispituje sebe, \u010dovek mo\u017ee da stekne tek malo ve\u0107e i malo
  dublje znanje o sebi. Sticanje jasnog znanja o vlastitoj iskvarenoj naravi nije
  ne\u0161to \u0161to se mo\u017ee posti\u0107i za kratko vreme; \u010dovek mora vi\u0161e
  da \u010dita Bo\u017eje re\u010di, vi\u0161e da se moli i \u010de\u0161\u0107e da
  preispituje sebe. Jedino tako \u0107e postepeno spoznati samoga sebe. Svi koji istinski
  poznaju sebe, u pro\u0161losti su vi\u0161e puta do\u017eivljavali neuspeh i posrtali,
  nakon \u010dega su \u010ditali Bo\u017eje re\u010di, molili se Bogu i preispitivali
  sebe, te na taj na\u010din uvideli istinu o vlastitoj iskvarenosti i osetili da
  su zaista bili duboko iskvareni i potpuno li\u0161eni istina-stvarnosti. Ako bude\u0161
  ovako do\u017eivljavao Bo\u017eje delo, ako se bude\u0161 molio Bogu i tra\u017eio
  istinu kad te ne\u0161to zadesi, postepeno \u0107e\u0161 i ti spoznati sebe. A onda
  \u0107e ti, jednog dana, u srcu kona\u010dno biti jasno: \u201eMo\u017eda i jesam
  ne\u0161to boljeg kova u odnosu na druge ljude, ali to mi je od Boga dato. Stalno
  se hvalim, nastojim da nadma\u0161im druge ljude kad govorim i poku\u0161avam da
  ih navedem da rade na moj na\u010din. Zaista mi nedostaje razum \u2013 ovo je \u010dista
  nadmenost i samopravednost! Preispituju\u0107i sebe, spoznao sam vlastitu nadmenu
  narav. To su Bo\u017eje prosve\u0107enje i blagodat, i ja sam Mu na njima zahvalan!\u201c
  Da li je dobro ili lo\u0161e kad neko spozna vlastitu iskvarenu narav? (Dobro je.)
  Kad to postignete, treba da te\u017eite ka tome da govorite i postupate razumno
  i poslu\u0161no, da budete ravnopravni sa drugima, da se prema drugim ljudima pona\u0161ate
  pravedno i da ih ne sputavate, da ispravno gledate na svoje kvalitete, talente,
  prednosti i tome sli\u010dno. Na taj \u0107e na\u010din va\u0161a nadmena narav
  biti razre\u0161ena, ba\u0161 kao \u0161to se stena pretvara u prah pod upornim
  udarcima \u010deki\u0107a. Kad nakon toga budete stupali u odnose s drugim ljudima
  ili sara\u0111ivali s njima u obavljanju neke du\u017enosti, mo\u0107i \u0107ete
  korektno da se odnosite prema njihovim stavovima i da ih pomno i pa\u017eljivo saslu\u0161ate.
  A kad \u010duje\u0161 kako zastupaju neki ispravan stav, pomisli\u0107e\u0161: \u201eIzgleda
  da ipak nisam osoba najboljega kova. \u010cinjenica je da svaki \u010dovek ima svoje
  prednosti i da drugi ljudi uop\u0161te nisu inferiorni u odnosu na mene. Ranije
  sam uvek mislio da sam boljeg kova u odnosu na druge. A zapravo se radilo o samoobo\u017eavanju
  i uskogrudoj neukosti. Moji pogledi na svet bili su veoma ograni\u010deni, kao u
  \u017eabe na dnu bunara. Takvo razmi\u0161ljanje zaista nije imalo nikakvog smisla
  \u2013 i bilo je bestidno! Bio sam zaslepljen i zaglu\u0161en vlastitom nadmenom
  naravi. Tu\u0111e re\u010di nisu dopirale do mene, smatrao sam da sam bolji od njih
  i da sam u pravu, a zapravo ni od koga nisam nimalo bolji!\u201c Tog \u0107e\u0161
  trenutka ste\u0107i pravi uvid i znanje o vlastitim nedostacima i o svom sitnom
  rastu. A nakon toga, dok sa drugima bude\u0161 razgovarao, pa\u017eljivo \u0107e\u0161
  oslu\u0161kivati njihove stavove i shvati\u0107e\u0161 da: \u201eIma toliko ljudi
  koji su bolji od mene. Moj kov i sposobnost razumevanja su, u najboljem slu\u010daju,
  osrednji.\u201c Zar sa ovom spoznajom ne\u0107ete ste\u0107i barem malo samosvesti?
  Kada to do\u017eivite i kada budete \u010desto preispitivali sebe u skladu s Bo\u017ejim
  re\u010dima, do\u0107i \u0107ete do istinske samospoznaje, koja \u0107e se svakim
  danom sve vi\u0161e produbljivati. Mo\u0107i \u0107ete da prozrete istinu o svojoj
  iskvarenosti, o svom siroma\u0161tvu i jadu, o svojoj \u017ealosnoj ru\u017eno\u0107i,
  i tada \u0107ete biti odbojni sami sebi i prezreti svoju iskvarenu narav. Tada \u0107e
  vam biti lako da se pobunite protiv sebe. Tako se do\u017eivljava Bo\u017eje delo.
  Morate, u skladu s Bo\u017ejim re\u010dima, preispitivati svoje izlive iskvarenosti.
  Konkretnije govore\u0107i, nakon \u0161to u bilo kojoj situaciji otkrijete iskvarenu
  narav, morate \u010desto preispitivati i spoznavati sebe. Tada \u0107e vam biti
  lako da jasno uo\u010dite svoju iskvarenu su\u0161tinu i u srcu \u0107ete mo\u0107i
  da osetite mr\u017enju prema svojoj iskvarenosti, prema svom telu i prema Sotoni.
  Ujedno \u0107ete biti u stanju da od srca zavolite istinu i da stremite ka njoj.
  Na taj na\u010din, tvoja nadmena narav po\u010de\u0107e lagano da gasne i ti \u0107e\u0161
  je, malo po malo, sasvim odbaciti. Bi\u0107e\u0161 sve razumniji i bi\u0107e ti
  lak\u0161e da se pokori\u0161 Bogu. U o\u010dima drugih, izgleda\u0107e\u0161 stabilnije
  i utemeljenije, a tvoje \u0107e re\u010di zvu\u010dati objektivnije. Bi\u0107e\u0161
  sposoban da saslu\u0161a\u0161 druge i da\u0107e\u0161 im vremena da govore. Kad
  uvidi\u0161 da su drugi u pravu, bi\u0107e ti lako da prihvati\u0161 njihove re\u010di,
  i tvoji odnosi s ljudima ne\u0107e vi\u0161e biti toliko zahtevni. Sa svima \u0107e\u0161
  mo\u0107i skladno da sara\u0111uje\u0161. Ako svoju du\u017enost bude\u0161 tako
  obavljao, zar onda ne\u0107e\u0161 imati razuma i ljudskosti? Upravo tako se \u010dovek
  re\u0161ava te vrste iskvarene naravi.\\nHajde da sada malo porazgovaramo o na\u010dinu
  re\u0161avanja iskvarenih naravi kroz pitanje nepopustljivosti, koje sam malo\u010das
  spomenuo. Da bi se oslobodio svoje iskvarene naravi, \u010dovek najpre mora biti
  u stanju da prihvati istinu. A prihvatiti istinu zna\u010di prihvatiti Bo\u017eji
  sud i grdnju, odnosno prihvatiti Njegove re\u010di kojima se razotkriva su\u0161tina
  ljudske iskvarenosti. Ako na osnovu Bo\u017ejih re\u010di spozna\u0161 i detaljno
  analizira\u0161 izlive vlastite iskvarenosti, svoja iskvarena stanja, kao i svoje
  iskvarene namere i pona\u0161anja, i ako bude\u0161 u stanju da otkrije\u0161 su\u0161tinu
  svojih problema, ste\u0107i \u0107e\u0161 znanje o svojoj iskvarenoj naravi i pokrenu\u0107e\u0161
  proces njenog re\u0161avanja. S druge strane, ako ne bude\u0161 na ovaj na\u010din
  prakti\u010dno delovao, ne samo \u0161to ne\u0107e\u0161 mo\u0107i da se re\u0161i\u0161
  svoje nepopustljive naravi, ve\u0107 ni na koji na\u010din ne\u0107e\u0161 mo\u0107i
  da iskoreni\u0161 svoje iskvarene naravi. Svaka osoba poseduje vi\u0161e iskvarenih
  naravi. Kako bi \u010dovek trebalo da po\u010dne da ih se osloba\u0111a? Najpre
  treba da se re\u0161i vlastite nepopustljivosti, jer nepopustljiva narav ljude spre\u010dava
  da se pribli\u017ee Bogu, da tragaju za istinom i da Mu se pokore. Nepopustljivost
  je najve\u0107i kamen spoticanja koji \u010doveku onemogu\u0107ava da se moli i
  da u zajedni\u0161tvu razgovara s Bogom; to je ono \u0161to u najve\u0107oj meri
  ometa \u010dovekov normalan odnos prema Bogu. Nakon \u0161to se re\u0161ite svoje
  nepopustljive naravi, lako \u0107ete se osloboditi i svih ostalih sklonosti. A osloba\u0111anje
  od iskvarene naravi zapo\u010dinje preispitivanjem i spoznajom samog sebe. Oslobodite
  se svih iskvarenih naravi kojih ste svesni \u2013 \u0161to vi\u0161e njih spoznate,
  to \u0107ete ve\u0107eg broja njih mo\u0107i da se re\u0161ite; \u0161to je dublje
  va\u0161e znanje o njima, temeljnije \u0107ete mo\u0107i ih se oslobodite. To je
  proces osloba\u0111anja od iskvarenih naravi; to osloba\u0111anje se posti\u017ee
  molitvom, preispitivanjem i spoznajom samog sebe i detaljnom analizom su\u0161tine
  svoje iskvarene naravi posredstvom Bo\u017ejih re\u010di, sve dok \u010dovek ne
  bude u stanju da se pobuni protiv svog tela i da praktikuje istinu. Spoznavanje
  su\u0161tine vlastite iskvarene naravi nije nimalo jednostavan zadatak. Samospoznaja
  se ne sastoji samo u tome da uop\u0161teno ka\u017eete: \u201eJa sam iskvarena osoba;
  ja sam \u0111avo; ja sam potomak Sotone i velike crvene a\u017edaje; opirem se Bogu
  i neprijateljski sam raspolo\u017een prema Njemu; ja sam Njegov neprijatelj.\u201c
  Takve re\u010di ne zna\u010de nu\u017eno da ste uistinu spoznali vlastitu iskvarenost.
  Mo\u017eda ste ih samo nau\u010dili od nekog drugog, a da pritom jo\u0161 uvek ne
  znate mnogo o sebi. Istinska samospoznaja nije zasnovana na u\u010denju ili rasu\u0111ivanju,
  ve\u0107 na Bo\u017ejim re\u010dima \u2013 ona se sastoji u sagledavanju posledica
  iskvarenih naravi i patnje koju ste zbog njih pretrpeli, kao i od svesti o tome
  da va\u0161a iskvarena narav ne \u0161teti samo vama, ve\u0107 i drugim ljudima.
  Ona podrazumeva shvatanje \u010dinjenice da sve iskvarene sklonosti poti\u010du
  od Sotone, da su one Sotonini otrovi i filozofije, te da su krajnje neprijateljski
  nastrojene prema istini i Bogu. Tek kad prozrete su\u0161tinu ovog problema, spozna\u0107ete
  svoju iskvarenu narav. Neki ljudi, \u010dak i nakon \u0161to priznaju da su \u0111avoli
  i Sotone, i dalje ne prihvataju orezivanje. Oni ne priznaju da su i\u0161ta lo\u0161e
  uradili, niti da su ugrozili istinu. U \u010demu je njihov problem? U tome \u0161to
  jo\u0161 uvek nisu spoznali sami sebe. Iako neki ljudi za sebe ka\u017eu da su \u0111avoli
  i Sotone, kad biste ih upitali: \u201eZa\u0161to ka\u017ee\u0161 da si \u0111avo
  i Sotona?\u201c, oni ne bi znali da vam odgovore. To pokazuje da oni ne poznaju
  svoju iskvarenu narav, niti svoju priroda-su\u0161tinu. Kad bi mogli da vide da
  je njihova priroda \u0111avolska, da je njihova iskvarena narav zapravo Sotonina
  narav i da priznaju da su zbog toga \u0111avoi Sotona, tek tada bi spoznali svoju
  priroda-su\u0161tinu. Istinska samospoznaja posti\u017ee se razotkrivanjem, sudom,
  praktikovanjem i do\u017eivljavanjem Bo\u017ejih re\u010di. Ona se posti\u017ee
  kroz razumevanje istine. Ako \u010dovek ne razume istinu, onda je sve \u0161to on
  govori o vlastitoj samospoznaji, \u0161ta god to bilo, \u0161uplje i neprakti\u010dno,
  zato \u0161to on nije u stanju da prona\u0111e niti da shvati ono \u0161to le\u017ei
  u korenu stvari i \u0161to je su\u0161tinsko. Da bi spoznao samog sebe, \u010dovek
  mora da prizna koje je iskvarene sklonosti pokazivao u konkretnim situacijama, kakva
  mu je pritom bila namera, kako se pona\u0161ao, \u010dime je bio one\u010di\u0161\u0107en
  i za\u0161to nije mogao da prihvati istinu. Tek kad bude bio u stanju da sve to
  jasno iska\u017ee, mo\u0107i \u0107e da spozna sebe. Kad se suo\u010de s orezivanjem,
  neki ljudi priznaju da im je istina odbojna, da su prepuni sumnje i nerazumevanja
  prema Bogu i da se \u010duvaju od Njega. Oni tako\u0111e priznaju da su istinite
  sve Bo\u017eje re\u010di koje \u010doveka razotkrivaju i sude mu. To pokazuje da
  oni poseduju izvestan stepen samospoznaje. Ta njihova samospoznaja je, me\u0111utim,
  prili\u010dno plitka, zato \u0161to oni ne znaju ni\u0161ta o Bogu, niti o Njegovom
  delu, i zato \u0161to ne razumeju Njegove namere. Ako neko samo priznaje vlastitu
  iskvarenost, ali pritom nije prona\u0161ao uzrok svojih problema, mogu li se onda
  razre\u0161iti njegove sumnje, nerazumevanje i odbrambeni stav prema Bogu? Naravno
  da ne mogu. Upravo stoga je samospoznaja mnogo vi\u0161e od pukog priznanja vlastite
  iskvarenosti i vlastitih problema \u2013 uz to, \u010dovek mora da razume istinu
  i da u korenu razre\u0161i problem svoje iskvarene naravi. To je jedini na\u010din
  da se pronikne u istinu o vlastitoj iskvarenosti i da se dostigne istinsko pokajanje.
  Kad oni koji vole istinu spoznaju sami sebe, oni ujedno postaju sposobni da tragaju
  za istinom i da je razumeju, kako bi re\u0161ili svoje probleme. Samo takva vrsta
  samospoznaje daje rezultate. Kad god u Bo\u017ejim re\u010dima nai\u0111e na neku
  frazu kojom se \u010dovek razotkriva i osu\u0111uje, neko ko voli istinu \u0107e,
  pre svega, poverovati da su Bo\u017eje re\u010di koje \u010doveka razotkrivaju stvarne
  i \u010dinjeni\u010dne, da Bo\u017eje re\u010di koje \u010doveku sude jesu istina,
  i da one predstavljaju Bo\u017eju pravednost. Oni koji vole istinu moraju, u najmanju
  ruku, biti u stanju da to priznaju. Ako neko ne veruje \u010dak ni Bo\u017ejim re\u010dima,
  niti veruje da su Bo\u017eje re\u010di koje \u010doveka razotkrivaju i sude mu \u010dinjeni\u010dne
  i istinite, mo\u017ee li on da kroz Njegove re\u010di spozna samoga sebe? Naravno
  da ne \u2013 \u010dak i kad bi hteo, on to ne bi mogao da u\u010dini. Ako \u010dvrsto
  veruje\u0161 da sve Bo\u017eje re\u010di jesu istina i ako u sve te re\u010di veruje\u0161,
  bez obzira \u0161ta je to \u0161to Bog izgovara i na koji na\u010din to \u010dini,
  ako si u stanju da u Bo\u017eje re\u010di poveruje\u0161 i da ih prihvati\u0161
  \u010dak i onda kad ih ne razume\u0161, bi\u0107e ti lako da kroz te re\u010di sebe
  preispita\u0161 i spozna\u0161. Vlastito preispitivanje mora biti zasnovano na istini.
  U to nema nikakve sumnje. Jedino su Bo\u017eje re\u010di istina \u2013 nijedna od
  ljudskih re\u010di i nijedna od Sotoninih re\u010di nisu istina. Sotona je hiljadama
  godina kvario ljudski rod najrazli\u010ditijim u\u010denjima, poukama i teorijama,
  usled \u010dega su ljudi toliko otupeli i postali tako glupi da ne samo \u0161to
  ni\u0161ta ne znaju o sebi samima, ve\u0107 podr\u017eavaju razne jeresi i zablude
  i odbijaju da prihvate istinu. Takve je ljude nemogu\u0107e spasti. Oni koji poseduju
  istinsku veru u Boga veruju da su samo Njegove re\u010di istina, u stanju su da
  sami sebe spoznaju na osnovu Bo\u017ejih re\u010di i istine, te da tako dostignu
  istinsko pokajanje. Neki ljudi uop\u0161te ne streme ka istini; oni sebe preispituju
  samo na osnovu ljudskih u\u010denja i ne priznaju ni\u0161ta drugo osim svog gre\u0161nog
  pona\u0161anja, ali pritom nisu u stanju da proniknu u su\u0161tinu vlastite iskvarenosti.
  Takva samospoznaja je uzaludan poduhvat, koji ne daje nikakve rezultate. Preispitivanje
  samoga sebe mora biti zasnovano na Bo\u017ejim re\u010dima, nakon \u010dega \u010dovek
  postepeno spoznaje iskvarene sklonosti koje te re\u010di razotkrivaju. \u010covek
  mora biti u stanju da na osnovu istine izmeri i spozna vlastite nedostatke, svoju
  ljudskost-su\u0161tinu, svoje stavove o razli\u010ditim stvarima, svoje \u017eivotne
  poglede i vrednosti, te da zatim do\u0111e do ta\u010dne procene i suda o svemu
  tome. Na taj na\u010din, on \u0107e postepeno mo\u0107i da stekne znanje o samome
  sebi. Samospoznaja, me\u0111utim, postaje sve dublja sa pove\u0107anjem \u010dovekovog
  \u017eivotnog iskustva, te je stoga \u010doveku nemogu\u0107e da u potpunosti pronikne
  u vlastitu priroda-su\u0161tinu pre nego \u0161to zadobije istinu. Ako neka osoba
  uistinu poznaje samu sebe, uvide\u0107e da iskvarena ljudska bi\u0107a zaista jesu
  potomci Sotone i njegovo otelovljenje. Oseti\u0107e da ne zaslu\u017euje da \u017eivi
  pred Bogom, da je nedostojne Njegove ljubavi i spasenja, i bi\u0107e u stanju da
  padne ni\u010dice pred Njega. Samo oni koji su sposobni za takav nivo znanja uistinu
  poznaju sami sebe. Samospoznaja je preduslov za ulazak u istina-stvarnost. Ako neko
  \u017eeli da praktikuje istinu i da zakora\u010di u stvarnost, mora poznavati samoga
  sebe. Svi ljudi imaju iskvarene naravi i stalno su, uprkos samima sebi, sputani
  i kontrolisani tim svojim iskvarenim naravima. Oni nisu u stanju da praktikuju istinu,
  niti da se pokore Bogu. Ako, dakle, \u017eele to da postignu, najpre moraju da spoznaju
  sebe i da se oslobode svojih iskvarenih naravi. Samo kroz proces osloba\u0111anja
  od iskvarene naravi \u010dovek mo\u017ee razumeti istinu i ste\u0107i znanje o Bogu;
  jedino tako \u0107e mo\u0107i da se pokori Bogu i da svedo\u010di za Njega. Na taj
  se na\u010din sti\u010de istina. Proces ulaska u istina-stvarnost jeste proces razre\u0161enja
  vlastite iskvarene naravi. \u0160ta, dakle, \u010dovek treba da u\u010dini da bi
  se oslobodio svoje iskvarene naravi? Kao prvo, mora spoznati svoju iskvarenu su\u0161tinu.
  To, konkretno, zna\u010di da mora da spozna kako je njegova iskvarena narav nastala
  i koje su od Sotoninih \u0111avolskih re\u010di i zabluda koje je prihvatio dovele
  do toga. Nakon \u0161to, na osnovu Bo\u017ejih re\u010di, bude u potpunosti shvatio
  i me\u0111usobno razlikovao ove osnovne uzroke, \u010dovek vi\u0161e ne\u0107e hteti
  da \u017eivi po svojoj iskvarenoj naravi, ve\u0107 \u0107e \u017eeleti samo da se
  pokori Bogu i da \u017eivi prema Njegovim re\u010dima. Kad god bude ispoljio neku
  od svojih iskvarenih naravi, mo\u0107i \u0107e da je prepozna, da je odbaci i da
  pobuni protiv svog tela. Ako bude ovako prakti\u010dno delovao i do\u017eivljavao
  stvari, postepeno \u0107e sasvim odbaciti svoju iskvarenu narav.\\nNeki ljudi ka\u017eu:
  \u201eKad sam pro\u010ditao Bo\u017eje re\u010di razotkrivanja i osude, preispitao
  sam sebe i shvatio da sam nadmen, la\u017eljiv, sebi\u010dan, r\u0111av, nepopustljiv
  i li\u0161en ljudskosti.\u201c Ima \u010dak i onih koji za sebe ka\u017eu da su
  izuzetno nadmeni, da su poput zveri, da su \u0111avoli i Sotone. Da li se ovde radi
  o istinskoj samospoznaji? Pod uslovom da govore iz srca i da ne kopiraju druge,
  to pokazuje da su oni barem donekle stekli odre\u0111enu samospoznaju; pitanje je
  samo da li je ta samospoznaja plitka ili duboka. Ukoliko pak samo kopiraju druge
  i ponavljaju tu\u0111e re\u010di, onda to nije prava samospoznaja. Znanje o vlastitoj
  iskvarenoj naravi mora biti konkretno, do najsitnije teme i stanja \u2013 to zna\u010di
  da njime moraju biti obuhva\u0107ene pojedinosti poput stanja, izliva, pona\u0161anja,
  misli i ideja koje se odnose na vlastitu iskvarenu narav. Jedino tako \u0107e \u010dovek
  mo\u0107i da spozna samoga sebe. A kada \u010dovek uistinu sebe spozna, srce \u0107e
  mu se ispuniti kajanjem i posta\u0107e sposoban da se iskreno pokaje. Koja je prva
  stvar koju \u010dovek mora da praktikuje da bi se pokajao? (Mora da prizna sopstvene
  gre\u0161ke.) \u201ePriznati sopstvene gre\u0161ke\u201c nije pravi na\u010din da
  se to izrazi; ovde se pre radi o priznavanju i spoznaji da \u010dovek ima odre\u0111ene
  iskvarene sklonosti. Nije u pravu onaj koji ka\u017ee da njegova iskvarena narav
  predstavlja nekakvu gre\u0161ku. Iskvarena narav je ne\u0161to \u0161to pripada
  ne\u010dijoj prirodi, ne\u0161to \u0161to tom osobom upravlja. To nije isto \u0161to
  i samo jedanput po\u010dinjena gre\u0161ka. Neki ljudi se, nakon \u0161to otkriju
  vlastitu iskvarenost, ovako mole Bogu: \u201eOh, Bo\u017ee, pogre\u0161io sam. \u017dao
  mi je.\u201c Ovo je neta\u010dno. Prikladnije bi bilo \u201epriznati greh\u201c.
  Specifi\u010dan na\u010din na koji ljudi praktikuju pokajanje jeste samospoznaja
  i re\u0161avanje vlastitih problema. Kad neka osoba poka\u017ee svoju iskvarenu
  narav ili po\u010dini nekakav prestup, i pritom shvati da se opire Bogu i da kod
  Njega izaziva mr\u017enju, ona tada treba da se preispita i da spozna sebe u odgovaraju\u0107im
  Bo\u017ejim re\u010dima. Ona \u0107e, na osnovu toga, ste\u0107i izvesno znanje
  o svojoj iskvarenoj naravi i prizna\u0107e da ona poti\u010de od Sotoninih otrova
  i iskvarenosti. Nakon toga, kad otkrije na\u010dela za praktikovanje istine i uspe
  da sprovede istinu u delo, istinski \u0107e se pokajati. Ma kakvu iskvarenost da
  ta osoba poka\u017ee, ako je u stanju da najpre spozna svoju iskvarenu narav, te
  da zatim traga za istinom kako bi tu svoju narav razre\u0161ila i napokon po\u010dne
  da istinu sprovodi u delo, to \u0107e biti pravo pokajanje. Neki ljudi znaju pone\u0161to
  o sebi, ali u njima nema znakova pokajanja, niti bilo kakvog svedo\u010danstva o
  tome da istinu sprovode u delo. Ako i nakon sticanja samospoznaje ostanu nepromenjeni,
  oni \u0107e biti daleko od istinskog pokajanja. Da bi postigao istinsko pokajanje,
  \u010dovek se mora re\u0161iti svoje iskvarene naravi. Kako bi, dakle, trebalo konkretno
  praktikovati i zakora\u010diti u re\u0161avanje vlastitih iskvarenih sklonosti?
  Evo jednog primera. Ljudi su la\u017eljive naravi i stalno la\u017eu i obmanjuju.
  Ako to shvata\u0161, onda se najprostije i najneposrednije na\u010delo prakti\u010dnog
  delovanja u cilju osloba\u0111anja od vlastite la\u017eljivosti sastoji u tome da
  bude\u0161 po\u0161ten, da govori\u0161 istinu i da radi\u0161 po\u0161teno. Gospod
  Isus je rekao: \u201eSamo recite \u2019da\u2019 kada ne\u0161to tvrdite, i \u2019ne\u2019
  kada ne\u0161to pori\u010dete.\u201c Da bi bio po\u0161ten, \u010dovek treba da
  sledi na\u010dela Bo\u017ejih re\u010di. Ovo jednostavno prakti\u010dno na\u010delo
  je najefikasnije, a i lako ga je razumeti i primenjivati u praksi. Ljudima je, me\u0111utim,
  prili\u010dno te\u0161ko da praktikuju istinu, budu\u0107i da su tako duboko iskvareni,
  da svi imaju sotonsku prirodu i da \u017eive prema sotonskim sklonostima. Hteli
  bi da budu po\u0161teni, ali ne mogu. Ne mogu odoleti porivu da la\u017eu i da se
  bave prevarama; mada \u0107e se ponekad mo\u017eda i pokajati nakon \u0161to to
  prepoznaju u sebi, oni i dalje ne\u0107e biti u stanju da se oslobode stega vlastite
  iskvarene naravi, ve\u0107 \u0107e nastaviti da la\u017eu i varaju po starom. Kako
  bi ovaj problem trebalo re\u0161avati? Re\u0161enje se, jednim delom, sastoji u
  spoznaji da je su\u0161tina iskvarene naravi ru\u017ena i odvratna, te u sposobnosti
  da se ona iz dna du\u0161e mrzi; drugi deo re\u0161enja sastoji se u uve\u017ebavanju
  prakti\u010dnog delovanja u skladu s istina-na\u010delom, koje glasi: \u201eSamo
  recite \u2019da\u2019 kada ne\u0161to tvrdite, i \u2019ne\u2019 kada ne\u0161to
  pori\u010dete.\u201c Ako ovo na\u010delo sprovodi\u0161 u praksi, na\u0107i \u0107e\u0161
  se u procesu osloba\u0111anja od vlastite la\u017eljive naravi. Naravno, ako si
  u stanju da, prilikom osloba\u0111anja od svoje la\u017eljive naravi, deluje\u0161
  u skladu sa istina-na\u010delima, time \u0107e\u0161 manifestovati vlastito preobra\u017eenje
  i po\u010detak svog iskrenog pokajanja, \u0161to Bog odobrava. To zna\u010di da
  \u0107e Bog, kad se bude\u0161 preobratio, promeniti Svoje mi\u0161ljenje o tebi.
  U stvari, to \u0161to Bog bude u\u010dinio bi\u0107e neka vrsta opro\u0161taja za
  \u010dovekovu iskvarenu narav i buntovni\u0161tvo. On ljudima pra\u0161ta i zaboravlja
  na njihove grehe i prestupe. Jesam li bio dovoljno konkretan? Jeste li razumeli
  sve ovo? Evo jo\u0161 jednog primera. Zamislimo da poseduje\u0161 nadmenu narav
  i da si prili\u010dno svojevoljan, ma \u0161ta da te zadesi \u2013 stalno bi da
  bude\u0161 glavni, da te drugi slu\u0161aju i da rade ono \u0161to im ti ka\u017ee\u0161
  da urade. Jednoga dana, me\u0111utim, shvata\u0161 da je svemu tome uzrok tvoja
  nadmena narav. Tvoje priznanje da uzrok le\u017ei u tvojoj nadmenoj naravi predstavlja
  prvi korak ka samospoznaji. Nakon toga, u Bo\u017ejim re\u010dima treba da potra\u017ei\u0161
  nekoliko odlomaka u kojima se nadmena narav razotkriva, te da vlastitu narav uporedi\u0161
  s tim re\u010dima, preispita\u0161 se i spozna\u0161 samoga sebe. Ako ustanovi\u0161
  da je takvo pore\u0111enje sasvim na mestu, ako prizna\u0161 da u tebi postoji nadmena
  narav koju Bog razotkriva, ako zatim razlu\u010di\u0161 i otkrije\u0161 odakle poti\u010de
  i zbog \u010dega je nastala tvoja nadmena narav, te koji Sotonini otrovi, jeresi
  i zablude upravljaju njome, tada \u0107e\u0161, nakon \u0161to si do sr\u017ei prou\u010dio
  sva ova pitanja, dopreti do korena vlastite nadmenosti. Eto, to je istinska samospoznaja.
  Kad bude\u0161 do\u0161ao do preciznije definicije na\u010dina razotkrivanja ove
  iskvarene naravi, to \u0107e ti omogu\u0107iti da lak\u0161e stekne\u0161 dublje
  i prakti\u010dnije znanje o samom sebi. \u0160ta je slede\u0107e \u0161to treba
  da uradite? Treba da potra\u017eite istina-na\u010dela u Bo\u017ejim re\u010dima
  i da razumete koje sve vrste \u010dovekovog pona\u0161anja i govora predstavljaju
  manifestacije normalne ljudskosti. Kad jednom prona\u0111ete put prakti\u010dnog
  delovanja, morate delovati u skladu s Bo\u017ejim re\u010dima, a kad se va\u0161e
  srce bude preobratilo, posti\u0107i \u0107ete istinsko pokajanje. Ne samo \u0161to
  \u0107e va\u0161e re\u010di i postupci biti zasnovani na na\u010delima, ve\u0107
  \u0107ete tako\u0111e pro\u017eiveti ljudski lik i postepeno odbaciti svoju iskvarenu
  narav. Drugi \u0107e u vama videti jednu potpuno novu osobu: ne\u0107ete vi\u0161e,
  kao nekad, biti ona stara, iskvarena osoba, ve\u0107 osoba preporo\u0111ena u Bo\u017ejim
  re\u010dima. Takva osoba je ona \u010dija je \u017eivot-narav pretrpela promenu.\\nSpoznati
  samog sebe nije jednostavan zadatak. To se posti\u017ee prihvatanjem istine, kao
  i praktikovanjem i do\u017eivljavanjem Bo\u017ejih re\u010di, dok se istinska samospoznaja
  mo\u017ee posti\u0107i isklju\u010divo prihvatanjem Bo\u017ejeg suda i grdnje. Oni
  koji nisu iskusili sud i grdnju mogu, u najboljem slu\u010daju, priznati gre\u0161ke
  koje su po\u010dinili i stvari koje pogre\u0161no uradili. Njima \u0107e biti jako
  te\u0161ko da jasno sagledaju vlastitu priroda-su\u0161tinu. Zbog \u010dega vernici
  iz Doba blagodati, \u010dak i nakon \u0161to su prestali da \u010dine odre\u0111ene
  grehe i svoje pona\u0161anje promenili nabolje, nikada nisu uspeli da preobrate
  svoje \u017eivot-naravi? Za\u0161to su se opirali Bogu, pa Ga \u010dak i izdali,
  iako su verovali u Njega? Iskvarenom \u010dove\u010danstvu je te\u0161ko da prepozna
  izvor ovog problema. Za\u0161to svi ljudi imaju sotonske naravi? To je zato \u0161to
  je Sotona iskvario ljude i \u0161to su oni prihvatili njegove \u0111avolske re\u010di
  i filozofije. Upravo to je izrodilo iskvarene naravi i upravo tako je Sotonina narav
  postala izvor \u010dovekovog otpora prema Bogu. To je ljudima najte\u017ee da prepoznaju.
  Svoje delo suda u poslednjim danima Bog obavlja zato da bi ljude spasao od uticaja
  Sotone i da bi razre\u0161io izvor ljudskog greha i otpora prema Bogu. Sotona je
  ljude kvario hiljadama godina i njegova je priroda pustila korenje u ljudskim srcima.
  Stoga se nijedna vrsta iskvarene naravi ne mo\u017ee re\u0161iti niti odbaciti nakon
  samo jednog ili dva poku\u0161aja preispitivanja i spoznavanja samoga sebe. Iskvarene
  naravi stalno iznova naviru, te stoga ljudi treba da prihvate istinu i da povedu
  dugotrajnu bitku protiv vlastitih sotonskih naravi, sve dok kona\u010dno ne savladaju
  Sotonu. Tek tada \u0107e u potpunosti mo\u0107i da odbace svoju iskvarenu narav.
  Prema tome, ljudi moraju neprestano da se mole Bogu, da tragaju za istinom, da se
  preispituju, da spoznaju sebe i da praktikuju istinu, sve dok iz njih ne prestane
  da izbija iskvarenost, dok se njihova \u017eivot-narav ne promeni i dok ne postanu
  pokorni Bogu. Tek tada \u0107e od Boga dobiti priznanje. Ishodi svake od ovih bitaka
  mo\u017eda ne\u0107e biti odmah o\u010digledni, a mo\u017eda \u0107ete kod sebe
  i kasnije razotkrivati iskvarene sklonosti. Mo\u017eda \u0107e\u0161 se ose\u0107ati
  pomalo negativno i obeshrabreno, ali ne\u0107e\u0161 hteti da odustane\u0161 i nastavi\u0107e\u0161
  uporno da se trudi\u0161, ugledaju\u0107i se na Boga i oslanjaju\u0107i se na Njega.
  Ako u tome istraje\u0161, nakon dve-tri godine \u0107e\u0161 zaista biti u stanju
  da istinu sprovodi\u0161 u delo, a srce \u0107e ti biti ispunjeno mirom i rado\u0161\u0107u.
  Tada \u0107e\u0161 jasno uvideti da je svaki tvoj neuspeh, svaki u\u010dinjeni napor
  i svaki dobitak bio dobar znak da si na pravom putu ka preobra\u017eaju vlastite
  naravi i ka tome da Boga privoli\u0161 da promeni Svoje mi\u0161ljenje o tebi. Iako
  je za ljudsku svest svaka promena neprimetna, preobra\u017eaj naravi do kojeg dolazi
  sa svakim zaokretom ne mo\u017ee se posti\u0107i uz pomo\u0107 nijedne druge stvari
  ili aktivnosti. Ovo je put koji se mora prevaliti prilikom promene vlastite naravi
  i \u017eivot-ulaska. Ovako se mora sprovoditi u delo te\u017enja za promenom naravi.
  Svakako, ljudi bi trebalo precizno da razumeju kako se ta\u010dno odigrava promena
  naravi: to nije nekakva iznenadna, tektonska promena, koja sa sobom nosi iznena\u0111enje
  i odu\u0161evljenost, kako to ljudi zami\u0161ljaju. Ova se promena ne de\u0161ava
  na taj na\u010din. Re\u010d je o promeni koja se de\u0161ava nesvesno, lagano i
  korak po korak. Kad \u010dovek bude u stanju da sprovede istinu u delo, zadobi\u0107e
  ne\u0161to. Kada se, nakon \u0161to ovim putem bude\u0161 kora\u010dao tri, pet
  ili deset godina, osvrne\u0161 unazad, iznenadi\u0107e\u0161 se kad otkrije\u0161
  da se za tih deset godina tvoja narav zna\u010dajno promenila i da si sada potpuno
  druga\u010dija osoba. Pritom se tvoja li\u010dnost i temperament, tvoj stil \u017eivota
  i tome sli\u010dno, mo\u017eda ne\u0107e bitnije promeniti, ali \u0107e zato tvoje
  sklonosti, stanja i pona\u0161anja koja prosipa\u0161 unaokolo biti sasvim drugi
  svet, ba\u0161 kao da si uistinu postao neko drugi. Zbog \u010dega dolazi do ovakve
  promene? Zbog toga \u0161to \u0107e\u0161, tokom tih deset godina, nebrojeno puta
  biti podvrgavan sudu, grdnji, orezivanju, proveri i oplemenjivanju posredstvom Bo\u017ejih
  re\u010di, i \u0161to \u0107e\u0161 shvatiti mnoge istine. Sve \u0107e to zapo\u010deti
  promenom tvog gledanja na stvari, tvog pogleda na \u017eivot i tvojih vrednosti,
  nakon \u010dega \u0107e uslediti promena tvoje \u017eivot-naravi i temelja na koje
  se oslanja\u0161 da bi pre\u017eiveo \u2013 a paralelno s tim promenama, postepeno
  \u0107e\u0161 se pretvarati u sasvim drugog, novog \u010doveka. Iako tvoja li\u010dnost,
  temperament, na\u010din \u017eivota, pa \u010dak i tvoj govor i dr\u017eanje mogu
  ostati nepromenjeni, tvoja \u0107e se \u017eivot-narav promeniti, a to ve\u0107
  predstavlja temeljnu, su\u0161tinsku promenu. Koji znaci ukazuju na promenu naravi?
  Kako se ta promena konkretno ispoljava? Ona zapo\u010dinje promenom \u010dovekovog
  gledanja na stvari \u2013 to je ono kada se brojni neverni\u010dki stavovi, koje
  neka osoba u sebi gaji, menjaju zajedno s njenim boljim razumevanjem istine, pribli\u017eavaju\u0107i
  se sve vi\u0161e istini Bo\u017ejih re\u010di. To je prva faza promene naravi. Osim
  toga, kroz preispitivanje i spoznaju samoga sebe, ljudi se mogu usredsrediti na
  sprovo\u0111enje istine u delo. Preispituju\u0107i razne svoje namere, motive, misli
  i ideje, svoje predstave, gledi\u0161ta i stavove koji se iz njih ra\u0111aju, ljudi
  mogu uo\u010diti vlastite probleme i po\u010deti da ose\u0107aju kajanje zbog njih.
  Tada \u0107e oni mo\u0107i da se pobune protiv svog tela i da sprovedu istinu u
  delo. A \u010dine\u0107i to, oni \u0107e jo\u0161 vi\u0161e ceniti Bo\u017eje re\u010di
  i istinu, i prizna\u0107e da je Hristos istina, put i \u017eivot. Bi\u0107e spremniji
  da slede Hrista i da Mu se pokore, oseti\u0107e da Bog izra\u017eava istine kako
  bi \u010doveka razotkrio, sudio mu i grdio ga, i kako bi promenio iskvarenu narav
  ljudsku, te da Bog na taj na\u010din spasava i usavr\u0161ava \u010doveka na uistinu
  prakti\u010dan na\u010din. Oseti\u0107e da bez Bo\u017ejeg suda i grdnje, kao i
  bez opskrbe i smernica koje pru\u017eaju Njegove re\u010di, ljudi ni na koji na\u010din
  ne bi mogli da postignu spasenje, niti bi mogli da po\u017eanju takve nagrade. Zavole\u0107e
  Bo\u017eje re\u010di i oseti\u0107e da od njih zavise u stvarnom \u017eivotu, oseti\u0107e
  da su im Njegove re\u010di potrebne kako bi ih snabdevale, vodile i utirale im put.
  Srca \u0107e im biti spokojna, a kad ih ne\u0161to zadesi, nesvesno \u0107e tragati
  za Bo\u017ejim re\u010dima, koje \u0107e im poslu\u017eiti kao osnova, i traga\u0107e
  u tim re\u010dima za na\u010delima i putevima prakti\u010dnog delovanja. To je jedan
  od rezultata koji se posti\u017eu samospoznajom. A tu je i drugi: ljudi se prema
  svojim izlivima iskvarene naravi vi\u0161e ne\u0107e odnositi kao nekad, sa nepopustljivim
  stavom. Umesto toga, mo\u0107i \u0107e da umire svoja srca i da Bo\u017eje re\u010di
  slu\u0161aju sa stavom po\u0161tenog \u010doveka, i bi\u0107e u stanju da prihvate
  istinu i pozitivne stvari. To zna\u010di da oni, kad budu ispoljavali svoju iskvarenu
  narav, ne\u0107e vi\u0161e biti isti kao pre \u2013 nepopustljivi, te\u0161ko ukrotivi,
  divlje agresivni, nadmeni, drski i pakosni \u2013 umesto toga, proaktivno \u0107e
  preispitivati sami sebe i sticati znanje o svojim realnim problemima. Mo\u017eda
  ne\u0107e spoznati su\u0161tinu svoje iskvarene naravi, ali \u0107e zato mo\u0107i
  da na\u0111u svoj mir, da se mole Bogu i da tragaju za istinom, nakon \u010dega
  \u0107e priznati svoje probleme i svoju iskvarenu narav, pokajati se pred Bogom
  i \u010dvrsto re\u0161iti da se ubudu\u0107e druk\u010dije pona\u0161aju. To je
  u potpunosti stav pokorne osobe. Na taj na\u010din, oni \u0107e ste\u0107i srce
  koje se pokorava Bogu. \u0160ta god da Bog ka\u017ee, \u0161ta god da zatra\u017ei
  od njih, kakav god posao da obavlja i ma kakvo okru\u017eenje da za njih ure\u0111uje,
  ljudima \u0107e biti lako da se tome pokore. Njihove iskvarene naravi ne\u0107e
  im vi\u0161e predstavljati tako veliku prepreku, i oni \u0107e ih lako re\u0161avati
  i prevazilaziti. Tada \u0107e mo\u0107i da bez imalo napora sprovode istinu u delo
  i da dostignu pokornost Bogu. To su znaci koji ukazuju na promenu naravi. Ako je
  neko u stanju da sprovede istinu u delo i da se iskreno pokori Bogu, slobodno se
  mo\u017ee re\u0107i da je njegova \u017eivot-narav ve\u0107 pretrpela promenu \u2013
  i to istinsku promenu, onu koja se u potpunosti posti\u017ee stremljenjem ka istini.
  A sva pona\u0161anja koja ljudi ispoljavaju tokom tog procesa, bilo da se radi o
  pozitivnom pona\u0161anju ili uobi\u010dajenoj negativnosti i slabosti, neophodna
  su i neumitna. Budu\u0107i da postoje pozitivna, tako isto moraju postojati i pona\u0161anja
  koje odra\u017eavaju negativnost i slabost \u2013 ta negativnost i slabost su, me\u0111utim,
  samo privremene. \u010cim data osoba bude ostvarila odre\u0111eni rast, po\u010de\u0107e
  da pokazuje sve manje negativnih, slabih stanja, a sve vi\u0161e pozitivnih pona\u0161anja
  i ulazaka, pa \u0107e njeni postupci biti sve principijelniji. Takva osoba je neko
  ko se pokorava Bogu, i neko \u010dija se \u017eivot-narav promenila nakon \u010di\u0161\u0107enja
  vlastitih iskvarenih sklonosti. Mo\u017ee se re\u0107i da su to rezultati koje ljudi
  koji streme ka istini posti\u017eu kroz podvrgavanje sudu i grdnji posredstvom Bo\u017ejih
  re\u010di, kao i vi\u0161estrukim orezivanjem, njihovim testiranjem i oplemenjivanjem.\\nBudu\u0107i
  da su do sada svi ve\u0107 \u010duli i razumeli konkretne, normalne procese stremljenja
  ka istini, ljudi vi\u0161e ne bi smeli da izmi\u0161ljaju razna opravdanja ni izgovore
  za to \u0161to im je istina odbojna, \u0161to joj se opiru ili \u0161to ne streme
  ka njoj. Po\u0161to ste razumeli ove istine i jasno sagledali problem, mo\u017eete
  li sada da prepoznate sva ona opravdanja i izgovore koje ljudi daju da ne bi stremili
  ka istini? Ako vam neka starija osoba ka\u017ee: \u201eJa sam star. Nisam vi\u0161e
  motivisan ni pun elana kao neki mladi\u0107. Sa godinama sam izgubio silovitost
  i mladala\u010dku ambiciju, i vi\u0161e se ne pona\u0161am nadmeno. Besmislica je,
  dakle, to \u0161to ka\u017ee\u0161 da sam nadmen, jer ja to zaista nisam!\u201c
  Da li je takva osoba u pravu? (Ne.) O\u010digledno da nije. Svi vi sada mo\u017eete
  da prepoznate takve izgovore. U stanju ste da takvu osobu raskrinkate i da joj ka\u017eete:
  \u201eIako si star, ti jo\u0161 uvek ima\u0161 nadmenu narav. \u010citavog si \u017eivota
  bio nadmen, a da to nikada nisi razre\u0161io. \u017deli\u0161 li da i ubudu\u0107e
  ostane\u0161 nadmen?\u201c Neki mla\u0111i ljudi \u0107e re\u0107i: \u201eTako sam
  mlad da jo\u0161 uvek nisam iskusio haoti\u010dne delove dru\u0161tva, nisam se
  mu\u010dio niti lutao kroz razli\u010dite grupe. Nemam toliko iskustva kao ljudi
  koji su pro\u0161li svet \u2013 a \u0161to je svakako jo\u0161 va\u017enije, nisam
  tako ljigav ni podmukao kao ti stari lisci. Kao mlad \u010dovek, normalno je da
  imam pomalo nadmenu narav; ali barem nisam tako prora\u010dunat, la\u017eljiv i
  r\u0111av, kao neki starac.\u201c Je li prikladno ovako ne\u0161to kazati? (Nije.)
  Svaki \u010dovek ima iskvarenu narav. To nema nikakve veze ni sa godinama ni sa
  polom. Ima\u0161 ono \u0161to imaju drugi, a i oni imaju to \u0161to ti ima\u0161.
  Nema potrebe da iko upire prstom u bilo koga. Naravno, nije dovoljno samo priznati
  da je narav svih ljudi iskvarena. Po\u0161to ste ve\u0107 priznali da imate iskvarenu
  narav, morate tragati za istinom da biste je se re\u0161ili \u2013 svoj cilj ne\u0107ete
  posti\u0107i sve dok ne steknete istinu i dok se va\u0161a narav ne promeni. Osloba\u0111anje
  od iskvarene naravi naposletku \u0107e zavisiti od va\u0161eg prihvatanja istine,
  od odustajanja od svih mogu\u0107ih opravdanja i izgovora, te od va\u0161e sposobnosti
  da se pravilno suo\u010dite s vlastitom iskvarenom naravi. Tu stvar ne smete izbegavati,
  niti se izvla\u010diti raznim izgovorima, a nipo\u0161to je ne smete odbaciti. To
  je veoma lako posti\u0107i. \u0160ta je najte\u017ee uraditi? Mogao bih da smislim
  ne\u0161to takvo. Ima ljudi koji ka\u017eu: \u201eBilo da tvrdite da stremim ka
  istini ili da ne stremim, bilo da ka\u017eete da ne volim istinu ili da mi je ona
  odbojna, razotkrijte u meni bilo kakvu iskvarenu narav \u2013 ja \u0107u vas, naprosto,
  ignorisati. Ja radim sve ono \u0161to Bo\u017eja ku\u0107a od mene zahteva, odnosno
  sve ono \u0161to je potrebno uraditi. Slu\u0161am propovedi i prisustvujem skupovima,
  \u010ditam zajedno sa ostalima dok jedu i piju Bo\u017eje re\u010di, sedim i zajedno
  s vama gledam video zapise o iskustvenim svedo\u010denjima, jedem onda kad i vi
  jedete. Drugim re\u010dima, pratim vas u stopu. Ko bi od vas mogao da ka\u017ee
  da ne stremim ka istini? Ja ovako verujem, a vi mo\u017eete da radite i govorite
  \u0161ta god ho\u0107ete, ba\u0161 me briga!\u201c Ova vrsta ljudi pravi \u010ditavu
  predstavu oko tvrdnje da ne tra\u017ee izgovore ni opravdanja, ali oni ipak nemaju
  nameru da streme ka istini. Kao da Bo\u017eje delo spasenja nema nikakve veze s
  njima i kao da im ono nije ni potrebno. Ovakvi ljudi ne\u0107e izri\u010dito re\u0107i:
  \u201eMoja je ljudskost dobra, ja iskreno verujem u Boga, spreman sam da napustim
  neke stvari i u stanju sam da patim i da platim svoju cenu. Treba li da, povrh toga,
  prihvatim Bo\u017eji sud i grdnju?\u201c Oni to, dakle, ne ka\u017eu izri\u010dito,
  nemaju jasan stav prema istini i ne osu\u0111uju eksplicitno Bo\u017eje delo. Kako
  se, me\u0111utim, Bog odnosi prema takvim ljudima? Ukoliko ne streme ka istini,
  ako su prili\u010dno ravnodu\u0161ni prema Bo\u017ejim re\u010dima i zanemaruju
  ih, onda je Bo\u017eji stav prema njima vrlo jasan. Ba\u0161 kao u onom stihu iz
  Biblije, koji ka\u017ee: \u201eAli po\u0161to si mlak, ni vru\u0107 ni hladan, izbljuva\u0107u
  te iz Svojih usta\u201c (Otkrivenje 3:16). Bog takve ljude ne \u017eeli, a to zna\u010di
  nevolju. Ima li takvih ljudi u crkvi? (Ima.) Kako ih, dakle, treba razvrstati? U
  koju ih grupu treba svrstati? Nema potrebe ni za kakvim razvrstavanjem. Ukratko,
  takvi ljudi ne streme ka istini. Oni ne prihvataju istinu, ne preispituju niti poznaju
  sebe i nemaju pokajni\u010dko srce \u2013 umesto toga, imaju zbrkanu i pometenu
  veru u Boga. Oni rade sve \u0161to Bo\u017eja ku\u0107a od njih zahteva, ne izazivaju\u0107i
  pritom nikakve smetnje niti poreme\u0107aje. Pitajte ih: \u201eIma\u0161 li nekakve
  predstave?\u201c \u201eNemam.\u201c \u201eIma\u0161 li kakve iskvarene sklonosti?\u201c
  \u201eNemam.\u201c \u201e\u017deli\u0161 li da postigne\u0161 spasenje?\u201c \u201eNe
  znam.\u201c \u201ePriznaje\u0161 li da su Bo\u017eje re\u010di istina?\u201c \u201eNe
  znam.\u201c Ma \u0161ta da ih pitate, oni ne znaju da vam odgovore. Postoji li neki
  problem kod takvih ljudi? (Da.) Postoji, ali oni smatraju da to nije problem i da
  ga ne treba re\u0161avati. Biblija ka\u017ee: \u201eAli po\u0161to si mlak, ni vru\u0107
  ni hladan, izbljuva\u0107u te iz Svojih usta.\u201c Upravo ova fraza \u2013 \u201eizbljuva\u0107u
  te iz Svojih usta\u201c \u2013 predstavlja na\u010delo po kojem treba postupati
  s takvim ljudima; to je rezultat koji oni zaslu\u017euju. To \u0161to nisu ni hladni
  ni vru\u0107i zna\u010di da ti ljudi nemaju nikakvih stavova; to zna\u010di da oni
  ostaju ravnodu\u0161ni, ma kako vi u zajedni\u0161tvu sa njima besedili o pitanjima
  promene naravi ili spasenja. \u0160ta ovde zna\u010di da \u201eostaju ravnodu\u0161ni\u201c?
  To zna\u010di da su potpuno nezainteresovani za takve stvari i da ne \u017eele ni
  da \u010duju za njih. Neko \u0107e mo\u017eda re\u0107i: \u201e\u0160ta ima toliko
  lo\u0161eg u nemanju stava ili u izlivima iskvarenosti?\u201c Kakva notorna glupost!
  To su bezdu\u0161ni ljudi, mrtvaci, ni hladni ni vru\u0107i, i Bog ni u kom slu\u010daju
  ne mo\u017ee da radi na njima. Kad je re\u010d o ljudima koje nije mogu\u0107e spasti,
  Bog \u0107e ih samo izbljuvati i svr\u0161iti s njima. On na njima ne radi, te mi
  takvim ljudima ne\u0107emo davati nikakve ocene, nego \u0107emo ih naprosto ignorisati.
  Ako u crkvi ima takvih ljudi, oni u njoj mogu ostati sve dotle dok ne budu pravili
  nikakve smetnje \u2013 ukoliko po\u010dnu da ometaju rad, treba ih se ratosiljati.
  Taj se problem lako re\u0161ava. Moje su re\u010di usmerene ka onima koji mogu da
  prihvate istinu, koji \u017eele da streme ka njoj i koji imaju jasan stav o istini,
  koji priznaju da poseduju iskvarene sklonosti i koji mogu da budu spaseni; ove re\u010di
  su usmerene ka onima koji razumeju Bo\u017eje re\u010di i \u010duju Njegov glas,
  usmerene su ka ovcama Bo\u017ejim \u2013 to su ljudi kojima su Bo\u017eje re\u010di
  upu\u0107ene. Bo\u017eje re\u010di nisu usmerene ka onima koji su prema Njemu ni
  hladni ni vru\u0107i. Takve ljude istina ne zanima i oni su ni hladni ni vru\u0107i
  prema Bo\u017ejim re\u010dima i delu. Sa takvim ljudima treba postupati tako \u0161to
  \u0107ete im re\u0107i: \u201eOdlazi. To kakav si ti nema nikakve veze sa Mnom\u201c
  \u2013 treba ih, dakle, ignorisati i ne tro\u0161iti trud na njih.\\nUpravo smo
  razgovarali o nekim negativnim primerima koji se odnose na temu stremljenja ka istini.
  Ljudi, \u010desto i nesvesno, smi\u0161ljaju razna opravdanja, izgovore i paravane,
  kojima bi da poreknu izlive svoje iskvarene naravi \u2013 oni, svakako, \u010desto
  kriju da uop\u0161te imaju iskvarenu narav, obmanjuju\u0107i na taj na\u010din i
  sebe i druge. To su, naprosto, budalasti i glupi ljudski na\u010dini pona\u0161anja.
  Oni, s jedne strane, priznaju da sve Bo\u017eje re\u010di kojima se \u010doveku
  sudi jesu istina, dok, s druge strane, negiraju postojanje vlastitih iskvarenih
  sklonosti, kao i svoja pogre\u0161na pona\u0161anja kojima naru\u0161avaju istinu.
  To je jasan znak da oni ne prihvataju istinu. Bez obzira na to da li svoju iskvarenu
  narav pori\u010de\u0161 ili priznaje\u0161, ili pak nudi\u0161 izgovore, opravdanja
  i klimave argumente za svoje izlive iskvarenog pona\u0161anja \u2013 jednom re\u010dju,
  ukoliko ne prihvata\u0161 istinu, ne mo\u017ee\u0161 od Boga dobiti spasenje. U
  to nema nikakve sumnje. Svako ko uop\u0161te ne stremi ka istini naposletku \u0107e
  biti razotkriven i isklju\u010den, ma koliko da je godina bio vernik. Takav ishod
  je zastra\u0161uju\u0107. Ne\u0107e pro\u0107i mnogo vremena, a na tebe \u0107e
  se sru\u010diti katastrofe i bi\u0107e\u0161 razotkriven, a kad te zadesi katastrofa,
  oseti\u0107e\u0161 strah. Mo\u017ee\u0161 ti imati gomilu opravdanja i obilje izgovora,
  mo\u017ee\u0161 se \u010dak i dobro maskirati i \u010dvrsto umotati, ali ima jedna
  \u010dinjenica koju je nemogu\u0107e pore\u0107i: tvoja iskvarena narav pritom ostaje
  netaknuta i ni za dlaku se ne menja. Ti nisi u stanju da sebe uistinu spozna\u0161
  i nisi sposoban za iskreno pokajanje, tako da naposletku ne\u0107e\u0161 mo\u0107i
  da se istinski okrene\u0161 Bogu, niti da Mu se pokori\u0161, usled \u010dega se
  ni On ne\u0107e predomisliti u vezi s tobom. Zar se tada ne\u0107e\u0161 na\u0107i
  u velikoj nevolji? Bi\u0107e\u0161 u opasnosti da bude\u0161 isklju\u010den. Stoga
  bi pametan \u010dovek odbacio sve te nerazumne izgovore i glupa opravdanja, odbacio
  bi sve svoje maske i omote. On bi se na pravi na\u010din suo\u010dio sa iskvarenim
  naravima koje ispoljava i koristio bi ispravne metode da se s njima nosi i da ih
  se osloba\u0111a, nastoje\u0107i da sve \u0161to radi i izvr\u0161ava bude dobro,
  kako bi Bog promenio Svoje mi\u0161ljenje o njemu. Ako Bog promeni Svoje mi\u0161ljenje
  o tebi, to \u0107e biti dokaz da ti je zaista oprostio svako tvoje buntovni\u0161tvo
  i otpor iz pro\u0161losti. Bi\u0107e\u0161 radostan i spokojan, ne\u0107e\u0161
  se vi\u0161e ose\u0107ati potla\u010deno i ima\u0107e\u0161 utisak kao da si skinuo
  veliki teret sa srca. To ose\u0107anje je potvrda tvog duha i ti se sada mo\u017ee\u0161
  nadati spasenju. Ova nada je ono \u0161to dobija\u0161 zauzvrat za cenu koju si
  platio streme\u0107i ka istini i \u010dine\u0107i dobra dela. To je rezultat koji
  si ostvario streme\u0107i ka istini i vr\u0161e\u0107i dobra dela. Nasuprot tome,
  mo\u017eda \u0107e\u0161 smatrati kako si ve\u0107 dovoljno pametan i izna\u0107i
  dovoljno izgovora kojima \u0107e\u0161 se braniti i pravdati prilikom svakog ispoljavanja
  svoje iskvarenosti. Svoju iskvarenu narav mo\u017ee\u0161 prikriti i lepo upakovati,
  te na taj na\u010din lukavo izbe\u0107i potrebu da je preispituje\u0161 i spoznaje\u0161,
  ba\u0161 kao da nikad nisi ni ispoljio nikakvu iskvarenost. Sebe mo\u017eda smatra\u0161
  prili\u010dno pametnim, budu\u0107i da uvek iznova uspe\u0161no izbegava\u0161 da
  bude\u0161 razotkriven u raznim okru\u017eenjima koje je Bog uredio. Stoga ti ne\u0107e\u0161
  preispitivati ni spoznavati sebe, ne\u0107e\u0161 zadobiti istinu i propusti\u0107e\u0161
  brojne prilike da te Bog usavr\u0161i. Kakve \u0107e biti posledice toga? Ostavimo
  za sada po strani pitanje da li si sposoban za pokajanje i dostizanje spasenja i
  recimo samo ovo: ako ti Bog uvek iznova daje priliku da se pokaje\u0161, a tebi
  nijednom ne padne na pamet da se predomisli\u0161, zadesi\u0107e te velika nevolja.
  Ho\u0107e li tada uop\u0161te biti va\u017eno koliko se uspe\u0161no brani\u0161,
  koliko dobro sebe predstavlja\u0161, koliko se ve\u0161to maskira\u0161 i kakve
  lepe izgovore i opravdanja smi\u0161lja\u0161? Ako ti je Bog nebrojeno puta pru\u017eio
  priliku, a ti zbog toga nisi \u010dak ni poku\u0161ao da se predomisli\u0161, u
  velikoj si opasnosti. Zna\u0161 li o kakvoj se opasnosti radi? Ti i dalje tvrdoglavo
  iznalazi\u0161 izgovore za svoju iskvarenu narav, nudi\u0161 isprike i opravdanja
  za svoje nestremljenje ka istini, opire\u0161 se i odbacuje\u0161 Bo\u017eji sud
  i Njegovo delo, a pritom sebe ipak smatra\u0161 dobrim \u010dovekom i veruje\u0161
  da ti je savest potpuno \u010dista. Odbija\u0161 da prihvati\u0161 da te Bo\u017eja
  ku\u0107a nadzire i orezuje, neprestano izbegavaju\u0107i Bo\u017eji sud, grdnju
  i spasenje, dok ti je srce ispunjeno buntom protiv Njega \u2013 Bog te je ve\u0107
  odavno prezreo i napustio, a ti se ipak nada\u0161 da jo\u0161 uvek mo\u017ee\u0161
  biti spasen. Zar ne zna\u0161 da si ve\u0107 duboko zabrazdio pogre\u0161nim putem
  i da je za tvoje iskupljenje odavno postalo prekasno? Bog caruje u ku\u0107i Bo\u017ejoj.
  Misli\u0161 li da se, dok se opire\u0161 Bogu i \u010dini\u0161 raznorazna zlodela,
  nalazi\u0161 van Njegovog dohvata? Ne prihvata\u0161 Bo\u017eji sud i grdnju, nisi
  zadobio ni istinu ni \u017eivot i ne poseduje\u0161 nikakvo iskustveno svedo\u010danstvo.
  Zbog toga te Bog osu\u0111uje. Ti sam sebi donosi\u0161 katastrofu. Nema u tome
  ni\u010deg pametnog \u2013 to je glupost, totalna glupost! To je katastrofa! Sve
  smo ti ovde jasno izlo\u017eili \u2013 ako ne veruje\u0161, sa\u010dekaj pa \u0107e\u0161
  videti. Bolje bi ti bilo da ne misli\u0161 da zbog toga \u0161to ima\u0161 spreman
  paket opravdanja za nestremljenje ka istini, \u0161to si re\u010dit i \u0161to ve\u0161to
  spletkari\u0161, \u0161to niko ne mo\u017ee da te nadgovori, \u0161to tvoja bra\u0107a
  i sestre nisu u stanju da te razotkriju i \u0161to crkva ne mo\u017ee da na\u0111e
  dobar izgovor da te ukloni, da ti zbog svega toga Bo\u017eja ku\u0107a ba\u0161
  ni\u0161ta ne mo\u017ee. Silno gre\u0161i\u0161 ako tako misli\u0161. Stalno se
  nadme\u0107e\u0161 s Bogom, ali vide\u0107u koliko \u0107e\u0161 dugo izdr\u017eati
  u tom nadmetanju! Ho\u0107e\u0161 li mo\u0107i da se s Njim takmi\u010di\u0161 sve
  do onog dana kad bude nagra\u0111ivao dobre i ka\u017enjavao zle, nakon \u0161to
  Svoje delo bude priveo kraju? Jesi li siguran da ne\u0107e\u0161 poginuti u katastrofama
  \u2013 da \u0107e\u0161 ih sve pre\u017eiveti? Da li zaista poseduje\u0161 suverenost
  nad vlastitom sudbinom? Mo\u017eda \u0107e ti sva ta opravdanja i izgovori omogu\u0107iti
  da neko vreme izmi\u010de\u0161 istrazi od strane Bo\u017eje ku\u0107e i da jo\u0161
  malo produ\u017ei\u0161 svoje gnusno postojanje. Mo\u017eda \u0107e\u0161 mo\u0107i
  privremeno da zaslepi\u0161 ljude, da se i dalje preru\u0161ava\u0161 i obmanjuje\u0161
  druge u crkvi, te da i dalje popunjava\u0161 svoje mesto tamo \u2013 nikako, me\u0111utim,
  ne mo\u017ee\u0161 izbe\u0107i Bo\u017eju smotru i detaljan pregled. O ishodu svake
  osobe odlu\u010duje Bog, na osnovu toga da li ta osoba poseduje istinu ili ne; On
  samostalno obavlja Svoj posao i vr\u0161idbu. Ma kakav da si \u010dovek ili \u0111avo,
  Bo\u017ejem sudu i osudi ute\u0107i ne mo\u017ee\u0161. Onog trenutka kad izabrani
  Bo\u017eji narod bude razumeo istinu i stekao razboritost, niko vi\u0161e ne\u0107e
  mo\u0107i da utekne, a tada \u0107e\u0161 i ti biti uklonjen iz crkve. Neki se mo\u017eda
  jo\u0161 nisu uverili u to, pa gun\u0111aju: \u201eToliko sam jurcao unaokolo zarad
  Boga, toliko posla obavio za Njega i platio toliku cenu. Napustio sam porodicu i
  rasturio brak; svoju sam mladost potro\u0161io zarad Boga i Njegovog dela. Odrekao
  sam se karijere i utro\u0161io pola svoje \u017eivotne energije, veruju\u0107i da
  \u0107u zasigurno dobiti blagoslove koje On deli. Nisam nikad ni pomi\u0161ljao
  da \u0107u biti isklju\u010den zato \u0161to ne stremim ka istini i \u0161to je
  nikad nisam sprovodio u delo!\u201c Zar ne zna\u0161 da u Bo\u017ejoj ku\u0107i
  caruje istina? Zar ti nije jasno koga Bog nagra\u0111uje i koga blagosilja? Ako
  putem odricanja i tro\u0161enja samog sebe bude\u0161 do\u0161ao do iskrenog iskustvenog
  svedo\u010denja, i ako to odricanje i tro\u0161enje bude svedo\u010dilo o Bo\u017ejem
  delu, Bog \u0107e te nagraditi i blagosloviti. Ukoliko, pak, tvoje odricanje i tro\u0161enje
  ne predstavljaju iskreno iskustveno svedo\u010denje, a jo\u0161 manje svedo\u010denje
  o Bo\u017ejem delu, ve\u0107 umesto toga svedo\u010de o tebi samom i o tvom zahtevu
  da Bog prizna tvoja postignu\u0107a, ti onda ide\u0161 istim onim putem kojim je
  i\u0161ao Pavle. To \u0161to radi\u0161 je zlo i predstavlja otpor prema Bogu, te
  \u0107e ti Bog stoga re\u0107i: \u201eBe\u017ei od Mene, zlotvore!\u201c A \u0161ta
  \u0107e to zna\u010diti? Bi\u0107e to dokaz da si uni\u0161ten, da si osu\u0111en
  da te sna\u0111e nesre\u0107a i da bude\u0161 ka\u017enjen. Suo\u010di\u0107e\u0161
  se s katastrofom. Pavle je od prose\u010dne osobe svog vremena bio nadmo\u0107niji
  u pogledu statusa i posla koji je obavljao, u pogledu svoje sposobnosti i svojih
  talenata \u2013 ali, \u0161ta je iz svega toga proisteklo? Pavle je, od po\u010detka
  do kraja svoje vere u Boga, poku\u0161avao da se s Njim nagodi i da Mu postavlja
  uslove; tra\u017eio je od Boga nagradu i krunu. Naposletku se nije \u010dak ni iskreno
  pokajao, niti je pripremio mnoga dobra dela \u2013 stoga, naravno, nije ni izdaleka
  posedovao mnogo pravih iskustvenih svedo\u010danstava. Bi li on mogao da od Boga
  dobije pomilovanje, a da se prethodno nije iskreno pokajao? Da li bi mogao da privoli
  Boga da promeni Svoje mi\u0161ljenje o njemu? To bi bilo apsolutno nemogu\u0107e.
  Pavle je \u010ditav svoj \u017eivot potro\u0161io na Gospoda, ali po\u0161to je
  i\u0161ao putem antihrista i odlu\u010dno odbijao da se pokaje, ne samo da nije
  nagra\u0111en \u2013 nego ga je Bog jo\u0161 i kaznio. Sasvim je razumljivo da su
  posledice koje je pretrpeo bile katastrofalne. Stoga ti sada jasno poru\u010dujem
  da, ako ve\u0107 nisi neko ko stremi ka istini, treba da bude\u0161 barem toliko
  razuman da se ne raspravlja\u0161 s Bogom, niti da vlastiti ishod i odredi\u0161te
  nudi\u0161 kao kockarski zalog. To bi, naime, predstavljalo poku\u0161aj da se nagodi\u0161
  s Bogom, \u0161to je jedan od na\u010dina opiranja Bogu. Kakvom se sre\u0107nom
  svr\u0161etku mogu nadati oni koji u Boga veruju, ali Mu se pritom opiru? Kad se
  na\u0111u licem u lice sa smr\u0107u, ljudi se lepo pona\u0161aju; oni, pak, do
  kojih razum ne dopire, od svog puta ne\u0107e odustati sve dok ne pokucaju smrti
  na vrata. Ako \u017eeli\u0161 da bude\u0161 spasen, onda se najbolji, najjednostavniji
  i najmudriji metod sastoji u tome da sve svoje izgovore, opravdanja i uslove stavi\u0161
  na stranu, da prihvati\u0161 istinu i po\u010dne\u0161 da stremi\u0161 ka njoj,
  stoje\u0107i sa obe noge \u010dvrsto na zemlji, te da na taj na\u010din privoli\u0161
  Boga da promeni Svoje mi\u0161ljenje o tebi. Kad se Bog bude predomislio u vezi
  s tobom, tek tada se mo\u017ee\u0161 nadati spasenju. Nadu u spasenje \u010doveku
  daje Bog, a preduslov za to je da se odrekne\u0161 svega \u0161to voli\u0161 i da
  napusti\u0161 sve kako bi sledio Boga i stremio ka istini, ne poku\u0161avaju\u0107i
  da s Njim sklapa\u0161 nikakve nagodbe. Pritom je potpuno nebitno da li si star
  ili mlad, mu\u0161karac ili \u017eena, obrazovan ili neuk, a tako\u0111e je krajnje
  neva\u017eno gde si ro\u0111en. Boga ni\u0161ta od toga ne zanima. Mo\u017eda \u0107e\u0161
  re\u0107i: \u201eImam dobar temperament. Strpljiv sam, tolerantan i saose\u0107ajan.
  Ako budem strpljiv do kraja, privole\u0107u Boga da promeni Svoje mi\u0161ljenje
  o meni.\u201c Sve je ovo krajnje beskorisno. Boga ne zanima tvoj temperament, tvoja
  li\u010dnost, stepen obrazovanja, kao ni godine starosti, niti Mu je va\u017eno
  koliko si propatio ili koliko si posla obavio. Bog \u0107e te samo pitati: \u201eDa
  li se, tokom svih ovih godina provedenih u veri, tvoja narav promenila? Po kojim
  na\u010delima \u017eivi\u0161? Jesi li stremio ka istini? Jesi li prihvatio Bo\u017eje
  re\u010di?\u201c A ti \u0107e\u0161 Mu mo\u017eda ovako odgovoriti: \u201eSaslu\u0161ao
  sam ih i prihvatio.\u201c Tada \u0107e te Bog upitati: \u201eNakon \u0161to si ih
  saslu\u0161ao i prihvatio, je li tvoja iskvarena narav razre\u0161ena? Da li si
  se iskreno pokajao? Jesi li se iskreno pokorio Bo\u017ejim re\u010dima i prihvatio
  ih?\u201c Ka\u017ee\u0161: \u201ePropatio sam i platio cenu; potro\u0161io sam sebe,
  odrekao se ovozemaljskih stvari i prineo \u017ertve \u2013 ro\u0111enu sam decu
  tako\u0111e \u017ertvovao Bogu.\u201c Sve su tvoje \u017ertve beskorisne. Takve
  se stvari ne mogu trampiti za blagoslove carstva nebeskog, niti koristiti za to
  da Bog promeni Svoje mi\u0161ljenje o tebi. Jedini na\u010din da Boga privoli\u0161
  da promeni Svoje mi\u0161ljenje o tebi, jeste da krene\u0161 putem stremljenja ka
  istini. Druga mogu\u0107nost jednostavno ne postoji. \u010covek ne sme da bude oportunista,
  niti da prebegava lukavstvima kad je spasenje u pitanju, jer se do spasenja ne mo\u017ee
  do\u0107i na mala vrata. Razume\u0161 li ti to? Ovo ti mora biti u potpunosti jasno.
  Nemoj se zbunjivati u vezi s tim \u2013 a \u010dak i ako se zbuni\u0161, Bog se
  zasigurno ne\u0107e zbuniti. \u0160ta bi, dakle, od sad pa nadalje trebalo da radite?
  Preokrenite svoj stav i promenite ta\u010dku gledi\u0161ta, neka vam Bo\u017eje
  re\u010di budu temelj, ma \u0161ta da radite. Nikakva, od \u010doveka stvorena \u201edobrota\u201c,
  nijedan ljudski izgovor, nikakva ljudska filozofija, znanje, moral, etika, pa \u010dak
  ni savest, kao ni takozvani ljudski integritet i dostojanstvo, ne mogu da zamene
  istinu. Ostavite sve to po strani, u\u0107utkajte svoje srce, pa u Bo\u017ejim re\u010dima
  prona\u0111ite temelj svakog svog pona\u0161anja i delovanja. Dok to radite, u Bo\u017ejim
  re\u010dima prona\u0111ite Njegovo otkrivenje u vezi s razli\u010ditim aspektima
  \u010dovekove iskvarene naravi. Uporedite sebe s njima i oslobodite se svojih iskvarenih
  sklonosti. Nastojte da \u0161to pre spoznate sami sebe, odbacite vlastitu iskvarenost,
  pa po\u017eurite da se pokajete i da krenete suprotnim smerom. Oslobodite se vlastite
  zlobe, a u svom pona\u0161anju i svojim postupcima te\u017eite ka istina-na\u010delima,
  oslanjaju\u0107i se pritom na Bo\u017eje re\u010di \u2013 nikako se u tim stvarima
  ne smete oslanjati na ljudske predstave i ma\u0161tarije. Uz to, nikako ne smete
  poku\u0161avati da sklapate nagodbe s Bogom, niti da svoju bezna\u010dajnu patnju
  i \u017ertve menjate za Bo\u017eje nagrade i blagoslove. Prestani da \u010dini\u0161
  takve gluposti, ina\u010de \u0107e se Bog naljutiti na tebe, prokleti te i iskoreniti.
  Da li ti je to jasno? Jeste li razumeli sve ovo? (Jesmo.) E pa, onda, ubudu\u0107e
  pa\u017eljivo razmi\u0161ljajte o tome.\\nSve ono o \u010demu smo malo\u010das razgovarali
  odnosilo se na potragu za istinom i, mada nismo dali konkretan odgovor na konceptualno
  pitanje \u0161ta zna\u010di stremiti ka istini, na\u0161 razgovor jednim delom jeste
  bio usmeren na razna ljudska kriva shvatanja i iskrivljena znanja o stremljenju
  ka istini, kao i na razne pote\u0161ko\u0107e i probleme koji se javljaju kod ljudi
  koji streme ka istini. \u017deleo bih da, za kraj, sumiram zna\u010denje stremljenje
  ka istini, na\u010dine na koje se stremljenje ka istini manifestuje i koji je ta\u010dno
  put prakti\u010dnog delovanja u stremljenju ka istini. \u0160ta, dakle, zna\u010di
  stremljenje ka istini? Stremiti ka istini zna\u010di po\u010deti da do\u017eivljava\u0161
  i sprovodi\u0161 u delo Bo\u017ejih re\u010di, a zatim razumeti istinu i, kroz proces
  do\u017eivljavanja Bo\u017ejih re\u010di, zakora\u010diti u istina-stvarnost, te
  tako postati neko ko uistinu poznaje Boga i pokorava Mu se. Ovo je krajnji rezultat
  stremljenja ka istini. Naravno, stremljenje ka istini je proces koji se odvija postepeno,
  u koracima, i podeljen je na nekoliko etapa. Nakon \u0161to si pro\u010ditao Bo\u017eje
  re\u010di i otkrio da su one su\u0161ta istina i stvarnost, po\u010de\u0107e\u0161
  da preispituje\u0161 i da spoznaje\u0161 samog sebe u okviru Bo\u017ejih re\u010di.
  Uvide\u0107e\u0161 koliko si buntovan i koliko iskvarenosti izliva\u0161 oko sebe.
  \u017dude\u0107e\u0161 za time da se osposobi\u0161 da istinu sprovodi\u0161 u delo,
  da dostigne\u0161 pokornost prema Bogu, i po\u010de\u0107e\u0161 da stremi\u0161
  ka istini. Upravo to je rezultat preispitivanja i spoznaje samoga sebe. Od tog trenutka
  zapo\u010dinje tvoje \u017eivotno iskustvo. Kad bude\u0161 po\u010deo da istra\u017euje\u0161
  i analizira\u0161 stanja i probleme koji proisti\u010du iz tvoje iskvarene naravi,
  to \u0107e biti dokaz da si po\u010deo da stremi\u0161 ka istini. Bi\u0107e\u0161
  u stanju da se proaktivno preispituje\u0161 i da analizira\u0161 sve probleme koji
  se budu javili i sve iskvarenosti koje bude\u0161 prosipao unaokolo. A kad shvati\u0161
  da to zaista jesu izlivi iskvarenosti i iskvarene naravi, sasvim prirodno \u0107e\u0161
  potra\u017eiti istinu i po\u010deti da te probleme re\u0161ava\u0161. \u017divot-ulazak
  zapo\u010dinje vlastitim preispitivanjem; to je prvi korak potrage za istinom. Odmah
  zatim, kroz preispitivanje i spoznaju samog sebe, uvide\u0107e\u0161 da su sve Bo\u017eje
  re\u010di kojima On ljude razotkriva u skladu sa \u010dinjenicama. Tada \u0107e\u0161
  te re\u010di mo\u0107i iskreno da poslu\u0161a\u0161 i da prihvati\u0161 njihov
  sud i grdnju. Ovo je drugi korak stremljenja ka istini. Ve\u0107ina ljudi je u stanju
  da prihvati Bo\u017eje re\u010di kojima se razotkriva \u010dovekova iskvarena narav,
  ali oni ne mogu lako da prihvate one re\u010di Bo\u017eje kojima se razotkriva \u010dovekova
  iskvarena su\u0161tina. Nakon \u0161to pro\u010ditaju Bo\u017eje re\u010di, oni
  ne priznaju da su i sami do sr\u017ei iskvareni; priznaju jedino one Bo\u017eje
  re\u010di kojima se razotkriva \u010dovekovo iskvareno pona\u0161anje. Zato oni
  nisu u stanju da iskreno prihvate Bo\u017eji sud i grdnju. Umesto toga, oni taj
  sud i grdnju odbacuju. Neki ka\u017eu: \u201eImam svega nekoliko iskvarenih navika
  u pona\u0161anju, ali mogu da u\u010dinim i neke dobre stvari. Dobar sam \u010dovek
  i ne pripadam Sotoni. Verujem u Boga, te bi stoga trebalo da pripadam Bogu.\u201c
  Zar ovo nije notorna glupost? Ro\u0111en si u ljudskom svetu, \u017eiveo si pod
  uticajem Sotone i stekao obrazovanje o okviru tradicionalne kulture. Celokupno nasle\u0111e
  koje je u tebe ugra\u0111eno, kao i znanje koje si stekao, poti\u010du od Sotone.
  Svi veliki i slavni ljudi kojima se divi\u0161 pripadaju Sotoni. Da li \u0107e\u0161,
  samo zbog toga \u0161to ka\u017ee\u0161 da ne pripada\u0161 Sotoni, mo\u0107i da
  izbegne\u0161 da te on iskvari? Upravo su tako i mala deca u stanju da, \u010dim
  zinu, sla\u017eu i vre\u0111aju druge. Ko ih je tome nau\u010dio? Niko. \u010cega
  je to onda posledica, ako ne kvarenja od strane Sotone? \u010cinjenice tako govore.
  Iako Sotonu i zle duhove duhovnog carstva ljudi ne mogu da vide, \u017eivih demona
  i \u0111avoljih kraljeva ima posvuda u ljudskom svetu. Svi su oni Sotonina otelovljenja.
  To je \u010dinjenica koju svi ljudi moraju da priznaju. Oni koji razumeju istinu
  mogu da prozru te stvari i da priznaju da su sve razotkrivaju\u0107e Bo\u017eje
  re\u010di \u010dinjenice. Neki mo\u017eda tvrde da su spoznali sebe, ali nikada
  ne priznaju da su iskvarenosti koje Bo\u017eje re\u010di razotkrivaju \u010dinjeni\u010dne,
  niti da su Njegove re\u010di istina. To je isto \u0161to i nesposobnost da se prihvati
  istina. Ako neka osoba ne priznaje \u010dinjenicu da poseduje iskvarenu narav, ona
  ne\u0107e mo\u0107i da se iskreno pokaje. Naravno, da bi neko priznao i prihvatio
  \u010dinjenicu da svi ljudi imaju iskvarenu narav, on najpre mora da iskusi Bo\u017eje
  delo na neko vreme. Nakon \u0161to iz sebe bude izlio mnoge iskvarene sklonosti,
  svakako \u0107e pognuti glavu pred tom \u010dinjenicom. On ne\u0107e imati drugog
  izbora osim da prizna da sve Bo\u017eje re\u010di koje razotkrivaju, sude i osu\u0111uju
  \u010doveka jesu \u010dinjenice i jesu istina, i da onda te re\u010di u potpunosti
  prihvati. Upravo to zna\u010di biti osvojen Bo\u017ejim re\u010dima. Kad budu bili
  u stanju da na osnovu Bo\u017ejih re\u010di spoznaju vlastite iskvarene sklonosti
  i svoju iskvarenu su\u0161tinu, da priznaju da im je narav sotonska i da su do sr\u017ei
  iskvareni, ljudi \u0107e tada u potpunosti mo\u0107i da prihvate i pokore se Bo\u017ejem
  sudu i grdnji. Bi\u0107e spremni da poslu\u0161aju Bo\u017eje re\u010di kojima On
  ljude razotkriva i sudi im, ma koliko te re\u010di bile o\u0161tre i probojne. Kad
  bude\u0161 razumeo i saznao pone\u0161to o tome kako Bo\u017eje re\u010di defini\u0161u,
  klasifikuju i osu\u0111uju iskvareno \u010dove\u010danstvo, kako mu sude i kako
  ga razotkrivaju, kad bude\u0161 zaista prihvatio sud i grdnju Bo\u017ejih re\u010di
  i po\u010deo da upoznaje\u0161 svoju iskvarenu narav i su\u0161tinu, kad bude\u0161
  po\u010deo da mrzi\u0161 svoju iskvarenu narav, Sotonu i vlastito telo \u2013 i
  kad bude\u0161 strasno po\u017eeleo da stekne\u0161 istinu, da \u017eivi\u0161 \u017eivotom
  dostojnim \u010doveka i da postane\u0161 neko ko se iskreno pokorava Bogu \u2013
  tada \u0107e\u0161 po\u010deti da se usredsre\u0111uje\u0161 na promenu svoje naravi.
  Ovo je tre\u0107i korak stremljenja ka istini.\\nUistinu spoznati sebe zna\u010di
  poznavati i preispitivati svoju iskvarenu narav na osnovu Bo\u017ejih re\u010di,
  \u010dime se dolazi do spoznaje o vlastitoj iskvarenoj su\u0161tini i \u010dinjenici
  vlastite iskvarenosti. Kad bude uspeo u tome, \u010dovek \u0107e sasvim jasno mo\u0107i
  da sagleda duboki ambis ljudske iskvarenosti \u2013 shvati\u0107e da ljudi ne \u017eive
  onako kako bi trebalo da \u017eive, da ljudski rod pro\u017eivljava isklju\u010divo
  iskvarene sklonosti i da je \u010dove\u010danstvo li\u0161eno i najmanjeg tra\u010dka
  savesti i razuma. Shvati\u0107e da sva ljudska gledi\u0161ta poti\u010du od Sotone
  i da nijedno od njih nije ispravno niti u skladu sa istinom, da su sve ljudske sklonosti,
  te\u017enje i putevi koje ljudi biraju zaprljani Sotoninim otrovima, te da je sve
  to za\u010dinjeno \u010dovekovim preteranim \u017eeljama i namerom da stekne blagoslove.
  Shvati\u0107e da naravi koje \u010dovek oko sebe izliva zapravo predstavljaju Sotoninu
  narav i njegovu priroda-su\u0161tinu. Do te mere spoznati samog sebe nije nimalo
  jednostavno; to se mo\u017ee posti\u0107i samo na osnovu Bo\u017ejih re\u010di.
  Ako neko poku\u0161a da to postigne na osnovu teorija o moralu, tvrdnji i zamisli
  iz domena tradicionalne kulture, ho\u0107e li mo\u0107i da do\u0111e do istinske
  samospoznaje? Naravno da ne\u0107e. Tvoju iskvarenu narav izrodile su upravo te
  sotonske filozofije i teorije. Zar ne bi bilo apsurdno da vlastitu samospoznaju
  zasnuje\u0161 na ne\u010demu \u0161to pripada Sotoni? Zar to ne bi bila puka besmislica?
  Prema tome, samospoznaja mora biti zasnovana na Bo\u017ejim re\u010dima. Jedino
  su Bo\u017eje re\u010di istina i jedino one predstavljaju kriterijum za merenje
  svih ljudi, doga\u0111aja i stvari. Kad uistinu shvati\u0161 da su Bo\u017eje re\u010di
  istina i da predstavljaju jedinu ispravnu osnovu prema kojoj se mere svi ljudi,
  doga\u0111aji i stvari, put za napredovanje bi\u0107e ti otvoren. Tada \u0107e\u0161
  mo\u0107i da \u017eivi\u0161 u svetlosti, \u0161to zna\u010di da \u0107e\u0161 \u017eiveti
  pred Bogom. Kad ljudi u Bo\u017ejim re\u010dima budu stekli pravo znanje o vlastitoj
  iskvarenoj su\u0161tini, kako \u0107e se oni nakon toga pona\u0161ati i prakti\u010dno
  delovati? (Oni \u0107e se pokajati.) Tako je. Kad neka osoba bude stekla znanje
  o vlastitoj priroda-su\u0161tini, u njenom \u0107e se srcu prirodno javiti kajanje
  i ona \u0107e po\u010deti da se kaje. To zna\u010di da \u0107e nastojati da se oslobodi
  svojih iskvarenih sklonosti i da vi\u0161e ne\u0107e \u017eiveti u skladu sa sotonskom
  naravi. Umesto toga, \u017eive\u0107e i pona\u0161a\u0107e se u skladu s Bo\u017ejim
  re\u010dima i bi\u0107e u stanju da se pokori Bo\u017ejim orkestracijama i ure\u0111enjima.
  To je pravo pokajanje. Ovo je \u010detvrti korak stremljenja ka istini. Po\u0161to
  vam je sada svima jasno \u0161ta je pravo pokajanje, znate li kako da ga praktikujete?
  Tako \u0161to \u0107ete krenuti suprotnim smerom. To zna\u010di da treba da se odreknete
  svega za \u0161ta ste vezani i \u0161to smatrate ispravnim, da prestanete da \u017eivite
  po sotonskoj naravi i da budete spremni da istinu sprovodite u delo u skladu s Bo\u017ejim
  re\u010dima. To zna\u010di krenuti suprotnim smerom. Konkretno govore\u0107i, najpre
  se morate odre\u0107i sami sebe i, na osnovu Bo\u017ejih re\u010di, ispitati da
  li su va\u0161e misli, ideje, dela i postupci u skladu sa istinom, i kako su nastali.
  Ako ustanovite da to poti\u010de od iskvarene naravi i da je nastalo iz sotonskih
  filozofija, trebalo bi da prema svemu tome zauzmete stav osude i kletve. To \u0107e
  vam pomo\u0107i da se pobunite protiv vlastitog tela i Sotone. O kakvom se ovde
  pona\u0161anju radi? Zar to nije negiranje, ostavljanje, odricanje i pobuna protiv
  vlastite iskvarene naravi? Nije ba\u0161 jednostavno negirati ono \u0161to smatrate
  ispravnim, odre\u0107i se vlastitih interesa, pobuniti se protiv pogre\u0161nih
  nauma, i tako ostvariti preokret u svom \u017eivotu, a uz to je sve to skop\u010dano
  sa mnogo specifi\u010dnih pojedinosti. Ako si samo na re\u010dima spreman da se
  pokaje\u0161, ali pritom ne negira\u0161, ne ostavlja\u0161, ne odri\u010de\u0161
  se, niti se buni\u0161 protiv svoje iskvarene naravi, ti onda time ne pokazuje\u0161
  kajanje i jo\u0161 nisi prakti\u010dno zakora\u010dio u pokajanje. Kako se manifestuje
  pravo pokajanje? Kao prvo, negiranjem onoga \u0161to smatra\u0161 ispravnim, poput,
  na primer, vlastitih predstava i zahteva prema Bogu, kao i vlastitih pogleda na
  stvari, vlastitih metoda i na\u010dina re\u0161avanja problema, vlastitog iskustva
  i tome sli\u010dno. Negiranje svih tih stvari predstavlja prakti\u010dno ispoljavanje
  iskrenog kajanja i okretanja ka Bogu. Pogre\u0161nih stvari se mo\u017ee\u0161 osloboditi
  tek nakon \u0161to si ih prozreo i negirao. Ukoliko te stvari ne bude\u0161 negirao,
  ve\u0107 ih i dalje bude\u0161 smatrao dobrim i ispravnim, ti onda ne\u0107e\u0161
  mo\u0107i da ih odbaci\u0161 od sebe, \u010dak i ako ti drugi ka\u017eu da to u\u010dini\u0161.
  Re\u0107i \u0107e\u0161: \u201eJa sam visoko-obrazovan i imam bogato iskustvo. Verujem
  da su ove stvari ispravne, pa za\u0161to bih ih onda odbacivao?\u201c Ako se istrajno
  i tvrdoglavo pridr\u017eava\u0161 vlastitih na\u010dina, ho\u0107e\u0161 li biti
  u stanju da prihvati\u0161 istinu? To ne\u0107e biti nimalo lako. Ako \u017eeli\u0161
  da stekne\u0161 istinu, najpre mora\u0161 da negira\u0161 sve one stvari koje smatra\u0161
  ispravnim i pozitivnim, a zatim da jasno uvidi\u0161 da su one u su\u0161tini negativne,
  da poti\u010du od Sotone i da su sve to puke zablude \u2013 kao i da \u0107e te
  one samo navoditi da \u010dini\u0161 zlo, da se opire\u0161 Bogu i da na kraju bude\u0161
  ka\u017enjen i uni\u0161ten. Ako jasno uvi\u0111a\u0161 da su misli i otrovi kojima
  Sotona kvari ljude u stanju da dovedu do njihovog uni\u0161tenja, mo\u0107i \u0107e\u0161
  u potpunosti da ih napusti\u0161. Naravno, negiranje, ostavljanje, odricanje, pobuna
  i tome sli\u010dno predstavljaju stavove i metode koje \u010dovek primenjuje u borbi
  protiv Sotoninih sila i njegove prirode, kao i protiv filozofije, logike, misli
  i pogleda pomo\u0107u kojih Sotona ljude obmanjuje. Primera radi, tu spadaju ostavljanje
  po strani interesa vlastitog tela; napu\u0161tanje telesnih sklonosti i stremljenja;
  odricanje od Sotoninih filozofija, misli, jeresi i zabluda; pobuna protiv Sotoninog
  uticaja i njegovih zlih sila. \u010citav ovaj niz prakti\u010dnih postupaka predstavlja
  metode i na\u010dine na koje ljudi mogu praktikovati pokajanje. Radi ulaska u iskreno
  pokajanje, \u010dovek mora da razume brojne istine, i tek nakon toga mo\u017ee u
  potpunosti da negira samog sebe i da se pobuni protiv vlastitog tela. Zamislimo,
  na primer, da za sebe smatra\u0161 da mnogo toga zna\u0161, da ima\u0161 bogato
  iskustvo, te da bi stoga trebalo da bude\u0161 dragoceni resurs, koji je od velike
  koristi Bo\u017ejoj ku\u0107i. Pa ipak, nakon \u0161to si nekoliko godina slu\u0161ao
  propovedi o istini i razumeo pone\u0161to od tih istina, ose\u0107a\u0161 da su
  tvoje znanje i u\u010denost bezvredni i da Bo\u017eja ku\u0107a nema od njih nikakve
  koristi. Uvi\u0111a\u0161 da ljude mogu spasti upravo istina i Bo\u017eje re\u010di,
  te da je istina ta koja mo\u017ee postati \u017eivot \u010dovekov. Sve vi\u0161e
  ti se \u010dini da, ma koliko znanja ili iskustva da neko ima, to ne zna\u010di
  da taj neko poseduje istinu, te da, ma koliko da se sve \u0161to je ljudsko poklapa
  s ljudskim predstavama, ne zna\u010di da su sve te stvari istina. Jasno ti je da
  sve te stvari poti\u010du od Sotone, da su sve odreda negativne i da nemaju veze
  sa istinom. Bez obzira na to koliko si obrazovan, u\u010den ili iskusan, od toga
  ne\u0107e\u0161 imati velike koristi ukoliko ne poseduje\u0161 duhovno razumevanje
  i ako ne mo\u017ee\u0161 da razume\u0161 istinu. Ako bi kojim slu\u010dajem preuzeo
  ulogu vo\u0111e, ti ne bi posedovao istina-stvarnost i ne bi bio u stanju da re\u0161ava\u0161
  probleme. Ako bi trebalo da napi\u0161e\u0161 esej o iskustvenom svedo\u010denju,
  ti ne bi mogao da iz sebe izvu\u010de\u0161 ni re\u010d na tu temu. Ako bi hteo
  da svedo\u010di\u0161 o Bogu, ti ne bi ba\u0161 ni\u0161ta znao o Njemu. Ako bi
  trebalo da \u0161iri\u0161 jevan\u0111elje, ne bi bio u stanju da u zajedni\u0161tvu
  besedi\u0161 o istini kako bi razre\u0161io ljudske predstave. Ako bi trebalo da
  napoji\u0161 novoprido\u0161le \u010dlanove, ti ne bi imao jasan stav o istinitosti
  vizija i mogao bi samo da im propoveda\u0161 re\u010di i doktrine. Ako nisi u stanju
  da se oslobodi\u0161 \u010dak ni vlastitih predstava, kako onda da razre\u0161i\u0161
  predstave prido\u0161lica? Ako ni\u0161ta od toga nisi u stanju da uradi\u0161 \u2013
  \u0161ta onda mo\u017ee\u0161 da radi\u0161? Ako bi od tebe zahtevali da se potrudi\u0161,
  ti bi to smatrao tra\u0107enjem svog talenta. Iako tvrdi\u0161 da si talentovan,
  nisi u stanju da dobro obavi\u0161 nijedan zadatak, niti bilo koju du\u017enost
  \u2013 pa \u0161ta ti zapravo mo\u017ee\u0161 da uradi\u0161? Ovde se ne radi o
  tome da Bo\u017eja ku\u0107a ne \u017eeli da te iskoristi, ve\u0107 o tome da nisi
  izvr\u0161io du\u017enost koju je trebalo da obavi\u0161. Ne mo\u017ee\u0161 zbog
  toga kriviti crkvu. Pa ipak, ti u sebi mo\u017eda ovako razmi\u0161lja\u0161: \u201eNe
  o\u010dekuje li Bog previ\u0161e od \u010doveka? Ovi zahtevi prevazilaze moje mo\u0107i.
  Za\u0161to se od mene toliko toga tra\u017ei?\u201c Ako neko u tolikoj meri ne razume
  Boga, on time dokazuje da o Njemu ne zna ba\u0161 ni\u0161ta i da ne razume ni deli\u0107
  istine. Ako misli\u0161 da su tvoji stavovi ispravni i da ih ne treba menjati, i
  ako priznaje\u0161 da su, u teoriji, Bo\u017eje re\u010di istina, ali ipak nisi
  u stanju da se oslobodi\u0161 gluposti kojih se uporno dr\u017ei\u0161, to pokazuje
  da jo\u0161 uvek ne razume\u0161 istinu. Trebalo bi da stupi\u0161 pred Boga i vi\u0161e
  traga\u0161 o istini, da pro\u010dita\u0161 jo\u0161 Njegovih re\u010di i odslu\u0161a\u0161
  jo\u0161 vi\u0161e propovedi i beseda, jer \u0107e\u0161 tek nakon toga postepeno
  shvatiti da su Bo\u017eje re\u010di istina. Prvi od na\u010dina na koje bi, kao
  \u010dovek, trebalo da se odnosi\u0161 prema istini i Bogu jeste pokornost. To je
  du\u017enost na koju se \u010dovek obavezao. Ako si u stanju da razume\u0161 ove
  stvari, to zna\u010di da pravi\u0161 zaokret. Povratak na pravi put predstavlja
  na\u010din praktikovanja pokajanja; to podrazumeva potpuno napu\u0161tanje svega
  onoga \u0161to si nekada smatrao ispravnim, a \u0161to poti\u010de od Sotone, kao
  i ponovno biranje puta kojim \u017eeli\u0161 da ide\u0161. To podrazumeva sprovo\u0111enje
  Bo\u017ejih re\u010di u delo, u skladu s Njegovim zahtevima i istina-na\u010delima,
  kao i kretanje putem potrage za istinom. To je zna\u010denje povratka na pravi put.
  To zna\u010di uistinu stupiti pred Boga i zakora\u010diti u stvarnost pokajanja.
  Ako je \u010dovek u stanju da istinu sprovodi u delo, onda se samo po sebi podrazumeva
  da je po\u010deo da ulazi u istina-stvarnost i da se iskreno pokajao. Tek kad se
  \u010dovek iskreno pokaje, mo\u017ee se re\u0107i da je zakora\u010dio na put koji
  vodi do spasenja. To ujedno zna\u010di da je zapo\u010deo sa \u010detvrtim korakom
  stremljenja ka istini.\\nKada se \u010dovek bude iskreno pokajao, krenu\u0107e putem
  stremljenja ka istini, u sebi vi\u0161e ne\u0107e gajiti predstave niti pogre\u0161na
  shvatanja o Bo\u017ejem delu, bi\u0107e spreman da se podvrgne Bo\u017ejem sudu
  i grdnji, \u010dime \u0107e i formalno zapo\u010deti da do\u017eivljava Bo\u017eje
  delo. Postoji jedan du\u017ei period tranzicije od trenutka kad neko po prvi put
  poveruje u Boga, do trenutka kad on formalno po\u010dne da do\u017eivljava Bo\u017eji
  sud i grdnju. Taj prelazni period je faza koja traje od trenutka kad osoba po\u010dne
  da veruje u Boga, do njenog iskrenog pokajanja. Ako neko ne voli istinu, on ne\u0107e
  prihvatiti ni deli\u0107 Bo\u017ejeg suda i grdnje, ni trunku istine, i nikada ne\u0107e
  mo\u0107i da spozna samoga sebe. Takvi ljudi \u0107e biti isklju\u010deni. Ukoliko
  \u010dovek voli istinu, on \u0107e, bilo posredstvom \u010ditanja Bo\u017ejih re\u010di
  ili slu\u0161anja propovedi, zaista mo\u0107i da ne\u0161to stekne i da spozna da
  je cilj Bo\u017ejeg dela \u010dovekovo spasenje, mo\u0107i \u0107e da, posredstvom
  onih istina koje razume, preispituje i spoznaje samog sebe; sve vi\u0161e \u0107e
  mrzeti vlastitu iskvarenu narav i sve se vi\u0161e zanimati za istinu, nesvesno
  \u0107e do\u0107i do istinske samospoznaje i oseti\u0107e iskreni \u017eal i kajanje.
  Ljudi koji vole istinu sasvim prirodno posti\u017eu ovakve rezultate \u010ditanjem
  Bo\u017ejih re\u010di i slu\u0161anjem propovedi. Oni postepeno spoznaju sami sebe
  i uspevaju da se iskreno pokaju. Kako bi trebalo prakti\u010dno da deluje neko ko
  se iskreno pokajao? Trebalo bi da u svim stvarima tra\u017ei istinu i da, ma \u0161ta
  da mu se desi, bude u stanju da na osnovu Bo\u017ejih re\u010di pronalazi na\u010dela
  i puteve prakti\u010dnog delovanja, da bi zatim istinu po\u010deo da sprovodi u
  delo. Ovo je peti korak stremljenja ka istini. Koja je svrha tra\u017eenja istine?
  Sprovo\u0111enje istine u delo i dostizanje pokornosti prema Bogu. Me\u0111utim,
  da bi istinu sprovodio u delo, \u010dovek to mora \u010diniti u skladu sa istina-na\u010delima.
  Ve\u0107 i sam taj \u010din predstavlja pravilno praktikovanje istine i \u010doveku
  omogu\u0107ava da dobije odobrenje od Boga. Prema tome, ono \u0161to treba posti\u0107i
  stremljenjem ka istini jeste sposobnost delovanja u skladu sa istina-na\u010delima.
  Kad \u010dovek stigne do ovog koraka, to zna\u010di da je zakora\u010dio u stvarnost
  praktikovanja istine. Traganje za istinom vr\u0161i se u cilju osloba\u0111anja
  \u010doveka od njegovih iskvarenih sklonosti. Ako je neka osoba sposobna da istinu
  sprovodi u delo, ona \u0107e se sasvim prirodno osloboditi svojih iskvarenih sklonosti,
  a njeno \u0107e praktikovanje istine ostvariti rezultat koji Bog zahteva. To je
  proces koji vodi od iskrenog pokajanja do sprovo\u0111enja istine u delo. Nekada
  si \u017eiveo usred svojih iskvarenih sklonosti, \u0161to zna\u010di da si \u017eiveo
  pod vla\u0161\u0107u Sotone, pri \u010demu je Bog osu\u0111ivao i prezirao sve tvoje
  postupke i pona\u0161anja; sada si, pak, u stanju da prihvati\u0161 istinu, iskreno
  si se pokajao, u stanju si da istinu sprovodi\u0161 u delo, da se pokori\u0161 Bogu
  i da \u017eivi\u0161 u skladu s Njegovim re\u010dima \u2013 \u0161to, naravno, kod
  Boga nailazi na odobravanje. Oni koji streme ka istini treba \u010desto da preispituju
  sami sebe. Treba da priznaju svoje iskvarene sklonosti i da prihvate Bo\u017eji
  sud i grdnju, da steknu pravo znanje o vlastitoj iskvarenoj su\u0161tini i da u
  srcu neguju pokajanje; nakon \u0161to se pokaju, treba da po\u010dnu da u svemu
  tra\u017ee istinu, da deluju u skladu sa istina-na\u010delima i da dostignu pokornost
  prema Bogu. To je ono \u0161to se mo\u017ee posti\u0107i ako se stremi ka istini
  i ako se sve dublje zakora\u010duje u \u017eivot. Ako \u010dovek ne poznaje samog
  sebe, on nikako ne\u0107e mo\u0107i da se pokori Bo\u017ejem sudu i grdnji, niti
  da se iskreno pokaje. A ako se ne pokaje iskreno, nastavi\u0107e da \u017eivi po
  sotonskoj naravi. U njemu se ne\u0107e desiti istinska promena, ma koliko dugo da
  je verovao u Boga. Malo \u0107e samo promeniti svoje pona\u0161anje \u2013 i to
  je sve. Budu\u0107i da oni koji ne streme ka istini nikako ne mogu da istinu prihvate
  kao svoj \u017eivot, sasvim je izvesno da \u0107e njihovi postupci i pona\u0161anja
  i dalje predstavljati izlive iskvarene naravi, da \u0107e biti u neskladu sa istinom
  i opirati se Bogu. Sa druge strane, oni koji streme ka istini u stanju su da istinu
  prihvate kao svoj \u017eivot, da odbace svoju iskvarenu narav, da sprovedu istinu
  u delo i da postignu istinsku pokornost prema Bogu. Oni koji streme ka istini nastavi\u0107e
  da je tra\u017ee \u010dak i kad im se dogode stvari koje ne razumeju. Ne\u0107e
  vi\u0161e kovati zavere zarad vlastite koristi i kloni\u0107e se svakog zla, a u
  grudima \u0107e im kucati srce koje je uskla\u0111eno s Bogom. Ljudi koji streme
  ka istini sve se vi\u0161e pokoravaju Bogu i u stanju su da se pla\u0161e Boga i
  klone se zla, \u017eive\u0107i sve vi\u0161e \u017eivotom kojim bi \u010dovek trebalo
  da \u017eivi. Ovakve promene nisu mogu\u0107e kod ljudi koji ne streme ka istini.
  \u010cemu te\u017ee oni koji ne streme ka istini? Oni su ustremljeni ka presti\u017eu,
  dobiti i statusu; te\u017ee isklju\u010divo blagoslovima i nagradama. Ambicije i
  \u017eelje su im sve ve\u0107e i ve\u0107e, a pritom nemaju ispravne \u017eivotne
  ciljeve. Ma \u010demu da te\u017ee, i ako nisu u stanju da ostvare svoj cilj, oni
  ne\u0107e odustati, a kamoli promeniti svoje mi\u0161ljenje. \u010cim im okolnosti
  i okru\u017eenje to dozvole, u stanju su da po\u010dine zlodela i da se opiru Bogu,
  a mogu poku\u0161ati i da uspostave nezavisno carstvo. To je zato \u0161to u srcu
  nisu bogoboja\u017eljivi, niti se pokoravaju Bogu, tako da \u0107e ih On naposletku
  svakako uni\u0161titi zbog brojnih zala koja su po\u010dinili i zbog izdaje Boga.
  Svi oni koji ne streme ka istini ljudi su kojima je istina odbojna, a svi kojima
  je istina odbojna ljubitelji su zla. Sve \u0161to oni svojim duhom, krvlju i kostima
  po\u0161tuju jeste presti\u017e, dobitak, status i uticaj; sre\u0107ni su \u0161to
  \u017eive prema sotonskim sklonostima i \u0161to vojuju protiv Neba, zemlje i \u010doveka,
  zarad ostvarenja vlastitih ciljeva. Misle da u takvom \u017eivotu ima radosti, hteli
  bi da \u017eive kao istaknuti pojedinci i da kao junaci umru. O\u010digledno je
  da se kre\u0107u sotonskim putem koji vodi ka uni\u0161tenju. Nasuprot njima, ljudi
  koji streme ka istini utoliko vi\u0161e vole Boga i, \u0161to vi\u0161e razumeju
  istinu, ose\u0107aju koliko je ona dragocena. Spremni su da prihvate Bo\u017eji
  sud i grdnju i odlu\u010dni su da streme ka istini i da je zadobiju, ma kolike nevolje
  da ih pritom sna\u0111u. To zna\u010di da su stupili na put spasenja i usavr\u0161avanja
  i da su sposobni da ostvare uskla\u0111enost s Bogom. \u0160to je najva\u017enije,
  u stanju su da se pokore Bogu, vratili su se na mesto koje im je prvobitno pripadalo
  kao stvorenim bi\u0107ima, a u grudima im kuca bogoboja\u017eljivo srce. Oni s pravom
  mogu da od Boga dobiju vo\u0111stvo, smernice i blagoslove, a Bog ih se vi\u0161e
  ne gnu\u0161a niti ih odbacuje. Kako je to divno! Ljudi koji ne streme ka istini
  ne mogu da se oslobode svoje iskvarene naravi, usled \u010dega im se srce sve vi\u0161e
  udaljava od Boga, a istina im je odbojna i odbacuju je. Kao posledica toga, oni
  se sve sna\u017enije opiru Bogu i stupaju na put koji Mu je suprotstavljen. Pona\u0161aju
  se isto kao Pavle time \u0161to otvoreno od Boga zahtevaju nagradu. Ukoliko je ne
  dobiju, poku\u0161a\u0107e da se raspravljaju s Njim i da Mu se suprotstave, te
  \u0107e naposletku postati antihristi i u potpunosti razotkriti grozno lice Sotonino,
  nakon \u010dega \u0107e ih Bog prokleti i uni\u0161titi. S druge strane, oni koji
  idu putem stremljenja ka istini u stanju su da istinu prihvate i da joj se pokore.
  Ti ljudi mogu da odbace iskvarenu narav Sotone, spremni su da se svega odreknu kako
  bi svoju du\u017enost obavljali dobro i Bogu uzvratili za ljubav, i u stanju su
  da postanu ljudi koji su prema Bogu pokorni i koji Ga obo\u017eavaju. Osoba koja
  je spremna da se Bogu u celosti pokori, samim tim se u potpunosti vratila u prvobitno
  stanje stvorenog bi\u0107a i sposobna je da se u svemu pokorava Bo\u017ejim orkestracijama
  i ure\u0111enjima. To ujedno zna\u010di da ona poseduje temeljno ljudsko obli\u010dje.
  \u0160ta se podrazumeva pod istinskim ljudskim obli\u010djem? To je ono kad se neka
  osoba pokorava Stvoritelju i pla\u0161i Ga se, ba\u0161 kao Jov i Petar. Takvi su
  oni koje Bog uistinu blagosilja.\\nNajva\u017eniji koraci stremljenja ka istini,
  o kojima smo danas razgovarali, veoma su jednostavni. Ponovite Mi o kojim se koracima
  radi. (Prvo, preispitati sebe u skladu s Bo\u017ejim re\u010dima; drugo, priznati
  i prihvatiti \u010dinjenice koje se Bo\u017ejim re\u010dima razotkrivaju; tre\u0107e,
  spoznati vlastitu iskvarenu narav i su\u0161tinu, i prezreti svoju iskvarenu narav
  i Sotonu; \u010detvrto, praktikovati pokajanje i odre\u0107i se svih po\u010dinjenih
  zlodela; peto, tragati za istina-na\u010delima i sprovoditi istinu u delo.) Ukupno,
  dakle, ima pet koraka. Ljudima koji \u017eive usred svojih iskvarenih sklonosti
  veoma te\u0161ko pada praktikovanje svakog od ovih koraka, jer su svi oni skop\u010dani
  s brojnim preprekama i pote\u0161ko\u0107ama, a praktikovanje i savladavanje svakog
  od njih zahteva mukotrpne napore; pri tom se, naravno, neminovno javljaju neuspesi
  i nazadovanja \u2013 a s tim u vezi, samo \u0107u vam ovo re\u0107i: nemojte klonuti
  duhom. Mada \u0107e te drugi mo\u017eda osu\u0111ivati i govoriti: \u201eGotov si\u201c,
  \u201eNema vajde od tebe\u201c, \u201eNaprosto si takav i ne mo\u017ee\u0161 se
  promeniti\u201c \u2013 ma koliko njihove re\u010di bile neprijatne, ti mora\u0161
  jasno da rasu\u0111uje\u0161. Nemoj klonuti duhom i nemoj odustajati, jer \u0107e
  ti jedino stremljenje ka istini, otpo\u010dinjanje i praktikovanje pomenutih koraka,
  zaista omogu\u0107iti da izbegne\u0161 katastrofu. Pametni ljudi \u0107e sve pote\u0161ko\u0107e
  gurnuti u stranu i ne\u0107e se pla\u0161iti neuspeha i povremenih nazadovanja,
  ve\u0107 \u0107e uporno kora\u010dati napred, ma koliko to bilo te\u0161ko. \u010cak
  i ako se na koraku prou\u010davanja i spoznaje samog sebe bude\u0161 zadr\u017eao
  tri ili pet godina, pa \u010dak i ako nakon punih osam ili deset godina bude\u0161
  samo spoznao koje sve iskvarene sklonosti poseduje\u0161, ali jo\u0161 uvek ne bude\u0161
  u stanju da razume\u0161 istinu niti da svoju iskvarenu narav odbaci\u0161, ja \u0107u
  te i dalje isto savetovati: nemoj klonuti duhom. Mada jo\u0161 uvek nisi u stanju
  da ostvari\u0161 istinski preokret, ve\u0107 si savladao prva tri koraka. \u010cemu
  onda strah da preostala dva ne\u0107e\u0161 mo\u0107i da savlada\u0161? Prestani
  da brine\u0161, radi jo\u0161 marljivije, jo\u0161 se ja\u010de potrudi i sti\u0107i
  \u0107e\u0161 do cilja. Mo\u017eda ima i onih koji su do\u0161li do \u010detvrtog
  koraka \u2013 pokajanja, ali nikako ne uspevaju da zapo\u010dnu korak traganja za
  istina-na\u010delima. \u0160ta u tom slu\u010daju treba da rade? I za njih isto
  va\u017ei \u2013 ne smeju klonuti duhom. Dokle god ima\u0161 volju za to, treba
  da u svemu istrajno traga\u0161 za istinom i da se \u0161to vi\u0161e moli\u0161
  Bogu \u2013 to \u010desto donosi plodove. Tragaj \u0161to god mo\u017ee\u0161 bolje,
  u zavisnosti od svog kova i okolnosti, i naporno radi da bi postigao \u0161to je
  mogu\u0107e vi\u0161e. Dokle god daje\u0161 sve od sebe, savest \u0107e ti biti
  \u010dista i sigurno \u0107e\u0161 mo\u0107i puno toga da stekne\u0161. Bi\u0107e
  dovoljno \u010dak i ako bude\u0161 razumeo tek jednu istinu vi\u0161e \u2013 \u017eivot
  \u0107e ti zbog toga postati barem malo sre\u0107niji i radosniji. Ukratko, stremljenje
  ka istini nije \u0161uplja stvar; postoji specifi\u010dan put praktikovanja svakog
  njenog koraka, i ona od ljudi zahteva da otrpe izvestan bol i da plate odre\u0111enu
  cenu. Istina ne spada u oblast akademskog prou\u010davanja; ona ne predstavlja nekakvu
  teoriju, niti slogan ili argument; istina nije \u0161uplja. Svaka istina zahteva
  da je ljudi nekoliko godina do\u017eivljavaju i praktikuju, pre nego \u0161to budu
