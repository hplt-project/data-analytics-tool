  i izdr\u017ei\u0161 sve vrste tortura i dobije\u0161 u slu\u010daju da ima\u0161
  ne\u0161to malo i sre\u0107e a da dobije\u0161 pet, \u0161est do sedam razlike.\\nTako\u0111e,
