  svojevremeno. Neka dovedu \u0161to vi\u0161e tih znamenitih u prvi red da se prepla\u0161imo
  od njih. Crvena zvezda nema ni\u0161ta od revizije su\u0111enja pa neka se dovedu
  i neutralne sudije sa strane. Sve funkcioni\u0161e i sve je zasnovano na strahu,
  gepekovanju, prebijanju, pritiscima, sistemu, pa \u010dak i jednom delu dr\u017eavnih
  funkcionera koji u\u010destvuju u tome. Gde je dr\u017eava u stvari? Gde je predsednik
  Vlade da se oglasi oko ovoga? Ne, pustimo stru\u010dnjake sa fakulteta da pri\u010daju.
  Nije nikakav problem i ja sam radio na fakuletu pa po\u0161tujem profesore, ali
  volim sa profesorima da polemi\u0161em uz prvo pitanje \u2013 \u0161ta si konkretno
  stvorio u svom \u017eivotu? Apropo psihologa, politikologa i ostalih stvari. Meni
  je tog nepregmantizma i jalovosti preko glave u svim osnovama i oblastima.\\nJov\u010di\u0107eva
  frustracija se ta\u010dno videla na ovoj utakmici. Izgledalo je kao da je sudio
  iz gepeka i to su istine, a totalno je druga stvar \u0161to jedna emisija to \u017eeli
  da predstavi kao neistine i dezinformacije. Ne\u0107u da ulazim u varijante ko je
  gatara, ko nije gatara i ko je za \u0161ta. A \u0161to se ti\u010de Vranja i takvih
  pitanja, nemam nikakvih problema da sve te stvari raspravimo u policiji i javno.
  Po\u010dev\u0161i od Zemunskog klana, Sur\u010dinskog klana, kontakata, veza, ko
  se s kim dru\u017eio, ko se s kim dru\u017eio\u2026 To je sve bilo u duhu tradicionalnog
  srpskog prijateljstva. Da se ne foliramo i pravimo naivni, mo\u017eemo da zovemo
  Vladu \u0110urovi\u0107a iz SB Poka, da i njega pitamo neke stvari \u2013 ko ga
  je filovao i ko mu je pravio politi\u010dke pristupe. Do letovanja i aviona po \u0161mr\u010dak
  osnovamo. Nema nikakvih problema da i o tome pri\u010damo.\\nJa nisam rekao da je
  Dule maznuo slike, ali nisam rekao ni da nije. Den Bo\u0161a i Bo\u0161ove ma\u0161ine
  nisam rekao da ima, ali nisam rekao ni da nema i onog kliza\u010da na krivoj dasci.
  Zna\u010di nikakav problem nije da otvoreno pri\u010damo o poreklu tih name\u0161taljki.
  Ja se moje pro\u0161losti ne stidim i nikada se ne\u0107u ni stideti i mogu jasno
  da dokumentujem jer znam da smo se bavili vrlo nezgodnim poslovima. Ja nikakve kontakte
  nisam imao sa Mi\u0161kovi\u0107em, nisam rekao da je Dule imao, ali nisam rekao
  ni da nije imao. Ako se ve\u0107 igramo re\u010dima jer je meni posao bio da se
  igram re\u010dima.\\n\u0160to se ti\u010de ambicije Crvene zvezde, na\u0161a ambicija
  nije da se liga vra\u0107a u KSS. Moja li\u010dna ambicija nije da budem predsednik
  KSS. Bio sam predsednik KSJ i prosto ne znam odakle te poluinformacije jer nijednim
  svojim potezom nisam upla\u0161io Dragana \u0110ilasa da sam mu konkurecnije. \u0160ta
  vi\u0161e, prvi sam ga je predlo\u017eio ali smo posle predstavili da je to uradio
  Danilovi\u0107. Za\u0161to? Zato \u0161to Partizan ima jedan trik, ili frik, da
  sve \u0161to Zvezda predlo\u017ei i kada je dobro ka\u017eu \u2013 ne\u0107emo jer
  je Zvezda to predlo\u017eila. E zato sam ja dao ideju, a Partizan je predlo\u017eio
  i ja nemam ni\u0161ta protiv toga.\\nIz Partizana ide pri\u010da da \u0107e Savovi\u0107
  u Bilbao. Pod jedan, Bilbao nema pare da ga plati. A pod dva, za\u0161to bi Savovi\u0107
  i\u0161ao sa konja na magarca? To bi isto bilo kada bih ja rekao, a rekao sam otvoreno,
  odnosno nisam rekao da ima puno neispla\u0107enih igra\u010da u Partizanu i prosto
  ne znam kako su zadovoljni. Ti igra\u010di su veoma interesantni za Bilbao, pa i
  Crvenu zvezdu, a nisam to rekao, a rekao sam ili rekao sam, a nisam rekao ako treba
  da se igramo re\u010dima. Tako da pustite nas toga, to je patka oko Savovi\u0107a
  da \u0107e negde i\u0107i.\\n\u0160to se ti\u010de utakmice, samo bez ikakve euforije.
  Na dobrom smo putu da se vratimo u realan \u017eivot i pobegnemo iz virtuelnosti.
  Da li \u0107emo uspeti? Ne znam. Sistem se dugo gradio. Crno-beli svet se dugo gradio,
  ali ne zaboravite jo\u0161 jednu stvar, bilo da ste Zvezda\u0161i ili Partizanovci,
  da ste biolo\u0161ki \u010disto, sada \u0107e me ovaj opet prozvati da sam renesansni
  intelektualac \u2013 da li vi imate crna i bela krvna zrnca ili crveno i bela krvna
  zrnca? Ne zaboravite da je svet u koloru. Nema euforije, \u0161to vi\u0161e navija\u010da
  da do\u0111e na utakmicu, da maksimalno uradimo posao kako treba i u\u010dinimo
  Srbiju jo\u0161 sretnijom. Bi\u0107e sretna kada je Zvezda prva. Za\u0161to to ka\u017eem?
  Pa da li je ta\u010dno da je ve\u0107ina navija\u010da u Srbiji Zvezde? Jeste. Ako
  pobedi Zvezda Srbija \u0107e se vi\u0161e radovati.\\nSudije su same krive \u0161to
  su do\u0161le u situaciju da sude u ovakvom ambijentu. To traje godinama unazad
  i niko nije imao hrabrosti da se suprotstavi tome. Uostalom, ako se pla\u0161e ne
  treba da sude. Jadni oni! Em ti dam 500 ili 1000 evra naknadu za su\u0111enje, em
  do\u0111e\u0161, odalami\u0161 me i uzme\u0161 nezaslu\u017eeno utakmicu, a mi se
  ubismo da na\u0111emo pare da finansiramo klub i sredimo finansijsku situaciju.
  Za\u0161to da ih \u017ealim? Sudije koje vi\u0161e sude mogu godi\u0161nje da uzmu
  98. 000 evra. To smo \u010dak jedne godine i ra\u010dunali Boji\u0107, Biorac i
  ja. A onda izra\u010dunamo gde smo mi, a gde su on i pri tome je on servis jer ne
  igramo mi zbog njih. Ja tu nemam nikakvu emociju niti \u017eal. Ne bih imao ni\u0161ta
  protiv da do\u0111u strane sudije, \u010dak i da ih finansiramo. Samo da do\u0111e
  do regularnosti i da prekinemo vi\u0161e ove virtualne varjante i ortodoksne kra\u0111e.
  Nema nikog u Srbiji ko je realan da nije rekao \u2013 Ljudi pa \u0161ta je ovo sino\u0107
  bilo? Stvarno nema, na stranu \u0161to sam ja predsednik Zvezde.\"", "\"Nacionalna
  arhiva je objavila ogroman \u0161tek dosad neobjavljenih fotografija ameri\u010dkog
  potpredsednika Dika \u010cejnija na dan teroristi\u010dkih napada 11. septembra.\\nNa
  fotografijama, \u010cejni izgleda kao zabrinuti potpredsednik koji posmatra strahovite
  doga\u0111aje, a potom razgovara sa \u010dlanovima kabineta o tome \u0161ta slede\u0107e.
  Fotografije je snimio fotograf iz kancelarije potpredsednika koji je slikao tokom
  celog dana dok se \u010cejni sastajao sa predsednikom Bu\u0161om, Kondolisom Rajs,
  Kolinom Pauelom i \u0161efom kancelarije I. Luisom \\\"Skuterom\\\" Libijem.\\nSvih
  356 fotografija je dostupno na Flickru.\"", "\"Da je Gospod Hristos sve i svja u
  tebi kao \u010doveku, u tvojoj porodici, u tvojoj \u0161koli, u tvome narodu, u
  tvojoj dr\u017eavi kao dr\u017eavi. Ako Gospod Hristos nije sve ko smo mi? Le\u0161evi,
  le\u0161evi, le\u0161evi! \u0160ta je \u010dovek ako je smrt poslednja stanica?
  Jel li to Bog hteo da se podsmehne \u010doveku \u0161to ga je stvorio smrtnim? Ne,
  On je do\u0161ao u ovaj svet, Bog postao \u010dovek, da pobedi smrt za nas, da pobedi
  greh za nas, da pobedi \u0111avola za nas. I On pobe\u0111uje! Samo jedno od tebe
