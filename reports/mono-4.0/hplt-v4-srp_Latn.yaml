  pa da pustimo Partizan i sudije da slave tamo. Pri\u017eeljkujem petu utakmicu i
  bi\u0107u odu\u0161evljen ako u prvom redu bude sedeo Kristijan Golubovi\u0107 ili
  neko od tih egzoti\u010dnih tipova iz andergraunda. Stra\u0161no \u0107emo se upla\u0161iti
