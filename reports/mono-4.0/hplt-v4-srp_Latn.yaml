  \u0161alje Svoje Apostole u svet ,, kao ovce me\u0111u vukove\u201d ,ovce me\u0111u
  vukove! Koji je to vojskovo\u0111a, koji je to car koji bi svoju vojsku slato tako!
  Kako \u0107e ovce pobediti vukove? Gle u ono vreme kada je Gospod slao ucenike svoje
  Rimsku carevinu, jedistvenu, ogromnu, koja je obuhvatla ceo svet, kad ih \u0161alje
  On ih \u0161alje kao ovce me\u0111u vukove, me\u0111u neznabo\u0161ce. I desilo
  se najv\u0107e \u010dudo u istoriji braco: da su ovce pobedile vukole! Ovce pobeile
  vikove! To je jedistvna pobeda, pobeda Gospoda Hrista.\\nTo On i danas radi. I danas
  ovce Hristove u Srpskome narodu, u ovome svetu pobe\u0111uju vukove. \u010cime?
  Verom! Sve oru\u017eijem Bo\u017eijim. Nije nas Gospod Hristos poslao u ovaj svet
  bez oru\u017eija, nije nas poslao bez oru\u017eija, jer zna da nas \u0161alje najve\u0107em
  neprijatelju bi\u0107a ljuckog, \u0161alje nas grehu, smrti, \u0111avolu, da se
  sa njime borimo. Zaista nam je dao oru\u017eije, koje Sveti Apostol Pavle naziva
  sveoru\u017eijem Bo\u017eijim. Jer na\u0161 rat nije sa telom i krvljom u ovom svetu,
  nego sa duhovima zla ispod neba, sa grsima, sa strastima, sa \u0111avolom.I ti \u010dove\u010de,
  mo\u017ee\u0161 biti pobedilac samo na jedan na\u010din: ako naoru\u017ea\u0161
  sebe verom, molitvom, postom, bdenjem, milosr\u0111em, pokajanjem, i svim drugim
  svetim vrlinama.I tako \u0107e\u0161 se mo\u0107i odr\u017eati u zlu danu, govori
  Apoastol, kad do\u0111e isku\u0161enje ne treba kao li\u010dnost, kad do\u0111e
  isku\u0161enje na tebe kao na predstavnika jedne porodice, jednog naroda. I mi pobe\u0111ujemo
  ali ne sami. Ispred nas i oko nas svi Srpski Svetitelji, na \u010delu sa Svetim
  Savom, me\u0111u njima i sa ravnoapostolnim Vladikom Nikolajem. Svi oni gledaju
  nas danas kako se davimo u mrtvom moru pru\u017eaju ruke svoje, pru\u017eaju svakome
  od nas, ali nikoga nasilno ne spasavaju, ve\u0107 prizivaju, pozivaju, objavljuju
  Blagoves Gospoda Hrista.\\n\u010cove\u010de, jedan je na\u010din da ti mo\u017ee\u0161
  pobediti greh, to je pokajanje. Dr\u017ee\u0107i Evan\u0111elje, cuvaju\u0107i zapovesti
  Bo\u017eije, jedini je na\u010din koji pobe\u0111uje smrt, vaskrsava iz mrtvih zaista,
  to je opet pokajanje i sve vrline novozavetne. To je tvoje svetlo oru\u017eije.
  Ako ga nema\u0161, sigurno \u0107e\u0161 biti davljenik.\\nBeseda, Prepodobnog otac
  Justin Popovic\"", "\"Filip Car opet Maji najavio raskid? Ona ostala u \u010dudu,do\u0161lo
  joj je tako iznenada. Reakcijom je pokazala i otkrila veliku tajnu (VIDEO)\\nMaja
  Marinkovi\u0107 i Filip Car su se danas osamili u izolaciji \u201cZadruge\u201d,
