  la\u017eni i varljivi. Neka vas ne sputavaju va\u0161e godine, budite isti kao i
  svi drugi, uradite sve \u0161to mo\u017eete i \u0161to treba da uradite \u2013 tako
  \u0107ete imati normalan na\u010din razmi\u0161ljanja. Da li razumete? (Da.) Prema
  tome, kada starija osoba ima normalan na\u010din razmi\u0161ljanja, razli\u010dite
  negativne emocije koje se kod nje javljaju usled njenih poodmaklih godina, i bez
  njenog znanja nestaju; te negativne emocije vi\u0161e ne mogu da je zapetljavaju,
  pa nestaje i \u0161teta koju joj te emocije nanose, te tada njena humanost, njen
  razum i njena savest svi redom postaju relativno normalni. Pod pretpostavkom da
  imaju normalnu savest i razum, ljudi sti\u010du relativno ispravnu polaznu ta\u010dku
  za stremljenje ka istini, za obavljanje svoje du\u017enosti, za upu\u0161tanje u
  bilo kakvu aktivnost i posao, pa su postignuti rezultati relativno ispravni. Pre
  svega, stariji ljudi ne\u0107e biti sputani svojim poznim godinama, ve\u0107 \u0107e
  mo\u0107i da objektivno i prakti\u010dno sebi uzmu pravu meru, da rade ono \u0161to
  treba da rade, da budu isti kao i drugi ljudi i da, najbolje \u0161to mogu, obavljaju
  du\u017enost koju treba da obavljaju. Mladi ljudi ne bi trebalo da razmi\u0161ljaju:
  \u201eIma\u0161 toliko godina, a nikada mi ne napravi\u0161 mesta niti o meni brine\u0161.
  Ima\u0161 toliko godina, trebalo bi da si iskusan, ali me ne savetuje\u0161 kako
  da postupam i za mene nema nikakve koristi da budem s tobom. Ima\u0161 toliko godina,
  pa kako onda ne zna\u0161 kako da poka\u017ee\u0161 razumevanje prema mladim ljudima?\u201c
  Da li je u redu tako re\u0107i? (Nije.) Takve zahteve nije primereno upu\u0107ivati
