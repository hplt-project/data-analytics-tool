  osobu, a ne kao pripadnika neke posebne grupe koju drugi treba da po\u0161tuju,
  da je veli\u010daju, da je uzdi\u017eu u nebesa i da se oko nje sjate. To je prekomerna
  \u017eelja i pogre\u0161an na\u010din razmi\u0161ljanja. Godine starosti nisu simbol
  tvog identiteta, godine starosti ne zna\u010de podobnost, godine \u017eivota ne
  predstavljaju stare\u0161instvo, a jo\u0161 manje zna\u010de da poseduje\u0161 istinu
  ili ljudskost i, na kraju, godine starosti ne mogu da ubla\u017ee tvoju iskvarenu
  narav. Dakle, isti si kao i svi drugi ljudi. Ne ozna\u010davaj sebe stalno kao \u201estarijeg\u201c
  kako bi se izdvojio od ostalih ili se \u010dak ustoli\u010dio kao svetac. Time pokazuje\u0161
  da sebe uop\u0161te ne poznaje\u0161! Tokom svog \u017eivota, stariji ljudi bi trebalo
  jo\u0161 i vi\u0161e da te\u017ee tome da streme ka istini, da te\u017ee \u017eivot-ulasku
  i da sa bra\u0107om i sestrama slo\u017eno sara\u0111uju u obavljanju svoje du\u017enosti;
  jedino tako mogu pove\u0107ati svoj rast. Stariji ljudi nipo\u0161to ne smeju da
  polaze od pretpostavke da su nadre\u0111eni u odnosu na druge ni da se razme\u0107u
  svojim poznim godinama. Kod mladih ljudi se mogu otkriti sve vrste iskvarene naravi,
  a isto va\u017ei i za tebe; mladi ljudi mogu da u\u010dine razne gluposti, a isto
  va\u017ei i za tebe; mladi ljudi gaje predstave, a isto to rade i stariji ljudi;
  mladi ljudi mogu da budu buntovni, a isti takvi mogu da budu i stariji; kod mladih
  ljudi se mo\u017ee otkriti narav antihrista, a isti je slu\u010daj i kod starijih;
  mladi ljudi imaju divlje ambicije i \u017eelje i isto to, bez i najmanje razlike,
  va\u017ei i za one starije; mladi ljudi mogu da izazovu prekide i ometanja i da
  budu izba\u010deni iz crkve, a isto \u0107e biti i sa starijima. Prema tome, osim
  svoje sposobnosti da dobro obavljaju svoju du\u017enost shodno svojim mogu\u0107nostima,
  ima mnogo stvari koje mogu da rade. Ako nisi glup, ako nisi dementan i ako ne mo\u017ee\u0161
  da shvati\u0161 istinu, i ukoliko nisi nesposoban da brine\u0161 o sebi, ima mnogo
  stvari koje treba da radi\u0161. Ba\u0161 kao i mladi ljudi, mo\u017ee\u0161 da
  stremi\u0161 ka istini, mo\u017ee\u0161 da tra\u017ei\u0161 istinu i treba \u010desto
  da dolazi\u0161 pred Boga da se moli\u0161, da tra\u017ei\u0161 istina-na\u010dela,
  da se trudi\u0161 da na ljude i stvari gleda\u0161 i da se pona\u0161a\u0161 i postupa\u0161
  u potpunosti prema Bo\u017ejim re\u010dima, uzimaju\u0107i istinu kao svoj kriterijum.
  Ovo je put koji treba da sledi\u0161 i ne treba da ose\u0107a\u0161 uznemirenost,
  strepnju i zabrinutost zato \u0161to si star, zato \u0161to ima\u0161 brojne boljke
  ili zato \u0161to ti telo stari. Nije ispravno ose\u0107ati uznemirenost, strepnju
  i zabrinutost \u2013 to su nerazumna ispoljavanja. Stariji ljudi treba da otpuste
  svoju \u201estara\u010dku\u201c titulu, da se uklope sa mladim ljudima i da sa njima
  sede kao sa sebi ravnima. Ne smete da se razme\u0107ete svojim poznim godinama,
  uvek smatraju\u0107i da ste uzvi\u0161ene veli\u010dine dostojne po\u0161tovanja,
  da ste vrhunski kvalifikovani, da mo\u017eete da upravljate mladim ljudima, da ste
  stare\u0161ine i nadre\u0111eni mladima, uvek sa ambicijom da kontroli\u0161ete
  mlade ljude i uvek sa \u017eeljom da njima upravljate \u2013 to je okorela iskvarena
  narav. Budu\u0107i da stariji ljudi, ba\u0161 kao i mladi, imaju iskvarenu narav
  i budu\u0107i da \u010desto u svom \u017eivotu i pri obavljanju svoje du\u017enosti,
  ba\u0161 poput mladih, otkrivaju svoju iskvarenu narav, za\u0161to onda stariji
  ljudi ne rade ono \u0161to je ispravno, ve\u0107 umesto toga uvek ose\u0107aju uznemirenost,
  strepnju i zabrinutost zbog svojih poznih godina i zbog onoga \u0161to \u0107e im
  se dogoditi nakon smrti? Za\u0161to poput mladih ljudi ne obavljaju svoje du\u017enosti?
  Za\u0161to poput mladih ljudi ne streme ka istini? Ova ti je mogu\u0107nost pru\u017eena,
  pa ako je ne ugrabi\u0161, ve\u0107 u toj meri ostari\u0161 da izgubi\u0161 sluh,
  vid ili sposobnost da brine\u0161 o sebi, u tom \u0107e\u0161 slu\u010daju za\u017ealiti,
  i \u017eivot \u0107e ti na taj na\u010din pro\u0107i. Da li razume\u0161? (Da.)\\nDa
  li je problem negativnih emocija starijih ljudi sada re\u0161en? Kada ostarite,
  ho\u0107ete li se razmetati svojim poznim godinama? Ho\u0107ete li postati prevejani
  stari lisci i stare varalice? Kada ugledate stariju osobu, ho\u0107ete li je osloviti
  sa \u201estari brate\u201c ili \u201estara sestro\u201c? Oni imaju imena, ali ih
  vi ne oslovljavate njihovim imenima, ve\u0107 umesto toga dodajete re\u010d \u201estari\u201c.
  Ako pri obra\u0107anju starijim ljudima uvek dodaje\u0161 re\u010d \u201estari\u201c,
  zar im time ne\u0107e\u0161 na\u0161koditi? Oni o sebi ve\u0107 razmi\u0161ljaju
  kao o starima i imaju neke negativne emocije, pa ako ih i ti zove\u0161 \u201estarima\u201c,
  isto je kao da im ka\u017ee\u0161: \u201eStar si, stariji si od mene i od tebe vi\u0161e
  nema nikakve koristi.\u201c Ho\u0107e li im biti prijatno da \u010duju kako to govori\u0161?
  Svakako \u0107e se ose\u0107ati nesre\u0107no. Zar ih ne\u0107e povrediti ako im
  se obrati\u0161 na ovaj na\u010din? Kada \u010duju da im se ovako obra\u0107a\u0161,
  neki stariji ljudi \u0107e biti odu\u0161evljeni i pomisli\u0107e: \u201eVidi\u0161,
  posedujem uzvi\u0161enu vrlinu koja je dostojna po\u0161tovanja i ugleda. Kada me
  bra\u0107a i sestre ugledaju, ne oslovljavaju me po imenu. U Bo\u017ejoj ku\u0107i,
  ljudi ne oslovljavaju starije sa stri\u010de, deda ili bako. Umesto toga, kada mi
  se bra\u0107a i sestre obra\u0107aju, dodaju re\u010d \u2019stari\u2019 i obra\u0107aju
  mi se sa \u2019stari brate\u2019 (ili \u2019stara sestro\u2019). Pogledaj kako sam
  dostojanstven i vidi koliko sam ugledan me\u0111u drugima. Bo\u017eja ku\u0107a
  je dobro mesto \u2013 ljudi po\u0161tuju stare i brinu o mladima!\u201c Da li si
  dostojan po\u0161tovanja? Kakvo si podu\u010davanje doneo svojoj bra\u0107i i sestrama?
  Kakvu su korist imali od tebe? U \u010demu je tvoj doprinos Bo\u017ejoj ku\u0107i?
  Koliko istine si shvatio? Koliko istine sprovodi\u0161 u delo? Smatra\u0161 da poseduje\u0161
  uzvi\u0161enu vrlinu dostojnu po\u0161tovanja, a nisi pru\u017eio nikakav doprinos,
  pa da li onda zaslu\u017euje\u0161 da ti se bra\u0107a i sestre obra\u0107aju sa
  \u201estari brate\u201c ili \u201estara sestro\u201c? Nipo\u0161to ne zaslu\u017euje\u0161!
  Razme\u0107e\u0161 se svojim poznim godinama i od drugih ljudi uvek tra\u017ei\u0161
  da te po\u0161tuju! Je li dobro da se neko oslovljava sa \u201estari brate\u201c
  ili \u201estara sestro\u201c? (Nije.) Ne, nije, ali to \u010desto \u010dujem. Toliko
  je lo\u0161e, a opet ljudi se starijima i dalje \u010desto obra\u0107aju na ovaj
  na\u010din. Kakva se atmosfera time gradi? Odvratna, zar ne? I \u0161to se starijoj
  osobi \u010de\u0161\u0107e obra\u0107a\u0161 sa \u201estari brate\u201c ili \u201estara
  sestro\u201c, to vi\u0161e oni smatraju da su kvalifikovani i da poseduju uzvi\u0161enu
  vrlinu dostojnu po\u0161tovanja; \u0161to vi\u0161e ih oslovljava\u0161 sa \u201estari
  taj i taj\u201c, oni sve vi\u0161e smatraju da su posebni, da su va\u017eniji i
  bolji od drugih, u svom srcu imaju tendenciju da druge ljude predvode i sve vi\u0161e
  se udaljavaju od stremljenja ka istini. Uvek \u017eele da predvode i da upravljaju
  drugim ljudima, sebe uvek smatraju boljima, dok druge ljude uvek smatraju neprijatnim,
  u drugima uvek vide probleme dok kod sebe samih ne vide nijedan. Recite Mi, mo\u017ee
  li takva osoba i dalje da stremi ka istini? Ne, ne mo\u017ee. Prema tome, oslovljavanje
  ljudi sa \u201estari brate\u201c ili \u201estara sestro\u201c nimalo im ne koristi,
  ve\u0107 samo mo\u017ee da ih povredi i da im na\u0161kodi. Ako ih prosto nazove\u0161
  po imenu i izostavi\u0161 tu titulu \u201estari\u201c, ako ih posmatra\u0161 na
  ispravan na\u010din, kao sebi ravne, njihovo \u0107e stanje i mentalitet postati
  normalni i vi\u0161e se ne\u0107e di\u010diti svojim poodmaklim godinama i na druge
  popreko gledati. Time im se olak\u0161ava da sebe posmatraju kao ljude koji su jednaki
  drugima; sebe i druge \u0107e mo\u0107i pravilno da posmatraju, mo\u0107i \u0107e
  da uvide da su isti kao drugi, ba\u0161 isti kao i obi\u010dni ljudi, i ni po \u010demu
  bolji od ostalih. Ovim \u0107e se njihove pote\u0161ko\u0107e ubla\u017eiti i ne\u0107e
  do\u017eivljavati negativne emocije koje mogu nastati zbog njihovih poodmaklih godina
  i zato \u0161to nisu zadobili istinu, pa \u0107e u tom slu\u010daju biti nade da
  \u0107e stremiti ka istini. Ako se ove negativne emocije ne pojavljuju, oni \u0107e
  svoje sopstvene probleme, a posebno svoju iskvarenu narav, posmatrati uz ispravan
  na\u010din razmi\u0161ljanja. To ima pozitivno i korisno dejstvo na njihovo stremljenje
  ka istini, na njihovu samospoznaju i na njihovu sposobnost da slede put stremljenja
  ka istini. Ne\u0107e li se time re\u0161iti problemi negativnih emocija kod starijih
  ljudi? (Ho\u0107e.) Re\u0161i\u0107e se i vi\u0161e ne\u0107e biti te\u0161ko\u0107a.
  Prema tome, kakav na\u010din razmi\u0161ljanja stariji ljudi treba, pre svega, da
  usvoje? Moraju da usvoje pozitivan na\u010din razmi\u0161ljanja; ne samo da moraju
  da budu razboriti, ve\u0107 moraju da budu i velikodu\u0161ni. Ne smeju da di\u017eu
  larmu zbog stvari koje \u010dine mladi ljudi, ve\u0107 treba da im daju primer i
  poka\u017eu pravi put, a ne da prema njima budu previ\u0161e strogi. Mladi ljudi
  su \u017eustri i hitri na jeziku, stoga nemojte da di\u017eete larmu zbog stvari
  koje oni \u010dine. Mladi su, nezreli i neiskusni i treba im nekoliko godina da
  se prekale. Ovo je na\u010din na koji stvari treba da se odvijaju i stariji ljudi
  to treba da razumeju. Dakle, kakav na\u010din razmi\u0161ljanja treba da usvoje
  stariji ljudi da bi bili u skladu sa istinom? Prema mladima treba ispravno da se
  ophode, a pritom ne smeju da budu nadmeni i uobra\u017eeni, smatraju\u0107i sebe
  veoma iskusnim i pronicljivim. Sebe treba da posmatraju kao obi\u010dne ljude, koji
  su isti kao i svi ostali \u2013 to je ispravan na\u010din postupanja. Stariji ljudi
  ne bi smeli da budu sputani sopstvenim godinama niti moraju da se menjaju da bi
  imali mentalitet mlade osobe. Nije normalno ni da promenite svoj mentalitet u mentalitet
  mlade osobe, kako ne biste bili sputani svojim godinama. Nemojte uvek razmi\u0161ljati:
  \u201ePa, ja sam toliko star, ne mogu da uradim ovo, ne mogu da ka\u017eem ovo,
  ne mogu da uradim ono. Budu\u0107i da sam tako star, moram da uradim ovo, moram
