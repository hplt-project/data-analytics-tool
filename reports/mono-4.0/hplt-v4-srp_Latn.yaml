  Ne znam kakve to veze ima sa na\u0161im odnosom. Vidi\u0161 koje si ti \u0111ubre.
  Nemoj ti mene da ucenjuje\u0161, bre \u2013 govorila je Maja.\\n\u2013 Ja ti unapred
  govorim \u0161ta \u0107e se desiti, to je tako \u2013 kazao je.\\n\u2013 Ti to meni
  sad unapred pri\u010da\u0161? Prebi\u0107u te, ja \u0107u te upropastiti! \u2013
  vikala je Maja, koja je kao furija isko\u010dila iz kreveta. /espreso.rs/\"", "\"Meteorolozi
  za danas najavljuju prete\u017eno sun\u010dano i toplije vreme\\nDuva\u0107e, ka\u017eu,
  slab vetar, a temperature \u0107e dostizati od jutarnjih 13 do \u010dak 32 stepena
  u najtoplijem delu dana. Uve\u010de i tokom no\u0107i, na severu, mogu\u0107i su
  pljuskovi sa grmljavinom.\\nSutra \u0107e u ve\u0107em delu zemlje biti suvo i toplo
  vreme. Naobla\u010denje koje \u0107e najpre zahvatiti severne i zapadne krajeve,
  posle podne i uve\u010de pro\u0161iri\u0107e se i na ostale delove uslovljavaju\u0107i
  mestimi\u010dno ki\u0161u, ili kratkotrajne pljuskove sa grmljavinom. Posle jutarnjih
  15, najvi\u0161a dnevna temperatura bi\u0107e od 29 na severu do 34 stepena na jugoistoku.
  O\u010dekuje se lokalna pojava grmljavine sa padavinama.\\nU ponedeljak promenljivo
  obla\u010dno, sve\u017eije, mestimi\u010dno sa ki\u0161om, pljuskovima i grmljavinom,
  naro\u010dito u zapadnim i centralnim delovima zemlje, a najvi\u0161a dnevna od
  23 na severu i zapadu do 29 na istoku. Sli\u010dno i u utorak, a vi\u0161e padavina
  o\u010dekuje se u centralnim i ju\u017enim delovima zemlje, dok \u0107e najvi\u0161e
  dnevne temperature dostizati do 27 stepeni.\\nSve do nedelje nastavi\u0107e se promenljivo
  obla\u010dno i nestabilno vreme sa \u010destom pojavom ki\u0161e, pljuskova i grmljavine.
  Dnevne temperature bi\u0107e malo ispod proseka ili u granicama proseka za tre\u0107u
  dekadu jula. Prose\u010dna vrednost za taj period je od 26 do 29 stepeni.\\nizvor:
  novosti.rs, foto: NSinfo\"", "\"Ovu haljinu sam zapo\u010dela... ni sama se ne se\u0107am
  kad! Imam dosta takvih stvari u sobi za \u0161ivenje. Zapo\u010dnem ih sva entuzijasti\u010dna,
  sa\u0161ijem ih do pred kraj, probam, a onda shvatim da to nije to.\\n25.8.19\\n9.7.19\\nKona\u010dno
  slikah ovu haljinu. Imam ose\u0107aj da sam je sa\u0161ila jako davno, a njega poja\u010dava
  \u010dinjenica, da kad sam po\u010dinjala pisanje posta, nisam mogla da se setim
  iz kog broja Burde je ovaj kroj!\\n2.7.19\\nMoglo bi se re\u0107i da su haljine
  moja letnja uniforma. Od sredine maja do sredine septembra pantalone ne obla\u010dim.
  To je tako\u0111e i vreme u godini kada imam najvi\u0161e inspiracije za \u0161ivenje.
  Tada ne moram da se teram, prosto u\u017eivam da radim...\\n2.5.19\\nKao da sam
  ju\u010de prelistavala aprilski broj, a ve\u0107 danas listam majsko izdanje Burda
  Style magazina. \u010cudno je kako vreme leti kad se ne radi ni\u0161ta. Da, tako
  je. U aprilu nisam takla ma\u0161inu za \u0161ivenje. Razlog: nedostatak volje.
  Pisa\u0107u jednom o tome. Za sad, da se vratim novom broju...\\n1.4.19\\nVe\u0107
  sam u ranijim postovima pisala o tome kako prole\u0107na izdanja Burde volim vi\u0161e
  od ostalih, me\u0111utim, ako je suditi po ovom prole\u0107u, to bi moglo da se
  promeni... Aprilski broj me je potpuno razo\u010darao. Jedva sam uspela da napabir\u010dim
  par krojeva koji mi se dopadaju.\\n25.3.19\\nNe znam da li sam jedina, ali kad je
  napolju tmurno obi\u010dno moram da se teram da \u0161ijem, a \u010dim krene lepo
  vreme, moja \u017eelja za dru\u017eenjem sa ma\u0161inom za \u0161ivenje poraste...
  Ova godina nije izuzetak. Kad su se pojavile prve naznake prole\u0107a, po\u010dela
  sam da preturam po svojim zalihama materijala i tra\u017eim krojeve sa kojima te
  tkanine da uparim.\\n6.3.19\\nKao po obi\u010daju, po\u010detak meseca rezervisan
  je za prelistavanje novog broja Burde. Prole\u0107na izdanja su mi ina\u010de inspirativnija
  od zimskih, te je zato moje razo\u010darenje martovskim brojem ve\u0107e, jer nema
  mnogo krojeva koji mi se svi\u0111aju. Tako\u0111e, imam ose\u0107aj da su modeli
  ve\u0107 vi\u0111eni u prethodnim brojevima...\\n18.2.19\\nOva godina je za mene
  ba\u0161 traljavo po\u010dela. Nadala sam se da \u0107u uspeti malo vi\u0161e da
  \u0161ijem, ali silne prehlade su me omele, tako da sam januar zavr\u0161ila samo
  sa ovom bluzom...\\n4.2.19\\n15.1.19\\nMada je pro\u0161lo tek tri ili \u010detiri
  nedelje od kad sam poslednji put sela za ma\u0161inu, imam ose\u0107aj kao da je
  to bilo pre par godina. \u0160to je jo\u0161 gore, po\u010dinje da me grize savest
  jer ne \u0161ijem...\"", "\"Ne\u0161to \u010dime sam se u svom mladom dobu najvi\u0161e
  ponosila je set flomastera. Stvar presti\u017ea je bila imati flomastere u bojama
  celog spektra, od bele do crne. Ne znam da li je dana\u0161njoj deci to toliko va\u017eno.
  I tada sam, kao i sada najvi\u0161e volela cigla boju, grimiznu, tirkiznu, te \u010dudne
  boje koje ne pripadaju onim osnovnim, dosadnim.\\nNamerno sam svoje princeze i \u010darobnice
  bojila u ove nijanse. A onda sam, kada su mi kupili knjigu o crtanju i slikanju
  saznala za parisko plavu, kadmijum zelenu, ali i za onu boju koja se zove po Sijeni.
  I da, ta boja potpuno odgovara gradu, ako mene pitate.\\nU srednjoj \u0161koli sam
  nosila isklju\u010divo crnu i bordo, i bila ube\u0111ena da ne volim narand\u017eastu
  i da mi ne stoji, da bih onda namerno sebi kupila tamnonarand\u017eastu bundicu,
  kada mi se dopala ona koju Holi Golajtli nosi u Doru\u010dku kod Tifanija. I tada
  sam shvatila da volim sve boje i da sve samo zavisi od aure dana u kome se probudim.\\nNedavno
  sam bila na predavanju \u010doveka koji ozbiljno promi\u0161lja boje, tako \u0161to
  na svom blogu svakom svom danu dodeli jednu specifi\u010dnu boju koja mu pripada.
  Pri\u010da je mnogo kompleksnija od dodeljivanja bilo koje boje tek tako, iza toga
  kako razumemo neku boju stoji istorija te boje, civilizacije, na\u0161a li\u010dna
  istorija, ukus. Da, svaki na\u0161 dan mogli bismo da opi\u0161emo na razli\u010dite
  na\u010dine, pa i bojom, ali mi je jedna druga stvar zanimljiva. Kako je glava svakog
  od nas puna raznih informacija, ponekad ne mogu da se setim za\u0161to sam zadovoljna
  ili nesre\u0107na. Bukvalno moram da se potrudim, da kopam, kopam kako bih do\u0161la
  do razloga, jer je toliko raznih unakrsnih utisaka. Treba mi vremena da se setim
  da sam \u010dula za neku tragediju pre dva dana, pa da je to uzrok mojoj poti\u0161tenosti.
  Ali i pre nego \u0161to se setim razloga imam boju, mogla bih taj trenutak da je
  njom opi\u0161em.\\nFeeling blue, ka\u017eu Anglosaksonci, a ja plavu pre razumem
  kao smirenu nego tu\u017enu. Ili sam ja ve\u010diti kontra\u0161, nad\u017eak i
  osoba koja voli oluje, kada je unutra u svojoj sobi i mo\u017ee na miru da boji
  svojim flomasterima.\\nFoto za naslovni kola\u017e: Unsplash\"", "\"Voza\u010d Mercedesa
  Luis Hamilton rekao je da nije mogao da predvidi da \u0107e mu se sre\u0107a preokrenuti
  na poslednje dve trke, posebno da \u0107e njegov timski kolega Nika Rozberga biti
  daleko iza njega.\\nPosle dve pobede od udesa sa Rozbergom u prvom krugu Velike
  nagrade \u0160panije, Hamilton je smanjio svoj zaostatak u odnosu na Nemca na samo
  devet bodova. Branilac je to uspeo jer je Rozberg bio sedmi u Monaku i peti u Kanadi,
  gde je Hamilton slavio.\\n\u201cNisam mogao to da predvidim. Da sam se kladion,
