  druge ljude i stvari, i na na\u010din na koji se vladaju i pona\u0161aju.\\nPrethodno
  smo, tako\u0111e, u zajedni\u0161tvu razgovarali o tome kako, u izvesnoj meri, te
  negativne emocije ne dosti\u017eu nivo iskvarenih naravi i iskvarene su\u0161tine,
  ve\u0107 da donekle olak\u0161avaju i pogor\u0161avaju ljudsku iskvarenu narav,
  slu\u017ee\u0107i kao osnova da ljudi obavljaju stvari prema svojoj iskvarenoj naravi,
  i pru\u017eaju\u0107i ljudima razlog vi\u0161e da \u017eive prema svojim iskvarenim
  naravima, potpomognuti tim negativnim emocijama, kao i razlog da svakog drugog ili
  sve drugo posmatraju na temelju svoje iskvarene naravi. Sve te negativne emocije,
  dakle, u razli\u010ditom stepenu uti\u010du na ljudski svakodnevni \u017eivot i,
  u odre\u0111enoj meri, uti\u010du na razli\u010dite ljudske misli i kontroli\u0161u
  ih, uti\u010du na stavove, perspektive i gledi\u0161ta koje oni imaju o istini i
  o Bogu. Mo\u017ee se re\u0107i da te negativne emocije uop\u0161te nemaju dobar
  uticaj na ljude, niti ikakvo pozitivno ili korisno dejstvo, ve\u0107 da, naprotiv,
  ljudima mogu samo da naude. Ba\u0161 zato, kada ljudi \u017eive unutar ovih negativnih
  emocija, njihovo je srce prirodno pod njihovim uticajem i kontrolom, i ne mogu da
  prestanu da \u017eive u stanju negativnosti, pa \u010dak sa apsurdnih polazi\u0161ta
  usvajaju ekstremna gledi\u0161ta o ljudima i stvarima. Kada ljudi posmatraju neku
  osobu ili stvar iz perspektive i sa gledi\u0161ta negativnih emocija, prirodno je
  da \u0107e pona\u0161anje, pristupi i dejstva vladanja i postupaka koje oni proizvode
  biti ukaljani ekstremnim, negativnim i deprimiraju\u0107im emocijama. Te negativne,
  deprimiraju\u0107e i ekstremne emocije nave\u0161\u0107e ljude da se oglu\u0161uju
  o Boga, da Bogom budu nezadovoljni, da Ga okrivljuju, da Mu prkose i da se \u010dak
  suprotstavljaju i, naravno, da Ga mrze. Na primer, ako neka osoba veruje da je prati
  lo\u0161a sudbina, koga \u0107e za to okriviti? Mo\u017eda to ne\u0107e izgovoriti,
  ali \u0107e u svom srcu verovati da je Bog pogre\u0161no postupio i da je On nepravedan,
  pa \u0107e razmi\u0161ljati: \u201eZa\u0161to ga je Bog u\u010dinio tako privla\u010dnim?
  Za\u0161to mu je Bog dozvolio da se rodi u tako poznatoj porodici? Za\u0161to mu
  je On dao takve talente? Za\u0161to mu je podario tako dobar kov? Za\u0161to je
  moj kov toliko lo\u0161? Za\u0161to je za njega Bog uredio da bude vo\u0111a? Za\u0161to
  na mene nikada ne do\u0111e red, za\u0161to se meni makar jednom ne uka\u017ee prilika
  da budem vo\u0111a? Za\u0161to se njemu sve odvija kao podmazano, a kada ja bilo
  \u0161ta radim, ni\u0161ta se ne odvija kako treba ni glatko? Za\u0161to me prati
  tako jadna sudbina? Za\u0161to se meni de\u0161avaju sasvim druga\u010dije stvari?
  Za\u0161to mi se doga\u0111aju samo lo\u0161e stvari?\u201c Iako ovakve misli koje
  nastaju iz deprimiraju\u0107ih emocija ne navode ljude da okrive Boga, niti da se
  u svojoj subjektivnoj svesti protive Bogu i svojoj sudbini, one ipak ljude navode
  da \u010desto i nevoljno zapadaju u emocije neposlu\u0161nosti, nezadovoljstva,
  ogor\u010denosti, zavisti i mr\u017enje u najdubljim odajama svog srca. U ozbiljnim
  slu\u010dajevima, kod ljudi mogu \u010dak izazvati i ekstremnije misli i pona\u0161anja.
  Neki ljudi, na primer, kada vide da su drugi bolji od njih u poslu i da od Boga
  dobijaju pohvale, ose\u0107aju zavist i gnu\u0161anje. Rezultat toga je pokretanje
  niza sitni\u010davih postupaka: govore lo\u0161e o toj osobi i podrivaju je iza
  le\u0111a, kri\u0161om rade neke mutne i nerazumne stvari i tome sli\u010dno. Nastanak
  ovog niza problema neposredno je povezan sa njihovom utu\u010deno\u0161\u0107u i
  negativnim emocijama. Taj niz misli, pona\u0161anja i pristupa koji proizlaze iz
  njihovih deprimiraju\u0107ih emocija isprva mo\u017ee izgledati samo kao neke vrste
  emocija, me\u0111utim, kako se stvari budu odvijale, te negativne i deprimiraju\u0107e
  emocije sve vi\u0161e mogu podsticati ljude da \u017eive prema svojoj iskvarenoj
  sotonskoj naravi. Me\u0111utim, kada se kod ljudi koji shvataju istinu i \u017eive
  sa normalnom ljudsko\u0161\u0107u, jave ove negativne i deprimiraju\u0107e emocije,
  njihova savest i razum mogu trenutno da stupe u akciju. Tada ovi ljudi mogu da opaze
  da su deprimiraju\u0107e emocije prisutne i da ih ometaju, i mogu da ih prozru.
  Tada svoje deprimiraju\u0107e emocije mogu vrlo brzo da ostave za sobom i da, kada
  se susretnu sa ljudima, doga\u0111ajima i stvarima u svom sada\u0161njem okru\u017eenju,
  donose racionalne sudove, te da iz ispravne perspektive racionalno posmatraju situacije
  sa kojima se susre\u0107u i stvari koje do\u017eivljavaju. Kada sve te stvari rade
  racionalno, najosnovnije \u0161to \u0107e ti ljudi mo\u0107i da postignu jeste da
  prihvate upravljanje savesti i razuma normalne ljudskosti. A \u0161to je jo\u0161
  bolje, ako shvataju istinu, mo\u0107i \u0107e na racionalniji na\u010din da se pona\u0161aju
  u skladu sa istina-na\u010delima, na temelju svoje savesti i razuma, a ne da se
  vladaju ili postupaju pod vla\u0161\u0107u svoje iskvarene naravi. Me\u0111utim,
  ako im u srcu preovladaju negativne emocije, koje uti\u010du na njihove misli, gledi\u0161ta
  i na\u010din na koji se bave stvarima i na koji se pona\u0161aju, tada \u0107e ove
  negativne emocije prirodno uticati na njihov napredak u \u017eivotu i dovesti do
  opstrukcije i ometanja njihovih misli, odluka, pona\u0161anja i pristupa, u svakakvim
  situacijama. Sa jedne strane, te negativne emocije omogu\u0107avaju ljudsku iskvarenu
  narav, navode\u0107i ljude da se ose\u0107aju opu\u0161teno i da imaju opravdanje
  da \u017eive u svojoj iskvarenoj naravi; sa druge strane, one tako\u0111e mogu navesti
  ljude da se opiru pozitivnim stvarima i da \u017eive u negativnosti, nespremni da
  vide svetlost. Na taj na\u010din, negativne emocije kod ljudi podivljaju i sve su
  ozbiljnije, pa ljudima nipo\u0161to ne dozvoljavaju da racionalno postupaju u granicama
  savesti i razuma. Umesto toga, one ljude spre\u010davaju da tra\u017ee istinu i
  da \u017eive pred Bogom, pri \u010demu ljudi prirodno postaju sve izopa\u010deniji,
  i ne samo da se ose\u0107aju negativno, ve\u0107 se i udaljavaju od Boga. I kakve
  \u0107e biti posledice budu li se stvari i nadalje ovako odvijale? Ne samo da negativne
  emocije ne mogu da razre\u0161e ljudske iskvarene naravi, ve\u0107 \u0107e ih olak\u0161avati,
  \u0161to \u0107e dovesti do toga da se ljudi bave stvarima i da se pona\u0161aju
  na osnovu svoje iskvarene naravi i da krenu sopstvenim putem. \u0160ta \u0107e ljudi
  u\u010diniti kada u njima preovladaju pogre\u0161ne i ekstremne misli i gledi\u0161ta?
  Ho\u0107e li ometati rad crkve? Ho\u0107e li \u0161iriti negativnost i osu\u0111ivati
  Boga i radne rasporede Bo\u017eje ku\u0107e? Ho\u0107e li okriviti Boga i prkositi
  Mu? Sasvim sigurno ho\u0107e! To su krajnje posledice. Kod ljudi \u0107e se javiti
  niz pristupa, kao \u0161to su neposlu\u0161nost, nezadovoljstvo, negativnost i protivljenje
  \u2013 sve su to posledice negativnih emocija koje ve\u0107 dugo preovla\u0111uju
  u ljudskom srcu. Vidite, i sasvim neznatna negativna emocija \u2013 emocija koju
  ljudi gotovo da ne bi mogli ni da osete, \u010dije postojanje ne bi mogli \u010dak
  ni da naslute niti da osete bilo kakvo njeno dejstvo na sebi \u2013 ta sitna negativna
  emocija ih i dalje prati kao da je sa njima od samog ro\u0111enja. Ona ljudima nanosi
  \u0161tetu svih oblika i veli\u010dina, pa te \u010dak sve vreme obavija, zastra\u0161uje,
  zauzdava i vezuje, do te mere da te neprestano prati, ba\u0161 kao \u0161to to \u010dini
  i tvoj \u017eivot. Ipak, nimalo je nisi svestan, ve\u0107 \u010desto \u017eivi\u0161
  unutar nje i uzima\u0161 je zdravo za gotovo, misle\u0107i: \u201eOvako bi ljudi
  trebalo da misle, nema ni\u010deg lo\u0161eg u tome, sasvim je normalno. Ko nema
  neke aktivne misli poput ovih? Ko nema negativne emocije?\u201c Nisi u stanju da
  oseti\u0161 \u0161tetu koju ti ova negativna emocija nanosi, a ta \u0161teta je
  sasvim stvarna i ti \u0107e\u0161, podstaknut njome, \u010desto nevoljno prirodno
  ispoljiti svoju iskvarenu narav i postupati i vladati se na osnovu svoje iskvarene
  naravi, sve dok naposletku ne bude\u0161 sve \u010dinio na osnovu svoje iskvarene
  naravi. Mo\u017eete zamisliti kakvi su kona\u010dni rezultati ovoga: svi su redom
  negativni, svi \u0161tetni, bez i\u010dega korisnog ili pozitivnog, a kamoli da
  u sebi imaju i\u010dega \u0161to ljudima mo\u017ee pomo\u0107i da zadobiju istinu
  i pohvalu od Boga \u2013 to nisu optimisti\u010dni ishodi. Prema tome, dokle god
  u \u010doveku postoje negativne emocije, sve vrste negativnih misli i gledi\u0161ta
  ozbiljno \u0107e uticati na njegov \u017eivot i u njemu \u0107e preovladavati. Dokle
  god negativne misli i gledi\u0161ta uti\u010du na \u010dovekov \u017eivot i u njemu
  preovla\u0111uju, postoja\u0107e i ogromne prepreke koje \u0107e ga spre\u010davati
  da stremi ka istini, da istinu sprovodi u delo i da zakora\u010di u istina-stvarnost.
  I zato je neophodno da nastavimo sa razotkrivanjem i ra\u0161\u010dlanjivanjem ovih
  negativnih emocija, kako bi sve one mogle da se razre\u0161e.\\nNegativne emocije
  o kojima smo upravo razgovarali u zajedni\u0161tvu ozbiljno uti\u010du na ljude
  i nanose im veliku \u0161tetu, ali postoje i druge negativne emocije koje tako\u0111e
  deluju na ljude i \u0161kode im. Pored negativnih emocija mr\u017enje, besa, inferiornosti
  i utu\u010denosti, o kojima smo ve\u0107 razgovarali, postoje i negativne emocije
  uznemirenosti, strepnje i zabrinutosti. Ove emocije su, tako\u0111e, duboko ukorenjene
  u najdubljim odajama ljudskog srca, i prate ljude u njihovom svakodnevnom \u017eivotu,
  u njihovim re\u010dima i postupcima. Naravno, kada se ljudima ne\u0161to dogodi,
  te emocije, tako\u0111e, uti\u010du na misli i gledi\u0161ta koji nastaju u njima,
  kao i na stavove i uglove posmatranja koje zauzimaju. Danas \u0107emo ra\u0161\u010dlaniti
  i razotkriti negativne emocije uznemirenosti, strepnje i zabrinutosti, u nastojanju
  da ljudima pomognemo da ih u sebi otkriju. Nakon \u0161to u sebi otkriju ove negativne
  emocije, ljudima je krajnji cilj da temeljno spoznaju te negativne emocije, da ih
  otklone, da vi\u0161e ne \u017eive pod njihovim uticajem, i da vi\u0161e ne \u017eive
  i ne pona\u0161aju se koriste\u0107i ove negativne emocije kao svoj osnov i polazi\u0161te.
  Pogledajmo, pre svega, re\u010di \u201euznemirenost, strepnja i zabrinutost\u201c.
  Nisu li to na\u010dini izra\u017eavanja emocija? (Jesu.) Pre nego \u0161to zajedno
  porazgovaramo o ovoj temi, hajde da je najpre malo promislimo, kako biste stekli
  osnovni koncept o \u201euznemirenosti, strepnji i zabrinutosti\u201c. Bilo da dopirete
  do doslovnog zna\u010denja tih re\u010di ili do njihovog dubljeg zna\u010denja mimo
  onog doslovnog, ste\u0107i \u0107ete osnovno znanje o tim negativnim emocijama.
  Prvo Mi recite \u0161ta vas je u pro\u0161losti navodilo na zabrinutost, odnosno,
  zbog kojih stvari oduvek ose\u0107a\u0161 uznemirenost, strepnju i zabrinutost.
  One mogu biti poput velikog kamena koji te mrvi ili poput senke koja te uvek prati
  i za koju si vezan. (Bo\u017ee, re\u0107i \u0107u nekoliko re\u010di. Kada u svojoj
  du\u017enosti ne posti\u017eem rezultate, ova emocija je prili\u010dno izra\u017eena
  i zabrinut sam ho\u0107u li biti razotkriven i uklonjen, ho\u0107u li imati dobru
  budu\u0107nost i dobro odredi\u0161te. Kada u svojoj du\u017enosti posti\u017eem
  dobre rezultate, ne ose\u0107am se tako, ali kada ih neko vreme ne posti\u017eem,
  ova vrsta negativne emocije postaje krajnje o\u010digledna.) Nije li to ispoljavanje
  negativnih emocija uznemirenosti, strepnje i zabrinutosti? (Jeste.) Tako je. Ova
  vrsta negativnih emocija sve vreme se krije u najdubljim odajama ljudskog srca,
  i neprekidno uti\u010de na misli ljudi. I premda ljudi, ako im se ni\u0161ta lo\u0161e
  nije dogodilo, ne mogu da osete ovu vrstu negativne emocije, ona je nalik mirisu,
  ili nekoj vrsti gasa, a mo\u017eda je jo\u0161 i vi\u0161e nalik elektri\u010dnom
  talasu. Ne mo\u017ee\u0161 da je vidi\u0161, a kad je nisi svestan, ne mo\u017ee\u0161
  \u010dak ni da je oseti\u0161. Me\u0111utim, u najdubljim odajama svog srca, njeno
  prisustvo uvek mo\u017ee\u0161 da nasluti\u0161, putem takozvanog \u0161estog \u010dula,
  i uvek podsvesno mo\u017ee\u0161 da oseti\u0161 postojanje takve misli i emocije.
  U odgovaraju\u0107e vreme, na odgovaraju\u0107em mestu i u odgovaraju\u0107im okolnostima,
  ova vrsta negativne emocije \u0107e malo-pomalo narasti i malo-pomalo izbijati na
  povr\u0161inu. Zar nije tako? (Jeste.) Dakle, zbog kojih drugih stvari ose\u0107ate
  uznemirenost, strepnju i zabrinutost? Zar, osim ovoga \u0161to je upravo pomenuto,
  nema vi\u0161e ne\u010dega? Ako je tako, onda vi zasigurno \u017eivite sre\u0107no
  i bezbri\u017eno, bez ikakve strepnje, i ose\u0107aja uznemirenosti zbog bilo \u010dega
  \u2013 u tom slu\u010daju biste zaista bili slobodna osoba. Da li tako stoje stvari?
  (Ne.) Pa onda, recite Mi, \u0161ta vam je u srcu. (Kada svoju du\u017enost ne obavljam
  kako treba, uvek sam zabrinut da \u0107u izgubiti ugled i status, brinem \u0161ta
  \u0107e moja bra\u0107a i sestre misliti o meni i kakvo \u0107e mi\u0161ljenje moj
  vo\u0111a imati o meni. Isto tako, kada zajedni\u010dkim radom sa svojom bra\u0107om
  i sestrama obavljam svoju du\u017enost i neprekidno otkrivam svoju iskvarenu narav,
  uvek sam zabrinut zbog toga \u0161to ve\u0107 dugi niz godina verujem u Boga, a
  ipak se uop\u0161te nisam promenio, te da bih, budu li se stvari i dalje tako odvijale,
  jednoga dana mogao biti uklonjen. To su bojazni koje imam.) Kada imate ove bojazni,
  da li u vama nastaju negativne emocije uznemirenosti, strepnje i zabrinutosti? (Nastaju.)
  Dakle, ve\u0107ina vas strepi i zabrinuta je jer svoju du\u017enost ne obavlja kako
  treba, je li tako? (Uglavnom sam zabrinut za svoju budu\u0107nost i za svoju sudbinu.)
  Preovla\u0111uje zabrinutost za sopstvenu budu\u0107nost i sudbinu. Kada ljudi nisu
  u stanju da proniknu u okru\u017eenja koja Bog orkestrira i u Njegovu suverenost,
  kada ne mogu da ih shvate, da ih prihvate niti da im se pokore, i kada se ljudi
  u svom svakodnevnom \u017eivotu suo\u010davaju sa raznim te\u0161ko\u0107ama ili
  kada te pote\u0161ko\u0107e nadilaze ono \u0161to normalni ljudi mogu da podnesu,
  oni podsvesno ose\u0107aju razne vrste zabrinutosti i strepnje, pa \u010dak i uznemirenosti.
  Ne znaju \u0161ta im donosi sutra\u0161nji dan, ili dan nakon toga, ne znaju kako
  \u0107e se stvari odvijati za nekoliko godina, niti kakva \u0107e im biti budu\u0107nost,
  pa zato, povodom svakakvih stvari, ose\u0107aju uznemirenost, strepnju i zabrinutost.
  U kojim okolnostima ljudi ose\u0107aju uznemirenost, strepnju i zabrinutost povodom
  svakakvih stvari? U onim okolnostima u kojima ne veruju u suverenost Bo\u017eju
  \u2013 odnosno, kada nisu u stanju da poveruju u Bo\u017eju suverenost niti da u
  nju proniknu. \u010cak i da su je videli ro\u0111enim o\u010dima, ne bi je shvatili
  niti bi u nju poverovali. Ne veruju da nad njihovom sudbinom Bog ima suverenost,
  ne veruju da je njihov \u017eivot u Bo\u017ejim rukama, pa se otud u njihovom srcu
  javlja nepoverenje prema Bo\u017ejoj suverenosti i ure\u0111enjima, te sledi optu\u017eivanje
  i nesposobnost da se pokore. Pored toga \u0161to optu\u017euju i nisu u stanju da
  se pokore, ljudi \u017eele da zagospodare svojom sudbinom i da postupaju pokrenuti
  vlastitom inicijativom. A kakvo je stvarno stanje stvari kad samoinicijativno po\u010dnu
  da deluju? Tada jedino mogu da \u017eive uzdaju\u0107i se u sopstveni kov i sposobnosti;
  me\u0111utim, postoje mnoge stvari koje, uz sopstveni kov i sposobnosti, ne mogu
  da postignu, do kojih ne mogu da do\u0111u niti da ih ostvare. Na primer: \u0161ta
  \u0107e im se dogoditi u budu\u0107nosti, ho\u0107e li mo\u0107i da se upi\u0161u
  na fakultet, ho\u0107e li, kad zavr\u0161e fakultet, mo\u0107i da prona\u0111u dobar
  posao i ho\u0107e li se, kada dobiju taj posao, za njih sve odvijati kako treba;
  a ako \u017eele da se uzdignu na dru\u0161tvenoj lestvici i obogate se, da li \u0107e
  za nekoliko godina mo\u0107i da ostvare svoje ideale i \u017eelje; a kada po\u017eele
  da prona\u0111u partnera, da se ven\u010daju i zasnuju porodicu, kakav \u0107e im
  partner odgovarati? \u010coveku su takve stvari nepoznate. A kada su im takve stvari
  nepoznate, ljudi ne znaju kako da postupaju. Kada ne znaju kako da postupe, ljudi
  postaju uznemireni, strepe i zabrinuti su \u2013 ose\u0107aju uznemirenost, strepnju
  i zabrinutost u pogledu svega \u0161to im budu\u0107nost donosi. Za\u0161to je to
  tako? Zato \u0161to, u okvirima normalne ljudskosti, ljudi naprosto ne mogu da podnesu
  sve te stvari. Niko ne zna \u0161ta mu predstoji za nekoliko godina, niko ne zna
  kakvi \u0107e mu u budu\u0107nosti biti posao, brak ili deca \u2013 ljudi naprosto
  ne znaju te stvari. U okviru sposobnosti normalne ljudskosti, takve stvari se ne
  mogu predvideti, pa zato spram njih ljudi uvek ose\u0107aju uznemirenost, strepnju
  i zabrinutost. Ma kako jednostavan bio \u010dovekov um, dokle god je \u010dovek
  u stanju da razmi\u0161lja, ove negativne emocije \u0107e se, jedna za drugom, pojavljivati
  u najdubljim odajama njegovog srca \u010dim on zakora\u010di u odraslo doba. Za\u0161to
  se kod ljudi javljaju uznemirenost, strepnja i zabrinutost? Zato \u0161to se ljudi
  uvek uzrujavaju i uznemiravaju oko stvari koje prevazilaze njihove mogu\u0107nosti;
  uvek \u017eele da znaju, da shvate i dostignu stvari koje nadilaze njihove mogu\u0107nosti,
  pa \u010dak i da kontroli\u0161u stvari koje su van okvira sposobnosti normalne
  ljudskosti. \u017dele da kontroli\u0161u sve to, pa i vi\u0161e od toga \u2013 \u017eele
  da se zakonitosti i rezultati razvoja ovih stvari odvijaju i ispunjavaju u skladu
  sa njihovom voljom. Stoga, kada u njima preovladaju takve iracionalne misli, ljudi
  ose\u0107aju uznemirenost, strepnju i zabrinutost, a posledice tih emocija se razlikuju
  od osobe do osobe. Bez obzira na to zbog \u010dega ose\u0107aju sna\u017enu uznemirenost,
  strepnju ili zabrinutost, \u010dime i stvaraju ove negativne emocije, ljudi bi trebalo
  da ih shvate veoma ozbiljno i da tra\u017ee istinu kako bih ih razre\u0161ili.\\nRazgovara\u0107emo
  o negativnim emocijama uznemirenosti, strepnje i zabrinutosti prvenstveno iz dva
  ugla posmatranja: prvi \u0107e biti da ra\u0161\u010dlanimo ljudske pote\u0161ko\u0107e
  da bismo ustanovili \u0161ta su one zapravo i da bismo, sa tog polazi\u0161ta, uvideli
  koji su ta\u010dno razlozi za nastanak negativnih emocija uznemirenosti, strepnje
  i zabrinutosti, i kako one ta\u010dno nastaju. Drugi ugao posmatranja bi\u0107e
  da analiziramo negativne emocije uznemirenosti, strepnje i zabrinutosti kroz razli\u010dite
  stavove koje ljudi imaju prema Bo\u017ejem delu. Da li razumete? (Da.) Koliko uglova
  posmatranja postoji? (Dva.) Razloge za nastanak negativnih emocija uznemirenosti,
  strepnje i zabrinutosti treba da ra\u0161\u010dlanimo prvo na osnovu pote\u0161ko\u0107a
  koje ljudi imaju, a zatim na osnovu ljudskih stavova prema Bo\u017ejem delu. Ponovite
  Mi to. (Razloge za nastanak negativnih emocija uznemirenosti, strepnje i zabrinutosti
  treba da ra\u0161\u010dlanimo prvo na osnovu pote\u0161ko\u0107a koje ljudi imaju,
  a zatim na osnovu ljudskih stavova prema Bo\u017ejem delu.) Ljudi mogu imati brojne
  pote\u0161ko\u0107e, pri \u010demu se sa svima njima susre\u0107u u svom svakodnevnom
  \u017eivotu, sa pote\u0161ko\u0107ama koje se \u010desto javljaju u okviru odvijanja
  \u017eivota normalne ljudskosti. Kako nastaju ove pote\u0161ko\u0107e? Nastaju tako
  \u0161to ljudi uvek poku\u0161avaju da nadma\u0161e sebe, uvek nastoje da kontroli\u0161u
  sopstvenu sudbinu, da unapred saznaju svoju budu\u0107nost. Ako im budu\u0107nost
  ne izgleda dobro, istoga \u010dasa kre\u0107u u potragu sa stru\u010dnjakom za feng
  \u0161ui ili za gatarom, koji \u0107e to otkloniti i ispraviti. Ba\u0161 zato se
  ljudi susre\u0107u sa toliko pote\u0161ko\u0107a u svom svakodnevnom \u017eivotu,
  a upravo te pote\u0161ko\u0107e ljude navode da \u010desto skliznu u negativne emocije
  uznemirenosti, strepnje i zabrinutosti. Koje su to pote\u0161ko\u0107e? Pogledajmo
  prvo \u0161ta ljudi smatraju svojom najve\u0107om pote\u0161ko\u0107om \u2013 \u0161ta
  bi to moglo biti? To su njihovi izgledi za budu\u0107nost, odnosno, kakva \u0107e
  biti budu\u0107nost neke osobe u ovom \u017eivotu, ho\u0107e li ona u budu\u0107nosti
  biti imu\u0107na ili obi\u010dna, ho\u0107e li mo\u0107i da se istakne, da postigne
  veliki uspeh i da napreduje u svetu i me\u0111u ljudima. Naro\u010dito onima koji
  veruju u Boga mo\u017eda nije poznato \u0161ta \u0107e se drugima dogoditi u budu\u0107nosti,
  ali su \u010desto zabrinuti zbog sopstvene budu\u0107nosti i stalno se pitaju: \u201eDa
  li se na ovo svodi verovanje u Boga? Da li \u0107u u budu\u0107nosti ikada uspeti
  da se izdvojim iz gomile? Ho\u0107u li u Bo\u017ejoj ku\u0107i mo\u0107i da preuzmem
  va\u017enu ulogu? Ho\u0107u li mo\u0107i da budem vo\u0111a tima ili neko ko je
  na odgovornoj poziciji? Ho\u0107u li mo\u0107i da budem vo\u0111a? \u0160ta \u0107e
  biti sa mnom? Ako svoju du\u017enost u Bo\u017ejoj ku\u0107i stalno obavljam na
  ovaj na\u010din, \u0161ta \u0107e na kraju biti sa mnom? Ho\u0107u li dosti\u0107i
  spasenje? Imam li ikakvih izgleda za budu\u0107nost? Treba li da i dalje obavljam
  svoj posao u svetu? Treba li da nastavim da sti\u010dem profesionalne ve\u0161tine
  koje sam ranije u\u010dio ili da se dodatno obrazujem? Ako mogu da nastavim da obavljam
  svoju du\u017enost u Bo\u017ejoj ku\u0107i sa punim radnim vremenom, ne bi trebalo
  da imam problema sa osnovnim \u017eivotnim potrep\u0161tinama, ali ako svoju du\u017enost
  ne obavljam kako treba i budem preme\u0161ten ili smenjen, od \u010dega \u0107u
  onda \u017eiveti? Treba li sada da iskoristim priliku, pre nego \u0161to budem smenjen
  ili uklonjen, kako bih se pripremio za takvu mogu\u0107nost?\u201c Pitaju se o tim
  stvarima, nastoje da imaju neku u\u0161te\u0111evinu i razmi\u0161ljaju: \u201eKoliko
  godina mogu da izdr\u017eim sa ovom u\u0161te\u0111evinom? Sada sam u tridesetim,
  a za deset godina \u0107u biti u \u010detrdesetim godinama. Ako me uklone iz crkve,
  kada se vratim u svet, ho\u0107u li mo\u0107i da idem u korak sa postoje\u0107im
  okolnostima? Ho\u0107u li biti dovoljno dobrog zdravlja da mogu da nastavim sa radom?
  Ho\u0107u li mo\u0107i dovoljno da zaradim za \u017eivot? Ho\u0107e li mi biti te\u0161ko
  da \u017eivim? U Bo\u017ejoj ku\u0107i obavljam svoju du\u017enost, no, da li \u0107e
  me Bog zadr\u017eati do kraja?\u201c Iako o ovim stvarima neprekidno razmi\u0161ljaju,
  odgovore nikad ne pronalaze. I premda nikada nema nikakvog zaklju\u010dka, ne mogu
  a da o ovim stvarima neprestano ne razmi\u0161ljaju \u2013 to je van njihove kontrole.
  Kada se suo\u010de sa nekim neuspehom ili sa pote\u0161ko\u0107om ili ako se ne\u0161to
  ne odvija prema njihovoj \u017eelji, u najdubljim odajama svog srca razmatraju ove
  stvari, a da nikome o tome ne govore. Kada budu podvrgnuti orezivanju, kada budu
  smenjeni sa svojih du\u017enosti, kada budu preme\u0161teni na neke druge du\u017enosti
  ili kada se suo\u010de sa nekom kriznom situacijom, neki ljudi nevoljno tra\u017ee
  put za povla\u010denje i ne mogu da odole da ne kuju i da ne razra\u0111uju planove
  u pogledu svojih narednih koraka. \u0160ta god da se na kraju dogodi, ljudi, ipak,
  \u010desto kuju i razra\u0111uju planove vezane za stvari zbog kojih ose\u0107aju
  zabrinutost, strepnju i uznemirenost. Nisu li to stvari o kojima ljudi razmi\u0161ljaju
  zarad svojih budu\u0107ih izgleda? Zar te negativne emocije ne nastaju zato \u0161to
  ljudi ne mogu da otpuste svoje budu\u0107e izglede? (Da, zato nastaju.) Kada se
  ljudi ose\u0107aju naro\u010dito poletno i kada se tokom obavljanja njihove du\u017enosti
  stvari odvijaju kao podmazane, i posebno onda kada budu unapre\u0111eni, kada budu
  anga\u017eovani za neke va\u017ene zadatke, kada u\u017eivaju podr\u0161ku ve\u0107ine
  svoje bra\u0107e i sestara, i kada se u tome ogleda njihova sopstvena vrednost,
  oni ne razmi\u0161ljaju o ovim negativnim emocijama. Onoga \u010dasa kada njihov
  ugled, status i interesi budu ugro\u017eeni, oni ne mogu a da se ne povuku u negativne
  emocije uznemirenosti, strepnje i zabrinutosti. Nakon \u0161to se vrate u te negativne
  emocije, na\u010din na koji pristupaju tim negativnim emocijama ne sastoji se u
  tome da od njih pobegnu ili da ih odbace, ve\u0107 radije u tome da im udovolje
  i da uporno poku\u0161avaju da potonu u ova ose\u0107anja uznemirenosti, strepnje
  i zabrinutosti, da \u0161to dublje u\u0111u u njih. Za\u0161to ovo govorim? Kada
  ljudi potonu u ove negativne emocije, tada imaju razlog vi\u0161e, opravdanje vi\u0161e
  da prave planove za svoju budu\u0107nost i za svoje naredne korake i to mogu da
  \u010dine slobodnije. I dok prave te planove, smatraju da ba\u0161 tako i treba
  da bude, da je to ono \u0161to treba raditi, i koriste izreku: \u201eSpasavaj se
  ko mo\u017ee, a poslednjeg \u0111avo neka nosi\u201c, kao i jo\u0161 jednu izreku:
  \u201eOnoga ko za budu\u0107nost nema planove zadesi\u0107e grdne nevolje\u201c,
  u zna\u010denju da ako unapred ne isplanira\u0161 svoju budu\u0107nost i sudbinu
  i o njima ne razmisli\u0161, niko drugi o njima ne\u0107e brinuti umesto tebe, niti
  \u0107e za njih mariti. Kada nema\u0161 predstavu kako da preduzme\u0161 svoj slede\u0107i
  korak, suo\u010di\u0107e\u0161 se sa nespretno\u0161\u0107u, bolom i sramotom, i
  ti si taj koji \u0107e patiti i podnositi neda\u0107e. Dakle, ljudi smatraju da
  su veoma pametni i svakim korakom koji preduzmu predvi\u0111aju deset koraka unapred.
  Onoga \u010dasa kada se suo\u010de sa bilo kakvom pote\u0161ko\u0107om ili razo\u010daranjem,
  odmah se vra\u0107aju u svoje negativne emocije uznemirenosti, strepnje i zabrinutosti
  kako bi sebe za\u0161titili, kako bi osigurali svoju budu\u0107nost i svoj naredni
  korak u \u017eivotu, kako bi imali ne\u0161to da pojedu i ne\u0161to da obuku, kako
  ne bi tumarali ulicama i kako ne bi oskudevali u hrani ili ode\u0107i. Stoga, pod
  uticajem ovih negativnih emocija, sebe \u010desto upozoravaju, misle\u0107i: \u201eMoram
  unapred da napravim planove, da zadr\u017eim neke stvari za sebe i da sebi napravim
  odstupnicu. Ne smem da budem glup \u2013 moja sudbina je u mojim rukama. Ljudi \u010desto
  govore: \u2019Na\u0161a je sudbina u Bo\u017ejim rukama i Bog suvereno vlada nad
  \u010dovekovom sudbinom\u2019, ali je to samo isprazna slatkore\u010divost. Ko je
  to uop\u0161te video? Kako to Bog ima suverenost nad na\u0161om sudbinom? Ko je
  zaista video Boga da za nekoga li\u010dno organizuje tri obroka dnevno ili da ure\u0111uje
  sve stvari koje su mu potrebne u \u017eivotu? Niko.\u201c Kada ne vide Bo\u017eju
  suverenost i ako zbog svojih budu\u0107ih izgleda ose\u0107aju uznemirenost, strepnju
  i zabrinutost, ljudi smatraju da su im tada te negativne emocije neka vrsta za\u0161tite,
  poput odbrambenog \u0161tita, sigurnog uto\u010di\u0161ta. Neprestano sebe upozoravaju
  i podse\u0107aju da naprave planove za budu\u0107nost, da moraju da brinu o sutra\u0161njem
  danu, da ne smeju da po ceo dan samo pune stomake i besposli\u010dare, da nije pogre\u0161no
  praviti planove za sebe, prona\u0107i izlaz za sebe i raditi danono\u0107no za sopstvenu
  budu\u0107nost. Sebi govore da je to prirodno i savr\u0161eno opravdano i da nema
  razloga za stid. Prema tome, iako ljudi veruju da su uznemirenost, strepnja i zabrinutost
  negativne emocije, nikad ne pomi\u0161ljaju da je lo\u0161e to \u0161to ih ose\u0107aju,
  nikada ne pomi\u0161ljaju da bi im te negativne emocije na bilo koji na\u010din
  mogle na\u0161koditi, niti da bi mogle biti prepreke u njihovom stremljenju ka istini
  i za ulazak u istina-stvarnost. Umesto toga, u njima neumorno u\u017eivaju, svojevoljno
  i bez prestanka \u017eive u tim negativnim emocijama. A to je stoga \u0161to veruju
  da mogu biti sigurni jedino ako \u017eive unutar ovih negativnih emocija i ako neprekidno
  ose\u0107aju uznemirenost, strepnju i zabrinutost zbog svojih budu\u0107ih izgleda.
  U suprotnom, ko bi jo\u0161 ose\u0107ao uznemirenost, strepnju i zabrinutost zbog
  svoje budu\u0107nosti? Niko. Niko ih ne voli vi\u0161e od njih samih, niko ih ne
  razume kao \u0161to ih oni razumeju, niti ih iko sti\u010de kao \u0161to ih oni
  sti\u010du. Prema tome, \u010dak i ako ljudi, u izvesnoj meri i u smislu re\u010di
  i doktrina, mogu da prepoznaju da je postojanje takvih negativnih emocija za njih
  \u0161tetno, ipak nisu voljni da odustanu od tih negativnih emocija jer im te negativne
  emocije omogu\u0107avaju da \u010dvrsto preuzmu inicijativu kako bi dograbili i
  zauzdali sopstvenu budu\u0107nost. Da li je ispravno ovo re\u0107i? (Da.) Prema
  tome, za ljude je zabrinutost, ose\u0107anje strepnje i ose\u0107anje uznemirenosti
  zbog sopstvene budu\u0107nosti stvar ogromne odgovornosti. Nije im sramno, nije
  im jadno, nije im mrsko, ve\u0107 im je ba\u0161 potaman. Zato je ljudima veoma
  te\u0161ko da otpuste ove negativne emocije, ba\u0161 kao da ih one prate od samog
  ro\u0111enja. Sve o \u010demu ljudi razmi\u0161ljaju od svog ro\u0111enja ti\u010de
  se njih samih i vlastiti budu\u0107i izgledi su im najva\u017eniji. Ako svoju budu\u0107nost
  \u010dvrsto prigrabe i na nju neprekidno motre, misle da \u0107e pro\u017eiveti
  \u017eivot bez ikakvih briga. Misle da \u0107e uz dobre budu\u0107e izglede imati
  sve \u0161to po\u017eele i da \u0107e to biti prosto kao pasulj. I tako, ljudima
  nikada ne dosadi da svaki put iznova ose\u0107aju uznemirenost, strepnju i zabrinutost
  zbog svoje budu\u0107nosti. Iako je Bog dao Svoje obe\u0107anje, iako su ljudi u\u017eivali
  ili dobili toliko blagodati od Boga, iako su videli da Bog ljudskom rodu daruje
  svakakve blagoslove i svedo\u010dili drugim sli\u010dnim \u010dinjenicama, ljudi
  i dalje \u017eele da \u017eive u negativnim emocijama uznemirenosti, strepnje i
  zabrinutosti, kao i da prave planove i projekte za sopstvenu budu\u0107nost.\\nOsim
  budu\u0107ih izgleda, postoji jo\u0161 ne\u0161to va\u017eno, ne\u0161to zbog \u010dega
  ljudi, tako\u0111e, \u010desto ose\u0107aju uznemirenost, strepnju i zabrinutost,
  a to je brak. Neki ljudi se ne optere\u0107uju time i ne brine ih \u0161to u svojim
  tridesetim jo\u0161 uvek nisu u braku, jer danas ima mnogo neven\u010danih u tim
  godinama. To je \u010desta pojava u dru\u0161tvu i niko ti se zbog toga ne\u0107e
  podsmevati, niko ne\u0107e re\u0107i da sa tobom ne\u0161to nije u redu. Ako se,
  me\u0111utim, ne ven\u010daju ni do \u010detrdesete, duboko u sebi po\u010dinju
  da ose\u0107aju blagi napad panike i razmi\u0161ljaju: \u201eTreba li da potra\u017eim
  partnera ili ne? Treba li da se ven\u010dam ili ne? Ako se ne ven\u010dam i ne zasnujem
  porodicu, ako ne budem imao dece, ho\u0107u li imati ikoga da brine o meni kada
  ostarim? Ho\u0107e li se iko brinuti o meni kada se razbolim? Ho\u0107u li imati
  ikoga da mi organizuje sahranu kad umrem?\u201c Ljudi brinu o ovim stvarima. Oni
  koji ne planiraju da se ven\u010daju ne ose\u0107aju toliku uznemirenost, strepnju
  ili zabrinutost. Na primer, neki ljudi ka\u017eu: \u201eSada verujem u Boga i spreman
  sam da se dam za Boga. Ne nameravam da tra\u017eim partnera niti da se ven\u010dam.
  Bez obzira na svoje godine, zbog ovih stvari ne nameravam da se ose\u0107am uznemireno.\u201c
  Neo\u017eenjeni, ljudi koji nisu u vezi po 10 ili 20 godina, koji su sami od svoje
  20. do 40. godine, ne bi trebalo da imaju ve\u0107ih briga. Iako povremeno mogu
  osetiti manju zabrinutost i uznemirenost zbog uticaja okru\u017eenja ili objektivnih
  razloga, po\u0161to veruju u Boga i zauzeti su obavljanjem svoje du\u017enosti,
  i po\u0161to se dosad nisu predomislili, ose\u0107aju samo nejasnu zabrinutost koja
  se javlja tek povremeno i ne predstavlja neki naro\u010dit problem. Ovakva emocija,
  koja ne uti\u010de na normalno obavljanje du\u017enosti, nije \u0161tetna za ljude,
  niti se mo\u017ee smatrati negativnom emocijom. Odnosno, za tebe se ova stvar nije
  pretvorila u negativnu emociju. A kada je re\u010d o onima koji su ve\u0107 u braku,
  o \u010demu oni brinu? Ako i mu\u017e i \u017eena veruju u Boga i obavljaju svoje
  du\u017enosti, ho\u0107e li taj brak opstati? Da li porodica postoji? \u0160ta je
  sa decom? Osim toga, kad jedan od supru\u017enika stremi ka istini a drugi ne, ako
  onaj koji ne stremi ka istini uvek te\u017ei svetovnim stvarima, te\u017ei bogatstvu
  u \u017eivotu, dok onaj koji stremi ka istini uvek \u017eeli da obavlja svoju du\u017enost,
  onda bi onaj koji ne stremi ka istini uvek rado svog supru\u017enika spre\u010dio
  u tome ali mu je neprijatno, te povremeno iznosi pritu\u017ebe ili govori negativno
  kako bi sputao svog supru\u017enika. Tada \u0107e se onaj supru\u017enik koji stremi
  ka istini zapitati: \u201eMoj mu\u017e zapravo ne veruje u Boga, pa \u0161ta \u0107e
  sa nama biti u budu\u0107nosti? Ako se razvedemo, bi\u0107u sama i ne\u0107u mo\u0107i
  da se izdr\u017eavam. Ostanem li sa njim, ne\u0107emo i\u0107i istim putem, sneva\u0107emo
  o razli\u010ditim stvarima, i \u0161ta \u0107u onda da u\u010dinim?\u201c Zbog tih
  stvari, ta osoba ose\u0107a uznemirenost, strepnju i zabrinutost. Kad po\u010dnu
  da veruju u Boga, pojedine sestre smatraju da ih mu\u017eevi, iako sami nisu vernici,
  zapravo previ\u0161e ne ko\u010de u veri u Boga, da ih ni na koji na\u010din ne
  progone, te da nema razloga da se od njih razvedu. Me\u0111utim, ostanu li zajedno,
  uvek se ose\u0107aju sputano i kao da trpe neki uticaj. \u0160ta to na njih uti\u010de?
  Sputane su sopstvenim ose\u0107anjima i pod njihovim su uticajem, a razli\u010dite
  pote\u0161ko\u0107e u porodi\u010dnom \u017eivotu i braku povremeno uskome\u0161aju
  stvari u dubini njihovog srca, navode\u0107i ih da osete izvesnu uznemirenost, strepnju
  i zabrinutost, za koje se ne mo\u017ee re\u0107i da su ni prevelike ni premale.
  U takvim okolnostima, brak je formalnost koja odr\u017eava normalan porodi\u010dni
  \u017eivot i postaje ne\u0161to \u0161to sputava normalan na\u010din razmi\u0161ljanja
  \u017eena, njihov normalan \u017eivot, pa \u010dak i normalno obavljanje njihovih
  du\u017enosti \u2013 taj brak je te\u0161ko odr\u017eati, ali one iz njega ne mogu
  da se izvuku. Nema naro\u010ditog razloga da se takav brak odr\u017ei, niti naro\u010ditog
  razloga da se one razvedu; nema dovoljnog razloga da se preduzme nijedan od ovih
  koraka. One ne znaju koju bi odluku bilo pravilno doneti, a ne znaju ni \u0161ta
  je pogre\u0161no. Stoga u njima nastaju uznemirenost, strepnja i zabrinutost. Ova
  ose\u0107anja uznemirenosti, strepnje i zabrinutosti im neprestano lebde u mislima,
  sputavaju ih u svakodnevnom \u017eivotu, a uti\u010du i na njihov normalan \u017eivot.
  Tokom obavljanja du\u017enosti, ove su im stvari neprestano u mislima i javljaju
  se u najdubljim odajama njihovog srca, uti\u010du\u0107i na normalno obavljanje
  njihovih du\u017enosti. Iako ove stvari ne daju jasnu poruku o tome \u0161ta ove
  \u017eene treba da u\u010dine ili kakvu odluku treba da donesu, one uzrokuju da
  te \u017eene budu duboko zaglavljene u negativnim emocijama uznemirenosti, strepnje
  i zabrinutosti, usled \u010dega se ose\u0107aju potla\u010deno i zarobljeno. Zar
  to nije jo\u0161 jedna od pote\u0161ko\u0107a? (Jeste.) To je jo\u0161 jedna od
  pote\u0161ko\u0107a i to ona izazvana brakom.\\nA ima i onih koji, zato \u0161to
  su po\u010deli da veruju u Boga, da \u017eive crkvenim \u017eivotom, da \u010ditaju
  Bo\u017eje re\u010di i obavljaju svoje du\u017enosti, ne\u0107e imati vremena da
  se normalno dru\u017ee sa svojom decom, \u017eenama (ili mu\u017eevima), roditeljima,
  prijateljima ili srodnicima koji su nevernici. Konkretno, oni ne\u0107e mo\u0107i
  da se pravilno staraju o svojoj deci koja su nevernici, niti da obavljaju i\u0161ta
  od onih stvari koje su potrebne njihovoj deci, pa su stoga zabrinuti za budu\u0107nost
  i izglede svoje dece. Naro\u010dito kada im deca odrastu, pojedini ljudi \u0107e
  po\u010deti da se uzrujavaju: ho\u0107e li se moje dete upisati na fakultet ili
  ne\u0107e? Ako upi\u0161e fakultet, za koji smer \u0107e se odlu\u010diti? Moje
  dete ne veruje u Boga i \u017eeli da upi\u0161e fakultet. Da li ja, kao neko ko
  veruje u Boga, treba da mu pla\u0107am studiranje? Treba li da brinem o njegovim
  svakodnevnim potrebama i da ga izdr\u017eavam tokom studija? A kada do\u0111e do
  toga da se dete ven\u010da, zaposli ili \u010dak zasnuje sopstvenu porodicu, kakvu
  ulogu treba da obavljam? \u0160ta treba i \u0161ta ne treba da radim? Oni nemaju
  pojma o ovim stvarima. \u010cim se ovakva okolnost pojavi, \u010dim se na\u0111u
  u takvoj situaciji, potpuno se izgube i nemaju predstavu \u0161ta da u\u010dine,
  niti znaju kako da se bave ovim stvarima. I kako vreme prolazi, povodom ovih stvari
  nastaju uznemirenost, strepnja i zabrinutost: ako za svoje dete ne\u0161to u\u010dine,
  pla\u0161e se da se time okre\u0107u protiv Bo\u017ejih namera i ne udovoljavaju
  Mu, a ako ni\u0161ta ne u\u010dine, pla\u0161e se da ne ispunjavaju svoje roditeljske
  du\u017enosti i da \u0107e ih vlastito dete i ostali \u010dlanovi porodice osu\u0111ivati;
  ako rade ove stvari, pla\u0161e se da \u0107e izgubiti svedo\u010danstvo, a ako
  ih ne rade, pla\u0161e se da \u0107e im se svetovni ljudi rugati, da \u0107e im
  se susedi podsmevati, da \u0107e im zamerati i osu\u0111ivati ih; pla\u0161e se
  da \u0107e osramotiti Boga, ali se, tako\u0111e, pla\u0161e da \u0107e ste\u0107i
  lo\u0161u reputaciju i da od tolikog srama ne\u0107e mo\u0107i da promole glavu.
  I dok se premi\u0161ljaju oko ovih stvari, u njihovom srcu nastaju uznemirenost,
  strepnja i zabrinutost; uznemireni su jer ne znaju \u0161ta da urade, ose\u0107aju
  strepnju da \u0107e u\u010diniti pogre\u0161nu stvar kakvu god odluku da donesu,
  a svakako ne znaju da li i\u0161ta ispravno rade, i zabrinuti su da sa ovim stvarima,
  budu li se one nastavile, jednoga dana vi\u0161e ne\u0107e mo\u0107i da se nose,
  te da \u0107e im, ako do\u017eive nervni slom, te stvari tada pasti jo\u0161 te\u017ee.
  Ljudi u tim situacijama ose\u0107aju uznemirenost, strepnju i zabrinutost zbog svih
  tih stvari koje iskrsavaju u \u017eivotu, bez obzira na njihov stvarni zna\u010daj.
  I, kada se ova negativna ose\u0107anja u njima pojave, na\u0111u se zaglavljeni
  u ovoj uznemirenosti, strepnji i zabrinutosti i ne mogu da se oslobode: u\u010dine
  li ovo, pogre\u0161no je, u\u010dine li ono, pogre\u0161no je, i ne znaju koja je
  to ispravna stvar koju treba u\u010diniti; \u017eele da udovolje drugim ljudima,
  ali se boje da ne\u0107e udovoljiti Bogu; \u017eele da u\u010dine razne stvari za
  druge kako bi se o njima lepo govorilo, ali ne \u017eele da Boga osramote ili da
  Ga navedu da ih prezre. Ba\u0161 zato su stalno zaglavljeni u ovim ose\u0107anjima
  uznemirenosti, strepnje i zabrinutosti. I zbog drugih i zbog sebe ose\u0107aju uznemirenost;
  i zbog drugih i zbog sebe ose\u0107aju strepnju; a tako\u0111e su i zbog drugih
  i zbog sebe zabrinuti, pa su tako zaglavljeni u dvostrukoj nevolji iz koje ne mogu
  da se izbave. Takve negativne emocije ne uti\u010du samo na njihov svakodnevni \u017eivot,
  ve\u0107 i na obavljanje du\u017enosti i u izvesnoj meri, naravno, uti\u010du i
  na njihovo stremljenje ka istini. To je svojevrsna pote\u0161ko\u0107a, odnosno,
  to su te\u0161ko\u0107e koje se odnose na brak, porodi\u010dni i li\u010dni \u017eivot,
  i zbog takvih pote\u0161ko\u0107a ljudi se \u010desto na\u0111u zaglavljeni u uznemirenosti,
  strepnji i zabrinutosti. Kada se na\u0111u zaglavljeni u takvoj negativnoj emociji,
  zar ljudi nisu za \u017ealjenje? (Jesu.) Jesu li za \u017ealjenje? I dalje ka\u017eete
  \u201ejesu\u201c, pokazuju\u0107i time da jo\u0161 uvek izrazito saose\u0107ate
  sa njima. Kada se neko na\u0111e zaglavljen u negativnoj emociji, bez obzira na
  okolnosti njenog nastanka, koji je razlog za nastanak te negativne emocije? Da li
  je to zbog okru\u017eenja, zbog ljudi, doga\u0111aja i stvari koje okru\u017euju
  tu osobu? Ili je to stoga \u0161to ih uznemirava istina koju Bog izra\u017eava?
  Uti\u010de li okru\u017eenje na tu osobu ili Bo\u017eje re\u010di ometaju njen \u017eivot?
  U \u010demu je ta\u010dno razlog? Znate li? Recite Mi, bilo da je re\u010d o normalnim
  \u017eivotima ljudi ili o obavljanju njihovih du\u017enosti, jesu li ove pote\u0161ko\u0107e
  prisutne i onda kada oni streme ka istini i spremni su da istinu sprovode u delo?
  (Nisu.) Te pote\u0161ko\u0107e su prisutne u vidu objektivne \u010dinjenice. Ka\u017eete
  da one nisu prisutne, da li je, onda, mogu\u0107e da ste te pote\u0161ko\u0107e
  razre\u0161ili? Jeste li u stanju da to u\u010dinite? Ove pote\u0161ko\u0107e se
  ne mogu razre\u0161iti i prisutne su na nivou objektivne \u010dinjenice. Kakav \u0107e
  biti ishod ovih pote\u0161ko\u0107a kod ljudi koji streme ka istini? A kakav \u0107e
  biti njihov ishod kod onih koji ne streme ka istini? Njihovi ishodi \u0107e biti
  potpuno razli\u010diti. Ako ljudi streme ka istini, oni se ne\u0107e uplesti u ove
  pote\u0161ko\u0107e i ne\u0107e potonuti u negativne emocije uznemirenosti, strepnje
  i zabrinutosti. Me\u0111utim, i kod ljudi koji ne streme ka istini ove su pote\u0161ko\u0107e
  podjednako prisutne, ali kakav \u0107e kod njih biti ishod? Uple\u0161\u0107e\u0161
  se u njih tako da ne mo\u017ee\u0161 da se izbavi\u0161 i, ako nisi u stanju da
  ih razre\u0161i\u0161, one \u0107e na kraju postati negativne emocije koje se u
  najdubljim odajama tvog srca vezuju u \u010dvorove; one \u0107e uticati na tvoj
  normalan \u017eivot i na normalno obavljanje du\u017enosti, zbog njih \u0107e\u0161
  se ose\u0107ati ugnjeteno i nemo\u0107no da se oslobodi\u0161 \u2013 takav \u0107e
  ishod imati po tebe. Ova dva ishoda se razlikuju, zar ne? (Da.) Dakle, vratimo se
  na pitanje koje sam upravo postavio. Koje sam to pitanje postavio? (Da li faktori
  okru\u017eenja ili uznemiruju\u0107e Bo\u017eje re\u010di dovode do toga da se u
  ljudima javljaju negativne emocije?) Koji je, dakle, razlog? \u0160ta je odgovor?
  (Razlog je u tome \u0161to ljudi ne streme ka istini.) Tako je. Nije u pitanju nijedan
  od navedenih razloga, ve\u0107 \u010dinjenica da ljudi ne streme ka istini. Kada
  ljudi ne streme ka istini, \u010desto se na\u0111u zaglavljeni u ekstremnim mislima
  i negativnim emocijama i nisu u stanju da se oslobode. Ponovite pitanje koje sam
  upravo postavio. (Da li je razlog nastanka negativnih emocija kod ljudi u njihovom
  okru\u017eenju i ljudima, doga\u0111ajima i stvarima koji ih okru\u017euju ili je
  razlog u \u010dinjenici da istina koju Bog izra\u017eava ljude uznemiruje?) Da pojednostavimo,
  da li je to zbog faktora okru\u017eenja ili zbog Bo\u017ejih re\u010di koje uznemiruju
  ljude? Koje od ta dva? (Nijedno.) Ta\u010dno, nijedno. Okru\u017eenje podjednako
  uti\u010de na svakoga; ako stremi\u0161 ka istini, ne\u0107e\u0161 potonuti u negativnu
  emociju zbog tamo nekog okru\u017eenja. Me\u0111utim, ako ne stremi\u0161 ka istini,
  sasvim prirodno \u0107e te tvoje okru\u017eenje svaki put iznova zatrpavati i na\u0107i
  \u0107e\u0161 se zaglavljen u negativnim emocijama uznemirenosti, strepnje i zabrinutosti.
  Posmatrano iz ove perspektive, zar stremljenje ka istini nije va\u017eno? (Jeste.)
  Postoje istina-na\u010dela koja treba tra\u017eiti u svemu \u0161to se doga\u0111a.
  Me\u0111utim, u stvarnosti, ako ljudi ne streme ka istini i ne tra\u017ee istina-na\u010dela
  ili, obrnuto, ako im je vrlo dobro poznato \u0161ta Bog zahteva, koja su istina-na\u010dela,
  koji put treba da primenjuju i koji su kriterijumi za primenu, ali na njih ne obra\u0107aju
  pa\u017enju niti ih slede, \u0161ta \u0107e im se na kraju dogoditi budu li stalno
  donosili svoje odluke i pravili svoje planove? Kada ljudi ne postupaju prakti\u010dno
  u skladu sa Bo\u017ejim re\u010dima, brinu\u0107i stalno o ovome ili onome, u tom
  slu\u010daju postoji samo jedan ishod, a on je u tome da \u0107e se na\u0107i zaglavljeni
  u uznemirenosti, strepnji i zabrinutosti, odakle vi\u0161e ne\u0107e mo\u0107i da
  iza\u0111u. Je li mogu\u0107e da se ljudi uvek oslanjaju na sopstvenu uobrazilju
  da \u0107e se stvari uvek odvijati kako bi oni to \u017eeleli, da \u0107e druge
  ljude usre\u0107iti, kao i da \u0107e dobiti Bo\u017eje odobravanje? To je nemogu\u0107e!
  Oni uvek \u017eele da postupaju na na\u010din kojim \u0107e sve oko sebe usre\u0107iti,
  kojim \u0107e svima udovoljiti i kod svih izmamiti samo re\u010di hvale. \u017dele
  da ih nazivaju dobrom osobom i da Bogu udovolje, a ako ne ispune ovo merilo, ose\u0107aju
  se uznemireno. Pa, zar ne zaslu\u017euju da se ose\u0107aju uznemireno? (Da.) To
  je ono \u0161to ljudi biraju za sebe.\\nNeki ljudi koji su skloni izopa\u010denostima
  ka\u017eu: \u201eDa Bog nije izgovorio tolike re\u010di, stvari bih radio u skladu
  sa moralnim standardima koji \u010dine dobru osobu. To bi bilo sasvim jednostavno
  i ne bi bilo dato toliko izjava. Ba\u0161 kao \u0161to je u Doba blagodati, kada
  su se ljudi dr\u017eali zapovesti, trpeli i podnosili, nosili krst i patili, sve
  bilo jednostavno. Nije li time sve zavr\u0161eno? Sada, uz mno\u0161tvo istina koje
  Bog izgovara i mno\u0161tvo na\u010dela primene izre\u010denih u zajedni\u0161tvu,
  za\u0161to ni nakon toliko vremena ljudi ne mogu da ih postignu? Ljudi su odve\u0107
  manjkavog kova, pa ne mogu sve to da razumeju niti mnoge istine da dostignu. Po\u0161to
  nailaze na brojne te\u0161ko\u0107e kada istinu sprovode u delo, \u010dak i kada
  razumeju istinu, i dalje im je te\u0161ko da je dostignu. Ako razume\u0161 istinu,
  ali je ne sprovodi\u0161 u delo, ose\u0107a\u0161 se nelagodno, a i kada je sprovodi\u0161
  u delo, u praksi postoji mnogo te\u0161ko\u0107a.\u201c Ljudi smatraju da ih Bo\u017eje
  re\u010di uznemiravaju, no da li je tako u stvarnosti? (Nije.) To se zove biti nerazuman
  i neracionalan. Ose\u0107aju odbojnost prema istini i ne streme ka istini, niti
  istinu sprovode u delo, ali i dalje \u017eele da se pretvaraju da su produhovljeni,
  da istinu sprovode u delo, te \u017eele da postignu spasenje. Na kraju, kada te
  stvari ne mogu da postignu, ose\u0107aju se utu\u010deno i uznemireno i u sebi razmi\u0161ljaju:
  \u201eKo mo\u017ee da uspostavi ravnote\u017eu izme\u0111u svih ovih stvari? Bilo
  bi bolje kada bi Bog malo snizio Svoja merila; ljudima bi tada bilo dobro, Bogu
  bi bilo dobro, svima bi bilo dobro \u2013 kakav bi to rajski \u017eivot bio!\u201c
  Ovakvi ljudi uvek smatraju da su re\u010di koje Bog izgovara bezobzirne prema \u010doveku.
  Zapravo, kada ljudi ose\u0107aju uznemirenost, strepnju i zabrinutost, brojne su
  stvari zbog kojih su nezadovoljni Bogom. Konkretno, kada je u pitanju na\u010din
  na koji pristupaju istina-na\u010delima, oni ne mogu da ih ostvare niti dostignu,
  o njima ne mogu uop\u0161te da razgovaraju, i to ozbiljno uti\u010de na njihov ugled
  i presti\u017e u o\u010dima drugih, ba\u0161 kao \u0161to uti\u010de i njihova \u017eelja
  da budu blagosloveni. Zbog toga su zaglibili u uznemirenosti, strepnji i zabrinutosti,
  pa jo\u0161 i smatraju da ima mnogo stvari koje Bog radi, a kojima oni nisu zadovoljni.
  Ima \u010dak i onih koji ka\u017eu: \u201eBog je pravedan, to ne pori\u010dem; Bog
  je svet, ne pori\u010dem ni to. Sve \u0161to Bog ka\u017ee sasvim sigurno jeste
  istina, samo je prava \u0161teta \u0161to je ono \u0161to Bog sada govori previ\u0161e
  uzvi\u0161eno, Njegovi zahtevi prema ljudima su prestrogi i ljudima nije lako da
  ih sve ispune!\u201c Oni nemaju ljubav prema istini i svu odgovornost svaljuju na
  Boga. Kre\u0107u od pretpostavke da je Bog pravedan i da je Bog svet, i smatraju
  da je sve to istina. Bog jeste pravedan, Bog jeste svet \u2013 da li je potrebno
  da ti potvrdi\u0161 Bo\u017eju su\u0161tinu? To su \u010dinjenice; nisu istina jedino
  zato \u0161to ih ti potvr\u0111uje\u0161. Da ne bi bili osu\u0111eni jer okrivljuju
  Boga, oni br\u017ee-bolje ka\u017eu da je Bog pravedan, da je Bog svet. Me\u0111utim,
  \u0161ta god da ka\u017eu o Bo\u017ejoj pravednosti i svetosti, njihove negativne
  emocije uznemirenosti, strepnje i zabrinutosti i dalje su prisutne. I ne samo da
  su te emocije prisutne, ve\u0107 ljudi nisu voljni da ih otpuste, nisu voljni da
  ih ostave za sobom, nisu voljni da promene svoja na\u010dela primene, da promene
  pravac svog stremljenja i promene put koji slede kroz \u017eivot. Takvi ljudi zaslu\u017euju
  i \u017ealjenje i mr\u017enju. Naprosto ne zaslu\u017euju ni\u010dije saose\u0107anje
  niti su, koliko god da pate, vredni na\u0161eg sa\u017ealjenja. Treba samo da im
  ka\u017eemo ovih nekoliko re\u010di: tako ti i treba! I ako umre\u0161 od ose\u0107anja
  tolike uznemirenosti, svejedno te niko ne\u0107e \u017ealiti! Ko te je spre\u010dio
  da traga\u0161 za istinom i da time re\u0161i\u0161 svoje probleme? Ko te je onemogu\u0107io
  da se pokorava\u0161 Bogu i da istinu sprovodi\u0161 u delo? Zarad koga ose\u0107a\u0161
  uznemirenost, strepnju i zabrinutost? Ose\u0107a\u0161 li ove stvari da bi do\u0161ao
  do istine? Ili da bi zadobio Boga? Ili zarad Bo\u017ejeg dela? Ili zarad Bo\u017eje
  slave? (Ne.) Pa, zbog koga onda ima\u0161 ta ose\u0107anja? Ima\u0161 ih samo zbog
  sebe, zbog svoje dece, svoje porodice, zbog svog samopo\u0161tovanja, zbog svog
  ugleda, zbog svoje budu\u0107nosti i izgleda, zbog svega onoga \u0161to ima veze
  sa tobom. Takva osoba ni od \u010dega ne odustaje niti i\u0161ta otpu\u0161ta, ni
  protiv \u010dega se ne buni niti i\u0161ta napu\u0161ta; nema pravu veru u Boga
  ni iskrenu odanost obavljanju svoje du\u017enosti. U svojoj veri u Boga, ona se
  istinski ne daje, ve\u0107 samo veruje da \u0107e dobiti blagoslove, a u Boga veruje
  jedino sa ube\u0111enjem da \u0107e dobiti blagoslove. Ispunjena je \u201everom\u201c
  u Boga, u Bo\u017eje delo i Bo\u017eja obe\u0107anja, ali za takvu veru Bog nema
  re\u010di hvale, niti je pamti. Naprotiv, On je prezire. Takvi ljudi ne po\u0161tuju
  niti sprovode na\u010dela za re\u0161avanje ijedne stvari koju im Bog nala\u017ee,
  ne otpu\u0161taju stvari koje treba da otpuste, ne odustaju od stvari od kojih treba
  da odustanu, ne napu\u0161taju stvari koje treba da napuste i ne nude odanost koju
  treba da ponude, pa stoga i zaslu\u017euju da potonu u negativnim emocijama uznemirenosti,
  strepnje i zabrinutosti. Koliko god da pate, to \u010dine jedino radi sebe, a ne
  radi svoje du\u017enosti niti zarad crkvenog rada. Prema tome, takvi ljudi naprosto
  ne streme ka istini \u2013 samo su gomila koja jedino na re\u010dima veruje u Boga.
  Znaju ta\u010dno da je ovo istiniti put, ali ga ne primenjuju niti ga slede. Njihova
  je vera \u017ealosna, ne mo\u017ee zadobiti Bo\u017eje odobravanje i Bog je ne\u0107e
  upamtiti. Takvi ljudi su zaglibili u negativnim emocijama uznemirenosti, strepnje
  i zabrinutosti zbog mnogobrojnih \u017eivotnih te\u0161ko\u0107a u svom domu.\\nA
  tu su i oni koji su lo\u0161eg zdravlja, koji su krhke gra\u0111e i nedostaje im
  energije, koji \u010desto obolevaju od te\u017eih ili lak\u0161ih bolesti, koji
  ne mogu da obave ni najosnovnije stvari neophodne u svakodnevnom \u017eivotu, koji
  ne mogu da \u017eive, niti da se sa lako\u0107om kre\u0107u poput normalnih ljudi.
  Dok obavljaju svoju du\u017enost, takvi ljudi se \u010desto ose\u0107aju nelagodno
  i lo\u0161e; neki su fizi\u010dki slabi, neki su ozbiljno bolesni, a naravno ima
  i onih koji imaju poznate bolesti ove ili one vrste, ili sklonost ka njima. Budu\u0107i
  da imaju takve realne fizi\u010dke pote\u0161ko\u0107e, takvi ljudi \u010desto tonu
  u negativne emocije i ose\u0107aju uznemirenost, strepnju i zabrinutost. Zbog \u010dega
  ose\u0107aju uznemirenost, strepnju i zabrinutost? Da li ih brine da \u0107e im
  takav na\u010din obavljanja du\u017enosti i tr\u010danje okolo za Boga, uz stalni
  ose\u0107aj velikog umora, jo\u0161 vi\u0161e naru\u0161iti zdravlje? Kada napune
  40 ili 50 godina, ho\u0107e li biti prikovani za krevet? Da li su ove brige osnovane?
  Ho\u0107e li neko da navede konkretan na\u010din kako se sa time postupa? Ko \u0107e
  za ovo preuzeti odgovornost? Ko \u0107e za to biti prozvan? Zbog takvih stvari,
  ljudi lo\u0161eg zdravlja i oni koji su fizi\u010dki nesposobni ose\u0107aju uznemirenost,
  strepnju i zabrinutost. Bolesni ljudi \u0107e \u010desto razmi\u0161ljati ovako:
  \u201eOh, odlu\u010dan sam da pravilno obavljam svoju du\u017enost, ali imam ovu
  bolest. Molim Boga da me sa\u010duva od zla i, uz Bo\u017eju za\u0161titu, nema
  potrebe da se pla\u0161im. Ipak, ako se iscrpim dok obavljam svoju du\u017enost,
  ho\u0107e li se moja bolest pogor\u0161ati? \u0160ta da radim ako se moja bolest
  zaista pogor\u0161a? Ako budu morali da me operi\u0161u u bolnici, nemam novac za
  to, i ako onda ne pozajmim novac za le\u010denje, ho\u0107e li se moja bolest jo\u0161
  vi\u0161e pogor\u0161ati? A kada stvari postanu zaista gadne, ho\u0107u li umreti?
  Mo\u017ee li se takva smrt smatrati normalnom smr\u0107u? Budem li zaista umro,
  ho\u0107e li Bog upamtiti du\u017enosti koje sam obavio? Ho\u0107e li se smatrati
  da sam obavio dobro delo? Ho\u0107u li dobiti spasenje?\u201c Ima i onih koji znaju
  da su bolesni, odnosno, znaju da imaju neku stvarnu bolest ili ne\u0161to drugo,
  na primer, stoma\u010dna oboljenja, bol u donjem delu le\u0111a i nogama, artritis,
  reumatizam, kao i ko\u017ena oboljenja, ginekolo\u0161ka oboljenja, oboljenja jetre,
  hipertenziju, sr\u010dana oboljenja i tako dalje. Oni razmi\u0161ljaju: \u201eAko
  nastavim da obavljam svoju du\u017enost, ho\u0107e li Bo\u017eja ku\u0107a platiti
  za le\u010denje moje bolesti? Ako se moja bolest pogor\u0161a i to se odrazi na
  obavljanje moje du\u017enosti, ho\u0107e li me Bog izle\u010diti? Druge ljude je
  izle\u010dila vera u Boga, pa, ho\u0107u li i ja biti izle\u010den? Ho\u0107e li
  i mene Bog izle\u010diti, ba\u0161 kao \u0161to prema drugima pokazuje dobrotu?
  Ako odano obavljam svoju du\u017enost, Bog treba da me izle\u010di. Me\u0111utim,
  ako je u pitanju samo moja \u017eelja da me Bog izle\u010di, a On to ne u\u010dini,
  \u0161ta \u0107u onda da radim?\u201c Kad god pomisle na ove stvari, u njihovom
  srcu narasta duboko ose\u0107anje strepnje. Iako nikada ne prestaju sa obavljanjem
  svoje du\u017enosti i uvek rade ono \u0161to treba, neprestano razmi\u0161ljaju
  o svojoj bolesti, o svom zdravlju, o svojoj budu\u0107nosti i o svom \u017eivotu
  i smrti. Kona\u010dno dolaze do formulacije svoje puste \u017eelje: \u201eBog \u0107e
  me izle\u010diti, Bog \u0107e me \u010duvati. Bog me ne\u0107e napustiti i Bog ne\u0107e
  samo stajati po strani, a da ni\u0161ta ne preduzme kad vidi da se razbolevam.\u201c
  Za takva razmi\u0161ljanja nema nikakvog osnova; \u010dak se mo\u017ee re\u0107i
  da su puka mentalna predstava. Uz ovakve predstave i zami\u0161ljanja, ljudi ne\u0107e
  nikada mo\u0107i da razre\u0161e svoje stvarne probleme, pa zbog svog zdravlja i
  bolesti u najdubljem delu srca ose\u0107aju nejasnu uznemirenost, strepnju i zabrinutost;
  nemaju pojma ko \u0107e za te stvari preuzeti odgovornost i ho\u0107e li je neko
  uop\u0161te preuzeti.\\nIma i onih koji, iako se zapravo ne ose\u0107aju bolesnim
  i nije im ustanovljena nikakva bolest, znaju da imaju neko latentno oboljenje. Kakvo
  latentno oboljenje? To recimo mo\u017ee biti neka nasledna bolest poput sr\u010danog
  oboljenja, dijabetesa ili hipertenzije, ili, pak, Alchajmerova bolest, Parkinsonova
  bolest ili neka vrsta raka \u2013 sve su to latentna oboljenja. Budu\u0107i da poti\u010du
  iz takve porodice, nekim ljudima je poznato da \u0107e ih to genetsko oboljenje,
  pre ili kasnije, pogoditi. S obzirom na to da veruju u Boga i streme ka istini,
  da pravilno obavljaju svoju du\u017enost, \u010dine dovoljan broj dobrih dela i
  Bogu mogu da ugode, pitaju se ho\u0107e li ih takvo latentno oboljenje zaobi\u0107i,
  da ih nikad ne zadesi? Bog im, me\u0111utim, ni\u0161ta sli\u010dno nikada nije
  obe\u0107ao, a oni nikada nisu imali takvu veru u Boga, nikada se nisu usudili da
  tra\u017ee garancije, niti da imaju ikakve nerealne zamisli. Po\u0161to ne mogu
  da imaju nikakvu garanciju niti obe\u0107anje, oni tro\u0161e mnogo energije i ula\u017eu
  ogromne napore u obavljanje svoje du\u017enosti. Usredsre\u0111uju se na to da pate
  i da plate cenu, uvek \u0107e u\u010diniti vi\u0161e i vi\u0161e se isticati od
  drugih, s mi\u0161lju: \u201eBi\u0107u prvi koji \u0107e patiti i poslednji koji
  \u0107e u\u017eivati.\u201c Ovom krilaticom sebe uvek motivi\u0161u, ali se unutra\u0161nji
  strah i zabrinutost zbog latentne bolesti ne mogu oterati, a ova zabrinutost, ova
  uznemirenost, njihov su stalni pratilac. Iako u obavljanju svojih du\u017enosti
  mogu da podnesu patnju i naporan rad i spremni su da plate cenu, ipak ose\u0107aju
  kako na ovu temu ne mogu da dobiju Bo\u017eje obe\u0107anje niti preciznu re\u010d
  od Boga, pa su povodom ove stvari i dalje ispunjeni uznemireno\u0161\u0107u, strepnjom
  i zabrinuto\u0161\u0107u. Iako se trude da ni\u0161ta ne rade povodom te svoje latentne
  bolesti, povremeno i nesvesno ipak tra\u017ee svakakve narodne lekove ne bi li spre\u010dili
  da ih ova latentna bolest jednog dana i sata iznenada zadesi ili da ih zatekne nespremne.
  Neki ljudi povremeno mogu spravljati neke kineske lekovite travke koje \u0107e uzimati,
  drugi se povremeno raspituju o narodnim lekovitim preparatima koje, po potrebi,
  mogu uzeti, dok tre\u0107i na internetu povremeno pretra\u017euju savete za ve\u017ebanje
  kako bi mogli da rade fizi\u010dke ve\u017ebe i tako eksperimenti\u0161u. Iako je
  to mo\u017eda samo latentna bolest, ona im, ipak, ne izlazi iz glave; iako se ovi
  ljudi ne ose\u0107aju lo\u0161e niti imaju ikakve simptome, zbog nje su svejedno
  ispunjeni zabrinuto\u0161\u0107u i strepnjom. Duboko u sebi ose\u0107aju uznemirenost
  i utu\u010denost i uvek se nadaju da \u0107e kroz molitvu ili obavljanje svojih
  du\u017enosti ubla\u017eiti ili raspr\u0161iti te negativne emocije koje nose u
  sebi. Ljudi koji su zaista bolesni ili koji imaju latentno oboljenje, zajedno sa
  onima koji su zabrinuti da \u0107e se u budu\u0107nosti razboleti, onima koji su
  ro\u0111eni sa naru\u0161enim zdravljem, i onima koji nemaju nikakvu ozbiljnu bolest
  ali vazda pate od manjih tegoba \u2013 svi oni stalno ose\u0107aju uznemirenost
  i zabrinutost zbog bolesti i razli\u010ditih telesnih pote\u0161ko\u0107a. \u017dele
  da se od njih izbave, da im pobegnu, ali nemaju na\u010dina da to i u\u010dine;
  \u017eele da ih napuste, ali ne mogu; \u017eele da zamole Boga da ih oslobodi ovih
  bolesti i pote\u0161ko\u0107a, ali ne mogu to da izuste i ose\u0107aju se neprijatno
  jer smatraju da za takav zahtev nema opravdanja. Znaju dobro da Boga u vezi sa ovim
  ne treba moliti, ali se u srcu ose\u0107aju bespomo\u0107no; pitaju se, ako sve
  svoje nade polo\u017ee u Boga, ho\u0107e li se ose\u0107ati lagodnije i da li \u0107e
  im to umiriti savest? Stoga se, u najdubljim odajama svog srca, povremeno tiho mole
  za tu stvar. Ako dobiju neku dodatnu ili neo\u010dekivanu milost ili blagodat od
  Boga, osete izvesnu radost ili utehu; ako od Bo\u017eje ku\u0107e ne dobiju nikakvu
  posebnu brigu i ne osete nikakvu dobrotu od Boga, onda nesvesno ponovo klize u negativne
  emocije uznemirenosti, strepnje i zabrinutosti. Iako su, u ljudskom rodu, ro\u0111enje,
  starost, bolest i smrt nepromenljive stvari i ne mogu se izbe\u0107i u \u017eivotu,
  ima ljudi sa odre\u0111enom telesnom konstitucijom ili sa posebnom bole\u0161\u0107u
  koji, bez obzira na to da li obavljaju svoje du\u017enosti, zbog pote\u0161ko\u0107a
  i bolesti tela dospevaju u stanja uznemirenosti, strepnje i zabrinutosti. Ti ljudi
  brinu o svojoj bolesti, brinu o brojnim mukama koje im bolest mo\u017ee izazvati,
  o tome da li \u0107e njihova bolest postati ozbiljna, kakve \u0107e biti posledice
  ako se to dogodi, te ho\u0107e li zbog toga umreti. U posebnim situacijama i u odre\u0111enim
  kontekstima, ovaj niz pitanja ih navodi da zaglibe u uznemirenosti, strepnji i zabrinutosti
  i da ne mogu da se izvuku; neki ljudi \u010dak \u017eive u stanju uznemirenosti,
  strepnje i zabrinutosti zbog ozbiljne bolesti za koju ve\u0107 znaju da je imaju
  ili zbog latentne bolesti koju naprosto ne mogu izbe\u0107i, pa dospevaju pod uticaj,
  dejstvo i kontrolu tih negativnih emocija. Kada jednom dospeju pod kontrolu tih
  negativnih emocija, neki ljudi sasvim odustaju od svih prilika i od nade da \u0107e
  dosti\u0107i spasenje; odlu\u010duju da odustanu od obavljanja svoje du\u017enosti,
  pa \u010dak i od svake prilike da dobiju Bo\u017eju dobrotu. Umesto toga, odlu\u010duju
  da se suo\u010de i da se nose sa svojom bole\u0161\u0107u, ne tra\u017ee\u0107i
  ni\u010diju pomo\u0107 i ne \u010dekaju\u0107i nikakvu priliku. Posve\u0107uju se
  le\u010denju svoje bolesti i vi\u0161e ne obavljaju svoju du\u017enost. \u010cak
  i kada su za tu du\u017enost fizi\u010dki sposobni, ipak je ne izvr\u0161avaju.
  Zbog \u010dega je tako? Zato \u0161to brinu: \u201eAko se moja bolest nastavi i
  Bog me ne izle\u010di, mogao bih kao i do sada da obavljam svoju du\u017enost i
  da svejedno na kraju umrem. Budem li prestao da obavljam svoju du\u017enost i budem
  li potra\u017eio lek, mogao bih da po\u017eivim jo\u0161 nekoliko godina, i mo\u017eda
  se ta bolest na kraju izle\u010di. Nastavim li da obavljam svoju du\u017enost, a
  Bog nije rekao da \u0107e me izle\u010diti, moje zdravstveno stanje se mo\u017eda
  jo\u0161 i pogor\u0161a. Ne \u017eelim da narednih 10 ili 20 godina obavljam svoju
  du\u017enost i onda da umrem. \u017delim da pro\u017eivim jo\u0161 nekoliko godina,
  ne \u017eelim da umrem tako brzo, tako prerano!\u201c Onda oni u Bo\u017ejoj ku\u0107i
  jedno vreme obavljaju svoju du\u017enost, neko vreme samo osmatraju i, mogli bismo
  re\u0107i, neko vreme posmatraju \u0161ta \u0107e se dogoditi, a zatim po\u010dinju
  da se pitaju: \u201eSvoju du\u017enost obavljam, ali mi se zdravlje nije pobolj\u0161alo,
  bolest mi se nije ubla\u017eila. \u010cini se da nema nade da \u0107e se stanje
  popraviti. Ranije sam imao plan \u2013 mislio sam da bi me Bog mo\u017eda re\u0161io
  ove bolesti ako sve napustim i ako verno obavljam svoju du\u017enost. Ipak, ni\u0161ta
  se nije odvijalo onako kako sam planirao, zami\u0161ljao i \u017eeleo. Stanje moje
  bolesti je nepromenjeno. Pro\u0161le su tolike godine, a ova bolest ni najmanje
  ne popu\u0161ta. Izgleda da \u0107u morati s\u0203m da je izle\u010dim. Ni na koga
  ne mogu da se oslonim, ni u koga ne mogu da se pouzdam. Moram da uzmem sudbinu u
  svoje ruke. Nauka i tehnologija su danas uznapredovale, ba\u0161 kao i lekovi. Na
  raspolaganju su delotvorni lekovi za le\u010denje svakakvih bolesti i za sve postoje
  napredne metode le\u010denja. Siguran sam da se ova bolest mo\u017ee izle\u010diti.\u201c
  Kad naprave takve planove, po\u010dnu da pretra\u017euju po internetu i da se raspituju
  unaokolo, sve dok na kraju ne prona\u0111u neko re\u0161enje. Na kraju odlu\u010de
  koji lek da uzmu, kako da le\u010de svoju bolest, kako da ve\u017ebaju i kako da
  se brinu o svom zdravlju. U sebi razmi\u0161ljaju: \u201eAko ne obavljam svoju du\u017enost,
  ve\u0107 se usredsredim na le\u010denje ove bolesti, ima nade da \u0107u se izle\u010diti.
  Brojni su slu\u010dajevi izle\u010denja ove bolesti.\u201c I po\u0161to neko vreme
  ovako kuju i razra\u0111uju planove, napokon odlu\u010de da vi\u0161e ne obavljaju
  svoju du\u017enost, pa le\u010denje bolesti postaje njihov najva\u017eniji zadatak
  \u2013 ni\u0161ta im nije va\u017enije od \u017eivota. Njihova uznemirenost, strepnja
  i zabrinutost se pretvaraju u svojevrsno prakti\u010dno delovanje; iz obi\u010dnih
  misli, njihova strepnja i zabrinutost se preto\u010de u neku vrstu akcije. Nevernici
  imaju poslovicu koja glasi: \u201eManje misli, vi\u0161e radi i to radi odmah.\u201c
  Takvi ljudi \u010dim ne\u0161to pomisle, to i urade, i to brzo. Jednog dana pomisle
  na le\u010denje svoje bolesti, a ve\u0107 slede\u0107eg jutra su spakovali stvari
  i spremni su da odu. Nekoliko meseci kasnije sti\u017ee lo\u0161a vest da su umrli,
  a da bolest nisu izle\u010dili. Jesu li se oporavili od svoje bolesti? (Nisu.) Nije
  uvek mogu\u0107e da s\u0203m izle\u010di\u0161 svoju bolest, no, da li je sigurno
  da se ne\u0107e\u0161 razboleti dok u Bo\u017ejoj ku\u0107i obavlja\u0161 svoju
  du\u017enost? Tako ne\u0161to ti niko ne mo\u017ee obe\u0107ati. Prema tome, kakvu
  odluku treba da donese\u0161 i kako da pristupi\u0161 pitanju razbolevanja? Vrlo
  je jednostavno i samo je jedan put koji treba slediti: stremi ka istini. Stremi
  ka istini i posmatraj tu stvar u skladu sa Bo\u017ejim re\u010dima i u skladu sa
  istina-na\u010delima \u2013 ljudi bi to tako trebalo da shvate. A kako to treba
  da primenjuje\u0161? Preuzmi sva ta iskustva, primeni u praksu razumevanje koje
  si stekao i istina-na\u010dela koja si razumeo u skladu sa istinom i Bo\u017ejim
  re\u010dima, i njih pretvori u svoju stvarnost i u svoj \u017eivot \u2013 ovo je
  jedan aspekt. Drugi aspekt je da ne sme\u0161 da napusti\u0161 svoju du\u017enost.
  Bilo da si bolestan ili ose\u0107a\u0161 bol, makar ti preostao jedan jedini dah,
  dokle god si jo\u0161 uvek \u017eiv, sve dok i dalje mo\u017ee\u0161 da govori\u0161
  i hoda\u0161, ti jo\u0161 uvek ima\u0161 energiju da obavlja\u0161 svoju du\u017enost
  i, sa nogama \u010dvrsto na zemlji, treba dobro da se vlada\u0161 u obavljanju svoje
  du\u017enosti. Ne sme\u0161 da napu\u0161ta\u0161 du\u017enost stvorenog bi\u0107a
  niti odgovornost koju ti je Stvoritelj poverio. Sve dok ne ispusti\u0161 poslednji
  dah, treba svoju du\u017enost da izvr\u0161ava\u0161 i da je dobro ispunjava\u0161.
  Neki ljudi ka\u017eu: \u201eOvo \u0161to govori\u0161 nije ba\u0161 uvi\u0111avno.
  Bolestan sam i te\u0161ko mi je da to podnesem!\u201c Kada ti je te\u0161ko, mo\u017ee\u0161
  da se odmori\u0161, mo\u017ee\u0161 da se pobrine\u0161 za sebe i da se podvrgne\u0161
  le\u010denju. Ako i dalje \u017eeli\u0161 da obavlja\u0161 svoju du\u017enost, mo\u017ee\u0161
  da smanji\u0161 koli\u010dinu posla i da obavlja\u0161 neku prikladnu du\u017enost,
  neku koja ne\u0107e uticati na tvoj oporavak. To \u0107e dokazati da u svom srcu
  nisi napustio svoju du\u017enost, da se tvoje srce nije udaljilo od Boga, da u svom
  srcu nisi porekao Bo\u017eje ime i da u svom srcu nisi odustao od \u017eelje da
  bude\u0161 pravo stvoreno bi\u0107e. Neki ljudi ka\u017eu: \u201eSve to sam u\u010dinio,
  pa ho\u0107e li me Bog osloboditi ove bolesti?\u201c Ho\u0107e li? (Ne mora da zna\u010di.)
  Bez obzira na to ho\u0107e li te Bog osloboditi te bolesti, bez obzira na to ho\u0107e
  li te Bog izle\u010diti, ti radi\u0161 ono \u0161to stvoreno bi\u0107e treba da
  radi. Bez obzira na to jesi li fizi\u010dki sposoban da obavlja\u0161 svoju du\u017enost,
  bez obzira na to mo\u017ee\u0161 li da preuzme\u0161 bilo kakav posao, bez obzira
  na to da li ti zdravlje dozvoljava da obavlja\u0161 svoju du\u017enost, tvoje se
  srce ne sme udaljiti od Boga i u svom srcu ne sme\u0161 napustiti svoju du\u017enost.
  Time \u0107e\u0161 ispuniti ono za \u0161ta si odgovoran, kao i svoje obaveze i
  svoju du\u017enost \u2013 to je vernost koje treba da se pridr\u017eava\u0161. Samo
  zato \u0161to stvari ne mo\u017ee\u0161 da obavlja\u0161 rukama ili zato \u0161to
  vi\u0161e ne mo\u017ee\u0161 da govori\u0161, zato \u0161to si izgubio vid ili vi\u0161e
  ne mo\u017ee\u0161 da se kre\u0107e\u0161, ne sme\u0161 da pomisli\u0161 da Bog
  treba da te izle\u010di i da, ukoliko te On ne izle\u010di, po\u017eeli\u0161 da
  Ga se u najdubljem delu svog srca odrekne\u0161, da napusti\u0161 svoju du\u017enost
  i da Boga ostavi\u0161 za sobom. Koja je priroda takvog \u010dina? (To je izdaja
  Boga.) To je izdaja! Kad nisu bolesni, neki ljudi \u0107e \u010desto dolaziti pred
  Boga da se mole, a kada su bolesni i nadaju se da \u0107e ih Bog izle\u010diti,
  polo\u017ei\u0107e sve svoje nade u Boga, i dalje dolaziti pred Njega i ne\u0107e
  Ga napustiti. Me\u0111utim, kad pro\u0111e izvesno vreme i Bog ih ne izle\u010di,
  oni se razo\u010daraju u Boga, duboko u svom srcu napu\u0161taju Boga i napu\u0161taju
  svoje du\u017enosti. Kada nisu ozbiljno bolesni i Bog ih ne izle\u010di, neki ljudi
  ne napu\u0161taju Boga; me\u0111utim, kada im se bolest pogor\u0161a i kad se suo\u010de
  sa smr\u0107u, tad zasigurno znaju da ih Bog zapravo nije izle\u010dio, da su sve
  to vreme u stvari i\u0161\u010dekivali smrt, pa onda u svom srcu napu\u0161taju
  Boga i pori\u010du Ga. Po\u0161to ih nije izle\u010dio, smatraju da Bog ne sme ni
  da postoji; po\u0161to ih nije izle\u010dio, Bog ne sme uop\u0161te ni da bude Bog
  i u Njega nije vredno verovati. Po\u0161to ih Bog nije izle\u010dio, \u017eale \u0161to
  su u Njega ikada i verovali i prestaju da veruju. Nije li ovo izdaja Boga? Ovo je
  ozbiljna izdaja Boga. Prema tome, ne smete nipo\u0161to krenuti tim putem \u2013
  jer istinsku veru imaju samo oni koji su do smrti pokorni Bogu.\\nKada bolest zakuca
  na vrata, kojim putem bi ljudi trebalo da idu? Kako treba da na\u010dine izbor?
  Ljudi ne treba da potonu u stanja uznemirenosti, strepnje i zabrinutosti, niti da
  razmi\u0161ljaju o svojim budu\u0107im izgledima i putevima. Naprotiv, \u0161to
  \u010de\u0161\u0107e ljudi sebe zateknu u takvim trenucima i u takvim posebnim situacijama
  i kontekstima, i \u0161to se vi\u0161e suo\u010davaju sa takvim neposrednim pote\u0161ko\u0107ama,
  tim pre treba da tra\u017ee istinu i da ka njoj streme. Jedino tako propovedi koje
  si u pro\u0161losti \u010duo i istine koje si shvatio ne\u0107e biti uzaludne i
  mo\u0107i \u0107e da postignu dejstvo. \u0160to se vi\u0161e suo\u010dava\u0161
  sa takvim pote\u0161ko\u0107ama, tim pre treba da se odrekne\u0161 sopstvenih \u017eelja
  i da se pokori\u0161 Bo\u017ejim orkestracijama. Kada te dovede u takvu situaciju
  i za tebe uredi takve uslove, Bo\u017eji naum nije da te navede da potone\u0161
  u emocije uznemirenosti, strepnje i zabrinutosti, kao ni da Boga preispituje\u0161
  ho\u0107e li te izle\u010diti nakon \u0161to te bolest zadesi, i da time otkrije\u0161
  istinu o toj stvari. Bog ti name\u0161ta ove naro\u010dite situacije i uslove kako
  bi iz njih mogao da izvu\u010de\u0161 pouke, da postigne\u0161 dublji ulazak u istinu
  i u pokornost Bogu, i kako bi jasnije i ta\u010dnije saznao na koji na\u010din Bog
  orkestrira svim ljudima, doga\u0111ajima i stvarima. \u010covekova sudbina je u
  Bo\u017ejim rukama, pa tako, bez obzira na to mogu li to da osete i osveste, ljudi
  treba da se pokore, da se Bogu ne opiru, da Ga ne odbijaju i da Ga nikako ne preispituju.
  Mogao bi da umre\u0161 u svakom slu\u010daju, a ako se Bogu opire\u0161, odbija\u0161
  Ga i preispituje\u0161, suvi\u0161no je re\u0107i kakav \u0107e ti biti kraj. Nasuprot
  tome, ako si u tim istim situacijama i uslovima u stanju da tra\u017ei\u0161 na\u010din
  na koji stvoreno bi\u0107e treba da se pokorava orkestracijama Stvoritelja, da tra\u017ei\u0161
  pouke koje treba da izvu\u010de\u0161 i iskvarene naravi koje treba da sazna\u0161
  u situacijama koje ti Bog donosi, ako u takvim situacijama mo\u017ee\u0161 da shvati\u0161
  Bo\u017eje namere i da dobro svedo\u010di\u0161 kako bi ispunio Bo\u017eje zahteve,
  to je upravo ono \u0161to treba da \u010dini\u0161. Kada Bog za nekog uredi da se
  razboli, tako \u0161to \u0107e dobiti neku ozbiljnu ili manje ozbiljnu bolest, Njegov
  cilj nije u tome da te navede da shvati\u0161 sve pojedinosti o toj bolesti, \u0161tetu
  koju ti ona nanosi, muke i pote\u0161ko\u0107e koje ta bolest izaziva i sve to mno\u0161tvo
  ose\u0107anja koje ona u tebi stvara. Njegov cilj nije da bolest uva\u017ei\u0161
  time \u0161to \u0107e\u0161 se razboleti. Naprotiv, Njegov cilj je da iz te bolesti
  izvu\u010de\u0161 pouke, da nau\u010di\u0161 kako da ose\u0107a\u0161 Bo\u017eje
  namere, da upozna\u0161 iskvarene naravi koje otkriva\u0161 i pogre\u0161ne stavove
  koje prema Bogu usvaja\u0161 dok si bolestan, kao i da nau\u010di\u0161 kako da
  se pokorava\u0161 Bo\u017ejoj suverenosti i Njegovim ure\u0111enjima, kako bi mogao
  da postigne\u0161 istinsku pokornost prema Bogu i kako bi mogao da bude\u0161 postojan
  u svom svedo\u010denju \u2013 to je klju\u010d svega. Bog \u017eeli da te kroz bolest
  spasi i pro\u010disti. \u0160ta kod tebe On \u017eeli da pro\u010disti? \u017deli
  da o\u010disti sve tvoje neumerene \u017eelje i zahteve prema Bogu, pa \u010dak
  i da o\u010disti sve te razli\u010dite planove, osude i smicalice za kojima po svaku
  cenu pose\u017ee\u0161 ne bi li opstao i \u017eiveo. Bog od tebe ne tra\u017ei da
  pravi\u0161 planove, ne tra\u017ei da osu\u0111uje\u0161 i ne dozvoljava ti da prema
  Njemu ima\u0161 ikakve neumerene \u017eelje; tra\u017ei samo da Mu se pokori\u0161
  i da, u svojoj primeni i do\u017eivljavanju pokornosti, upozna\u0161 sopstveni stav
  prema bolesti i upozna\u0161 svoj stav prema telesnim stanjima koje ti On daje,
  ba\u0161 kao i svoje sopstvene \u017eelje. Nakon \u0161to spozna\u0161 ove stvari,
  mo\u0107i \u0107e\u0161 da ceni\u0161 koliko je za tebe korisno to \u0161to ti je
  Bog uredio te okolnosti bolesti, odnosno \u0161to ti je pru\u017eio ta telesna stanja;
  i mo\u0107i \u0107e\u0161 da ceni\u0161 koliko je to korisno u promeni tvoje naravi,
  u dostizanju spasenja i postizanju tvog \u017eivot-ulaska. Ba\u0161 zato, kada bolest
  zakuca na vrata, ne sme\u0161 stalno da se pita\u0161 kako da se od nje izbavi\u0161,
  kako da od nje pobegne\u0161 ili kako da je odbaci\u0161. Neki ljudi ka\u017eu:
  \u201eKa\u017ee\u0161 da od nje ne smem da pobegnem niti da je odbacim, kao i da
  ne smem da poku\u0161am da se od nje izbavim. Pod tim, dakle, misli\u0161 da ne
  smem ni da se le\u010dim!\u201c Nikada to nisam rekao; to je tvoje pogre\u0161no
  shvatanje. Podr\u017eavam te u aktivnom le\u010denju bolesti, ali ne \u017eelim
  da \u017eivi\u0161 u svojoj bolesti niti da zbog uticaja koji ta bolest ima na tebe
  zapadne\u0161 u uznemirenost, strepnju i zabrinutost, da bi na kraju od Boga odlutao
  i napustio Ga zbog sveg bola koji ti je ta bolest izazvala. Ako ti bolest nanosi
  veliku patnju i \u017eeli\u0161 da se le\u010di\u0161 i da je odagna\u0161, onda
  je to naravno u redu. To je tvoje pravo; ima\u0161 pravo da odlu\u010di\u0161 da
  se le\u010di\u0161 i niko nema pravo da te spre\u010dava u tome. Me\u0111utim, time
  \u0161to se le\u010di\u0161, ne sme\u0161 da \u017eivi\u0161 u svojoj bolesti i
  da odbija\u0161 da obavlja\u0161 svoju du\u017enost ili da je napusti\u0161, kao
  ni da odbacuje\u0161 Bo\u017eje orkestracije i ure\u0111enja. Ako tvoja bolest ne
  mo\u017ee da se izle\u010di, zapa\u0161\u0107e\u0161 u stanje uznemirenosti, strepnje
  i zabrinutosti i zato \u0107e\u0161 biti pun \u017ealbi i sumnji u pogledu Boga,
  izgubi\u0107e\u0161 \u010dak i veru u Boga, izgubi\u0107e\u0161 nadu, a neki \u0107e
  odlu\u010diti i da napuste svoje du\u017enosti \u2013 to je ne\u0161to \u0161to
  nipo\u0161to ne treba da u\u010dinite. Kada se suo\u010davate sa bole\u0161\u0107u,
  mo\u017eete aktivno da tra\u017eite lek, ali i tome treba pristupiti uz pozitivan
  stav. A kad je re\u010d o tome u kojoj meri se tvoja bolest mo\u017ee le\u010diti,
  da li se uop\u0161te mo\u017ee izle\u010diti i \u0161ta bi na kraju moglo da se
  dogodi, treba uvek da se pokorava\u0161, bez prigovora. To je stav koji treba da
  usvoji\u0161, jer si stvoreno bi\u0107e i nema\u0161 drugog izbora. Ne mo\u017ee\u0161
  re\u0107i: \u201eAko se izle\u010dim od ove bolesti, poverova\u0107u da je to Bo\u017eja
  vi\u0161a sila, a ako se ne izle\u010dim, onda ne\u0107u biti zadovoljan Bogom.
  Za\u0161to mi je Bog dao ovu bolest? Za\u0161to ne izle\u010di ovu bolest? Za\u0161to
  sam se od nje ba\u0161 ja razboleo, a ne neko drugi? Ne \u017eelim je! Za\u0161to
  moram da umrem prerano, ovako mlad? Za\u0161to drugi ljudi i dalje mogu da \u017eive?
  Za\u0161to?\u201c Ne pitaj za\u0161to jer je to Bo\u017eja orkestracija. Ne postoji
  razlog i ne treba da postavlja\u0161 to pitanje. Buntovni\u010dki govori\u0161 kad
  pita\u0161 za\u0161to i to nije pitanje koje stvoreno bi\u0107e treba da postavlja.
  Ne pitaj za\u0161to, jer ne postoji za\u0161to. Bog je tako uredio i isplanirao
  stvari. Pita\u0161 li za\u0161to, mo\u017ee se jedino re\u0107i da si previ\u0161e
  buntovan, previ\u0161e nepopustljiv. Kada ne\u010dim nisi zadovoljan ili kada Bog
  ne u\u010dini onako kako bi ti \u017eeleo ili ne dozvoli da bude po tvom, postaje\u0161
  nesre\u0107an, nezadovoljan i uvek se pita\u0161 za\u0161to. Dakle, Bog te pita:
  \u201eZa\u0161to kao stvoreno bi\u0107e nisi dobro obavio svoju du\u017enost? Za\u0161to
  nisi verno obavio svoju du\u017enost?\u201c I \u0161ta \u0107e\u0161 Mu odgovoriti?
  Re\u0107i \u0107e\u0161: \u201eNe postoji za\u0161to, takav sam kakav sam.\u201c
  Je li to prihvatljivo? (Nije.) Prihvatljivo je da ti se Bog tako obra\u0107a, ali
  ne i da se ti tako obra\u0107a\u0161 Bogu. Stav ti je pogre\u0161an i previ\u0161e
  si nerazuman. Kakve god da su pote\u0161ko\u0107e sa kojima se suo\u010dava stvoreno
  bi\u0107e, sasvim je prirodno i opravdano da treba da se pokori\u0161 ure\u0111enjima
  i orkestracijama Stvoritelja. Na primer, roditeljima si se rodio, oni su te odgajili
  i zove\u0161 ih majkom i ocem \u2013 to je savr\u0161eno prirodno i opravdano i
  tako i treba da bude; ne postoji za\u0161to. Prema tome, Bog za tebe orkestrira
  sve ove stvari i, bilo da u\u017eiva\u0161 u blagoslovima ili podnosi\u0161 patnje,
  to je tako\u0111e savr\u0161eno prirodno i opravdano, i po tom pitanju nema\u0161
  nikakav izbor. Ako mo\u017ee\u0161 da se pokorava\u0161 do samoga kraja, onda \u0107e\u0161
  dobiti spasenje kao \u0161to ga je dobio Petar. Me\u0111utim, ako Boga okrivljuje\u0161,
  ako Boga napu\u0161ta\u0161 i Boga izdaje\u0161 zbog neke privremene bolesti, u
  tom slu\u010daju, sva odricanja, svako tvoje davanje, obavljanje du\u017enosti i
  cena koju si ranije platio bili su uzaludni. Zato \u0161to sav tvoj pre\u0111a\u0161nji
  naporan rad ne\u0107e postaviti nikakav temelj da svoju du\u017enost stvorenog bi\u0107a
  dobro obavlja\u0161 niti da kao stvoreno bi\u0107e zauzme\u0161 svoje pravo mesto,
  i to kod tebe ne\u0107e ni\u0161ta promeniti. To \u0107e te potom navesti da zbog
  svoje bolesti izda\u0161 Boga i zavr\u0161i\u0107e\u0161 kao Pavle, bivaju\u0107i
  ka\u017enjen na kraju. Razlog za takvu odluku je u tome \u0161to si sve prethodno
  \u010dinio ne bi li stekao krunu i dobio blagoslove. Kada se kona\u010dno suo\u010di\u0161
  sa bole\u0161\u0107u i smr\u0107u, ako, bez prigovora, mo\u017ee\u0161 i dalje da
  se pokorava\u0161, to dokazuje da si za Boga prethodno sve \u010dinio iskreno i
  dragovoljno. Bogu si pokoran i kona\u010dno \u0107e tvoja pokornost ozna\u010diti
  savr\u0161en kraj tvoga \u017eivota verovanja u Boga, i Bog za to ima re\u010di
  hvale. Prema tome, bolest mo\u017ee dovesti do toga da ima\u0161 dobar kraj ili
  mo\u017ee prouzrokovati onaj lo\u0161; kakav \u0107e biti tvoj kraj zavisi od puta
  kojim ide\u0161 i od tvog stava prema Bogu.\\nDa li je sada re\u0161en problem zbog
  koga ljudi dospevaju u negativne emocije izazvane bole\u0161\u0107u? (Jeste.) Imate
  li sada ispravne ideje i gledi\u0161ta o na\u010dinu na koji treba da se suo\u010davate
  s bole\u0161\u0107u? (Da.) Znate li kako da to primenjujete? Ako ne zna\u0161, otkri\u0107u
  ti keca koji dr\u017eim u rukavu, ono najbolje \u0161to mo\u017ee\u0161 da u\u010dini\u0161.
  Znate li \u0161ta je to? Ako te bolest zadesi i, koliko god da razume\u0161 doktrinu,
  jo\u0161 uvek ne mo\u017ee\u0161 da je prevazi\u0111e\u0161, tvoje \u0107e srce
  ipak dospeti u stanje uznemirenosti, strepnje i zabrinutosti, i ne samo da ovoj
  stvari ne\u0107e\u0161 mo\u0107i da pristupi\u0161 smireno, ve\u0107 \u0107e ti
  srce tako\u0111e biti ispunjeno pritu\u017ebama. Sve vreme \u0107e\u0161 se pitati:
  \u201eZa\u0161to neko drugi nije oboleo od ove bolesti? Za\u0161to ba\u0161 ja da
  je dobijem? Kako mi se to dogodilo? Zato \u0161to nemam sre\u0107e i prati me lo\u0161a
  sudbina. Nikada nikoga nisam uvredio, niti sam u\u010dinio ikakav greh, pa za\u0161to
  mi se onda ovo doga\u0111a? Bog je prema meni tako nepravi\u010dan!\u201c Dakle,
  vidi\u0161, osim uznemirenosti, strepnje i zabrinutosti, dospeva\u0161 i u stanje
  utu\u010denosti, pri \u010demu jedna negativna emocija susti\u017ee drugu i, koliko
  god da se upinje\u0161, nema na\u010dina da ih izbegne\u0161. I po\u0161to je to
  prava bolest i ne mo\u017ee\u0161 je se tako lako re\u0161iti niti je izle\u010diti,
  \u0161ta, dakle, treba da uradi\u0161? \u017deli\u0161 da se pokori\u0161, ali ne
  mo\u017ee\u0161, a ako se jednog dana i pokori\u0161, ve\u0107 slede\u0107eg ti
  se stanje pogor\u0161a i ose\u0107a\u0161 ogroman bol, pa vi\u0161e ni ne \u017eeli\u0161
  da se pokorava\u0161 i iznova po\u010dinje\u0161 da prigovara\u0161. Sve vreme se
  vrti\u0161 u ovom za\u010daranom krugu, pa \u0161ta bi onda trebalo da u\u010dini\u0161?
  Dozvoli da ti otkrijem tajnu uspeha. Bilo da se suo\u010dava\u0161 sa vrlo ozbiljnom
  ili manje ozbiljnom bole\u0161\u0107u, onoga \u010dasa kada se tvoja bolest pogor\u0161a
  ili kada se suo\u010di\u0161 sa smr\u0107u, upamti samo jedno: ne boj se smrti.
  \u010cak i ako si dospeo u terminalno stanje raka, \u010dak i ako je stopa smrtnosti
  za tvoju konkretnu bolest izrazito visoka, nemoj se bojati smrti. Koliko god da
  je velika tvoja patnja, ako se boji\u0161 smrti, ne\u0107e\u0161 mo\u0107i da je
  podnese\u0161. Neki ljudi ka\u017eu: \u201eKad \u010dujem da to ka\u017ee\u0161,
  ose\u0107am se nadahnuto i imam \u010dak i bolju ideju. Ne samo da se ne\u0107u
  bojati smrti, ve\u0107 \u0107u je preklinjati da do\u0111e. Zar to ne\u0107e olak\u0161ati
  prolazak kroz nju?\u201c Za\u0161to preklinjati da smrt do\u0111e? Preklinjati smrt
  da do\u0111e predstavlja ekstremnu zamisao, dok je odsustvo straha od smrti razuman
  stav koji treba usvojiti. Zar nije tako? (Tako je.) Koji ispravan stav treba da
  usvojite da se ne biste pla\u0161ili smrti? Ako se va\u0161a bolest u toj meri pogor\u0161a
  da od nje mo\u017eete umreti, ako je stopa smrtnosti visoka bez obzira na starosnu
  dob obolelog i ako je kratko vreme od nastupanja bolesti do tragi\u010dnog ishoda,
  o \u010demu u svom srcu treba da razmi\u0161lja\u0161? \u201eNe smem se bojati smrti
  jer na kraju svi umiru. Sa druge strane, ve\u0107ina ljudi ne mo\u017ee da se pokori
  Bogu, pa ovu bolest mogu da iskoristim da primenjujem pokoravanje Bogu. U razmi\u0161ljanju
  i stavu, treba da se pokoravam Bo\u017ejim orkestracijama i ure\u0111enjima i ne
  smem se bojati smrti.\u201c Lako je umreti, znatno lak\u0161e nego \u017eiveti.
  Mo\u017ee se desiti da trpi\u0161 ogroman bol i da ne bude\u0161 svestan smrti,
  jer \u010dim ti se o\u010di zaklope i prestane\u0161 da di\u0161e\u0161, tvoja du\u0161a
  napu\u0161ta telo i tvoj \u017eivot se gasi. Tako nastupa smrt; toliko je prosto.
  Ne pla\u0161iti se smrti samo je jedan od stavova koje treba usvojiti. Osim toga,
  ne sme\u0161 da brine\u0161 da li \u0107e se tvoja bolest pogor\u0161ati, da li
  \u0107e\u0161 umreti ako ne mo\u017ee\u0161 da se izle\u010di\u0161, koliko ti je
  preostalo do smrti, niti kakvi \u0107e te bolovi zadesiti kada do\u0111e vreme da
  umre\u0161. Ne sme\u0161 da brine\u0161 o ovim stvarima; to nisu stvari zbog kojih
  treba brinuti. Zato \u0161to taj dan jednom mora do\u0107i, mora do\u0107i jedne
  godine, jednog meseca i jednog odre\u0111enog dana. Od toga se ne mo\u017ee\u0161
  sakriti i tome ne mo\u017ee\u0161 ute\u0107i \u2013 takva je tvoja sudbina. Tvoja
  takozvana sudbina je predodre\u0111ena od Boga i On ju je ve\u0107 uredio. Broj
  godina koje ima\u0161 na raspolaganju, \u017eivotnu dob i trenutak tvoje smrti Bog
  je ve\u0107 odredio, pa za\u0161to si onda zabrinut? O tome mo\u017ee\u0161 da brine\u0161,
  ali time ne\u0107e\u0161 ni\u0161ta promeniti; o tome mo\u017ee\u0161 da brine\u0161,
  ali to ne mo\u017ee\u0161 spre\u010diti; o tome mo\u017ee\u0161 da brine\u0161,
  ali dolazak tog dana ne\u0107e\u0161 zaustaviti. Prema tome, tvoja je briga izli\u0161na
  i tvojoj bolesti donosi samo jo\u0161 ve\u0107e breme. Jedan aspekt je da ne brine\u0161,
  a drugi da se smrti ne boji\u0161. Jo\u0161 jedan aspekt je da ne ose\u0107a\u0161
  strepnju i da ne govori\u0161: \u201eNakon \u0161to umrem, ho\u0107e li se moj mu\u017e
  (ili \u017eena) ponovo ven\u010dati? Ko \u0107e brinuti o mom detetu? Ko \u0107e
  preuzeti moju du\u017enost? Ko \u0107e me se se\u0107ati? Nakon \u0161to umrem,
  kakav \u0107e mi kraj Bog odrediti?\u201c O takvim pitanjima ne treba da brine\u0161.
  Svi koji umru imaju svoje sopstveno mesto na koje odlaze i Bog se za to pobrinuo.
  Oni koji \u017eive nastavi\u0107e da \u017eive; postojanje nijedne pojedina\u010dne
  osobe ne\u0107e uticati na uobi\u010dajenu aktivnost i opstanak ljudskog roda, kao
  \u0161to ni bilo \u010diji nestanak ne\u0107e ni\u0161ta promeniti, pa stoga o tim
  stvarima ne treba da brine\u0161. Nema potrebe da brine\u0161 o raznim svojim ro\u0111acima,
  a jo\u0161 i manje da brine\u0161 ho\u0107e li te se nakon smrti iko se\u0107ati.
  U \u010demu je svrha i ako te se neko bude se\u0107ao? Da si poput Petra, bilo bi
  vredno da te neko pamti; da si poput Pavla, ljudima bi jedino doneo nesre\u0107u,
  pa za\u0161to bi iko \u017eeleo da te pamti? A tu je jo\u0161 jedan razlog za brigu
  koji za ljude predstavlja krajnje realisti\u010dnu misao. Oni ka\u017eu: \u201eNakon
  \u0161to umrem, nikada vi\u0161e ne\u0107u baciti pogled na ovaj svet i vi\u0161e
  nikada ne\u0107u mo\u0107i da u\u017eivam u materijalnom \u017eivotu svih ovih stvari.
  Nakon \u0161to umrem, ni\u0161ta na ovom svetu me vi\u0161e ne\u0107e doticati,
  a ose\u0107aj \u017eivljenja \u0107e nestati. Nakon \u0161to umrem, kuda \u0107u
  oti\u0107i?\u201c Mesto tvog odlaska nije ne\u0161to o \u010demu ti treba da brine\u0161,
  niti da se oko toga uznemirava\u0161. Vi\u0161e ne\u0107e\u0161 biti osoba koja
  \u017eivi, a brine\u0161 o tome da u materijalnom svetu ne\u0107e\u0161 mo\u0107i
  da oseti\u0161 sve ljude, doga\u0111aje, stvari, okru\u017eenja i sli\u010dno. Tek
  o tome ne treba da brine\u0161, a \u010dak i da ne mo\u017ee\u0161 da napusti\u0161
  te stvari, od toga ne\u0107e biti nikakve koristi. Me\u0111utim, ono \u0161to ti
  mo\u017ee doneti malu utehu jeste \u010dinjenica da bi tvoja smrt ili tvoj odlazak
  mogli ozna\u010diti novi po\u010detak za tvoje slede\u0107e ovaplo\u0107enje, bolji
  po\u010detak, zdrav po\u010detak, sasvim dobar po\u010detak, po\u010detak novog
  povratka tvoje du\u0161e. To ne\u0107e nu\u017eno biti lo\u0161a stvar, jer bi mogao
  da se vrati\u0161 u druga\u010diji na\u010din postojanja i u druga\u010dijem obliku.
  A kakav \u0107e to ta\u010dno biti oblik zavisi\u0107e od ure\u0111enja Bo\u017ejeg
  i Stvoriteljevog. A kada je o tome re\u010d, mo\u017ee se re\u0107i da svako samo
  treba da sa\u010deka i da vidi. Ako bira\u0161 da \u017eivi\u0161 na bolji na\u010din
  i u boljem obliku nakon \u0161to u ovom \u017eivotu umre\u0161, tada su, bez obzira
  na ozbiljnost tvoje bolesti, najva\u017eniji na\u010din na koji se sa njom nosi\u0161
  i dobra dela koja treba da pripremi\u0161, a ne tvoja besmislena uznemirenost, strepnja
  i zabrinutost. Kada razmi\u0161lja\u0161 na ovaj na\u010din, zar se time ne smanjuje
  stepen tvog straha, u\u017easa i odbacivanja smrti? (Jeste.) O koliko aspekata smo
  upravo razgovarali? Jedan je bio da se smrti ne treba pla\u0161iti. Koji su bili
  ostali? (Ne treba da brinemo ho\u0107e li se na\u0161a bolest pogor\u0161ati i ne
  treba da ose\u0107amo zabrinutost zbog svojih supru\u017enika ili dece, niti zbog
  svog sopstvenog kraja i odredi\u0161ta i tome sli\u010dno.) Prepustite sve to u
  Bo\u017eje ruke. I \u0161ta jo\u0161? (Ne treba da brinemo kuda nakon smrti odlazimo.)
  Briga o tim stvarima je besmislena. \u017divi u sada\u0161njosti i dobro obavljaj
  stvari koje treba da obavlja\u0161 ovde i sada. Ne zna\u0161 kako \u0107e se stvari
  odvijati u budu\u0107nosti, pa sve to treba da prepusti\u0161 u Bo\u017eje ruke.
  I \u0161ta jo\u0161? (Treba da po\u017eurimo da pripremimo dobra dela za svoje budu\u0107e
  odredi\u0161te.) Tako je, ljudi treba da pripreme jo\u0161 dobrih dela za budu\u0107nost,
  treba da streme ka istini i da budu ljudi koji razumeju istinu i poseduju istina-stvarnost.
  Neki ljudi ka\u017eu: \u201eSada kada govori\u0161 o smrti, zna\u010di li to da
  \u0107e svako u budu\u0107nosti morati da se suo\u010di sa smr\u0107u? Je li to
  neko lo\u0161e predskazanje?\u201c Nije lo\u0161e predskazanje niti se time preventivno
  vakcini\u0161ete, a jo\u0161 manje to predstavlja kletvu da iko umre \u2013 ove
  re\u010di nisu kletve. Pa, \u0161ta su onda? (Za ljude su one put primene.) Ta\u010dno,
  one su ono \u0161to ljudi treba da primenjuju, ispravna gledi\u0161ta i stavovi
  kojih ljudi treba da se dr\u017ee, kao i istine koje ljudi treba da razumeju. \u010cak
  i oni koji nemaju ba\u0161 nikakvu bolest treba da usvoje ovakav stav pri sopstvenom
  suo\u010davanju sa smr\u0107u. Tako, neki ljudi ka\u017eu: \u201eAko se smrti ne
  pla\u0161imo, zna\u010di li to da smrt po nas ne\u0107e do\u0107i?\u201c Je li to
  istina? (Nije.) Pa \u0161ta je onda? (To je predstava i njihova uobrazilja.) To
  je izopa\u010deno, logi\u010dko razmi\u0161ljanje i sotonska filozofija \u2013 to
  nije istina. Ne radi se o tome da smrt po tebe ne\u0107e do\u0107i i da ne\u0107e\u0161
  umreti ako se smrti ne pla\u0161i\u0161 i ako zbog nje nisi zabrinut \u2013 to nije
  istina. Govorim o stavu kakav bi ljudi trebalo da imaju prema smrti i bolesti. Kada
  usvoji\u0161 takav stav, za sobom mo\u017ee\u0161 da ostavi\u0161 negativne emocije
  uznemirenosti, strepnje i zabrinutosti. Tada ne\u0107e\u0161 biti zarobljen svojom
  bole\u0161\u0107u i tvoje razmi\u0161ljanje i svet tvoga duha ne\u0107e biti naru\u0161eni
  niti ometeni \u010dinjenicom da si bolestan. Jedna od li\u010dnih pote\u0161ko\u0107a
  sa kojima se ljudi suo\u010davaju jesu njihovi budu\u0107i izgledi, a drugu \u010dine
  bolest i smrt. Budu\u0107i izgledi i smrtnost mogu da zagospodare ljudskim srcem.
  Ipak, ako sa ova dva problema mo\u017ee\u0161 pravilno da se suo\u010di\u0161 i
  da prevazi\u0111e\u0161 svoje negativne emocije, tada te uobi\u010dajene pote\u0161ko\u0107e
  ne\u0107e savladati.\\nOsim u slu\u010daju bolesti, ljudi i zbog drugih stvarnih
  problema u svom \u017eivotu \u010desto ose\u0107aju uznemirenost, strepnju i zabrinutost.
  U \u017eivotu postoje mnogi stvarni problemi. Na primer, u va\u0161em domu mo\u017ee
  biti starijih ljudi ili dece o kojima treba brinuti ili ih odgajati. Novac je va\u0161oj
  deci potreban za \u0161kolovanje i za \u017eivotne tro\u0161kove, starijim ljudima
  je potreban novac za le\u010denje, a veliki nov\u010dani iznosi neophodni su za
  svakodnevne \u017eivotne tro\u0161kove. \u017delite da obavljate svoju du\u017enost,
  me\u0111utim, ako napustite posao, od \u010dega \u0107ete \u017eiveti? Ku\u0107na
  u\u0161te\u0111evina \u0107e se vrlo brzo potro\u0161iti, pa kako \u0107ete onda
  \u017eiveti bez novca? Budete li odlazili da zaradite novac, to \u0107e dovesti
  do odlaganja u obavljanju va\u0161e du\u017enosti, a ako napustite posao da biste
  obavljali svoju du\u017enost, tada ne\u0107ete mo\u0107i da re\u0161avate ku\u0107ne
  pote\u0161ko\u0107e. \u0160ta, dakle, treba da u\u010dinite? Mnogi ljudi muku mu\u010de
  i zbunjeni su pred ovakvim stvarima, pa svi redom \u010deznu da do\u0111e dan Bo\u017eji
  i pitaju se kada \u0107e ih zadesiti velike katastrofe i treba li da naprave zalihe
  hrane. Ako se za to pripreme, kod ku\u0107e ne\u0107e imati dodatnog novca i \u017eivot
  postaje vrlo te\u017eak. Prime\u0107uju da drugi ljudi nose bolju ode\u0107u i da
  se bolje hrane, pa se ose\u0107aju nesre\u0107no i \u017eivot im je prete\u017eak.
  Dugo ve\u0107 nisu jeli meso, a ako imaju nekoliko jaja, nisu voljni da ih pojedu,
  ve\u0107 \u017eurno odlaze na pijacu da ih prodaju i zarade koji dinar. I dok razmi\u0161ljaju
  o svim ovim mukama, po\u010dinju da brinu: \u201eKada \u0107e do\u0107i kraj ovim
  te\u0161kim danima? Sve vreme mi govore: \u2019Dan Bo\u017eji sti\u017ee, dan Bo\u017eji
  sti\u017ee\u2019 i \u2019Bo\u017eje delo \u0107e se uskoro privesti kraju\u2019,
  ali ho\u0107e li mi neko re\u0107i kada \u0107e se to zaista i dogoditi? Ko to zasigurno
  mo\u017ee da ka\u017ee?\u201c Neki ljudi provode godine obavljaju\u0107i svoju du\u017enost
  daleko od ku\u0107e i povremeno razmi\u0161ljaju: \u201eNemam predstavu kolika su
  mi sada deca, a ne znam ni da li su mi roditelji dobrog zdravlja. Sve ove godine
  sam daleko od ku\u0107e i nisam se brinuo o njima. Da li su ih zadesile kakve neda\u0107e?
  \u0160ta \u0107e biti ako se razbole? Ho\u0107e li se iko brinuti o njima? Do sada
  su moji roditelji sigurno u\u0161li u devetu ili desetu deceniju \u017eivota, a
  ja nemam predstavu ni da li su \u017eivi.\u201c Kada razmi\u0161ljaju o ovim stvarima,
  u njihovom srcu nastaje neka bezimena strepnja. Osim \u0161to strepe, oni \u0107e
  i brinuti, me\u0111utim, zabrinutost nikada ni\u0161ta ne re\u0161ava, pa zato po\u010dinju
  da ose\u0107aju uznemirenost. A kada su veoma uznemireni, svoju pa\u017enju usmeravaju
  na Bo\u017eje delo i na dan Bo\u017eji i pitaju se: \u201eZa\u0161to dan Bo\u017eji
  jo\u0161 uvek nije stigao? Ho\u0107emo li zauvek \u017eiveti ovakvim \u017eivotom
  lutanja i izop\u0161tenosti? Kada \u0107e do\u0107i dan Bo\u017eji? Kada \u0107e
  se Bo\u017eje delo privesti kraju? Kada \u0107e Bog uni\u0161titi ovaj svet? Kada
  \u0107e se carstvo Bo\u017eje pokazati na zemlji? Kada \u0107emo videti pojavljivanje
  Bo\u017eje li\u010dnosti?\u201c Svaki put iznova razmi\u0161ljaju o ovim stvarima
  i negativne emocije zabrinutosti, strepnje i uznemirenosti naviru u njihovom srcu,
  istog trenutka im se na licu pojavljuje izraz zabrinutosti, ne ose\u0107aju vi\u0161e
  radost, hodaju tromo, jedu bez ikakvog apetita i svaki dan provode sa uskovitlanim
  mislima u svom umu. Da li je dobro \u017eiveti u takvim negativnim emocijama? (Nije.)
  \u010cak i najmanja \u017eivotna te\u0161ko\u0107a ljude mo\u017ee navesti da povremeno
  zapadnu u ove negativne emocije pasivnosti. Ponekad, bez ikakvog razloga ili bez
  nekog naro\u010ditog konteksta, \u010dak ni kad nijedna konkretna osoba nije izgovorila
  ni\u0161ta posebno, ove negativne emocije \u0107e nesvesno navirati u njihovom srcu.
  Kada ove negativne emocije nahrupe u ljudsko srce, \u017eelje koje ljudi imaju dok
  \u017eude za dolaskom dana Bo\u017ejeg, dok \u017eude da se Njegovo delo privede
  kraju i da Njegovo carstvo stigne, bivaju jo\u0161 upornije. Neki ljudi \u010dak
  usrdno kle\u010de i mole se Bogu u bujicama suza, govore\u0107i: \u201eO Bo\u017ee,
  mrzim ovaj svet i mrzim ovaj ljudski rod. Molim te da sve ovo \u0161to pre okon\u010da\u0161,
  okon\u010daj ljudske telesne \u017eivote i privedi kraju svu ovu muku.\u201c Mnogo
  puta se bez ikakvih rezultata ovako mole, a negativne emocije zabrinutosti, strepnje
  i uznemirenosti i dalje im obavijaju srce, ostaju u njihovim mislima i duboko su
  prisutne u njihovom duhu, dok ih obavijaju i vr\u0161e dubok uticaj na njih. U stvari,
  to se ne doga\u0111a ni zbog \u010dega drugog ve\u0107 zato \u0161to oni \u017eude
  da \u0161to pre do\u0111e dan Bo\u017eji, da se Bo\u017eje delo \u0161to pre privede
  kraju, da \u0161to je pre mogu\u0107e dobiju blagoslove, da dobiju dobro odredi\u0161te,
  da u\u0111u u nebo ili u carstvo koje zami\u0161ljaju i za kojim \u017eude u svojim
  sopstvenim predstavama; zato su u najdubljim odajama svoga srca uvek toliko uzbu\u0111eni
  zbog ovih stvari. Na povr\u0161ini pokazuju uzbu\u0111enost, dok zapravo ose\u0107aju
  uznemirenost, strepnju i zabrinutost. Kada takva ose\u0107anja uznemirenosti, strepnje
  i zabrinutosti neprestano okru\u017euju ljude, u njima se budi aktivna misao i po\u010dinju
  da razmi\u0161ljaju: \u201eAko dan Bo\u017eji ne\u0107e do\u0107i uskoro i ako se
  Bo\u017eje delo ne\u0107e privesti kraju u najkra\u0107em roku, trebalo bi da iskoristim
  svoju mladost i svoju sposobnost da naporno radim. \u017delim da radim i zaradim
  novac, da neko vreme u svetu vredno radim i da u\u017eivam u \u017eivotu. Ako dan
  Bo\u017eji ne dolazi uskoro, \u017eelim da se vratim ku\u0107i i da ponovo budem
  sa svojom porodicom, da prona\u0111em partnera, da neko vreme dobro \u017eivim,
  da pomognem roditeljima i odgajam decu. Kada ostarim, ima\u0107u mnogo dece i oni
  \u0107e \u017eiveti zajedno sa mnom, u\u017eiva\u0107emo u porodi\u010dnom \u017eivotu
  \u2013 kako je to samo divan prizor! Kakva draga slika!\u201c Razmi\u0161ljaju\u0107i
  na ovaj na\u010din, oni se raduju u\u017eivanju u takvom \u017eivotu. Kad god pomisle
  da \u0107e dan Bo\u017eji do\u0107i uskoro i da \u0107e se Bo\u017eje delo uskoro
  privesti kraju, ljudske \u017eelje se jo\u0161 \u017ee\u0161\u0107e rasplamsaju,
  a njihova \u017eudnja da se Bo\u017eje delo \u0161to pre privede kraju dodatno se
  poja\u010da. U takvoj situaciji, kada \u010dinjenice nisu u saglasju sa onim \u0161to
  ljudi \u017eele, kada ljudi ne mogu da vide nikakvu naznaku zavr\u0161etka Bo\u017ejeg
  dela niti da \u0107e dan Bo\u017eji sti\u0107i, pogor\u0161aju im se ose\u0107anja
  uznemirenosti, strepnje i zabrinutosti. Brinu o tome \u0161ta \u0107e biti za nekoliko
  godina, kada ostare a ne na\u0111u partnera, ko \u0107e u starosti brinuti o njima.
  Ako sve vreme u Bo\u017ejoj ku\u0107i obavljaju svoju du\u017enost i ve\u0107 su
  sa dru\u0161tvom prekinuli sve veze, brinu ho\u0107e li, nakon \u0161to se vrate
  ku\u0107i da tamo \u017eive, mo\u0107i da se ponovo uklju\u010de u dru\u0161tvo.
  Ako se za nekoliko godina vrate svom poslovanju ili se vrate na svoj posao, brinu
  ho\u0107e li mo\u0107i da uhvate korak sa vremenom, ho\u0107e li mo\u0107i da se
  izdvoje iz gomile i ho\u0107e li mo\u0107i da pre\u017eive. \u0160to se vi\u0161e
  brinu o takvim stvarima i zbog njih ose\u0107aju ve\u0107u strepnju i uznemirenost,
  sve manje su u stanju da smireno obavljaju svoju du\u017enost i da slede Boga u
  Bo\u017ejoj ku\u0107i. Prema tome, oni sve vi\u0161e brinu o svojoj budu\u0107nosti,
  o svojim izgledima i svom porodi\u010dnom \u017eivotu, ba\u0161 kao \u0161to brinu
  o svim pote\u0161ko\u0107ama koje mogu nastati u \u017eivotu u budu\u0107nosti.
  Razmi\u0161ljaju o svemu \u0161to mogu i brinu o svemu o \u010demu mogu; brinu se
  \u010dak i za \u017eivot svojih unuka i potomaka svojih unuka. Njihove misli dose\u017eu
  daleko, misli su im veoma temeljne i o svemu detaljno promi\u0161ljaju. Kada ljudi
  imaju ova ose\u0107anja zabrinutosti, strepnje i uznemirenosti, postaju nesposobni
  da svoje du\u017enosti obavljaju smireno i ne mogu jednostavno da slede Boga, ve\u0107
  umesto toga \u010desto imaju aktivne misli i svaki \u010das menjaju raspolo\u017eenje.
  Kada uvide da se delo jevan\u0111elja vrlo dobro odvija, razmi\u0161ljaju: \u201eDan
  Bo\u017eji uskoro \u0107e do\u0107i. Pa, svoju du\u017enost moram da obavljam kako
  treba! Samo napred! Moram da nastavim jo\u0161 nekoliko godina, nije ostalo jo\u0161
  tako mnogo. Sva ova patnja bi\u0107e vredna truda i urodi\u0107e plodom, pa vi\u0161e
  ne\u0107u imati briga!\u201c Me\u0111utim, posle nekoliko godina, velike katastrofe
  se i dalje nisu dogodile i niko ne pominje dan Bo\u017eji, pa se njihovo srce ohladi.
  Ova uznemirenost, strepnja i zabrinutost, ba\u0161 kao i aktivne misli, opet im
  dolaze, odlaze i ponavljaju se na ovaj na\u010din svaki put iznova, vrte\u0107i
  se u beskrajnim krugovima kao reakcija na me\u0111unarodnu situaciju i na stanje
  u Bo\u017ejoj ku\u0107i, i nema na\u010dina da ih oni kontroli\u0161u \u2013 \u0161ta
  god drugi govorili, oni ne mogu da promene stanje u kom se nalaze. Postoje li takvi
  ljudi? (Da.) Da li je ovakvim ljudima lako da budu postojani? (Nije.) Njihov stav
  i raspolo\u017eenje u obavljanju du\u017enosti i koli\u010dina energije koju ula\u017eu
  u svoje du\u017enosti, svi se redom temelje na \u201enajnovijim vestima\u201c. Neki
  ljudi ka\u017eu: \u201eSude\u0107i prema pouzdanim vestima, Bo\u017eje jevan\u0111elje
  se divno \u0161iri!\u201c A neki drugi vele: \u201eNajnovije vesti poru\u010duju
  da su \u0161irom sveta vrlo u\u010destale katastrofe i, sude\u0107i prema stanju
  u svetu i prema tim katastrofama, o\u010dito je da se ve\u0107 sada ispunila ta
  i ta katastrofa iz Knjige otkrivenja. Bo\u017eje delo \u0107e uskoro biti zavr\u0161eno,
  dan Bo\u017eji \u0107e uskoro sti\u0107i, a ceo verski svet je pod uzbunom!\u201c
  Kad god \u010duju \u201enajnovije vesti\u201c ili \u201epouzdane vesti\u201c, njihova
  uznemirenost, strepnja i zabrinutost privremeno popuste i vi\u0161e ih ne remete,
  pa na neko vreme napu\u0161taju svoje aktivne misli. Ipak, kada u dogledno vreme
  ne \u010duju nikakve \u201epouzdane vesti\u201c niti ikakve \u201eta\u010dne vesti\u201c,
  njihova uznemirenost, strepnja i zabrinutost, ba\u0161 kao i njihove aktivne misli,
  po\u010dinju da nadolaze. Neki ljudi \u010dak po\u010dinju da se pripremaju razmi\u0161ljaju\u0107i
  o tome gde da se prijave za posao, gde da potra\u017ee zaposlenje, koliko dece \u0107e
  imati, gde \u0107e im za nekoliko godina deca i\u0107i u \u0161kolu, kako da se
  pripreme za njihovu \u0161kolarinu na studijama, pa \u010dak planiraju da kupe ku\u0107u,
  zemlji\u0161te ili automobil. Me\u0111utim, nakon \u0161to \u010duju \u201epouzdane
  vesti\u201c, ove stvari na neko vreme ostavljaju po strani. Zar ovo ne podse\u0107a
  na neki vic? (Podse\u0107a.) Posle vi\u0161egodi\u0161nje vere u Boga i spoznaje
  Bo\u017ejeg dela, neki ljudi su u stanju da svedo\u010de za Boga, uz re\u010di:
  \u201eVera u Boga je pravi put u \u017eivotu. To je najsmisleniji \u017eivot. \u017diveti
  ovako ima najve\u0107u vrednost. Bez obzira na to kako me Bog vodi ili \u0161ta
  Bog radi, siguran sam da Bog sve \u010dini sa ciljem da spase ljude, pa \u0107u
  Boga slediti do samoga kraja. Pa makar to bilo tek kada nebo i zemlja sasvim ostare,
  tek kada zvezde promene svoj polo\u017eaj, kada se mora osu\u0161e, a planine pretvore
  u prah, odnosno kada se mora pretvore u kopno, a kopno postane more, moje srce osta\u0107e
  nepromenjeno i sasvim u tome. Preda\u0107u srce Bogu do kraja svog \u017eivota,
  a ako nakon ovog ima jo\u0161 neki \u017eivot, ja \u0107u i dalje slediti Boga.\u201c
  Me\u0111utim, ti ljudi sa toliko neda\u0107a u svom \u017eivotu ne razmi\u0161ljaju
  na ovaj na\u010din. Njihova vera u Boga po\u010diva jedino na pogledu na sada\u0161nje
  stanje stvari i oni svoj \u017eivot \u017eive onako kako misle da treba da ga \u017eive.
  Svoj stil \u017eivota ili polazne te\u017enje ne\u0107e promeniti samo zato \u0161to
  veruju u Boga. Ve\u0107 nekoliko godina veruju u Boga i ne menjaju ba\u0161 ni\u0161ta,
  ve\u0107 poput nevernika nastavljaju da \u017eive kao \u0161to su pre toga oduvek
  \u017eiveli. Ipak, vera u Boga obuhvata i jednu posebnu stvar, a ona je u tome da
  \u0107e uskoro do\u0107i dan Bo\u017eji, da \u0107e uskoro do\u0107i Bo\u017eje
  carstvo, da \u0107e uslediti velike katastrofe i da \u0107e oni koji veruju u Boga
  tada izbe\u0107i ove katastrofe, one ih ne\u0107e zadesiti i mo\u0107i \u0107e da
  budu spaseni. I samo su zbog te posebne stvari oni u toj meri zainteresovani da
  veruju u Boga. Njihov cilj i ono na \u0161ta se usredsre\u0111uju u svojoj veri
  u Boga stoga uvek \u010dini samo ta jedna stvar. Koliko god propovedi da su slu\u0161ali
  i koliko god istina o kojima ljudi govore da su \u010duli, odnosno koliko god dugo
  da veruju u Boga, na\u010din njihove vere u Boga nikada se ne menja i od njega nikada
  ne odustaju. Ni zbog propovedi koje slu\u0161aju, ni zbog istina koje razumeju,
  oni ne menjaju niti napu\u0161taju svoja pogre\u0161na gledi\u0161ta o veri u Boga.
  Prema tome, bilo da se ne\u0161to promenilo ili da se ne\u0161to govori o situaciji
  u spoljnom svetu ili u Bo\u017ejoj ku\u0107i, to se uvek odra\u017eava na ovu stvar
  koja ih najvi\u0161e zabrinjava u najdubljim odajama njihovog srca. Ako \u010duju
  da \u0107e Bo\u017eje delo uskoro biti privedeno kraju, presre\u0107ni su; me\u0111utim,
  \u010duju li da je jo\u0161 uvek prerano da Bo\u017eje delo bude privedeno kraju
  i to vi\u0161e ne mogu da izdr\u017ee, njihova uznemirenost, strepnja i zabrinutost
  \u0107e rasti iz dana u dan i krenu\u0107e da se pripremaju da u svakom trenutku
  napuste Bo\u017eju ku\u0107u i svoju bra\u0107u i sestre, da se jasno izdvoje od
  Bo\u017eje ku\u0107e. Naravno, ima i onih koji, u svakom trenutku, po\u010dinju
  da se pripremaju da potpuno obri\u0161u sve kontakt podatke svoje bra\u0107e i sestara
  i sve njihove poruke, te da knjige Bo\u017ejih re\u010di koje im je Bo\u017eja ku\u0107a
  poslala vrate crkvi. Razmi\u0161ljaju: \u201eZaista ne mogu dalje da sledim ovaj
  put vere u Boga i da stremim ka istini. Smatrao sam da vera u Boga zna\u010di da
  \u0107u \u017eiveti sre\u0107nim \u017eivotom, da \u0107u imati decu, dobiti blagoslove
  i u\u0107i u carstvo nebesko. Sada je taj divan san raspr\u0161en, ali \u0107u ipak
  izabrati da \u017eivim sre\u0107nim \u017eivotom, da imam decu i u\u017eivam u \u017eivotu.
  A opet, jo\u0161 uvek ne mogu da odustanem od svoje vere u Boga. Postoji li i dalje
  \u0161ansa da dobijem stostruko u ovom \u017eivotu, kao i ve\u010dni \u017eivot
  u svetu koji \u0107e do\u0107i, zar to ne bi bilo jo\u0161 i bolje?\u201c Ovakvo
  je njihovo gledi\u0161te na veru u Boga, to je njihov plan i, naravno, to predstavlja
  ono \u0161to oni rade. To je na\u010din razmi\u0161ljanja i planiranja u najdubljim
  odajama srca onih koji se u svojoj veri u Boga oslanjaju na sopstvenu uobrazilju,
  koji zbog svog telesnog \u017eivota uvek ose\u0107aju uznemirenost, strepnju i zabrinutost,
  i to predstavlja ono za \u010dim streme i put koji slede u svojoj veri u Boga. Za
  \u0161ta su se najvi\u0161e zaka\u010dili? Najvi\u0161e su se zaka\u010dili za pitanja
  kada \u0107e sti\u0107i dan Bo\u017eji, kada \u0107e Bo\u017eje delo biti privedeno
  kraju, kada \u0107e uslediti velike katastrofe i ho\u0107e li iz tih velikih katastrofa
  mo\u0107i da se izbave \u2013 za to su najvi\u0161e zainteresovani.\\nKad je re\u010d
  o onima koji uvek ose\u0107aju uznemirenost, strepnju i zabrinutost zbog svog telesnog
  \u017eivota, njihovo stremljenje u njihovoj veri u Boga sastoji se u tome \u201eda
  dobiju stostruko u ovom \u017eivotu, kao i ve\u010dni \u017eivot u svetu koji \u0107e
  do\u0107i\u201c. Me\u0111utim, njima se ne dopada da \u010duju u kojoj meri je napredovalo
  Bo\u017eje delo, da li su oni koji veruju u Boga postigli rezultat dobijanja spasenja,
  koliko ljudi je zadobilo istinu, spoznalo Boga i dalo dobro svedo\u010danstvo, ba\u0161
  kao da te stvari nemaju nikakve veze sa njima. Pa, \u0161ta oni onda \u017eele da
  \u010duju? (Kada \u0107e Bo\u017eje delo biti privedeno kraju.) Oni imaju znatno
  ve\u0107e nade, zar ne? Ve\u0107ina ljudi je previ\u0161e uskogruda. Pogledajte
  samo na \u0161ta su se namerili i nadaju se samo velikim stvarima \u2013 u kakvom
  su samo uzvi\u0161enom stanju! Ve\u0107ina ljudi je toliko prosta, uvek govore o
  promenama naravi, o pokoravanju Bogu, vernom obavljanju svoje du\u017enosti, obavljanju
  stvari u skladu sa istina-na\u010delima \u2013 kakvi su ovi ljudi? Previ\u0161e
  su uskogrudi! Kako to Kinezi ka\u017eu? Previ\u0161e su niski. \u0160ta zna\u010di
  to da su niski? Da su isuvi\u0161e prosti. I na \u0161ta su se namerili ovi ljudi?
  Nadaju se velikim stvarima, uzvi\u0161enim stvarima, vrhunskim stvarima. Oni koji
  se nadaju vrhunskim stvarima uporno \u017eele da se sve vi\u0161e uspinju, i dalje
  se uzaludno nadaju\u0107i da \u0107e ih Bog jednoga dana podi\u0107i u vazduh da
  se sa Njim susretnu. \u017deli\u0161 da se susretne\u0161 sa Bogom, ali se ne pita\u0161
  \u017eeli li Bog da se susretne sa tobom \u2013 samo nastavlja\u0161 da \u017eeli\u0161
  ove neverovatne stvari! Jesi li se barem nekoliko puta susreo sa Bogom? Ljudi Boga
  ne poznaju, pa \u0107e\u0161 Mu, kad se susretne\u0161 s Njim, i dalje prkositi.
  Prema tome, koji je razlog u osnovi uznemirenosti, strepnje i zabrinutosti ovih
  ljudi? Da li su zaista njihove \u017eivotne te\u0161ko\u0107e uzrok svemu tome?
  Ne, nije re\u010d o tome da oni zaista imaju pote\u0161ko\u0107e u svom \u017eivotu,
  ve\u0107 o tome da su te\u017ei\u0161te svoje vere u Boga usmerili na svoj telesni
  \u017eivot. Te\u017ei\u0161te njihovog stremljenja nije istina, ve\u0107 to da \u017eive
  sre\u0107nim \u017eivotom, da u\u017eivaju u dobrom \u017eivotu i da u\u017eivaju
  u dobroj budu\u0107nosti. Mogu li se problemi ovih ljudi lako re\u0161iti? Ima li
  ovakvih ljudi u crkvi? Kod drugih se uvek raspituju: \u201eO, kada \u0107e do\u0107i
  dan Bo\u017eji? Zar pre nekoliko godina nije re\u010deno da Bo\u017eje delo samo
  \u0161to nije privedeno kraju? Pa, za\u0161to onda jo\u0161 uvek nije zavr\u0161eno?\u201c
  Ima li na\u010dina da se iza\u0111e na kraj sa ovakvim ljudima? Samo im recite jednu
  jedinu re\u010d: \u201eUskoro!\u201c Kada je re\u010d o ovakvim ljudima, prvo ih
  upitajte: \u201eUvek se o tome raspituje\u0161. Jesi li napravio nekakve planove?
  Ako jesi, ne trudi se da ovde ostane\u0161 kad to ne \u017eeli\u0161. Samo idi za
  onim \u0161to \u017eeli\u0161. Nemoj i\u0107i protiv sopstvenih \u017eelja i nemoj
  sebi da ote\u017eava\u0161 \u017eivot. Bo\u017eja ku\u0107a te ovde ne zadr\u017eava,
  nisi zarobljen na ovom mestu. Mo\u017ee\u0161 oti\u0107i kad god to po\u017eeli\u0161.
  Ne raspituj se sve vreme o najnovijim glasinama. U svim najnovijim glasinama bi\u0107e
  ti jedino re\u010deno: \u2019Uskoro!\u2019 Ako nisi zadovoljan takvim odgovorom,
  ako si u svom srcu ve\u0107 napravio planove i ako \u0107e\u0161 ih, pre ili kasnije,
  svejedno sprovesti, poslu\u0161aj moj savet: svoje knjige Bo\u017ejih re\u010di
  \u0161to pre vrati u crkvu, spakuj se i idi. Jednostavno \u0107emo se pozdraviti
  i zbog ovih stvari ti se vi\u0161e nikada ne\u0107e ponoviti ose\u0107anja uznemirenosti,
  strepnje ili zabrinutosti. Vrati se ku\u0107i i \u017eivi svoj \u017eivot. \u017delim
  ti sve najbolje! \u017delim ti \u017eivot ispunjen sre\u0107om i zadovoljstvom i
  nadam se da \u0107e\u0161 u svemu uspeti u budu\u0107nosti!\u201c \u0160ta mislite
  o tome? (Dobro je.) Posavetujte ih da napuste crkvu; ne poku\u0161avajte da ih zadr\u017eite.
  Za\u0161to da ne poku\u0161avate da ih zadr\u017eite? (Oni istinski ne veruju u
  Boga, pa ih nema svrhe ni zadr\u017eavati.) Tako je; oni su bezvernici! U \u010demu
  bi bila svrha zadr\u017eati bezvernike, a ne izbaciti ih? Neki ljudi ka\u017eu:
  \u201eAli oni nisu u\u010dinili nikakvo zlo i nisu ni\u0161ta prekinuli.\u201c Treba
  li i\u0161ta da prekinu? Recite Mi, zar ostanak nekog ovakvog u grupi ljudi sam
  po sebi ne predstavlja prekid? Kud god da ode, njegovo pona\u0161anje i postupci
  ve\u0107 predstavljaju prekid. Nikada ne sprovodi duhovnu posve\u0107enost, nikada
  ne \u010dita Bo\u017eje re\u010di, na skupovima se nikada ne moli niti sa drugima
  komunicira, samo mehani\u010dki obavlja du\u017enost, uvek se raspituju\u0107i koje
  su najnovije glasine. Izuzetno je emotivan i hirovit. Tako\u0111e je izuzetno usredsre\u0111en
  na jelo, pi\u0107e i li\u010dno u\u017eivanje, a ima i onih koji su lenji, koji
  se prepu\u0161taju jelu, koji se prepu\u0161taju spavanju, koji se glupiraju, koji
  su tu samo da popune broj u Bo\u017ejoj ku\u0107i. Oni ne brinu o obavljanju svoje
  du\u017enosti, ve\u0107 samo dokoli\u010dare. Kada do\u0111u u Bo\u017eju ku\u0107u,
  u njoj samo tra\u017ee pogodnosti i stvari koje \u0107e im li\u010dno koristiti.
  Ako ne\u0161to ne mogu da iskoriste, oti\u0107i \u0107e za tili \u010das. Budu\u0107i
  da \u0107e oti\u0107i za tili \u010das, zar nije bolje da odu odmah, a ne kasnije?
  Ovakvi ljudi ne mogu \u010dak ni da slu\u017ebuju do kraja, a njihovo slu\u017ebovanje
  ne daje dobre rezultate. Pa i kad slu\u017ebuju, ne rade prave stvari \u2013 naprosto
  su bezvernici. U svojoj veri u Boga, stvari posmatraju iz tre\u0107eg lica. Sre\u0107ni
  su kada Bo\u017eja ku\u0107a napreduje, razmi\u0161ljaju\u0107i da ima nade da budu
  blagosloveni, da su u prednosti, da njihova vera u Boga nije bila uzaludna, da nisu
  na gubitku i da su se kladili na pobedni\u010dku stranu. Me\u0111utim, ako je Bo\u017eja
  ku\u0107a ugnjetena od sotonskih sila, napu\u0161tena od dru\u0161tva, izlo\u017eena
  klevetama i progonima i u nezavidnoj situaciji, ne samo da ih to ne uznemirava,
  ve\u0107 se tome i smeju. Mo\u017eemo li u crkvi zadr\u017eati takve ljude? (Ne.)
  Oni su bezvernici i neprijatelji! Ako je neprijatelj u tvojim redovima, a ti se
  prema njemu odnosi\u0161 kao da ti je brat ili sestra, zar te to ne \u010dini glupim?
  Ako ovakvi ljudi nisu u stanju da dragovoljno slu\u017ebuju, u tom slu\u010daju
  ih treba izbaciti, zar ne? (Tako je.) Naravno da je tako. U\u010dinite to brzo i
  temeljno. Nema potrebe da ih savetujete, samo ih opu\u0161teno zamolite da odu.
  Nema potrebe da na njih tro\u0161ite re\u010di, treba samo da ih po\u0161aljete
  ku\u0107i. U su\u0161tini, to nisu ljudi kojima je mesto u Bo\u017ejoj ku\u0107i,
  ve\u0107 su samo bezvernici koji su se uvukli u crkvu. Naprosto treba da se vrate
  tamo odakle su do\u0161li i samo treba da ih zamolite da odu. Nakon \u0161to dospeju
  u crkvu, neki ljudi zaista naprave jasnu razliku izme\u0111u sebe i bra\u0107e i
  sestara i Bo\u017eje ku\u0107e. A to je stoga \u0161to ta\u010dno znaju \u0161ta
  su do\u0161li da urade, znaju da li zaista veruju ili ne i, osim njihovih nada o
  tome kada \u0107e se Bo\u017eje delo privesti kraju i da li \u0107e mo\u0107i da
  dobiju blagoslove, nikakvo delo Bo\u017eje ku\u0107e niti ikakva istina za koju
  Bog od ljudi zahteva da u nju u\u0111u nema ba\u0161 nikakve veze sa njima; ne obra\u0107aju
  pa\u017enju na ove stvari, ne \u010ditaju knjige Bo\u017ejih re\u010di koje im crkva
  \u0161alje da pro\u010ditaju, ve\u0107 ih ostavljaju da tako le\u017ee sasvim neraspakovane.
  Takvi ljudi samo na re\u010dima veruju u Boga; samo naizgled deluju kao da veruju
  onako kako to drugi \u010dine i mehani\u010dki obavljaju svoje du\u017enosti, ali
  nikada ne \u010ditaju Bo\u017eje re\u010di. Nijednom nisu otvorili knjigu Bo\u017ejih
  re\u010di, nisu okrenuli nijednu stranicu \u2013 nikada nisu pro\u010ditali nijedan
  njen deo. Nikada ne gledaju video priloge o iskustvenim svedo\u010denjima, filmove
  o jevan\u0111elju, kao ni himne i sli\u010dne stvari koje Bo\u017eja ku\u0107a postavlja
  na internetu. \u0160ta obi\u010dno gledaju? Gledaju vesti, popularne emisije, video
  priloge i komedije, gledaju\u0107i jedino ono \u0161to je besmisleno. Ko su ovi
  ljudi? Oni povremeno pose\u0107uju crkvu da bi se raspitali: \u201eU koliko zemalja
  se do sada pro\u0161irilo delo jevan\u0111elja? Koliko ljudi se okrenulo Bogu? U
  koliko zemalja su do sada osnovane crkve? Koliko ima crkava? U kojoj fazi je Bo\u017eje
  delo?\u201c U svoje slobodno vreme, uvek se raspituju o ovim stvarima. Zar ne postoji
  sumnja da je ova osoba \u0161pijun? Recite Mi, da li je u redu da se neko takav
  zadr\u017ei? (Nije.) Ako ve\u0107 svojom voljom ne napuste crkvu, \u010dim ih otkrijete,
  morate ih ukloniti i osloboditi crkvu takve po\u0161asti. Njihovo zadr\u017eavanje
  je besmisleno i samo \u0107e prouzrokovati nevolje. Dakle, stvari zbog kojih ovih
  ljudi ose\u0107aju uznemirenost, strepnju i zabrinutost nemaju sa nama ba\u0161
  nikakve veze. Nemojte se ni truditi da im dajete savete, a sa njima je beskorisno
  razgovarati o istini. Naprosto ih se re\u0161ite i stavite ta\u010dku na tu stvar
  \u2013 ovo je najbolji na\u010din da iza\u0111ete na kraj sa takvim ljudima.\\nOsim
  bezvernika, me\u0111u bra\u0107om i sestrama ima i starijih ljudi, starosti od 60
  pa sve do 80 ili 90 godina, koji se, zbog svoje pozne dobi, tako\u0111e suo\u010davaju
  sa odre\u0111enim te\u0161ko\u0107ama. Uprkos godinama, na\u010din njihovog razmi\u0161ljanja
  nije nu\u017eno tako ispravan niti racionalan, a njihove zamisli i gledi\u0161ta
  nisu nu\u017eno u skladu sa istinom. I ovi stariji ljudi podjednako imaju probleme
  i uvek brinu: \u201eZdravlje mi vi\u0161e nije tako dobro kao ranije i ne mogu ba\u0161
  svaku du\u017enost da obavljam. Budem li obavio ovu sitnu du\u017enost, ho\u0107e
  li me Bog upamtiti? Ponekad se razbolim, pa neko treba da brine o meni. Kada nema
  nikog da brine o meni, ne mogu da obavljam svoju du\u017enost i \u0161ta onda mogu
  da u\u010dinim? Star sam, ne pamtim Bo\u017eje re\u010di kad ih \u010ditam i te\u0161ko
  mi je da shvatim istinu. Kada u zajedni\u0161tvu razgovaram o istini, govorim zbrkano
  i nelogi\u010dno, i nemam iskustva koja vredi podeliti sa drugima. Star sam i nemam
  dovoljno energije, vid mi nije ba\u0161 najbolji i vi\u0161e nisam toliko jak. Sve
  mi pada te\u0161ko. Ne samo da ne mogu da obavljam svoju du\u017enost, ve\u0107
  stvari lako zaboravljam i radim ih pogre\u0161no. Ponekad se zbunim, pa crkvi i
  svojoj bra\u0107i i sestrama stvaram probleme. \u017delim da dobijem spasenje i
  da stremim ka istini, ali mi je to vrlo te\u0161ko. \u0160ta mogu da uradim?\u201c
  Kada razmi\u0161ljaju o ovim stvarima, uzrujavaju se pri pomisli: \u201eKako to
  da sam tek u ovim godinama po\u010deo da verujem u Boga? Za\u0161to nisam poput
  onih koji su u svojim dvadesetim ili tridesetim, ili makar poput onih koji su u
  petoj ili \u0161estoj deceniji \u017eivota? Kako to da sam na Bo\u017eje delo nai\u0161ao
  tek sada kada sam toliko star? Ne mo\u017ee se re\u0107i da imam lo\u0161u sudbinu;
  makar sam se sada susreo sa Bo\u017ejim delom. Moja sudbina je dobra i Bog je ljubazan
  prema meni! Samo zbog jedne stvari nisam sre\u0107an, a to je moja duboka starost.
  Pam\u0107enje mi nije najbolje, ba\u0161 kao ni zdravlje, ali imam nepokolebljivu
  unutra\u0161nju re\u0161enost. Stvar je u tome da me telo izdaje, pa postajem pospan
  dok slu\u0161am druge tokom okupljanja. Ponekad zatvorim o\u010di da se pomolim
  i onda zaspim, a misli mi odlutaju dok \u010ditam Bo\u017eje re\u010di. Nakon kra\u0107eg
  \u010ditanja postanem pospan i zadremam, a te re\u010di mi ne dopiru do mozga. \u0160ta
  mogu da u\u010dinim? Uz ove stvarne pote\u0161ko\u0107e, jesam li i dalje u stanju
  da stremim ka istini i da je shvatim? Ako nisam u stanju i ako ne mogu prakti\u010dno
  da postupam u skladu sa istina-na\u010delima, ne\u0107e li sva moja vera biti uzaludna?
  Zar ne\u0107u propustiti da postignem spasenje? \u0160ta mogu da u\u010dinim? Toliko
  sam zabrinut! U ovim godinama, vi\u0161e ni\u0161ta nije va\u017eno. Sada kada verujem
  u Boga, vi\u0161e nemam nikakvih briga, niti vi\u0161e i zbog \u010dega strepim.
  Deca su mi odrasla i o njima vi\u0161e ne moram da brinem niti da ih odgajam. Najve\u0107a
  \u017eelja u \u017eivotu mi je da stremim ka istini, da obavljam du\u017enost stvorenog
  bi\u0107a i da kona\u010dno dostignem spasenje u godinama koje su mi preostale.
  Ipak, imaju\u0107i u vidu u kakvom sam trenutno stanju \u2013 obnevideo od starosti,
  zbunjenog uma i lo\u0161eg zdravlja, nesposoban da dobro obavljam svoju du\u017enost,
  te ponekad stvaram probleme u poku\u0161aju da u\u010dinim najbolje \u0161to mogu
  \u2013 \u010dini mi se da dostizanje spasenja za mene ne\u0107e biti lak zadatak.\u201c
  O ovim stvarima iznova razmi\u0161ljaju, u njima narasta strepnja i zatim misle:
  \u201e\u010cini se da se dobre stvari doga\u0111aju samo mladim ljudima, a ne i
  starima. Ma kako stvari bile dobre, \u010dini mi se da ja u njima vi\u0161e ne\u0107u
  mo\u0107i da u\u017eivam.\u201c \u0160to vi\u0161e razmi\u0161ljaju o ovim stvarima,
  sve se vi\u0161e uzrujavaju i ose\u0107aju sve ve\u0107u strepnju. I ne samo da
  su zabrinuti za sebe, ve\u0107 ose\u0107aju i povre\u0111enost. Ako pla\u010du,
  ose\u0107aju da to zapravo nije vredno plakanja, a ako ne pla\u010du, ta bol, ta
  povre\u0111enost, njihov je stalni pratilac. \u0160ta bi, dakle, trebalo da u\u010dine?
  Konkretno, postoje neki stariji ljudi koji \u017eele da sve svoje vreme provode
  daju\u0107i se za Boga i u obavljanju svoje du\u017enosti, ali im fizi\u010dko stanje
  nije dobro. Neki imaju visok krvni pritisak, neki povi\u0161en \u0161e\u0107er u
  krvi, neki imaju probleme sa organima za varenje i njihova fizi\u010dka snaga ne
  mo\u017ee da ide u korak sa zahtevima njihove du\u017enosti, pa su stoga uzrujani.
  Posmatraju mlade ljude koji mogu da jedu i piju, da tr\u010de i ska\u010du, i prema
  njima ose\u0107aju zavist. I \u0161to vi\u0161e vi\u0111aju mlade ljude kako rade
  sve te stvari, ose\u0107aju se sve uznemirenije, razmi\u0161ljaju\u0107i: \u201e\u017delim
  da dobro obavljam svoju du\u017enost, da stremim ka istini i da je shvatim. \u017delim
  i da primenjujem istinu, pa za\u0161to je to tako te\u0161ko? Previ\u0161e sam star
  i beskoristan! Zar Bog ne \u017eeli ljude koji su stari? Jesu li stari ljudi zaista
  beskorisni? Zar mi ne mo\u017eemo da dostignemo spasenje?\u201c Ma koliko da razmi\u0161ljaju
  o tome, tu\u017eni su i ne mogu da se ose\u0107aju sre\u0107no. Ne \u017eele da
  propuste tako divno vreme i tako odli\u010dnu priliku, a ipak ne mogu da se, poput
  mladih ljudi, svim srcem i du\u0161om daju i da obavljaju svoju du\u017enost. Zbog
  svoje starosti, ovi stariji ljudi zapadaju u duboku uznemirenost, strepnju i zabrinutost.
  I svaki put kada nai\u0111u na neku pote\u0161ko\u0107u, smetnju, neda\u0107u ili
  prepreku, svaljuju krivicu na svoju starost, \u010dak preziru sebe i prema sebi
  nemaju nimalo simpatija. Svejedno, stvari ostaju bezuspe\u0161ne, nema re\u0161enja
  i za njih nema puta napred. Da li je mogu\u0107e da za njih zaista nema puta napred?
  Postoji li ikakvo re\u0161enje? (I stariji ljudi treba da obavljaju svoje du\u017enosti
  u skladu sa svojim mogu\u0107nostima.) Prihvatljivo je da stariji ljudi obavljaju
  svoje du\u017enosti u skladu sa svojim mogu\u0107nostima, zar ne? Je li mogu\u0107e
  da, zbog svojih godina, stariji ljudi vi\u0161e ne mogu da streme ka istini? Zar
  nisu u stanju da shvate istinu? (Jesu, u stanju su.) Mogu li stariji ljudi da shvate
  istinu? Shvataju je donekle, a \u010dak ni mladi ne mogu da je shvate u potpunosti.
  Stariji ljudi su uvek u zabludi kada smatraju da su smeteni, da im je pam\u0107enje
  lo\u0161e i da zbog toga ne mogu da shvate istinu. Jesu li u pravu? (Nisu.) Iako,
  u odnosu na starije, mladi ljudi imaju znatno vi\u0161e energije i fizi\u010dki
  su sna\u017eniji, zapravo je njihova sposobnost da shvate, razumeju i saznaju potpuno
  ista kao i kod starijih ljudi. Zar nisu i stariji ljudi nekada bili mladi? Nisu
  ro\u0111eni stari, a i svi mladi ljudi \u0107e jednoga dana ostariti. Stariji ljudi
  ne smeju stalno da misle da se po ne\u010demu razlikuju od mladih ljudi zato \u0161to
  su stari i fizi\u010dki slabi, zato \u0161to se ose\u0107aju lo\u0161e i pam\u0107enje
  ih izdaje. U stvari, me\u0111u njima nema nikakve razlike. Na \u0161ta mislim kada
  ka\u017eem da me\u0111u njima nema nikakve razlike? Nezavisno od toga da li je neko
  star ili mlad, njegova iskvarena narav je ista, njegovi stavovi i gledi\u0161ta
  o najrazli\u010ditijim stvarima su isti, ba\u0161 kao \u0161to su isti i njegovi
  uglovi posmatranja i stanovi\u0161ta o najrazli\u010ditijim stvarima. Prema tome,
  samo zato \u0161to su stari, zato \u0161to u odnosu na mlade imaju manje prekomernih
  \u017eelja i zato \u0161to mogu da budu postojani, stariji ljudi ne bi smeli da
  smatraju da nemaju nikakvih divljih ambicija ili \u017eelja, te da im je narav manje
  iskvarena \u2013 to je pogre\u0161no shvatanje. Mladi ljudi mogu svim silama da
  se bore za neku poziciju, pa zar to isto ne mogu i oni stariji? Mladi ljudi stvari
  mogu da obavljaju protivno na\u010delima i da postupaju proizvoljno, pa zar to isto
  ne mogu i oni stariji? (Da, mogu.) Mladi ljudi mogu da budu nadmeni, pa zar i oni
  stariji ne mogu to isto? Me\u0111utim, kada su stariji ljudi nadmeni, imaju\u0107i
  u vidu njihove poodmakle godine, oni u tome nisu toliko agresivni, pa to nije tako
  izra\u017eena nadmenost. Zbog svojih pokretljivih udova i uma, mladi ljudi znatno
  o\u010ditije ispoljavaju nadmenost, dok su oni stariji, zbog krutih udova i nefleksibilnog
  uma, manje o\u010digledni u ispoljavanju nadmenosti. Ipak, su\u0161tina njihove
  nadmenosti i njihova iskvarena narav ostaju isti. Ma koliko da neka starija osoba
  veruje u Boga, ili ma koliko godina da obavlja svoju du\u017enost, ako ne stremi
  ka istini, njena iskvarena narav \u0107e ostati. Na primer, neki stariji ljudi koji
  \u017eive sami navikli su da se oslanjaju na sebe i imaju svoje uspostavljene navike:
  imaju utvr\u0111ene periode i sopstveni raspored za jelo, spavanje i odmor, pa nisu
  voljni da remete redosled odvijanja tih stvari u \u017eivotu. Spolja posmatrano,
  stariji ljudi izgledaju kao divne osobe, ali ipak imaju iskvarene naravi, \u0161to
  \u0107ete i spoznati nakon du\u017eeg dru\u017eenja sa njima. Neki stariji ljudi
  su neverovatno hiroviti i nadmeni; moraju da jedu ba\u0161 ono \u0161to su naumili
  i ne daju se zaustaviti kada se negde zapute radi razonode. Kada ne\u0161to naume
  da u\u010dine, nema sile koja bi ih spre\u010dila u tome. Niko ne mo\u017ee da ih
  promeni i hiroviti su celoga svog \u017eivota. Takvi tvrdoglavi stariji ljudi problemati\u010dniji
  su \u010dak i od svojeglave mlade\u017ei! Prema tome, kada neki ljudi ka\u017eu:
  \u201eStariji ljudi nisu tako duboko iskvareni kao mladi. Stariji ljudi su \u017eiveli
  u vremenu koje je bilo znatno konzervativnije i puno ograni\u010denja, pa zato ova
  generacija starih ljudi nije toliko duboko iskvarena\u201c, da li u tim kazivanjima
  ima istine? (Nema.) Ona predstavlja njihovo vlastito gun\u0111anje u sopstvenu korist.
  Mladim ljudima se ne dopada da rade sa drugima, pa zar i oni stariji ne mogu biti
  isti takvi? (Mogu.) Neki stariji ljudi imaju iskvarene naravi koje su te\u017ee
  nego kod mladih, uvek se razme\u0107u svojim poodmaklim godinama i ponosni su na
  svoje veteransko iskustvo, uz re\u010di: \u201eJa sam u poznim godinama. Koliko
  godina ti ima\u0161? Ko je od nas dvojice stariji? Ne\u0107e ti se dopasti da ovo
  \u010duje\u0161, ali sam u ovom kraju bio \u010de\u0161\u0107e nego \u0161to ti
  mo\u017ee\u0161 i da zamisli\u0161, pa zato mora\u0161 da me slu\u0161a\u0161. Iskusan
  sam i obrazovan. \u0160ta ti, \u017eutokljunac, razume\u0161? U Boga sam verovao
  i pre nego \u0161to si se ti rodio!\u201c Nije li ovo jo\u0161 problemati\u010dnije?
  (Jeste.) Jednom kada steknu titulu \u201estarijih\u201c, stariji ljudi mogu biti
  znatno problemati\u010dniji. Dakle, nije re\u010d o tome da stariji ljudi nemaju
  \u0161ta da rade, niti da nisu u stanju da obavljaju svoje du\u017enosti, a jo\u0161
  je manje slu\u010daj da nisu u stanju da streme ka istini \u2013 postoje mnoge stvari
  koje oni mogu da rade. Razli\u010dite jeresi i zablude koje su se nakupile tokom
  tvog \u017eivota, kao i razli\u010dite tradicionalne ideje i predstave, neukost
  i tvrdoglavost, konzervativne stvari, nerazumne i izobli\u010dene stvari koje si
  skupljao, sve su se nagomilale u tvom srcu i trebalo bi, u odnosu na mlade ljude,
  jo\u0161 i vi\u0161e vremena da provodi\u0161 u njihovom kopanju, ra\u0161\u010dlanjivanju
  i prepoznavanju. Nije re\u010d o tome da ti nema\u0161 \u0161ta da radi\u0161 niti
  o tome da treba da ose\u0107a\u0161 uznemirenost, strepnju i zabrinutost kada ne
  zna\u0161 \u0161ta \u0107e\u0161 sa sobom \u2013 to nije tvoj zadatak, a ni tvoja
  odgovornost. Stariji ljudi, pre svega, treba da imaju ispravan na\u010din razmi\u0161ljanja.
  Iako ste mo\u017eda ve\u0107 u godinama i fizi\u010dki ste relativno stari, i dalje
  bi trebalo da imate mladala\u010dki na\u010din razmi\u0161ljanja. Iako stari\u0161,
  razmi\u0161ljanje ti se usporava, a pam\u0107enje biva lo\u0161e, ako i dalje mo\u017ee\u0161
  da spozna\u0161 sebe, ako jo\u0161 uvek mo\u017ee\u0161 da shvati\u0161 re\u010di
  koje govorim i jo\u0161 uvek mo\u017ee\u0161 da shvati\u0161 istinu, to dokazuje
  da nisi star i da ti kov nije manjkav. Ako je neko u osmoj deceniji \u017eivota,
  a ne mo\u017ee da shvati istinu, onda to pokazuje da je premali rastom i da nije
  dorastao zadatku. Prema tome, godine \u017eivota su nebitne kada je re\u010d o istini
  i, povrh toga, \u017eivotna dob je nebitna kada je re\u010d o iskvarenoj naravi.
  Sotona postoji ve\u0107 desetinama hiljada godina, stotinama miliona godina, pa
  je i dalje Sotona, a ipak pre re\u010di \u201eSotona\u201c moramo, svejedno, dodati
  pridev tako da dobijemo \u201estarog Sotonu\u201c, u zna\u010denju da je on zlo
  n-tog stepena, zar ne? (Da.) Dakle, kako bi stariji ljudi trebalo prakti\u010dno
  da postupaju? Jedan aspekt je u tome da treba da ima\u0161 isti na\u010din razmi\u0161ljanja
  kao i mladi ljudi, da stremi\u0161 ka istini i spozna\u0161 sebe, a kad spozna\u0161
  sebe, trebalo bi da se pokaje\u0161. Drugi aspekt je u tome da treba da tra\u017ei\u0161
  na\u010dela u obavljanju svoje du\u017enosti i da prakti\u010dno postupa\u0161 u
  skladu sa istina-na\u010delima. Kad je re\u010d o stremljenju ka istini, sebe ne
  treba da otpisuje\u0161 tvrde\u0107i da si star, da si u poodmaklim godinama, da
  nema\u0161 aktivne misli kakve imaju mladi ljudi, da nema\u0161 iskvarenu narav
  kakvu imaju mladi ljudi, da si iskusio sve u ovom \u017eivotu, da si stekao uvid
  u sve, te da stoga nema\u0161 divlje ambicije ni \u017eelje. Ono \u0161to zapravo
  misli\u0161 kada to ka\u017ee\u0161 glasi: \u201eMoja narav nije u toj meri iskvarena,
  pa je stoga stremljenje ka istini predvi\u0111eno za vas mlade ljude. Ono nema nikakve
  veze sa nama starima. U Bo\u017ejoj ku\u0107i, mi stari radimo samo ono \u0161to
  mo\u017eemo i ula\u017eemo onaj napor koji mo\u017eemo, pa \u0107emo svoju du\u017enost
  time obaviti kako treba i bi\u0107emo spaseni. A kada je re\u010d o tome da Bog
  otkriva ljudske iskvarene naravi, naravi antihrista i su\u0161tinu antihrista, to
  je ono \u0161to vi mladi treba da razumete. Vi to mo\u017eete pa\u017eljivo da slu\u0161ate,
  a bi\u0107e dovoljno da vas mi lepo ugostimo i da motrimo na okolinu kako biste
  bili bezbedni. Mi stariji nemamo divlje ambicije. Starimo, mozak nam sporo reaguje
  i zato su sve na\u0161e reakcije pozitivne. Pre nego \u0161to umremo, postajemo
  dobrodu\u0161ni. Kad ostare, ljudi nau\u010de da se lepo pona\u0161aju, tako da
  smo mi lepo vaspitani ljudi.\u201c Ovim zapravo ho\u0107e da ka\u017eu kako nemaju
  iskvarenu narav. Jesmo li ikada rekli da stariji ljudi ne moraju da streme ka istini
  ili da se stremljenje ka istini razlikuje u zavisnosti od va\u0161e \u017eivotne
  dobi? Jesmo li to ikada pomenuli? Ne, nismo. U Bo\u017ejoj ku\u0107i i kada je u
  pitanju istina, da li stariji ljudi \u010dine neku posebnu grupu? Ne, ne \u010dine
  je. Kada je u pitanju stremljenje ka istini, godine starosti su nebitne, ba\u0161
  kao i u slu\u010daju va\u0161e iskvarene naravi, dubine va\u0161e iskvarenosti,
  \u010dinjenice da li ste podobni da stremite ka istini, da li mo\u017eete posti\u0107i
  spasenje, kao i verovatno\u0107e da \u0107ete biti spaseni. Zar nije tako? (Tako
  je.) Tolike godine u zajedni\u0161tvu razgovaramo o istini, ali nikada nismo razgovarali
  o razli\u010ditim vrstama istine shodno razli\u010ditoj \u017eivotnoj dobi ljudi.
  O istini nikada nismo razgovarali niti smo iskvarenu narav otkrivali isklju\u010divo
  iz ugla mladih ili starijih ljudi, niti je ikada bilo re\u010di o tome da se, zbog
  njihove starosti, krutog razmi\u0161ljanja i nesposobnosti da prihvataju nove stvari,
  iskvarena narav starijih ljudi prirodno smanjuje i menja \u2013 takve stvari nikada
  nisu bile re\u010dene. U zajedni\u0161tvu nismo razgovarali ni o jednoj istini specifi\u010dnoj
  za odre\u0111enu \u017eivotnu dob niti smo izostavljali starije ljude. Stariji ljudi
  ne predstavljaju posebnu grupu u crkvi, u Bo\u017ejoj ku\u0107i, kao ni pred Bogom,
  ve\u0107 su isti kao i svaka druga starosna grupa. U vezi sa njima nema ni\u010deg
  posebnog, ve\u0107 je re\u010d samo o tome da su pro\u017eiveli ne\u0161to du\u017ee
  od ostalih, da su u ovaj svet stigli koju godinu ranije nego drugi, da u kosi imaju
  ne\u0161to vi\u0161e sedih nego drugi i da im je telo ostarilo ne\u0161to ranije
  nego drugima; osim toga, nema nikakve druge razlike. Pa tako, ako stariji ljudi
  uvek razmi\u0161ljaju: \u201eStar sam, a to, dakle, zna\u010di da sam lepo vaspitana
  osoba, da nemam iskvarenu narav i da sam tek pomalo iskvaren\u201c, zar to onda
  nije pogre\u0161no shvatanje? (Jeste.) Nije li to malo besramno? Neki stariji ljudi
  su prevejani stari lisci, podmukli do n-tog stepena. Ka\u017eu da nemaju iskvarenu
  narav, ka\u017eu \u010dak i da je njihova iskvarena narav sasvim i\u0161\u010dezla,
  dok u stvari izlivi njihove iskvarene naravi nisu ni\u0161ta manji nego kod drugih
  ljudi. U stvarnosti, postoje brojni na\u010dini na koje mo\u017eemo da opi\u0161emo
  iskvarenu narav i kvalitet ljudskosti ove vrste starijih ljudi. Na primer, u oba
  izraza \u201eprevejani stari lisci\u201c i \u201estaro je vino najukusnije \u2013
  mladost gubi bitku pred iskustvom\u201c \u2013 koristi se re\u010d \u201estar\u201c,
  zar ne? (Tako je.) U kojim se jo\u0161 opisima koristi re\u010d \u201estar\u201c?
  (Stare varalice.) Da, taj opis je dobar, \u201estare varalice\u201c. Vidi\u0161,
  u svima njima se koristi re\u010d \u201estar\u201c. A tu su i \u201estari Sotona\u201c
  i \u201estari \u0111avoli\u201c \u2013 oli\u010denja vreme\u0161nog stare\u0161ine!
  U \u0161ta veruju oni ljudi koji se ubrajaju u starije? Oni ovako veruju: \u201eSva
  na\u0161a iskvarena narav je i\u0161\u010dezla. Pitanje iskvarene naravi se odnosi
  na vas mlade ljude. Mnogo ste iskvareniji od nas.\u201c Nije li ovo namerno iskrivljivanje
  stvari? \u017deleli bi da sebe predstave u najboljem svetlu i da sebi odaju priznanje,
  dok to zapravo nije slu\u010daj i stvari uop\u0161te ne stoje tako. \u201eStari
  \u0111avoli\u201c, \u201estari Sotona\u201c, \u201estare varalice\u201c, \u201eprevejani
  stari lisci\u201c i \u201erazmetanje svojim poznim godinama\u201c \u2013 svi ovi
  opisi u kojima se koristi re\u010d \u201estar\u201c ne predstavljaju dobre i pozitivne
  stvari.\\nSada o ovome razgovaramo kako bismo starije ljude upozorili, posavetovali
  ih i usmerili, i kako bismo mlade ljude preventivno vakcinisali. Pominjanje ovih
  stvari prevashodno je usmereno na re\u0161avanje kog ta\u010dno problema? Da bi
  se re\u0161ili uznemirenost, strepnja i zabrinutost ovih starijih ljudi, te da bismo
  se pobrinuli da oni shvate da su ova uznemirenost, strepnja i zabrinutost izli\u0161ni
  i nepotrebni. Ako \u017eeli\u0161 da obavlja\u0161 du\u017enost i podoban si za
  obavljanje du\u017enosti, ho\u0107e li te Bo\u017eja ku\u0107a odbiti? (Ne\u0107e.)
  Bo\u017eja ku\u0107a \u0107e ti, svakako, pru\u017eiti priliku da obavlja\u0161
  du\u017enost. Sasvim sigurno ne\u0107e re\u0107i: \u201eZbog svoje starosti ne mo\u017ee\u0161
  da obavlja\u0161 du\u017enost. Odlazi. Ne\u0107emo ti pru\u017eiti priliku.\u201c
  Ne, Bo\u017eja ku\u0107a se prema svim ljudima pravi\u010dno odnosi. Pod uslovom
  da si podoban za obavljanje du\u017enosti i da nema nikakve skrivene opasnosti,
  Bo\u017eja ku\u0107a \u0107e ti pru\u017eiti priliku i omogu\u0107i\u0107e ti da
  obavlja\u0161 du\u017enost u meri u kojoj to mo\u017ee\u0161. \u0160tavi\u0161e,
  ako \u017eeli\u0161 da spozna\u0161 sebe i da stremi\u0161 ka istini, ho\u0107e
  li ti se iko rugati i re\u0107i: \u201eDa li je tako stara osoba poput tebe podobna
  da stremi ka istini?\u201c Ho\u0107e li ti se iko rugati? (Ne\u0107e.) Ho\u0107e
  li iko re\u0107i: \u201eStar si i zbunjen. U \u010demu je svrha da ti stremi\u0161
  ka istini? Bog ne\u0107e spasti nekoga tako starog kao \u0161to si ti\u201c? (Ne\u0107e.)
  Ne, ne\u0107e to re\u0107i. Pred istinom su svi jednaki i prema svima se postupa
  pravi\u010dno. Radi se samo o tome da mo\u017eda ne\u0107e\u0161 stremiti ka istini,
