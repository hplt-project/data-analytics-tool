  izda\u0161ne nagrade, ste\u0107i istinu i biti u stanju da spozna\u0161 Boga i da
  Mu se pokori\u0161 \u2013 a ti \u0107e\u0161 zbog svega toga biti savr\u0161eno
  sre\u0107an.\\n8. januar 2022. godine\"", "\"Predsednik KK Crvena zvezda Neboj\u0161a
  \u010covi\u0107 ponovo je bio prisutan na konferenciji za medije koja je bila posve\u0107ena
