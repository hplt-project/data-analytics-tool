  20. juna da pri\u010damo. Na osnovu jasnih papira i sporazuma koji su potpisani
  jer Crvena zvezda, a isto i Partizan, nisu klubovi bez tradicije.\\nMi sada koji
  smo u Crvenoj zvedi smo epizode. Za godinu, dve, mesec dana, tri meseca do\u0107i
