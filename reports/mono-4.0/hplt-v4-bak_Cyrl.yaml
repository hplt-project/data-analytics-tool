  \u201c\u042d\u0442 \u04e9\u0440\u04e9\u043f \u0442\u043e\u0440\u043e\u0440, \u043a\u0430\u0440\u0443\u0430\u043d
  \u0439\u04e9\u0440\u04e9\u043f \u0442\u043e\u0440\u043e\u0440\u201d, \u0442\u0438\u0433\u04d9\u043d\u0435\u043d
