  \u0438\u0442\u043c\u04d9\u0439\u0435\u043c. \u04a0\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u044b\u0431\u044b\u0499\u0499\u044b\u04a3
  \u043d\u044b\u04a1\u043b\u044b, \u044b\u0441\u044b\u043d \u0445\u0430\u043b\u044b\u04a1\u0441\u0430\u043d
  \u043d\u0438\u0433\u0435\u0499\u0435\u043d \u0442\u04e9\u0499\u04e9\u04af \u2013
