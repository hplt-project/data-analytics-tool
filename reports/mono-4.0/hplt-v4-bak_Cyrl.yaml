  \u04d9 \u0431\u0435\u0499\u0433\u04d9 \u043a\u04af\u043d\u0435\u0433\u0435\u043b\u0433\u04d9\u043d,
  \u04a1\u0430\u043b\u044b\u043f\u043b\u0430\u0448\u04a1\u0430\u043d \u044d\u0448
  \u0444\u043e\u0440\u043c\u0430\u043b\u0430\u0440\u044b \u044f\u04a1\u044b\u043d\u044b\u0440\u0430\u04a1,
  \u0448\u0443\u043d\u044b\u04a3 \u04e9\u0441\u04e9\u043d \u04af\u0499\u0435\u0431\u0435\u0499
