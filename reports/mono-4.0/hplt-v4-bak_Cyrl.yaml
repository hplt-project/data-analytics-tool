  \u0438\u0442\u0435\u043b\u0433\u04d9\u043d \u0445\u04d9\u043b-\u0442\u043e\u0440\u043e\u0448\u043e\u0431\u043e\u0499
  \u0445\u0430\u04a1\u044b\u043d\u0434\u0430 \u0443\u0439\u043b\u0430\u043d\u044b\u0443\u0499\u0430\u0440
  \u0431\u0430\u0448\u04a1\u043e\u0440\u0442\u0442\u0430\u0440 \u0439\u04d9\u0448\u04d9\u0433\u04d9\u043d
  \u04bb\u04d9\u0440 \u0442\u04e9\u0431\u04d9\u043a\u0442\u04d9, \u0431\u04d9\u043b\u04d9\u043a\u04d9\u0439
  \u0430\u0443\u044b\u043b\u0434\u0430\u0440\u0499\u044b \u043b\u0430 \u0441\u0438\u0442\u0442\u04d9
  \u04a1\u0430\u043b\u0434\u044b\u0440\u043c\u0430\u0439\u044b\u043d\u0441\u0430,
  \u04a0\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u0499\u044b\u04a3 \u0443\u0440\u044b\u043d\u0434\u0430\u0440\u0499\u0430\u0493\u044b
  \u0431\u0435\u0440\u0435\u043d\u0441\u0435\u043b \u043e\u0439\u043e\u0448\u043c\u0430-\u044f\u0447\u0435\u0439\u043a\u0430\u043b\u0430\u0440\u044b\u043d
  \u043e\u0439\u043e\u0448\u0442\u043e\u0440\u043e\u0443\u0499\u044b \u04e9\u043b\u0433\u04e9\u0440\u04e9\u043f
  \u0435\u0442\u043a\u04d9\u043d \u043c\u04d9\u0441\u044c\u04d9\u043b\u04d9 \u0438\u0442\u0435\u043f
  \u0438\u04ab\u04d9\u043f\u043b\u04d9\u0440\u0433\u04d9 \u0435\u0440\u043b\u0435\u043a
  \u0431\u0438\u0440\u04d9 (\u0431\u044b\u043b \u044f\u0447\u0435\u0439\u043a\u0430\u043b\u0430\u0440\u0499\u044b
  \u201c\u04a1\u043e\u0440\u201d \u0442\u0438\u043f \u043d\u0430\u0440\u044b\u04a1\u043b\u0430\u043f
  \u0442\u0430 \u0431\u0443\u043b\u044b\u0440 \u0438\u043d\u0435). \u04ba\u04d9\u043c
  \u0431\u044b\u043d\u044b \u044f\u04a1\u044b\u043d \u043a\u0438\u043b\u04d9\u0441\u04d9\u043a\u0442\u04d9
  \u0445\u04d9\u043b \u0438\u0442\u0435\u043f \u0431\u0443\u043b\u0430 \u0442\u043e\u0440\u0493\u0430\u043d
  \u0493\u04d9\u043c\u04d9\u043b \u0438\u0442\u0435\u043f \u04a1\u0430\u0440\u0430\u0440\u0493\u0430
  \u043a\u04d9\u0440\u04d9\u043a: \u0445\u0430\u0442\u0442\u0430 \u0438\u04a3 \u0431\u04d9\u043b\u04d9\u043a\u04d9\u0439
  \u0431\u0430\u0448\u04a1\u043e\u0440\u0442 \u0430\u0443\u044b\u043b\u0434\u0430\u0440\u044b\u043d\u0434\u0430
  \u043b\u0430 \u0442\u044b\u0443\u0493\u0430\u043d \u0442\u04e9\u0439\u04d9\u0433\u0435\u043d\u0435\u04a3
  \u044f\u0499\u043c\u044b\u0448\u044b \u04e9\u0441\u04e9\u043d \u044f\u043d\u044b\u043f-\u043a\u04e9\u0439\u04e9\u043f
  \u0439\u04d9\u0448\u04d9\u04af\u0441\u0435 \u04d9\u04af\u0499\u0435\u043c \u043c\u0438\u043b\u043b\u04d9\u0442\u0442\u04d9\u0448\u0442\u04d9\u0440\u0435\u0431\u0435\u0499
  \u0431\u0430\u0440 \u0431\u0438\u0442! \u0418\u04a3 \u043a\u04d9\u043c\u0435\u043d\u0434\u04d9
  \u04e9\u0441 \u04d9\u04af\u0499\u0435\u043c \u0448\u04d9\u0445\u0435\u0441 \u0442\u0430\u0431\u044b\u043b\u0493\u0430\u043d\u0434\u0430
  \u043b\u0430 \u0430\u0443\u044b\u043b \u04a1\u043e\u0440\u043e\u043d \u2013 \u0440\u0430\u0439\u043e\u043d
  \u0431\u0430\u0448\u04a1\u043e\u0440\u0442\u0442\u0430\u0440\u044b \u04a1\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u044b\u043d\u044b\u04a3
  \u0431\u0435\u0440\u0435\u043d\u0441\u0435\u043b \u044f\u0447\u0435\u0439\u043a\u0430\u04bb\u044b\u043d
  \u0442\u04e9\u0499\u04e9\u043f \u0431\u0443\u043b\u0430. \u04ba\u04d9\u0440 \u0430\u0443\u044b\u043b,
  \u04a1\u0430\u0441\u0430\u0431\u0430 (\u04a1\u0430\u043b\u0430\u043b\u0430\u0440\u0499\u0430
  \u2013 \u043c\u0438\u043a\u0440\u043e\u0440\u0430\u0439\u043e\u043d) \u04a1\u043e\u0440\u043e\u043d\u043e\u04a3
  \u0435\u0442\u04d9\u043a\u0441\u0435\u04bb\u0435\u043d \u2013 \u04a1\u043e\u0440
  \u0431\u0430\u0448\u044b\u043d \u04d9\u04af\u0499\u0435\u043c \u0448\u04d9\u0445\u0435\u0441\u0442\u04d9\u0440\u0435\u0431\u0435\u0499
  \u04af\u0499\u0499\u04d9\u0440\u0435\u043d\u0435\u04a3 \u043e\u0439\u043e\u0448\u0442\u043e\u0440\u043e\u0443
  \u0439\u044b\u0439\u044b\u043d\u044b\u043d\u0434\u0430 \u04bb\u0430\u0439\u043b\u0430\u043f
  \u04a1\u0443\u0439\u0493\u0430\u043d \u0445\u04d9\u043b\u0434\u04d9, \u043e\u0448\u043e
  \u0435\u0442\u04d9\u043a\u0441\u0435\u043b\u04d9\u0440 \u0440\u0430\u0439\u043e\u043d
  (\u04a1\u0430\u043b\u0430) \u04a1\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u0499\u0430\u0440\u044b\u043d\u044b\u04a3
  \u0438\u04a3 \u044b\u0448\u0430\u043d\u044b\u0441\u043b\u044b \u04bb\u04d9\u043c
  \u0431\u0443\u043b\u0434\u044b\u04a1\u043b\u044b \u044d\u0442\u04d9\u0440\u0433\u0435\u0441
  \u043a\u04e9\u0441\u04e9\u043d \u0442\u04d9\u0448\u043a\u0438\u043b \u0438\u0442\u04d9\u0441\u04d9\u043a.\\n\u042e\u0493\u0430\u0440\u044b\u043b\u0430
  \u044f\u04a3\u0493\u044b\u0440\u0430\u0493\u0430\u043d \u0444\u0435\u043a\u0435\u0440\u0499\u0435
  \u043b\u043e\u0433\u0438\u043a \u0440\u04d9\u04af\u0435\u0448\u0442\u04d9 \u0434\u0430\u0443\u0430\u043c
  \u0438\u0442\u04bb\u04d9\u043a, \u0443\u0440\u044b\u043d\u0434\u0430\u0440\u0499\u0430\u0493\u044b
  \u04a1\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u0499\u0430\u0440\u0499\u0430 \u0430\u0493\u0437\u0430\u043b\u044b\u04a1
  \u0438\u043d\u0441\u0442\u0438\u0442\u0443\u0442\u044b\u043d \u0438\u043d\u0434\u0435\u0440\u0435\u04af
  \u0499\u04d9 \u043a\u04af\u0499\u0430\u043b\u043b\u0430\u043d\u0430. \u0411\u04d9\u043d
  \u0444\u04d9\u04a1\u0438\u0440\u0435\u0433\u0435\u0499 \u201c\u0411\u04e9\u0442\u04d9
  \u0434\u043e\u043d\u044a\u044f \u0431\u0430\u0448\u04a1\u043e\u0440\u0442\u0442\u0430\u0440\u044b
  \u04a1\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u044b\u043d\u044b\u04a3 \u0442\u04e9\u0431\u04d9\u043a
  (\u0443\u0440\u044b\u043d\u0434\u0430\u0440\u0499\u0430\u0493\u044b) \u043e\u0439\u043e\u0448\u043c\u0430\u043b\u0430\u0440\u044b\u043d\u0434\u0430
  \u0430\u0493\u0437\u0430\u043b\u044b\u04a1 \u0442\u0443\u0440\u0430\u04bb\u044b\u043d\u0434\u0430
