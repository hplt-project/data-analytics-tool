  \u04d9\u0499\u0435\u0440\u043b\u04d9\u043f, \u0411\u0430\u0448\u04a1\u0430\u0440\u043c\u0430
  \u043a\u043e\u043c\u0438\u0442\u0435\u0442 \u04a1\u0430\u0440\u0430\u043c\u0430\u0493\u044b\u043d\u0430
  \u0442\u0430\u043f\u0448\u044b\u0440\u0493\u0430\u0439\u043d\u044b, \u0443\u043b
  \u04d9\u043b\u0435\u0433\u04d9 \u0435\u043d\u0442\u0435\u043a\u043b\u0435 \u0442\u0438\u043a\u0448\u0435\u0440\u0435\u04af
