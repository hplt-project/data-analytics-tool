  \u0443\u043b \u0431\u0438\u043b\u0434\u04d9\u043b\u0435 \u0431\u0435\u0440 \u0442\u04d9\u0440\u0442\u0438\u043f,
  \u0434\u0438\u0441\u0446\u0438\u043f\u043b\u0438\u043d\u0430, \u04a1\u0430\u043d\u0443\u043d\u0434\u0430\u0440\u0493\u0430
  \u04bb\u04d9\u043c \u04a1\u0430\u0493\u0438\u0499\u04d9\u043b\u04d9\u0440\u0433\u04d9
