  \u0442\u043e\u0439\u0493\u043e\u04bb\u043e \u043c\u0435\u043d\u04d9\u043d \u0431\u0435\u0440
  \u0440\u04d9\u0442\u0442\u04d9\u043d, \u0430\u0439\u044b\u0440\u044b\u043c \u0448\u04d9\u0445\u0435\u0441\u0442\u04d9\u0440\u0499\u0435\u04a3
  \u0431\u0435\u0440\u0433\u04d9 \u043e\u0439\u043e\u0448\u04a1\u0430\u043d \u201c\u041c\u0438\u043d\u201d\u0434\u04d9\u0440\u0435\u043d\u04d9\u043d
  \u044e\u0493\u0430\u0440\u044b\u0440\u0430\u04a1 \u04af\u04ab\u0435\u0448\u043a\u04d9\u043d
  \u201c\u0411\u0435\u0499\u201d \u0444\u0435\u043d\u043e\u043c\u0435\u043d\u044b\u043d
  \u0431\u0430\u0440 \u0438\u0442\u04d9. \u04a0\u043e\u0440\u043e\u043b\u0442\u0430\u0439\u0499\u044b\u04a3
  \u0431\u0435\u0440\u0435\u043d\u0441\u0435\u043b \u044f\u0447\u0435\u0439\u043a\u0430\u043b\u0430\u0440\u044b\u043d
  \u04bb\u04d9\u043c \u0443\u043b\u0430\u0440\u0493\u0430 \u0430\u0493\u0437\u0430
