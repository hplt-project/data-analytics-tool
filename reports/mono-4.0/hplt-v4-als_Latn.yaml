  kanabisin n\u00eb YouTube\\n- N\u00eb kin\u00eb 8.500 f\u00ebmij\u00eb jan\u00eb
  em\u00ebruar me emrin olimpiad\u00eb\\n- Disa kuriozitete per gjumin\\n- 30 vitet
  q\u00eb ndryshuan gjith\u00e7ka\\n- Frika nga shqiptar\u00ebt, Bisha p\u00ebrfundon
  n\u00eb burgun e femrave\\n- Ish-minatorit bllokohet profili pasi ishte lidhur me
  300 gra\\n- 50 kuriozitetet me te rralla ne bote\\n- 10 kuriozitete rreth trurit\\n-
  Legjenda e Syrit t\u00eb Kalt\u00ebr\\n- Si plaket njeriu????\\n0 comments:\\nPost
  a Comment\"", "\"Fushatat zgjedhore nuk duhet t\u00eb paguhen nga parat\u00eb e
  shtetit pasi kjo \u00ebsht\u00eb nj\u00eb tjet\u00ebr m\u00ebnyr\u00eb korrupsioni
  i mediave, tani me para shtet\u00ebrore. Me ndryshimet e b\u00ebra mediat q\u00eb
  duan t\u00eb ndjekin zgjedhjet duhet t\u00eb paraqiten vet\u00eb n\u00eb KShZ dhe
  t\u00eb regjistrohen n\u00eb regjist\u00ebr, por ekzistojn\u00eb nj\u00eb s\u00ebr\u00eb
  paqart\u00ebsish se si vendos vet\u00eb KSHZ-ja kush mund t\u00eb hyj\u00eb n\u00eb
  at\u00eb regjist\u00ebr dhe kush jo, pa t\u00eb cilin regjistrim mediat nuk kan\u00eb
  t\u00eb drejt\u00eb t\u00eb marrin fonde nga buxheti shtet\u00ebror gjat\u00eb fushatave
  zgjedhore, thon\u00eb p\u00ebrfaq\u00ebsues t\u00eb institucioneve mediale, transmeton
  Portalb.mk.\\nKjo \u00e7\u00ebshtje q\u00ebndron edhe si rekomandim n\u00eb hulumtimin
  \u201cSistemi zgjedhor \u2013 burim serioz i krizave n\u00eb Maqedoni\u201d t\u00eb
  realizuar nga Fondacioni Metamorphosis, sipas t\u00eb cilit rekomandohet: \u201c
  Rregullim i korniz\u00ebs ligjore p\u00ebr angazhimin e mediave gjat\u00eb zgjedhjeve,
  shkurtim i koh\u00ebs p\u00ebr fushata t\u00eb paguara politike dhe nj\u00eb vler\u00ebsim
  t\u00eb ri p\u00ebrmes debatit publik n\u00eb lidhje me p\u00ebrdorimin e parave
  publike n\u00eb media\u201d.\\nZoran Traj\u00e7evski nga \u201cAgjencia p\u00ebr
  sh\u00ebrbime mediatike audio dhe audiovizuele\u201d, e cila \u00ebsht\u00eb edhe
  p\u00ebrgjegj\u00ebse p\u00ebr ndjekjen e mediave gjat\u00eb zgjedhjeve thekson
  se askund n\u00eb bot\u00eb nuk ndodh q\u00eb fushatat zgjedhore t\u00eb financohen
  nga parat\u00eb e shtetit dhe se kjo paraqet korrupsion.\\n\u201cPagimi i parave
  nga buxheti p\u00ebr mediumet paraqet korrupsion zgjedhor serioz. K\u00ebt\u00eb
  nuk e kemi n\u00eb asnj\u00eb vend n\u00eb bot\u00eb. E kemi dor\u00ebzuar disa
  her\u00eb n\u00eb form\u00eb t\u00eb shkruar q\u00ebndrimin ton\u00eb zyrtar se
  kjo paraqet korrupsion serioz, dhe tani para nj\u00eb jave, s\u00ebrish n\u00eb
  form\u00eb t\u00eb shkruar \u00ebsht\u00eb dor\u00ebzuar n\u00eb Ministrin\u00eb
  e Drejt\u00ebsis\u00eb, si q\u00ebndrim zyrtar. Nuk pajtohemi ne me at\u00eb q\u00eb
  tani duan ta rrisin koh\u00ebn p\u00ebr reklamat dhe as q\u00eb fushatat t\u00eb
  paguhen nga parat\u00eb e buxhetit. Fushatat duhet t\u2019i paguajn\u00eb vet\u00eb
  partit\u00eb politike\u201d, thekson Traj\u00e7evski.\\nTeofil Blazhevski nga \u201cFondacioni
  Metamorphosis\u201d thot\u00eb se pa marr\u00eb parasysh se me ndryshimet q\u00eb
  jan\u00eb b\u00ebr\u00eb n\u00eb Kodin Zgjedhor jan\u00eb v\u00ebn\u00eb shum\u00eb
  detaje p\u00ebr m\u00ebnyr\u00ebn se si do t\u00eb funksionoj\u00eb kjo reklam\u00eb
  e paguar politike, p\u00ebr t\u00eb siguruar q\u00eb t\u00eb gjith\u00eb pjes\u00ebmarr\u00ebsit
  t\u00eb jen\u00eb t\u00eb barabart\u00eb, ka ndodhur nj\u00eb korrupsion i ri i
  mediave me para shtet\u00ebrore.\\n\u201cSasi t\u00eb m\u00ebdha t\u00eb miliona
  eurove po transferohen \u00e7do vit n\u00eb televizione, gazeta dhe tani portale
  n\u00eb internet. Jo vet\u00ebm kaq, por ekzistojn\u00eb nj\u00eb s\u00ebr\u00eb
  paqart\u00ebsish se si vendos vet\u00eb KSHZ-ja kush mund t\u00eb hyj\u00eb n\u00eb
  at\u00eb regjist\u00ebr dhe kush jo, pa t\u00eb cilin nuk keni t\u00eb drejt\u00eb
  t\u00eb merrni fonde nga Buxheti gjat\u00eb fushatave zgjedhore\u201d, thekson Blazhevski.\\nFinancimi
  i fushatave me para shtet\u00ebrore mund t\u00eb ket\u00eb ndikim dhe t\u00eb nd\u00ebrhyj\u00eb
  edhe n\u00eb politik\u00ebn editoriale t\u00eb mediave. K\u00ebt\u00eb e konfirmon
  edhe Dragan Sekullovski, drejtor ekzekutiv i Shoqat\u00ebs s\u00eb Gazetar\u00ebve
  t\u00eb Maqedonis\u00eb.\\n\u201cP\u00ebr sa koh\u00eb q\u00eb shumat e m\u00ebdha
  t\u00eb parave harxhohen nga partit\u00eb n\u00eb media, k\u00ebta t\u00eb fundit
  nuk do t\u00eb jen\u00eb n\u00eb gjendje ta b\u00ebjn\u00eb pun\u00ebn e tyre n\u00eb
  m\u00ebnyr\u00eb objektive. Prandaj, kjo praktik\u00eb duhet t\u00eb ndalet q\u00eb
  n\u00eb fillim dhe n\u00eb t\u00eb nj\u00ebjt\u00ebn koh\u00eb qeveria s\u00eb bashku
  me media dhe gazetar\u00ebt duhet t\u00eb krijojn\u00eb nj\u00eb mjedis n\u00eb
  t\u00eb cilin media mund t\u00eb konkurroj\u00eb lirsh\u00ebm duke prodhuar p\u00ebrmbajtje
  cil\u00ebsore q\u00eb do t\u00eb njihen nga sektori i biznesit dhe donator\u00ebt\u201d,
  thekson Sekullovski.\\nNdryshimi i till\u00eb q\u00eb fushatat zgjedhore t\u00eb
  paguhen nga buxheti i shtetit jan\u00eb b\u00ebr\u00eb n\u00eb Kodin Zgjedhor n\u00eb
  korrik t\u00eb vitit t\u00eb kaluar. Ky nen i ri 76 d i ndryshimeve n\u00eb Kodin
  Zgjedhor shkel parimin e arritur midis bashk\u00ebsis\u00eb s\u00eb mediave t\u00eb
  p\u00ebrfaq\u00ebsuar nga Shoqata e Gazetar\u00ebve t\u00eb Maqedonis\u00eb dhe
  organizatave t\u00eb tjera mediatike, me partit\u00eb n\u00eb qeverin\u00eb aktuale,
  q\u00eb nuk duhet t\u00eb ket\u00eb para publike n\u00eb media p\u00ebr t\u00eb
  shmangur korrupsionin e tyre.\\nMediat online dhe portalet\\nNgelet problemi i mediave
  online t\u00eb cilat me ndryshimet e b\u00ebra, kan\u00eb t\u00eb drejt\u00eb t\u00eb
  marrin para nga buxheti i shtetit. \u201cAgjencia p\u00ebr sh\u00ebrbime mediatike
  audio dhe audiovizuele\u201d nga ana tjet\u00ebr thekson se nuk aft\u00ebsi teknike
  p\u00ebr t\u2019i monitoruar mediat online.\\n\u201cAgjencia \u00ebsht\u00eb e mendimit
  se mediat online nuk monitorohen askund n\u00eb Evrop\u00eb, as q\u00eb ajo ka aft\u00ebsin\u00eb
  ta b\u00ebj\u00eb k\u00ebt\u00eb. Por, megjith\u00eb kund\u00ebrshtimin e Agjencis\u00eb
  dhe organizatave t\u00eb m\u00ebdha mediatike n\u00eb vend, ky detyrim jo vet\u00ebm
  q\u00eb mbeti, por edhe n\u00eb ndryshimet e fundit t\u00eb Kodit Zgjedhor n\u00eb
  2018, u vendos\u00ebn gjoba m\u00eb t\u00eb larta parash, si nj\u00eb k\u00ebrc\u00ebnim
  p\u00ebr mediat online\u201d, thuhet n\u00eb hulumtimin hulumtimin \u201cSistemi
  zgjedhor \u2013 burim serioz i krizave n\u00eb Maqedoni\u201d.\\nSekullovski nga
  ana tjet\u00ebr thekson se seksioni p\u00ebr mediat online duhet t\u00eb fshihet
  plot\u00ebsisht.\\n\u201cSeksioni p\u00ebr mediat elektronike ose online mediumet,
  nga projekt-ndryshimet n\u00eb Kodin Zgjedhor, duhet t\u00eb fshihet pasi praktika
  e mediave n\u00eb internet dhe p\u00ebrfshirja e tyre n\u00eb fushatat mediatike
  \u00ebsht\u00eb d\u00ebshmuar t\u00eb jet\u00eb e keqe. Ata mor\u00ebn fonde pa
  rregulla, \u00e7do media online e regjistruar n\u00eb regjistrin qendror p\u00ebr
  t\u00eb pakt\u00ebn 6 muaj ka t\u00eb drejt\u00eb t\u00eb regjistrohet dhe n\u00eb
  shumic\u00ebn e rasteve vet\u00ebm kan\u00eb p\u00ebrhapur propagand\u00eb politike
  dhe si kthim disa u shp\u00ebrblyen bujarisht nga partit\u00eb me fonde buxheti\u201d,
  thekson Sekullovski.\\nNd\u00ebshkimet nuk varen vet\u00ebm prej Agjencis\u00eb
  por prej gjyq\u00ebsorit\\nSipas raportit t\u00eb OSBE / ODIHR, i cili i referohet
  t\u00eb dh\u00ebnave nga Agjencia, n\u00eb zgjedhjet e fundit lokale n\u00eb vitin
  2017 jan\u00eb ngritur 14 raste kund\u00ebrvajt\u00ebse kund\u00ebr 9 organizatave
  t\u00eb mediave. K\u00ebto procedura kan\u00eb t\u00eb b\u00ebjn\u00eb me \u201cshkelje
  q\u00eb lidhen me reklamimin politik t\u00eb paguar, raportimin e pabalancuar, publikimin
  e sondazheve t\u00eb opinionit publik dhe shkeljen e heshtjes zgjedhore\u201d, thuhet
  n\u00eb hulumtimin \u201cSistemi zgjedhor \u2013 burim serioz i krizave n\u00eb
  Maqedoni\u201d. Por nd\u00ebrsa Agjencia, sipas t\u00eb nj\u00ebjtit burim, ka p\u00ebrfunduar
  n\u00eb m\u00ebnyr\u00eb efektive pun\u00ebn e vet p\u00ebr mbik\u00ebqyrjen e mediave
  gjat\u00eb zgjedhjeve, nj\u00eb pozicion i till\u00eb \u00ebsht\u00eb d\u00ebmtuar
  nga gjykatat kompetente, t\u00eb cilat edhe kan\u00eb shkelur afatin kohor t\u00eb
  p\u00ebrgjigjes t\u00eb caktuar nga Kodi Zgjedhor, edhe kan\u00eb reaguar n\u00eb
  vet\u00ebm 4 raste, tre prej tyre u \u00ebsht\u00eb shqiptuar gjob\u00eb m\u00eb
  e ul\u00ebt se ato t\u00eb parashikuara n\u00eb Kodin Zgjedhor, nd\u00ebrsa n\u00eb
  nj\u00eb rast ata l\u00ebshuan nj\u00eb v\u00ebrejtje.\\nBlazhevski sugjeron q\u00eb
  mediat t\u00eb raportojn\u00eb sipas standardeve profesionale dhe etike dhe t\u00eb
  p\u00ebrmbushin detyrimet e raportimit ligjor gjat\u00eb zgjedhjeve.\\n\u201cAgjencia
  e mediave duhet t\u00eb vazhdoj\u00eb t\u00eb kryej\u00eb detyr\u00ebn e saj monitoruese
  me zell dhe t\u00eb vazhdoj\u00eb t\u00eb l\u00ebshoj\u00eb kund\u00ebrvajtje. Un\u00eb
  jam p\u00ebr gjoba t\u00eb larta, andaj nuk kam qen\u00eb dakord p\u00ebr zvog\u00eblimin
  e d\u00ebnimeve n\u00eb ligje. Sigurisht q\u00eb e gjith\u00eb kjo nuk \u00ebsht\u00eb
  e mundur pa nj\u00eb gjyq\u00ebsor t\u00eb azhurnuar dhe profesional, pasi Agjencia
  raporton l\u00ebnd\u00ebt n\u00eb gjykata n\u00eb nj\u00eb proces t\u00eb shpejt\u00eb
  gjat\u00eb vet\u00eb fushat\u00ebs dhe para saj, por gjykatat deri m\u00eb tani
  kan\u00eb mbetur vet\u00ebm shkronj\u00eb e vdekur n\u00eb let\u00ebr dhe nuk kan\u00eb
  vepruar n\u00eb pjes\u00ebn m\u00eb t\u00eb madhe t\u00eb denoncimeve nga Agjencia\u201d,
  thekson Blazhevski.\"", "\"Nj\u00eb poem\u00eb prej Meje \u2013 6/12/2012 Ne duhet
  ta \u00e7lirojm\u00eb mendjet tona p\u00ebr t\u00eb ndaluar t\u00eb ushqyerit e
  tyre, n\u00ebse ju nuk e b\u00ebni, Un\u00eb mund t''ju them se ku kjo \u00ebsht\u00eb
  udh\u00ebheq\u00ebse Gjithmone dashuri ferrin tuaj, [\u2026]\\n(Sh\u00ebnim nga
  Moe: Kjo \u00ebsht\u00eb nj\u00eb post t\u00eb gjall\u00eb q\u00eb do t\u00eb rritet
  dhe t\u00eb zgjerohet me kalimin e koh\u00ebs. Ju lutem mos ngurroni t\u00eb komentoj\u00eb
  apo t\u00eb m\u00eb lejoni t\u00eb di mendimet tuaja.) Beduin Famous th\u00ebn\u00eb
  \u2013 [\u2026]\\nPo, keni d\u00ebgjuar at\u00eb direkt nga goja e Rove, \u201d
  Egyptains M\u00eb per\u00ebndimor sepse ata zbrit\u00ebn nga Ramses & Kleopatra\u201d\\n(Burimet:
  Creative Commons Shum\u00ebfishta) \u2013 Zbulesa 19:16 \u2013 Mbi rroben e vet
  dhe mbi kofsh\u00ebn e tij ai e ka k\u00ebt\u00eb em\u00ebr t\u00eb shkruar: MBRETI
  I MBRET\u00c9RVE dhe ZOTI I ZOT\u00c9RVE. Nga fillimi [\u2026]\\n(Burimet: Creative
  Commons Shum\u00ebfishta) \u2013 Cadmus ishte nj\u00eb Princ fenikas i cili ishte
  themelues t\u00eb qytetit t\u00eb lasht\u00eb e Teb\u00ebs. Ai ishte personi p\u00ebr
  t\u00eb futur p\u00ebrdorimin e letrave [\u2026]\\nSeksi \u00ebsht\u00eb burim i
  t\u00ebr\u00eb jet\u00ebs. Megjithat\u00eb, m\u00eb lejoni t''ju t\u00ebrhequr v\u00ebrejtjen
  se ky burim madh\u00ebshtore nuk \u00ebsht\u00eb di\u00e7ka q\u00eb ne njer\u00ebzit
  duhet profane me nevojat tona t\u00eb kafsh\u00ebve ose d\u00ebshiron, nga [\u2026]\\nKoh\u00ebt
  e fundit kam gjetur lajmin e madh q\u00eb un\u00eb jam i lidhur me Napoleon Bonaparte.
  Napoleoni nuk ishte vet\u00ebm nj\u00eb nga oficer\u00ebt m\u00eb t\u00eb m\u00ebdha
  ushtarake franceze ndonj\u00ebher\u00eb, ai kishte gjithashtu [\u2026]\\nKolonel
  Jessep: Sido q\u00eb t\u00eb jet\u00eb, Un\u00eb nuk i japin nj\u00eb mallkim se
  \u00e7far\u00eb ju mendoni se ju jeni t\u00eb drejt\u00eb p\u00ebr t\u00eb! Vrim\u00eb
