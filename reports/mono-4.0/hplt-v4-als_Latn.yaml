  p\u00ebr hetim t\u00eb pavarur nd\u00ebrkomb\u00ebtar p\u00ebr Mianmarin, Marzuki
  Darusman, tha se qeveria e Mianmarit ende nuk lejon ekipin e tij t\u00eb hyj\u00eb
  n\u00eb rajon p\u00ebr t\u00eb hetuar persekutimin q\u00eb kan\u00eb kryer forcat
  e siguris\u00eb ndaj musliman\u00ebve t\u00eb Arakanit (Rohingya), transmeton Anadolu
  Agency (AA). Sipas lajmit t\u00eb agjencis\u00eb Kyodo m\u00ebsohet se Darusman
  ka folur n\u00eb konferenc\u00ebn p\u00ebr media t\u00eb mbajtur p\u00ebr prezantimin
  e raportit t\u00eb organizat\u00ebs p\u00ebr t\u00eb drejtat\\nLexo m\u00eb tep\u00ebrAta
