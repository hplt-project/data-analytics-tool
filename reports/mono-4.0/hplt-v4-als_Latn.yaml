  e fort\u00eb, e cila ka shkaktuar l\u00ebndime tek disa persona.\\nSi pasoj\u00eb
  e aksidentit, tre individ\u00eb kan\u00eb mbetur t\u00eb plagosur dhe jan\u00eb
  transportuar menj\u00ebher\u00eb me urgjenc\u00eb n\u00eb Spitalin Rajonal t\u00eb
  Fierit p\u00ebr marrjen e trajtimit mjek\u00ebsor. Nd\u00ebr t\u00eb l\u00ebnduarit
  jan\u00eb dy pasagjere, shtetaset M. Rr., 52 vje\u00e7e dhe S. Rr., 32 vje\u00e7e,
