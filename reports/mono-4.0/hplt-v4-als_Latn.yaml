  do t\u00eb adresoj\u00eb t\u00eb gjith\u00eb problematik\u00ebn e Planit t\u00eb
  Veprimit, t\u00eb gjith\u00eb problematik\u00ebn strategjike t\u00eb raporteve t\u00eb
  Komisionit Europian. Procesi njohu nj\u00eb ngadal\u00ebsi p\u00ebr disa shkaqe
