  m\u00ebdha t\u00eb energjis\u00eb s\u00eb rinovueshme, jemi nd\u00ebr vendet me
  biodiversitet t\u00eb pashembullt n\u00eb Europ\u00eb dhe q\u00eb kemi vullnetin
