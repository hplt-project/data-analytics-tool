  jet\u00eb e p\u00ebrkushtuar maksimalisht p\u00ebr rrjedh\u00eb sa m\u00eb t\u00eb
  mir\u00eb t\u00eb gar\u00ebs.\"", "\"Senatori Chris Murphy ka p\u00ebrg\u00ebzuar
  kryeministrin Kurti p\u00ebr arritjen e marr\u00ebveshjes me Serbin\u00eb, por nga
  i nj\u00ebjti k\u00ebrkoi q\u00eb Asociacioni t\u00eb b\u00ebhet k\u00ebt\u00eb
  vit, duke theksuar se \u201ckoha ka r\u00ebnd\u00ebsi shum\u00eb\u201d duke theksuar
  se kjo duhet t\u00eb ndodh\u00eb k\u00ebt\u00eb vit p\u00ebr ta mund\u00ebsuar normalizimin
  e marr\u00ebdh\u00ebnieve me Serbin\u00eb.\\nSenatori ka shprehur gatishm\u00ebri
  q\u00eb t\u2019i ndihmojn\u00eb Kosov\u00ebs edhe n\u00eb k\u00ebt\u00eb \u00e7\u00ebshtje.\\n\u201cPat\u00ebm
  nj\u00eb bised\u00eb shum\u00eb t\u00eb mir\u00eb t\u00eb sinqert\u00eb p\u00ebr
  dialogun. Na vjen shum\u00eb mir\u00eb p\u00ebr marr\u00ebveshjen q\u00eb e keni
  arritur me Serbin\u00eb. E dim\u00eb q\u00eb k\u00ebto kan\u00eb t\u00eb b\u00ebjn\u00eb
  me disa zgjidhje t\u00eb v\u00ebshtira p\u00ebr t\u00eb dy pal\u00ebt. Serbia duhet
  t\u00eb ndaloj\u00eb s\u00eb penguari Kosov\u00ebn n\u00eb an\u00ebtar\u00ebsimin
  n\u00eb organizata nd\u00ebrkomb\u00ebtare. Mendojm\u00eb se \u00ebsht\u00eb e kuptueshme
  q\u00eb t\u00eb lejohet q\u00eb komunat me shumic\u00eb serbe t\u00eb ken\u00eb
  nj\u00ebfar\u00eb mund\u00ebsie p\u00ebr t\u00eb bashk\u00ebrenditur sh\u00ebrbimet
  q\u00eb i ofrojn\u00eb. Por koha ka shum\u00eb me r\u00ebnd\u00ebsi, \u00ebsht\u00eb
  viti kur duhet t\u00eb kryhet kjo dhe q\u00eb t\u00eb mund\u00ebsohet arritja e
  normalizimit, e cila do t\u00eb \u00e7oj\u00eb te njohja e nd\u00ebrsjell\u00eb.
  Prandaj na vjen mir\u00eb q\u00eb d\u00ebgjuam p\u00ebr planet tua p\u00ebr zbatimin
  e k\u00ebsaj marr\u00ebveshje dhe jemi t\u00eb gatsh\u00ebm q\u00eb t\u2019ju ndihmojn\u00eb
  edhe n\u00eb k\u00ebt\u00eb nd\u00ebrmarrje\u201d, tha Murphy.\\nParaprakisht fjal\u00ebn
  e mori kryeministri Albin Kurti, i cili tha se pret zbatimin e marr\u00ebveshjes
  pa kusht\u00ebzime.\\n\u201cBiseduam edhe p\u00ebr raportet me Serbin\u00eb dhe
  rezultatet e dialogut, me theks te marr\u00ebveshja bazike dhe aneksi i zbatimit,
  ato p\u00ebrb\u00ebjn\u00eb avancim t\u00eb marr\u00ebdh\u00ebnieve nd\u00ebrmjet
  dy vendeve dhe jan\u00eb platform\u00eb e mund\u00ebsi p\u00ebr normalizim t\u00eb
  plot\u00eb t\u00eb tyre. Prandaj na duhet zbatim i t\u00ebr\u00ebsish\u00ebm i shpejt\u00eb
  dhe pa kusht\u00ebzime\u201d, tha Kurti.\"", "\"- Krimet komuniste\\nShfletime n\ufffdp\ufffdr
