  dhe brifingut me garues, xhiroja e par\u00eb fillon n\u00eb or\u00ebn 15:00.\\nNdihma
  e Shpejt\u00eb dhe Brigada e Zjarrfik\u00ebsve do t\u00eb jet\u00eb t\u00eb pranishme
