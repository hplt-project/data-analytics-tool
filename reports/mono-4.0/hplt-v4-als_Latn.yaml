  k\u00ebtij takimi, Ambasadori u...\"", "\"Nj\u00eb aksident i r\u00ebnd\u00eb ka
  ndodhur pasditen e sotme n\u00eb autostrad\u00ebn Lushnje-Vlor\u00eb, pran\u00eb
  kthes\u00ebs s\u00eb Pojanit. Shtat\u00eb automjete, q\u00eb udh\u00ebtonin n\u00eb
