  e b\ufffdra edhe p\ufffdr t\ufffd kryer amanetin e gjyshit tim, Mustaf\ufffds, babait
  t\ufffd Aziz Zhilivod\ufffds dhe axh\ufffds tim Qerkinit, i cili aq shum\ufffd u
  sakrifikua p\ufffdr ne. Me k\ufffdt\ufffd rast dua t\ufffd p\ufffdrmend edhe sakrificat
  e dajave t\ufffd mi Avdijajve nga Hadja dhe dajave t\ufffd bab\ufffds Abdullahajve
  nga Vranidolli i Llapit. Nj\ufffd pjes\ufffd e k\ufffdtyre kujtimeve jan\ufffd ngjarje
  q\ufffd i kami p\ufffdrjetuar un\ufffd dhe familja ime drejtp\ufffdrs\ufffddrejti.
  Dua t\ufffd flas edhe p\ufffdr t\ufffd gjith\ufffd ata burra e ato gra q\ufffd mbajt\ufffdn
  mbi supe t\ufffdr\ufffd tmerrin e koh\ufffds gjat\ufffd pushtimit turk dhe serb,
  n\ufffd k\ufffdto an\ufffd, t\ufffd cil\ufffdt q\ufffdndruan t\ufffd patrembur dhe
  stoik\ufffd gjat\ufffd gjith\ufffd jet\ufffds s\ufffd tyre dhe na m\ufffdsuan se
  si t\ufffd rrojm\ufffd si nj\ufffdr\ufffdz, t\ufffd patrembur p\ufffdr idealet e
  larta komb\ufffdtare dhe njer\ufffdzore. Duke u bazuar n\ufffd porosit brez\ufffd
  pas brezi, pata fatin q\ufffd nga gjyshi im, Musraf\ufffd Latifi, t\ufffd m\ufffdsoj
  p\ufffdr paraardh\ufffdsit ton\ufffd, t\ufffd cil\ufffdt kishin jetuar n\ufffd fshatin
  Gllavotin, jo larg fshatit Zhilivod\ufffd, ku tani edhe jetojm\ufffd. Dikur n\ufffd
  vitin 1890, n\ufffd koh\ufffdn e pushtimit turk, i pari k\ufffdsaj familje quhej
  Mikel Lek\ufffd Gjoni, pra at\ufffdher\ufffd ishim t\ufffd krishter\ufffd. Po n\ufffd
  k\ufffdt\ufffd vit, pas kalimit n\ufffd fen\ufffd islame, me dhun\ufffd, \ufffdsht\ufffd
  dashur t\ufffd nd\ufffdrrohen edhe em\ufffdrat. N\ufffd at\ufffd koh\ufffd, n\ufffd
  fshat kishte jetuar, Muja, djali i madh i Mikelit, i cili p\ufffdr shkaqe t\ufffd
  mosdurimit t\ufffd pushtetit turk, detyrohet t\ufffd l\ufffdshoj\ufffd sht\ufffdpin\ufffd
  dhe tok\ufffdn e t\ufffd par\ufffdve p\ufffdr tu strehuar n\ufffd malet e Qyqavic\ufffds.
  N\ufffd fillim do ta p\ufffdrshkruaj origjin\ufffdn e Mujajve sipas asaj q\ufffd
  m\ufffd ka folur gjyshi.\\nMujajt\\nGjyshi im ka qen\ufffd i men\ufffdur dhe ka
  p\ufffdrcjellur kujtimet dhe amanetet e prind\ufffdrve t\ufffd vet. Aso kohe, sa
  kishin qen\ufffd n\ufffd fshatin Gllavotin, nj\ufffd dit\ufffd, shkon Muja t\ufffd
  marr\ufffd dru n\ufffd malin e Qyqavic\ufffds. Derisa ishte n\ufffd mal, vjen nj\ufffd
  \ufffdaush i Mbretit me shtat\ufffd tasildar\ufffd me kat\ufffdr zapti. Hyjn\ufffd
  n\ufffd oborrin e sht\ufffdpis\ufffd s\ufffd Muj\ufffds dhe pyesin se ku ndodhej
  i zoti i sht\ufffdpis\ufffd. N\ufffdna e Muj\ufffds u thot se Muja me djmt\ufffd
  kishin shkuar me marr\ufffd dru n\ufffd mal. \ufffdaushi vret gjelin e sht\ufffdpis\ufffd
  dhe i thot n\ufffdn\ufffds s\ufffd Muj\ufffds t\ufffdua p\ufffdrgadiste p\ufffdr
  ta ngr\ufffdn\ufffd. \ufffdaushi me zapti e tasildar\ufffd shkojn\ufffd n\ufffd
  kull\ufffd dhe shtrihen t\ufffd flejn\ufffd. Nuk vonon shum\ufffd, Muja k\ufffdthehet
  nga mali. N\ufffdna i del p\ufffdrpara dhe pyet:\\n- A u lodhe biro?\\n- Jo moj
  n\ufffdn\ufffd, po ti a u lodhe? \ufffd pyet Muja\\nMuja i sheh disa pika gjaku
  n\ufffdp\ufffdr oborr dhe pyet:\\n- Lum n\ufffdna, \ufffdka jan\ufffd k\ufffdshtu
  k\ufffdto pika gjaku?\\nN\ufffdna p\ufffdr t\ufffd mos i treguar t\ufffd birit,
  duke ditur se do t\ufffdi z\ufffd belaja me turqit i thot:\\n- Biro e kam pre nj\ufffd
  gjel!\\nN\ufffd at\ufffd moment vjen nj\ufffd djal\ufffd i Muj\ufffds dhe i thot\ufffd:\\n-
  Baba Muj\ufffd!\\n- Fol biro!?\\n- Na e ka vrar\ufffd \ufffdaushi gjelin! \ufffd
  thot djali.\\n- \ufffdfar\ufffd \ufffdaushi ore?\\n- \ufffdaushi me do zapti e tasildar\ufffd
  jan\ufffd n\ufffd kull\ufffd baba Muj\ufffd, - p\ufffdrgjigjet djali.\\n- Eu, -
  b\ufffdrtet Muja, leni drut\ufffd ore! - u b\ufffdrtet v\ufffdllez\ufffdrve! - rrokni
  martinat! dhe hyjn\ufffd n\ufffd kull\ufffd.\\n- \ufffdohuni ore qen\ufffd, iu kishte
  b\ufffdrtitur Muja.\\n- Kush u ka dh\ufffdn\ufffd leje t\ufffd qitni pushk\ufffd
  n\ufffd oborrin tim dhe t\ufffd mi vrisni pulat?\\nPas pak fjal\ufffdve d\ufffdgjohen
  t\ufffd sht\ufffdna n\ufffd kull\ufffd, ku vritet \ufffdaushi vet\ufffd i nj\ufffdmb\ufffddhjeti.
  At\ufffdher\ufffd, Muja i merr\ufffd an\ufffdtar\ufffdt e familjes s\ufffd vet dhe
  l\ufffdshon sht\ufffdpin\ufffd p\ufffdr t\ufffd shp\ufffdtuar nga ekspeditat ushtarake
  turke. Pasi djeg\ufffd sht\ufffdpit\ufffd dhe pasurin\ufffd me gjith\ufffd turqit
  mbrenda, ia m\ufffdsyen maleve t\ufffd Qyqavic\ufffds dhe atje gjen strehim. Nga
  ky gjest i Muj\ufffds ka mbetur th\ufffdnja: \ufffdHajde ta b\ufffdjm\ufffd Zhilivod\ufffd.\\nK\ufffdtu
  ku jetojm\ufffd tash, prej t\ufffd par\ufffdve ton\ufffd themelohet fshati Zhilivod\ufffd.
  Pastaj Muja fillon t\ufffd pres\ufffd malin p\ufffdr t\ufffd b\ufffdr\ufffd tok\ufffd
  p\ufffdr buk\ufffdn e familjes. Gjyshi thoshte se shtat\ufffd her\ufffd ishte rrethuar
  Muja nga ushtrit\ufffd dhe zaptit\ufffd turke, por i ndihmuar nga v\ufffdllez\ufffdrit
  dhe djemt\ufffd, ai i kishte thyer k\ufffdto ekspedita. Nj\ufffd pjes\ufffd e meshkujve
  t\ufffd Muj\ufffds kishin b\ufffdr\ufffd gjithnj\ufffd roje, q\ufffd t\ufffd mos
  i sulmojn\ufffd turqit tin\ufffdz sikur e kishin pasur zakon. Muja vazhdon t\ufffd
  punoj\ufffd tok\ufffdn buz\ufffd malit. Toka n\ufffd mes t\ufffd lumit Llap dhe
  Sitnic\ufffd ku tani shtrihet fshati Prelluzh\ufffd mbetet djerr\ufffd. Nj\ufffd
  dit\ufffd vjen nj\ufffd beg prej Vushtrrie dhe i thot Muj\ufffds: - N\ufffdse do
  t\ufffd shp\ufffdtoj prej ekspeditave t\ufffd truq\ufffdve mund ta b\ufffdjm\ufffd
  nj\ufffd marr\ufffdveshje. M\ufffd jap tak\ufffdn dhe livadhet e un\ufffd t\ufffdi
  heqi turqit prej qafe. N\ufffd at\ufffd koh\ufffd, Muja kishte jetuar n\ufffd nj\ufffd
  bashk\ufffdsi familjare prej 63 an\ufffdtar\ufffdsh. Pasi mendohet Muja dhe konsultohet
  me v\ufffdllez\ufffdr, marrin vendim q\ufffd ta l\ufffdn\ufffd tok\ufffdn n\ufffd
  kund\ufffdrshp\ufffdrblim t\ufffd dh\ufffdnies fund t\ufffd ekspeditave turke. I
  kishin l\ufffdn\ufffd m\ufffd se 80 hektar\ufffd tok\ufffd. Pasi begu i merr\ufffd
  tokat, i kolonizon me \ufffderkez\ufffd (\ufffde\ufffden\ufffd) t\ufffd ndjekur
  nga Rusia. P\ufffdr hir t\ufffd v\ufffdrtet\ufffds duhet th\ufffdn\ufffd se bab\ufffdgjyshit
  nuk i kujtoheshin vitet se kur kishin ndodhur k\ufffdto ngjarje. Sot e k\ufffdsaj
  dite, \ufffderkez\ufffdt e Stanofcit t\ufffd Ul\ufffdt e kan\ufffd nj\ufffd pjes\ufffd
  t\ufffd tok\ufffds ton\ufffd. Pjes\ufffdn tjeter e kan\ufffd serb\ufffdt e Prelluzh\ufffds.
  Pas \ufffdlirimit nga turqit e sidomos pas vitit 1912, Kosova okupohet nga Serbia
  dhe tash na vijn\ufffd zotni taze, t\ufffd cil\ufffdt filluan t\ufffdi l\ufffdvizin
  mexhat secili sipas nevoj\ufffds s\ufffd vet dhe deshir\ufffds personale.\\nMasakra
  n\ufffd mes t\ufffd Krasmirofcit dhe Gradic\ufffds\\nMe kalimin e koh\ufffds dhe
  viteve, r\ufffdndohej edhe pesha e rob\ufffdris\ufffd mbi supet e t\ufffd par\ufffdve
  tan\ufffd. K\ufffdshtu, n\ufffd shtatorin e vitit 1919, nj\ufffd ekspedit\ufffd
  e shkaut ia m\ufffdsyen Qyqavic\ufffds dhe fshatit Zhilivod\ufffd. Krismat e pushk\ufffdve
  p\ufffdrhapen nga fshati Zhilivod\ufffd deri n\ufffd fshatin Koll\ufffd t\ufffd
  komun\ufffds s\ufffd Vushtrris\ufffd. Pasi forcat serbe thehen nga shqiptar\ufffdt,
  shkijet sjellin perforcime te reja ushtarake. N\ufffd rrethet e Qyqavices fillon
  luft\ufffd e madhe per jet\ufffd a vdekje. Pas shum\ufffd luftimeve, shqiptar\ufffdt
  nuk kishin qen\ufffd m\ufffd n\ufffd gjendje t\ufffdiu p\ufffdrballojn\ufffd forcave
  t\ufffd Serbis\ufffd. Nj\ufffdsitet e luft\ufffdtar\ufffdve ton\ufffd t\ufffdrhiqen
  thell ne zemre\ufffdn e Qyqavic\ufffds. Po n\ufffd k\ufffdt\ufffd vit, nga forcat
  serbe, zihen 87 burra prej Koll\ufffds e deri n\ufffd Zhilivod\ufffd. T\ufffd paarmatosur,
  pleq dhe t\ufffd rrinj, t\ufffd gjith\ufffd, pushkatohen dhe masakrohen n\ufffd
  mes t\ufffd fshatrave Krasmirovc dhe Gradic\ufffd. N\ufffd mes t\ufffd t\ufffd vrar\ufffdve,
  nga sht\ufffdpia e Muj\ufffds ishte axha Shaban, v\ufffdllau i bab\ufffdgjyshit-Mustaf\ufffds.
  Serb\ufffdt i kishin masakruar n\ufffd m\ufffdnyr\ufffdn m\ufffd barbare. N\ufffd
  k\ufffdt\ufffd masak\ufffdr u pushkatuan Fazliu dhe Sejdiu, 17 vje\ufffdar.\\nBab\ufffdgjyshi
  thoshte, - Kur kemi shkuar ti marrim kufomat meshkujt ton\ufffd, t\ufffd gjith\ufffd
  kishin qen\ufffd te zhveshur lakuriq. Teshat e trupit ua kishin marr\ufffd fshatrat
  p\ufffdr rreth vendit ku ishte b\ufffdr\ufffd masakra. Aq keq i kishin masakruar
  kufomat sa mezi i kishin njohur p\ufffdrmes shenjave t\ufffd trupit. I marrin 12
  meshkuj e n\ufffd mesin e tyre edhe nje vajz\ufffd, poashtu e masakruar. Vajza quhej
  Zylfie, e bija e Avdullit prej Zhilivode. Meqen\ufffdse, Avdulli nuk kishte pasur
  djem\ufffd, vendos ta b\ufffdj\ufffd vajz\ufffdn si djal\ufffd. Kurr\ufffd fshatar\ufffdt
  e Zhilivod\ufffds nuk e kishin ditur se \ufffdsht\ufffd vajz\ufffd dhe se emrin
  e kishte Zylfie, por e kishin quajtur Syla i Avdullit. Vet\ufffdm pas k\ufffdsaj
  masakre \ufffdsht\ufffd konstatuar se Syla kishte q\ufffdn\ufffd Zylfia, e bija
  e Avdullit 22 vje\ufffdare. V\ufffdllau i bab\ufffdgjyshit, Shabani, i vrar\ufffd
  i len\ufffd dy jetima : Qerkinin dhe Qerimin. Qerkini, Qerimi dhe Azizi e kan\ufffd
  par\ufffd bab\ufffdn e tyre, gjegj\ufffdsisht axh\ufffdn, t\ufffd masakruar dhe
  jan\ufffd betuar te varri i ti, se do t\ufffdia marrin hakun axh\ufffds Shaban dhe
  t\ufffd gjith\ufffd te tjer\ufffdve. Sipas tregimeve t\ufffd bab\ufffdgjyshit ton\ufffd,
  Mustaf\ufffds, sht\ufffdpia e Muajajve mbeti n\ufffd sh\ufffdnjest\ufffdr t\ufffd
  pushtetit t\ufffd at\ufffdhersh\ufffdm t\ufffd Serbis\ufffd. Mu p\ufffdr k\ufffdt\ufffd
  fillon jeta, por edhe q\ufffdndresa jon\ufffd familjare n\ufffdp\ufffdr burgjet
  serbosllave. Edhe pas shum\ufffd persekutimeve, maltretimeve, vrasjeve q\ufffdndruam
  t\ufffd paepur kundruell \ufffdeshtjes komb\ufffdtare, por edhe njer\ufffdzore.
  Pra, fatin e t\ufffd par\ufffdve e kemi p\ufffdrjetuar edhe gjat\ufffd luft\ufffds
  s\ufffd Dyt\ufffd Botrore dhe pas saj.\\nAziz Zhilivoda dhe pjes\ufffdmarrja e tij
  n\ufffd NDSH\\nBaba jon\ufffd Azizi rritet, poashtu edhe Qerkini dhe Qerimi. Martohen
  q\ufffd t\ufffd tre dhe bab\ufffdgjyshi ia l\ufffd p\ufffdrkujdesjen e sht\ufffdpis
  Qerkinit. Baba im, Azizi, hyn\ufffd n\ufffd detyr\ufffdn e xhandarm\ufffdris\ufffd
  shqiptare t\ufffd asaj kohe. N\ufffd vitet q\ufffd vijojn\ufffd, si\ufffd dihet,
  Kosov\ufffdn e ndajn\ufffd mes vete gjerman\ufffdt dhe italian\ufffdt. Azizi gjendet
  m\ufffd detyr\ufffd n\ufffd Orllan t\ufffd Podujev\ufffds, pastaj n\ufffd Lluzhan
  dhe n\ufffd fund n\ufffd Besi. Disa vite m\ufffd von\ufffd kalon n\ufffd Gard\ufffdn
  e Xhafer Dev\ufffds. Pas largimit t\ufffd gjerman\ufffdve dhe italian\ufffdve nga
  Kosova, shpartallohen k\ufffdto formacione ushtarake t\ufffd shqip\ufffdtar\ufffdve.
  Kosova ripushtohet nga forcat sllavokomuniste. K\ufffdto formacione ushtarake shqiptare
  ndahen n\ufffd grupe m\ufffd t\ufffd vogla dhe strehohen disa n\ufffd Drenic\ufffd
  dhe disa n\ufffd Qyqavic\ufffd. Pa vonuar, organizohen dhe riorganizohen formacione
  ushtarake nga Xhafer Deva, Marie Shllaku dhe Gjon Serreqi. Fillon lufta frontale
  dhe n\ufffd prita kund\ufffdr s\ufffdrbosllav\ufffdve. Ne po kufizohemi t\ufffd
  flasim vet\ufffdm p\ufffdr rrethin e \ufffdyqavic\ufffds, t\ufffd Shal\ufffds dhe
  Llapit, q\ufffd na i la me goj\ufffd dhe shkrim baba yn\ufffd, Aziz Zhilivoda, duke
  mos harruar t\ufffd permendim lidhjet e k\ufffdtyre rretheve me pjes\ufffd tjera
  t\ufffd Kosov\ufffds. Me k\ufffdto formacione ushtarake kan\ufffd komanduar n\ufffd
  rrethin e Qyqavic\ufffds, t\ufffd quajtur Artakoll, Aziz Zhilivoda, Hashim Gjaka
  dhe Ferat Hashim Strofci. N\ufffd Shal\ufffd t\ufffd Bajgor\ufffds, kryengritjen
  e ka udhehequr Ahmet Selaci dhe Adem Voca i Shal\ufffds. Me Drenic\ufffdn kan\ufffd
  mbajtur kontakte, konsultime dhe marr\ufffdveshje t\ufffd vazhdueshme me Marie Shllakun,
  Gjon Serreqin, Ajet G\ufffdrgurin, Hilmi Zariqin, Miftar Bajraktarin e Llaush\ufffds,
  Bajram D\ufffdrgutin, Bajraktarin e Gllogovcit, Ymer Berish\ufffdn dhe shum\ufffd
  te tjer\ufffd. Mbajtjen e tyre me ushqim dhe veshmbathje si dhe strehimin e kan\ufffd
  siguruar Bajram Zuka i Likoshnit dhe Xhemail Lahu-Dervisholli i Gradic\ufffds. Nga
  organizimi dhe riorganizimi i s\ufffdrish\ufffdm, p\ufffdrpjekjet dhe luft\ufffdrat
  n\ufffdn p\ufffdrkujdesjen e Gj.Serreqit, M. Shllakut, Y.Berish\ufffds formohen
  aradhat p\ufffdr Drenic\ufffd. Komandant t\ufffd k\ufffdtyre formacioneve ushtarake
  ishin Shaban Polluzha dhe Mehmet Gradica. N\ufffd Artakoll formohen formacione ushtarake
  duke p\ufffdrfshir\ufffd edhe Shalen e Bajgor\ufffds, dhe em\ufffdrohen komandant\ufffd
  Adem Voca, Ahemet Selaci, Aziz Zhilivoda, Osman Bunjaku, Ferat Hashim Strofci, Fazli
  Saraqi, Hashim Gjaka etj.\\nPas shum\ufffd p\ufffdrpjekjeve e luft\ufffdrave p\ufffdr
  \ufffdlirim, Kosov\ufffdn e riokupjn\ufffd definitivisht sllavokomunist\ufffdt.\\nN\ufffd
  rrethin e Hades, ku b\ufffdjn\ufffd pjes\ufffd Shipitulla dhe Bella\ufffdevci, formacionet
  ushtarake i kan\ufffd udh\ufffdhequr Ajet Mjekiqi, Hakif Mjekiqi, Jakup Avdi Grai\ufffdevci
  i Hades me v\ufffdll\ufffdz\ufffdr (Ibrahimin dhe Qazimin), Rrustem Salihi, Syl\ufffd
  Shaban Morina (Haxhi Syla), i cili kishte merita jashtzakonisht t\ufffd m\ufffddha.
  N\ufffd k\ufffdto formacione ishin edhe Sadik Shala dhe Zenel Mani. N\ufffd t\ufffd
  gjitha kuvendet q\ufffd jan\ufffd mbajtur prej Kuvendit t\ufffd Dob\ufffdrdolit
  e deri n\ufffd Kongresin e Lipovic\ufffds, Aziz Zhilivoda ishte gjithnj\ufffd i
  pranish\ufffdm n\ufffd t\ufffd gjitha marr\ufffdveshjet. Sipas fjal\ufffdve t\ufffd
  Aziz Zhilivodes, ai thoshte se n\ufffd qoft\ufffdse dikush e nxjerr\ufffd Kosov\ufffdn
  prej rob\ufffdrie, t\ufffd vetmit shqiptar\ufffd t\ufffd nd\ufffdrgjegjsh\ufffdm
  t\ufffd koh\ufffds, ishin Xh. Deva, Gj. Sereqi, M.Shllaku, Y.Berisha, etj.\\nPas
  shum\ufffd p\ufffdrpjekjeve e luft\ufffdrave p\ufffdr \ufffdlirim, Kosov\ufffdn
  e riokupojn\ufffd definitivisht sllavokumunst\ufffdt. Nj\ufffd pjes\ufffd e k\ufffdtyre
  formacioneve ushtarake, sipas fjal\ufffdve t\ufffd Aziz Zhilivod\ufffds, kalojn\ufffd
  n\ufffd ilegalitet dhe vazhdojn\ufffd luft\ufffdrat, e disa prej tyre, m\ufffd von\ufffd,
  kalojn\ufffd kufirin dhe dalin n\ufffd Shqip\ufffdri. K\ufffdt\ufffd e b\ufffdn\ufffd
  edhe Azizi, i cili pas disa viteve q\ufffd kishte kaluar n\ufffd liri, burgoset
  dhe d\ufffdnohet dhjet\ufffd vjet nga regjimi i Enver Hoxhes. Sipas d\ufffdshmive
  t\ufffd Mergimes, bij\ufffds s\ufffd Azizit, e cila jeton n\ufffd Elbasan, nj\ufffd
  nat\ufffd para se t\ufffd lirohet Azizi nga burgu, e kishte halemuar nj\ufffd sigurims
  i Enver Hoxh\ufffds, me origjin\ufffd nga kosova, t\ufffd cilit ia dim\ufffd emrin
  dhe mbiemrin. Pak vite para luft\ufffds \ufffdlirimtare t\ufffd Kosov\ufffds, Azizi
  n\ufffdp\ufffdrmes nj\ufffd interviste n\ufffd revist\ufffdn \ufffdZ\ufffdri\ufffd,
  pati porositur: - Mos hyni n\ufffd luft\ufffd n\ufffdse nuk mund ta fitoni, mjaft
  kemi humbur! Por n\ufffdse fillon lufta, edhepse n\ufffd mosh\ufffd t\ufffd shtyer,
  do m\ufffd shihni me mashink\ufffd n\ufffd krah n\ufffd malet e Qyqavic\ufffds.
  Vdiq pa iu plot\ufffdsuar d\ufffdshira, por mashinka e tij b\ufffdri pun\ufffd gjat\ufffd
  luft\ufffds \ufffdlirimtare t\ufffd Kosov\ufffds, t\ufffd viteve1998/99. Arm\ufffdn
  e Azizit, t\ufffd ruajtur me p\ufffdrkushtim q\ufffd nga lufta e Dyt\ufffd, e p\ufffdrdori
  me trim\ufffdri nj\ufffd luft\ufffdtar i U\ufffdK-\ufffds nga Drenica dhe ajo tash
  ruhet n\ufffd muzeun e Kosov\ufffds.\\nBurgosja e familjes s\ufffd Aziz Zhilivod\ufffds\\nPasi
  Aziz Zhilivoda kishte marr\ufffd aktivisht pjes\ufffd n\ufffd luft\ufffdrat kund\ufffdr
  shkijeve p\ufffdr \ufffdlirimin e Kosov\ufffds, familja e tij i n\ufffdnshtretrohet
  maltretimeve dhe burgosjeve. N\ufffd vitin 1946, burgosen t\ufffd gjith\ufffd an\ufffdtar\ufffdt
  e familjes s\ufffd tij, prej babgjyshit 81 vje\ufffdar deri te f\ufffdmija m\ufffd
  i vog\ufffdl i mosh\ufffds 6 muajshe. K\ufffdshtu vazhdon rr\ufffdfimi e vet Faik
  Aziz Krasniqi nga Zhilivoda. - Od\ufffdn e Hajr\ufffd Isufit t\ufffd Zhilivod\ufffds,
  OZNA me dhun\ufffd e shnd\ufffdrroi n\ufffd burg privat dhe n\ufffd k\ufffdt\ufffd
  od\ufffd-burg q\ufffdndruam gjasht\ufffd muaj rresht. Buk\ufffdn, fshehtas prej
  shkijeve, na e sillte n\ufffdna e Hjar\ufffds, halla Mehreme. Nj\ufffd dit\ufffd
  erdhi nj\ufffd kontroll\ufffd n\ufffd od\ufffdn e Hjar\ufffds dhe i pan\ufffd disa
  trosha buke. N\ufffd kntroll\ufffd b\ufffdnte pjes\ufffd edhe nj\ufffd Sejdi Hasani.
  Sejdiu shkon n\ufffd Shtab t\ufffd OZN-\ufffds dhe lajm\ufffdron shefin e shtabit,
  se familjen e ballistit t\ufffd Aziz Zhilivod\ufffds po e ushqen halla Mehreme.
  Shefi i shtabit nj\ufffd K\ufffdrst K\ufffdrstiqi, i quajtur Tushi, erdhi vet\ufffd
  n\ufffd burg. E fliste shqipen rrjedh\ufffdsh\ufffdm. Ishte bashk\ufffd me Sim\ufffdn
  dhe \ufffdi\ufffd\ufffdn, q\ufffd kishin mbytur shqiptar\ufffd me guxhum (shkop
  me kok\ufffd). E muar\ufffdn hall\ufffdn Mehreme n\ufffd pyetje dhe i than\ufffd:
  - Pse po e ushqen familjen e ballistit? N\ufffd pranin\ufffd e t\ufffdr\ufffd familjes
  ton\ufffd, t\ufffd Januz Rexh\ufffd Zhilivod\ufffds, plak i men\ufffdur dhe Sejdi
  Hasanit, halla Mehreme iu drejtua shkijeve me k\ufffdto fjal\ufffd: \ufffd\ufffdfar\ufffd
  pushteti jeni ju q\ufffd burgosni pleq, gra e f\ufffdmij\ufffd? Sa t\ufffd jem gjall\ufffd,
  kam p\ufffdr t\ufffdi ushqyer edhe n\ufffdse m\ufffd pushkatoni\ufffd. Pastaj filluan
  ta marrin n\ufffd pyetje nan\ufffdn ton\ufffd, Hid\ufffdn: - Pasi nuk po mund ta
  z\ufffdm\ufffd Azizin tashm\ufffd sa koh\ufffd, na trego ti, me k\ufffd e ke k\ufffdt\ufffd
  f\ufffdmij\ufffd n\ufffd preh\ufffdr? F\ufffdmija i kishte gjasht\ufffd muaj.\\n\ufffd
  E kam me Aziz Zhilivod\ufffdn, - ia k\ufffdtheu n\ufffdna.\\n\ufffd At\ufffdher\ufffd
  kush ia ka gatuar dhe d\ufffdrguar buk\ufffdn Azizit dhe bandave t\ufffd tij ?\\n\ufffd
  Un\ufffd e kam gatuar e n\ufffdna e Azizit ia ka d\ufffdrguar deri te ara (Ara e
  Kish\ufffds). Prej atje, burri im e ka marr\ufffd me shok\ufffdt e vet.\\nN\ufffd
  at\ufffd moment \ufffdsht\ufffd ngritur n\ufffd gjunj Januz Rexh\ufffd Zhilivoda
  dhe ka b\ufffdrtitur, - Rrofsh\ufffd o bija e Avdi Hoxh\ufffds s\ufffd Hades. Qenke
  grua burr\ufffdnore dhe fisnike. Pas fjal\ufffdve t\ufffd Januzit, ka nd\ufffdrhy
  Sejdi me k\ufffdto fjal\ufffd:\\n- Sikur t\ufffd kishte qen\ufffd grua burr\ufffdnore
  dhe fisnike, ia kishte qitur tlynin e vluar n\ufffd vesh Azizit dhe e kishte likuiduar.\\nAt\ufffdher\ufffd
  n\ufffdna foli: - O Sejdi Hasani, p\ufffdr her\ufffd t\ufffd par\ufffd po t\ufffd
  shoh edhe pse je i k\ufffdtij katund, por me pas qen\ufffd Azizi burr\ufffd sikur
  ti, v\ufffdrtet\ufffd ia kisha qitur tlynin e vluar n\ufffd vesh. Sejdiu deshi t\ufffd
  thot edhe di\ufffdka, mir\ufffdpo shefi i OZN-es nd\ufffdrhyri me fjal\ufffd t\ufffd
  pista. Shefi iu drejtua hall\ufffds Mehreme, se ajo prej tash mund t\ufffd na sillte
  buk\ufffd dhe t\ufffd na ushqente, se f\ufffdmij\ufffdt, i tha, nuk kan\ufffd faj.\\nErdhi
  vjeshta e vitit 1947. Krejt familjen na d\ufffdrguan n\ufffd burgun e Vushtrris\ufffd.
  Pas dy-tri dit\ufffdve e soll\ufffdn n\ufffd burg edhe n\ufffdn\ufffdn e Sherif
  T\ufffdrrsten\ufffds, gruan e tij dhe nj\ufffd v\ufffdlla m\ufffd t\ufffd ri t\ufffd
  Sherifit. At\ufffd dit\ufffd na regjistronin n\ufffd burg. Gjat\ufffd regjistrimit
  hyri Ali Shukriu dhe Rasim Qerkezi. A. Shukriu ishte prokuror publik p\ufffdr Kosov\ufffd
  e Rasimi ishte shef i OZN-\ufffds p\ufffdr Mitrovic\ufffd. A.Shukriu iu drejtua
  n\ufffdn\ufffds:\\n- Ti je n\ufffdna e Aziz Zhilivod\ufffds a? Lokja ia k\ufffdtheu
  :\\n- Po un\ufffd vet\ufffd!\\nA. Shukriu iu afrue dhe e kapi lok\ufffdn p\ufffdr
  flok\ufffdsh e i tha:\\n- Ti je shtriga plak\ufffd q\ufffd ke pjellur Azizin, q\ufffd
  na i ka vrar\ufffd 96 komunista, bijt\ufffd m\ufffd t\ufffd mir\ufffd t\ufffd Jugosllavis\ufffd
  s\ufffd Titos. At\ufffdher\ufffd gjyshja iu drejtua me k\ufffdto fjal\ufffd:\\n-
  Hiqi duar\ufffdt nga un\ufffd, he qen bir qeni ! Pushk\ufffd, topa e ushtri ke,
  ndjeke Azizin n\ufffdse mundesh me z\ufffdn\ufffd. N\ufffd at\ufffd moment gruas
  s\ufffd Sherif T\ufffdrrsten\ufffds i ra t\ufffd fik\ufffdt, sepse e kishin torturuar
  n\ufffd Mitrovic\ufffd, ende pa e sjellur n\ufffd Vushtrri. I kishin r\ufffdn\ufffd
  krejt thojt\ufffd e gishtave t\ufffd dor\ufffds. Nd\ufffdrsa n\ufffdna e Sherifit
  i kishte ende teshat e lagura, sepse e kishin gjuajtur n\ufffd lumin Ib\ufffdr duke
  ardhur n\ufffd Vushtrri. Pas k\ufffdtyre fjal\ufffdve, Ali Shukriu dhe Rasimi dual\ufffdn
  jasht.\\nNe vazhduam jet\ufffdn n\ufffdp\ufffdr burgje\\n- N\ufffd dim\ufffdr t\ufffd
  vitit 1947, ishte afruar koha p\ufffdr gruan e axh\ufffds ton\ufffd Hjarizit, q\ufffd
  t\ufffd lind. Gruan e axh\ufffds e liruan dhe shkoi te baba i vet\ufffd n\ufffd
  fshatin Brezhnic\ufffd. Dikur n\ufffd prill t\ufffd vitit 1948 na erdhi lajmi se
  kishte lindur djal\ufffd. Nga burgu, e kemi pag\ufffdzuar me merin Ahmet. (\ufffdsht\ufffd
  fjala p\ufffdr Ahmet Krasniqin, ministrin e ardhsh\ufffdm t\ufffd Mbrojtes s\ufffd
  Repulik\ufffds s\ufffd Kosov\ufffds dhe komandantin e FARK-ut). Burgun edhe p\ufffdr
  nj\ufffd koh\ufffd e vazhduam n\ufffd Vushtrri, e nj\ufffd pjes\ufffd t\ufffd koh\ufffds
  edhe n\ufffd burgun fam\ufffdkeq t\ufffd Prishtin\ufffds. N\ufffd vitet 1949-50,
  na k\ufffdthyen prap n\ufffd burgun e Vushtrris\ufffd. Pasi shkijet i mbush\ufffdn
  burgjet me shqiptar\ufffd, na d\ufffdrguan prap n\ufffd burg privat (sht\ufffdpi
  private). N\ufffd shtator t\ufffd vitit 1950, na liruan prej burgut dhe u k\ufffdthyem
  t\ufffd d\ufffdrmuar n\ufffd Zhilivod\ufffd. Edhe pas burgut nuk p\ufffdrfunduan
  ndjekjet dhe p\ufffdrndjekjet. Ishim edhe n\ufffd skamje t\ufffd madhe. Ndihm\ufffdn
  m\ufffd t\ufffd madhe me ushqim dhe veshmbathje na e kan\ufffd dh\ufffdn\ufffd dajt\ufffd
  e Hades. Por,\\nBajram dhe Selim Zuk\ufffdn prej Likashanit, e burgos\ufffdn nipin
  Xhemajl Preniqin e Hades dhe mikun, Is\ufffd Preniqin e Hades. Shkijet burgos\ufffdn
  edhe shum\ufffd burra n\ufffd at\ufffd koh\ufffd si: Ilaz Xhemajl Dervishollin me
  v\ufffdllaun Sadikun, shum\ufffd burra nga fshati Dobrashevc dhe lagjja e Morin\ufffdve
  t\ufffd Akrashtic\ufffds s\ufffd Vushtrris\ufffd, pastaj dajt\ufffd e bab\ufffdgjyshit
  nga Kutllovci i Shal\ufffds s\ufffd Bajgor\ufffds. K\ufffdshtu, p\ufffdsuan t\ufffd
  gjith\ufffd miq\ufffdt dhe dashamir\ufffdt ton\ufffd duke i mbushur burgjet prej
  Nishit e deri n\ufffd Goli Otok.\\nFamilja jon\ufffd nuk kishte asnj\ufffd t\ufffd
  drejt\ufffd, as qytetare as njer\ufffdzore. Na e humb\ufffdn edhe t\ufffd drejt\ufffdn
  e shkollimit. Mirreshim vet\ufffdm me pun\ufffd t\ufffd r\ufffdnda fizike. Kur shkonim
  t\ufffd punojm\ufffd tok\ufffdn ton\ufffd, duhej t\ufffd lajm\ufffdroheshim te k\ufffdshill\ufffdtar\ufffdt
  komunist t\ufffd fshatit q\ufffd ta dinin se ku gjindeshim. Kjo gjendje ka vazhduar
  deri pas plenumit t\ufffd Brioneve t\ufffd vitit 1966, ku sllavokomunist\ufffdt
  i kan\ufffd q\ufffdruar hesapet mes veti. Pas Plenumit, kemi marr\ufffd frym\ufffd
  m\ufffd lirisht dhe i kemi kryer shkollat privatisht. Un\ufffd Faiku i Azizit mbarova
  shkoll\ufffdn fillore, t\ufffd mesme dhe shkoll\ufffdn e lart\ufffd, t\ufffd gjitha
  privatisht. Poashtu edhe v\ufffdllau im i vog\ufffdl Shaipi. M\ufffd von\ufffd q\ufffd
  t\ufffd dyt\ufffd u pun\ufffdsuam n\ufffd Elektroekonomin\ufffd e Kosov\ufffds.
  Por m\ufffd von\ufffd, rifilloi ndjekja e familjes son\ufffd. Mua m\ufffd p\ufffdrjashtuan
  nga vendi i pun\ufffds. Shaipi operohet nga nj\ufffd shp\ufffdrthim i gjakut n\ufffd
  kok\ufffd dhe m\ufffd von\ufffd emigroi n\ufffd Suedi me gjith\ufffd familjen e
  tij, ku edhe tani gjendet. Pas demonstratave t\ufffd vitit 1981, shkijet e burgoes\ufffdn
  djalin e axh\ufffds Hjariz, Behxhetin, i cili q\ufffd nga viti 1977 ishte an\ufffdtar\ufffdsuar
  nga Xhafer Durmishi n\ufffd nj\ufffd organizat\ufffd ilegale q\ufffd vepronte p\ufffdr
  t\ufffd mir\ufffdn e Kosov\ufffds dhe lirin\ufffd e saj. Behxheti mbajti gati dy
  vite burg. N\ufffd vitin 1992, pasi u shakt\ufffdrruan shtyllat e rrym\ufffds elektrike
  t\ufffd tensionit t\ufffd lart\ufffd, t\ufffd cilat kalojn\ufffd n\ufffdp\ufffdr
  Zhilivod\ufffd dhe bartin rrym\ufffdn p\ufffdr Mal\ufffd t\ufffd Zi, policia serbe
  fshatit Zhilivod\ufffd ia shtoi zullumin. K\ufffdshtu p\ufffdrve\ufffd rrahjeve
  p\ufffdr vdekje q\ufffd p\ufffdsuan, Shefki Islam Kraniqi, Jakup Bajram Krasniqi,
  Hashim Bejt\ufffd Krasniqi, Hajra Galan Krasniqi, Rrahim Hysen Krasniqi etj, i gjith\ufffd
  fshati u detyrua t\ufffd l\ufffdshoj\ufffd sht\ufffdpit\ufffd e veta dhe, p\ufffdr
  tre muaj, u strehua n\ufffd malet e Qyqavic\ufffds. Behxheti duke iu fal\ufffdnderuar
  Shefki Islamit shp\ufffdtoi nga ky tmerr dhe iku n\ufffd Gjermani, ku gjendet edhe
  sot me familjen e tij t\ufffd ngusht\ufffd.\\nKujtime nga burgu\\nGjat\ufffd koh\ufffds
  sa ishim n\ufffd burg 1947-48 n\ufffd Vushtrri, axh\ufffds Hjariz, Qerkinit dhe
  Qerimit ua vun\ufffd prangat n\ufffd k\ufffdmb\ufffd me nga 45 kg. p\ufffdr cop\ufffd.
  Qerkinin dhe Qerimin i d\ufffdrguan n\ufffd burgun e Mitrovic\ufffds e pastaj n\ufffd
  burgun e Prishtin\ufffds dhe i denuan me nga tre vjet burg. Burgun e vujt\ufffdn
  n\ufffd burgun e Nishit. Nd\ufffdrsa ne mbet\ufffdm n\ufffd burgun e Vushtrris\ufffd.
  Dua ta theksoj se n\ufffd vitin 1948 kemi vuajtur p\ufffdr kafshat\ufffdn e goj\ufffds.
  Kujdesin p\ufffdr ushqim e mori p\ufffdrsip\ufffdr halla Fat\ufffd, motra e bab\ufffds
  dhe Jakupi, djali i axh\ufffds Qerkin, i cili p\ufffdsoi m\ufffd s\ufffd shumti
  ngase ishte i ri (13 vje\ufffd). Jakupi dhe grat\ufffd e Qerkinit dhe Qerimit ishin
  n\ufffd liri. Derisa ishim n\ufffd burg, n\ufffd kull\ufffdn ton\ufffd ishte vendosur
  OZN-a me 110 ushtar\ufffd. Pas pastrimeve etnike, n\ufffd polici shqip\ufffdtar\ufffdt
  jan\ufffd larguar nga vendi i pun\ufffds p\ufffdr arsye absurde si: pse nuk je i
  martuar, apo pse je i martuar etj. Komandir burgu ishte nj\ufffd Din\ufffd Bajraktari
  nga Gjakova. Ky na sillte miell misri p\ufffdr t\ufffd b\ufffdr\ufffd qull sa p\ufffdr
  t\ufffd mos vdekur urie. Ndjej obligim familjar t\ufffd them se edhe f\ufffdmija
  i f\ufffdmij\ufffds ton\ufffd i ka borxh q\ufffd ta kujtoj\ufffd me respekt t\ufffd
  lart\ufffd Dinin, i cili fatkeq\ufffdsisht m\ufffd von\ufffd edhe ka p\ufffdsuar,
  sepse u d\ufffdnua me 20 vjet burg t\ufffd r\ufffdnd. Pas nj\ufffd kohe kam d\ufffdgjuar
  se Dini kishte strehuar ka\ufffdakun e maleve t\ufffd Karadakut t\ufffd Gjilanit,
  Hasan Ali Kerenikun. Pas burgosjes dhe denimit t\ufffd Dinit, Hasan Aliun e kan\ufffd
  qitur n\ufffd prit\ufffd dhe e kan\ufffd v\ufffdrar\ufffd n\ufffd vitin 1958. K\ufffdto
  fjal\ufffd i thash p\ufffdr t\ufffdi b\ufffdr\ufffd homazh publikisht, se i kemi
  borxh Din\ufffd Bajraktarit.\\nPas ardhjes s\ufffd komunist\ufffdve n\ufffd pushtet
  as plis p\ufffdr krye t\ufffd shqiptarit nuk po gjindet n\ufffd k\ufffd v\ufffdnd.\\nPasi
  serb\ufffdt i muar\ufffdn burgjet n\ufffd dor\ufffd, b\ufffdnin \ufffdmos p\ufffdr
  ta mposhtur popullin shqiptar. Burgjet i mbushnin p\ufffdr \ufffddo dit\ufffd me
  shqiptar\ufffd nga vise t\ufffd ndryshme t\ufffd Kosov\ufffds, sidomos nga Artakolli,
  Drenica dhe Shala etj. Por nat\ufffdn sikur i p\ufffdrbinte terri shqiptar\ufffdt.
  Nj\ufffd pjes\ufffd t\ufffd tyre, shkijet i kan\ufffd vrar\ufffd e masakruar para
  sht\ufffdpis\ufffd s\ufffd Popit, af\ufffdr kalas\ufffd s\ufffd Vushtrris\ufffd.
  M\ufffd von\ufffd, k\ufffdto varreza masive jan\ufffd zbuluar me rastin e nd\ufffdrtimit
  t\ufffd ambulanc\ufffds s\ufffd re n\ufffd Vushtrri. N\ufffd burgun e Vushtrris\ufffd
  m\ufffd kujtohen edhe disa burra tjer\ufffd si: Sherif T\ufffdrrnava dhe Veli Aliu
  nga Zhilivoda, t\ufffd cil\ufffdt dinin p\ufffdr mbledhjet e ballist\ufffdve. Veliun
  e kishin mbajtur n\ufffd nj\ufffd kosh t\ufffd Badivik\ufffdve t\ufffd Vushtrris\ufffd.
  Ashtu t\ufffd zbathur dhe t\ufffd zdeshur e soll\ufffdn n\ufffd \ufffdeli t\ufffd
  burgut. Mishi i k\ufffdmb\ufffdve i kishte r\ufffdn\ufffd nga t\ufffd ftoftit. Dini
  na i solli disa lak\ufffdra turshi nga qyteti dhe gjyshja jon\ufffd, Sherifja, me
  ndihm\ufffdn e Dinit, ia ka mjekuar Veliut k\ufffdmb\ufffdt me lak\ufffdra, fshehtas
  nga komandanti i burgut. Xha Veliu q\ufffdndroi si burrat dhe nuk pranoi asgj\ufffd.
  Po t\ufffd pranonte ai di\ufffdka, do t\ufffdi pushkatonin s\ufffd paku edhe 120
  persona prej Bardhit deri n\ufffd Koll\ufffd. M\ufffd kujtohet edhe nj\ufffd rast
  tjet\ufffdr shum\ufffd trishtues. Nj\ufffd dit\ufffd e soll\ufffdn nj\ufffd plak,
  i cili i kishte ndihmuar materialisht dhe strehuar ballist\ufffdt. OZN-a me bashk\ufffdpun\ufffdtor\ufffde
  e vet ia kishin dhunuar vajz\ufffdn 18 vje\ufffdare. Plaku ishte nga nj\ufffd fshat
  i komun\ufffds s\ufffd Vushtrris\ufffd dhe rridhte nga nj\ufffd familje shum\ufffd
  bujare. Pas dhunimit, vjaza mbetet shtatz\ufffdn\ufffd. At\ufffd e torturojn\ufffd
  aq mizorisht sa p\ufffdr tt\ufffdi shpetuar vdekjes, ajo pranon q\ufffd e kishte
  dhunuar babai i saj. Plakun e d\ufffdnuan 15 vjet burg dhe nga turpi, p\ufffdr akuzat
  q\ufffd ia kurdisi shkijau, vdiq n\ufffd burgun e Nishit. Vajza lindi nj\ufffd djal\ufffd
  derisa po e transportonin n\ufffd burgun e Mitrovic\ufffds, nga edhe humbi \ufffddo
  lidhje me te dhe kurr\ufffd nuk \ufffdsht\ufffd ditur p\ufffdr fatin e saj. N\ufffd
  burg e soll\ufffdn edhe nj\ufffd Bajram Pasom\ufffdn. Kishte qen\ufffd burr\ufffd
  i zoti. At\ufffd e burgosin n\ufffd Vushtrri, nj\ufffd dit\ufffd kur vjen p\ufffdr
  ta bler\ufffd nj\ufffd plis t\ufffd bardh\ufffd. Pasi i shetit tri-kat\ufffdr shitore,
  t\ufffd cilat shitnin plisa nuk i bie asnj\ufffd p\ufffdr qejfi dhe b\ufffdrtet:
  - Nan\ufffdn ia q\ufffd englezit, gjermanit, amerikanit e krejt atyre q\ufffd e
  soll\ufffdn Tit\ufffdn n\ufffd pushtet, se as plis p\ufffdr krye t\ufffd shqiptarit
  nuk po gjendet m\ufffd n\ufffd k\ufffdt\ufffd vend. P\ufffdr k\ufffdto fjal\ufffd,
  Bajrami denohet me tri vjet burg. Prej torturave u \ufffdmend n\ufffd burgun e Vushtrris\ufffd.
  Ashtu i \ufffdmendur b\ufffdrtiste: - Nes\ufffdr po vritet Mustaf\ufffd Zhilivoda
  (bab\ufffdgjyshi im), nes\ufffdr po vritet Sherifja (gjyshja ime) etj\ufffdGjyshja
  frik\ufffdsohej shum\ufffd. Duke par\ufffd gjendjen ton\ufffd t\ufffd mjer\ufffd
  (t\ufffd f\ufffdmij\ufffdve t\ufffd Azizit), pa buk\ufffd e gj\ufffdra t\ufffd tjera
  shpesh thoshte: - O Zot theja qaf\ufffdn Allahut \ufffdka na b\ufffdri !!! Mendonte
  se Zoti i shqiptar\ufffdve ishte m\ufffd i madh se Allahu i musliman\ufffdve. Kur
  i binte, m\ufffd von\ufffd, n\ufffd mend thoshte: - O Zot mos ma z\ufffd p\ufffdr
  t\ufffd madhe!\\nNipi i Aziz Zhilivod\ufffds kolonel Ahmet Krasniqi\\nKolonel Ahmet
  Krasniqi (1948-1998) kreu shkoll\ufffdn teknike, dega e makineris\ufffd n\ufffd
  Prishtin\ufffd. N\ufffd vitin e dyt\ufffd t\ufffd shkoll\ufffds s\ufffd mesme u
  shpall nj\ufffd konkurs p\ufffdr Akademi Ushtarake. Ishim n\ufffd kull\ufffd duke
  ndejtur, ne djemt\ufffd e Azizit dhe Ahmeti. Un\ufffd lexoja \ufffdKujtimet e Hoxh\ufffd
  Kadris\ufffd, kryetar i Komitetit p\ufffdr Mb\ufffdrojtjen e Tokave t\ufffd Shqiptare.
  N\ufffd lexim e sip\ufffdr erdha te kapitulli \ufffdBes\ufffdlidhja e Junikut\ufffd,
  kur jan\ufffd thirr\ufffd t\ufffd gjith\ufffd krer\ufffdt e shqiptaris\ufffd. Ishte
  b\ufffdr\ufffd bes\ufffdlidhja p\ufffdr tu dalur zot trojeve shqiptare. N\ufffd
  at\ufffd bes\ufffdlidhje ka marr\ufffd pjes\ufffd edhe koloneli i xhandaris\ufffd
  s\ufffd Shkupit, Bajram Curri. M\ufffd shkoi mendja se pa kuadra t\ufffd shkolluara
  ushtarake trojet shqiptare nuk do t\ufffd \ufffdlirohen kurr\ufffd. U ul\ufffdm
  t\ufffd bisedojm\ufffd dhe n\ufffd kull\ufffdn ton\ufffd u vendos q\ufffd Ahmeti,
  pas mbarimit t\ufffd shkoll\ufffds s\ufffd mesme teknike, t\ufffd shkoj\ufffd n\ufffd
  Akademin\ufffd Ushatarake. T\ufffd nes\ufffdrmen shkova n\ufffd Prishtin\ufffd t\ufffd
  konsultohem me disa shok\ufffd rreth shkollimit t\ufffd m\ufffdtutjesh\ufffdm t\ufffd
  Ahmetit. N\ufffd shkollimin e tij, ndikimin m\ufffd t\ufffd madh e ka pasur nga
  Metush Krasniqi i Dajkovcit dhe Hyrije Hana nga Gjakova, q\ufffd banonte n\ufffd
  Prishtin\ufffd. Po ashtu edhe nga shok\ufffdt e tij Sabri Novosella dhe Shefqet
  Jashari-Strofci.\\nKur i kemi dor\ufffdzuar dokumentet n\ufffd Vushtrri, referenti
  p\ufffdr \ufffdeshtje ushtarake n\ufffd komun\ufffd, ishte nj\ufffd shqiptar i lig.
  Nuk pranoi t\ufffdi n\ufffdnshkruaj dokumentat dhe na quajti familje reaksionare
  dhe balliste. U k\ufffdthyen dokumentat n\ufffd Shtabin Krahinor. Aty ishte nj\ufffd
  major. Ai na pyeti se pse nuk i kishim n\ufffdnshkruar dokumentat n\ufffd Vushtrri?\\nI
  spjeguam se n\ufffd Vushtrri na k\ufffdthyen me pretekst se jemi familje balliste
  dhe se djemt\ufffd ton\ufffd nuk kan\ufffd drejt\ufffd t\ufffd shkollohen n\ufffd
  Akademi Ushtarake. Shfryt\ufffdzuam nga rasti dhe pyet\ufffdm majorin, sa koh\ufffd
  duhej t\ufffd zgjaste d\ufffdnimi i familjes ton\ufffd p\ufffdr k\ufffdto pun\ufffd
  dhe se, a ka fund kjo mposhtje dhe p\ufffdrbuzje familjare. Majorit ia tham\ufffd
  edhe k\ufffdto fjal\ufffd: - K\ufffdto forma t\ufffd diskriminimit t\ufffd t\ufffd
  miturve dhe f\ufffdmij\ufffdve t\ufffd baballar\ufffdve ton\ufffd, jan\ufffd d\ufffdnuar
  n\ufffd Plenumin e Brioneve dhe se d\ufffdshira jon\ufffd ishte t\ufffd integrohemi
  n\ufffd shoq\ufffdri. I treguam vuajtjet dhe peripetit\ufffd tona prej fillimit
  e deri pas Plenumit t\ufffd Brioneve dhe i tham\ufffd se ne nuk kemi nevoj\ufffd
