  edhe vitin 2023, por kaq jan\u00eb caktuar afatet).\\nSistemi i planifikimit t\u00eb
  integruar filloi zbatimin e tij n\u00eb vitin 2005, pas nj\u00eb mb\u00ebshtetje
  t\u00eb fuqishme t\u00eb partner\u00ebve tan\u00eb dhe angazhimit e p\u00ebrkushtimit
