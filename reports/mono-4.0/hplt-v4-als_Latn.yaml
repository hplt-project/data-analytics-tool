  t\u00eb trafikut.\\nN\u00eb k\u00ebt\u00eb moment, hetimet jan\u00eb ende n\u00eb
  vazhdim, dhe pritet q\u00eb informacionet e plota t\u00eb b\u00ebhen t\u00eb ditura
  pas p\u00ebrfundimit t\u00eb analizave dhe hetimeve t\u00eb detajuara.\"", "\"Kenge
