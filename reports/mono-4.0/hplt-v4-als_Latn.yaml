  \u00e7do hap t\u00eb zhvillimit ton\u00eb, n\u00eb standardet m\u00eb t\u00eb mira
  mjedisore q\u00eb ekzistojn\u00eb.\\nT\u00eb dh\u00ebnat dhe, n\u00eb fund t\u00eb
