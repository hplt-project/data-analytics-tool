  p\u00ebr Migracion (IOM) njoftoi se numri i musliman\u00ebve t\u00eb Arakanit t\u00eb
  cil\u00ebt kan\u00eb ikur nga incidentet e dhunshme n\u00eb Mianmar dhe jan\u00eb
  strehuar n\u00eb Bangladesh q\u00eb nga 25 gushti, ka arritur n\u00eb 646 mij\u00eb,
  transmeton Anadolu Agency (AA). Nj\u00ebri nga z\u00ebdh\u00ebn\u00ebsit e IOM-it,
  Leonard Doyle n\u00eb nj\u00eb konferenc\u00eb p\u00ebr media t\u00eb organizuar
  n\u00eb Zyr\u00ebn e OKB-s\u00eb n\u00eb Gjenev\u00eb tha se gjat\u00eb muajit t\u00eb
  kaluar n\u00eb rajonin Cox''s Bazar t\u00eb\\nLexo m\u00eb tep\u00ebrPapa Fran\u00e7esk
  sot e fillon udh\u00ebtimin e tij gjasht\u00ebdit\u00ebsh n\u00eb Birmani dhe Bangladesh,
  derisa pritet q\u00eb n\u00eb fokus do t\u00eb jet\u00eb nj\u00ebra prej krizave
  m\u00eb t\u00eb m\u00ebdha t\u00eb refugjat\u00ebve n\u00eb bot\u00eb. Gjat\u00eb
  vizit\u00ebs n\u00eb k\u00ebt\u00eb vend, q\u00eb njihet edhe me emrin Mianmar,
  Papa parashihet t\u00eb takohet me gjeneralin e ushtris\u00eb s\u00eb Birmanis\u00eb,
  Aung Hlaing, dhe me lideren civile, Aung San Suu Kyi, q\u00eb ishte fituese e \u00c7mimit
  Nobel p\u00ebr Paqe, transmeton\\nLexo m\u00eb tep\u00ebrSekretari amerikan i Shtetit,
  Rex Tillerson e ka p\u00ebrshkruar p\u00ebr her\u00eb t\u00eb par\u00eb si \\\"spastrim
  etnik\\\" dhun\u00ebn me t\u00eb cil\u00ebn po p\u00ebrballen musliman\u00ebt e
  Arakanit me \u00e7''rast ka theksuar se p\u00ebrgjegj\u00ebsit e masakrave duhet
  t\u00eb nxirren para drejt\u00ebsis\u00eb, transmeton Anadolu Agency (AA). Tillerson
  n\u00eb kuad\u00ebr t\u00eb vizit\u00ebs dhe bisedimeve t\u00eb zhvilluara m\u00eb
  15 n\u00ebntor n\u00eb Mianmar ka dh\u00ebn\u00eb vler\u00ebsime mbi situat\u00ebn
  e fundit n\u00eb Arakan n\u00ebp\u00ebrmjet nj\u00eb deklarate me shkrim. N\u00eb
  deklarat\u00ebn\\nLexo m\u00eb tep\u00ebrBangladeshi dhe Mianmari jan\u00eb dakorduar
  q\u00eb t\u00eb rikthehen n\u00eb territoret e tyre musliman\u00ebt e Arakanit q\u00eb
  jan\u00eb strehuar n\u00eb Bangladesh pas largimit nga mizorit\u00eb me t\u00eb
  cilat u p\u00ebrball\u00ebn, transmeton Anadolu Agency (AA). Sipas mediave t\u00eb
  Bangladeshit, m\u00ebsohet se ministrja e Pun\u00ebve t\u00eb Jashtme dhe p\u00ebrgjegj\u00ebse
  e \u00e7\u00ebshtjeve t\u00eb Presidenc\u00ebs s\u00eb Mianmarit, Aung San Suu Kyi,
