  n\u00eb nj\u00ebrin prej automjeteve t\u00eb p\u00ebrfshira.\\nNgjarja ka ndodhur
  rreth or\u00ebs 15:00, n\u00eb bypass-in Fier-Vlor\u00eb. Policia ka mb\u00ebrritur
  menj\u00ebher\u00eb n\u00eb vendngjarje dhe ka nisur hetimet p\u00ebr zbardhjen
  e shkaqeve t\u00eb aksidentit. Grupi hetimor \u00ebsht\u00eb duke punuar p\u00ebr
  t\u00eb sqaruar plot\u00ebsisht rrethanat q\u00eb \u00e7uan n\u00eb k\u00ebt\u00eb
  p\u00ebrplasje masive.\\nAktualisht, policia po punon p\u00ebr normalizimin e trafikut,
  pasi aksidenti ka shkaktuar bllokime t\u00eb konsiderueshme n\u00eb rrug\u00eb.
  Forcat e siguris\u00eb kan\u00eb marr\u00eb masa p\u00ebr t\u00eb pastruar zon\u00ebn
  dhe p\u00ebr t\u00eb lejuar kalimin e automjeteve pa pengesa.\\nKy aksident ka shkaktuar
