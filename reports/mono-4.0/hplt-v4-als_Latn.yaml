  t\u00eb SHAI \u201cArt Club\u201d.\\nIbrahim Berjashi \u00ebsht\u00eb nd\u00ebr
  autor\u00ebt e pak\u00ebt te shqiptar\u00ebt n\u00eb Malin e Zi q\u00eb tash nj\u00eb
  gjysm\u00eb shekulli merret me poezin\u00eb p\u00ebr t\u00eb vegj\u00eblit, por
  shkruan edhe proz\u00eb. N\u00eb k\u00ebt\u00eb hark kohor ka botuar shtat\u00eb
  vepra n\u00eb poezi e proz\u00eb p\u00ebr f\u00ebmij\u00eb.\\nRedaktor i librit
  \u00ebsht\u00eb Ismet Kallaba, nd\u00ebrsa p\u00ebrgatitjen teknike dhe artistike
  e ka b\u00ebr\u00eb Gazmend \u00c7itaku.\\nLibri \u00ebsht\u00eb botuar me mb\u00ebshtetjen
  e Ministris\u00eb s\u00eb Kultur\u00ebs, nd\u00ebrsa \u00ebsht\u00eb shtypur n\u00eb
  shtypshkronj\u00ebn \u201cPress Studio\u201d n\u00eb Ulqin.\\nIbrahim Berjashi ka
  botuar deri m\u00eb tash k\u00ebto libra: \u201cLule prej guri\u201d, \u201cE tej
  mal\u00ebsi e det\u201d, \u201cVeloret e bardha\u201d, \u201cLundra e humbur\u201d,
  \u201cOr\u00ebt e vetmis\u00eb\u201d, \u201cFlo\u00e7ka e liqenit\u201d, \u201cDritaren
  l\u00ebre hapur\u201d (Antologji e poezis\u00eb shqipe \u2013 bashkautor), \u201cOra
  e Rumis\u00eb\u201d, \u201cGati u harruem\u201d dhe p\u00ebrzgjedhjen e tregimeve
  p\u00ebr f\u00ebmij\u00eb \u201cSirena e liqenit\u201d. P\u00ebrmbledhja me poezi
  p\u00ebr f\u00ebmij\u00eb \u201cKungulli ziliqar\u201d \u00ebsht\u00eb libri i tij
  i nj\u00ebmb\u00ebdhjet\u00eb.\\nN\u00eb kuad\u00ebr t\u00eb veprimtaris\u00eb s\u00eb
  tij botuese \u201cArt Club\u201d, botuesi m\u00eb i madh nd\u00ebr shqiptar\u00ebt
  n\u00eb Malin e Zi, ka botuar deri tani mbi 110 libra, kryesisht t\u00eb autor\u00ebve
  shqiptar\u00eb n\u00eb Malin e Zi.\"", "\"E diela e k\u00ebsaj jave do t\u00eb jet\u00eb
  fest\u00eb e auto sportit n\u00eb Mitrovic\u00eb. N\u00eb pist\u00ebn tek ish-terminali
