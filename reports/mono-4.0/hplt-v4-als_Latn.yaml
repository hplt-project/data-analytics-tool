  k\u00ebshtu q\u00eb 23 \u00ebsht\u00eb caktuar nj\u00eb afat, mund t\u00eb shkoj\u00eb
  edhe m\u00eb gjat\u00eb). K\u00ebto jan\u00eb disa nga shtyllat kryesore ku do t\u00eb
  bazohet hartimi i strategjis\u00eb.\\nSi n\u00eb \u00e7do gj\u00eb, r\u00ebnd\u00ebsi
  esenciale ka metoda dhe metoda q\u00eb do t\u00eb p\u00ebrdorim n\u00eb hartimin
  e saj do t\u00eb jet\u00eb ajo e konsultimit m\u00eb t\u00eb gjer\u00eb t\u00eb
  mundsh\u00ebm, do t\u00eb jet\u00eb ajo e p\u00ebrthithjes s\u00eb mendimeve m\u00eb
  t\u00eb avancuara. Strategjia do t\u00eb jet\u00eb nj\u00eb dokument i gjall\u00eb
  vet\u00ebm n\u00eb rast se ajo mish\u00ebron sintez\u00ebn mendimin m\u00eb t\u00eb
  avancuar e m\u00eb t\u00eb gjer\u00eb. Ndaj kjo k\u00ebrkon nj\u00eb pun\u00eb intensive,
  konsulta t\u00eb shumta, p\u00ebr t\u00eb gjith\u00eb problematik\u00ebn q\u00eb
  do t\u00eb trajtohet. Konsulta me shoq\u00ebrin\u00eb civile, e cila \u00ebsht\u00eb
  nj\u00eb kontribuuese madhe e strategjis\u00eb ekzistuese dhe ka nj\u00eb potencial
  shum\u00eb t\u00eb r\u00ebnd\u00ebsish\u00ebm dhe mund\u00ebsi t\u00eb madhe kontribuuese
  n\u00eb hartimin e strategjis\u00eb 2013-2020. N\u00eb hartimin e k\u00ebsaj strategjie
  duhet t\u00eb ket\u00eb konsulta intensive me bot\u00ebn akademike shqiptare, konsulta
  intensive me grupet e interesit. Hartimi i saj n\u00eb asnj\u00eb rast nuk mund
  t\u00eb jet\u00eb produkt vet\u00ebm i zyrave tona. Zyrat tona kan\u00eb detyr\u00ebn
  t\u00eb b\u00ebjn\u00eb sintez\u00ebn e k\u00ebsaj konsulte t\u00eb gjer\u00eb,
  t\u00eb k\u00ebtij procesi q\u00eb synon t\u00eb mbledh\u00eb, t\u00eb sintetizoj\u00eb
  e konkretizoj\u00eb n\u00eb k\u00ebt\u00eb dokument mendimin m\u00eb t\u00eb avancuar,
  m\u00eb t\u00eb men\u00e7ur, m\u00eb vizionar q\u00eb ekziston n\u00eb shoq\u00ebrin\u00eb
  ton\u00eb. Strategjia do t\u00eb hartohet nga t\u00eb gjitha institucionet e k\u00ebtij
  vendi, p\u00ebr problematik\u00ebn p\u00ebrkat\u00ebse. Sekretariati teknik, q\u00eb
  ka edhe pesh\u00eb shum\u00eb t\u00eb r\u00ebnd\u00ebsishme, ka detyr\u00ebn ligjore
  t\u00eb monitoroj\u00eb t\u00eb gjith\u00eb procesin, t\u00eb informoj\u00eb kryetarin
  e Komitetit dhe, sipas rastit, Komitetin, mbi ecurin\u00eb dhe respektimin e kritereve
  dhe metod\u00ebs s\u00eb p\u00ebrcaktuar p\u00ebr hartimin e saj.\"", "\"Sht\u00ebpi
