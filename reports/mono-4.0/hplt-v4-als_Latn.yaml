  ri poetik \u201cKungulli ziliqar\u201d i poetit dhe shkrimtarit Ibrahim Berjashi.\\nLibri
  \u00ebsht\u00eb i mbar\u00ebshtruar n\u00eb pes\u00eb cikle, t\u00eb cil\u00ebt
