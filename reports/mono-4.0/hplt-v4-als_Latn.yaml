  K\u00ebshillin e Ministrave q\u00eb sh\u00ebrbeu si Sekretariat Teknik i k\u00ebtij
  Komiteti, q\u00eb punoi me p\u00ebrkushtim t\u00eb madh dhe ia doli t\u00eb kristalizoj\u00eb
