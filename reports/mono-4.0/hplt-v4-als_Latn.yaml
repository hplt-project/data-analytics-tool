  brigjet e Mianmarit\\\", tha z\u00ebdh\u00ebn\u00ebsi i agjencis\u00eb s\u00eb refugjat\u00ebve
  William Spindler. raporton Anadolu Agency (AA). M\u00eb shum\u00eb se 100 refugjat\u00eb
  musliman\u00eb Rohingya jan\u00eb mbytur n\u00eb fundosjen anijesh dhe incidente
