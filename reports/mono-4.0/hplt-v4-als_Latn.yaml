  p\u00ebr t\u00eb zbuluar n\u00ebse ka ndodhur p\u00ebr shkak t\u00eb kushteve t\u00eb
  k\u00ebqija t\u00eb motit, gabimeve t\u00eb shofer\u00ebve, apo ndonj\u00eb shkaqet
  tjet\u00ebr. Policia ka apeluar p\u00ebr kujdes m\u00eb t\u00eb madh nga drejtuesit
