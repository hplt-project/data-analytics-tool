  n\u00eb s\u00ebmundjen e veshkave q\u00eb zakonisht e b\u00ebn urinimin m\u00eb
  t\u00eb shpesht\u00eb dhe me ngjyr\u00eb transparente.\\nKocka t\u00eb dob\u00ebta\\nKur
