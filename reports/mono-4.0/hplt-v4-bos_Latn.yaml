  zaga\u0111enja zraka. Narator u video je devetogodi\u0161nja Licypriya Kangujam,
  aktivistica i influenserka iz Indije, koja se svijetu obratila na COP-25 konferenciji.
  Video, koji je re\u017eirao vi\u0161estruko nagra\u0111ivani re\u017eiser Airton
