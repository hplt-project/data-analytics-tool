sample: '["\"Pi\u0161e: Jeremy Corbyn, thebosniatimes.ba\\nBoris Johnson i konzervativci
  prijete da \u0107e za 6 sedmica strovaliti na\u0161u zemlju u provaliju. On za to
  nema mandat i ve\u0107i dio javnosti mu se protivi. Otkad je u julu postao premijer,
  Johnson je pora\u017een na svakom glasanju u parlamentu. Njegovi nedemokratski manevri,
  odluka da zatvori parlament i izbjegne odgovornost, sada su stigli do vrhovnog suda.
  Njegova posjeta Luksemburgu pro\u0161log ponedjeljka bilo je samo jo\u0161 jedno
  poni\u017eenje. Premijer je tamo oti\u0161ao bez plana i predloga, i izbjegao je
  sva pitanja.\\nPrije tri godine Johnson je podr\u017eao brexit jer je mislio da
  \u0107e to pogurati njegovu politi\u010dku karijeru \u2013 za svaki slu\u010daj
  je napisao jedan \u010dlanak u prilog ostanku i jedan koji podr\u017eava izlazak.
  Sad navija za izlazak bez dogovora, jer misli da \u0107e mu to donijeti politi\u010dku
  korist \u2013 da \u0107e tako povratiti glasove koji su se odlili u partiju Brexit
  i da \u0107e zadr\u017eati lojalnost ekstremnih brexitera me\u0111u torijevcima.
  Za to vrijeme se pretvara da vrijedno radi na dogovoru sa Evropom.\\nJohnsonove
  manipulacije nisu ni\u0161ta novo. Theresa May je pristala na kontradiktorne uslove
  da bi sprije\u010dila raspad Konzervativne partije, dok je David Cameron raspisao
  referendum prije svega da bi anulirao prijetnje desni\u010darskog Ukipa.\\nZa ovih
  par godina, brexit saga je bila litanija torijevskih neuspjeha, iako je svaki njihov
  premijer stavljao li\u010dne i partijske interese iznad interesa gra\u0111ana i
  na\u0161e zemlje. Sada nam prijeti opasnost da sljede\u0107eg mjeseca izletimo iz
  EU bez dogovora, samo da bi Johnson zadr\u017eao posao. Od Amber Rad, koja je dala
  ostavku na mjesto u njegovom kabinetu, saznali smo da se u postizanje dogovora sa
  EU ula\u017ee malo napora \u2013 zapravo, te\u0161ko je uo\u010diti bilo kakav znak
  stvarnog truda. Bila je to potvrda nezvani\u010dnih pri\u010da o tome da su premijerovi
  pregovori \u201eprivid\u201c i da je izlazak bez dogovora njegov pravi cilj.\\nUprkos
  njegovom protivljenju, parlament je izdjestvovao objavu povjerljivih dokumenata
  takozvane operacije \u010carobna \u0161eva,1 u kojima se postavljaju okviri pripreme
  administracije za izlazak bez dogovora. U vladinoj analizi utvr\u0111eno je da \u0107e
  Ujedinjeno Kraljevstvo biti izlo\u017eeno riziku nesta\u0161ica hrane i lijekova,
  te haosa u glavnim lukama. Tako\u0111e je otkriveno da su ministri svjesno obmanjivali
  javnost. Rekli su nam da ne\u0107e biti nesta\u0161ica hrane i lijekova, dok su
  njihovi interni izvje\u0161taji pokazali da \u0107e ih biti.\\nOperacija \u010carobna
  \u0161eva je podigla uloge. Johnsonov nerazuman brexit bez dogovora je prijetnja
  za radna mjesta i \u017eivotni standard, a utjecao bi i na rast cijena hrane. Tako\u0111e
  bi otvorio put jednostranom trgovinskom sporazumu sa Donaldom Trumpom, u \u010dije
  bi se pregovore u\u0161lo sa slabije pregovara\u010dke pozicije.\\nTo ne bi bio
  brexit bez dogovora, ve\u0107 brexit sa Trampovim dogovorom, dok hrlimo ka dnu s
  pravima i za\u0161titama na\u0161ih gra\u0111ana prodatim ameri\u010dkim korporacijama.\\nOdsustvo
  dogovora nije nikakav \u201e\u010disti rez\u201c, kako to neki zami\u0161ljaju,
  poslije koga \u0107emo samo produ\u017eiti dalje. To bi u stvari bio po\u010detak
  nove ere konfuzije i usporavanja, sa \u010ditavim nizom novih sporazuma sa EU koje
  treba ispregovarati \u2013 ali ovoga puta u atmosferi rastu\u0107e nezaposlenosti,
  osiroma\u0161enja i iseljenja \u010ditavih industrija iz zemlje.\\nLaburisti\u010dka
  stranka \u0107e u\u010diniti sve \u0161to je potrebno da zaustavi kobni izlazak
  bez dogovora i da sprije\u010di posljedi\u010dni haos, poreme\u0107aje i gubitke
  radnih mjesta \u2013 a posebno ozbiljnu prijetnju koju bi takav epilog predstavljao
  za mirovni proces u Sjevernoj Irskoj. Zato smo u saradnji sa drugim partijama u
  parlamentu radili na dono\u0161enju zakona koji bi sprije\u010dio nesigurni izlazak
  iz EU krajem oktobra.\\nKada jednom izlazak bez dogovora bude uklonjen sa dnevnog
  reda, a premijer prinu\u0111en da se pridr\u017eava zakona, bit \u0107e nam potrebni
  op\u0107i izbori kako bismo se otarasili Johnsonove torijevske vlade. Na tim izborima
  \u0107e se odlu\u010divati o mnogo va\u017enijim pitanjima od brexita. Bit \u0107e
  to izbor izme\u0111u laburisti\u010dke vlade s jedne strane, koja \u0107e bogatstvo
  i vlast predati u ruke ve\u0107ine, a sa druge Johnsonovih konzervativaca ro\u0111enih
  da vladaju koji \u0107e brinuti za privilegiranu nekolicinu. Bit \u0107e to izbor
  za one koji \u0107e zaista okon\u010dati javnu \u0161tednju i donijeti promjene
  koje su Britaniji potrebne, koji \u0107e investirati u svaki region i svaku naciju
  na\u0161e zemlje, koji \u0107e obnoviti javne slu\u017ebe, zajednice i industriju.\\nBritanski
  narod zaslu\u017euje priliku da se izjasni na op\u0107im izborima. Samo \u0107e
  laburisti\u010dka vlada zaustaviti krizu izazvanu brexitom, vra\u0107aju\u0107i
  odluku o tome gra\u0111anima. Mi \u0107emo im dati zavr\u0161nu rije\u010d u izboru
  izme\u0111u vjerodostojne ponude za izlazak ili ostanak u EU.\\nLaburisti\u010dka
  vlada bi obezbijedila razuman dogovor, zasnovan na uslovima za koje se ve\u0107
  dugo zala\u017eemo, uklju\u010duju\u0107i novu carinsku uniju sa EU, blisku povezanost
  na jedinstvenom tr\u017ei\u0161tu i garancije radni\u010dkih prava i ekolo\u0161ke
  za\u0161tite. Zatim bismo takav dogovor stavili na javno glasanje naspram ostanka.
  Obavezat \u0107u se da kao laburisti\u010dki premijer sprovedem ono \u0161to gra\u0111ani
  odlu\u010de.\\nMi smo jedina stranka spremna va\u017ene odluke zaista prepustiti
  gra\u0111anima Britanije. Johnson \u017eeli da iza\u0111emo iz EU bez dogovora.
  Tome se protive biznis, industrija, sindikati i ve\u0107i dio javnosti \u2013 pa
  \u010dak i suorganizator kampanje za izlazak, Michael Gove, koji je po\u010detkom
  ove godine rekao: \u201eNismo glasali za izlazak bez dogovora.\u201c\\nSada liberalni
  demokrati \u017eele da poslanici preokrenu rezultat referenduma opozivom \u010clana
  50 kroz parlamentarnu manipulaciju. Naprosto je nedemokratski pogaziti odluku ve\u0107ine
  glasa\u010da bez njihovog ponovnog izja\u0161njavanja.\\nLaburisti su jedina partija
  odlu\u010dna okupiti gra\u0111ane i prepusti im kona\u010dnu rije\u010d. Samo glas
  za laburiste \u0107e omogu\u0107iti glasanje o brexitu. Samo \u0107e laburisti\u010dka
  vlada vratiti mo\u0107 gra\u0111anima. Zaustavimo brexit bez dogovora \u2013 a onda
  neka gra\u0111ani odlu\u010de.\\n(TBT, The Guardian)\"", "\"Brazil \u0107e takmi\u010denje
  po\u010deti utakmicom protiv Bolivije, 14. juna u Sao Paolu.\\nSelektor Brazila
  Tite slo\u017eio se sa ocenom da je njegova ekipa imala sre\u0107e u \u017erebu.\\n-
  Svesni smo toga, ali isto tako smo svesni i \u010dinjenice da moramo da igramo dobro
  kako bismo dobili te utakmice - rekao je Tite.\\nArgentina je sme\u0161tena u Grupu
  B zajedno sa Kolumbijom, Paragvajem i gostuju\u0107om reprezentacijom, selekcijom
  Katara.\\nU Grupi C aktuelni \u0161ampion, reprezentacija \u010cilea, Urugvaj, Ekvador
  i Japan, jo\u0161 jedna gostuju\u0107a reprezentacija na turniru.\\nPrva dva tima
  iz svake grupe, kao i dva najbolja tre\u0107eplasirana plasira\u0107e se u \u010detvrtfinale.\\nKup
  Amerike igra\u0107e se od 14. juna do 7. jula za kada je zakazano finale na Marakani.\\nCentar
  Portland Trejlblejzersa Jusuf Nurki\u0107 uputio je na Tviteru negativan komentar
  na ra\u010dun ministra zdravlja Republike Srpske Alena...\\nMladi \u0161toper, koji
  je svojevremeno igrao i za na\u0161e mla\u0111e reprezentativne kategorije Dominik
  Dinga, pro\u0161log leta je do\u0161ao u Partizan kao...\\nFudbala, ko\u0161arke,
  tenisa, odbojke, hokeja nema u skoro svim zemljama sveta, pa je i sportistima nalo\u017eeno,
  kao i ostatku naroda, da sede...\\nKOMENTARI\"", "\"Dr \u0110uro Musi\u0107, \u010duveni
  ratni hirurg u nevesinjskoj bolnici i humanista\\nIz podgori\u010dkog Klini\u010dko-bolni\u010dkog
  centra do\u0161ao je u Nevesinje 1.7.1993. da provede godi\u0161nji odmor operi\u0161u\u0107i
  ranjenike u Domu zdravlja, a ostao sedam godina, uradiv\u0161i oko 1.700 malih i
  velikih operacija, spasavaju\u0107i i vojnike i civile. Dr Musi\u0107 \u010duven
  je po tome \u0161to mu nijedan ranjenik kog je operisao - nije umro! Hirurg bez
  ijednog smrtnog slu\u010daja ipak ne \u017eeli da se hvali time. \u201eJa sam puno
  pacijenata operisao, ali za njih desetak \u0161to su pre\u017eivjeli - mislim da
  je to bila Bo\u017eja sila\u201c, jednostavno ka\u017ee\\nIzlet Slavka Podgoreleca
  u staru Banjaluku\\nPodgorelec, izme\u0111u ostalog, \u201eotkriva\\\" da su prvu
  elektri\u010dnu sijalicu u Banjaluci (1899. godine) upalili sve\u0107enici trapisti
  osam godina prije Zagreba, da je Banjaluka 1617. otvorila prvu kafanu, a Pariz 54
  godine kasnije, dok je Be\u010d za Banjalukom kasnio 66 godina, da smo prvi na Balkanu
  sagradili hidrocentralu...\\nFinansijska kriza u Evropskoj uniji\\nTr\u017ei\u0161na
  ekonomija odvija se samo jo\u0161 u ud\u017ebenicima. U praksi poku\u0161aji spasavanja
  prenijeli su rizik na poreske obveznike, a finansijska tr\u017ei\u0161ta oslobo\u0111ena
  su preduzetni\u010dke odgovornosti\\nDo bra\u010dnog druga preko agencije \u201eNikad
  nije kasno\u201c\\nLjubanova \u201elista kvaliteta\u201c koju budu\u0107a djevojka
  ili supruga treba da ispunjavaju, poprili\u010dno je duga. Izme\u0111u ostalog,
  \u201eprava\u201c mora u vlasni\u0161tvu da ima stan ili ku\u0107u, ne smije \u201ebiti
  ru\u017ena\u201c, ni starija od 35 godina, a po\u017eeljno je i da nema djecu\\nIntervju:
  Rajko Grli\u0107 \u2013 Re\u017eiser\\nVolim pri\u010dati pri\u010de, igrati se
  glumcima, u\u017eivam snimaju\u0107i filmove... Filmska re\u017eija je maksimum
  manipulacije koju ljudsko bi\u0107e mo\u017ee sebi dozvoliti. Koristim to da stvorim
  svoje svjetove u trajanju od dva sata\\nIntervju: Darko Ljubojevi\u0107, sportski
  direktor FK \u201eBorac\u201c Banjaluka\\nU posljednje tri godine, klub se stabilizovao
  i krenuo uzlaznom putanjom. Potvrda toga su i rezultati koje smo postizali u tom
  vremenskom intervalu, gdje je osvojen Kup i prvenstvo BiH. \u201eBorac\u201c i u
  narednim godinama ima isklju\u010divo \u0161ampionske ambicije, mada je na\u0161
  prioritet redovan izlazak u Evropu\\nTeniski klub \u201eDr Mladen Stojanovi\u0107\u201c,
  Prijedor\\n\u201eTeniska sekcija Prijedor\u201c, formirana je i registrovana kao
  samostalna sportska organizacija 1932. godine. Na osnovu \u017eelja i prijedloga
  svojih \u010dlanova i mnogobrojnih prijatelja tenisa, 1966. godine, odlu\u010deno
  je da klub dobije novo ime \u2013 TK \u201eDr Mladen Stojanovi\u0107\u201c, u znak
  sje\u0107anja i u \u010dast svog najpoznatijeg \u010dlana, osniva\u010da organizovanog
  teniskog sporta u Prijedoru i narodnog heroja. Istovremeno je pokrenuta ideja o
  organizovanju redovnog memorijalnog turnira u \u010dast dr Mladena Stojanovi\u0107a,
  koji traje do danas\\n|\"", "\"Prava drama odvijala se ju\u010der na Ilid\u017ei,
  gdje se sastao Izvr\u0161ni odbor Fudbalskog saveza BiH.\\nSve je bilo spremno za
  promociju novog selektora fudbalske A reprezentacije, a to je trebao biti Ivaylo
  Petev.\\nIako nema podr\u0161ku navija\u010da i ve\u0107eg dijela javnosti, Vico
  Zeljkovi\u0107, predsjednik FSRS i budu\u0107i predsjednik FSBiH, poku\u0161ao je
  \\\"autoritativno\\\", kao \u0161to je navikao, nametnuti svoje rje\u0161enje (priznao
  da je Zvjezdan Misimovi\u0107 bio njegova marioneta tako \u0161to je nakon razgovora
  sa kandidatima predlo\u017eio i \\\"aminovao\\\" bugarskog stru\u010dnjaka koji
  je zapravo njegova \u017eelja).\\nZeljkovi\u0107ev plan, podr\u017ean delegatima
  iz takozvanih \u017eupanijskih saveza (hrvatskog naroda u BiH), na kraju nije pro\u0161ao
  jer su Bo\u0161njaci \\\"ulo\u017eili veto\\\".\\nStoga je bila razumljiva ljutnja
  dvojice \u010dlanova IO iz FSRS, koji su pred novinarima rigali vatru na predsjednika
  Elvedina Begi\u0107a, optu\u017eiv\u0161i ga da nije do\u0161ao na sjednicu IO,
  ali je \\\"izvr\u0161io pritisak na bo\u0161nja\u010dke \u010dlanove IO da ne glasaju
  za Peteva\\\".\\nIpak, da je obra\u0107anje medijima bio \\\"folklor\\\", kako bi
  znao re\u0107i legendarni trener \u0106iro Bla\u017eevi\u0107, moglo se zaklju\u010diti
  kada je nekoliko sati kasnije Irfan Duri\u0107, jedan od prozvanih Bo\u0161njaka,
  potvrdio kako nije bilo nikakvog pritiska od predsjednika Begi\u0107a.\\nA \u0161ta
  se zapravo dogodilo, za\u0161to su Bo\u0161njaci \\\"odbili\\\" Zeljkovi\u0107a
  i njegovog Peteva?\\nKako saznaje Faktor, prije sjednice Izvr\u0161nog odbora, odr\u017ean
  je sastanak na kojem su bili Duri\u0107, Muhidin Ra\u0161\u010di\u0107, Nurdin Pe\u0161tali\u0107,
  Muhamed Begagi\u0107 i Midhet Saraj\u010di\u0107, koji su zauzeli zajedni\u010dki
  stav po pitanju eventualnog glasanja.\\n- Nije bilo nikakvog telefonskog sastanka
  kako tvrdi Zeljkovi\u0107, niti nas je zvao predsjednik Begi\u0107. I ostale dvije
  komponente u Izvr\u0161nom odboru imaju takve sastanke. Za\u0161to je sada sporno
  \u0161to smo se mi sastali? S obzirom na to da Emir Spahi\u0107 i Zvjezdan Misimovi\u0107
  (\u010dlanovi stru\u010dne komisije, op. a.) nisu dostavili jedinstven prijedlog,
  odnosno jedno ime, smatramo da Petev nije najbolje rje\u0161enje i da treba tra\u017eiti
  dalje - potvrdili su za Faktor bo\u0161nja\u010dki \u010dlanovi u IO FSBiH.\\nIpak,
  na sjednici Komisije za izbor selektora (Begi\u0107 nije prisustvovao, a \u010dlanovi
  su jo\u0161 i Milorad Sofreni\u0107, Ivan Beus, Duri\u0107 i Zeljkovi\u0107), dogodilo
  se ne\u0161to zbog \u010dega su Bo\u0161njaci zamjerili Duri\u0107u.\\nOn je, kako
  je sino\u0107 tvrdio, Sofrani\u0107u, Beusu i Zeljkovi\u0107u rekao da podr\u017eava
  Sergeja Barbareza (Spahi\u0107ev prijedlog), ali se na kraju priklonio kolegama
  kako bi odluka na Komisiji bila 4:0 za Peteva (uz obja\u0161njenje da je preglasan
  i da ne\u0107e podr\u017eati bugarskog trenera na sjednici IO, ukoliko ovaj prijedlog
  bude na glasanju).\\nVjerovatno je Duri\u0107 bio uvjerljiv pa je ubijedio Zeljkovi\u0107a
  i Sofreni\u0107a da ne\u0107e podr\u017eati Peteva, odnosno da bugarski stru\u010dnjak
  ne\u0107e dobiti dovoljan broj glasova...\"", "\"U Novom Gradu danas je je obilje\u017eeno
  29 godina od stradanja Srba u Pogromu \\\"Oluja\\\", hrvatskoj vojno-policijskoj
  akciji u kojoj je iz Banije, Like, Korduna i sjeverne Dalmacije protjerano vi\u0161e
  od 220.000 Srba, te ubijeno i nestalo 1.903.\\nU Hramu Svetih apostola Petra i Pavla
  slu\u017een je parstos a nakon toga uz saobra\u0107ajnicu od Hrama prema Mostu spasa
  na rijeci Uni prislu\u017eene su svije\u0107e, sa mosta na rijeci Uni spu\u0161tni
  su vijenci.\\nU avgustu 1995. godine ovaj most pre\u0161lo je 100.000 izbjeglica
  iz Republike Srpske Krajine, uglavnom sa podru\u010dja Banije, Korduna i Like.\\nU
  Svodni , gdje je hrvatska avijacija ga\u0111ala izbjegli\u010dku kolonu polo\u017eeno
  je cvije\u0107e kod spomen-krsta u ovom mjestu koji je 2012. godine podigao \\\"Veritas\\\"
  za \u0161est civila stradalih u avgustu 1995. godine.\\nDirektor Dokumentaciono-
  informacionog centra \\\"Veritas\\\" Savo \u0160trbac rekao je danas da se na ovim
  prostorima \u017eivi pravosudna istina te da ima vremena za reviziju presude me\u0111unarodnog
  suda pravde za operaciju \\\"Oluja\\\".\\n\u0160trbac je rekao da se idu\u0107e
  godine navr\u0161ava 30 godina od operacije \\\"Oluja\\\".\\n\\\"Veritas je uputio
  dopis Akademiji nauka i umetnosti Srbije /SANU/ da bude pokrovitel\u0458 me\u0111unarodnog
  skupa . \u010cinjenica je da smo svi na ovim prostorima nezadovl\u0458ni radom i
  presudama me\u0111unarodnih sudova, prije svih Srbi\\\", rekao je \u0160tbac .\\nPrema
  njegovim rije\u010dima, s druge strane ovim presudama se ne suprostavl\u0458a nau\u010dna
  istina.\\n\\\"Za\u0161to da to ne uradimo ako nismo zadovol\u0458ni pravosudnom,
  sudskom istinom jer \u017eivimo istinu kako su je sudovi utvrdili\\\", rekao je
  on.\\n\u0160trbac ka\u017ee da je odgovor SANU-a da 30 godina nije dovol\u0458na
  vremenska distanca za takav skup te da nisu dostupne arhive.\\nOn je rekao da je
  minuli rat, u odnosu na druge, bio mnogo transparentnijui te da su arhive miliom
  ili silom u me\u0111unarodnim sudovima i uz dobru volju dostupne.\\n\\\"SANU je
  odbila, javio se Institut za noviju istoriju, Muzej \u017ertava genocida i univerziteti
  koji su vol\u0458ni da s nama organizuju me\u0111unarodni skup , da svi iznesu svoja
  mi\u0161l\u0458enja i da onda potvrdimo ili opovrgnemo sudsku istinu\\\", rekao
  je on.\\n\u0160trbac je rekao da je u Oluji poginulo i nestalo 1.903 l\u0458udi,
  od kojih je 1.246 civila me\u0111u kojima 563 \u017eene.\\nPrema njegovim rije\u010dima,
  jo\u0161 uvijek je na spisku nestali 623 l\u0458udi.\\nNa\u010delnik op\u0161tine
  Novi Grad Miroslav Drl\u0458a\u010da rekao je da u avgustu 1995. godine vi\u0161e
  od 100.000 Srba protjeranih iz Banije, Like, Korduna i sjeverne Dalmacije pre\u0161lo
  u Novi Grad.\\n\\\"Ve\u0107ina njih je u tom trenutku znala da se vi\u0161e nikad
  ne\u0107e vratiti. Hrvati slave Pirovu pobjedu jer prostor sa kojeg su protjerali
  Srbe polako umire\\\", rekao je on.\\nDrl\u0458a\u010da ka\u017ee da je tu\u017eno
  \u0161to za ovaj egzodus Srba niko nije odgovarao.\\nHrvatska vojno-policijska akcija
  \\\"Oluja\\\" po\u010dela je 4. avgusta 1995. godine ofanzivom hrvatske vojske i
  policije, te jedinica HVO-a na podru\u010dju Banije, Like, Korduna i sjeverne Dalmacije.\\nDan
  kasnije, 5. avgusta, hrvatska vojska je u\u0161la u gotovo napu\u0161ten Knin i
  istakla zastavu Hrvatske, dok su kolone izbjeglica preko srpskih teritorija u BiH
  krenule ka Srbiji.\"", "\"Ju\u010de su na adrese \u010dlanova neformalne grupe gra\u0111ana
  Pravda za Davida stigla dva sudska rje\u0161enja, koja nesumljivo ukazuju na bahatost
  kako policijskih struktura, tako i gradskih vlasti grada Banja Luka. Da li je pravda
  zaista dosti\u017ena i po\u010dinje li sa ovim etapa ka\u017enjavanja represije
  i bahatosti, ostaje nam da vidimo.\\nZa doga\u0111aje koji su se odigrali 20. septembra
  2018. godine ispred PU Banja Luka, a kojima je predhodio napad na Davora Dragi\u010devi\u0107a
  od strane penzionisanog pripadnika MUP-a iz Br\u010dkog \u0110or\u0111a Markovi\u0107a,
  MUP RS je teretio 27 lica za prekr\u0161aje iz Zakona o javnom redu i miru i Zakona
  o javnom okupljanju. Ovaj slu\u010daj je pred sudom predstavljen 3. decembra pro\u0161le
  godine i tom prilikom sudija Dijana Gluhakovi\u0107 je zahtijevala od Ministarstva
  unutra\u0161njih poslova kao podnosioca tu\u017ebenog zahtjeva, dopunu dokumentacije
  kojom je trebalo da se jasno uka\u017ee na pojedina\u010dne prekr\u0161aje svakog
  od navedenih 27 lica . Rok za dostavu dopune dokumentacije je bio 30 dana. Kako
  iz PU Banja Luka nisu u datom roku izvr\u0161ili tra\u017eenu dopunu, Osnovi sud
  je ovaj zahtjev za pokretanje prekr\u0161ajnog postupka odbacio kao neosnovan, te
  su se \u201corgani reda\u201d na ovakvu odluku Osnovnog suda \u017ealili Okru\u017enom
  sudu u Banja Luci, koji je u sudskom odlu\u010divanju 06. jula ove godine tako\u0111e
  ovu \u017ealbu odbacio kao neosnovanu.\\nVi\u0161e se zaista ne zna ni broj sudskih
  postupaka koji su zavr\u0161eni i koji se tek trebaju okon\u010dati pred sudom,
  a koje je MUP RS pokrenuo protiv ovih aktivista. Do sada niti jedan od postupaka
  nije rezultirao ka\u017enjavanjem po gra\u0111ane, \u0161to jasno ukazuje na evidentno
  kr\u0161enje ljudskih prava ovim gra\u0111anima i zloupotrebu slu\u017ebenog polo\u017eaja.
  Pripadnici grupe Pravda za Davida su sa svojim advokatima najavili preduzimanje
  pravnih postupaka prema svim pripadnicima MUP-a koji su u ovome u\u010destvovali,
  a nesumljivo je da \u0107e ove sudske odluke biti jedan od klju\u010dnih dokaza
  u procesima koje \u0107e oni voditi pred sudovima.\\nPo\u010detkom aprila pro\u0161le
  godine aktivisti su napravili akciju \u010di\u0161\u0107enja sme\u0107a na obali
  rijeke Crkvene , na mjestu na kojem je godinu dana prije toga prona\u0111eno be\u017eivotno
  tijelo mladi\u0107a Davida Dragi\u010devi\u0107a. Nakon \u0161to su cijeli teren
  o\u010distili , od prirodnih materijala su napravili simboli\u010dni spomenik ovom
  mladi\u0107u, kao znak sje\u0107anja na njegovu pogibiju i podsje\u0107anja svih
  gra\u0111ana na ubistvo koje nije rije\u0161eno. Tom prilikom su posadili i dvije
  mlade sadnice dunje, koje su imale simboliku \u201cpravde\u201d i \u201cistine\u201d.
  Samo dan nakon \u0161to je ovo obilje\u017eje postavljeno, komunalna policija grada
  Banja Luka je pokidala sadnice i uklonila svaki djeli\u0107 ovog simboli\u010dnog
  spomenika. Nakon uklanjanja ovog \\\"po \u017eivot opasnog materijala\\\" ostavili
  su na mjestu stradanja mladi\u0107a \u201cporuku\u201d u vidu rje\u0161enja od strane
  gradske uprave kojim je nalo\u017eeno uklanjanje objekata sa obale rijeke,a koji
  su prema \u010dlanu zakona koji je naveden u obrazlo\u017eenju \u201cpredstavljali
  opasnost po \u017eivot i zdravlje ljudi\u201d.\\n\u010clan grupe Pravda za Davida
  i aktivista Ozren Perduv je tada podnio \u017ealbu gradskoj upravi na ovakvu odluku,
  koju su oni odbili rje\u0161enjem izdatim 31. jula 2019. godine. Aktivisti nisu
  bili zaustavljeni ovakvom odlukom i odlu\u010dili su da pokrenu upravni spor tu\u017ebom
  pred Okru\u017enim sudom u Banja Luci, a u me\u0111uvremenu su konstantno iz dana
  u dan obnavljali ovaj simboli\u010dni spomenik sa\u0111enjem cvije\u0107a i paljenjem
  svije\u0107a, a koji bi odmah sutradan bio ponovo uklonjen od strane komunalne policije.
  Prkos ovih ljudi je bio zadivljuju\u0107i , kao i njihova ogromna volja i snaga
  da svaki put ponovo urede mjesto na kojem je David prona\u0111en. 13. jula ove godine
  Okru\u017eni sud je donio presudu po pitanju ovog upravnog spora koji je pokrenut
  od strane Ozrena Perduva zajedno sa advokatom Milanom Male\u0161evi\u0107em. U presudi
  koja je napisana na 7 stranica vrlo jasno se ukazuje na nelogi\u010dne i bahate
  postupke gradskih vlasti i poni\u0161tava se akt koji je donio grad Banja Luka.\\nOve
  dve odluke Okru\u017enog suda u Banja Luci su donesene u razmaku od 7 dana, a na
  adrese aktivista su stigle u istom danu. Da li to zna\u010di da je 16. juli dan
  kojim je po\u010delo raskrinkavanje represije koja se vodi pod pla\u0161tom zakona
  i da li \u0107e borba ovih aktivista zaista donijeti promjene i bu\u0111enje ostalih
  uspavanih gra\u0111ana, ostaje nam da vidimo, ali je neosporna \u010dinjenica da
  su sudovi svojim odlukama jasno ukazali da svo ovo vrijeme zakon kr\u0161en na \u0161tetu
  ovih gra\u0111ana.\\nAutor : Slobodna rije\u010d\\nFoto : Facebook grupa Pravda
  za Davida\"", "\"Nakon \u0161to su mediji objavili kako je Njema\u010dka na sastanku
  politi\u010dkog i sigurnosnog komiteta Evropske unije zatra\u017eila uvo\u0111enje
  sankcija protiv zvani\u010dnika u Republici Srpskoj, te da se Ma\u0111arska usprotivila
  toj inicijativi, \u0161ef ma\u0111arske diplomatije Peter Sijarto u ekskluzivnom
  intervjuu za BHT1 ka\u017ee da Ma\u0111arska smatra kako sankcije nisu alat broj
  jedan, jer sve dosada\u0161nje sankcije koje je uvodila Evropska unija nisu postigle
  rezultate.\\nU intervjuu je, izme\u0111u ostalog, odgovorio i na pitanje ho\u0107e
  li Viktor Orban nakon Banje Luke posjetiti i Sarajevo.\\n\u201cMeni se ne svi\u0111a
  pravac u kojem se razvija vanjska politika Evropske unije. Po onome \u0161to sada
  vidim jedini alat evropske vanjske politike postaju sankcije. \u0160ta god se desi
  bilo gdje u svijetu, odgovor iz brisela su sankcije, sankcije i sankcije. Ako pogledate
  u pro\u0161lost, nijedne nisu doprinijele postizanju cilja koji se \u017eeli ostvariti
  sankcijama\u201c, kazao je on.\\n\u201cNaprotiv, postignuti su druga\u010diji rezultati
  od o\u010dekivanih. I zato mislim da su konsultacije i dijalog mnogo va\u017eniji
  i bolji na\u010din da se upravlja razli\u010ditim stvarima. Generalno, nismo razgovarali
  samo o pitanjima BiH, nego smo razgovarali cijelom Zapadnom Balkanu. Mislim da je
  situacija ovdje dosta tu\u017ena, ne zbog vas, nego zbog nas, zbog EU. Jer EU je
  jako spora, izuzetno spora i ne prihvata integracije. Pro\u0161irenje eu se treba
  ubrzati, u suprotnom \u0107emo izgubiti zamah, jer u geopolitici ne postoji vakuum,
  neko ce uci, neko ce zauzeti nasu poziciju. Kada razgovaramo o Z. Balkanu sa ministrima
  vanjskih poslovca eu vecina kolega se zali na cinjenicu da postoje drugi akteri
  drugi akteri.\u201d\\nDo sada mogu\u0107e sankcije protiv Dodika su tek spominjane
  u nekim politi\u010dkim izazovima, naglasio je Sijarto za BHRT.\\n\u201cNije do\u0161lo
  nekog konkretnog politi\u010dkog prijedloga, nije ponu\u0111en nikakv nacrt, tako
  da ne postoji neki problem kome \u0107emo se protiviti. Mi smo samo jasno rekli
  da ne mislimo da su sankcije alat broj jedan u takvim situacijama, jer opet podsje\u0107am
  na do\u0161adasnja isksutva. Sankcije koje je nametala EU nisu bili nikakvi rezultati.
  Ono sto ja mislim da treba uraditi, i to sam savjetovao kolegama, da do\u0111ete
  u u BiH, razgovarate sa duznosnicima u Sarajevo i Banjaluku i poku\u0161ate razumjeti
  kakva je situacija i ponudite pomo\u0107 i rje\u0161enje.\u201d\\nIntervju je objavljen
  nakon Dnevnika, u 19 sati i 25 minuta.\"", "\"U Bosni i Hercegovini se danas o\u010dekuje
  prete\u017eno obla\u010dno vrijeme sa padavinama \u0161to uklju\u010duje ki\u0161u,
  ali i snijeg tokom ve\u010dernjih sati.\\nPrije podne je u Hercegovini mogu\u0107a
  slaba ki\u0161a. Do kraja dana o\u010dekuje se lokalna pojava grmljavine. U vi\u0161im
  podru\u010djima centralne i isto\u010dne Bosne i na planinama o\u010dekuje se susnje\u017eica
  ili snijeg.\\nU kasnim ve\u010dernjim satima, snijeg ili susnje\u017eica se mogu
  o\u010dekivati i u nizinama centralne i isto\u010dne Bosne.\\nVjetar slab do umjeren
  ju\u017eni. Krajem dana i tokom no\u0107i vjetar u skretanju na sjeverni, pri \u010demu
  se u Bosni o\u010dekuju jaki do olujni udari vjetra.\\nJutarnja temperatura od 4
  do 10, a dnevna od 8 do 14, na jugu, sjeveru i sjeveroistoku Bosne do 18 \u00b0C.\\nKi\u0161ovito
  i prete\u017eno obla\u010dno vrijeme bi se trebalo nastaviti i u narednim danima.\\nPro\u010ditajte
  vi\u0161e: U BiH danas ki\u0161a i obla\u010dno vrijeme\"", "\"Mnogobrojni trgovci
  oko grani\u010dnog prelaza Gradi\u0161ka, koji su nekada odli\u010dno zara\u0111ivali,
  danas jedva odr\u017eavaju u \u017eivotu otkako se, kako tvrde, dobrano srozala
  kupovna mo\u0107 Hrvata!\\nOni za SrpskaCafe pri\u010daju da se slabija kupovna
  mo\u0107 posebno osje\u0107a nakon ulaska kom\u0161ija pod okrilje Evropske unije.\\n\u2013
  U zadnjih pet godina mnogi ovda\u0161nji trgovinski, pa i ugostiteljski objekti
  su morali da stave klju\u010d u bravu zbog opadanja zarade. Nisu mogli da izdr\u017ee
  namete bez adekvatnog pazara \u2013 navode na\u0161i sagovornici.\\nI Milojka Dragi\u010devi\u0107,
  vlasnica jedne od trgovinskih radnji blizu grani\u010dnog prelaza potvr\u0111uje
  za SrpskaCafe pad kupovne mo\u0107ni kod dr\u017eavljana Hrvatske i ostalih stranaca.\\n\u2013
  Izgleda da je velika kriza ne samo u Hrvatskoj ve\u0107 i u inostranstvu, zato \u0161to
  smo nekada imali redovne mu\u0161terije koje su dolazile gotovo svake sedmice, a
  sada ih vi\u0111amo jednom u dva, tri mjeseca \u2013 isti\u010de Dragi\u010devi\u0107eva
  \u010dija je prodavnica zatrpana gajbama O\u017eujskog, Karlova\u010dkog i Pan piva.\\nOna
  dodaje da je kod grani\u010dnog prelaza nekada bilo daleko vi\u0161e ljudi, prodavnica
  i robe, a sada i poznata buvlja pijaca u Gradi\u0161ci krizira.\\n\u2013 Pola tezgi
  na buvljaku je zatvoreno \u2013 navodi na\u0161a sagovornica.\\nTo potv\u0111uju
  i trgovci sa buvljaka koji isti\u010du da i ono malo robe \u0161to prodaju, pazare
  Slovenci, koji svakog drugog vikedna dolaze u organizovanim grupama.\\nKada je rije\u010d
  o Hrvatima, oni obi\u010dno kupuju cigarete, alkoholna pi\u0107a, gorivo i drugu
  robu, jer je u BiH ni\u017ei PDV nego u njihovoj zemlji.\\n\u2013 Ove ru\u010dne
  radove od vune, \u010darape, kape i ovo \u0161to heklam mogu sada prodati samo ako
  naletim na nekakve bogatije ljude. Pro\u0161la su vremena kada se od ovoga znalo
  dobro zaraditi \u2013 ka\u017ee baka koja juri od automobila do automobila da bi
  ponudila svoje rukotvorine.\\nSli\u010dno tvrdi i omanja grupa \u0161vercera cigareta
  i narodnja\u010dkih cd-ova, dodaju\u0107i da svi koji \u017eive od granice mogu
  o\u010dekivati bolje prihode samo u danima velikih gu\u017evi na prelazu.\\nI dok
  odlazimo, sre\u0107emo par lokalaca koji uglas ka\u017eu da je grani\u010dni prelaz
  dobar samo za one koji \u017eive od granice, dok je za mje\u0161tane lo\u0161.\\n\u2013
  U Gradi\u0161ci je sve puno skuplje. Cijene su nam znatno vi\u0161e nego u Banjaluci
  i ako su Hrvati ostali bez love, mo\u017eete misliti kakav bijedan standard mi imamo
  \u2013 ka\u017eu ovi Gradi\u0161\u010dani.\\nM. \u010cabarkapa\\nBesplatnu Android
  aplikaciju portala SrpskaCafe preuzmite ovdje.\"", "\"Prema podacima Svjetske zdravstvene
  organizacije, alarmiraju\u0107a je \u010dinjenica da ve\u0107ina djece na svijetu,
