  "\"Prodaja vozila na evropskom tr\u017ei\u0161tu ponovo je porasla u avgustu, pokazali
  su podaci Evropskog udru\u017eenja proizvo\u0111a\u010da automobila (ACEA).\\n\\\"U
  avgustu je u Evropskoj uniji (EU) registrovano 787,63 hiljade novih automobila,
  21 odsto vi\u0161e nego u istom pro\u0161logodi\u0161njem mjesecu\\\", naveli su
  iz ACEA, napominju\u0107i da je potra\u017enja u posljednjem ljetnjem mjesecu obi\u010dno
  slabija.\\nU julu je njihov broj uve\u0107an 15,2 odsto, prenosi Hina.\\nPodaci
  pokazuju da se period ja\u010danja potra\u017enje za novim automobilima u EU produ\u017eio
  na ne\u0161to vi\u0161e od godinu, odra\u017eavaju\u0107i, izme\u0111u ostalog,
  nisku usporednu osnovicu u pro\u0161loj godini, povezanu s nesta\u0161icom dijelova.\\nU
  grupi vode\u0107ih tr\u017ei\u0161ta, najvi\u0161e je porasla prodaja u Njema\u010dkoj,
  37,3 odsto. Slijede Francuska i Italija sa skokom potra\u017enje 24,3 odsto odnosno
  11,9 odsto. Najskromniji rast zabilje\u017eila je \u0160panija, 7,8 odsto.\\nNajve\u0107i
  pad prodaje zabilje\u017eila je Ma\u0111arska, 10,4 odsto. Slijedi Slovenija gdje
  je smanjena tri odsto.\\nU prvih osam ovogodi\u0161njih mjeseci, tr\u017ei\u0161te
  automobila u EU poraslo je 17,9 odsto u odnosu na isti pro\u0161logodi\u0161nji
  period, uz registrovanih 7,1 miliona novih vozila.\\n\\\"Rezultat nagovje\u0161tava
  oporavak evropske automobilske industrije od pandemijskih poreme\u0107aja\\\", smatraju
  u ACEA-i, upozoriv\u0161i ipak da je obim prodaje i dalje 21 odsto manji nego u
  pretpandemijskoj 2019. godini.\\nVe\u0107ina tr\u017ei\u0161ta zabilje\u017eila
  je dvocifrene stope rasta, uklju\u010duju\u0107i \u010detiri najve\u0107a, pa je
  tako prodaja u \u0160paniji i Italiji porasla ne\u0161to vi\u0161e od 20 odsto,
  a u Francuskoj i Njema\u010dkoj oko 17 odsto.\"", "\"Danas je u online formatu odr\u017eana
  sve\u010dana promocija 5.088 diplomanata i magistranata fakulteta i akademija Univerziteta
  u Sarajevu, a dio sve\u010danosti odr\u017ean je u Domu mladih u Sarajevu kojoj
  su prisustvovali rektor prof. dr. Rifat \u0160krijelj, prorektori Univerziteta u
  Sarajevu i dekani fakulteta i akademija.\\n\u0160krijelj je tokom obra\u0107anja
  kazao kako se sve\u010danost odr\u017eava u izmijenjenom obliku zbog pandemije.
  Tom prilikom podsjetio je kako UNSA postoji 71 godinu za vrijeme kojeg je bio i
  ostao generator razvoja i progresa cijele Bosne i Hercegovine.\\n\u201cUniverzitet
  u Sarajevu po principu duhovne gravitacije okuplja sve glavne potencijale u sferi
  nauke, duhovnosti i umjetnosti i predstavlja sna\u017enu potporu cjelokupnom obrazovnom
  sistemu u na\u0161oj zemlji. U nadolaze\u0107em vremenu o\u010dekivanja i zahtjevi
  od dru\u0161tva prema univerzitetima su sve ve\u0107i. Zato je na\u0161a osnovna
  misija i vizija stavljanje mladog \u010dovjeka u fokus saznanja i istra\u017eivanja,
  kako bi mogao odgovoriti na sve izazove sutra\u0161njice. Pored na\u0161e opredijeljenosti
  za produkciju savremenih i dinami\u010dnih studijskih programa, na Univerzitetu
  u Sarajevu, kao univerzitetu sa vlastitom tradicijom koji je sa\u010duvao svoju
  multietni\u010dnost i multikulturalnost, decenijama se ba\u0161tini uva\u017eavanje
  drugog i druga\u010dijeg, \u0161to je dovelo do toga da studenti i profesori osje\u0107aju
  svoj univerzitet kao mjesto vlastitog izrastanja.\\nIzazovi na kraju druge dekade
  21. stolje\u0107a bili su ogromni za \u010ditavo \u010dovje\u010danstvo. Jo\u0161
  jednom se pokazalo da su nauka i znanje kao i nau\u010dnoistra\u017eiva\u010dki
  rad presudni u kreiranju i opstanku \u017eivota i civilizacijskih vrijednosti koje
  ba\u0161tinimo.\\nStoga nas svaki put raduje promocija nove generacije diplomanata
  i magistranata Univerziteta u Sarajevu koja budi nadu i od koje se o\u010dekuje
  da ostvari vrijedna dostignu\u0107a koja \u0107e svima nama biti od koristi i koja
  \u0107e bosanskohercegova\u010dko dru\u0161tvo u\u010diniti boljim mjestom za \u017eivot
  svih nas.\\nDragi diplomanti i magistranti, danas kada slavimo va\u0161 uspjeh i
  rezultate va\u0161ih nastojanja i postignu\u0107a, u \u010dasu kada poslije vi\u0161egodi\u0161njeg
  upornog rada i odricanja i zvani\u010dno postajete nosioci akademskih titula, \u017eelim
  vam \u010destitati u ime akademske zajednice i u svoje ime i poru\u010diti sljede\u0107e:
  Da biste odr\u017eali korak sa vremenom, ne\u0107e vam biti dovoljno da samo producirate
  nove ideje i proizvode, morat \u0107ete, prije svega ostalog, da mijenjate sebe
  stalno iznova, jer kako se ritam promjena ubrzava, tako \u0107e i va\u0161a odgovornost
  biti sve ve\u0107a, a va\u0161e kompetencije sve tra\u017eenije. Budite slobodni
  ljudi i ne dopustite nikom da vam oduzme pravo na izbor stava i pravo na izbor vlastitog
  puta, jer \u2013 studiraju\u0107i na Univerzitetu u Sarajevu \u2013 vi ste stekli
  znanja kojima \u0107ete ne samo mijenjati stvarnost svih nas nego i graditi bolju
  i ljep\u0161u budu\u0107nost. Budu\u0107nost je uvijek te\u0161ko predvidjeti; ona
  je plod nu\u017enosti, slu\u010dajnosti, sudbine i volje. Zato ona u odre\u0111enoj
  mjeri zavisi i od vas samih, \u0161ta od nje \u017eelite i \u0161ta \u0107ete s
  njom u\u010diniti. Zada\u0107a svake nove generacije, pa i va\u0161e, jeste da svojim
  znanjem i djelovanjem u dru\u0161tvu unosi promjene koje \u0107e biti generatori
  napretka i prosperiteta. Vi ste ti koji ste svojim znanjem i kompetencijama pozvani
  da mijenjate svoje okru\u017eenje kao svjedoci i sudionici koji ho\u0107e ne samo
  da \u017eive nego i da znaju za \u0161ta \u017eive. Nau\u010dite biti va\u017eni
  i ponosni na sebe, jer zavr\u0161etkom studija vi ulazite u jedan potpuno novi svijet,
  svijet u kome vam ni\u0161ta ne\u0107e biti dato, a opet \u0107e sve biti zadato.
  To je svijet u kome ne smijete biti zadovoljni time \u0161to razumijete ideje, nego
  se uvijek morate pitati \u0161ta one donose i kako se\\nostvaruju. Jo\u0161 jednom,
  vama i va\u0161im porodicama iskreno \u010destitam na ovom velikom uspjehu i \u017eelim
  svako dobro u privatnom i javnom \u017eivotu\u201d, kazao je rektor u obra\u0107anju.\\nDenis
  Zvizdi\u0107, zamjenik predsjedavaju\u0107eg Predstavni\u010dkog doma Parlamentarne
  skup\u0161tine BiH koji je bio u ulozi gosta kazao je kako je jedna od klju\u010dnih
  uloga univerziteta je da podstakne kriti\u010dki duh razmi\u0161ljanja, izgradi
  stvarala\u010dki odnos prema dru\u0161tvenim tokovima i procesima.\\n\u201dU vremenu,
  dalekose\u017enijih globalnih promjena, \u010diju dinamiku bez obzira na sve politi\u010dke
  ekonomske, dru\u0161tvene i aktuelne pandemijske probleme, s kojima se u na\u0161oj
  domovini suo\u010davamo, moramo neizostavno pratiti i \u010dije ishode nije lako
  predvidjeti, BiH kao dr\u017eava, mi kao dru\u0161tvo i akademska zajednica i univerziteti,
  a posebno UNSA, kao najve\u0107i i najpresti\u017eniji univerzitet u BiH, moraju
  nastaviti sa svojom dosada\u0161njom misijom izgradnje dru\u0161tva znanja, obrazovanja
  generacija kojima \u0107e istra\u017eiva\u010dki potencijal i inovativnost postati
  okosnice ubrzanog razvoja\u201d, rekao je Zvizdi\u0107.\\nPoru\u010dio je kako je
  bh. dru\u0161tvu neophodan sistem ljudskih vrijednosti \u010diji fundament mora
  biti jaka, moralna supstanca, efikasan obrazovni sistem sa aplikativnim znanjima
  i vje\u0161tinama te jasnim vrijednosnim kriterijima na kojima se mo\u017ee izgraditi
  prosperitetno dru\u0161tvo znanja i jednakih \u0161ansi.\\n\u201dVe\u017eite svoje
  profesionalne i personalne perspektive za BiH i njenu evropsku vrijednost. Bez vas
  to ne\u0107e biti mogu\u0107e uraditi. Sa vama mo\u017eemo govoriti o progresivnoj
  i prosperitetnoj budu\u0107nosti BiH jer va\u0161e vrijeme neminovno dolazi\u201d,
  rekao je Zvizdi\u0107.\\nMinistar obrazovanja, mladih i nauke KS Anis Krivi\u0107
  kazao je kako je obrazovanje paso\u0161 za budu\u0107nost.\\n\u201dUniverzitet kako
  visoko\u0161kolska institucija vas oblikuje i pravi od vas armiju ljudi, koji \u0107e
  razvijati na\u0161u dr\u017eavu, na\u0161e dru\u0161tvo, ekonomiju, tehnologiju,
  diplomatiju, pravosu\u0111e i opet ono zbog \u010dega smo svi ovdje, a bez \u010dega
  ne bismo imali razvijena dru\u0161tva, obrazovanje. S druge strane, vidjeli smo
  va\u0161u borbu, va\u0161e bu\u0111enje. Glasno ste govorili i tra\u017eili ispunjenje
  svojih zahtjeva. To \u0107e vas uvijek \u010dekati. Ako \u017eelite da vidite promjene,
  budite glasni, borbeni, inovativni i \u0161irite nau\u010deno ovdje u BiH. Obrazovanje
  je jednostavno du\u0161a dru\u0161tva dok prelazi s jedne generacije u drugu. Prije
  svega, ostanite ovdje i unaprijedite na\u0161u zemlju\u201d, istakao je Krivi\u0107.\\nU
  okviru sve\u010danosti je predstavljeno 200 dobitnika posebnih priznanja Univerziteta
  u Sarajevu: \u201dZlatna zna\u010dka Univerziteta u Sarajevu\u201d, \u201dSrebrena
  zna\u010dka Univerziteta u Sarajevu\u201d i \u201dPovelja Univerziteta u Sarajevu\u201d.\\nNa
  osnovu odluke Senata Univerziteta u Sarajevu, najuspje\u0161niji studenti prvog
  i drugog ciklusa studija primili su posebna priznanja.\\nU prvom ciklusu studija
  46 diplomanata je odlikovano \u201cZlatnom zna\u010dkom\u201d, najvi\u0161im priznanjem
  Univerziteta u Sarajevu, \u201dSrebrenom zna\u010dkom\u201d je odlikovan 81 diplomant,
  a \u201dPovelju Univerziteta\u201c u Sarajevu dobila su dva diplomanta.\\nMe\u0111u
  studentima drugog ciklusa studija 16 magistranata odlikovano je \u201dZlatnom zna\u010dkom\u201d,
  34 \u201dSrebrenom zna\u010dkom\u201c i tri studenta su dobila \u201dPovelju Univerziteta
  u Sarajevu\u201d. U integriranom studijskom programu I i II ciklusa jedan student
  je odlikovan \u201dZlatnom zna\u010dkom\u201d, a 17 studenata \u201cSrebrenom zna\u010dkom\u201d.\\nNajbolji
  studenti prvog ciklusa studija u 2020. godini sa prosjekom 10,00 su Tarik \u010corbo
  sa Ma\u0161inskog fakulteta i Adisa Boli\u0107 sa Prirodno-matemati\u010dkog fakulteta.
  Najbolji student drugog ciklusa studija u 2020. godini sa prosjekom 9,95 je Demir
  Papi\u0107 sa Prirodno-matemati\u010dkog fakulteta.\\n\u201dIzlazi sjajna generacija
  mladih ljudi koja zavr\u0161ava jedan period \u017eivota i prelazi u drugi , gdje
  \u0107e svoje svoje znanje koristiti za dobrobit dr\u017eave i dalje se usavr\u0161avati
  i prenositi znanje budu\u0107im generacijama. Pri\u010da moje generacije je u nastajanju
  i tek treba da bude ispri\u010dana, a okosnica pri\u010de se temelji na znanju,
  hrabrosti, visoko postavljenim eti\u010dkim i profesionalnim standarima\u201c, rekao
  je Papi\u0107.\\nPatria\"", "\"\u201cU Veliku Britaniju sam prvenstveno oti\u0161la
  kao Chevening stipendista Ministarstva vanjskih poslova Velike Britanije. Ova stipendija
  se dodjeljuje u vi\u0161e od 100 zemalja svijeta najboljim studentima i studentima
  s iskustvom u odre\u0111enom sektoru, s ciljem da se mladi vrate u svoje domovine
  kako bi razvijali sektore za koje su se educirali. Kao stipendista aplicirala sam
  za telekomunikacijsko i IT pravo na Univerzitetu Strathclyde u Glasgowu. Ovaj studij
  je najstariji magisterij IT prava u svijetu\u201d, po\u010dela je svoju pri\u010du
  Harbinja.\\nNakon zavr\u0161enog magisterija i visokog prosjeka profesorica Lilian
  Edwards predlo\u017eila joj je da se prijavi na oglas za stipendiju za doktorski
  studij na istom univerzitetu. I tu stipendiju je Edina dobila te je nastavila \u017eivot
  u Velikoj Britaniji, upisav\u0161i doktorat o temi \u201cPrijenos digitalnog vlasni\u0161tva
  poslije smrti na razli\u010ditim nalozima na internetu\u201d.\\n\u201cKlju\u010dne
  ta\u010dke studija bile su dru\u0161tvene mre\u017ee, email i videoigrice. Prije
  nego \u0161to sam formalno zavr\u0161ila doktorat, dobila sam stalni posao predava\u010da
  na Univerzitetu Hertfordshire, sjeverno od Londona, gdje sam radila \u010detiri
  godine. Nakon toga sam preselila u Birmingham, gdje sam dobila posao na Univerzitetu
  Aston u zvanju docenta\u201d, govori Harbinja.\\nOsim predavanja i rada sa studentima
  na Astonu, na\u0161a sagovornica bavi se i istra\u017eivanjem u oblastima prava
  na privatnost, za\u0161titu li\u010dnih podataka, slobodu izra\u017eavanja, regulaciju
  interneta i novih tehnologija.\\n\u201cMoja u\u017ea oblast je jo\u0161 uvijek pravo
  privatnosti nakon smrti i naslje\u0111ivanje digitalnog vlasni\u0161tva i podataka.
  Moj doktorat \u0107e uskoro biti objavljen u formi knjige, a objavila sam i desetine
  stru\u010dnih \u010dlanaka. Aktivno sara\u0111ujem i s velikim tehnolo\u0161kim
  kompanijama, kao \u0161to su Google, Facebook i Twitter. Naprimjer, u junu ove godine
  sam bila u posjeti Facebooku, u njihovom sjedi\u0161tu u Menlo Parku kod San Francisca.
  Tamo smo razgovarali o mom istra\u017eivanju i njihovim rje\u0161enjima za profile
  umrlih korisnika\u201d, poja\u0161njava Harbinja.\\nNo, ni tu nije kraj njenim uspjesima.
  Edina je nedavno zavr\u0161ila postdiplomski studij u oblasti biznisa i menad\u017ementa
  u visokom obrazovanju, a u slobodno vrijeme volontira kao \u010dlanica nadzornog
  odbora u nevladinoj organizaciji Open Rights Group koja se bavi aktivizmom i za\u0161titom
  digitalnih prava. Osim toga, \u010dlanica je upravnog odbora srednje \u0161kole
  koju poha\u0111aju djevoj\u010dice od 11 do 18 godina s migrantskom pozadinom. U\u010de\u0161\u0107e
  se, ka\u017ee nam, ne pla\u0107a, nego se smatra \u010da\u0161\u0107u.\\nMada danas
  kupi plodove svog rada, njeni po\u010deci su, ka\u017ee nam, bili veoma te\u0161ki.\\n\u201cS
  obzirom na to da je stipendija pokrivala samo osnovne tro\u0161kove, bilo je potrebno
  privi\u0107i se na sasvim druga\u010diji obrazovni i pravni sistem. Malo lak\u0161e
  mi je bilo prilagoditi se novoj kulturi i mentalitetu i brzo sam stekla \u0161irok
  krug prijatelja, porijeklom iz raznih krajeva svijeta. No, bilo je te\u0161ko prilagoditi
  se studentskom na\u010dinu \u017eiota. Prvi put sam \u017eivjela u studentskom domu
  u svojoj 27. godini. Moj posao i istra\u017eivanje zahtijeva stalno u\u010denje,
  usavr\u0161avanje, rad s medijima, vladinim i nevladinim institucijama te pra\u0107enje
  razvoja tehnologije. To nije uvijek jednostavno, a posebno je nekad te\u0161ko uskladiti
  sve to s privatnim \u017eivotom. Ipak, ne mogu se po\u017ealiti i moram priznati
  da sam u\u017eivala u tom putu do sada\u201d, iskrena je Harbinja.\\nSvoj posao,
  ka\u017ee nam, shvata veoma ozbiljno, jer on sa sobom nosi veliku odgovornost.\\n\u201cDio
  obrazovanja i razvoja mladih osoba je i u mojim rukama i to je, naravno, velika
  odgovornost. Osim toga, moja istra\u017eivanja utje\u010du na razvoj uslova kori\u0161tenja
  velikih kompanija, politike i legislative Velike Britanije i drugih zemalja te i
  u tome le\u017ei doza odgovornosti. Ne mislim da je ovaj posao te\u017ei zbog \u010dinjenice
  da sam \u017eena. Podjednako je odgovoran kao i za moje kolege mu\u0161karce. S
  druge strane, kao feministica, posebno sam posve\u0107ena podr\u0161ci svojim studenticama
  i radu na razvoju njihovog samopuzdanja, ambicije i drugih vje\u0161tina koje im
  mogu biti od koristi u karijeri i \u017eivotu. Trudim se da ih motiviram da ispolje
  svoju individualnost, da se ostvare, budu beskompromisne i hrabre\u201d, isti\u010de
  ova uspje\u0161na Bosanka.\\nU Bosnu i Hercegovinu i rodno Sarajevo Edina dolazi
  najmanje dva puta godi\u0161nje. Ka\u017ee, u zavisnosti od poslovnih obaveza. No,
  sretna je, dodaje, da je okru\u017eena ljudima koje voli i da ima podr\u0161ku porodice
  i prijatelja.\\n\u201cU Velikoj Britaniji, a i u BiH, okru\u017eena sam ljudima
  koji me prihvataju, shvataju, cijene, podr\u017eavaju i vole. Ako uzmemo u obzir
  obje zemlje, to je prili\u010dno veliki krug ljudi razli\u010ditog dru\u0161tvenog
  i ekonomskog porijekla. Dio mojih prijatelja ima akademsku pozadinu i radi na univerzitetima
  u Velikoj Britaniji i BiH, dio njih su aktivisti, neki rade za vladine institucije,
  privatni sektor, a mnogi od njih su i studenti, muzi\u010dari, umjetnici\u2026 Moja
  cijela porodica \u017eivi u Sarajevu. Uz najbolje prijatelje iz Tre\u0107e gimnazije,
  roditelji, sestra, zet i sestri\u0107 su mi najve\u0107a podr\u0161ka, ali \u010desto
  i o\u0161tri kriti\u010dari te povod da preispitam svoje odluke i puteve\u201d,
  priznaje Harbinja.\\nNa koncu, kad sumira sve dosada\u0161nje rezultate, najvi\u0161e
  je, isti\u010de, ponosna na \u010dinjenicu da je uz sve izazove uspjela sa\u010duvati
  fokus na razvoj raznih sfera svog \u017eivota.\\n\u201cPri tome mislim da, bar meni,
  nije dovoljno biti ostvaren samo kroz intelektualni rad, posao ili intimne i porodi\u010dne
  veze. Moj put je uvijek uklju\u010divao i razvoj kroz umjetnost, duhovnost i sport.
  Kada bih morala izdvojiti ne\u0161to na \u0161to sam najvi\u0161e ponosna, onda
  \u0107u pribje\u0107i kli\u0161eu i re\u0107i da su to moje veze s prijateljima,
  porodicom i ljudima koji su ostavili trag u razli\u010ditim fazama mog \u017eivota.
  Ah da, bit \u0107u veoma ponosna ako istr\u010dim svoj prvi polumaraton koji se
  odr\u017eava u oktobru u Birminghamu\u201d, kroz osmijeh ka\u017ee Harbinja.\\nBiznis.ba
  / Klix.ba\"", "\"Kako se situacija u Libiji zakomplikovala, odlu\u010dili su da
  vide kakva je mogu\u0107nost saradnje i zajedni\u010dkog nastupa na nekim novim
  tr\u017ei\u0161tima. Za bh. firme saradnja sa turskim kompanijama je izuzetno va\u017ena,
  jer su najja\u010de firme imale 90 posto poslova u Libiji.\\nZa vode\u0107e bh.
  kompanije iz gra\u0111evinskog, metalnog i elektroenergetskog sektora Libija je
  bila najve\u0107e tr\u017ei\u0161te. Kako se situacija u Libiji pogor\u0161ala i
  nema naznaka kada bi se situacija mogla smiriti, bh. privrednici odlu\u010dili su
  sagledati i mogu\u0107nost otvaranja novih tr\u017ei\u0161ta.\\nAdnan Ibi\u0161evi\u0107,
  generalni direktor firme Bosna es, koja se bavi in\u017einjeringom i izvo\u0111enjem
  radova u oblasti nafte i petrohemije, ka\u017ee kako je u razgovoru sa turskim privrednicima
  otvorio mogu\u0107nost saradnje u Venecueli.\\n\u201eOno \u0161to svi mi moramo
  poku\u0161ati da uradimo je da se preorijenti\u0161emo na druga tr\u017ei\u0161ta,
  a ovo je jedna od prilika da sa na\u0161im iskrenim prijateljima iz Turske probamo
  nastupati na drugim tr\u017ei\u0161tima Bliskog istoka, a upravo sad \u010dujem
  ovdje da je Turska ozbiljan kandidat za razvijanje poslova posebno u oblasti nafte
  i petrohemije u Venecule, pa \u0107emo vidjeti. Pored toga na lokalnom tr\u017ei\u0161tu
  svi moramo poku\u0161ati da uradimo \u0161to vi\u0161e. Na\u017ealost, na\u0161e
  doma\u0107e tr\u017ei\u0161te je poprili\u010dno ograni\u010deno za kompanije iz
  oblasti in\u017einjeringa, kao i manje-vi\u0161e i za ove ostale firme o kojima
  je rije\u010d i koje su radile u Libiji\u201c, kazao je Ibi\u0161evi\u0107.\\nSaradnja
  sa turskim kompanijama \u010dini se kao dobra prilika za zajedni\u010dki nastup
  na tr\u017ei\u0161tima na kojima bh. kompanije do sada nisu bile prisutne, ka\u017ee
  Veselin Polja\u0161evi\u0107, predsjednik Vanjskotrgovinske komore BiH.\\n\u201eAzijsko-pacifi\u010dka
  zona jeste mjesto gdje se stvari de\u0161avaju, odnosno gdje su aktivnosti na vrlo
  visokom nivou i mislimo da na\u0161e kompanije mogu na\u0107i zajedni\u010dki interes.
  Kad je rije\u010d o Rusiji, o pripremama za olimpijadu, u Azerbejd\u017eanu, u Turskoj,
  na cijelom tom podru\u010dju stvarno de\u0161avaju se krupni zahvati, a na\u0161a
  operativa mislim da mo\u017ee tamo da radi dobre poslove i da zaposli i ma\u0161ine
  i ljude. S druge strane imamo dobru volju komore Turske, pa i privrednika da, da
  li u funkciji ili u obliku zajedni\u010dkog nastupa ili na duge na\u010dine, na\u0161i
  kapaciteti imaju alternativu u odnosu na ovo \u0161to imamo danas\u201c, ocjenjuje
  on.\\nOtvoreni za saradnju\\nFaruk \u010cengi\u0107, porijeklom Bosanac ali ro\u0111en
  u Turskoj, ima gra\u0111evinsku firmu i raspolo\u017een je za saradnju sa bh. privrednicima
  na tre\u0107im tr\u017ei\u0161tima.\\n\u201eZainteresovanost postoji. Naro\u010dito
  ako se udru\u017ee kapaciteti, mo\u017eemo raditi zajedno i na ve\u0107im projektima.
  Naravno, i projekti i ideje bh. firmi su itekako dobro do\u0161le\u201c, poru\u010duje
  \u010cengi\u0107.\\nSinan Civril, iz kompanije koja se bavi savjetovanjem za razvoj,
  ka\u017ee da je zainteresovan za saradnju sa firmama iz tog sektora. Ina\u010de,
  njegova firma anga\u017eovana je u Kataru i nekim drugim arapskim zemljama.\\n\u201eVjerujem
  da turski privrednici mogu investirati i u BiH znatna sredstva, ali naravno ukoliko
  do\u0111e do politi\u010dke stabilizacije ovdje. Trenutno je to glavna prepreka.
  Ako se situacija stabilizuje, mi smo itekako zainteresovani za investiranje u cijeli
  ovaj region, jer je ovo interesantno podneblje, sa velikim potencijalima. Naravno,
  mi smo imali priliku sara\u0111ivati sa bh. firmama u inostranstvu i imamo jako
  dobra iskustva\u201c, navodi Civril.\\nEnver Ajanovi\u0107, izvr\u0161ni direktor
  firme Euroasfalt, \u010dlanice grupacije BH. konzorcija, ka\u017ee kako su imali
  priliku sara\u0111ivati sa turskim firmama svojevremeno i u Iraku, potom u Libiji,
  te da ima jo\u0161 mnogo tr\u017ei\u0161ta na kojima mogu nastaviti sardanju.\\n\u201eVelike
  firme s kojima smo zajedno radili na izgradnji ogromne brane u Iraku. Taj projekat
  je bio vrijedan milijardu i 700 miliona dolara. Rat je po\u010deo, u\u010dinio je
  svoje i imali smo velike gubitke i mi i oni itd. BH. konzorcij je velika firma.
  Pojedina\u010dno svaka firma u konzorciju radi samostalno. Trenutno na\u0161a firma
  radi sa joint venture firmom jednom u Abu Dabiju, gdje radimo uglavnom in\u017einjering,
  zna\u010di menad\u017ement. Radna snaga je njihova. I sad smo isto u fazi u dogovaranja
  sa joint venture firmom Al-sidijem iz Saudijske Arabije, koji je trenutno u Sarajevu.
  S te strane mi kao Euroasfalt ve\u0107 imamo neke saradnje sa drugim stranim firmama.
  Kao grupacija tako\u0111er idemo na vanjsko tr\u017ei\u0161te. Sad je bio Balkan
  Biznis Forum, u Americi gdje su i\u0161li na\u0161i predstavnici iz Konzorcija i
  preko ameri\u010dkih firmi nastojimo da u\u0111emo na ira\u010dko tr\u017ei\u0161te,
  gdje bismo mogli sa turskim firmama zajedni\u010dki napravimo joint venture i zajedni\u010dki
  organizujemo projekata. Mi smo otvoreni za saradnju sa svima njima, tu smo da na\u0111emo
  zajedni\u010dki jezik i da izvr\u0161avmo projekte\u201c, kazao je Ajanovi\u0107.\\nVanjskotrgovinska
  komora BiH uskoro priprema i poslovne susrete sa privrednicima iz Norve\u0161ke,
  Pakistana, \u010ce\u0161ke, koji bi mogli rezultirati saradnjom i sa kompanijama
  iz tih zemalja.\\nKriza u arapskom svijetu\\nAnalize, komentare, intervjue, fotografije
  i videa o me\u0111unarodnoj akciji protiv Libije, kao i o situaciji u Egiptu i drugim
  arapskim zemljama nakon protesta i promjena, mo\u017eete na\u0107i ovde.\"", "\"8.
  3. 2022.\\n\u010cestitamo Me\u0111unarodni dan \u017eena svim gra\u0111ankama i
  gra\u0111anima u Republici Srbiji!\\nIako su u dosada\u0161njem periodu postignuti
  zna\u010dajni rezultati, pa je na \u010delu Vlade Republike Srbije premijerka, imamo
  dve potpredsednice, samu Vladu \u010dini skoro 50% \u017eena, u parlamentu ima skoro
  40% \u017eena, doneti su relevantni zakoni i strategije, polo\u017eaj \u017eena
  treba dodatno unapre\u0111ivati.\\nSrbiji je do pune rodne ravnopravnosti potrebno
  59 godina. U biznis sektoru je samo 4% \u017eena na rukovode\u0107im pozicijama,
  dok 56% \u017eena ima ni\u017eu platu od svojih kolega, a nepla\u0107eni rad \u017eene
  ve\u0107i od prose\u010dne plate u Srbiji, \u017eene iz vi\u0161estruko marginalizovanih
  grupa su u jo\u0161 nepovoljnijem polo\u017eaju.\\nU posebno te\u0161kom polo\u017eaju
  su \u017eene iz pojedinih kategorija: Romkinje, \u017eene sa invaliditetom, \u017eene
  iz rurala, starije \u017eene, LBT \u017eene. One su u mnogo lo\u0161ijem polo\u017eaju
  u Srbiji i imaju ote\u017ean pristup pravima i uslugama iz oblasti obrazovanja,
  socijalne za\u0161tite, zdravstva, zapo\u0161ljavanja, za\u0161tite od nasilja i
  diskriminacije. U riziku su od vi\u0161estruke diskriminacije, izlo\u017eene su
  specifi\u010dnim oblicima nasilja i u lo\u0161ijem su polo\u017eaju i u pore\u0111enju
  sa \u017eenama iz op\u0161te populacije i u pore\u0111enju sa mu\u0161karcima iz
  svojih grupa.\\nPandemija koja je ve\u0107 dve godine prisutna pokazala je koliko
  su rodne nejednakosti duboko ukorenjene. Najve\u0107i teret pandemije je pao na
  \u017eene, koje \u010dine ve\u0107inu zaposlenih u sektoru zdravstva I socijalne
  za\u0161tite, koje su bile izlo\u017eene najve\u0107im rizicima od zaraze, te\u0161kim
  uslovima rada I dodatnim optere\u0107enjima I u porodici I doma\u0107instvu, brizi
  o deci I starijima.\\nProgram \u201cInkluzija Roma I drugih marginalizovanih grupa\u201d
  podr\u017eava \u017eene I devoj\u010dice da ostvare svoj pun potencijal, da se dodatne
  osna\u017ee, edukuju, pitaju o svom polo\u017eaju I postanu ravnopravne gra\u0111anke
  Republike Srbije. Slavimo \u017eene, slavimo razli\u010ditost, slavimo pravo na
  jednake mogu\u0107nosti!\"", "\"Vuk Jeremi\u0107: Mogu\u0107 historijski dogovor
  Srba i Albanaca\\nMinistar spoljnih poslova Srbije Vuk Jeremi\u0107 izjavio je da
  \u0107e se mogu\u0107nost postizanja istorijskog kompromisa izme\u0111u Srba i Albanaca
  pove\u0107ati kada Me\u0111unarodni sud pravde svoje mi\u0161ljenje o jednostrano
  progla\u0161enoj nezavisnosti Kosova po\u0161alje Generalnoj skup\u0161tini UN.
  On je rekao da je Srbija je spremna da bude konstruktivna i fleksibilna oko statusa
  Kosova nakon \u0161to Me\u0111unarodni sud pravde da mi\u0161ljenje. U govoru na
  40. redovnom zasjedanju Generalne skup\u0161tine Organizacije Ameri\u010dkih Dr\u017eava
  (OAD) u Limi, Jeremi\u0107 je rekao da je Srbija spremna da se, sa dobrim namjerama,
  uklju\u010di u dijalog koji bi rje\u0161enje kosovskog problema u\u010dinio prihvatljivim
  za sve strane.\\n\\\"Srbija nikada ne\u0107e prihvatiti nametnuto rje\u0161enje
  koje bi jednostrano ukinulo njena suverena prava na Kosovu, jer to nije ni legitimno,
  ni odr\u017eivo\\\", rekao je Jeremi\u0107 i dodao da \u0107e Srbija u predstoje\u0107im
  pregovorima biti konstruktivna, jer rje\u0161enje koje treba prona\u0107i zahtjeva
  fleksibilnost svih strana. Jeremi\u0107 je dodao da se posljedice pozitivnog rje\u0161enja
  pitanja Kosova ne bi osjetile samo u ovom dijelu Balkana, ve\u0107 bi predstavljale
  zna\u010dajan podsticaj za sve one koji su posve\u0107eni o\u010duvanju me\u0111unarodnog
  poretka 21. vijeka zasnovanog na zakonima. \\\"Jednostrano progla\u0161enje nezavisnosti
  od albanskih vlasti na\u0161e ju\u017ene pokrajine Kosovo i Metohija, predstavlja
  udar u samo srce tih osnovnih principa svetskog i regionalnog upravljanja\\\", rekao
  je Jeremi\u0107 i dodao da separatisti na Kosovu nisu uspjeli da na silu izmjene
  granice Srbije zahvaljuju\u0107i velikoj podr\u0161ci vi\u0161e od tri \u010detvrtine
  zemalja OAD, koje nisu priznale jednostrano progla\u0161enu nezavisnost Kosova.
  (Kliker.info-Srna)\\nKomentari\"", "\"Betsimisaraka\\nBetsimisaraka (\u0161to na
  malaga\u0161kom zna\u010di puno nedjeljivih[2] odnosno - ujedinjeni) su drugi po
  veli\u010dini narod na Madagaskaru sa oko 2 830 000 pripadnika (oko 14.9 % [3] svog
  stanovni\u0161tva), rasprostranjen du\u017e uskog obalnog pojasa na isto\u010dnoj
  obali.\\nI Betsimisarake kao i Merine govore malga\u0161kim jeziku [2]koji je nasli\u010dniji
  jugoisto\u010dnim Barito jezicima. Oni govore dva dijalekta Sjeverni i Ju\u017eni
  Betsimisaraka. Ve\u0107ina Betsimisarake su rasni mje\u0161anci izme\u0111u Bantu
  crnaca i malga\u0161ko-indonezijskih predaka.\\nBetsimisarake se bave poljoprivredom,
  trgovinom, pomorstvom i ribarstvom.[2]\\nBetsimisarake je kao narod ujedinio po\u010detkom
  18. vijeka Ratsimilaho. [2]On je osnovao Kraljevstvo Betsimisaraka - u kojem je
  ujedinio dotad neprijateljska plemena koja su \u017eivjela du\u017e 650 km isto\u010dne
  obale. Njegovo kraljevstvo uru\u0161ilo se vrlo brzi nakon njegove smrti, ve\u0107
  za njegova tre\u0107eg nasljednika 1791. Ve\u0107ina Betsimisaraka tada je podpala
  pod vlast Kraljevstva Merina koje je opstalo sve do dolaska francuske kolonijalne
  uprave 1890.\\nBetsimisarake su u historiji bili poznati kao vje\u0161ti pomorci
  i gusari. Plovili su velikim kanuima koji su mogli primiti 50 i vi\u0161e \u010dlanova
  posade, u flotama od nekoliko hiljada ljudi i plja\u010dkali i robili Komorske otoke
  sjeverozapadno od Madagaskara. Mnogi od tih robova dovedenih sa Komora, danas su
  \u010dlanovi Naroda Betsimisaraka. Betsimisarake su tako\u0111er bili vje\u0161ti
  ribari i kitolovci, koji su slu\u017eili kao mornari na evropskim brodovima od davnina.\\nSve
  do po\u010detka 18. vijeka Betsimisarake, su jo\u0161 bili podjeljeni na tri plemena;
  Tsikoa (ili Betanimena) koji su \u017eivjeli na jugu, Varimo u sredini i Anteva,
  koji su \u017eivjeli na sjeverozapadu. Svako od tih plemena bilo je kulturolo\u0161ki
  i jezi\u010dno posebno, tako da su periodi\u010dki ratovala jedna protiv drugih.
  Te sukobe poticali su i brojni evropski trgovci koji su se namno\u017eili tokom
  17. i 18. vijeka, zainteresirani za prodaju oru\u017eja, u zamjenu za rob]]ove.
  Betsimisarake je ujedinio njihov prvi kralj Ratsimilaho oko 1710., ina\u010de mulat,
  sin engleskog pirata Tom Tewa (ili Thomas White) i domoroda\u010dke princeze Rahene
  iz plemena Anteva.\\nRatsimilaho je svoj pohod na vlast zapo\u010deo pobjedom nad
  tada mo\u0107nim kraljem Ramananom iz plemena Tsikoa, koji je navalio na sjevernu
  obalu, da se do\u010depa unosne trgovine robljem sa evropljanima. Nakon pobjede
  nad Tsikoima Ratsimilaho je uspio \u017eenidbom sa k\u0107erkom kralja Kaleheka
  iz plemena Varimo ste\u0107i saveznika u borbi protiv Tsikoa koji su se nakon smrti
  svog kralja opirali vlasti Ratsimilaha, tako da je nakon dugih borbi ujedinio isto\u010dnu
  obalu. Me\u0111utim njegovo kraljevstvo po\u010delo se raspadati nakon njegove smrti
  1750., kad je vlast preuzela njegova \u017eena Biti. Stvar se pogor\u0161ala kad
  je vlast preuzeo njegov sin, tad su se obnovile stare plemenske netrpeljivosti -
  tako da je to ola\u0161alo posao Merinama i njihovu kralju Radami koji je zauzeo
  Kraljevstvo Betsimisaraka 1817. Od tad su Betsimisarake \u017eivjeli kao podanici
  Kraljevstva Merina sve dok Francuzi nisu okupirali otok 1890.\\nTeritorij na kojem
  obitavaju Betsimisarake je uski obalni pojas od nekih 640 km, na isto\u010dnoj obali
  Madagaskara od rijeke Mananara na jugu, sve do u\u0161\u0107a rijeke Bemarivo na
  sjeveru. Ve\u0107i gradovi u kojima \u017eive Betsimisarake su; Toamasina, Fenoarivo
  Atsinanana i Maroansetra\"", "\"Predsjednik Republike Srpske Milorad Dodik u svom
  skandaloznom nastupu iznio je brojne neistine.\\nDodik je kazao da je Sarajevsko-romanijska
  regija kolijevka Republike Srpske, a slavni Sarajevsko-romanijski korpus Vojske
  Republike Srpske simbol hrabrosti i patriotizma.\\nPovodom obilje\u017eavanja \u201cDana
  odbrane Sarajevsko-romanijske regije\u201d, Dodik je izjavio Srni da su u srcima
  srpskog naroda i danas veoma \u017eive slike izbjegli\u010dkih kolona sarajevskih
  Srba koji sa zave\u017eljajima, po vejavici i hladno\u0107i napu\u0161taju svoje
  domove, nose\u0107i sa sobom i svoje mrtve.\\n\u201cTe jezive scene nisu zabilje\u017eene
  nigdje u svijetu. Ta stra\u0161na sudbina zadesila je na\u0161 srpski narod, sarajevske
  Srbe koji su najve\u0107e \u017ertve proteklog gra\u0111anskog rata u BiH. \u0408edni
  su napustili Sarajevo odmah na po\u010detku rata 1992. godine u strahu za svoje
  \u017eivote, ostavljaju\u0107i sve \u0161to su sticali decenijama, ostavljaju\u0107i
  svoje korijene, drugi su izlazili iz Sarajeva kako i kad su mogli, a posljednji
  masovni egzodus Srba iz Sarajeva dogodio se nakon Dejtona\u201d podsjetio je Dodik.\\nDanas,
  rekao je Dodik, Sarajevo je grad bez Srba, jer ih je ostalo tek toliko da se ka\u017ee
  da su na nivou statisti\u010dke gre\u0161ke. Dodik je za najdu\u017eu opsadu jednog
  grada u modernoj historiji kazao da je nije bilo.\\n\u201cGrad u kojem je \u017eivjelo
  skoro 160.000 Srba, danas je potpuno etni\u010dki o\u010di\u0161\u0107en. Sve \u0161to
  su znameniti sarajevski Srbi gradili i stvarali u tom gradu vi\u0161e ne postoji,
  a njihove zasluge ne priznaju se ni pukim nazivom ulica. I to su promijenili. Sve
  to dovoljno govori koliko je politi\u010dko Sarajevo ogrezlo u mr\u017enji i otporu
  prema svemu \u0161to nije muslimansko. Za njih je istina samo ona iz njihovog ugla
  posmatranja, koju \u017eele da svima serviraju. Dokle ide njihova politi\u010dka
  provokacija prema srpskom narodu i Republici Srpskoj, govori i to da su na table
  na ulazu u taj grad smrti za srpski narod napisali da je bio 1.425 dana pod opsadom,
  \u0161to je notorna la\u017e. Tokom rata Sarajevo nije bilo ni pod opsadom, niti
  je bilo opkoljeno, ve\u0107 je bilo etni\u010dki podijeljen grad\u201d istakao je
  Dodik.\\nProtjerani Srbi iz Sarajeva, rekao je Dodik, na\u0161li su svoje uto\u010di\u0161te
  u Republici Srpskoj, koja je njihova istinska domovina, dok su neki od njih svoj
  novi dom sagradili u Srbiji ili su rasuti \u0161irom svijeta.\\n\u201cDanas sa ponosom
  mo\u017eemo re\u0107i da je Republika Srpska stvorena u miru, a zahvaljuju\u0107i
  na\u0161im hrabrim borcima, odbranjena u ratu. Posebno \u017eelim da naglasim da
  je odbrana Sarajevsko-romanijske regije bila jedan od najte\u017eih i najzahtjevnijih
  zadataka Vojske Republike Srpske. I zato nikada nijedna na\u0161a \u017ertva ne
  smije biti zaboravljena, jer samo na ovom podru\u010dju i u odbrani ove regije \u017eivote
  je polo\u017eilo vi\u0161e od 4.000 hrabrih srpskih boraca\u201d naglasio je Dodik.\\nPodsjetimo,
  opsada Sarajeva po\u010dela je 5. aprila 1992. godine, a trajala je 1.425 dana;
  tokom opsade ubijen je 11.541 gra\u0111anin Sarajeva, me\u0111u njima 1.601 dijete.\\nGeneral
  Stanislav Gali\u0107 iz korpusa \u010diju je \u201cslavnu pro\u0161lost\u201d komentarisao
  Dodik dobio je do\u017eivotni zatvor zbog artiljerijskih i snajperskih napada na
  Sarajevo.\\nDodikova izjava ve\u0107 je izazvala mnoge reakcije politi\u010dkih
  partija iz BiH kao i drugih zvani\u010dnika i aktivista.\""]'
