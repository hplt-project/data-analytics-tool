  ar per emociniai pokalbiai.\\n\u0160ie provokatoriai gali veikti neigiamai ir savaranki\u0161kai,
  be infekcin\u0117s k\u016bno ligos.\\nKaip prarandamas balsas?\\nDa\u017enai aphonija
  prasideda \u0161velniai ry\u0161kiai. Tur\u0117damas \u012ftakos vienam ar keliems
  neigiamiems veiksniams, geroji laipsnis primena apie egzistavim\u0105 tokiais simptomais
  kaip:\\nTaip atsitinka, kad staiga i\u0161nyksta balsas - \u017emogus tiesiog pakyla
  ryte ir negali nieko pasakyti ar labai tyliai kalba. B\u016btent taip, aphonia u\u017etrunka
  daug ilgiau, bet daug grei\u010diau, kai yra gerai i\u0161rinktas gydymas.\\nKatarin\u0117s
  aphon\u0117s gydymo metodai\\nK\u0105 daryti, jei \u0161altis praranda j\u016bs\u0173
  bals\u0105? Pirma, nepanikuokite. Net jei turite svarb\u0173 susitikim\u0105 ar
  darbo dien\u0105 d\u0117l balso praradimo, svarbu prisiminti, kad stresas tik sustiprins
  problem\u0105.\\nAntra, galite pabandyti vien\u0105 ar daugiau nam\u0173 proced\u016br\u0173.
  Jei jie nepad\u0117s, tur\u0117site vartoti narkotikus. \u017demiau pateikti variantai,
  kaip gydyti \\\"aphonia\\\" namuose.\\nLiaudies gynimo priemon\u0117s, skirtos bals\u0173
  gr\u0105\u017eai\\n\\\"Athosas\\\" yra labai da\u017enas rei\u0161kinys, nes receptai,
  norint j\u012f atsikratyti internete, tiesiog n\u0117ra laikomi. Mes pasirinkome
  labiausiai \u017einom\u0105 ir lengvai naudojam\u0105:\\n- Pienas + sviestas + medus.
  Pienas tur\u0117t\u0173 b\u016bti \u0161ildomas iki ma\u017edaug 40 laipsni\u0173.
  Tada \u012fpilkite sviesto gabal\u0117lio, palaukite, kol jis i\u0161tirps ir prid\u0117kite
  prie geriamojo medaus. \u0160is malonus vaistas pad\u0117s su\u0161ilti gerkl\u0119
  d\u0117l geriamojo vandens temperat\u016bros, suma\u017eins medaus u\u017edegim\u0105
  ir sald\u017eiojo audinio mink\u0161t\u0117jim\u0105.\\n- Kiau\u0161inio trynys
  + cukrus + sviestas. Jodai turi b\u016bti \u012ftrinami su cukrumi, \u012fpilama
  lydyto sviesto. Naudokite saldainio r\u016b\u0161\u012f, i\u0161tirpdamos vien\u0105
  arbatin\u012f \u0161auk\u0161tel\u012f kiekvien\u0105 kart\u0105 per 1,5-2 valandas.\\n-
  Pienas + soda. \u012e paruo\u0161to pieno stikl\u0119 \u012fpilkite tre\u010ddalio
  \u0161auk\u0161telio soda. Gauk \u0161armin\u012f g\u0117rim\u0105, kuris labai
  gerai ramina gerkl\u0119. Soda gali b\u016bti pakeista Borjomi mineraliniu vandeniu,
  derinant j\u012f su pienu 1: 1 santykiu.\\n- Konjakas + citrinas + medus. \u0160is
  vaistas pagamintas i\u0161 \u0161i\u0173 sudedam\u0173j\u0173 dali\u0173 50 ml /
  3 la\u0161eli\u0173 / 15 g santykiu. J\u0173 gali gydyti tik suaugusieji - d\u0117l
  to gaut\u0105 mi\u0161in\u012f reikia suvartoti du kartus per dien\u0105 (i\u0161samiai
  skaityti: geriamasis konjakas: vaistas ar \u017eala?).\\n- Ramun\u0117 + eukaliptas.
  Ramun\u0117lio infuzija praskied\u017eiama vandeniniu eukalipto tirpalu ir naudojama
  gurk\u0161niui arba \u012fkv\u0117pus. Terapinis poveikis pasiekiamas d\u0117l prie\u0161u\u017edegimini\u0173
  ir raminan\u010di\u0173 rezultat\u0173 derinio.\\n- Pienas + figos. D\u017eiovintus
  vaisius reikia i\u0161pjauti pus\u0119, u\u017epilti stikline pieno ir \u0161ildyti,
  nevirti. Gerkite kar\u0161t\u0105 dien\u0105.\\n- Svog\u016bnai + medus + cukrus.
  Smulkiai supjaustyto svog\u016bno virkite 150 ml vandens, \u012fpilkite 2 arbatinius
  \u0161auk\u0161telius cukraus. Sumai\u0161ykite gaut\u0105 sirup\u0105 pusiau su
  medumi, paimkite 1 \u0161auk\u0161t\u0105 ryte ir vakare prie\u0161 valg\u012f.\\n-
  G\u0117li\u0173 vynas. Tai kar\u0161tas g\u0117rimas, pagamintas i\u0161 vyno. Jis
  pa\u0161ildomas iki kar\u0161to b\u016bkl\u0117s ir pridedamas cinamonas, gvazdik\u0117liai,
  citrusiniai vaisiai ir cukrus. Toks g\u0117rimas ne tik atsikratys silpnumo, bet
  ir atleis nuo \u0161al\u010dio. \u017dinoma, \u0161is receptas n\u0117ra naudojamas
  vaik\u0173 gydymui.\\nTarp pateikt\u0173 recept\u0173 kiekvienas \u017emogus gal\u0117s
  pasirinkti t\u0105, kuri jam patiko ir pad\u0117s.\\nMedicina, padedanti\\nKai kuriems
  \u017emon\u0117ms lengviau eiti \u012f vaistin\u0119 ir nusipirkti paruo\u0161t\u0105
  vaist\u0105, negu valgyti pagal receptus. Na, o tarp farmacini\u0173 vaist\u0173
  yra efektyvi priemon\u0117, kuri gali greitai susigr\u0105\u017einti bals\u0105.
  Kai kurie i\u0161 j\u0173 yra i\u0161vardyti toliau:\\n- Loratadinas, Diazolinas,
  Alersinas - rei\u0161kia, kad pa\u0161alina alergin\u0119 ligos sud\u0117t\u012f;\\n-
  Lyugol - jodas, kuris turi antiseptin\u012f poveik\u012f;\\n- Bromheksinas, ambrukasolis,
  mukaltinas - labiausiai \u017einomi atskyrimo vaistai, kurie gali palengvinti kosulio
  sudirginim\u0105;\\n- \\\"Geksoral\\\", \\\"Kameton\\\", \\\"Ingalipt\\\", \\\"Angileks\\\"
  - vietiniai antiseptikai, kurie paprastai gaminami pur\u0161kiami pavidalu;\\n-
  Miramistinas, chlorofilipitas - tirpalas, skirtas i\u0161d\u017ei\u016bti, pa\u0161alinti
  audini\u0173 patinim\u0105.\\n\u0160ie vaistai, ypa\u010d derinant vienas su kitais,
  gali pa\u0161alinti pagrindin\u0119 \\\"aphonijos\\\" prie\u017east\u012f.\\nPagalbiniai
  metodai\\nNorint paspartinti \\\"melodingumo\\\" atk\u016brimo proces\u0105, be
  narkotik\u0173 galite taikyti papildomus metodus, kurie pad\u0117s greitai susigr\u0105\u017einti
  bals\u0105, pavyzd\u017eiui, jei:\\n- \u0161ildantys kompresai ant kaklo;\\n- kar\u0161tos
  p\u0117dos vonios;\\n- \u0161ildantys tepalai ant koj\u0173 ir ver\u0161eli\u0173;\\n-
  gausu geriamojo re\u017eimo;\\n- eterinio aliejaus gydymas.\\nAr galima vien\u0105
  dien\u0105 at\u0161aukti \u0161alm\u0105? Atsakymas \u012f \u0161\u012f klausim\u0105
  priklauso nuo ligos sunkumo ir jo kilm\u0117s. Jei j\u016bs\u0173 gerkl\u0117 tiesiog
  i\u0161siver\u017e\u0117 \u0161altai, grei\u010diausiai j\u016bs\u0173 balsas pasieks
  po keleto proced\u016br\u0173, kuriose pa\u0161ildysite kojas ir kakl\u0105, taip
  pat gerkite \u0161iltus medicininius g\u0117rimus. Kitais atvejais gali prireikti
  intensyvesnio gydymo nuo 3 iki 10 dien\u0173.\\nPapildomos rekomendacijos ir apribojimai\\nSvarbiausia,
  kad \\\"aphonia\\\" yra u\u017ekirsti keli\u0105 veiksmams, kurie gali pabloginti
  garsini\u0173 virveli\u0173 b\u016bkl\u0119. Tod\u0117l tur\u0117tum\u0117te klausytis
  \u0161i\u0173 patarim\u0173, ypa\u010d jei j\u016bs\u0173 balsas i\u0161nyksta su
  \u0161al\u010diu:\\n- Stenkit\u0117s atsikratyti blog\u0173 \u012fpro\u010di\u0173,
  jei turite juos. Cigaret\u0117s ir alkoholis i\u0161d\u017ei\u016bvo gleivin\u0119
  burnoje, d\u0117l ko i\u0161siskleid\u017eia, taip pat visi\u0161kai arba i\u0161
  dalies prarandamas balsas.\\n- Atsisakykite laiko arbatui, kavai, sald\u017eiar\u016bg\u0161\u010diai
  ir sultims - \u0161ie g\u0117rimai yra diuretikai, tod\u0117l jie dehidratuoja k\u016bn\u0105.\\n-
  Ligos metu pa\u0161alinkite i\u0161 dietos saldainius, kepimo, a\u0161trus, keptas,
  riebius, s\u016brus, r\u016bkytus ir r\u016bg\u0161tus maisto produktus. Visi jie
  sukelia padid\u0117jus\u012f tro\u0161kul\u012f ir dirgina gerkl\u0173 ir bals\u0105.\\n-
  V\u0117sioje aplinkoje vengti vaik\u0161\u010dioti lauke, ypa\u010d be skara. Dabar
  jums nereikalingas perkaitimas.\\n- Stenkit\u0117s nepasirodyti tose vietose, kur
  yra daug dulki\u0173 ir kit\u0173 ter\u0161ian\u010di\u0173 daleli\u0173.\\n- Vykdykite
  balso poils\u012f tiek, kiek reikia, kad visi\u0161kai atkurtum\u0117te rai\u0161\u010dius.
  Idealiu atveju gydytojas tur\u0117t\u0173 \u0161\u012f laik\u0105 nustatyti.\\nJei
  tikrai norite kuo grei\u010diau gr\u0105\u017einti savo bals\u0105, jums nebus sunku
  laikytis \u0161i\u0173 rekomendacij\u0173. Su da\u017ena tendencija laringitu ir
  aphonija, verta pam\u0105styti apie profesionali\u0105 otolaringologo konsultacij\u0105.
  Negalima laikyti laikinu balsavimo netekimu kaip bausme. J\u016bs vis dar negalite
  apsidrausti nuo vis\u0173 galim\u0173 \u0161ios valstyb\u0117s prie\u017eas\u010di\u0173.
  Kreipkit\u0117s \u012f priverstin\u0119 tyl\u0105 kaip \u012f galimyb\u0119 pails\u0117ti,
  nes bendravimuose mes kartais taip pat reikalaujame pauz\u0119.\\nAtk\u016brimo
  balsas po \u0161alto namuose\\nS\u016aRS, gripas, per\u0161alimas rudens-\u017eiemos
  laikotarpiu neapsunkina beveik vieno \u017emogaus. Daugeliu atvej\u0173 \u0161ios
  ligos atsiranda su komplikacijomis: visa tai prasideda \u0161altuoju ir baigiasi
  laringitu, tracheitu ar bronchitu, sukelian\u010diu vokalo virveli\u0173 u\u017edegim\u0105.\\nJei
  suaug\u0119 \u017emon\u0117s gali atsilaikyti nuo daugelio kv\u0117pavimo lig\u0173
  ant koj\u0173, tai k\u0105 rei\u0161kia situacija, kai prarandamas geb\u0117jimas
  kalb\u0117ti? Gal\u0173 gale, \u017emogaus darbas daugeliu atvej\u0173 yra susij\u0119s
  su kalbos veikla. Taigi, jei da\u017enai prarandate savo bals\u0105, kai yra \u0161altesnis,
  nei gerti ir kaip atkurti kalbos?\\nKod\u0117l balsas dingsta, kai yra \u0161alta
  ir ORVI?\\nU\u017e vokalo aparato funkcij\u0105 atsakingas vagus nervas, i\u0161vykstantis
  i\u0161 medulio. Po \u0161alto ar per\u0161alimo da\u017enai b\u016bna burnos gleivin\u0117s
  patinimas, d\u0117l ko prarandama j\u0173 geb\u0117jimas sukurti vibracij\u0105.
  Ai\u0161kumas, silpnumas. Jei balso perdavimas buvo per \u0161altas, daugyb\u0117
  proced\u016br\u0173, kurios gali b\u016bti atliekamos namuose, gali pad\u0117ti
  j\u0105 atkurti. Ta\u010diau populiarus gydymas kartu su vaistais suteikia maksimal\u0173
  efekt\u0105 ir leid\u017eia jums kuo grei\u010diau atsikratyti aphonijos.\\nKokie
  veiksniai lemia balso praradim\u0105?\\n\u017dmogus gali prarasti savo bals\u0105
  d\u0117l daugelio prie\u017eas\u010di\u0173. Da\u017eniausiai tai \u012fvyksta \u0161iais
  atvejais:\\n- Gausiai \u0161alta arba, atvirk\u0161\u010diai, kar\u0161ta g\u0117rimas:
  d\u0117l to u\u017edegimo procesai prasideda gerklose.\\n- Paprasta \u0161alta,
  \u016bmin\u0117 kv\u0117pavimo tak\u0173 virusin\u0117 infekcija ir, kaip komplikacijos,
  laringitas, bronchitas, tracheitas. Kv\u0117pavimas, sausas kosulys, u\u017ekimimas.\\n-
  Daugyb\u0117je i\u0161nyksta per\u0161alimo balsas, ta\u010diau daugeliu atvej\u0173
  \u0161is rei\u0161kinys pasitaiko mokytojams, dainininkams, aktoriams, kalb\u0117tojams:
  balsas visada \u012ftemptas, o liga apsunkina proces\u0105.\\n- Reguliarus \u0161aldyt\u0173
  g\u0117rim\u0173 vartojimas.\\nStenkit\u0117s pa\u0161alinti visus galimus pavojus
  sau: tai pad\u0117s i\u0161vengti balso praradimo ir sunki\u0173 komplikacij\u0173
  po ENT lig\u0173 atsiradimo.\\nKaip atkurti bals\u0105 \u0161altu namuose?\\nViena
  i\u0161 pagrindini\u0173 s\u0105lyg\u0173 greitai atsikratyti toki\u0173 komplikacij\u0173
  yra tinkama mityba. Pirma, jums reikia \u0161ilto g\u0117rimo ir dideliais kiekiais.
  Dirginamos rai\u0161teliai reikalauja daug dr\u0117gm\u0117s. Arbata, sultys, kompotas,
  \u017eel\u0117, pienas - pasirinkimas yra gana platus.\\nJei n\u0117ra temperat\u016bros
  ir nenaudojate narkotik\u0173 viduje, karamelinis vynas pad\u0117s. Virkite j\u012f
  geriau prie\u0161 mieg\u0105. \u012e ind\u0105 supilkite raudon\u0105j\u012f vyn\u0105,
  prid\u0117ti \u0161iek tiek cinamono; 1-2 gvazdik\u0117liai; kalendra, muskato rie\u0161utas,
  d\u017eiovintas imbieras peilio galuose ir \u0161iluma iki 80 laipsni\u0173. G\u0117rimas
  neturi virti: \u0161iuo atveju prarandamos visos naudingos savyb\u0117s. Sugerkite,
  gerkite 150 g g\u0117lu vyno, apvyniokite savo gerkl\u0119 ir eik prie lovos.\\nPaciento
  mityboje turi b\u016bti sultiniai, liesa m\u0117sa be prieskoni\u0173, vaisiai,
  dar\u017eov\u0117s, gr\u016bdai, jogurtas ir kiti pieno produktai. Draud\u017eiama
  vartoti r\u016bkytus produktus, konservuotus dar\u017eoves, kav\u0105 ir soda. Valgomiems
  patiekalams yra naudinga \u012fd\u0117ti \u010desnak\u0105 ir svog\u016bnus.\\nKaip
  atkurti balso po \u0161alto liaudies gynimo priemoni\u0173?\\nNamuose yra daug gydymo
  b\u016bd\u0173: gurk\u0161nojimas, \u012fkv\u0117pimo proced\u016bros, migdol\u0173
  ir u\u017epakalin\u0117s sienos tepimas, \u0161ilti g\u0117rimai, gydom\u0173j\u0173
  u\u017epil\u0173 naudojimas. Taigi, kaip gauti balso atgal nuo \u0161al\u010dio
  tradicin\u0117s medicinos recept\u0173 pagalba?\\n- Prie\u0161 mieg\u0105 \u0161ilta
  p\u0117d\u0173 vonia. Paimkite \u0161vie\u017ei\u0105 kiau\u0161in\u012f ir valgykite
  \u017eali\u0105, tada valgykite 1 valgomasis \u0161auk\u0161tas. l medus Proced\u016br\u0105
  turite atlikti tris kartus su 40 minu\u010di\u0173 intervalu.\\n- Nulupkite krien\u0173
  \u0161akn\u012f, sudr\u0117kinkite virveliu ir u\u017epilkite verdan\u010diu vandeniu.
  10 g mi\u0161inio - 0,5 tableto vandens. Infuzija bus paruo\u0161ta po 4 valand\u0173.
  Jei pageidaujate, prid\u0117kite \u0161iek tiek cukraus. Dienos metu gerkite ma\u017eus
  bandel\u0117s \u0161ilumos pavidalu.\\n- M\u0117lyn\u0117s uogos susmulkina ir u\u017epilama
  verdan\u010dia, bet \u0161iek tiek atv\u0117sinto vandens. Gandykite su tokiu gerkl\u0117s
  skausmu 4-5 kartus per dien\u0105.\\n- \u012emai\u0161ykite kiau\u0161inio balt\u0105,
  kol atsiranda putojantis. Tada supilkite stiklin\u0119 \u0161ilto virinto vandens.
  Skalauti kas 2 valandas.\\n- 400 g s\u0117len\u0173 u\u017epilkite 1,5 litro verdan\u010dio
  vandens, saldinkite rudiu cukrumi. \u0160tamas, gerkite ma\u017eose gurk\u0161nose
  vis\u0105 dien\u0105.\\n- \u012ekv\u0117pimas su ramun\u0117liais, kalendrais, eukaliptais,
  \u0161alaviju. 1 valgomasis \u0161auk\u0161tas l \u017eol\u0117s i\u0161pilamos
  litru verdan\u010dio vandens. U\u017edenkite antklod\u0117 ir kv\u0117pkite 10 minu\u010di\u0173.
  J\u016bs galite atlikti proced\u016br\u0105 ir naudoti purk\u0161tuk\u0105. Jei
  j\u016bs praradote savo bals\u0105 \u0161altai ir turite kartu gydyti bronchit\u0105
  arba tonzilit\u0105, \u0161is prietaisas taps tikru i\u0161gelb\u0117jimu. \u017dmon\u0117s,
  kurie da\u017enai ken\u010dia nuo kv\u0117pavimo lig\u0173, papras\u010diausiai
  privalo tur\u0117ti namie.\\n- Aromaterapija su eteriniais aliejais citrinos, eukalipto,
  anizo. \u012e speciali\u0105 lemput\u0119 pridedami keli la\u0161eliai aliejaus
  ir vandens. Proced\u016bra tur\u0117t\u0173 b\u016bti vykdoma darnioje atmosferoje.\\n-
  K\u0105 daryti, jei balso dingo su \u0161al\u010diu, jie seniai \u017einojo: \u0161iltas
  pienas su medumi ir sviestu ilg\u0105 laik\u0105 buvo naudojamas gerkl\u0173 ligoms.
  Jei turite dalin\u0119 aphonij\u0105, \u0161i priemon\u0117 netgi gali pad\u0117ti
  per vien\u0105 nakt\u012f, o rytoj gal\u0117s kalb\u0117ti. Pienas \u0161ildo raumenis,
  o medus ir sviestas apver\u010dia, atkuria gleivin\u0117s elastingum\u0105. Galite
  \u012fd\u0117ti \u012f gerti \u0161iek tiek imbiero ar kakavos.\\n- Figiniai vaisiai
  yra susmulkinti. \u012epilkite \u0161ilto pieno, \u0161ilumos, bet neu\u017edenkite.
  Gerkite tris kartus per dien\u0105.\\n- Pagalba ir \u0161ilti kompresai nakt\u012f.
  Kop\u016bstus lapus suplakite kar\u0161tu vandeniu, i\u0161d\u017eiovinkite ir tepkite
  medu. \u012ed\u0117kite ant kaklo, pritvirtinkite vilnoniu skara ar skara.\\n- Virkite
  vi\u0161tienos kiau\u0161in\u012f, prid\u0117kite \u0161auk\u0161t\u0105 medaus,
  \u0161iek tiek brend\u017eio arba romo, citrin\u0173 sul\u010di\u0173. Visos sudedamosios
  dalys turi b\u016bti vienodos proporcijos. Kruop\u0161\u010diai sumai\u0161ykite.
  \u0160ildykite vandens vonioje ir gerkite 0,25-0,5 puodelio tris kartus per dien\u0105.\\n-
  Paruo\u0161kite anijin\u0117s s\u0117klos pagrindu pagamint\u0105 nuovir\u0105.
  Jie turi u\u017epilti verdan\u010diu vandeniu santykiu 1: 2 ir verdant ma\u017eai
  ugnies 15 minu\u010di\u0173. Atv\u0117sinkite, prid\u0117kite deserto \u0161auk\u0161t\u0105
  brend\u017eio ir 1,5 \u0161auk\u0161telio. l medus, sumai\u0161ykite. Gerkite po
  1 \u0161auk\u0161t\u0105 kas 30 minu\u010di\u0173. Negalima laikyti \u0161aldytuve.\\nKai
  \u0161alta yra prarasti balso, nei gydyti, pats asmuo pasirenka. Jei esate alergi\u0161kas
  medui, kai kurie i\u0161 pirmiau i\u0161vardyt\u0173 vaist\u0173 yra draud\u017eiami.
  Kai kurie turi individual\u0173 netoleravim\u0105 ramun\u0117li\u0173, eukalipt\u0173
  ar eterini\u0173 aliej\u0173. Tod\u0117l gydymo b\u016bdas kiekvienas pasirenka.
  Ta\u010diau geriausia b\u016bt\u0173 konsultuotis su patyrusiu gydytoju.\\nNarkotik\u0173
  gydymas balso praradimui\\nJei \u0161alto metu dingo balsas, kaip gydyti gerkl\u0119
  ir atkurti gon\u0173 aparato veikim\u0105 vaist\u0173 pagalba, gali paskatinti patyr\u0119s
  otolaringologas. Tais atvejais, kai negalima eiti \u012f klinik\u0105, galite naudoti
  tabletes arba pur\u0161kiklius. Jie parduodami vaistin\u0117se be recepto.\\n- Kameton
  (pur\u0161kalas). Padeda u\u017edegiminiams procesams burnos ertm\u0117je. Ji turi
  antiseptini\u0173 savybi\u0173.\\n- Faringozeptas (tablet\u0117s). \u0160is vaistas
  yra \u017einomas nuo sovietme\u010dio. Veiksminga d\u0117l bet koki\u0173 infekcini\u0173
  ir u\u017edegimini\u0173 gerkl\u0117s lig\u0173.\\n- Hexoral (pur\u0161kalas). Daugiafunkcinis
  preparatas: dr\u0117kina gleivines, dezinfekuoja ir suma\u017eina skausm\u0105 riebaluose.\\n-
  Chlorophyllipt (tirpalas). Nat\u016brali\u0173 ingredient\u0173 antimikrobinio aliejaus
  konsistencija. Jis pagamintas i\u0161 chlorofilo, esan\u010dio eukalipto lapuose.\\n-
  Decatilenas (tablet\u0117s). I\u0161laisvina gerkl\u0119, turi antibakterini\u0173
  savybi\u0173.\\n- Ingalipt. Dezinfekuoja, lengvina gurk\u0161n\u012f ir slopina
  u\u017edegiminius procesus.\\n- Septolete (tabletes). Padeda stipriai kosulyje,
  ma\u017eina skausm\u0105 ir slopina patogenus.\\n- Gomeovoks. \u0160is vaistas pasirod\u0117
  es\u0105s efektyvus homeopatinis vaistas nuo laringito, tonzilito ir balso praradimo.\\n-
  Lugolo tirpalas. Padeda veiksmingai ir greitai su\u0161velninti garsini\u0173 virvi\u0173
  u\u017edegim\u0105.\\n- Antialerginiai vaistai. Jei balso praradimas yra kartu su
  edemu, negalima i\u0161siversti be \u0161i\u0173 l\u0117\u0161\u0173.\\nVisi \u0161ie
  vaistiniai preparatai pad\u0117s jums susidurti su situacija, kai jums reikia greitai
  gr\u0105\u017einti savo bals\u0105, kai yra \u0161alta.\\nPapildomi balso atk\u016brimo
  \u012frankiai\\nKartais net sud\u0117tingas gydymas, kalbos funkcija atstatoma labai
  l\u0117tai. Jei j\u016bs praradote savo bals\u0105 nuo \u0161al\u010dio, kaip kuo
  veiksmingiau gydyti aphonij\u0105? B\u016btina ne tik vartoti vaist\u0173 terapij\u0105
  ir populiarius receptus, bet ir atlikti \u0161iuos pratimus:\\n- \\\"Li\u016bto
  poj\u016btis\\\". Pabandykite laikytis savo lie\u017euvio iki galo ir paskelbkite
  gars\u0105 \\\"k.\\\" Pakartokite kelet\u0105 kart\u0173.\\n- \u012ekv\u0117pkite,
  pakreipkite galv\u0105 atgal ir pabandykite imituoti gars\u0105. Atlikite tai tiksliai
  tol, kol galite kv\u0117puoti.\\n- Blauzdami pir\u0161t\u0105 ant vir\u0161utin\u0117s
  l\u016bpos, palaikykite savo kv\u0117pavim\u0105 ir pabandykite pasakyti \\\"b\u016bt\u0173\\\".\\n-
  Giliai kv\u0117puoti. Sukiokite ant kr\u016btin\u0117s ir pabandykite i\u0161tarti
  visus balsi\u0173 garsus. \u0160is pratimas yra labai veiksmingas, jei praradote
  bals\u0105, kai esate \u0161altas.\\n- Paliesdami nosies sparnus ir \u0161nerves
  rankomis, pabandykite sudeginti garsus garsus (kartu su lytine kontaktu, veiksmingai
  atkuriami garsiniai virveliai).\\nJei prarasite savo bals\u0105, naudinga masa\u017euoti
  gerkl\u0119 apskrito judesio metu. Tai galite padaryti, kai naudojami \u0161al\u010dio
  tepalai, pavyzd\u017eiui, Balm Evkabal. Be to, nepamir\u0161kite, kad gerkl\u0117
  tur\u0117t\u0173 b\u016bti \u0161ilta, o namuose - reikiamo dr\u0117gnumo lygio.
  Jei ne\u017einote, kaip kuo grei\u010diau atstatyti bals\u0105 po \u0161al\u010dio,
  o j\u016bs da\u017enai ken\u010dia nuo aphonijos, \u012fsigykite dr\u0117kintuv\u0105
  - \u0161is prietaisas pad\u0117s padidinti gydymo efektyvum\u0105. Tai padeda sausuoju
  kosuliu.\\nKas draud\u017eiama daryti asmen\u012f, kuris prarado savo bals\u0105
  po \u0161al\u010dio?\\n\u0160alto ar ARVI gydymo metu, apsunkintas balsu, pacientas
  yra grie\u017etai draud\u017eiamas:\\n- R\u016bkyti Cigare\u010di\u0173 dervos sudirgina
  bals\u0105, provokuoja silpnumo atsiradim\u0105.\\n- Bando kalb\u0117ti, ypa\u010d
  \u0161nab\u017edesyje. Pastaruoju atveju esate dar labiau \u012ftemptas balso aparatas.\\n-
  Labai da\u017enai \u017emon\u0117s, kurie ne\u017eino, kaip greitai sugr\u0105\u017einti
  per\u0161alimo bals\u0105 namuose, nesukeliant \u017ealos sveikatai, pasinaudos
  garsiausiais metodais. Pavyzd\u017eiui, jie pradeda susi\u017ealoti natrio vandeniu.
  \u0160i priemon\u0117 yra grie\u017etai draud\u017eiama vartoti: ji padeda kovoti
  su patogeniniais mikroorganizmais, ta\u010diau tai neigiamai veikia garsini\u0173
  virveli\u0173 b\u016bkl\u0119.\\n- Kv\u0117puoti burn\u0105, ypa\u010d \u0161altu
  oru. Kv\u0117puojantis i\u0161 nosies, nat\u016bralus oro valymas i\u0161 bakterij\u0173
  ir dulki\u0173, taip pat jo \u0161ildymas ir dr\u0117kinimas.\\nKaip vien\u0105
  dien\u0105 su \u0161al\u010diu gr\u012f\u017eti balsas yra gana sud\u0117tingas
  klausimas, ta\u010diau kartais ten yra situacij\u0173, kai tai tiesiog b\u016btina
  padaryti, kad neb\u016bt\u0173 \u017elug\u0119 kolegos, giminai\u010diai, draugai
  ar neprarastum\u0117te galimyb\u0117s, kuri atrodo vien\u0105 kart\u0105 vis\u0105
  gyvenim\u0105. Tokiais atvejais b\u016btina atlikti i\u0161sam\u0173 gydym\u0105:
  naudoti veiksmingus vaistus, liaudies gynimo priemones ir atlikti pratimus, kad
  atkurtum\u0117te garsini\u0173 virvi\u0173 funkcijas.\\nBalso praradimas \u0161al\u010dio
  atveju n\u0117ra tokia baisi problema, jei mes sprend\u017eiame savo sprendim\u0105
  kuo didesniu atsakomybe, ir mes jau pasi\u016bl\u0117me, kaip elgtis su tokia komplikacija.
  Mes norime, kad j\u016bs nepakenktum\u0117te!\\nKaip atkurti balso namuose\\nStraipsnyje
  kalbama apie balso praradimo prie\u017eastis ir apie tai, kaip j\u012f sugr\u0105\u017einti.
  Atsakyk \u012f klausim\u0105, kaip atkurti garsinius virves namuose.\\nTaikydami
  m\u016bs\u0173 rekomendacijas, i\u0161vengsite gerkl\u0117s skausmo, o liaudies
  gynimo priemon\u0117s greitai pad\u0117s pa\u0161alinti nemalonius simptomus.\\nIlgalaikis
  u\u017ekimimas provokuoja garsini\u0173 virvi\u0173 u\u017edegim\u0105. Nepaisydamas
  problemos, ilg\u0105 laik\u0105 prarandamas balsas. Dalinis ar visi\u0161kas balso
  praradimas vadinamas aphonija (medicinos terminas).\\nBalso praradimo prie\u017eastys\\n-
  Laringitas (u\u017edegimas gleivin\u0117s skausmas), bronchitas, gerkl\u0117s skausmas
  ir kit\u0173 lig\u0173 i\u0161provokavo \u012f balso styg\u0173 padid\u0117jim\u0105,
  asmuo praranda savo bals\u0105. Tas pats laringitas yra r\u016bkan\u010diojo \\\"i\u0161tikimas
  kompanionas\\\". R\u016bkal\u012f galima identifikuoti \u0161velniu u\u017ekimimu
  ir u\u017ekimimu.\\n- Baltas balsas i\u0161nyksta i\u0161 banalaus \u0161al\u010dio
  arba yra sunkios ligos simptomas (tuberkulioz\u0117, raudonoji kar\u0161tin\u0117,
  sifilis).\\n- Kalbant apie didelius tonus, vokalo virvi\u0173 perk\u0117limas. Da\u017enai,
  kai \u0161aukia, asmuo praranda geb\u0117jim\u0105 kalb\u0117ti normaliai.\\n- Ry\u0161kus
  oro, \u0161alto ar sauso oro pokytis neigiamai veikia j\u016bs\u0173 gerov\u0119.
  Gaukite special\u0173 dr\u0117kintuv\u0105.\\n- Pavojus kelia tam tikr\u0173 profesij\u0173
  (mokytoj\u0173, kalb\u0117toj\u0173, meninink\u0173) \u017emones, kurie kasdien
  \u012ftempia savo balsus.\\n- Stiprus stresas ir pertr\u016bkis neigiamai veikia
  bals\u0105.\\n- Kai kurie maisto produktai dirgina gerkl\u0119. I\u0161meskite:
  krekeri\u0173, gazuot\u0173 g\u0117rim\u0173, kavos, alkoholio, per kar\u0161t\u0173
  ar \u0161alt\u0173 patiekal\u0173.\\nGarsini\u0173 virvi\u0173 gydymas\\nNustatykite
  ligos prie\u017east\u012f ir prad\u0117kite gydym\u0105. L\u0117tinis patinimas
  ir da\u017enas balso praradimas - prie\u017eastis pasikonsultuoti su gydytoju. Jis
  skirs nuo u\u017edegimo ir nuo edemos vaist\u0173, vitamin\u0173 kompleks\u0105.\\n\u012ekv\u0117pimas
  padeda atstatyti bals\u0105 savaranki\u0161kai. \\\"Grandma\\\" metodas yra \u012fkv\u0117pti
  kar\u0161tus garus vir\u0161 indo su \u017eolel\u0117mis ar eteriniais aliejais.
  Padengti savo galv\u0105 rank\u0161luos\u010diu.\\nJei auk\u0161\u010diau pateiktas
  metodas netinka, pasirinkite purk\u0161tukus (prietaisus \u012fkv\u0117pti namuose).
  \u012ekv\u0117pti tirpal\u0105 su eukalipto eteriniu aliejumi arba \u0161alaviju.
  Aromatiniai garai ma\u017eina patinim\u0105 ir u\u017edegim\u0105, pa\u0161alina
  infekcij\u0105. \u012ekv\u0117pti garus per burn\u0105 ir i\u0161kv\u0117pti nosine.
  Inhaliacijos laikas yra 5 minut\u0117s, du kartus per dien\u0105.\\nStaiga balsas
  dingo? Poilsis ir u\u017esi\u010diaupk, neu\u017etempkite vokalo virvi\u0173, suteikiant
  jiems laiko susigr\u0105\u017einti. Jei tai yra riksmas, dainavimas ar ilgas pokalbis,
  balsas gr\u012f\u0161 per vien\u0105 ar dvi dienas. Negalima \u0161nab\u017ed\u0117ti.
  \u012erodyta, kad \u0161nab\u017edesys dar labiau erzinantis balsas.\\nKar\u0161tos
  arbatos, kavos ir net alkoholini\u0173 g\u0117rim\u0173 veiksmingumas silpnumo ir
  gerkl\u0117s gydymui yra pernelyg didelis. Tokie gydymo metodai yra abejotini, nes
  g\u0117rimai dehidratuoja jau silpn\u0105 organizm\u0105.\\nKompotai, vaista\u017eoli\u0173
  u\u017epilai, vaisi\u0173 g\u0117rimai pad\u0117s atkurti balso namuose.\\nGydymas
  liaudies metodais\\nLiaudies gynimo b\u016bdai, kurie buvo i\u0161bandyti kartoms,
  pad\u0117s jums susigr\u0105\u017einti bals\u0105 nesiimant vaist\u0173.\\nJei norite
  greitai atkurti savo bals\u0105, kai esate \u0161altas, skalaukite vaista\u017eoli\u0173
  dedektais, kuri\u0173 sud\u0117tyje yra raguoli\u0173 ir ramun\u0117li\u0173, kurie
  turi prie\u0161u\u017edegimini\u0173 savybi\u0173.\\nNaudokite \u0161ilt\u0105 vanden\u012f
  (kiek reikia k\u016bnui), darykite kompresus. Atgaivinti po ligos bus lengviau i\u0161mesti
  viburnum, kuris naudojamas skrepliui pa\u0161alinti ir u\u017edegimui \u0161alinti.\\nGerkl\u0117s
  skausmas ir \u0161altas gydymas\\nRecepto apra\u0161ymas: \u012frankis pad\u0117s
  atkurti balso informacij\u0105 per 2-4 dienas.\\nTai bus:\\n- Pienas - 0,5 litro;\\n-
  Vi\u0161tienos kiau\u0161inis - 1 gabalas;\\n- Medus - 5 gramai;\\n- Sviestas -
  5 gramai.\\nKaip virti: \u0161iltame piene prid\u0117ti pirmiau nurodytus ingredientus.
  Gerkite ryte ir vakare 0,5 litro l\u0117\u0161\u0173.\\nGarnys su mork\u0173 ar
  obuoli\u0173 sultimis palengvins nemalonius u\u017edegimo simptomus.\\nGreitas gerkl\u0117s
  atstatymas\\nRecepto apra\u0161ymas: Garsiniai virveliai bus atstatomi per dien\u0105.\\nTai
  bus:\\n- Vi\u0161tienos baltymas i\u0161 2 kiau\u0161ini\u0173.\\n- Vanduo - 1 puodelis.\\nKaip
  virti: mu\u0161ti baltus \u012f putojan\u010di\u0105 b\u016bsen\u0105. U\u017epildykite
  \u0161altu verd\u017eiu vandeniu. Gurk\u0161ti kas dvi valandas.\\nGreitas b\u016bdas
  gerovei gerinti\\nRecepto apra\u0161ymas: D\u0117l skausmo geryboje ir problem\u0173
  su balsu virvut\u0117s, aniza s\u0117klos pad\u0117s. Paimkite \u0161auk\u0161t\u0105
  du kartus per valand\u0105.\\nTai bus:\\n- Aniza s\u0117klos - pus\u0117 stiklo;\\n-
  Vanduo - 500 ml;\\n- Konjakas - 10 ml;\\n- Medus - 50 g\\nKaip virti: u\u017epilkite
  verdan\u010diu vandeniu ant ani\u0161e\u0161i\u0173 s\u0117kl\u0173. Palikite dvi
  valandas. Padarykite s\u0117klas ir prid\u0117kite brend\u012f ir med\u0173.\\nEggnog
  u\u017ekimimas ir gerkl\u0117s skausmas\\nTai bus:\\n- Vi\u0161tienos kiau\u0161iniai
  - 2 vnt.\\n- Cukrus ar medus - 2 \u0161auk\u0161tai;\\n- Pienas - 100 ml.\\nKaip
  virti: su cukrumi arba medumi su mai\u0161ytuvu permu\u0161kite trynius. \u012epilkite
  \u0161ildomo pieno. Vover\u0117s plakti su cukrumi stiprios putos ir i\u0161gerti.
  Vartokite kaip \u0161ilum\u0105. Jei nori, prie egl\u0117s prid\u0117s prieskoni\u0173,
  2 \u0161auk\u0161tai romo arba brend\u017eio ir apelsin\u0173 sul\u010di\u0173.\\nMork\u0173
  nuoviras atkurti balso\\nTai bus:\\nKaip virti: nulupkite morkas, \u012fd\u0117ti
  \u012f konteiner\u012f ir padengti pienu. \u012ed\u0117kite nedidel\u012f ugn\u012f.
  \u012emai\u0161ykite morkas iki pasi\u016blymo. Dujoti\u0161ki pieno ir gerti \u0161ilta
  vis\u0105 dien\u0105. Per gydymo laikotarp\u012f g\u0117rimai, kuri\u0173 sud\u0117tyje
  yra kofeino, geria \u0161var\u0173 vanden\u012f.\\nPrevencin\u0117s priemon\u0117s\\n-
  Valdykite balso ton\u0105. Palaikykime vokalo laidus.\\n- Steb\u0117kite maist\u0105,
  \u012ftraukite \u012f baltym\u0173 maisto produkt\u0173, vaisi\u0173 ir dar\u017eovi\u0173,
  m\u0117sos sultinio, baltos m\u0117sos (virtos), pieno produkt\u0173 diet\u0105.\\n-
  Atsisakyk blog\u0173 \u012fpro\u010di\u0173.\\n- \u0160altuoju met\u0173 laiku j\u016bs
  i\u0161mokite kv\u0117puoti per nos\u012f. Tai apsaugo gerkl\u0173 nuo hipotermijos
  ir per\u0161alimo.\\n- Gaukite pakankamai miego, kasdien vaik\u0161\u010diokite
  grynu oru.\\n- Oro kambariai, ypa\u010d jei kambarys yra sausas.\\n- Venkite streso
  ir nerimo.\\nK\u0105 prisiminti\\n- Garsini\u0173 virvi\u0173 u\u017edegimas sukelia
  \u012fvairius veiksnius: per\u0161alim\u0105, pernelyg didel\u012f emocij\u0173
  i\u0161siver\u017eim\u0105, stres\u0105, nesveik\u0105 mityb\u0105.\\n- \u012ekv\u0117pimas,
  vaistai ir tradiciniai metodai pad\u0117s atkurti balso.\\n- L\u0117tinis u\u017edegimas
  gerkl\u0117je ir da\u017enas balso praradimas rodo lig\u0105. Pasitarkite su gydytoju.\\nKaip
  atkurti balso\\nGerbiami skaitytojai, \u0161iandien noriu pasidalinti su jumis patarimus,
  kaip greitai atkurti balso. Ties\u0105 sakant, a\u0161 pats esu muzikantas, daugiau
  nei 20 met\u0173 dirbu su vokalais. \u017dinau daug, a\u0161 pama\u010diau ir gird\u0117jau
  tiek daug, kad kartais manau, kad bus laikas dalyvauti moksliniame darbe. Bet ka\u017ekaip
  viskas priklauso ne nuo j\u0173.\\n\u0160ie patarimai tinka tiek profesionaliems
  vokalistams, tiek mokytojams, transliuotojams ir paprastiems \u017emon\u0117ms,
  ypa\u010d jei balsas pasidar\u0117 \u0161altas ar laringitas.\\n\u0160iek tiek apie
  tai, su kuo susiduriu realiuoju gyvenimu. Vokalistai yra labai \u012fdom\u016bs
  ir specifiniai \u017emon\u0117s. D\u017eiaugiuosi, kad buvau laimingas, sugeb\u0117jau
  dirbti su realiais mano srities specialistais.\\nTikras dainininkas tur\u0117t\u0173
  laimingai gyventi, gauti kuo daugiau teigiam\u0173 emocij\u0173. B\u016bt\u0173
  malonu, kad mes visi atkreipt\u0173 d\u0117mes\u012f \u012f \u0161\u012f charakterio
  savyb\u0119, ar ne? \u0160is dainininkas netur\u0117t\u0173 pernakvoti fizinio darbo,
  leisti stresui. Turi gerai valgyti, be pernelyg dideli\u0173 gaivi\u0173j\u0173
  g\u0117rim\u0173. S\u0105ra\u0161as gali b\u016bti t\u0119siamas. Kokia nuostabi
  profesija\\nTa\u010diau vis d\u0117lto jie turi tiek daug problem\u0173. Ir svarbiausia
  - tai profesionalus klausimas: kaip i\u0161saugoti savo bals\u0105, kaip j\u012f
  atkurti, jei turite problem\u0173. Reabilitacija turi b\u016bti nedelsiant. V\u0117lavimas
  yra kaip mirtis. Ir \u010dia visos priemon\u0117s yra geros.\\nA\u0161 pasidalinau
  savo receptais, k\u0105 daryti, jei praradote savo bals\u0105 ir turite j\u012f
  skubiai atkurti.\\nTr\u016bksta balso. Kaip greitai susigr\u0105\u017einti\\n- Galiu
  \u012fsivaizduoti, kaip dabar esate nusteb\u0119s mano pirmuoju patarimu, bet tai
  skamba taip: poilsio ir gilios tylos. Jei laikas leid\u017eia, visi naudoja \u0161\u012f
  b\u016bd\u0105. Jei turite bals\u0105, net negalite kalb\u0117ti \u0161nab\u017edesys.
  Susi\u017eeid\u017eia daugiau \u012ftemptos rai\u0161tin\u0117s nei \u012fprasta
  kalba.\\n- Ner\u016bkykite. Net jei leisite tai sau, tada, kai pirm\u0105 kart\u0105
  pasteb\u0117site savo balso problem\u0105, nustokite r\u016bkyti j\u0105 atstatyti.
  R\u016bkymas pats savaime ne tik silpnina k\u016bn\u0105, bet ir sukelia u\u017ekimim\u0105.\\n-
  Negalima kalb\u0117ti \u0161altyje. Daugelis tikriausiai \u0161ypsosi tokiais patarimais,
  bet tikiuosi, kad tai labai svarbu.\\n- Kv\u0117pavimas bet kokiu oru yra geresnis
  per nos\u012f. Tai apsaugo kv\u0117pavimo takus nuo dulki\u0173, infekcijos, \u0161ildo
  ir dr\u0117kina \u012fkvepiam\u0105 or\u0105.\\n- Jei turite problem\u0173 su savo
  balsu, geriausia kreiptis \u012f gydytoj\u0105 - phoniatora. Mes turime personalo
  nar\u012f Teatro institute, kur\u012f studentai visada gali susisiekti. Kai profesionalai
  tai daro, tada pagalba yra nedelsiant veiksminga. A\u0161 rekomenduoju j\u012f pritaikyti
  foniatristui, o ne paprastam ENT specialistui. M\u016bs\u0173 mokiniams ir tik visiems
  vokalistams, geras fonioris yra pasiaukojimas ir pagalba, tai kaip j\u016bs\u0173
  asmeninis treneris ir masa\u017eo terapeutas paprastiems \u017emon\u0117ms.\\n-
  Daugelis \u017emoni\u0173 naudoja lazgas ant gerkl\u0117s. A\u0161 nesu gydytojas.
  Ta\u010diau i\u0161 patirties \u017einau, kad daugelis i\u0161 j\u0173 i\u0161d\u017eiovina
  gleivin\u0119 ir visai nepadeda. Jie gali tik su\u017eeisti.\\n- \\\"Lyugol\\\"
  - tai papras\u010diausias ir nebrangus pad\u0117j\u0117jas sau. I\u0161minkite gerkl\u0119,
  bet po to j\u016bs negal\u0117site valgyti ir gerti apie pusvaland\u012f. Geriausia
  \u0161i\u0105 proced\u016br\u0105 atlikti 5 kartus. Ne visai gra\u017eus, bet toleruojamas.\\n-
  \u0160iltas, gausus g\u0117rimas. Geriausios vaista\u017eol\u0117s, vaisi\u0173
  g\u0117rimai termose. Galite \u0161ildyti mineralin\u012f vanden\u012f.\\n- M\u0117gstamiausias
  karamelinis vynas da\u017enai \u0161ildo rai\u0161\u010dius, padeda greitai atkurti
  balso, ta\u010diau grei\u010diausiai tai grei\u010diausia priemon\u0117, o ne gydomoji
  priemon\u0117. Tai geriau ne \u012fsitraukti \u012f j\u012f.\\n- \u012ekv\u0117pimas.
  Apie juos galiu pasakyti, kad praktikoje j\u016bs pats turite nustatyti sau, ar
  tokios proced\u016bros jums tinka. Asmeni\u0161kai a\u0161 niekada nenaudojau \u0161io
  metodo. A\u0161 i\u0161 karto nu\u0117jau visk\u0105 \u012f trach\u0117j\u0105 ir
  bronchus. Ta\u010diau daugelio atsiliepimai ver\u010dia mane tik\u0117ti \u0161iuo
  paprastu balso atk\u016brimo b\u016bdu.\\n- \u010cia yra vienas i\u0161 j\u016bs\u0173
  m\u0117gstam\u0173 recept\u0173 greitam balso atk\u016brimui: \u0161ilum\u0105 \u012fpilkite
  50 g konjako, prid\u0117kite 3 arbatinius \u0161auk\u0161telius medaus ir 3 la\u0161us
  citrinos. Gerti Tai laikomas avariniu metodu. Jei nepraleisite laiko, balso atk\u016brimas
  bus greitas.\\n- Garsusis \\\"Shalyapinsky receptas\\\": mu\u0161ti 2 kiau\u0161ini\u0173
  baltymus ir 2 arbatinius \u0161auk\u0161telius cukraus. \u012epilkite 50 g brend\u017eio.
  Kiekvienas kokteilio gurk\u0161nis su \u0161ilto vandens geriu. Proced\u016bra atliekama
  nakt\u012f, i\u0161kart eina miegoti. Iki ryto balsas atkuriamas. Tai yra vienas
  i\u0161 geriausi\u0173 recept\u0173, jei reikia greitai atkurti balso.\\n- M\u016bs\u0173
  studentai man pasakojo daugiau apie kar\u0161t\u0105 al\u0173. Taip pat nak\u010diai.
  Taip pat po dangteliais. Atsisakymas, bet efektyvus. Nurodykite, alus turi b\u016bti
  kar\u0161tas, o ne \u0161iltas. \u0160is metodas leid\u017eia greitai atkurti balso
  \u012fra\u0161\u0105.\\n- Pienas su figais. Operos dainininkai da\u017enai naudojami.
  Sausi figai supjaustyti per pus\u0119. \u012ed\u0117kite pien\u0105 \u012f virykl\u0119.
  Padauginkite fig\u0173 m\u0117s\u0105 i\u0161 \u0161i\u0173 dviej\u0173 pusi\u0173,
  \u012fpilkite pieno. Kruop\u0161\u010diai sumai\u0161ykite su pienu. Kaip j\u012f
  i\u0161minkti. Negalima pieno virti, kad jis b\u016bt\u0173 labai kar\u0161tas.
  Gerkite 2-3 dienas per dien\u0105 \u0161ilumos pavidalu.\\n- \u0160iltas pienas
  su medumi yra kategori\u0161kai draud\u017eiamas, nes medus apveria rai\u0161\u010dius,
  atimdamas j\u0173 elastingum\u0105. Gargling da\u017enai yra nenaudingas, o gargling
  su soda yra kenksmingas rai\u0161\u010diams, soda sukelia dirginim\u0105.\\n- Vienas
  i\u0161 labiausiai m\u0117gstam\u0173 recept\u0173 m\u016bs\u0173 draug\u0173 ratuose.
  Liaudies receptai atkurti m\u016bs\u0173 bals\u0105. \u012e keptuv\u0119 supilkite
  stiklin\u0119 kar\u0161to vandens ir pus\u0119 puodelio anijon\u0173 s\u0117kl\u0173,
  virkite 15 minu\u010di\u0173; \u0161iek tiek at\u0161aldyto sultinio, sumai\u0161ykite
  su ketvir\u010diu puodelio liep\u0173 medaus ir v\u0117l virkite, tada i\u0161imkite
  i\u0161 \u0161ilumos ir prid\u0117kite \u0161auk\u0161t\u0105 brend\u017eio. Paimkite
  po vien\u0105 \u0161auk\u0161t\u0105 kas pusvaland\u012f. Daugelis \u0161i\u0173
  dien\u0173 recept\u0173 atkuria savo bals\u0105.\\n- \u010cia yra dar vienas paprastas
  plau\u010di\u0173 \u017eol\u0117s receptas. 10 gram\u0173 \u017eol\u0117s u\u017epilkite
  400 ml verdan\u010dio vandens termoso 2 valandas ir gerkite pus\u0119 stiklin\u0117s
  4 kartus per dien\u0105 30 minu\u010di\u0173 prie\u0161 valg\u012f su u\u017ekim\u0161imu.\\n-
  Gali pad\u0117ti atkurti balso ir \u012fprast\u0105 viburnum. G\u0117li\u0173 ir
  uog\u0173 nuoviras yra gerai i\u0161plauti gerkl\u0117s skausm\u0105 ir silpn\u0105
  bals\u0105. 2 \u0161auk\u0161tai \u0161auk\u0161t\u0105 u\u017epilkite stikline
  verdan\u010dio vandens, virkite 15 minu\u010di\u0173 \u017eemai ugniai, \u0161erkite,
  gerkite 1/3 puodelio 3 - 4 kartus per dien\u0105 prie\u0161 valg\u012f.\\nK\u0105
  i\u0161skirti i\u0161 dietos, jei turite Osp ar praradote bals\u0105?\\nVisi pikanti\u0161ki
  negali: pipirai, \u010desnakai, svog\u016bnai, krienai, prieskoniai. J\u016bs taip
  pat negalite valgyti s\u016bdyt\u0173 ir marinuot\u0173 maisto produkt\u0173. Geriau
  gerkite \u0161ilumos pavidal\u0105. Kar\u0161tas g\u0117rimas gali pa\u017eeisti
  rai\u0161\u010dius.\\nJei esate alergi\u0161kas medui ar bet kuriai recept\u016bros
  daliai, skaitykite, bet kuriuo atveju nenaudokite j\u0173.\\nVisi\u0161kai prarastas
  balsas. K\u0105 daryti\\nIr pabaigoje straipsnyje nor\u0117\u010diau pamin\u0117ti
  skaitytojo atsiliepimus apie mano dienora\u0161t\u012f Zili Shakirova. Ji su manimi
  dalinosi, kaip ji atgauti savo bals\u0105, kai jis buvo prakti\u0161kai prarastas,
  ir gydytojai, \u0161velniai tariant, padar\u0117 nuvilian\u010dias prognozes. \u0160tai
  k\u0105 Zilya man pasak\u0117.\\nPo rimtos galvos traumos po nelaimingo atsitikimo,
  kartu su daugeliu kit\u0173 su\u017eeidim\u0173, buvo paraly\u017eius pus\u0117s
  gerybin\u0117s pad\u0117ties ir visi\u0161kai prarado savo bals\u0105. Nepaisant
  to, kad buvo i\u0161pl\u0117sta reabilitacijos veikla, kasdieniai balso restauraciniai
  pratimai, fizin\u0117 terapija su Vokastimo aparatu stimuliuojant nervinius impulsus,
  balsas nebuvo atkurtas, ir a\u0161 toliau kalb\u0117jau \u0161nab\u017etuvu. Konsultacijos
  su otoneurologu ir telefonu nepateik\u0117 joki\u0173 skatinam\u0173j\u0173 prognozi\u0173.\\nLabai
  atsitiktinai susipa\u017einau su berniuk\u0105 u\u017esiiman\u010diu pa\u017einimu,
  ir pasi\u016bl\u0117 naudoti perg\u0105 bendram k\u016bno stiprinimui. A\u0161 prad\u0117jau
  i\u0161tirpinti 1 arbatin\u012f \u0161auk\u0161tel\u012f 2-3 kartus per dien\u0105.
  Iki tre\u010diosios pergos naudojimo dienos pabaigos tur\u0117jau bals\u0105, taip
  netik\u0117tai, kad buvau net i\u0161sigand\u0119s.\\nT\u0119sdamas pergos i\u0161trynim\u0105,
  a\u0161 atlikdavau kasdien\u012f balsavim\u0105 ir visi\u0161k\u0105 pagreitinto
  balso atk\u016brimo proces\u0105. Nepaisant to, kad balsas buvo atstatytas, jis
  buvo tylus, matyt, d\u0117l to, kad jo ilgai tr\u016bko. Neurologas netgi juokavo,
  kad palaikyt\u0173 mane, sakydamas, kad turiu mading\u0105 bar\u010dio bals\u0105
  su rauk\u0161l\u0117tu balsu.\\nKart\u0105 a\u0161 nusprend\u017eiau gerti jodomarino
  kurs\u0105, tod\u0117l m\u016bs\u0173 regione jodo tr\u016bkumas daro \u012ftak\u0105
  sveikatai, net druska parduodama jodo. Beveik i\u0161 karto balsas skamb\u0117jo.
  I\u0161tyrus, kaip gal\u0117jo b\u016bti sukurta tokia stebuklinga transformacija,
  padariau i\u0161vad\u0105, kad tik jodo preparatas gali labai paveikti i\u0161reik\u0161t\u0105
  bals\u0105. Radau atsakym\u0105 internete, kuriame buvo patvirtinta, kad jodas teigiamai
  veikia balso gars\u0105.\\n\u0160tai k\u0105 kiti apie tai ra\u0161o: \\\"Ne veltui,
  kad\\\" bel canto \\\"Italijos t\u0117vyn\u0117 visose pus\u0117se yra apsupta j\u016br\u0173.
  Did\u017eiul\u0117 pakran\u010di\u0173 oro energija i\u0161garina j\u016bros vanden\u012f,
  kuriame yra daug vis\u0173 sveikatos reikm\u0117ms reikaling\u0173 element\u0173,
  \u012fskaitant jod\u0105. Jodo jonai valo ir mink\u0161tina kv\u0117pavimo takus
  ir gleivin\u0119. \\\"\\nPo to, kai atvyko \u012f otoneurolog\u0105, gydytojas buvo
  labai nusteb\u0119s, kad tur\u0117jau bals\u0105. Ji sak\u0117, kad turiu tai nepaisant
  vaist\u0173. Tai unikali, kad viskas nutiko! Po man\u0119s keli mano draugai susigr\u0105\u017eino
  savo bals\u0105, d\u0117l sud\u0117tingo gripo.\\nB\u016btina imtis parga atkurti
  balion\u0105 arbatin\u012f \u0161auk\u0161tel\u012f 2-3 kartus per dien\u0105 per\u0161alo,
  o \u017eiedadulk\u0117s yra labai skanu preparatas. Vienintelis dalykas: j\u016bs
  negalite vartoti po vakarien\u0117s ir vakare, nes jis stipriai stimuliuoja, d\u0117l
  ko atsiranda nemiga.\\nKalbant apie jodo poveik\u012f balso pasisakymui, gali pakakti
  skamba, bet tai yra mano sp\u0117jimas, ir a\u0161 to nepadariau.\\nD\u0117koju
  Zilyai u\u017e patarim\u0105. Dabar a\u0161 si\u016blau \u017ei\u016br\u0117ti daugiau
  vaizdo \u012fra\u0161\u0173 apie tai, kaip greitai atkurti bals\u0105. \u0160tai
  balsavimo praradimo prie\u017eastys ir pateikiami patikrinti patarimai, kurie papildys
  straipsnio med\u017eiag\u0105.\\nTai yra receptai, su kuriais a\u0161 bendrai naudoju.
  Tikim\u0117s, kad jie pad\u0117s greitai atkurti bals\u0105. \u017dinoma, linkiu
  jums tik geros sveikatos, kad visi per\u0161alimai ir sveikatos sutrikimai apeit\u0173
  jus.\\nKaip greitai atkurti tradicin\u0117s medicinos bals\u0105?\\nRytoj tur\u0117tum\u0117te
  svarbi\u0105 kalb\u0105, bet \u0161iandien negalite padaryti garso? Ar galite tiesiog
  \u0161nab\u017edesio neskaityti? Paprastos liaudies gynimo priemon\u0117s, praradusios
  balso, pad\u0117s jums sutaupyti.\\nKas yra balso praradimas?\\nBalso praradimas
  yra labai nemaloni b\u016bkl\u0117, atsirandanti, kai vokalo virvel\u0117s tampa
  u\u017edegimas ir patin\u0119. Medicinoje balso praradimo b\u016bsena vadinama aphonia.
  Balso praradimas gali b\u016bti visi\u0161kai ar dalinai. Kai dalinai prarandamas
  balsas, pastebima u\u017ekimimas ir silpnumas, o visi\u0161kas balso praradimas
  b\u016bdingas garsu, kuris skamba kaip \u0161nab\u017edesys.\\nBalso atgamina vokaliniai
  virveliai, taip pat vadinami vokaliais, kurie yra vir\u0161 tracheos (kv\u0117pavimo
  kaklelis). Garsiniai virveliai yra gerkl\u0117s gleivin\u0117s rauk\u0161l\u0117s,
  kurios vibruojasi, taip sukuriant gars\u0105. Norint tinkamai atkurti gars\u0105,
  garsiniai virveliai turi b\u016bti gerai sudr\u0117kinti arba alyvuoti. Bet koks
  garsini\u0173 virvi\u0173 u\u017edegimas ir sudirginimas gali susilpninti j\u0173
  geb\u0117jim\u0105 tinkamai vibracijai, o tai savo ruo\u017etu sukelia dalin\u012f
  ar visi\u0161k\u0105 balso praradim\u0105. Per kelias dienas balsu galima atkurti
  naudojant paprastus b\u016bdus.\\nKod\u0117l atsiranda balso praradimas?\\nKeletas
  veiksni\u0173 gali sukelti garsini\u0173 virvi\u0173 u\u017edegim\u0105, balso ir
  silpnumo praradim\u0105. Da\u017eniausiai tai atsitinka d\u0117l garsini\u0173 virk\u0161teli\u0173
  infekcijos pa\u017eeidimo. Afonijai sukelia gerkl\u0117s skausmas, gripas, \u0161altis,
  laringitas.\\nLaringitas gali b\u016bti \u016bmus ar l\u0117tinis. \u016aminis laringitas
  atsiranda d\u0117l \u016bmin\u0117s respiracin\u0117s virusin\u0117s infekcijos
  ar sunkios balso perkrovos. L\u0117tinio laringito prie\u017eastys yra gastroezofaginio
  refliukso liga, gleivi\u0173 nasopharynx, l\u0117tinis sinusitas, r\u016bkymas,
  nuolatinis kontaktas su dulk\u0117mis, dujomis ir chemin\u0117mis med\u017eiagomis.
  Taip pat, jei garsiai \u0161aukit\u0117s ar \u0161aukit\u0117s, galite prarasti
  balso.\\nKaip atgauti bals\u0105?\\nPoilsio vokalo akordai. Jei praradote balso
  d\u0117l \u0161al\u010dio, laringito, gerkl\u0117s skausmo ar per daug verksmo,
  tada \u0161iek tiek pails\u0117kite savo balsuose. Bendravimo metu nenaudokite savo
  balso, o ne \u0161nab\u017edesys - tai gali paskatinti garsinius virvelius. U\u017euot
  kalb\u0117j\u0119 garsiai, ra\u0161ykite u\u017era\u0161us ar prane\u0161imus.\\nGerkite
  daug skys\u010di\u0173. Didelis vandens geriamasis dr\u0117kina gerkl\u0119 ir skatina
  greit\u0105 atsigavim\u0105. Negalima gerti per kar\u0161to ar per \u0161alto g\u0117rimo.
  Gerkite \u0161iltus g\u0117rimus ir \u012f savo diet\u0105 \u012ftraukite \u0161iltos
  sriubos.\\n\u017doleli\u0173 tinkt\u016bros ir arbatos. Tigi\u0173 ir ramun\u0117li\u0173
  tinkt\u016bra padeda atleisti gerkl\u0119. Arbata su imbiero \u0161akniu padeda
  suma\u017einti silpnum\u0105 ir silpnum\u0105.\\nMedus Tai padeda sugr\u0105\u017einti
  balso ir medaus. Prid\u0117ti medaus \u0161iltu vandeniu ar \u017eoleli\u0173 arbata.
  Taip pat gijimo poveikis yra citrin\u0173 sul\u010di\u0173, kartu su \u0161ilta
  arbata ir medumi.\\nDr\u0117gnas oras. Nuraminti or\u0105 su specialiu dr\u0117kintuvu.
  \u0160is prietaisas palaiko reikiam\u0105 dr\u0117gm\u0117s lyg\u012f kambaryje
  ir padeda sudr\u0117kinti savo bals\u0105, ypa\u010d jei sausas oras suk\u0117l\u0117
  lig\u0105.\\nGaro inhaliacija. Steam prisideda prie u\u017edegimini\u0173 ir i\u0161tempt\u0173
  garsini\u0173 virvi\u0173 atstatymo. \u012ekv\u0117pkite, perpilkite kar\u0161to
  vandens duben\u012f, padengdami rank\u0161luos\u010diu ar antklod\u017eiu. B\u016bkite
  atsarg\u016bs, kad neu\u017edegtum\u0117te kar\u0161tu garu. Inhaliuoti garais 2
  kartus per dien\u0105 5 minutes.\\nSkalauti Valykite \u0161iltu vandeniu arba \u0161iltu
  \u017eoleli\u0173 nuoviestu, kad gal\u0117tum\u0117te su\u0161velninti ir sudr\u0117kinti
  vokalinius virvelius. Jei balso praradimas d\u0117l \u0161alto ar gerkl\u0117s skausmo,
  tada skalaukite druskos tirpalu. Skalavimas su druskos tirpalu padeda kraujo skub\u0117ti
  \u012f gerkl\u0117s skausm\u0105, taip pat druskos vanduo nudeda bakterijas, pa\u0161alina
  gleives i\u0161 gerkl\u0117s. Apkepkite ma\u017eiausiai 3-4 kartus per dien\u0105.\\nLollipops.
  Specialios spuogel\u0117s, skirtos kr\u016btin\u0117s angina gydyti, padeda su\u0161velninti
  gerkl\u0117s ir gerkl\u0173 u\u017edegim\u0105, taip pat sudr\u0117kina garsinius
  virves. Saldainiai ir kramtomoji guma padidina seili\u0173 sekrecij\u0105, kuri
  padeda sudr\u0117kinti garsinius virvelius.\\nK\u0105 daryti, kai prarasite bals\u0105\\nJ\u016bs
  negalite gerti caffeinated g\u0117rim\u0173, toki\u0173 kaip kava, arbata, kola,
  kol visi\u0161kai atsigausite. Kadangi kofeino g\u0117rimai dehidratuoja k\u016bn\u0105.\\nJ\u016bs
  negalite r\u016bkyti, nes cigare\u010di\u0173 d\u016bmai dar labiau erzinanti ir
  sausa gerkl\u0119. Netgi pasyvus r\u016bkymas sukelia gerkl\u0173 sudirginim\u0105
  ir u\u017edegim\u0105, kuris gali sul\u0117tinti gijimo proces\u0105.\\nJ\u016bs
  negalite gerti alkoholini\u0173 g\u0117rim\u0173, nes jie dehidratuoja k\u016bn\u0105
  ir sustiprina ligos eig\u0105.\\nVenkite viet\u0173, kuriose yra daug dulki\u0173,
  d\u016bm\u0173, \u0161alto oro ir kit\u0173 galim\u0173 dirginan\u010di\u0173 med\u017eiag\u0173.\\nJ\u016bs
  negalite naudoti vazokonstrikcini\u0173 vaist\u0173 ir prie\u0161srovini\u0173 priemoni\u0173,
  nes jie i\u0161d\u017eiovina vokalinius virves.\\nNevartokite aspirino, ypa\u010d
  jei balso praradimas pasirei\u0161k\u0117 garsiai \u0161aukiant. Gali b\u016bti,
  kad kapiliaras buvo sugadintas ant balso gyslo gleivin\u0117s. Aspirinas gali suma\u017einti
  kraujo kre\u0161\u0117jim\u0105 ir sukelti kraujavim\u0105.\\nJ\u016bs negalite
  valgyti maisto produkt\u0173, kuri\u0173 sud\u0117tyje yra daug r\u016bg\u0161\u010di\u0173,
  pavyzd\u017eiui, pomidorai, \u0161okoladas, citrusiniai vaisiai (i\u0161imtin\u0117
  citrin\u0173 sultys kartu su medumi).\\nBalso praradim\u0105 gali sukelti rimtesn\u0117s
  s\u0105lygos, pavyzd\u017eiui, vokalo aparat\u0173 v\u0117\u017eio. Jei visos pirmiau
  min\u0117tos priemon\u0117s nepadeda atkurti balso ir atsikratyti silpnumo, turite
  kreiptis \u012f gydytoj\u0105.\\nKaip gr\u0105\u017einti bals\u0105 ir atkurti garsinius
  virves\\nBalas yra kaprizingas instrumentas, o ruden\u012f jis gali b\u016bti lengvai
  pa\u0161alintas dr\u0117gm\u0117s, streso, per\u0161alimo ir nesveikos dietos. Kaip
  gr\u0105\u017einti prarast\u0105 bals\u0105?\\nKod\u0117l gi prarasti bals\u0105?\\nPaprastai
  balso praradimas ar disfonija nustatoma ryte. Problema gali tur\u0117ti daugyb\u0119
  prie\u017eas\u010di\u0173, tod\u0117l jas reikia i\u0161spr\u0119sti.\\nPagrindinis
  kaltininkas - gerkl\u0173 gleivin\u0117s u\u017edegimas, arba laringitas. Garsiniai
  virveliai did\u0117ja, o garsas dingsta arba praranda kokyb\u0119. J\u016bs galite
  pasiekti tok\u012f gyvenim\u0105 \u012fvairiais b\u016bdais.\\nVisi ausies nosies
  ir gerkl\u0117s sistemos organai dalyvauja formuojant gars\u0105, o jei ka\u017ekas
  negerai \u010dia, tai bus problem\u0173 su balsu. \u0160alto, gerkl\u0117s skausmingumo,
  tonzilito ar bronchito metu gerkl\u0173 gleivin\u0117 i\u0161sipu\u010dia ir tampa
  sausa. Tipi\u0161ka pasekm\u0117 yra balso praradimas.\\nVerkimas ar ilgas pokalbis,
  ypa\u010d d\u0117l i\u0161kilusi\u0173 ton\u0173, gali sukelti garsini\u0173 virveli\u0173
  perteklius ir su\u017eeidimus. Ruden\u012f poveik\u012f daro oras (v\u0117jas ir
  dr\u0117gm\u0117 kenksmingi ry\u0161ul\u0117ms) ir \u0161ildymo sezono prad\u017eia
  (balsas reaguoja neigiamai \u012f saus\u0105 or\u0105).\\nBalso praradimas gali
  sukelti stres\u0105 ir sukr\u0117timus. Prisiminkite frazes, pvz., \\\"Kaimo balsas
  buvo susijaudin\u0119s\\\" arba \\\"pasibais\u0117j\u0119s nuo pasipiktinimo\\\".\\nAtk\u016brimo
  programa\\nAtsi\u017evelg\u0119 \u012f prie\u017eastis, galite prad\u0117ti reabilitacij\u0105.
  Priklausomai nuo simptom\u0173 sunkumo, tai gali u\u017etrukti nuo dviej\u0173 iki
  dviej\u0173 savai\u010di\u0173.\\nBalso problemos nei\u0161nyksta per 2-3 savaites?
  Jums reikia baigti savigarb\u0105 ir eiti \u012f otolaringolog\u0105.\\nDainininkai
  labiau trok\u0161ta, nei kiti, savo balsu - tai priklauso nuo jo, jei ne gyvenimas,
  tada karjera. Tod\u0117l jie turi daug recept\u0173, kurie padeda sugr\u0105\u017einti
  bals\u0105.\\nPasak j\u0173, Fiodoras Shalyapinas buvo apdorotas brend\u017eio,
  citrin\u0173 sul\u010di\u0173, kiau\u0161ini\u0173 ir medaus mi\u0161iniu, paimtais
  vienodais kiekiais.\\nLjudmila Zykina balsas pad\u0117jo gr\u0105\u017einti kit\u0105
  recept\u0105. 50 g anizuot\u0173 gr\u016bd\u0173 pilamas 400 ml vandens, mi\u0161inys
  virinamas \u0161iek tiek \u0161iluma 10 minu\u010di\u0173. Tada j\u012f reikia filtruoti,
  \u012fpilti 50 g medaus ir 50 ml brend\u017eio ir u\u017epilti po 1 valgom\u0105
  \u0161auk\u0161t\u0105. l kas valand\u0105\\nOlga Arefieva burda moli\u016bg\u0173
  s\u0117kl\u0173 aliej\u0173 savo gerkl\u0117je, i\u0161kv\u0117pdama ir rekomenduoja
  gerti kar\u0161t\u0105 pien\u0105 Borjomi santykiu 1: 1.\\nMarina X\u043be\u0431H\u0438koBa
  mano, kad persik\u0173 aliejaus gydomoji j\u0117ga, inhaliacijos vaista\u017eol\u0117mis,
  pirmiausia su jona\u017eoli\u0173 ir raudon\u0117li\u0173, sukelia antimikrobin\u012f
  poveik\u012f ir pagreitina bals\u0105.\\nOlandas Gazmanovas, kai jo balsas nu\u0117jo,
  nuvyko \u012f j\u016br\u0105, ten m\u0117nes\u012f gyveno visi\u0161kai tyliai ir
  skalavo gerkl\u0119 j\u016bros vandeniu.\\nJei balsas i\u0161nyks, kaip j\u012f
  skubiai atkurti\\nBalso praradimas (aphonia) yra viena i\u0161 sud\u0117ting\u0173
  situacij\u0173, kurios gali b\u016bti tikra problema. Ypa\u010d jei asmens profesin\u0117
  veikla susijusi su bendravimu. Tai dainininkai, aktoriai, mokytojai ir kitos specialyb\u0117s.
  Kaip greitai susigr\u0105\u017einti tr\u016bkstam\u0105 bals\u0105?\\nBalso praradimo
  prie\u017eastys\\nYra 4 pagrindin\u0117s prie\u017eastys, d\u0117l kuri\u0173 balsas
  prarandamas. Tai yra:\\n- Infekcin\u0117s ligos - da\u017eniausiai afronija vystosi
  d\u0117l laringito (liga sukelia vokalini\u0173 virvi\u0173 patinim\u0105).\\n-
  Garsini\u0173 virveli\u0173 perk\u0117limas yra tipi\u0161ka problema, pavyzd\u017eiui,
  mokymo personalui. Staigus balso praradimo prie\u017eastis tampa ilg\u0105 pokalb\u012f
  d\u0117l i\u0161kelt\u0173 ton\u0173 ar verksmo. Tai taip pat randama \u017emon\u0117se
  su silpnomis vokalin\u0117mis virv\u0117mis.\\n- Nerv\u0173 stresas. Stiprus stresas
  visada neigiamai veikia \u017emoni\u0173 sveikat\u0105. Ir balso praradimas n\u0117ra
  i\u0161imtis.\\n- Nauji ragenos ertm\u0117s augalai, \u0161irdies ir kraujagysli\u0173
  ligos, skydliauk\u0117s sutrikimai.\\nJei balsas pasikeit\u0117, turite \u012fsid\u0117m\u0117ti
  \u0161ias taisykles:\\n- Turime bandyti kuo ma\u017eiau kalb\u0117ti. Net \u0161nab\u017edesys
  ne\u012ftraukiami, nes jis sukelia stipri\u0105 u\u017edegimini\u0173 rai\u0161\u010di\u0173
  \u012ftamp\u0105.\\n- Reikia gerti daug skys\u010di\u0173. Tai padeda dr\u0117kinti
  u\u017edegimines gleivines. G\u0117rimai tur\u0117t\u0173 b\u016bti \u0161ilti,
  bet ne kar\u0161ti.\\n- Laikykite gerkl\u0119 \u0161ilta, i\u0161skyrus hipotermij\u0105.
  Galite pakabinti j\u0105 \u0161iltu skara.\\n- Sergamumo metu draud\u017eiama r\u016bkyti,
  paimti alkohol\u012f, gerti caffeinated g\u0117rimus. B\u016btina i\u0161skirti
  skonio r\u016bg\u0161tus produktus.\\nGydymas\\nKaip atkurti nelygius balsus namuose?
  Yra kelios kryptys.\\nLiaudies keliai\\nJei mes kalbame apie tai, kaip greitai atkurti
  s\u0117dint\u012f bals\u0105, galite pabandyti naudoti vien\u0105 i\u0161 populiariausi\u0173
  metod\u0173.\\nGeri rezultatai pasiekiami vartojant medicininius g\u0117rimus:\\n-
  Sumai\u0161ykite tokius pa\u010dius medaus ir mork\u0173 sul\u010di\u0173 kiekius
  (1 valgomasis \u0161auk\u0161tas) ir sumai\u0161ykite su \u0161ildomu pienu (200
  ml).\\n- \u0160velniu balsu galima gydyti \u0161ilto alaus pagalba, bet j\u016bs
  netur\u0117tum\u0117te piktnaud\u017eiauti, u\u017eteks reguliaraus stiklo.\\n-
  Kukur\u016bz\u0173 \u0161akn\u0105 sumalkite m\u0117smaliu / mai\u0161ytuvu (2 cm),
  u\u017epilkite verdan\u010diu vandeniu (200 ml) ir leiskite j\u012f u\u017evirinti.
  Nutek\u0117jimas, \u012fd\u0117ti cukraus \u012f gerti ir gerti 1 valgomasis \u0161auk\u0161tas.
  l vis\u0105 dien\u0105.\\n- B\u016btina i\u0161mai\u0161yti alavijo gabal\u0117liu
  mai\u0161ytuve \u012f srut\u0105 ir sumai\u0161yti su tuo pa\u010diu medaus kiekiu.
  Mi\u0161inys tur\u0117t\u0173 b\u016bti rassasyvat kaip saldainiai iki 6 kart\u0173
  per dien\u0105.\\n- Gr\u0105\u017einti tr\u016bkstam\u0105 bals\u0105 pad\u0117s
  figos. Nor\u0117dami tai padaryti, sumai\u0161ykite vaisi\u0173 ir u\u017epilkite
  stikline \u0161ilto pieno. Leisk jam stov\u0117ti \u0161iek tiek laiko. Gerkite
  iki 3 kart\u0173 per dien\u0105.\\n- \u012e \u0161ilt\u0105 pien\u0105 (200 ml)
  sumai\u0161ykite medaus \u0161auk\u0161t\u0105, sviest\u0105 ir gerkite prie\u0161
  mieg\u0105.\\n- Imtis lygiomis proporcijomis citrin\u0173 sul\u010di\u0173, medaus,
  brend\u017eio ir 1 mai\u0161to kiau\u0161inio. Sudedamosios dalys sumai\u0161omos
  ir kaitinamos vandens vonioje. Paimkite \u00bd puodelio 4 kartus per dien\u0105.\\n-
  15 g smulkios \u0161aknies \u0161aknies u\u017epilkite stipriu alkoholiu (50 ml)
  ir primygtinai reikalauju 3 savaites. Gerkite 15 la\u0161\u0173 tris kartus per
  dien\u0105. Gydymo trukm\u0117 - 2 savaites.\\n- I\u0161spauskite kop\u016bst\u0105,
  naudodami sul\u010di\u0173 valikliu. Prie\u0161 vartojim\u0105, jis turi b\u016bti
  praskied\u017eiamas vandeniu santykiu 1: 1. Gerkite 4 kartus per dien\u0105 per
  savait\u0119.\\nJei balso neb\u0117ra, tuomet galite gaminti eggnog\u0105. Tai pad\u0117s
  atsikratyti silpnumo, skausmo ir pad\u0117ti sugr\u0105\u017einti bals\u0105 per
  trump\u0105 laik\u0105.\\n- I\u0161mai\u0161ykite 2 kiau\u0161ini\u0173 trynius
  su cukrumi arba medumi (2 \u0161auk\u0161tai).\\n- U\u017epildykite mi\u0161in\u012f
  \u0161iltu pienu (1/2 puodelio pieno). Leid\u017eiama prid\u0117ti apelsin\u0173
  sultis, brend\u012f, rom\u0105 prie g\u0117rimo, ta\u010diau tr\u016bkstamo balso
  atveju geriau vengti alkoholio.\\n- Baltymai su cukrumi yra plakti atskirai ir taip
  pat \u012f g\u0117rim\u0105.\\nJie geria eggnog \u0161iltu.\\nPienas su anijonu
  ir medumi pad\u0117s atkurti silpn\u0105 bals\u0105.\\n- Paruo\u0161kite pien\u0105
  (200 ml) ir sumai\u0161ykite su 1 \u0161auk\u0161teliu. medaus ir \u00bd \u0161auk\u0161to
  sviesto. Nor\u0117dami pagerinti gydom\u0105j\u012f poveik\u012f, galite prid\u0117ti
  \u0161iek tiek natrio. Gerkite gerti tris kartus per dien\u0105. Gydymo trukm\u0117
  yra 5 dienos.\\n- 250 ml pieno sumai\u0161ykite 1 valgomasis \u0161auk\u0161tas.
  l ani s\u0117klos. Virinama, atv\u0117sinama ir filtruojama. \u012ed\u0117kite 1
  \u0161auk\u0161t\u0105. l medus ir 2 \u0161auk\u0161tus kas 2 valandas per dien\u0105.
  \u0160is receptas padeda greitai praleisti tr\u016bkstam\u0105 bals\u0105.\\nGeras
  terapinis rezultatas suteikia medunitsa. Augalyje yra didelis procentas saponin\u0173
  ir tanin\u0173, kurie prisideda prie burnos gleivin\u0117s u\u017edegimin\u0117s
  mink\u0161t\u0117jimo ir dr\u0117kinimo. Be to, medunitsa turi antimikrobines ir
  prie\u0161u\u017edegimines savybes.\\n- Sumai\u0161ykite gvazdik\u0117li\u0173 \u017eol\u0119
  (15 g) \u012f termos\u0105 ir \u012fpilkite 500 ml verdan\u010dio vandens. Palikite
  pusantros valandos. Filtruokite ir gerkite \u00bd puodelio tris kartus per dien\u0105
  prie\u0161 valg\u012f 30 minu\u010di\u0173. Kurso trukm\u0117 - 10 dien\u0173.\\nSiaubingas
  balsas gali b\u016bti gr\u0105\u017eintas s\u0117kl\u0173 pagalba Jie prisideda
  prie patologin\u0117s edemos pa\u0161alinimo i\u0161 garsini\u0173 virvi\u0173,
  atkuria pa\u017eeistus audinius, sunaikina patogenines bakterijas ir tt\\n- 1 \u0161auk\u0161t\u0105
  s\u0117ti u\u017epilkite 500 ml verdan\u010dio vandens ir reikalauju termose 2 -
  3 valandos. Gerkite 200 ml iki 6 kart\u0173 per dien\u0105. Terapijos trukm\u0117
  - 10 dien\u0173.\\n- Po kiekvieno terapinio g\u0117rimo naudojimo praskalauti gerkl\u0119
  alyvuogi\u0173 aliejumi. Tai padidina g\u0117rimo poveik\u012f, toliau \u0161velnina
  gerkl\u0117s ir gerkl\u0173 gleivin\u0119.\\nGydomoji gimnastika\\nKaip gauti balso
  atgal su pratimais? Kompleksas kiekvienu konkre\u010diu atveju yra pasirinktas atskirai,
  ta\u010diau buvo parengti bendri metodai.\\nPrie\u0161 prad\u0117dami mokytis, turite
  masa\u017euoti gerkl\u0173. Du pir\u0161tai \u0161velniai masa\u017euoja kakl\u0105,
  jud\u0117dami apskrito judesiu nuo vir\u0161aus iki apa\u010dios. Proced\u016bra
  pagerina vietin\u0119 kraujotak\u0105.\\nPati kompleksas apima \u0161iuos pratimus:\\n-
  Galva i\u0161mesta atgal B\u016btina imituoti kv\u0117pavimo garsus.\\n- Paleiskite
  gars\u0105 \\\"M\\\", vienu metu paliesdami nosies sparnus su pir\u0161tais.\\n-
  Garsiai pasakyk skiemen\u012f \\\"BY\\\", \u0161velniai paliet\u0119 vir\u0161utin\u0117s
  l\u016bpos pavir\u0161i\u0173.\\n- Giliai kv\u0117puoti. I\u0161siver\u017e\u0119,
  palieskite savo kr\u016btin\u0119 ir giedokite garsus.\\n- S\u0117d\u0117k kaip
  \u0161launis ant pakra\u0161\u010dio koj\u0173. I\u0161stumkite savo lie\u017euv\u012f
  kaip \u012fmanoma sunkiau ir pabandykite i\u0161girsti gars\u0105 \\\"K\\\".\\nMedicinin\u0117
  pagalba\\nJei balsas dingo su \u0161al\u010diu, tada be vaist\u0173 pagalbos neveiks.
  Mes galime rekomenduoti \u0161iuos vaistus:\\n- \\\"Faringoseptas\\\". Medicina
  su antibakteriniu poveikiu.\\n- \\\"Septolete\\\". Vaistiniai preparatai su kombinuotomis
  savyb\u0117mis. Jis turi kelias savybes vienu metu - antimikrobinis, analgetikas,
  mink\u0161tinantis ir kenksmingas.\\n- \\\"Dekatilen\\\". Naudojamas kaip anestezijos,
  baktericidinis ir prie\u0161grybelinis agentas.\\n- \\\"Gomeovoks\\\". Homeopatinis
  vaistas su sud\u0117tingu veiksmu. Paskirta, kad gauna gerkl\u0117s u\u017edegim\u0105,
  ypa\u010d balso silpnum\u0105, rai\u0161\u010di\u0173 patinim\u0105 ir kt.\\nVeiksmingiau
  aphonijos gydymui yra aerozoliai, kurie teikia auk\u0161tos kokyb\u0117s pur\u0161kimo
  vaistinius komponentus.\\n- Hexoral. Antiseptikas, turintis anestetik\u0173, antimikrobini\u0173,
  dr\u0117kinan\u010di\u0173 ir dengian\u010di\u0173 savybi\u0173.\\n- Ingalipt. Prie\u0161u\u017edegiminis
  vaistas su dezinfekcin\u0117mis savyb\u0117mis.\\n- \\\"Chlorophyllipt\\\". Nat\u016brali
  vaisto sud\u0117tis su antibakteriniu poveikiu.\\n- \\\"Kametonas\\\". Kombinuotas
  agentas, turintis prie\u0161u\u017edegimini\u0173 ir antiseptini\u0173 savybi\u0173.\\nGargle\\nJei
  balsas s\u0117d\u0117jo ir b\u016btina j\u012f skubiai atkurti, tada galima pabandyti
  skalauti.\\n- Norimas rezultatas duodamas nuoviras ar infuzijas i\u0161 medetk\u0173
  ir \u0161alavij\u0173.\\n- Nauda atne\u0161 druskos sanitarijos gerkl\u0119. Papras\u010diausias
  receptas - \u00bd \u0161auk\u0161telio. Imamas 200 ml \u0161ilto vandens. druska
  ir keli la\u0161ai jodo. Pakeisti proced\u016br\u0105 gali b\u016bti gydymas gleivin\u0117s
  Lugol.\\n- Ramun\u0117 susidoroja su u\u017edegiminiu procesu, pa\u0161alina garsini\u0173
  virvi\u0173 patinim\u0105. 1 litras verdan\u010dio vandens imamasi 1 valgomasis
  \u0161auk\u0161tas. l ramun\u0117li\u0173 spalva. Po infuzijos g\u0117rimas turi
  b\u016bti filtruojamas ir naudojamas skalavimui.\\n- Kepkite svog\u016bnus orkait\u0117je
  ir nu\u0161luostykite per siet\u0105. Tada jis turi b\u016bti atskiestas \u0161iltu
  vandeniu, kad tirpalo konsistencija ir kas valand\u0105 b\u016bt\u0173 naudojama
  sanitarijai.\\n- Anizuotos s\u0117klos padeda i\u0161gydyti skausmingus vokalinius
  virvelius. I\u0161 j\u0173 b\u016btina paruo\u0161ti nuovir\u0105. Taikyti skalbimui
  reikia kas valand\u0105. Jei asmuo praranda savo bals\u0105, \u0161i proced\u016bra
  pad\u0117s atkurti j\u0105 labai greitai, pa\u017eod\u017eiui 2-3 proced\u016brose.\\n-
  Sumai\u0161ykite lygias dalis ramun\u0117li\u0173, kalendul\u0173 ir eukalipto vienodais
  kiekiais. Tada 1 valgomasis \u0161auk\u0161tas. l kompozicija u\u017epilama 200
  ml verdan\u010dio vandens ir paliekama \u012fdegti 30 minu\u010di\u0173. Skalauti
  kas 2 valandas.\\nKompresai\\nNorint atkurti balso ir gydyti u\u017edegtas rai\u0161tis,
  leid\u017eiama daryti kompresus ant gerkl\u0117s. Pasirinktoje kompozicijoje b\u016btina
  \u0161velninti bet kok\u012f mink\u0161t\u0105 med\u017eiag\u0105 (turi b\u016bti
  geros absorbcin\u0117s savyb\u0117s). Pernelyg reikia i\u0161spausti, kad skystis
  neprasiskverbt\u0173. Tada jis taikomas ant gerkl\u0117s pavir\u0161iaus, padengto
  folija ir \u0161ildomas \u0161alikliu ar skara.\\n- Degtin\u0117. Alkoholis turi
  b\u016bti skied\u017eiamas vandeniu 1: 1.\\n- Riebaluotas. Prie\u0161 naudojim\u0105
  gaminys turi b\u016bti \u0161ildomas iki patogios temperat\u016bros.\\n- Medus Medus
  tur\u0117t\u0173 b\u016bti dedamas ant kop\u016bst\u0173 lapo pavir\u0161iaus. Apvyniokite
  aplink gerkl\u0119 ir \u0161ildykite megztu skara ar plunksniu.\\n\u012ekv\u0117pimas\\nKaip
  susigr\u0105\u017einti tr\u016bkstam\u0105 bals\u0105? Aphonijos gydymui galite
  naudoti inhaliacijas, kuri\u0173 pagrind\u0105 sudaro eteriniai aliejai ir vaistiniai
  augalai:\\n- \\\"Hypericum\\\" ir \\\"Oregano\\\" sultinyje reikia prid\u0117ti
  2-3 la\u0161us persik\u0173 eterio. Kompozicija puikiai dr\u0117kina gleivin\u0119,
  suteikia mink\u0161tinimo efekt\u0105.\\n- Virtos bulv\u0117s vienoje. Kar\u0161tas
  gar\u0173 lygis taip pat padeda u\u017edeginti vokalinius virves d\u0117l per\u0161alimo.\\n-
  Vienodais kiekiais sumai\u0161ykite eukalipto, ramun\u0117li\u0173, jona\u017eoli\u0173,
  \u010diobreli\u0173 ir laim\u0173 \u017eied\u0173 \u017eol\u0119. Paimkite 3 \u0161auk\u0161tus
  sumai\u0161ykite ir paruo\u0161kite 750 ml verdan\u010dio vandens. 20 minu\u010di\u0173
