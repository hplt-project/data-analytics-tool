sample: '["\"Metas susitvarkyti elektronikos atliekas!\\n2025-07-10 08:42Elektronikos
  supirkimo punktuose priimama ne tik veikianti \u012franga, bet ir sugedusi, i\u0161rinkta,
  pusiau sul\u016b\u017eusi ar net jau nenaudojama de\u0161imtme\u010dius. Kod\u0117l?
  Daugelyje \u0161i\u0173 prietais\u0173 yra verting\u0173 med\u017eiag\u0173 \u2013
  vario, aukso, sidabro, alavo, plastiko, net ret\u0173j\u0173 metal\u0173. Tad vasara
  \u2013 puikus metas sutvarkyti pal\u0117pes, spintas, sand\u0117liukus ir parduoti
  elektronikos atliekas.\\nKas superkama?\\nKompiuteriai ir j\u0173 dalys (net sugedusios)\\n-
  Stacionar\u016bs ir ne\u0161iojamieji kompiuteriai\\n- Motinin\u0117s plok\u0161t\u0117s\\n-
  Kietieji diskai (HDD, SSD)\\n- Procesoriai (CPU)\\n- Vaizdo plok\u0161t\u0117s (GPU)\\n-
  RAM atmintys\\n- Maitinimo blokai\\n- Kompiuteri\u0173 korpusai (net tu\u0161ti).\\nNet
  jei kompiuteris neveikia, jo dalis galima i\u0161ardyti ir perdirbti. Kai kurios
  turi aukso padengim\u0173, o kitos \u2013 verting\u0173 lydini\u0173.\\nMobilieji
  telefonai (bet kokios b\u016bkl\u0117s)\\n- I\u0161manieji ir seni mygtukiniai telefonai\\n-
  Telefono baterijos (Li-ion, NiMH)\\n- \u012ekrovikliai ir laidai\\n- Supl\u0117\u0161yti
  d\u0117klai, aksesuarai.\\nNet seni \u201eNokia\u201c modeliai ar pirmosios kartos
  \u201eSamsung\u201c telefonai turi med\u017eiag\u0173, kurios perdirbamos. Be to,
  kai kurios supirktuv\u0117s moka daugiau u\u017e tam tikrus senus modelius, vertinamus
  kolekcionieri\u0173.\\nTelevizoriai, monitoriai, ekranai\\n- CRT (senieji kineskopiniai)
  televizoriai\\n- LCD, LED, OLED ekranai\\n- Kompiuteri\u0173 monitoriai\\n- Projektoriai\\n-
  Ne\u0161iojam\u0173j\u0173 grotuv\u0173 ar navigacij\u0173 ekranai.\\nNors CRT televizoriai
  sunk\u016bs ir da\u017enai guli gara\u017euose kelis de\u0161imtme\u010dius, jiems
  perdirbti reikia specializuoto punkto, bet dauguma supirk\u0117j\u0173 juos priima.\\nSmulki
  buitin\u0117 technika\\n- Skrudintuvai, plakikliai\\n- Virduliai, kavos aparatai,
  virtuviniai kombainai\\n- Elektrin\u0117s virykl\u0117s, mikrobang\u0173 krosnel\u0117s\\n-
  Elektriniai \u0161epet\u0117liai, plauk\u0173 d\u017eiovintuvai, barzdaskut\u0117s\\n-
  Elektrin\u0117s \u017eoliapjov\u0117s, gr\u0105\u017etai, pj\u016bklai.\\nJei \u012frenginys
  jungiamas \u012f elektros lizd\u0105, didel\u0117 tikimyb\u0117, kad j\u012f galima
  priduoti.\\nBuitin\u0117 elektronika\\n- DVD, CD grotuvai\\n- Muzikos centrai\\n-
  Radijo imtuvai, kolon\u0117l\u0117s\\n- Vaizdo kase\u010di\u0173 grotuvai (VHS)\\n-
  \u017daidim\u0173 konsol\u0117s (PS, Xbox, Nintendo) \u2013 net neveikian\u010dios\\n-
  Laidai, kabeliai ir jungtys.\\nElektros instaliacijos kabeliai\\n- USB, HDMI, VGA
  laidai\\n- Skaldytos ki\u0161tukin\u0117s jungtys, \u0161akotuvai\\n- Maitinimo
  kabeliai (su ar be ki\u0161tuko).\\nDaugelyje j\u0173 yra vario, kuris itin vertinamas.
  Kai kurios supirktuv\u0117s u\u017e laidus moka pagal svor\u012f, tod\u0117l senas
  laid\u0173 ry\u0161ulys gali virsti netik\u0117tu u\u017edarbiu.\\nElektronikos
  komponentai\\n- Spausdintos plok\u0161t\u0117s (PCB)\\n- Transformatoriai\\n- Elektronin\u0117s
  rel\u0117s, kondensatoriai\\n- Maitinimo blokai i\u0161 \u012fvairi\u0173 \u012frengini\u0173\\n-
  Senos lempos (fluorescencin\u0117s, halogenin\u0117s \u2013 tik kai kur).\\nKai
  kuri\u0173 supirktuvi\u0173 specializacija \u2013 b\u016btent elektroniniai komponentai,
  tod\u0117l net i\u0161ardyti prietaisai dar gali b\u016bti vertingi.\\nProjekt\u0105
  \u201e\u017daliasis puslapis\u201c i\u0161 dalies finansuoja \u201eMedij\u0173 r\u0117mimo
  fondas\u201c (8000 Eur)\\nAutor\u0117 Egl\u0117 Stratkauskait\u0117\"", "\"Po 2014
  metais statyto miuziklo, aktor\u0117 Cameron Diaz tdingo i\u0161 d\u0117mesio centro.
  Viename interviu \u017eavioji moteris pasak\u0117, kad tiesiog pavargo nuo nuolatini\u0173
  kelioni\u0173 darbo metu ir nusprend\u0117 pails\u0117ti.\\n\u201eI\u0161 tikr\u0173j\u0173
  net negaliu sau pasakyti, kas a\u0161 esu. Su tuo susidurti yra labai sunku, pajutau
  nor\u0105 tiesiog pab\u016bti su savimi\u201c, - pertraukos aktoryst\u0117je prie\u017east\u012f
  paai\u0161kino 44 met\u0173 aktor\u0117.\\nKol C. Diaz m\u0117gavosi u\u017esitarnautu
  poilsiu, ji \u012fsimyl\u0117jo roker\u012f Benji Madden. Pora susituok\u0117 2015
  met\u0173 saus\u012f, vos po 7 m\u0117nesi\u0173 draugyst\u0117s. Aktor\u0117 prisipa\u017eino,
  kad ji lauk\u0117 \u0161i\u0173 vedyb\u0173, nors ir neskub\u0117jo eiti prie altoriaus.\\n\u201eSuprantate,
  a\u0161 vis nerasdavau tinkamo vyro. Tur\u0117jau daug vaikin\u0173, bet yra mil\u017eini\u0161kas
  skirtumas tarp vaikino ir sutuoktinio. Ir dabar turiu tok\u012f, kuris yra ne tik
  santuokoje vyras, bet ir mano gyvenimo partneris\u201c, - pasakojo C. Diaz. Aktor\u0117
  prisipa\u017eino, kad nepaisant to, jog abu su vyru yra gana prie\u0161ingos asmenyb\u0117s,
  jie labai papildo vienas kit\u0105.\"", "\"PANI Moter\u0173 Ilgai Perukai Vandens
  Banga Sintetiniai Perukai U\u017e Wowen 613 Blond Plauk\u0173 Perukas Cosplay Perukas
  Lolita Perukas Palaidi Plaukai Prat\u0119simo\\nApra\u0161ymas\\nMieli draugai,
  a\u010di\u016b, kad lankot\u0117s m\u016bs\u0173 parduotuv\u0117je.Jei turite klausim\u0173,Kvie\u010diame
  susisiekti su mumis bet kuriuo metu !!U\u017esakymai bus surengtas kaip tik j\u016bs\u0173
  mok\u0117jimas buvo atliktas s\u0117kmingai sistema per 24 valandas!M\u016bs\u0173
  prek\u0117s \u2014 PANI , buvo \u012fkurta 2011 m., mes esame profesionalus gamintojas
  Sintetini\u0173 perukai gamyklos Xuchang Kinija, remia OEM/ODM/DIDMENINIAMS/MA\u017dMENIN\u0116/DROPSHIPPING/MIX
  TVARKA, 100% geros kokyb\u0117s garantij\u0105, patraukli kaina, geriausias i\u0161ankstinio
