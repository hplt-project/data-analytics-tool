  teikiama baz\u0117s d\u0117l savo nuotrauk\u0105/sketch/dizaino pie\u0161imo ir
  kt.Mes visada tikim\u0117s, kad suteikti jums geriausia pirkimo patirtimi ir pl\u0117toti
  win-win, ilgalaikius ir draugi\u0161kus santykius, bendradarbiavimo su jumis.Labai
  a\u010di\u016b !\\n---- \u0160viesiaplauk\u0117-----\\n---- Ombre Sidabro-----\\n----
  Middle Brown-----\\n- Kepurait\u0117 Dydis: Vidutinis Dydis\\n- Tekst\u016bra: Vandens
  Banga\\n- Pristatymo terminas:\\n- Med\u017eiagos Klas\u0117: Auk\u0161tos Temperat\u016bros
  Pluo\u0161to\\n- Perukai Ilgis: ilgai\\n- kaina:\\n- Ocassion:\\n- Prek\u0117s Pavadinimas:
  PANI\\n- Spalva:\\n- Plauk\u0173 Gurantee:\\n\u017dymos\\n\u017dymos: harajuku perukas,
  22 perukas, black lolita perukas, 613 blondin\u0117s perukas, m\u0117lyna priekiniai
  n\u0117riniai, 613 priekin\u0117s perukas, cosplay perukas, blondin\u0117s perukas,
  giliai pus\u0117je dalis n\u0117riniai perukas, lolita perukas.\"", "\"\u0160ilkografija
  yra menas, mokslas ir pramon\u0117 vienu metu. Nesvarbu, ar esate m\u0117g\u0117jas,
  norintis pasigaminti mar\u0161kin\u0117lius patys, menininkas, besidomintis tekstile,
  ar profesionalas, ie\u0161kantis geriausio... \u0161ilkografijos da\u017eai j\u016bs\u0173
  verslui, esate tinkamoje vietoje. \u0160is i\u0161samus tinklara\u0161\u010dio \u012fra\u0161as
  supa\u017eindins jus su viskuo, k\u0105 reikia \u017einoti apie \u0161ilkografijos
  da\u017eai, ypating\u0105 d\u0117mes\u012f skiriant tekstil\u0117s pritaikymui,
  naudojant tokius preki\u0173 \u017eenklus kaip Greito kamuolio ir \u017dakardasir
  daugyb\u0117 skirting\u0173 formuli\u0173, toki\u0173 kaip audinio \u0161ilkografijos
  da\u017eai, plastizolisir \u0161iuolaikinis m\u0117gstamiausias, vandens pagrindo
  da\u017eaiSu\u017einokite, kuris audinio ra\u0161alas tinka j\u016bs\u0173 projektui,
  su\u017einokite, kaip pasiekti ry\u0161ki\u0173 rezultat\u0173 net ir ant tamsi\u0173
  audini\u0173, ir su\u017einokite, kokie \u012frankiai bei med\u017eiagos pad\u0117s
  jums gauti trok\u0161tam\u0105 profesional\u0173 rezultat\u0105. Nesvarbu, ar tapote
  ant audinio savo malonumui, ar vadovaujate tekstil\u0117s \u0161ilkografijos studijai,
  \u0161iame straipsnyje rasite visk\u0105, ko jums reikia!\\n\u0160ilkografija, daugelio
  \u017einomas kaip \u0161ilkografija, yra metodas, kai da\u017eai per smulk\u0173
  trafaret\u0105 stumiami ant pavir\u0161iaus \u2013 da\u017eniausiai tekstil\u0117
  pavyzd\u017eiui, mar\u0161kin\u0117lius, med\u017eiaginius krep\u0161ius ar reklamines
  juostas. A trafaretas apibr\u0117\u017eia dizain\u0105 ir a valytuvas padeda perkelti
  ra\u0161al\u0105 per tinklel\u012f ant audinio.\\n\u0160ilkografijos metodas yra
  pla\u010diai naudojamas tekstil\u0117s spauda d\u0117l savo universalumo, prieinamumo
  ir profesionalios rezultat\u0173 kokyb\u0117s. Skirtingai nuo skaitmenin\u0117s
  spaudos, \u0161ilkografija gali u\u017etepti storus, ry\u0161kius da\u017e\u0173
  sluoksnius, tod\u0117l dizainai pasi\u017eymi didesniu spalv\u0173 sodrumu ir puikiu
  atsparumu. neskaidrumasNesvarbu, ar spausdinama ant nat\u016bralaus, ar sintetinis
  audinys\u0160is procesas leid\u017eia tiek menininkams, tiek gamintojams greitai
  ir efektyviai dekoruoti didelius kiekius.\\n\u0160ilkografija i\u0161lieka pasirinkta
  technika \u0161ilkografijos pramon\u0117 d\u0117l daugelio prie\u017eas\u010di\u0173:
  jis puikiai tinka \u012fvairioms med\u017eiagoms, yra ekonomi\u0161kas vidutiniams
  ir dideliems tira\u017eams ir gali pasiekti rezultat\u0173, kuriuos sunku pakartoti
  kitais metodais. Tiems, kurie aistringai domisi tekstil\u0117s \u0161ilkografija,
  \u012fvald\u0119 spausdinimo proceso pagrindus, atsiveria begalin\u0117s galimyb\u0117s
  kurti unikalius, individualius gaminius.\\nKai kalbama apie \u0161ilkografijos da\u017eai,
  j\u016bs\u0173 pasirinktas tipas labai paveiks rezultatus. Trys populiariausi ra\u0161alo
  tipai yra plastizolis, vandens pagrinduir akrilas.\\nPlastizolio ra\u0161alas \u0160ilkografijos
  pasaulyje i\u0161siskiria patvarumu ir naudojimo paprastumu. Jis ned\u017ei\u016bsta,
  nebent b\u016bt\u0173 termi\u0161kai apdorotas, tod\u0117l ilgiau i\u0161lieka ant
  audinio. Ta\u010diau jis u\u017esideda ant audinio, sukurdamas \u0161iek tiek pakelt\u0105
  \u201erankos\u201c efekt\u0105 ir ry\u0161kius, nepermatomus atspaudus net ant tamsi\u0173
  audini\u0173.\\nVandens pagrindo ra\u0161alas yra m\u0117gstamas d\u0117l mink\u0161to
  poj\u016b\u010dio ir ekologi\u0161kos formul\u0117s. Jis \u012fsiskverbia \u012f
  audinio pluo\u0161tus, tod\u0117l atspaudas tampa \u0161velnesnis. Jis idealiai
  tinka \u0161viesesniems audiniams ir gali b\u016bti sud\u0117tingesnis naudoti ant
  tamsi\u0173 audini\u0173, nebent jis b\u016bt\u0173 sukurtas taip, nepermatomas
  arba naudojamas su i\u0161krovimo technika.\\nAkriliniai \u0161ilkografijos da\u017eai
  sujungia geriausias abiej\u0173 pasauli\u0173 savybes, da\u017enai naudojamas akrilin\u0117
  \u0161ilkografija ant tekstil\u0117s, kuriai reikalingas ypatingas lankstumas, arba
  ant toki\u0173 pavir\u0161i\u0173 kaip popierius ir mediena. Skirtingi preki\u0173
  \u017eenklai si\u016blo variantus, pavyzd\u017eiui permaset ir Profesional\u016bs
  \u017eakardo trafaretiniai da\u017eai pateikti pa\u017eangius rezultatus konkretiems
  meniniams poreikiams.\\nPasaulis audinio ra\u0161alas yra turtingas, su galimyb\u0117mis
  kiekvienam pritaikymo tipui \u2013 nuo ry\u0161ki\u0173 spaudini\u0173 iki sintetiniai
  pluo\u0161tai \u012f nepermatomo audinio \u0161ilkografija itin ry\u0161kiems dizainams.\\nPasirinkus
  tobul\u0105 audinio \u0161ilkografijos da\u017eai priklauso nuo konkretaus projekto.
  Reikia atsi\u017evelgti \u012f audinio tip\u0105 (nat\u016bralus ar sintetinis),
  tekstil\u0117s spalv\u0105, numatyt\u0105 naudojim\u0105 (meno spaudiniai ar ne\u0161iojami
  madingi drabu\u017eiai) ir skalbimo atsparum\u0105.\\nPradedantiesiems, a \u0161ilkografijos
  pradinis rinkinys arba audini\u0173 \u0161ilkografijos pradinis rinkinys si\u016blo
  kruop\u0161\u010diai atrinkt\u0105 ra\u0161al\u0173 ir pagrindini\u0173 \u012franki\u0173
  pasirinkim\u0105, kad b\u016bt\u0173 lengviau eksperimentuoti su populiariomis parinktimis,
  tokiomis kaip Speedball audinio \u0161ilkografijos da\u017eai\u0160iuose rinkiniuose
  da\u017enai b\u016bna pagrindin\u0117s spalvos ir \u012fvair\u016bs da\u017eai \u0161ilkografijai
  tipai, kad vartotojai gal\u0117t\u0173 i\u0161bandyti, kuris i\u0161 j\u0173 geriausiai
  tinka j\u0173 procesui.\\nJei spausdinate ant \u0161viesios medviln\u0117s, vandens
  pagrindu ir akriliniai da\u017eai yra puikus pasirinkimas, pasi\u017eymintis mink\u0161tu
  liesti ir kv\u0117puojan\u010diu ra\u0161tu. Tamsiems arba sintetiniams audiniams
  rinkit\u0117s plastizolis arba skirtas nepermatomas formul\u0117, u\u017etikrinanti
  maksimal\u0173 padengim\u0105 ir ry\u0161kum\u0105. Profesionalai gali labiau linkti
  prie serijos ra\u0161alai i\u0161 toki\u0173 preki\u0173 \u017eenkl\u0173 kaip Permaset
  Aqua d\u0117l konkre\u010di\u0173 efekt\u0173 arba profesionalus \u017eakardo ekranas
  da\u017eai dailei.\\nVisada apsvarstykite, ar jums reikia, kad j\u016bs\u0173 spaudiniai
  b\u016bt\u0173 \u0161ilumos rinkinys d\u0117l patvarumo, ypa\u010d dirbant su akriliniai
  da\u017eai arba vandens pagrindu ra\u0161alai.\\nSpeedball yra m\u0117gstamas \u017eaidimas
  tiek m\u0117g\u0117j\u0173, tiek profesional\u0173 tarpe. J\u0173 med\u017eiaginis
  \u0161ilkografijos da\u017eai vertinami d\u0117l plataus da\u017e\u0173 spalv\u0173
  pasirinkimo, lengvo naudojimo ir suderinamumo su augaliniais ir sintetiniais pluo\u0161tais.\\n\u201eSpeedball\u201c
  audinio \u0161ilkografijos da\u017eai yra pagaminti vandens pagrindu, netoksi\u0161ki
  ir gali suteikti ry\u0161kias, ry\u0161kias spalvas su tinkamu neskaidrumu ant \u0161velnaus
  ir vidutinio kietumo audini\u0173. Tai puikus pasirinkimas \u201epasidaryk pats\u201c
  \u0161ilkografijai, nes juos lengva nuvalyti ir jie gerai laiko med\u017eiag\u0105.
  Tiems, kurie dar tik pradeda \u0161ilkografij\u0105, \u201eSpeedball\u201c audinio
  da\u017eai yra atspar\u016bs d\u0117m\u0117ms ir lankst\u016bs.\\nNors \u201eSpeedball\u201c
  istori\u0161kai pabr\u0117\u017eia vandens pagrindu pagamintas formules, jie i\u0161pl\u0117t\u0117
  savo veikl\u0105, \u012ftraukdami ir galimybes su geresniu padengimu tamsiems audiniams
  ir patenkindami komercini\u0173 spaustuvi\u0173 poreikius.\\nKalbant apie i\u0161skirtinius,
  meninink\u0173 klas\u0117s vaizdinius da\u017eus, \u201eJacquard\u201c \u2013 vardas,
  kurio da\u017enai klausysit\u0117s. Profesional\u016bs \u017eakardo vaizdini\u0173
  da\u017e\u0173 asortimentai sukurti taip, kad patenkint\u0173 rimt\u0173 tekstil\u0117s
  meninink\u0173, kuriems svarbus j\u0173 spaudini\u0173 detalumas, spalv\u0173 atsparumas
  ir lankstumas, poreikius.\\n\u0160ie audini\u0173 da\u017eai paprastai yra vandens
  pagrindu, kad b\u016bt\u0173 mink\u0161ti, ta\u010diau yra sukurti tiek \u0161viesiems,
  tiek tamsiems audiniams, si\u016blydami alternatyvas nepermatomam \u0161ilkografijos
  b\u016bdui. \u017dakardo gaminiai taip pat suderinami su daugeliu tekstil\u0117s
  pluo\u0161t\u0173, tod\u0117l menininkai gali i\u0161bandyti medviln\u0119, lin\u0105,
  \u0161ilk\u0105 ir net kai kuriuos sintetinius audinius.\\n\u201eJacquard\u201c
  u\u017etikrina nuolatinius rezultatus ir yra m\u0117gstamas spausdinimo ant audinio
  bendruomen\u0117je d\u0117l meni\u0161kai auk\u0161tos kokyb\u0117s \u0161ilkografijos.
  Jei ie\u0161kote profesionalios kokyb\u0117s rezultato ir plataus ry\u0161ki\u0173
  spalv\u0173 pasirinkimo, \u201eJacquard\u201c profesional\u016bs demonstraciniai
  da\u017eai yra puiki vieta prad\u0117ti.\\nVienas i\u0161 i\u0161\u0161\u016bki\u0173,
  su kuriais susiduriama spausdinant audinius ant ekran\u0173, yra tvirt\u0173, ry\u0161ki\u0173
  atspaud\u0173 i\u0161gavimas ant tamsi\u0173 audini\u0173. Standartiniai da\u017eai
  da\u017enai neturi pakankamai neskaidrumo, kad atkurt\u0173 sen\u0105sias spalvas,
  ta\u010diau neskaidrios med\u017eiagos \u0161ilkografijos formul\u0117s yra sukurtos
  b\u016btent \u0161iai problemai spr\u0119sti.\\n\u0160iuolaikiniai \u0161ilkografijos
  da\u017e\u0173 gamintojai (pvz., si\u016blantys permaset supercover) si\u016blo
  alternatyvas neskaidriems ir itin neskaidriems da\u017eams, kurie nus\u0117da ant
  audinio, u\u017etikrindami, kad j\u016bs\u0173 dizainas i\u0161likt\u0173 spalvingas
  ir matomas net ant juodos ar tamsiai m\u0117lynos spalvos med\u017eiag\u0173. Plastizolinis
  da\u017eai yra nat\u016braliai neskaidr\u016bs, nors vandens pagrindo arba akriliniams
  vaizdin\u0117s spaudos da\u017eams taip pat gali reik\u0117ti speciali\u0173 neskaidrumo
  variant\u0173.\\nSiekdami maksimaliai padidinti atsparum\u0105 dilimui, kai kurie
  \u0161ilkografijos spausdintuvai rekomenduoja dvigub\u0105 ra\u0161alo slinkim\u0105
  arba pirm\u0105j\u012f balto \u201epagrindo\u201c sluoksn\u012f trapiems da\u017eams.
  Tokiose priemon\u0117se kaip ekran\u0173 spausdinimo da\u017e\u0173 rinkinys arba
  audinio \u0161ilkografijos da\u017e\u0173 rinkinys da\u017enai naudojama matin\u0117
  balta spalva, tod\u0117l galima gauti ry\u0161kius, profesionalios kokyb\u0117s
  rezultatus.\\nNorint i\u0161gauti profesionalius tekstil\u0117s spaudos efektus,
  jums reik\u0117s daugiau nei tik tinkam\u0173 \u0161ilkografijos da\u017e\u0173.
  Svarbiausios \u0161ilkografijos med\u017eiagos yra \u0161ios:\\n- Ekrano r\u0117mai
  (mediniai arba aliumininiai)\\n- Tinkamo tinklelio tinklelio pasirinkimas priklauso
  nuo j\u016bs\u0173 dizaino ir ra\u0161alo\\n- Valytuvai (\u012fvairi\u0173 dyd\u017ei\u0173
  ir kietumo)\\n- Trafaretin\u0117 med\u017eiaga arba vaizdo emulsija dizaino perk\u0117limui\\n-
  \u0160ilumos fiksavimo \u012franga (\u0161ilumos presas arba lygintuvas vandens
  pagrindo / akriliniams da\u017eams)\\n- Valymo cheminiai junginiai leidini\u0173
  ir spaustuvi\u0173 prie\u017ei\u016brai\\nTokie preki\u0173 \u017eenklai kaip \u201eSpeedball\u201c
  ir \u201eJacquard\u201c taip pat si\u016blo demonstracini\u0173 spausdinimo med\u017eiag\u0173
  rinkinius, kad pirmakursiai gal\u0117t\u0173 lengvai susirinkti visk\u0105, ko reikia
  norint s\u0117kmingai \u012fveikti i\u0161\u0161\u016bkius. Nepamir\u0161kite ir
  kit\u0173 b\u016btiniausi\u0173 daikt\u0173, \u012fskaitant pir\u0161tines, prijuostes
  ir tinkam\u0105 oro sraut\u0105, ypa\u010d naudodami specialios paskirties da\u017eus.\\nNesvarbu,
  ar pie\u0161iate i\u0161 karto ant audinio, ar naudojate \u0161ilkografij\u0105,
  pagrindinis tikslas \u2013 ilgalaikis, ry\u0161kus dizainas. Prie\u0161 spausdindami,
  i\u0161skalbkite ir i\u0161d\u017eiovinkite audin\u012f, kad pa\u0161alintum\u0117te
  klijus ir aliejus, kurie gali trukdyti ra\u0161alui sukibti.\\nPo spausdinimo naudokite
  terminio fiksavimo metod\u0105, pvz., lyginim\u0105 arba \u0161ilumin\u012f pres\u0105,
  kaip rekomenduojama pasirinktam audinio ra\u0161alui. Akriliniams da\u017eams, akriliniams
  ekranams spausdinti arba vandens pagrindo ra\u0161alui tinkamas kiet\u0117jimas
  yra labai svarbus, kad b\u016bt\u0173 i\u0161vengta i\u0161plovimo.\\nKad atspausdinti
  drabu\u017eiai ilgai i\u0161likt\u0173, visada skalbkite i\u0161virk\u0161\u010di\u0105ja
  puse \u012f i\u0161or\u0119 neriebiu vandeniu ir d\u017eiovinkite d\u017eiovykl\u0117je
  \u017eemoje temperat\u016broje. Taip i\u0161saugomas atspausdint\u0173 da\u017e\u0173
  ry\u0161kumas ir elastingumas. Dirbdami su individualiai pritaikytais audiniais,
  venkite stipri\u0173 plovikli\u0173 ir balikli\u0173.\\n\u0160ilkografijos verslas
  nuolat tobul\u0117ja. \u0160iandien ekologi\u0161kos vandens pagrindo alternatyvos,
  tokios kaip \u201ePermaset Aqua\u201c, tapo aukso mada, m\u0117gstamos d\u0117l
  ma\u017eesnio poveikio aplinkai ir \u0161velnaus pavir\u0161iaus.\\nSpecial\u016bs
  audini\u0173 \u0161ilkografijos da\u017eai, kartu su silikoniniais da\u017eais,
  skirti techniniams, didelio na\u0161umo audiniams (naudojamiems sportin\u0117je
  aprangoje) ir suteikia intensyv\u0173 tamprum\u0105 bei ilgaam\u017ei\u0161kum\u0105
  sintetiniams pluo\u0161tams. Taip pat atnaujintas akrilini\u0173 ir hibridini\u0173
  da\u017e\u0173, skirt\u0173 kry\u017emini\u0173 audini\u0173 ir meno k\u016brini\u0173
  spaudai, pasirinkimas.\\nSkaitmeniniai ir analoginiai metodai dabar derinami skland\u017eiau,
  dizaineriams naudojant virtuali\u0105 \u012frang\u0105 dizainui parengti, ta\u010diau
  pirmenyb\u0119 teikiant \u0161ilkografijai d\u0117l neprilygstam\u0173 lyt\u0117jimo
  savybi\u0173. Galutinis rezultatas? Neribotos galimyb\u0117s kurti unikalius, suasmenintus
  mados ir meno gaminius.\\n- \u0160ilkografija yra universalus ir patvarus tekstil\u0117s
  dekoravimo b\u016bdas, leid\u017eiantis pasiekti i\u0161skirtini\u0173 profesionali\u0173
  rezultat\u0173 net ir \u201epasidaryk pats\u201c aplinkoje.\\n- Tinkamo spausdinimo
  da\u017e\u0173 (plastizolio, vandens pagrindo, akrilo arba hibridini\u0173) pasirinkimas
  priklauso nuo j\u016bs\u0173 projekto audinio tipo, spalvos ir norimo rezultato.\\n-
  Pirmaujantys gamintojai, tokie kaip \u201eSpeedball\u201c ir \u201eJacquard\u201c,
  si\u016blo patikimas, fantasti\u0161kas med\u017eiagini\u0173 ekran\u0173 \u0161ilkografijos
  da\u017e\u0173 alternatyvas tiek pradedantiesiems, tiek profesionalams.\\n- Tamsiems
  audiniams matiniai \u0161ilkografijos da\u017eai suteikia norim\u0105 spalving\u0105
  atspalv\u012f.\\n- Pradedan\u010di\u0173j\u0173 rinkiniai idealiai tinka pradedantiesiems,
  nes suteikia pagrindini\u0173 i\u0161tekli\u0173 ir \u012fvairi\u0173 ekrano ra\u0161al\u0173
  eksperimentams.\\n- Spausdinimo technika apima trafareto paruo\u0161im\u0105, tinkam\u0105
  ekran\u0105, da\u017e\u0173 u\u017etepim\u0105 ir tinkam\u0105 kiet\u0117jim\u0105,
  kad b\u016bt\u0173 u\u017etikrintas tvirtumas.\\n- Supraskite blokinio ir \u0161ilkografinio
  spausdinimo skirtumus, kad pasirinktum\u0117te kokyb\u0117s metod\u0105, atitinkant\u012f
  j\u016bs\u0173 k\u016brybin\u0119 vaizduot\u0119 ir numatym\u0105.\\n- Apsir\u016bpinkite
  svarbiausiais ekran\u0173 \u0161ilkografijos elementais, taip pat ekranais, valytuvais
  ir valymo priemon\u0117mis.\\n- Visada skalbkite ir termi\u0161kai fiksuokite audinio
  atspaudus, kaip nurodyta, kad jie b\u016bt\u0173 kuo tvirtesni.\\n- Sekite naujausius
  verslo patobulinimus \u2013 vandeniniai \u201eTotally\u201c ir \u201eForte\u201c
  da\u017eai yra pirmaujan\u010dios ekologi\u0161ko ir didelio na\u0161umo spausdinimo
  tendencijos.\\nPasiruo\u0161\u0119 atrasti vaizdin\u0117s spaudos pasaul\u012f ir
  pakelti savo audini\u0173 k\u016brinius \u012f kit\u0105 lyg\u012f? Tur\u0117dami
  reikiam\u0173 \u017eini\u0173 ir \u012franki\u0173, gausite ne tik gra\u017eius,
  bet ir patvarius atspaudus.\"", "\"Iki \u0161iol \u0161is i\u0161pylimas n\u0117ra
  atliekamas per\u0117jimo prie raumen\u0173 vietoje, kaip buvo pasi\u016blyta originalioje
  versijoje, bet \u0161alia kaul\u0173 tvirtinimo zonos. Pacientas atrodo skausmo
  sindromas, kuris yra sustiprintas per dien\u0105 su apkrova ir ilgai stovint.\\nMed\u017eiagos
  redaguoti Alk\u016bn\u0117s skausmas - prie\u017eastys ir gydymas.\\nK\u0105 sako
  a\u0161trus deginantis alk\u016bn\u0117s skausmas? Ber\u017eo pumpur\u0173 tinkt\u016bra
  Yra daugyb\u0117 skirting\u0173 veiksni\u0173, sukelian\u010di\u0173 \u012fvyk\u012f.\\nDiagnostika\\nAlk\u016bn\u0117s
  s\u0105narys yra labiau traumuojantis nei kiti, nes n\u0117ra apsaugotas nuo raumen\u0173
  ar riebalinio sluoksnio poveikio. Be to, tai gana sud\u0117tinga. Nemalonus skausmingas
  poj\u016btis kyla alk\u016bn\u0117s s\u0105naryje d\u0117l \u017ealos, perkrovos,
  raumen\u0173 ir kaul\u0173 bei \u0161irdies ir kraujagysli\u0173 sistemos darbo
  sutrikim\u0173.\\nGana lengva nustatyti skausmo \u0161altin\u012f alk\u016bn\u0117je.
  Paprastai tam pakanka specialisto ap\u017ei\u016bros, taip pat s\u0105nario rentgeno
  ar MRT. Skausmo prie\u017eastys Pagrindin\u0117s alk\u016bn\u0117s s\u0105nario
  skausmo prie\u017eastys: Buvimas arba alk\u016bn\u0117s pa\u017eeidimas. Raumen\u0173
  funkcijos sutrikimas, rai\u0161\u010di\u0173 ar s\u0105nari\u0173 pavir\u0161iaus
  pa\u017eeidimas arba epikondilitas.\\nLigos, kurios n\u0117ra tiesiogiai susijusios
  su alk\u016bn\u0117s s\u0105nariu, pvz. Neatmetama laikina ir ne\u012fprasta fizin\u0117
  veikla. Skaud\u0117s rank\u0105, kuri yra per daug \u012ftempta - atitinkamai de\u0161in\u0117
  ir kair\u0117. Ypa\u010d \u012fmanoma tokioje situacijoje skausmas lankstant s\u0105nar\u012f.
  Epikondilitas Kai skausmas atsiranda lenkiant ir i\u0161tiesiant alk\u016bn\u0119
  vidujetai yra, ant rauk\u0161l\u0117s, tai rodo, kad d\u0117l rai\u0161\u010di\u0173
  d\u0117l paciento fizinio darbo susidar\u0117 mikrotrauma.\\nTuo atveju, kai pacientas
  nuolatos patempia rank\u0105, pavyzd\u017eiui, d\u0117l profesijos pareigos, liga
  i\u0161sivysto \u012f l\u0117tin\u0119 form\u0105. \u0160is rei\u0161kinys vadinamas
  epikondilitu.\\nJis skirstomas \u012f: kai skausmingi poj\u016b\u010diai atsiranda
  tik i\u0161tiesus rank\u0105, lenkimas nesukelia diskomforto. Tai pa\u017eeid\u017eia
  i\u0161orin\u0119 dilbio dal\u012f. Atsiranda pa\u017eeidim\u0173 ir patempim\u0173
  atveju, taip pat yra savoti\u0161kas \u0161alutinis poveikis u\u017esiimant sunkiu
  sportu. Daugiau apie epikondilit\u0105 su\u017einosite i\u0161 \u0161io Elenos Malyshevos
  vaizdo \u012fra\u0161o: Alk\u016bn\u0117s bursitas - u\u017edegiminis procesas s\u0105nario
  kapsul\u0117 alk\u016bn\u0117. Sergant \u0161ia liga, nemalon\u016bs, skausmingi
  poj\u016b\u010diai atsiranda kiekvien\u0105 kart\u0105 judinant alk\u016bn\u0117s
  s\u0105nar\u012f. Gali skaud\u0117ti ir de\u0161in\u0119, ir kair\u0119.\\nNepriklausomai
  nuo to, ar skausmas yra stiprus, verta susitarti su gydytoju. Priklausomai nuo skausmo
  \u0161altinio, turite kreiptis \u012f reumatolog\u0105, neurolog\u0105 ar traumatolog\u0105
  d\u0117l tolesnio gydymo. U\u017edegiminiai procesai s\u0105naryje Be su\u017ealojim\u0173
  ir auk\u0161\u010diau i\u0161vardyt\u0173 prie\u017eas\u010di\u0173, einant pro
  j\u012f atsiranda nemalonus poj\u016btis ar deginimo poj\u016btis alk\u016bn\u0117s
  s\u0105naryje. Vienas i\u0161 veiksni\u0173, skatinan\u010di\u0173 u\u017edegim\u0105,
  gali b\u016bti chondromatoz\u0117. Tai liga, kai s\u0105nari\u0173 pavir\u0161iuje
  susidaro kaul\u0173 dariniai, d\u0117l kuri\u0173 dirginamos nerv\u0173 gal\u016bn\u0117s,
  o v\u0117liau - u\u017edegiminiai procesai.\\nChondromatoz\u0117s simptomai: Neveiklumas
  ir patinimas alk\u016bn\u0117s s\u0105nario srityje. Skausmas ir. Raumen\u0173,
  palaikan\u010di\u0173 s\u0105nar\u012f, hipotrofija. U\u017edegim\u0105 sukelia
  ir artritas. Jis skirstomas \u012f reaktyv\u0173 ir sistemin\u012f. Pastarasis tipas
  gali visi\u0161kai paveikti visus s\u0105narius. Liga da\u017enai i\u0161sivysto
  kaip komplikacija po sunki\u0173 raudonuk\u0117s, taip pat kit\u0173 infekcij\u0173.\\nPagrindinis
  artrito po\u017eymis yra paraudimas, pavir\u0161i\u0173, esan\u010di\u0173 greta
  s\u0105nario, patinimas, Tai bukas skausmas su rankos nejudrumu, a\u0161trus ir
  a\u0161trus judant. S\u0105nari\u0173 sunaikinimas Vienas i\u0161 veiksni\u0173,
  provokuojan\u010di\u0173 skausming\u0173 poj\u016b\u010di\u0173 atsiradim\u0105
  alk\u016bn\u0117je, yra s\u0105narinio audinio sunaikinimas. Da\u017enai taip yra
  d\u0117l alk\u016bn\u0117s s\u0105nario artroz\u0117s atsiradimo. Tai atsiranda
  esant nuolatiniam ilgalaikiam s\u0105nario stresui, taip pat esant hormoniniams
  sutrikimams. Artroz\u0117s skausmas yra labai stiprus, ypa\u010d lenkiant, o paveikta
  vieta tampa nejudri.\\nPo operacijos\\nArtroz\u0117s vystymuisi galima nuotraukos
  i\u0161 s\u0105nari\u0173 skausmo keli\u0105 kruop\u0161\u010diu po\u017ei\u016briu
  \u012f s\u0105nar\u012f ir vengiant perkrovos. Gydym\u0105 sudarys terapija, pri\u0117mimas
  ir vidinis administravimas. Sunaikinimas \u012fvyksta ir tada, kai gimdos kaklelio
  osteochondroz\u0117 kai gri\u016bvantys tarpslanksteliniai diskai leid\u017eia slanksteliams
  suspausti nerv\u0173 galus, o tai provokuoja, ir ne tik kaklo stuburo srityje.\\nGalime
  sakyti, kad skausmai yra atspind\u0117to pob\u016bd\u017eio. Da\u017enai kartu su
  alk\u016bn\u0117s s\u0105nariu arba, kartais, jis ateina. Atsiradimo prie\u017eastys
  gali b\u016bti netinkama laikysena, s\u0117slus gyvenimo b\u016bdas, neteisingai
  suformuota mityba. Gali pad\u0117ti speciali\u0173 vaist\u0173, atkurian\u010di\u0173
  kremzles ir audinius, vartojimas. Atitinkamai, jei alk\u016bn\u0117s skausmas atsiranda
  d\u0117l kit\u0173 problem\u0173, tada reikia gydyti ne alk\u016bn\u0117s s\u0105nar\u012f,
  o tiesiogiai tai, kas sukelia skausm\u0105: tai gali b\u016bti tarpslankstelin\u0117
  i\u0161var\u017ea arba osteochondroz\u0117.\\nPo to, kai pa\u017eeista vieta paciento
  u\u017eraktai susta atkurta, skausmingi poj\u016b\u010diai s\u0105naryje i\u0161nyks.
  Skausming\u0173 simptom\u0173 \u012fvairov\u0117 Skausmo tipai alk\u016bn\u0117je
  yra \u0161ie: Atspind\u0117tas skausmas. Yra raumen\u0173 ir kaul\u0173 sistemos
  sutrikimai, ypa\u010d sergant gimdos kaklelio osteochondroze.\\nGalimas bicepso
  raumen\u0173 atrofinio sindromo vystymasis. Da\u017enai su ja. Skausmo pob\u016bdis
  traukia. Atsiranda suspaudus stuburo nervus, su i\u0161var\u017eos disku arba po
  traumos. J\u012f i\u0161provokuoja nerv\u0173 gal\u016bni\u0173 u\u017edegimas esant
  artrozei arba d\u0117l m\u0117lyni\u0173.\\nLankstant jau\u010diamas \u016bmus skausmas,
  kur\u012f lydi deginimo poj\u016btis prat\u0119simo metu. Tai da\u017eniausiai pasirei\u0161kia
  su traumomis, bursitu ar artritu. Labai stiprus, a\u0161trus, riboja fizin\u012f
  aktyvum\u0105. Atsiranda u\u017edegimo metu arba suspaudus nerv\u0173 galus.\\n\u0160iuo
  atveju rankos prat\u0119simas sukelia netoleruot\u0105 deginimo poj\u016bt\u012f
  s\u0105naryje. Nuobodu ir skauda. Kalb\u0117ti apie l\u0117tin\u0117mis ligomis
  toki\u0173 kaip artroz\u0117, gydymas epipudilite alk\u016bn\u0117s s\u0105nario
  liaudies gynimo atsiliepimus.\\nJis nuolat yra, net kai ranka nejuda, o lenkimo
  ir i\u0161tiesimo momentu ji tampa stipresn\u0117. Gydo alk\u016bn\u0117s skausm\u0105,
  susijus\u012f su lenkimu ir prat\u0119simu Nepaisant to, kad nemalon\u016bs poj\u016b\u010diai
  s\u0105naryje negali sukelti stipraus diskomforto, b\u016btina gydyti atsiradusi\u0105
  lig\u0105.\\nRankin\u0117s rankos: prie\u017eastys, simptomai, gydymas\\nJei liga
  i\u0161sivystys \u012f l\u0117tin\u0119, bus sunkiau su ja susidoroti, o skausmas
  sustipr\u0117s esant kr\u016bviui, pasikeitus orams. Jei skausmas atsiranda alk\u016bn\u0117je,
  tur\u0117tum\u0117te j\u012f suma\u017einti fizin\u0117 veikla ir treniruot\u0117s,
  kad nepa\u017eeistum\u0117te s\u0105nari\u0173 ir periartikulini\u0173 pavir\u0161i\u0173.
  Jei skausmas nesiliauja, verta griebtis rimtesni\u0173 b\u016bd\u0173, kaip i\u0161spr\u0119sti
  i\u0161kilusi\u0105 problem\u0105. J\u016bs turite laikyti led\u0105, apvyniodami
  j\u012f rank\u0161luos\u010diu, minu\u010di\u0173 tepdami j\u012f ant de\u0161in\u0117s
  ar kair\u0117s alk\u016bn\u0117s s\u0105nario; esant labai stipriam nuolatiniam
  skausmui, turite laikinai imobilizuoti alk\u016bn\u0119, u\u017ed\u0117dami \u012ftvar\u0105
  ant skarel\u0117s kaip ir ; galite naudoti pla\u010diai paplitusius s\u0105nari\u0173
  tepalus ir gelius, kurie turi prie\u0161u\u017edegimini\u0173 ar; proced\u016bros
  taip pat pad\u0117s, pavyzd\u017eiui, elektroforezei su novokaino tirpalu, ta\u010diau
  jos atliekamos tik taip, kaip nurod\u0117 gydytojas; kai kuriais atvejais pad\u0117s
  s\u0105nario ortopediniai tvars\u010diai, kurie neleid\u017eia kondil\u0117ms jud\u0117ti
  lenkimo ir tempimo metu, palaiko j\u0173 ger\u0105 form\u0105.\\nS\u0105nario taisymo
  procesas trunka nuo 1 iki 3 savai\u010di\u0173. Ta\u010diau net ir atliekant gydym\u0105,
