  gorenje bo7321awg\"", "\"Vos prasid\u0117jus rudens sesijai Seimas su\u0161velnino
  sankcijas vairuotojams u\u017e i\u0161tisin\u0117s linijos kirtim\u0105. Iki \u0161iol
  u\u017e tok\u012f pa\u017eeidim\u0105 privalomai buvo atimama teis\u0117 vairuoti,
  o pagal nauj\u0105j\u012f sprendim\u0105 bus galima atsipirkti ir bauda. Prie\u0161
  toki\u0105 patais\u0105 pasisak\u0117 ir policijos pareig\u016bnai, ir saugaus eismo
  specialistai, ta\u010diau Seimas nusprend\u0117, kad pakaks ir \u0161velnesni\u0173
  baud\u0173.\\nSuma\u017eino baud\u0105\\nPriimtomis Administracini\u0173 nusi\u017eengim\u0173
  kodekso 417 straipsnio pataisomis dabar nustatyta, kad \u012fva\u017eiavimas \u012f
  prie\u0161prie\u0161inio eismo juost\u0105, pa\u017eeid\u017eiant Keli\u0173 eismo
  taisykli\u0173 reikalavimus, u\u017etraukia baud\u0105 vairuotojams nuo 60 iki 90
  eur\u0173. Taip pat nuo vieno iki trij\u0173 m\u0117nesi\u0173 gal\u0117t\u0173
  b\u016bti atimta teis\u0117 vairuoti. Tokiu pa\u017eeidimu kelyje suk\u0117lus pavojing\u0105
  situacij\u0105 bauda did\u0117t\u0173 nuo 170 iki 230 eur\u0173, o teis\u0117s vairuoti
  neturintiems asmenims \u2013 nuo 300 iki 600 eur\u0173.\\nNuo sausio 1-osios \u012fsigaliojusiame
  Administracini\u0173 nusi\u017eengim\u0173 kodekse, u\u017e lenkim\u0105 vietose,
  kuriose pagal Keli\u0173 eismo taisykles draud\u017eiama lenkti ir \u012fva\u017eiavim\u0105
  \u012f prie\u0161prie\u0161inio eismo juost\u0105 pa\u017eeid\u017eiant Keli\u0173
  eismo taisykli\u0173 reikalavimus, teis\u0117s vairuoti at\u0117mimas buvo privalomas.
  Be pinigin\u0117s baudos \u2013 nuo 170 iki 230 eur\u0173, vairuotojams buvo skiriamas
  ir teis\u0117s vairuoti at\u0117mimas nuo 3 iki 6 m\u0117nesi\u0173.\\n\u0160iemet
  policija u\u017efiksavo beveik 2000 pavojingo ir chuligani\u0161ko vairavimo atvej\u0173,
  daugiau nei 1600 vairuotojo pa\u017eym\u0117jimai atimti b\u016btent d\u0117l \u012fva\u017eiavimo
  \u012f prie\u0161prie\u0161in\u0119 kelio juost\u0105.\\nBand\u0117 pab\u0117gti\\n\u0160iemet
  kirtus i\u0161tisin\u0119 juost\u0105 \u012fvyko daugiau nei pus\u0117 t\u016bkstan\u010dio
  susid\u016brim\u0173, kai kurie j\u0173 baig\u0117si labai tragi\u0161kai.\\n\u0160tai
  vasario pabaigoje netoli I\u0161lau\u017eo miestelio, kelyje Kaunas-Prienai, \u017euvo
  du \u017emon\u0117s: netoliese, Rutki\u0161ki\u0173 kaime, gyven\u0119 sutuoktiniai
  S. \u2013 savo automobil\u012f \u201eOpel Zafira\u201c vairav\u0119s Arvydas (62
  m.) ir kartu va\u017eiavusi jo \u017emona Aldona (61 m.). Dar du keleiviai \u2013
  n\u0117\u0161\u010dia poros dukra (22 m.) ir ne\u012fgalus poros globotinis (43
  m.) \u2013 po \u012fvykio d\u0117l rimt\u0173 su\u017ealojim\u0173 buvo nugabenti
  \u012f ligonin\u0119.\\n\u0160is keturi\u0173 artim\u0173 \u017emoni\u0173 ekipa\u017eas
  t\u0105 sekmadienio ryt\u0105, apie pus\u0119 de\u0161imtos, automobiliu vyko \u012f
  ba\u017eny\u010di\u0105, Kauno kryptimi. Kelion\u0119 akimirksniu nutrauk\u0117
  prie\u0161prie\u0161iais, Prien\u0173 kryptimi, l\u0117k\u0119s visureigis \u201eLand
  Rover\u201c, kuris r\u0117\u017e\u0117si \u012f opel\u012f.\\nKad i\u0161laisvint\u0173
  opelyje po avarijos likusius prispaustus 3 \u017emones, \u012f pagalb\u0105 atskub\u0117jo
  ugniagesiai gelb\u0117tojai. Tuo metu \u012ftariamas avarijos kaltininkas, visureig\u012f
  vairav\u0119s kaunietis Saulius Bla\u017eys (40 m.), pastaruoju metu gyvenantis
  u\u017esienyje, ir jo keleivis (38 m.) nesugalvojo nieko kito, kaip tik, kuo grei\u010diau
  sprukti i\u0161 \u012fvykio vietos. Vienas pasileido laukais, kitas \u2013 \u012f
  prie\u0161ing\u0105 pus\u0119, \u012f\u0161okdamas \u012f Jiesios upel\u012f. Bet
  abu tuoj pat pareig\u016bn\u0173 buvo su\u010diupti.\\nI\u0161kart tapo ai\u0161ku,
  kod\u0117l emigrantas skub\u0117jo pab\u0117gti, \u2013 mat jis buvo girtas: nustatytas
  vidutinis girtumo laipsnis (1,93 promil\u0117s alkoholio kraujyje). Avarijos vietoje
  vieni i\u0161 pirm\u0173j\u0173 buv\u0119 ugniagesiai gelb\u0117tojai, v\u0117liau
  pakalbinti \u201eAkistatos\u201c, nenor\u0117jo detalizuoti, koks siaubingas vaizdas
  buvo po \u0161ios tragedijos. Anot j\u0173, buvo baisu \u017ei\u016br\u0117ti \u012f
  sumaitotus k\u016bnus, bej\u0117gius ir ken\u010dian\u010dius su\u017ealotuosius,
  \u012f j\u0173 atviras \u017eaizdas.\\nManoma, tragedij\u0105 suk\u0117l\u0117 visureigio
  vairuotojas, lemiamu momentu m\u0117gin\u0119s aplenkti kit\u0105 automobil\u012f
  ir staiga r\u0117\u017e\u0119sis \u012f prie\u0161prie\u0161iais art\u0117jus\u012f
  opel\u012f. O lenkti tame kelio ruo\u017ee buvo negalima. Tai rodo kelio \u017eenklai.
  Negalima ir vir\u0161yti nustatyto 70 kilometr\u0173 per valand\u0105 grei\u010dio.\\nPapildoma
  ekspertiz\u0117\\n\u0160iuo metu Plung\u0117s rajono apylink\u0117s teisme dar tebenagrinejama
  klaip\u0117die\u010dio Igorio Cvetkovo byla. Skaudi nelaim\u0117 Plung\u0117s rajone
  \u012fvyko 2015-\u0173j\u0173 spalio 4-osios vakar\u0105. Avarijoje \u017euvo BMW
  vairav\u0119s Radvili\u0161kyje ugniagesiu dirb\u0119s Ram\u016bnas Dargu\u017eas,
  jo \u017emona ir ma\u017eamet\u0117 dukryt\u0117. I\u0161gyveno tik tuomet vos de\u0161imties
  sulaukusi dukra.\\nKaltinamajame akte teigiama, kad I. Cvetkovas \u201eHyundai Galloper\u201c
  automobiliu kirto i\u0161tisin\u0119 linij\u0105 ir i\u0161va\u017eiavo \u012f prie\u0161prie\u0161inio
  eismo juost\u0105. I\u0161vyd\u0119s prie\u0161ais \u201eHyundai Galloper\u201c
  ir siekdamas i\u0161vengti susid\u016brimo i\u0161tisin\u0119 linij\u0105 kirto
  ir \u012f prie\u0161prie\u0161inio eismo juost\u0105 met\u0117si ir BMW 520, kur\u012f
  vairavo R. Dargu\u017eas. Ta\u010diau \u201eHyundai Galloper\u201c staiga gr\u012f\u017eo
  atgal ir automobiliai susid\u016br\u0117. \u017duvo trys vienos \u0161eimos nariai,
  dar keturi \u017emon\u0117s buvo su\u017ealoti.\\nNevienodi standartai\\nI\u0161va\u017eiavus
  \u012f prie\u0161prie\u0161in\u0119 eismo juost\u0105 ir susid\u016brus kaktomu\u0161a
  avarijos pasekm\u0117s b\u016bna labai skaud\u017eios. Policijos duomenimis, 2016
  metais prie\u0161prie\u0161ini\u0173 susid\u016brim\u0173 metu \u0161alies keliuose
  \u017euvo 29 \u017emon\u0117s, 38 \u017emon\u0117s buvo su\u017eeisti. Tod\u0117l
  policijos pareig\u016bnai ir saugaus eismo ekspertai nenor\u0117jo, kad b\u016bt\u0173
  su\u0161velninta bausm\u0117, nes administracinio poveikio priemon\u0117 \u2013
  asmeniui suteiktos specialiosios teis\u0117s at\u0117mimas yra viena efektyviausi\u0173
  priemoni\u0173, suteikianti galimyb\u0119 atgrasyti nuo pavojing\u0173 nusi\u017eengim\u0173
  darymo. Ta\u010diau 94 Seimo nariai galvojo kitaip ir patais\u0105 pri\u0117m\u0117.\\nBeje,
  pataisos pri\u0117mim\u0105 lyd\u0117jo ir \u0161ioks toks skandalas. Speciali\u0173j\u0173
  tyrim\u0173 tarnyba (STT) buvo \u012f\u017evelgusi, kad \u0161ia pataisa gali b\u016bti
  asmeni\u0161kai suinteresuotas Seimo narys Petras Gra\u017eulis ir jo dukra Marija
  \u0160ala\u0161evi\u010dien\u0117.\\nSeimo nario dukra 2017 met\u0173 gegu\u017e\u0117s
  11 dien\u0105 kelyje Kaunas-Prienai-Alytus kirto horizontaliojo \u017eym\u0117jimo
  siaur\u0105 i\u0161tisin\u0119 linij\u0105, i\u0161va\u017eiavo \u012f prie\u0161prie\u0161in\u0119
  eismo juost\u0105 ir aplenk\u0117 priekyje va\u017eiuojan\u010dius automobilius.
  U\u017e tai M. \u0160ala\u0161evi\u010dienei buvo sura\u0161ytas administracinio
  nusi\u017eengimo protokolas. Jeigu ji b\u016bt\u0173 sutikusi su pa\u017eeidimu,
  jai b\u016bt\u0173 reik\u0117j\u0119 sumok\u0117ti pus\u0119 baudos bei b\u016bt\u0173
  atimta teis\u0117 vairuoti transporto priemones 3 m\u0117nesiams. Ta\u010diau moteris
  nesutiko, tod\u0117l bir\u017eelio 12 dien\u0105 buvo priimtas nutarimas skirti
  administracin\u0119 nuobaud\u0105 \u2013 at\u0117mimas vairuoti 3 m\u0117nesiams
  ir nurodymas sumok\u0117ti 170 eur\u0173 baud\u0105.\\nTeismas, svarstydamas, ar
  su\u0161velninti bausm\u0119 keli\u0173 eismo taisykles pa\u017eeidusiai M. \u0160ala\u0161evi\u010dienei,
  atsi\u017evelg\u0117 \u012f tai, kad moteris pripa\u017eino savo kalt\u0119, d\u0117l
  to gail\u0117josi, o paskirt\u0105 baud\u0105 jau yra sumok\u0117jusi.\\nU\u017e
  i\u0161tisin\u0117s linijos kirtim\u0105 \u0161iemet teis\u0117s yra atimtos daugiau
  nei 1600 vairuotoj\u0173, kuri\u0173 ne vienas kreip\u0117si \u012f teism\u0105
  ir band\u0117 \u012frodyti, kad be teisi\u0173 tiesiog negali gyventi. Ta\u010diau
  Temid\u0117s tarnai, kaip jiems ir priklauso, buvo akli ir kurti. Ta\u010diau Seimo
  nario dukrai buvo pritaikyti kitokie standartai.\\nNugal\u0117jo \u201eereliai\u201c\\nTuoj
  po to Seime buvo u\u017eregistruota \u012fstatymo pataisa, pagal kuri\u0105 i\u0161tisin\u0119
  kelio juost\u0105 kertan\u010di\u0173 automobili\u0173 vairuotojams rekomenduojama
  ne visuomet skirti vairuotojo pa\u017eym\u0117jimo at\u0117mim\u0105. P. Gra\u017eulio
  dukros pa\u017eeidimas buvo padarytas gegu\u017e\u0117s 11 dien\u0105, o \u012fstatymo
  pataisa Seime u\u017eregistruota gegu\u017e\u0117s 23 dien\u0105 ir j\u0105 si\u016blyta
  priimti skubos tvarka. Tarp \u012fstatymo pataisos si\u016blytoj\u0173 \u2013 ir
  P. Gra\u017eulio pavard\u0117.\\nTokia skuba neliko nepasteb\u0117ta net Speciali\u0173j\u0173
  tyrim\u0173 tarnybos (STT) pareig\u016bn\u0173. J\u0173 nuomone, P. Gra\u017eulio
  dukra atsisak\u0117 sumok\u0117ti pus\u0119 baudos tik\u0117damasi, kad bus pakeistas
  jai nenaudingas teisinis reguliavimas ir v\u0117liau, \u012fsigaliojus skubos tvarka
  priimtoms \u012fstatymo pataisoms, bus panaikintas specialios teis\u0117s vairuoti
  transporto priemones at\u0117mimas.\\nApie tai, kad \u012fstatymo pataisa yra suinteresuotas
  Seimo narys P. Gra\u017eulis, STT direktorius Saulius Urbanavi\u010dius prane\u0161\u0117
  Seimui. P. Gra\u017eulis teig\u0117 niekaip nesusij\u0119s su \u012fstatymo pataisa
  \u2013 j\u0105 u\u017eregistravo kolega Rimas Andrikis i\u0161 tos pa\u010dios \u201etvarkie\u010di\u0173\u201c
  frakcijos, o jis tik pasira\u0161\u0119s po iniciatyva.\\nSTT pasi\u016bl\u0117
  \u012fstatymo projekt\u0105 svarstyti bendra tvarka. Seimas taip ir padar\u0117
  \u2013 klausimo svarstymas buvo perkeltas \u012f rudens sesij\u0105, o jai prasid\u0117jus
  i\u0161 karto ir apsvarstytas.\\nSTT pareig\u016bnai si\u016bl\u0117 atsi\u017evelgti
  \u012f Lietuvos keli\u0173 policijos nuomon\u0119 \u2013 pareig\u016bnai nepritar\u0117
  projektui, kuriuo siekiama su\u0161velninti administracin\u0119 atsakomyb\u0119
  ir panaikinti privalom\u0105 teis\u0117s vairuoti transporto priemones at\u0117mim\u0105,
  ta\u010diau \u012f \u0161ias pastabas atsi\u017evelgta nebuvo. Galima teigti, kad
  \u0161\u012f kart\u0105 pergal\u0119 pasiek\u0117 \u201ekeli\u0173 ereliai\u201c.\\nPetras
  KURMELIS\"", "\"iPhone viruso pa\u0161alinimas\\nKas yra iPhone virusas?\\niPhone
  virusas puola \u0161ios operacin\u0117s sistemos vartotojus\\niPhone virusas yra
  specifinis terminas, apimantis net kelis \u0161i\u0105 operacin\u0119 sistem\u0105
  galin\u010dius u\u017ekr\u0117sti virus\u0173 variantus. Daugelis vartotoj\u0173
  yra \u012fsitikin\u0119, jog \u201eApple\u201d kompanijos kuriama operacin\u0117
  sistema (iOS) yra atspari bet kokiam virusui. Vis d\u0117lto, hakeriai nestovi vietoje,
  tod\u0117l nieko nuostabaus, kad ir \u0161ios sistemos vartotojai susid\u016br\u0117
  su pavojingomis programomis.\\n\u017dinoma, \u0161i\u0173 virus\u0173 procentin\u0117
  dalis, lyginant su kitomis operacin\u0117ms sistemoms, yra \u017eenkliai ma\u017eesn\u0117.
  Windows jau seniai gars\u0117ja \u012fvairiausi\u0173 tip\u0173 virusais, tuo tarpu
  Android pasruosius kelis metus taip pat prad\u0117jo jau nenusileisti. Bendras \u0161i\u0105
  operacin\u0119 sistem\u0105 siekian\u010dio u\u017egrobti viruso pavadinimas yra
  Android virusas.\\nD\u0117l \u0161ios prie\u017easties ap\u017evelgsime visus \u0161iuo
  metu elektronin\u0117je erdv\u0117je plintan\u010dius \u201eiOS\u201d ir \u201emacOS\u201d
  operacin\u0117ms sistemoms skirtus virusus, bei pateiksime detalias j\u0173 pa\u0161alinimo
  instrukcijas.\\nJei pasteb\u0117jote, kad j\u016bs\u0173 telefonas ar kompiuteris
  prad\u0117jo sekan\u010dias veiklas, nieko nelaukite ir patikrinkite sistem\u0105
  su patikima antivirusine programa, nes tai yra vieno ar kito viruso simptomai:\\n-
  sul\u0117t\u0117jo\\n- rodo keistas reklamas\\n- prad\u0117jo peradresuoti jus \u012f
  abejoni\u0173 kelian\u010dias svetaines\\nSistemos patikrinimui mes rekomenduojame
  naudoti ReimageIntego. \u0160i programa ne tiks aptiks sistemos klaidas ir informuos
  apie u\u017ekr\u0117stus failus, bet ir pad\u0117s automatiniu b\u016bdu pa\u0161alinti
  u\u017ekr\u0117stus viruso failus.\\nNepageidaujamos programos siekia pakenkti \u201eApple\u201d
  produktams\\nAkivaizdu, jog potencialiai nepageidaujam\u0173 program\u0173 (angl.
  potentially unwanted programs) k\u016br\u0117jai, siekdami pakenkti \u201eiOS\u201d
  ir \u201emacOS\u201d vartotojams, \u012fkv\u0117pimo semiasi i\u0161 gerai \u017einom\u0173
  virus\u0173.\\nDalis \u201emacOS\u201d vartotoj\u0173 jau susid\u016br\u0117 su
  \u012ftartinu prane\u0161imu Safari nar\u0161ykl\u0117je. Jis \u012fsp\u0117ja apie
  kompiuter\u012f u\u017ekr\u0117tus\u012f virus\u0105, kuris galimai gali nutekinti
  aukos asmenin\u0119 informacij\u0105. \u017dinoma, toks prane\u0161imas yra nieko
  vertas ir siekia vieno \u2013 priversti savo auk\u0105 paskambinti neegzistuojan\u010diu
  telefono numeriu ir taip i\u0161vilioti i\u0161 jos \u0161iek tiek pinig\u0173.\\nKaip
  ir did\u017eioji dauguma melaging\u0173 prane\u0161im\u0173, \u0161is virusas taip
  pat gali bandy pasisavinti j\u016bs\u0173 asmenin\u0119 informacij\u0105, tod\u0117l
  jokiu b\u016bdu nepasitik\u0117kite si\u016blymais suvesti savo duomenis \u012f
  neai\u0161kiems asmenims priklausan\u010dias formas. Norime jus \u012fsp\u0117ti,
  jog \u201eApple\u201d produktai n\u0117ra u\u017eprogramuoti rodyti tokius prane\u0161imus
  ar ranginti savo vartotojus skambinti vienu ar kitu numeriu. J\u016bs gaite pasitik\u0117ti
  tik oficialia apple.com svetaine.\\nKita populiari Iphone viruso versija sukelia
  automati\u0161kai pasirodan\u010dias reklamas (angl. pop-ups). Jei kaskart, paleid\u0119
  Safari nar\u0161ykl\u0119, matote naujame lange atsiv\u0117rusi\u0105 reklam\u0105,
  j\u016bs\u0173 kompiuteris yra u\u017ekr\u0117stas. Tokiu atveju rekomenduojame
  nedelsiant \u012fsigyti apsaugos program\u0105 ir pa\u0161alinti u\u017ekr\u0117stus
  failus.\\n\u201eApple\u201d vartotojai tur\u0117t\u0173 atkrepti d\u0117mes\u012f
  ir \u012f egzistuojan\u010dius \u201enar\u0161ykli\u0173 u\u017egrob\u0117jus\u201d,
  angli\u0161kai vadinamus browser hijackers. Tokie virusai teigia esantys \u012fprastos
  nar\u0161ykl\u0117s, siekian\u010dios pagerinti vartotoj\u0173 paie\u0161kos rezultatus.
  Vis d\u0117lto, pagrindinis j\u0173 tikslas yra rinkti specifin\u0119 informacij\u0105,
  kuri yra susijusi su pa\u010diu vartotoju.\\nVis d\u0117lto, da\u017eniausiai \u017emon\u0117s
  pajau\u010dia, jog turi reikal\u0173 su virusu kai bando j\u012f pa\u0161alinti.
  Tokie virusai paprastai plinta kartu su eile skirting\u0173 komponent\u0173, kuriuos
  patogiausia i\u0161trinti automatiniu b\u016bdu.\\nPegasus \u0161nipin\u0117jimo
  programa \u2013 pavojingiausias Iphone \u012frenginiams skirtas virusas\\nPegasus
  \u0161nipin\u0117jimo programa yra vienas geriausiai \u017einom\u0173 Apple virus\u0173,
  kuris plinta per telefonus. Pirm\u0105 kart\u0105 \u0161i programa buvo pasteb\u0117ta
  2016-\u0173j\u0173 rugpj\u016bt\u012f. Manoma, jog \u0161io viruso pradinink\u0117
  yra Israelyje \u012fsik\u016brusi kompanija NSO group, kuri yra pagars\u0117jusi
  \u0161nipin\u0117jimo program\u0173 k\u016brimu.\\nPirmiausia \u0161is virusas itin
  kruop\u0161\u010diai pasirenka savo aukas ir i\u0161siun\u010dia joms trump\u0105sias
  SMS \u017einutes. Jose paprastai yra slepiama u\u017ekr\u0117sta nuoroda, kuri instaliuoja
  \u0161nipin\u0117jimo program\u0105 vos tik vartotojas ant jos paspaud\u017eia.
  Taip pat ji atlieka pakeitimus telefone, kurie leid\u017eia v\u0117liau \u012fra\u0161yti
  nelegalias aplikacijas ir rinkti apie vartotojus specifin\u0119 informacij\u0105.\\nKai
  Pegasus virusas pradeda veikti, vartotojo failai, SMS \u017einut\u0117s ir netgi
  skambu\u010di\u0173 \u012fra\u0161ai tampa visi\u0161kai prieinami jo k\u016br\u0117jams.
  \u0160i pavojinga programa taip pat gali pati savo pa\u0161alinti i\u0161 iPhone
  \u012frenginio. Tai ji padaro per 60 dien\u0173, vos tik negali prisijungti prie
  jai komandas diktuojan\u010dio serverio.\\nPegasus \u0161nipin\u0117jimo programa
  yra sud\u0117tingas virusas, kurios pa\u0161alinimas gali b\u016bti itin sud\u0117tingas.
  Vis d\u0117lto, m\u016bs\u0173 komanda rekomenduoja i\u0161bandyti \u0161ias viruso
  pa\u0161alinimo instrukcijas.\\nRansomware tipo virusai jau gali u\u017ekr\u0117sti
  ir \u201eApple\u201d vartotojus\\nKibernetin\u0117je erdv\u0117je jau pasirod\u0117
  ir macOS sustem\u0105 galintys u\u017ekr\u0117sti ransomware tipo virusai. \u0160ie
  virusai da\u017eniausiai plinta melaging\u0173 el. lai\u0161k\u0173 pagalba, juose
  pasisl\u0117pdami kaip .zip tipo priedai. Nors tik dalis toki\u0173 virus\u0173
  buvo suprogramuoti s\u0117kmingai, jie vistiek sugeb\u0117jo u\u017e\u0161ifruoti
  vartotoj\u0173 dokumentus, nuotraukas ir kitus failus.\\nPatarimai kaip i\u0161vengti
  iPhone viruso\\n- Neatidarin\u0117kite reklam\u0173, kurios paprastai yra susijusios
  su azartiniais lo\u0161imais, pornografija ar internetin\u0117mis pa\u017ein\u010di\u0173
  svetain\u0117mis.\\n- Reguliariai atnaujinkite savo operacin\u0119 sistem\u0105.\\n-
  Ne\u012fra\u0161in\u0117kite aplikacij\u0173 i\u0161 nepatikim\u0173 platintoj\u0173.\\n-
  Venkite nar\u0161yti svetain\u0117se, kuri\u0173 turinys jums kelia abejoni\u0173.\\nViruso
  pa\u0161alinimas i\u0161 iPhone telefono\\nJei pasteb\u0117jote, jog j\u016bs\u0173
  Apple kompiuteris ar telefonas prad\u0117jo ne\u012fprastai elgtis ar sulet\u0117jo
  jo darbo greitis, tuojau pat j\u012f nuresetinkite. Tai galite padaryti nu\u0117j\u0119
  \u012f \u201eSettings\u201d ir surad\u0119 \u201eGeneral\u201d funkcij\u0105. Kai
  tai padarysite, pasirinke \u201eErase All Content\u201d funkcij\u0105.\\nTaip pat,
  jei jus kankina nuolat pasirodan\u010dios reklamos (angl. pop-ups) Safari nar\u0161ykl\u0117je,
  rekomenduojame jas pa\u0161alinti \u0161iuo b\u016bdu:\\n- Paleiskite u\u017ek\u0117st\u0105
  nar\u0161ykl\u0119 ir pasirinkite \u201eSettings\u201d funkcij\u0105;\\n- \u010cia
  pasirinkite \u201eClear history and website data\u201d.\\nM\u016bsu komanda taip
  pat rekomenduoja patikrinti kompiuter\u012f su ReimageIntego programa, kuri atid\u017eiai
  patikrins sistem\u0105 ir prane\u0161 jums apie aptiktus pavojingus failus. Ji taip
  pat pad\u0117s jums s\u0117kmingai pa\u0161alinti kenk\u0117ji\u0161k\u0173 program\u0173
  failus ir apsaugos j\u016bs\u0173 kompiuter\u012f ar telefon\u0105 nuo kit\u0173
  virus\u0173.\\nTam, kad s\u0117kmingai panaikintum\u0117te sistemines klaidas, kurios
  gali b\u016bti sukeltos virus\u0173 infekcijos, naudokit\u0117s ReimageIntego. SpyHunter
  5Combo Cleaner ir Malwarebytes programos gali b\u016bti naudojamos kit\u0173 potencialiai
  nepageidaujam\u0173 program\u0173 ir virus\u0173 bei j\u0173 komponent\u0173 aptikimui.\\nRankinis
  iPhone viruso pa\u0161alinimas\\nNepageidaujam\u0173 program\u0173 \u0161alinimas
  i\u0161 Windows\\nNor\u0117dami pa\u0161alinti iPhone virusas i\u0161 Windows 10/8
  \u012frengini\u0173, atlikite \u0161iuos veiksmus:\\n- Windows paie\u0161kos laukelyje
  \u012fra\u0161ykite Control Panel ir paspauskite Enter arba spustel\u0117kite ant
  paie\u0161kos rezultato.\\n- Programs dalyje pasirinkite Uninstall a program.\\n-
  S\u0105ra\u0161e raskite \u012fra\u0161us, susijusius su iPhone virusas ar bet kuria
  kita neseniai \u012fdiegta \u012ftartina programa.\\n- De\u0161iniuoju pel\u0117s
  mygtuku spustel\u0117kite program\u0105 ir pasirinkite Uninstall.\\n- Jei i\u0161\u0161oko
  User Account Control, paspauskite Yes.\\n- Palaukite, kol bus baigtas pa\u0161alinimo
  procesas, o tada spustel\u0117kite OK.\\nJei naudojate Windows 7/XP, tuomet atlikite
  \u0161iuos \u017eingsnius:\\n- Spauskite Windows Start > Control Panel, esant\u012f
  de\u0161iniajame skydelyje (jeigu naudojate Windows XP spauskite Add/Remove Programs).\\n-
  Atsid\u016br\u0119 Control Panel pasirinkite Programs > Uninstall a program.\\n-
  Pasirinkite nepageidaujam\u0105 program\u0105 spustel\u0117dami j\u0105 vien\u0105
  kart\u0105.\\n- Vir\u0161uje spauskite Uninstall/Change.\\n- Tam, kad patvirtintum\u0117te
  \u017eingsn\u012f, spauskite Yes.\\n- Kai pa\u0161alinimas bus baigtas, spauskite
  OK.\\nI\u0161trinkite iPhone i\u0161 Mac OS X sistemos\\n- Jeigu j\u016bs naudojate
  OS X operacin\u0119 sistem\u0105, spuspel\u0117kite ant Go mygtuko ir pasirinkite
  Applications.\\n- Palaukite kol pasirodys Applications aplankas ir jame suraskite
  iPhone bei kitas abejoni\u0173 kelian\u010dias programas. De\u0161iniu pel\u0117s
  mygtuku spustel\u0117kite ant kiekvieno i\u0161 \u0161i\u0173 \u012fra\u0161\u0173
  ir pasirinkite Move to Trash.\\nI\u0161 naujo nustatykite MS Edge/Chromium Edge\\nPa\u0161alinkite
  nepageidaujamus pl\u0117tinius i\u0161 MS Edge:\\n- Pasirinkite Meniu (tris horizontalius
  ta\u0161kus nar\u0161ykl\u0117s lango vir\u0161uje, de\u0161in\u0117je pus\u0117je)
  ir paspauskite Extensions.\\n- I\u0161 s\u0105ra\u0161o pasirinkite su iPhone virusas
  susijus\u012f pl\u0117tin\u012f ir spustel\u0117kite krumpliara\u010dio piktogram\u0105.\\n-
  Apa\u010dioje spauskite Uninstall.\\nI\u0161valykite slapukus ir kitus nar\u0161ykl\u0117s
  duomenis:\\n- Spustel\u0117kite Meniu (tris horizontalius ta\u0161kus nar\u0161ykl\u0117s
  lango vir\u0161uje, de\u0161in\u0117je pus\u0117je) ir pasirinkite Privacy & security.\\n-
  Clear browsing data dalyje pasirinkite, k\u0105 norite i\u0161valyti.\\n- Pasirinkite
  visk\u0105, i\u0161skyrus slapta\u017eod\u017eius (nors galb\u016bt nor\u0117site
  \u012ftraukti medij\u0173 licencijas, jei \u012fmanoma) ir spustel\u0117kite Clear.\\nAtkurkite
  naujo skirtuko ir pagrindinio puslapio nustatymus:\\n- Spustel\u0117kite meniu piktogram\u0105
  ir pasirinkite Settings.\\n- Tuomet raskite On startup skyri\u0173.\\n- Spustel\u0117kite
  Disable, jei radote \u012ftartin\u0105 puslap\u012f.\\nJei kiti veiksmai nepad\u0117jo,
  i\u0161 naujo nustatykite MS Edge:\\n- Nor\u0117dami atidaryti u\u017eduo\u010di\u0173
  tvarkykl\u0119, paspauskite Ctrl + Shift + Esc.\\n- Spustel\u0117kite lango apa\u010dioje
  esan\u010di\u0105 More details rodykl\u0119.\\n- Pasirinkite Details.\\n- Dabar
  slinkite \u017eemyn ir raskite kiekvien\u0105 \u012fra\u0161\u0105 su Microsoft
  Edge pavadinimu. De\u0161iniuoju pel\u0117s klavi\u0161u spauskite ant kiekvieno
  i\u0161 j\u0173 ir pasirinkite End Task, kad sustabdytum\u0117te MS Edge veikim\u0105.\\nJei
  toks b\u016bdas jums nepad\u0117jo, tuomet reik\u0117s griebtis i\u0161pl\u0117stinio
  Edge atstatymo metodo. Ta\u010diau atminkite, jog prie\u0161 t\u0119sdami turite
  i\u0161sisaugoti atsargin\u0119 duomen\u0173 kopij\u0105.\\n- Savo kompiuteryje
  raskite \u0161\u012f aplank\u0105: C:\\\\\\\\Users\\\\\\\\%username%\\\\\\\\AppData\\\\\\\\Local\\\\\\\\Packages\\\\\\\\Microsoft.MicrosoftEdge_8wekyb3d8bbwe.\\n-
  Kad pasirinktum\u0117te visus aplankus, paspauskite klaviat\u016broje Ctrl + A.\\n-
  Spustel\u0117kite juos de\u0161iniuoju pel\u0117s mygtuku ir pasirinkite Delete.\\n-
  Dabar de\u0161iniuoju pel\u0117s mygtuku spustel\u0117kite Start mygtuk\u0105 ir
  pasirinkite Windows PowerShell (Admin).\\n- Kai atsidarys naujas langas, nukopijuokite
  ir \u012fklijuokite \u0161i\u0105 komand\u0105, o tada paspauskite Enter:\\nGet-AppXPackage
  -AllUsers -Name Microsoft.MicrosoftEdge | Foreach {Add-AppxPackage -DisableDevelopmentMode
  -Register \u201c$($_.InstallLocation)\\\\\\\\AppXManifest.xml\u201d -Verbose\\nInstrukcijos
  Chromium Edge nar\u0161yklei\\nI\u0161trinkite pl\u0117tinius i\u0161 MS Edge (Chromium):\\n-
  Atidarykite Edge ir spauskite Settings > Extensions.\\n- I\u0161trinkite nepageidaujamus
  pl\u0117tinius spustel\u0117dami Remove.\\nI\u0161valykite duomenis:\\n- Spustel\u0117kite
  Meniu ir eikite \u012f Settings.\\n- Pasirinkite Privacy and services.\\n- Clear
  browsing data dalyje pasirinkite, k\u0105 pa\u0161alinti.\\n- Time range skiltyje
  pasirinkite All time.\\n- Spauskite Clear now.\\nI\u0161 naujo nustatykite MS Edge
  (Chromium):\\n- Spauskite ant Meniu ir pasirinkite Settings.\\n- Kair\u0117je pus\u0117je
  pasirinkite Reset settings.\\n- Pasirinkite Restore settings to their default values.\\n-
  Patvirtinkite pasirinkim\u0105.\\nI\u0161 naujo nustatykite Mozilla Firefox\\nPa\u0161alinkite
  pavojingus pl\u0117tinius:\\n- Atidarykite Mozilla Firefox nar\u0161ykl\u0119 ir
  spustel\u0117kite Meniu (tris horizontalias linijas vir\u0161utiniame de\u0161iniajame
  lango kampe).\\n- Pasirinkite Add-ons.\\n- \u010cia pasirinkite papildinius, susijusius
  su iPhone virusas, ir spauskite Remove.\\nAtstatykite pagrindin\u012f puslap\u012f:\\n-
  Nor\u0117dami atidaryti meniu, vir\u0161utiniame de\u0161iniajame kampe spustel\u0117kite
  tris horizontalias linijas.\\n- Pasirinkite Options.\\n- Home parinktyse \u012fveskite
  pageidaujam\u0105 svetain\u0119, kuri bus atidaryta kaskart, kai \u012fjungsite
  Mozilla Firefox.\\nI\u0161valykite slapukus ir kitus duomenis:\\n- Spustel\u0117kite
  Meniu ir pasirinkite Options.\\n- Eikite \u012f Privacy & Security skyri\u0173.\\n-
  Slinkite \u017eemyn, kad rastum\u0117te Cookies and Site Data.\\n- Spustel\u0117kite
  Clear Data\u2026\\n- Pasirinkite Cookies and Site Data ir Cached Web Content, o
  tuomet spauskite Clear.\\nI\u0161 naujo nustatykite Mozilla Firefox\\nJei atlikus
  visus \u017eingsnius iPhone virusas vis tiek nebuvo pa\u0161alintas, tuomet i\u0161
  naujo nustatykite Mozilla Firefox:\\n- Atidarykite Mozilla Firefox nar\u0161ykl\u0119
  ir spustel\u0117kite Meniu.\\n- Eikite \u012f Help ir pasirinkite Troubleshooting
  Information.\\n- Give Firefox a tune up dalyje spauskite Refresh Firefox\u2026\\n-
  Kai i\u0161\u0161oks langas, patvirtinkite veiksm\u0105 spausdami Refresh Firefox
  \u2013 taip tur\u0117tum\u0117te s\u0117kmingai pa\u0161alinti iPhone virusas.\\nI\u0161
  naujo nustatykite Google Chrome\\nI\u0161trinkite kenk\u0117ji\u0161kus pl\u0117tinius
  i\u0161 Google Chrome:\\n- Atidarykite Google Chrome, spustel\u0117kite Meniu (tris
  vertikalius ta\u0161kus vir\u0161utiniame de\u0161iniajame kampe) ir pasirinkite
  More tools > Extensions.\\n- Naujai atsidariusiame lange pamatysite visus \u012fdiegtus
  pl\u0117tinius. Pa\u0161alinkite visus \u012ftartinius papildinius, kurie gali b\u016bti
  susij\u0119 su iPhone virusas spustel\u0117dami Remove.\\nI\u0161valykite Chrome
  duomenis:\\n- Spustel\u0117kite Meniu ir pasirinkite Settings.\\n- Privacy and security
  dalyje pasirinkite Clear browsing data.\\n- Pa\u017eym\u0117kite Browsing history,
  Cookies and other site data, taip pat Cached images and files.\\n- Paspauskite Clear
  data.\\nPakeiskite pagrindin\u012f puslap\u012f:\\n- Paspauskite ant meniu ir pasirinkite
  Settings.\\n- Startup skiltyje ie\u0161kokite \u012ftartinos svetain\u0117s, tokios
  kaip iPhone virusas.\\n- Spustel\u0117kite ant Open a specific or set of pages ir
  paspauskite tris ta\u0161kus, kad rastum\u0117te Remove parinkt\u012f.\\nI\u0161
  naujo nustatykite Google Chrome:\\nJei kiti metodai nepad\u0117jo, atkurkite Google
  Chrome nustatymus ir i\u0161trinkite senus duomenis, kad pa\u0161alintum\u0117te
  visus iPhone virusas komponentus:\\n- Spustel\u0117kite Meniu ir pasirinkite Settings.\\n-
