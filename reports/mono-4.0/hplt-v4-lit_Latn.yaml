  Karalyst\u0117s, kuri jau \u201epsichologi\u0161kai ruo\u0161\u0117si karui su Rusija\u201c.\\nI\u0161
  tikr\u0173j\u0173 \u017einut\u0117je minimas B-54 specialusis atominis u\u017etaisas
