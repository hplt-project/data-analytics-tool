  Vakarai es\u0105 gal\u0117t\u0173 \u012fvesti papildomas sankcijas Rusijai.\\nKartoja
  sen\u0105 S. Lavrovo versij\u0105\\nPavyzd\u017eiui, tinklapyje news-front.info
  tikinama, kad provokacij\u0105 P. Poro\u0161enka sureng\u0117 \u201epalieptas JAV
