  Senit SF. Issuu company logo.\"", "\"(Dagbladet.no): Mer enn 200 personer er s\u00e5
  langt arrestert i forbindelse med demonstrasjoner mot Irak-krigen i USA, melder
  nyhetsbyr\u00e5et Reuters. Demonstrasjonene onsdag markerer fem\u00e5rsdagen for
  invasjonen av Irak.\\nFlere offentlige bygninger og etater ble m\u00e5l for demonstantene,
  som blant annet fors\u00f8kte \u00e5 f\u00e5 den amerikanske skatteetaten i Washington
  D.C. til \u00e5 stenge, for \u00e5 sette et fokus p\u00e5 kostnadene ved krigen.
  32 personer ble arrestert her, mens 30 andre ble arrestert utenfor kongresskontorer.\\nDe
  fleste arrestasjonene ble imidlertid foretatt i San Francisco i California; mer
  enn hundre personer ble arrestert etter \u00e5 ha demonstrert i gatene.\\nIf\u00f8lge
  en politimann ble 101 personer arrestert for \u00e5 ha brutt seg inn p\u00e5 andres
  eiendom, for \u00e5 ha motsatt seg arrest og for \u00e5 hindre trafikken.\\nBlokkerte
  milit\u00e6rt rekrutterings-senter\\n20. mars 2003 invaderte USA Irak, og krigf\u00f8ringen
  har alts\u00e5 vart i fem \u00e5r. Rundt 4000 amerikanske soldater har mistet livet,
  mens det er uklart hvor mange irakerer som er drept. President George W. Bush beskriver
  krigen som en suksess.\\nDet har allerede blitt gjennomf\u00f8rt flere demonstrasjoner
  mot krigen rundt om i USA de siste dagene.\\nVed Washingtons National Mall gikk
  demonstrantene rundt med opp-ned amerikanske flagg som et tegn p\u00e5 at de er
  misforn\u00f8yde med situasjonen. Senere ble trafikken blokkert rundt i byens forretningsdistrikt.\\nArtikkelen
  fortsetter under annonsen\\nDemonstranter kastet ogs\u00e5 maling p\u00e5 bygningen
  der avisa The Examiner og selskapet Bechtel National Inc, som har hatt store rekonstruksjonsoppdrag
  i Irak, holder til.\\nPolitiet i Boston p\u00e5grep fem demonstranter som blokkerte
  et rekrutteringssenter for milit\u00e6ret. Demonstrantene l\u00e5 p\u00e5 fortauet,
  blant annet kledd som drepte irakiske sivile og en drept amerikansk soldat.\\nBestem\u00f8dre
  og t-skjorter\\nI New York gikk en langt mer rolig demonstrasjon for seg: 30 medlemmer
  av \u00abGranny Peace Brigade\u00bb - bestem\u00f8drenes fredsbrigade - samlet seg
  med strikket\u00f8yet sitt p\u00e5 Times Square. Bestem\u00f8drene arrangerte ogs\u00e5
  demonstrasjoner i 20 andre byer.\\n- Vi er her for \u00e5 vise folk at denne krigen
  er galskap. Vi skulle aldri ha kommet opp i situasjonen i f\u00f8rste omgang, sier
  den 80 \u00e5r gamle demonstranten Shirley Weiner.\\nOgs\u00e5 i Cincinatti foregikk
  det en spesiell protest. N\u00e6rmere 4000 t-skjorter, som skal symbolisere de amerikanske
  soldatene som er drept i Irak-krigen, ble satt opp p\u00e5 et stort stativ, if\u00f8lge
  nyhetsbyr\u00e5et AP.\\n- Krigen er en tragedie\\nEn som velger \u00e5 bruke pennen
  til \u00e5 protestere mot krigf\u00f8ringen i Irak, er FNs tidligere v\u00e5peninspekt\u00f8r
  Hans Blix.\\nI en kommentar i britiske The Guardian torsdag skriver Blix at Irak-krigen
  er en tragedie b\u00e5de for Irak, for USA, for FN, for sannheten og for menneskenes
  verdighet, melder NTB.\\nBlix ledet FNs v\u00e5peninspekt\u00f8rer som arbeidet
  i Irak f\u00f8r invasjonen i 2003. Da invasjonen var et faktum, anklaget han USA
  og Storbritannia for \u00e5 ha overdrevet hvilken trussel Saddam Hussein utgjorde.
  Landene viste blant annet til irakiske masse\u00f8deleggelsesv\u00e5pen, som det
  i ettertid viste seg ikke \u00e5 finnes spor etter.\\n- Irak utgjorde ingen reell
  eller overhengende fare for noen, skriver Blix i sin kommentar torsdag.\"", "\"KRIMINALITET\\nUSA
  sies \u00e5 ha en h\u00f8yere kriminalitetsrate enn andre industriland, men v\u00e6r
  ogs\u00e5 oppmerksom p\u00e5 at saker ofte blir noe overdrevet i media, som elsker
  sensasjoner. Som en helhet kan man vel heller si at USA kan karakteriseres som en
  trygg plass \u00e5 bo, spesielt i de omr\u00e5dene expats bosetter seg; fremdeles
  skjer det mest kriminalitet i bykjernen og fattige str\u00f8k rundt denne. Veldig
  liberale b\u00e6retillatelser for v\u00e5pen, stor ulikhet mellom fattig og rik
  og h\u00f8y fattigdomsandel, er alle faktorer som spiller inn i forhold til kriminalitetsrate
  og \u2013 art. Les deg litt opp eller sp\u00f8r rundt om omr\u00e5det dere vurderer
  \u00e5 bosette dere i.\\nVisse byer har ogs\u00e5 h\u00f8yere rate enn andre, men
  expats i USA/Houston kan forvente en sterk politi-tilstedev\u00e6relse overalt.
  Egne forh\u00e5ndsregler p\u00e5 basisniv\u00e5 b\u00f8r uansett bli praktisert
  i alle storbyer; slike som l\u00e5se bilen og unng\u00e5 \u00e5 g\u00e5 alene, samt
  ikke ta offentlige transportmidler nattestid.\\nDu vil gjerne oppleve en sterk politi-tilstedev\u00e6relse
  overalt. Ringer du politiet vil de ofte komme i l\u00f8pet av f\u00e5 minutter.
  Det er ikke uvanlig \u00e5 se 2-3 politibiler i l\u00f8pet av en kort kj\u00f8retur.
  Politiet passer p\u00e5 fotgjengere og skolebarn, og de st\u00e5r ofte strategisk
  plassert i nabolagene og observerer. Uansett, hvis du bosetter deg i \u201cExpat-communities\u201d,
  kan du forvente en kjapp og kvalitetsmessig bra respons fra politiet (sheriffen)
  om uhellet skulle v\u00e6re ute.\\nHa i alle tilfeller programmert mobiltelefoner
  og hustelefon med nummer til lokale politistasjoner. Hvis du sp\u00f8r litt rundt
  vil du ofte kunne f\u00e5 telefonnummeret til politibetjenter med s\u00e6rlig ansvar
  for akkurat ditt lille nabolag. Disse har lav terskel for utrykking; ofte kan det
  v\u00e6re nettopp ditt lille tips som kan bidra til \u00e5 l\u00f8se en kriminalitetssak.
  Ett eksempel kan v\u00e6re at du sier fra at en fremmed bil har st\u00e5tt parkert
  i gaten noen dager, eller at fremmede g\u00e5r fra hus til hus uten noe synlig form\u00e5l.\\nDu
  finner ellers mye nyttig informasjon om diverse tjenester som kan bidra til din
  families trygghet, p\u00e5 sidene til deres lokale \u201cSheriff\u2019s\u201d office.
  Disse er delt inn i de forskjellige counties, s\u00e5 finn hvilket du bor i og s\u00f8k
  selv eller du kan kanskje finne ditt county i lenkene nedenfor her:\\nFort Bend
  County,\\nHarris County,\\nMontgomery County\\nEksempel p\u00e5 tjenester er s\u00e5kalte
  \u201cneighbourhood watch\u201d programmer for boligomr\u00e5dene. Du finner ogs\u00e5
  viktige tips for \u00e5 unng\u00e5 kriminalitet. Du kan til og med be sheriffen
  passe huset ditt mens du er borte (det heter \u201cvacation watch\u201d)! Husk bare
  \u00e5 fylle ut skjema og bestille god tid i forveien.\"", "\"Skaun fikk kampens
  f\u00f8rste m\u00e5l allerede etter sju minutter da Jakob \u00d8yum-Jakobsen satte
  ballen i nettet, men Adrian Kristensen Aar utlignet da han satte inn 1-1. Vetle
  L\u00e6rum Winsnes ga Charlottenlund 2 ledelsen etter 34 minutters spill, men \u00d8yum-Jakobsen
  utlignet for Skaun i samme minutt. Nart Majed Alaa Eddeen sendte Skaun foran igjen
  da han satte inn 3-2 noen minutter f\u00f8r sidebytte. Det ble ikke scoret flere
  m\u00e5l f\u00f8r pause. Lagene gikk av banen p\u00e5 stillingen 3-2.\\nHavnet i
  tr\u00f8bbel - snudde oppgj\u00f8ret\\nNoen minutter ut i andreomgangen utlignet
  Spj\u00f8tvold for Charlottenlund 2. Eddeen sendte Skaun i f\u00f8ringen p\u00e5
  nytt tre minutter etter hvilen, men Spj\u00f8tvold s\u00f8rget for at lagene var
  like langt da han utlignet til 4-4 da det var spilt et kvarter av andre omgang.
  Jakob Jordet Holl\u00e5s s\u00f8rget for at Charlottenlund 2 tok ledelsen igjen
  med sin scoring da det var spilt en halv time i andreomgangen, og Mahamed Abdi Ahmed
  s\u00f8rget for jubel da han satte inn 6-4 seks minutter senere. Elias Farstad Hagen
  la p\u00e5 til 7-4 for Charlottenlund 2 to minutter f\u00f8r slutt. Ingen av lagene
  rakk \u00e5 finne nettmaskene igjen. Dermed ble den endelige stillingen 4-7.\\nKjempet
  seg oppover p\u00e5 tabellen\\nEtter torsdagens kamp er Skaun nummer seks p\u00e5
  tabellen med tre poeng, mens Charlottenlund 2 er p\u00e5 fjerdeplass med fire poeng.\\nFrode
  T\u00f8ndel \u00d8yangen var dagens dommer.\\n7. mai er det ny kamp for Skaun. Da
