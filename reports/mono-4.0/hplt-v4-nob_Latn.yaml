  Hvorfor trenger vi en pensjonsreform? Vi har med rette v\u00e6rt sv\u00e6rt stolte
  av folketrygden fra Men for det f\u00f8rste er det fare for at dagens pensjonssystem
  blir for dyrt med den eldreb\u00f8lgen vi ser foran oss. Det vil ogs\u00e5 lett
  g\u00e5 ut over andre velferdsomr\u00e5der som helse, eldreomsorg og skole. For
  det andre har dagens system en del urettferdige og uheldige sider, som minstepensjonsfella,
  det at man f\u00e5r kraftig avkortet pensjon hvis man fortsetter \u00e5 jobbe etter
  67 \u00e5r og at vi ikke har hatt obligatorisk tjenestepensjon i privat sektor.
  Med pensjonsforliket p\u00e5 Stortinget 21. mars i \u00e5r, som alle partiene unntatt
  Fremskrittspartiet st\u00e5r bak, er hovedtrekkene i den nye folketrygden avklart.
  Et hovedelement i den norske velferdsstaten er dermed sikret for flere ti\u00e5r
  framover. 2. Hvordan vil folketrygden forandres? Mye blir nytt, men de grunnleggende
  sosialdemokratiske verdiene, med vekt p\u00e5 omfordeling og trygghet for alle,
  vil prege ogs\u00e5 den nye folketrygden. Tidligste pensjoneringsalder reduseres
  fra 67 til 62 \u00e5r, og vi f\u00e5r n\u00e5 en helt ny mulighet til \u00e5 arbeide
  ved siden av pensjonen uten avkorting. Samtidig vil man f\u00e5 h\u00f8yere \u00e5rlig
  pensjon dersom man fortsetter \u00e5 arbeide og venter med \u00e5 ta ut pensjonen.
  Opptjening av pensjonspoeng vil fortsette utover dagens 40-\u00e5rsgrense, noe som
  er bra for sliteren som starter \u00e5 jobbe for eksempel som 18-\u00e5ring. Dessuten
  skal alle \u00e5r med inntekt (eller omsorgsarbeid) telle like mye n\u00e5r pensjonen
  beregnes, ikke som i dag de 20 beste \u00e5rene. Sist men ikke minst skal all inntekt
  opp til et tak p\u00e5 ca kroner gi \u00f8kt pensjon, slik at minstepensjonsfella
  avvikles. For \u00e5 sikre finansieringen av framtidas pensjoner i lys av eldreb\u00f8lgen,
  innf\u00f8res det en ordning hvor vi m\u00e5 jobbe noe lenger for \u00e5 f\u00e5
  samme pensjon dersom levealderen i befolkningen \u00f8ker (\u00ablevealdersjustering\u00bb).
  L\u00f8pende pensjoner vil dessuten reguleres slik at kj\u00f8pekraften \u00f8ker,
  men ikke fullt ut tilsvarende l\u00f8nnsutviklingen. 3. Hva skjer med AFP og tjenestepensjonsordningene?
  Pensjonsreformen har alt gitt oss en ordning med obligatorisk tjenestepensjon i
  privat sektor (OTP), som ble innf\u00f8rt i Det er videre avgj\u00f8rende at ordningen
  med avtalefestet pensjon (AFP) gjennom det brede pensjonsforliket trygges for framtida.
  Hvordan AFP skal tilpasses den nye folketrygden fra 62 \u00e5r, dr\u00f8ftes n\u00e5
  med arbeidslivets parter i et utvalg ledet av Bjarne H\u00e5kon Hanssen. Regjeringen
  har sagt at den bare vil st\u00f8tte en fremtidig AFP-ordning dersom den gir mulighet
  til \u00e5 g\u00e5 av ved 62 \u00e5r p\u00e5 en verdig m\u00e5te, noe som skal konkretiseres
  i det videre arbeidet. Ogs\u00e5 tjenestepensjonsordningene skal dr\u00f8ftes og
  tilpasses den nye folketrygden. 4. N\u00e5r kommer reformen og hva betyr den for
  meg? Pensjonsreformen skal gjennomf\u00f8res fra Grovt sett vil nye regler for uttak
  av pensjon, for eksempel at vi skal kunne kombinere arbeid og pensjon uten avkorting,
  virke alt fra 2010, mens nye regler for opptjening av pensjon vil f\u00e5 gjennomslag
  for pensjonene f\u00f8rst p\u00e5 lenger sikt. Det vil etableres et pensjonsregister,
  hvor man enkelt skal kunne finne ut hvor mye pensjon man kan regne med. Fordelingsprofilen
  p\u00e5 forslaget er klart bedre enn Pensjonskommisjonens forslag fra Siden det
  fortsatt arbeides under h\u00f8ytrykk med reformen, blant annet med overgangsregler,
  er det imidlertid ikke mulig enn\u00e5 \u00e5 si presist hvordan den enkelte p\u00e5virkes.
  Situasjonen til dagens folketrygdpensjonister og de som blir pensjonister f\u00f8r
  2010 vil p\u00e5virkes av reguleringen av l\u00f8pende pensjoner og muligheten til
  \u00e5 jobbe ved siden av uten avkorting (for \u00e5ringene), men vil neppe ber\u00f8res
