  de eldre Trygghet og valgfrihet er hovedstikkordene for Arbeiderpartiets satsing
  p\u00e5 eldreomsorg. En bedre eldreomsorg var en av de viktigste sakene vi gikk
  til valg p\u00e5 i 2005, og mye er gjort de to f\u00f8rste \u00e5rene i regjering.
  Med r\u00f8d-gr\u00f8nne flertall i kommunene vil vi komme enda lenger i \u00e5
  legge til rette for en verdig alderdom. En verdig alderdom Sylvia Brustad har ansvaret
  for eldreomsorgen i regjeringen. P\u00e5 sp\u00f8rsm\u00e5l om hvilke tre saker
  hun mener er viktigst av det regjeringen har f\u00e5tt til, er hun ikke i tvil som
  hva som m\u00e5 nevnes f\u00f8rst: \u00abFlere hender i eldreomsorgen var det aller
  viktigste og mest konkrete Arbeiderpartiet gikk til valg p\u00e5 i 2005 knyttet
  til \u00f8nsket om en verdig alderdom\u00bb, sier Brustad. \u00abAt det er mange
  nok ansatte som har tid til \u00e5 gi en god omsorg, til \u00e5 snakke og til \u00e5
  se at mange av brukerne har litt forskjellige behov hver dag.\u00bb flere \u00e5rsverk
  var l\u00f8ftet, og allerede etter to \u00e5r i regjering er fasiten 7800 nye \u00e5rsverk.
  \u00abDette betyr at flere eldre f\u00e5r plass p\u00e5 sykehjem og flere eldre
  f\u00e5r hjemmehjelp. Dette er virkelig noe som merkes for den enkelte i hverdagen\u00bb,
  fortsetter Brustad. Som er sv\u00e6rt forn\u00f8yd med at kommunene har kvittert
  ut \u00f8kte bevilgninger ved \u00e5 satse p\u00e5 eldreomsorg. Regjeringen har
  ogs\u00e5 f\u00e5tt mange gode tilbakemeldinger p\u00e5 Stortingsmeldingen \u00abMestring,
  muligheter og mening\u00bb som handler om framtidas omsorg. Meldinga omhandler mange
  sider av omsorgen, men Brustad trekker s\u00e6rlig frem arbeidet med \u00e5 bedre
  demensomsorgen: \u00abStadig flere lever med demens, men tilbudet og kompetansen
  har v\u00e6rt for d\u00e5rlig. Gjennom en egen plan skal vi utvikle tiltak som kan
  gis f\u00f8r det blir aktuelt med et held\u00f8gnstilbud og sette fokus p\u00e5
  \u00e5 lette p\u00e5r\u00f8rendes omsorgsbyrde\u00bb. Regjeringen har ogs\u00e5
  varslet at det skal komme et nytt tilskudd for sykehjemsplasser og omsorgsboliger.
  \u00abDet blir stadig flere eldre i \u00e5rene fremover. For \u00e5 sikre at de
  eldre skal kunne velge om de vil ha tilbudet tilrettelagt i egen bolig eller omsorgsbolig,
  og for at de skal kunne f\u00e5 sykehjemsplass n\u00e5r de trenger det, er det behov
  for \u00e5 bygge ut tilbud mange steder i landet\u00bb, forklarer Brustad. Aktive
  eldre God eldrepolitikk handler ikke bare om en god eldreomsorg. Det handler ogs\u00e5
  om at det skal finnes m\u00f8teplasser og gode aktivitetstilbud til alle aldersgrupper.
  Arbeiderpartiet har derfor snakket mye de siste \u00e5rene om eldre som ressurs.
  Regjeringen har utkvittert \u00f8nsket om \u00e5 sikre aktivitetstilbudene til de
  eldre rundt i landet ved \u00e5 utarbeide et nytt rundskriv. \u00abVi vet hvor mye
  tilbudene p\u00e5 eldresentre og frivillighetssentraler betyr for mange eldre\u00bb,
  sier Brustad om dette. \u00abDet gode arbeidet som gj\u00f8res her gir livskvalitet
  og motvirker ensomhet. Dette er bra for den enkelte, og det er str\u00e5lende forebyggende
  arbeid. Vi vil at mer av eldrepolitikken framover skal handle om hva som kan gi
  innhold i hverdagen til de eldre\u00bb, avslutter Brustad. Hun h\u00e5per at eldrepolitikken
  ogs\u00e5 blir sentral i denne valgkampen, og gleder seg til \u00e5 ta fatt p\u00e5
  diskusjonene med de andre partiene med regjeringens resultater i bagasjen. Sentralstyrets
  vedtak om Arbeiderpartiets eldreomsorg: Trygghet og valgfrihet i eldreomsorgen Arbeiderpartiet
  \u00f8nsker trygghet og valgfrihet i omsorgen. Da m\u00e5 det v\u00e6re nok tjenester
  tilgjengelig. Du skal kunne velge om du vil ha tilbudet tilrettelagt i egen bolig
  eller omsorgsbolig, eller om du vil ha en sykehjemsplass. De som mottar hjemmetjenester
  skal ha faste hjemmehjelpere, og m\u00e5 kunne bestemme selv hva de \u00f8nsker
  hjelp til. Vi vil innf\u00f8re et nytt tilskudd for sykehjemsplasser og omsorgsboliger,
  og fullf\u00f8re planen om flere \u00e5rsverk i pleie- og omsorgssektoren. Vi \u00f8nsker
  et bedre dagtilbud og sterkere fokus p\u00e5 kompetanse, kvalitet og service. nr.
