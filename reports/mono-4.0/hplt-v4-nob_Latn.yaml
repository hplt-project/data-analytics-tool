  kvinnetilbud, familiebehandling, LAR\\n23Valdresklinikken 6 Helse Vest plasser 12-trinnsmodell
  kvinner og menn 18 \u00e5r og oppover.\"", "\"Muskelsmerter\\nJeg er en jente p\u00e5
  26 \u00e5r som siden jan 2014 har hatt stramme muskler. Det begynte med en diffus
  plage ved symfysen p\u00e5 h\u00f8yre side som en slags \u00f8mhet, siden ble det
  i korsryggen, ryggen, skulderen, armen, halsen, nakken, hode osv. Jeg f\u00f8ler
  selv det er musklene. Det har kanskje v\u00e6rt slik i 1 og 1/2 \u00e5r kun p\u00e5
  h\u00f8yresiden. Smertebeskrivelse: Stort sett stramt, eller \u00f8mt/st\u00f8lt
  og det flytter p\u00e5 seg, kan v\u00e6re 2 uker i nakken, og 1 dag i korsryggen
  osv. Jeg er unders\u00f8kt med MR av hode (og rygg tror jeg), tatt blodpr\u00f8ver,
  v\u00e6rt til alt fra akupunktur/fysio/gu mm. N\u00e5 de siste mnd er det ogs\u00e5
  p\u00e5 venstre. Til slutt var jeg til en nevrolog som mente det var anspenthet,
  og jeg ble henvist til en fys.med. klinikk. Der ble jeg ogs\u00e5 unders\u00f8kt,
  men husker ikke hvordan, kan ikke huske han unders\u00f8kte punkter i forhold til
  fibromyalgi. Jeg har dermed trent 3 ganger i uken i 1 og 1/2 \u00e5r. Det som er
  problemet er at jeg syns ikke plagene har noen fremgang. Jeg syns trening gj\u00f8r
  godt, men jeg syns det er rart at plagene ikke \\\"bedres\\\" totalt sett. Jeg vet
  jeg har stort fokus (ufrivillig) p\u00e5 situasjonen min og at dette er uheldig,
  men det skremmer meg jo at jeg ikke blir bedre. Jeg er redd for utviklingen, jeg
  er redd for fremtiden, og redd for at ingen vet hva som \\\"egentlig\\\" feiler
  meg og at det er fibromyalgi. Hadde jeg sett fremgang, hadde jeg jo automatisk slappet
  mer av\\nTilleggsinfo: G\u00e5r p\u00e5 loette, g\u00e5tt p\u00e5 p-piller siden
  jeg var 16 \u00e5r. Fikk p\u00e5vist usikre celleforandringer n\u00e5 i \u00e5r
  (hadde kanskje sopp da pr\u00f8ven ble tatt), og skal p\u00e5 ny sjekk om 6 mnd,
  er en del oppbl\u00e5st, sover godt om natten, men dr\u00f8mmer negative dr\u00f8mmer.
  Har ogs\u00e5 en del nattsvette i nakken. F\u00f8ler meg opplagt.\\n1. Jeg vet du
  ikke kan diagnostisere meg p\u00e5 nett, men h\u00f8res dette ut som fibromyalgi?\\n2.
  Hva er forskjell p\u00e5 fibromyalgi og anspente muskler i hele kroppen?\\n3. Jeg
  har v\u00e6rt til to leger og foresl\u00e5tt fibromyalgi og begge avfeider det,
  men ingen har unders\u00f8kt meg. En av dem var fastlegen min, og den andre en privatlege
  p\u00e5 Aleris.\\nFibromyalgi er en diagnose som p\u00e5 en m\u00e5te kan ansees
  som en betegnelse eller \\\"merkelapp\\\" p\u00e5 vondt i kroppen over tid. Der
  er ingen objektive funn som kan bekrefte tilstanden, alts\u00e5 ingen r\u00f8ntgenbilder,
  blodpr\u00f8ver e.l. En har imidlertid visse \u00f8mme punkter p\u00e5 kroppen,
  som legen kan finne ved \u00e5 trykke deg p\u00e5 en rekke steder i muskulatur m.v.,
  og disse \u00f8mme punktene er en del av grunnlaget for \u00e5 stille en slik diagnose.\\nEn
  god hypotese p\u00e5 hva som kan v\u00e6re medvirkende faktor i en fibromyalgi er
  at hjernen forsterker sansesignaler fra kroppen / muskler m.v., slik at normale
  sensasjoner oppleves som smertefulle. Smerte er som kjent subjektivt, og da vil
  en slik \\\"hjerneutl\u00f8st\\\" forsterkning av normale sanseopplevelser og \\\"vanlige
  vondter\\\" fra kroppen, naturligvis oppleves som en betydelig smerte for den aktuelle
  person.\\nJeg vil ikke uttale meg om det du har kan diagnostiseres som fibromyalgi
  eller ikke. Blant annet er det jo disse kriteriene for diagnosen, med de \u00f8mme
  punkter jfr ovenfor. Og jeg pleier rent personlig ikke \u00e5 bruke denne diagnosen,
  da jeg synes det er lite \u00e5 hente p\u00e5 det rent behandlingsmessig for den
  aktuelle person som har smerter fra kroppen. Alts\u00e5 sett ifra pasientsynspunkt
  blir det, -slik jeg ser dette- , et \\\"what`s in it for me?\\\" -type sp\u00f8rsm\u00e5l,
  det \u00e5 evt f\u00e5 stilt en slik diagnose. Kurerende behandling finnes jo uansett
  ikke, s\u00e5 hva har en igjen for \u00e5 f\u00e5 akkurat denne betegnelsen p\u00e5
  smertene sine, tenker n\u00e5 jeg. Mens andre tenker motsatt. Jeg har ogs\u00e5
  h\u00f8rt om personer som synes det har v\u00e6rt greit \u00e5 f\u00e5 en slik diagnose
  og forklaring p\u00e5 plagene.\\nForskjell p\u00e5 fibromyalgi og anspente muskler:
  Godt sp\u00f8rsm\u00e5l, vil jeg for det f\u00f8rste si.\\nAnspente muskler har
  vi alle fra tid til annen, noen mer, andre mindre, noen langvarig, andre kortvarigere.
  Det gj\u00f8r som kjent vondt. Fibromyalgi er en diagnose som brukes p\u00e5 tilstander
  med langvarig vondt i kroppen, hvor man har utelukket andre objektive forklaringer
  p\u00e5 smertene og hvor det kreves et visst antall av disse \u00f8mme punktene
  m.v. for \u00e5 benytte betegnelsen fibromyalgi p\u00e5 smertene.\\nI ditt punkt
  3 s\u00e5 forteller du at du har foresl\u00e5tt fibromyalgidiagnosen til to forskjellige
  leger, men ingen har unders\u00f8kt deg. Men du stiller ingen sp\u00f8rsm\u00e5l
  om dette. Jeg kan kommentere dette med at det finnes flere leger enn meg, som ikke
  n\u00f8dvendigvis tror at det alltid er noe nyttig for en pasient \u00e5 f\u00e5
  en slik diagnose, og en diagnose er jo tross alt kun et aktivt ordvalg p\u00e5 et
  eller annet fra kroppen, og hvor selve diagnosen inkluderer dette med manglende
  muligheter for kurering osv. Det blir jo -slik jeg ser det- veldig pessimistisk
  og lite konstruktivt \u00e5 f\u00e5 en slik beskrivelse av sine smerter: \\\"ingenting
  kan kurere meg\\\". Jeg \u00f8nsker som hovedregel ikke \u00e5 gi personer en slik
  diagnose, som inkluderer s\u00e5 d\u00e5rlige behandlingsmuligheter. Det kan vel
  da kanskje ikke utelukkes at de to legene har hatt tanker i den gaten. Men du var
  jo unders\u00f8kt p\u00e5 fys.med. og da er det \u00e5 avklare om en pasients smerter
  kan kategoriseres som fibromyalgi, vanligvis alltid en del av utredningen, s\u00e5
  jeg ville sterkt anta at det er blitt vurdert ifra fys med. Jeg synes du skal lese
  gjennom epikrisen ifra Fys med sammen med fastlegen din (ikke alene) for \u00e5
  se hvilke konklusjoner de har kommet til, og om dette med evt fibromyalgi har v\u00e6rt
  vurdert.\\nDu er heldigvis kun 26 \u00e5r, og etter alt \u00e5 d\u00f8mme aldeles
  frisk, siden du har v\u00e6rt unders\u00f8kt s\u00e5 grundig uten at man har funnet
  tegn til sykdom. Det betyr at der er utrolig stort potensiale for \u00e5 f\u00e5
  en stadig bedre og mer velfungerende kropp, med mindre smerter, over tid. I din
  alder t\u00e5ler kroppen sv\u00e6rt mye, jevn og hard trening, og det vil virke
  gunstig p\u00e5 enhver type smerter. Jeg hadde derfor heller valgt \u00e5 tenke
  langsiktig og trent videre her, fremfor \u00e5 f\u00e5 en eventuell diagnose som
  inneb\u00e6rer negative prognoser og f\u00e5 behandlingsmuligheter. H\u00e5per at
  mine innspill er til nytte, lykke til!\"", "\"La oss snu p\u00e5 det!\\nDu m\u00e5
  v\u00e6re logget inn for \u00e5 skrive i forumene.\\nLa oss snu p\u00e5 det!\\nFakta
  er at jeg objektivt sett ikke har noen grunn til \u00e5 \u00f8nske \u00e5 d\u00f8.
  Jeg sliter ikke psykisk (i hvertfall ikke som mange her inne gj\u00f8r), jeg har
  ingen nevnv\u00e6rdige problemer, har ok selvtillit og bra utseende.\\nMEN, jeg
  ser ingen grunn til \u00e5 leve heller.. Jeg har ingen m\u00e5l, ingen ambisjoner,
  ingen lyst til \u00e5 gj\u00f8re noe. INGENTING gir meg mening.\\nS\u00e5 hvorfor
  i helvete trenger jeg en grunn til \u00e5 avslutte livet??? Jeg trenger ikke det.
  Det jeg faktisk trenger er en, kun en, grunn til \u00e5 leve..\\nJeg kan ikke finne
  den. Har lett i over 15 \u00e5r. Men, tror ikke jeg kommer til \u00e5 gj\u00f8re
