  oss snu p\u00e5 det!\\nM\u00e5 det v\u00e6re en mening med livet ?-og i s\u00e5
  fall, kan det jo v\u00e6re mange som mener livet er verdt \u00e5 leve nettop fordi
  DU er til.\"", "\"Alle med b\u00e5de sm\u00e5 barn og hund kjenner godt til utfordringene.
  Begge krever sin dose omsorg og oppmerksomhet, men det er ogs\u00e5 andre ting man
  m\u00e5 passe p\u00e5. Skal man ut p\u00e5 biltur i ferien er det spesielt viktig
  \u00e5 passe godt p\u00e5 sine mest s\u00e5rbare venner. Selv det minste uhell,
  kan f\u00e5 alvorlige konsekvenser hvis ikke medpassasjerer eller last er godt nok
  sikret.\\nI f\u00f8lge Statistisk Sentralbyr\u00e5 er vi nest lavest i Europa p\u00e5
  ulykker med antall drepte, kun forbig\u00e5tt av Malta. Allikevel d\u00f8r mellom
  100-150 personer p\u00e5 norske veier hvert eneste \u00e5r. Dette tilsvarer en risiko
  p\u00e5 ca. 3 drepte per 100 000 innbyggere. Selv om det er et lavt tall sammenlignet
  med andre land, er det fremdeles et h\u00f8yt tall isolert sett. Erfaringer gjort
  av Statens vegvesen viser at d\u00e5rlig sikret last, i mange tilfeller for\u00e5rsaker
  alvorlig skade eller d\u00f8d. Planlegger man \u00e5 legge ut p\u00e5 biltur i ferien
  er man forpliktet til \u00e5 sikre b\u00e5de seg selv, barn, hund og annen last
  p\u00e5 forsvarlig m\u00e5te.\\nFor \u00e5 unng\u00e5 feilsikring er det viktig
  \u00e5 terpe p\u00e5 trafikksikkerhet og forsvarlig sikring av last. Som sj\u00e5f\u00f8r
  st\u00e5r man ansvarlig for \u00e5 bruke godkjent sikkerhetsutstyr og s\u00f8rge
  for korrekt sikring. NAF og Trygg Trafikk har laget sjekklister for hvordan man
  sikrer barn, hund og annen last p\u00e5 en sikker og trygg m\u00e5te. Her er en
  oppsummering av de viktigste punktene:\\n- P\u00e5 generelt grunnlag anbefales det
  \u00e5 bruke godkjent sikkerhetsutstyr og p\u00e5se at utstyret er korrekt montert.\\n-
  S\u00f8rg for \u00e5 sikre l\u00f8se gjenstander slik at de ikke skyter fart ved
  kollisjon.\\n- Handleposer b\u00f8r alltid plasseres p\u00e5 gulvet.\\n- Hundebur
  b\u00f8r festes til festepunkt eller nakkest\u00f8tte i bagasjerom og/eller baksete.\\n-
  S\u00f8rg for \u00e5 feste tung last med lastestropper.\\n- Fordel vekten i bagasjerommet
  og s\u00f8rg for at tung last alltid ligger nederst.\\n- Pass p\u00e5 at du ikke
  overstiger bilens tillatte vekt og at dekktrykket samsvarer med det som st\u00e5r
  i bilens h\u00e5ndbok.\\n- Sist men ikke minst \u2013 Bruk god tid p\u00e5 sikring
  av last!\\nSikring av barn i bil\\nStatistikk fra Trygg Trafikk viser at s\u00e5
  mange som fem til ti barn feilsikres i bilen. Pass derfor p\u00e5 at du f\u00e5r
  utstyr som passer b\u00e5de barn og bil. Tar du dine forholdsregler vil du unng\u00e5
  \u00e5 utsette barna for un\u00f8dig fare. S\u00f8rg for \u00e5 v\u00e6re n\u00f8ye
  med \u00e5 f\u00f8lge angitte instruksjoner, og p\u00e5se at utstyret er riktig
  montert.\\n\u2013 Alle barn skal sikres i godkjent barnesete til de er minst 36
  kg, eller 135 cm.\\n\u2013 Barn b\u00f8r ogs\u00e5 sitte bakovervendt i setet s\u00e5
  lenge som mulig, og helst til de er fire \u00e5r.\\n\u2013 S\u00f8rg for riktig
  beltebruk. Belte skal aldri festet bak ryggen eller under armen.\\n\u2013 Barn som
  fremdeles er under 140 cm skal ikke sitte foran airbag i forsetet.\\nSikring av
  hund i bil\\nUavhengig av om du skal ut p\u00e5 en kort eller lengre tur med bilen,
  m\u00e5 du alltid s\u00f8rge for \u00e5 sikre hunden p\u00e5 forsvarlig m\u00e5te.
  En usikret hund vil potensielt kunne medf\u00f8re livsfare b\u00e5de for hund, medpassasjerer
  og deg som sj\u00e5f\u00f8r. Beregninger gjort av NAF viser at en usikret hund vil
  kunne akselerere og utgj\u00f8re kraften til en liten elefant ved br\u00e5stopp
  eller trafikkuhell. Skal man p\u00e5 biltur m\u00e5 man sikre hunden i et solid
  hundebur. Pass p\u00e5 \u00e5 sikre buret til festepunktene i bilen, og unng\u00e5
  at buret sklir ved bruk av sklisikker matte.\\nDet finnes en rekke hundebur p\u00e5
  markedet og her er det lurt \u00e5 kj\u00f8pe et bur som gir god valuta for pengene.
  Sm\u00e5 og sammenleggbare bur er s\u00e6rlig utsatt og vil kunne kollapse ved et
  sammenst\u00f8t. S\u00f8rg derfor for \u00e5 kj\u00f8pe et st\u00f8rre, tyngre og
