  knekke gjengkriminaliteten. 2. St\u00f8rste opptak p\u00e5 politih\u00f8gskolen
  siden studenter, med det h\u00f8yeste antall s\u00f8kere med minoritetsbakgrunn
  noen gang. Styrket Regjeringen har styrket bevilgningene til politiet med totalt
  257 millioner kroner siden den tiltr\u00e5dte. 3. Lovforslag om utvidet bruk av
