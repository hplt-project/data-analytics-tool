  Vi har intervjuet kulturminister Trond Giske, som mener at kulturpolitikk b\u00f8r
  st\u00e5 h\u00f8yt p\u00e5 dagsorden i valgkampen. Hvorfor mener du kultur b\u00f8r
  v\u00e6re en viktig sak i valgkampen? Noe av det beste i livet er \u00e5 dele opplevelser
  med andre. Gode opplevelser gir livskvalitet, det gir inspirasjon, refleksjon og
  skaper samh\u00f8righet. Et samfunn med gode opplevelser er et godt samfunn \u00e5
  leve i. Kultur gir oss disse opplevelsene, det gj\u00f8r livet rikere. I tillegg
  har kultur stor betydning for andre m\u00e5l. Sm\u00e5 samfunn som satser p\u00e5
  kultur f\u00e5r igjen p\u00e5 mange felt. Folk vil bo der det finnes fritidsaktiviteter
  til ungene, og et godt kulturtilbud for voksne. Teater, kino, kulturskole eller
  gode konserter gj\u00f8r at folk trives og vil bli boende. Kulturen bidrar til gode
  oppvekstvilk\u00e5r, en aktiv alderdom og samh\u00f8righet mellom folk. Det handler
  om fritiden v\u00e5r og hvordan vi lever livene v\u00e5re. Derfor b\u00f8r vi satse
  p\u00e5 kulturen i valgkampen. Hva har Regjeringen gjort for kulturen siden den
  overtok? F\u00f8r valget lovet vi \u00e5 innf\u00f8re et kulturl\u00f8ft, og m\u00e5let
  er at 1% av statsbudsjettet skal brukes p\u00e5 kultur. Vi er helt i rute. Til sammen
  har vi brukt 610 millioner mer p\u00e5 kultur. Alle felter f\u00e5r mer, det har
  v\u00e6rt store p\u00e5plusninger til b\u00f8ker i bibliotekene, museene og musikken
  som korene, korpsene, rockescener, festivaler, til teater og film og stor satsing
  p\u00e5 frivilligheten. Alle felter har f\u00e5tt en \u00f8kning. Ikke minst har
  vi satset p\u00e5 mer penger til det frivillige kulturlivet, blant annet gjennom
  frifond og \u00f8vingslokaler, samtidig som vi spiller p\u00e5 lag med idretten.
  Det gj\u00f8r at alle de som legger inn en enorm frivillig innsats, som leder av
  et kor, som trener i et fotballag, eller som ildsjel i kulturlivet, kan bruke mer
  tid p\u00e5 aktiviteten, og mindre p\u00e5 loddsalg, kakebaking og loppemarked.
  Har kulturpolitikken noe \u00e5 si for min kommune? -Ja absolutt! N\u00e5r kommune\u00f8konomien
  er styrket med 13 milliarder siden vi overtok ser vi gledelige resultater, fordi
  kommunene finner rom til \u00e5 prioritere kultur. Faktisk vokser kulturbudsjettene
  i kommunene mer enn de andre omr\u00e5dene. Kommunene har brukt mer enn en halv
  milliard kroner mer p\u00e5 kultur. Sammen med de 610 millionene vi har \u00f8kt
  det statlige kulturbudsjettet med siden vi overtok har vi alts\u00e5 f\u00e5tt godt
  over en milliard mer til kultur. Den lokale kulturen f\u00e5r ogs\u00e5 stor glede
  av de statlige \u00f8kningene, da mye av det g\u00e5r til lokale kulturtiltak, til
  lokale lag og foreninger, til kulturbygg, til kultur i skolen gjennom den kulturelle
  skolesekken, til kor, musikkorps, dansegrupper, teatre lista er lang. Hva er du
  mest stolt av \u00e5 ha f\u00e5tt til? Det er at vi fikk til kulturl\u00f8ftet.
  Det er et stort skifte i hvordan kulturfeltet blir behandlet i politikken. Fra \u00e5
  v\u00e6re pynten p\u00e5 kaka, det som blir igjen n\u00e5r de store pengene er fordelt
  til veier, kommuner og forsvar, har kulturen blir et av de sentrale satsingsomr\u00e5dene.
  Kunst og kultur har kommet opp i politikkens eliteserie til glede for folk i hele
  Norge. Det er jeg stolt av! (16 nr. 2 august 2007\\n17 Siden regjeringsskiftet har
