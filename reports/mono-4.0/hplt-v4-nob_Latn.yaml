  utdelte artikler\\nAnbefalt litteratur:\\nJohnstad, Tom (red), 2004. Klynger, Nettverk
  og Verdiskapning i Innlandet, NIBR-rapport 2004:8\"", "\"I den nye dokumentarserien
  \u00abThe Viral Delusion\u00bb kommer motstemmene fram; leger og forskere som har
  gjennomskuet narrativet om et virus s\u00e5 farlig at det n\u00f8dvendiggj\u00f8r
  injisering av genmateriale i verdens befolkning.\\nDokumentaren g\u00e5r gjennom
  hele korona-fortellingen og avdekker innledningsvis at sykdommen covid-19 mangler
  spesifikke kjennetegn som skiller den fra kjente sykdommer som influensa, lungebetennelse
  etc. Det vi er vitne til er alts\u00e5 en omd\u00f8ping av kjente lidelser for \u00e5
  skape frykt og aksept for tiltak som var utenkelige for to \u00e5r siden.\\nVidere
  avdekkes hvordan viruset faktisk aldri er p\u00e5vist i naturen (in vivo), langt
  mindre i menneskekroppen. Partiklene som f\u00e5r merkelappen \u00abSARS Covid-2-virus\u00bb
  oppst\u00e5r som et laboratorieprodukt (in vitro) i d\u00f8ende cellekulturer, hovedsakelig
  fra apenyrer. Og den samme \u00abd\u00f8dsprosessen\u00bb kan skapes i slike cellekulturer
  uten \u00e5 tilsette \u00abvirus\u00bb fra syke mennesker.\\nDernest avkles myten
  om at viruset har blitt \u00abisolert\u00bb slik at dets biokjemiske og genetiske
  egenskaper er kjente. Denne myten baserer seg p\u00e5 en uvitenskapelig bruk av
  uttrykket \u00abrenset\u00bb eller \u00abisolert\u00bb, som dekker over det faktum
  at denne p\u00e5st\u00e5tte sykdomsfremkallende partikkelen aldri ble atskilt fra
  myriaden av biologisk og genetisk materie i spyttpr\u00f8vene fra syke.\\nKonsekvensen
  er at viruset bare finnes som et computerprodukt (in silico), der enorm datakraft
  har klippet, kopiert og limt sammen sm\u00e5 gensekvenser for \u00e5 montere et
  teoretisk genom tilh\u00f8rende et antatt virus. Dette computergenererte genomet
  er grunnlaget for alle tester og vaksiner som skal kunne p\u00e5vise og angripe
  det antatte viruset. For \u00e5 si det popul\u00e6rt: Vi har med et datavirus \u00e5
  gj\u00f8re.\\nAv dette f\u00f8lger at den s\u00e5kalte PCR-testen er uegnet til
  \u00e5 p\u00e5vise infeksjon eller sykdom, ettersom den i beste fall kun gjenkjenner
  det computergenererte genomet.\\nVidere viser dokumentaren at ideen om asymptomatisk
  smitte er d\u00e5rlig fundert. Det fins ikke vitenskapelig belegg for \u00e5 p\u00e5st\u00e5
  at friske personer utgj\u00f8r en trusel mot din helse.\\nDernest g\u00e5r dokumentaren
  inn p\u00e5 behandlingen, og dette er kanskje den delen som er tyngst \u00e5 ta
  inn over seg, ettersom s\u00e5 mye av behandlingen har gjort vondt til verre. Bruken
  av giftige kjemikalier i s\u00e5kalte antivirale medisiner har tatt mange liv, s\u00e6rlig
  blant eldre, som ogs\u00e5 er ekstra utsatt n\u00e5r man g\u00e5r til drastiske
  skritt som intubasjon og bruk av respirator.\\nOg s\u00e5 er det vaksinen, som jo
  ikke er en tradisjonell vaksine, men injisering av en gensekvens i en mikstur som
  ogs\u00e5 omfatter ikke-biologisk materie av ukjent opprinnelse og med ditto virkning.
  Disse forskerne, blant de fremste i verden, har vanskelig for \u00e5 forst\u00e5
  hvordan det lot seg gj\u00f8re \u00e5 overtale s\u00e5 mange til \u00e5 injisere
  noe s\u00e5 potensielt farlig. Og de er helt klare p\u00e5 at en kan endre menneskers
  arvestoff ved slike injeksjoner.\\nTil slutt dr\u00f8ftes hva som egentlig for\u00e5rsaker
  sykdom, og denne diskusjonen kan kort oppsummeres ved begrepene \u00abgerm theory\u00bb
  versus \u00abterrain theory\u00bb. S\u00e5 lenge vi holder fast ved den f\u00f8rste,
  er vi i evig krig med mikrobene. Tar vi inn over oss den siste, kan vi begynne \u00e5
  endre v\u00e5re livsbetingelser til det bedre.\\nF\u00f8rste episode, som denne
  omtalen baserer seg p\u00e5, kan du se gratis her: https://paradigmshift.uscreen.io/\"",
  "\"Ulriksbanen stoppet i en time\\n- Ingen var i gondolene, sier Alexander Alexandrovitch
  Shestakov om banestansen torsdag ettermiddag.\\nShestakov er stedfortredende driftsleder
  p\u00e5 Ulriksbanen.\\n\u2014 Det var en elektronikkfeil som det tok en time \u00e5
  feils\u00f8ke og f\u00e5 reparert, sier han til bt.no.\\nBanen sto if\u00f8lge ham
  fra cirka 15.30 torsdag til klokken 16.30.\\n\u2014 Folk m\u00e5tte vente litt.
  Men n\u00e5 har vi funnet feilen og er i full gang igjen.\\n\u2014 Folk p\u00e5
  stasjonen var ikke redde i det hele tatt, de holdt seg gode og varme p\u00e5 stasjonen
  og i restauranten.\"", "\"1 MAGASIN FOR ARBEIDERPARTIETS MEDLEMMER nr. 2 august
  ALLE SKAL MED Valg 2007\\n2 Et verdivalg I \u00e5r er det kommunevalg. Det betyr
  at det ikke er ett, men 431 valg som skal vinnes over hele landet. Mange steder
  er den store debatten lokal om veien skal g\u00e5 den eller den traseen eller for
  og mot kulturhus. Men vi m\u00e5 hele tiden minne velgerne v\u00e5re p\u00e5 at
  dette valget er et verdivalg. Det er et valg mellom fellesskapsl\u00f8sninger og
  de som tror p\u00e5 privatisering, konkurranse og anbud. Arbeiderpartiet g\u00e5r
  til valg med budskapet om at alle skal med. Vi tror det er bedre for alle at alle
  har det bra at det er gjennom gode fellesskapsl\u00f8sninger at vi lager samfunn
  som er gode og trygge for alle, enten det er en god offentlig skole eller en trygg
  eldreomsorg. Vi har plukket ut fire saker som er spesielt viktig for oss i denne
  valgkampen: eldreomsorg, skole, klima og arbeidsliv. Eldre mennesker skal v\u00e6re
  sikre p\u00e5 at den dagen de trenger hjelp, skal de f\u00e5 hjelp. Den tryggheten
  vil vi at alle eldre skal ha, uansett hvor i landet de bor. Vi vil at eldre mennesker
  skal vite at de kan f\u00e5 hjelp og at de selv skal kunne velge hva slags hjelp
  de har behov for. Det er det som er den viktige valgfriheten at det er nok, ikke
  at det er anbud og konkurranse om \u00e5 levere en tjeneste det er for lite av.
  Vi er ikke mot private tilbud, det kan v\u00e6re et godt supplement. Men det er
  bare kommunen som kan v\u00e6re garantisten for et trygt og godt omsorgstilbud.
  Derfor vil vi styrke den kommunale eldreomsorgen og organisere den slik at folk
  f\u00e5r den hjelpen de trenger og selv er med \u00e5 bestemme behov og hvem som
  skal hjelpe. V\u00e5rt m\u00e5l er \u00e5 f\u00e5 heldaggskole for alle barn. Vi
  ser at barn l\u00e6rer for lite p\u00e5 skolen og at skolen ikke klarer \u00e5 utjevne
  de sosiale forskjellene mellom elevene. Vi \u00f8nsker at alle barn skal f\u00e5
  gode muligheter til \u00e5 velge hva de vil videre i livet. Da trenger vi en enda
  bedre skole. Jeg har sagt i sommer at Norge m\u00e5 ha en visjon om \u00e5 f\u00e5
  verdens beste skole. Noe annet m\u00e5l kan vi ikke ha. Med heldagsskolen blir det
  flere kunnskapstimer, en SFO-time midt p\u00e5 dagen og tilbud om leksehjelp til
  alle. Slik tar vi viktige skritt mot verdens beste skole. Klima er v\u00e5r tids
  viktigste sak. L\u00f8sningen p\u00e5 klimaproblemet er summen av alt vi gj\u00f8r.
  Derfor betyr det noe hva som gj\u00f8res i den enkelte kommune. Arbeiderpartiet
  vil at alle kommuner skal lage sin lokale klimahandlingsplan for \u00e5 gi sitt
  bidrag til klimal\u00f8sningen. Vi m\u00e5 f\u00e5 flere til \u00e5 la bilen st\u00e5
  og isteden ta buss, tog eller bane. Vi m\u00e5 bygge hus som bruker mindre energi.
  Kommunen m\u00e5 gj\u00f8re det enkelt \u00e5 leve milj\u00f8vennlig. Det vil Arbeiderpartiet
  s\u00f8rge for der vi f\u00e5r makten. Arbeid er alltid v\u00e5r jobb nummer en.
  Vi vet at for mange, spesielt kvinner, jobber ufrivillig i deltidsstillinger selv
  om de \u00f8nsker seg heltidsjobb. Samtidig mangler vi hender til \u00e5 fylle viktige
  oppgaver i omsorgsektoren. N\u00e5 ber vi kommunene ta ansvar for \u00e5 gj\u00f8re
  flere deltidsstillinger om til heltid. Ingen vinner valg p\u00e5 takknemlighet.
  Vi vinner aldri p\u00e5 det vi har gjort, men p\u00e5 det vi skal gj\u00f8re. Samtidig
  gir det troverdighet til v\u00e5re valgl\u00f8fter at vi viser at vi holder det
  vi lover. Etter to \u00e5r i regjering kan Arbeiderpartiet vise at vi har gjort
  det vi sa vi skulle gj\u00f8re. Vi bruker de store pengene p\u00e5 de store oppgavene.
  Vi er foran skjema i forhold til \u00e5 f\u00e5 flere ansatte i eldreomsorgen. Vi
  er n\u00e6r m\u00e5let om full barnehage dekning. Vi s\u00f8rger for flere l\u00e6rere
  i skolen og mer penger til kommunene. Arbeiderpartiet holder det vi lovet. Nasjonalt
  og lokalt. Forside- og illustrasjonsfoto: Arbeiderpartiet/Tone Br\u00e5ten Utgiver:
  Arbeiderpartiet Ansvarlig redakt\u00f8r: Sindre Fossum Beyer Utg.ansv.: Ingrid Sagranden
  Adresse: Sammen, Arbeiderpartiet, pb Youngstorget E-post redaksjonen: / (2 nr. 2
  august 2007\\n3 Alle skal med N\u00e5 st\u00e5r vi igjen foran en viktig valgkamp
  og et viktig kommuneog fylkestingsvalg den 10. september. V\u00e5rt m\u00e5l er
  \u00e5 bidra til trygge lokalsamfunn der alle trengs og hvor alle f\u00f8ler seg
  velkomne. Selv om Norge er et godt land \u00e5 bo i, s\u00e5 er det noen som st\u00e5r
  utenfor fellesskapene. Mange barn l\u00e6rer ikke nok i skolen. Flere tusen eldre
  f\u00e5r ikke den omsorgen de fortjener. Vi vet at for mange opplever ensomhet og
  isolasjon. Dette er det v\u00e5r oppgave \u00e5 gj\u00f8re noe med. Arbeiderpartiet
  vil ha et samfunn som tar vare p\u00e5 alle, der alle er med. Et samfunn hvor vi
  l\u00f8ser de viktigste oppgavene sammen, og i fellesskap. Vi vil gj\u00f8re fellesl\u00f8sningene
  bedre, fremfor \u00e5 privatisere og sette omsorg p\u00e5 anbud. Vi vil satse p\u00e5
  samarbeid fremfor konkurranse. Vi vil bygge ut velferden fremfor \u00e5 gi skattelettelse.
  For Arbeiderpartiet er det dette valget i h\u00f8st handler om. Et sterkt lokalt
  folkestyre er avgj\u00f8rende for at vi fortsatt skal kunne bygge og utvikle velferdssamfunnet
  v\u00e5rt. Foto: ANB I 2005 sa velgerne klart fra at de \u00f8nsket en annen utvikling
  av samfunnet enn den Bondevikregjeringen sto for. Pengemakten hadde f\u00e5tt lov
  til \u00e5 styre for mye n\u00e5 \u00f8nsket velgerne en satsing p\u00e5 mer fellesskap
  og mindre forskjeller. Velgerne \u00f8nsket at velferdstjenestene skulle bygges
  ut, ikke bygges ned. Siden den gang har den r\u00f8dgr\u00f8nne regjeringen fulgt
  opp l\u00f8ftene fra valgkampen. En av de mest synlige endringene har v\u00e6rt
  at kommunene har f\u00e5tt om lag 14,5 milliarder i \u00f8kte inntekter siden Det
  er 14,5 milliarder kroner til bedre skole, flere ansatte i eldreomsorgen, mer rettferdighet.
  For \u00e5 fortsette dette arbeidet trenger vi kommunestyrer som \u00f8nsker den
  samme utviklingen. Som vil bygge ut framfor \u00e5 bygge ned. Lokale politikere
  som vil arbeide for gode trygge arbeidsplasser, en god skole for alle barn, og for
  en trygg og verdig alderdom for v\u00e5re eldre. Derfor har vi sagt at Fremskrittspartiet
  er v\u00e5r hovedmotstander i denne valgkampen, fordi de som et klart h\u00f8yreparti
  st\u00e5r for helt andre politiske l\u00f8sninger enn vi \u00f8nsker oss. \u00c5
  v\u00e6re kandidat for Arbeiderpartiet er \u00e5 v\u00e6re folkets ombud. V\u00e5re
  kandidater skal v\u00e6re en drivkraft for \u00e5 utvikle samfunnet til et enda
  bedre samfunn. Vi skal love \u00e5 ha mot og evne til \u00e5 utfordre systemene
  n\u00e5r de ikke fungerer for enkeltmennesket. Valget kan avgj\u00f8res gjennom
  hvor mange som velger \u00e5 g\u00e5 til valglokalet og stemme. For oss blir det
  viktig i valgkampen \u00e5 mobilisere de som er enige med oss til \u00e5 g\u00e5
  til valglokalet. Det er store og viktige ting valget handler om, og hver enkelt
  sin stemme teller. Godt valg! Martin Kolberg nr. 2 august )\\n4 P\u00e5 vei mot
  Soria-Moria Vi styrker fellesskapsl\u00f8sningene, og g\u00e5r i mot privatiseringen
