  gode oppvekstvilk\u00e5r. Jeg er sikker p\u00e5 at en bedre likestilling mellom
  kj\u00f8nnene, b\u00e5de i hjemmet og i arbeidslivet, vil v\u00e6re med p\u00e5
  \u00e5 gi hele familien \u00f8kt livskvalitet. Barna f\u00e5r mer tid med begge
  sine foreldre, mange kvinner f\u00e5r mulighet til \u00e5 \u00f8ke sin inntekt og
  utfordre seg selv mer enn de kan i dag, og kanskje f\u00e5r mange fedre muligheten
  til \u00e5 prioritere familie mer. Alle vinner p\u00e5 dette! S\u00e5 m\u00e5 jeg
  bare si en ting til: Vi m\u00e5 f\u00e5 bukt med den ufrivillige deltiden mange
  kvinner er utsatt for folk m\u00e5 ha en l\u00f8nn \u00e5 leve av! Vi vet ogs\u00e5
