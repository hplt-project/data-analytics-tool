  2007, det h\u00f8yeste opptaket siden 1998, med rekordmange s\u00f8kere. Forbygge
  bedre Storberget \u00f8nsker seg \u00f8kt samordning for \u00e5 forbygge kriminalitet.
  Her har vi et stort uutnyttet potensial for \u00e5 engasjere flere lokalpolitikere
  og etablere tettere lokalt samarbeid mellom kommunene og politiet i lokale politir\u00e5d.
  De er gjerne de som ser problemene f\u00f8rst og sitter p\u00e5 mange av virkemidlene
  som hjelper for \u00e5 gj\u00f8re noe. N\u00e6rpolitiet og lokalpolitikerne kjenner
  mennesker og lokalmilj\u00f8 best, og kan i samarbeid l\u00f8se konflikter tidlig
  og forbygge kriminalitet og utrygghet, sier statsr\u00e5den. Et politir\u00e5d forankres
  hos ordf\u00f8reren og hos lensmann eller politimester som gj\u00f8r samarbeidet
  mer forpliktende og at beslutningene der faktisk blir fulgt opp. Vi vet at mye av
  kriminaliteten lokalt, b\u00e5de n\u00e5r det gjelder vold og vinningskriminalitet,
  b\u00e5de hjemme og ute er knyttet til rus. Her b\u00f8r lokalsamfunnet engasjere
  seg mer for trygghet lokalt, blant annet knytta til skjenkepolitikk, sier Storberget.
  Oppdage og oppklare mer Det blir meningsl\u00f8st \u00e5 bare debattere straffens
  lengde all den tid s\u00e5 mange forbrytelser ikke oppklares. Vi vet det er stor
  m\u00f8rketall, s\u00e6rlig knyttet til forbrytelser som rammer kvinner og barn,
  som vold i n\u00e6re relasjoner og voldtekt. Vi m\u00e5 skape et politi som ogs\u00e5
  kan g\u00e5 inn i denne typen saker. Samtidig har vi foresl\u00e5tt \u00f8kt bruk
  av DNA som bevis for \u00e5 gi politiet bedre verkt\u00f8y for \u00e5 oppklare vinningskriminalitet.
  For \u00e5 skape mer trygghet har vi styrket politiet knyttet til utstyr, metoder
  og kompetanse. Siden regjeringen tiltr\u00e5dte er politiet styrket med 257 millioner
  kroner. Storberget vil ogs\u00e5 styrke innsatsen mot \u00f8konomisk kriminalitet,
  som stjeler verdier fra felleskassa. I tillegg skal innsatsen mot gjengkriminalitet
  videref\u00f8res. Vi m\u00e5 v\u00e6re tydelige p\u00e5 at kriminalitet ikke skal
  l\u00f8nne seg. Hovedpuls\u00e5ren for organisert kriminalitet er profitt, og det
  er en sentral m\u00e5lsetning \u00e5 g\u00e5 etter pengene. Boliger, kj\u00f8ret\u00f8y
  og luksusartikler det ikke kan gj\u00f8res rede for skal inndras. Trygghetsminister:
  Knut Storberget mener vi st\u00e5r overfor store utfordringer for \u00e5 forebygge
  kriminalitet, og \u00e5 sette politiet i stand til \u00e5 oppdage og oppklare flere
  saker. Samtidig m\u00e5 vi rehabilitere bedre i norske fengsler. Rehabilitere bedre
  Hovedutfordringene innenfor kriminalomsorgen er \u00e5 avvikle soningsk\u00f8en
