  innhold i soningen med utdanningstilbud i alle fengsler, soning med elektronisk
  fotlenke, mer bruk av samfunnsstraff, promilleprogram, og soning i institusjon bedrer
  innholdet i soningen. 5. Bedre redningshelikopterberedskap med tilstedevakt p\u00e5
  basene i Bod\u00f8 og Banak, ny base i Flor\u00f8 operert av forsvaret nr. 2 august
