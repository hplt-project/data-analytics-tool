  "\"PERSONAL na namahagi si Pangulong Ferdinand R. Maros, Jr. ng nasa P50-M halaga
  ng tulong para sa emergency employment ng libu-libong pamilyang apektado ng pag-alboroto
  ng Bulkang Mayon.\\nInabot mismo ni Pangulong Marcos ang mga cheke sa mga alkalde
  ng Daraga, Camalig, Guinobatan, Malilipot, Ligao City at Tabaco City na gagamitin
  para sa 5,016 na pamilya sa mga evacuation center.\\nAyon kay Department of Labor
  and Employment Bicol Region Director Ma. Zenaida Campita, bibigyan ang mga evacuees
  ng trabaho sa ilalim ng Tulong Panghanapbuhay sa Ating Disadvantaged/Displaced Workers
  (TUPAD) program.\\nAng TUPAD program ay magbibigay ng 365 pisong sahod kada manggagawa
  bawat araw sa loob ng isang buwan.\\nNagbigay din ng direktiba si Pangulong Marcos
  sa mga concerned agencies na magbigay ng kabuhayan sa mga pamilya at intervention
  programs para naman sa mga kabataan habang nasa loob ang mga ito ng mga evacuation
  site.\"", "\"Chapter 11\\nNasa taxi na kami papunta sa bahay nila. Ako yung nasa
  likod ng driver at nasa tabi ko sya. Papunta pa lang ay humahawak na sya sa bukol
  sa may pantalon ko. Susulitin ko sya ngayong gabi. Tinanong ko kung anong oras nagigising
  parents nya, mga 7 naman daw. Ganun din sila magising samin kaya dapat by 6:30 ay
  nakauwi na ako. Mukhang walang tulugan ulit na gabi ''to.\\nNapakatahimik sa kanila,
  binilisan kong dumerecho sa kwarto nya at nagtago sa loob. Labas pasok sa kwarto
  si Laarni. Narinig kong nagsisipilyo sya sa kusina nang marinig ko tatay nya.\\n\\\"Oh,
  pa. Gising pa kayo.\\\" sabi ni Lala.\\n\\\"CR lang ako. Nakasakay na best friend
  mo?\\\" tanong ng boses ng matandang lalake.\\n\\\"Ah, oo, pa. 3 na yung earliest
  trip na nakuha nya. Sige pa, good night\\\" paalam nya.\\nPagpasok ng kwarto ay
  binilisan nyang linock. Nakatago ako sa likod ng pinto at nakinig, inantay kong
  magsara ulit ang kwarto ng parents nya.\\nPagkasara ay sinunggaban ko sya. Derecho
  ang kaliwa kong lumamas sa suso nya. Nararamdaman kong nagtatanggal sya ng belt,
  yung parang pang goth chick na may mga bakal na patusok, pero kulay pula. Ramdam
  ko ng nasa floor pantalon nya. Grabeng excited na ako sa mangyayari. Di namin pinatay
  ang ilaw kaya lalo akong nalilibugan ngayong klaro kong nakikita kutis nya at tinutulungan
  ko syang maghubad. Inalalayan ko ngayon ang pagtanggal ng tshirt nya at nakita kong
  tumambad sakin mga suso nya. Parang ang sikip ng bra nya, mukhang ipit na ipit ang
  mga dyoga nya at kailangang mapakawalan. Habang tinitignan ko ay may naisip na naman
  ako. Masarap atang ipagitna ang titi ko sa dalawang bundok na ''to ah. Shet gusto
  ko itry!\\nNapaupo sya sa kama at tinatanggal nya sintas ng pink na chuck taylor
  nya. Ako ang nagabot at nag unhook ng bra nya sa likod at inalis nya na rin. Binaba
  ko na rin ang cargo pants at brief ko at tumambad sa kanya ang ari ko. Hirap syang
  magtanggal ng sapatos nya habang ako ay binubundol bundol ko ang ari ko sa mukha
  nya. Masarap pag sa pisngi nya tumatama. Pinipigilan pa ng kamay nga pero pilit
  kong ihaplos sa mukha nya ang titi ko.\\n\\\"Napakapilyo mo.\\\" nakangiti nyang
  sinabi.\\nNatanggal na nya ang sapatos at jeans nya, natira na lang ay panty at
  socks. Shet, ang sexy.\\n\\\"Wag mo na tanggalin yang medyas mo.\\\" sabi ko, ewan
  ko pero mas sexy sya pag meron yung socks nya.\\nNatawa naman ako sa suot nyang
  panty. Parang pambata, may floral design pa na parang drawing ng grade 1. Ngayon
  ko lang napansin, agad agad kasing naaalis nung una eh. Humalik sya sakin at muling
  naglaban mga dila namin. Hinawakan ko sya sa mga braso nya at bigla kong tinulak
  papahiga sa kama. Natatawa ako kasi ang gaan gaan nya. Kita kong yumugyog ang malalaki
  nyang suso.\\n\\\"Kulit mo ah...\\\" sabi nya.\\nNgayon ay wala na akong saplot
  at umibabaw ako sa kanya, pero dumerecho akong umupo sa dibdib nya, pinaharap ko
  ulit ang tigas na tigas na titi ko sa mukha nya. Tinaas nya mga kamay nya para nakapatong
  sa dalawa kong hita. Hinawakan nya titi ko at dinidilaan na nya ngayon ang mga itlog
