  Tris. Noong mapasailalim sa eksperimento ay naging Dauntless ito ngunit nang dumaan
  sa test ay nalipat ito sa Abnegation.\\nAndrew Prior \u2013 Ang ama nina Tris at
  Caleb na dating taga-Erudite. Siya\u2019y lumipat sa Abnegation upang magbagong-buhay.
  Siya ay miyembro ng konseho ng lungsod at namumuno sa Abnegation.\\nTori Wu \u2013
  Siya ang nangasiwa sa test na ipinasailalim kay Tris at ang unang nakaalam na siya\u2019y
