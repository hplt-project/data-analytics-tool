sample: '["\"Congratulations!\\nBibo, Aktibo at Talentadong Anak ng Sining!\\nThe
  recognition of her talents is not limited to Best Child Performer and Box Office
  Awards from Showbiz groups kundi galing din sa mga kapita-pitagang paaralang kagaya
  ng Colegio de San Juan de Letran. You make us proud!\\nMARAMING NATUTUWA SA MGA
  KARANGALAN NA NATATANGGAP NI RYZZA! DAHIL SA GANITONG PARAAN NAPAPAKITA RIN NATIN
  NA ANG MGA BATA SA PILIPINAS AY MAY TAGLAY NA TALINO AT ALAM NATIN NA MARAMING BATA
  PA NA IINSPIRE PARA MAG ARAL DIN MABUTI AT MATAGUMPAYAN ANG KANILANG MGA PANGARAP
  SA BUHAY. SALAMAT SA LAHAT NG BUMUBUO NG EAT BULAGA SA PAG TULONG DIN NA MABIGYAN
  NG EDUKASYON ANG IBANG KABATAAN NANG SA GAYON MAGING SUSI DIN NILA PARA SA MAGANDANG
  KINABUKASAN. MAGBAYANIHAN TAYO SA MAS IKAUUNLAD PA NG BAYAN. KAYA NATIN ITO. THANK
  YOU AND GOD BLESS YOU MORE. SA LAHAT NG BUMUBUO NG EAT BULAGA MARAMING SALAMAT PO!
  MR. ALFRED SANA PO MAIPARATING NYO PO SA KANILA ANG MESSAGE NA ITO. THANK YOU PO.\\nReplyDeleteTHERE
  IS SOMETHING I WANT TO SAY ANG GALING GALING NG MANAGEMENT AND MARKETING NG EAT
  BULAGA THEY CAN KEEP THE HIGH RATINGS OF THE SHOW AND MAKE IT ALWAYS NUMBER 1 BASTA
  MAGALING KAYONG LAHAT FROM THE RYZZA MAE SHOW AT EAT BULAGA SHOW AT IBA NYO PANG
  SHOW. FOREVER. GOD BLESS AND THANK YOU PO.\\nReplyDelete\"", "\"Pursigido sina Philippine
  No.1 Miguel Tabuena at one-time Philippine Open champion Angelo Que na makasikwat
  ng karagdagang puntos upang makasama sa Rio Olympics.\\nKapwa sasabak ang dalawang
  pamosong Pinoy golfer sa Panasonic Open Golf Championship simula sa Huwebes, sa
  Chiba Country Club Umesato Course sa Japan.\\nAng torneo ay co-sanctioned ng Japan
  Tour at Asian Tour kung kaya\u2019t may nakalaang world ranking point para sa Olympic
  qualifier.\\n\u201cMy game is good. It is almost dangerous because I\u2019m hitting
  the ball so well and I can target any pin but it can backfire on you because there
  are times when you need to play it safe. You can\u2019t be aggressive all the time,\u201d
  pahayag ni Tabuena sa panayam ng asiantour.com.\\n\u201cI\u2019ve played well in
  the big events this year and once you do well in those events, it feels that you
  can play anywhere. I\u2019m really confident with my game and hopefully it shows
  up this week,\u201d aniya.\\nKasalukuyang nasa ika-37 si Tabuena sa Olympic ranking,
  habang nasa ika-49 si Que.\\nMay kabuuang \u00a5150,000,000 (P12.6 milyon) ang premyo
  sa torneo.\\nSisimulan ni Tabuena ang ratsada kasama sa flight nina Scott Strange
  at Hideto Tanihara. Makakasama naman ni Que, three-time Asian Tour winner, sa flight
  sina Jason Knutzon at Akio Sadakata.\\nSasabak din si dating Asian Tour No. 1 Juvic
  Pagunsan sa flight nina Junaidi Ibrahim at Daisuke Kataoka.\\nPumuwesto sa ika-13
  sa Asian Development Tour\u2019s Manila Southwoods leg, target din ni Tabuena na
  maagaw ang Asian Tour Order of Merit kay Marcus Fraser ng Australia. Lamang lamang
  ang Aussie star ng US$200,000.\"", "\"Ano nga ba ang batayan upang malaman natin
  ang kakayahan ng isang pinuno ng isang bansa? Tama nga bang tingnan natin kung gaano
  ka-powerful sya magsalita? Batayan ba na dapat maging friendly ka? Batayan ba na
  may asawa ka? Batayan ba kung anong kasarian ka \u2013 Babae o Lalaki? Well, para
  sa akin ang epektibong\u2026 [Read more\u2026]\\nNgayon, bukas o sa mga darating
  pa na araw matutupad pa nga ba? Feeling ko yan ang pinakamahirap na tanong na dapat
  kahit ang sarili mo eh mahanap ito. O baka naman nakadepende ka sa mga nakapaligid
  sa iyo?! Well, sa panahon ngayon ay hindi dapat dahil kahit ang ating mahal na Pangulong
  Noynoy Aquino\u2026 [Read more\u2026]\\nAugust 1, 2012\\n1\"", "\"Muling ibinasura
  ng Sandiganbayan ang mosyon ni dating Senador Jose \u201cJinggoy\u201d Estrada na
  humihiling na ibasura ang kinakaharap niyang kasong graft kaugnay ng pagkakasangkot
  umano niya sa Priority Development Assistance Fund (PDAF) scam.\\nNilinaw ng 5th
  Division ng anti-graft court na hiwalay ang nasabing kaso sa plunder na kinakaharap
  ng dating senador sa magkaparehong irregularidad.\\nIginiit ng korte sa ruling nito
  na walang sapat na merito ang mosyon ni Estrada.\\nSinabi ni Estrada sa kanyang
  apela na dapat nang ibasura ng hukuman ang 11 graft na isinampa sa kanya dahil naisama
  na umano sa plunder case na kinakaharap niya.\\nNakapiit si Estrada sa Philippine
  National Police (PNP) Custodial Center sa Camp Crame matapos kasuhan ng plunder
  at graft sa Sandiganbayan noong Hunyo 2014, dahil sa pagtanggap umano ng P183.793
  milyon halaga ng kickback kapalit ng alokasyon ng kanyang PDAF sa mga pekeng non-government
  organization (NGO) ng negosyanteng si Janet Lim-Napoles noong 2004 hanggang 2012.
  (Rommel P. Tabbad)\"", "\"Spider Man Homecoming kung paano upang matukoy ang pagkakaroon
