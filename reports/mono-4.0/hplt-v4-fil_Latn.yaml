  at Insurgent.\\nDavid \u2013 Siya ang pangunahing antagonista naman sa Allegiant
  at ang leader ng Bureau of Genetic Welfare.\\nd. Mga Reaksyon: a. Mga Nagsiganap:\\nShailene
