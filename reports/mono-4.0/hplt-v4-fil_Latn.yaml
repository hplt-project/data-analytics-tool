  impormasyon, maaaring makipag-ugnayan kay PSI Carmelo S. Alino o tumawag sa mga
  numerong +63908-302-5166.\"", "\"Katanungan\\nAno po ba ang kahulugan ng Epiko?\\nSagot\\nIsang
  uri ng akdang pampanitikan ang epiko. Ang epiko ay naglalaman ng mga mahahabang
  tulay na pasalaysay kung saan ang naratibo ay ukol sa pagiging bayani ng isang pangunahing
  tauhan.\\nMaaari itong magkaroon ng elementong pang-teatriko, pelikula, at maging
  musika. Kadalasan rin ay hango ang isang epiko sa mga kwnetong kabayanihan na nangyari
  sa kasaysayan ng isang lipunan o pamayanan.\\nAng naratibo sa isang epiko ay laging
  pakikidigma o hindi naman kaya ay ang mapagtagumpayan ang isang pagsubok.\\nIsa
  sa mga pinakasikat na epiko sa ating bansang Pilipinas ay ang epikong pinamagatang
  Biag ni Lam Ang mula sa rehiyon ng Ilokos.\\nKahalagahan ng Epiko\\nMahalaga ang
  pagbabasa, pag-intindi, at pag-aaral ng epiko dahil ito ay bahagi ng ating kultura
  at kasaysayan.\\nAng mga epiko ay kwento ng mga bayaning nagpapakita ng katapangan
  at kahusayan sa pakikipaglaban para sa kanilang komunidad. Sa pamamagitan nito,
  natutunan natin ang mga aral at halaga na mahalaga sa ating buhay.\\nNaiintindihan
  din natin ang mga pamumuhay ng ating mga ninuno at ang kanilang paniniwala. Ang
  mga epiko ay nagbibigay-daan para sa atin na maging malikhain, na kung saan natututo
  tayong mag-isip nang malalim at maunawaan ang iba\u2019t ibang aspeto ng buhay.\\nBukod
  dito, ang pag-aaral ng mga epiko ay nagpapalalim sa ating kaalaman sa literatura
  at nagbibigay inspirasyon sa atin na maging mas mabuting tao.\\nSa panghuli, ito
  ay nagdadala ng pagka-isa at pagka-kakilanlan sa ating komunidad, na nagbibigay
  daan para sa mas mataas na pag-unawa at pagpapahalaga sa ating kultura at tradisyon.\"",
