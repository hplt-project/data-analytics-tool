  ng Sweden na si King Carl XVI Gustaf at emperor ng Japan na si Emperor Akihito ay
  dumalo sa isang espesyal na exhibit tungkol sa Swedish Natural Science sa Tokyo
  nuong lunes, upang markahan ang ika-150 taon na pagkaka-roon ng diplomasya bg 2
  bansa.\\nAng hari at reyna Silvia ay sinamahan sina Emperor Akihito at Empress Michiko
  sa exhibition na nagpapa-kilala sa 3 scientists nuong 18th century na nag-bigay
  impluwensiya sa bansang Japan at si Carl Linnaeus, isang scuentist na nag-sagawa
  ng batayan ng isang sistimatikong pang-agham na pag-uuri.\\nSi Emperor Akihito ay
  isang marine biologist na nag-specialize sa mga gobies, ay ginawaran ng honorary
  degree nuong 2007, para sa kanyang pananaliksik mula sa unibersidad kubg saan nag-aral
  si Linneus.\\nAyon sa NHK Television ng Japan, si Emperor Akihito ay masyadong natutok
  sa orihinal na libro na nilikha ni Linneus kung kaya\u2019t sila ay nanatili sa
  exhibition nang mas matagal kaysa sa itinalagang oras. Ipinakita sa telebisyon na
  kuha ng isang istasyon si Emperor Akihito na seryosong naka-tingin sa libro mula
  sa isang glass showcase, habang nakatayo sa kanyang tabi ang naka ngiting si Empress
  Michiko.\\nAng Swedish royals ay dumalo rin sa isang pag-sasalo na pinamunuan ni
  Emperor Akihito. Kumain rin sila ng tanghalian kasama ang panganay na anak ng Emperor
  na si Crown Prince Naruhito.\\nAng hari at reyna ay makikipag-kita rin kay Japanese
  Prime Minister Shinzo Abe, may ilang events at isang business seminar na dadaluhan
  ang mga pangunahing bisita bago umalis ng Tokyo sa darating na huwebes.\\nNaka-takdang
  bumaba ng pamumuno si Emperor Akihito sa katapusan ng Abril taong 2019, ito ay matapos
  ang 30 taon ng pamumuno sa bansa. Ang panganay na anak na si Prinsipe Naruhito ang
  hinirang na susunod na uupo sa Chrysanthemum Throne at mamuno sa bansang Japan matapos
  bumaba ng pwesto ang kanyang ama.\\nSource and Image: Japan Today\\nJoin the Conversation\"",
  "\"Pagsusuri ng Isang Pelikula Divergent Series Ayon sa Pagkakasuri Nina Gabrielle
  Cabana, Angelica de Guzman, at Cameron D\\nPagsusuri ng Isang Pelikula Divergent
  Series Ayon sa Pagkakasuri Nina Gabrielle Cabana, Angelica de Guzman, at Cameron
  Dela Cruz Mag-aaral ng SEHS, SPA Grade 8 I.\\nPagpapakilala Si Neil Burger ay isang
  direktor at tagagawa ng pelikula. Nagtapos siya sa\\nUnibersidad ng Yale at nagpakasal
  kay Diana Kellogg noong ika-30 ng Hunyo 1997. Kilala siya sa pagdidirehe ng mga
  pelikula tulad ng The Illusionist (2006), Limitless (2011) at Divergent (2014).
  Si Robert Schwentke ay ipinanganak noong 1968 sa Stuttgart, Germany. Isa siyang
  direktor at manunulat na tanyag sa pagdidirihe ng kilalang pelikula tulad ng RED
  (2010), The Time Traveler\u2019s Wife (2009), Insurgent (2015) at Allegiant (2016).
  II.\\nBuod ng pelikula Umikot ang kuwento sa pakikipagsapalaran nina Tris at Four
  upang ilihim na sila\u2019y mga\\nDivergent na nangangahulugang kakaiba o hindi
  nababagay. Hindi tanggap sa lipunan ang mga Divergent kaya naman sa oras na malamang
  isa ka sa kanila ay itatakwil ka ng pamahalaan. Isa pa na naging sentro ng kuwento
  ay ang pag-iibigan ng dalawang bida sa gitna ng mga suliranin. Naging isa sa mga
  misyon ng dalawa ay ang mapagtagumpayang makalaya ang bawat tao sa Chicago na ginawang
  isang eksperimentong siyudad kung magiging epektibo ba ang pagkakahati-hati nito
  base sa kakayahan ng tao. Noong malamang Divergent ang dalawa ay agad silang tumakas
  sa mga taong humahabol sa kanila\\nngunit sa huli ay nakuha din ito ng mga tauhan
  ni Janine, ang pinuno ng Erudite. Si Tris ay sumailalim sa isang pagsusulit upang
  mabuksan ang isang kahon na tanging purong Divergent lang ang makakabukas. Akala
  nila\u2019y mawawala na si Tris ngunit laking gulat nila nang nabuhay ito at pinagpatuloy
  ang test. Ipinakulong si Janine sa kanyang ginawa at nabuksan ang kahon, nagdiwang
  ang sambayanan nang malaman na ang laman ng kahon ay ang mga Divergent na solusyon.
  Matapos nito, lumabas ang dalawa sa mga matatayog na pader sa Chicago. Nakilala
  nila si David at pinagkatiwalaan nila ito sa pag-asang ito ang magiging solusyon
  upang matanggal ang mga factions at maging isa ang sambayanan. Ngunit nagkamali
  sila dahil ito pala ang namumuno ng eksperimento at ang kasinungalingan nitong sumama
  ang nanay ni Tris sa kanya upang maging maayos ang buhay pero ang tanging ginawa
  nito ay ipadukot ang mga bata mula sa French upang mapunta sa Chicago. III.\\nPagsusuri
  a. Uri ng Panitikan: Pelikula \u2013 Science Fiction b. Pamagat: Divergent, ito
  ang naging pamagat dahil nangangahulugan itong kakaiba o hindi nababagay. Isa ang
  divergent na tinuturing na kakaiba dahil sa higit sa isa nitong kakayahan sa buhay
  at ang hindi pagtanggap ng lipunan dito. Insurgent, ito ang naging pamagat ng ikalawang
  pelikula dahil nangangahulugan ang salitang ito ng rebolusyon o rebelyon. Ibig pakahulugan
  na isa sa mga misyon ng dalawa na baguhin ang pamahalaan sa pamamagitan ng pagsali
  sa mga rebelyon na pinamunuan ng ina ni Four, ito ang grupo ng mga\\nfactionless.
  Naging konektado din ang twist sa dulo na ang mga Divergent ang solusyon ng pamahalaan.
  Allegiant, ito ang naging pamagat ng ikatlong pelikula dahil naging tapat ang paglilingkod
  ni Tris kay David ngunit sa huli ay napagtanto niyang hindi pala ito naging tapat
  sa kanya. c. Mga Tauhan:\\nBeatrice \u201cTris\u201d Prior \u2013 Siya ay isang
  matapang na babae na hinarap ang lahat ng suliranin nang malaman na siya\u2019y
  isang Divergent. Siya rin ay ipinanganak sa Abnegation, isang faction na tumutulong
