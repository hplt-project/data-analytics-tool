  20, 1-16a\\nSubscribe to Awit at Papuri Communications YouTube Channel\\nMemorial
  of St. Pius X, Pope (White)\\nMga Pagbasa mula sa\\nMiyerkules ng Ika-20 Linggo
  sa Karaniwang Panahon (II)\\nUNANG PAGBASA\\nEzekiel 34, 1-11\\nPagbasa mula sa
  aklat ni propeta Ezekiel\\nSinabi sa akin ng Panginoon: \u201cTao, magpahayag ka
  laban sa mga pinuno ng Israel. Sabihin mong ipinasasabi ko: Nakatakda na ang parusa
  sa inyo, mga pinuno ng Israel. Sarili ninyo ang inyong iniintindi at hindi ang mga
  tupa. Iniinom ninyo ang gatas, nagdaramit kayo ng lana, nagpapatay ng mga pinatabang
  hayop, ngunit hindi ninyo pinakakain ang mga tupa. Bakit hindi ninyo pinalalakas
  ang mahihina, ni ginagamot ang mga maysakit, ni hinihilot ang mga pilay? Bakit hindi
  ninyo hinahanap ang nawawala, ni ibinabalik ang nalalayo? Sa halip ay ginagamitan
  ninyo sila ng kamay na bakal. Sila\u2019y nangangalat, at nilalapa ng mababangis
  na hayop pagkat walang pastol. Ang mga tupa ko\u2019y nagkalat sa mga bundok, burol
  at sa lahat ng panig ng daigdig, ngunit walang ibig humanap sa kanila.\\n\u201cDahil
  dito, mga pinuno, dinggin ninyo ang aking sinasabi: Ako ang Diyos na buhay. Ang
  mga tupa ko\u2019y pinipinsala at nilalapa ng mababangis na hayop pagkat walang
  nangangalaga. Hindi hinahanap ng mga pastol ang aking mga tupa. Sa halip na alagaan
  nila ang mga ito, ang sarili nila ang binubusog. Kaya nga makinig kayo, mga pastol.
  Pakinggan ninyo itong aking sinasabi: Laban ako sa inyo. Pananagutan ninyo ang nangyayari
  sa aking mga tupa. Hindi ko na kayo gagawing pastol upang hindi na ninyo mabusog
  ang inyong sarili. Ilalayo ko sa inyo ang aking mga tupa at hindi na ninyo mapakikinabangan
  ang mga ito.\u201d\\nIto ang ipinasasabi ng Panginoon: \u201cAko mismo ang maghahanap
  at mag-aalaga sa aking mga tupa.\u201d\\nAng Salita ng Diyos.\\nSALMONG TUGUNAN\\nSalmo
  22, 1-3a. 3b-4. 5. 6\\nPastol ko\u2019y Panginoong D\u2019yos,\\nhindi ako magdarahop.\\nPanginoo\u2019y
  aking Pastol, hindi ako magkukulang.\\nAko\u2019y pinahihimlay sa mainam na pastulan,\\nat
  inaakay niya ako sa tahimik na batisan,\\nbinibigyan niya ako niyong bagong kalakasan.\\nPastol
  ko\u2019y Panginoong D\u2019yos,\\nhindi ako magdarahop.\\nAt sang-ayon sa pangako
  na kaniyang binitiwan\\nsa matuwid na landasi\u2019y doon ako inaakay.\\nKahit na
  ang daang iyo\u2019y tumatahak sa karimlan,\\nhindi ako matatakot pagkat ika\u2019y
  kaagapay;\\nang tungkod mo at pamalo ang gabay ko at sanggalang.\\nPastol ko\u2019y
  Panginoong D\u2019yos,\\nhindi ako magdarahop.\\nSa harapan ng lingkod mo, ikaw
  ay may handang dulang,\\nito\u2019y iyong ginagawang nakikita ng kaaway;\\nnalulugod
  ka sa akin na ulo ko ay langisan\\nat pati na ang kalis ko ay iyong pinaaapaw.\\nPastol
  ko\u2019y Panginoong D\u2019yos,\\nhindi ako magdarahop.\\nTunay na ang pag-ibig
  mo at ang iyong kabutihan,\\nsasaaki\u2019t tataglayin habang ako\u2019y nabubuhay;\\ndoon
  ako sa templo mo lalagi at mananahan.\\nPastol ko\u2019y Panginoong D\u2019yos,\\nhindi
  ako magdarahop.\\nALELUYA\\nHebreo 4, 12\\nAleluya! Aleluya!\\nBuhay ang Salita
  ng Diyos\\nGanap nitong natatalos\\nTanang ating niloloob.\\nAleluya! Aleluya!\\nMABUTING
  BALITA\\nMateo 20, 1-16a\\nAng Mabuting Balita ng Panginoon ayon kay San Mateo\\nNoong
  panahong iyon, sinabi ni Hesus sa kanyang mga alagad ang talinghagang ito: \u201cAng
  paghahari ng Diyos ay katulad nito: lumabas nang umagang-umaga ang may-ari ng ubasan
  upang humanap ng mga manggagawa. Nang magkasundo na sila sa upa na isang denaryo
  maghapon, sila\u2019y pinapunta niya sa kanyang ubasan. Lumabas siyang muli nang
  mag-iikasiyam ng umaga at nakakita siya ng iba pang tatayu-tayo lamang sa liwasang-bayan.
  Sinabi niya sa kanila, \u2018Pumaroon din kayo at magtrabaho sa aking ubasan, at
  bibigyan ko kayo ng karampatang upa.\u2019 At pumaroon nga sila. Lumabas na naman
  siya nang mag-iikalabindalawa ng tanghali at nang mag-iikatlo ng hapon, at gayun
  din ang ginawa niya. Nang mag-iikalima ng hapon, siya\u2019y lumabas uli at nakakita
  pa ng mga ibang wala ring ginagawa. Sinabi niya sa kanila, \u2018Bakit kayo tatayu-tayo
  lang dito sa buong maghapon?\u2019 \u201cWala pong magbigay sa amin ng trabaho,
  e!\u2019 sagot nila. At sinabi niya, \u2018Kung gayun, pumaroon kayo at gumawa sa
  aking ubasan.\u2019\\n\u201cPagtatakip-silim, sinabi ng may-ari ng ubasan sa kanyang
  katiwala, \u2018Tawagin mo na ang mga manggagawa at sila\u2019y upahan, magmula
  sa huli hanggang sa buong nagtrabaho.\u2019 Ang mga nagsimula nang mag-iikalima
  ng hapon ay tumanggap ng tig-iisang denaryo. At nang lumapit ang mga nauna, inakala
  nilang tatanggap sila nang higit doon; ngunit ang bawat isa\u2019y tumanggap din
  ng isang denaryo. Pagkatanggap nito, nagreklamo sila sa may-ari ng ubasan. Sabi
  nila, \u2018Isang oras lang pong gumawa ang mga huling dumating, samantalang maghapon
  kaming nagpagal at nagtiis ng nakapapasong init ng araw. Bakit naman po ninyo pinagpare-pareho
  ang upa sa amin?\u2019 At sinabi niya sa isa sa kanila, \u2018Kaibigan, hindi kita
  dinadaya. Hindi ba\u2019t nagkasundo tayo sa isang denaryo? Kunin mo ang ganang
  iyo, at umalis ka na. Maano kung ibig kong upahan ang nahuli nang tulad ng upa ko
  sa iyo? Wala ba akong karapatang gawin ang aking maibigan sa ari-arian ko? O naiinggit
  ka lang sa aking kabutihang-loob?\u2019 Kaya\u2019t ang nahuhuli ay mauuna, at ang
  nauuna ay mahuhuli.\u201d\\nAng Mabuting Balita ng Panginoon.\\nPages: 1 2\\n{ 5
  comments\u2026 read them below or add one }\\nThe workers in the Lord\u2019s vineyard\\nThe
  kingdom of heaven is said to be like a householder who hired workmen to cultivate
  his vineyard. Who better can we take to be the householder than our Creator, who
  rules over those he created, and governs his elect in the world in the same way
  as a master does those subject to him in his house? He has a vineyard, that is to
  say the universal Church, which has brought forth many saints as so many branches,
  from righteous Abel up to the last of the elect who will be born at the end of the
  world.\\nThe householder hired workmen to cultivate his vineyard, in the morning,
  and at the third, sixth, ninth and eleventh hours, since preachers do not cease
  to preach for the instruction of the faithful from the beginning of this world up
  to its end. The morning indeed was from Adam to the time of Noah, the third hour
  from the time of Noah to the time of Abraham, the sixth from the time of Abraham
  to the time of Moses, the ninth from the time of Moses to the coming of the Lord;
  and the eleventh is from the coming of the Lord to the end of the world. In this
  period the holy apostles, who received a full reward even though they came late,
  have been sent as preachers.\\nAt no time, then, did the Lord cease sending his
  people workmen to instruct them, to cultivate his vineyard, as it were? When he
  first cultivated his people through the patriarchs, and later through the teachers
  of the law, and then through the prophets, and at last through the apostles, he
  labored at the cultivation of his vineyard as if by his workmen. Everyone, though,
  who had the right faith with good works, in whatever capacity or measure, was a
  workman in his vineyard.\\nPAGNINILAY:\\nIsang mapagpalang Miyerkules po sa ating
  lahat! Ang Panginoon ay mapagbigay sa lahat. Ang pagpapasweldo sa ating lahat ay
  ang alay Niya sa atin na buhay na walang hanggan. Ang mga trabahador naman ay tayo.
  May iba sa atin, mula umpisa pa lang ay malapit na sa Diyos. May iba naman sa gitna
  ng kanilang buhay. May iba naman sa bandang hulihan na. Subalit basta\u2019t magsisi,
  at tumalikod sa kasalanan ay maari pa ring maligtas ng Diyos. Ganito ang Kanyang
  awa at habag. Handang maghintay ang Panginoon sa atin kahit habang buhay. Ang aral
  lamang dito, bagamat makukuha pa rin natin ang buhay na walang hanggan kung magsisi
  sa huli, bakit hindi pa ngayon? Bakit hindi pa tayo tumalikod sa mga bagay na dapat
  talikuran ngayon?\\nNang sa gayon, maging masaya tayo na naging mabunga ang ating
  buhay dahil naging makabuluhan ito sa piling ng Diyos. At masasabi nating hindi
  ito naaksaya nang lubusan sa mga makamundong bagay o nasa na madaling mauubos at
  hindi nagtatagal. Nasa atin ang desisyon, habang ngayon na may oras at panahon pa
  tayo. Nawa ay biyayaan tayo ng liwanag at pang-unawa ng Diyos upang magawa natin
  at mabitawan ang anumang hindi na karapat-dapat sa ating buhay. Amen.\\nCredit to
  DCFVanguards\\nAng talinhaga ng Mga Manggagawa sa Ubasan sa Ebanghelyo sa araw na
  ito ay isang reflection ng iba\u2019t ibang klaseng tao mayroon ang bawat mananampalataya
  na tinawag ng Diyos sa kanya kanyang oras at panahon. Ang ubasan ay ang kaharian
  at ang tumawag sa manggagawa ay ang Diyos. Iyung mga naunang tapat na manggagawa
  ay ang mga tumanggap at tumugon ng maaga upang maglingkod sa Diyos, at yung mga
  huling tinawag ng may-ari ng ubusan sila yung mga huling nakatanggap ng biyayang
  sumunod hanggang sa katapusan ng araw ng paglilingkod sa Diyos.\\nKung isasalin
  ang kwento sa Mabuting Balita ito ay paglalarawan ng isang realidad na pwedeng tawaging
  isyu ng mga naglilingkod sa simbahan. Minsan makikita natin sa mga manang/manong
  sa atin mga parokya ang superiority na kung saan naririnig na matagal na silang
  mga lingkod at natural lamang na may ibang tratamento sa kanila ang kura at dapat
  mas higit ang nakukuha nilang mga konsolasyon at pribelihiyo dahil mayroon na silang
  mga pinatunayan sa larangan ng paglilingkod na komo sila ay laging nandyan para
  makatulong ni father sa mga gawaing pastoral at iba pa. Ang katotohanan nangyayari
  naman talaga ito sapagkat silang mga naunang tumanggap ng biyayang maglingkod sila
  ito ang laging pinagkakatiwalaan siguro dahil na din sa kanilang mga magagandang
  track record.\\nItinuturo sa Ebanghelyo na ang pamantayan ng tao ay malayo at magkaiba
  sa pamantayan ng Diyos sapagkat ang tiningnan dito ay hindi sa kung ano haba ng
  panahon na naglingkod kundi nasa grasya at pagpapala ng Diyos ang mananaig. Nasa
  Kanyang kamay lamang ang mga pagpapasya. Kung kaya nga sinasabi na \u201cMay mauuna
  na mahuhuli sa kaharian\u201d. Ang mahalagang aral na pwedeng panghawakan una, wala
  sa mga kamay natin ang pagpapasya sa bawat gusto natin asamin sa buhay. Makontento
  at maging masaya tayo sa kung ano mayroon at laging ipagpasalamat ito sa Diyos.
  Maiiwasan natin ang pagka-inggit sa kung ano mayroon ang iba kung laging iisipin
  kung sa anong paraan makapaglingkod. Laging tumingin at tanungin ang sarili sa kung
