  hugsana skaltu m\u00e1la \u00fe\u00e1 liti sem \u00fe\u00fa veist a\u00f0 eru til
  sta\u00f0ar. \u00de\u00fa g\u00e6tir veri\u00f0 hissa \u00e1 fegur\u00f0 meistaraverksins
  sem \u00fe\u00fa hannar \u00feegar \u00fe\u00fa tekur gr\u00e1an heim og m\u00e1lar
  hann bjartan.\\n6) Sorg & \u00c1f\u00f6ll\\nEf \u00fe\u00fa gengur n\u00f3gu lengi
  \u00e1 \u00feessari j\u00f6r\u00f0 muntu ver\u00f0a fyrir mj\u00f6g raunverulegu
