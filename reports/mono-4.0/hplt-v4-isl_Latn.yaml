  \u00feess a\u00f0 gera mist\u00f6k. Ef \u00fe\u00fa ger\u00f0ir eitthva\u00f0 heimskulegt,
  seg\u00f0u vi\u00f0 sj\u00e1lfan \u00feig a\u00f0 \u00fe\u00fa hafir l\u00e6rt af
