  Velkomi\u00f0 alla til a\u00f0 heims\u00e6kja verksmi\u00f0juna okkar!\\nLestu meira
  -\\n2024-01-10\\nHorf\u00f0u upp \u00e1 bjartan stj\u00f6rnuhimininn \u00ed herberginu
  stj\u00f6rnuhimininn, finndu v\u00ed\u00f0\u00e1ttuna og \u00f3endanleika alheimsins
  og slaka\u00f0u algj\u00f6rlega \u00e1 huganum. \u00deegar \u00fe\u00fa liggur \u00e1
  mj\u00faku r\u00fami, umkringdur stj\u00f6rnum, eins og \u00fe\u00fa s\u00e9rt \u00ed
  mi\u00f0ju alheimsins, gerir \u00feessi fr\u00e1b\u00e6ra upplifun...\\nLestu meira\"",
  "\"L\u00edft\u00edmi kortasj\u00e1a hefur veri\u00f0 nokku\u00f0 til umr\u00e6\u00f0u
  vegna hra\u00f0ra breytinga \u00ed t\u00e6kni \u00e1 netinu. \u00dea\u00f0 vir\u00f0ist
  vera a\u00f0 f\u00e1ar kortasj\u00e1r s\u00e9u opnar lengur en \u00e1ratug \u00e1n
  umtalsver\u00f0ra uppf\u00e6rslna e\u00f0a breytinga.\\nVi\u00f0 \u00fea\u00f0 a\u00f0
  kortasj\u00e1 er loka\u00f0 \u00e1 netinu hverfa allar uppl\u00fdsingar \u00ed einu
  vetfangi. Verkefni sem hafa yfirleitt teki\u00f0 gr\u00ed\u00f0arlegan t\u00edma
  og kosta\u00f0 umtalsver\u00f0a peninga eru \u00fear me\u00f0 afl\u00f6g\u00f0 og
  oft engar heimildir til eftir \u00fea\u00f0 um \u00fatlit og efnisinnihald hinna
  afl\u00f6g\u00f0u kortasj\u00e1a. \u00de\u00f3 svo a\u00f0 \u00ed verkefninu vefsafn.is
  sem er afritunarverkefni \u00e1 vegum Landsb\u00f3kasafns \u00cdslands fyrir \u00edslenska
  vefi, n\u00e6st \u00fear ekki a\u00f0 afrita \u00edslenskar kortasj\u00e1r \u00fear
  sem \u00fe\u00e6r munu vera of fl\u00f3knar hugb\u00fana\u00f0arlausnir. Sama er
  a\u00f0 segja um erlenda afritunarvefi vefs\u00ed\u00f0na eins og Wayback Machine,
  a\u00f0 \u00fe\u00e6r afrita ekki heldur kortasj\u00e1r. Eina \u00feekkta d\u00e6mi\u00f0
  h\u00e9r \u00e1 landi um \u00fatlitsafritun hefur veri\u00f0 afritun Orkustofnunar
  \u00e1 \u00fatliti Gagnavefsj\u00e1r og N\u00e1tt\u00faruvefsj\u00e1r. Til a\u00f0
  vi\u00f0 gerum okkur almennt grein fyrir umfangi lokana og umbreytinga \u00fe\u00e1
  eru l\u00edklega aflag\u00f0ar n\u00e6r allar \u00fe\u00e6r r\u00famlega 40 kortasj\u00e1r
  sem til voru \u00feegar vefg\u00e1ttin landakort.is opna\u00f0i \u00e1ri\u00f0 2007
  og birti tengla \u00ed \u00fe\u00e6r \u00e1 fors\u00ed\u00f0u. Oftast hefur veri\u00f0
  skipt um hugb\u00fana\u00f0, e\u00f0a uppf\u00e6rslur og \u00fatf\u00e6rslur \u00fea\u00f0
  miki\u00f0 breyttar a\u00f0 um n\u00fd verkefni er a\u00f0 r\u00e6\u00f0a \u00fe\u00f3
  s\u00f6mu vefsl\u00f3\u00f0ir s\u00e9u nota\u00f0ar \u00ed m\u00f6rgum tilfellum.
  Kortasj\u00e1m hefur einnig fj\u00f6lga\u00f0 miki\u00f0, enda eru opinberlega birtar
  \u00edslenskar kortasj\u00e1r n\u00fa \u00e1 anna\u00f0 hundra\u00f0i\u00f0.\\nOrkustofnun
  hefur n\u00fdlega loka\u00f0 \u00feeim \u00feremur kortasj\u00e1m sem stofnunin
  bygg\u00f0i upp fyrir um t\u00edu \u00e1rum me\u00f0 notkun hugb\u00fana\u00f0ar
  Gagar\u00edn (Flashmap), en frumger\u00f0 \u00feess hugb\u00fana\u00f0ar var ger\u00f0
  fyrir verkefni\u00f0 N\u00e1tt\u00faruvefsj\u00e1 nokkrum \u00e1rum fyrr. Um er
  a\u00f0 r\u00e6\u00f0a Orkuvefsj\u00e1, Landgrunnsvefsj\u00e1 og tilraunaverkefni
  sem s\u00fdndi kort \u00ed m\u00e6likvar\u00f0a 1:25 000. Hugb\u00fana\u00f0urinn
  \u00fe\u00f3tti \u00e1 s\u00ednum t\u00edma leysa fullkomlega \u00fe\u00e6r \u00fearfir
  sem stofnunin haf\u00f0i \u00e1 \u00feessu svi\u00f0i og gengu \u00f6ll verkefnin
  vel fyrstu \u00e1rin. Me\u00f0 \u00fev\u00ed a\u00f0 Ve\u00f0urstofa \u00cdslands
  og Umhverfisr\u00e1\u00f0uneyti\u00f0 h\u00e6ttu a\u00f0 sty\u00f0ja vi\u00f0 N\u00e1tt\u00faruvefsj\u00e1
  sem var \u00e1 \u00feeirra fag\u00e1byrg\u00f0, \u00fe\u00e1 h\u00e6tti Gagar\u00edn
  a\u00f0 \u00fer\u00f3a grunnhugb\u00fana\u00f0inn. \u00dear me\u00f0 \u00feurfti
  Orkustofnun eftir \u00fev\u00ed sem t\u00edmar li\u00f0u a\u00f0 f\u00e6ra birtingu
  landfr\u00e6\u00f0ilegra gagna sinna anna\u00f0, sem hefur veri\u00f0 gert \u00e1
  nokkrum undanf\u00f6rnum misserum. \u00dear me\u00f0 hafa or\u00f0i\u00f0 til n\u00fdjar
  kortasj\u00e1r. Kortasj\u00e1 OS sem tekur vi\u00f0 hlutverki Orkuvefsj\u00e1r er
  unnin \u00ed samstarfi vi\u00f0 Loftmyndir ehf, en Landgrunnssj\u00e1 sem tekur
  vi\u00f0 af Landgrunnsvefsj\u00e1 og kortasj\u00e1 fyrir kortasafn OS sem tekur
  vi\u00f0 af Kortasj\u00e1 1:25 000 eru unnar \u00ed samstarfi vi\u00f0 Alta ehf.\\nOrkuvefsj\u00e1
  (2010-2019) birti uppl\u00fdsingar um landfr\u00e6\u00f0ileg g\u00f6gn Orkustofnunar.
  Landgrunnsvefsj\u00e1 (2009-2019) birti uppl\u00fdsingar um g\u00f6gn fr\u00e1 Drekasv\u00e6\u00f0inu
  vegna ol\u00edum\u00e1la og vefsj\u00e1 um kort 1:25 000 (2014-2019) birti uppl\u00fdsingar
  um kort nokkurra stofnana (Landm\u00e6linga \u00cdslands, Landsvirkjunar, N\u00e1tt\u00farufr\u00e6\u00f0istofnunar
  og Orkustofnunar) \u00ed m\u00e6likvar\u00f0a 1:25 000, sem ger\u00f0 voru og \u00fatgefin
  \u00e1 s\u00ed\u00f0ustu tveimur \u00e1ratugum s\u00ed\u00f0ustu aldar. \u00d6ll
  hin landfr\u00e6\u00f0ilegu g\u00f6gn og uppl\u00fdsingar um \u00feau sem \u00e1\u00f0ur
  birtust \u00ed eldri kortasj\u00e1m OS hafa n\u00fa veri\u00f0 sett fram me\u00f0
  n\u00fdjum h\u00e6tti og eru a\u00f0gengileg \u00ed \u00feeim kortasj\u00e1m sem
  teki\u00f0 hafa vi\u00f0 af \u00feeim sem loka\u00f0 var. Sl\u00edkt er hins vegar
  ekki alltaf raunin vi\u00f0 lokun kortasj\u00e1a. Til \u00feess a\u00f0 h\u00e6gt
  s\u00e1 a\u00f0 sj\u00e1 hvernig kortasj\u00e1rnar litu \u00fat og hva\u00f0a uppl\u00fdsingar
  voru birtar \u00ed \u00feeim hefur \u00fatlitsafritun af \u00feeim veri\u00f0 birt
  \u00e1 vef Orkustofnunar. Tv\u00e6r fyrrnefndu kortasj\u00e1rnar Orkuvefsj\u00e1
  og Landgrunnsvefsj\u00e1 voru b\u00e6\u00f0i \u00ed enskum og \u00edslenskum \u00fatg\u00e1fum
  en s\u00fa \u00feri\u00f0ja (Kortavefsj\u00e1 1:25 000) a\u00f0eins \u00e1 \u00edslensku.\\nS\u00fa
  sta\u00f0reynd a\u00f0 ekki er lengur h\u00e6gt a\u00f0 finna uppl\u00fdsingar um
  og sj\u00e1 hvernig meira en helmingur \u00edslenskra kortasj\u00e1a leit \u00fat
  \u00ed fyrstu \u00fatg\u00e1fu er miki\u00f0 umhugsunarefni. \u00dea\u00f0 a\u00f0
  opinberar var\u00f0veislustofnanir (lykils\u00f6fnin) skuli v\u00edsa fr\u00e1 s\u00e9r
  \u00e1byrg\u00f0 \u00e1 a\u00f0 finna lausn \u00e1 afritunarm\u00e1lum kortasj\u00e1a
  er ekki vi\u00f0unandi.\\nSpyrja m\u00e6tti hvers vegna afritun \u00e1 \u00fatliti
  kortasj\u00e1a fer ekki fram me\u00f0 samr\u00e6mdum h\u00e6tti? Eins m\u00e6tti
  hafa \u00ed huga til samanbur\u00f0ar a\u00f0 \u00fea\u00f0 \u00e1 til d\u00e6mis
  a\u00f0 geyma \u00f6ll afrit br\u00e9fa og t\u00f6lvup\u00f3sta \u00far skjalaskr\u00e1ningarkerfum
  stofnana og sveitarf\u00e9laga, allar \u00fatg\u00e1fur tiltekinna b\u00f3ka (b\u00e6\u00f0i
  endurprentanir og erlendar \u00fatg\u00e1fur), afrit sem tekin eru reglulega og
  oft \u00e1 \u00e1ri af \u00f6llum \u00edslenskum vefs\u00ed\u00f0um, en kortasj\u00e1m
  er sleppt og enginn vir\u00f0ist hafa \u00e1hyggjur af \u00fev\u00ed. \u00deetta
  eru st\u00f3rmerkilegar heimildir sem \u00e1 a\u00f0 geyma, einhver kalla\u00f0i
  \u00feetta kortaatlasa n\u00fat\u00edmans. \u00dea\u00f0 a\u00f0 geyma a\u00f0eins
  mismunandi \u00fatg\u00e1fur landfr\u00e6\u00f0ilegu frumgagnasettanna \u00far landuppl\u00fdsingakerfunum
  sem liggja til grundvallar (\u00fe\u00f3 \u00fea\u00f0 s\u00e9 \u00fev\u00ed mi\u00f0ur
  ekki gert alls sta\u00f0ar eins og \u00e1 a\u00f0 gera), leysir engan vanda \u00fear
  sem \u00fatliti\u00f0 \u00e1 birtingunni vantar. Sagan \u00e1 \u00feessu svi\u00f0i
  er a\u00f0 glatast. \u00dea\u00f0 er au\u00f0vita\u00f0 ekki \u00e1s\u00e6ttanlegt.\\n\u00deorvaldur
  Bragason\"", "\"Efnisyfirlit\\nDagur \u00ed sorphaugunum er hluti af \u00e1standi
  mannsins. Dagar \u00feegar vonin er glatu\u00f0, \u00feunglyndi sk\u00fdlir huganum
  og l\u00edfi\u00f0 finnst of \u00feungt til a\u00f0 bera eru bara hluti af l\u00edfinu.
  Hins vegar, \u00feegar \u00feessir dagar halda \u00e1fram me\u00f0 \u00f3gle\u00f0i,
  er kominn t\u00edmi til a\u00f0 sko\u00f0a d\u00fdpra hvers vegna sorg \u00fe\u00edn
  er vi\u00f0lo\u00f0andi og hvernig \u00e1 a\u00f0 gera meira en bara a\u00f0 fl\u00fdja
  s\u00e1rsaukann.\\nSannleikurinn er s\u00e1 a\u00f0 \u00feunglyndi og ni\u00f0urdrepandi
  tilfinning eru af v\u00f6ldum fj\u00f6lda \u00fe\u00e1tta, efnafr\u00e6\u00f0ilegra
  til a\u00f0st\u00e6\u00f0na, og hver og einn hefur \u00e1hrif \u00e1 tilfinningar
  okkar \u00e1 s\u00e9rstakan en samt svipa\u00f0an h\u00e1tt. \u00dea\u00f0 eru endalausar
  greinar sem l\u00fdsa \u00fev\u00ed hva\u00f0 \u00fe\u00fa getur gert til a\u00f0
  b\u00e6ta skap \u00feitt, en \u00fe\u00e6r fjalla a\u00f0eins um einkennin en ekki
  undirr\u00f3t tiltekinnar sorgar \u00feinnar.\\nArist\u00f3teles skrifa\u00f0i:
  \u201eEin svala gerir ekki sumar, ekki heldur einn g\u00f3\u00f0an ve\u00f0urdag;
  a\u00f0 sama skapi gerir einn dagur e\u00f0a stuttur t\u00edmi hamingju manneskju
  ekki alveg hamingjusama.\u201c A\u00f0 b\u00e6ta skap \u00feitt me\u00f0 reynslu
  getur veri\u00f0 einn g\u00f3\u00f0an ve\u00f0urdag um mi\u00f0jan vetur, en \u00fea\u00f0
  er ekki n\u00f3g til a\u00f0 draga \u00feig \u00fat \u00far myrkri \u00feunglyndis
  og \u00feessar miklu depur\u00f0artilfinningar sem draga \u00feig ni\u00f0ur.\\nAllir
  eru mismunandi og getur upplifa\u00f0 sorgartilfinningu \u00e1 einstakan h\u00e1tt,
  en \u00fea\u00f0 eru nokkrir lykil\u00fe\u00e6ttir sem geta valdi\u00f0 \u00fev\u00ed
  a\u00f0 \u00fe\u00fa ert ni\u00f0urdreginn og l\u00e6kningin vi\u00f0 hverri af
  \u00feessum undirr\u00f3tum er mismunandi.\\n1) Heilsa\\nAu\u00f0veldasti sta\u00f0urinn
  til a\u00f0 byrja \u00feegar kafa\u00f0 er \u00ed \u00fea\u00f0 sem g\u00e6ti valdi\u00f0
  \u00fev\u00ed a\u00f0 \u00fe\u00fa ert ni\u00f0urdreginn er a\u00f0 l\u00edta vel
  \u00e1 heilsuna \u00fe\u00edna -og gle\u00f0i getur l\u00e1ti\u00f0 s\u00f3lr\u00edka
  s\u00e1l l\u00ed\u00f0a kalt og hrj\u00f3strugt, en l\u00e6kning er m\u00f6guleg.
  \u00d6r missis og s\u00e1rsauka geta byrja\u00f0 a\u00f0 gr\u00f3a, en \u00feau
  skilja eftir sig spor og minna okkur \u00e1 hva\u00f0 vi\u00f0 h\u00f6fum misst
  og hver vi\u00f0 erum or\u00f0in.\\n7) Einmanaleiki\\n\u00de\u00fa g\u00e6tir veri\u00f0
  l\u00ed\u00f0a ni\u00f0ur vegna einmanaleika og skorts \u00e1 tilfinningalegum tengslum
  vi\u00f0 a\u00f0ra. \u00de\u00f3 a\u00f0 f\u00f3lk s\u00e9 mismunandi \u00ed \u00fev\u00ed
  hversu miki\u00f0 og styrkleiki \u00fea\u00f0 \u00fearfnast pers\u00f3nulegrar tengingar,
  er \u00fea\u00f0 v\u00edsindalega sanna\u00f0 a\u00f0 algj\u00f6r einangrun fr\u00e1
  mannheiminum getur skapa\u00f0 ge\u00f0r\u00e6n vandam\u00e1l og alvarlegt \u00feunglyndi.\\nEf
  \u00fe\u00fa ert \u00ed erfi\u00f0leikum me\u00f0 a\u00f0 l\u00ed\u00f0a ni\u00f0ur,
  skaltu \u00edhuga \u00fdta \u00fe\u00e9r \u00fat fyrir \u00fe\u00e6gindarammann
  \u00feinn og byrja a\u00f0 s\u00e6kjast eftir meiri tilfinningalegum tengslum vi\u00f0
  f\u00f3lk. A\u00f0 setja hi\u00f0 raunverulega \u00feig \u00fat \u00ed heiminn getur
  leitt til raunverulegra mannlegra samskipta sem fylla s\u00e1l \u00fe\u00edna \u00e1
  sama h\u00e1tt og upp\u00e1halds m\u00e1lt\u00ed\u00f0in \u00fe\u00edn fyllir magann.
  \u00dea\u00f0 yljar \u00fe\u00e9r inn \u00ed kjarnann og veitir vell\u00ed\u00f0an
  sem gefur l\u00edfinu brag\u00f0.\\nEinmanaleiki er eitthva\u00f0 sem \u00fe\u00fa
  getur sigra\u00f0. L\u00e6kningin er einf\u00f6ld og v\u00ed\u00f0a f\u00e1anleg
  - f\u00f3lk. Hvort sem \u00fe\u00fa byrjar sm\u00e1tt me\u00f0 \u00fev\u00ed a\u00f0
  gr\u00edpa \u00ed kaffi \u00ed hverri viku \u00e1 kaffih\u00fasi \u00e1 sta\u00f0num
  og spjalla vi\u00f0 baristana, e\u00f0a \u00fe\u00fa kafar algerlega me\u00f0 samf\u00e9lagi
  f\u00f3lks til a\u00f0 deila s\u00e1lu \u00feinni me\u00f0, \u00fe\u00e1 mun \u00feessi
  reynsla byrja a\u00f0 losna vi\u00f0 einmanaleikatilfinningu og koma \u00ed sta\u00f0inn
  \u00fe\u00e1 me\u00f0 tilfinningar um a\u00f0 tilheyra. Mundu a\u00f0 allir eru
  a\u00f0 leita a\u00f0 tilheyrandi og raunverulegum mannlegum tengslum, svo vertu
  ekkihr\u00e6ddur vi\u00f0 a\u00f0 fara fyrst. Kannski ver\u00f0ur varnarleysi \u00feitt
  tengingin sem einhver annar hefur veri\u00f0 a\u00f0 leita a\u00f0.\\n8) Skortur
  \u00e1 merkingu og tilgangi\\nS\u00ed\u00f0asta ors\u00f6k ni\u00f0url\u00e6gingar
  sem vi\u00f0 munum kafa ofan \u00ed er skortur \u00e1 merkingu og tilgangi. \u00dea\u00f0
  er tilfinningin a\u00f0 \u00fea\u00f0 s\u00e9 meira \u00ed l\u00edfinu en bara a\u00f0
  vera til. L\u00edklegt er a\u00f0 \u00fe\u00fa hafir einhvern t\u00edma spurt spurninga
  um tilgang \u00feinn og tilgang l\u00edfs \u00fe\u00edns. \u00cd raun og veru erum
  vi\u00f0 \u00f6ll a\u00f0 leita a\u00f0 \u00feessum d\u00fdpri hv\u00f6tum fyrir
  a\u00f0 vera \u00e1 l\u00edfi og spurningunni: \u201eSkiptir tilvist okkar m\u00e1li?
  er ein sem vi\u00f0 \u00fer\u00e1um \u00f6ll a\u00f0 vita.\\nSj\u00e1 einnig: 10
  vi\u00f0v\u00f6runarmerki f\u00e9lagi \u00feinn er a\u00f0 missa tilfinningar til
  \u00fe\u00edn (og hva\u00f0 \u00e1 a\u00f0 gera)Hins vegar er \u00feetta umfram
  allt erfi\u00f0asta spurningin a\u00f0 svara. Er tilgangur okkar a\u00f0 elska f\u00f3lk?
  Er veri\u00f0 a\u00f0 bjarga j\u00f6r\u00f0inni? Er a\u00f0 elta mestu langanir
  okkar? Og svo \u00feegar vi\u00f0 n\u00e1um \u00f6llu \u00fev\u00ed sem vi\u00f0
  h\u00f6fum skilgreint \u00ed hj\u00f6rtum okkar sem tilgang okkar, og \u00feeir
  hlutir finnast enn tilgangslaust, hva\u00f0 \u00fe\u00e1?\\n\u00cd kjarnanum er
  \u00feessi spurning andleg spurning. Spurningar og sv\u00f6r eru miki\u00f0 \u00e1
  \u00feessum vettvangi, svo \u00e9g mun ekki reyna a\u00f0 gefa \u00fe\u00e9r neinar,
  en \u00e9g segi \u00feetta: a\u00f0 uppg\u00f6tva svari\u00f0 vi\u00f0 \u00feessari
  spurningu g\u00e6ti teki\u00f0 \u00feig \u00ed mesta fer\u00f0alag l\u00edfs \u00fe\u00edns
  og afhj\u00fapa\u00f0 d\u00fdpri merkingu tilveru \u00feinnar sem getur l\u00fdst
  upp heiminn \u00feinn \u00e1 \u00feann h\u00e1tt sem varla er h\u00e6gt a\u00f0
  hugsa s\u00e9r. \u00dea\u00f0 hefur vissulega gert fyrir mig.\\nHins vegar er \u00feetta
  ekki fer\u00f0 sem einhver getur fari\u00f0 fyrir \u00feig. \u00c9g heyr\u00f0i
  einu sinni a\u00f0 s\u00e1 sem leitar mun finna. Kannski a\u00f0 leita svara vi\u00f0
  spurningunni \u201eAf hverju geri \u00e9g \u00fea\u00f0til?\u201d er sta\u00f0urinn
  \u00fear sem vi\u00f0 finnum raunverulega merkingu l\u00edfs okkar.\\nVictor Hugo
  skrifa\u00f0i \u00ed Les Miserables: \u201eN\u00e1aldurinn v\u00edkkar \u00fat \u00ed
  myrkri og finnur a\u00f0 lokum lj\u00f3s, eins og s\u00e1lin v\u00edkkar \u00fat
  \u00ed \u00f3g\u00e6fu og \u00e1 endanum finnur Gu\u00f0. .\u201d Kannski eru allir
  dagar \u00fe\u00ednir \u00fear sem \u00fe\u00fa ert ni\u00f0urdreginn og fastur
  \u00ed myrkri bara a\u00f0 lei\u00f0a \u00feig til lj\u00f3ssins.\\nLokunarhugsanir\\nDepur\u00f0artilfinning,
  \u00fe\u00f3 h\u00fan s\u00e9 e\u00f0lileg, getur koma fr\u00e1 margv\u00edslegum
  a\u00f0st\u00e6\u00f0um og upplifunum - allar mismunandi og einstakar. \u00dea\u00f0
  er au\u00f0velt a\u00f0 vilja for\u00f0ast a\u00f0 l\u00ed\u00f0a ni\u00f0ur, en
  \u00fea\u00f0 er ekki alltaf gagnlegt. \u00dea\u00f0 eru t\u00edmar \u00feegar sorgin
  kemur upp og \u00ed sta\u00f0 \u00feess a\u00f0 hlaupa fr\u00e1 henni og reyna \u00f6nnur
  8 hagn\u00fdt r\u00e1\u00f0 til a\u00f0 b\u00e6ta skapi\u00f0 \u00feurfum vi\u00f0
  a\u00f0 horfast \u00ed augu vi\u00f0 hana og upplifa virkilega \u00f3\u00fe\u00e6gindin
  sem fylgja henni.\\nTilfinninga\u00feoli\u00f0 f\u00f3lk er ekki f\u00f3lki\u00f0
  sem l\u00ed\u00f0ur vel allan t\u00edmann heldur er f\u00f3lki\u00f0 sem getur gengi\u00f0
  \u00ed gegnum s\u00e1rsauka l\u00edfsins og \u00e1skoranir, og jafnvel eigin sorg
  og sorg, og ekki hlaupi\u00f0 \u00ed burtu og reynt a\u00f0 fl\u00fdja \u00fea\u00f0.
  A\u00f0 fl\u00fdja s\u00e1rsauka okkar getur leitt til mesta ska\u00f0a sem vi\u00f0
  getum upplifa\u00f0 \u00ed l\u00edfinu, hluti eins og f\u00edkn sem getur sogi\u00f0
  mann undir. Vandam\u00e1li\u00f0 er ekki a\u00f0 f\u00edklar elska eiturlyf, kynl\u00edf,
  \u00e1fengi e\u00f0a a\u00f0ra f\u00edkn of miki\u00f0 til a\u00f0 gefast upp; vandam\u00e1li\u00f0
  er a\u00f0 f\u00f3lk ver\u00f0ur f\u00edkill til a\u00f0 fl\u00fdja s\u00e1rsaukann.
  \u00de\u00e1 er of erfitt a\u00f0 h\u00e6tta f\u00edkn sinni vegna \u00feess a\u00f0
  \u00fea\u00f0 \u00fe\u00fd\u00f0ir a\u00f0 \u00feeir ver\u00f0a a\u00f0 horfast
  \u00ed augu vi\u00f0 raunveruleika eigin s\u00e1rsauka, sorgar,sorg, missi og einmanaleika.\\nHvort
  sem \u00fe\u00fa ert einfaldlega ni\u00f0urdreginn e\u00f0a \u00e1 erfitt me\u00f0
  a\u00f0 \u00feola grj\u00f3t sorgar og \u00feunglyndis, \u00fe\u00e1 getur vali\u00f0
  um a\u00f0 ganga \u00ed gegnum \u00feennan eld \u00e1n deyfingar e\u00f0a h\u00f6rfa
  veri\u00f0 \u00fea\u00f0 sem f\u00e6rir \u00feig til hins hli\u00f0. Stundum \u00feurfum
  vi\u00f0 a\u00f0 finna fyrir s\u00e1rsauka okkar og sorg til a\u00f0 halda \u00e1fram
  me\u00f0 l\u00edf okkar. Ekki l\u00e1ta tilfinninguna svelta \u00feig og draga \u00feig
  undir, heldur horfast \u00ed augu vi\u00f0 hana og velja a\u00f0 ganga me\u00f0
  henni \u00feanga\u00f0 til \u00fe\u00fa hefur gengi\u00f0 framhj\u00e1 henni.\\nhva\u00f0
  \u00fe\u00fa bor\u00f0ar (og hven\u00e6r), hversu oft \u00fe\u00fa hreyfir \u00feig,
  hversu mikinn svefn \u00fe\u00fa ert a\u00f0 f\u00e1 og hvort \u00fe\u00fa gl\u00edmir
  vi\u00f0 heilsufarsvandam\u00e1l e\u00f0a tekur lyf sem geta haft \u00e1hrif \u00e1
  skap \u00feitt.Margir me\u00f0fer\u00f0ara\u00f0ilar hvetja sj\u00faklinga s\u00edna
  til a\u00f0 byrja vinna a\u00f0 \u00fev\u00ed a\u00f0 b\u00e6ta l\u00edkamlega heilsu
  s\u00edna \u00ed gegnum matar\u00e6\u00f0i, hreyfingu og heilan n\u00e6tursvefn,
  samhli\u00f0a \u00fev\u00ed a\u00f0 kafa ofan \u00ed d\u00fdpri tilfinningabar\u00e1ttu
  \u00ed r\u00e1\u00f0gj\u00f6f. Margir sinnum geta \u00feessar heildr\u00e6nu breytingar
  laga\u00f0 depur\u00f0 og \u00feunglyndi. Reyndar getur \u00feunglyndi \u00ed sumum
  tilfellum stafa\u00f0 algj\u00f6rlega af \u00f3greindu f\u00e6\u00f0uofn\u00e6mi.\\nReyndar
  gl\u00edmdi k\u00e6r vinkona m\u00edn alvarlega vi\u00f0 \u00feunglyndi og kv\u00ed\u00f0a
  \u00fear til h\u00fan f\u00f3r a\u00f0 hitta heildr\u00e6nan l\u00e6kni sem lag\u00f0i
  til nokkrar breytingar \u00e1 matar\u00e6\u00f0i. Fyrir hana olli \u00fea\u00f0
  verulegum breytingum \u00e1 ge\u00f0heilsu hennar a\u00f0 skera \u00fat gl\u00faten.
  Enn \u00feann dag \u00ed dag, ef h\u00fan bor\u00f0ar \u00f3vart eitthva\u00f0 me\u00f0
  gl\u00fateni, gl\u00edmir h\u00fan vi\u00f0 \u00feunglyndi \u00fear til \u00fea\u00f0
  er fari\u00f0 \u00far kerfinu hennar. \u00deetta er eitt d\u00e6mi sem undirstrikar
  tengslin milli matar\u00e6\u00f0is okkar og ge\u00f0heilsu okkar.\\nAuk \u00feess
  hafa n\u00fdlegar ranns\u00f3knir leitt \u00ed lj\u00f3s a\u00f0 hreyfing getur
  framleitt efni \u00ed heilanum sem er \u00e1hrifar\u00edkara en lyfse\u00f0ilsskyld
  \u00feunglyndislyf. \u00deetta \u00fe\u00fd\u00f0ir a\u00f0 hreyfing er \u00ed raun
  \u00e1hrifar\u00edk lei\u00f0 til a\u00f0 me\u00f0h\u00f6ndla \u00feunglyndi og
  \u00feunglyndi og h\u00fan hefur engar neikv\u00e6\u00f0ar aukaverkanir.\\n\u00deegar
  \u00fe\u00fa festist \u00ed bl\u00e1lokunum skaltu ney\u00f0a \u00feig \u00far s\u00f3fanum
  til a\u00f0 gera \u00fea\u00f0.eitthva\u00f0 eins einfalt og a\u00f0 fara \u00ed
  g\u00f6ngut\u00far. Ef ve\u00f0ri\u00f0 er hr\u00e6\u00f0ilegt skaltu finna verslunarmi\u00f0st\u00f6\u00f0
  e\u00f0a g\u00f6ngulei\u00f0 innandyra og koma l\u00edkamanum \u00e1 hreyfingu.
  Endorf\u00edni\u00f0 mun hj\u00e1lpa \u00fe\u00e9r a\u00f0 berjast gegn \u00feunglyndi
  og \u00fe\u00fa g\u00e6tir enda\u00f0 me\u00f0 a\u00f0 l\u00ed\u00f0a betur en \u00fe\u00fa
  myndir hafa ef \u00fe\u00fa l\u00e6tur sorgartilfinningarnar sigra.\\nEf hreyfing
  finnst yfir\u00feyrmandi skaltu byrja \u00e1 litlum matar\u00e6\u00f0isbreytingum.
  Skeri\u00f0 sykur e\u00f0a hreinsu\u00f0 kolvetni \u00fat \u00fear sem \u00feetta
  getur veri\u00f0 st\u00f3r \u00fe\u00e1ttur \u00ed \u00feunglyndi. \u00deessi einf\u00f6ldu
  skref \u00ed \u00e1tt a\u00f0 heilbrig\u00f0ari l\u00edkama geta leitt til heilbrig\u00f0ari
  hugsana og tilfinninga. \u00de\u00fa g\u00e6tir veri\u00f0 hissa \u00e1 \u00fev\u00ed
  a\u00f0 finna a\u00f0 s\u00f6kud\u00f3lg \u00feunglyndis \u00fe\u00edns er eitthva\u00f0
  sem ekki er teki\u00f0 \u00e1 \u00ed l\u00edkamlegri heilsu \u00feinni.\\n2) Kl\u00edn\u00edskt
  \u00feunglyndi\\n\u00c1 me\u00f0an \u00fe\u00fa b\u00e6tir l\u00edkamlega heilsu
  \u00fe\u00edna. getur verulega b\u00e6tt jafnvel kl\u00edn\u00edskt \u00feunglyndi,
  sumt f\u00f3lk \u00fej\u00e1ist af alvarlegu \u00feunglyndi sem g\u00e6ti ekki batna\u00f0
  me\u00f0 l\u00edfsst\u00edl e\u00f0a heilsubreytingum. Ef \u00feig grunar a\u00f0
  \u00fe\u00fa \u00fej\u00e1ist af alvarlegu \u00feunglyndi, vinsamlegast haf\u00f0u
  samband vi\u00f0 heilbrig\u00f0isstarfsmann eins flj\u00f3tt og au\u00f0i\u00f0
  er.\\nMajor Depressive Disorder (MDD), tegund alvarlegs \u00feunglyndis, einkennist
  af:\\n- Listaleysi\\n- Algert tap \u00e1 \u00e1huga \u00e1 \u00f6llu sem \u00e1\u00f0ur
  hefur veri\u00f0 noti\u00f0\\n- Tilfinning um einskis vir\u00f0i\\n- \u00d3\u00fatsk\u00fdr\u00f0ur
  s\u00e1rsauki\\n- \u00dereyta\\n- H\u00f6fu\u00f0verkur\\n- Minni kynhv\u00f6t\\n-
  Rei\u00f0akast\\n- Hugsunar- e\u00f0a einbeitingarvandam\u00e1l\\n- Og \u00ed sumum
  tilfellum fylgja ofskynjanir og ranghugmyndir\\n\u00cdf\u00f3lk me\u00f0 alvarlegt
  kl\u00edn\u00edskt \u00feunglyndi, \u00fe\u00e1 er best a\u00f0 hafa samband vi\u00f0
  ge\u00f0heilbrig\u00f0isstarfsmann sem getur hj\u00e1lpa\u00f0 til vi\u00f0 a\u00f0
  me\u00f0h\u00f6ndla og veita l\u00e9ttir fyrir \u00feunglyndi \u00feitt.\\nJK Rowling,
  h\u00f6fundur Harry Potter b\u00f3kaser\u00edunnar. , bar\u00f0ist vi\u00f0 \u00feunglyndi
  og l\u00fdsti \u00fev\u00ed sem \u00fev\u00ed \u00f3\u00fe\u00e6gilegasta sem h\u00fan
  hefur upplifa\u00f0. H\u00fan skrifar:\\n\u201e\u00dea\u00f0 er \u00feessi fjarvera
  a\u00f0 geta s\u00e9\u00f0 fyrir s\u00e9r a\u00f0 \u00fe\u00fa munt nokkurn t\u00edma
  ver\u00f0a k\u00e1t aftur. Fjarvera vonar. \u00deessi mj\u00f6g deyf\u00f0u tilfinning,
  sem er svo allt \u00f6nnur en sorgm\u00e6dd. Sorglegt s\u00e1rt en \u00fea\u00f0
  er heilbrig\u00f0 tilfinning. \u00dea\u00f0 er nau\u00f0synlegt a\u00f0 finna til.
  \u00deunglyndi er allt \u00f6\u00f0ruv\u00edsi.\u201c \u2014 J.K. Rowling\\n\u00cd
  sumum tilfellum getur\u00f0u gert raunh\u00e6far r\u00e1\u00f0stafanir til a\u00f0
  breyta skapi \u00fe\u00ednu e\u00f0a tilfinningum, en \u00feegar \u00fe\u00fa berst
  vi\u00f0 skr\u00edmsli \u00feunglyndis er mikilv\u00e6gt a\u00f0 f\u00e1 hj\u00e1lp.\\n3)
  Ve\u00f0ur\\n\u00dea\u00f0 eru nokkrar tegundir af kl\u00edn\u00edsku \u00feunglyndi,
  e\u00f0a sorgartilfinningu, sem h\u00e6gt er a\u00f0 hr\u00edfast \u00ed burtu me\u00f0
  sm\u00e1 s\u00f3lskini. \u00cd raun er h\u00e6gt a\u00f0 b\u00e6ta \u00e1rst\u00ed\u00f0abundin
  \u00e1hrifar\u00f6skun (SAD) einfaldlega me\u00f0 \u00fev\u00ed a\u00f0 fara \u00fat
  \u00ed s\u00f3lina. L\u00edkamar okkar gleypa D-v\u00edtam\u00edn \u00far s\u00f3linni
  sem hefur leitt til \u00feess a\u00f0 l\u00e6knasamf\u00e9lagi\u00f0 m\u00e6lir
  me\u00f0 \u00fev\u00ed a\u00f0 f\u00e1 s\u00e9r s\u00f3larlj\u00f3sslampa, taka
  D-v\u00edtam\u00edn f\u00e6\u00f0ub\u00f3tarefni e\u00f0a flytja \u00ed s\u00f3lr\u00edkara
  loftslag sem lei\u00f0 til a\u00f0 me\u00f0h\u00f6ndla SAD.\\n\u201c\u00c9g s\u00e1
  heiminn \u00ed sv\u00f6rtu og hv\u00edtu \u00ed sta\u00f0 l\u00edflegra lita og
  t\u00f3na sem \u00e9g vissi a\u00f0 v\u00e6ru til.\u201c \u2015 Katie McGarry, Pushing
  the Limits\\nEf \u00fe\u00fa hefur komist a\u00f0 \u00fev\u00ed a\u00f0 \u00fe\u00fal\u00ed\u00f0a
  ni\u00f0ur \u00e1 dimmum d\u00f6gum vetrarins, pr\u00f3fa\u00f0u \u00feessa valkosti
  og sj\u00e1\u00f0u hvort \u00feeir b\u00e6ta skap \u00feitt. Kannski skipulegg\u00f0u
  su\u00f0r\u00e6nt fr\u00ed \u00e1 gr\u00e1um m\u00e1nu\u00f0um vetrarins svo \u00fe\u00fa
  getir drekki\u00f0 allt \u00feetta D-v\u00edtam\u00edn vi\u00f0 sundlaugarbakkann
  og drukki\u00f0 pi\u00f1a colada.\\n4) Streita\\nStreita getur veri\u00f0 st\u00f3r
  \u00fe\u00e1ttur \u00ed \u00fe\u00e9r. tilfinningalega vell\u00ed\u00f0an. N\u00fdlegar
  ranns\u00f3knir hafa s\u00fdnt a\u00f0 tengsl eru \u00e1 milli s\u00e1lr\u00e6nna
  streituvalda og \u00fer\u00f3un \u00feunglyndis. Ef \u00fe\u00fa ert ni\u00f0urdreginn
  vegna streitu e\u00f0a umhverfis\u00fe\u00e1tta, eins og vinnu \u00feinnar, g\u00e6ti
  veri\u00f0 kominn t\u00edmi til a\u00f0 \u00edhuga breytingu.\\nUmhverfi\u00f0 \u00feitt
  spilar st\u00f3ran \u00fe\u00e1tt \u00ed tilfinningalegri l\u00ed\u00f0an \u00feinni
  og er eitthva\u00f0 sem \u00fe\u00fa hefur l\u00edklega getu til a\u00f0 breyta.
  Kannski getur\u00f0u ekki selt allt og flutt til Hawaii, en \u00fe\u00fa g\u00e6tir
  \u00edhuga\u00f0 a\u00f0 minnka l\u00edfsst\u00edlinn \u00feinn til a\u00f0 taka
  vinnu sem er minna streituvaldandi.\\nEf streita \u00fe\u00edn stafar af tengsla\u00e1t\u00f6kum
  skaltu \u00edhuga a\u00f0 leita til r\u00e1\u00f0gjafa sem s\u00e9rh\u00e6fir sig.
  \u00ed samskiptam\u00e1lum. \u00dea\u00f0 g\u00e6ti veri\u00f0 kominn t\u00edmi
  til a\u00f0 gera \u00fattekt \u00e1 \u00fev\u00ed hva\u00f0 er a\u00f0 virka \u00ed
  l\u00edfi \u00fe\u00ednu og samb\u00f6ndum og hverju er h\u00e6gt a\u00f0 breyta
  til a\u00f0 b\u00e6ta hlutina. \u00dea\u00f0 eru \u00f3tr\u00falegar forsendurnar
  sem vi\u00f0 gerum um hvernig l\u00edf okkar \u00e6tti a\u00f0 l\u00edta \u00fat
  sem er kannski ekki \u00fea\u00f0 sem er best fyrir okkur.\\n\u00c9g h\u00e9lt einu
  sinni a\u00f0 til a\u00f0 vera g\u00f3\u00f0 mamma \u00feyrfti \u00e9g a\u00f0 vera
  heima hj\u00e1- heima mamma. Hins vegar, \u00feegar t\u00edminn lei\u00f0 og \u00e9g
  \u00e1tti erfitt me\u00f0 a\u00f0 finnast \u00e9g fulln\u00e6gja hlutverki m\u00ednu
  heima, \u00e1tta\u00f0i \u00e9g mig \u00e1 \u00fev\u00ed a\u00f0 \u00e9g var me\u00f0
  d\u00fafurhola\u00f0i mig inn \u00ed l\u00edfsst\u00edl sem passa\u00f0i ekki vi\u00f0
  \u00fea\u00f0 sem \u00e9g er. A\u00f0 finna vinnu sem \u00e9g elska\u00f0i - a\u00f0
  skrifa og hj\u00e1lpa til \u00ed samf\u00e9lags\u00e1\u00e6tlun sem lei\u00f0beindir
  unglingum m\u00e6\u00f0rum - veitti s\u00e1l minni svo miki\u00f0 l\u00edf og l\u00edfsfyllingu
  a\u00f0 ofgn\u00f3tt \u00feessara breytinga streymdi \u00fat \u00ed l\u00edf fj\u00f6lskyldu
  minnar. \u00cd fyrstu fannst m\u00e9r \u00fea\u00f0 eigingjarnt a\u00f0 taka t\u00edma
  fr\u00e1 b\u00f6rnunum m\u00ednum og fj\u00f6lskyldunni, en \u00e1 endanum hefur
  \u00feetta veri\u00f0 ein besta \u00e1kv\u00f6r\u00f0un sem \u00e9g hef teki\u00f0
  fyrir fj\u00f6lskylduna m\u00edna. Stundum \u00feurfum vi\u00f0 a\u00f0 hugsa \u00f6\u00f0ruv\u00edsi
  um \u00fe\u00e6r forsendur sem vi\u00f0 h\u00f6fum gefi\u00f0 okkur um hvernig l\u00edfi\u00f0
  \u00e6tti a\u00f0 l\u00edta \u00fat og \u00edhuga a\u00f0 gera \u00fea\u00f0 sem
  vi\u00f0 h\u00f6fum brennandi \u00e1huga \u00e1 og bj\u00f3\u00f0a vinum okkar og
  fj\u00f6lskyldu inn \u00ed \u00fe\u00e1 \u00e1str\u00ed\u00f0u. \u00dea\u00f0 g\u00e6ti
  veitt \u00fe\u00e9r l\u00edf og gle\u00f0i, heldur f\u00f3lkinu sem elskar \u00feig
  l\u00edka.\\nSj\u00e1 einnig: Tilfinningalegur farangur fr\u00e1 fyrri samb\u00f6ndum:
  10 merki um a\u00f0 \u00fe\u00fa s\u00e9rt me\u00f0 hann og hvernig \u00e1 a\u00f0
  takast \u00e1 vi\u00f0 \u00fea\u00f0Ef \u00fe\u00fa lendir \u00ed a\u00f0st\u00e6\u00f0um
  sem \u00fe\u00fa getur ekki e\u00f0a vilt ekki breyta, g\u00e6tir\u00f0u vilja\u00f0
  \u00edhuga a\u00f0 l\u00e6ra a\u00f0fer\u00f0ir til a\u00f0 hj\u00e1lpa \u00fe\u00e9r
  a\u00f0 stj\u00f3rna streitu \u00feinni, eins og huglei\u00f0slu og einbeitt \u00f6ndun.
  Litlar breytingar \u00e1 \u00fev\u00ed hvernig \u00fe\u00fa bregst vi\u00f0 streitu
  g\u00e6ti dregi\u00f0 \u00far heildar tilfinningum \u00fe\u00ednum um sorg og \u00feunglyndi.
  \u00dea\u00f0 eru \u00fdmsar \u00f3tr\u00falegar lei\u00f0ir til a\u00f0 halda r\u00f3
  sinni \u00feegar \u00fe\u00fa ert stressa\u00f0ur sem mun hj\u00e1lpa \u00fe\u00e9r
  a\u00f0 l\u00e6ra a\u00f0 takast \u00e1 vi\u00f0 streituvaldandi a\u00f0st\u00e6\u00f0ur
  \u00e1 \u00feann h\u00e1tt sem er heilbrig\u00f0ur fyrir l\u00edkama \u00feinn og
  huga.\\nOg ef allt anna\u00f0 mistekst, eins og Dodie Smith segir: \\\"G\u00f6fug
  verk og heit b\u00f6\u00f0 eru bestu l\u00e6kningarnar vi\u00f0 \u00feunglyndi.\\\"
  Far\u00f0u a\u00f0 gera eitthva\u00f0 gott fyrir einhvern og far\u00f0u \u00ed langt
  heitt ba\u00f0. \u00de\u00fa g\u00e6tir veri\u00f0 undrandi a\u00f0 finna hvernig
  einf\u00f6ld ath\u00f6fnumhyggja fyrir \u00f6\u00f0rum og sj\u00e1lfum s\u00e9r
  getur fari\u00f0 langt \u00ed a\u00f0 draga \u00far depur\u00f0 og \u00feunglyndi.\\n5)
  Neikv\u00e6\u00f0ar hugsanir\\n\u00deegar \u00fe\u00fa ert ni\u00f0urdreginn, \u00fea\u00f0
  er \u00f3tr\u00falegt hva\u00f0 neikv\u00e6\u00f0ar hugsanir geta fari\u00f0 a\u00f0
  r\u00e1\u00f0ast inn \u00ed hugann. Tilfinning um mist\u00f6k og vonleysi getur
  lo\u00f0a\u00f0 eins og vatnsmikill hringi\u00f0ur og dregi\u00f0 \u00feig ni\u00f0ur
  undir \u00f6ldurnar. \u00deessi innri gagnr\u00fdnandi getur l\u00e1ti\u00f0 \u00fe\u00e9r
  l\u00ed\u00f0a eins og \u00fe\u00fa s\u00e9rt b\u00f6l samf\u00e9lagsins og b\u00f6l
