  e\u00f0a hvort \u00fea\u00f0 \u00fer\u00f3ast sem svar vi\u00f0 l\u00edfsbreytingum
  sem ver\u00f0a eftir \u00e1falli\u00f0 e\u00f0a missinn.\\n\u00d3h\u00e1\u00f0 \u00fer\u00f3un
  \u00feess, ganga \u00ed gegnum sorgina. og \u00e1f\u00f6ll eru l\u00edfsbreytandi
