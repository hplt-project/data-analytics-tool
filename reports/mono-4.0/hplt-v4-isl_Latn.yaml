  munt ekki ganga inn \u00e1 g\u00f6tuna. S\u00fa tr\u00fa mun halda \u00fe\u00e9r
  fr\u00e1 \u00fev\u00ed a\u00f0 halda \u00e1fram. \u00dea\u00f0 sama \u00e1 vi\u00f0
  um neikv\u00e6\u00f0ar hugsanir. Ef \u00fe\u00fa tr\u00fair \u00fev\u00ed a\u00f0
  \u00fe\u00e9r s\u00e9 \u00e6tla\u00f0 a\u00f0 mistakast, muntu aldrei reyna. Ef
  \u00fe\u00fa tr\u00fair \u00fev\u00ed a\u00f0 l\u00edf \u00feitt s\u00e9 einskis
  vir\u00f0i muntu ekki fara fram \u00far r\u00faminu. Ef \u00fe\u00fa tr\u00fair
  \u00fev\u00ed a\u00f0 enginn \u00feurfi \u00e1 \u00fe\u00e9r a\u00f0 halda muntu
  aldrei hj\u00e1lpa neinum.\\nA\u00f0 takast \u00e1 vi\u00f0 \u00feessar neikv\u00e6\u00f0u
  hugsanir er fl\u00f3ki\u00f0 og getur veri\u00f0 krefjandi. Hins vegar er ekki \u00f3m\u00f6gulegt
  a\u00f0 vera laus vi\u00f0 \u00fe\u00e1. Byrja\u00f0u \u00e1 \u00fev\u00ed a\u00f0
  skr\u00e1 allar neikv\u00e6\u00f0ar hugsanir sem \u00fe\u00fa hefur. \u00deegar
  \u00fe\u00fa hefur loki\u00f0 vi\u00f0 listann skaltu byrja a\u00f0 strika yfir
  \u00fe\u00e1 og skrifa \u00fat hva\u00f0 er satt \u00ed sta\u00f0inn. Eins og \u00fe\u00fa
  breytir \u00fev\u00ed sem \u00fe\u00fatr\u00fa\u00f0u \u00e1 sj\u00e1lfan \u00feig
  og lygar innri gagnr\u00fdnandans innra me\u00f0 \u00fe\u00e9r, \u00fe\u00fa munt
  komast a\u00f0 \u00fev\u00ed a\u00f0 \u00feeir fara a\u00f0 missa vald sitt yfir
  \u00fe\u00e9r.\\nVeldu a\u00f0 tala vingjarnlega vi\u00f0 sj\u00e1lfan \u00feig
  og segja bara hluti sem \u00fe\u00fa myndir vilja a\u00f0 a\u00f0rir seg\u00f0u
  um \u00fe\u00fa. Ef \u00fe\u00e9r mistekst, seg\u00f0u vi\u00f0 sj\u00e1lfan \u00feig
