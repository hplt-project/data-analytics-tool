sample: '["\"Sk\u00ed\u00f0atilbo\u00f0 hj\u00e1 Lamb Inn! Tilbo\u00f0 \u00e1 gistingu
  og morgunver\u00f0i \u00ed tv\u00e6r n\u00e6tur og einn 3ja r\u00e9tta kv\u00f6ldver\u00f0ur
  (drykkir ekki innifaldir) \u00e1 Lamb Inn sem er hl\u00fdlegt gistiheimili og veitingasta\u00f0ur
  \u00ed Eyjafjar\u00f0arsveit, a\u00f0eins 10 km su\u00f0ur af Akureyri. Ver\u00f0
  fyrir tveggja manna herbergi er 36.800,- kr.\\n\u00d6ll herbergin eru me\u00f0 s\u00e9r
  ba\u00f0herbergi og h\u00e6gt er a\u00f0 nota snertilausa afgrei\u00f0slu vi\u00f0
  innskr\u00e1ningu \u00e1 gistiheimili\u00f0.\\n\u00d6ruggt umhverfi \u00ed sveitinni
  og heillandi \u00fats\u00fdni yfir bygg\u00f0ina og formf\u00f6gur fj\u00f6ll. \u00c1
  sta\u00f0num er upphitu\u00f0 geymsla fyrir sk\u00ed\u00f0ab\u00fana\u00f0 og vinnuherbergi
  fyrir vi\u00f0hald og vi\u00f0ger\u00f0ir. Innifali\u00f0 er a\u00f0gangur a\u00f0
  heitum potti me\u00f0 fallegri fjallas\u00fdn. Bar og matur \u00e1 Fimbul Caf\u00e9.\"",
  "\"Helga \u00de\u00f3rsd\u00f3ttir s\u00fdningarstj\u00f3ri r\u00e6\u00f0ir vi\u00f0
  gesti um s\u00fdninguna R\u00e1s \u00ed Hafnarborg sunnudaginn 14. september kl.
  15.\\nHelga \u00de\u00f3rsd\u00f3ttir er menningarfr\u00e6\u00f0ingur auk \u00feess
  sem h\u00fan er menntu\u00f0 \u00ed myndlist og innanh\u00fassarkitekt\u00far. Helga
  hefur starfa\u00f0 sem innanh\u00fasarkitekt, vi\u00f0 h\u00f6nnun, verkefnastj\u00f3rnun,
  h\u00f6nnun leikmynda og s\u00fdningarb\u00e1sa og sem lei\u00f0s\u00f6guma\u00f0ur
  \u00e1 \u00cdslandi og \u00ed Par\u00eds. Sem myndlistarma\u00f0ur hefur h\u00fan
  haldi\u00f0 og teki\u00f0 \u00fe\u00e1tt \u00ed fj\u00f6lda s\u00fdninga og einnig
  komi\u00f0 a\u00f0 textaskrifum um myndlist, en s\u00fdningin \u00ed Hafnarborg
  er hennar fyrsta sj\u00e1lfst\u00e6\u00f0a s\u00fdningarstj\u00f3rnarverkefni.\\nR\u00e1s
  er s\u00fdning \u00fear sem teflt er saman verkum \u00e1hugaver\u00f0ra listamanna
  sem \u00feekktir eru fyrir a\u00f0 gera hugl\u00e6gri reynslu efnisleg skil \u00e1
  \u00e1hrifar\u00edkan h\u00e1tt. \u00c1 s\u00fdningunni eru n\u00fd verk eftir myndlistarmennina
  Dan\u00edel Magn\u00fasson (f. 1958), Gu\u00f0r\u00fanu Hr\u00f6nn Ragnarsd\u00f3ttur
  (f. 1956), \u00cdvar Brynj\u00f3lfsson (f. 1960), \u00cdvar Valgar\u00f0sson (f.
  1954), S\u00f3lveigu A\u00f0alsteinsd\u00f3ttur (f. 1955) og \u00de\u00f3ru Sigur\u00f0ard\u00f3ttur
  (f. 1954). Markmi\u00f0 s\u00fdningarstj\u00f3rans me\u00f0 stefnum\u00f3ti \u00feessara
  listamanna er a\u00f0 varpa lj\u00f3si \u00e1 samt\u00edmalistsk\u00f6pun sem afl
  umbreytinga og farveg fyrir n\u00fdjar hugsanir og hugmyndir.\"", "\"Fars\u00e6l
  innlei\u00f0ing stefnu. Ranns\u00f3kn me\u00f0al \u00edslenskra fyrirt\u00e6kja\\n\u00cdslensk
  fyrirt\u00e6ki eiga langt \u00ed land me\u00f0 a\u00f0 st\u00edga markvisst til
  jar\u00f0ar \u00feegar kemur a\u00f0 innlei\u00f0ingu stefnum\u00f3tunar \u00fe\u00f3
  f\u00e6ra megi r\u00f6k fyrir \u00fev\u00ed a\u00f0 \u00fea\u00f0 s\u00e9 eitt mikilv\u00e6gasta
  skrefi\u00f0 \u00ed ferlinu. Styrkja \u00fearf skipulag innlei\u00f0ingar verulega
  b\u00e6\u00f0i me\u00f0 betri a\u00f0ger\u00f0abindingu \u00e1 stefnu og \u00e1rangursmati
  \u00fat fr\u00e1 sk\u00fdrum markmi\u00f0um sem og \u00fe\u00e1ttt\u00f6ku starfsmanna
  \u00ed ferlinu.\\n\u00cd s\u00ed\u00f0asta t\u00f6lubla\u00f0i Strauma voru kynntar
  ni\u00f0urst\u00f6\u00f0ur ranns\u00f3knar um st\u00f6\u00f0u \u00fdmissa \u00fe\u00e1tta
  tengda stefnum\u00f3tun hj\u00e1 fyrirt\u00e6kjum \u00e1 \u00cdslandi. \u00dea\u00f0
  kom t\u00f6luvert \u00e1 \u00f3vart \u00ed \u00feeirri k\u00f6nnun hversu afdr\u00e1ttarlausar
  margar af \u00feeim ni\u00f0urst\u00f6\u00f0um voru. \u00dear kom me\u00f0al annars
  fram a\u00f0 58% fyrirt\u00e6kja telja sig hafa sk\u00fdra a\u00f0greiningu \u00e1
  marka\u00f0i og 77% stj\u00f3rnenda t\u00f6ldu a\u00f0 \u00ed stefnunni f\u00e6list
  sk\u00fdr s\u00fdn \u00e1 lykilmarkh\u00f3pa. Okkar reynsla \u00ed vinnu me\u00f0
  fyrirt\u00e6kjum hefur hins vegar oftar en ekki leitt \u00ed lj\u00f3s a\u00f0 \u00feessir
  \u00fe\u00e6ttir \u00fearfnast sko\u00f0unar og betri skilgreiningar. \u00dea\u00f0
  sem g\u00e6ti sk\u00fdrt \u00feessar ofurj\u00e1kv\u00e6\u00f0u ni\u00f0urst\u00f6\u00f0ur
  getur haft me\u00f0 mannlegt e\u00f0li a\u00f0 gera. Ef \u00fe\u00fa spyr\u00f0
  hvern sem er hvort hann s\u00e9 betri b\u00edlstj\u00f3ri en me\u00f0alb\u00edlstj\u00f3rinn
  eru um 80% manna l\u00edkleg til a\u00f0 segja a\u00f0 \u00feau s\u00e9u yfir me\u00f0allagi.
  \u00deetta er sk\u00fdrt \u00ed fr\u00e6\u00f0unum sem skynvilltir yfirbur\u00f0ir
  (e. illusory superiority). Skynvilltir yfirbur\u00f0ir l\u00fdsa \u00feannig raunverulegri
  og \u00fatbreiddri heg\u00f0un \u00fear sem einstaklingar ofmeta eigin afrek og
  getu \u00ed samanbur\u00f0i vi\u00f0 a\u00f0ra. \u00deetta er \u00f3sj\u00e1lfr\u00e1tt
  mannlegt e\u00f0li, en um lei\u00f0 \u00f3skhyggja um hvernig hlutir eiga a\u00f0
  falla. Ein lei\u00f0in til a\u00f0 komast framhj\u00e1 svona matsskekkjum er a\u00f0
  spyrja s\u00e9rt\u00e6kari spurninga um afmarka\u00f0a \u00fe\u00e6tti sem saman
  gefa v\u00edsbendingu um st\u00f6\u00f0u hinnar st\u00e6rri ranns\u00f3knarspurningar.
  Til a\u00f0 fylgja \u00feessu eftir og rannsaka m\u00e1li\u00f0 n\u00e1nar ger\u00f0i
  Capacent n\u00fdja ranns\u00f3kn sem sneri a\u00f0 \u00fev\u00ed hversu vel \u00edslensk
  fyrirt\u00e6ki v\u00e6ru a\u00f0 vinna a\u00f0 innlei\u00f0ingu stefnu sinnar.\\nEr
  stefna til sta\u00f0ar?\\nHugtaki\u00f0 stefnum\u00f3tun og s\u00fa vinna sem h\u00fan
  kallar \u00e1 hefur \u00e1 undanf\u00f6rnum \u00e1rum n\u00e1\u00f0 a\u00f0 festast
  betur \u00ed sessi \u00ed \u00edslensku atvinnul\u00edfi. M\u00f6rg fyrirt\u00e6ki
  \u00feurftu nau\u00f0synlega a\u00f0 breyta \u00e1herslum s\u00ednum eftir hrun
  og mikilv\u00e6gara var en \u00e1\u00f0ur a\u00f0 marka \u00fe\u00e6r \u00e1herslur
  sem einkenna \u00e6ttu n\u00fdja framt\u00ed\u00f0. \u00cd grunninn er m\u00f3tun
  stefnu einfaldlega s\u00fdn \u00e1 hvert fyrirt\u00e6ki\u00f0 stefnir og hver s\u00fa
  verjanlega s\u00e9rsta\u00f0a er sem gerir \u00fev\u00ed kleift a\u00f0 sigra \u00ed
  samkeppni. M\u00f3tun stefnu sn\u00fdst \u00fev\u00ed fyrst og s\u00ed\u00f0ast
  um herna\u00f0ar\u00e1\u00e6tlun.\\n\u00cd skynsamlegri framt\u00ed\u00f0ars\u00fdn
  koma \u00feessir \u00fe\u00e6ttir fram.\\nS\u00e9 horft til ranns\u00f3knar okkar
  m\u00e1 sj\u00e1 a\u00f0 t\u00e6plega 40% stj\u00f3rnenda t\u00f6ldu sig ekki vera
  me\u00f0 skilgreinda og kynnta framt\u00ed\u00f0ars\u00fdn. N\u00fa m\u00e1 velta
  fyrir s\u00e9r hvort \u00f3e\u00f0lilegt s\u00e9 a\u00f0 spyrja um tilveru og kynningu
  \u00ed s\u00f6mu spurningunni, en hafa ber \u00ed huga a\u00f0 ef framt\u00ed\u00f0ars\u00fdnin
  er einungis \u00ed sk\u00faffu \u00e6\u00f0sta stj\u00f3rnanda \u00fe\u00e1 hefur
  sl\u00edk s\u00fdn enga hvatningu \u00ed f\u00f6r me\u00f0 s\u00e9r gagnvart starfsm\u00f6nnunum
  sem hafa \u00fe\u00f3 mest \u00e1hrif \u00e1 \u00fea\u00f0 hvernig s\u00fa s\u00fdn
  getur or\u00f0i\u00f0 a\u00f0 veruleika.\\nS\u00e9 r\u00fdnt n\u00e1nar \u00ed greiningarbreytur
  m\u00e1 sj\u00e1 a\u00f0 \u00ed fyrirt\u00e6kjum me\u00f0 yfir 100 starfsmenn eru
  enn um 27% fyrirt\u00e6kja ekki me\u00f0 skilgreinda og kynnta framt\u00ed\u00f0ars\u00fdn.
  H\u00e9r er tv\u00edm\u00e6lalaust \u00fe\u00f6rf \u00e1 a\u00f0 gera betur.\\n\u00c1
  t\u00edmum i\u00f0na\u00f0arsamf\u00e9lagsins voru starfsmannam\u00e1l oft falin
  \u00ed launadeild innan fj\u00e1rm\u00e1lasvi\u00f0s en s\u00ed\u00f0an hefur miki\u00f0
  breyst. \u00d6flugir mannau\u00f0sstj\u00f3rar hafa fengi\u00f0 meira v\u00e6gi
  innan skipulags fyrirt\u00e6kja sem er \u00ed takti vi\u00f0 \u00fer\u00f3un atvinnul\u00edfsins
  \u00fear sem s\u00edfellt fleiri starfsmenn eru \u00feekkingarstarfsmenn en ekki
  f\u00f3lk sem er \u201er\u00e1\u00f0i\u00f0 upp a\u00f0 h\u00e1lsi\u201c eins og
  algengt var \u00e1\u00f0ur fyrr. S\u00fa mikla vakning sem \u00e1tt hefur s\u00e9r
  sta\u00f0 \u00ed umr\u00e6\u00f0unni um mikilv\u00e6gi mannau\u00f0s ger\u00f0um
  vi\u00f0 r\u00e1\u00f0 fyrir a\u00f0 myndi skila s\u00e9r \u00ed stefnu \u00ed mannau\u00f0sm\u00e1lum,
  en a\u00f0eins 35% stj\u00f3rnenda t\u00f6ldu sig hafa sl\u00edka stefnu \u00ed
  s\u00ednu fyrirt\u00e6ki.\\nA\u00f0 okkar mati er b\u00e6\u00f0i stefna \u00ed mannau\u00f0sm\u00e1lum
  og gildi lykil\u00fe\u00e6ttir vi\u00f0 a\u00f0 hrinda stefnu \u00ed framkv\u00e6md.
  L\u00edmi\u00f0 \u00ed mannau\u00f0sm\u00e1lum eru lifandi og virk gildi og stj\u00f3rnun
  me\u00f0 gildum (e. management by values) er grunnforsenda langt\u00edma\u00e1rangurs
  fyrirt\u00e6kja og stofnana. Stundum eru gildi einungis or\u00f0 upp \u00e1 vegg
  en hafa \u00ed raun ekki veri\u00f0 innleidd me\u00f0 \u00feeim h\u00e6tti a\u00f0
  \u00feau hafi raunveruleg \u00e1hrif \u00e1 innri og ytri samskipti og heg\u00f0un
  starfsmanna. \u00deegar vel valin og skilgreind gildi eru hluti af fyrirt\u00e6kjamenningunni
  \u00fe\u00e1 geta \u00feau hins vegar ein og s\u00e9r mynda\u00f0 sterka og verjanlega
  s\u00e9rst\u00f6\u00f0u \u00e1 marka\u00f0i.\\nRanns\u00f3knin s\u00fdndi a\u00f0
  a\u00f0eins 40% af fyrirt\u00e6kjum t\u00f6ldu sig hafa samkeppnis- e\u00f0a marka\u00f0sgreiningu
  um \u00fea\u00f0 sem skapar \u00feeim forskot \u00e1 marka\u00f0i. \u00dea\u00f0
  er ekki g\u00f3\u00f0 ni\u00f0ursta\u00f0a. \u00dea\u00f0 er lykilatri\u00f0i a\u00f0
  stj\u00f3rnendur \u00feekki markh\u00f3pana og \u00fearfir \u00feeirra, \u00fev\u00ed
  s\u00e9rsta\u00f0a fyrirt\u00e6kis er einskis vir\u00f0i nema einsleitir, n\u00f3gu
  fj\u00f6lmennir h\u00f3par vi\u00f0skiptavina me\u00f0 kaupgetu og -vilja s\u00e9u
  \u00e1 marka\u00f0num. Br\u00fdnt er a\u00f0 huga a\u00f0 \u00fev\u00ed hverjir
  eru raunverulegir yfirbur\u00f0ir gagnvart \u00feessum markh\u00f3pum \u00e1 hverjum
  t\u00edma, hverjar eru \u00fe\u00e6r almennu kr\u00f6fur sem marka\u00f0urinn gerir
  og eru n\u00e1nast a\u00f0eins a\u00f0g\u00f6ngumi\u00f0i a\u00f0 leiknum og hva\u00f0a
  \u00fe\u00e6ttir skapa samkeppnisyfirbur\u00f0i gagnvart tilteknum markh\u00f3pum.\\n\u00deekking
  \u00e1 stefnu me\u00f0al starfsmanna\\n\u00deeir sem ekki t\u00f6ldu sig hafa m\u00f3ta\u00f0
  og kynnt stefnu \u00ed s\u00ednu fyrirt\u00e6ki voru ekki spur\u00f0ir frekari spurninga.
  \u00c1hugavert var hins vegar a\u00f0 f\u00e1 fram hj\u00e1 hinum hversu vel \u00feeir
  telji a\u00f0 starfsmenn \u00feeirra \u00feekki stefnu fyrirt\u00e6kisins. H\u00e9r
  \u00e1 s\u00ed\u00f0unni m\u00e1 sj\u00e1 ni\u00f0urst\u00f6\u00f0ur \u00feessarar
  spurningar en um 76% stj\u00f3rnenda t\u00f6ldu a\u00f0 starfsmenn hafi mj\u00f6g
  e\u00f0a frekar mikla \u00feekkingu \u00e1 stefnu fyrirt\u00e6kisins. \u00deetta
  eru \u00e1n\u00e6gjulegar ni\u00f0urst\u00f6\u00f0ur en vonandi er ekki h\u00e9r
  um a\u00f0 r\u00e6\u00f0a skynvillta yfirbur\u00f0i. \u00c1hugavert v\u00e6ri a\u00f0
  spyrja starfsf\u00f3lk \u00feessara fyrirt\u00e6kja hver s\u00e9 \u00feeirra \u00feekking
  \u00e1 stefnu fyrirt\u00e6kis s\u00edns. Margir stj\u00f3rnendur velta fyrir s\u00e9r
  hva\u00f0 s\u00e9 vi\u00f0eigandi a\u00f0 verja miklum t\u00edma til a\u00f0 tala
  um stefnum\u00f3tun fyrirt\u00e6kisins \u00ed einhverri mynd. \u00dev\u00ed spur\u00f0um
  vi\u00f0 hvort stj\u00f3rnendur teldu a\u00f0 \u00feeir ver\u00f0u of miklum e\u00f0a
  of litlum t\u00edma til a\u00f0 tala um stefnuna. Um 40% af stj\u00f3rnendum fyrirt\u00e6kja
  \u00ed ranns\u00f3kninni t\u00f6ldu sig ekki verja n\u00e6gum t\u00edma til a\u00f0
  tala um stefnuna. Ef ekki er vari\u00f0 t\u00edma til a\u00f0 tala um stefnuna eru
  minni l\u00edkur \u00e1 a\u00f0 innlei\u00f0ing takist \u00fev\u00ed \u00ed \u00feekkingarsamf\u00e9laginu
  \u00feurfa allir starfsmenn a\u00f0 leggja sitt af m\u00f6rkum til a\u00f0 fyrirt\u00e6ki\u00f0
  n\u00e1i settu marki. Samkv\u00e6mt okkar reynslu er ekki n\u00f3g a\u00f0 beina
  umr\u00e6\u00f0u um stefnu \u00ed \u201es\u00e9rt\u00e6ka vi\u00f0bur\u00f0i\u201c
  s.s. stefnum\u00f3tunardag, heldur \u00fearf umr\u00e6\u00f0a um stefnu og \u00e1herslur
  a\u00f0 vera e\u00f0lilegur \u00fe\u00e1ttur \u00ed samskiptum innan fyrirt\u00e6kis
  hvort sem tala\u00f0 er vi\u00f0 einn, t\u00f3lf e\u00f0a hundra\u00f0 og tuttugu
  og einn. \u00cd \u00feeim tilfellum sem vi\u00f0 sj\u00e1um \u00feetta best heppna\u00f0
  hefur regluleg umr\u00e6\u00f0a s\u00eda\u00f0 \u00feessi m\u00e1l inn \u00ed vitund
  allra starfsmanna.\\nE\u00f0lilegt er fyrir stj\u00f3rnanda a\u00f0 hafa \u00fe\u00e1
  tilfinningu a\u00f0 hann e\u00f0a h\u00fan s\u00e9 st\u00f6\u00f0ugt a\u00f0 tala
  um stefnuna. K\u00fanstin er a\u00f0 nota fj\u00f6lbreyttar lei\u00f0ir vi\u00f0
  a\u00f0 mi\u00f0la stefnu og lykil\u00e1herslum hennar \u00e1 markvissan og au\u00f0skiljanlegan
  h\u00e1tt. Ranns\u00f3knir hafa s\u00fdnt a\u00f0 starfsf\u00f3lk \u201ekaupir\u201c
  ekki stefnu\u00e1herslur fr\u00e1 yfirstj\u00f3rn fyrr en \u00fea\u00f0 hefur fengi\u00f0
  samst\u00e6\u00f0 skilabo\u00f0 me\u00f0 \u00f3l\u00edkum lei\u00f0um s.s. \u00e1
  fundum, \u00ed t\u00f6lvup\u00f3stum, samt\u00f6lum, kynningum og s\u00ed\u00f0ast
  en ekki s\u00edst, verkum yfirstj\u00f3rnar. Vi\u00f0 fylgdum \u00feessari spurningu
  eftir me\u00f0 \u00fev\u00ed a\u00f0 spyrja hva\u00f0 stj\u00f3rnendur telji sig
  verja m\u00f6rgum klukkustundum a\u00f0 me\u00f0altali \u00ed viku hverri til a\u00f0
  tala um stefnum\u00e1l. Um 55% stj\u00f3rnenda v\u00f6r\u00f0u 2 klukkustundum \u00e1
  viku e\u00f0a minna \u00ed \u00feessa umr\u00e6\u00f0u. Ef vi\u00f0 setjum \u00feetta
  \u00ed samhengi \u00fe\u00e1 segist me\u00f0alstj\u00f3rnandi \u00e1 \u00cdslandi
  vinna um 50 - 55 klst. \u00e1 viku sem \u00fe\u00fd\u00f0ir a\u00f0 flestir stj\u00f3rnendur
  setja 3 - 4% af vinnut\u00edma s\u00ednum \u00ed a\u00f0 r\u00e6\u00f0a stefnum\u00f3tandi
  m\u00e1l. G\u00f3\u00f0u fr\u00e9ttirnar eru samt a\u00f0 30% \u00feeirra sem telja
  sig verja h\u00e6filega miklum t\u00edma til umr\u00e6\u00f0u um stefnu eru a\u00f0
  verja 5 - 6 klst \u00e1 viku til \u00feessarar umr\u00e6\u00f0u. Markmi\u00f0i\u00f0
  er a\u00f0 tenging vi\u00f0 stefnu og framt\u00ed\u00f0ars\u00fdn fyrirt\u00e6kis
  ver\u00f0i e\u00f0lilegur og \u00f3rj\u00fafanlegur \u00fe\u00e1ttur \u00ed or\u00f0i
  og \u00e6\u00f0i stj\u00f3rnandans alla daga.\\nM\u00e6lingar \u00e1 \u00e1rangri\\nStefna
  er sett til a\u00f0 n\u00e1 fram \u00e1rangri \u00ed starfsemi fyrirt\u00e6kisins.
  Hvernig s\u00e1 \u00e1rangur er m\u00e6ldur er \u00e1hugaver\u00f0ur vinkill. \u00dev\u00ed
  spur\u00f0um vi\u00f0 \u00edslenska stj\u00f3rnendur hverjir \u00feeirra \u00e1rangursm\u00e6likvar\u00f0ar
  v\u00e6ru. \u00dea\u00f0 sem vekur strax athygli er a\u00f0 70% fyrirt\u00e6kja
  hafa ekki neina m\u00e6likvar\u00f0a \u00e1 svi\u00f0i mannau\u00f0s. \u00deetta
  eru sl\u00e6mar ni\u00f0urst\u00f6\u00f0ur enda um m\u00e6likvar\u00f0a a\u00f0
  r\u00e6\u00f0a sem hafa mikil forsp\u00e1rgildi um g\u00e6\u00f0i \u00fej\u00f3nustu
  sem aftur tengist \u00e1n\u00e6gju vi\u00f0skiptavina og \u00feannig vi\u00f0haldi
  og vexti tekjustofna. M\u00e6lingar geta byggt \u00e1 vinnusta\u00f0agreiningum,
  starfsmannaveltu, \u00feekkingu, vi\u00f0horfi og fleiru.\\n\u00deessar ni\u00f0urst\u00f6\u00f0ur
  eru v\u00edsbendingar um skort \u00e1 skilningi um mikilv\u00e6gi mannau\u00f0sins.
  Ef stj\u00f3rnandi veit ekki um l\u00ed\u00f0an starfsmanna getur honum yfirs\u00e9st
  r\u00f3t vandam\u00e1la sem valda \u00fev\u00ed a\u00f0 stefna er ekki innleidd
  og fyrirt\u00e6ki\u00f0 n\u00e6r ekki markmi\u00f0um s\u00ednum. Einnig vekur athygli
  a\u00f0 \u00e1 t\u00edmum sem \u00feessum \u00fear sem samkeppni er har\u00f0nandi,
  b\u00e6\u00f0i erlendis fr\u00e1 og me\u00f0 n\u00fdjum dreifilei\u00f0um \u00e1
  v\u00f6rum og \u00fej\u00f3nustu, a\u00f0 innan vi\u00f0 40% stj\u00f3rnenda fylgjast
  me\u00f0 m\u00e6likv\u00f6r\u00f0um um \u00e1rangur \u00e1 marka\u00f0i. \u00deetta
  eru m\u00e6likvar\u00f0ar sem m\u00e6la g\u00e6\u00f0i \u00fej\u00f3nustu, \u00edmynd,
  hlutdeild \u00e1 marka\u00f0i, hlutfall heildarvi\u00f0skipta vi\u00f0skiptavinar
  (e. share of wallet) og fleira. Ef ekki er m\u00e6lt eru markmi\u00f0 tilgangsl\u00edtil
  og erfitt a\u00f0 sty\u00f0ja vi\u00f0 \u00e1kvar\u00f0anir og a\u00f0ger\u00f0ir
  \u00ed tengslum vi\u00f0 innlei\u00f0ingu stefnunnar \u00darb\u00f3tavinna ver\u00f0ur
  \u00f3markviss og \u00e1rangursmat hugl\u00e6gt.\\nTv\u00f6 af hverjum \u00feremur
  fyrirt\u00e6kjum \u00ed ranns\u00f3kninni hafa fj\u00e1rhagslega m\u00e6likvar\u00f0a.
  E\u00f0li sl\u00edkra m\u00e6likvar\u00f0a er a\u00f0 \u00feeir eru oftast afturvirkir.
  \u00deeir gefa uppl\u00fdsingar um tekjur og kostna\u00f0 sem b\u00fai\u00f0 er
  skr\u00e1. M\u00e6lingar um \u00e1n\u00e6gju og trygg\u00f0 vi\u00f0skiptavina og
  l\u00ed\u00f0an starfsmanna hafa hins vegar forsp\u00e1rgildi um hva\u00f0 fj\u00e1rhagsm\u00e6likvar\u00f0arnir
  muni m\u00e6la \u00e1 n\u00e6stu misserum. S\u00e9u spurningar aftur sko\u00f0a\u00f0ar
  \u00ed samhengi m\u00e1 sj\u00e1 a\u00f0 fyrirt\u00e6ki sem gerir reglulegar \u00fej\u00f3nustu-
  og marka\u00f0sm\u00e6lingar er r\u00edflega tv\u00f6falt l\u00edklegra til a\u00f0
  telja starfsmenn vel uppl\u00fdsta um stefnu fyrirt\u00e6kisins.\\nUm 20% fyrirt\u00e6kja
  sta\u00f0festu a\u00f0 \u00feau geri engar reglulegar \u00e1rangursm\u00e6lingar.
  \u00dea\u00f0 eru l\u00edklega fyrirt\u00e6kin \u00fear sem \u201ea\u00f0 vera\u201c
  er markmi\u00f0i\u00f0 frekar en \u201ea\u00f0 ver\u00f0a\u201c. \u00cd \u00feessum
  h\u00f3pi felast s\u00f3knarf\u00e6ri fyrir samkeppnisa\u00f0ila og fj\u00e1rfesta.\\nTengsl
  starfsmanna vi\u00f0 \u00e1rangur\\nMikilv\u00e6gt er a\u00f0 m\u00e6likvar\u00f0ar
  um \u00e1rangur hr\u00edslist ni\u00f0ur fyrirt\u00e6ki\u00f0 \u00feannig a\u00f0
  allar einingar innan skipulags hafi sk\u00fdra s\u00fdn \u00e1 hva\u00f0 \u00ed
  stefnu\u00e1herslum f\u00e9lagsins fellur undir \u00feeirra \u00e1hrifasv\u00e6\u00f0i.
  Best er ef \u00e1rangursm\u00e6likvar\u00f0ar n\u00e1 alla lei\u00f0 ni\u00f0ur
  \u00e1 einstaklingana og \u00fe\u00e1 \u00feannig a\u00f0 sta\u00f0an s\u00e9 r\u00fdnd
  reglulega af starfsmanni og n\u00e6sta yfirmanni \u00ed frammist\u00f6\u00f0usamtali.
  \u00dev\u00ed spur\u00f0um vi\u00f0: \u201eFer fram reglulegt og formlegt frammist\u00f6\u00f0umat
  og endurgj\u00f6f me\u00f0al starfsmanna/stj\u00f3rnenda \u00ed \u00fe\u00ednu fyrirt\u00e6ki?\u201c\\nInnan
  vi\u00f0 helmingur fyrirt\u00e6kja \u00ed k\u00f6nnuninni kanna\u00f0ist vi\u00f0
  a\u00f0 skipuleggja samt\u00f6l sem hafa \u00e1herslu \u00e1 frammist\u00f6\u00f0u
  einstaklings \u00ed starfi. \u00deetta er d\u00f6pur ni\u00f0ursta\u00f0a. \u00d6ll
  fyrirt\u00e6ki me\u00f0 metna\u00f0 \u00e6ttu a\u00f0 skipuleggja sl\u00edk samt\u00f6l.
  Ekki a\u00f0eins eru \u00feau mikilv\u00e6g til a\u00f0 hafa \u00e1hrif \u00e1 heg\u00f0un
  me\u00f0 \u00fev\u00ed a\u00f0 benda \u00e1 hva\u00f0 starfsma\u00f0ur hefur b\u00e6tt
  \u00ed frammist\u00f6\u00f0u sinni heldur er \u00fearna einstakt t\u00e6kif\u00e6ri
  til a\u00f0 tengja starf starfsmannsins vi\u00f0 mikilv\u00e6ga \u00e1rangursm\u00e6likvar\u00f0a.
  Sl\u00edk samt\u00f6l eru auk \u00feess upphafspunktur \u00e1 \u00fdmiskonar lei\u00f0r\u00e9ttandi
  endurgj\u00f6f sem getur hvatt starfsmann til \u00farb\u00f3tavinnu e\u00f0a til
  a\u00f0 s\u00e6kja vi\u00f0b\u00f3tar\u00feekkingu. Stj\u00f3rnendur \u00ed dag
  finna fyrir \u00fev\u00ed a\u00f0 or\u00f0i\u00f0 hefur breyting \u00e1 kr\u00f6fum
  starfsf\u00f3lks til endurgjafar.\\nUngt f\u00f3lk er ekki a\u00f0 r\u00e1\u00f0a
  sig til \u00e6vilangrar vistar hj\u00e1 fyrirt\u00e6kjum heldur l\u00edtur \u00e1
  hvert starf sem vegfer\u00f0 \u00fear sem saman fara t\u00e6kif\u00e6ri til a\u00f0
  \u00feroska og efla einstaklinginn og n\u00e1 \u00e1rangri \u00ed skapandi umhverfi.
  \u00de\u00f3 vi\u00f0 m\u00e6lum ekki me\u00f0 a\u00f0 frammist\u00f6\u00f0usamt\u00f6l
  ein og s\u00e9r s\u00e9u notu\u00f0 til \u00e1kvar\u00f0ana um \u00e1rangurstengingu
  launa \u00fe\u00e1 m\u00e6lir almenn skynsemi og langt\u00edmahagsmunir hluthafa
  me\u00f0 \u00fev\u00ed a\u00f0 starfsmenn s\u00e9u \u00e1rangurstengdir var\u00f0andi
  \u00fe\u00e1 \u00fe\u00e6tti sem \u00feeir hafa \u00e1hrif \u00e1 og lei\u00f0a
  \u00e1 endanum til fj\u00e1rhagslegs \u00e1vinnings fyrirt\u00e6kisins. Vi\u00f0
  spur\u00f0um \u00fev\u00ed me\u00f0 hva\u00f0a h\u00e6tti laun v\u00e6ru \u00e1kv\u00f6r\u00f0u\u00f0
  \u00ed fyrirt\u00e6kjunum og komu ni\u00f0urst\u00f6\u00f0urnar ekki \u00e1 \u00f3vart
  en \u00ed yfir 80% tilfella eru flestir starfmenn \u00e1 f\u00f6stum launum. \u00cd
  um 10% fyrirt\u00e6kja er \u00fe\u00f3 sta\u00f0an \u00feannig a\u00f0 flestir starfsmenn
  eru \u00e1 \u00e1rangurstengdum launum samhli\u00f0a grunnlaunum.\\nVi\u00f0 spur\u00f0um
  \u00fe\u00e1 sem nota \u00e1rangurstengingar \u00e1 laun \u00e1 hverju \u00fe\u00e6r
  v\u00e6ru bygg\u00f0ar. Sv\u00f6rin voru f\u00e1 og \u00fev\u00ed varasamt a\u00f0
  draga afgerandi ni\u00f0urst\u00f6\u00f0ur en \u00ed lj\u00f3s kom a\u00f0 b\u00e6\u00f0i
  fj\u00e1rhagslegir m\u00e6likvar\u00f0ar og lykil\u00e1rangursm\u00e6likvar\u00f0ar
  eru lag\u00f0ir til grundvallar. Einnig er teki\u00f0 tillit til mats yfirmanns
  og s\u00e9 \u00fea\u00f0 gert formlega eins og \u00ed gegnum sta\u00f0la\u00f0 frammist\u00f6\u00f0usamtal
  m\u00e1 telja \u00fea\u00f0 sanngjarnan m\u00e6likvar\u00f0a til hli\u00f0sj\u00f3nar
  vi\u00f0 sl\u00edka \u00e1rangurstengingu.\\n\u00cd \u00feessum m\u00e1laflokki
  eiga \u00edslensk fyrirt\u00e6ki langa lei\u00f0 \u00ed land a\u00f0 nota r\u00e9tta
  \u00e1rangursm\u00e6likvar\u00f0a og tengja saman umbun og frammist\u00f6\u00f0u.\\nA\u00f0
  s\u00ed\u00f0ustu var spurt hvort markvisst v\u00e6ri teki\u00f0 \u00e1 \u00fev\u00ed
  \u00feegar frammista\u00f0a starfsmanna v\u00e6ri undir v\u00e6ntingum/vi\u00f0mi\u00f0um?
  Um 60% t\u00f6ldu a\u00f0 markvisst s\u00e9 brug\u00f0ist vi\u00f0 og af \u00feeim
  voru 42% sem ekki k\u00f6nnu\u00f0ust vi\u00f0 a\u00f0 hafa neina formlega endurgj\u00f6f
  e\u00f0a \u00e1rlegt frammist\u00f6\u00f0usamtal. Ef frammista\u00f0a er ekki r\u00e6dd
  me\u00f0 formlegum h\u00e6tti en teki\u00f0 markvisst \u00e1 slakri frammist\u00f6\u00f0u
  m\u00e1 lei\u00f0a getum a\u00f0 \u00fev\u00ed a\u00f0 \u00fea\u00f0 sem \u00feessi
  fyrirt\u00e6ki telji vera markvisst s\u00e9 einfaldlega a\u00f0 segja vi\u00f0komandi
  upp st\u00f6rfum.\\nA\u00f0 lokum;\\nLj\u00f3st er a\u00f0 innlei\u00f0ing stefnu,
  og \u00fea\u00f0 sem til \u00fearf vi\u00f0 \u00fea\u00f0 verkefni, er ekki \u00ed
  n\u00f3gu skipul\u00f6g\u00f0um farvegi hj\u00e1 st\u00f3rum h\u00f3pi \u00edslenskra
  fyrirt\u00e6kja. \u00dea\u00f0 er grundvallaratri\u00f0i a\u00f0 n\u00fdta \u00fe\u00e1
  vinnu sem \u00f6flug stefnum\u00f3tun felur \u00ed s\u00e9r og innlei\u00f0a hugmyndafr\u00e6\u00f0i,
  s\u00fdn og \u00e1herslur \u00e1 skipulag\u00f0an h\u00e1tt me\u00f0 \u00fe\u00e1ttt\u00f6ku
  allra starfsmanna. Lykilforsendan er a\u00f0 fyrirt\u00e6ki\u00f0 hafi sk\u00fdra
  og skynsamlega stefnu sem fyrst og s\u00ed\u00f0ast tilgreinir \u00fe\u00e1 s\u00e9rst\u00f6\u00f0u
  sem fyrirt\u00e6ki\u00f0 vill skapa \u00e1 marka\u00f0i og \u00fear me\u00f0 \u00feann
  samkeppnisstyrk sem fyrirt\u00e6ki\u00f0 \u00e6tlar s\u00e9r a\u00f0 byggja s\u00edna
  st\u00f6\u00f0u \u00e1. Ef stefnan sj\u00e1lf er fro\u00f0a er hins vegar tilgangsl\u00edti\u00f0
  a\u00f0 mi\u00f0la henni til starfsmanna; \u00fea\u00f0 b\u00e6tir ekki innihaldi\u00f0
  \u00fe\u00f3tt \u00fev\u00ed s\u00e9 pakka\u00f0 inn \u00ed glansandi umb\u00fa\u00f0ir.
  \u00dea\u00f0 sem \u00e1 eftir kemur sn\u00fdst um a\u00f0ger\u00f0ir og starfsmannam\u00e1l.
  A\u00f0ger\u00f0ir sem skapa hreyfingu \u00e1 st\u00f6\u00f0u fyrirt\u00e6kis \u00ed
  samhlj\u00f3mi vi\u00f0 stefnuna \u00fear sem byggt er \u00e1 markmi\u00f0um og
  m\u00e6lingu \u00e1rangurs \u00e1 lykilsvi\u00f0um starfseminnar sem um lei\u00f0
  eru tengdir frammist\u00f6\u00f0u starfsmanna. Frammist\u00f6\u00f0u sem byggir
  \u00e1 gildum fyrirt\u00e6kis, metna\u00f0i, helgun og vilja til a\u00f0 n\u00e1
  \u00e1rangri me\u00f0 hagsmuni allra \u00ed huga. Ranns\u00f3kn Capacent s\u00fdndi
  svo ekki ver\u00f0ur um villst a\u00f0 \u00edslensk fyrirt\u00e6ki gl\u00edma vi\u00f0
  veika st\u00f6\u00f0u \u00ed fj\u00f6lm\u00f6rgum \u00fe\u00e1ttum sem sn\u00faa
  a\u00f0 stefnum\u00f3tun og innlei\u00f0ingu. \u00c1 \u00feetta ber a\u00f0 l\u00edta
  sem raki\u00f0 s\u00f3knarf\u00e6ri fyrir \u00edslenska stj\u00f3rnendur. \u00deeir
  sem sj\u00e1 \u00feessi t\u00e6kif\u00e6ri og n\u00fdta s\u00e9r \u00feau skapa
  me\u00f0 \u00fev\u00ed \u00e1kve\u00f0na yfirbur\u00f0i gagnvart keppinautum \u00e1
  marka\u00f0i sem ekki er au\u00f0velt a\u00f0 herma eftir.\\n\u00de\u00f3r\u00f0ur
  Sverrisson er r\u00e1\u00f0gjafi hj\u00e1 Capacent.\\nGreinin birtist \u00ed Straumum,
