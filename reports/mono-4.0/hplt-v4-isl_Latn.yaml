  er \u00ed brennidepli,\u201c sag\u00f0i Saulu Rouhinen, forma\u00f0ur d\u00f3mnefndar
  umhverfisver\u00f0launa Nor\u00f0urlandar\u00e1\u00f0s fyrr \u00ed \u00e1r \u00feegar
  tilkynnt var um \u00feema\u00f0.\\nN\u00e1tt\u00faran er grundvallarforsenda allra
  mannlegra athafna. \u00deannig tengjast sk\u00f3gar okkar, bersv\u00e6\u00f0i, almenningsgar\u00f0ar,
  h\u00fasagar\u00f0ar og \u00f6nnur vistkerfi hl\u00fdnun jar\u00f0ar, orku\u00f6flun,
  vatns\u00f6flun, matv\u00e6laframlei\u00f0slu, skipulagi bygg\u00f0ar og heilbrig\u00f0i.\\nOft
  er liti\u00f0 svo \u00e1 \u00ed umr\u00e6\u00f0u um umhverfism\u00e1l a\u00f0 vi\u00f0
  verndun, var\u00f0veislu og eflingu n\u00e1tt\u00farunnar halli \u00e1 hina f\u00e9lagslegu
  e\u00f0a efnahagslegu hli\u00f0 en \u00feannig \u00fearf \u00fea\u00f0 alls ekki
  a\u00f0 vera. K\u00f3r\u00f3nuveirufaraldurinn sem h\u00f3fst \u00e1ri\u00f0 2020
  hefur til d\u00e6mis auki\u00f0 vitund okkar um mikilv\u00e6gi a\u00f0gengis a\u00f0
  n\u00e1tt\u00farunni og l\u00edffr\u00e6\u00f0ilegrar fj\u00f6lbreytni fyrir velfer\u00f0
  okkar og afkomu.\\n\u00deema umhverfisver\u00f0launa Nor\u00f0urlandar\u00e1\u00f0s
  2022 er n\u00e1tt\u00farumi\u00f0a\u00f0ar lausnir. Me\u00f0 \u00feessu \u00feema
  viljum vi\u00f0 vekja athygli \u00e1 \u00fev\u00ed a\u00f0 n\u00e1tt\u00faran og
  n\u00e1tt\u00farustj\u00f3rnun getur lagt l\u00f3\u00f0 s\u00edn \u00e1 vogarsk\u00e1larnar
  me\u00f0 alhli\u00f0a lausnum vi\u00f0 loftslagsvandanum og hnignun l\u00edffr\u00e6\u00f0ilegrar
  fj\u00f6lbreytni \u00e1samt \u00fev\u00ed a\u00f0 tryggja \u00e1rangursr\u00edka
  loftslagsa\u00f0l\u00f6gun \u00ed borgarumhverfi og um lei\u00f0 b\u00e6ta heilbrig\u00f0i
  og velfer\u00f0 f\u00f3lks.\\nMarkmi\u00f0i\u00f0 me\u00f0 n\u00e1tt\u00farumi\u00f0u\u00f0um
  lausnum er vitaskuld misjafnt \u00e1 milli landa, sv\u00e6\u00f0a og verkefna en
  a\u00f0 inntaki eru \u00fe\u00e6r alltaf h\u00e1\u00f0ar e\u00f0a innbl\u00e1snar
  af n\u00e1tt\u00farunni. D\u00e6mi um \u00fea\u00f0 er a\u00f0ger\u00f0 sem l\u00edkir
  eftir n\u00e1tt\u00farunni me\u00f0 tilliti til forms, uppbyggingar e\u00f0a ferlis
  vi\u00f0 framlei\u00f0slu loftslagsv\u00e6nna og endurn\u00fdtanlegra efna. Anna\u00f0
  d\u00e6mi er \u201erewilding\u201c sem felst \u00ed a\u00f0 endurvekja gr\u00f3\u00f0ur-
  og d\u00fdral\u00edf sem ekki er lengur til sta\u00f0ar me\u00f0 n\u00e1tt\u00farulegum
  h\u00e6tti \u00e1 tilteknu sv\u00e6\u00f0i, \u00e1samt \u00fev\u00ed a\u00f0 l\u00e1ta
  n\u00e1tt\u00faruna sj\u00e1 um sig sj\u00e1lfa svo n\u00e1tt\u00faruleg ferli m\u00f3ti
  l\u00f6nd og h\u00f6f, gr\u00e6\u00f0i l\u00f6sku\u00f0 vistkerfi og endurheimti
  ofn\u00fdtt land. \u00cd b\u00e6jum og borgum geta n\u00e1tt\u00farumi\u00f0a\u00f0ar
  lausnir n\u00fdst vi\u00f0 a\u00f0 jafna hita, draga \u00far h\u00e1va\u00f0a og
  hreinsa fr\u00e1rennslisvatn, taka upp rigningarvatn og verja \u00edb\u00faabygg\u00f0
  fyrir fl\u00f3\u00f0um af v\u00f6ldum rigninga. Jafnframt getur gr\u00e6nt og sj\u00e1lfb\u00e6rt
  borgarumhverfi b\u00e6tt velfer\u00f0 r\u00e9tt eins og tengsl vi\u00f0 \u00f3l\u00edkar
  ger\u00f0ir n\u00e1tt\u00faru geta styrkt \u00f3n\u00e6miskerfi l\u00edkamans og
  vari\u00f0 okkur gegn sj\u00fakd\u00f3mum, l\u00e6kka\u00f0 bl\u00f3\u00f0\u00fer\u00fdsting
  og b\u00e6tt andlega heilsu.\\nN\u00e1tt\u00farumi\u00f0a\u00f0ar lausnir efla \u00fev\u00ed
  ekki a\u00f0eins umhverfi\u00f0 og l\u00edffr\u00e6\u00f0ilega fj\u00f6lbreytni
  heldur m\u00e1 einnig b\u00faa svo um a\u00f0 \u00fe\u00e6r skapi f\u00e9lagslegt,
  menningarlegt og fj\u00e1rhagslegt vir\u00f0i.\\nN\u00e1tt\u00farumi\u00f0a\u00f0ar
  lausnir sty\u00f0ja vi\u00f0 heimsmarkmi\u00f0 S\u00de um sj\u00e1lfb\u00e6ra \u00fer\u00f3un
  nr. 14 og 15 sem sn\u00faa a\u00f0 l\u00edfi \u00ed vatni og l\u00edfi \u00e1 landi.
  Me\u00f0 n\u00e1tt\u00farumi\u00f0u\u00f0um lausnum er h\u00e6gt a\u00f0 sty\u00f0ja
  vi\u00f0 \u00feau markmi\u00f0 sem t.a.m. tengjast heilsu og vell\u00ed\u00f0an
  (3), hreinu vatni og hreinl\u00e6tisa\u00f0st\u00f6\u00f0u (6), n\u00fdsk\u00f6pun
  og uppbyggingu (9), sj\u00e1lfb\u00e6rum borgum og samf\u00e9l\u00f6gum (11) og
  a\u00f0ger\u00f0um \u00ed loftslagsm\u00e1lum (13). \u00der\u00f3un n\u00e1tt\u00farumi\u00f0a\u00f0ra
  lausna er eitt \u00feeirra svi\u00f0a sem Norr\u00e6na r\u00e1\u00f0herranefndin
  leggur \u00e1herslu \u00e1 \u00ed framt\u00ed\u00f0ars\u00fdn sinni um gr\u00e6n
  Nor\u00f0url\u00f6nd.\\nFerli\u00f0 framundan\\nTilkynnt ver\u00f0ur um \u00fea\u00f0
  vi\u00f0 ath\u00f6fn \u00ed Nor\u00f0urlandah\u00fasinu \u00ed F\u00e6reyjum hver
  \u00feessara 68 verkefna ver\u00f0a tilnefnd til ver\u00f0launanna. Tilkynnt ver\u00f0ur
  um handhafa umhverfisver\u00f0launa Nor\u00f0urlandar\u00e1\u00f0s 2022 \u00e1 \u00feingi
  Nor\u00f0urlandar\u00e1\u00f0s \u00ed Helsingfors \u00ed n\u00f3vember. Ver\u00f0launahafinn
  hl\u00fdtur a\u00f0 launum 300 \u00fe\u00fasund danskar kr\u00f3nur.\\nFyrri ver\u00f0launahafar\\nUmhverfisver\u00f0laun
  Nor\u00f0urlandar\u00e1\u00f0s voru fyrst veitt \u00e1ri\u00f0 1995 og markmi\u00f0i\u00f0
  me\u00f0 \u00feeim er a\u00f0 efla vitund um n\u00e1tt\u00faru- og umhverfisvernd
  \u00e1 Nor\u00f0url\u00f6ndum.\"", "\"Vir\u00f0ulegi forseti. \u00c9g fagna \u00fev\u00ed
  a\u00f0 vi\u00f0 r\u00e6\u00f0um \u00feessa till\u00f6gu \u00ed dag \u00fev\u00ed
  a\u00f0 mikilv\u00e6gt er a\u00f0 taka \u00e1 \u00fev\u00ed grafalvarlega m\u00e1li
  sem h\u00e9r er til umr\u00e6\u00f0u.\\n\u00deetta vandam\u00e1l hefur veri\u00f0
  \u00feekkt um svol\u00edtinn t\u00edma en aldrei veri\u00f0 teki\u00f0 neitt \u00e1
  \u00fev\u00ed. \u00deegar sl\u00edkt vandam\u00e1l kom upp fyrir austan voru g\u00f3\u00f0
  r\u00e1\u00f0 d\u00fdr \u00fev\u00ed a\u00f0 enginn farvegur var til. \u00c1 endanum
  m\u00e1 \u00feakka fyrir \u00fea\u00f0 a\u00f0 \u00feeir a\u00f0ilar sem komu a\u00f0
  byggingu \u00feeirra h\u00fasa n\u00e1\u00f0u samkomulagi, \u00f6rugglega t\u00edmam\u00f3tasamkomulagi
  um hvernig a\u00f0ilar geta sameinast \u00e1n \u00feess a\u00f0 leggja mikil d\u00f3msm\u00e1l
  og vesen \u00e1 \u00edb\u00faana. \u00dev\u00ed ber a\u00f0 fagna.\\nVan\u00feekking
  f\u00f3lks \u00e1 \u00feessum m\u00e1lum og hversu l\u00edti\u00f0 \u00feau hafa
  veri\u00f0 \u00ed umr\u00e6\u00f0unni getur valdi\u00f0 miklu tj\u00f3ni. \u00deess
  vegna er mj\u00f6g mikilv\u00e6gt a\u00f0 vi\u00f0 hefjum \u00feessa umr\u00e6\u00f0u
  og reynum a\u00f0 koma henni \u00ed \u00feann farveg a\u00f0 koma \u00feessum m\u00e1lum
  \u00ed fastar skor\u00f0ur, vegna \u00feess a\u00f0 \u00feetta tj\u00f3n n\u00e6r
  n\u00e1tt\u00farlega b\u00e6\u00f0i til heilsutj\u00f3ns eins og h\u00e9r hefur
  veri\u00f0 raki\u00f0, \u00feetta er kl\u00e1rlega heilbrig\u00f0ism\u00e1l, og
  svo til fj\u00e1rhagslegs tj\u00f3ns. Hi\u00f0 fj\u00e1rhagslega tj\u00f3n getur
  l\u00edka haft \u00e1hrif \u00e1 heilsu f\u00f3lks, \u00fea\u00f0 setur \u00fea\u00f0
  algj\u00f6rlega \u00ed uppn\u00e1m. \u00dev\u00ed erum vi\u00f0 a\u00f0 s\u00fdna
  mikla \u00e1byrg\u00f0 me\u00f0 \u00fev\u00ed a\u00f0 setja \u00feessa vinnu af
  sta\u00f0 og \u00e9g hlakka miki\u00f0 til a\u00f0 taka \u00fe\u00e1tt \u00ed henni.
  F\u00f3lk er algj\u00f6rlega berskjalda\u00f0 \u00feegar svona laga\u00f0 kemur
  upp, \u00e9g tala n\u00fa ekki um \u00fea\u00f0 s\u00e1lr\u00e6na \u00e1stand sem
  getur skapast \u00feegar heimili ver\u00f0a s\u00fdkt af myglu \u00feannig a\u00f0
  f\u00f3lk getur ekki b\u00fai\u00f0 \u00fear. \u00dea\u00f0 tekur s\u00e1lr\u00e6nt
  \u00e1 f\u00f3lk.\\n\u00dea\u00f0 sem vi\u00f0 gerum \u00ed \u00feessu er a\u00f0
  vi\u00f0 erum a\u00f0 fara af sta\u00f0 me\u00f0 forvarnir. Vi\u00f0 erum a\u00f0
  \u00fatb\u00faa hvernig vi\u00f0 komum \u00ed veg fyrir a\u00f0 \u00feetta vandam\u00e1l
  st\u00e6kki, \u00fea\u00f0 er \u00fev\u00ed mi\u00f0ur komi\u00f0 af sta\u00f0,
  og n\u00fa \u00feurfum vi\u00f0 a\u00f0 leggja \u00e1herslu \u00e1 forvarnir \u00feannig
  a\u00f0 vi\u00f0 komum \u00ed veg fyrir vandann. Og s\u00ed\u00f0an a\u00f0 til
  ver\u00f0i eitthvert ferli sem fer af sta\u00f0 \u00feegar sl\u00edkt m\u00e1l kemur
  upp \u00feannig a\u00f0 f\u00f3lk ver\u00f0i ekki jafn berskjalda\u00f0 og \u00f3\u00f6ruggt
  og standi ekki frammi fyrir a\u00f0 missa heimili sitt \u00e1n \u00feess a\u00f0
  f\u00e1 \u00fea\u00f0 nokku\u00f0 b\u00e6tt.\\n\u00c9g hlakka \u00fev\u00ed til
  a\u00f0 f\u00e1 m\u00e1li\u00f0 \u00ed umhverfis- og samg\u00f6ngunefnd \u00fear
  sem \u00e9g \u00e1 s\u00e6ti og mun \u00e9g vinna \u00fev\u00ed framgang \u00fear
  eins og \u00e9g get. N\u00e1kv\u00e6mleg \u00fatf\u00e6rsla mun ver\u00f0a r\u00e6dd
  \u00fear og munum vi\u00f0 \u00fe\u00e1 hafa samr\u00e6\u00f0ur vi\u00f0 h\u00e6stv.
  fors\u00e6tisr\u00e1\u00f0herra um hugmyndir hans \u00ed \u00fev\u00ed, eins og
  hann hefur tala\u00f0 og h\u00e6stv. r\u00edkisstj\u00f3rn. \u00c9g veit ekki hvort
  \u00d6ssur Skarph\u00e9\u00f0insson vilji ver\u00f0a sj\u00f3\u00f0stj\u00f3ri yfir
  \u00feeim sj\u00f3\u00f0i.\\n\u00c9g veit a\u00f0 vinna f\u00f3r af sta\u00f0 hj\u00e1
  fyrrverandi r\u00edkisstj\u00f3rn \u00ed fors\u00e6tisr\u00e1\u00f0uneytinu a\u00f0
  sko\u00f0a \u00feessi hamfaram\u00e1l og hvernig s\u00e9 best a\u00f0 taka \u00e1
  \u00feeim. \u00c9g veit ekki til \u00feess a\u00f0 \u00feeirri vinnu s\u00e9 loki\u00f0
  en mikil vinna hefur fari\u00f0 fram \u00fear me\u00f0 Almannav\u00f6rnum og fleirum
  og \u00fea\u00f0 er um a\u00f0 gera a\u00f0 b\u00e6ta \u00feessu bara inn \u00ed
  \u00fe\u00e1 vinnu, \u00fe.e. hvort \u00feetta eigi heima \u00ed \u00fev\u00ed ferli
  og kannski ekki \u00e1st\u00e6\u00f0a til a\u00f0 b\u00faa til s\u00e9rsj\u00f3\u00f0
  fyrir \u00feetta endilega. En vi\u00f0 \u00feurfum a\u00f0 taka heildst\u00e6tt
  \u00e1 m\u00e1lunum, ekki a\u00f0 dreifa \u00feeim v\u00ed\u00f0a. \u00c9g held
  a\u00f0 \u00feetta s\u00e9 m\u00e1l sem vi\u00f0 getum \u00f6ll sameinast um.\"",
  "\"-\\n2024-04-12\\n\u00deegar h\u00e1t\u00ed\u00f0irnar eru \u00e1 enda, hefur
