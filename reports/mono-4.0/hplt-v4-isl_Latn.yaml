  \u00fdta ni\u00f0ur myrkrinu og finna gle\u00f0ina.\\nKatie McGarry, \u00ed Pushing
  the Limits, sag\u00f0i: \u201e\u00c9g s\u00e1 heiminn svart \u00e1 hv\u00edtu \u00ed
