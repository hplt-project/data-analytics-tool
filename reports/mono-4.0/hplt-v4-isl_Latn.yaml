  \u00ed brotnum heimi, \u00fear sem f\u00f3lk deyr og stundum mei\u00f0ir a\u00f0ra,
  er a\u00f0 \u00fea\u00f0 er n\u00e6stum \u00f3m\u00f6gulegt a\u00f0 gera \u00fea\u00f0\u00ed
  gegnum l\u00edfi\u00f0 \u00e1n \u00feess a\u00f0 upplifa s\u00e1rsauka vi\u00f0
  a\u00f0 missa einhvern e\u00f0a ver\u00f0a fyrir ska\u00f0a af \u00f6\u00f0rum.
  \u00deessar tegundir taps - innra og ytra - breyta landslagi l\u00edfs \u00fe\u00edns
