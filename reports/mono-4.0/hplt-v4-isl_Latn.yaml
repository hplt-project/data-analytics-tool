  "\"Efnisyfirlit\\nFl\u00f6ktart\u00e1kn & Merking\\n\u00dearftu sm\u00e1 auka orku
  til a\u00f0 komast \u00ed gegnum verkefni? Viltu tj\u00e1 ekta sj\u00e1lf \u00feitt?
  Flicker, sem anda, totem og kraftd\u00fdr, getur hj\u00e1lpa\u00f0! Flicker kennir
  \u00fe\u00e9r hvernig \u00e1 a\u00f0 teygja au\u00f0lindir \u00fe\u00ednar og beisla
  innri eldinn \u00feinn, allt \u00e1 sama t\u00edma og \u00fe\u00fa s\u00fdnir \u00fe\u00e9r
  hvernig \u00e1 a\u00f0 l\u00e1ta pers\u00f3nuleika \u00feinn sk\u00edna! Far\u00f0u
  dj\u00fapt \u00ed fl\u00f6ktandi t\u00e1knm\u00e1l og merkingu til a\u00f0 komast
  a\u00f0 \u00fev\u00ed hvernig \u00feessi Animal Spirit Guide getur styrkt, a\u00f0sto\u00f0a\u00f0
  og lei\u00f0beint \u00fe\u00e9r!\\nFlicker Symbolism & Merking\\nThe Flicker Bird
  er \u00f3kunnugur me\u00f0limur sk\u00f3gar\u00fer\u00f6starfj\u00f6lskyldunnar
  fyrir marga, en b\u00e1\u00f0ir fuglarnir deila m\u00f6rgum t\u00e1knr\u00e6num
  eiginleikum. \u00d3l\u00edkt sk\u00f3gar\u00fer\u00f6stnum grafa Flickers hins vegar
  \u00ed j\u00f6r\u00f0ina til a\u00f0 finna snakki\u00f0 sitt frekar en a\u00f0 banka
  \u00e1 vi\u00f0inn. \u00deeir flytja \u00e1rlega, \u00fear sem sk\u00f3gar\u00fer\u00f6stur
  gera \u00fea\u00f0 ekki, sem \u00fe\u00fd\u00f0ir a\u00f0 fl\u00f6kt endurspeglar
  hringr\u00e1s n\u00e1tt\u00farunnar \u00ed kennslustundum s\u00ednum. Samt, \u00fer\u00e1tt
  fyrir a\u00f0 \u00feeir s\u00e9u \u00f3l\u00edkir, getur lestur Woodpecker t\u00e1knfr\u00e6\u00f0i
  og merkingu veitt frekari inns\u00fdn \u00ed \u00fatlit Flicker sem Animal Spirit
  Guide.\\nEins og allir Woodpeckers, Flickers eru meistarar \u00ed samskiptum. \u00deeir
  pikka \u00fat takt, hlj\u00f3ma eins og \u00e6ttb\u00e1lka \u00ed trj\u00e1num.
  E\u00f0a, ef \u00feeir geta fundi\u00f0 annan \u00e1hugaver\u00f0an h\u00e1v\u00e6ran
  hlut, nota \u00feeir hann \u00ed sta\u00f0inn. Blikk\u00fe\u00f6k vir\u00f0ast vera
  upp\u00e1haldshlj\u00f3\u00f0f\u00e6ri; \u00fe\u00fa getur heyrt \u00e1berandi hlj\u00f3\u00f0i\u00f0
  \u00ed k\u00edl\u00f3metra fjarl\u00e6g\u00f0. Flickers eru ekki feimin vi\u00f0
  a\u00f0 gera l\u00e6ti! \u00deeir syngja bo\u00f0skap til anda \u00fe\u00edns: \u201eLeiktu
  hamingjusamurt\u00f3nlist h\u00e1v\u00e6r og l\u00f6ng!\u201c\\nFl\u00f6kt verpir
  sjaldan \u00ed trj\u00e1holunum sem \u00feeir b\u00e1ru. \u00cd sta\u00f0inn, eins
  og t\u00f3nlistin \u00feeirra, finna \u00feeir \u00f3hef\u00f0bundnar sta\u00f0i
  til a\u00f0 verpa. Sv\u00e6\u00f0i fela \u00ed s\u00e9r yfirgefina sta\u00f0i sem
  \u00feeir nota me\u00f0 \u00fev\u00ed a\u00f0 festa \u00fe\u00e1 \u00e1 r\u00e9ttan
  h\u00e1tt. Enda n\u00e6r snj\u00f6ll l\u00edtil a\u00f0l\u00f6gun langt; h\u00e9r
  kemur fuglinn til a\u00f0 t\u00e1kna \u00fatsj\u00f3narsemi og hugvit.\\nFl\u00f6ktir
  f\u00e1 nafn sitt af litum v\u00e6ngjanna. Undirhli\u00f0 fja\u00f0ranna er glampandi
  gul og rau\u00f0, eins og fl\u00f6ktandi eldslogi. Ef \u00fe\u00fa stendur fyrir
  austan fuglsins muntu sj\u00e1 gult fyrst. \u00deegar \u00fe\u00fa stendur vestan
  vi\u00f0 fl\u00f6kti\u00f0 s\u00e9r\u00f0u fyrst rautt. B\u00e1\u00f0ir litirnir
  gefa Flicker tengsl vi\u00f0 loft- og eldfrumurnar.\\nLj\u00f3sstarfsmenn benda
  til \u00feess a\u00f0 rau\u00f0i liturinn \u00e1 h\u00f6f\u00f0i Flicker, me\u00f0
  litarefni \u00feess svipa\u00f0 r\u00f3tarst\u00f6\u00f0inni, t\u00e1knar \u00feol
  og sk\u00f6punarg\u00e1fu, og r\u00f3tgr\u00f3na \u00e1str\u00ed\u00f0u. Svarti
  h\u00e1lfm\u00e1ninn l\u00edtur \u00fat eins og fyrsta fl\u00eds n\u00fdja tunglsins
  og b\u00fd\u00f0ur upp \u00e1 von, n\u00e6mni og ferskan hring. F\u00e6tur Flicker
  gefa \u00fev\u00ed enn meiri merkingu. \u00dea\u00f0 eru tv\u00e6r t\u00e6r fyrir
  framan og aftan, sem veitir fullkomi\u00f0 jafnv\u00e6gi.\\nSamb\u00f6nd milli fl\u00f6ktanna
  hefjast me\u00f0 danss\u00fdningu. Vals me\u00f0al karlanna \u00fej\u00f3nar ekki
  a\u00f0eins til a\u00f0 bi\u00f0ja um kvenkyns Flicker heldur sendir hann str\u00f6ng
  skilabo\u00f0 til annarra karld\u00fdra \u00e1 sv\u00e6\u00f0inu. Karlkyns Flickers
  mun hafa starandi eldsp\u00fdtu, \u00ed fyrstu standa a\u00f0eins nokkrar tommur
  \u00e1 milli \u00ed kyrr\u00f0.\u00de\u00e1 hallar annar af tveimur karld\u00fdrum
  h\u00f6f\u00f0inu, hli\u00f0 vi\u00f0 hli\u00f0. Annar karlma\u00f0urinn gerir \u00fea\u00f0
  sama \u00e1n l\u00edkamlegrar snertingar. Ef annar karlinn tekur ekki v\u00edsbendingu,
  \u00fe\u00e1 blikkar s\u00e1 fyrsti me\u00f0 gulum v\u00e6ngjum s\u00ednum og kallar.
  Annar karlkyns Flicker fl\u00fdgur \u00ed burtu, eftir a\u00f0 hafa or\u00f0i\u00f0
  lei\u00f0ur \u00e1 \u00f6llu rigmar\u00f3linu. F\u00e6rasti og \u00feolinm\u00f3\u00f0ur
  dansarinn vinnur. Einstakt p\u00f6runarath\u00f6fn \u00feeirra gerir Flicker a\u00f0
  t\u00e1kni \u00ferautseigju og a\u00f0 vinna \u00ed gegnum \u00e1skoranir \u00e1n
  \u00e1r\u00e1sargirni.\\nFlicker Spirit Animal\\n\u00deegar Flicker Spirit Animal
  fl\u00fdgur inn \u00ed tilveru \u00fe\u00edna , vertu tilb\u00fainn fyrir sm\u00e1
  eld \u00ed l\u00edfi \u00fe\u00ednu. Kannski \u00fearftu a\u00f0 koma \u00fe\u00e9r
  af sta\u00f0 \u00ed \u00fer\u00f6ngs\u00fdni verkefni. E\u00f0a kannski \u00fearf
  r\u00f3mant\u00edska l\u00edf \u00feitt a\u00f0 taka mig upp. Flicker mun gera greinarmun
  \u00e1 mismunandi skilabo\u00f0um sem \u00fea\u00f0 flytur og s\u00fdna raunverulegan
  tilgang sinn \u00ed samskiptum s\u00ednum vi\u00f0 \u00feig.\\n\u00d6nnur \u00e1st\u00e6\u00f0a
  fyrir \u00fev\u00ed a\u00f0 Flicker kemur inn \u00ed l\u00edf \u00feitt er \u00feegar
  \u00fe\u00fa ert \u00far jafnv\u00e6gi. \u00de\u00e9r g\u00e6ti fundist \u00fe\u00fa
  vera \u00ed hringi\u00f0u og vi\u00f0 \u00fea\u00f0 a\u00f0 missa alla ge\u00f0heilsu.
  Flicker Spirit Animal kennir \u00fe\u00e9r hvernig \u00e1 a\u00f0 nota \u201ef\u00e6turna\u201c,
  standa \u00feig og standa af \u00fe\u00e9r storminn.\\nFlicker, sem andad\u00fdr,
  hvetur \u00feig til a\u00f0 vera sveigjanlegri. Skilabo\u00f0 fuglsins benda til
  \u00feess a\u00f0 \u00fe\u00fa fylgir fl\u00e6\u00f0inu sem er til sta\u00f0ar \u00ed
  l\u00edfi \u00fe\u00ednu og a\u00f0 \u00fe\u00fa l\u00e6tur ekki sj\u00e1lf \u00feitt
  hindra \u00fea\u00f0 sem g\u00e6ti veri\u00f0 eitthva\u00f0 \u00f3tr\u00falegt.
  Au\u00f0m\u00fdkt n\u00e6r langt. A\u00f0 vera h\u00f3gv\u00e6r \u00fe\u00fd\u00f0ir
  ekki a\u00f0 missa sig fyrir s\u00fdn annarra, heldur a\u00f0 veraf\u00fas til a\u00f0
  gera m\u00e1lami\u00f0lanir til a\u00f0 \u00f6\u00f0last umbun samstarfs.\\n\u00dea\u00f0
  er engin spurning a\u00f0 Flicker Spirit Animal talar til \u00fe\u00edn um takta
  og hringr\u00e1s l\u00edfsins. Hver manneskja hefur andlegan hjartsl\u00e1tt innprenta\u00f0a
  \u00ed s\u00e1l s\u00edna. Innlifun \u00fe\u00edn getur stillt taktinn, b\u00e6tt
  vi\u00f0 hann, st\u00e6kka\u00f0 hann, en grunnur er alltaf eftir sem hi\u00f0 ekta
  sj\u00e1lf. Flicker skorar \u00e1 \u00feig a\u00f0 finna og geyma heilaga taktinn
  \u00feinn og hamra hana heim. \u00deegar \u00fe\u00fa gerir \u00fea\u00f0 muntu
  sj\u00e1 mynstur koma fram \u00ed l\u00edfi \u00fe\u00ednu sem lei\u00f0a \u00feanga\u00f0
  sem \u00fe\u00fa ert \u00ed dag.\\nFlicker Totem Animal\\nF\u00f3lk me\u00f0 Flicker
  Totem Animal hefur \u00f6fluga samhverfu tilfinningu \u00ed l\u00edfi s\u00ednu
  og er samt g\u00f3\u00f0ur m\u00e6likvar\u00f0i \u00e1 \u00f3hef\u00f0bundi\u00f0.
  Lei\u00f0in sem \u00feeir n\u00e1lgast hva\u00f0a vandam\u00e1l e\u00f0a a\u00f0st\u00e6\u00f0ur
  sem er er einstakt, skapandi og sanngjarnt. H\u00f3gv\u00e6rt e\u00f0li gerir f\u00f3lk
  me\u00f0 Flicker Totem a\u00f0 fr\u00e1b\u00e6rum stj\u00f3rnendum og samningam\u00f6nnum
  sem halda alltaf s\u00ednu striki.\\nEf Flicker is your Birth Totem, t\u00e1kna
  hindranir t\u00e6kif\u00e6ri til a\u00f0 flj\u00faga og s\u00fdna pers\u00f3nulega
  fegur\u00f0. Eg\u00f3i\u00f0 rekur ekki h\u00e1t\u00ed\u00f0ina, en sj\u00e1lfs\u00e1st
  gerir \u00fea\u00f0. \u00de\u00fa \u00feekkir bestu eiginleika \u00fe\u00edna og
  hvernig \u00e1 a\u00f0 beita \u00feeim. \u00de\u00fa hefur h\u00e6fileika til a\u00f0
  fara yfir hva\u00f0a markmi\u00f0 sem \u00fe\u00fa setur \u00fe\u00e9r vegna \u00feess
  a\u00f0 \u00fe\u00fa ert tilb\u00fainn a\u00f0 breyta n\u00e1lgun \u00feinni eftir
  \u00fev\u00ed sem hlutirnir \u00fer\u00f3ast.\\nS\u00e9rkenni fl\u00f6ktsins g\u00e6ti
  tj\u00e1\u00f0 sig \u00ed vali \u00fe\u00ednu \u00e1 starfsframa. A\u00f0 \u00e6fa
  n\u00e1lastungur, vera Doula e\u00f0a Distiller g\u00e6ti vaki\u00f0 athygli \u00fe\u00edna.
  Mundu l\u00edka, fl\u00f6kti\u00f0notar gogginn til a\u00f0 tromma \u00fat yfirr\u00e1\u00f0asv\u00e6\u00f0i
  \u00feeirra og la\u00f0a a\u00f0 maka, vernda fj\u00f6lskyldu s\u00edna og b\u00faa
  til lagi\u00f0 \u00feeirra. Svo getur t\u00f3nlist gegns\u00fdrt s\u00e1l \u00fe\u00edna.
  Tromman \u00ed b\u00fa\u00f0arhorninu kallar \u00e1 \u00feig!\\nFlicker Power Animal\\nKalla\u00f0u
  \u00e1 Flicker sem Power Animal \u00feegar \u00fe\u00fa vilt b\u00faa utan kassans,
  en finna sj\u00e1lfan \u00feig \u00e1 skj\u00f6n vi\u00f0 v\u00e6ntingar. The Flicker
  s\u00fdnir \u00fe\u00e9r hvernig \u00e1 a\u00f0 flj\u00faga yfir hva\u00f0a myndir
  sem f\u00f3lk hefur af \u00fe\u00e9r svo \u00fea\u00f0 geti s\u00e9\u00f0 fegur\u00f0
  \u00fe\u00edna og s\u00e9rst\u00f6\u00f0u. Fr\u00e1 n\u00fdju st\u00f6\u00f0unni
  \u00feinni getur\u00f0u s\u00fdnt sj\u00e1lfst\u00e6\u00f0i \u00feitt og n\u00fdjung.
  \u00d6flug undirskrift Flicker \u00e1 l\u00edka vi\u00f0 um samb\u00f6nd \u00fe\u00edn;
  ef \u00fe\u00fa hefur fundi\u00f0 fyrir \u00fev\u00ed a\u00f0 \u00fe\u00fa la\u00f0ast
  a\u00f0 \u00f3v\u00e6ntu sambandi, \u00fe\u00e1 er t\u00e6kif\u00e6ri\u00f0 \u00feitt
  n\u00fana!\\nSj\u00e1 einnig: Chinchilla t\u00e1knm\u00e1l & amp; Merking\u00d6nnur
  \u00e1st\u00e6\u00f0a fyrir \u00fev\u00ed a\u00f0 kalla \u00e1 Flicker sem kraftd\u00fdr
  er \u00feegar \u00fe\u00fa \u00fearft a\u00f0sto\u00f0 vi\u00f0 samskipti. Hugsa\u00f0u
  um Morse k\u00f3\u00f0a: Hann er s\u00e9rstakur, me\u00f0 n\u00e1kv\u00e6mu, \u00e6f\u00f0u
  mynstri, svo vi\u00f0takandinn skilur skilabo\u00f0in. Sk\u00fdr hugsun, tal og
  skrifu\u00f0 or\u00f0 eru f\u00e6rni Flicker Bird Energy ber \u00ed sp\u00f6\u00f0um.
  Nota\u00f0u \u00fea\u00f0 og horf\u00f0u \u00e1 skilningsr\u00edka bl\u00f3ma.\\nT\u00e1knr\u00e6n
  merking innf\u00e6ddra amer\u00edskra fl\u00f6kta\\nIndf\u00e6ddir \u00e6ttkv\u00edslir
  \u00ed Nor\u00f0ur-Amer\u00edku segja a\u00f0 afi s\u00f3l hafi streika\u00f0 h\u00f6fu\u00f0
  Flicker rautt, sem vekur lukku. A\u00f0 finna rau\u00f0u fj\u00f6\u00f0ur fl\u00f6ktsins
  gefur til kynna j\u00e1kv\u00e6\u00f0a breytingu \u00e1 \u00f6rl\u00f6gum, s\u00e9rstaklega
  \u00e1 svi\u00f0i vin\u00e1ttu e\u00f0a almennrar hamingju \u00feinnar. \u00c1 me\u00f0an
  b\u00fd\u00f0ur gula fj\u00f6\u00f0urinn l\u00e6kningu og endurn\u00fdjun.\\nMe\u00f0al
  Hopi,Flicker er verndari Southern Quarter of Creation. Chippewa-hj\u00f3nin l\u00edta
  \u00e1 Flicker sem hugr\u00f6kk veru. Lyfi\u00f0 er \u00f6flugast \u00e1 t\u00edmabilinu
  21. j\u00fan\u00ed - 22. j\u00fal\u00ed.\\nSj\u00e1 einnig: Antilope Symbolism &
  amp; MerkingFlicker Dreams\\nRau\u00f0 fl\u00f6kt \u00ed draumnum \u00fe\u00ednum
  t\u00e1knar \u00fe\u00f6rfina fyrir hj\u00e1lp vi\u00f0 vandam\u00e1l. Vertu me\u00f0vitu\u00f0
  um a\u00f0 \u00fe\u00fa g\u00e6tir gert \u00e1standi\u00f0 fl\u00f3knara en \u00fe\u00f6rf
  krefur. Fornm\u00f6nnum fannst draumar um fl\u00f6ktandi fugl hafa tengsl vi\u00f0
  i\u00f0kun t\u00f6fralistar. Ef \u00fe\u00fa hefur veri\u00f0 nemandi \u00e1 \u00e1kve\u00f0inni
  dulr\u00e6nni braut, \u00fe\u00e1 eru h\u00e6fileikar \u00fe\u00ednir vi\u00f0 \u00fea\u00f0
  a\u00f0 vaxa. Nota\u00f0u skapandi e\u00f0lishv\u00f6t \u00fe\u00edna sem lei\u00f0beiningar
  um helgisi\u00f0i, galdra og huglei\u00f0slu.\\nFl\u00f6kt sem hamrar stanslaust
  \u00ed draumi \u00fe\u00ednum t\u00e1knar manneskju sem er versnandi, n\u00f6ldrandi
  og sem leggur \u00f3\u00fearfa \u00fer\u00fdsting \u00e1 \u00feig. Far\u00f0u varlega.
  Ef \u00fe\u00fa gefur eftir g\u00e6tir\u00f0u lent \u00ed fj\u00e1rhagsvandr\u00e6\u00f0um.\\nA\u00f0
  halda fl\u00f6kti \u00f6ruggum \u00ed draumnum s\u00fdnir sterka l\u00f6ngun \u00ed
  hjarta \u00fe\u00ednu eftir sam\u00fa\u00f0, g\u00f3\u00f0vild og a\u00f0 b\u00e6ta
  heiminn, e\u00f0a a\u00f0 minnsta kosti \u00feinn horn af honum. Ef fl\u00f6kti\u00f0
  er \u00fe\u00f6gult og hefur baki\u00f0 til \u00fe\u00edn, ertu a\u00f0 horfa framhj\u00e1
  einhverju mikilv\u00e6gu.\\nTv\u00f6 e\u00f0a fleiri fl\u00f6kt sem g\u00e6gja \u00ed
  draumnum \u00fe\u00ednum er vi\u00f0v\u00f6run. F\u00f3lk er a\u00f0 reyna a\u00f0
  tala yfir hvert anna\u00f0. \u00dea\u00f0 er engin virk hlustun n\u00fana enda or\u00f0in
  keppni. A\u00f0 gr\u00edpa fl\u00f6kt \u00ed draumi s\u00fdnir \u00e1herslu \u00e1
  a\u00f0 b\u00e6ta sj\u00e1lfan \u00feig; ekki l\u00e1ta trufla \u00feig fr\u00e1
  \u00feeirri vi\u00f0leitni.\\nFl\u00f6kt sem f\u00e6rist fr\u00e1 hrei\u00f0ri \u00ed
  hrei\u00f0ur gefur til kynna eir\u00f0arleysi. \u00de\u00fahefur ekki fundi\u00f0
  sta\u00f0inn \u00fear sem \u00fe\u00e9r l\u00ed\u00f0ur heima \u00ed einka- og atvinnul\u00edfi
  \u00fe\u00ednu. A\u00f0 horfa \u00e1 fl\u00f6kt \u00far fjarska \u00e1 me\u00f0an
  \u00fe\u00fa finnur fyrir gle\u00f0i \u00ed hjarta \u00fe\u00ednu gefur til kynna
  veglegt tilefni, oft me\u00f0 einni manneskju sem hefur veri\u00f0 fjarl\u00e6g
  \u00ed nokkurn t\u00edma. Draumurinn \u00feinn er skilabo\u00f0 sem \u00fe\u00fa
  munt f\u00e1 t\u00e6kif\u00e6ri til a\u00f0 tengjast aftur.\\nFl\u00f6ktandi t\u00e1knr\u00e6n
  merkingarlykill\\n- Jafnv\u00e6gi\\n- Samskipti\\n- Sk\u00f6punarg\u00e1fa\\n- Eldur
  & Air Elements\\n- Sveigjanleiki\\n- Von\\n- Einstaklingur\\n- Heppni\\n- Sj\u00e1lfs\u00e1st\\n-
  \u00d3hef\u00f0bundin\"", "\"Fyrr \u00ed sumar fundust \u00f3\u00fatgefnar handt\u00f6kuskipanir
  \u00e1 hendur Donham, \u00fe\u00e1verandi eiginmanni hennar og m\u00e1gi. Eiginma\u00f0urinn
  og m\u00e1gurinn voru handteknir og s\u00fdkna\u00f0ir af mor\u00f0inu \u00e1 Till
  en Donham s\u00e6tti aldrei g\u00e6sluvar\u00f0haldi vegna m\u00e1lsins. Mennirnir
  j\u00e1tu\u00f0u s\u00ed\u00f0ar a\u00f0 hafa or\u00f0i\u00f0 Till a\u00f0 bana.\\n\u00cd
  \u00f3\u00fatefnum endurminningum Donham kemur fram a\u00f0 h\u00fan hafi ekki haft
  vitneskju um \u00feau \u00f6rl\u00f6g sem bi\u00f0u Till. Donham sag\u00f0i a\u00f0
  mennirnir hef\u00f0u komi\u00f0 me\u00f0 Till til s\u00edn um mi\u00f0ja n\u00f3tt
  til a\u00f0 h\u00fan g\u00e6ti bori\u00f0 kennsl \u00e1 hann og h\u00fan hef\u00f0i
  reynt a\u00f0 bjarga honum me\u00f0 \u00fev\u00ed a\u00f0 segja a\u00f0 \u00feetta
  v\u00e6ri ekki drengurinn sem hef\u00f0i \u00e1reitt hana.\\nH\u00e9lt Donham \u00fev\u00ed
  fram a\u00f0 Till hef\u00f0i sj\u00e1lfur komi\u00f0 upp um sig.\\nVi\u00f0 r\u00e9ttarh\u00f6ldin
  yfir m\u00f6nnunum sag\u00f0i Donham a\u00f0 Till hef\u00f0i gripi\u00f0 \u00ed
  sig og l\u00e1ti\u00f0 \u00f3s\u00e6mileg or\u00f0 falla en h\u00fan er s\u00f6g\u00f0
  hafa j\u00e1ta\u00f0 \u00fea\u00f0 seinna a\u00f0 \u00fea\u00f0 hef\u00f0i ekki
  veri\u00f0 satt. Samkv\u00e6mt vitnum ku Till hafa flauta\u00f0 a\u00f0 henni, \u00ed
  mesta lagi.\\nIlla fari\u00f0 l\u00edk Till fannst \u00ed Tallahatchie-\u00e1nni
  nokkrum d\u00f6gum s\u00ed\u00f0ar og m\u00e1li\u00f0 komst \u00ed heimsfr\u00e9ttirnar
