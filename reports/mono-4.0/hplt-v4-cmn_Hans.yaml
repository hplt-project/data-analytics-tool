  "\"\u94f8\u5251\u5b97\u5e081.0.81.1.7.2\\n- \u8be6\u60c5\\n- \u4e0b\u8f7d\u5730\u5740\\n-
  \u540c\u7c7b\u70ed\u95e8\\n- \u63a8\u8350\u4e13\u9898\\n\u94f8\u5251\u5b97\u5e08\u662f\u4e00\u6b3e\u597d\u73a9\u7684\u4f11\u95f2\u6e38\u620f\u3002\u5728\u6e38\u620f\u4e2d\uff0c\u6211\u4eec\u662f\u975e\u5e38\u8457\u540d\u7684\u5251\u5ba2\u3002\u6211\u4eec\u9700\u8981\u4e3a\u5404\u79cd\u5ba2\u6237\u94f8\u5251\u3002\u6211\u4eec\u53ef\u4ee5\u5236\u9020\u5404\u79cd\u5404\u6837\u7684\u5251\u3002\u5f53\u7136\uff0c\u6211\u4eec\u5fc5\u987b\u6ee1\u8db3\u5ba2\u4eba\u7684\u9700\u6c42\u3002\u5230\u4e86\u540e\u9762\u5c31\u80fd\u505a\u51fa\u8d28\u91cf\u66f4\u9ad8\u7684\u5251\u4e86\u3002\u6e38\u620f\u91cc\u7684\u94f8\u5251\u4e5f\u662f\u9700\u8981\u6750\u6599\u7684\uff0c\u6750\u6599\u9700\u8981\u6211\u53bb\u6316\u77ff\u3002\u6211\u4eec\u53ef\u4ee5\u96c7\u4f63\u4e00\u4e2a\u7f3a\u5e2d\u8005\u6765\u5e2e\u52a9\u6211\u4eec\u6536\u96c6\u77ff\u77f3\uff0c\u8fd9\u6837\u6211\u4eec\u5c31\u53ef\u4ee5\u4e13\u5fc3\u94f8\u5251\u4e86\u3002\\n\u94f8\u5251\u5b97\u5e081.0.8\u89c6\u9891\\n\u94f8\u5251\u5b97\u5e081.0.8\u7b80\u4ecb\\n\u94f8\u5251\u5b97\u5e08\u4e2d\u8ba9\u73a9\u5bb6\u5728\u6e38\u620f\u4e2d\u626e\u6f14\u4e00\u4f4d\u6280\u827a\u9ad8\u8d85\u7684\u94f8\u5251\u5927\u5e08\uff0c\u4f60\u53ef\u4ee5\u81ea\u7531\u953b\u9020\u65e0\u6570\u7684\u540d\u5251\uff0c\u968f\u65f6\u5f00\u542f\u5b97\u5e08\u7684\u517b\u6210\u4e4b\u8def\u3002\u6e38\u620f\u64cd\u4f5c\u975e\u5e38\u7b80\u5355\uff0c\u53ea\u9700\u624b\u6307\u70b9\u51fb\u5373\u53ef\u3002\u91c7\u7528\u5168\u65b0\u7684\u6280\u672f\u6253\u9020\uff0c\u5b8c\u7f8e\u8fd8\u539f\u4e86\u4e2a\u6027\u5316\u7684\u5b9d\u5251\u6837\u5f0f\u3002\u6210\u4e3a\u771f\u6b63\u7684\u5b9d\u5251\u94f8\u9020\u5927\u5e08\uff0c\u4f60\u8981\u505a\u7684\u5c31\u662f\u6253\u9020\u5404\u79cd\u7edd\u4e16\u597d\u5251\uff0c\u81ea\u5df1\u5f00\u91c7\u77ff\u77f3\uff0c\u6536\u96c6\u5404\u79cd\u6750\u6599\u953b\u9020\u6b66\u5668\uff0c\u5236\u4f5c\u9ad8\u54c1\u8d28\u7684\u5b9d\u5251\u5427\uff0c\u62db\u52df\u66f4\u591a\u7684\u77ff\u5de5\u6765\u5e2e\u4f60\u6316\u77ff\uff0c\u6536\u96c6\u8db3\u591f\u7684\u94f8\u5251\u6750\u6599\uff0c\u8fd9\u6837\u5c31\u53ef\u4ee5\u953b\u9020\u51fa\u6700\u5389\u5bb3\u7684\u5b9d\u5251!\u5feb\u6765\u4e0b\u8f7d\u6e38\u620f\u5427\uff01\\n\u94f8\u5251\u5b97\u5e081.0.8\u7279\u8272\\n1\u3001q\u7248\u672c\u7684\u89d2\u8272\u8bbe\u7f6e\u548c\u50cf\u7d20\u5316\u6e38\u620f\u56fe\u5f62\u4f7f\u6211\u4eec\u80fd\u591f\u66f4\u597d\u5730\u6218\u6597\u548c\u83b7\u80dc\u3002\\n2\u3001\u6570\u4ee5\u4e07\u8ba1\u7684\u8bbe\u5907\uff0c\u6570\u767e\u5f20\u5730\u56fe\u53ef\u4ee5\u6ee1\u8db3\u60a8\u7684\u6240\u6709\u9700\u6c42\uff0c\u66f4\u597d\u5730\u6253\u8d62\u3002\\n3\u3001\u53ef\u4ee5\u5c1d\u8bd5\u6240\u6709\u7684\u6218\u6597\u65b9\u6cd5\uff0c\u5e76\u4e14\u4f1a\u6709\u66f4\u591a\u7684\u6218\u6597\u4e50\u8da3\u88ab\u53d1\u73b0\u3002\\n4\u3001\u63d0\u5347\u6c34\u5e73\u4ecd\u7136\u975e\u5e38\u91cd\u8981\u3002\u7ea7\u522b\u8d8a\u9ad8\uff0c\u60a8\u53ef\u4ee5\u5b66\u4e60\u548c\u638c\u63e1\u7684\u6280\u80fd\u8d8a\u591a\u3002\\n\u94f8\u5251\u5b97\u5e081.0.8\u653b\u7565\\n\u7531\u3010\u91c7\u96c6\u77ff\u77f3\u3011-\u3010\u5408\u6210\u77ff\u77f3\u3011-\u3010\u953b\u9020\u5b9d\u5251\u3011-\u3010\u5c55\u793a\u5b9d\u5251\u3011\u7b49\u73a9\u6cd5\u6a21\u5757\u7ec4\u6210\uff0c\u6e38\u620f\u5185\u5b9d\u5251\u9ad8\u6e05\u5199\u5b9e\uff0c\u8fd8\u539f\u771f\u5b9e\u5386\u53f2\u540d\u5251\u7684\u7279\u8272\uff0c\u540c\u65f6\u9644\u542b\u5927\u91cf\u72ec\u521b\u540d\u5668\uff0c\u6709\u8db3\u591f\u7684\u63a2\u7d22\u7a7a\u95f4\u3002\\n\u9996\u5148\u73a9\u5bb6\u9700\u8981\u83b7\u53d6\u94f8\u5251\u7528\u7684\u624b\u672d\u4e5f\u5c31\u662f\u6b66\u5668\u7684\u56fe\u7eb8\uff0c\u4e4b\u540e\u6839\u636e\u56fe\u7eb8\u6240\u9700\u8981\u7684\u6750\u6599\u8fdb\u884c\u7b79\u5907\uff0c\u5148\u96c7\u4f63\u4e00\u540d\u77ff\u5de5\u6765\u4e3a\u4f60\u91c7\u96c6\u77ff\u77f3\uff0c\u4e0d\u540c\u7684\u77ff\u5de5\u5de5\u4eba\u6709\u7740\u4e0d\u540c\u7684\u89e3\u9501\u6761\u4ef6\uff0c\u5f53\u7136\u77ff\u5de5\u8d8a\u591a\u5bf9\u4e8e\u73a9\u5bb6\u7684\u94f8\u5251\u6548\u7387\u5c31\u8d8a\u9ad8\u3002\\n\u641e\u5230\u77ff\u77f3\u4ee5\u540e\uff0c\u5728\u201c\u94f8\u9020\u201d\u529f\u80fd\u533a\u91cc\u5c06\u624b\u672d\u653e\u7f6e\u5728\u4e2d\u95f4\uff0c\u8fb9\u4e0a\u653e\u4e0a\u94f8\u9020\u6240\u9700\u8981\u7684\u539f\u6750\u6599\uff0c\u4e4b\u540e\u9009\u62e9\u201c\u666e\u901a\u5efa\u9020\u201d\u6216\u662f\u201c\u7948\u798f\u5efa\u9020\u201d\uff0c\u77ff\u77f3\u7684\u6570\u91cf\u8d8a\u591a\uff0c\u94f8\u9020\u7684\u6548\u679c\u5c31\u8d8a\u597d\u3002\\n\u4e4b\u540e\u901a\u8fc7\u97f3\u6e38\u73a9\u6cd5\u6765\u5c3d\u53ef\u80fd\u7684\u5b8c\u6210\u66f4\u591a\u8fde\u51fb\uff0c\u8fd9\u6837\u94f8\u9020\u51fa\u6765\u7684\u5175\u5668\u65e0\u8bba\u662f\u54c1\u8d28\uff0c\u8fd8\u662f\u6740\u4f24\u529b\u90fd\u62e5\u6709\u7edd\u5bf9\u5b8c\u7f8e\u7684\u6570\u503c\u6548\u679c\u3002\\n\u5c55\u793a\u533a\uff1a\\n\u6e38\u620f\u6536\u76ca\uff1a\u5c55\u793a\u6b66\u5668\u540e\u80fd\u5438\u5f15\u5404\u7c7b\u6c5f\u6e56\u6e38\u5ba2\uff0c\u70b9\u51fb\u6e38\u5ba2\u53ef\u4ee5\u83b7\u53d6\u6253\u8d4f\u3002\\n\u5355\u4e2a\u6b66\u5668\u6536\u76ca\u805a\u6ee1\u540e\u5c06\u4e0d\u518d\u80fd\u5438\u5f15\u6e38\u5ba2\uff0c\u53ef\u66f4\u6362\u65b0\u7684\u6b66\u5668\u4e0a\u67b6\uff01\\n\u94f8\u5251\u5b97\u5e081.0.8\u8bc4\u6d4b\\n\u94f8\u5251\u5b97\u5e08\u662f\u5f88\u6709\u610f\u601d\u7684\u6e38\u620f\uff0c\u7279\u522b\u662f\u8282\u594f\u70b9\u66f4\u8fde\u8d2f\u5b8c\u6574\u70b9\u5c31\u597d\u4e86(\u6709\u8bd5\u542c\u66f4\u597d)\u3002\u6b66\u5668\u56fe\u7eb8\u7684\u4e13\u7528\u83b7\u5f97\u6e20\u9053\u518d\u589e\u52a0\u70b9\u5427\uff0c\u6bd5\u7adf\u664b\u5347\u7528\u7a00\u6709\u56fe\u7eb8\u592a\u96be\u641e\u4e86(\u8138\u597d\u76f4\u63a5\u51fa\u8138\u4e0d\u597d,,\u053e^\u053e,,)\u3002\u5efa\u8bae\u5f04\u4e2a\u4ed3\u5e93\u50a8\u5b58\uff0c\u80cc\u5305\u5bb9\u91cf\u5b9e\u5728\u592a\u5c11\uff0c\u4e2d\u540e\u671f\u7528\u5230\u9ad8\u7ea7\u6750\u6599\u5408\u6210\u7528\u592a\u591a\uff0c\u7a00\u6709\u6750\u6599\u6781\u5c11\u7528\u5230\u5c31\u592a\u5360\u80cc\u5305\u4e86\u3002\u5251\u6c60\u91cc\u7684\u65e7\u5251\u6700\u597d\u80fd\u624b\u52a8\u62b9\u9664\uff0c\u6bd5\u7adf\u6709\u4e9b\u517b\u773c\u6709\u4e9b\u4e0d\u517b\u773c(\u795e\u5668\u88ab\u9752\u94dc\u5251\u6321\u4f4f\u4e86)\u3002\u603b\u4f53\u6765\u8bf4\u300a\u94f8\u5251\u5b97\u5e08\u7834\u89e3\u7248\u300b\u6e38\u620f\u5408\u6211\u80c3\u53e3\uff0c\u5e0c\u671b\u6e38\u620f\u8d8a\u6765\u8d8a\u597d\u5427\u2026\u2026\\n\u94f8\u5251\u5b97\u5e081.0.8\u4eae\u70b9\\n1\u3001\u94f8\u5251\u5b97\u5e08\u53ef\u4ee5\u5c1d\u8bd5\u6240\u6709\u7684\u6218\u6597\u65b9\u6cd5\uff0c\u5e76\u4e14\u4f1a\u6709\u66f4\u591a\u7684\u6218\u6597\u4e50\u8da3\u88ab\u53d1\u73b0\\n2\u3001Q\u7248\u672c\u7684\u89d2\u8272\u8bbe\u7f6e\u548c\u50cf\u7d20\u5316\u6e38\u620f\u56fe\u5f62\u4f7f\u6211\u4eec\u80fd\u591f\u66f4\u597d\u5730\u6218\u6597\u548c\u83b7\u80dc\\n3\u3001\u63d0\u5347\u6c34\u5e73\u4ecd\u7136\u975e\u5e38\u91cd\u8981\u3002\u7ea7\u522b\u8d8a\u9ad8\uff0c\u60a8\u53ef\u4ee5\u5b66\u4e60\u548c\u638c\u63e1\u7684\u6280\u80fd\u8d8a\u591a\\n4\u3001\u8d85\u9ad8\u81ea\u7531\u5ea6\uff0c\u6253\u7834\u4f20\u7edf\u60c5\u8282\u7684\u9650\u5236\uff0c\u5404\u79cd\u5f3a\u5927\u800c\u7f8e\u4e3d\u7684\u4f63\u5175\u5c06\u966a\u4f34\u60a8\u8fdb\u884c\u5192\u9669\"",
  "\"\u7b2c\u516d\u767e\u96f6\u4e09\u7ae0 \u5080\u5121\u5e08\\n\u90fd\u57ce\u4e4b\u5916\uff0c\u9614\u6d77\u4e4b\u5cb8\u3002\\n\u821e\u7a7a\u7075\u7acb\u4e8e\u6d77\u8fb9\uff0c\u8eab\u540e\u662f\u4e00\u7247\u9ed1\u888d\u4eba\u5f71\uff0c\u9065\u671b\u90fd\u57ce\u63a5\u5929\u57ce\u5899\u3002\\n\u5728\u5979\u7684\u9762\u524d\uff0c\u4e00\u4eba\u60ac\u4e8e\u534a\u7a7a\u4e4b\u4e2d\u3002\\n\u6b64\u4eba\u4e0d\u662f\u522b\u4eba\uff0c\u6b63\u662f\u5728\u90fd\u57ce\u901b\u4e86\u4e00\u5708\uff0c\u4ec0\u4e48\u90fd\u6c92\u6709\u505a\u7684\u7d2b\u9b42\u5b97\u5b97\u4e3b\u65e0\u9b42\u3002\\n\u7f13\u7f13\u7684\uff0c\u65e0\u9b42\u843d\u5728\u4e86\u5730\u9762\u4e0a\u3002\\n\u821e\u7a7a\u7075\u5fae\u5fae\u8eac\u8eab\uff0c\u9053\uff1a\u201c\u65e0\u9b42\u5b97\u4e3b\u3002\u201d\\n\u65e0\u9b42\u8f6c\u8fc7\u8eab\u4f86\uff0c\u770b\u7740\u821e\u7a7a\u7075\u9053\uff1a\u201c\u4f60\u600e\u4e48\u77e5\u9053\u6211\u4f1a\u5728\u8fd9\u91cc\u3002\u201d\\n\u821e\u7a7a\u7075\u7b11\u9053\uff1a\u201c\u6211\u4e0d\u77e5\u9053\u3002\u53ea\u662f\u78b0\u5de7\u9047\u89c1\u3002\u201d\\n\u65e0\u9b42\u773c\u7738\u4e4b\u4e2d\u9971\u542b\u7b11\u610f\uff0c\u9053\uff1a\u201c\u4f60\u89c9\u5f97\u6211\u4f1a\u4fe1\u5417\uff0c\u201d\\n\u821e\u7a7a\u7075\u542b\u7b11\u4e0d\u8bed\uff0c\u5ffd\u7684\u7b11\u76c8\u76c8\u7684\u5bf9\u65e0\u9b42\u8eac\u8eab\u9053\uff1a\u201c\u65e0\u9b42\u5b97\u4e3b\uff0c\u6211\u60f3\u60a8\u4f1a\u4fe1\u7684\u3002\u201d\\n\u65e0\u9b42\u4e0a\u524d\u4e00\u6b65\uff0c\u76ee\u5149\u4f3c\u4e4e\u80fd\u591f\u900f\u8fc7\u821e\u7a7a\u7075\u7684\u9762\u7eb1\uff0c\u770b\u6e05\u5979\u7684\u8138\u3002\\n\u7f13\u7f13\u7684\uff0c\u65e0\u9b42\u9053\uff1a\u201c\u821e\u7a7a\u7075\u3002\u4f60\u5f88\u6709\u672c\u4e8b\u554a\u3002\u5e38\u6770\u7387\u9886\u6211\u7d2b\u8863\u95e8\u4e00\u5e72\u51e0\u5341\u4eba\u5165\u90fd\u57ce\uff0c\u6c92\u6709\u4e00\u4e2a\u80fd\u9003\u51fa\u4f86\u3002\u4f60\u533a\u533a\u9b54\u5fc3\u5b97\uff0c\u5b9e\u529b\u4e0d\u5f3a\uff0c\u5e95\u8574\u4e00\u822c\uff0c\u5374\u80fd\u5168\u8eab\u800c\u9000\u3002\u542c\u8bf4\u4f60\u8fd8\u8bbe\u8ba1\u8ba9\u97e9\u5bb6\u4e0e\u5929\u5bb6\u4ea4\u6076\uff0c\u6bc1\u4e86\u97e9\u5bb6\u63a5\u73ed\u4eba\u97e9\u5143\u5b81\uff0c\u5dee\u70b9\u8ba9\u4e24\u5bb6\u5200\u5175\u76f8\u89c1\u3002\u4f60\u7684\u672c\u4e8b\uff0c\u53ef\u662f\u6bd4\u5e38\u6770\u5927\u591a\u4e86\u3002\u90a3\u4e2a\u8822\u8d27\uff0c\u4e0d\u4ec5\u4e22\u4e86\u81ea\u5df1\u7684\u6027\u547d\uff0c\u8fd8\u4e22\u4e86\u6211\u4eec\u7d2b\u9b42\u5b97\u7684\u8138\u3002\u4f60\u5f88\u80fd\u554a\uff0c\u5f88\u6709\u4e9b\u7528\u5904\u3002\u201d\\n\u821e\u7a7a\u7075\u7b11\u9053\uff1a\u201c\u5b97\u4e3b\uff0c\u8fd9\u4e9b\u53ea\u4e0d\u8fc7\u662f\u96d5\u866b\u5c0f\u6280\u800c\u5df2\uff0c\u54ea\u91cc\u80fd\u5165\u5b97\u4e3b\u7684\u6cd5\u773c\u3002\u5f53\u65f6\u5b97\u4e3b\u5c31\u5728\u57ce\u5185\uff0c\u968f\u4fbf\u505a\u70b9\u4ec0\u4e48\uff0c\u4e5f\u5b9a\u6bd4\u6211\u4eec\u8fd9\u4e9b\u4eba\uff0c\u95f9\u817e\u51fa\u4f86\u7684\u4e8b\u60c5\u5927\u591a\u4e86\u3002\u81f3\u4e8e\u5e38\u6770\uff0c\u4ece\u4e00\u5f00\u59cb\u53bb\u53c2\u52a0\u9009\u62d4\uff0c\u5176\u5b9e\u5c31\u662f\u4e2a\u9519\u8bef\uff0c\u5931\u8d25\u4e5f\u662f\u81ea\u7136\u7684\u3002\u60f3\u5fc5\uff0c\u5b97\u4e3b\u4e5f\u65e9\u5c31\u770b\u51fa\u4f86\u4e86\u3002\u201d\\n\u65e0\u9b42\u9053\uff1a\u201c\u54e6\uff0c\u90a3\u4f60\u5012\u662f\u8bf4\u8bf4\uff0c\u8fd9\u4ef6\u4e8b\u4e3a\u4f55\u5c31\u662f\u4e2a\u9519\u8bef\u3002\u8981\u77e5\u9053\uff0c\u6b64\u8ba1\uff0c\u53ef\u662f\u6211\u7d2b\u9b42\u5b97\uff0c\u51e0\u5927\u957f\u8001\u63d0\u51fa\u4f86\u7684\u5999\u8ba1\u3002\u4e5f\u9009\u4e86\uff0c\u6700\u9002\u5408\u5b8c\u6210\u8fd9\u4e2a\u8ba1\u5212\u7684\u4eba\uff0c\u65e0\u9b42\u3002\u662f\u54ea\u91cc\u51fa\u4e86\u95ee\u984c\u5462\uff0c\u201d\\n\u821e\u7a7a\u7075\u7b11\u9053\uff1a\u201c\u5f88\u7b80\u5355\u3002\u56e0\u4e3a\u90fd\u57ce\u4e4b\u4e2d\uff0c\u5927\u9635\u7b3c\u7f69\uff0c\u9b54\u4fee\u65e0\u6240\u9041\u5f62\u3002\u79e6\u5546\u5927\u5e1d\u5176\u5b9e\u4e00\u5207\u90fd\u770b\u5728\u773c\u91cc\uff0c\u53ea\u662f\u4e0d\u60f3\u52a8\u9635\u800c\u5df2\uff0c\u4e00\u65e6\u4ed6\u613f\u610f\u52a8\u4e86\uff0c\u90fd\u57ce\u4e4b\u5185\uff0c\u4e0d\u8981\u8bf4\u5e38\u6770\u5fc5\u6b7b\uff0c\u5c31\u7b97\u662f\u5b97\u4e3b\u60a8\uff0c\u6050\u6015\u4e5f\u53ea\u6709\u9041\u8d70\u7684\u4efd\u3002\u597d\u5904\u635e\u4e0d\u7740\uff0c\u8fd8\u6709\u6740\u8eab\u4e4b\u7978\uff0c\u8fd9\u79cd\u8ba1\u7b56\uff0c\u81ea\u7136\u53ea\u80fd\u8bf4\u662f\u6ce8\u5b9a\u5931\u8d25\u3002\u60f3\u5fc5\u5b97\u4e3b\u5728\u57ce\u5185\u6c92\u6709\u6551\u5e38\u6770\u7b49\u4eba\uff0c\u4e5f\u662f\u56e0\u4e3a\u6b64\u4e8b\u5427\u3002\u201d\\n\u65e0\u9b42\u9762\u8272\u5fae\u5fae\u6709\u5f02\uff0c\u770b\u7740\u821e\u7a7a\u7075\u7684\u53cc\u7738\uff0c\u5ffd\u7684\u7b11\u4e86\u8d77\u4f86\u3002\\n\u201c\u597d\u89c1\u8bc6\uff0c\u6050\u6015\u6574\u4e2a\u9b54\u4fee\u4e4b\u4e2d\uff0c\u6709\u8fd9\u822c\u89c1\u8bc6\u7684\u4eba\uff0c\u4e0d\u51fa\u4e94\u6307\u4e4b\u6570\u4e86\u3002\u821e\u7a7a\u7075\uff0c\u6709\u6c92\u6709\u5174\u8da3\uff0c\u4f86\u6211\u7d2b\u9b42\u5b97\u3002\u4f60\u9b54\u5fc3\u5b97\u53ef\u5165\u6211\u7d2b\u9b42\u5b97\u95e8\u4e0b\uff0c\u81ea\u6210\u4e00\u8109\u3002\u4f9d\u65e7\u7531\u4f60\u6267\u638c\uff0c\u505a\u4e2a\u5802\u4e3b\u3002\u4f60\u770b\u5982\u4f55\uff0c\u201d\\n\u821e\u7a7a\u7075\u7b11\u9053\uff1a\u201c\u5b97\u4e3b\uff0c\u8fd9\u5c31\u662f\u6211\u4e3a\u4f55\u8981\u5728\u6b64\u5904\u627e\u60a8\u7684\u539f\u56e0\u3002\u201d\\n\u65e0\u9b42\u6df1\u6df1\u7684\u770b\u4e86\u821e\u7a7a\u7075\u4e00\u773c\uff0c\u5ffd\u7684\u7b11\u9053\uff1a\u201c\u4f60\u8fd9\u4e2a\u5973\u4eba\uff0c\u4e0d\u7b80\u5355\u554a\u3002\u542c\u8bf4\uff0c\u4f60\u4eec\u9b54\u5fc3\u5b97\uff0c\u4e0a\u4e00\u4efb\u5b97\u4e3b\uff0c\u5c31\u662f\u6b7b\u5728\u4f60\u7684\u624b\u4e0a\u3002\u201d\\n\u821e\u7a7a\u7075\u6447\u5934\u9053\uff1a\u201c\u5b97\u4e3b\u54ea\u91cc\u8bdd\u3002\u60a8\u53ef\u4ee5\u4ed4\u7ec6\u53bb\u67e5\u4e00\u4e0b\uff0c\u6211\u4eec\u4e0a\u4e00\u4efb\u5b97\u4e3b\uff0c\u662f\u6b7b\u5728\u522b\u4eba\u7684\u624b\u4e0a\uff0c\u4e0e\u6211\u65e0\u5173\u3002\u201d\\n\u65e0\u9b42\u8f7b\u7b11\u9053\uff1a\u201c\u6b7b\u5728\u522b\u4eba\u624b\u4e0a\uff0c\u6211\u4fe1\u3002\u4f46\u8981\u8bf4\u4e0e\u4f60\u65e0\u5173\uff0c\u50bb\u5b50\u90fd\u4e0d\u4f1a\u4fe1\u3002\u6211\u6709\u79cd\u9884\u611f\uff0c\u5018\u82e5\u4f60\u8fdb\u4e86\u7d2b\u9b42\u5b97\uff0c\u5b9a\u5c06\u5728\u6211\u7d2b\u9b42\u5b97\u5185\uff0c\u7ffb\u8d77\u6ed4\u5929\u5de8\u6d6a\uff0c\u8bf4\u4e0d\u5b9a\uff0c\u6574\u4e2a\u7d2b\u9b42\u5b97\u90fd\u4f1a\u6bc1\u5728\u4f60\u7684\u624b\u4e0a\u3002\u201d\\n\u821e\u7a7a\u7075\u5e73\u9759\u7684\u9053\uff1a\u201c\u90a3\u5b97\u4e3b\u8fd8\u80af\u6536\u7559\u6211\u5417\uff0c\u201d\\n\u65e0\u9b42\u773c\u653e\u5f3a\u5149\uff0c\u6717\u58f0\u9053\uff1a\u201c\u65e2\u7136\u6211\u5df2\u7ecf\u5f00\u53e3\uff0c\u90a3\u4fbf\u7167\u6536\u65e0\u8bef\u3002\u968f\u6211\u56de\u5b97\u95e8\uff0c\u4ece\u4eca\u65e5\u8d77\uff0c\u4f60\u4fbf\u662f\u9b54\u5fc3\u5802\u7684\u5802\u4e3b\u3002\u201d\\n\u8bf4\u5b8c\uff0c\u65e0\u9b42\u62db\u624b\u4e00\u6325\uff0c\u4e00\u7247\u7a7a\u95f4\u88ab\u5f3a\u884c\u6495\u88c2\uff0c\u9732\u51fa\u4e86\u91cc\u9762\u6f06\u9ed1\u7684\u865a\u7a7a\u3002\\n\u65e0\u9b42\u7387\u5148\u8d70\u4e86\u8fdb\u53bb\uff0c\u821e\u7a7a\u7075\u6325\u624b\u8ba9\u624b\u4e0b\u8fdb\u5165\u865a\u7a7a\u4e4b\u4e2d\u3002\\n\u5979\u6700\u540e\u5411\u90fd\u57ce\u7684\u65b9\u5411\u671b\u4e86\u4e00\u773c\uff0c\u5583\u5583\u9053\uff1a\u201c\u9646\u51e1\u554a\uff0c\u4e0b\u6b21\u518d\u89c1\u55bd\u3002\u201d\\n\u8a00\u6bd5\uff0c\u821e\u7a7a\u7075\u773c\u5e26\u7b11\u610f\uff0c\u8d70\u5165\u865a\u7a7a\u4e4b\u4e2d\u3002\\n\u7a7a\u95f4\u970e\u65f6\u5408\u4e0a\uff0c\u4f17\u4eba\u6d88\u5931\u65e0\u8e2a\u3002\\n\u90fd\u57ce\u5185\u3002\\n\u4e00\u95f4\u8352\u50fb\u7684\u5b85\u9662\uff0c\u4e00\u4eba\u9760\u5728\u5899\u89d2\u4e4b\u4e0b\uff0c\u9c9c\u8840\u6a2a\u6d41\u3002\\n\u624b\u811a\u65ad\u88c2\uff0c\u5168\u8eab\u5200\u5251\u4f24\u75d5\uff0c\u51e0\u4e4e\u6c92\u6709\u4e00\u5757\u76ae\u80a4\u5b8c\u6574\u3002\u663e\u7136\u662f\u521a\u521a\u7ecf\u5386\u4e86\u4e00\u573a\u5927\u6218\uff0c\u582a\u582a\u9003\u751f\u3002\\n\u6b64\u4eba\u4e0d\u662f\u522b\u4eba\uff0c\u6b63\u662f\u524d\u51e0\u65e5\uff0c\u88ab\u821e\u7a7a\u7075\u63a8\u8350\u51fa\u53bb\uff0c\u7ed9\u9b3c\u8138\u5e38\u6770\u5f53\u4e0b\u5c5e\u7684\u661f\u6e0a\u3002\\n\u672c\u4f86\u661f\u6e0a\u4ee5\u4e3a\u81ea\u5df1\u4ece\u9b54\u5fc3\u5b97\u8f6c\u5165\u7d2b\u9b42\u5b97\uff0c\u4e43\u662f\u4e00\u6b21\u8dc3\u8fdb\u3002\\n\u9b3c\u8138\u5e38\u6770\u89c1\u8bc6\u8fc7\u4ed6\u7684\u5b9e\u529b\u4e4b\u540e\uff0c\u4e5f\u662f\u5bf9\u4ed6\u8d5e\u8d4f\u6709\u4f73\uff0c\u4ee5\u5144\u5f1f\u76f8\u79f0\u3002\\n\u4f46\u8c01\u80fd\u60f3\u5230\uff0c\u51e0\u5929\u4e4b\u540e\uff0c\u4ed6\u4fbf\u62db\u4f86\u4e86\u6740\u8eab\u4e4b\u7978\u3002\\n\u90a3\u4e00\u961f\u91d1\u7532\u536b\u5175\uff0c\u5b9e\u5728\u5f3a\u7684\u53ef\u6015\u3002\u5c24\u5176\u662f\u90a3\u540d\u91d1\u7532\u7edf\u9886\uff0c\u5b9e\u5728\u5f3a\u7684\u4e0d\u50cf\u6837\u3002\u5929\u7f61\u6b66\u8005\uff0c\u7adf\u7136\u90fd\u6321\u4e0d\u4f4f\u4ed6\u4e09\u62db\u3002\u518d\u52a0\u4e0a\u5415\u5bb6\u7684\u6b66\u8005\uff0c\u771f\u662f\u5c06\u9b3c\u8138\u5e38\u6770\u5e26\u4f86\u7684\u6240\u6709\u4eba\uff0c\u51e0\u4e4e\u4e00\u626b\u800c\u7a7a\u3002\\n\u597d\u5728\u4ed6\u4fee\u4e3a\u5f3a\u6a2a\uff0c\u529f\u6cd5\u624e\u5b9e\uff0c\u8fd9\u624d\u582a\u582a\u6740\u51fa\u4e00\u6761\u8840\u8def\u3002\\n\u6b64\u65f6\u9003\u5230\u8fd9\u91cc\uff0c\u7ec8\u4e8e\u5c06\u8ffd\u5175\u7529\u6389\uff0c\u4ed6\u5374\u5df2\u7ecf\u611f\u89c9\u81ea\u5df1\u5c31\u8981\u6cb9\u5c3d\u706f\u67af\u4e86\u3002\\n\u800c\u76f4\u5230\u6b64\u65f6\uff0c\u4ed6\u7ec8\u4e8e\u60f3\u660e\u767d\u4e86\uff0c\u81ea\u5df1\u5176\u5b9e\u662f\u88ab\u821e\u7a7a\u7075\u7ed9\u800d\u4e86\u3002\\n\u201c\u597d\u4e2a\u5978\u733e\u7684\u5973\u5b50\u3002\u201d\\n\u661f\u6e0a\u6697\u9a82\u4e86\u4e00\u58f0\u3002\u4ed6\u81ea\u4ee5\u4e3a\u81ea\u5df1\u662f\u72e1\u733e\u591a\u667a\uff0c\u5fc3\u72e0\u624b\u8fa3\u4e4b\u8f88\u3002\u5c31\u7b97\u8eab\u5165\u9b54\u9053\uff0c\u4e5f\u8be5\u662f\u4e00\u65b9\u5de8\u64d8\u3002\\n\u4f46\u521a\u521a\u5165\u9b54\u9053\u4e0d\u4e45\u3002\u5c45\u7136\u5c31\u906d\u6b64\u4e00\u52ab\u3002\u8fd8\u662f\u88ab\u4e00\u4e2a\u5c0f\u5973\u4eba\u7ed9\u800d\u4e86\u3002\u771f\u662f\u989c\u9762\u4e27\u5c3d\u3002\\n\u8fd9\u4ef6\u4e8b\u60c5\u4e5f\u6df1\u6df1\u7684\u7ed9\u4ed6\u4e0a\u4e86\u4e00\u8bfe\uff0c\u60f3\u5728\u9b54\u4fee\u4e4b\u4e2d\u6df7\uff0c\u4ed6\u8fd8\u9700\u8981\u66f4\u72e1\u733e\u4e00\u4e9b\uff0c\u66f4\u5f3a\u5927\u4e00\u4e9b\u3002\\n\u661f\u6e0a\u5598\u7740\u7c97\u6c14\uff0c\u7528\u5c3d\u5168\u529b\u7684\u529b\u6c14\u722c\u5230\u4e86\u5b85\u9662\u65c1\uff0c\u4f38\u624b\u60f3\u8981\u63a8\u5f00\u5b85\u9662\u7684\u5927\u95e8\u3002\\n\u4f46\u5f88\u53ef\u60dc\uff0c\u8fd9\u5904\u5b85\u9662\uff0c\u4f3c\u4e4e\u96be\u4ee5\u6253\u5f00\uff0c\u4efb\u51ed\u4ed6\u600e\u4e48\u63a8\uff0c\u5c45\u7136\u5c31\u662f\u4e0d\u5f00\u3002\\n\u661f\u6e0a\u611f\u89c9\u81ea\u5df1\u7684\u624b\u5b9e\u5728\u65e0\u6cd5\u52a8\u5f39\u4e86\uff0c\u5c31\u5e72\u8106\u7528\u8111\u888b\u53bb\u649e\uff0c\u5c06\u95e8\u649e\u7684\u549a\u549a\u58f0\u54cd\u3002\\n\u8bf4\u4f86\u4e5f\u662f\u5947\u602a\uff0c\u4ed6\u7528\u8111\u888b\u53bb\u649e\u95e8\uff0c\u649e\u4e86\u51e0\u4e0b\uff0c\u95e8\u7adf\u7136\u6253\u5f00\u4e86\u3002\\n\u800c\u540e\uff0c\u811a\u6b65\u58f0\u54cd\u8d77\uff0c\u50cf\u662f\u51e0\u4eba\u8d70\u4e86\u8fc7\u4f86\u3002\\n\u661f\u6e0a\u7528\u5c3d\u5168\u8eab\u7684\u6c14\u529b\u770b\u53bb\uff0c\u53ea\u770b\u5230\u51e0\u540d\u8001\u5bb6\u4f19\u7ad9\u5230\u4e86\u4ed6\u7684\u9762\u524d\uff0c\u800c\u540e\u4fbf\u542c\u7740\u51e0\u540d\u8001\u5bb6\u4f19\u8bae\u8bba\u9053\uff1a\u201c\u602a\u54c9\uff0c\u8fd9\u662f\u8c01\u554a\uff0c\u5c45\u7136\u8dd1\u5230\u8fd9\u91cc\u4f86\u4e86\uff0c\u96be\u9053\u6211\u4eec\u7684\u636e\u70b9\u66b4\u9732\u4e86\u5417\uff0c\u3002\u201d\\n\u201c\u662f\u4e2a\u6b66\u8005\uff0c\u55ef\uff0c\u4f3c\u4e4e\u4fee\u4e3a\u8fd8\u4e0d\u9519\u7684\u6837\u5b50\u3002\u8fd9\u4f24\u53e3\uff0c\u54e6\uff0c\u662f\u5bab\u4e2d\u91d1\u7532\u536b\u7684\u529f\u6cd5\u9020\u6210\u3002\u5475\u5475\uff0c\u8fd9\u5bb6\u4f19\uff0c\u662f\u4e2a\u9b54\u4fee\u5427\u3002\u201d\\n\u201c\u9b54\u4fee\u554a\uff0c\u90a3\u5c31\u4e0d\u7528\u5ba2\u6c14\u4e86\u3002\u6b63\u597d\u6211\u4eec\u7f3a\u4e0d\u5c11\u7089\u9f0e\uff0c\u628a\u4ed6\u70bc\u4e86\u5427\u3002\u201d\\n\u201c\u5509\uff0c\u4e0d\u8981\u6d6a\u8d39\u554a\uff0c\u8ba9\u6211\u4ed4\u7ec6\u770b\u770b\u3002\u54a6\uff0c\u8fd9\u5bb6\u4f19\u4f3c\u4e4e\u662f\u95ef\u8fc7\u9634\u9633\u5173\u554a\uff0c\u54ce\u5440\uff0c\u4fee\u4e3a\u771f\u4e0d\u9519\uff0c\u4e0a\u4f73\u7684\u7089\u9f0e\u3002\u8001\u516d\uff0c\u4f60\u7684\u90a3\u4e2a\u65e0\u654c\u5080\u5121\u7684\u8ba1\u5212\uff0c\u6211\u770b\u53ef\u4ee5\u5b9e\u65bd\u4e86\u3002\u201d\\n\u201c\u771f\u7684\u5047\u7684\uff0c\u8ba9\u6211\u7785\u7785\u3002\u55ef\uff0c\u786e\u5b9e\u662f\u4e0a\u4f73\u7684\u7089\u9f0e\u3002\u771f\u662f\u60f3\u4ec0\u4e48\u4f86\u4ec0\u4e48\u554a\uff0c\u8d3c\u8001\u5929\uff0c\u4ec0\u4e48\u65f6\u5019\u5bf9\u6211\u4eec\u8fd9\u4e48\u597d\u4e86\u3002\u8001\u4e94\u54e5\uff0c\u6211\u770b\u53ef\u4ee5\u8bd5\u8bd5\u3002\u201d\\n\u201c\u55ef\uff0c\u90a3\u5c31\u8bd5\u8bd5\u5427\u3002\u201d\\n\u8bf4\u5b8c\uff0c\u51e0\u540d\u8001\u8005\u62d6\u7740\u661f\u6e0a\u8fdb\u5165\u4e86\u5b85\u9662\u91cc\u9762\u3002\\n\u6d51\u6d51\u5669\u5669\u4e4b\u4e2d\u7684\u661f\u6e0a\uff0c\u542c\u7740\u51e0\u540d\u8001\u5bb6\u4f19\u7684\u58f0\u97f3\uff0c\u987f\u65f6\u62fc\u547d\u6323\u624e\uff0c\u60f3\u8981\u9003\u79bb\u3002\\n\u5355\u5355\u662f\u7089\u9f0e\u4e8c\u5b57\uff0c\u4fbf\u8db3\u4ee5\u8ba9\u65e0\u6570\u4eba\uff0c\u5fc3\u751f\u754f\u60e7\u3002\u7acb\u5373\u661f\u6e0a\u660e\u767d\u81ea\u5df1\u662f\u78b0\u4e0a\u4ec0\u4e48\u4eba\u4e86\u3002\\n\u8fd9\u4e9b\u4eba\uff0c\u516b\u6210\u662f\u6742\u5b66\u70bc\u6c14\u58eb\u3002\u4e13\u95e8\u7814\u7a76\u5404\u79cd\u4e71\u4e03\u516b\u7cdf\u6742\u5b66\u7684\u4eba\u3002\\n\u8fd9\u79cd\u70bc\u6c14\u58eb\uff0c\u4e0d\u559c\u70bc\u4e39\u3002\u66f4\u559c\u6b22\u7814\u7a76\u8352\u517d\uff0c\u5080\u5121\u7b49\u4e1c\u897f\u3002\\n\u5c24\u5176\u662f\u5080\u5121\u4e4b\u9053\uff0c\u51fa\u4e86\u8bb8\u591a\u75af\u72c2\u7684\u70bc\u6c14\u58eb\u3002\u4eba\u79f0\uff0c\u5080\u5121\u5e08\u3002\\n\u4ed6\u4eec\u6bd4\u9b54\u4fee\u4e4b\u4e2d\u9b54\u6c14\u58eb\uff0c\u66f4\u52a0\u53ef\u6015\u3002\u9b54\u6c14\u58eb\u65e0\u975e\u662f\u4ee5\u6b7b\u4eba\u5236\u4f5c\u5080\u5121\uff0c\u518d\u5389\u5bb3\u70b9\u7684\uff0c\u65e0\u975e\u662f\u5c31\u662f\u628a\u6d3b\u4eba\u5f53\u573a\u6740\u6b7b\uff0c\u7136\u540e\u5236\u4f5c\u5080\u5121\u3002\\n\u4f46\u662f\u8fd9\u4e9b\u5080\u5121\u5e08\uff0c\u662f\u771f\u6b63\u4ee5\u6d3b\u4eba\u505a\u5b9e\u9a8c\u3002\u628a\u4f60\u53d8\u6210\u5080\u5121\u4e4b\u540e\uff0c\u8fd8\u80fd\u4fdd\u7559\u539f\u672c\u610f\u8bc6\u3002\\n\u5bf9\u4e8e\u5927\u90e8\u5206\u4eba\u4f86\u8bf4\uff0c\u8fd9\u662f\u6bd4\u6740\u4e86\u4ed6\u4eec\uff0c\u66f4\u52a0\u96be\u53d7\u7684\u4e8b\u60c5\u3002\\n\u4f46\u5080\u5121\u5e08\u4e0d\u4f1a\u5728\u4e4e\u7684\uff0c\u4ed6\u4eec\u552f\u4e00\u7684\u76ee\u6807\uff0c\u5c31\u662f\u70bc\u5236\u51fa\u6700\u5f3a\u5927\u7684\u5080\u5121\uff0c\u65e0\u654c\u7684\u5080\u5121\u3002\\n\u661f\u6e0a\u7684\u6323\u624e\uff0c\u621b\u7136\u800c\u6b62\u3002\\n\u4e00\u540d\u70bc\u6c14\u58eb\u968f\u624b\u5728\u4ed6\u8eab\u4e0a\u4e00\u62cd\uff0c\u7acb\u5373\u4ed6\u5c31\u5b8c\u5168\u88ab\u5c01\u5370\u4f4f\u4e86\u3002\\n\u8fd9\u662f\u4e00\u9053\u5b8c\u7f8e\u7684\u5c01\u5370\uff0c\u5929\u5730\u4e4b\u529b\u6d51\u7136\u4e00\u4f53\uff0c\u6beb\u4e0d\u5916\u6cc4\uff0c\u5185\u4e2d\u8574\u542b\u65e0\u4e0a\u5927\u9053\u3002\\n\u767b\u65f6\uff0c\u661f\u6e0a\u60ca\u7684\u8bf4\u4e0d\u51fa\u8bdd\u4f86\u3002\\n\u4e7e\u5764\u5c0a\u8005\u3002\\n\u8fd9\u540d\u8001\u8005\u7adf\u7136\u662f\u70bc\u6c14\u58eb\u4e2d\u7684\u4e7e\u5764\u5883\u5c0a\u8005\u3002\u638c\u4e2d\u4e7e\u5764\uff0c\u5929\u5730\u65e0\u6781\u3002\\n\u5c31\u6b64\uff0c\u661f\u6e0a\u5f7b\u5e95\u5931\u53bb\u4e86\u6240\u6709\u7684\u53cd\u6297\u80fd\u529b\uff0c\u88ab\u51e0\u540d\u8001\u8005\u7b11\u7740\u62d6\u8d70\u3002\\n\u5927\u95e8\u7f13\u7f13\u5173\u95ed\uff0c\u9690\u96