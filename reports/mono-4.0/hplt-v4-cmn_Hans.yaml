  "\"\u4f60\u62a5\u6848\u7684\u540c\u65f6\u4e5f\u9700\u8981\u62a5\u8b66\u554a\uff0c\u6709\u51fa\u8b66\u8bb0\u5f55\u5c31\u53ef\u4ee5\u4e86\u3002\u8b66\u5bdf\u6839\u636e\u8f66\u724c\u65f6\u53ef\u4ee5\u627e\u5230\u8f66\u4e3b\u7684\u767b\u8bb0\u8054\u7cfb\u65b9\u5f0f\u7684\uff0c\u5982\u679c\u8b66\u5bdf\u4e0d\u613f\u610f\u63d0\u4f9b\uff0c\u53cd\u6b63\u4f60\u4e5f\u5df2\u7ecf\u62a5\u8fc7\u6848\u4e86\uff0c\u4e0d\u5c5e\u4e8e\u8087\u4e8b\u9003\u9038\u3002\u53ef\u4ee5\u7559\u4e00\u4e2a\u8054\u7cfb\u65b9\u5f0f\u5728\u5bf9\u65b9\u8f66\u4e0a\u3002\u8fd9\u4e2a\u60c5\u51b5\u660e\u663e\u5c5e\u4e8e\u4f60\u5168\u8d23\uff0c\u4f60\u7684\u635f\u5931\u90e8\u5206\u4fdd\u9669\u516c\u53f8\u5e94\u8be5...\\n\u65e2\u7136\u4f60\u4eec\u4e4b\u95f4\u5df2\u7ecf\u534f\u5546\u597d\u79c1\u4e86\uff0c\u4ea4\u8b66\u6ca1\u6709\u7406\u7531\u6263\u4f60\u7684\u8bc1\u4ef6\uff0c\u8fd9\u662f\u4ed6\u4eec\u6572\u8bc8\u4f60\u7684\u624b\u6bb5\u3002\\n\u4e0d\u660e\u767d\u4ec0\u4e48\u610f\u601d\u3002
  \u90fd\u5df2\u7ecf\u662f\u201c\u5168\u8d23\u4e86\u201d\uff0c\u76f4\u63a5\u53bb\u4fee\u8f66\u4e86\u3002\u8fd8\u6709\u4ec0\u4e48\u597d\u534f\u5546\u7684\uff01\\n\u53bb\u81ea\u8b66\u5bdf\u5c40\u8bf4\u6e05\u695a\u5427\uff01\u8be5\u600e\u4e48\u966a\u600e\u4e48\u966a\uff0c\u4e0d\u7136\u88ab\u67e5\u5230\u5c31\u4e0d\u597d\u4e86\u3002\\n\u5728\u505c\u8f66\u573a\u4e0d\u7b97\u8087\u4e8b\uff0c\u5c5e\u4e8e\u635f\u574f\u4ed6\u4eba\u8d22\u7269\u3002
  \u5982\u4f55\u8ba4\u5b9a\u4ea4\u901a\u8087\u4e8b\u9003\u9038\u884c\u4e3a\uff1a \u660e\u77e5\u53d1\u751f\u4ea4\u901a\u4e8b\u6545\uff0c\u4ea4\u901a\u4e8b\u6545\u5f53\u4e8b\u4eba\u9a7e\u8f66\u6216\u5f03\u8f66\u9003\u79bb\u4e8b\u6545\u73b0\u573a\u7684;
  \u4ea4\u901a\u4e8b\u6545\u5f53\u4e8b\u4eba\u8ba4\u4e3a\u81ea\u5df1\u5bf9\u4e8b\u6545\u6ca1\u6709\u8d23\u4efb\uff0c\u9a7e\u8f66\u9a76\u79bb\u4e8b\u6545\u73b0\u573a\u7684;
  \u4ea4\u901a\u4e8b\u6545\u5f53\u4e8b\u4eba\u6709\u9152\u540e\u548c\u65e0\u8bc1\u9a7e\u8f66\u7b49\u5acc\u7591\uff0c\u62a5\u6848\u540e\u4e0d...\\n\u8fd9\u4e2a\u662f\u4e00\u4e2a\u5927\u5bb6\u90fd\u9047\u5230\u8fc7\u7684\u95ee\u9898\uff0c\u73b0\u5728\u65e0\u8bba\u5728\u54ea\u91cc\u505c\u8f66\uff0c\u90fd\u662f\u53ea\u63d0\u4f9b\u573a\u5730\u4e0d\u8d1f\u8d23\u4fdd\u7ba1\u7684\uff0c\u8fd9\u662f\u6709\u6cd5\u5f8b\u652f\u6301\u7684\uff0c\u6240\u4ee5\u4f60\u627e\u996d\u5e97\u6ca1\u6709\u7528\uff0c\u5250\u8e6d\u770b\u4e0d\u5230\u5bf9\u65b9\u8f66\uff0c\u53ea\u6709\u81ea\u5df1\u62a5\u4fdd\u9669\u4e86\u3002\\n\u5982\u679c\u4f60\u7684\u8f66\u6ca1\u8d70\uff0c\u8f66\u4e3b\u7b2c\u4e00\u65f6\u95f4\u8054\u7cfb\u4e0a\u4f60\uff0c\u5e76\u4e14\u4f60\u4e3b\u52a8\u627f\u8ba4\u4f60\u7684\u8d23\u4efb\u7684\u8bdd\u4e0d\u7b97\u9003\u9038\u3002\u4f46\u662f\u5982\u679c\u8f66\u4e3b\u8054\u7cfb\u5230\u4f60\uff08\u6216\u8005\u65e0\u6cd5\u8054\u7cfb\u4f60\uff09\uff0c\u4f60\u4e0d\u627f\u8ba4\u662f\u4f60\u7684\u8d23\u4efb\uff0c\u7136\u540e\u5bf9\u65b9\u901a\u8fc7\u62a5\u8b66\uff0c\u5728\u4ee5\u8b66\u5bdf\u786e\u8ba4\u662f\u4f60\u7684\u8d23\u4efb\u540e\uff0c\u90a3\u4f60\u5c31\u5c5e\u4e8e\u9003\u9038\u3002\u8087\u4e8b\u9003\u9038\u4e0d\u5206\u4e3b\u89c2\u548c\u5ba2\u89c2\uff0c\u5c31\u7b97\u4f60\u4e3b...\\n\u8f7b\u5fae\u5250\u8e6d\uff0c\u662f\u5f00\u8f66\u5e38\u6709\u7684\u4e8b\u60c5\uff0c\u5f53\u65f6\u4e0d\u5728\u573a\uff0c\u4e00\u822c\u4e5f\u5c31\u4f1a\u7b97\u4e86\u3002\u5982\u679c\u4e00\u5b9a\u8981\u8ba4\u771f\uff0c\u5c31\u62a5\u4ea4\u8b66\uff0c\u8fd8\u8981\u4fdd\u7559\u5728\u73b0\u573a\uff0c\u7b49\u4ea4\u8b66\u53d6\u8bc1\u3002\u5982\u679c\u6ca1\u6709\u4e86\u73b0\u573a\uff0c\u4e00\u822c\u4f60\u62a5\u8b66\u540e\u4ea4\u8b66\u4f1a\u5e2e\u4f60\u67e5\u5230\u5f00\u8f66\u7684\u4eba\uff0c\u5982\u679c\u90a3\u4eba\u4e0d\u627f\u8ba4\uff0c\u4f60\u81ea\u5df1\u5c31\u8981\u627e\u8bc1\u4eba\uff0c\u5982\u679c\u90a3\u4eba\u627f\u8ba4\uff0c\u4ea4\u8b66\u4f1a\u8ba9\u4f60\u4eec\u534f\u5546...\\n\u8981\u770b\u5177\u4f53\u60c5\u51b5\uff0c\u5982\u679c\u90fd\u4e70\u4e86\u4fdd\u9669\uff0c\u5c31\u76f4\u63a5\u62a5\u4fdd\u9669\u8d70\u6d41\u7a0b\u5c31\u53ef\u4ee5\u4e86\uff0c\u53cd\u6b63\u90fd\u662f\u4fdd\u9669\u516c\u53f8\u8d54\uff1b\u5982\u679c\u6ca1\u6709\u4e70\u4fdd\u9669\uff0c\u5efa\u8bae\u53cb\u597d\u534f\u5546\uff0c\u662f\u5728\u534f\u5546\u4e0d\u6210\u7684\u518d\u9009\u62e9\u62a5\u8b66\u5904\u7406\u3002\\n\u4e0d\u7acb\u6848\uff0c\u81ea\u884c\u534f\u5546\u5904\u7406\u3002\"",
  "\"\u5170\u5dde\uff08\u786c\u73cd\u54c1\uff092025\u5e74\u5728\u591a\u6570\u57ce\u5e02\u7ef4\u630118-20\u5143/\u5305\u7684\u96f6\u552e\u4ef7\uff0c\u6574\u6761\u8d2d\u4e70\u4ef7\u683c\u4e3a180-200\u5143\u3002\u8fd9\u6b3e\u4fd7\u79f0\\\"\u9ed1\u5170\u5dde\\\"\u7684\u7ecf\u5178\u70e4\u70df\uff0c\u51ed\u501f\u7ef5\u9999\u578b\u53e3\u611f\u4e0e\u9ad8\u6027\u4ef7\u6bd4\uff0c\u572820\u5143\u6863\u5e02\u573a\u6301\u7eed\u5360\u636e\u897f\u5317\u5730\u533a\u00b7\u00b7\u00b7\\n2025\u5e74\u4e07\u5b9d\u8def\u4e2d\u652f\u5355\u76d2\u96f6\u552e\u4ef7\u7a33\u5b9a\u572825\u5143/\u5305\uff0c\u6761\u76d2\u6279\u53d1\u4ef7215\u5143/\u6761\uff08\u7ea6\u540821.5\u5143/\u76d2\uff09\uff0c\u5e7f\u4e1c\u3001\u6d59\u6c5f\u7b49\u6cbf\u6d77\u5730\u533a\u56e0\u8fdb\u53e3\u7a0e\u8d39\u56e0\u7d20\u666e\u904d\u6ea2\u4ef7\u81f328-30\u5143/\u5305\u3002
  \u4f5c\u4e3a\u83f2\u83ab\u56fd\u9645\u65d7\u4e0b\u7ecf\u5178\u4ea7\u54c1\u00b7\u00b7\u00b7\\n\u76ee\u524d\u5e02\u573a\u4e0a\u6807\u4ef7100\u5143/\u5305\u7684\u547c\u4f26\u8d1d\u5c14\u5929\u4e4b\u97f5\u9999\u70df\u5747\u975e\u6b63\u54c1\uff0c\u8be5\u4ea7\u54c1\u5b98\u65b9\u5b9a\u4ef7\u4e3a26\u5143/\u76d2\uff0c\u5355\u6761\u552e\u4ef7260\u5143\u3002
  \u4e2d\u56fd\u70df\u8349\u603b\u516c\u53f82025\u5e74\u6700\u65b0\u4ef7\u683c\u76ee\u5f55\u663e\u793a\uff0c\u5929\u4e4b\u97f5\u7cfb\u5217\u4ece\u672a\u63a8\u51fa\u767e\u5143\u7ea7\u4ea7\u54c1\u00b7\u00b7\u00b7\\n\u9ec4\u5c71\u98ce\u666f\u533a\u73b0\u5b58\u9ad8\u6e05\u6444\u5f71\u56fe\u8d85\u8fc78000\u5f20\uff0c\u5176\u4e2d\u822a\u62cd\u5168\u666f\u56fe\u5206\u8fa8\u7387\u8fbe8K\u7ea7\u522b\uff0c\u53ef\u5728\u5b89\u5fbd\u7701\u6587\u65c5\u5385\u5b98\u7f51\u514d\u8d39\u4e0b\u8f7d\u3002\u4e13\u4e1a\u6444\u5f71\u5e73\u53f0\u5982\u6444\u56fe\u7f51\u6536\u5f55\u4e862668\u5f20\u9ec4\u5c71\u5b9e\u666f\u56fe\uff0c\u6db5\u76d6\u56db\u5b63\u98ce\u5149\u4e0e\u7279\u6b8a\u6c14\u00b7\u00b7\u00b7\\n\u4e1c\u4eac\u65b0\u5bbf\u4fbf\u5229\u5e97\u7684\u4e07\u5b9d\u8def\u4e09\u89d2\u6ee4\u5634\u6b3e\u65e5\u5747\u9500\u91cf\u7a81\u7834300\u76d2\uff0c\u5176\u4e2d\u51b0\u84dd\u7206\u73e0\u4e09\u89d2\u6ee4\u5634\u4ee532\u5143/\u76d2\u7684\u4ef7\u683c\u5360\u636e45%\u5e02\u573a\u4efd\u989d\u3002\u8fd9\u4e2a\u4e09\u89d2\u5f62\u8bbe\u8ba1\u7edd\u975e\u88c5\u9970\u2014\u2014\u83f2\u5229\u666e\u83ab\u91cc\u65af\u5b9e\u9a8c\u5ba4\u6570\u636e\u663e\u793a\uff0c\u4e09\u89d2\u00b7\u00b7\u00b7\\n\u8299\u84c9\u738b\u9886\u822a\u7cfb\u5217\u4ee5\\\"\u4e09\u6bb5\u5f0f\u5473\u89c9\u4ea4\u54cd\\\"\u8457\u79f0\uff0c\u70b9\u71c3\u521d\u6bb5\u5448\u73b0\u6728\u9999\u4e0e\u575a\u679c\u9999\u4ea4\u7ec7\uff0c\u4e2d\u6bb5\u91ca\u653e\u7126\u7cd6\u751c\u611f\u4e0e\u6de1\u96c5\u82b1\u871c\u8c03\uff0c\u5c3e\u6bb5\u4fdd\u7559\u8299\u84c9\u738b\u7279\u6709\u7684\u672c\u8349\u56de\u7518\u3002\u5176\u70df\u6c14\u6210\u56e2\u6027\u4f18\u5f02\uff0c\u5165\u5589\u987a\u6ed1\u65e0\u707c\u70e7\u00b7\u00b7\u00b7\\n\u4e2d\u534e\u9999\u70df\u5728\u552e\u5e38\u89c4\u4ea7\u54c1\u51718\u4e2a\u7cfb\u5217\uff0c\u4ef7\u683c\u8de8\u5ea6\u4ece45\u5143/\u5305\u5230100\u5143/\u5305\u4e0d\u7b49\u3002
  \u4e0a\u6d77\u70df\u8349\u96c6\u56e2\u81ea1951\u5e74\u63a8\u51fa\u4e2d\u534e\u54c1\u724c\u4ee5\u6765\uff0c\u8fd9\u6b3e\u627f\u8f7d\u7279\u6b8a\u5386\u53f2\u8bb0\u5fc6\u7684\u9999\u70df\u5df2\u5f62\u6210\u5b8c\u6574\u4ea7\u54c1\u4f53\u7cfb\u3002\u6839\u636e\u56fd\u5bb6\u70df\u00b7\u00b7\u00b7\\n\u9752\u85cf\u9ad8\u539f\u7684\u7267\u6c11\u624e\u897f\uff0c\u57282023\u5e74\u51ac\u866b\u590f\u8349\u91c7\u6536\u5b63\u901a\u8fc7\u653f\u5e9c\u642d\u5efa\u7684\u7535\u5546\u5e73\u53f0\uff0c\u5c06\u81ea\u5bb6\u91c7\u6316\u7684\u866b\u8349\u4ee5\u6bcf\u514b380\u5143\u7684\u4ef7\u683c\u76f4\u63a5\u5356\u7ed9\u4e0a\u6d77\u5ba2\u6237\uff0c\u8fd9\u4e2a\u4ef7\u683c\u6bd410\u5e74\u524d\u7ffb\u4e864\u500d\u3002\u51ac\u866b\u590f\u8349\u4ea7\u4e1a70\u5e74\u00b7\u00b7\u00b7\\n\u4e2d\u592e\u5927\u8857\u9500\u552e\u7684\u9999\u70df\u4e3b\u8981\u6e90\u81ea\u54c8\u5c14\u6ee8\u672c\u5730\u70df\u5382\uff0c\u5176\u4e2d\u8001\u5df4\u593a\u3001\u592a\u9633\u5c9b\u3001\u6797\u6d77\u7075\u829d\u4e09\u5927\u54c1\u724c\u5360\u636e80%\u5e02\u573a\u4efd\u989d\u3002\u8fd9\u4e9b\u9999\u70df\u7684\u751f\u4ea7\u57fa\u5730\u4f4d\u4e8e\u9999\u574a\u533a\u6210\u9ad8\u5b50\u9547\u7684\u54c8\u5c14\u6ee8\u5377\u70df\u5382\uff0c\u8be5\u5382\u524d\u8eab\u662f190\u00b7\u00b7\u00b7\"",
  "\"\u4e5d\u5dde\u56fd\u9645:\u7537\u5b50\u76f4\u64ad\u6254\u5171\u4eab\u5355\u8f66\u8b66\u65b9\u6293\u83b7\u4e24\u540d\u5acc\u7591\u4eba
  \u6587\u4e2d\u63d0\u5230\u4e86\u4e00\u79cd\u72b6\u51b5\uff1a\u201c\u4e00\u4e9b\u5b66\u751f\u5982\u679c\u8bfe\u95f4\u4e0a\u5395\u6240\uff0c\u5bb9\u6613\u6253\u4e71\u8001\u5e08\u4e0a\u8bfe\u601d\u8def\uff0c\u800c\u5f88\u591a\u5b66\u751f\u8bf4\u51fa\u53bb\u4e0a\u5395\u6240\u5176\u5b9e\u662f\u5230\u5b66\u6821\u95f2\u901b\u3002\u201d\u5b66\u751f\u5047\u501f\u4e0a\u5395\u6240\u7684\u540d\u4e49\u5b81\u53ef\u5728\u5b66\u6821\u5077\u95f2\uff0c\u4e5f\u4e0d\u613f\u610f\u5728\u8bfe\u5802\u4e0a\u542c\u8bfe\uff0c\u662f\u5b66\u751f\u7eaa\u5f8b\u6027\u4e0d\u5f3a\uff0c\u8fd8\u662f\u8001\u5e08\u8bb2\u5f97\u592a\u5dee\u6240\u81f4\u5462\uff1f\u518d\u8bf4\uff0c\u5b66\u6821\u6709\u4ec0\u4e48\u597d\u901b\u7684\u5462\uff1f
  \u591a\u5e74\u6765\uff0c\u4e00\u652f\u652f\u7531\u8001\u4e13\u5bb6\u3001\u8001\u6559\u6388\u7ec4\u6210\u7684\u6559\u5b66\u5de1\u89c6\u7763\u5bfc\u961f\u4f0d\uff0c\u5728\u534e\u4e2d\u519c\u5927\u7684\u6559\u80b2\u6559\u5b66\u548c\u79d1\u7814\u5b9e\u8df5\u4e2d\uff0c\u8d77\u5230\u4e86\u4e0d\u53ef\u4f30\u91cf\u7684\u91cd\u8981\u4f5c\u7528\u3002\u901a\u8fc7\u5bf9\u5b9e\u9a8c\u8bfe\u548c\u5b9e\u4e60\u6761\u4ef6\u7684\u68c0\u67e5\u5206\u6790\uff0c\u5de1\u89c6\u7ec4\u5efa\u8bae\uff0c\u5e94\u5f53\u7edf\u4e00\u89c4\u5212\uff0c\u5206\u671f\u5206\u6279\u5168\u9762\u5efa\u8bbe\u5404\u4e2a\u4e13\u4e1a\u7684\u6559\u5b66\u5b9e\u4e60\u57fa\u5730\u3002[\u8be6\u7ec6]
  \u793e\u4f1a\u5f62\u6001\u66f4\u66ff\u7684\u5fc5\u7136\u6027\u662f\u6307\u793e\u4f1a\u53d1\u5c55\u8fc7\u7a0b\u4e2d\u7684\u51b3\u5b9a\u6027\uff0c\u793e\u4f1a\u5f62\u6001\u4f9d\u6b21\u66f4\u66ff\u7684\u8fc7\u7a0b\u548c\u89c4\u5f8b\u662f\u5ba2\u89c2\u7684\uff0c\u5176\u53d1\u5c55\u7684\u57fa\u672c\u8d8b\u52bf\u662f\u786e\u5b9a\u4e0d\u79fb\u7684\uff0c\u4e5f\u5c31\u662f\u793e\u4f1a\u53d1\u5c55\u662f\u4e00\u79cd\u81ea\u7136\u5386\u53f2\u8fc7\u7a0b\u3002\u4eba\u4eec\u7684\u5386\u53f2\u9009\u62e9\u6027\u5373\u793e\u4f1a\u53d1\u5c55\u8fc7\u7a0b\u4e2d\u7684\u9009\u62e9\u6027\uff0c\u662f\u6307\u793e\u4f1a\u4e3b\u4f53\u4ee5\u4e00\u5b9a\u7684\u65b9\u5f0f\u5728\u53ef\u80fd\u6027\u7a7a\u95f4\u4e2d\u6709\u610f\u8bc6\u3001\u6709\u76ee\u7684\u5730\u6307\u5411\u786e\u5b9a\u5bf9\u8c61\u7684\u521b\u9020\u6027\u6d3b\u52a8\u3002
  \u4e5d\u5dde\u56fd\u9645:\u660e\u8d77\u6e56\u5357\u5929\u6c14\u8f6c\u597d\u6c14\u6e29\u56de\u5347
  \u8d75\u6811\u7406\u7684\u5c0f\u8bf4\u300a\u5c0f\u4e8c\u9ed1\u7ed3\u5a5a\u300b\u91cc\u6709\u4e2a\u4ee4\u4eba\u4f5c\u5455\u7684\u4e09\u4ed9\u59d1\uff0c\u8001\u4e86\u8fd8\u800d\u5f04\u4eba\uff0c\u770b\u8fc7\u5c0f\u8bf4\u7684\u4eba\u6ca1\u6709\u4e0d\u5632\u7b11\u5979\u7684\uff0c\u53ef\u636e\u8bf4\u5916\u56fd\u4eba\u5374\u5f88\u559c\u6b22\u8fd9\u4e2a\u4eba\u7269\uff0c\u8bf4\u5979\u70ed\u7231\u751f\u6d3b\uff0c\u5f88\u5f00\u653e\uff0c\u5f88\u70ed\u60c5\u3002\u6587\u5316\u4e0a\u7684\u5dee\u5f02\u9020\u6210\u5bf9\u540c\u4e00\u4e8b\u7269\u7684\u8ba4\u8bc6\u4e0d\u4e00\u81f4\uff0c\u8fd9\u5f88\u6b63\u5e38\u3002
  \u70ed\u5fc3\u7684\u5b66\u53cb\u7adf\u7ed9\u6211\u501f\u4e86\u4e00\u5f20\u522b\u4eba\u7684\u6587\u51ed\uff0c\u786c\u62c9\u770b\u6211\u53bb\u8003\u521d\u4e2d\u3002\u5f53\u65f6\u5bb6\u91cc\u7a77\uff0c\u5988\u5988\u7ed9\u4e86\u4e94\u89d2\u94b1\uff0c\u5728\u4e00\u4e2a\u6708\u5149\u4f3c\u6c34\u7684\u665a\u4e0a\uff0c\u548c\u540c\u5b66\u4eec\u8d70\u4e86\u4e00\u4e2a\u901a\u5bb5\uff0c\u5929\u4eae\u65f6\u8d76\u5230\u90b5\u9633\u5e02\uff0c\u5403\u4e86\u4e24\u5206\u94b1\u7684\u8c46\u82bd\u83dc\u767d\u996d\u3002\u90a3\u662f\u7b2b\u4e00\u6b21\u5403\u6cb9\u90fd\u90fd\u3001\u8106\u5ae9\u5ae9\u7684\u8c46\u82bd\u83dc\uff0c\u90a3\u6ecb\u5473\u513f\u81f3\u4eca\u8bb0\u5fc6\u72b9\u65b0\u3002\u62a5\u540d\u540e\u7b2c\u4e8c\u5929\u53c2\u52a0\u4e86\u8003\u8bd5\u3002\u8003\u5b8c\u7acb\u9a6c\u53c8\u8fde\u591c\u56de\u4e86\u5bb6\u3002\u6211\u7684\u540c\u5b66\u591a\u534a\u7559\u5728\u57ce\u91cc\u7b49\u7740\u653e\u699c\uff0c\u6211\u4e00\u6ca1\u94b1\u5446\u4e86\uff0c\u4e8c\u4e0d\u62b1\u4efb\u4f55\u5e7b\u60f3\uff0c\u4e3b\u8981\u662f\u966a\u540c\u5b66\u89c1\u89c1\u4e16\u9762\uff0c\u58ee\u58ee\u80c6\uff0c\u597d\u591a\u4eba\u8003\u4e86\u4e09\u5e74\u90fd\u6ca1\u8003\u4e0a\uff0c\u6211\u7b97\u4ec0\u4e48\uff1f
  \u9996\u5148\uff0c\u8bc4\u5377\u8001\u5e08\u80fd\u591f\u8bc6\u522b\u6a21\u677f\uff0c\u662f\u56e0\u4e3a\u5728\u5927\u5bb6\u7684\u6587\u7ae0\u4e2d\u6a21\u677f\u7684\u53e5\u5b50\u548c\u81ea\u5df1\u5199\u7684\u53e5\u5b50\u51fa\u73b0\u4e25\u91cd\u4e24\u6781\u5206\u5316\uff0c\u826f\u83a0\u4e0d\u9f50\u3002\u8fd9\u6837\u4f5c\u6587\u5f97\u5206\u80af\u5b9a\u4f1a\u53d7\u5f71\u54cd\u3002\u53e6\u5916\uff0c\u5982\u679c\u751f\u642c\u786c\u5957\u7528\u6a21\u677f\uff0c\u518d\u6b21\u51fa\u73b0\u524d\u9762\u63d0\u5230\u7684\u90a3\u6837\u7684\u95ee\u9898\uff0c\u90a3\u6050\u6015\u540e\u679c\u4e5f\u4e0d\u4f1a\u5f88\u7406\u60f3\u3002
  \u4e5d\u5dde\u56fd\u9645\u7535\u5b50\u5a31\u4e50:\u201c\u6551\u547d\u836f\u201d\u602a\u76f8\uff1a\u201c\u9ed1\u5e02\u201d\u6cdb\u6ee5\u533b\u9662\u4e70\u4e0d\u5230
  \u300a\u6559\u80b2\u89c4\u5212\u7eb2\u8981\u300b\u8fd8\u63d0\u51fa\u8981\u201c\u52aa\u529b\u7f29\u5c0f\u533a\u57df\u5dee\u8ddd\u201d\u3002\u52a0\u5927\u5bf9\u9769\u547d\u8001\u533a\u3001\u6c11\u65cf\u5730\u533a\u3001\u8fb9\u7586\u5730\u533a\u3001\u8d2b\u56f0\u5730\u533a\u4e49\u52a1\u6559\u80b2\u7684\u8f6c\u79fb\u652f\u4ed8\u529b\u5ea6\u3002\u9f13\u52b1\u53d1\u8fbe\u5730\u533a\u652f\u63f4\u6b20\u53d1\u8fbe\u5730\u533a\u3002
  \u978d\u5c71\u5e08\u8303\u5b66\u9662\u5927\u5b66\u751f\u201c\u8fdb\u8857\u5165\u6821\u201d\u6d3b\u52a8\u5f00\u59cb\u4e8e\uff12\uff10\uff10\uff14\u5e74\u3002\u5b66\u9662\u6bcf\u5e74\u62db\u52df\uff11\uff10\uff10\u591a\u540d\u54c1\u5b66\u517c\u4f18\u7684\u5927\u5b66\u751f\u4f5c\u4e3a\u5fd7\u613f\u8005\uff0c\u524d\u5f80\u5e02\u5185\u62c5\u4efb\u8857\u9053\u4e3b\u4efb\u52a9\u7406\u3001\u793e\u533a\u4e66\u8bb0\u52a9\u7406\u548c\u4e2d\u5c0f\u5b66\u6821\u56e2\u59d4\u4e66\u8bb0\u3001\u5c11\u5148\u961f\u8f85\u5bfc\u5458\u52a9\u7406\u7b49\u804c\u52a1\u3002\u5728\u6bcf\u5e74\u4e3a\u671f\uff13\u4e2a\u6708\u7684\u670d\u52a1\u4e2d\uff0c\u5fd7\u613f\u8005\u5728\u4e0d\u5f71\u54cd\u8bfe\u7a0b\u7684\u524d\u63d0\u4e0b\u5b9a\u671f\u201c\u4e0a\u73ed\u201d\uff0c\u4ece\u4e8b\u793e\u533a\u4e8b\u52a1\u7ba1\u7406\u3001\u670d\u52a1\u5b66\u6821\u6559\u80b2\u7b49\u5de5\u4f5c\u3002\u76ee\u524d\u5b66\u9662\u5df2\u7ecf\u6d3e\u51fa\uff14\u6279\uff15\uff10\uff10\u4f59\u540d\u5fd7\u613f\u8005\uff0c\u4e3a\uff11\uff14\uff10\u5bb6\u5355\u4f4d\u670d\u52a1\u3002
  \u4ee5\u7f8e\u56fd\u4e3a\u4f8b\uff0c\u5927\u5b66\u7684\u5f00\u529e\u548c\u8ba4\u8bc1\u662f\u5206\u5f00\u7684\u3002\u4efb\u4f55\u4e2a\u4eba\u548c\u673a\u6784\u90fd\u53ef\u7533\u8bf7\u529e\u9ad8\u7b49\u6559\u80b2\uff0c\u4f46\u5b66\u6821\u7684\u529e\u5b66\u8d28\u91cf\u548c\u6587\u51ed\u5374\u4e0d\u4e00\u5b9a\u80fd\u88ab\u56fd\u5bb6\u6743\u5a01\u8ba4\u8bc1\u673a\u6784\u8ba4\u53ef\u3002
  \u4e5d\u5dde\u56fd\u9645\u7535\u5b50\u5a31\u4e50:\u5b5d\u987a\u5988\u5988\u662f\u4f60\u7684\u4eba\u751f\u7406\u60f3\uff0c\u5374\u6ca1\u5728\u4f60\u7684\u8ba1\u5212\u6e05\u5355\u4e0a
  \u80fd\u529b\u8981\u6c42\u6709\u4fe9\u53d8\u52a8 \u4eba\u4e8b\u4e13\u5bb6\u5f20\u5973\u58eb\u8ba4\u4e3a\uff1a\u7f3a\u5c11\u53d1\u5c55\u7a7a\u95f4\u5df2\u7ecf\u6210\u4e3a\u73b0\u5728\u7684\u6c88\u9633\u9752\u5e74\u8df3\u69fd\u7684\u6700\u4e3b\u8981\u539f\u56e0\uff0c\u5e76\u4e14\uff0c\u6587\u5316\u7a0b\u5ea6\u8d8a\u9ad8\u7684\u9752\u5e74\uff0c\u559c\u7231\u81ea\u5df1\u73b0\u6709\u5de5\u4f5c\u7684\u4eba\u6570\u6bd4\u4f8b\u53cd\u800c\u8d8a\u5c11\u3002\u5728\u6211\u4eec\u7684\u8c03\u67e5\u4e2d\u53d1\u73b0\uff0c\u4e0d\u540c\u5b66\u5386\u3001\u804c\u4e1a\u548c\u5e74\u9f84\u7684\u7fa4\u4f53\uff0c\u559c\u6b22\u81ea\u5df1\u5de5\u4f5c\u7684\u4eba\u6570\u6bd4\u4f8b\u4e5f\u5b58\u5728\u660e\u663e\u5dee\u5f02\u3002\u968f\u7740\u5b66\u5386\u7684\u589e\u9ad8\uff0c\u201c\u5f88\u559c\u6b22\u201d\u73b0\u6709\u5de5\u4f5c\u7684\u9752\u5e74\u6bd4\u4f8b\u8d8a\u6765\u8d8a\u5c11\uff0c\u4ece\u521d\u4e2d\u6587\u5316\u7a0b\u5ea6\u7fa4\u4f53\u768434.9\u9010\u6e10\u4e0b\u964d\u5230\u672c\u79d1\u7fa4\u4f53\u768419.4\u3002
  \u672c\u6b21\u6d3b\u52a8\u7531\u8fbd\u5b81\u7701\u7cbe\u795e\u6587\u660e\u529e\u3001\u7701\u6559\u80b2\u5385\u3001\u56e2\u7701\u59d4\u7b49\u90e8\u95e8\u8054\u5408\u4e3e\u529e\u3002\u6d3b\u52a8\u671f\u95f4\uff0c\u5168\u7701\u5c06\u5236\u5b9a\u5168\u7701\u4e2d\u5c0f\u5b66\u751f\u201c\u6587\u660e\u4e0a\u7f51\u516c\u7ea6\u201d\uff0c\u5e76\u7ec4\u7ec7\u5b66\u751f\u3001\u5bb6\u957f\u548c\u8001\u5e08\u5728\u7f51\u4e0a\u7b7e\u540d\u627f\u8bfa\uff1b\u5f00\u5c55\u7f51\u7edc\u5f81\u6587\u6d3b\u52a8\uff0c\u53f7\u53ec\u5b66\u751f\u628a\u8eab\u8fb9\u7684\u597d\u4eba\u597d\u4e8b\u5199\u6210\u6587\u7ae0\u53d1\u5e03\u5728\u7f51\u4e0a\uff1b\u5f00\u5c55\u4e2d\u5c0f\u5b66\u751f\u201c\u535a\u5ba2\u5927\u8d5b\u201d\uff0c\u5728\u5168\u770141\u6240\u672a\u6210\u5e74\u4eba\u601d\u60f3\u9053\u5fb7\u5efa\u8bbe\u793a\u8303\u682130\u7684\u73ed\u7ea7\u5efa\u7acb\u56e2\u4f53\u535a\u5ba2\u3002\u6b64\u5916\uff0c\u5168\u7701\u8fd8\u5c06\u5f00\u5c55\u7ea2\u8272\u4e2d\u534e\u7f51\u7edc\u5c55\u64ad\u3001\u7cfb\u5217\u7f51\u7edc\u7ade\u8d5b\u3001\u9009\u62d4\u6587\u660e\u4e0a\u7f51\u5fd7\u613f\u8f85\u5bfc\u5458\u548c\u5bb6\u5ead\u6559\u80b2\u6307\u5bfc\u7b49\u4e00\u7cfb\u5217\u6d3b\u52a8\uff0c\u4f7f\u9752\u5c11\u5e74\u5728\u6587\u660e\u7684\u7f51\u7edc\u73af\u5883\u4e2d\u5065\u5eb7\u6210\u957f\u3002
  \u4e5d\u5dde\u56fd\u9645\u6ce8\u518c\u900135:\u957f\u6c99\u65e0\u73af\u4fdd\u6807\u8f66\u8d70\u9650\u884c\u533a\u7f5a100\u5143\u9065\u611f\u76d1\u6d4b\u5c3e\u6c14
  \u201c\u6211\u66fe\u8003\u8fc7\u516c\u52a1\u5458\uff0c\u6ca1\u8003\u4e0a\uff0c\u53c2\u52a0\u8fc7\u51e0\u6b21\u62db\u8058\u4f1a\uff0c\u4e5f\u6ca1\u627e\u5230\u5408\u9002\u7684\u804c\u4f4d\u3002\u201d\u674e\u5fb7\u670b\u8bf4\uff0c\u201c\u6211\u5bb6\u5728\u7261\u4e39\u6c5f\uff0c\u6211\u51b3\u5b9a\u901a\u8fc7\u81ea\u5df1\u7684\u6253\u62fc\u7559\u5728\u54c8\u5c14\u6ee8\u3002\u672c\u6765\u60f3\u505a\u7535\u8111\u65b9\u9762\u7684\u751f\u610f\uff0c\u4f46\u6295\u5165\u5927\uff0c\u5f88\u96be\u505a\u3002\u4e34\u6bd5\u4e1a\u524d\u51e0\u4e2a\u6708\uff0c\u6211\u4e86\u89e3\u5230\u773c\u955c\u884c\u4e1a\u6295\u5165\u76f8\u5bf9\u5c0f\u4e9b\uff0c\u800c\u4e14\u773c\u955c\u8fd9\u4e1c\u897f\u8fd8\u6ca1\u6709\u4fdd\u8d28\u671f\uff0c\u5c31\u51b3\u5b9a\u5e72\u8fd9\u4e00\u884c\u8bd5\u8bd5\u3002\u201d\\n\u4e5d\u5dde\u56fd\u9645\u7ebf\u4e0a\u8001\u864e\u673a\"",
  "\"\u5973\u4eba\u4e3a\u4ec0\u4e48\u7a81\u7136\u6027\u51b7\u6de1\u5546\u54c1\u63cf\u8ff0\uff1a\\n\u4ecb\u7ecd\u5c55\u793a\u201c\u5973\u4eba\u4e3a\u4ec0\u4e48\u7a81\u7136\u6027\u51b7\u6de1\u201d\u7684\u53c2\u6570\u3001\u6027\u80fd\u3001\u79d1\u6280\u3001\u7279\u70b9\u53ca\u5b9e\u62cd\u56fe\u7247\u3002\\n\u7537\u5b50\u5978\u674013\u5c81\u5973\u5b69\u5e76\u711a\u5c38
  \u968f\u8eab\u643a\u5e26\u6027\u836f\u5973\u4eba\u6027\u836f,\\n\u5468\u89c5\u56de\u5e94\u4e8b\u4ef6\u4e0d\u8981\u6211\u4e0d\u7231\u56fd2015\u5e742\u67088\u65e5
  \u661f\u671f\u65e5\u8ff7\u9b42\u836f,\\n\u8ff7\u60c5\u836f\u6b32\u540c\u4e8b \u906d\u540e\u9001\u7ed9\u4f84\u5b50\u4eab\u7528,\\n\u73af\u4fdd\u516c\u53f8\u7ecf\u7406\u517c\u5dee\u5356\u5931\u5fc6\u6c34
  \u7ebf\u4e0a\u6559\u6388\u672f,\\n\u98df\u54c1\u836f\u54c1\u76d1\u7ba1\u603b\u5c409\u5bb6\u8fdd\u6cd5\u53d1\u5e03\u865a\u5047\u4fe1\u606f\u7f51\u7ad92015\u5e742\u67087\u65e5
  ...,\\n\u7537\u5b50\u8ba9\u59bb\u5b50\u548c\u540c\u4e8b\u501f\u79cd \u4e0b\u5c06\u59bb\u5b50\u9001\u4eba\u6027\u4fb5_\u8ff7\u836f,\\n\u542c\u8bdd\u6c34\u7f8e\u56fd\u9996\u6b21\u9a8c\u8bc1\u58f0\u6ce2\u53ef\u8ba9\u5149\u7ea4\u4e2d\u7684\u5149\u53d8\u542c\u8bdd,\\n\u6536\u85cf\u65b0\u5ba0\u6c34\u70df\u58f6\u8ff7\u5e7b\u6c34,\\n\u8ff7\u8ff7\u7cca\u7cca\u7ed9\u964c\u751f\u7537\u5b505500\u5143\u4e13\u5bb6\u8bf4NO2015\u5e742\u670811\u65e5
  ...,\\n\u60c5\u5230\u6d53\u5904\u81ea\u6709\u9999\u4e9a\u9a6c\u900a\u4e2d\u56fd\u60c5\u4eba\u8282\u9999\u6c34\u63a8\u83502015\u5e742\u67087\u65e5
  \u661f...,\\n\u7f51\u4f20\u4e24\u5973\u5b50\u4e0a\u95e8\u501f\u9001\u798f\u5b57\u4e4b\u540d\u4e0b\u5077\u5b69\u5b50
  \u8b66\u65b9\u8ff7\u836f,\\n\u89e3\u5bc6\u53e4\u4ee3\u90a3\u4e9b \u770b\u770b\u53e4\u4eba\u662f\u600e\u4e48\u953b\u70bc\u6027\u80fd\u529b\u76842015\u5e742\u670815\u65e5...,\\n\u6eda\u52a8\u64ad\u653e\u6027\u836f\u4f53\u9a8c
  \u5c3a\u5ea6\u582a\u6bd4\u5c0f\u8bf4\u5973\u4eba\u6027\u836f,\\n\u674e\u82e5\u5f64\u7ecf\u7eaa\u4eba\u5fc6\u6a2a\u5e97\u5f80\u4e8b\u8ff7\u70df\u4ece\u95e8\u7f1d\u5439\u5165,\\n\u5973\u7528\u6cdb\u6ee5
  \u5305\u88c5\u6311\u9017\u6ce8\u660e\u4e13\u7528\u5973\u7528\u6027\u836f,\\n\u8ff7\u5e7b\u7c89Beauty\u4e3b\u5f20\u4e28\u60c5\u4eba\u8282\u5986\u5bb9
  \u5077\u5e082015\u9ad8\u5b9a\u79c0\u573a,\\n\u52a9\u60c5\u897f\u5b89\u8230\u52a0\u5165\u73b0\u5f79
  \u4e2d\u56fd\u795e\u76fe\u8230\u961f\u89c4\u6a21\u8d85\u8d8a\u65e5\u672c\u56fe,\\n\u7ff1\u4e91\u540c\u5fd7\u901d\u4e16,\\n\u5931\u5fc6\u6c34\u5973\u5b50\u559d\u540c\u4e8b\u4e00\u74f6\u6c34\u5931\u5fc6
  \u8863\u670d\u4e0a\u73b0\u6c61\u8ff9\u7591\u906d\u6027\u4fb5,\\n3\u5e74\u5224\u51b3\u5047\u836f\u68486\u6210\u6d89\u6027
  9\u6210\u6848\u4ef6\u627e\u4e0d\u5230\u88ab\u5bb3\u4eba\u6210\u4eba\u6027\u836f,\"",
