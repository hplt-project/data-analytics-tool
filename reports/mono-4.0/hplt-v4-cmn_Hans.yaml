8868\u73b0\uff0c\u5e76\u5c31\u672c\u5b66\u671f\u7684\u5b66\u4e60\u76ee\u6807\u8fdb\u884c\u4e86\u68b3\u7406\uff0c\u6307\u51fa\u5b66\u751f\u4eec\u9700\u4ece\u4e25\u683c\u8bf7\u5047\u5236\u5ea6\u3001\u624b\u673a\u7ba1\u7406\u3001\u65f6\u95f4\u7ba1\u7406\u7b49\u65b9\u9762\u6539\u8fdb\uff0c\u4e3a\u5373\u5c06\u5230\u6765\u7684\u8003\u8bd5\u505a\u597d\u5145\u8db3\u51c6\u5907\u3002...\\n\u4ed6\u4eec\u53c8\u753b\u53c8\u8d34\u53c8\u63c9\uff0c\u5f88\u5feb\uff0c\u4e00\u5e45\u5e45\u753b\u9762\u5e72\u51c0\u6e05\u65b0\uff0c\u8272\u5f69\u51b7\u6696\u5bf9\u6bd4\uff0c\u7206\u7c73\u82b1\u5145\u6ee1\u8d28\u611f\u7684\u753b\u4f5c\u8bde\u751f\u4e86\uff0c\u770b\u8d77\u6765\u771f\u6f02\u4eae\u3002...\\n\u4e00\u7cfb\u5217\u6d3b\u52a8\u6709\u6548\u5730\u4fc3\u8fdb\u4e86\u5e08\u751f\u4eec\u5bf9\u5fc3\u7075\u6210\u957f\u548c\u5fc3\u7406\u5065\u5eb7\u77e5\u8bc6\u7684\u5173\u6ce8\u548c\u4e86\u89e3\uff0c\u4e3a\u5b66\u751f\u4eec\u6811\u7acb\u6b63\u786e\u7684\u5065\u5eb7\u89c2\u5ff5\u3001\u57f9\u517b\u79ef\u6781\u7684\u5fc3\u7406\u54c1\u8d28\u8425\u9020\u4e86\u53cb\u5584\u3001\u5bbd\u5bb9\u3001\u5c0a\u91cd\u3001\u5411\u4e0a\u7684\u73af\u5883\u3002...\\n\u201d\u3002...\\n\u5143\u5bb5\u8282\u524d\u51e0\u65e5\uff0c\u6625\u5bd2\u6599\u5ced\uff0c\u5c0f\u9676\u5b50\u4eec\u8fd8\u672a\u8131\u53bb\u539a\u91cd\u7684\u51ac\u88c5\uff0c\u6bcf\u4e2a\u4eba\u62b1\u7740\u539a\u539a\u4e00\u6c93\u7684\u4e66\uff0c\u5df2\u7ecf\u65e9\u65e9\u5730\u6765\u5230\u62a5\u544a\u5385\u548c\u56fe\u4e66\u9986\u524d\u9762\u6392\u8d77\u4e86\u957f\u9f99\u3002...\\n\u4e0d\u4e00\u4f1a\u513f\uff0c\u5b69\u5b50\u4eec\u5df2\u5c06\u89c2\u5bdf\u5230\u7684\u6625\u610f\u52fe\u52d2\u5728\u7eb8\u4e0a\uff0c\u6bcf\u5e45\u4f5c\u54c1\u4eff\u4f5b\u90fd\u5728\u201c\u8ff0\u8bf4\u201d\u7740\u4e0d\u4e00\u6837\u7684\u6625\u5929\u3002...\\n\u4f20\u7edf\u6587\u5316\u4f20\u627f\u662f\u6211\u4eec\u4e0d\u80fd\u63a8\u8bff\u7684\u91cd\u4efb\u3002...\\n\u867d\u7136\u5176\u4e2d\u6709\u5f88\u591a\u632b\u6298\u3001\u574e\u5777\uff0c\u4f46\u662f\u5728\u4ed6\u7684\u52aa\u529b\u548c\u575a\u6301\u4e4b\u4e0b\uff0c\u8003\u7ea7\u7684\u521d\u5c1d\u6210\u529f\u5230\u5e02\u7ea7\u6bd4\u8d5b\u83b7\u5f97\u8363\u8a89\uff0c\u90fd\u8ba9\u4ed6\u66f4\u575a\u5b9a\u7684\u671d\u7740\u4ed6\u7684\u68a6\u60f3\u800c\u5927\u6b65\u524d\u8fdb\u3002...\\n\u4e2d\u5fc3\u7ec4\u7531\u94b1\u7ea2\u6821\u957f\u4eb2\u81ea\u6302\u5e05\uff0c\u7531\u4fe1\u606f\u79d1\u7814\u5904\u3001\u6559\u5bfc\u5904\u3001\u5fb7\u80b2\u5904\uff0c\u79d1\u7814\u9aa8\u5e72\u6559\u5e08\u5171\u540c\u53c2\u52a0\u3002...\\n\u6821\u56ed\u7684\u7f8e\u4e3d\u9700\u8981\u5927\u5bb6\u5171\u540c\u7684\u52aa\u529b\uff0c\u5927\u961f\u90e8\u8fd9\u6b21\u7279\u610f\u5b89\u6392\u4e86\u516c\u5171\u533a\u57df\u7684\u6e05\u6d01\u6253\u626b\u3002...\\n\u5728\u8bc4\u8bae\u548c\u4e92\u8bc4\u4e2d\uff0c\u5927\u5bb6\u65e2\u5f00\u8bda\u5e03\u516c\u5730\u5f00\u5c55\u81ea\u6211\u6279\u8bc4\uff0c\u53c8\u865a\u5fc3\u8ba4\u771f\u5730\u4e92\u76f8\u542c\u53d6\u610f\u89c1\uff0c\u9488\u5bf9\u5b58\u5728\u7684\u95ee\u9898\u63d0\u51fa\u4e86\u5207\u5b9e\u53ef\u884c\u7684\u6574\u6539\u63aa\u65bd\uff0c\u4e3a\u4eca\u540e\u6574\u6539\u660e\u786e\u4e86\u65b9\u5411\u3002...\\n\u4e03\u5b9d\u4e2d\u5b66\u7684\u5e08\u751f\u89c6\u4ed6\u4e3a\u540d\u4eba\uff0c\u4ed6\u4e5f\u786e\u5b9e\u53ef\u4ee5\u8bf4\u662f\u540d\u4eba\u3002...\\n\u515a\u5458\u5728\u8fdb\u884c\u4e92\u8bc4\u65f6\u4e5f\u80fd\u76f4\u51fb\u95ee\u9898\uff0c\u4e92\u76f8\u6307\u51fa\u9700\u8981\u6539\u8fdb\u7684\u5730\u65b9\u3002...\\n\u5728\u4e0a\u4e00\u9636\u6bb5\u7684\u5e26\u6559\u4e2d\uff0c\u4e0a\u6d77\u5e7c\u513f\u56ed\u7684\u6559\u5e08\u8d70\u8fdb\u4e86\u9633\u5149\u5e7c\u513f\u56ed\uff0c\u5c31\u534a\u65e5\u6d3b\u52a8\u7684\u5185\u5bb9\u548c\u5f62\u5f0f\u8fdb\u884c\u4e86\u4e92\u52a8\uff0c\u5e76\u7740\u91cd\u5bf9\u6e38\u620f\u73af\u5883\u8fdb\u884c\u4e86\u4ea4\u6d41\u7814\u8ba8\uff0c\u529b\u6c42\u8ba9\u6559\u5ba4\u7684\u7a7a\u95f4\u53d8\u5f97\u66f4\u5408\u7406\uff0c\u6e38\u620f\u73af\u5883\u66f4\u81ea\u4e3b\u3002...\\n\u5728\u4e2d\u8003\u65b0\u653f\u843d\u5730\u4e4b\u540e\uff0c\u6821\u65b9\u5c06\u8fdb\u4e00\u6b65\u7814\u7a76\u8bfe\u7a0b\u8bbe\u7f6e\u3001\u8bfe\u5802\u6559\u5b66\u8f6c\u578b\u3001\u6838\u5fc3\u7d20\u517b\u57f9\u517b\u7b49\u91cd\u70b9\u5de5\u4f5c\uff0c\u4e5f\u5e0c\u671b\u4e0e\u4f1a\u7684\u5404\u4f4d\u5bb6\u957f\u80fd\u591f\u4e0e\u5b66\u6821\u79ef\u6781\u914d\u5408\uff0c\u52a0\u5f3a\u6c9f\u901a\uff0c\u5171\u540c\u505a\u597d\u5b69\u5b50\u7684\u6559\u80b2\u5de5\u4f5c\uff0c\u5e2e\u52a9\u5b69\u5b50\u4eec\u4ece\u5bb9\u81ea\u4fe1\u5730\u8d70\u5728\u5b66\u4e60\u8def\u4e0a\u3002...\\n\u8349\u957f\u83ba\u98de\uff0c\u6843\u7ea2\u67f3\u7eff\uff0c\u6625\u5929\u662f\u4e00\u5e74\u4e2d\u6700\u7f8e\u7684\u5b63\u8282\u3002...\\n\u6bd5\u4e1a\u5b63\u4e34\u8fd1\u4e4b\u9645\uff0c\u5b66\u6821\u7279\u6b64\u53d1\u5e032018\u5c4a\u6bd5\u4e1a\u73ed\u53bb\u5411\u4fe1\u606f\uff0c\u4e0e\u5168\u4f53\u5e08\u751f\u5206\u4eab\u559c\u60a6\u3002...\\n\u672c\u6b21\u5f00\u653e\u65e5\u6d3b\u52a8\u5706\u6ee1\u7ed3\u675f\uff0c\u5728\u201c\u6821\u56ed\u5f00\u653e\u65e5\u201d\u53cd\u9988\u8868\u4e0a\u5199\u6ee1\u4e86\u5bb6\u957f\u4eec\u7684\u5fc3\u58f0\uff0c\u4ed6\u4eec\u8868\u8fbe\u4e86\u5bf9\u5b66\u6821\u7684\u611f\u6fc0\uff0c\u5bb6\u957f\u4eec\u5bf9\u5b66\u6821\u7684\u6559\u80b2\u6559\u5b66\u5de5\u4f5c\u7ed9\u4e88\u4e86\u5145\u5206\u7684\u80af\u5b9a\uff0c\u5bf9\u5b66\u6821\u7684\u7ba1\u7406\u548c\u6559\u80b2\u6709\u4e86\u65b0\u7684\u8ba4\u8bc6\uff0c\u4e5f\u5e0c\u671b\u5b66\u6821\u5f00\u5c55\u66f4\u591a\u7c7b\u4f3c\u7684\u6d3b\u52a8\uff0c\u503e\u542c\u5b69\u5b50\u7684\u5fc3\u58f0\uff0c\u8fdb\u4e00\u6b65\u589e\u8fdb\u5bb6\u6821\u4e4b\u95f4\u7684\u6c9f\u901a\u3002...\"",
  "\"\u505a\u4e00\u6b21\u8bd5\u7ba1\u5a74\u513f\u5468\u671f\u6709\u591a\u957f?\u8bd5\u7ba1\u5a74\u513f\u662f\u4e00\u9879\u76f8\u5bf9\u6210\u719f\u7684\u6280\u672f\uff0c\u8d8a\u6765\u8d8a\u591a\u7684\u4eba\u8868\u793a\u613f\u610f\u901a\u8fc7\u8bd5\u7ba1\u5a74\u513f\u52a9\u5b55\u3002\u90a3\u4e48\u505a\u4e2a\u8bd5\u7ba1\u5a74\u513f\u9700\u8981\u591a\u4e45\u5462?\u8087\u5e86\u897f\u6c5f\u533b\u9662\u751f\u6b96\u4e2d\u5fc3\u91d1\u6559\u6388\u6307\u51fa\uff0c\u505a\u8bd5\u7ba1\u5a74\u513f\u8981\u591a\u957f\u65f6\u95f4\u8981\u6839\u636e\u60a3\u8005\u7684\u5375\u5de2\u60c5\u51b5\u6765\u51b3\u5b9a\uff0c\u56e0\u4eba\u800c\u5f02\u3002\\n\u8bd5\u7ba1\u5a74\u513f\u8fc7\u7a0b\u6bd4\u8f83\u957f\uff0c\u5bf9\u5973\u6027\u6765\u8bf4\u6bd4\u8f83\u8f9b\u82e6\u3002\u5177\u4f53\u7684\u6240\u9700\u65f6\u95f4\uff0c\u8981\u6839\u636e\u60a3\u8005\u81ea\u8eab\u60c5\u51b5\u7b49\u56e0\u7d20\u6765\u51b3\u5b9a\u3002\u4e3b\u8981\u5305\u62ec\u4ee5\u4e0b\u51e0\u65b9\u9762\uff1a\\n1)\u524d\u671f\u68c0\u67e5\u9636\u6bb5\uff1a\u901a\u5e38\u65f6\u95f4\u4e3a1-2\u4e2a\u6708\u3002\u7537\u65b9\u9700\u5316\u9a8c\u7cbe\u6db2\uff0c\u5973\u65b9\u4ea6\u9700\u5b8c\u6210\u4e00\u4e9b\u57fa\u672c\u7684\u68c0\u67e5\uff0c\u5982\u5987\u79d1\u68c0\u67e5\u3001\u8bca\u522e\u3001\u8f93\u5375\u7ba1\u901a\u900f\u8bd5\u9a8c\u3001\u6297\u7cbe\u5b50\u6297\u4f53\u3001\u809d\u529f\u80fd\u548c\u4e59\u809d\u4e24\u5bf9\u534a\u3001\u8840\u5e38\u89c4\u5206\u6790\u548c\u51fa\u51dd\u8840\u65f6\u95f4\u53ca\u57fa\u7840\u5185\u5206\u6ccc\u6fc0\u7d20\u6d4b\u5b9a(\u6708\u7ecf\u7b2c3\u5929)\u7b49\u3002\\n2)\u4fc3\u6392\u5375\u3001\u76d1\u6d4b\u5375\u6ce1\u9636\u6bb5\uff1a\u5927\u6982\u57281\u4e2a\u6708\u5de6\u53f3\u3002\u4e00\u822c\u4e8e\u9ec4\u4f53\u4e2d\u671f\u5373\u6708\u7ecf\u7b2c21\u5929\u5f00\u59cb\u7528\u836f\uff0c\u4f7f\u4f53\u5185\u4fc3\u6027\u817a\u6fc0\u7d20\u5904\u4e8e\u4f4e\u6c34\u5e73\uff0c\u7528\u836f8\u5929\u5de6\u53f3\u6708\u7ecf\u6765\u6f6e\uff0c\u6708\u7ecf\u7b2c3\uff5e7\u5929\uff0c\u5f00\u59cb\u808c\u8089\u6ce8\u5c04\u4fc3\u5375\u6ce1\u53d1\u80b2\u7684\u836f\u7269\uff0c3\u5929\u540eB\u8d85\u76d1\u6d4b\u5375\u6ce1\u53d1\u80b2\u60c5\u51b5\uff0c\u8c03\u8282\u7528\u836f\u5242\u91cf\u3002\\n3)\u53d6\u5375\u3001\u53d6\u7cbe-\u80da\u80ce\u4f53\u5916\u57f9\u517b\u5e76\u79fb\u690d\uff1a\u5728\u4fc3\u5375\u6ce1\u53d1\u80b2\u836f\u7269\u5e94\u752810\u5929\u5de6\u53f3\uff0c\u5375\u6ce1\u53d1\u80b2\u6210\u719f\uff0c\u8fd9\u65f6\u7ecfB\u8d85\u5f15\u5bfc\u4e0b\u7ecf\u9634\u9053\u7a79\u7abf\u7a7f\u523a\u53ef\u53d6\u51fa\u5375\u5b50\uff0c\u5728\u4f53\u5916\u6388\u7cbe\uff0c\u57f9\u517b3\u5929\u540e\u6388\u7cbe\u5375\u53d1\u80b2\u6210\u80da\u80ce\u653e\u5165\u5bab\u8154\uff0c\u79fb\u690d\u540e\u5367\u5e8a\u4f11\u606f2\uff5e4\u5c0f\u65f6\u3002\\n4)\u80da\u80ce\u79fb\u690d\u540e\uff1a\u80da\u80ce\u79fb\u690d\u540e\u7b2c14\u5929\u9a8c\u6668\u5c3f\u786e\u5b9a\u662f\u5426\u598a\u5a20;\u5982\u6709\u598a\u5a20\uff0c\u5728\u598a\u5a20\u540e14\u5929\u884cB\u8d85\u68c0\u67e5\u80ce\u513f\u6570\u53ca\u80da\u80ce\u7740\u5e8a\u90e8\u4f4d\u3002\u6b64\u9636\u6bb5\uff0c\u4e00\u822c\u57282\u4e2a\u6708\u5de6\u53f3\u53ef\u5224\u65ad\u8bd5\u7ba1\u5a74\u513f\u662f\u5426\u6210\u529f\uff0c\u7136\u540e\u5b9a\u671f\u5230\u533b\u9662\u9662\u590d\u67e5\u3001\u505a\u597d\u5b55\u68c0\u5373\u53ef\u3002\\n\u4ee5\u4e0a\u662f\u8087\u5e86\u897f\u6c5f\u533b\u9662\u751f\u6b96\u4e13\u5bb6\u5bf9\u6b64\u95ee\u9898\u7684\u5177\u4f53\u63cf\u8ff0\uff0c\u4f5c\u4e3a\u5168\u7701**\u89c4\u6a21\u7684\u8ba1\u5212\u751f\u80b2\u3001\u4f18\u751f\u4f18\u80b2\u57fa\u5730\uff0c\u751f\u6b96\u4e2d\u5fc3\u5229\u7528\u5f53\u4ee3**\u8fdb\u7684\u8f85\u52a9\u751f\u6b96\u6280\u672f\u5f00\u5c55\u4eba\u5de5\u6388\u7cbe\u3001\u8bd5\u7ba1\u5a74\u513f\u3001\u5375\u6ce1\u6d46\u5185\u5355\u7cbe\u5b50\u6ce8\u5c04\u3001\u56ca\u80da\u57f9\u517b\u4e0e\u79fb\u690d\u3001\u80da\u80ce\u51bb\u51dd\u7b49\uff0c\u9488\u5bf9\u4e0d\u540c\u539f\u56e0\u7684\u4e0d\u5b55\u4e0d\u80b2\u7ed9\u4e88\u6700\u79d1\u5b66\u7684\u4e2a\u6027\u5316\u6cbb\u7597\u65b9\u6848\uff0c\u6210\u529f\u7387\u5728\u56fd\u5185\u5904\u4e8e\u9886\u5148\u5730\u4f4d\uff0c\u5728\u767e\u59d3\u4e2d\u4eab\u6709\u826f\u597d\u53e3\u7891\u3002\u5982\u679c\u60a8\u6b63\u906d\u53d7\u4e0d\u5b55\u7684\u56f0\u6270\uff0c\u8bf7\u62e8\u6253\u7535\u8bdd0758-2899999\u83b7\u5f97\u5e2e\u52a9\u3002\\n\u6e29\u99a8\u63d0\u793a:\u4e3a\u4e86\u65b9\u4fbf\u60a3\u8005\u53ca\u6709\u9700\u8981\u7684\u4eba\u66f4\u597d\u7684\u4e86\u89e3\u6240\u60a3\u75be\u75c5\u76f8\u5173\u4fe1\u606f,\u5e7f\u4e1c\u91cd\u70b9\u8bd5\u7ba1\u5a74\u513f\u4e34\u5e8a\uff08\u8087\u5e86\u897f\u6c5f\u533b\u9662\uff09\u751f\u6b96\u4e13\u5bb6\u514d\u8d39\u5728\u7ebf\u54a8\u8be2\u670d\u52a1,\u7531\u4e13\u4e1a\u4e13\u5bb6\u5728\u7ebf\u4e3a\u60a8\u89e3\u7b54\u76f8\u5173\u75be\u75c5\u95ee\u9898,\u6839\u636e\u75c5\u60c5\u63d0\u4f9b\u8f83\u4e13\u4e1a\u6cbb\u7597\u65b9\u6848,\u5e76\u4e3a\u60a8\u7684\u9690\u79c1\u4fdd\u5bc6\u3002\\n\u8bd5\u7ba1\u5a74\u513f
  \u4e0d\u5b55\u4e0d\u80b2\uff08\u5b55\u80b2\u9884\u7ea6\u54a8\u8be2\u70ed\u7ebf\uff09\uff1a0758-2899999\"",
