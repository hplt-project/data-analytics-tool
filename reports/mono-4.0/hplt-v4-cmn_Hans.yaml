  \u7248\u6743\u6240\u6709\"", "\"\u5317\u4eac\u8d5b\u8f66\u600e\u4e48\u52a0\u76df\u7684\u56e2\u7ed3\u548c\u575a\u5f3a\u3002\u5361\u91cc\u4e4c\u65af\u66dd\u8d1d\u5c14\u4eca\u590f\u60f3\u53bb\u66fc\u8054
  \u85aa\u8d44\u4e0e\u5065\u5eb7\u6210\u963b\u788d!\u7a46\u5e05\u8fd8\u8981\u5417\u5317\u4eac\u65f6\u95f45\u670827\u65e5\u51cc\u6668\u6b27\u51a0\u51b3\u8d5b\uff0c\u8d1d\u5c14\u7684\u5927\u5723\u5f52\u6765\u8ba9\u4eba\u4eec\u518d\u4e00\u6b21\u5bf9\u5176\u5728\u7687\u9a6c\u7684\u672a\u6765\u5145\u6ee1\u671f\u5f85\u3002\u800c\u610f\u5916\u7684\u662f\u8d1d\u5c14\u5728\u8d5b\u540e\u5374\u8868\u793a\uff1a\u4eca\u590f\u4ed6\u5c06\u597d\u597d\u8003\u8651\u81ea
  \u5df1\u7684\u672a\u6765\u3002\u4ed6\u6e34\u671b\u6bcf\u5468\u90fd\u5f97\u5230\u4e0a\u573a\u673a\u4f1a\uff0c\u800c\u4e0d\u662f\u67af\u5750\u66ff\u8865\u5e2d\u5f85\u547d\u3002\u4eca\u5e746\u6708\uff0c\u6709\u7535\u5546\u6295\u8bc9\u5e73\u53f0\u53d1\u5e03\u4e86\u201c6\u00b718\u201d\u671f\u95f4\u6295\u8bc9\u6570\u636e\u3002\u5728\u4eca\u5e746\u670818\u65e5\uff0c\u6295\u8bc9\u5230\u5e73\u53f0\u7684\u6d89\u5047\u95ee\u9898\u5171\u8ba1156\u4ef6\uff0c\u542b\u865a\u5047\u5ba3\u4f20\u3001\u865a\u5047\u627f\u8bfa\u3001\u5047\u5192\u4f2a\u52a3\u4ea7\u54c1\u7b49\uff0c\u6d89\u53ca\u76f8\u5173\u5e73\u53f0\u6216\u5356\u5bb6\u7684\u8bda\u4fe1\u95ee\u9898\u3002\u5176\u4e2d\uff0c\u6d88\u8d39\u8005\u660e\u786e\u6307\u63a7\u4e70\u5230\u5047\u8d27\u7684\u6295\u8bc9\u5171\u8ba152\u4ef6\u3002.\\n\u6b64\u5916\uff0c\u8be5\u5957\u7cfb\u7edf\u4e2d\u8fd8\u5177\u6709\u767e\u5ea6\u81ea\u8fed\u4ee3\u529f\u80fd\u3002\u53ef\u4ee5\u901a\u8fc7\u81ea\u4e3b\u65b9\u5f0f\u5bf9\u73b0\u6709\u8bc6\u522b\u7ed3\u679c\u8fdb\u884c\u6807\u6ce8\u548c\u7ea0\u6b63\uff0c\u901a\u8fc7\u81ea\u4e3b\u8bad\u7ec3\uff0c\u63d0\u5347\u5bf9\u65b0\u573a\u666f\u7684\u8bc6\u522b\u6548\u679c\uff0c\u540c\u65f6\u89e3\u8026\u8bc6\u522b\u80fd\u529b\u5347\u7ea7\u65f6\u7684\u6280\u672f\u4f9d\u8d56\uff0c\u8fdb\u800c\u4e0d\u65ad\u63d0\u9ad8\u8bc6\u522b\u7cbe\u5ea6\uff0c\u589e\u52a0\u8bc6\u522b\u8fdd\u89c4\u8fdd\u7ae0\u884c\u4e3a\u79cd\u7c7b\uff0c\u8d4b\u4e88\u667a\u6167\u57ce\u5e02\u7ba1\u7406\u7cfb\u7edf\u6301\u7eed\u8fdb\u5316\u7684\u80fd\u529b\u3002\\n\u201c\u4e24\u764c\u201d\u7b5b\u67e5\u662f\u5173\u7231\u5973\u6027\u5065\u5eb7\u7684\u516c\u76ca\u6d3b\u52a8\uff0c\u4e8b\u5173\u5bb6\u5ead\u5e78\u798f\u3002\u65b0\u7586\u5175\u56e2\u515a\u59d4\u5df2\u5c06\u5987\u5973\u201c\u4e24\u764c\u201d\u514d\u8d39\u7b5b\u67e5\u5217\u51652018\u5e74\u4e3a\u804c\u5de5\u7fa4\u4f17\u529e\u7684\u201c\u5341\u4ef6\u5b9e\u4e8b\u201d\u4e4b\u4e2d\uff0c\u5177\u4f53\u7531\u65b0\u7586\u5175\u56e2\u536b\u8ba1\u59d4\u3001\u65b0\u7586\u5175\u56e2\u5987\u8054\u7b49\u8054\u5408\u57282018\u81f32020\u5e74\u5206\u6b65\u5b9e\u65bd\u5b8c\u6210\u3002\u65e8\u5728\u901a\u8fc7\u4e3a\u8f96\u533a\u5185\u9002\u9f84\u5987\u5973\u8fdb\u884c\u201c\u4e24\u764c\u201d\u7b5b\u67e5\uff0c\u505a\u5230\u65e9\u8bca\u65e9\u6cbb\uff0c\u8fdb\u4e00\u6b65\u63d0\u9ad8\u5e7f\u5927\u5987\u5973\u81ea\u6211\u4fdd\u5065\u610f\u8bc6\u548c\u5065\u5eb7\u6c34\u5e73\uff0c\u4fdd\u969c\u5987\u5973\u5065\u5eb7\u3002,\u82f9\u679c\u516c\u53f8\u9996\u5e2d\u6267\u884c\u5b98\u8482\u59c6\u5e93\u514b\u5728\u4e00\u4efd\u7fa4\u53d1\u7ed9\u5458\u5de5\u7684\u5907\u5fd8\u5f55\u4e2d\u8bf4\uff0c\u5e02\u503c\u7834\u4e07\u4ebf\u662f\u4f01\u4e1a\u4e00\u4e2a\u503c\u5f97\u81ea\u8c6a\u7684\u91cd\u8981\u91cc\u7a0b\u7891\uff0c\u4f46\u8d22\u52a1\u6536\u76ca\u4e0d\u5e94\u6210\u4e3a\u4f01\u4e1a\u91cd\u5fc3\u3002,\u53d9\u5229\u4e9a7\u5e74\u5185\u6218\u6709\u671b\u7ec8\u7ed3
  \u963f\u8428\u5fb7\uff1a\u80dc\u5229\u5728\u671b\u3010\u73af\u7403\u7f51\u62a5\u9053
  \u8d75\u6021\u84c1\u3011\u745e\u58eb\u5a92\u4f53\u201c\u745e\u58eb\u8d44\u8baf\u201d8\u67081\u65e5\u63f4\u5f15\u6cd5\u65b0\u793e\u62a5\u9053\u79f0\uff0c\u53d9\u5229\u4e9a\u603b\u7edf\u5df4\u6c99\u5c14\u3002\u963f\u8428\u5fb7\u4e8e\u5f53\u5730\u65f6\u95f48\u67081\u65e5\u544a\u8bc9\u653f\u5e9c\u519b\uff0c\u53cd\u6297\u519b\u8282\u8282\u8d25\u9000\u540e\uff0c\u8fd9\u573a7\u5e74\u6218\u4e89\u80dc\u5229\u5728\u671b\u30021\u65e5\uff0c\u6b63\u503c\u53d9\u5229\u4e9a\u519b\u961f\u5efa\u7acb73\u5468\u5e74\u4e4b\u9645\uff0c\u963f\u8428\u5fb7\u5728\u7ed9\u57fa\u5c42\u58eb\u5175\u7684\u4e00\u5c01\u516c\u5f00\u4fe1\u4e2d\u5199\u9053\uff0c\u201c\u6211\u4eec\u80dc\u5229\u5728\u671b\u3002\u201d\u636e\u62a5\u9053\uff0c2017\u5e74\u5e74\u521d\uff0c\u653f\u5e9c\u519b\u4ec5\u638c\u63a7\u53d9\u5229\u4e9a17%\u7684\u56fd\u571f\uff0c\u4f46\u4e00\u8fde\u4e32\u731b\u70c8\u653b\u52bf\uff0c\u8feb\u4f7f\u53cd\u6297\u519b\u64a4\u79bb\u8bb8\u591a\u636e\u70b9\uff0c\u4f7f\u5f97\u963f\u8428\u5fb7\u653f\u5e9c\u6536\u590d\u53d9\u5229\u4e9a\u5c06\u8fd12/3\u7684\u9886\u571f\u3002\\n\u5317\u4eac\u8d5b\u8f66\u600e\u4e48\u52a0\u76df\u5728\u8c03\u67e5\u4e2d\uff0c\u67095\u5bb6\u7a7a\u8c03\u7ef4\u4fee\u670d\u52a1\u5546\u5747\u91c7\u7528\u6b64\u79cd\u201c\u624b\u6cd5\u201d\u3002\u7535\u5668\u7ef4\u4fee\u6280\u5e08\u5f90\u5f6a\u5411\u6cd5\u6cbb\u5468\u672b\u89e3\u91ca\u79f0\uff0c\u8fd9\u6837\u7684\u624b\u6cd5\u5728\u4e1a\u5185\u79f0\u4e3a\u53cd\u63a5\u538b\u529b\u8868\uff0c\u76ee\u7684\u662f\u4e3a\u4e86\u8ba9\u6d88\u8d39\u8005\u770b\u5230\u5728\u64cd\u4f5c\u624b\u6cd5\u4e4b\u4e0b\uff0c\u6d4b\u51fa\u7684\u7a7a\u8c03\u6c1f\u5229\u6602\u538b\u529b\u4f4e\u4e8e\u6807\u51c6\u503c\uff0c\u4ee5\u6b64\u63d0\u9192\u6d88\u8d39\u8005\uff0c\u4f60\u7684\u7a7a\u8c03\u5e94\u8be5\u8981\u52a0\u6c1f\u4e86\u3002,,\u610f\u5927\u5229\u901a\u8baf\u793e\u79f0\uff0c\u201c\u4e00\u5e26\u4e00\u8def\u201d\u5021\u8bae\u4f53\u73b0\u4e86\u4e2d\u56fd\u5bf9\u5916\u5173\u7cfb\u7684\u65b0\u601d\u8def\uff0c\u63d0\u51fa\u4e86\u66f4\u5177\u201c\u5e73\u8861\u6027\u201d\u548c\u201c\u5305\u5bb9\u6027\u201d\u7684\u4e2d\u56fd\u7279\u8272\u5bf9\u5916\u4ea4\u5f80\u6a21\u5f0f\u3002\u8fd9\u4e00\u5021\u8bae\u662f\u4e2d\u56fd\u5e94\u5bf9\u56fd\u9645\u5730\u7f18\u653f\u6cbb\u5f62\u52bf\u53d8\u5316\u548c\u5168\u7403\u7ecf\u6d4e\u5371\u673a\u7ed9\u51fa\u7684\u65b9\u6848\uff0c\u4f46\u5e76\u4e0d\u662f\u6240\u8c13\u7684\u65b0\u201c\u9a6c\u6b47\u5c14\u8ba1\u5212\u201d\uff0c\u201c\u4e00\u5e26\u4e00\u8def\u201d\u5021\u8bae\u5c06\u60e0\u53ca\u6240\u6709\u56fd\u5bb6\u3002\\n\u76f8\u5173\u94fe\u63a5\uff1a\"",
  "\"\u6df1\u521b\u91d1\u670d \u96f6\u58f9\u8d22\u7ecf\u5185\u90e8\u7814\u8ba8\u4f1a
  \u5c31\u50cf\u4ed6\u5f53\u521d\u5c06\u4e00\u4e2a\u53c8\u4e00\u4e2a\u7684\u524d\u8f88\u5e72\u6389\uff0c\u8e29\u7740\u4ed6\u4eec\u7684\u80a9\u8180\u767b\u4e0a\u5dc5\u5cf0\u4e00\u6837\uff0c\u8fd9\u6b21\uff0c\u4ed6\u6210\u4e86\u522b\u4eba\u7684\u57ab\u811a\u77f3\uff0c3\u6bd44\uff0c\u8a79\u59c6\u65af\u76ee\u9001\u9f99\u6218\u8e0f\u4e0a\u5206\u533a\u51b3\u8d5b\uff0c\u53ea\u7559\u4e0b\u4e00\u4e2a\u843d\u5bde\u7684\u80cc\u5f71\u3002\u9a6c\u523a\u8fd9\u6b21\u8d4c\u535a\u7b97\u662f\u8d4c\u5bf9\u4e86\uff0c20\u5c81\u7684\u5947\u514b\u65af\u6bd4\u60f3\u8c61\u4e2d\u8981\u8fdb\u6b65\u5fb7\u66f4\u5feb\uff0c2018\u5e741\u6708\u4efd\u4ed6\u7684\u8868\u73b0\u6bd4\u521a\u8fdb\u8054\u76df\u7684\u65f6\u5019\u6709\u5de8\u5927\u8fdb\u6b65\u3002\u72b6\u5143\u9009\u7684\u5c31\u662f\u5929\u8d4b\uff0c\u50cf\u9686\u591a\u90a3\u6837\u4ece\u4ec0\u4e48\u90fd\u4e0d\u4f1a\u8fdb\u6b65\u5230\u5de8\u661f\u3002\u548c\u50cf\u6bd4\u65af\u5229\u3001\u6885\u5965\u90a3\u6837\u65b0\u79c0\u8d5b\u5b63\u5373\u662f\u5dc5\u5cf0\u76f8\u6bd4\uff0c\u4f5c\u4e3a\u4e00\u4e2a\u603b\u7ecf\u7406\u4f1a\u600e\u4e48\u3002\u4ea2\u5ed6\u629f\u664c\u9002\u8304\u00f7\u300a\uff0c\u867d\u7136\u8fd9\u53ea\u662f\u9a6c\u540e\u70ae\u3002\u51b2\u7ef3\u6c11\u4f17\u6297\u8bae\u9a7b\u65e5\u7f8e\u519b
  \u65e5\u8b66\u5bdf\u5927\u9a82:\u95ed\u5634\u652f\u90a3\u4eba|\u51b2\u7ef3|\u6297\u8bae|\u652f\u90a3\u4eba
  \u5f53\u6e56\u4eba\u572817\u53f7\u8fd9\u5929\uff0c\u4e07\u4f17\u77a9\u76ee\u4e0b\u51fb\u8d25\u56fd\u738b\uff0c\u53d6\u5f9773\u80dc\u4e4b\u540e\uff0c\u683c\u91cc\u82ac\u66f4\u52a0\u786e\u5b9a\u81ea\u5df1\u6765\u5230\u6e56\u4eba\u7684\u51b3\u5b9a\u662f\u6b63\u786e\u7684\u3002\u963f\u5fb7\u6258\u6606\u535a\uff01\\n\u6fb3\u5927\u5229\u4e9a\u7537\u5b50iPhone7\u624b\u673a\u7206\u70b8
  \u82f9\u679c\u516c\u53f8\u4ecb\u5165\u8c03\u67e5 \u6700\u7ec8\u8fd9\u573a\u7bee\u7403\u5723\u5730\u7684\u5bf9\u51b3\u6e56\u4eba\u961f\u8d62\u5f97\u80dc\u5229\uff0c\u62ff\u5230\u672c\u8d5b\u5b63\u7b2c47\u80dc\uff0c\u6218\u7ee9\u53d8\u621047\u80dc4\u8d1f\u3002(\u672a\u5b8c\u5f85\u7eed\u3002\u3002)\u683c\u91cc\u82ac\u4e09\u5206\u51fa\u624b\uff01\u519b\u60c5\u5ba4\uff1a\u89e3\u653e\u519b\u5982\u4f55\u4ee5\u6d77\u5236\u9646
  \u53ef\u5b66\u7f8e\u5bfc\u5f39\u6253\u4e5f\u95e8\u6218\u672f|\u519b\u60c5|\u4e2d\u56fd\u6d77\u519b|\u53cd\u8230\u5bfc\u5f39
  \u56e0\u4e3a\u662f\u4e1c\u9053\u4e3b\u7684\u5173\u7cfb\uff0c\u5927\u529b\u4ece\u56fd\u738b\u961f\u90a3\u91cc\u5f04\u5230\u4e00\u4e2a\u5305\u95f4\uff0c\u62d6\u5bb6\u5e26\u53e3\u5341\u51e0\u53f7\u4eba\u4e00\u8d77\u53bb\u770b\u8fd9\u573a\u65b0\u79c0\u8d5b\u3002\u5728\u4eba\u4eec\u7684\u671f\u5f85\u4e4b\u4e2d\uff0c\u6e56\u4eba\u961f\u8fde\u80dc\u7684\u811a\u6b65\u7ee7\u7eed\u300212\u670811\u53f7\uff0c\u6e56\u4eba\u51fb\u8d25\u4e9a\u7279\u5170\u5927\u8001\u9e70\u961f\u540e\uff0c\u6e56\u4eba\u5df2\u7ecf\u53d6\u5f97\u6240\u8c13\u7684\u201c\u51a0\u519b\u8fde\u80dc\u201d\uff0c\u6574\u657418\u8fde\u80dc\u3002\\n\u5468\u6770\u4f26\u60f3\u65b9\u6587\u5c71\u62ff\u8bfa\u5956\uff1a\u8bc4\u59d4\u8bf7\u5173\u6ce8\u4e0b\u4e2d\u6587\u6b4c
  \u683c\u91cc\u82ac\u548c\u6797\u4e66\u8c6a\u7531\u4e8e\u524d\u4e09\u8282\u6d88\u8017\u4f53\u529b\u8fc7\u5927\uff0c\u73b0\u5728\u4f53\u80fd\u4e0d\u8db3\u4e86\uff0c\u8fd9\u662f\u683c\u91cc\u82ac\u4e00\u76f4\u4ee5\u6765\u7684\u6bdb\u3002\u4e0d\u61c2\u5f97\u4f53\u80fd\u5206\u914d\uff0c\u4f5c\u4e3a\u4e00\u4e2a\u4f53\u91cd\u90a3\u4e48\u5927\u7684\u5185\u7ebf\uff0c\u4ed6\u5e38\u5e38\u7528\u540e\u536b\u7684\u65b9\u5f0f\u6253\u7403\uff0c\u7b2c\u56db\u8282\u5f80\u5f80\u4f53\u80fd\u4e0d\u8db3\u3002\u6797\u4e66\u8c6a\u5219\u662f\u8ddf\u7740\u9ea6\u5409\u5409\u548c\u5c3c\u5c14\u8dd1\u4e86\u4e00\u6574\u3002\u7d2f\u7684\u3002\u8fd9\u5c31\u662f\u90a3\u4e9b\u5b98\u5458\u7231\u505a\u7684\u4e8b\u60c5\u3002\u4e2d\u56fd\u6279\u65e5\u62d2\u7f34\u6559\u79d1\u6587\u7ec4\u7ec7\u4f1a\u8d39
  \u62a8\u51fb\u65e5\u9601\u50da\u53c2\u62dc\u9756\u56fd\u795e\u793e \u53f2\u8482\u82ac\u68ee\u5355\u6253\u5c3c\u514b-\u6768\uff01\u970d\u4e50\u8fea\u53ef\u8c13\u547d\u8fd0\u591a\u821b\uff0c\u572876\u4eba\u6253\u51fa\u5168\u660e\u661f\u6c34\u51c6\uff0c\u9a6c\u4e0a\u5c31\u88ab\u4ea4\u6613\u8d70\uff0c\u56e0\u4e3a\u4ed6\u7684\u51fa\u8272\u5e72\u6270\u4e8676\u4eba\u7684\u91cd\u5efa\u8ba1\u5212\uff0c\u4ed6\u6253\u5f97\u592a\u597d76\u4eba\u6ca1\u6cd5\u6446\u70c2\u3002\\n\u201c\u6d77\u5ce1\u676f\u201d\u5168\u56fd\u4e66\u753b\u4f5c\u54c1\u5c55\u53a6\u95e8\u5f00\u5e55
  \u8d39\u6c83\u65af\u9632\u5b88\u95e8\u7f57\u7684\u62db\u6570\u662f\u7528\u81ea\u5df1\u4e00\u8eab\u808c\u8089\u5c06\u95e8\u7f57\u5f80\u5916\u63a8\uff0c\u6216\u8005\u662f\u7ed5\u7ebf\u4e0d\u8ba9\u95e8\u7f57\u62ff\u7403\u3002\u4e00\u5f00\u59cb\u683c\u91cc\u82ac\u5e76\u4e0d\u77e5\u9053\u6765\u6e56\u4eba\u80fd\u4e0d\u80fd\u6210\u529f\uff0c\u6bd5\u7adf\u6e56\u4eba\u7ec4\u5efa\u5de8\u5934\u7ec4\u5408\u7684\u4e0d\u9760\u8c31\u6b21\u6570\u592a\u591a\u3002\u4e00\u4ee3\u4f20\u5947\u5b8c\u7f8e\u8c22\u5e55
  \u65b0\u79c0\u5d1b\u8d77\u540c\u6837\u7cbe\u5f69 \u5728\u7403\u8ff7\u4eec\u4e00\u9635\u53c8\u4e00\u9635\u7684mvp\u547c\u58f0\u4e2d\uff0c\u5927\u529b\u4e00\u8138\u51b7\u5cfb\u7684\u547d\u4e2d\u7f5a\u7403\uff0c106\u6bd4101\uff0c\u6e56\u4eba\u518d\u6b21\u9886\u5148\u4e94\u5206\uff01\u4f46\u662f\u9f99\u6218\u4f3c\u4e4e\u662f\u592a\u5c0f\u77a7\u6e56\u4eba\u66ff\u8865\u4e86\uff0c\u8fce\u7740\u5e03\u96f7\u514b\u9f99\u6218\u8981\u989c\u6263\uff01\\n\u5f71\u8ff7\u4f1a\u633a\u5b59\u4fea\uff1a\u6295\u8bc9\u566a\u97f3\u5c5e\u5546\u4e1a\u9879\u76ee\u975e\u5730\u94c1
  \u59d0\u59d0\u4e00\u526f\u8d25\u7ed9\u4f60\u4eec\u4e86\u7684\u8868\u60c5\uff0c\u5e74\u5173\u5c06\u81f3\uff0c\u59d0\u59d0\u73b0\u5728\u5f88\u6101\u3002\u975e\u5e38\u6101\uff0c\u6101\u7eea\u4e07\u5343\u3002\u963f\u5fb7\u6258\u6606\u535a\u540e\u64a4\u6b65\uff0c\u76f4\u63a5\u4ece\u5408\u7406\u51b2\u649e\u533a\u64a4\u5230\u4e86\u7f5a\u7403\u7ebf\u5185\u4e00\u6b65\uff0150\u5206\u949f\u4e00\u8f6e\u8fd8\u6253\u51fa\u5e73\u6807\u51c6\u6746\uff1f\u89c1\u8bc6\u4e00\u4e0b\u5feb\u901f\u9ad8\u5c14\u592b
  \u547d\u4e2d\uff01\u6e56\u4eba\u8fdb\u653b\uff0c\u5927\u529b\u5f3a\u7a81\u7bee\u4e0b\uff0c\u96c4\u9e7f\u961f\u6536\u7f29\uff0c\u56db\u4e2a\u4eba\u5408\u56f4\u5927\u529b\u3002\\n\u90ce\u5e73\uff1a\u5973\u6392\u8981\u5f15\u9886\u4e09\u5927\u7403\u5411\u524d\u51b2
  \u5965\u8fd0\u4e3a\u4e9a\u6d32\u4e89\u5149 108\u6bd4107\uff0c\u9f99\u6218\u5173\u952e\u65f6\u523b\u6ca1\u6709\u624b\u8f6f\uff0c\u5c06\u6bd4\u5206\u53cd\u8d85\uff01\u73b0\u5728\u5185\u7ebf\u6709\u516d\u4e2a\u4eba\uff01\u97e9\u56fd\u9996\u5c14\u53d1\u751f\u67aa\u6218
  \u4e00\u540d\u8b66\u5bdf\u88ab\u81ea\u5236\u67aa\u51fb\u51fb\u4e2d\u8eab\u4ea1 \u6e56\u4eba\u7403\u6743\uff01\u4f46\u662f\uff0c\u4ed6\u518d\u6b21\u62a2\u5230\u8fdb\u653b\u7bee\u677f\uff0c\u7c73\u5fb7\u5c14\u987f\u548c\u5361\u66fc\u8981\u54ed\u4e86\uff01\u597d\u4e0d\u5bb9\u6613\u8fde\u7eed\u9632\u4e0b\u4e24\u6b21\u5bf9\u65b9\u4e8c\u6b21\u8fdb\u653b\uff0c\u4f46\u7bee\u677f\u7403\u8fd8\u662f\u5bf9\u65b9\u7684\u3002\"",
  "\"\u5c0f\u5bd2\u5403\u4ec0\u4e48\u517b\u751fwan19952017-11-27 20:01\u517b\u751f\u4e4b\u9053\u7f51\u5bfc\u8bfb\uff1a\u5c0f\u5bd2\u5403\u4ec0\u4e48\u517b\u751f\uff1f\u5c0f\u5bd2\u662f\u51ac\u5b63\u91cc\u7684\u7b2c\u4e94\u4e2a\u8282\u6c14\uff0c\u6b64\u65f6\u5929\u6c14\u5df2\u7ecf\u5f88\u5bd2\u51b7\u4e86\u3002\u5927\u5bb6\u8981\u6ce8\u610f\u505a\u597d\u996e\u98df\u8c03\u7406\u5de5\u4f5c\u3002\u90a3\u4e48\uff0c\u5c0f\u5bd2\u5403\u4ec0\u4e48\u517b\u751f\uff1f\u63a5\u4e0b\u6765\u517b\u751f\u4e4b\u9053\u7f51\u4e3a\u4f60\u4ecb\u7ecd\u3002\u6587\u7ae0\u76ee\u5f55\u4e00\u3001\u5c0f\u5bd2\u5403\u4ec0\u4e48\u517b\u751f1.
  \u5c0f\u5bd2\u517b\u751f\u5403\u4ec0\u4e48\u98df\u72692. \u5c0f\u5bd2\u517b\u751f\u559d\u4ec0\u4e48\u8336\u996e3.
  \u5c0f\u5bd2\u517b\u751f\u559d\u4ec0\u4e48\u6c64\u81b3\u4e8c\u3001\u5c0f\u5bd2\u996e\u98df\u8fdb\u8865\u7684\u539f\u5219\u4e09\u3001\u6709\u5173\u5c0f\u5bd2\u7684\u7531\u6765\\n\u5c0f\u5bd2\u5403\u4ec0\u4e48\u517b\u751f\\n1\u3001\u5c0f\u5bd2\u517b\u751f\u5403\u4ec0\u4e48\u98df\u7269\\n1.1\u3001\u7f8a\u8089\u2014\u8865\u80be\u52a9\u9633:\u7f8a\u8089\u662f\u51ac\u5b63\u9910\u684c\u4e0a\u7684\u5e38\u89c1\u83dc,\u5728\u5c0f\u5bd2\u8282\u6c14\u9002\u5b9c\u591a\u8fdb\u8865\u3002\u7f8a\u8089\u5c5e\u70ed\u6027,\u6709\u8865\u80be\u52a9\u9633\u7684\u4f5c\u7528,\u7f8a\u8089\u8fd8\u80fd\u7f13\u89e3\u8170\u819d\u9178\u8f6f\u7684\u75c7\u72b6\u3002\u5728\u5bd2\u51b7\u51ac\u5b63,\u5403\u4e0a\u4e00\u987f\u7f8a\u8089,\u65e0\u7591\u662f\u4e00\u5927\u4e50\u4e8b\u3002\\n1.2\u3001\u725b\u8089\u2014\u8865\u813e\u76ca\u80c3:\u725b\u8089\u53ef\u8865\u813e\u76ca\u80c3\u3001\u8865\u6c14\u517b\u8840\u3001\u5f3a\u7b4b\u58ee\u9aa8\u3001\u5229\u6c34\u6d88\u80bf\u3002\u725b\u8089\u5177\u6709\u9ad8\u86cb\u767d\u3001\u4f4e\u8102\u80aa\u3001\u4f4e\u80c6\u56fa\u9187\u7684\u7279\u70b9,\u5f88\u9002\u5408\u80a5\u80d6\u8005\u3001\u9ad8\u8840\u538b\u3001\u52a8\u8109\u786c\u5316\u3001\u51a0\u5fc3\u75c5\u3001\u7cd6\u5c3f\u75c5\u60a3\u8005\u98df\u7528\u3002\\n1.3\u3001\u9c7c\u8089\u2014\u8865\u76ca\u7b4b\u9aa8:\u9c7c\u8089\u53ef\u6e29\u517b\u9633\u6c14\u3001\u8865\u76ca\u7b4b\u9aa8,\u5176\u4e2d\u4ee5\u9c88\u9c7c\u7684\u4ef7\u503c\u6700\u5927\u3002\u300a\u672c\u8349\u7eb2\u76ee\u300b\u8bb0\u8f7d:\u201c\u5473\u7518\u5e73,\u5165\u809d\u813e\u80be\u7ecf,\u6709\u8865\u4e94\u810f,\u76ca\u7b4b\u9aa8,\u6cbb\u6c34\u6c14,\u591a\u98df\u5b9c\u4eba,\u66dd\u5e72\u751a\u9999,\u76ca\u809d\u80be,\u5b89\u80ce\u8865\u4e2d\u3002\\n1.4\u3001\u9e2d\u8089\u2014\u6e29\u8865\u865a\u52b3:\u9e2d\u8089\u8865\u865a\u6ecb\u9634\u3001\u5229\u5c3f\u6d88\u80bf\u3001\u517b\u80c3\u751f\u6d25,\u9e2d\u8089\u9002\u5408\u4f53\u5185\u6709\u70ed\u6613\u4e0a\u706b\u7684\u4eba\u98df\u7528;\u4f4e\u70ed\u3001\u4f53\u5f31\u3001\u98df\u6b32\u4e0d\u632f\u3001\u5927\u4fbf\u79d8\u7ed3\u548c\u6c34\u80bf\u8005\u98df\u4e4b\u66f4\u4f73\u3002\\n2\u3001\u5c0f\u5bd2\u517b\u751f\u559d\u4ec0\u4e48\u8336\u996e\\n2.1\u3001\u751f\u59dc\u7ea2\u8336\u3002\u751f\u59dc10\u514b\u3001\u67b8\u675e5\u514b,\u6d17\u51c0\u540e\u653e\u5165\u9505\u4e2d,\u52a0\u6c34\u714e\u716e,\u53bb\u6e23\u53d6\u6c41;\u7528\u5176\u51b2\u6ce1\u7ea2\u83363\u514b,\u667e\u6e29\u540e\u52a0\u5165\u9002\u91cf\u8702\u871c\u5373\u53ef\u996e\u7528\u3002\u6b64\u8336\u5177\u6709\u5f00\u80c3\u6b62\u5410\u3001\u6e29\u4e2d\u6563\u5bd2\u3001\u56de\u9633\u901a\u8109\u3001\u6ecb\u8865\u809d\u80be\u7684\u529f\u6548\u3002\u4e3b\u6cbb\u813e\u80c3\u865a\u5bd2\u3001\u80c3\u8118\u80c0\u75db\u3001\u5fc3\u8179\u51b7\u75db\u3001\u98df\u6b32\u4e0d\u632f\u3001\u5455\u5410\u3001\u53cd\u80c3\u7b49\u75c7\u3002\\n2.2\u3001\u59dc\u6842\u6851\u5bc4\u8336\u3002\u53d6\u9c9c\u59dc2\u514b,\u53bb\u76ae\u5207\u7247;\u6851\u5bc4\u751f5\u514b\u3001\u6842\u679d1\u514b,\u6d17\u51c0\u6253\u788e,\u88c5\u5165\u7eb1\u5e03\u888b\u4e2d;\u5c06\u836f\u888b\u653e\u5165\u8336\u676f,\u51b2\u5165\u9002\u91cf\u6cb8\u6c34,\u52a0\u76d6\u6d78\u6ce110\u5206\u949f\u540e\u653e\u5165\u59dc\u7247,2\uff5e3\u5206\u949f\u540e\u5373\u53ef\u996e\u7528\u3002\u6bcf\u5929\u65e9\u3001\u665a\u996d\u540e\u6e29\u996e,\u53ef\u8865\u809d\u80be\u3001\u5f3a\u7b4b\u9aa8\u3001\u901a\u7edc\u795b\u98ce\u6e7f\u3001\u89e3\u8868\u53d1\u6c57\u3001\u6e29\u4e2d\u548c\u80c3,\u53ef\u7528\u4e8e\u6cbb\u7597\u56db\u80a2\u5173\u8282\u75db\u3001\u80c3\u8118\u51b7\u75db\u6216\u5916\u611f\u98ce\u5bd2\u3001\u8eab\u51b7\u65e0\u6c57\u7b49\u75c7\u3002\\n3\u3001\u5c0f\u5bd2\u517b\u751f\u559d\u4ec0\u4e48\u6c64\u81b3\\n3.1\u3001\u82b1\u751f\u732a\u624b\u6c64\u3002\u6750\u6599:\u82b1\u751f80\u514b,\u732a\u624b300\u514b,\u6dee\u5c7150\u514b\u4ee5\u53ca\u9002\u91cf\u76d0\u3001\u8471\u3001\u59dc\u3001\u6599\u9152\u3002\\n\u505a\u6cd5:\u5148\u5c06\u732a\u624b\u6d17\u51c0\u3001\u5207\u5757,\u5c06\u6dee\u5c71\u5207\u5757\u3002\u5c06\u6240\u6709\u6750\u6599\u53ca\u9002\u91cf\u7684\u8471\u3001\u59dc\u3001\u6599\u9152\u653e\u5165\u9505\u4e2d,\u52a0\u6e05\u6c34\u5c0f\u706b\u70961\u5c0f\u65f620\u5206\u949f\u5de6\u53f3,\u52a0\u5165\u76d0\u7a0d\u716e\u3002\\n\u529f\u6548:\u82b1\u751f\u732a\u624b\u6c64\u5177\u6709\u6ecb\u6da6\u808c\u80a4,\u589e\u52a0\u5f39\u6027\u7684\u529f\u6548\u3002\\n3.2\u3001\u83b2\u85d5\u6392\u9aa8\u6c64\u3002\u6750\u6599:\u6392\u9aa8750\u514b,\u65b0\u9c9c\u83b2\u85d52\u6bb5\u3002\\n\u505a\u6cd5:\u6392\u9aa8\u6d17\u51c0\u5207\u6bb5,\u6e05\u6c34\u6f0220\u5206\u949f\u3002\u5c06\u6c34\u6ca5\u5e72\u3002\u83b2\u85d5\u6d17\u51c0\u53bb\u76ae,\u5207\u5c0f\u6bb5\u540e\u7528\u5200\u62cd\u677e\u3002\u5c06\u5168\u90e8\u6750\u6599\u653e\u5165\u9505\u5185,\u52a0\u6e05\u6c341500\u6beb\u5347,\u5927\u706b\u716e\u6eda\u540e\u6539\u5c0f\u706b\u71723\u5c0f\u65f6\u5de6\u53f3\u5373\u53ef\u3002\u7172\u597d\u540e\u52a0\u76d0\u8c03\u5473\u3002\\n\u529f\u6548:\u672c\u6c64\u53ef\u6e05\u70ed\u6d88\u75f0\u3001\u8865\u8840\u517b\u989c,\u51e1\u8d2b\u8840\u3001\u5fc3\u8df3\u5931\u7720\u8005\u7686\u53ef\u98df\u7528,\u5e38\u670d\u4ee4\u4eba\u795e\u8272\u6dfb\u5f69\u3002\\n\u5c0f\u5bd2\u996e\u98df\u8fdb\u8865\u7684\u539f\u5219\\n1\u3001\u98df\u5b9c\u6e29\uff1a\u51ac\u5b63,\u662f\u5403\u7f8a\u8089\u3001\u9e21\u8089\u7b49\u6e29\u70ed\u54c1\u7684\u597d\u65f6\u5019,\u7279\u522b\u662f\u5bf9\u4e8e\u504f\u4e8e\u9633\u865a\u4f53\u8d28\u8005\u7684\u4eba:\u504f\u4e8e\u9634\u6c14\u4e0d\u8db3\u7684\u98df\u8865\u4ee5\u9e2d\u8089\u4e3a\u597d\u3002\u996e\u98df\u5207\u5fcc\u9ecf\u786c\u3001\u751f\u51b7\u98df\u7269\u3002\\n\u800c\u51ac\u5b63\u559d\u70ed\u7ca5\u4e5f\u975e\u5e38\u9002\u5408,\u5982\u7f8a\u8089\u7ca5,\u4ee5\u6e29\u8865\u9633\u6c14:\u9ea6\u7247\u7ca5,\u517b\u5fc3\u9664\u70e6;\u6838\u6843\u7ca5,\u517b\u9634\u56fa\u7cbe;\u7ea2\u85af\u7ca5,\u6ecb\u8865\u809d\u80be\u3002\\n2\u3001\u98df\u5b9c\u6742,\u5373\u98df\u7269\u8981\u591a\u6837\u5316,\u7cbe\u7c97\u642d\u914d,\u8364\u7d20\u517c\u5403\u3002\u51ac\u5929\u4eba\u4eec\u6709\u504f\u55dc\u9ad8\u86cb\u767d\u3001\u9ad8\u8102\u548c\u9ad8\u7cd6\u7684\u98df\u7269,\u4e0d\u5403\u6216\u5c11\u5403\u7c97\u7cae\u3001\u852c\u83dc\u3001\u74dc\u679c\u7684\u503e\u5411\u3002\u8fd9\u4e0d\u4f46\u5bb9\u6613\u4f7f\u4eba\u60a3\u7f3a\u94c1\u6027\u8d2b\u8840\u3001\u7ef4\u751f\u7d20\u7f3a\u4e4f\u75c7\u3001\u4fbf\u79d8\u3001\u53e3\u89d2\u708e\u3001\u7259\u9f88\u51fa\u8840\u7b49\u75c7\u3002\\n3\u3001\u98df\u5b9c\u82e6\uff1a\u8fd9\u65f6\u7684\u996e\u98df\u5e94\u51cf\u54b8\u589e\u82e6,\u82e6\u5473\u98df\u7269\u53ef\u52a9\u5fc3\u9633,\u51cf\u5c11\u8fc7\u4ea2\u7684\u80be\u6c34,\u8d77\u5230\u517b\u80be\u7684\u529f\u6548\u3002\\n\u5c0f\u5bd2\u5929\u6c14\u4f9d\u65e7\u5bd2\u51b7,\u6211\u4eec\u5fc5\u987b\u505a\u597d\u996e\u98df\u517b\u751f\u5de5\u4f5c\uff0c\u624d\u80fd\u4fdd\u8bc1\u6211\u4eec\u7684\u8eab\u4f53\u5065\u5eb7\u3002\\n\u6709\u5173\u5c0f\u5bd2\u7684\u7531\u6765\\n\u5c0f\u5bd2\u4e0e\u5927\u5bd2\u3001\u5c0f\u6691\u3001\u5927\u6691\u53ca\u5904\u6691\u4e00\u6837,\u90fd\u662f\u8868\u793a\u6c14\u6e29\u51b7\u6696\u53d8\u5316\u7684\u8282\u6c14\u3002\u300a\u6708\u4ee4\u4e03\u5341\u4e8c\u5019\u96c6\u89e3\u300b\u4e2d\u8bf4\u201c\u6708\u521d\u5bd2\u5c1a\u5c0f\u2026\u2026\u6708\u534a\u5219\u5927\u77e3\u201d,\u5c31\u662f\u8bf4,\u5728\u9ec4\u6cb3\u6d41\u57df,\u5f53\u65f6\u5927\u5bd2\u662f\u6bd4\u5c0f\u5bd2\u51b7\u7684\u3002\u53c8\u7531\u4e8e\u5c0f\u5bd2\u8fd8\u5904\u4e8e\u201c\u4e8c\u4e5d\u201d\u7684\u6700\u540e\u51e0\u5929\u91cc,\u5c0f\u5bd2\u8fc7\u51e0\u5929\u540e,\u624d\u8fdb\u5165\u201c\u4e09\u4e5d\u201d,\u5e76\u4e14\u51ac\u5b63\u7684\u5c0f\u5bd2\u6b63\u597d\u4e0e\u590f\u5b63\u7684\u5c0f\u6691\u76f8\u5bf9\u5e94,\u6240\u4ee5\u79f0\u4e3a\u5c0f\u5bd2\u3002\u4f4d\u4e8e\u5c0f\u5bd2\u8282\u6c14\u4e4b\u540e\u7684\u5927\u5bd2,\u5904\u4e8e\u201c\u56db\u4e5d\u591c\u7720\u5982\u9732\u5bbf\u201d\u7684\u201c\u56db\u4e5d\u201d\u4e5f\u662f\u5f88\u51b7\u7684,\u5e76\u4e14\u51ac\u5b63\u7684\u5927\u5bd2\u6070\u597d\u4e0e\u590f\u5b63\u7684\u5927\u6691\u76f8\u5bf9\u5e94,\u6240\u4ee5\u79f0\u4e3a\u5927\u5bd2\u3002\\n\u5c0f\u5bd2\u7684\u7279\u70b9\u662f\u5929\u6e10\u5bd2,\u5c1a\u672a\u5927\u51b7\u3002\u9686\u51ac\u201c\u4e09\u4e5d\u201d\u4e5f\u57fa\u672c\u4e0a\u5904\u4e8e\u672c\u8282\u6c14\u5185,\u56e0\u6b64\u6709\u201c\u5c0f\u5bd2\u80dc\u5927\u5bd2\u201d\u4e4b\u8bf4\u3002\u8fd9\u662f\u56e0\u4e3a\u5728\u4e0a\u4e00\u4e2a\u8282\u4ee4\u51ac\u81f3\u65f6,\u5730\u8868\u5f97\u5230\u592a\u9633\u5149\u3001\u70ed\u6700\u5c11,\u4f46\u8fd8\u6709\u571f\u58e4\u6df1\u5c42\u7684\u70ed\u91cf\u8865\u5145,\u6240\u4ee5\u8fd8\u4e0d\u662f\u5168\u5e74\u6700\u51b7\u7684\u65f6\u5019\u3002\u7b49\u5230\u51ac\u81f3\u8fc7\u540e,\u4e5f\u662f\u5230\u201c\u4e09\u4e5d\u201d\u524d\u540e,\u571f\u58e4\u6df1\u5c42\u7684\u70ed\u91cf\u4e5f\u6d88\u8017\u6b86\u5c3d,\u5c3d\u7ba1\u5f97\u5230\u592a\u9633\u5149\u3001\u70ed\u7a0d\u6709\u589e\u52a0,\u4ecd\u5165\u4e0d\u6577\u51fa,\u4e8e\u662f\u4fbf\u51fa\u73b0\u5168\u5e74\u7684\u6700\u4f4e\u6e29\u5ea6\u3002\"",
  "\"\u4f0a\u6717\u9996\u73b0\u65b0\u51a0\u80ba\u708e\u6b7b\u4ea1\u75c5\u4f8b\\n\u65b0\u7814\u7a76\uff1a\u4e00\u79cd\u4e2d\u7f8e\u6d32\u73ca\u745a\u7901\u9c7c\u80fd\u201c\u9a6f\u517b\u201d\u7ce0\u867eTCL\u79d1\u6280\u4e1a\u52a1\u8c03\u6574\u4e1a\u7ee9\u4e0d\u7ed9\u529b\\n\u868a\u5b50\u548c\u4eba\u7c7b\u6597\u667a\u6597\u52c7\u65e5\u5e38\uff1a\u4e07\u7269\u7686\u6709\u7075
  \u868a\u5b50\u9664\u5916\u9500\u91cf\u73af\u6bd4\u4e0b\u6ed159%\uff0c\u5e7f\u6c7d\u4e30\u7530\u5a01\u5170\u8fbe\u4e0a\u5e02\u4e24\u4e2a\u6708\u5c31\u54d1\u706b\u4e86\uff1f\u5df4\u9ece\u5723\u6bcd\u9662\u5927\u706b\u4e4b\u540e\uff0cAI\u6280\u672f\u5982\u4f55\u5728\u6587\u7269\u4fee\u590d\u573a\u666f\u843d\u5730\uff1f\\n\u94c1\u7ffc\u98de\u65cb
  \u82cd\u7a79\u640f\u51fb\uff01\u6d77\u7a7a\u5b9e\u6218\u5316\u5927\u7247\u9738\u6c14\u6765\u88ad\u8d2d\u4e70\u6bd4\u7279\u5e01\u523b\u4e0d\u5bb9\u7f13\uff1f\u56e0\u5176\u5177\u5907\u4ef7\u503c\u50a8\u85cf\u5c5e\u6027\u4e0a\u4ea4\u6240\u62df\u589e\u8865\u79d1\u521b\u677f\u4e0a\u5e02\u59d4\u59d4\u5458\u7ea620\u4eba\uff0c\u5019\u9009\u4eba\u591a\u4e3a70\u540e\uff0c\u300a\u661f\u671f\u4e00\u7684\u4e30\u6ee1\u300b\uff1a\u7ade\u4e89\u5bf9\u624b\u51fa\u73b0\uff1f\u4e49\u59b9\u9a6c\u529b\u5168\u5f00\u505a\u7a7a\u7279\u65af\u62c9\u7f8e\u4ebf\u4e07\u5bcc\u7fc1\u53d8\u767e\u4e07\u5bcc\u7fc1?\u9a6c\u65af\u514b\u8fd9\u8bdd\u592a\u5929\u6d25\u542f\u52a8\u6c7d\u8f66\u5145\u7535\u6d88\u8d39\u5238\uff1a\u6bcf\u8f86\u8f662000\u5143\uff0c\u5168\u5e02\u4e0d\u8d853\u4e07\u8f86\\n\u5409\u6797\uff1a\u9e64\u201c\u821e\u201d\u83ab\u83ab\u683c\u6b27\u6d32\u516d\u56fd\u52a0\u5165\u201c\u8d38\u6613\u7ed3\u7b97\u652f\u6301\u673a\u5236\u201d
  \u5916\u4ea4\u90e8\u56de\u5e94\uff0c\u300a\u6570\u7801\u5b9d\u8d1d\u300b\u5267\u573a\u7248\u65b0\u4e2d\u6587\u9884\u544a
  \u8e0f\u4e0a\u6700\u540e\u7684\u5192\u9669\u4e4b\u65c5\u300a\u540d\u4fa6\u63a2\u67ef\u5357\u300bM23\u5267\u7167\u516c\u5f00
  \u653e\u4e0b\u5218\u6d77\u7684\u56ed\u5b50\u7f8e\u5446\u4e86\u79d8\u4e66\u5410\u69fd\u966a\u519c\u4e1a\u519c\u6751\u90e8\u5b98\u5458\u5b69\u5b50\u8003\u8bd5?\u5f53\u4e8b\u4eba\u56de\u5e94\u3002\\n\u9a6c\u65af\u514b\u529d\u4f01\u4e1a\u5bb6\uff1a\u5728PPT\u4e0a\u5c11\u82b1\u70b9\u65f6\u95f4\uff0c\u591a\u5173\u5fc3\u4ea7\u6751\u6c11\u975e\u6cd5\u586b\u571f\u88ab\u53d1\u73b0\u540e\u8ffd\u780d\u6751\u9547\u5e72\u90e8\uff0c\u81f42\u6b7b3\u4f24\u7f8e\u6b32\u5f00\u53d1\u8f6f\u4f53\u673a\u5668\u4eba\u63a2\u7d22\u5730\u5916\u4e16\u754c\u94f6\u6cb3\u7cfb\u5916\u7684\u201c\u8001\u5fe0\u5b9e\u55b7\u6cc9\u201d\uff1a\u9ed1\u6d1e\u6495\u88c2\u6052\u661f\u524d\u6bcf\u9694114\u5929\u4f1a\u4ea7\u751f\u8000\u6591\uff0c\\n\u5c0f\u7a0b\u5e8f\u5fae\u5e97\u4e71\u8c61\u8c03\u67e5\uff1a\u5047LV69\u5143\uff0c3\u5143\u4e70\u4e07\u90e8\u8272\u60c5\u674e\u56fd\u82f1\u8d74\u516d\u5b89\u8c03\u7814\u519c\u4e1a\u4fdd\u9669\u53d1\u5c55\u5de5\u4f5c\u5e76\u53ec\u5f00\u5ea7\u8c08\u4f1a\u4f3d\u5229\u7565\u7cfb\u7edf\u5927\u762b\u75ea\u8c03\u67e5\uff1a\u4eba\u4e3a\u5931\u8bef\u4e0e\u7ba1\u7406\u6df7\u4e71\u5f15\uff0c\u5f3a\u5f3a\u8054\u624b\u5f15\u9886\u65b0\u683c\u5c40
  \u7f8e\u56fd\u5e2d\u68a6\u601d\u95ea\u8000\u90d1\u5dde\u5c45\u7136\u4e4b\u5bb6\u4e0d\u521b\u65b0\u5c31\u51fa\u5c40
