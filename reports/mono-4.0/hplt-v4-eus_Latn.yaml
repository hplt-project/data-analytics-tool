  duenari, Biharren zerbitzuak saldu barik; Bihar Home deritzona ere badaukagu, eta
  hori etxeko zaintza da. GSR da elkarlanean arituko garen kooperatiba horietako bat
  eta bertako profesionalak arduratuko dira balorazioak egin eta zainketaz. Guretzat
  sekulakoa da zaintzan urte askotako esperientzia duten pertsonak eta kasu bakoitzean
  zer egin daitekeen dakiten profesionalak izatea; azkenik, Bihar Shop daukagu. Denda
  horretan Gerodan deitzen den Azpeitiko kooperatibarekin egin dugu elkarlana; izan
  ere, adineko zentroetako produktuen hornitzaileak dira. Gure dendarako zenbait produktu
  aukeratu ditugu, erabiltzaileentzat interesgarriak izan daitezkeenak, eta jendeari
  eskaintzen dizkiegu.\\nTeknologiaren erabilera ere bada zuen proiektuaren gakoetako
  bat.\\nZenbait arlotan sartuko dugu. Adibidez, hilabete batzuk barru aplikazio bat
  sartzea da asmoa Bihar Home-n. Zaintzailea, familia eta gu harremanetan egongo gara
  aplikazio horrekin. Azkenean, ulertzen dugu pertsona bat zaintzeko lantalde bat
  egongo dela. Hortaz, bertan idatzi daiteke, esaterako, menpeko pertsona horrek nola
  egin duen lo, familiako kideak nola aurkitu duen bisitan joan denean... Hori guztia
  gordeta geratzen da eta aukera pila ditu. Bestalde, telebistari lotuta, probak egiten
  ari gara. Adineko askori konpainia egiten die telebistak eta asmoa da horiei errutina
  markatzeko jakinarazpenak botatzea: botika hartzea gogoraraziz, kalera irteteko
  proposamena eginez... Indukzio-plaka adimentsua ere eskainiko dugu; ahotsaren bitartez
  kontrolatzen da. Itsuentzat pentsatuta dago, baina menpekotasuna duenarentzat ere
  errazagoa da, agian, ahotsarekin kontrolatzea plaka.\\n\\\"Garrantzitsua da jendeak
  dioena entzutea eta eurengandik ikastea\\\"\\nAipatutakoak martxan jartzeko datarik
  baduzue?\\nMondragon Unibertsitatean lehenengo probak egin ditugu eta feedbacka
  edukitzen oraintxe hasi gara Aretxabaletako erresidentzian autonomia handiagoa duten
  pertsonekin. Guk egiten duguna ondo egin nahi dugu, eta probak egiten jarraitzea
  da asmoa. Litekeena da urte amaieran sartzea etxeetan.\\nBihar izenak zeri egiten
  dio erreferentzia?\\nGuk gaur zaintzen zaitugu, bihar hobea edukitzeko. Adinekoei
  \\\"bihar\\\" esanda, askotan, ez dute bihar hori ikusten. Nik gaur zainduko zaitut,
  baina zure bihar eta etorkizun horretan ari naiz pentsatzen. Gaur lagunduko dizut,
  bihar heltzeko.\\nLaguntza eskatzea kosta egiten da?\\nOrokorrean, ezjakintasun
  handia dago arlo honetan eta menpeko pertsonen bat gertu dugunean ez dakigu nora
  joan. Gainera, uste dut Euskal Herrian eta, batez ere, Gipuzkoan etxetik kanpo laguntza
  eske joaten garenean berandu izaten dela, askotan, eta pertsonak menpekotasun handia
  duten gradu batean egoten direla. Etxekook saiatzen gara ahalik eta hoberena egiten,
  baina ez da ezer gertatzen kanpora joan eta laguntza eskatzeagatik. Aurrerapauso
  hori eman behar dugu.\\nFamilian menpekotasun egoera duenari zer gomendatuko zenioke?\\nBihar
  Help-era deitzea; ze aukera dituen azalduko zaio. Pertsona bakoitza ezberdina da,
  egoera ere bai, eta bertan emandako argibideak jarraitzea gomendatzen diot. Oinarri
  bat izaten laguntzen du eta proposatutako aukeretatik erabaki onena hartu ahal izango
  du.\\nUdan hasi zineten proiektuarekin, bezeroak ere badituzue; nolakoa izan da
  erantzuna?\\nBezeroek erantzun beharko lukete, baina feedbacka positiboa izan da.
  Guretzat oso garrantzitsua da jendeak esaten duena entzutea eta eurengandik ikastea.
  Azkenean, pertsona eta familia bakoitza ezberdina da. Pausoz pauso hasi gara, baina
  epe luzerako apustua da.\\nEpe luzerako apustua dela diozu. EAEn zabiltzate, momentuz;
  mugak zabaltzeko asmorik baduzue?\\nEsandako gauza guztiak martxan jarri eta ondo
  menperatu behar ditugu. Oinarri bat hartzen dugunean, Estatuko beste erkidegoetara
  zabaltzea da asmoa, baita Iparraldera ere; azkenean, beste herrialde bat da eta
  beste legedi batzuk dituzte, baina hasi gara Iparraldeko merkatua ikusten eta aztertzen.
  Hala ere, orain, hemen gaude zentratuta.\"", "\"2016-IV-26\\nAleksandr Kots eta
  Dmitri Stexin\\nJatorrizko bertsioa errusieraz: (Komsomoslkaia Pravda)\\nErdarazko
  bertsioa: Nahia Sanzo (Slavyangrad.es)\\nDonbassek Valentina Lisitsa musika klasikoko
  pianojolea miresteaz gain, gurtu ere egiten du; eta ez bakarrik bere kalitate profesionala
  dela eta, baizik eta baita bere postura politikoa Mendebaldean defendatzeko modu
  gartua dela eta. Donbass babesteak eskandaluak eta bere jaioterri Ukrainan eta Europan
  harremanak galtzea ekarri dio. Komunitate profesionalean persona non grata bihurtzeko
  arriskua bere gain badu ere, gudan dagoen lurralde honetan berriz kontzertuak emanen
  ditu. Kontzertuaren aurreko entseguan gurekin izan du elkarrizketa hau.\\n\u201cNik
  ere alkandora brodatuak jantzita paseatzen nuen\u201d\\nHemen 2914tik daramagu lanean,
  eta pena handia dugu babesa adierazi duten artisten kopurua hain txikia dela ikusita.
  Eta zuk bigarren aldiz jotzen duzu\u2026\\nEgoera hasera batetik jarraitu nuen eta
  bihotza hautsi egin zitzaidan. Maidana beste modu batean ikusi nuen. Ni Sobietar
  Batasunaren pottaren belaunaldikoa naiz. Nik ere ukraineraz hitz egiten nuen eta
  alkandora brodatuak (ukrainar jantzi tradizionala) jantzita paseatzen nuen. Hainbeste
  independentzia genuen\u2026 Eta orduan belaunaldi hori ziria sartu ziotenaz jabetu
  zen, eta joan egin zen. Nik Estatu Batuetan bukatu nuen. Maidanen ari ziren gazteek
  pena handia eman zidaten: berriz etorkizun miragarri batean sinesten zuten. Nik
  jada hura bizi izan nuen, eta banekien zer zegoen.\\nNiretzat Odessakoa desastre
  hutsa izan zen, nire sustraiak hangoak baitira. Zer gertatzen ari zen izututa ikusi
  nuen eta itzulbiderik ez zegoenaz konturatu nintzen. Zorionez, Donbassen gertatutakoa
  ez zen Krimean gertatu\u2026 Populazioa lagundu nahi nuen. Pianojolea naiz, beraz,
  nire arma bakarra musika da. Eta oso arma indartsua da. Hemen jo nuen lehen aldiz
  konturatu nintzen musika ez dela soilik eliteentzako entretenimendua; oxigenoa adina
  beharrezkoa dela. Donetsken bertan jaio zen Prokofiev jo nuen. Hemen daude gure
  sustraiak, gure zibilizazioa, hemen entzuten nauen jendea haren parte da. Musika
  behar zutela sentitu nuen, eta ez nuen ezta pentsatu ere zein arriskutsua zen, edo
  Mendebaldean nola ikusiko zuten. Zer gertatzen delarik ere, hemen beti izango dut
  hartuko nauen etxea. Hona Berlinetik iritsi nintzen eta gero Kanadara noa, baina
  nire familia eta nire jendea bertan dago.\\n90. hamarkadan, adierazpen askatasuna
  bazegoen ere, Mendebaldean itzalgailu sekretu bat ere bazegoela jakin genuen. Itzaltzeko
  agintzen badu, edonor, bee statusa, ospea edo talentua gora-behera, prentsatik betirako
  desager daiteke. Ez al zenuen zure entzulegoa galtzeari beldurrik?\\nElitea beti
  zian da oztopo niretzat, horregatik YouTube erabiltzen nire burua birsortu nuen.
  Ehun milioi pertsonatik gorak ikusi naute. Ez dut uste entzulego hau tronpatu daitekeenik
  edo gezurra esan ahal zaionik ez naizena naizela esanez. Iaz Kanadan jotzea galarazi
  zidaten, baina duela gutxi Toronton jo nuen eta sarrera guztiak saldu ziren eta
  eskenatokira sartzerakoan zutik jarrita txalotu ninduten. Egia esan, uste dugun
  baino jende bizkor gehiago dago. Denek ez dute telebistak dioena sinesten. Halako
  jendeari zuzentzen natzaio. Ez naiz mehatxuen beldur, dagoeneko maiz mehatxatu banaute
  ere, eta ni eta nire familia iraindu badute ere. Baina horiek ez dira ezer ume baten
  malkoekin konparatuz. Duela bi egun goizez kontzertu bat jo nuen Gorlovkan. Ume
  asko zeuden han\u2026 Inguratu egin ninduten, niretzat jo nahi zuten. Jada berandu
  zela esan zidaten, baina nik, xaloki \u201cjo dezatela\u201d pentsatu nuen. Eta
  bagindoazenean, 19:10etan, tiroak hasi ziren eta umean bonbapean itzuli ziren etxera.
  Prokofiev, Bach, Chopin\u2026 jo nituen eta umeek nola begiratzen ninduten gogoan
  dut. Hori da saririk onena.\\n\u201cKremlinen trollak garela diote\u201d\\nMendebaldean,
  prentsan edota telebistan, Donbassen gertatzen ari denaz hitze egiten al da zerbait
  bederen?\\nZeozer iristen hasi da. Baina eztabaidarik handiena prentsa \u201calternatiboan\u201d
  dago: twitterren edo Facebooken. Mundu soko pertsona arrunt pila ezagutu ditut.
  Kremlinen trollak garela diote, baina jende honek egia mundu osoan zehar zabaltzen
  du. Puntzoi batekin globo erraldoi bat ziztatzen saiatzea bezalakoa da, zirrikitu
  horretatik argi pixka bat pasa dadin. Eta horrela gero eta jende gehiago jabetzen
  da Donbassen eta Ukrainan gertatzen ari denaz.\\nDonbassen zerk hunkitu zintuen
  bihotza jotzeko beste?\\nDebaltsevon geundenean, hormak soilik zutik zituen eraikin
  bat erakutsi zidaten. Dena ilun, gris zegoen. Eta erdian argi puntu bat zegoen:
  ume txiki baten manta arrosa bat. E dago zertan goruen edo biktimen argazkiak erakutsi
  beharrik; soilik arrazoi batengatik, erretako etxe horretan irauten duen manta hori
  erakustea nahikoa da.\\nOraingo eta duela urte beteko Donetsken artean ezberdintasunik
  ikusten al duzu?\\nEdonora joan ahala aurkitzen dugu larunbatetan garbitzen, margotzen
  edo berreraikitzen dabilen jendea. Populazioak ulertzen du hau bere lurra dela eta
  ez duela nora joaterik. Ukrainan EBra bisarik gabe bidaiatzearekin amets egiten
  dute, herrialde osoak korrika ihes egin nahi du. Jende honek ordea, ez du nora joaterik.
  Euren lurra, euren ideialak, euren zibilizazioa\u2026 babesten dute. Ega esan lur
  hau maite dute. Esperimentu bate gin nuen behin: Stuttgarten izan nuen kontzertu
  batetako irudiak eta Donetskeko beste batenak tartekatu nituen eta bi hirietako
  zein zen europar hiriburua galdetu nuen. Stuttgart ez zitzaidan askorik gustatu:
  zaborra zegoen, pintadak eta txomin-belarra nonahi. Donetskekin alderatzea askorentzat
  harrigarria izan zen. Kaleak garbitzen dituztenak hortaz harro daude. Ez dira ari
  espazio-ontziak armatzen, baina hiriarentzat lan handia egiten ari dira. Denak muxukatu
  eta besarkatu nahiko nituzkeen; egiten dutena ere, Donbassen ongizatearentzat garrantzitsua
  baita, beste edozein lan bezala.\\nBurua makurtu ez dutenaren, amore eman ez dutenaren
