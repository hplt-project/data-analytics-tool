  "\"Zinema Eraikitzen Latinoamerikako film luzeen ekoizpena babesten duen plataforma
  profesionala da, eta filmok amaitzen eta nazioartean zabaltzen laguntzen du. Donostia
  Zinemaldiak eta Cinelatino, Recontres de Toulouse zinema-jaialdiak antolatzen dute
  Zinema Eraikitzen, eta Latinoamerikako eta Europako zinemagintzako profesionalen
  topaketa, elkarrizketa eta interakzioa bilatzen ditu, zinemagile independenteen
  aniztasuna eta talentua bultzatuta.\\nAurtengo Zinema Eraikitzen 29 sailean 17 herrialdetako
  182 filmek eman dute izena. Toulouse eta Donostiako hautaketa-batzordeak sei film
  aukeratu ditu: A Cidade do Futuro, Cl\u00e1udio Marques eta Mar\u00edlia Hughes
  (Brasil); El Cristo Ciego, Christopher Murray (Txile - Frantzia); Don\u2019t Swallow
  My Heart, Alligator Girl!, Felipe Bragan\u00e7a (Brasil - Frantzia - Herbehereak);
  El Invierno, Emiliano Torres (Argentina - Frantzia); Los Ni\u00f1os, Maite Alberdi
  (Txile - Frantzia - Herbehereak) eta Rey, Niles Atallah (Txile - Frantzia - Alemania
  - Herbehereak - Qatar). Azken film horren zuzendariak Zuzendari Berriak sailean
  parte hartu zuen Luc\u00eda lanarekin.\\nMilak 19 urte ditu, antzerki-irakaslea
  da eta haurdun dago. Gilmar 27 urteko historia-irakaslea da, eta harreman bat du
  19 urteko Igor behizainarekin. Hiruren artean familia bitxi samarra osatuko dute.
  Filmak hiru gazteok Bahia estatutako lur idorretan dagoen Serra do Ramalho hirixkan
  daramaten bizimodua kontatzen du. Inguru horretako gizarteak beren istorio bitxiarekin
  duen erreakzioa ere ikusiko dugu.\\nMichael (30) mekanikariak kontatzen du Jainkoaren
  errebelazio bat bizi izan duela desertuan. Baina bere herrikoek ez diote ezertxo
  ere sinetsiko, eta zorotzat hartuko dute. Arratsalde batean, txikitako lagun batek
  urruneko herri batean istripua izan duela jakingo du. Michaelek guztia bertan behera
  utzi eta oinutsik lagunaren bila abiatzea erabakiko du, hura mirakulu baten bidez
  sendatzeko. Haren ibilerek atentzioa emango diete meategietan esplotatutako eta
  drogetan eroritako pertsonei; Txileko basamortuko errealitate gorria arintzeko gauza
  den Kristo bat bezala ikusiko dute.\\nJoca 13 urteko mutil brasildarra da eta neska
  indigena paraguaitar batekin maiteminduta dago, bi herrialdeon arteko mugan. Bere
  maitasun-istorioaren alde borrokan egiteko bere anaia nagusi Fernando behizain motoziklistaren
  sekretuei egin beharko die aurre.\\nPatagoniako estantzia bateko kapataz zaharra
  lanetik bota dute. Haren tokian, peoi gazteago bat ipiniko dute. Bietako inorentzat
  ez da izango samurra aldaketa. Bakoitzak bere moduan egin beharko dio aurre datorren
  neguari. Opera prima.\\nDown sindromedun lagun talde batek ia 40 urte darama ikastetxe
  berera joaten, eta ez daukate ikasle izaten segitzeko gogorik. Guraso gehienak hilda
  dauzkate, eta haietako inortxok ere ez zuen pentsatzen hil ostean seme-alabek bizirik
  jarraituko zutenik. Seme-alabek beti pentsatu izan zuten, gurasoak hildakoan, debekatzen
  zieten guztia egin ahalko zutela: euren kontura bizi, sexu-harremanak izan, ezkondu,
  guraso bihurtu eta benetako lanpostuak bete. Baina gauzak ez zaizkie aldatu batere,
  eta 10 urte balituzte bezala bizitzeak eragindako frustrazioari aurre egin beharko
  diote, nahiz eta 50 eduki.\\nAbokatu frantziar batek 1860an Patagoniako Errege izateko
  ametsa zuen. Eta halaxe gertatu zen, gertatu ere. Hala dirudi, behintzat. Zuzendari
  Berriak sailean parte hartu zuen, aurreko Luc\u00eda lanarekin.\\nZinema Eraikitzen
  saileko 29. edizioan honako sari hauek banatuko dira:\\nZINEMA ERAIKITZEN SARIA
  TOULOUSE\\nEnpresa laguntzaileek postprodukzio-zerbitzuak eskainiko dituzte, baita
  saritutako filmaren postprodukzio-lanak egiteko beka bat ere.\\nToulouseko Zinema
  Eraikitzen saria enpresa eta erakunde antolatzaileen ordezkariz osatutako epaimahaiak
  emango du:\\nCCAS (Caisse Centrale d\u2019Activit\u00e9s Sociales du personnel des
  industries \u00e9lectriques et gazi\u00e8res), CNC (Centre National du Cin\u00e9ma
  et de l\u2019Image Anim\u00e9e), Commune Image, Eaux Vives, Firelfly, Mactari,\\nTitra
  TV.\\nCINE + ERAIKITZEN SARI BEREZIACIN\u00c9\\n+ kanalak bermea ematen dio sariaren
  film irabazleari 15.000 \u20ac-tan erosi egingo duela eta telebistan emango duela.
  Sari hori filma Frantzian banatuko duen etxeari emango zaio.\\nEUROPAKO BANATZAILEEN
  ETA EXHIBITZAILEEN SARIA\\nEuropa Distribution banaketa-sareak eta CICAE elkarteak
  (Conf\u00e9d\u00e9ration Internationale des Cinemas d\u2019Art et d\u2019Essai)
  filma sustatuko dute.\\nSarien xehetasunak ikusi nahi izanez gero, egin klik hemen.\\nZinema
  Eraikitzen sailak honako erakunde eta enpresa hauen babesa dauka: Programa Ibermedia,
  Daniel Goldstein, Deluxe Spain, Dolby Iberia, Laserfilm Cine y Video, Nephilim producciones,
  No Problem Sonido, Wanda Visi\u00f3n, eta honakoen laguntza: Caisse Centrale d\u2019Activit\u00e9s
  Sociales du personnel des industries \u00e9lectriques et gazi\u00e8res (CCAS), Centre
  National du Cin\u00e9ma et de l\u2019Image Anim\u00e9e (CNC), CIN\u00c9 + Commune
  Image, Conf\u00e9d\u00e9ration Internationale des Cin\u00e9mas d\u2019Art et Essai
  (CICAE), Conseil G\u00e9n\u00e9ral de la Haute Garonne, Eaux Vives, \u00c9cole Sup\u00e9rieure
  d\u2019Audiovisuel (ESAV), EP2C-Postproduction Training Programme, Europa Distribution,
  Firefly, La Cin\u00e9fondation, La Trame, Mactari, Mairie de Toulouse, Maison Universitaire
  Franco-Mexicaine, Minist\u00e8re des Affaires \u00c9trang\u00e8res, Producers Network
  (Cannes), R\u00e9gion Midi-Pyr\u00e9n\u00e9es, Signis eta Titra TVS.\\nOndorengoen
  babesarekin\"", "\"ELAk, Eusko Jaurlaritzaren 2025eko aurrekontu proiektua ezagutu
  bezain laster, epaitegira jotzeko erabakia hartu du. ELAren ustez, Eusko Jaurlaritzak
  aurrekontu proiektua onartu aurretik Mahai Orokorra deitu behar du, aurreko urteetan
  egin izan duen bezala, aurrekontu horietan bere ardurapeko 100.000 langileen lan
  baldintzen inguruko erabakiak eztabaidatzeko.\\nAzken urteetan, formalki izan bada
  ere, aurrekontuak onartu aurretik, Urkullu Lehendakariaren Gobernuak Mahai Orokorra
  deitu du. Pradales Lehendakariaren gobernuak, ordea, lan baldintzak zuzenean inposatu
  ditu, langileen ordezkariekin hitz egin gabe. Era honetan, langileen ordezkariek
  langileen lan baldintzak negoziatzeko oinarrizko eskubidea ukatu eta urratu du Eusko
  Jaurlaritzak.\\nEusko Jaurlaritzak, erabaki hau hartzeaz gain, bere ardurapeko 100.000
  langileen lan baldintzak etorkizunean estatuko aurrekontuetan onartzen denaren menpe
  uztea erabaki du. Gogora ekarri beharra dago egun 2025eko estatuko aurrekontuak
  eztabaidagai daudela eta, ondorioz, bertan adostu daiteke EAEn edo Nafarroan bestelako
  soldata igoerak izatea eta aurreko urteetan lan baldintzak negoziatzeko ezarri dituen
  mugak kentzea. Are gehiago, hori da hain zuzen EAJren eta PSOEren artean adostutakoa.
  Bada, Eusko Jaurlaritzak uko egin dio sindikatuekin gai horri buruz negoziatzeari.
  Besteak beste, EAEko langile publikoen soldata igoera Espainiako Kongresuan onartuko
  dena izatea erabaki dute.\\nAzken urte luzeetan behin eta berriz euskal langile
  publikoek eta sindikatuek aldarrikatu dute langile publikoen lan baldintzak hemen
  erabaki behar direla. Horren adibide da aurreko ikasturtean sektore publikoan egindako
  hiru greba orokorrak. Eusko Jaurlaritzak oraingoan ere aldarrikapen horri muzin
  egin dio eta Madrilera begira jarri da langile publikoen lan baldintzei dagokionez.\\nPradales
  Lehendakariak esaten duen bitartean aurrekontuak zerbitzu publikoak indartzeko baliatuko
  direla, zerbitzu publiko horiek aurrera eraman behar dituzten langileen lan baldintzak
  negoziatzeko inolako borondaterik ez du erakutsi eta Madrilen menpe uzten ditu beste
  behin.Hau egiten du Estatutuaren betearazpena publikoki aldarrikatzen duen bitartean.\\nLangile
  publikoen lan baldintzen gainbeherak ez du etenik izan azken urteetan. 2021etik
  hona eros ahalmenaren galera %6koa izan da eta 50.000 langile daude oraindik behin
  behineko egoeran, ia plantillaren erdia. Osakidetzaren kasuan plantillaren erditik
  gora. Besteak beste, esparru batzuetan jasaten dugun profesional falta lan baldintzen
  okertze honek azaltzen du.\\nELAk aurrekontu hauen irakurketa lasaia egin ondoren,
  bere orokortasunean baloratuko du. Gaur gaurkoz, irakurritakoaren arabera ELAk argi
  du aurrekontu hauek ez dutela zerbitzu publikoen alde egingo eta aurreko gobernuaren
  autoritarismo berarekin kudeatua izaten ari dela.\"", "\"Apirilaren 30ean, hiru
  urte beteko ditu Donostiako Udalak kalamu elkarteen egoera erregulatzeko onartutako
  araudiak, aho batez onartua eta Estatuko lehena. Arautegia EH Bilduko Udal Gobernuaren
  ekimena izan bazen ere, eskerrak emateko modukoa izan zen gainerako talde politikoen
  jarrera, baita udal zerbitzu juridikoena ere.\\nDonostiako Udalak onetsitako araudia
  aurrera pauso handia izan zen, izan ere, kalamuaren gaia aspalditik dago bi agendatan:
  publikoan eta politikoan. Bi horietan, eta gaur egungo marko politiko-juridikoan,
  kalamuaren kontsumoak eta banaketak zailtasun handiak dituzte. Oztopoak oztopo,
  arautegia onartuta, esan behar dugu asmatu genuela. Araudiak, hain zuzen, honako
  helburu hauek zituen: eskubide zibilak handitzea; paradigma aldaketa bat egitea;
  arriskuak gutxitzea eta debate publikoa egitea.\\nEskubide zibilak handitzeari dagokionez,
  handitzearen helburua zen herritarren eskubideak \u2014 kalamu-kontsumitzaileenak,
  zehazki \u2013 bermatzea. Izan ere, garai hartan, Espainiako Gobernua eskubide zibilak
  murrizten ari zen. Murrizketen adibide ziren Zigor Kodearen erreforma eta Herritarren
  Segurtasuna Babesteko Legea, besteak beste. Murrizketen aurrean, Donostiako Udalak,
  kalamu elkarteetarako araudiaren bidez, kalamua kontsumitzen zutenei babes politikoa
  eta juridikoa eman nahi zien, betiere beren eskubideak aitortuz. Udalak, halaber,
  gizarte zibilari mezu bat, giza eskubideak indartzeko beharrarena, helarazi nahi
  zion.\\nParadigma aldaketara etorrita, esan gabe doa zeintzuk izan diren administrazio
  publikoen jarreraren oinarriak: debekuan oinarritzea eta drogen kontrako politikak
  egitea. Bi funts horiek, funtsean, zigortzaileak dira. Eta, zigor horien aurrean,
  Donostiako Udalak araudian, legezko testuan, babes juridiko-politikoa ematen zien
  kalamu elkarteei.\\nArriskuak gutxitzeari begira, drogen kontra egiten den edozein
  politikaren helburuak arriskuak \u2014ukaezinak direnak- txikitzea beharko luke
  izan. Gainera, politika horrek onartu beharko lituzke kalamu bazkunek perilak gutxitzeko
  duten gaitasuna: kontsumitzaileak merkatu beltzetik ateratzearena.\\nDebate publikoa
  egitearen aldetik, kalamu elkarteak erregulatzeko, ezinbestekoa da publikoki \u2014baita
  politikoki ere eztabaidatzea. Izan ere, jakin badakigu gai honen kudeaketa udal
  administraziotik haragokoa dela eta ezin dela soilik hirigintzako araudi batean
  kudeatu.\\nBehin Donostiako Udalak onetsitako araudiak hiru urte beteta eta hori
  hainbat udalek eredu gisa hartuta, Espainiako Gobernuak arautegiaren kontra errekurtsoa
  aurkeztu zuen Justizi Auzitegi Nagusian, lehenik. Ondoren, bertan auzia galdu eta
  gero, Gobernuak Auzitegi Gorenera jo du.\\nEgia esan, ez naute Espainiako Gobernuaren
  arestiko bi helegiteek harritzen. Izan ere, Gobernuak gai honetan beste gai batzuetan
  bezala jokatu du. Jokaera horrekin, auzitegiak baliatuz, herritarroi gure eskubideak
  ukatu nahi dizkigu; ez baita debate politikoan parte hartzeko gai. Espainiako Gobernua
  ez da gai jendarte heldu batek eskatzen duen eztabaida politikoa irekitzeko. Gizarte
  zibilak, tokiko erakundeekin batera, jarraitu beharko du lanean aurrerapauso gehiago
  eman ahal izateko.\\nBERRIAn argitaratua\\nHector Prieto Alternatibako kide eta
  Aretxabaletako EH Bilduko zinegotziarekin erreportajea egin du Goiena aldizkariak.
  Bere borrokaren berri ematen digu, besteak beste, Mirari Altube kazetariaren artikuluak.\\nAhots
  barik geratu zen iaz Hector Prieto (Aretxabaleta, 1983). Baina horrek ez du isildu,
  ez horixe. Ordenagailu baten laguntzarekin zinegotzi lanean jarraitzen du, sare
  sozialetan gogotsu dihardu eta historia kontuen gaineko hainbat proiektu ditu buruan.\\nMuskuluetako
  gaitz degeneratiboa du Prietok, eta urte asko daramatza gurpildun aulkian. Eskuak
  mugitu barik ere aise idatzi du ordenagailuan oraintsu arte, ahotsak lagunduta.
  Gaitzak, baina, aurrera jarraitzen du eta iaz ahots barik geratu zen. \u201cHilabete
  gogorrak pasatu nituen, baina lanerako gertu itzuli naiz\u201d. Asko du esateko
  eta besteekin partekatzeko eta horretan lagunduko dion ordenagailua jarri diote:
  \u201cOhiko tableta da, baina arratoia begiekin mugi dezaket. Gainera, idatzitakoari
  ahotsa jartzen dion programa dut\u201d.\\nTeknologi baliabideei oso eskertuta dago:
  \u201cElbarritasunak ditugunondako mundura zabaldutako leiho bat dira\u201d. Horrez
  gain etxekoen babes handia du: \u201cHoriek barik ezinezkoa zatekeen egin dudan
  guztia, euren bultzada ezinbestekoa dut une txarretan\u201d, eta batez ere ama nabarmendu
  du: \u201cNire bizitzaren zati handi bat da, beti alboan; ama benetan kementsua\u201d.\\nBlog
  bi eta historia kontuak\\nIazko ekainetik da zinegotzi Prieto: \u201cAitak, gaztetan,
  sindikatuen inguruan jardun zuen eta horren eraginez edo nik beti izan dut kontzientzia
  soziala. Zinegotzi izan zen Tomas Fernandezek proposatu zidan 2011n Bilduren zerrendan
  joateko eta baietza ematearekin batera Alternatiban afiliatu nintzen\u201d. Gizarte
  Zerbitzuak beste aldetik ezagutzen ditu eta esperientzia hori eroan gura izan du
  udaletxera: \u201cEtxerik etxeko laguntza hobetu gurako nuke batez ere; erabiltzaileen
  eta laguntzaileen egoera. Ondo ordaindu gabeko lana dela kontura gaitezen gurako
  nuke, batez ere emakumeek egindakoa\u201d, dio eta gaineratu du: \u201cBorondate
  politikoa behar da etxerik etxeko zerbitzua egoitzen alternatibatzat hartzeko\u201d.\\nZinegotzi
  lana bateratzen du idaztearekin: \u201cOso gustuko dut, eta une gogorretan asko
  lagundu izan dit\u201d. Sare sozialetan ere ibiltzen da, batez ere Facebooken, eta
  bi blog ditu: \u201cLehengo Rinconcito de los Sue\u00f1os orain Atxabalta Redvolution
  bihurtu dut eta hor nabil. UDAko kontuak jasotzen ditudan Pasion Celeste, ostera,
  geldi daukat. Datorren denboraldian helduko diot berriro, futbolzale asko ditut
  horren zain eta\u201d. Historia ikasketak ditu eta buruan badu proiektutxoren bat:
  \u201cHainbat dokumentu jasotzen bukatu berri dut eta aurrerago helduko diet\u201d.\\nAurten
  33 urte beteko ditu Aretxabaletako gazteak. Etorkizunera begira egon beharrean egunean
  egunekoa bizi du: \u201cChe Guevarak zioen esaldi bat dut oso gustuko: \u201cBizitza
  honetan aire-ahokada bakoitzeko egin behar da borrokan\u201d. Asma zuelako asko
  sufritu zuen hark, baina ez zuen sekula amore eman\u201d.\\nGipuzkoako Gizarte politikako
  diputatu eta Alternatibaren kide Ander Rodriguezek Alzheimerra pairatzen duten pertsonekiko
  sentsibilizazio kanpaina aurkeztu du gaur Donostian.\\nAlzheimerraren inguruan kontzientziatzeko
  jarduera programa bat aurkeztu dute AFAGI Gipuzkoako Alzheimerdunen eta Bestelako
  Dementziadunen Senitartekoen eta Lagunen Elkarteak eta Gipuzkoako Foru Aldundiak,
  datorren irailaren 21ean Alzheimerraren Munduko Eguna ospatuko baita. Hamaika ekitaldik
  osatutako egutegia bihar bertan hasiko da, Lazkaoko Txindoki egoitzan emango den
  hitzaldiarekin, Alzheimerra duten pertsonekiko komunikazioari buruz, eta urriaren
  2an itxiko da, Irunen, zaintzaileei zuzendutako hitzaldi batekin. Bihartik hilaren
  amaierara arte, informazio mahaiak, hitzaldiak, AFAGIko bazkideen arteko topaketak
  eta jarduera solidarioak egingo dira, gaixotasun honen inguruko sentsibilizazioa
  bilatzeko eta alzheimerraren errealitatea Gipuzkoako eskualde guztietara helarazteko.\\nKanpaina
  honen ekitaldi nagusia irailaren 20an izango da, Donostiako Kontxako Pasealekuan:
  bertan, ohikoa den giza katea egingo da, eta globoak askatuko dira, alzheimerra
  duten pertsonekiko eta horien familiekiko elkartasunaren adierazle.\\nGipuzkoako
  Gizarte Politikako diputatuak, Ander Rodriguez, eta AFAGIko presidenteak, Koldo
  Aulestia, Alzheimerraren Munduko Egunaren inguruko sentsibilizazio kanpainako jardueren
  programa eta kartelak aurkeztu dituzte gaur. Aurtengoan, Alzheimerraren Munduko
  Egunaren leloa \u201celkartasuna\u201d da.\\nKoldo Aulestiak azaldu du AFAGIk gogor
  lan egiten duela, \u201celkartasun\u201d hori beti egon dadin gure bizitzetan: \u201cElkartasuna,
  zentzurik zabalenean, gizartearen sektore guztietara iritsiz, eta ez, zuzenean edo
  zeharka, XXI. mendeko pandemia honekiko erantzukizuna edo lotura duten horietara
  soilik. Elkartasuna, konplizitatearen eta konpromisoaren isla gisa, eta ez pena
  edo errukiaren adierazle gisa\u201d. Helburua hori izanik, AFAGIk parte hartzen
  du elkarteen konfederazio estatalak (CEAFA) abian jarri duen proiektu batean: \u201cSolidarioak
  Alzheimerrarekin\u201d.\\nProiektu honen xedea da printzipioz gaixotasunarekiko
  lotura zuzena ez duten entitate publiko zein pribatuek arazo soziosanitario honekiko
  duten sentsibilizazioa ikusaraztea. Une honetan, deklarazioa sinatu duten 328 entitate
  publikoetatik (gehienak udalak), 35 Gipuzkoakoak dira.\\nKalkulatzen da Espainian,
  gaur egun, 65 urtetik gorako pertsonen % 7k (503.681) eta 85 urtetik gorako % 50ek
  (623.723) arriskua dute zuzenean dementzia motaren bat sufritzeko (eta Alzheimerra
  da gehien ematen dena). Beraz, kalkulatu dezakegu kasu kopurua 1,2 milioi pertsonara
  iristen dela (1.127.403 hain zuzen ere); horrek Estatuko biztanleriaren % 2,4 egiten
  du (65 urtetik gorakoen % 13,4). Gipuzkoari dagokionez, 23.630 pertsonara iritsiko
  litzake.\\nAnder Rodr\u00edguezek azaldu duenez, gaixoen %84 atenditzen ditu Gizarte
  Politikako Departamentuak. Horietatik, %40 adinekoen egoitzetan daude eta %60k etxean
  jarraitzen dute, familia inguruko zainketetarako laguntza ekonomikoen babesarekin,
  Etxerako Laguntza Zerbitzuarekin, eguneko zentro edo bestelako zerbitzuekin.\\nDiputatuaren
  hitzetan, \u201cmendeko pertsona etxean bere inguruan mantentzea Foru Aldundiaren
  lehentasunetako bat da, horregatik handitu ditugu Gipuzkoan Mendekotasun Legearen
  laguntza ekonomikoak, Espainako Gobernutik murrizketa bortitzak jaso arren. Ez hori
  bakarrik, hobetze bidean, arreta espezializatua eta pertsonengan zentratuta bilatzen
  ari gara, horregatik unitate psikogeriatrikoen aldeko apustua egin dugu egoitzen
  barruan. Iaz 15 plaza psikogeriatriko gehiago zabalduko genituen Lasarte-Oriako
  Atsobakar egoitzan eta hurrengo hilabeteetan, 18 gehiago zabalduko ditugu Bergaran\u201d.\\nAulestiak
  adierazi du, baita ere, ez dela ahaztu behar Alzheimerrak eragina duela, baita ere,
  \u201cgaixo gazteengan\u201d; hau da, 65 urte baino gutxiagoko pertsonak, gaixotasun
  honen ondorio suntsitzaileak pairatzen dituztenak. \u201cGaixo gazte\u201d hauek
  dira kasu guztien % 10 inguru.\\nInpaktu sozialari dagokionez, Alzheimerra ez da
  gaixoarekin bakarrik grinatzen. Izan ere, familiak beregain hartzen du gaixoa zaintzearen
  eta behar duen arreta ematearen pisua eta erantzukizuna. Ondorioz, eta egitura familiarra
  kontuan hartuta, esan dezakegu gaixotasunak, Estatuan, eragina duela 4.509.612 pertsonengan,
  hau da, biztanleria osoaren % 9,7rengan. Gipuzkoan, 94.520 pertsonengan du eragina.\\nHala
  ere, AFAGIko presidentearen hitzetan, \u201cdatu horiek gaur gaurkoak dira. Ez dute
  balio datozen urteetarako. Izan ere, aurreikuspenak aintzat hartuta, gure biztanleriaren
  zaharkitzea areagotzen joango da eta, beraz, kopuru horiek bikoiztu egingo dira
  epe ertainera\u201d.\\nAitor Montes Lasarte \u2013 Familia medikua\\nEuskaldunon
  odola beti izan da mintzagai. Izan ere Rh negatibo ospetsuaren dentsitatea Euskal
  Herrian beste inon baino handiagoa omen da; zientzialari askoren ustez, euskaldunon
  berezitasunaren erakusgarri: bereziak, isolatuak, genetika aldetik zein hizkuntza
  aldetik. Harrotasun gabeko izaterik ez da, eta guk badaukagu gurea. Bego horrela,
  ez naiz horrelako saltsatan sartuko.\\nBaina euskaldunak izanagatik, euskaldunak
  odolaz, ohituraz eta mintzairaz, ez gara ohartu odoleko analisien emaitzak gazteleraz
  daudela. Odola mehetu zaigu antza, eta osasun-arreta erdaraz izan behar duela hezurretan
  barrena daukagu sartuta.\\nOsakidetzak euskarazko osasun zerbitzua eskaini behar
  luke; bere betebeharra da, saihestezina, koherentea izan nahi badu. Zoritxarrez,
  euskaldunok osasun-arreta euskaraz eskatu beharrean gaude, gure eskubidea behar
  zuena betebeharra bilakatuta alegia. Erakundeak 30 urte bete dituen honetan, erronka
  handia jo digu langileoi, baina gogorarazi behar genioke euskararen arloan herren
  handia eginez gabiltzala, okerreko bidetik. Lankide askok euskarari herra handia
  diotela ez dago ukatzerik, eta egia esan, gatazkak uxatu nahian, euskararen normalizazioari
  uko egin diogu; horrela jarraituz gero, erakundea baino herrakundea deituko diote
  euskal hiztunek, eta bete-betean asmatuko. Bistan da herreneriak jota dagoela.\\nGaitza
  da denbora luzez osasun arloa erdaraz izateko ohitura sendatzea, baina egoera hau
  lehenbailehen konpondu behar genuke; gaixoak osatu, herrenak zuzendu eta itsuak
  argitu. Eta egon badaude aurrerapauso txikiak emateko aukera zehatzak, konkretuak,
  bizkorrak, alboko ondoriorik gabeko sendabideak. Horien artean, hasteko, odoleko
  analisien emaitzak euskaraz eskaintzea. Ez dirudi gehiegizko eskabidea \u00abglucosa\u00bb
  ordez glukosa jartzeak; creatinina jarri beharrean kreatinina, edo \u00abfiltrado
  glomerular\u00bb (MDRD) jarri barik iraizketa glomerularra (MDRD) jartzea, adibidez.
  Zure medikuari galde egiozu, hark azalduko dizu zer den iraizketa glomerularra euskaraz.\\nEsango
  dute, eta egia da, ez dela nahikoa izango. Horrela ez dugu euskarazko osasun-arreta
  sortuko, ez dugu Osakidetza euskal- dunduko, baina oinarrizko abiapuntu bat da,
  ezinbesteko aurrerapausoa, euskarak osasungoan erroak egin ditzan. Aurrenekoz, idatzizko
  harremanak, ematen zaizkigun idazkiak euskaraz jasotzea eta eskaintzea, lan hizkuntza
  eta zerbitzu hizkuntza uztartuz, normalkuntzarako bidea gure baitan ostatua har
  dezan.\\nBaina erraza izan arren, urratsa izan arren, eskatu egin behar dugu. Eskubideak
  ez zaizkigu berez ematen ez bermatzen, beti oztopo edo trabak jartzen dizkigute,
  eta eskean ibili behar. Isilik nahi gaituzte, makurtu, herrestarazi, eta Eusko Jaurlaritzak
  edo Osasun sailak edozein aitzakia eta estakururen gerizpean babesa bilatuko du.
  Ezinezkoa dela, krisialdian gaudela, dirurik ez dagoela. Bereziak omen gara euskaraz
  lan egin nahi dugunok, isolatuak, bakan batzuk besterik ez. Batzuek odola mehe daukate.\\nOrain
  gutxi famili mediku batzuk, egunero darabiltzagun gernu eta odoleko analisien emaitzak
  euskaraz jasotzea eskatu dugu, bakoitzak bere unitatean. Ez dugu erantzunik jaso
  jakina, eta analisiak gazteleraz datoz oraindik. Gure lankide euskaldunei gauza
  bera egin dezaten eskatzen diegu, bide batez. Baita erabiltzaileei ere. Eska ezazu
  zure odoleko eta aanalisien emaitzak euskaraz, mesedez. Ez onartu erdaraz.\\nIzan
  gaitezen beraz euskaldunak mintzairaz, eta odolaz baino, odoleko analisiez behintzat.
  Odoleko analisiak, euskaraz!\\nAlternatibako Gipuzkoako koordinatzaile Ayem Oskozek
  bihar, larunbata, Tolosan antolatutako elkarretaratzean parte hartzeko deia egin
  du, Osasun eskubidea, publikoa eta kalitatezkoa lemapean eguerdiko 12:00etan Trianguloatik
  abiatuko dena, \u201cosasungintza publikoa aldarrikatu eta kapital pribatua oinarrizko
  zerbitzu publikoetan sartzearen arriskuaz ohartarazteko\u201d, Eusko Jaurlaritzako
  Osasun Sailak Inviza enpresarekin duen hitzarmenaren harira.\\nAlderdi ezkertiarreko
  bozeramaileak gogora ekarri nahi izan du Margaret Tacherrek Erresuma Batuan zerabilen
  leloa, \u201cthere is no alternative\u201d (ez dago beste aukerarik) oinarrizko
  zerbitzu publikoak pribatizatzen zituenean: \u201cEgun, Ingalaterran nabarmenak
  dira politika horrek osasungintzaren kalitateari eragin zizkion kalteak. Orain dela
  gutxi, David Cameron lehen ministroak barkamena eskatu behar izan zuen, hain zuzen
  ere, pribatizazio prozesu horren ondorio lazgarriengatik\u201d.\\nOskozek esan duenez,
  Thatcherrek ez bezala, \u201cPNVk disimulu handiagoarekin ekin dio osasun sistemaren
  pribatizazioari\u201d. Honen kontra, askotariko eragile ugari biltzen dituen Tolosaldea
  Osasun Publikoaren Alde TOPA plataformak lan \u201cbikaina\u201d egin du eskualde
  hartan gertatzen ari den egoeraren inguruko kezka zabaltzeko, alegia \u201cDarpon
  osasun kontseilariak Tolosaldeak ospitale publiko bat izatearen eskaera historikoari
  muzin egin eta pribatizazioan urrats berriak egiten dabilela salatzeko\u201d.\\nIzan
  ere, Eusko Jaurlaritzak Gomez Montoyaren Asuncion Klinikari orain arte publikotik
  ematen ziren zerbitzuak bideratzen ari da. Gomez Montoya Adegi eta CEOEko klinika
  pribatuen bozeramailea da eta, ospitaleak kudeatzeaz gain, zahar etxeak ere kudeatzen
  ditu. Ez da lehen aldia PNVk lagundu egiten diona. Zahar etxeen borrokan Gomez Montoyak
  Gipuzkoako patronalaren bozeramaile gisa Aldundiaren kontra aritu zenean, PNV Adegiren
  alde aritu zen.\\nAlternatibatik gogorarazi dutenez, \u201cEuskal Herrian ikusi
  ditugu Nafarroako ospitaletako elikagaien aferarekin zein larria izan daitekeen
  osasungintzaren pribatizazioa\u201d. Horregatik, orain PNVk EAEn ere eredu hau zabaltzeko
  helburua ageri duela, \u201cTolosaldean eman beharreko erantzuna sendoa izan behar
  da, Tolosaldean eredu hau gelditzeak beste eskualde batzuetan be gelditzea suposatuko
  baitu\u201d.\\nArabako EH BILDUk Errioxako Eskualdeak pairatzen dituen arazo larriei
  behin betiko erantzuna ematea eskatu dio Urkulluri. Izan ere, Arabako EH Bilduren
  ustez, gabezi horiek guztiak azkenego EAEko gobernuen utzikeriaren ondorio zuzenak
  dira. Bihar bertan bilduko dira bi gobernuen ordezkariak eta Arabako EH Bilduk iragarri
  duenez, eskualdean eman beharreko zerbitzuetan ezin dira beste adabakiak jarri eta
  bi arlo aipatu ditu: osasungintza eta nekazaritza, batez ere, ardogintzarekin lotuta
  dauden guztiak.\\nOsasungintzari dagokionez, Arabako EH Bilduk Lezako Ospitala nabarmendu
  du. Koalizioaren ustez, egungo ospitala garatu behar da Eskualde-Ospital bihurtu
  arte. Zentzu horretan, badirela bi urte aldebakartasunez, Errrioxako Gobernuak osasun
  arreta bertako biztanleriari kendu ziotela gogoratu du. Baina Errioxako Eskualdeak
  eman zuen erantzunari esker, Lakua eta Errrioxako Gobernuek akordio bat sinatu zuten.
  Arabako EH Bilduren ustez, akordio horiek aldi baterako erantzuna baino ez dira.\\nBestalde,
  Arabako EH Bilduk, ardogintzan kudeaketa eta kontrolerako berezko mekanismoak sortu
  behar direla aldarrikatu du. Horrela, bertako interesak defendatuko direlakoan dago
  koalizioa orain arte, Errioxako Gobernuaren gutxiespenaren menpe daudelako. Orain
  berriz, Urkullu eta Sanz presideen arteko elkar-ulertzeak akordio zehatz batzuetan
  irudikatuko dela ematen du. Baina Arabako EH Bilduren ustez, behin behineko erantzuna
  eman dezakete baina dauden hutsune eta gabeziei behin betiko erantzuna ez bilatzeko
  aitzakia ezin dira izan.\\nAitor Montes Lasarte \u2013 Familia medikua\\nEuskararen
  aldeko aldarrikapenen artean, edo euskaldunon hizkuntz eskubideak errespetatzeko
  eta bermatzeko eskakizunen artean, osasun arreta euskaraz eskatu izan da aspalditik.
  Baina argi daukagu zer den benetako osasun arreta euskaraz? Zer da euskararen normalkuntza?
  Hizkuntza baten benetako normaltasun egoera zein den badakigu?\\nOsasun arretak,
  osasun sisteman paziente edo gaixoarekiko harreman eta prozedura guztiak bere baitan
  hartzen dituela esan genezake. Helburua hortaz, harreman hauek guztiak euskaraz
  izatea izan beharko litzateke. Kontuan hartu behar dugu, baina, harreman hauek konplexuak
  direla, maila ezberdinetan burutzen baitira, eremu ezberdinetan, jende askorekin,
  era ezberdinetan.\\nGaur egun, zoritxarrez, erabiltzaileen hizkuntz eskubideak ez
  dira bermatzen; ez da osasun arreta euskaraz eskaintzen Euskal Herrian. Eta honek
  euskara bigarren mailako hizkuntza bilakatzen du, eta euskaldunak bigarren mailako
  hiritarrak. Eskubideen hierarkia ezartzen da. Osasungoa egungo gizartearen ardatzetako
  bat da jakina, zutabe bat; EAJk adibidez bere hauteskunde programan ere ondo adierazi
  zuen: \u201clas pol\u00edticas de salud y nuestro sistema de salud son pilares fundamentales
  de la calidad de vida y del bienestar de nuestra sociedad\u201d. EH Bilduk hauxe
  zioen bere programan: \u201cosasun eskubidea, hezkuntza eskubidearekin eta Euskal
  Herrian bizi garenon gizarte babeserako eskubidearekin batera, Ongizate Estatuaren
  oinarrizko euskarria da.\u201d Bat datoz. Baina behar bada ez gara ohartzen osasun
  arreta ardatz bat izanik, erdara hutsean burutzen den artean ez dugula euskararen
  normalkuntzarik lortuko. Euskal Herria euskalduna ez dago lortzerik osasungoa euskalduntzen
  den arte. Ez dira hizkuntz eskubideak bermatuko sekula. Hala ere, osasungoa erdaraz
  onartzen dugu, normaltzat hartzen dugularik euskararen bazterketa esparru horretan.
  Ohituta gaude.\\nEgia da osasungoan arretari ematen zaiola lehentasuna; kalitatezko
  arreta da hemen garrantzitsuena, eta euskarak ez omen du hainbesteko garrantzirik.
  Edo, beste era batera esanda, pazientea da garrantzitsuena, ez euskara. Aukeran,
  euskaltzale amorratuenak ere segurtasuna nahiago du. Gaixoak ez dira ospitalera
  joango eskubideen eske, osasun arreta eskatzera baizik; hiltzeko beldurrez dagoenak
  ez du \u201ceuskaraz mesedez\u201d esango. Eta bere goganbeharrak, kezkak, bere
  ahuldade eta menpekotasun egoeraz aprobetxatuz, gazteleraz egitera behartua izango
  da, behartuko dugu. Ez gara konturatzen hori ez dela benetako kalitatezko osasun
  arreta, izan ere ez baitu kode deontologikoa ere errespetatzen. Ez genuke ahaztu
  behar euskara eta kalitatea banaezinak direla. Azken batean, kalitatezko osasun
  arreta pazientearen hizkuntzan burutzen dena da. Gaur egun gure herrian egiten ez
  dena, hain zuzen.\\nEuskal Herrian kalitatezko osasun arreta euskaraz izan behar
  da, paziente euskaldunentzat behintzat. Eta osasun arreta euskaraz, benetakoa, bere
  osotasunean, ahoz eta idatziz izan beharko litzateke. Bere osotasunean, hau da,
  maila eta esparru guztietan; kontsultategi, osasun-zentro edo ospitaleetan; familiako
  mediku zein espezialistekin, erizainekin edo administrariekin; edonon, edonorentzat.
  Idatzizkoa esaten dudanean, ez naiz ari Osasun Zerbitzuak banatzen dituen paper,
  ohar, aholku edo karteldegiari buruz bakarrik, baizik eta pazienteak jasotzen dituen
  idatzizko guztiei buruz, hau da, osasun txostenak edo txosten klinikoak, proba osagarrien
  informeak, proba horien eskakizunak edo bolanteak, kontsulta-arteko dokumentuak
  edo zerbitzuen arteko bideratzeak, etab. Eta hemen, erabateko garrantzia duena,
  historia klinikoa da. Funtsean, pazienteen osasun arretaren erregistroa, euren bilakaera
  jasotzen duena. Osasun arreta euskaraz aldarrikatzeko orduan, ez genuke ahozko harremanetara
  mugatu behar, hori ez baita egoera normala. Historia klinikoa euskaraz eskatu eta
  garatu behar dugu, osasungoa euskaraz izan dadin bere osotasunean. Hemen dago gakoa.\\nHori
  lortzeko tresnak, baliabideak, eta gaitasuna badauzkagu; borondatea da falta zaiguna.\"",
  "\"Ikasteko tresna ahaltsua da musika, gure bizitzako lehen hilabeteetatik. Tailer
  hau familiarentzako jarduera bat izango da, abesti eta musika-jokoen bidez jaioberriari
  lagunduko diozu aske erantzun diezaion musika- eta zentzumen-estimulazioari ingurune
  seguru, eroso eta lasaian. Tailer edo lantegi hau hiru urte arteko haurrak heldu
  batekin joan daitezen pentsaturik dago. Parte-hartzaileek manta txiki bat eta jantzi
  erosoa ekarri behar dituzte. Gainerako materiala prezioan sartuta dago.\\nKodea:
  942\\nKurtsoaren hizkuntza:\\nErderaz\\nHasierako data:\\n2019/02/05\\nBukatze data:\\n2019/05/21\\nAsteartea:
  10:30 11:30\\nAdina: +16\\nOrdu kopurua:12\"", "\"Izena: Egun on, kimu txiki\\nEgilea:
  Anne Cahray\\nIlustratzailea: Anne Cahray\\nItzultzailea: Garazi Otegi (Saretik)\\nArgitaletxea:
  Ibaizabal\\nAzalpena: Gaia: Liburu honen bidez, txikienek gorputza eta burua uztartu
  ahalko dituzte, lasaitasuna aurkitzeko, ariketa erraz batzuen bidez. Laburpena:
  Brain gym-ean oinarrituta, liburu honek txikienentzako erlaxatzeko lau ariketa proposatzen
  ditu, mugimendu eta hitzekin. Ariketa bakoitza bi zatitan aurkezten da, testu labur
  eta errazekin, irudiz lagunduta: lehenengo, guraso edo irakasleei ematen zaien azalpen
  bat eta, bertan, ariketa nola egin eta zertarako balio duen zehazten da; bigarrenik,
  erlaxazio bakoitzari buruzko irudiak dituen testu bat ematen da, umeekin irakurtzeko.\\nAdina:
  00-04\\nUrtea: 2017\\nISBN: 978-84-9106-462-6\\nPrezioa: <10 \u20ac\"", "\"Geletan
  segurtasuna sortzen\\nIrakasleek eremu segurua sortu behar dute, ikasleek gai zailak
  aztertu eta sakondu ditzaten. Jakina, horrek garrantzi izugarria dauka gai honetan.
  Honako jarraibideak eskaintzen ditugu, ongi funtzionatzen duela erakutsi duen tresna
  baliagarri gisa.\\nLan akordioaren zirriborroa\\nEskubideak eta erantzukizunak\\n-
  Errespetatzen dugu parte-hartzaile bakoitzak saio/ariketa bakoitzean nola parte
  hartuko duen erabakitzeko eskubidea, baita bere ikasketa/ekarpenari dagokionez duen
  erantzukizuna ere.\\n- Beraz, adosten dugu elkar ez presionatzea.\\n- Onartzen dugu
  eskubidea/erantzukizuna dugula:\\n- Gainontzekoengandik datozkigun hainbat etiketa
  pertsonal eztabaidatzeko /zalantzan jartzeko;\\n- gainontzekoek dituzten uste estereotipatuak
  ez onartzeko; eta\\n- geure burua orokortze murriztaileetatik babesteko.\\nElkarrekintzak\\n-
  Galderak egitea sustatzen dugu, iritziak nola berdintzen edo ezberdintzen diren
  argitzeko, egiaztatzeko edo ezagutzeko.\\n- Norbait hitz egiten ari bada, mozteko
  baimena eskatzea adosten dugu, hura esaten ari denari buruzko iruzkin edo galdera
  bat nahi egin dugunean.\\n- Ikasketa-prozesu honetan eta ezarritako gure helburuak
  lortzean eginkizun konstruktiboa hartzea adosten dugu.\\n- Norbanako gisa dugun
  esperientziaren ikuspuntutik hitz egitea adosten dugu, izan ere, gutako bakoitzak
  balio berbera dauka eta gure ideiak, iritziak eta sentimenduak baliotsuak dira,
  partekatuak izan ala bakarrak izan.\\nKonpromisoak\\n- Ezarri ditugun denbora mugak
  errespetatzea eta muga horietan egin nahi dugun edozein aldaketa negoziatzea adosten
  dugu.\\n- Taldea aintzat hartzen dugula erakusteko, lantegi batetik lehenago ateratzeko
  edo ez joateko asmoa badugu, taldeari jakinaraziko diogu.\\nIkasketa\\n- Onartzen
  dugu lantegian egindako adierazpenak edo azaldutako jarrerak aldatu eta garatu egin
  daitezkeela. Ez dira finkoak behin betiko.\\nIsilpekotasuna\\n- Lantegian emandako
  informazio pertsonala errespetatzen dugu, taldean esan dena ez errepikatzea adostuz,
  informazio hori taldeko kide jakin bati egoztea saihesteko. Baliteke taldeak prozedura
  bat eztabaidatu eta negoziatu nahi izatea, baldin eta, lantegiaren ondoren, gaiak
  harago eraman nahi badira eta taldearekin lan egiten duen edonori horren berri eman
  nahi bazaio.\\nAtzeraelikadura konstruktiboa\\n- Animatzaileek, prestatzaileek edo
  hezitzaileek esandako edo egindako zerbait mingarria, desatsegina, nekagarria edo
  deserosoa iruditzen bazaizu, arren, jakinaraz iezaiozu, taldean bertan edo atsedenaldi
  batean. Modu horretan, besteak beste, gure jokaerak eta ikasitako jarrerak eztabaidatzen
  jarraitu ahal izango dugu. Gainera, hori oso garrantzitsua da pertsona guztiei zor
  zaien errespetua ziurtatzeko, gizaki zaurgarriak garen aldetik.\\nHasi giroa prestatzen\\nAtal
  honetan, hainbat ariketa proposatzen ditugu, filmak testuinguruan kokatzeko eta
  haien sarrera gisa. Irakasleak ariketaren bat aukera dezake edo guztiak erabil ditzake,
  egokia iruditzen bazaio. Gehienak, hala ere, oso erabilgarriak dira gelan partekatutako
  segurtasun giroa bermatzeko.\\nTaldean egon daitezkeen iritzi ezberdinak aztertzeko,
  irakasleek honako lotura jokoa proba lezakete:\\nIkasle bakoitzak \u201chomo-\u201c
  edota \u201ctransexualitate\u201d hitzarekin lotzen duen hitz bat emango du (arbelean
  idatz dezake). Horrela, irakasleak jakin ahal izango du gelan sentimenduak gutxi
  gorabehera nola antolatuta dauden eta, horren arabera, zer gai landu behar diren
  lehendabizi. Beharrezkoa bada, hori lagungarria ere izan daiteke gela zehatz horretarako
  egokiak diren filmak aukeratzeko.\\nJarraian, irakasleek generoaz, identitate sexualaz
  eta jokabide sexualaz dauden isileko zenbait arau jakinarazi beharko lizkieke ikasleei.
  Sexu bereko norbaitekin maitemintzea bezalako gaiak edo transgenero hitzaren esanahia
  azal litezke, baina onena da azalpen laburra eta eskematikoa ematea. Haurren adinaren
  eta filmaren gaiaren arabera (irakasleek filmak ikusi behar dituzte, gelan proiektatu
  baino lehen) hainbat galdera proposa daitezke, ikasleek filma ikusten duten bitartean
  erantzun ditzaten. Adibidez: saia zaitez gogoratzen heteroarautzat jotako arau bat
  (aurretik hitzaren esanahia azaldu).\\nEskolak dirauen bitartean ikasleak galderak
  egitera animatu behar ditu ikasleak. Hala, gustura sentituko dira eta batzuen eta
  besteen erantzunek ikuspuntu desberdinak onartzen lagunduko diete. Iritzi eztabaidagarriren
  bat agertzen bada, irakasleak informazio egokia eskain dezake. Filmak honelako galderak
  eragingo ditu: haurren arteko jazarpena, imitatu beharreko ereduak, erlijioa, armairutik
  ateratzea (gay edo lesbiana zarela esatea) eta sexualitatearekin lotutako kontuak.
  Egokia izan daiteke galderarik premiazkoenetariko batzuei lehen lotura-jokoa egin
  eta berehala erantzutea.\\nFilmak ikusi ondoren, eztabaida\\nPelikula ikusi eta
  gero, utzi ikasleei haren gainean lehenengo iritziak ematen. Horrek ere lagunduko
  dizu eztabaida nolako zailtasun-mailara irits daitekeen zehazten.\\nSaia zaitez
  modu objektiboan eztabaidatzen ikasleek ikusitakoa: Zer ikusi duzue? Denek gauza
  bera ikusi dute? Portaerazko jarraibideren edo patroiren batzuk antzeman daitezke?
  Filmeko pertsonaiak gizarteak markatutako \u2018arauei\u2019 jarraitzen zaizkie?
  (Hizpide ditugun gizarte-arauak askotan isilekoak izaten dira, hau da, berariaz
  adierazi ez direnak, hala nola heterosexualitatearen araua edo genero-rolei buruzko
  arauak; horiek modu batera edo bestera ager daitezke filmetan). Gizartean isilean
  gordetako \u2018arau\u2019 horiek berariaz adierazita dauden beste arau sozial batzuekin
  konparatzeak, nahiz eta azken horiek beti ez diren betetzen (adibidez, semaforo
  gorriaren aurrean gelditzea bizikletan ibiltzean, edo ez erretzea adin txikikoa
  izanez gero) eztabaida irekia susta dezake arau sozialak inposatzeko indar ezberdinaren
  gainean.\\nAzaldu ikasleei heterosexualitateari eta generoari buruzko \u2018arau\u2019
  inplizituak isileko arauak direla, idatzi gabekoak, eta pertsonak are gehiago mugatzen
  dituztela. Gizarteratzen hasi bezain laster, gazteek ulertzen dituzte arau horiek.
  Oso haur txikiek ere ulertzen dute gai batzuez ez hitz egiteko baldintza; beraz,
  inork ez du horietaz berba egiten eta gai \u2018tabuak\u2019 bihurtzen dira. Isiltasuna
  da ezberdinak sentitzen diren pertsonak erreprimitzeko lehen modua -eta oso eraginkorra
  izan daiteke-.\\nHorrek \u2018arau\u2019 horien zentzua zalantzan jartzera garamatza.
  Zergatik da hori (heterosexualitatea edo genero estereotipatuaren eginkizuna) arau
  bat? Zer jatorri du? Nork erabaki du mutila izateak modu jakin batean jokatzea esan
  nahi duela? Nork erabaki du neska izateak mutilak gustuko dituzula esan nahi duela,
  neskak gustuko izan beharrean? Zergatik horrek zentzua modu berean izan behar du
  gutako edozeinentzat?\\nLGBT izateagatik harro egotearen ideia ariketa ixteko modu
  ona izan liteke. Denok gainditu behar izaten ditugu oztopoak bizitzan zehar, eta
  benetan harro sentitzera irits gaitezke oztopo horiek gainditu izanagatik. Gizarteak
  zailtzen du LGBT izatea. Ezberdina izatearen zailtasuna gainditzeari buruz zer sentimendu
  izango lituzketen imajina dezatela eska lekieke klaseko ikasle guztiei. Horrela,
  mundu heterosexual batean LGBT izateagatik harro egoteak, mundu zuri batean beltz
  izateagatik harro egoteak edo mundu kristau batean taoista, musulmana edo budista
  izateagatik harro egoteak zer esan nahi duen imajinatzera bultzatuko litzaieke.
  Baina puntu horretan garrantzitsua da aitortzea ez litzatekeela harrotasun bera
  sentituko lesbiana izateagatik lesbianen munduan, beltza izateagatik mundu beltzean
  edo musulman izateagatik mundu musulmanean. Horren haritik, \u201cberdinen\u2019
  taldean dauden gainontzeko pertsonekiko ezberdina izatearen zailtasuna gainditu
  izanak sentiarazten du norbait harro.\\nKlaseko guztiek euren artean zer den ezberdina
  identifikatzen saiatzen badira, orduan ulertuko dute talde osoak aniztasunarekiko
  elkartasuna garatu dezakeela eta jokabide ezberdinak estigmatizatzeari utzi ahal
  izango diote. Horrela uler dezakegu taldearen babesa lagungarri izan daitekeela
  jendeak bere ezberdintasunarekiko konfiantza senti dezan.\\nIrakasleak ikasleei
  galdetu ahalko die bakoitzak zer iritzi duen eztabaidari buruz, zeren falta sumatu
  duten edo zer ezagutu nahiko luketen sakonkiago. Erabilgarria izan daiteke baliabideen
  adibideak ematea, euren kabuz informazio gehiago lor dezaten.\"", "\"BERRIZ ERE,\\nABSTENTZIO
  AKTIBO ETA IRAULTZAILEA !\\nAgiri honen bidez HERRITAR BATASUNAk berresten du bere
  erabakia, hau da, 2019an Euskal Herrian okupazio militar frantses eta espainolaren
  menpe eginen diren hauteskundeetan abstentzio aktibo eta iraultzailea egitea.\\nAurreko
  hauteskundeetan, marko estatal espainolean eginda, itxuraz eta azalean argiago ageri
  zen beren izaera zapaltzailea. Oraingo honetan, Europar Batasunekoak Euskal Herri
  osoan eginen dira. Hori bai, Euskal Herriak batasun nazionalik gabe segituko du,
  Frantzia eta Espainiaren artean ukatuta eta zatituta, eta gainera, bi marko estatal
  desberdinetan bozkatzera behartua. Abertzale eta sozialista iraultzaile den orok
  aise ulertuko du zergatik ez dugun inolaz ere Europar Batasunak bere zapalkuntza
  kapitalista eta inperialista legitimatzeko antolatu duen plebiszitua indartu behar
  gure botoekin. Europa kapitalista, militarista eta inperialista horretatik ez zaigu
  deus onik etorriko. Gu Europako Errepublika Sozialisten Batasunaren aldekoak gara,
  non, internazionalismo proletarioa gidari, etorkizuneko Nafarroako Euskal Langile
  Errepublika Sozialistak parte hartuko duen, berdintasunean eta elkartasunean, Sozialismoaren
  eraikuntzan, gainontzeko Herri Langile guztiekin, klase, estatu eta patriarkaturik
  gabeko sozietate libre eta burujabeak helburu. Planeta osoan.\\nAlta, Hego Euskal
  Herrian hauteskunde foral eta munizipalak ditugu. Baldintza berberetan antolatzen
  dira, okupazio militarraren mende, berriki Espainiako Guardia Zibilak Iru\u00f1eko
  kaleetan oroitarazi digun bezala. Bainan erreformistek eta autonomistek beti azpimarratu
  izan dute instituzio hauek Herriarengandik hurbilago daudela, eta nonbait, aukera
  gehiago daudela gauzak aldatzeko bertan parte hartzen badugu. Barrutik sistema aldatzen
  ahal dela. Betiko lelo zahar ustela.\\nGu ez gaude ados horrekin. Instituzio horiek
  guztiak, Nafarroako Gobernua, Bizkai, Araba eta Gipuzkoako diputazioak eta herri
  zein hiri guztietako udalak, Estatu Espainoleko erakundeen parte dira, eta beraz,
  Euskal Herri Langilea zapaltzeko tresnak. Are arriskutsu eta alienatzaileagoak,
  langileon eguneroko bizitzatik hurbilago daudelako. Hurbiltasun honen bidez sortzen
  da ilusio demokratiko burgesa langileengan. Instituzio horietan egin daitekeen gauza
  bakarra, Euskal Herri Langilearen aurkako esplotazioa eta zapalkuntza kudeatzea
  da, oligarkia espainolistak ezarri dituen baldintzen arabera. Goxoago ala bortitzago,
  baina subordinazio nazional eta sistema kapitalistaren baitan. Catalunyan behin
  eta berriz ageri den bezala, instituzio autonomiko espainoletatik ezin da eraiki
  Independentzia, eta are gutxiago Sozialismoa. Hego Euskal Herriko udaletxe guztietan
  agertzen diren bandera espainolek hori oroitarazten digute egunero. Gure zapalkuntza
  nazional eta soziala.\\nAurreko agiri batean esandakoa berresten dugu: \u201cEz
  da alderdi kontua, ez hauteskunde afera, sistema inperialista osoa irauli behar
  dugu. Hori da azken 60 urteetako irakaspena. Ez dago deus negoziatzeko oligarkia
  frantses eta espainolarekin. Ez dago erdibideko etaparik. Ez dago inolako batasun
  nazionalik, ezta aliantza estrategikorik balizko euskal burgesia nazionalarekin.
  Euskal Langileriak gidatu behar du Euskal Herri Langilearen askapen nazional eta
  soziala.\\nEuskal Herri Langilearentzat ez da askatasunik izanen bi estatu konkistatzaile,
  okupatzaile, kolonizatzaile, kapitalista eta inperialisten legalitatearen baitan.
  Haien instituzio autonomikoetan parte hartuz ez ditugu lortuko Independentzia, Sozialismoa,
  Berreuskalduntzea, Feminismoa eta Nafar Lurraldeen Birbatasun Nazionala. Euskal
  langileok ez gara inoiz libre izanen bi Konstituzio burges, patriarkal eta etnozida
  horien marko zapaltzailean. Ezinezkoa da.\u201d\\nBadakigu analisi hau, gaur egun,
  oso minoritarioa dela euskal langileen artean, eta gehienak logika erreformistaren
  baitan kokatzen direla, bere aldaera guztietan, Unidas Podemos zein PSOE, espainolisten
  bidean edo EHBildu zein PNV, autonomisten ildoan. Iraultza Sozialistaren perspektibarik
  ez dagoenean, gelditzen den esperantza bakarra sistemaren baitan erreformak egitea
  da. Edo hobekuntza \u00f1imi\u00f1oak, kosmetikoak, axalekoak. Sistemaren alderdien
  arteko lehia elektoral hutsa dira hauteskundeak, kapitalismoaren zapalkuntza nork
  hobeki kudeatuko eta subentzioen pastelaren zati handiena nork eskuratuko. Hauteskunde
  burgesetan kateen itxura nolakoa izanen den erabakitzen da, ez kateak behin betikotz
  suntsitzea.\\nHERRITAR BATASUNAk uko egiten dio logika erreformista horretan murgiltzeari.
  Guk Euskal Iraultza Sozialistaren bandera gorriari zutik eta tinko eusten diogu.
  Perspektiba askatzailea, iraultzailea eta emanzipatzailea bizirik mantendu nahi
  dugu, eta horretarako egia garratzak esan behar dizkiogu Euskal Herri Langileari,
  eta bereziki Euskal Proletalgoari, Euskal Langileriari.\\nFormakuntza, antolakuntza
  eta borroka egiteko borondate irmorik gabe, Iraultza Sozialistaren bidez botere
  politiko eta ekonomikoa hartzeko erabakimen barik, abstentzio pasibo eta apolitikoa
  suizidio lazgarria izanen da Euskal Langileriarentzat faxismoa goraka doan garaiotan.
  Hori edozein langilek ulertzen du, eta horregatik joan dira masiboki aukera politiko
  erreformistak eta autonomistak bozkatzera.\\nBaina zoritxarrez, Euskal Herri Langilearen
  sektore gehienek oraindik beren esperientzia praktikoaz ulertu eta ikasi ez dutena
  da faxismoaren beldurrez erreformistei eta autonomistei bozka emateak ez duela deus
  ere konpontzen, sistema kapitalistaren logika eta lege gupidagabeak aldatzen ez
  direlako. Euskal Proletalgoarentzat erreformismo autonomistak ez du inolako konkista
  esanguratsurik lortuko, zeren eta denetariko eta askotariko sozialdemokratak Kapitalaren
  interesak zintzoki kudeatzera mugatzen baitira, ukitu progre, liberal eta posmoderno
  batekin. Anestesia eta alienazio dosi handiagoa langileak lokartzeko. Argi izan
  behar dugu eskuinak, kontserbadoreak ala faxistak, eta ezkerrak, sozialdemokratak
  ala \u201cerradikalak\u201d, sistemaren bi hegalak direla, eta biak Kapitalismoaren
  logikaren baitan kokatzen direla. Adibiderik garbiena, Greziako Syriza. Hurrengo
  urteotan Euskal Herri Langileak horren esperientzia garratza eginen du Unidas Podemos
  eta EHBildurekin. Sistema kudeatzera mugatuko dira, inolako haustura eragin gabe,
  PNV eta PSOErekin estatutu baskongado berri bat negoziatuz Espainiako Konstituzioaren
  markoan. Euskal Herri Langilearen aurkako zapalkuntza eta esplotazioak bere horretan
  iraunen dute: miseria, prekaritatea, lan istripuak, patriarkatua, etnozidioa, okupazio
  militarra, langabezia, murrizketak, aldaketa klimatikoaren ondorioak...\\nGu beste
  logika batean kokatzen gara. Independentzia, Sozialismo, Berreuskalduntze eta Birbatasun
  Nazionalaren logikan. Feminismo eta Ekosozialismoaren logikan. Euskal Langile Boterea
  eraikitzearen logikan. Kapitalismoa Euskal Herrian eta mundu osoan suntsitu eta
  Demokrazia Proletarioaren logikan. Langileriaren independentzia politiko eta estrategikoaren
  logikan, klase, estatu eta patriarkaturik gabeko planeta libre batean. Iraultza
  Sozialistaren logikan.\\nCatalunyako egoerak erakusten digu gaur egungo sistema
  inperialistan nazio zapalduetako burgesiek ez dutela ez indarrik ez asmorik askapen
  nazionala bururaino eramateko, eta Herri Langileek bakarrik, Langile Klasea buru
  eta gidari, lortzen ahal dutela independentzia, Iraultza Sozialista eginez eta nazioari
  ezaugarri zein izaera proletarioa emanez. Hori da gure bidea, Euskal Herriaren independentzia
  eskuratzea Euskal Proletalgoaren independentzia politikoa eraikiz. Bi independentziak
  bat eta bakarra baitira gure ustez. Batak ekarriko du bestea. Euskal Langileriaren
  independentzia estrategikoak denetariko burgesia autonomistengadik ahalbidetuko
  du Euskal Iraultza Sozialistaren garaipena. Eta argi dugu Iraultza Sozialistaz bakarrik
  lortuko dituela Euskal Herri Langileak bere helburu nazionalak: Independentzia,
  BERREUSKALDUNTZEA eta Birbatasun Nazionala.\\nKolonbia eta Venezuela, Palestina,
  Yemen eta Siriako egoerek erakusten digute klase borroka mundu mailan areagotzen
  ari dela, eta III. Mundu Gerraren atarian garela, inperialismoaren ofentsiba globalaren
  erruaz. Ez dago deus negoziatzeko Inperialismoarekin eta kapitalismoarekin. Haiek
  ala gu. Ez dago erdibiderik. Pentsatzea testuinguru geopolitiko honetan Euskal Herri
  Langilearen askapen nazional eta soziala hauteskundeez eta bakebidez erdietsiko
  dugula, ameskeria izateaz gain, erabateko hondamendia da. Euskal Iraultza borroka
  eta erresistentzia antinperialistaren frontean kokatzen da buru belarri. Irabazi
  arte! Badakigu hau zaila eta gogorra izanen dela, eta errazagoa dela botua eskatzea,
  horrela dena aise konponduko delakoan. Bainan horiek gezur elektoralistak dira.
  Oportunisten leloak.\\nHonengatik guztiarengatik, eta egoera zehatzaren azterketa
  zehatza egin ondoren etorkizunean bestelako aukera iraultzaileei uko egin gabe,
  HERRITAR BATASUNAk beresten du bere erabakia: abstentzio aktibo eta iraultzailea
  bultzatzea 2019ko ziklo elektoral honetan, euskal langile guztiei dei eginez formatu,
  antolatu eta borrokatzeko, egoki ikusten dituzten antolakundeetan, eta bereziki
  Ezker Abertzale Iraultzailearen erakundeetan. Organiza gaitezen!\\nAbstentzio aktibo
  eta iraultzaileak, benetakoa izateko, derrigorrez exijitzen du antolakuntzaren aldeko
  erabaki irmoa. Euskal Nazio Askapenerako Mugimendu Sozialista Iraultzailea eraikitzen
  hasi gara, eta langile iraultzaile guztien militantziaren beharra badugu antolakunde
  desberdinetan. Eguneroko lana eta borroka. Hauteskunde hauetan abstentziora jotzeko
  erabakia hartu baduzu, eta agiri hau honaino irakurri baduzu, gauza bakarra dugu
  zuri esateko:\\nFORMAKUNTZA, ANTOLAKUNTZA ETA BORROKA,\\nEUSKAL IRAULTZA SOZIALISTAREN
  ALDE!\\nJO TA KE,\\nIRABAZI ARTE!\\nBORROKA DA BIDEA!\\nComments (0)\"", "\"Mondragon
  Korporaziotik sortutako iniziatiba berria da Bihar Kooperatiba eta haren helburua
  da pertsona nagusiei eta menpekotasuna dutenei soluzio integrala ematea etxean bertan.
  Proiektu berri horren zuzendari nagusia da Hector Olabegogeaskoetxea eibartarra.
  Azken urteetan Irizar E-mobility zuzentzen aritu ostean Korporaziora batzea erabaki
  zuela dio, erronka berriei heltzeko.\\nZer da Bihar Kooperatiba?\\nMondragon Korporaziotik
