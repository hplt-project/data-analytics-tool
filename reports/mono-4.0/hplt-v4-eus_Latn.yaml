  erantzuna ematen saiatuko gara. Batzuetan, erresidentziak urruneko zerbait direla
  pentsatzen da. Guk kontrakoa egin nahi dugu: gerturatu eta zerbitzu hori etxeetan
  eskaini.\\nZaintza etxeetara zabaldu nahi duzuela diozu, baina nola?\\nMomentuz,
