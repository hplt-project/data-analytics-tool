sample: '["\"Bizkaiko Ermitak\\nErmitak, baselizak edo eliza\u00f1oak eremuetan kokatu
  ohi dira, gure ohiturekin guztiz lotutako ezaugarri kulturalak iragarriz.\\nBizkaian
  zazpiehun ermita baino gehiago izan dira, egun laurehun inguru baino ez badaude
  ere. Horiek guztiak, bere errito eta usadioak barne, lurraldeko sakralizazioaren
  lekuko dira.\\nBizkaiko ermiten indizea\\nArretxinaga (Markina-Xemein)\\nArretxinaga
  (Markina-Xemein)\\nAtxondoa (Markina-Xemein)\\nEdortza (Markina-Xemein)\\nKokapen-mapa\\nPlaza
  de La Encarnaci\u00f3n 9B\\n48006 Bilbao\\nTel: (34) 944 320 125\\nHonek diruz lagundua:\\nWebgunea,
  hauen laguntzarekin:\"", "\"Izenburu horrekin desnivel.com-ek artikulu bat argitaratu
  du Baltistan Fundazioak Machuloko Munawar eskolako 2014ko gastuei aurre egiteko
  abian jarri duen kanpainarekin bat egiteko. Desnivel aldizkariak bere agerkari digitalean
  argitaratutako artikuluak garbi erakusten du mendizaleek Baltistanekin eta bereziki
  Hushe ibarrarekin duten atxikimendua, eta Karakorumeko ibar honetako haur eta gazteen
  hezkuntzari ematen dioten garrantzia. Artikulua irakurtzea gomendatzen dizuegu,
  eta Baltistan Fundazioak egitasmo honekin ezarritako helburuekin bat bazatoz eta
  lagundu nahi baduzu honako kontuetako batean egin dezakezu zure dohaintza:\\n- Kutxabank:
  2095 0000 71 9103522251\\n- La Caixa:2100 3885 12 0200088018\\n- Caja Laboral: 3035-0150-01-1500030050\"",
  "\"Kontratua arreta handiz irakurtzea eta goitik behera ondo ulertzea sinatu baino
  lehen, dagokigun kopia hartzea eta eskuragarri mantentzea, ordainketak (hilerokoak,
  bi hilabetekoak\u2026) kontrolatzea zuzenak direla begiratuz eta fakturak ordenatuta
  gordetzea. Horiexek dira kontsumitzaileok hartu behar ditugun gutxieneko neurriak
  zerbitzu inraunkorreko eta hornikuntzako kontratuekin, batez ere energiakoekin eta
  telefonia-Internetekoekin, gehienetan konplexuak eta korapilatsuak izaten baitira,
  kontzeptu eta zerbitzu ezberdinak izaten dituztelako (gailuak, lineak, mantenimendua\u2026),
  deskontuak, egonaldiak, penalizazioak\u2026\\nA.V.U. kontsumitzaileak neurri horiek
  hasieratik hartu eta mantendu zituen ADSL, telefono finkoa eta mugikorreko bi linea
  biltzen zituen kontratu bat Vodafonekin sinatu zuenetik, eta horri esker urriaren
  2an Donostian egin zen eta EKA/ACUV-eko abokatu bat epaile eduki izan zuen Kontsumoko
  Arbitrajea irabazi zion konpainia horri. Bi gauza eskatzen zituen erreklamatzaileak:
  mugikor linea batean adostutako deskontuak hilabete batzuetan ez egiteagatik Vodafonek
  bidegabe eta sobera kobratu zion diruaren itzulpena eta konpainiari Arbitraje Sistemak
  isun bat jar ziezaiola agiri-faltsutzeagatik.\\nVodafonek ez zuen Arbitrajera ordezkaririk
  bidali. Bai ordea bere defentsarako idazki batzuk eta dokumentazioa. Enpresaren
  agiri horiek eta kontsumitzaileak aurkeztutakoak sakonki aztertu ondoren, Arbitraje
  Kolegioak aurtengo otsailatik iraila arteko mugikor linea bateko fakturetan bidegabe
  kobratutako 107,13 euro itzultzea agindu zion Vodafoni, honek \u201cerreklamatzaileak
  kontratatutako promozioen iraupena ez duelako egiaztatzen\u201d eta \u201ckontsumitzaileak
  aurkeztutako kontratuaren eta Vodafonek aurkeztutako kontratuaren arteko kontraesanagatik\u201d.\\nA.V.U.-k
  2016ko martxoaren 3an Vodafoneko denda batean sinatu zuen kontratuaren kopia aurkeztu
  zuen. Vodafonek aurkeztu zuenak data ezberdina zuen, martxoaren 8, eta azaltzen
  zuen bezeroaren sinadura ez zen A.V.U.-rena. Arbitraje Kolegioak horixe baieztatu
  zuen alde biek erakutsitako beste agiri batzuetan ipinitako A.V.U.-ren benetako
  sinadurarekin aldenduta. Hala ere, laudoak errefuxatu zuen Vodafoni agiri-faltsutzeagatik
  isun bat ipintzeko eskaera, laudoak argitzen duen bezala, hori bere eskuduntzatik
  kanpo dagoelako.\"", "\"Jubilatu eta pentsionisten elkartearen egoitza ofiziala
  Gizarte Etxean dago, konkretuki erdiko solairuan, jubilatuen txokoa izena hartzen
  duena. Bertan egiten dituzte herriko jubilatuek haien bilerak. Elkartea Bizkaiko
  jubilatuen elkartearen barruan inskribatua dago eta konkretuki ordezkaritza Pozokoetxen
  dago.\\nGaur egun Arrankudiagan gutxi gora behera 179 jubilatu daude eta elkartean
  izena eman dutenak 108 dira, hau da, erroldatuta daudenen %60a.\\nElkartearen zuzendaritza-batzordea
  lehendakariak, diruzainak eta idazkariak osatzen dute eta beraiek dira jubilatuen
  jarduera guztiak antolatzen dituztenak: asanbladak, bazkari-herrikoiak, irteerak,
  herriko jaietan egiten dituzten jokoak, zozketak eta abar.\\nElkartea irekia da,
  hau da, edonork parte hartu dezake bertan, nahikoa da izena eman eta kuota txiki
  bat ordaintzea.\\n\u00a9 Gizarte Etxea 2010 - Eskubide guztiak erreserbatuta\"",
  "\"Legazpiko Sustraiak dantza taldeak 50 urte beteko ditu aurten. Hori dela eta,
  hainbat ekitaldi antolatu dituzte. Hilero ekitaldi bat izango da, abuztuan izan
  ezik. Sustraiak 1975. urtean sortu zen, euskal kultura suspertzeko gogoa zuen herriko
  gazte talde baten ekimenez. Aurretik baziren dantza taldeak Legazpin, baina generoz
  bereizirik zeuden: Itxaropena mutilen dantza taldea zen, eta Umetxoak, aldiz, neskena.\\nBeraiek
  eta ondorengo 50 urteetan beste legazpiar askok egindako lanari esker, Sustraiakek
  50. urteurrena ospatuko du aurten. Hainbat ekitaldi antolatzeaz gain, urteurreneko
  logoa egin dute. Logoa Izaro Urbieta legazpiarrak diseinatu du: maiatzaren 3ko ekitaldi
  batean ateratako argazki batetik abiatu zen horretarako.\\nSoka dantzako argazki
  bat da erabili duena. Hura delineatuz sortu du logoa. Ez du kolorerik erabili, delineatuak
  nahikoa informazio ematen duela uste baitu. \u201cLogoak taldearen batasuna adierazten
  du, 1975. urtetik gaur egun arte mantendu dena. Baita emakumeen eta gizonezkoen
  presentzia dantza taldean ere\u201d, esan du diseinatzaileak. Tipografiari dagokionez,
  logoak forma organikoak dituenez, letretan ere hori bera mantendu nahi izan du.\\nUrteurrenak
  leloa ere badu: Oso ondo... Berriro! Entseguetan erabiltzen den esamolde bat da,
  dantza bat goitik behera egin ostean esaten dena.\\nUrteurrena ospatzeko antolatutako
  ekitaldiei dagokienez, hilero ekitaldi bat egingo dute (abuztuan ez ezik). Urtarrileko
  ekitaldia urteurrenaren aurkezpena izan da. Ostegunean egin zuten, kultur etxean.
  Legazpiar asko elkartu ziren, Eric Galvez alkatea buru.\\nOtsailaren 20an, 19.30ean,
  mahai ingurua egingo dute kultur etxeko areto nagusian: Norberaren Sustraiak. Taldearen
  historia taldekideen bidez. Taldean egon diren eta dauden belaunaldi desberdinetako
  kideek parte hartuko dute: Maria Luisa Mendizabalek, I\u00f1aki Leizeagak, Oihane
  Auzmendik, Agurtzane Gabiriak eta Ane Belokik. Bakoitzak taldeari lotutako bizipenak
  azalduko ditu.\\nMartxoaren 2an inauteri konpartsa aterako da. Herri konpartsak
  35 urte beteko ditu aurten. Lehen edizioan, 1991n, Goierriko inauterien konpartsa
  atera zuten. Aurten, 35. inauteria dela eta, zerbait berezia egin nahi dute: dantzei
  dagokionez, urte hauetan guztietan antzeztutako inauterien nahasketa ikusi ahalko
  da herriko kaleetan. Inauteri desberdinetako zortzi dantza egingo dituzte eta dantzariak
  lehen edizioan jantzita joan ziren bezala joango dira.\\nApirilaren 4an urteurreneko
  ekitaldi berezienetako bat izango da: Oso ondo\u2026Berriro! dokumentala aurkeztuko
  dute Latxartegi aretoan. Bi emanaldi egingo dituzte: 19.00etan eta 22.00etan. Aurkezpenera
  joateko gonbidapenak kultur etxean egongo dira eskuragarri, martxoaren 17tik aurrera.\\n2020an
  hasi ziren dokumentalean lanean, eta 2024ko otsailetik azarora bitartean egin ziren
  grabaketak. Grabaketa horien ardura Egoitz Legorburu legazpiarrak eta Tolosako Igora
  Filmseko kideek izan dute. Gidoia Asier Iriondok eta Amaia Jimenezek egin dute.
  Dokumentalaren helburua taldearen bilakaera azaltzea da, taldeko dantzarien bitartez.\\nMaiatzari
  dagokionez, Santikutz egunean egungo eta garai bateko dantzariak elkartuko dituzte.
  Are gehiago, Sustraiaken egon diren denboran ezpata dantza egiteko aukera izan ez
  dutenek egingo dute dantza. Horretaz gain, soka dantza eta zinta dantza ere egingo
  dituzte, urtero bezala.\\nEkainaren 13an haurrak izango dira protagonistak. Azkeneko
  urteetan bezala, Legazpiko auzo batean egingo dute dantzari txikien festa. Erromeri
  ibiltari baten itxura emango diote, Trapalata txarangaren laguntzarekin. Uztailaren
  4an, 20.30ean, Tio Teronen Semeak taldeak Haurreskolari ikuskizuna egingo du Euskal
  Herria plazan.\\nIrailaren 7tik 24ra, Ilinti merkatari elkartearekin elkarlanean,
  argazki erakusketa bat egingo dute. Herriko dendetan 50 urte hauetako argazkiak
  ikusi ahal izango dira.\\nUrriaren 11n urteurreneko ekitaldi nagusia izango da:
  Mende erdi herria dantzan jarriz jaialdia. 50 urte hauetan taldetik pasa diren dantzari
  guztiak elkartuko dituzte, 12.00etan Legazpiko Urbeltz pilotalekuan.\\nAzaroaren
  13an, Angel Muruak, Sustraiakeko sortzaileetako bat, hitzaldi bat emango du: Sustraiak:
  400 a\u00f1os de ezpata dantza en Legazpi. 19.00etan izango da, kultur etxean. Lau
  mende horietan dantzak eta, oro har, folkloreak Legazpin izan duen ibilbidea aztertuko
  du Angelek bertan. Bukatzeko, abenduan Sustraiak taldeko kideak Tenerifera joango
  dira dantza egitera.\"", "\"Lehen mailako ligako oilar baten kontra gailendu zen
  Magna Gurpea Xota ostiralean. Imanol Arregiren mutilek 2 eta 4 irabazi zioten Murtziako
  El Pozo talde ahaltsuari. El Pozo zen partida irabazteko faborito nagusia, baina
  Magna Gurpeak partida irabazteko ilusio eta gogoak izan zituen uneoro eta talde
  ahaltsuari lezio ederra eman zion. Izan ere, El Pozo hotz aritu zen, ideiarik eta
  ilusiorik gabe.\\nVictorrek aurreratu zuen talde berdea, zazpigarren minutuan. Hala
  ere berdintzea lortu zuen El Pozok, Magnako Yoshikawak ate propioan sartutako zorigaiztoko
  jokaldi batean. Imanol Arregiren mutilek ez zuten behera egin eta Eseverri kapitainak
  1 eta 2koa sartu zuen. Penalti zalantzagarri bati esker bina berdindu zuen El Pozok.
  Murtziako taldearen erreakzioa espero zen orduan, baina mentalki Magna Gurpea zen
  irabazlea eta fisikoki ere hobeto zebiltzan talde berdekoak. Horrela, Saldisek hirugarrena
  sartu zuen eta nahiz eta El Pozo berdintzen saiatu, ezin izan zuten, Magnako Raul
  atezain bikain aritu baitzen. Hain zuzen ere Raulek sartu zuen Magna Gurpearen laugarren
  eta azken gola eta 2 eta 4 irabazita, garaipen historiko horrekin itzuli ziren irurtzundarrak
  etxera.\\n\u201cPartida oso ongi planteatu dugu, hasieratik bikain aritu gara eta
  egindako lanaren fruitua jaso dugu. Pista oso konplikatuan irabazi dugu, El Pozo
  baino gehiago izan gara eta oso kontentu goaz etxera\u201d adierazi zuen Imanol
  Arregi entrenatzaileak.\\nJumillaren kontra\\nInter Movistar da lehen mailako liderra
  (25 puntu). Jarraian lau garaipen lortu eta gero, laugarrena da Magna Nafarroa (16
  puntu), sailkapenean 7.a den El Pozoren gainetik (14 puntu). Larunbatean, azaroaren
  7an, Magna Gurpeak sailkapenean azkena den Jumilla hartuko du Anaitasuna pabilioian,
  18:30ean. Ea garaipenek segida duten.\"", "\"Smithsonian Folklife Festival eta Euskal
  Herriko berriemaile digitalak ekainaren 29 eta ...\\nEtiketak -euskal kultura\\nEuskal
  kultura, Euskara eta Euskal IKT/ak aurkezteko eta erakusteko, arlo desberdinetako
  ...\\nEkainaren 29tik uztailaren 10a arte Washingtonen egiten den jaialdian, euskal
  kultura ...\\n\u2018Sorginen Kondaira\u2019 izeneko bideo-jokoa aurkeztu du Binary
  Soul kooperatibak. ...\\nOrain bai, heldu da udaberria eta Loraldia Bilbora! Larunbatean
  hasiko da jaialdi honen...\\nDakizuenez, Irudimena lehiaketa dagoeneko martxan dago
  eta maiatzaren 16ra arte zuen ...\\nIrudimena sormen lehiaketaren hirugarren edizioari
  ekingo diogu martxoaren 1a eta ...\"", "\"Korrosioarekiko erresistentzia\u2502Azidoen
  eta alkalinoen erresistentzia\u2502Ihesik gabe\\nDisko magnetikoko ponpa kimikoak
  azido sulfurikoa, azido klorhidrikoa, azido nitrikoa, azido kromikoa, azido fluorhidrikoa
  eta beste likido azido eta alkalino batzuk erraz maneiatu ditzake.\\nTenperatura
  handiko unitate magnetikoko ponpak ez du ardatz zigiluaren diseinurik, unitate magnetikoa,
  ponparen gorputza guztiz itxita dago eta ez du isuri kimikorik eragingo\\nAltzairu
  herdoilgaitzezko korrosioarekiko erresistentea den ponpa magnetikoak FRPP injekzio-moldeaketa
  hartzen du, hainbat likido azido eta alkalino, likido kimikoa eta ura garraiatzeko
  egokia dena.\\nBulatzailea eta imana osoki eratuta daude, eta hori ez da erraza
  abiadura handiko funtzionamendu eta tenperatura altuetan kaltetzea.\\nDiseinu magnetikoko
  ponpen diseinu kontzeptua fidagarritasun handia, eraginkortasun handia eta bizitza
  luzea da.Egiturak kontzeptu tradizionala apurtzen du, eta oztoporik gabeko ur-sarrera
  zigilatuaz jabetzen da emari handiagoaren azpian.\\nZirkulazio magnetikoa zirkulazio-ponpa
  egokia da hainbat zirkulazio azido eta alkaliko likidoetarako, hozteko, spray garbitzeko
  ekipoetarako, Scrubber, etengabeko electroplating grabatzeko eta zenbait kasutan.\\n1.
  Motor indartsu batekin, ez da makina erreko tenperatura altuetan.\\n2. Kalitate
  handiko motorrei lehentasuna ematen diegu, bobina osoa kobrea eta zehaztasuneko
  zauria da.\\n3. Beroa xahutzeko efektu onarekin, errendimendu egonkorra, segurua
  eta ez du makina erreko.\\n4. Azido eta alkali erresistenteen ponpa magnetikoak
  iman indartsua hartzen du, tamaina txikia, indar magnetiko indartsua, indar eragile
  handia, desmagnetizaziorik gabe.\\nKorrosioarekiko erresistentzia handia\\nKorrosioarekiko
  erresistentea den altzairu herdoilgaitza, esate baterako, 304, 316, etab. bustitako
  piezak pertsonaliza daitezke.Korrosioarekiko erresistentzia ona du azido organiko,
  konposatu organiko, alkali, disoluzio neutro eta hainbat gasekiko.\\nDiseinu magnetikoko
  ponpen diseinu kontzeptua fidagarritasun handia, eraginkortasun handia eta bizitza
  luzea da.Egiturak kontzeptu tradizionala apurtzen du, eta oztoporik gabeko ur-sarrera
  zigilatuaz jabetzen da emari handiagoaren azpian.\\nBultzada itxia, emari handiagoa\\nLoditze
  diseinu itxia, presio zigilatua, fluxu handiagoa,\\nZehaztasun-ekoizpena, higadura
  eta korrosioarekiko erresistentzia, bizitza luzeagoa eta egonkorragoa.\\nArdatz
  zigiluaren diseinurik gabe, guztiz itxita\\nMugimendu magnetikoaren ponparen gorputza
  guztiz itxita dago eta ez du likido kimikorik isuririk eragingo.\\nTalkaren aurkako
  oinarri loditua\\nBerritu loditutako bibrazioen aurkako oinarria talka xurgatzeko
  efektua lortzeko, motorra babesteko eta ur ponparen bizitza luzeagoa da.\\nGarraio
  prozesurako, galvanoplastia, industria kimikoa, tindaketa, hondakin-urak, hondakin-gasen
  tratamendua, etab.\"", "\"Atzo plazaratu zuen Araba, Bizkaia eta Gipuzkoako Lehendakariak
  neurrien inguruko dekretu berria. Orokorrean lokal eta instalazioen edukiera %60ra
  pasa dute, ostalaritzarena aldiz %50era eta mahai bakoitzeko zortzi lagun eseri
  ahalko dira asteazkenetik aurrera.\\nEusko Jaurlaritzak COVID-19aren hedapena eteteko
  hartutako neurriak malgutzea erabaki du. Batez ere, edukieretan izango dute eragina
  neurri berriek, eta bihartik egongo dira indarrean.\\nEDUKIERA\\nOrokorrean, lokal
  eta instalazio guztien edukiera handituko dute, %60ra. Halere, aparteko zenbait
  muga ezarri dituzte jarduera batzuetarako. Ostalaritzako establezimenduen barnealdean,
  edukiera muga %50ekoa izango da, eta mahai bakoitzean zortzi lagun eseri ahalko
  dira, sei izan beharrean. Gainera, gizarte, kultura eta kirol ekitaldietan gehienez
  ere 600 pertsona bilduko dira barruan direnean, eta 800 kanpoan badira. 1.600 eta
  5.000 pertsona artean sar daitezkeen lekuetan 800 pertsona biltzeko aukera emango
  dute, eta 1.200 pertsona aire zabalean; 5.000 lagun baino gehiago sar daitezkeen
  lekuek %30eko edukiera izango dute.\\nORDUTEGIA\\nMerkataritza, kultura eta gizarte
  jarduera guztiak 01:00ean itxiko dituzte. Gainera, gazteen lokalek eta gaueko aisialdiko
  establezimenduek itxita jarraituko dute.\\nMASKARA\\nPertsonen arteko distantziari
  etengabe eustea ezinezkoa den lekuetan maskara erabiltzea derrigorrezkoa izango
  da, bereziki hondartzetan eta igerilekuetan.\\nARABA, BIZKAIA ETA GIPUZKOAKO LEHENDAKARIAREN
  DEKRETUA HITZEZ HITZ:\\n36/2021 DEKRETUA, abuztuaren 30ekoa, lehendakariarena, zeinaren
  bidez hirugarren aldiz aldatzen baita honako dekretu hau: 33/2021 Dekretua, uztailaren
  7koa, SARS-CoV-2k eragindako infekzioen hedapena geldiarazteko prebentzio-neurriak
  eguneratu eta zehaztekoa.\\nLehendakariaren uztailaren 7ko 33/2021 Dekretuaren bidez,
  COVID-19aren pandemia kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legeak aurrez
  zehaztutako alerta-mailaren arabera aplikatu beharreko prebentzio-neurri espezifikoak
  eguneratu eta zehaztu ziren.\\nHelburua da giza portaera indibidual eta kolektiboko
  tresnei eta irtenbideei eustea, eta horrek agintarien kontrola eta esku-hartzea
  eskatzen du. Izan ere, tradizionalki, tresna eta konponbide horiek antolamendu juridikotik
  esplizituki gaitu izan dira mota guztietako alderdietan, Osasun Publikoaren arloko
  Neurri Bereziei buruzko apirilaren 14ko 3/1986 Lege Organikoan egindako hasierako
  aurreikuspenetik hasita; beraz, berriro ere zenbait neurritan jartzen da indarra
  hedapen birikoari aurre egiteko, eta erabilgarria izatea aurreikusten da, hala egiaztatzen
  baitu gure inguruko herrialdeek sistematikoki neurri horietara edo antzekoetara
  jo izanak. Hori guztia bat dator Osasunaren Mundu Erakundeak eta nazioarteko beste
  erakunde batzuek adierazitakoarekin.\\nEstatuko zein autonomia-erkidegoko legeria
  arruntak eskaintzen duen arau-euskarriaz gain, Osasun Sistema Nazionalaren Lurraldearteko
  Kontseiluan kudeatu diren osasun publikoaren arloko erabakiak eta jarduera koordinatuak
  integratzen dira.\\nHartzen diren neurriak bat datoz egiten den ebaluazio epidemiologiko
  iraunkorrarekin, eta, beraz, justifikatuta daude eta proportzionalak eta egokiak
  dira lortu nahi den helburu nagusirako \u2013prebentziorako, alegia\u2013, betiere
  Legean aurreikusitako eta aurrez zehaztutako esparruan. Neurriak aplikatzeko, egungo
  egoera 2. alerta-mailan sailkatzen da.\\nHorrenbestez, asmoa da indarrean dauden
  zenbait neurri indartzea eta neurri horiek garatzen diren esparru eta instalazioetan
  baimendutako gehieneko edukiera berrikustea.\\nLegearen 20.1 artikuluarekin bat
  etorriz, herritar orori eskatzen zaio bere burua muga dezala eta neurriak betetzeko
  garaian autoerantzukizunez joka dezala, gaixotasuna zabaltzeko arriskurik sor ez
  dadin.\\nEuskadiko lehendakariari dagokio dekretu hau onartzea, hala xedatzen baitu
  COVID-19aren pandemia kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legeak 8.1
  artikuluan. Beraz, lege horretan eta oro har aplikatu beharreko gainerakoetan ezarritakoaren
  arabera, honako hau\\nLehenengoa.\u2013 Uztailaren 7ko 33/2021 Dekretuaren 1. artikuluari
  beste idazkuntza bat ematea; honela idatzita geratzen da:\\n\u00abCOVID-19aren pandemia
  kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legearen 4. artikuluan aurreikusitako
  osasun-larrialdia deklaratuta eta indarrean dago; beraz, dekretu honetan zehazten
  diren neurriak aplikatu behar dira, egindako ebaluazio epidemiologikoaren arabera,
  eta 2. alerta-mailarako aurreikusitako neurrien lege-esparrua kontuan hartuta, eragin
  zuzeneko eta osagarriko adierazleen multzoari jarraikiz, lege horren 7. artikuluarekin
  bat etorriz\u00bb.\\nBigarrena.\u2013 Uztailaren 7ko 33/2021 Dekretuaren 2. artikuluan
  ezarritako neurri orokorren eta prebentzio-neurrien irismena aldatzea; beraz, artikulu
  horren 2. apartatua honela idatzita geratzen da:\\n\u00ab2.\u2013 COVID-19aren pandemia
  kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legeak 20.3 artikuluan xedatutakoaren
  arabera, maskara aire zabaleko espazioetan erabiltzea nahitaezkoa izango da, pertsonen
  arteko gutxieneko 1,5 metroko distantzia etengabe mantentzea ezinezkoa bada. Ondorioz,
  maskara erabiltzeko beharra hedatzen da jendea dabilen edozein motatako hiriguneetara,
  hala nola udalerrietako alde zaharretara, merkataritza-guneetara eta dendetara,
  merkatuetara, azoka txikietara edo ostalaritza-establezimenduak dauden guneetara,
  bai eta itsasgune eta itsas pasealeku guztietara, haur-parkeetara, espaloietara,
  oinezkoentzako pasabideetara, plazetara edo jendea biltzen den kaleetara ere.\\nEz
  dago zertan maskara erabili ingurune naturalean, baldin eta ez bada jende-pilaketarik
  edo bizikide ez diren pertsonekiko konkurrentziarik.\\nOstalaritzako eta jatetxeetako
  establezimendu eta zerbitzuetan, maskara erabiltzeko betebeharra jateko edo edateko
  unean bakarrik kentzen da. Bestela, nahitaez erabili behar da une oro, bai barrualdean,
  bai terrazetan.\\nKirol-jardueraren bat egiten denean, maskara ez da nahitaezkoa
  izango espazio naturaletan, oinezkorik gabeko hiri-ingurune periferikoetan, igerilekuetan,
  lehiaketa profesional edo erdi-profesionalean diharduten taldeen entrenamenduetan
  eta lehiaketetan, eta kanpoaldean egiten den jarduera fisiko gogorreko ezohiko uneetan.\\nHondartzetan
  eta igerilekuetan, bainua hartzen ari garen bitartean eta eremu zehatz batean geldirik
  bagaude, ez da beharrezkoa izango maskara erabiltzea, betiere erabiltzaileen arteko
  segurtasun-tartea errespetatu ahal bada. Hondartzetan eta igerilekuetan, joan-etorriak
  egiteko eta paseatzeko, maskara erabiltzea nahitaezkoa izango da pertsonen artean
  1,5 metroko gutxieneko distantzia etengabe mantendu ezin denean.\\nSei urtetik gorakoek
  nahitaez erabili behar dute maskara, adierazitako bidaiarien edozein garraiobide
  erabiltzen dutenean, bidaia hasten denetik amaitzen den arte, legezko salbuespen-kasuetan
  izan ezik. Ez da exijituko maskara erabiltzea garraiobide pribatuetan, bidaiariak
  etxebizitza berean bizi badira. Garraio-profesionalak maskara eraman beharko du
  zerbitzuan dagoen bitartean, bere lan-eremua ez badago publikotik bereizita gelaxka
  baten bidez edo mugatuta babes-itxitura baten bidez.\u00bb\\nHirugarrena.\u2013
  Uztailaren 7ko 33/2021 Dekretuaren 3. artikuluan ezarritako neurri espezifikoen
  irismena aldatzea. Beraz, aipatzen ez direnek indarrean segitzen dute eta paragrafo
  hauek honela geratzen dira idatzita:\\n\u00ab2.\u2013 Jardueretan baimendutako gehieneko
  edukiera ehuneko 60koa izango da lokal eta instalazio guztietarako, muga espezifikoren
  bat aplikatu behar duten lokal eta instalazioetarako izan ezik. Lokal eta instalazio
  guztiak etengabe aireztatu beharko dira. Garraiobideek berariazko araudian baimendutako
  edukiera osatu ahal izango dute.\u00bb\\n\u00ab3.\u2013 Oro har, edozein motatako
  gizarte-, kultura- edo kirol-ekitalditarako esparruetan gehienez ere 600 pertsona
  bildu ahal izango dira barrualdeetan, eta 800 pertsona kanpoan. Zehatzago esanda:\\n\u2013
  1.600 eta 5.000 lagun arteko edukiera duten esparruetan, gehienez 800 pertsona egon
  daitezke barruan, eta 1.200 kanpoan.\\n\u2013 5.000 lagunetik gorako edukiera duten
  esparruetan, ez da gehieneko edukieraren ehuneko 30 gaindituko. Ahal den guztietan,
  1.000 pertsona baino gutxiagoko eremu independenteak ezarriko dira, sarbide eta
  pasabide independenteko guneekin.\\n\u2013 Aire zabalean egiten diren ekitaldietan,
  hiri-inguruneetan nahiz ingurune naturalean izan, jendea jarduera horietara joan
  ahal izateko Osasun Publikoaren eta Adikzioen Zuzendaritzak ezarritako jarraibideak
  errespetatu beharko dituzte antolatzaileek.\\n\u2013 Osasun Publikoaren eta Adikzioen
  Zuzendaritzari ahalmena ematen zaio protokoloak ezar ditzan, beste edukiera batzuk
  dituzten instalazioak erabili ahal izateko, osasun publikoko helburuetarako eta
  helburu sanitarioetarako proba pilotuak egiteko.\\n\u2013 COVID-19aren pandemia
  kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legearen 30. artikuluan eta hurrengoetan
  xedatutakoaren arabera, antolatzaile jakin batek \u2013publiko zein pribatu\u2013
  kontrolatzen ez dituen pertsonen noizbehinkako edo ustekabeko pilaketak gertatzen
  diren ekitaldi sozialetan, zorrotz eta nahitaez eutsi beharko zaio pertsonen arteko
  1,5 metroko distantziari, bizikideen kasuan izan ezik, eta gehieneko edukiera zenbatetsi
  hau errespetatuko da: pertsona bat, aglomerazioa gertatzen ari den lekuko azalera-espazio
  konputagarriaren 4 metro koadro bakoitzeko. Nolanahi ere, Osasun Publikoaren eta
  Adikzioen Zuzendaritzak ezartzen dituen jarraibide eta gidalerro guztiak errespetatu
  beharko dira, jendearen egonaldia eta bertaratzea antolatzeko, halako eran non transmisio
  birikoaren arriskua saihestuko baita.\u00bb\\n\u00ab4.\u2013 Ostalaritza- eta jatetxe-establezimenduen
  barrualdeetan, edukieraren ehuneko 50eko muga ezartzen da, baita barran edo zutik
  kontsumitzeko debekua ere. Zerbitzua antolatzeko, barrualdeetan eta terrazetan,
  gehienez zortzi pertsona izan daitezke mahai edo mahai-talde bakoitzeko, bizikideen
  kasuan izan ezik. Ezin izango dira bezero gehiago elkartu zortzi lagunentzako mahaietan.\u00bb\\n\u00ab6.\u2013
  Txokoek eta elkarte gastronomikoek honako arau hauek beteko dituzte:\\n\u2013 Edukieraren
  ehuneko 50eko muga ezartzen da, bai eta barran edo zutik kontsumitzeko debekua eta
  maskara nahitaez erabiltzea ere, irensteko unean izan ezik.\\n\u2013 Zerbitzua antolatzeko,
  gehienez zortzi pertsona izan daitezke mahai edo mahai-talde bakoitzeko, bizikideen
  kasuan izan ezik. Ezin izango dira bezero gehiago elkartu zortzi lagunentzako mahaietan.
  Nolanahi ere, mahai desberdinetan eserita dauden pertsonen artean gutxienez 1,5
  metroko distantzia mantentzen dela ziurtatu beharko da.\u00bb\\nLaugarrena.\u2013
  Laugarren artikulua mantendu egiten da, eta honela geratzen da idatzita:\\n\u00ab4.
  artikulua.\u2013 Erantzukizun sanitarioko betebeharrak.\\n1.\u2013 COVID-19aren
  pandemia kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legearen 16.4 artikuluan
  xedatutakoaren arabera, kutsatutako pertsonak eta haiekin kontaktua izan dutenak
  behartuta daude kutsadurak arakatzen eta horien trazabilitatea egiten laguntzera,
  eta, beraz, herritarrei eskatzen zaie jarraipen-lanen arduradunen deiak jasotzen
  dituztenean arretarik handiena jartzeko, eta zorroztasunez aritzeko, eta eskatutako
  informazio guztia ahalik eta azkarren eta egiazkotasunik handienarekin emateko.\\n2.\u2013
  COVID-19aren pandemia kudeatzeko neurriei buruzko ekainaren 24ko 2/2021 Legearen
  23. artikuluan xedatutakoaren arabera, agerraldi epidemikoek eragindako pertsonek
  konfinatzeko betebehar pertsonala dute, eta, horren ondorioz, isolamendu-betebeharrak
  zorrotz bete beharko dituzte, beste pertsona batzuekin lekualdatzeko edo aurrez
  aurre erlazionatzeko aukerarik gabe; halaber, berrogeialdiak ere bete beharko dituzte,
  kutsatu izanaren susmoa duten beste pertsona edo pertsona-talde guztiei dagokienez.
  Horiek guztiek osasun-agintarien edo -zerbitzuen jarraibideak bete beharko dituzte,
  indarrean dauden protokoloen eta kasu bakoitzaren egoera zehatzaren arabera.\u00bb\\nBosgarrena.\u2013
  Bosgarren artikuluari beste idazkuntza bat ematea, eta honela geratzen da idatzita:\\n\u00ab5.
  artikulua.\u2013 Gizalegez jokatzeko deiak.\\nCOVID-19aren pandemia kudeatzeko neurriei
  buruzko ekainaren 24ko 2/2021 Legearen 20.1 artikuluan xedatutakoaren arabera, herritar
  orori eskatzen zaio, autoerantzukizunean oinarrituta, bere burua borondatez muga
  dezala, honako neurri hauek aplikatzeko:\\n\u2013 Gaueko mugikortasuna mugatzea,
  bereziki, COVID-19 kasuengatik 14 eguneko intzidentzia-tasa metatua 100.000 biztanleko
  150etik gora duten udalerrietan, 01:00etik 06:00etara bitartean.\\n\u2013 Pertsonen
  taldeak mugatzea, bereziki, COVID-19 kasuengatik 14 eguneko intzidentzia- tasa metatua
  100.000 biztanleko 150etik gora duten udalerrietan; mugatu ere, gehienez, zortzi
  pertsonara, bizikideak salbu.\\n\u2013 Autokonfinamendua eta autoisolamendu pertsonala
  ezartzea, COVID-19 kutsaduraren lehen sintomak izan bezain laster, eta, hala badagokio,
  osasun-zerbitzuekin harremanetan jartzea.\u00bb\\nDekretu honetan aipatutako neurrien
  jarraipena eta etengabeko ebaluazioa egingo da, egoera epidemiologikoaren bilakaerara
  egokitzen direla bermatzeko.\\nDekretu honek 2021eko irailaren 1eko 00:00etatik
  aurrera izango ditu ondorioak.\\nDekretu honetan xedatutakoaren aurka, administrazioarekiko
  auzi-errekurtsoa jar daiteke Euskal Autonomia Erkidegoko Justizia Auzitegi Nagusiko
  Administrazioarekiko Auzien Salan, bi hilabeteko epean, dekretua argitaratu eta
  hurrengo egunetik aurrera, bat etorriz Administrazioarekiko Auzien Jurisdikzioa
  arautzen duen uztailaren 13ko 29/1998 Legearen 10. artikuluan xedatutakoarekin.\\nVitoria-Gasteizen,
  2021eko abuztuaren 30ean.\\nLehendakaria,\\nI\u00d1IGO URKULLU RENTERIA.\"", "\"Apirilaren
  6an (19:00etan), Osasunaren Nazioarteko Egunaren bezperan, liburu hau aurkeztuko
  dute Donostiako Udal Liburutegiko Ekintzen Aretoan (San Jer\u00f3nimo kalean): \u201cSe
  vende sanidad p\u00fablica. Todo lo que deber\u00edas saber sobre la privatizaci\u00f3n,
  pero nadie quiere contarte\u201d (Osasun publikoa salgai. Pribatizazioari buruz
  jakin beharko zenukeen guztia, baina inork kontatu nahi ez dizuna). Juan Antonio
  G\u00f3mez Li\u00e9bana elkarrizketatu genuen duela egun batzuk. Madrilgo Osasun
  Publikoa pribatizatzearen aurkako koordinakundeko kidea eta larrialdietako erizaina
  da.\\n-Liburu horren koordinatzaile aritu zara, eta liburuaren azpititulua parafraseatuz,
  zer jakin beharko genuke eta zer ez digute kontatu nahi osasun publikoaren pribatizazioari
  buruz?\\nCASen (Osasun Publikoa Pribatizatzearen aurkako koordinakundea) uste dugu
  garrantzitsua dela osasun arloari buruz hitz egitea, zerbitzu hori herritar guztiek
  eskura izan beharko lukete eta. Baina, era berean, osasunari buruz ere hitz egin
  beharko genuke. Bi gauza ezberdin dira. Guk Madrilen ekin genion borrokari 2004.
  urtean, Madrilgo osasun sistema desegingo zutela zuzenean jakin genuenean; eta halaxe
  gertatu zen bost urteren buruan. Borroka gogorrena 2004tik 2012ra bitartekoa izan
  zen. Osasun Sistema Nazionala kudeatzeko modu berriak gaitzeari buruzko 15.97 Legea
  indargabetzeko milioi erdi sinadura biltzea lortu genuen, eta, ondoren, Legebiltzarrera
  eraman genituen, baina alderdi batek ere ez zuen ezer jakin nahi izan, ezta komunikabideek
  ere, legea indargabetzeko hiru hiletik behin antolatzen genituen manifestaldietan
  40.000 pertsona biltzen genituen arren. Denbora horretan, funtsean, osasun sektoreko
  zenbait pertsonak eta profesionalek lagundu digute. Ondoren, 2012an, dagoeneko 12
  ospitale pribatu irekita genituenean, eta ospitale publikoetako milaka ohe kendu
  zituztenean, Madrilgo eskualdeko gobernuak hainbat neurri hartu zituen. Neurri horiek,
  modu batean edo bestean, plantilletako baldintza ekonomikoetan eta lan baldintzetan
  izan zuen eragina. Orduan sortu ziren marea zuriak, eta komunikabideetan garrantzia
  eman zitzaien, pribatizazio prozesuak dagoeneko urteak zeramatzanean martxan. Ildo
  horretan eta beste batzuetan, oso kritikoak gara marea zuriarekin eta norberaren
  ospitalearen aurrean beste ospitale batzuk eraikitzen zituztela ikusten zuten bitartean
  ezer esan ez zuten guztiekin. CASen iritziz, ez dute gaiaren mamia aztertu nahi
  izan.\\n-Ildo horretan, beste arrisku bat dago, eta, zuen ustez, pribatizatzea bezain
  arriskutsua edo arriskutsuagoa izan daiteke...\\nAndaluzian, kontratu zaborrak dituzten
  mediku batzuek liburuaren zati batzuk sinatu dituzte; esaterako, \u201cGesti\u00f3n
  cl\u00ednica, ese oscuro objeto de deseo\u201d (Kudeaketa klinikoa, desira-objektu
  ilun hori). Bertan, sistema hori zertan datzan azaltzen da: helburua ez da pribatizazioa
  sartzea, esparru klinikoaren merkantilismoa baizik. Ez dago enpresa pribaturik,
  baina pazientearekiko harremanetan, irizpide ekonomikoak eta merkatu-irizpideak
  sartu dira. Hala, urte batean pazienteekin osasun gastua murrizten dutenek (espezialistengana
  gutxiago bideratzearen ondorioz edo farmazian gutxiago gastatzearen ondorioz), urtean
  7.000-14.000 euroko pizgarri ekonomikoak jasotzen dituzte. Eredu hori ezarriko dute
  Andaluzian, eta, Asturiasen, neurri txikiagoan. \u201cEzkerrak\u201d sartu du pixkanaka,
  eta PPk ere bai gobernua duen autonomietan, adibidez, Gaztela eta Leonen. PSOEk
  iragarri du Gaztela-Mantxan ere sartuko duela. Mekanismo hori banku bati ospitale
  baten ustiaketa lagatzea baino arriskutsuagoa izan daiteke; izan ere, helburua langile
  klinikoen eguneroko funtzionamenduan helburu ekonomizista sartzea da, eta ez sendatzea
  edo osasuna sustatzea. Gastua murriztea da helburu bakarra, ez dago besterik.\\n-Halako
  eredu batek pertsonen osasunean dakartzan ondorioak pribatizazioak eragiten dituenak
  baino okerragoak dira?\\nMomentuz, datuak eskuan ditugula, ez dira sistema pribatuak
  baino okerragoak; izan ere, argi dago ospitale bat ixten denean, nazioarteko ikerketa
  guztiek agerian uzten dutela heriotza-tasak gora egiten duela: % 2 helduen artean,
  % 8 gaixo kronikoen artean, eta % 9,5 haur jaio berrien artean. Urtearen amaieran,
  dirua dago banatzeko, eta hori osasun gastua edo plantillaren gastua murriztearen
  ondorioa baino ez da. Baina eredu hori ere ez dugu gustuko.\\n-Liburuan, pribatizazioaren
  aurrean ondo funtzionatzen duten esperientziak ageri dira.\\nSistema publikoa defendatzeko
  borroken hainbat esperientzia jaso ditugu, baina baita norberak kudeatutako egiturak
  sortzeko beste esperientzia batzuk ere. Tesalonikan (Grezian), esaterako, osasun
  sistema auzoko hainbat batzarren artean eta osasun arloko hainbat langileren artean
  antolatu dute Estatuak kudeatzen ez dituen lehen mailako arretarako egiturak mantentzeko.
  Kasu batzuetan, sei urte daramatzate martxan, eta legea onetsi zenean sistema publikotik
  kanpo geratu ziren hiru milioi pertsona ingururi osasun arreta ematea lortu zuen.
  Lege horren ondorioz, langabezian urtebete baino gehiago zeramatenek osasun arreta
  integrala galdu zuten, eta larrialdietarako sarbidea besterik ez zuten.\\n-Kudeaketa-eredua
  zalantzan jartzeaz gain, ezarritako medikuntza eredua ere kritikatzen duzue.\\nBai,
  medikuntza ereduaren norabideaz ari gara. Uste dugu osasun arreta garrantzitsua
  dela, baina Lalonderen 1974ko txostenak dagoeneko agerian uzten zuen Mendebaldeko
  herrialdeetan osasun arreta horrek % 11 besterik ez duela murriztu heriotza-tasa.
  Benetan kopuru hori murriztu zezaketen faktoreak hauek dira: ingurumenak % 18 eta
  bizimoduak % 43. Ehuneko horiek gora egin dute, eta, 2010ean, EBk onartu zuen heriotza-tasaren
  hiru laurdenak faktore horien mende daudela. Hala ere, osasun sistema mugatzen duten
  faktore horiek ez dira ukitzen; izan ere, benetan prebentzioa bultzatuko balitz,
  gaixotasun sortzaile deritzegunen aurka jokatuko genuke.\\n-Zein dira gaixotasunen
  sortzaile horiek?\\nGaur egun, adibidez, minbiziak eragindako milaka heriotza ditugu
  industria toxikoen ondorioz, baina heriotza horiek ez lirateke sortu beharko. Beste
  faktore asko daude tartean, eta asko bizimodu kontsumistarekin eta bizimodu oso
  garatuarekin lotuta daude. Bada, horien ondorioz sortzen ari dira pertsona gaixoak,
  baina ez lukete gaixo egon beharko, horiexek dira, ordea, osasun eredu ekonomikoa
  elikatzen dutenak. Gero eta gehiago gaude farmazeutiken esku, medikuntza- eta industria-egituraren
  esku...\\n-Liburuan proposatzen den eredu aldaketan, herritarrei eta osasun arloko
  langileei eskatzen zaie aldaketa horretan zuzenean parte har dezaten. Eta, aldaketa
  horretan, Administrazioak badirudi ez duela interes gehiegirik.\\nEz dute interesik
  mugarik gabeko hazkundearen eredu kapitalistaren aurkako borrokan sartuko ginatekeelako.
  Euskadin oso gertu duzuen adibide bat emango dizuet: Zubietako erraustegiarena.
  Ikerketa zientifiko askotan onartzen da hiri hondakinen erraustegiak hurbil daudenean,
  minbiziak eragiten dituen heriotzen tasa gehiegizkoa dela, malformazio genetikoak
  egoten direla, eta gaixotasun kardiobaskularren kopuruak nahiz arnasketa-gaixotasunen
  kopuruak gora egiten dutela. Hala ere, Osakidetzan ez dago erraustegia herritarren
  osasunerako kaltegarria dela ohartarazten duen dokumenturik. Eta, Konstituzioaren
  43. artikuluan ezartzen da erakundeek osasun kolektiboa bermatzeko betebeharra dutela.
  Beraz, herritarrek eurek defendatu behar dituzten beren eskubideak. Graciakoaren
  moduko esperientziek agerian uzten dute dena ez dela \u201cEstatu aitaren\u201d
  esku utzi behar. Greziako osasun arloko langileak gai izan dira herritarrei arreta
  emateko osasun egitura txikiak sortzeko, eta zentro horiek ez dira inola ere Espainiakoak
  baino okerragoak.\\n-Zer ekintza jarri beharko lituzkete martxan herritarrek eta
  osasun arloko profesionalek egungo eredua hobetzeko?\\nLehenik eta behin, politikariek
  zentroen funtzionamenduaren kontrol demokratikorako mekanismoak ezarri beharko lituzkete.
  Horretarako, lehenik eta behin, gardentasuna behar da. Espainian, ez dago osasun
  sistemaren funtzionamenduari eta emaitzei buruzko datu pertsonaletarako sarbiderik.
  Datu orokorrak besterik ezin ditugu eskuratu, eta oso ondo kontrolatzen dute datu
  xehatuetarako sarbiderik ez izatea. Datu horiek izanez gero, sistemaren funtzionamendua
  gardena izango litzateke, eta ondo funtzionatzen ez duen arloetan sakondu ahalko
  genuke. Ondoren, kudeaketa demokratikorako mekanismoak sortu beharko lirateke zentroetako
  langileen eta zentro horiek kokalekuan bizi diren herritarren artean. Elkarrekin
  lan egin beharko genuke, asistentzia sanitarioa kudeatzeko ez ezik, osasunaren diagnostikoetan
  ere lan egiteko, 86ko Osasunaren Lege Orokorrak ezartzen duen moduan, inoiz ezarri
  ez bada ere. Diagnostiko horiek eginez gero, zer arazoren inguruan lan egin beharko
  litzatekeen jakingo genuke. Lehen esaten nizun moduan, industria jakin batek pertsonen
  osasunean eragiten badu, neurriren bat hartu behar da horren inguruan; izan ere,
  ezer baino lehen, pertsonen osasuna dago, eta ez enpresaren interesak. Baina une
  hauetan, sistema ez dirudi hori gauzatzeko prest dagoenik, eta herritarrak ere dirudi
  oso prest daudenik, beste gauza batzuetan ari dira eta. Ezin dugu gure burua engainatu,
  herritarren gehiengoa kontsumo eredu jakin batean murgilduta baitago, eta gutxiengoa
  besterik ez baitago gai hauekin kezkatuta.\\n-Jendearen aldetik, mobilizazio falta
  al dago? Lehen esaten nuen bezala, ohitu egin gara \u201caita Estatuak\u201d guztia
  konpontzera?\\nErrazagoa da herritarrak mugiaraztea osasun zentro jakin batean pediatraren
  lanpostua betetzen ez denean, bere seme-alabak hiltzen ari den erraustegiaren aurka
  egiteko baino. Zoritxarrez, hala da, eta ez dago arazo horiek konponduko dituen
  makila magikorik. Eta seguruenik, arazo horietako askok egungo kontsumo-ereduak
  ekarritako mobilizazio falta horrekin lotura izango dute. Horrek guztiak indibidualismoa
  eta hedonismoa ekarri du, non jendeak bere arazo txikiak konpondu nahi dituen, aurrerapen
  historiko handiak beti taldeko mobilizazio handiei esker lortu diren ideia alde
  batera utzita. Hala gertatu zen, adibidez, zortzi orduko lanaldiarekin edo emakumeen
  boto eskubidearekin, denbora eta ahalegin handia behar izan zen eta.\\n-Tratamenduekin
  zerikusia duten kontuetan ere etsi egin al dugu? Medikalizatzeko joera da gailentzen
  da norberaren osasunaren gainean erantzukizuna hartzearen gainetik?\\nHori kontsumo
  ereduaren ondorioa da. Merkataritza-gune handietan kontsumitzen dugun bezalaxe,
  jendeak farmakoak kontsumitzen ditu pentsatuz osasuna kontsumitzen ari dela, baina
  egiazki botika horiek dakartzaten albo-ondorioak Europan heriotza eragiten duten
  hirugarren arrazoi nagusiak dira. Lehenengo arrazoia bihotzeko gaixotasunak dira,
  bigarrena, minbizia, eta hirugarrena, botiken kontsumoa. Horrek asko esaten du gure
  egungo eredu sozialaren inguruan. Ez gara egunez egun gaixotasunak sortzen dizkiguten
  erabakigarri batzuen aurka borrokatzen ari, eta gure osasun arazo guztiak diagnostiko
  proba batzuk egitearekin edo botika asko hartzearekin konpondu nahi ditugu. Baina
  osasun baliabideak gero eta gehiago kontsumitzea edo herrialde baten errenta areagotzea
  ez da osasun handiagoaren seinale, kontrakoa baizik. Osasunaren baldintzatzaileak,
  sarritan, ez daude diruarekin lotuta, besteak beste, ezarritako ereduarekin baizik.
  Lehen etxean kudeatzen genituen gaixotasun prozesu txikiak, baina hori guztia galdu
  egin da. Nik larrialdi zerbitzu batean lan egin dut, eta ezin duzu imajinatu gaixotasunak
  edo larrialdiak ez diren zenbat kasu iristen zaizkigun. Gure buruaren eta seme-alaben
  zaintzan, autonomia handia galdu dugu.\\n-Egoera hori Espainiako estatuko beste
  edozein lekura eraman daiteke. Euskadira ere bai?\\nArgi eta garbi ikusten dugu
  osasun kontsumoa zenbat eta handiagoa izan, herritarren artean orduan eta okerragoa
  dela osasun egoera edo osasunaren sentsazioa. Beraz, aldaketa orokorrik ez badago,
  osasunean ez da aldaketa orokorrik egongo. Honako hau pentsatu beharko genuke: baliabideen
  kontsumo mugagabearen eredu industrial desarrollistaren estertoreak aurrean ditugula,
  eta gure seme-alabek oso bestelako egoera aurkituko dutela. Ildo horretan, osasun
  kolektiborako konponbide askoz ere merkeagoak bilatu beharko genituzke; izan ere,
  merkeagoa da erabakigarrien aurka egitea, jendeari diagnostikoa egiten eta tratamendua
  ematen ahalegintzea baino. Eta jakin beharko genuke bizimodu askoz ere errazagoa
  izan beharko genukeela, estres kronikoa erabat ezarrita egon ez dadin. Gaur egun,
  gauza jakina da gaixotasun asko (minbizia edo gaixotasun kardiobaskularrak, esaterako),
  konurbazio handietan eta lan estresagarrietan bizi dugun estres kronikoarekin lotuta
  daude, pixkanaka organo guztiak hondatzen dira eta. Azken batean, askotan jendeari
  alkandora hertsagarri kimikoak jartzen ari gara, baina, gure egungo sistema da alde
  guztietatik gaixotasunak sortzen dituena. Aldaketa orokorra behar dugu. Utopia dela
  esango digute, baina uste dugu aldaketak egongo direla, nahiz eta kasu batzuetan
  hain baikorra ez izan, hori ere kalterako.\\n-Aldaketez ari garela, onartuko diren
  Merkataritza Libreko Itunek (MLI) zer eragin izango dute osasun sistema publikoetan?
  CETA dagoeneko Europan eta Espainian onartuta dago, eta Senatuak onartzea besterik
  ez da falta...\\nEragiteko modua dela eta, dagoeneko nolabait pribatizazio prozesuetan
  ikus dezakegu. Ipar Amerikako multinazionalak TLCekin etortzearen helburua hau da:
  Europan irekitzen ari den osasun negozioan sartzea eta dagoeneko hemen zeuden enpresekin
  lehiatzea osasun sistema publikoaren alde errentagarriekin geratzeko. Izan ere,
  ez dute pribatizatuko errentagarria ez dena. Beti geratuko da gaixotasun jakin batzuk
  (gaixotasun infekziosoak, esaterako) estaliko dituen ongintzazko sistema bat, horiek
  ez dutelako klasearekin loturiko mugarik. Ez dute nahi tuberkulosirik egotea, jende
  guztia kutsatu dezakete eta. Horrek, azken batean, bi abiaduratako osasun sistemara
  hurbiltzen gaitu. Sistema horretan, batetik, tratamendu jakin batzuk ordaindu ditzakeen
  jendea egongo da, eta, bestetik, zentzu praktikoan tratamendu horietarako sarbiderik
  izango ez duen jendea ere bai. Sistema publikoan ebakuntza bat egiteko itxarote-zerrendan
  egon zaitezke, baina sistema hori oso hondatuta badago, baliteke ebakuntzarako garaiz
  ez iristea. TLCek pribatizazio prozesuak bizkortzea ekarriko dute, eta multinazionalak
  beherapenetara etorriko dira, errentagarria den guztiarekin geratzeko.\"", "\"Horrela
  nahi izanez gero PMG Racing , mesedez, saiatu jokoak horietako bat:\\nJokatzeko
