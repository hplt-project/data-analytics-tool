  Gure helburua da mendekotasuna duten pertsonei eta pertsona nagusiei zerbitzu integrala
  eskaintzea, baina etxean. Joan den egubakoitzean aurkeztu genuen eta dagoeneko martxan
  gaude.\\nZe beharri erantzuteko sortu duzue Bihar?\\nDatuak hor daude. Gaur egun,
  Euskadiko populazioaren %22k 65 urte edo gehiago ditu eta hemendik 18 urtera %33
  izatea aurreikusten da. Adin-talde horren %95ek dio etxean gelditu nahi duela, eta
