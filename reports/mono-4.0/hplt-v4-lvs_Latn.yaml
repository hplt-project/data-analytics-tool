  nepiecie\u0161ams, jo diezgan liels daudzums daudzsolo\u0161u m\u0101kslinieku p\u0101rst\u0101j
  augt starp pirmajiem singliem, EP un debijas ierakstu. T\u0101dos gad\u012bjumos
  debijas tiek piepild\u012btas ar jau izdot\u0101m dziesm\u0101m, tikai lai piepild\u012btu
  dziesmu sarakstu.\\nBeina sav\u0101 agr\u012bnaj\u0101 karjeras posm\u0101 ir izv\u0113l\u0113jusies
  palikt pie EP form\u0101ta, kas sav\u0101 zi\u0146\u0101 darbojies, k\u0101 inkubators.
  Tas, protams, ir atmaks\u0101jies ar uzviju. Vi\u0146a ir sp\u0113rusi so\u013cus
  l\u0113n\u0101m, bet pareizaj\u0101 laik\u0101 un pareizaj\u0101 virzien\u0101.
  Visi tr\u012bs l\u012bdz \u0161im izdotie ieraksti ir viscaur sp\u0113c\u012bgi
  un bez man\u0101miem (dzirdamiem) tr\u016bkumiem. Swim Against the Tide EP ir pietieko\u0161i
  labi nostr\u0101d\u0101ts, lai var\u0113tu b\u016bt tre\u0161\u0101 un p\u0113d\u0113j\u0101
  da\u013ca vi\u0146as EP trilo\u0123ij\u0101 pirms \u0137er\u0161an\u0101s kl\u0101t
  pirmajam lielajam albumam.\\n8/10\"", "\"In\u017eeniertehnisk\u0101s konsult\u0101cijas
  un izp\u0113te:\\nSadarb\u012bb\u0101 ar RTU veicam pla\u0161a spektra in\u017eeniertehniskas
  konsult\u0101cijas un izp\u0113ti. Pied\u0101v\u0101jam veikt da\u017e\u0101dus
  \u016bdenssaimniec\u012bbas sist\u0113mu efektivit\u0101tes uzlabo\u0161anas risin\u0101jumus:\\n-
  notek\u016bde\u0146u att\u012br\u012b\u0161anas iek\u0101rtu elektroener\u0123ijas
  pat\u0113ri\u0146a samazin\u0101\u0161ana un att\u012br\u012b\u0161anas efektivit\u0101tes
  uzlabo\u0161ana;\\n- dzeram\u0101 \u016bdens att\u012br\u012b\u0161anas iek\u0101rtu
  att\u012br\u012b\u0161anas efektivit\u0101tes uzlabo\u0161ana;\\n- dzeram\u0101
  \u016bdens apg\u0101des t\u012bklu skalo\u0161anas un apkalpo\u0161anas ciklu izstr\u0101de;\\n-
  dzeram\u0101 \u016bdens apg\u0101des sist\u0113mu hidraulisko mode\u013cu izstr\u0101de.\"",
  "\"R\u012bga 5\u00b0C, apm\u0101cies, bez nokri\u0161\u0146iem, DA v\u0113j\u0161
  2m/s\\nSv\u0113tdiena, 2025. gada 26. janv\u0101ris 09:40\\nV\u0101rda dienas: Agneta,
  Agnis, Ansis\\n2025. gada vasar\u0101 Eiropas \u010dempion\u0101ts basketbol\u0101
  notiks tie\u0161i pie mums \u2013 Latvij\u0101. Tie\u0161i t\u0101p\u0113c Latvijas
  Basketbola savien\u012bba un visa Eiropas \u010dempion\u0101ta r\u012bkot\u0101ju
  komanda veido trofejas t\u016bri pa visu Latviju.\\nRedakcija atrodas: R\u012bgas
  iela 77, L\u012bv\u0101ni, L\u012bv\u0101nu novads, LV-5316\\nRedakcijas e-pasta
  adrese: [email protected]\\nLursoft laikrakstu bibliot\u0113k\u0101 pieejami raksti
  no 22.05.2013 l\u012bdz 16.04.2014 un atjaunoti no 18.04.2015\"", "\"K\u0101dreiz\u0113jo
  WTA ranga l\u012bderi Garbinji Mugurusu no Sp\u0101nijas bildin\u0101jis vi\u0146as
  fans, kur\u0161 savulaik uz ielas \u0145ujork\u0101 pal\u016bdza kop\u012bgu pa\u0161bildi,
  v\u0113sta Sp\u0101nijas izdevums \\\"HOLA!\\\".\\nBiju\u0161o WTA ranga l\u012bderi
  bildin\u0101jis vi\u0146as fans\\n29 gadus vec\u0101 tenisiste, kura karjeras laik\u0101
  izc\u012bn\u012bjusi 10 viensp\u0113\u013cu WTA raudzes titulus, sav\u0101 \\\"Instagram\\\"
  kont\u0101 pav\u0113st\u012bjusi, ka ir saderin\u0101jusies ar modeli Art\u016bru
  Borgesu.\\nVi\u0146a past\u0101st\u012bjusi, k\u0101 savulaik iepazin\u0101s ar
  savas dz\u012bves m\u012blest\u012bbu.\\nAr tagad\u0113jo l\u012bgavaini Mugurusa
  iepazinusies savulaik \u0145ujork\u0101. V\u012brietim pieticis drosmes vi\u0146u
  uzrun\u0101t, lai kop\u0101 nofotograf\u0113tos.\\n\\\"Mana viesn\u012bca bija tuvu
  Centr\u0101lparkam. Man bija garlaic\u012bgi, un nol\u0113mu doties pastaig\u0101.
  Vi\u0146u [Borgesu] satiku uz ielas. Vi\u0146\u0161 man nov\u0113l\u0113ja veiksmi
  gaid\u0101maj\u0101 \\\"US Open\\\" turn\u012br\u0101, bet es nodom\u0101ju, ka
  vi\u0146\u0161 ir \u013coti izskat\u012bgs,\\\" notiku\u0161o pirms 2021. gada ASV
  atkl\u0101t\u0101 \u010dempion\u0101ta atceras Mugurusa.\\nP\u0113c kop\u012bg\u0101s
  nofotograf\u0113\u0161an\u0101s vi\u0146i satiku\u0161ies arvien bie\u017e\u0101k.
  Sportisti ar\u012b piesaist\u012bjis fakts, ka Borgess nek\u0101d\u0101 veid\u0101
  nav saist\u012bts ar vi\u0146as ikdienas darbu - tenisu.\\nV\u0113l pag\u0101ju\u0161aj\u0101
  gad\u0101 Mugurusa WTA rang\u0101 ierindoj\u0101s lab\u0101ko desmitniek\u0101,
  bet tagad atk\u0101pusies uz 168. poz\u012bciju. \u0160\u0101 gada s\u0101kum\u0101
  vi\u0146a pav\u0113st\u012bja, ka pa\u0146ems pauzi no profesion\u0101l\u0101 tenisa.
  Kop\u0161 janv\u0101ra vi\u0146a nav sp\u0113l\u0113jusi.\\n2017. gada septembr\u012b
  Mugurusa k\u013cuva par WTA ranga l\u012bderi.\\nKarjeras laik\u0101 Sp\u0101nijas
  tenisiste nopeln\u012bjusi nepilnus 25 miljonus ASV dol\u0101ru.\""]'
