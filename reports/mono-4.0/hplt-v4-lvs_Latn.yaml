  apspried\u0101m aktualit\u0101tes un analiz\u0113j\u0101m probl\u0113mas.\\nDaudz
  vair\u0101k pamana un zi\u0146o\\nI. Luikas p\u0101rraudz\u012bb\u0101 \u0161obr\u012bd
  ir Vidzemes re\u0123iona teritorijas pies\u0101r\u0146ojo\u0161o darb\u012bbu objekti
