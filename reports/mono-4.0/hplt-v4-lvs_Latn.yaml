sample: '["\"Iedz\u012bvot\u0101ju vakcin\u0113\u0161ana tiks \u012bstenota pak\u0101peniski\\nNacion\u0101l\u0101s
  imuniz\u0101cijas valsts padomes, Vesel\u012bbas ministrijas, Z\u0101\u013cu valsts
  a\u0123ent\u016bras, Nacion\u0101l\u0101 vesel\u012bbas dienesta un Slim\u012bbu
  profilakses un kontroles centra sadarb\u012bbas rezult\u0101t\u0101 ir izstr\u0101d\u0101ts
  detaliz\u0113ts vakcin\u0101cijas pl\u0101ns. Vakcin\u0101cijas strat\u0113\u0123ija
  paredz, ka iedz\u012bvot\u0101ju vakcin\u0113\u0161ana tiks \u012bstenota pak\u0101peniski,
  vair\u0101kos posmos.\\nVakcin\u0101cija pret COVID-19 Latvij\u0101 ir br\u012bvpr\u0101t\u012bga,
  tostarp vesel\u012bbas apr\u016bpes darbiniekiem. \u0145emot v\u0113r\u0101 vakc\u012bnu
  pak\u0101penisko ien\u0101k\u0161anu tirg\u016b, s\u0101kum\u0101 tiks vakcin\u0113tas
  visneaizsarg\u0101t\u0101k\u0101s Latvijas sabiedr\u012bbas grupas. M\u0113r\u0137is
  ir nodro\u0161in\u0101t nep\u0101rtrauktu vesel\u012bbas apr\u016bpes sist\u0113mas
  darbu, k\u0101 ar\u012b samazin\u0101t mirst\u012bbas un saslimst\u012bbas rad\u012bto
  slogu uz vesel\u012bbas apr\u016bpes sist\u0113mu.\\n\u0160obr\u012bd Latvija ir
  pieteikusies uz 5 ra\u017eot\u0101ju - \u201eBioNTech\u201d un \u201cPfizer\u201d,
  Moderna Biotech Spain, S. L, AstraZeneca un Johnson & Johnson un CureVac - izstr\u0101d\u0101t\u0101m
  vakc\u012bn\u0101m. Min\u0113to vakc\u012bnu kop\u0113jais apjoms ir 4 060 536 vakc\u012bnas
  devas, ar ko var nodro\u0161in\u0101t 2 429 939 cilv\u0113ku vakcin\u0101ciju.\\nAktu\u0101l\u0101
  inform\u0101cija:\\n- Bie\u017e\u0101k uzdotie jaut\u0101jumi par vakcin\u0101ciju
  pret COVID-19 \u0160EIT\\n- Fakti par vakc\u012bn\u0101m pret COVID-19 \u0160EIT\\n-
  Z\u0101\u013cu valsts a\u0123ent\u016bras jaunumi \u0160EIT\\n- Nacion\u0101l\u0101s
