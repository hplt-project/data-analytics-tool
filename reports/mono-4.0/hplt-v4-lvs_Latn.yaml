  samazin\u0101s sl\u0101pek\u013ca un fosfora savienojumu nopl\u016bdes.\u201d\\nT\u0101pat
  inspektore atg\u0101dina, ka VVD ir izstr\u0101d\u0101ta lauksaimniec\u012bbas objektu
