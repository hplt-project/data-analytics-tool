  k\u013c\u016bst arvien zino\u0161\u0101ki par vides aizsardz\u012bbas jaut\u0101jumiem,
  sabiedr\u012bbai ir pieejama inform\u0101cija, par vides jaut\u0101jumiem arvien
  vair\u0101k run\u0101 un raksta medijos. Vi\u0146a secina ar\u012b, ka apzin\u012bg\u0101ka
  k\u013c\u016bst cilv\u0113ku attieksme pret vidi un vides aizsardz\u012bbas jaut\u0101jumiem
  \u2013 saskata p\u0101rk\u0101pumus pret vidi, cilv\u0113ki k\u013cuvu\u0161i ac\u012bg\u0101ki,
  zino\u0161\u0101ki, arvien vair\u0101k par p\u0101rk\u0101pumiem zi\u0146o, gan
  zvanot uz VVD, gan s\u016btot inform\u0101ciju elektroniski, k\u0101 ar\u012b izmantojot
  \u201cVides SOS\u201d lietotni. Galvenok\u0101rt tiekot sa\u0146emtas s\u016bdz\u012bbas
  par atkritumu apsaimnieko\u0161anas jaut\u0101jumiem, vides pies\u0101r\u0146ojumu,
  nelikum\u012bgu dabas resursu ieguvi un izmanto\u0161anu, k\u0101 ar\u012b par zvejas
  un mak\u0161\u0137er\u0113\u0161anas noteikumu p\u0101rk\u0101pumiem.\\nInspektore
  nov\u0113rojusi, ka kop\u0161 dz\u0113rienu pude\u013cu depoz\u012bta ievie\u0161anas
  plastmasas un stikla pudeles vairs tik daudz dab\u0101 nem\u0113t\u0101jas. Diem\u017e\u0113l
  piln\u012bb\u0101 visu rad\u012bto p\u0101rtikas iepakojumu nevar at\u0161\u0137irot
  un da\u013ca iepakojuma non\u0101k pie sadz\u012bves atkritumiem. Ar \u0161o jaut\u0101jumu
  mums Latvij\u0101 vajadz\u0113tu str\u0101d\u0101t vair\u0101k.\\n\u0160\u0137irot
  j\u0101b\u016bt viegli\\n\u201c\u0160\u0137iet, ka pils\u0113t\u0101 ir liel\u0101kas
  iesp\u0113jas \u0161\u0137irot atkritumus, jo dz\u012bvesvietai tuvum\u0101 daudz
  pla\u0161\u0101k izvietoti atbilsto\u0161i konteineri, kur nog\u0101d\u0101t m\u0101jsaimniec\u012bb\u0101
  sa\u0161\u0137irotos atkritumus. Lauku pagastos \u0161\u0137iroto atkritumu konteineri
  ir izvietoti ciemata centr\u0101, t\u0101p\u0113c lauku viens\u0113t\u0101s dz\u012bvojo\u0161ajiem
  sa\u0161\u0137irotie atkritumi v\u0113l ir j\u0101nog\u0101d\u0101 l\u012bdz konteineriem,
  kas ir cit\u0101di nek\u0101 pils\u0113t\u0101, kur \u0161\u0137iroto atkritumu
  konteineri daudzdz\u012bvok\u013cu m\u0101ju mikrorajonos ir novietoti turpat net\u0101lu,\u201d
  I. Luika ieskic\u0113, k\u0101p\u0113c, iesp\u0113jams, at\u0161\u0137iras laukos
  un pils\u0113t\u0101 dz\u012bvojo\u0161o attieksme pret atkritumu \u0161\u0137iro\u0161anu.
  Tom\u0113r inspektore uzskata, ka liel\u0101k\u0101 noz\u012bme ir katra person\u012bgajai
  attieksmei. \u201cT\u0101pat k\u0101 daudzi, ar\u012b es \u0161\u0137iroju atkritumus,
  esmu pie t\u0101 jau pieradusi, t\u0101 ir iesp\u0113ja samazin\u0101t izmaksas
  par ne\u0161\u0137iroto atkritumu nodo\u0161anu atkritumu apsaimniekot\u0101jam
  un \u0161\u0137irotajiem atkritumiem tapt izmantotiem otrreiz materi\u0101lu un
  produktu ra\u017eo\u0161an\u0101. Tom\u0113r sav\u0101 darb\u0101 joproj\u0101m
  saskaramies ar izg\u0101ztiem atkritumiem me\u017e\u0101, atkritumu dedzin\u0101\u0161anu,
  ar\u012b aprak\u0161anu. Joproj\u0101m var uziet veco \u201ckult\u016brsl\u0101ni\u201d
  ar atkritumiem (bedres pieb\u0113rtas ar stikla un plastmasas pudel\u0113m, met\u0101la
  konservu k\u0101rb\u0101m un citiem sadz\u012bves atkritumiem). Ta\u010du \u0161obr\u012bd
  m\u0101jsaimniec\u012bbas gan pils\u0113t\u0101s, gan laukos ir iesaist\u012bju\u0161\u0101s
  atkritumu apsaimnieko\u0161anas sist\u0113m\u0101, nosl\u0113gti l\u012bgumi par
  sadz\u012bves atkritumu apsaimnieko\u0161anu un ir nolikti atkritumu konteineri,
  ko apsaimniekot\u0101ji p\u0113c izstr\u0101d\u0101t\u0101 grafika regul\u0101ri
  izved. Katrai pa\u0161vald\u012bbai ir saisto\u0161ie noteikumi par sadz\u012bves
  atkritumu apsaimnieko\u0161anu, \u012bpa\u0161niekam vai \u012bpa\u0161uma nomniekam
  ir pien\u0101kums r\u016bp\u0113ties par rad\u012bto atkritumu apsaimnieko\u0161anu.
  Tom\u0113r p\u0101rbaud\u0113s n\u0101kas konstat\u0113t, ka da\u017ek\u0101rt,
  lai ar\u012b l\u012bgums ir nosl\u0113gts, atkritumu izve\u0161ana nav veikta vai
  ar\u012b l\u012bgums ir nosl\u0113gts tikai \u012bsi pirms VVD inspektora p\u0101rbaudes.
  Joproj\u0101m ir gad\u012bjumi, kad mums st\u0101sta, ka sadz\u012bves atkritumi
  saimniec\u012bb\u0101 neveidojas. V\u0113l joproj\u0101m n\u0101kas sastapties ar
  to, ka atkritumus sadedzina ugunskuros. Ar\u012b lauksaimniec\u012bbas uz\u0146\u0113mumi
  gr\u0113ko ar to, un VVD ik pa laikam sa\u0146em s\u016bdz\u012bbas,\u201d inspektore
  past\u0101sta. Vi\u0146a atg\u0101dina, ka, sadedzinot atkritumus, gais\u0101 izdal\u0101s
  daudz da\u017e\u0101du vielu: oglek\u013ca oks\u012bds, s\u0113ra un sl\u0101pek\u013ca
  oks\u012bdi, kas rada ietekmi uz gaisa kvalit\u0101ti, k\u0101 ar\u012b, sadedzinot
  atkritumus, gais\u0101 non\u0101k toksiskas un kancerog\u0113nas vielas, kas rada
  ietekmi uz dz\u012bvajiem organismiem un cilv\u0113ka vesel\u012bbu.\\n\u201cTa\u010du
  kopum\u0101 situ\u0101cija uzlabojas, cilv\u0113ki k\u013c\u016bst apzin\u012bg\u0101ki,
  izgl\u012btot\u0101ki. Gan priv\u0101tm\u0101j\u0101s pils\u0113t\u0101s un ciematos,
  gan ar\u012b lauku viens\u0113t\u0101s rad\u012btos biolo\u0123iski no\u0101rd\u0101mos
  atkritumus kompost\u0113. Ir uzst\u0101d\u012btas speci\u0101las r\u016bpnieciski
