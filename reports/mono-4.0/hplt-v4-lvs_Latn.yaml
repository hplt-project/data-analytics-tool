  atska\u0146o\u0161anas t\u0101lummai\u0146a var neb\u016bt pieejama, kad tiek r\u0101d\u012btas
  main\u012btas kopijas.\"", "\"Dieva valst\u012bba (4. da\u013ca)\\nP\u0113d\u0113j\u0101
  epizod\u0113 m\u0113s apskat\u012bj\u0101m, cik liel\u0101 m\u0113r\u0101 gaid\u0101m\u0101s
  Dieva valst\u012bbas apsol\u012bjums t\u0101s piln\u012bb\u0101 var kalpot par lielas
  cer\u012bbas avotu mums, tic\u012bgajiem. \u0160aj\u0101 rakst\u0101 m\u0113s v\u0113lamies
  iedzi\u013cin\u0101ties, k\u0101 m\u0113s esam ar \u0161o cer\u012bbu.\\nK\u0101
  m\u0113s j\u016btamies par turpm\u0101ko Dieva valst\u012bbu\\nK\u0101 mums k\u0101
  tic\u012bgajiem b\u016btu j\u0101saprot m\u016bsu attiec\u012bbas ar imp\u0113riju,
  kas B\u012bbel\u0113 teikts, ka jau ir kl\u0101t, bet v\u0113l ir priek\u0161\u0101?
  Es dom\u0101ju, ka m\u0113s to varam izdar\u012bt, pamatojoties uz K\u0101rli Bartu,
  TF Torrance un D\u017eord\u017eu Laddu (\u0160eit var\u0113tu min\u0113t ar\u012b
  citus) apraksta \u0161\u0101di: M\u0113s esam aicin\u0101ti dal\u012bties gaid\u0101m\u0101s
  Kristus valst\u012bbas sv\u0113t\u012bb\u0101s un sniegt pagaidu un pagaidu liec\u012bbas.
  T\u0101pat k\u0101 m\u0113s \u0161obr\u012bd uztveram un atspogu\u013cojam Dieva
  Valst\u012bbu sav\u0101s darb\u012bb\u0101s, kuras kalpo J\u0113zum nep\u0101rtraukti,
  pateicoties Vi\u0146a Sv\u0113tajam Garam, m\u0113s esam dai\u013crun\u012bgi liecinieki
  tam, k\u0101 var\u0113tu izskat\u012bties n\u0101kotne. Liecinieks neliecina par
  sevi, bet gan lai liecin\u0101tu par kaut ko, par ko vi\u0146\u0161 person\u012bgi
  ir ieguvis zin\u0101\u0161anas. T\u0101pat z\u012bme nenor\u0101da uz sevi, bet
  uz kaut ko citu un svar\u012bg\u0101ku. K\u0101 kristie\u0161i, m\u0113s esam liecinieki
  tam, uz ko tiek atsaukts, - n\u0101kotnes Dieva valst\u012bbai. T\u0101d\u0113\u013c
  m\u016bsu liec\u012bba ir svar\u012bga, ta\u010du uz to attiecas da\u017ei ierobe\u017eojumi.
  Pirmk\u0101rt, m\u016bsu liec\u012bba tikai da\u013c\u0113ji kalpo par n\u0101kotnes
  imp\u0113rijas r\u0101d\u012bt\u0101ju. Tas neaptver visu savu paties\u012bbu un
  realit\u0101ti, un tas nemaz nav iesp\u0113jams. M\u016bsu r\u012bc\u012bba nevar
  piln\u012bb\u0101 atkl\u0101t Kristus valst\u012bbu, kas joproj\u0101m ir liel\u0101
  m\u0113r\u0101 sl\u0113pta, vis\u0101 t\u0101s piln\u012bb\u0101. M\u016bsu v\u0101rdi
  un darb\u012bbas var pat mask\u0113t da\u017eus imp\u0113rijas aspektus, vienlaikus
  izce\u013cot citus. Slikt\u0101kaj\u0101 gad\u012bjum\u0101 m\u016bsu da\u017e\u0101die
  liec\u012bbu faili var \u0161\u0137ist piln\u012bgi nekonsekventi, varb\u016bt pat
  pretrun\u0101 viens ar otru. M\u0113s, iesp\u0113jams, nesp\u0113sim pan\u0101kt
  piln\u012bgu katras probl\u0113mas risin\u0101jumu, lai cik patiesi, ap\u0146\u0113m\u012bgi
  vai prasm\u012bgi m\u0113s to cen\u0161amies. Da\u017eos gad\u012bjumos katrs pied\u0101v\u0101tais
  risin\u0101jums neizb\u0113gami var b\u016bt tikpat izdev\u012bgs, jo tas ir kait\u012bgs.
  Gr\u0113c\u012bg\u0101 pasaul\u0113 ide\u0101ls risin\u0101jums ne vienm\u0113r
  ir iesp\u0113jams pat bazn\u012bcai. Un t\u0101p\u0113c vi\u0146as sniegt\u0101
  liec\u012bba \u0161aj\u0101 pasaules laik\u0101 b\u016bs nepiln\u012bga.\\nOtrk\u0101rt,
  m\u016bsu liec\u012bba sniedz mums tikai ierobe\u017eotu n\u0101kotnes skatu, kas
  mums sniedz tikai ieskatu n\u0101kotnes Dieva valst\u012bb\u0101. Tom\u0113r vis\u0101
  realit\u0101t\u0113 tas m\u016bs \u0161obr\u012bd nesp\u0113j aptvert. M\u0113s
  redzam \\\"tikai neskaidru att\u0113lu\\\" (1. Korintie\u0161iem 13,12; labo v\u0113stu\u013cu
  B\u012bbele). Tas ir j\u0101saprot, run\u0101jot par \u201cprovizorisku\u201d uzskatu.
  Tre\u0161k\u0101rt, m\u016bsu liec\u012bba ir ierobe\u017eota laik\u0101. Darbi
  n\u0101k un iet. Da\u017eas lietas, kas tiek dar\u012btas Kristus v\u0101rd\u0101,
  var ilgt ilg\u0101k nek\u0101 citas. Da\u013ca no t\u0101, ko m\u0113s apliecin\u0101m
  ar savu r\u012bc\u012bbu, var b\u016bt tikai \u012bslaic\u012bga un nav past\u0101v\u012bga.
  Bet, ja to saprot k\u0101 z\u012bmi, m\u016bsu liec\u012bbai nav j\u0101b\u016bt
  der\u012bgai vienreiz un uz visiem laikiem, lai var\u0113tu atsaukties uz patiesi
  past\u0101v\u012bgu Dieva m\u016b\u017e\u012bgo vald\u012b\u0161anu caur Kristu
  Sv\u0113taj\u0101 Gar\u0101, t\u0101p\u0113c m\u016bsu liec\u012bba nav ne univers\u0101la,
  ne piln\u012bga, izsme\u013co\u0161a. vai neapstr\u012bdama, kaut ar\u012b tai ir
  liela, patie\u0161\u0101m neaizst\u0101jama v\u0113rt\u012bba, jo t\u0101 to ieg\u016bst
  no attiec\u012bb\u0101m ar Dieva valst\u012bbas n\u0101kotnes realit\u0101ti.\\nDivas
  nepareizas pieejas sare\u017e\u0123\u012btajam jaut\u0101jumam par jau eso\u0161o,
  bet v\u0113l nepabeigto Dieva Valst\u012bbu. Da\u017ei var jaut\u0101t: \u201cTad
  k\u0101da ir m\u016bsu pa\u0161reiz\u0113j\u0101 pieredze un liec\u012bba, ja tie
  nav v\u0113rsti uz pa\u0161u valst\u012bbu? K\u0101p\u0113c gan ar to apnikt? K\u0101ds
  labums no t\u0101 b\u016bs? Ja m\u0113s nesp\u0113jam rad\u012bt ide\u0101lu, k\u0101p\u0113c
  gan mums j\u0101iegulda tik daudz p\u016b\u013cu \u0161\u0101d\u0101 projekt\u0101
  vai j\u0101pavada tam tik daudz naudas? \u201dCiti var atbild\u0113t:\u201c Dievs
  m\u016bs neaicin\u0101tu, ja tas b\u016btu maz\u0101ks par to Sasniedzam ide\u0101lu
  un pabeidzam kaut ko perfektu. Ar vi\u0146a pal\u012bdz\u012bbu m\u0113s varam past\u0101v\u012bgi
  str\u0101d\u0101t, lai \u012bstenotu Dieva valst\u012bbu uz zemes. \u201dBazn\u012bcas
  v\u0113stures gait\u0101 reakcij\u0101m uz\u201c jau eso\u0161\u0101s, bet v\u0113l
  nepabeigt\u0101s \u201dvalst\u012bbas sare\u017e\u0123\u012bto jaut\u0101jumu liel\u0101koties
  ir tik da\u017e\u0101das atbildes, k\u0101 iepriek\u0161min\u0113t\u0101s, ra\u017eots.
  Tas notiek neskatoties uz notieko\u0161ajiem br\u012bdin\u0101jumiem par \u0161\u012bm
  div\u0101m pieej\u0101m, kuras vi\u0146i identific\u0113 k\u0101 nopietnas k\u013c\u016bdas.
  Ofici\u0101li tiek run\u0101ts par triumf\u0101lismu un klusumu.\\ntriumphalism\\nDa\u017ei,
  kuriem nepat\u012bk b\u016bt reduc\u0113tiem uz z\u012bmju uztveri un realiz\u0113\u0161anu,
  tikai uzst\u0101j uz sp\u0113ju pa\u0161i veidot Dieva valst\u012bbu, kaut ar\u012b
  ar Dieva pal\u012bdz\u012bbu. Piem\u0113ram, vi\u0146us nevar attur\u0113t no fakta,
  ka m\u0113s faktiski var\u0113tu b\u016bt \u201cpasaules main\u012bt\u0101ji\u201d.
  Tas notiktu, ja tikai pietiekami daudz cilv\u0113ku no visas sirds ap\u0146emtos
  iev\u0113rot Kristus lietu un b\u016btu gatavi maks\u0101t nepiecie\u0161amo cenu.
  T\u0101tad, ja tikai pietiekami daudz cilv\u0113ku nenogursto\u0161i un sirsn\u012bgi
  m\u0113\u0123in\u0101tu un vair\u0101k zin\u0101tu par pareizaj\u0101m proced\u016br\u0101m
  un metod\u0113m, m\u016bsu pasaule arvien vair\u0101k un vair\u0101k tiktu p\u0101rveidota
  par \u0161o nevainojamo Dieva valst\u012bbu. Kristus atgriez\u012bsies, kad valst\u012bba
  ar m\u016bsu centieniem pamaz\u0101m virz\u012bj\u0101s uz t\u0101s pabeig\u0161anu.
  Protams, to visu var sasniegt tikai ar Dieva pal\u012bdz\u012bbu.\\nLai ar\u012b
  tas netiek run\u0101ts atkl\u0101ti, \u0161is uzskats par Dieva valst\u012bbu pie\u0146em,
  ka tas, ko m\u0113s esam sasniegu\u0161i, ir saist\u012bts ar potenci\u0101lu, ko
  J\u0113zus Kristus \u013c\u0101va paveikt ar vi\u0146a darbu uz zemes un vi\u0146a
  m\u0101c\u012bbu, bet faktiski to ne\u012bstenoja. Kristus bija uzvar\u0113jis t\u0101d\u0101
  form\u0101, ka m\u0113s tagad varam izmantot vai realiz\u0113t vi\u0146a rad\u012bto
  potenci\u0101lu.\\nTriumf\u0101lista reakcija tiecas izcelt tos centienus, kas sola
  pan\u0101kt p\u0101rmai\u0146as soci\u0101l\u0101 taisn\u012bguma un sabiedr\u012bbas
  mor\u0101les, k\u0101 ar\u012b priv\u0101to attiec\u012bbu un mor\u0101l\u0101s
  iztur\u0113\u0161an\u0101s jom\u0101s. Kristie\u0161u pie\u0146em\u0161ana darb\u0101
  \u0161\u0101d\u0101m programm\u0101m parasti ir balst\u012bta uz faktu, ka Dievs
  ir zin\u0101m\u0101 m\u0113r\u0101 atkar\u012bgs no mums. Vi\u0146\u0161 tikai mekl\u0113
  \\\"varo\u0146us\\\". Vi\u0146\u0161 bija devis mums ide\u0101lu, provizorisku projektu,
  patiesi savas valst\u012bbas pl\u0101nu, un tagad Bazn\u012bcas uzdevums bija to
  \u012bstenot. T\u0101p\u0113c mums ir dots potenci\u0101ls realiz\u0113t to, kas
  jau ir pilnveidots. Tas izdosies, ja m\u0113s b\u016bsim tikai p\u0101rliecin\u0101ti,
  ka tas t\u0101 ir, un patie\u0161\u0101m patiesi un absol\u016bti aiz muguras par\u0101d\u012bsim
  Dievam, cik patiesi esam vi\u0146am pateic\u012bgi par visu, ko vi\u0146\u0161 ir
  paveicis, lai m\u0113s var\u0113tu sasniegt ide\u0101lu. Attiec\u012bgi m\u0113s
  sp\u0113jam aizpild\u012bt plaisu starp \u201c\u012bsto\u201d un Dieva ide\u0101lu
  - t\u0101p\u0113c risin\u0101sim to t\u016bl\u012bt!\\nTriumf\u0101lista programmas
  reklam\u0113\u0161anu bie\u017ei veicina \u0161\u0101da kritika: Iemesls ir tas,
  ka netic\u012bgie nepiedal\u0101s programm\u0101 un vienk\u0101r\u0161i nek\u013c\u016bst
  par kristie\u0161iem vai neseko Kristum. Un t\u0101l\u0101k, ka Bazn\u012bca nedar\u012bja
  gandr\u012bz pietiekami daudz, lai padar\u012btu valst\u012bbu par realit\u0101ti
  un t\u0101d\u0113j\u0101di dotu perfektu vietu Dieva dz\u012bvei \u0161eit un tagad.
  Argument\u0101cija iet v\u0113l t\u0101l\u0101k: nomin\u0101lo kristie\u0161u ir
  tik daudz (t.i., tikai p\u0113c nosaukuma) un patiesi lieku\u013ci Bazn\u012bc\u0101,
