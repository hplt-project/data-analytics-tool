  un ar\u012b no virtuves (piem\u0113ram, mizas),\u201d secina I. Luika.\\nNezin\u0101\u0161ana
  nav attaisnojums\\nBl\u012bv\u0101k apdz\u012bvot\u0101s viet\u0101s, kur ir liel\u0101ka
