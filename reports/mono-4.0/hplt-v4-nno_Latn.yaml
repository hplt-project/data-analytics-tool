  for elektronisk meldingsutveksling\"", "\"Det kribla voldsomt i hagefingrane i dag
  d\u00e5 sola kom fram etter vekesvis med regn. N\u00e5 har eg vore ute i hagen i
  fire timar og kosa meg. Dermed kan eg haka av dei fire \u00f8verste p\u00e5 februarlista
  mi. Og nei, eg har ikkje s\u00e5dd. [\u2026]\\nMerkelapp: staudebed\\nHaustanemone
  (haustsymre) heiter faktisk denne vakre stauden sj\u00f8lv om han tek til \u00e5
  bl\u00f8ma alt i starten av juli og bl\u00f8mer enn\u00e5. Det er denne som flest
  fell for n\u00e5r dei er p\u00e5 bes\u00f8k p\u00e5 seinsommaren. Lett \u00e5 forst\u00e5,
  for dei bleikrosa blomane med gule [\u2026]\\nN\u00f8kketunger, praktryllik, haustfloks,
  haustanemoner og v\u00e6rhane har prega staudebedet mitt i august. Her f\u00e5r
  du sj\u00e5 fotos av alle, pluss tips om koss dei vil ha det for \u00e5 trivast
  og koss du deler staudene slik at ein blir til mange. Denne tida er ei [\u2026]\\nNoko
  av stasen med eit staudebed, er at det endrar seg heile tida \u2013 nokre bl\u00f8mer
  av, nye kjem. Det gjeld \u00e5 skapa eit bed som bl\u00f8mer fr\u00e5 tidleg v\u00e5r
  til seint p\u00e5 haust \u2013 helst ogs\u00e5 b\u00f8r staudene passa godt saman.
  \u00c5 f\u00e5 det til [\u2026]\\nI \u00e5r kan me ikkje bare ropa hurra for 17.
  mai, men for heile mai! M\u00e5naden s\u00e5 langt har vore fantastisk, med mange
  dagar med sol og sommartemperaturar. Eg har ikkje villa g\u00e5 glipp av eit einaste
  minutt i hagen. Eg veit du har det [\u2026]\\nAt alt er i endring, er noko av det
  som fasinerer meg mest med hage. S\u00e5 store og raske endringar p\u00e5 s\u00e5
  kort tid som desse fyrste maidagane, har eg knapt vore med p\u00e5. Brems n\u00e5
  litt, ta det med ro, alt treng ikkje koma [\u2026]\""]'
