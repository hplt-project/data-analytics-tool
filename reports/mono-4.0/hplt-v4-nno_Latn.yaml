  andakt ved Asle Hetlebakke 1. p\u00e5skedag Betania Knarvik 20.april kl P\u00e5skesong
  ved Hatikva\"", "\"stenhugger i det fine : ein biografi\\n399 kr\\nAmbrosia T\u00f8nnesen
  (1895-1948) var ein uvanleg person med eit tilsvarande uvanleg yrke. \u00abStenhugger
  i det Fine\u00bb stod det p\u00e5 visittkortet hennar. \u00c5 hogga skulpturar i
  marmor var ikkje rekna som passande arbeid for ei kvinne av borgarskapet p\u00e5
  1800-talet, likevel braut Ambrosia opp fr\u00e5 ei sikker stilling som l\u00e6rarinne
  i Norge for \u00e5 leva som kunstnar i K\u00f8benhavn, Berlin og Paris. Ambrosia
  T\u00f8nnesen fekk mange oppdrag, utstilte jamleg p\u00e5 Salongen og blei den f\u00f8rste
  kvinnelege bildehoggaren i Norge, som kunne leva av kunsten. Jorunn Veiteberg dr\u00f8fter
  korleis ei kvinne med Ambrosia T\u00f8nnesen sin bakgrunn kunne oppn\u00e5 ein slik
  posisjon. Kva fekk henne til \u00e5 bryta med konvensjonane som galdt for hennar
  kj\u00f8nn og klasse? Gjennom eit breitt kulturhistorisk perspektiv gir boka svar
  som gjer den aktuell for alle som er opptatt av kvinner sin situasjon og vilk\u00e5ra
  for kunstskaping p\u00e5 slutten av 1800-talet.\\nFormat\\nInnbundet\\nUtgivelsesdato\\n21-10-2009\\nSpr\u00e5k\\nNynorsk\\nForlag\\nPax\\nISBN\\n9788253032269\\nStatus\\nP\u00e5
  lager\\nUtsolgt\\nMidlertidig utsolgt\\nKommer snart\\nOversetter\\nOriginaltittel\\nAntall
  sider\\n399 kr\"", "\"N\u00e5r det bl\u00e6s og regnar i vinterm\u00f8rkret, er
  det ekstra enkelt \u00e5 bli glad i huset. Midtvinters, n\u00e5r kvelden er m\u00f8rk
  og vinden streng, liker eg \u00e5 sl\u00f8kkje lyset og la naturen pr\u00f8ve seg
  medan huset held meg trygg og varm.\\n\u2013 Ein kvar idiot kan byggje eit hus,
  sa bygningsmannen. Samstundes sa han at ein gjerne treng \u00e5 bygge minst to-tre
  hus for \u00e5 f\u00e5 alt til \u00e5 stemme. Eg veit ikkje om eg er heilt samd
  med det f\u00f8rste. N\u00e5r eg kiker p\u00e5 husbransjen, ser eg at det er ganske
  vanskeleg og krevjande. Og at det er ein del idiotar. Det kan Forbrukarr\u00e5det
  stadfeste. For der er mykje som vert gjort d\u00e5rleg og gale n\u00e5r der skal
  byggjast.\\nN\u00e5r eg sit stille i m\u00f8rkret, tenkjer eg p\u00e5 kor tungt
  det er, alt som er over meg. Ein einebustad med grunnmur veg ofte langt over hundre
  tonn. Materialane skal halde saman, med stor vekt, over tid, og motst\u00e5 regn
  og sterke vindar. Det er slett ikkje sj\u00f8lvsagt at det skal g\u00e5 bra.\\nD\u00e5
  far gjekk i banken\\nAv og til trur folk at eg har greitt med pengar. D\u00e5 seier
  eg at det er berre \u00e5 bli med i banken, s\u00e5 forklarer dei kl\u00e5rt og
  tydeleg kor absolutt veik \u00f8konomi eg har, og at huskj\u00f8p slett ikkje er
  noko for meg.\\nMen pengar m\u00e5 til skal det bli hus. Eller \u00abfinansiering\u00bb
  som bankane og meklarane seier. For n\u00e5r \u00abmarknaden\u00bb stig, er det
  i r\u00f8yndomen gjelda som stig. Ta eit tenkt, men r\u00f8yndomsn\u00e6rt eksempel:
  Son (25) skal inn p\u00e5 bustadmarknaden. Sj\u00f8lvsagt skal han ha ein stad \u00e5
  bu, medan det n\u00e6rast sikre l\u00f8ftet om prisstiging lurer i bakhovudet. Tenk
  \u00e5r 2000: Akkurat som meg, f\u00e5r heller ikkje son (25) noko bustadl\u00e5n
  i banken etter \u00e5 ha surra rundt med studium og deltidsjobbar. Difor m\u00e5
  far (59) kome med sitt nesten nedbetalte hus og stille som trygd, s\u00e5 blir der
  husv\u00e6re i arbeidarblokka fr\u00e5 sekstitalet for son (25), som f\u00e5r gjeld
  p\u00e5 prisen p\u00e5 husv\u00e6ret, ein blank million. Med tida blir \u00e5ret
  2015, og son (25) er no 40 \u00e5r gamal. 15 \u00e5r har g\u00e5tt, og han skal
  selje. Lukkeleg for han har prisen stige til 2,49 millionar, det blir 1,5 millionar
  i gevinst! Husv\u00e6ret blir selt. Den nye kj\u00f8paren har spart i banken i mange
  \u00e5r, f\u00e5tt litt pengar av mor, og arbeider st\u00f8tt og stiller med ein
  halv million i sparekapital, s\u00e5 l\u00e5net blir p\u00e5 berre 80% av takst.
  Alts\u00e5 har gjelda p\u00e5 husv\u00e6ret dobla seg fr\u00e5 ein til to millionar
  i \u00abvekstperioden\u00bb.\\nNordmenn gleder seg over \u00e5 ta ut pengar som
  andre skriv opp i gjeld! Kranglete \u00f8konomar ynskjer ogs\u00e5 \u00e5 f\u00e5
  med rentefr\u00e5drag p\u00e5 skatten og inflasjonsjusteringar, og sosiologen ser
  ein verdi i at son (25) har levd i 15 \u00e5r, men slikt tek ikkje gjeldsberget
  omsut til, det berre veks.\\nD\u00e5 eg gjekk i kjellaren\\nFor noko tid sidan skulle
  eg montere kvitevarer i eit kjellarhusv\u00e6re. Tusenlappane gjekk, men eg s\u00e5g
  berre sm\u00e5pengar samanlikna med bustadgjelda. Derimot fekk eg augo opp for handverkaren.
  Ein god handverkar er avgjerande for at sj\u00f8lve huset og innreiing og monterte
  apparat skal vere trygge, haldbare og p\u00e5litelege. Ein god handverkar ser ofte
  at brukte husv\u00e6re som er p\u00e5 marknaden til h\u00f8ge prisar, er i d\u00e5rleg
  stand.\\nEg gler meg over livsvisdomen eg fekk med meg fr\u00e5 handverkaren: N\u00e5r
  noko ser vanskeleg og krevjande ut, s\u00e5 er det ikkje noko sp\u00f8rsm\u00e5l
  om ein skal gjennomf\u00f8re. Det er berre eit sp\u00f8rsm\u00e5l om kor mykje styr
  og strabasar det medf\u00f8rer \u00e5 f\u00e5 gjennomf\u00f8rt prosjektet.\\nVed
  sj\u00f8lvsyn fann eg ut kor kritisk det er at maskiner og det meste i hushaldet
  st\u00e5r heilt i vater, og dessutan er montert skikkeleg fast. Eg fann ut at ein
  elektrikar og ein r\u00f8yrleggjar alltid finn noko som ikkje er bra i eit halvgammalt
  hus. Men det verste med \u00e5 l\u00e6re \u00e5 montere ei oppvaskmaskin ordentleg
  er at no ser eg knapt nokon andre som er installert p\u00e5 rette m\u00e5ten n\u00e5r
  eg kiker i hus!\\nSaga syng. P\u00e5 polsk!\\nI byggjebransjen har det blitt store
  omveltingar dei siste \u00e5ra. Blant dei gode handverkarane finn vi diverre heile
  salaten av elende ogs\u00e5: D\u00e5rleg utf\u00f8rt arbeid av fagfolk som slett
  ikkje er fagfolk, elendige l\u00f8ner og utbytting av folk, juksing med skatt, moms
  og v\u00e5tromsnormer for ikkje \u00e5 snakke om at ein norsk l\u00e6rling p\u00e5
  yrkesskulen risikerer \u00e5 bli einaste nordmannen i arbeidsgjengen der han bur!
  Ein handverkar, ein t\u00f8mrar og ein ingeni\u00f8r har s\u00e6rt viktige jobbar:
  Dei skal s\u00f8rge for at huset ikkje fell saman og arbeide slik at huseigaren
  gjer ei trygg investering.\\nTalet p\u00e5 klager p\u00e5 bustadbygging har stige
  i fleire omgangar hos Forbrukarr\u00e5det, noko som peikar p\u00e5 d\u00e5rleg informasjon
  fr\u00e5 byggjebransjen og l\u00e5g kunnskap hos bustadkj\u00f8parar. Eg har lyst
  \u00e5 tru p\u00e5 at husbyggjarane ordnar alt, men diverre er det oftast berre
  \u00e5 g\u00e5 i gang med vedlikehaldet, eventuelt klagene, nesten straks etter
  at husv\u00e6ret er innflytta. For det er uhyre komplisert \u00e5 f\u00e5 til ein
  einebustad ordentleg, og slett ikkje noko ein kvar idiot klarer!\\nTenk berre p\u00e5
  veggane: Dei skal tole vind og regn. Dei skal isolere, b\u00e5de ved \u00e5 halde
  varmen fr\u00e5 omnen inne og steiken fr\u00e5 sola ute. Dei skal st\u00e5 st\u00f8tt
  og bere taket, ikkje berre dersom orkanen kjem. Dei m\u00e5 puste slik at treverk
  og m\u00e5ling ikkje f\u00e5r fuktskader. Derimot skal dei ikkje sleppe inn mus
  og andre gjester som gjerne vil p\u00e5 vinteropphald. Og dette gjeld dei enkle
  treveggane. Murveggane er kanskje end\u00e5 verre: Dei skal halde mykje st\u00f8rre
  vekt, og st\u00e5 st\u00f8tt utan \u00e5 f\u00e5 sprekkar. I kjellarvegg m\u00e5
  dei ogs\u00e5 halde rennande vatn ute og st\u00f8 opp om eventuell jordbakke bak.
  I tillegg skal det vere r\u00f8yr for varmt og kaldt vatn inni veggen, pluss straumkablar.
  Noko gode handverkarar f\u00e5r til medan andre produserer reparasjonstingingar.
  Men sj\u00f8lv den beste tek feil stundom: R\u00f8yrleggjaren i huset hos meg bytte
  om p\u00e5 plasseringa av varmt og kaldt vatn!\\nAlt er annleis i Amerika\\nNoreg
  har glimrande tradisjonar for at folk flest skal f\u00e5 h\u00f8ve til \u00e5 oppf\u00f8re
  sine eigne hus. Typehus med Husbankfinansiering er ein av dei vanlege malane.\\nHuset
  eg vaks opp i derimot, f\u00f8lgde langt ifr\u00e5 nokon vanleg mal. Til det var
  her for mange amerikanske b\u00f8ker! Der finst bilete av veggar som ikkje vart
  bygde opp, men snekra ferdig liggande, og s\u00e5 reist opp i store modular, akkurat
  som dei gjer i Amerika. Eg har vakse opp med sentralst\u00f8vsugar, sj\u00f8lvsagt
  ein amerikansk modell som vart spesialimportert f\u00f8r mange nordmenn visst kva
  det eingong var. Og ein hammar for meg kan aldri vere noko anna enn amerikanske
  Estwing. Det blir ikkje god spikring med noko anna.\\nSj\u00f8lvsagt er eg sv\u00e6rt
  stolt av norske hus og norske byggjematerialar. Eg tykkjer at nordmannen skal nytte
  h\u00f8vet til \u00e5 ha lokalproduserte vindauge i huset sitt. Og s\u00e5 trur
  eg det er varmtvasstankar som framleis blir laga i Noreg. Men elles m\u00e5 nok
  nordmannen sj\u00e5 at verda har kome til Noreg. P\u00e5 1970-talet var det sj\u00f8lvsagt
  med leselys fr\u00e5 Osram-lysp\u00e6rer laga i Drammen og husfred framfor Tandberg
  fjernsyn, laga i Oslo, i huset bygd av naboen som var snikkar. No er b\u00e5de byggjematerialane,
  interi\u00f8rvarene og ikkje minst bygningsfolket importerte. Men bustadgjelda,
  den f\u00e5r nordmannen sitje med i Noreg.\\nEg m\u00e5 f\u00e5 bu\\nFor meg har
  ein ryddig hybel p\u00e5 15 kvadratmeter gjeve nok funksjon og buglede. Det er skilnad
  p\u00e5 kva ein treng og kva ein ynskjer. \u00abEin skal jo bu\u00bb var det ein
  kar som sa, d\u00e5 det var snakk om l\u00f8nsbetalingar og privat\u00f8konomi.
  \u00abEin skal jo bu\u00bb tenkte eg d\u00e5 eg s\u00e5g bilete av slottet i Versailles
  og h\u00f8yrde historier om solkongen.\\nOm ein tenkjer globalt og b\u00e6rekraftig
  er det absurd med norske einebustader. S\u00e5 lite som ein person kan bu ein stad
  som krev over hundre tonn byggjematerialar for \u00e5 bli oppf\u00f8rt. St\u00f8rre
  bustader krev meir oppvarming, tek opp store areal som kunne vore brukt til gras
  sog fotosyntese, og inneheld mengder av giftig m\u00e5ling, plast og kjemikaliar.
  For naturmilj\u00f8et si skuld er det truleg best at menneska bur i sm\u00e5 einingar
  i h\u00f8ge blokkhusv\u00e6re, med trikkeskinner utanfor d\u00f8ra. For bumilj\u00f8et
  si skuld derimot, er gr\u00e5 betongkolossar ikkje bra. Med mindre dei utgjer f\u00f8rste
  etasje av velplasserte einebustader.\\nEg liker \u00e5 bu. Det er eit poeng \u00e5
  ha avstand til naboen. Det er eit poeng \u00e5 ha alt ein treng inni huset. P\u00e5
  1950-talet m\u00e5tte ein ut av huset for \u00e5 vaske klede, ut for \u00e5 hente
  noko i bygdefrysaren og ut for \u00e5 handle avisa.\\nDet gjev meg glede \u00e5
  bu. Eg liker at regnet pr\u00f8ver seg medan golvet inne, som ligg under bakkeplan,
  er t\u00f8rt. Eg liker at vinden held seg ute. Og eg gler meg over at taket held
  seg oppe. Faktisk tenkjer eg meir p\u00e5 korleis m\u00e5linga kjem til \u00e5 klare
  \u00e5 halde seg p\u00e5 veggen enn p\u00e5 utviklinga i bustadmarknaden. For huset
  gjer seg langt betre som ein boks i regnet enn som ein boks i banken.\\nTekst: Alexander
  Kemp \u2013 Send mail\\nFoto: www.dagbladet.no\\nV\u00e6r den f\u00f8rste til \u00e5
  kommentere\"", "\"Trainee-stillinga er lagt til stabsseksjonen med tenestestad F\u00f8rde
  hos Avdeling for kultur, idrett og inkludering. Staben sine hovudoppg\u00e5ver er
  innan \u00f8konomi, innkj\u00f8p, HR, kommunikasjon og dokumentbehandling.\\nStaben
  samordnar og gir retning for avdelinga sitt arbeid med fellesoppg\u00e5ver og oppg\u00e5ver
  som elles ikkje fell inn under dei enkelte fagseksjonane. Andre viktige oppg\u00e5ver
  er tilskotsforvaltning.\\nVidare har staben som eit av hovudm\u00e5la \u00e5 avlaste
  og forenkle drifta i linja. D\u00f8me p\u00e5 slike oppg\u00e5ver er felles \u00f8konomistyring
  av rekneskap og budsjett, post/arkivtenester og st\u00f8tte linjeleiarane i rekrutteringsprosessar.
  Staben skal sj\u00e5 til at aktuelle rutinar og regelverk vert ivareteke, syte for
  tilskotsoppf\u00f8lging og st\u00f8tte arbeidet med bruk av elektroniske verkt\u00f8y,
  og sj\u00e5 til at dette vert f\u00f8lgd opp i samsvar med gjeldande retningsliner.\\nSom
  deltakar i traineeprogrammet til Framtidsfylket f\u00e5r du\\nDu vil jobbe som trainee
  hos oss i eitt \u00e5r \u2013 fr\u00e5 august 2022 til august 2023.\\nAdministrasjonsm\u00e5let
  i fylkeskommunen er nynorsk.\\nAlle nytilsetjingar vert gjort med ei pr\u00f8vetid
  p\u00e5 6 m\u00e5nader.\\nVi gjer merksam p\u00e5 at i f\u00f8lgje offentleglova
  \u00a7 25, 2. ledd kan opplysningar om s\u00f8kjaren bli offentleggjort sj\u00f8lv
  om du har oppmoda om ikkje \u00e5 bli f\u00f8rt p\u00e5 offentleg s\u00f8kjarliste.
  Dersom du har bedt om unntak fr\u00e5 offentleg s\u00f8kjarliste vil du alltid bli
  varsla f\u00f8r s\u00f8kjarlista vert offentleggjort.\"", "\"Advokat Kristine Geirsdatter
  Celius\\nAdvokat Kristine G. Celius (f.1986) fr\u00e5 Trondheim. Ho har Master i
  rettsvitskap fr\u00e5 Universitetet i Oslo, 2011, og fekk advokatbevilling i 2015.\\nKristine
  har erfaring som advokatfullmektig i tvisteavdelinga hj\u00e5 Advokatfirmaet Thommessen
  i Oslo, som en del av immaterialretts-, media- og marknadsf\u00f8ringsgruppa, samt
  tre \u00e5r som dommarfullmektig i Sogn Tingrett.\\nHj\u00e5 Advokatfirmaet Tollfesen
  vil Kristine i hovudsak arbeide med bistandsoppdrag, straff-, arv- og familierett,
  men ho tek i mot alle typar saker.\\nKristine er vikar for Advokat Silje Flugheim
  Heggestad.\\nArbeidsomr\u00e5der:\\nStrafferett, herunder b\u00e5de oppdrag som
  forsvarer og bistand til forn\u00e6rma i straffesaker.\\nAvtale og kontraktsrett\\nFamilie-
  og arverett\\nImmaterialrett\\nArbeidsrett\\nErstatningsrett\"", "\"Ekspertar gav
  r\u00e5d til UD\\nI eit eige m\u00f8te om biologisk mangfald i verdshava gav forskarar
  og andre akt\u00f8rar verdifulle r\u00e5d til Utanriksdepartementet f\u00f8r viktige
  forhandlingar i FN om regulering av ressursutnytting p\u00e5 det opne hav.\\nUtanriksdepartementet
  bes\u00f8kte Universitetet i Bergen for \u00e5 f\u00e5 r\u00e5d fr\u00e5 forskarar
  og ulike organisasjonar om dei s\u00e5kalla BBNJ-forhandlingane, som no g\u00e5r
  inn i sin sluttfase. BBNJ er ei forkorting av biodiversity beyond national jurisdiction
  og er eit tillegg til Havrettstraktaten (UNCLOS), som Norge i si tid var p\u00e5drivar
  for \u00e5 f\u00e5 etablert.\\nUD vil ha innspel i breidda\\n\u2013 Forhandlingsdelegasjonen
  til BBNJ har etablert ei referansegruppe, som er sett saman av aktuelle forskarar
  og interesserte akt\u00f8rar fr\u00e5 n\u00e6ringsliv, frivillige organisasjonar
  og fleire for \u00e5 sikre innspel i prosessen, seier professor Sigrid Eskeland
  Sch\u00fctz fr\u00e5 Det juridiske fakultet p\u00e5 Universitetet i Bergen. Ho er
  ekspert p\u00e5 forvaltning av havomr\u00e5der, spesielt i kystsonen, og har arbeidet
  p\u00e5 dette feltet b\u00e5de nasjonalt og internasjonalt i ei rekke \u00e5r.\\nM\u00f8tet
  5. mars p\u00e5 Det juridiske fakultet ved Universitetet i Bergen var det tredje
  m\u00f8tet med referansegruppa. M\u00f8tet var ope for alle med interesse. Tidlegare
  har det vore m\u00f8te p\u00e5 Det juridiske fakultet ved Universitetet i Oslo og
  p\u00e5 Norsk senter for havrett ved Universitetet i Troms\u00f8.\\n\u2013 M\u00f8ta
  har hatt ein open del, der delegasjonen har orientert om forhandlingane og arbeidet
  der, og ein spissa del, der s\u00e6rlege tema i forhandlingane har st\u00e5tt i
  fokus, fortel Sch\u00fctz.\\n\u2013 I den opne delen i Bergen orienterte statssekret\u00e6r
  Jens Fr\u00f8lich Holte om Norge sine hovudprioriteringar i forhandlingane, og Kjell
  Kristian Egge (spesialr\u00e5dgjevar om internasjonal rett i Utanriksdepartementet)
  om status f\u00f8r neste forhandlingsrunde.\\nMange sp\u00f8rsm\u00e5l vart diskutert\\nIf\u00f8lgje
  jussprofessoren gjaldt den spissa delen i Bergen Kunnskap i havforvaltning, der
  det var stilt sp\u00f8rsm\u00e5l av typen: Korleis sikre at kunnskap leggjast vekt
  p\u00e5 i ein eventuell global organisasjon? Korleis unng\u00e5 at forskinga politiserast?
  Vil etablering av ein vitskapleg komit\u00e9 fremje kunnskapsbasert havforvaltning?
  Kan vi dra vekslar p\u00e5 erfaringar fr\u00e5 andre fora? Og om konsekvensanalyser:
  Er utkastets avgjerder om konsekvensanalysar form\u00e5lstenlege?\\nDeretter var
  det ope for innspel og sp\u00f8rsm\u00e5l fr\u00e5 salen. Her kom akt\u00f8rar som
  mellom anna Fiskeb\u00e5t, Norges Rederiforbund og Greenpeace med sine synspunkt.\\nFramleis
  er mykje ope i forhandlingane om det ope hav. Noko ogs\u00e5 fleire av dei framm\u00f8tte
  peika p\u00e5.\\n\u2013 Diskusjonen r\u00f8rte meir overordna ved kva stilling ulike
  statar har til sentrale punkt i avtalen. Sp\u00f8rsm\u00e5let om det er truleg at
  ein kan n\u00e5 ein avtale i det heile, vart kommentert p\u00e5 av Egge. Han understreka
  at sj\u00f8lv om det framleis er mange alternativ p\u00e5 bordet, er det nok slik
  at om visse sentrale sp\u00f8rsm\u00e5l fell p\u00e5 plass, vil mange av dei andre
  underliggjande problemstillingane l\u00f8yse seg, fortel Sch\u00fctz.\\nMange innspel
  av ulik art\\nInnspela var mange og ulike if\u00f8lge jussprofessoren.\\n\u2013
  Alt fr\u00e5 erfaringar med m\u00e5tar \u00e5 organisere havforsking og kunnskap
  p\u00e5 i ulike organisasjonar til m\u00e5tar \u00e5 sikre urfolkskunnskap, med
  potensiale for \u00e5 verifiserast vitskapleg, i prosessane. Det var \u00f2g synspunkt
  p\u00e5 kva som er f\u00f8rem\u00e5lstenlege m\u00e5tar \u00e5 organisere arbeid
  med konsekvensutgreiingar p\u00e5, b\u00e5de om det b\u00f8r vere flaggstaten som
  gjennomf\u00f8rer slike, staten der operat\u00f8ren har registrert sitt selskap
  eller ein s\u00e6rleg oppnemnt myndighet, seier ho.\\n\u2013 Det vart av fleire
  peika p\u00e5 at utkastet er svakt kva gjeld strategiske konsekvensutgreiingar og
  skissert korleis reglane kan sl\u00e5 sv\u00e6rt forskjellig ut, illustrert ved
  to moglege alternative scenario, bygd p\u00e5 eit utval av forslag til konsekvensutgreiingar
  i traktatutkastet.\\nSistnemnte innspel var det Sch\u00fctz sj\u00f8lv som bidrog
  med basert p\u00e5 eiga forsking om marin forvalting.\\nAvslutningsvis takka Egge
  p\u00e5 vegne av forhandlingsdelegasjonen forskarfellesskapet for innspel undervegs
  i prosessen, og understreka betydinga av \u00e5 kunne dra p\u00e5 eit st\u00f8rre
  fagfellesskap i arbeidet med \u00e5 sikre ein BBNJ-avtale.\\nVirtuelt senter for
  berekraftig hav\\nProfessor Sigrid Sch\u00fctz er eit av dei vitskaplege medlemmane
  av Ocean Sustainability Bergen, eit virtuelt senter for havforsking ved Universitetet
  i Bergen og som drifter universitetets oppg\u00e5ver knytt til berekraftsm\u00e5l
  14, Liv under vatn.\"", "\"Under leiing av Pratap Bhanu Mehta, har Holbergkomit\u00e9en
  hatt ein krevjande jobb med \u00e5 velje ut dei beste kandidatane etter at nominasjonsfristen
  for Holbergprisen 2018 gjekk ut i midten av juni. F\u00f8r fristen har det kome
  inn i alt 87 nominasjonar, p\u00e5 81 unike kandidatar, eit tal som ligg litt over
  snittet samanlikna med tidlegare \u00e5r. Geografisk har eit stort fleirtal av dei
  nominerte kandidatane bakgrunn fr\u00e5 akademiske milj\u00f8 i Nord-Amerika og
  Europa, skj\u00f8nt mange av desse \u00f2g har band til institusjonar i andre delar
  av verda.\\nI grovinndeling er det flest kandidatar fr\u00e5 humaniora og samfunnsvitskapane,
  dette ogs\u00e5 i tr\u00e5d med trenden ein har sett tidlegare \u00e5r.\\nKortlista
  er klar - kva skjer vidare?\\nMedlemmane i Holbergkomit\u00e9en er internasjonalt
  anerkjende forskarar innanfor dei fagdisiplinane prisen dekkjer. Sekretariatet st\u00f8ttar
  arbeidet deira praktisk, men komit\u00e9en st\u00e5r elles heilt uavhengig i si
  faglege vurdering av kandidatane. Etter at komit\u00e9en no har kome fram til ei
  kortliste, er neste ledd i prosessen at det blir innhenta fagfellerapportar for
  kandidatane. Rapportane blir skrivne av andre respekterte forskarar med meir spesialisert
  kjennskap til dei ulike kandidatane sine forskningsfelt. Komit\u00e9en fortsetter
  sitt arbeid utover hausten, blant anna med bakgrunn i rapportane, men \u00f2g anna
  dokumentasjon.\\nKomit\u00e9en m\u00f8test igjen i midten av februar og fattar d\u00e5
  sitt endelege val om kven dei vil tilr\u00e5de som mottakar av prisen. Holbergprisen
  sitt styre veljer holbergprisvinnar p\u00e5 bakgrunn av komit\u00e9en si tilr\u00e5ding
  kort tid etter. Kunngjeringa skjer i midten av mars og blir direktesendt her p\u00e5
  nettsida.\\nNye moglegheiter i 2019\\nAlle vitskapleg tilsette ved forskingsinstitusjonar
  eller akademi kan nominere kandidatar til Holbergprisen og Nils Klim-prisen. Veit
  du om ein aktuell kandidat? Meir informasjon om nominasjonsprosessen for Holbergprisen
