  deltakarane/ f\u00f8relesarane kan sj\u00e5.\"", "\"1 HORDALAND FYLKESKOMMUNE Regionalavdelinga
  Planseksjonen Arkivsak Arkivnr. 714 Saksh. Vinje, Signe; Austrheim, Gunnbj\u00f8rg;
  R\u00f8dseth, Marit; Ekerhovd, Per Morten Saksgang M\u00f8tedato Kultur- og ressursutvalet
  OMR\u00c5DEPLAN FOR VANGEN VEST - FLEISCHER HOTELL, VOSS KOMMUNE SAMANDRAG Voss
  kommune har sendt forslag til omr\u00e5dereguleringsplan for Vangen Vest Fleischers
  hotell p\u00e5 h\u00f8yring. Planen legg til rette for ei vesentleg utbygging av
  omr\u00e5det mellom Fleischers hotell til avishuset til Avisa Hordaland, og opnar
  for bustader, parkering, gondolbanestasjon og sentrumsf\u00f8rem\u00e5l. Tilrettelegging
  for kvalitetsmessig utvikling av omr\u00e5da vil vere positivt med tanke p\u00e5
  prinsippet om samordna areal- og transportplanlegging. Det er kort gangavstand til
  sentrum og kollektivterminal. Planforslaget f\u00e5r konsekvensar for regionale
  interesser knytt til sentrumsutvikling, landskap og kulturminne. Fylkesr\u00e5dmannen
  foresl\u00e5r motsegn knytt til: - Tilrettelegging for detaljhandel i omr\u00e5de
  S01. Detaljhandel i dette omr\u00e5det vil kunne endre tyngdepunktet i dagens sentrum
  og verke negativt p\u00e5 Vossavangen som regionsenter. Arealf\u00f8rem\u00e5l eller
  f\u00f8resegner m\u00e5 endrast slik at det ikkje blir opna for detaljhandel. -
  Omfang av utbygginga i BB Det store utbyggingsomfanget vil f\u00e5 vesentlege konsekvensar
  for regionale interesser som landskap, byutvikling og det heilskapelege kulturmilj\u00f8et
  p\u00e5 Vangen. Utnyttingsgraden og byggjeh\u00f8gdene m\u00e5 reduserast i f\u00f8resegnene.
  - Flytting og riving av det SEFRAK-registrerte Grovendalshuset og \u00abvetlehuset\u00bb,
  som har h\u00f8g nasjonal og regional kulturminneverdi. Planforslaget f\u00f8rer
  til endringar som r\u00e5kar kyss- og k\u00f8yrl\u00f8ysinga i omr\u00e5deplan for
  kollektivknutepunkt Voss. Fylkesr\u00e5dmannen vurderer at koplingane mellom desse
  to planane ikkje er godt nok gjennomarbeida og oppmodar om at den vidare planprosessen
  m\u00e5 avklare kva l\u00f8ysingar som er mest optimale.\\n2 D\u00e5 formannskapet
  i Voss kommune vedtok \u00e5 sende omr\u00e5deplan for Vangen Vest p\u00e5 h\u00f8yring,
  blei det ogs\u00e5 vedteke justeringar i planforslaget som i stor grad sikrar fylkeskommunens
  interesser. Kultur- og ressursutvalet m\u00e5 likevel ta utgangspunk i dei dokumenta
  som er lagt ut p\u00e5 h\u00f8yring, der det er konflikt med dei nemnde regionale
  interessene. Hordaland fylkeskommune har vore i m\u00f8te med Voss kommune og plankonsulent,
  utan at det f\u00f8rte til konkrete l\u00f8ysingar. FORSLAG TIL VEDTAK 1. Hordaland
  fylkeskommune er positiv til utvikling av omr\u00e5det vest for regionsenteret Vossavangen.
  Tilrettelegging for bustader er i tr\u00e5d med prinsippet om samordna areal- og
  transportplanlegging. 2. Planforslaget f\u00e5r negative konsekvensar for sentrumsutvikling
  og kulturminne og kulturmilj\u00f8 med h\u00f8g nasjonal og regional verdi. a. Omfang
  av blokkene i BB01 til BB04 er ikkje tilpassa omr\u00e5dekarakteren p\u00e5 Vangen
  og vil redusere oppelvinga av einskilde kulturminne og det samla kulturmilj\u00f8et
  p\u00e5 Vangen. Utnyttingsgraden og byggjeh\u00f8gde m\u00e5 reduserast i f\u00f8resegnene.
  b. Nedre stasjon for gondolen Hangursbanen kjem i konflikt med det verneverdige
  Grovendalshuset. Planen m\u00e5 endrast slik at Grovendalshuset og dei tilh\u00f8yrande
  husa blir liggande i sitt opphavlege milj\u00f8. Hordaland fylkeskommune fremmar
  motsegn til punkt a-b 3. Tilrettelegging for handelsf\u00f8rem\u00e5l i S01 vil
  svekke Vangen som regionsenter. Arealf\u00f8rem\u00e5l eller f\u00f8resegner m\u00e5
  endrast slik at det ikkje blir opna for detaljhandel. Hordaland fylkeskommune fremmar
  motsegn til dette punktet 4. Planforslaget f\u00f8rer til endringar som r\u00e5kar
  kyss-og-k\u00f8yrl\u00f8ysinga og trafikkm\u00f8nsteret i knutepunktsplanen. Det
  m\u00e5 sikrast meir optimale koplingar mellom knutepunktplanen og omr\u00e5deplan
  for Vangen Vest. Rune Haugsdal Fylkesr\u00e5dmann B\u00e5rd Sandal Regionaldirekt\u00f8r
  Vedlegg: Plankart og f\u00f8resegner 2\\n3 FYLKESR\u00c5DMANNEN, : 1. Bakgrunn Voss
  kommune har sendt omr\u00e5dereguleringsplan for Vangen Vest Fleischers Hotell p\u00e5
  h\u00f8yring med frist 9. september Fylkeskommunen har f\u00e5tt utsett frist grunna
  politisk handsaming til handsaming i oktoberm\u00f8tet i Kultur- og ressursutvalet.
  Hordaland fylkeskommune vurderer planen ut i fr\u00e5 fylkeskommunens sektoransvar
  og m\u00e5lsettingar i regionale planar. Kultur- og ressursutvalet har h\u00f8ve
  til \u00e5 gje motsegn til planen dersom viktige regionale og nasjonale interesser
  st\u00e5r p\u00e5 spel. N\u00e5r motsegn blir fremma m\u00e5 kommunen endre planen,
  som regel etter \u00e5 ha dr\u00f8fta problemstillingar og l\u00f8ysingar i m\u00f8te
  med fylkeskommunen. Dei fleste motsegnene blir avklart i m\u00f8te med kommunen,
  men dersom det ikkje blir semje vil planen g\u00e5 til mekling hos Fylkesmannen
  i Hordaland. I denne saka blir det gjeve fagleg tilr\u00e5ding om motsegn p\u00e5
  bakgrunn av nasjonale kulturminneinteresser. Dersom dette ikkje blir fylgt opp av
  politiske organ i fylkeskommunen, skal fylkeskommunen gje melding om dette til Riksantikvaren
  som kan fremje motsegn i saka. (jf. Forskrift til Kulturminnelova kap. 1, 3) 1.1
  Planprosess og medverknad Hordaland fylkeskommune har gitt innspel til oppstartmeldinga
  i brev av 12. og 26. juni I fr\u00e5segna skreiv fylkeskommunen at fokus p\u00e5
  den heilskaplege planlegginga var viktig, og at dette planarbeidet derfor m\u00e5tte
  bli sett i samanheng med andre store planarbeid, som Voss knutepunkt og planen for
  gangveg langs Vangsvatnet. I tillegg bad fylkeskommunen om at det blei teke omsyn
  til n\u00e6ringsutvikling, estetikk, landskapstilpassing, trafikktilh\u00f8va og
  gr\u00f8ntanlegg. Planforslaget som er p\u00e5 h\u00f8yring er i konflikt med nyare
  tids kulturminne, landskap og sentrumsutvikling p\u00e5 Vossavangen. Hordaland fylkeskommune
  hadde m\u00f8te med Voss kommune og plankonsulent 29. august 2013 for \u00e5 avklare
  konfliktane, men det har ikkje blitt mogleg \u00e5 endre planforslaget innanfor
  dei gitte tidsrammene. Etter avtale med Voss kommune handsamar Hordaland fylkeskommune
  det opphavlege planforslaget som blei sendt p\u00e5 h\u00f8yring. 2. Innhald i planen
  I det f\u00f8lgjande blir innhaldet av planen kort referert. Planen best\u00e5r
  av f\u00f8lgjande dokument: - Planomtale - F\u00f8resegner (juridisk bindande) -
  Plankart (juridisk bindande) Planomr\u00e5det ligg mellom Voss kulturhus i aust
  og bygget til Avisa Hordaland i Vest, og ligg mellom jernbanen og Vangsvatnet. Sj\u00e5
  figur. Fleischer hotell er grunneigar av store delar av planomr\u00e5det og er tiltakshavar
  av planen. I kommuneplanen er omr\u00e5det sett av til n\u00e6ring og jernbane.
  Planforslaget er ikkje i samsvar med kommuneplanen n\u00e5r det gjeld bustader.
  3\\n4 Figur 1: Planomr\u00e5det ligg i vestkanten av Vossavangen (oransje omr\u00e5de)
  Figur 2: Planorm\u00e5det (raud stipla linje) med dagens aktivitetar Som det g\u00e5r
  fram av plankartet (vedlegg 1) legg planen opp til \u00e5: - Rive dei noverande
  motellbygga og byggje konsentrerte bustader i blokk(bb01-04) p\u00e5 den austlege
  delen. Det er lagt opp til bueiningar i fire blokkar som er mellom 4 til 7 etasjar
  (16 til 23 meter) h\u00f8ge, med ein utnyttingsgrad p\u00e5 150% BRA. - Leggje til
  rette for sentrumsf\u00f8rem\u00e5l (S01) p\u00e5 den vestlege delen av motelltomta.
  Utnyttingsgraden blir 250% BRA, og bygningar som er ca meter h\u00f8ge. Det er opna
  for handel, tenesteyting, bustader, kontor, hotell/overnatting, servering og gr\u00f8ntareal.
  Det skal ikkje leggjast til rette for handel med plasskrevjande varer. Det er sett
  krav om detaljregulering. 4\\n5 - Leggje E16 i ein boge lenger s\u00f8r for Fleischers
  hotell for \u00e5 gjere det mogleg \u00e5 utvide hotelldrifta i framkant. Det f\u00f8rer
  til at Fleischer hotell f\u00e5r vegtilkomst til den nye inngangen og kyss- og k\u00f8yrl\u00f8ysingane
  som er vedteke i omr\u00e5deplanen for kollektivknutepunkt Voss stasjon (fr\u00e5
  no: knutepunktsplanen) blir endra. - Etablere parkeringshus (PH/N01) med h\u00f8ve
  til kontorlokale i etasjane over, p\u00e5 arealet som i dag parkeringsplass vest
  for Fleischers hotell. Det skal bli til saman tre etasjar med parkering, to etasjar
  under bakken og ei etasje p\u00e5 bakkeniv\u00e5. Til saman er det opna for eit
  bygg p\u00e5 inntil 15 etasjar. Utnyttingsgraden ligg p\u00e5 80% BYA. - Rive Grovendalshuset
  for \u00e5 leggje til rette for nedre stasjon til gondolbanen Hangursbanen (ST01).
  Dette blir eit alternativ til knutepunktsplanen, som ogs\u00e5 regulerer inn Hangursbanens
  nedre stasjon. Det er sett krav om detaljregulering. - Rive einebustader mellom
  vegen og jernbanelinja for \u00e5 fortette med konsentrerte bustader (BB05). Planen
  legg opp til ei byggjeh\u00f8gd p\u00e5 16 meter. Det er sett krav om detaljregulering.
  - Leggje til rette for ny detaljreguleringsplan for Avisa Hordaland (N/T/K01). Samstundes
  med at formannskapet i Voss kommune vedtok \u00e5 sende planen p\u00e5 h\u00f8yring,
  blei det \u00f2g gjort vedtak om: - \u00c5 ikkje opne for forretningsf\u00f8rem\u00e5l
  i sentrumsomr\u00e5det S01 - \u00c5 ikkje gjere endringar p\u00e5 kyss- og k\u00f8yrl\u00f8ysingane
  som er vedteke i knutepunktsplanen - \u00c5 redusere volum og byggjeh\u00f8gder
  i S01 - \u00c5 omarbeide bustadprosjektet BB01 til BB04 for \u00e5 ivareta siktliner
  til vangsvatnet, samt redusere byggjeh\u00f8gdene og volum. - Endestasjon for gondolbanen
  skal liggje som planlagt i knutepunktsplanen, og m\u00e5 derfor bli teke ut av dette
  planforslaget. Desse politiske vedtaka vil gjere store endringar i planen. Hordaland
  fylkeskommune m\u00e5 ta stilling til dei dokumenta som er lagt p\u00e5 h\u00f8yring,
  men kan merkje seg at det i stor grad er samsvar mellom Voss kommune og fylkeskommunen
  sine vurderingar. 2.1 Tidlegare handsaming i Kultur- og ressursutvalet Knutepunktsplanen
  blei handsama i Kultur- og ressursutvalet 7. februar N\u00e5r det gjeld kulturmilj\u00f8
  er problemstillingane i denne plansaka samanfallande med Knutepunktsplanen. Vedtaket
  fr\u00e5 Kultur- og ressursutvalet 7. februar 2012 var slik: \u00abPlanforslaget
  kjem p\u00e5 enkelte punkt i strid med regionale og nasjonale kulturminneomsyn.
  For \u00e5 sikre vidare samarbeid p\u00e5 regionalt niv\u00e5 for \u00e5 finne omforeina
  l\u00f8ysingar, blir det fremja motsegn til planforslaget ut i fr\u00e5 f\u00f8lgjande:
  a) Dei framlagde planane vil redusere opplevinga av det einskilde kulturminne og
  det samla kulturmilj\u00f8 p\u00e5 Vangen. Volum og h\u00f8gde m\u00e5 reduserast
  slik at ein sikrar betre ballanse mellom eksisterande kulturmilj\u00f8 og bygningsmasse.\u00bb
  I etterkant av motsegnsvedetaket har partane i samr\u00e5d funne l\u00f8ysingar
  som b\u00e5de er tilfredstillande for knutepunktplanen og kulturmilj\u00f8et p\u00e5
  Vangen. Motsegna blei offisielt trekt i januar\\n6 3. Vurdering av regionale interesser
  I dette avsnittet vurderer vi korleis regionale interesser ivaretatt i planen. Planforslaget
  f\u00e5r konsekvensar for regionale interesser n\u00e5r det gjeld kulturminne, sentrumsutvikling,
  landskapstilpassing og samferdsel. 3.1 Samordna areal og transport Planen legg opp
  til ei fortetting av hovudinnfarts\u00e5ra til Vossavangen. Ut i fr\u00e5 prinsippet
  om samordna areal- og transportplanlegging vil ei fortetting og utnytting av planomr\u00e5det
  vere gunstig. Det er gangavstand b\u00e5de til sentrum og til kollektivknutepunkt.
  Det er knapt med areal som eignar seg for fortetting av bustader i n\u00e6rleiken
  av Vossavangen. Hordaland fylkeskommune er derfor i prinsippet positive til at planen
  legg til rette for bustader, sj\u00f8lv om dette ikkje er i samsvar med kommuneplanen.
  3.2 Senterutvikling Voss har funksjon som regionsenter. \u00c5 styrkje regionsentera
  p\u00e5 ein heilskapleg m\u00e5te er eit viktig prinsipp som er nedfelt b\u00e5de
  i Fylkesplanen, Fylkesdelplan for senterstruktur og lokalisering av service og handel
  (senterplanen) og i planprogrammet i rulleringa av senterplanen. Planforslaget legg
  opp til \u00e5 leggje til rette for detaljhandel i sentrumsomr\u00e5det S01. Tilrettelegging
  for meir detaljhandel vest for Fleischers hotell kan f\u00f8re til at Vossavangen
  f\u00e5r eit breiare og meir variert tilbod av handelsvarer. Samstundes vil det
  f\u00f8re til at sentrum blir strekt ut i omr\u00e5de der det i dag ikkje er handelsverksemd.
  For at Vossavangen skal bli styrk av dei nye handelsetableringane som planforslaget
  legg opp til, er det ein f\u00f8resetnad at kundegrunnlaget er s\u00e5 stort at
  nye etableringar ikkje f\u00e5r negative konsekvensar for resten av sentrum. Voss
  kommune hevdar at det ikkje er stort nok kundegrunnlag til \u00e5 tole ei handelsutviding
  som planforslaget legg opp til. Planforslaget vil s\u00e5leis kunne svekke Vossavangen
  som regionsenter. Sentrumsomr\u00e5det S01 ligg p\u00e5 ei sv\u00e6rt sentral tomt.
  Planen legg til rette for f\u00f8rem\u00e5let \u00absentrumsomr\u00e5de\u00bb, som
  inneheld sv\u00e6rt mange ulike aktivitetar mellom anna bustad, n\u00e6ring, handel,
  kontor og tenester. Det lite spesifikke f\u00f8rem\u00e5let gjer at kommunen mistar
  styring p\u00e5 korleis omr\u00e5det skal utviklast. Voss kommune b\u00f8r derfor
  vurdere andre f\u00f8rem\u00e5l for \u00e5 gje tydlegare f\u00f8ringar for den framtidige
  arealbruken p\u00e5 den sentrale tomta. Av omsyn til Vossavangen som sentrumsomr\u00e5de
  foresl\u00e5r fylkesr\u00e5dmannen motsegn til planforslaget. For at motsegna skal
  trekkjast m\u00e5 f\u00f8resegnene endrast slik at sentrumsomr\u00e5det ikkje opnar
  for detaljhandel. 3.3 Heilskapleg utvikling Dei arealpolitiske retningslinene i
  Fylkesplan for Hordaland seier at \u00abNye tiltak skal tilf\u00f8re staden estetiske
  kvalitetar og styrkja staden sin karakter. ( )\u00bb. P\u00e5 Voss er arkitektur
  og utforming sterkt knytt til b\u00e5de omsynet til kulturminne og til sentrumsutvikling.
  Dette m\u00e5 bli sett i samanheng. Planen legg opp til ei sv\u00e6rt omfattande
  utbygging, og i dei f\u00f8lgjande kapitla blir det gjort greie for konsekvensane
  for landskap, estetikk og arkitektur og kulturminne. Med bakgrunn i desse omsyna
  foresl\u00e5r fylkesr\u00e5dmannens motsegn til volum og byggjeh\u00f8gder i omr\u00e5de
  BB Estetikk og arkitektur Planen opnar for ei omfattande utbygging, b\u00e5de i
  volum og i h\u00f8gder. Desse og kan f\u00e5 konsekvensar for bukvalitet i omr\u00e5da
  bakanfor og for opplevinga av Vossavangen for dei som bur og oppheld seg i omr\u00e5det.
  6\\n7 Forslaget til reguleringsplan, med bygningar p\u00e5 mellom 16 og 23 meter
  ligg i eit omr\u00e5de som er sv\u00e6rt synleg -det er inngangsporten til Vossavangen
  for alle som kjem k\u00f8yrande fr\u00e5 vest p\u00e5 E16, og plasseringa mot Vangsvatnet
  gjer at det blir sv\u00e6rt synleg fr\u00e5 b\u00e5de fr\u00e5 sentrum, utbygginga
  ovanfor og fr\u00e5 omgjevnadene rundt store delar Vangsvatnet. Figur 3: Fasade
  sett fr\u00e5 Vangsvatnet Figur 3 ovanfor viser korleis bygningane vil framst\u00e5
  fr\u00e5 Vangsvatnet. Ei s\u00e5 tett og h\u00f8g utbygging vil f\u00e5 konsekvensar
  for den visuelle kontakten til Vangsvatnet for dei som ferdast og bur bakanfor utbyggingsomr\u00e5det.
  M\u00e5ten bygningane er plassert p\u00e5 tomta stengjer for siktlinene til Vangsvatnet,
  b\u00e5de fr\u00e5 vegen men \u00f2g fr\u00e5 bustadomr\u00e5da i bakkant (sj\u00e5
  figur 4 p\u00e5 neste side). Tiltaket f\u00f8rer ikkje berre til ein dominerande
  n\u00e6rverknad. Fjernverknaden vil ogs\u00e5 vere vesentleg. Plasseringa mot Vangsvatnet
  (sj\u00e5 figur 2) gjer at det blir sv\u00e6rt synleg b\u00e5de fr\u00e5 sentrum,
  fr\u00e5 Hanguren eit friluftsomr\u00e5de med sv\u00e6rt h\u00f8g regional verdi,
  og fr\u00e5 store delar av omgjevnadene langs Vangsvatnet. 7\\n8 Figur 4: Siktliner
  fr\u00e5 Evangervegen E16 til Vangsvatnet Planforslaget inneber tiltak som bryt
  vesentleg med dei eksisterande dimensjonane i bygningsmilj\u00f8et p\u00e5 Vangen.
  Det er lagt opp til store tomter, utbygging i stort omfang, b\u00e5de i volum og
  h\u00f8gder. Sj\u00f8lv om det i utgangspunktet er positivt med tilrettelegging
  av bustader i n\u00e6rleiken av Vossavangen, er det sv\u00e6rt viktig at planen
  tilf\u00f8rer kvalitetar b\u00e5de for sentrumsomr\u00e5det, dei nye bustadene og
  for bustadene og landskapet i kring. Av omsyn til landskapsomsyn, folkehelse og
  sentrumsutvikling foresl\u00e5r fylkesr\u00e5dmannen motsegn til byggjeh\u00f8gder
  og volum i omr\u00e5de BB Kulturminne og kulturmilj\u00f8 Kulturmilj\u00f8 Vossavangen
  er eit kulturmilj\u00f8 med nasjonal kulturminneverdi, jf Riksantikvaren sitt NB-register.
  Tettstaden er ogs\u00e5 ein av dei eldste stasjonsbyane i Noreg. I planomr\u00e5det
  og influensomr\u00e5de finst det fleire kulturminne og kulturmilj\u00f8 med h\u00f8g
  verdi. Desse bygningane/ kulturminna ligg framleis i sin opphavlege samanheng. Planforslaget
  kan f\u00e5 store konsekvensar for oppleving av disse og for tettstaden Vangen som
  heilskap. Skala, utforming og arkitektoniske kvalitetar vil derfor vere s\u00e6rleg
  viktig. Innanfor planomr\u00e5det er det registrert 5 SEFRAK- bygningar og andre
  bygningar som Fleischer hotell, som har kulturminneverdi. Planforslaget inneber
  tiltak, som bryt vesentleg med dei eksisterande dimensjonane i bygningsmilj\u00f8et
  p\u00e5 Vangen. Det er lagt opp til utbygging i stort omfang med store tomter, b\u00e5de
  i volum og h\u00f8gder. Det er viktig \u00e5 ta omsyn til tilpassing til eksisterande
  dimensjonar i bygningsmilj\u00f8et med omr\u00e5dekarakter og landskap. Byggjeh\u00f8gder
  og volum m\u00e5 reduserast. Dei framlagde planane vil redusere opplevinga b\u00e5de
  av einskilde kulturminne og det samla kulturmilj\u00f8et med mellom anna Fleischers
  hotell, Voss stasjon, Vangskyrkja og Vossavangen. Riving av verneverdige bygningar
  med h\u00f8g kulturminneverdi svekkar ytterlegare heilskapen. Konflikten med kulturminneinteressene
  gjer at fylkesr\u00e5dmannen tilr\u00e5r motsegn til byggjeh\u00f8gder og volum.
  For \u00e5 komme omsynet til b\u00e5de bevaring og utvikling av Vangen i m\u00f8te
  b\u00f8r planen justerast slik at dei positive sidene ved tiltaka i st\u00f8rre
  grad blir samordna med ei berekraftig utvikling av det omliggjande kulturmilj\u00f8et.
  Planen m\u00e5 ta omsyn til dei regionale og nasjonale kulturminneverdiane i planomr\u00e5det
  og i dei omliggjande areala. 8\\n9 Omr\u00e5deplanen legg opp til ein differensiert
  bruk av omr\u00e5det. I overordna planar er omr\u00e5det satt til n\u00e6ringsareal
  og tenesteyting, i tillegg til det overordna sentrumsform\u00e5let som ikkje er
  detaljregulert i denne omgang, legg planen opp til \u00e5 inkludere bustader som
  er eit nytt form\u00e5l. M\u00e5ten dette nye form\u00e5let blir l\u00f8yst p\u00e5
  er avgjerande for graden av privatisering og oppleving av heilskap SO1 er sett av
  til sentrumsf\u00f8rem\u00e5l, noko som gjer lite f\u00f8ringar for den framtidige
  arealbruken. Dette kan ha ein uheldig verknad \u00e5 svekke heilskapen i Voss som
  tettstad. Einskilde kulturminne Fleischers hotell er eit verneverdig bygg, og arkitektur
  og utforming av nye tiltak b\u00f8r ikkje vere for dominerande i utforming eller
  plassering. Det er positivt at det er lagt til rette for godt med gr\u00f8nstruktur
  framfor Fleischer hotell. Denne eigedomen b\u00f8r bli regulert til omsynsone c.
  Det er og positivt at byggjegrense for parkeringshuset PH/N01 tek omsyn til siktlinjer
  til Fleischer hotell. Parkeringsanlegg med parkering i dagen kan verke skjemmande.
  Parkeringshuset p\u00e5 tomta b\u00f8r bli redusert og tilpassa kulturmilj\u00f8et
  med \u00abGrovendalseigedomen\u00bb og Fleischer hotell. Planforslaget \u00f8nskjer
  \u00e5 forlenge eksisterande gondolbane fr\u00e5 Hanguren med ein ny nedre stasjon.
  Dette forslaget kjem som eit alternativ til knutepunktplanen har vedteke ein lokalisering
  av Hangursbanens nedre stasjon, og vil f\u00f8re til at Grovendalshuset med anneks
  m\u00e5 rivast eller flyttast. Forslaget i planen er \u00e5 flytte Grovendalshuset
  til sentrumsorm\u00e5det S01. Grovendalshuset som er fr\u00e5 1750-\u00e5ra og \u00abVetlebygningen\u00bb
  fr\u00e5 1855, \u00abGrovedaleigedomen\u00bb, har stor kulturhistorisk interesse
  med h\u00f8g kulturminneverdi. Bygningane har framleis ein stor del av sitt opphavlege
  preg og er s\u00e5rbare for tekniske inngrep. Grovendalshuset fr\u00e5 1750-\u00e5ra
  ligg i fredingsklassen og framheva i kulturplanen til Voss kommune. Bygningane har
  ein god plassering p\u00e5 sin opphavlege plass. Eigedomen b\u00f8r bli regulert
  til omsynsone c. Planforslaget opnar for \u00e5 flytte \u00abVetlebygningen\u00bb
  og flytte Grovendalshuset. Viktig at bygningane st\u00e5r i sitt opphavlege milj\u00f8.
  Ynskje om \u00e5 gje Grovendalhuset ein ny plassering innan planomr\u00e5det for
  \u00e5 gje bygningen eit \u00ablyft\u00bb, vil Fylkesr\u00e5dmannen sterkt r\u00e5
  i fr\u00e5. Utbygginga i seg sj\u00f8lv er ei utfordring for \u00abGrovendaleigedomen\u00bb.
  Planforslaget inneber ei utviding, ei samla ny bygningsmasse, som bryt vesentleg
  med skalaen i bygningsmilj\u00f8et og riving av verneverdige bygningar i eit kulturmilj\u00f8
  med stor kulturhistorisk verdi. Dette er sv\u00e6rt uheldig og vil kunne f\u00f8re
  til tap av viktige kulturminne og svekke heilskapen i kulturmilj\u00f8et som tettstad.
  Det m\u00e5 ikkje leggjast til rette for riving eller flytting av bygningane p\u00e5
  \u00abGrovendaleigedomen\u00bb. Dei m\u00e5 bli st\u00e5ande og sikrast p\u00e5
  sin eksisterande eigedom og bli gitt nok rom med tanke p\u00e5 ny bygningsmasse
  som skal f\u00f8rast opp i n\u00e6rleiken av denne. Ei forlenging av Hangursbanen
  ned til kollektivterminalen b\u00f8r eventuelt utgreiast vidare N\u00e5r det gjeld
  dei andre eldre bygningane som er tenkt rivne i planen i BB05 b\u00f8r desse bli
  st\u00e5ande. Det er snakk om bustadhus, Lillehjem, (Ullestadhuset) datert fr\u00e5
  f\u00f8rste del av talet og uthus knytt til dette. Omsynsoner Kommunen b\u00f8r
  sikre dei mest verneverdige kulturminne innanfor planomr\u00e5det med Omsynssone
  c (SOSI-kode H570. Dette gjeld som nemnt \u00abGrovendaleigedomen\u00bb og \u00abFleischer
  hotell\u00bb. Det m\u00e5 knytast retningslinjer til omsynssone c som sikrar at
  vernef\u00f8rem\u00e5la blir ivaretekne. Teksten vil kunne tilpassast det einskilde
  tilfelle, men kan til d\u00f8mes vere f\u00f8lgjande: Nye tiltak skal ivareta omsynet
  til kulturminne/kulturlandskap i omr\u00e5det. Saker som gjeld tiltak i omsynsona
  skal sendast Hordaland fylkeskommune for vurdering av kulturminneinteresser. Automatisk
  freda kulturminne Hordaland fylkeskommune har som regionalt kulturminnemynde vurdert
  planomr\u00e5det og har ingen informasjonar om funn eller kulturminne i v\u00e5re
  arkiv. Vi har \u00f2g gjort ei vurdering og finn at potensialet for funn av automatisk
