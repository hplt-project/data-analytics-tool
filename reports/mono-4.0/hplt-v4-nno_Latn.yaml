  liten premie. Alle ser ut til \u00e5 trivast godt og fleire gonger rungar latteren
  i salen. s.4 s.5\\n4 Messias i Myking Messias av H\u00e4ndel vert framf\u00f8rt
  p\u00e5 konsert i Myking kyrkje s\u00f8ndag etter p\u00e5ske, 27. april kl Dette
  verket har ein s\u00e6rleg plass i hjarta hj\u00e5 alle som opplever det, og har
  ein einest\u00e5ande kvalitet og popularitet. Musikken er like frisk og fantastisk
  flott i dag som d\u00e5 den vart skriven p\u00e5 1700-talet. Komponisten Georg Friedrich
  Handel fekk ein sv\u00e6rt sterk inspirasjon og skreiv all musikken p\u00e5 f\u00e5
  veker. Tekstane er fr\u00e5 Bibelen og omhandlar Jesus som Messias. F\u00f8rste
  del er bygt p\u00e5 profetiane fr\u00e5 GT og Jesu f\u00f8dsel. Andre del er om
  Jesu liv og verk, d\u00f8den p\u00e5 krossen og om oppstoda. Tredje og siste del
  av verket er himmelvendt med tekstar fr\u00e5 Openberringa. Sv\u00e6rt kjent er
  det store Halluja-koret med mektig, jublande kor, fullt orkester med trompetar og
  pauker. Men perlene kjem p\u00e5 rekke og rad gjennom heile konserten, - stilt og
  mjukt, vakkert, dramatisk og gripande. Ei stor oppleving av musikk og tekstar, ikkje
  rart at songarar, musikarar og publikum over heile verda fyller kyrkjer og konsertsalar
  med H\u00e4ndels Messias, - igjen og igjen! Denne gongen vert Messias framf\u00f8rt
  i p\u00e5sketida, og det h\u00f8ver glimrande med konsert i helga etter p\u00e5skefeiringa.
  Alversund kammerkor er s\u00e5 heldig \u00e5 f\u00e5 syngja dette verket saman med
  glimrande solistar og orkester i den flotte akustikken i Myking kyrkje. Solistane
  er Kjersti Wiik, Marianne Bye Granheim, Harald Bj\u00f8rk\u00f8y og Andreas Skei.
  F\u00f8rstefiolinist og konsertmeister i orkesteret er Ruth Henny Sandstad fr\u00e5
  Austrheim, no busett i Haugesund. Vi er veldig glad for \u00e5 ha slike gode, profesjonelle
  krefter med oss! Messias er ein enorm inspirasjon, ei stor musikalsk utfordring
  for koret og einest\u00e5ande manifestasjon av den kristne bodskapen. I tillegg
  gjer koret eit solid dugnadsl\u00f8ft for \u00e5 f\u00e5 dette skipa til, ikkje
  minst praktisk og \u00f8konomisk. Koret h\u00e5par difor at kyrkja p\u00e5 Myking
  er fylt opp med tilh\u00f8yrarar p\u00e5 konserten, vi veit at sv\u00e6rt mange
  har lyst \u00e5 f\u00e5 med seg konserten. Dei som vil koma forbi billettk\u00f8
  ved inngangen, kan kj\u00f8pa billettar p\u00e5 internett via eller p\u00e5 epost
  Billettane kostar kr. 250,- for vaksne, unge under 16 \u00e5r g\u00e5r gratis. Alversund
  kemmerkor ynskjer hjarteleg vel m\u00f8tt til konsert med H\u00e4ndels Messias s\u00f8ndag
  27/4 kl i Myking kyrkje! for Alversund kammerkor Odd Leif Mj\u00f8s, dirigent Gigantkor
  p\u00e5 650 barn til KORIFOKUS Alt er klart for ein ny fantastisk familiefest for
  heile Nordhordland laurdag 5. april, seier den engasjerte arrang\u00f8ren og artisten
  Bjarte Leithaug fr\u00e5 Frekhaug. For 5. gong inviterar han alle sm\u00e5 og store
  til den popul\u00e6re barnekorfestivalen KORIFOKUS i Nordhordlandshallen i Knarvik.
  I \u00e5r skal 650 barn fr\u00e5 38 barnekor fr\u00e5 heile Hordaland samlast til
  eit fargerikt megakor, fortel Leithaug. Saman med Bjarte skal popul\u00e6re gjestar
  som MGP jr-vinnarane Marcus & Martinus, Team Sulebakk, Tore Thomassen m.fleire opptre
  p\u00e5 den store scena i hallen. Leithaug er sikker p\u00e5 at b\u00e5de korsongarar
  og publikum vil f\u00e5 ei flott oppleving der kristne barnesongar er kjerna i programmet
  i tillegg til triveleg underhaldning fr\u00e5 artistane. Fr\u00e5 Lind\u00e5s kommune
  skal barnekora Sing Singeling, SingOut, Kyrios, Myksvoll Yngste r\u00f8ster, Kompass
  og Ostreidet barnekor delta. For dei vel 800 tilreisande deltakarane startar dagen
  med felles\u00f8vingar med artistar og det proffe bandet kl Sidan er det festivalmarsj
  med minikonsert i Knarvik Senter, matpause, eigen deltakarkonsert med sjarm\u00f8rtvillingane
  Marcus og Martinus, leiar-seminar og sj\u00f8lve festivalkonserten kl Tanken min
  bak KORIFO- KUS-festivalen har vore \u00e5 laga ei profesjonell og inspirerande
  markering for det flotte kristne korarbeidet som vert drive lokalt mange stadar,
  og ikkje minst gjera litt stas p\u00e5 dei mange friviljuge leiarane som stiller
  opp Mange barn gler seg til \u00e5 synge saman med dei popul\u00e6re tvillingane
  og MGPjr-wvinnarane Marcus & Martinus (11\u00e5r) for borna \u00e5r etter \u00e5r,
  seier Bjarte. Med spanande artistar, profft orkester, kjempestor lyd og lys rigg
  og TV-produksjon p\u00e5 storskjerm blir fotballhallen gjort om til stemningsfull
  konserthall. Det at festivalen har samla n\u00e6r 3000 kvar gong er bevis p\u00e5
  at vi treng ei slik fellessamling med barna i sentrum i v\u00e5rt distrikt. Dette
  er vel det einaste arrangementet som knyter alle kyrkjelydane i Nordhordland saman,
  med barnekor fr\u00e5 alle kommunane. Eg h\u00e5par difor riktig mange finn vegen
  til Nordhordlandshallen 5.april. Eg kan definitivt lova publikum ei skikkeleg glad
  og god oppleving, smiler Bjarte. \u00c5 h\u00f8yra mange hundre barn synga glade
  songar for full hals er ei ekte hum\u00f8rbombe! s.6 s.7\\n5 Ei oppleving for livet!
  Ei av konfirmantane, Line Bertelsen (nr 1 fr\u00e5 venstre), deler her nokre av
  sine inntrykk fr\u00e5 turen: Dag 1: Etter ein god frukost f\u00f8rste dagen sette
  me kursen for Dogodogo street centre. Dogodogo er eit senter for unge gutar og jenter
