  utdanning. Dei kan velje mellom ulike linjer som dei kan g\u00e5 p\u00e5. Det er
  Skredderlinja, snikkar, teater/musikk og elektro. Teater- og musikkgruppa viste
  oss dansen som dei l\u00e6rer p\u00e5 skulen. Det var utrulig g\u00f8y \u00e5 sj\u00e5
  deira m\u00e5te \u00e5 danse p\u00e5. Dei hadde s\u00e5 mykje bevegelsar, det s\u00e5g
  enkelt ut n\u00e5r ein s\u00e5g p\u00e5, men n\u00e5r du skulle pr\u00f8ve \u00e5
  l\u00e6re dansen sj\u00f8lv vart det veldig vanskeleg. Alle klassane tok godt i
  mot oss, det var godt \u00e5 sj\u00e5 all godheita og dei varme smila dei viste,
