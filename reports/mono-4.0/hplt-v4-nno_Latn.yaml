  i g\u00e5r p\u00e5 Dogodogo var det tid for ein avslappingsdag. Me starta dagen
  med ein tur p\u00e5 Mlilano kj\u00f8pesenter, 15 minutt utanfor Dar es Salaam. Ettermiddagen
  brukte me p\u00e5 eit Badeland. Det var utrulig kjekt med litt avslapping. Me seilte,
  bada og koste oss heile dagen. Eg trur me sovna fort alle saman om kvelden etter
  to dagar med store opplevingar. Dag 5: Me starta dagen tidleg med morgonsafari.
  Me fekk sitje i safaribilar, det var ganske spanande, slik som du vanlegvis ser
  i filmar. Det var utrulig spanande og fasinerande \u00e5 sj\u00e5 p\u00e5 dyra.
  Me s\u00e5g flodhestar, sjiraffar, sebra, aper, elefantar, impala og til og med
  l\u00f8ver. Dag 6: Me vakna til enda ein fin dag med sol og godt hum\u00f8r hj\u00e5
  oss alle. Det var fleire som hadde gleda seg mykje til \u00e5 bes\u00f8ke barneheimen
  me skulle til i dag. F\u00f8r me reiste \u00e5t me frukost og handla i ein butikk
  p\u00e5 hotellet. Varene var laga av folk som var funksjonshemma. Det var utruleg
  fine ting dei hadde laga, og det var veldig bra at dei faktisk hadde ein jobb. I
  Ilula, der barneheimen ligg, reiste me til fosterheimar som er eit av prosjekta
  til IOP- Ilula Orphan Programme. Me vart delt opp i to grupper. Den eine gruppa
  bes\u00f8kte Anastansia, som er ein av fosterforeldra. Den andre gruppa bes\u00f8kte
  Delfina sin fosterheim. Historiane som dei fortalde gjorde stort inntrykk p\u00e5
  alle deltakarane. Kirkens N\u00f8dhjelp st\u00f8ttar desse fosterheimane med blant
  anna \u00e5 byggje hus, byggje toalett, og gje reint vatn gjennom kranar n\u00e6r
  husa. Fosterheimane f\u00e5r og betalt skulepengar, uniform og skulemateriell til
  borna i familien. D\u00e5 me kom tilbake til IOPsenteret fekk me helse meir p\u00e5
  barna p\u00e5 barneheimen. Alle borna var utruleg skj\u00f8nne. Dei sm\u00e5 ville
  opp til oss og dei var veldig fasinert over det lange h\u00e5ret v\u00e5rt. Om kveld
  opptr\u00e5dde dei for oss med dans og musikk. Store og sm\u00e5 var med. Dag 7:
  Me reiste tidleg om morgonen tilbake til Dar es Salaam. Det var trist \u00e5 reise
  fr\u00e5 borna p\u00e5 barneheimen, men me hadde sett at dei hadde det bra der dei
  var no, og det er noko av det viktigaste. Dag 9: Me pakka koffertane v\u00e5re,
