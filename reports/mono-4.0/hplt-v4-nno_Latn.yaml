  Luk 1, \u00c5ret 1814 vert gjerne kalla mirakel\u00e5ret i Noregs historie. Dette
  var \u00e5ret d\u00e5 Noreg sa seg uavhengig. Dei f\u00f8rste politiske vala vart
  gjennomf\u00f8rt og vi fekk ei grunnlov. Eit dramatisk \u00e5r som kanskje kunne
  enda annleis. Det var vel noko alle forstod. Difor syng vi i fedrelandssongen om
  Gud, at: \u00abLandet ville han beskytte, skj\u00f8nt det m\u00f8rkt s\u00e5 ut.\u00bb
  Heldigvis gjekk det som det gjekk og 1814 vart starten p\u00e5 utviklinga av demokratiet
  i Noreg. I ein annan fedrelandssalme syng vi med referanse til m.a. tida under framand
  styre om at: \u00abV\u00e5rt heimland i m\u00f8rker lenge l\u00e5g, og vankunna
  ljoset g\u00f8ymde. Men, Gud, du i n\u00e5de til oss s\u00e5g, din kj\u00e6rleik
  oss ikkje gl\u00f8ymde.\u00bb 1814 handlar om b\u00e5de lys og m\u00f8rke. Om dramatikk
  og uro for framtida. Men \u00e5ret handlar \u00f2g om framtidstru og optimisme.
  Vi n\u00e6rmar oss p\u00e5ske. Der opplever vi \u00f2g lys og m\u00f8rke. Vi h\u00f8yrer
  om uro for framtida, om frykt og stor sorg. Vi h\u00f8yrer om d\u00f8dsriket der
  det er stummande m\u00f8rkt. Ein stad utan von, inga glede, ingen kj\u00e6rleik,
  - ikkje f\u00f8r Jesus Kristus sprengde bommane, opna d\u00f8rene, og gjorde sin
  triumferande innmarsj i d\u00f8dsriket. P\u00e5 sett og vis kan ein seie at d\u00f8dsriket
  p\u00e5 p\u00e5skedagen fekk ei ny grunnlov. I hagen var det \u00f2g stummande m\u00f8rkt
  d\u00e5 Maria Magdalena gjekk for \u00e5 vitja grava tidleg om morgonen. Kor hadde
  dei lagt Jesus? Men det m\u00f8rkret som Maria hadde inni seg, var verre enn nattem\u00f8rkret.
  For \u00e5 mista ein som vi er glad i, er tyngre enn ei m\u00f8rk vinternatt. Det
  trur eg mange av oss kan skriva under p\u00e5. Sola sto opp medan Maria var i hagen.
  Men sola kunne ikkje gjera noko for \u00e5 lindra sorga hennar. Det var eit anna
  slags ljos som tende gleda i henne den morgonen. Det ljoset str\u00f8ymde ut av
  ei tom grav. I hjarto v\u00e5re er det \u00f2g mykje som kan kasta m\u00f8rke skuggar.
  Men p\u00e5skemorgon g\u00e5r mang ei von og mang ein lovnad i oppfylling: Mellom
  anna den som Sakarja, far til d\u00f8yparen Johannes, sa om Jesus.: \u00abS\u00e5
  skal ljoset fr\u00e5 det h\u00f8ge gjesta oss som ei solrenning, og skina for dei
  som bur i m\u00f8rker og d\u00f8dsskugge.\u00bb Luk 1,78-79 Fr\u00e5 p\u00e5skemorgon
  har Jesus lyst for oss som bur i m\u00f8rker og d\u00f8dsskugge. For Jesus vart
  ikkje henta til d\u00f8dsriket i lekkjer. Nei, han steig ned dit som ein fri mann,
  som ein konge. Han var Guds Son. Han banka ikkje p\u00e5. Nei, han braut sund dei
  armerte portane. For fyrste gong steig nokon inn i d\u00f8dsriket som sigerherre,
  og ikkje som fange. D\u00f8den skalv. Men dei fangane d\u00f8den hadde sperra inne,
  s\u00e5g ljoset for fyrste gongen etter \u00e5rhundrar med stummande m\u00f8rker.
  Dei \u00f2g vart lamslegne, og fall p\u00e5 kne for denne triumfatoren. Men Jesus
  la varsamt handa si p\u00e5 dei og sa: \u00abVer ikkje redd! Eg er den fyrste og
  den siste og den levande. Eg var d\u00f8d, men sj\u00e5, eg lever i all \u00e6ve
  og har nyklane til d\u00f8den og d\u00f8dsriket.\u00bb Op 1,17b-18 P\u00e5skedagen
  fekk d\u00f8dsriket ny Redakt\u00f8rens hj\u00f8rne Redakt\u00f8rens hj\u00f8rne
  Dette nummeret av Kyrkjekontakten handlar om \u00e5 sj\u00e5 lyset, og \u00e5 h\u00f8yre
