  Har du ikkje hatt inntekt over grensa, treng du ikkje \u00e5 sende inn noko.\\nInntektsgrensa
  for 2020\\nGrensa er 188 509 kroner n\u00e5r du f\u00e5r st\u00f8tte i meir enn
  sju m\u00e5nader i 2020, og 471 270 kroner n\u00e5r du f\u00e5r st\u00f8tte i sju
  m\u00e5nader eller mindre i 2020.\\nGrensene for formue og trygd gjeld framleis\\nDet
  er ikkje gjort unntak fr\u00e5 grensene for kor h\u00f8g formue eller trygd du kan
  ha , f\u00f8r stipendet blir redusert. Desse grensene gjeld framleis for studentar
  som kan f\u00e5 unntak fr\u00e5 inntektsgrensa p\u00e5 grunn av arbeid direkte knytt
  til koronapandemien.\"", "\"Testutviklar\\nBr\u00f8nn\u00f8ysundregistrene\\nHavnegata
