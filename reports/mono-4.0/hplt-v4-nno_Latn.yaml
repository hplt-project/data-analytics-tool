  "\"F\u00f8lg skogsvegen innover Ultunga til du kjem til vadestaden over Vesle-Ula.
  Den bratte, men ufarlege stigen oppover Kampstulberga f\u00f8rer til Kampstulen,
  i moderne form Kampesetrene eller berre Kampen. Her gjekk det tidlegare ein l\u00f8ypestreng
  for \u00e5 frakte ved opp den stupbratte dalsida.\\nDen f\u00f8rste setra du kjem
  til er Stampesetra, deretter kjem p\u00e5 venstre sida setrene til G\u00e5rden,
  Uldalen og den nyare Liasetra. Den gamle Linlykkjesetra p\u00e5 h\u00f8gre side
  vart omgjord til hytte for lenge sidan, og ny seter vart rydda og bygd rett ovanfor.
  Ein kilometer lenger framme ligg Havnsetrene tilh\u00f8yrande \u00d8vre- og Midtre-Havn.\\nDei
  steinbuene du ser langs vegen mot nasjonalparkgrensa er buer for m\u00e5s\u00e5taking.
  F\u00f8lg den grasvokste k\u00f8yrevegen mot Peer-Gynt. Wenche Foss ferierte ei
  periode i Kampen. For \u00e5 sleppe \u00e5 vasse Ula gav ho pengar til gjenoppbygging
  av den enkle gangbrua over Vesle-Ula ved Peer-Gynt hytta.\\nDette er en tur p\u00e5
  4 km, som g\u00e5r fra Parkeringsplassen/Butikken - og til J\u00f8rgenbua, som befinner
  seg ved Gr\u00e5haugen (976 moh.).\\nFra start og frem til J\u00f8rgenbua er det
  1.9 km. Tilbaketuren er p\u00e5 2.16 km.\\nF\u00f8lg r\u00f8dmerket l\u00f8ype mot
  Raphamn, som starter bakenfor butikken/kafeen (se kart under). Tilbaketuren g\u00e5r
  etter veien fra det \u00f8verste hyttefeltet i Gr\u00e5haugen. F\u00f8lg ogs\u00e5
  deler av skil\u00f8ypa, som g\u00e5r i skogen langs str\u00f8m-gaten. F\u00f8lg
  veiene tilbake ned mot Mysuseter, eller velg r\u00f8dmerket l\u00f8ype tilbake.\\nGod
  tur.\\nRanglarh\u00f8 (Bl\u00e5\u2013merket)\\nRundtur: 6 km.\\nStorslagen utsikt
  til b\u00e5de Jotunheimen og Rondane.\\nStart turen ved butikken,\\nKryss bekken,
  og g\u00e5 oppover Tj\u00f8nnbakk-vegen. G\u00e5 forbi bommen, og f\u00f8lg vegen
  oppover bakkene til det flater ut p\u00e5 toppen.\\nTa til h\u00f8yre f\u00f8r S\u00f8la
  (lite tjerne/vann). F\u00f8lg veien oppover til den \u00f8verste hytten, og deretter
  bl\u00e5merket sti.\\nP\u00e5 toppen kan du f\u00f8lge bl\u00e5merket sti videre,
  ta til h\u00f8yre og f\u00f8lge stigen nedover mot Mysus\u00e6ter igjen.\\nGod tur!\\nklikk
  p\u00e5 kartet for st\u00f8rre versjon.\\nTa til venstre fr\u00e5 fylkesvegen 100
  meter ovanfor Rondane SPA H\u00f8yfjells-hotell. G\u00e5 brua over bekken og f\u00f8lg
  bl\u00e5merkt stig gjennom skogen. Ulafossane kastar seg foss etter foss utfor p\u00e5
  veg ned mot den idylliske Uldalen. N\u00e5r du kjem til Ulbrua, g\u00e5r du over
  og f\u00f8lger gr\u00f8nmerkt stig nedover p\u00e5 andre sida til du kjem til bilveg.
  F\u00f8lg bilvegen nedover til Ultungbrua, opp p\u00e5 den gamle Mysusetervegen
  og attende til Mysuseter.\\nUltungnamnet kjem av det tungeforma landskapet mellom
  Vesle-Ula og Stor-Ula. Fr\u00e5 Ultunga ser du over til Kampesetrene og den fine
  Gr\u00f8nlibekkfossen. Dalen innover langs Vesle-Ula er sv\u00e6rt idyllisk.\\nStigen
  er ikkje merkt, men du kan f\u00f8lge gamle skogsvegar og stigar heilt fram til
  den flotte Vesleulfossen.\\nUltungkvea tilh\u00f8yrer Midtre-Dahle, tidlegare var
  det setra til Sygard Loftsgard. P\u00e5 1700-talet tilh\u00f8yrde ho Nyhusom og
  hadde fast busetjing.\\nDen siste som var fastbuande i Ultonga d\u00f8ydde ved Ultongstein
  i Raphamnsfjellet p\u00e5 heimveg fr\u00e5 kyrkja f\u00f8rst p\u00e5 1700-talet.\\nGr\u00e5h\u00f8
  (Gr\u00f8nn-merket)\\nRundtur: 2,16 km.\\nLett tur med fin utsikt til mange topper
  i Rondane.\\nKlikk p\u00e5 bildet for \u00e5 f\u00e5 navn p\u00e5 toppene.\\nFra
  butikken/parkeringen kan du f\u00f8lge gr\u00f8nnmerket stig opp slal\u00e5mbakken.
  Gr\u00e5h\u00f8 p\u00e5 1050 meter gir en storslagen utsikt over Mysuseter og Rondane.
  F\u00f8lg gr\u00f8nnmerket l\u00f8ype ned p\u00e5 Ottekrakvea, der synes gamle tufter
  etter at de en gang i tiden m\u00e5tte fl\u00f8tte seterhusene fordi de var plaget
  av gjengangere/sp\u00f8kelser.\\nUlafossene er bare 20 - 25 minutters gange fra
  Parkeringen p\u00e5 Mysuseter.\\nElva renner gjennom flere stryk og fosser, og er
  vanligvis et spektakul\u00e6rt og lett tilgjengelig turm\u00e5l.\\nF\u00f8lg stien
  langs hovedveien tilbake, og ta til venstre over brua som krysser bekken i bakken
  rett ved den elektriske feristen, f\u00f8r du ned kommer til Rondane h\u00f8yfjellshotell.
  F\u00f8lg stien opp og langs elva (gul og bl\u00e5-mermekt).\\nN\u00e5r du kommer
  opp til brua som krysser Ula, s\u00e5 tar du til h\u00f8yre og f\u00f8lger Ulvangsveien
  tilbake forbi Mysuseter Fjellstue og ned siste stykket langs Tj\u00f8nnbakkvegen.\\nStien
  langs elva er noe kuppert og egner seg ikke for d\u00e5rlig g\u00e5ende. V\u00e6r
  forsiktig ved regnv\u00e6r. Stien kan v\u00e6re litt glatt.\\nGod tur!\\nLengde:
  ca. 2,5 km\"", "\"Praktisk informasjon om f\u00f8rebuingar til digitalt kurs\\nJoin
  gjer at du koplar deg opp til eit virituelt m\u00f8terom direkte fr\u00e5 nettlesaren
  din og det trengs verken nedlasting eller ekstrautstyr.\\nDu vert invitert inn til
