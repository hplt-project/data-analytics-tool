  prosjektleiar John Markus Hallandtlf. 95 23 15 82\"", "\"I l\u00f8pet av kurset
  skal du l\u00e6re \u00e5 starte, fly og lande p\u00e5 ein sikker m\u00e5te. Vi startar
  i slakk bakke uten \u00e5 bli vesentlig l\u00f8fta fr\u00e5 bakken, vi fortsetter
