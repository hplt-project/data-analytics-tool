  og f\u00e5r jobben gjort\\nDu m\u00e5 kunne bli autorisert for AVGRENSA etter sikkerheitslova.
  Er du utanlandsk statsborgar, skal autorisasjonsansvarleg hos oss vurdere om tilknytinga
  di til heimlandet og heimlandet si sikkerheitsmessige betydning utgjer ein risiko
  knytt til stillinga. I nokre tilfelle m\u00e5 det bli henta inn samtykke fr\u00e5
  Sivil klareringsmyndigheit.\\nDette f\u00e5r du hos oss\\n- fast stilling som r\u00e5dgiver
  med \u00e5rsl\u00f8n fr\u00e5 kr 570 000 - 720 000, eller som seniorr\u00e5dgiver
  med \u00e5rsl\u00f8nn fra kr 700 000 - 900 000 avhengig av kvalifikasjonane dine.
  Om du er spesielt godt kvalifisert, kan vi vurdere h\u00f8gare l\u00f8n.\\n- interessante
  og utfordrande oppg\u00e5ver innan digitalisering og forenkling av Noreg\\n- eit
  godt arbeidsmilj\u00f8 med uformell tone hvor me alle er p\u00e5 hels\\n- gode moglegheiter
  for fagleg utvikling og ei raus stipendordning\\n- fleksibel arbeidstid med god
  balanse mellom arbeidsliv og privatliv\\n- gode velferdsordningar i alle livsfasar
  og moglegheit for trening i arbeidstida\\n- moglegheit for heimekontor inntil to
  dagar i veka n\u00e5r arbeidsoppg\u00e5vene tilseier at det let seg gjera\\n- medlemskap
  i Statens pensjonskasse som har ei av landet sine beste pensjonsordningar, med gunstig
  bustadl\u00e5n og gode forsikringsordningar\\n- moderne kontorlokale med fantastisk
  utsikt over Helgelandskysten. Sj\u00e5 den flotte arbeidsplass og byen vi bor i
  p\u00e5 Havnegata 48\\nVi kan hjelpe til med \u00e5 skaffe bustad, og flyttekostnadar
  kan bli dekte etter n\u00e6rmare avtale. Ved flytting til Br\u00f8nn\u00f8ysund
  kan husleige bli dekt med inntil 10 000 kroner dei f\u00f8rste 6 m\u00e5nadane etter
  oppstart av arbeidsforholdet. Dette er skattepliktig inntekt.\\nVi har eit rekrutteringssamarbeid
  med Br\u00f8nn\u00f8y kommune og Digitaliseringsdirektoratet. Har du ein partnar
  som har behov for jobb kan vi formidle kontakt med desse.\\nInkludering og mangfald
  er viktig for oss\\nVi \u00f8nsker \u00e5 vere ein inkluderande arbeidsplass, der
  vi speglar mangfaldet i befolkninga. Vi treng medarbeidarar med ulik erfaring, bakgrunn,
  kompetanse og kvalifikasjonar for \u00e5 l\u00f8yse samfunnsoppdraget v\u00e5rt.
  Har du hol i CV-en , nedsett funksjonsevne eller innvandrarbakgrunn oppfordrar vi
  deg til \u00e5 krysse av for det n\u00e5r du s\u00f8ker stilling hos oss. Vi kallar
  inn minst ein kvalifisert s\u00f8kar fr\u00e5 kvar av desse gruppene til intervju.\\nBu
  i Br\u00f8nn\u00f8ysund\\nBr\u00f8nn\u00f8ysund er ein triveleg liten kystby s\u00f8r
  p\u00e5 Helgeland. Vi har korte avstandar til det meste og masse v\u00ear \u2013
  uansett \u00e5rstid! Er du glad i naturopplevingar har vi eit utal moglegheiter.
  Moglegheitene er mange ogs\u00e5 for deg som heller f\u00f8retrekk ein tur p\u00e5
  kafe eller restaurant, er opptatt av kultur eller ulike treningsmoglegheiter innand\u00f8rs.\\nHar
  du studiel\u00e5n og bur i Br\u00f8nn\u00f8y kommune, kan du f\u00e5 nedskrive l\u00e5net
  kvart \u00e5r til det er nedbetalt.\\nKorleis er det \u00e5 jobbe hos oss s\u00e5nn
  eigentleg?\\nVi vil du skal f\u00f8le deg trygg p\u00e5 valet n\u00e5r du takkar
  ja til \u00e5 jobbe hos oss. Dersom du er aktuell for stillinga, tilbyr vi deg ein
  omvend referansesjekk. Det betyr at du f\u00e5r ringe nokre av v\u00e5re medarbeidarar
  og stille dei sp\u00f8rsm\u00e5la du m\u00e5tte \u00f8nske for \u00e5 finne betre
  ut om vi er ein god match.\\nVerd \u00e5 merke seg f\u00f8r du s\u00f8ker\\nN\u00e5r
  du s\u00f8ker jobb hos oss, vil namnet ditt st\u00e5 p\u00e5 ei offentleg s\u00f8karliste.
  \u00d8nsker du \u00e5 bli unntatt fr\u00e5 den offentlege s\u00f8karlista, m\u00e5
  du grunngi kvifor. Vi tar kontakt med deg dersom vi ikkje tar \u00f8nsket ditt til
  f\u00f8lgje, og du f\u00e5r moglegheit til \u00e5 trekke s\u00f8knaden din.\\nFor
  \u00e5 bli vurdert som s\u00f8kar, m\u00e5 du legge ved relevante attestar og vitnem\u00e5l.
  Vitnem\u00e5l fr\u00e5 utdanning tatt i Noreg lastar du opp fr\u00e5 Vitnem\u00e5lsportalen.
  Har du utdanning fr\u00e5 utlandet legg du ved godkjenning fr\u00e5 Direktoratet
  for h\u00f8gare utdanning og kompetanse/NOKUT.\\nKontaktperson for stillingen\\nOm
  bedriften\\nBr\u00f8nn\u00f8ysundregistera utviklar og driv digitale tenester som
  gjer kontakten med det offentlege enklare for alle. Vi driv mange av landet sine
  viktigaste register og har 450 medarbeidarar.\\nDei fleste jobbar i Br\u00f8nn\u00f8ysund.
  Vi har ogs\u00e5 medarbeidarar i Narvik og Oslo.\\nSektor\\nOffentlig\"", "\"Rapport
  fr\u00e5 tilsyn med Helse Bergen HF - samhandling om utskriving av pasientar fr\u00e5
  spesialisthelsetenesta til kommunen 2014\\nOppf\u00f8lging av tilsynet\\nI dette
  tilsynet blei det ikkje funne avvik fr\u00e5 lov eller forskrift. Tilsynet er derfor
  avslutta.\\nFylkesmannen i Hordaland gjennomf\u00f8rte tilsyn med Helse Bergen HF,
  Haukeland Universitetssjukehus 25.-26. november 2014. Vi unders\u00f8kte om Helse
  Bergen ved systematisk styring sikrar forsvarleg utskriving av pasientar som blir
  skrivne ut til eigen heim og treng helsehjelp etter utskriving.\\nRapporten omtaler
  funn ved tilsynet.\\nVed tilsynet blei det ikkje avdekt forhold som er i strid med
  krav i helselovgjevinga.\\nV\u00e5r vurdering av helsef\u00f8retaket si styring
  av samhandling med kommunane om utskriving av pasientar til eigen heim g\u00e5r
  fram av rapporten kapittel 6.\\nTilsynet er avslutta.\\nAnne Grete Rob\u00f8le\\nrevisjonsleiar\\nJo
  K\u00e5re Herfjord\\nrevisor\\nTilsynet med samhandling om utskriving av pasientar
  fr\u00e5 spesialisthelsetenesta til kommunen omfattar tilsyn med Os kommune 10.-11.
  og 27. november og tilsyn med Helse Bergen HF, Haukeland Universitetssjukehus 25.-26.
  november 2014.\\nRapporten er utarbeidd etter tilsyn med Helse Bergen HF, Haukeland
  Universitetssjukehus, Medisinsk avdeling, post 1 nord og post 1 vest og Ortopedisk
  avdeling, post OT-2 S\u00f8r, 25. - 26. november 2014.\\nTilsynet er ein del av
  den planlagde tilsynsverksemda hos Fylkesmannen i Hordaland dette \u00e5ret.\\nFylkesmannen
  i Hordaland har fullmakt til \u00e5 f\u00f8re tilsyn med helse- og omsorgstenester
  etter lov om statlig tilsyn med helse- og omsorgstjenesten \u00a7 2.\\nForm\u00e5let
  med tilsynet er \u00e5 vurdere om verksemda tek hand om ulike krav i lovgivinga
  gjennom internkontrollen sin. Revisjonen omfatta \u00e5 unders\u00f8kje om:\\n-
  kva tiltak verksemda har for \u00e5 avdekkje, rette opp og f\u00f8rebyggje brot
  p\u00e5 lovgivinga innanfor de tema tilsynet omfattar\\n- tiltaka blir f\u00f8lgde
  opp i praksis og om n\u00f8dvendig korrigerte\\n- tiltaka er gode nok for \u00e5
  sikre at lovgivinga blir f\u00f8lgd\\nTilsynet blei utf\u00f8rt som systemrevisjon.
  Ein systemrevisjon blir gjennomf\u00f8rt ved \u00e5 granske dokument, ved intervju
  og andre unders\u00f8kingar.\\nRapporten handlar om funn ved tilsynet og gir derfor
  inga fullstendig tilstandsvurdering av det arbeidet verksemda har gjort innanfor
  dei omr\u00e5da som tilsynet omfatta.\\nDet er inng\u00e5tt overordna samarbeidsavtale
  mellom Helse Bergen HF, Haraldsplass Diakonale Sykehus, Voss distriktspsykiatriske
  senter NKS Bj\u00f8rkeli, NKS Olaviken Alderspsykiatriske sykehus AS, Solli Distriktspsykiatriske
  senter, Hospitalet Betanien Distriktspsykiatrisk senter og dei 22 kommunane i opptaksomr\u00e5det.\\nDet
  er eit \u00e5rleg toppleiarm\u00f8te mellom politisk og administrativ toppleiing
  i alle kommunane og administrerande direkt\u00f8rar og styreleiarar fr\u00e5 partane
  i spesialisthelsetenesta. F\u00f8rem\u00e5let med m\u00f8tet er forankring og etterleving
  av samarbeidsavtalen.\\nI opptaksomr\u00e5det til Helse Bergen HF er det oppretta
  fire overordna samarbeidsutval som skal f\u00f8lgje opp underordna avtalar.\\nTenesteavtale
  for samarbeid om innlegging i og utskriving fr\u00e5 spesialisthelsetenesta innan
  somatisk sektor for Helse Bergen HF og Haraldsplass Diakonale Sykehus AS er den
  aktuelle avtalen for dette tilsynet.\\nHelse Bergen HF, Haukeland Universitetssjukehus
  brukar elektronisk meldingsutveksling til \u00e5 formidle informasjon om innlagte
  pasientar m.v. til pleie- og omsorgstenestene og bestillar- og forvaltningskontor
  i kommunane.\\nMedisinsk avdeling har seks d\u00f8gnopne sengepostar. Medisinsk
  post 1 Nord (1N), seksjon for nyresjukdommar, og Medisinsk post 1 Vest (1 V), seksjon
  for ford\u00f8yelselssjukdommar, har kvar 18 sengeplassar. Assisterande avdelingsdirekt\u00f8r
  Medisinsk avdeling er n\u00e6raste overordna for avdelingssjukepleiarane. Avdelingsoverlege
  er n\u00e6raste overordna for seksjonsoverlegane.\\nOrtopedisk avdeling har fem
  seksjonar. OT-2 S\u00f8r har 20 senger med eining for hoftebrot og eining for pasientar
  som kjem elektivt til proteseoperasjonar. Leiar for sjukepleietenesta i Ortopedisk
  avdeling rapporterer til klinikkdirekt\u00f8r og er n\u00e6raste overordna for seksjonsleiar
  ved OT-2 S\u00f8r. Klinikkdirekt\u00f8r for Ortopedisk klinikk er n\u00e6raste overordna
  for seksjonsoverlegane.\\nTilsynet omfatta f\u00f8lgjande aktivitetar:\\nMelding
  om tilsyn blei sendt 24. september 2014.\\nForm\u00f8te: 8. oktober 2014.\\nOpningsm\u00f8te:
  25. november 2014.\\nIntervju: 21 personar blei intervjua.\\nStikkpr\u00f8ver: 23
  pasientjournalar.\\nSluttm\u00f8te: 26. november 2014\\nOversikt over dokument som
  er mottekne fr\u00e5 Helse Bergen HF, Haukeland Universitetssjukehus, Medisinsk
  avdeling og Ortopedisk avdeling og dokument som blei gjennomg\u00e5tt under tilsynet,
  er gitt i kapitlet Dokumentunderlag.\\nSp\u00f8rjeunders\u00f8kingar:\\nInvitasjon
  til \u00e5 delta i sp\u00f8rjeunders\u00f8king blei sendt i brev av 27. og 28. september
  og 4. oktober 2014 til 17 pasientar som var utskrivne fr\u00e5 Medisinsk avdeling
  og Ortopedisk avdeling til Os kommune i tidsrommet 1. mars - 1. september 2014.\\nInvitasjon
  til \u00e5 delta i sp\u00f8rjeunders\u00f8king blei sendt i brev av 27. september,
  3. og 4. oktober 2014 til fastlegane til dei 17 pasientane.\\nVi unders\u00f8kte
  om Helse Bergen HF, Haukeland Universitetssjukehus ved systematisk styring sikrar
  forsvarleg utskriving av pasientar som blir skrivne ut til eigen bustad og treng
  helsehjelp etter utskriving.\\nTilsynet omfatta:\\n- Iverksetting og oppf\u00f8lging
  av tenesteavtale om utskriving fr\u00e5 spesialisthelsetenesta innan somatisk sektor
  1\\n- Varsel om innlagt pasient med venta behov for kommunale tenester etter utskriving
  innan 24 timar,\\n- Varsel om endring av pasientens behov for hjelp eller utskrivingstidspunkt\\n-
  Vurdering og dokumentasjon av at pasienten er utskrivingsklar\\n- Varsel om utskrivingsklar
  pasient\\n- Informasjon til og medverknad fr\u00e5 pasient i samband med utskriving\\n-
  Informasjon til pasient om behandling, legemiddel og eventuell oppf\u00f8lging/kontroll
  hos lege\\n- Formidling av n\u00f8dvendig og relevant informasjon om tilstanden
  til pasienten f\u00f8r og ved utskriving\\n- Opplysningar om legemiddelbehandling
  til fastlege og pleie- og omsorgstenesta i kommunen\\nSp\u00f8rjeunders\u00f8king
  til pasientar utskrivne fr\u00e5 Medisinsk avdeling og Ortopedisk avdeling til Os
  kommune 1. mars - 1. september 2014\\nVi brukte eit enkelt sp\u00f8rjeskjema med
  svaralternativa ja/nei/veit ikkje og eit felt for kommentarar.\\nVi spurde pasientane
  om dei hadde f\u00e5tt informasjon om behandlinga p\u00e5 sjukehuset og helsehjelp
  i kommunen etter utskriving og om dei hadde forst\u00e5tt informasjon som blei gitt
  p\u00e5 sjukehuset og i kommunen. Vi spurde ogs\u00e5 om dei fekk tenestene i kommunen
  som avtalt, om behovet for helsehjelp blei vurdert p\u00e5 nytt innan kort tid etter
  at dei var komne heim og om kommunen tok omsyn til kva pasientane sj\u00f8lve meinte
  dei trong hjelp til.\\nTilsynet omfatta ikkje helsehjelpa til kvar enkelt pasient.\\nSp\u00f8rjeunders\u00f8king
  til fastlegane\\nSp\u00f8rjeskjemaet til fastlegane var todelt, ein del om informasjon
  fr\u00e5 sjukehuset og ein del om organisatoriske tilh\u00f8ve med svaralternativa
  ja/nei og eit felt for kommentarar.\\nVi spurde fastlegane om dei fekk epikrise
  fr\u00e5 sjukehuset tidsnok og om denne inneheldt n\u00f8dvendige opplysningar til
  \u00e5 f\u00f8lgje opp pasienten og om det var noko fastlegane vurderte som s\u00e6rleg
  s\u00e5rbart i samhandlinga med sjukehuset. Vidare spurde vi om kommunens tilrettelegging
  for \u00e5 trekkje fastlegane inn i arbeidet med revisjon av samarbeids- og tenesteavtalane
  mellom kommunen og spesialisthelsetenesta, tilrettelegging for informasjonsutveksling
  mellom fastlegane og pleie- og omsorgstenestene og om det var noko i denne samhandlinga
  fastlegane vurderte som s\u00e6rleg s\u00e5rbart.\\nTilsynet omfatta ikkje verksemda
  til fastlegane.\\nVed tilsynet med Helse Bergen HF, Medisinsk avdeling og Ortopedisk
  avdeling blei det ikkje avdekt forhold som er i strid med krav i helselovgjevinga.\\nSp\u00f8rjeunders\u00f8kinga
  til pasientane\\nFem av 17 pasientar svara. Fire av dei hadde f\u00e5tt korttidsopphald
  eller rehabiliteringsopphald etter dei blei skrivne ut. Ein pasient var skriven
  ut til eigen heim og hadde f\u00e5tt tilbod om, men trong likevel ikkje heimesjukepleie
  etter utskriving. Dette er for f\u00e5 svar til at dei kan leggjast til grunn for
  vurdering av praksis for informere pasientane.\\nSp\u00f8rjeunders\u00f8kinga til
  fastlegane\\nNi av 10 fastlegar svara. Dei var fastlegar for 15 av dei 17 pasientane.\\nFastlegane
  til dei 15 pasientane svara at epikrise fr\u00e5 sjukehuset kom tidsnok og inneheldt
  n\u00f8dvendige opplysningar til \u00e5 f\u00f8lgje opp pasientane.\\nTo av legane
  svara at dei hadde delteke i kommunens arbeid med utarbeiding/revisjon av samarbeidsavtalar
  med helsef\u00f8retaket. P\u00e5 sp\u00f8rsm\u00e5let om det var noko fastlegane
  vurderte som s\u00e6rleg s\u00e5rbart i samhandlinga med sjukehuset svara fleire
  av dei seine epikriser og eller feil i legemiddelopplysningar, og at dette kan f\u00f8re
  til for sein/mangelfull oppf\u00f8lging og eller feilmedisinering.\\nVi gjer s\u00e6rskilt
  merksam p\u00e5 at fastlegane ikkje blei spurde om kor ofte det f\u00f8rekjem at
  epikrise fr\u00e5 sjukehuset kjem seint og eller at det er feil i legemiddelopplysningar.\\nN\u00e5r
  det gjeld samhandling med pleie- og omsorgstenestene i kommunen, viste fastlegane
  til ordninga med elektronisk meldingsutveksling med pleie- og omsorgstenesta i kommunen
  og at det ikkje var s\u00e6rlege utfordringar i samhandlinga.\\nStyring med tenestene
  (internkontroll) f\u00f8reset at leiinga overvaker eige verksemd og set i verk n\u00f8dvendige
  f\u00f8rebyggjande og korrigerande tiltak n\u00e5r det trengst. Eigar og leiing
  har ansvaret for rammer og organisatoriske l\u00f8ysningar som gjer det mogleg \u00e5
  oppfylle krav i helselovgjevinga.\\nHelse Bergen HF ved administrerande direkt\u00f8r
  styrer verksemda i line til klinikk-/avdelingsdirekt\u00f8r. Vidaredelegasjon av
  mynde og oppg\u00e5ver er avklart. Fagansvar for legar og sjukepleiarar i seksjonar
  i Medisinsk avdeling og Ortopedisk avdeling er delt mellom seksjonsoverlegar og
  seksjonsleiarar. Ansvarsforhold og rapporteringsliner er avklart.\\nVed postane
  dette tilsynet omfatta, er rutinar for \u00e5 varsle og formidle relevant informasjon
  til kommunane f\u00f8r og ved utskriving kjende og i hovudsak f\u00f8lgde. Synspunkt
  fr\u00e5 pasientar og p\u00e5r\u00f8rande om behov for tenester etter utskriving
  blir formidla til kommunane. Det er innarbeidde rutinar for \u00e5 informere pasientane
  om behandling som er gitt og det blir lagt til rette for at pasientane, s\u00e5
  langt det er mogeleg, kan f\u00e5 medverke i samband med utskriving. Ved Medisinsk
  avdeling, seksjonane 1 N og 1 V, f\u00e5r pasientar rutinemessig med seg skriftleg
  informasjon om utf\u00f8rt behandling, eventuelle kontrollar/oppf\u00f8lging og
  legemiddel- behandling.\\nOmr\u00e5de med risiko for svikt i samhandling med kommunale
  helse- og omsorgstenester i samband med utskriving er kjende. Det er hittil ikkje
  lagt til rette for at tilsette kan sende elektronisk melding om u\u00f8nskte hendingar
  og avvik til kommunane.\\nDet er faste m\u00f8te med personalet i seksjonane og
  m\u00f8te mellom leiarar for gjennomgang og oppf\u00f8lging av verksemda. Helsef\u00f8retaket
  og kommunane har formelle m\u00f8teplassar for \u00e5 ta opp saker som gjeld samhandling.\\nLovverk
  som blei lagt til grunn ved tilsynet er:\\n- Lov av 30. mars 1984 nr. 15 om statlig
  tilsyn med helse- og omsorgstjenesten\\n- Lov av 2. juli 1999 nr. 64 om helsepersonell\\n-
  Lov av 2. juli 1999 nr. 63 om pasient- og brukerrettigheter\\n- Lov av 2. juli 1999
  nr. 61 om spesialisthelsetjenesten\\n- Forskrift av 21. desember 2000 nr. 1385 om
  pasientjournal\\n- Forskrift av 20. desember 2002 nr. 1731 om internkontroll i helse-
  og omsorgstjenesten\\n- Forskrift av 18. november 2011 nr. 1115 om kommunal medfinansiering
  av spesialisthelsetjenesten og kommunal betaling for utskrivningsklare pasienter\\n-
  Forskrift av 29. august 2012 nr. 842 om fastlegeordning i kommunene\\nDokumentasjon
  fr\u00e5 Helse Bergen, Haukeland Universitetssjukehus knytt til den daglege drifta
  og andre viktige forhold som blei send over ved f\u00f8rebuing av tilsynet:\\nFr\u00e5
  Ortopedisk avdeling\\n- Organisasjonskart Helse Bergen HF\\n- Organisasjonskart
  Ortopedisk klinikk\\n- Oversikt leiing og seksjonsleiarar i Ortopedisk avdeling\\n-
  Oversikt over tilsette legar og sjukepleiarar\\n- Tjenesteavtale for samarbeid om
  innleggelse i og utskriving fr\u00e5 spesialisthelsetjenesten innen somatisk sektor
  for Helse Bergen HF og Haraldsplass Diakonale Sjukehus AS\\n- Opprette sjekkliste
  for vurdering av PLO- behov, prosedyre gyldig fr\u00e5 20.08.14\\n- Elektronisk
  PLO. Pleie og omsorgsmeldinger mellom helseforetak og kommune\\n- Retningslinje
  for elektroniske meldinger \u2013 supplerer tjenesteavtale 3 og 5 for somatisk sektor\\n-
  Elektronisk PLO\\n- Korrespondanselogg\\n- Mottak av innleggelsesrapport fra kommunen\\n-
  Sende helseopplysninger\\n- Dialogmeldinger mellom helseforetak og kommune\\n- Epikrise
  \u2013 opprette og sende ut, prosedyre gyldig fr\u00e5 28.08.2014\\n- Hva som skal
  f\u00f8lge med pasienten ved utskrivelse\\n- Utreisekonvolutt\\n- Kirurgisk sjekkliste
  utskriving spl VOKSEN\\n- Melde utskrivingsklar pasient\\n- Utskrivingsrapport\\n-
  Melde utskrevet pasient\\n- N\u00f8drutiner\\n- Kompetansesystemet, OT, sengepost,
  nyansatt spl\\n- D\u00f8gnrutiner for avdeling for sykepleietjenester OT/HUS, prosedyre
  gyldig fra 7.10.2014\\n- Sykepleier fra OT sengepost \u2013 arbeidsoppgaver\\n-
  Internundervisning h\u00f8sten 2013\\nFr\u00e5 Medisinsk avdeling\\n- Organisasjonskart
  Helse Bergen HF\\n- Organisasjonskart for Medisinsk avdeling\\n- Informasjon om
  Medisinsk avdeling\\n- Oversikt over legar og sjukepleiarar ved Medisin 1 Nord\\n-
