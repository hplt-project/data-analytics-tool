  inkluderar n\u00f8dvendig utstyr (hjelm og paraglider med selet\u00f8y) som du trenger
  under kurset, l\u00e6reb\u00f8ker og n\u00f8dvendig forsikring og medlemskap.\\nEksamen
  / sertifisering\\nKurset avsluttast med teoripr\u00f8ve.\"", "\"Det er ei grense
  for kor mykje du kan tene f\u00f8r du f\u00e5r redusert stipendet, eller ikkje f\u00e5r
  gjort om noko av l\u00e5net til stipend.\\nUnntaksregelen inneber at L\u00e5nekassen
  ser bort fr\u00e5 inntekt som er over grensa i perioden 1. mars til 31. desember
  2020, dersom den er betaling for arbeid direkte knytt til koronapandemien. Det betyr
  at du kan tene over grensa for 2020 i denne perioden, og likevel f\u00e5 gjort om
  l\u00e5n til stipend. Har du anna inntekt som ikkje er direkte knytt til koronapandemien
  i den same perioden, gjeld ikkje unntaket for denne inntekta.\\nUnntaket gjeld berre
  enkelte grupper\\nDet er regjeringa som har bestemt at unntaket skal gjelde studentar
  i h\u00f8gare og anna utdanning i Noreg og utlandet:\\n- studentar i Noreg som arbeider
  i helse- og omsorgssektoren\\n- studentar i utlandet, b\u00e5de dei som arbeider
  i helse- og omsorgssektoren i Noreg og dei som eventuelt gjer dette i landet dei
  studerer i\\n- politistudentar som melder seg til teneste i politiet eller til beredskapsarbeid\\n-
  studentar som blir beordra til teneste i Heimevernet eller Sivilforsvaret\\nStudentar
  som har barn, f\u00e5r heller ikkje redusert barnestipendet ut fr\u00e5 ektefelle
  eller sambuar si ekstra inntekt fr\u00e5 arbeid knytt til koronapandemien. Dette
  unntaket gjeld ogs\u00e5 perioden mellom 1. mars og 31. desember 2020. Har sambuaren
  eller ektefellen din anna inntekt som ikkje er direkte knytt til koronapandemien
  i den same perioden, gjeld ikkje unntaket for denne inntekta.\\nDu m\u00e5 dokumentere
  at unntaket gjeld deg\\nDet er f\u00f8rst sommaren 2021 vi sjekkar kor h\u00f8g
  inntekt du hadde i 2020, for \u00e5 vurdere om du har rett til stipend for kalender\u00e5ret
  2020 eller ikkje. Det betyr at det er f\u00f8rst d\u00e5 du skal sende inn dokumentasjon
