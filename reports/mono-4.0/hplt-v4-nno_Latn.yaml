sample: '["\"Info Kj\u00f8pe ut negativer.\\nNegativa er i 6x6/6x7cm\\nDet varierer
  fr\u00e5 fotografering til fotografering,\\nkor mange bilde som var tatt, og om
  det er farge negativ,\\nsvartkvitt negativ eller begge deler.\\nAlle bilda fr\u00e5
  ei fotografering er samla i ein konvolutt, og selgast samla.\\nVi tilbyr ikkje digitalisering.\\nDette
  gjer vi kun n\u00e5r nokon bestiller print til full pris.\\nSpoonland i \u00c5lesund
  kan digitalisere eller produsere print fr\u00e5 negativ.\\nOm en har utstyr til
  det kan ein og scanne negativa sj\u00f8lv,\\nmen vi gjer oppmerkom p\u00e5 at det
  krever litt kunnskap\\nfor \u00e5 f\u00e5 perfekter farge og kontrast n\u00e5r en
  scanner negativ.\\nDet er heller ikkje uvanleg at ein m\u00e5 retusjere vekk\\nsm\u00e5
  st\u00f8vkorn som blir med i scann.\\nKva kan gjerast?\\nEn kan ikkje reparer sj\u00f8lve
  bildekopien, men negativa (filer fr\u00e5 2008) er godt tatt vare p\u00e5 i v\u00e5rt
  arkiv,\\nslik at du kan kj\u00f8pe nye kopiar.\\nDirekte sollys, varme, rammer/
  papp/\\nkonvoluttar som ikkje er syrefrie, kan framskynde falming.\\nPapir og kjemikalie
  har v\u00e5r i utvikling heile tida,\\nog ein har i ettertid sett at ikkje alle
  utvikling har v\u00e5r til det bedre.\\n(For eksempel falmer ikkje bilder fr\u00e5
  70 talet, p\u00e5 same m\u00e5te som bilder fr\u00e5 2000 osv)\\nIngen kommentarer:\\nLegg
  inn en kommentar\\nMerk: Bare medlemmer av denne bloggen kan legge inn en kommentar.\"",
  "\"1\\n2 INNLEIING/FORORD Trafikkulykker er noko som rammar dei som ferdast etter
  vegane - ogs\u00e5 i Lom. Det er mange ting som kan vera \u00e5rsak til ulykkene,
  som r\u00e5kar alle slag trafikantar. Kvart \u00e5r blir det for heile landet registrert
  ca trafikkulykker med personskade, og over 200 personar blir drepne i trafikken
  \u00e5rleg. I tillegg til sorg, sakn og lidingar for dei som blir r\u00e5ka n\u00e5r
  ulykka er ute, medf\u00f8rer det ogs\u00e5 store kostnader for samfunnet. (Forsking
  viser at trafikkulykker omfattar d\u00f8dsfall og sm\u00e5 og store personskadar
  i \u00e5r 2006 kosta samfunnet rundt minimum 25 milliardar kroner. For Lom kommune
  med 3 ulykker med lettare og alvorleg personskade i \u00e5r 2006 er samfunnskostnadene
  rundt 6 millionar kroner. I tillegg kjem dei materielle skadane som ogs\u00e5 m\u00e5
  erstattast.). Lom kommune vil ved utarbeiding av trafikksikringsplan setja seg som
  m\u00e5l at trafikken i og gjennom bygda skal bli sikrare for alle. Kommunens ynskje
  er \u00e5 utarbeide ein trafikksikringsplan som skal ivareta alle trafikantar. Planen
  skal reviderast fyrste gong etter 1 eitt \u00e5r, deretter kvart 5 \u00e5r, og eksisterande
  plan gjeld til ny/revidert plan er godkjent av dei politiske styresmaktene. Trafikksikringsplanen
  for Lom kommune blir utarbeidd fr\u00e5 ein disposisjon delt i fire grupper: Trafikant
  K\u00f8yrety Veg og vegmilj\u00f8 Trafikkstyring Trafikksikringsutvalet som vart
  oppnemnt i 2006 best\u00e5r av 5 representantar. Representantane er fr\u00e5 f\u00f8lgjande
  omr\u00e5de: 1 representant med tilknyting til formannskapet, leiar. 1 representant
  fr\u00e5 helsesektoren - helsesyster. 1 representant for skule barnehagane. 1 representant
  fr\u00e5 tenesteomr\u00e5de milj\u00f8-teknisk-n\u00e6ring ansvarleg for kommunale
  vegar. 1 representant fr\u00e5 lensmannsetaten/politiet. I tillegg oppnemnt kommunalt
  tilsett som sekret\u00e6r for utvalet. Ved utarbeiding av trafikksikringsplan og
  framtidig revisjon skal f\u00f8lgjande sp\u00f8rsm\u00e5l leggjast til grunn: *
  Kvifor har trafikkulykkene skjedd? Var det farten, hellinga p\u00e5 vegen, feilvurdering
  fr\u00e5 trafikanten eller noko anna som var \u00e5rsaka? * Kven vart r\u00e5ka
  av ulykka? Var det barn, ungdom, eldre, mann eller kvinne? * Kva var \u00e5rsakene
  til at ulykkene skjedde? Var det f\u00f8ret, v\u00e6ret, vegen, k\u00f8yretyet eller
  f\u00f8rarens k\u00f8yring? 2\\n3 * Kven kunne ha gjort noko for \u00e5 redusere
  eller hindra det som skjedde? Kunne trafikanten sj\u00f8lv, den som var passasjer,
  kommunen, Fylket eller Staten gjort noko. Det er ikkje mogleg \u00e5 gje noko eintydig
  svar p\u00e5 desse sp\u00f8rsm\u00e5la, men sp\u00f8rsm\u00e5lstillinga kan vera
  til stor hjelp i arbeidet med planen. Oppnemnt trafikksikringsutval har moglegheit
  til \u00e5 vurdere risikoniv\u00e5et der ulykker har skjedd og skaffe seg bakgrunnsmateriale
  for \u00e5 vurdere risikoniv\u00e5et i framtida. Oppnemnt trafikksikringsutval m\u00e5
  leggja mest vekt p\u00e5 trafikanten, k\u00f8yretyet, vegen, vegmilj\u00f8et og
  f\u00f8rar si \u00e5tferd ved endring/revisjon av planen. Kommunen har liten innverknad
  p\u00e5 trafikkstyringa da denne er styrt ut fr\u00e5 Lov- og regelverk som er grunnleggjande
  for all trafikk\u00e5tferd. Lom, den 21. januar Simen Bj\u00f8rgen ordf\u00f8rar
  3\\n4 OVERSIKT OVER VEDLEGG 1. Kart over Lom kommune med innteikna vegtypar (RV,
  FV og Kommunale vegar/plassar) 2. Ulykkesoversikt for Lom kommune fr\u00e5 Statens
  Vegvesen Oppland. Oversikta gjev f\u00f8lgjande opplysningar: Politirapporterte
  personskadeulykker i Lom kommune antal ulykker Politirapporterte personskadeulykker
  i Lom kommune antal drepne og skadde Politirapporterte personskadeulykker i Lom
  kommune ulykkestypar Politirapporterte personskadeulykker i Lom kommune vegkategori
  Politirapporterte personskadeulykker i Lom kommune vegar Politirapporterte personskadeulykker
  i Lom kommune ulykker fordelt p\u00e5 m\u00e5nader Politirapporterte personskadeulykker
  i Lom kommune ulykker fordelt p\u00e5 vekedagar Politirapporterte personskadeulykker
  i Lom kommune personskadeulykker i l\u00f8pet av eit d\u00f8gn Politirapporterte
  personskadeulykker i Lom kommune f\u00f8reforhold n\u00e5r ulykkene skjedde Politirapporterte
  vegtrafikkulykker med personskade i Lom kommune detaljert liste for veg, vegnummer,
  HP, kilometrering, vegnamn, dato, klokkeslett, vekedag, uhellskode, antal drepne/skadde,
  f\u00f8reforhold og v\u00e6rforhold. 4\\n5 GENERELT OM LOM KOMMUNE Lom kommune ligg
  midt i Ottadalen og har grenser mot Skj\u00e5k kommune mot nordvest, Luster kommune
  i Sogn og Fjordane mot vest/s\u00f8rvest og V\u00e5g\u00e5 kommune mot s\u00f8r,
  aust/nordaust. Kommunen har eit areal p\u00e5 1 951,00 km2 - storparten av arealet
  er fjellomr\u00e5de. Folketalet i kommunen er ca personar. Gjennom kommunen g\u00e5r
  riksveg 15 som er heil\u00e5rsveg og g\u00e5r vidare gjennom Skj\u00e5k over til
  Stryn. I Lom sentrum - Fossbergom - tek riksveg 55 av fr\u00e5 riksveg 15 gjennom
  B\u00f8verdalen over Sognefjellet til Luster kommune. Riksveg 55 over Sognefjellet
  er den h\u00f8gste fjellovergangen i landet (1 434 m.o.h). Riksveg 15 har ei strekning
  p\u00e5 22,6 km gjennom kommunen - fr\u00e5 V\u00e5g\u00e5 grense (Byrbergtunnelen)
  til Skj\u00e5k grense. Riksveg 55 har ei strekning p\u00e5 52,6 km fr\u00e5 Fossbergom
  til grensa mot Luster/Sogn og Fjordane. Fylkesvegar og kommunale vegar er til saman
  ca. 39 km + 31 km = 70 km. P\u00e5 riksveg 15 er det stor trafikk av tunge k\u00f8yrety
  heile \u00e5ret. I tillegg er det ein god del tungtransport til og fr\u00e5 kommunen
  elles. Det m\u00e5 ogs\u00e5 reknast med ein betydeleg trafikkauke s\u00e6rskilt
  tungtransport ved omlegging av ymse vegstrekningar p\u00e5 Vestlandet. P\u00e5 sommarstid
  er turisttrafikken den dominerande med turbussar, campingbilar, bilar med campingvogner
  i tillegg til den vanlege trafikken. P\u00e5 riksveg 55 er det i tillegg til turisttrafikk
  og vanleg trafikk mykje tungtransport den tida vegen over Sognefjellet er sommaropen.
  Fr\u00e5 mai til oktober/november er det til tider ekstra stor trafikk p\u00e5 strekninga
  Fossbergom Galdesanden av skifolk som trenar p\u00e5 Galdh\u00f8piggen Sommerskisenter.
  Lom kommune meiner det er viktig at ferdsla i og gjennom bygda er s\u00e5 god og
  sikker som mogleg. Dette gjeld for alle brukarar av dei offentlege vegane, og Lom
  kommune har utarbeidd trafikksikringsplanen for \u00e5 f\u00e5 sett dette arbeidet
  i system og for \u00e5 f\u00e5 gjennomf\u00f8rt tiltaka p\u00e5 ein planmessig m\u00e5te.
  M\u00c5LSETJING MED PLANEN Med denne planen har Lom kommune som m\u00e5lsetjing
  \u00e5 gjera trafikken i kommunen sikrast mogleg for alle trafikantar. Dette inneber
  eit m\u00e5l om at f\u00f8lgjande ulykker skal reduserast: - fotgjengarulykker -
  utfork\u00f8yringsulykker - forbik\u00f8yringsulykker - m\u00f8teulykker 5\\n6 ELEMENT
  I TRAFIKKSYSTEMET For \u00e5 f\u00e5 ei fullgod oversikt over arbeidet som kan gjerast
  for \u00e5 sikre tryggleiken i trafikken, er det n\u00f8dvendig \u00e5 plassere
  mest mogleg av det som har innverknad p\u00e5 trafikksikringa i grupper. Ein deler
  desse gruppene inn slik: Trafikant K\u00f8yrety Vegen og vegmilj\u00f8et Trafikkstyringa
  Trafikant Trafikantane er dei som ferdast i trafikken, eller oppheld seg i eit trafikkert
  milj\u00f8 - t.d. fotgjengarar, syklistar, motorsyklistar, bilf\u00f8rarar, passasjerar
  m.m. K\u00f8yrety Med k\u00f8yrety meiner ein sykkel, moped, motorsykkel, bil eller
  liknande k\u00f8yrety som ikkje g\u00e5r p\u00e5 skjener eller er luftfarty. Vegen
  og vegmilj\u00f8et Med dette meiner ein alt som har med veg og vegmilj\u00f8 \u00e5
  gjera. Det kan vera k\u00f8yrebane, oppmerking, trafikkskilt og omgjevnadene langs
  vegen som kan verke inn p\u00e5 trafikken/trafikkbiletet. Trafikkstyringa Trafikkstyring
  er dei reguleringstiltak som samfunnet set i verk for at ulykker og uhell ikkje
  skal skje. Dette kan vera lover og reglar som styrer trafikk og trafikantar. Vegsystemet
  er regulert gjennom Vegtrafikklova og forskrifter som har heimel i denne. Forskriftene
  er m.a. trafikkreglar, krav til k\u00f8yrety, reglar om skilting m.m. Avgjerande
  for om lovverket skal ha ulykkesreduserande verknad, er at det blir fylgt opp med
  kontroll og sanksjonar for brot p\u00e5 reglane. 6\\n7 TRAFIKKSIKRINGSARBEIDET For
  \u00e5 oppn\u00e5 eit mest mogleg effektivt trafikksikringsarbeid, m\u00e5 ein sj\u00e5
  dei ulike delane i systemet i samanhang. Tiltak som blir sett i verk, m\u00e5 gjerast
  best mogleg slik at samspelet blir det beste, noko som vil gje den beste trafikksikringsgevinsten.
  ORGANISERING AV TRAFIKKSIKRINGSARBEIDET Ansvarsfordeling Staten Staten v/samferdselsdepartementet
  har eit overordna ansvar for trafikksikringsarbeidet i Noreg. Andre departement
  har ogs\u00e5 ansvar - t.d. Justisdepartementet, Kirke-, undervisnings- og forskningsdepartementet
  m.fl. Vegdirektoratet er fagorgan for trafikksikringsarbeid og har eit overordna
  ansvar for vegplanlegging, vegbygging, f\u00f8raroppl\u00e6ring m.v. Fylket Fylket
  har ansvar for samordning av trafikksikringsarbeidet i fylket. Til dette er det
  i dei fleste fylke oppnemnt fylkestrafikksikringsutval (FTU). Kommunen Det er opp
  til kvar einskilt kommune \u00e5 organisere trafikksikringsarbeidet. For Lom kommune
  sin del er det formannskapet som har det overordna ansvaret for alt trafikksikringsarbeid.
  N\u00c6RARE BESKRIVING AV YMSE ELEMENT I TRAFIKKSYSTEMET 1. TRAFIKANT Trafikantretta
  tiltak er haldningsskapande arbeid med oppl\u00e6ring, informasjon og kontroll.
  P\u00e5verknad av dei ulike trafikantar gjev som regel godt resultat. Lom kommune
  vil prioritere f\u00f8lgjande oppl\u00e6rings-/haldningsskapande tiltak: OPPL\u00c6RINGSTILTAK
  FOR RESSURSPERSONAR Arrangere \u00e5rleg samling mellom personar fr\u00e5 helse-
  og skulesektoren, lensmannsetaten og den politiske leiinga i kommunen, der hovudtemaet
  er trafikksikring. TILTAK FOR SIKRING AV BARN I BIL Kommunen vil s\u00f8kje \u00e5
  gje kunnskap om og motivere til bruk av sikringsutstyr for barn i bil. Informasjon
  om dette blir gjeve p\u00e5 helsestasjonen. Vil vi ogs\u00e5 bruke Steinar Skaansar
  & S\u00f8nn AS som forhandlar barnesikringsutstyr da det her er mykje nytt til kvar
  tid. TRAFIKKOPPL\u00c6RING I BARNEHAGANE Arbeide for \u00e5 gjennomf\u00f8re ei
  fullgod trafikkoppl\u00e6ring i barnehagane. Bruke minimum Trygg Trafikk sitt opplegg.
  Oppl\u00e6ringa m\u00e5 ogs\u00e5 omfatte informasjon og oppl\u00e6ring til foreldre
  om kor viktig det er \u00e5 sikre borna ved transport i bil. 7\\n8 TRAFIKKOPPL\u00c6RING
  I SKULANE Arbeide for \u00e5 gjennomf\u00f8re ei fullgod trafikkoppl\u00e6ring i
  skulane. Bruke minimum Trygg Trafikk sitt opplegg for dei ulike klassetrinn. Her
  b\u00f8r politiet inn p\u00e5 9. klassetrinn og informere om rus, trafikksikkerheit
  m.m. Foreldre har ein viktig rolle n\u00e5r det gjeld trafikkoppdraging i heimen.
  Ei \u00e5rleg p\u00e5minning om dette kan gjerast ved at det p\u00e5 storforeldrem\u00f8te
  blir sett fokus p\u00e5 trafikksikkerheit og foreldra sin rollemodell for sine born.
  Her kan ein ogs\u00e5 engasjere politi, ambulansepersonell m.m. KAMPANJE I BRUK
  AV REFLEKS Kvar haust gjennomf\u00f8re ei \u00e5rleg kampanje i bruk av refleks,
  med s\u00e6rleg fokus p\u00e5 bruk av refleksvestar. Denne kampanjen b\u00f8r gjennomf\u00f8rast
  for skuleverket og organisasjonar for yngre og eldre. I kampanjen b\u00f8r ogs\u00e5
  lensmannsetaten og forsikringsselskapa delta. Forsikringsselskap og lokale bedrifter
  b\u00f8r kontaktast som eventuelle sponsorar for refleksbrikker/band/vestar. I tillegg
  kan kommunen gjennomf\u00f8re reflekskampanje gjennom lokalpressa og p\u00e5 kommunen
  si heimeside. KRAV TIL SIKRING FOR DEI SOM HAR SKULESKYSS Kvar haust - ved skulestart
  - skal det gjennomf\u00f8rast informasjon/oppl\u00e6ring i busskultur for barn,
  l\u00e6rarar og foreldre. Informasjonen/oppl\u00e6ringa b\u00f8r omfatte ferdsel
  og \u00e5tferd til/fr\u00e5 og p\u00e5 busshaldeplass, p\u00e5- og avstiging av
  bussen og \u00e5tferd i bussen. Slik informasjon/oppl\u00e6ring skal gjevast til
  alle elevar men med s\u00e6rleg vekt p\u00e5 dei yngste. Det m\u00e5 setjast krav
  til h\u00f8g standard p\u00e5 bussane, med sikringsutstyr/sikkerheitsbelte p\u00e5
  alle passasjerplassane og obligatorisk sitjeplass til alle passasjerane i bussane.
  SYKLING OG BRUK AV HJELM Kvart \u00e5r skal det gjennomf\u00f8rast tiltak i trygg
  bruk av sykkel og hjelm. LEDSAGERST\u00d8TTA OPPL\u00c6RING Informasjon/oppl\u00e6ring
  tenkt for foreldre til 16-\u00e5ringar som skal \u00f8vingsk\u00f8yre for \u00e5
  ta f\u00f8rarkort for bil. Slik informasjon/oppl\u00e6ring kan vera med p\u00e5
  \u00e5 betre kvalifikasjonane hj\u00e5 dei som skal vera ledsagarar. I tillegg b\u00f8r
  ein kunne s\u00f8kje samarbeid med oppl\u00e6ringsprosjektet som er sett i gang
  ved den vidare\u00e5gande skulen i kommunen. TILTAK FOR UNGDOM Leggje opp til eit
  systematisk arbeid retta mot ungdom. Desse utgjer ei stor gruppe som er \u00e5rsak
  til alvorlege trafikkulykker. I det f\u00f8rebyggjande arbeidet b\u00f8r det i tillegg
  til reint trafikksikringsarbeid ogs\u00e5 setjast fokus p\u00e5 f\u00f8rebyggjande
  arbeid mot rus, vald og vinningskriminalitet, noko som kan ha ei positiv synergieffekt
  p\u00e5 trafikksikringsarbeidet. Tiltaka m\u00e5 rettast mot all type ungdom, der
  det b\u00f8r setjast sterkt fokus mot s\u00e5kalla uorganisert ungdom, s\u00e6rleg
  innafor bilinteresserte milj\u00f8. Dette kan mogleg vera med \u00e5 bidra til at
  utfordringar knytt til desse risikogruppene kan l\u00f8ysast p\u00e5 ein enklare
  m\u00e5te. 8\\n9 OPPFRISKINGSKURS FOR ELDRE BILF\u00d8RARAR (65+) Mange eldre bilf\u00f8rarar
  manglar oppdatering p\u00e5 gjeldande trafikkreglar. Eit oppfriskingskurs for desse
  kan gjera dei sikrare som bilf\u00f8rarar med tanke p\u00e5 dei endringar som har
  skjedd i regelverket og det faktum at ferdigheitene tapar seg med alderen. Ved slike
  kurs er det ogs\u00e5 viktig \u00e5 fokusere p\u00e5 rusp\u00e5verka k\u00f8yring.
  Rusp\u00e5verka f\u00f8rarar er pr i dag innblanda i 40% av alle d\u00f8dsulykker.
  Statistikk viser at eldre kvinner og yngre menn er ekstremgrupper i denne problematikken.
  (Slike kurs kan skipast til saman med nabokommunane eller som eit ope kurstilbod
  b\u00e5de for eldre og andre bilf\u00f8rarar som kunne ynskje det. B\u00f8r gjennomf\u00f8rast
  ved innleige av instrukt\u00f8r fr\u00e5 godkjent k\u00f8yreskule). FOTGJENGARAR
  Ein \u00e5rleg informasjonsdag der temaet er fotgjengarar i alle aldrar. \u00c5TFERDSREGISTRERING
  Registrering og informasjon om trafikal \u00e5tferd p\u00e5 kommunale vegar. B\u00f8r
  gjennomf\u00f8rast over ei periode over fleire \u00e5r. Ved avsluttinga av perioden
  skal det oppsetjast rapport med vekt p\u00e5 dokumentasjon. BEITEDYR Registrering
  av vegstrekningar der det er stor fare for beitedyr og oppsetjing av statistikk
  over trafikkulykker p\u00e5 grunn av slike dyr. 9\\n10 2. K\u00d8YRETY Tilstanden
  til ulike k\u00f8yrety er med p\u00e5 \u00e5 p\u00e5verke sikkerheita i trafikken.
  Etter innf\u00f8ring av periodisk k\u00f8yretykontroll (PKK) av personbilar - med
  kontroll kvart andre \u00e5r - er tilstandskontroll av desse ivareteke. N\u00e5r
  det gjeld tilstanden av andre type k\u00f8yrety - t.d. landbruksmaskiner/reiskap
  som ferdast etter offentleg veg - er det lite kommunen kan gjera med unntak av \u00e5
  vera med p\u00e5 eventuelle informasjonsopplegg. Kommunen kan oppmode lensmannsetaten,
  arbeidstilsynet og vegvesenet til \u00e5 prioritere kontroll av landbruksk\u00f8yrety
  og sikring av arbeidsreiskap ved transport p\u00e5 offentleg veg. Landbrukskontoret
  og landbruksorganisasjonane b\u00f8r gjennomf\u00f8re informasjonsm\u00f8te evt.
  sende ut informasjonsskriv med tanke p\u00e5 reglar for ferdsel med landbruksutstyr
  etter veg, og kor viktig tilstanden p\u00e5 landbruksmaskiner/og reiskap er for
  trafikksikkerheita. 3. VEGEN OG VEGMILJ\u00d8ET Vegen og vegmilj\u00f8et er delt
  i 3 omr\u00e5de: Kommunale vegar Statlege og fylkeskommunale vegar Private vegar
  A. KOMMUNALE VEGAR Som ansvarleg for kommunale vegar skal kommunen arbeide for at
  desse er i forsvarleg stand, godt sikra og skilta b\u00e5de for f\u00f8rarar av
  k\u00f8yrety og mjuke trafikantar. Dei einskilde tiltaka er lista opp i handlingsplan
  som er vedlagt plandokumentet og viser hovudelementa. Lom kommune vil prioritere
  f\u00f8lgjande tiltak p\u00e5 kommunale vegar n\u00e5r det gjeld trafikksikring:
  Vintervedlikehald p\u00e5 kommunale vegar som er opne for allmenn ferdsel. Skilting
  Betring av sikttilh\u00f8ve TILTAK P\u00c5 KOMMUNALE VEGAR. Br\u00f8yting/str\u00f8ing
  B\u00e5de kommunen og vegvesenet legg vekt p\u00e5 kor viktig det er med tidleg
  br\u00f8yting/str\u00f8ing av vegnettet. Dette gjeld s\u00e6rleg i dei omr\u00e5de
  der mjuke trafikantar ferdast/oppheld seg. Vegljos Det er dels bygd ut med vegljos
  i regulerte omr\u00e5de/bustadfelt, men st\u00e5r att noko utbygging ved utviding
  i eldre bustadfelt. Det er ogs\u00e5 ynskjeleg med oppf\u00f8ring av vegljos p\u00e5
  strekninga fr\u00e5 Presthaugen til avk\u00f8yring til Andvordsjordet, da det mykje
  trafikk av mjuke trafikantar p\u00e5 denne strekninga. Denne strekninga er fylkesveg
  og ei utbygging med belysning b\u00f8r skje i samarbeid med Statens Vegvesen ved
  eventuell opparbeiding av gang/sykkelveg. 10\\n11 Fartsreduksjon ved skilting Skilte
  for fartsreduksjon p\u00e5 kommunale vegar med stor trafikk av mjuke trafikantar.
  Innf\u00f8re fast fartsgrense p\u00e5 30 km/t for alle vegar i kommunale bustadfelt.
  Sikringsarbeid Rydding m.m. for \u00e5 betre sikt og sikring med autovern/rekkverk.
  Utbetring av snuplassar p\u00e5 blindvegar i bustadfelt slik at st\u00f8rre k\u00f8yrety
  f\u00e5r snudd/slepp \u00e5 rygge lengre strekningar innan feltet. F\u00e5 slutt
  p\u00e5 parkering p\u00e5 gang- og sykkelvegar p\u00e5 Fossbergom. F\u00e5 slutt
  p\u00e5 parkering p\u00e5/i omr\u00e5det omkring ungdomsskulen. Parkering skal skje
  p\u00e5 parkeringsplassen mellom Steinfjoset og Biblioteket/Loar kultursenter. Heil\u00e5rsstenging
  (helst med fj\u00f8rbelasta bom) for gjennomk\u00f8yring til Ballbinge og ny skuleplass
  mellom nybygg og Max-fl\u00f8ya. Vurdere \u00e5 ta bort gangfeltet over riksvegen
  ved Prestegarden/Samfunnshuset for \u00e5 f\u00e5 b\u00e5de ungar og vaksne til
  \u00e5 bruke undergangen for \u00e5 koma til gang- /sykkelvegnettet. Setja opp hinder
  eller gjennomf\u00f8re kontrollar for \u00e5 f\u00e5 elevane ved Lom vidareg\u00e5ande
  skule til \u00e5 bruke undergangen, slutte og krysse over gr\u00f8ft fr\u00e5 gang-/sykkelveg
  og over riksvegen for \u00e5 koma inn p\u00e5 ungdomsskuleomr\u00e5det. B. STATLEGE
  OG FYLKESKOMMUNALE VEGAR. Kommunen kan gjennom ein god og aktiv dialog med Statens
  Vegvesen vera med \u00e5 p\u00e5verke trafikksikringstiltak p\u00e5 statlege og
  fylkeskommunale vegar. Kommunen kan fungere som eit mellomledd mellom dei ulike
  brukarane og Statens Vegvesen for \u00e5 gje informasjon om ynskje fr\u00e5 brukarane
  si side. Kommunen ser for seg f\u00f8lgjande hovudelement som den kan bidra med
  innan trafikksikringsarbeidet p\u00e5 vegnettet som Statens Vegvesen har ansvaret
  for: Vegljos Sikring av busshaldeplassar bygging av gang- og sykkelvegar TILTAK
  P\u00c5 STATLEGE OG FYLKESKOMMUNALE VEGAR DER KOMMUNEN KAN KOMA MED INNSPEL/ST\u00d8TTE
  OPP. Gang- og sykkelvegar. Koma med framlegg og samarbeide med Statens Vegvesen
  ved opparbeiding av gang- og sykkelvegar. TILTAK LANGS RIKS- OG FYLKESVEGAR. Tiltak
  p\u00e5 desse vegane er Statens Vegvesen sitt ansvar og ligg ikkje direkte under
  den kommunale trafikksikringsplanen. Lom kommune oppmodar Statens Vegvesen om \u00e5
  merke seg momenta og vurdere dei i sitt planverk. 11\\n12 Utbetring av farlege vegkryss.
  Utbetring av krysset Lykkjavegen RV 15 ved Norsk Fjellmuseum. Utbetring av kryss
  RV 15 Meadalsvegen (privat veg) og omplassering av busslommer evt fartsreduksjon
  forbi dette krysset. Utbetring av kryss RV 55 Kommunal veg Hoft Visbrua og evt fartsreduksjon
  p\u00e5 strekninga Hoftabrua - forbi R\u00f8isheim. Tverrprofilar og vegbredde.
  RV 15 (V\u00e5g\u00e5 grense Skj\u00e5k grense), RV 55 (Fossbergom Sognefjellet)
  og fylkesvegane i kommunen er smale, noko som gjer at trafikantane f\u00f8ler seg
  utrygge. RV 15 som er heil\u00e5rsveg over til Vestlandet er heile \u00e5ret sterkt
  trafikkert av store vogntog. Her m\u00e5 det ogs\u00e5 reknast med betydeleg trafikkauke
  i \u00e5ra som kjem. Betring av sikttilh\u00f8ve og linef\u00f8ring. Sikre gode
  sikttilh\u00f8ve langs vegen ved at det blir utf\u00f8rt kantsl\u00e5tt, eller at
  det blir oppmoda til/gjennomf\u00f8rt uttynning av tett skog/kratt som veks inntil
  vegkanten. Sikring av vegstrekningar med vegrekkverk. Sikre med autovern p\u00e5
  FV 467 strekninga Urde til Vangen, da elva B\u00f8vra her g\u00e5r heilt inntil
  vegkanten. Betre sikring/oppsetting av h\u00f8gare gjerde p\u00e5 FV 471 ved Rustahalsen.
  Setja opp autovern/sikring p\u00e5 strekningar der det er n\u00f8dvendig i samband
  med at det blir gjennomf\u00f8rt utbetringsarbeid. Vegljos. Oppsetting av vegljos
  p\u00e5 strekningar der gang-/sykkelvegar eller fortaug ikkje er avdelt fr\u00e5
  k\u00f8yrevegen med gr\u00f8ft eller autovern. Busstoppestader. Opparbeide tilfredsstillande
  busslommer ved haldeplassar p\u00e5 riksvegar og fylkesvegar, evt. med oppsetjing
  av buss-skur/leskur. Skilting. Skilting/tiltak som hindrar ulovleg utk\u00f8yring
  og parkering ved rundk\u00f8yringa i Lom sentrum. 12\"", "\"Human Relations-skulen
  blir \u00f2g kalla \\\"menneskeskulen\\\", ettersom det blei lagt stor vekt p\u00e5
  dei sosiale og psykologiske faktorane p\u00e5 arbeidsplassen. Dette st\u00e5r i
  motsetnad til prinsippa i Scientific Management, som var meir retta mot \u00e5 effektivisere
  kvar enkelt arbeidsoppg\u00e5ve.\\nBakgrunnen for Human Relations \u2013 Hawthorne-prosjektet\\nI
  1930-\u00e5ra blei det sett i gang eit forskingsprosjekt ved fabrikken Western Electrics
  Hawthorne i Chicago. M\u00e5let var \u00e5 vidaref\u00f8re Taylor sine idear om
  systematisk rasjonalisering. Forskarane skulle unders\u00f8kje korleis ulike arbeidsforhold
  verka inn p\u00e5 produksjonen. Arbeidet besto av forskjellige formar for montering.\\nDet
  viste seg at dei kvinnelege arbeidstakarane i fors\u00f8ksgruppa auka produktiviteten
  meir enn andre. Det skjedde sj\u00f8lv om det fysiske arbeidsmilj\u00f8et og dei
  ytre tilh\u00f8va ikkje var betre for dei enn det var i andre delar av bedrifta.
  I ein periode blei til og med dei ytre arbeidstilh\u00f8va forverra. Likevel auka
  produktiviteten, og forskarane lurte p\u00e5 kva \u00e5rsaka var.\\nDet viktigaste
  funnet i Hawthorne-prosjektet var at produktiviteten auka ved auka trivsel, og at
  trivsel var avhengig av uformelle gruppenormer. N\u00e5r gruppemedlemmane opplevde
  arbeidet i gruppa som betydingsfullt, auka trivselen.\\nForskarane arbeidde n\u00e6rt
  saman med gruppa, og var sterkt opptatt av arbeidstilh\u00f8va. I gruppa oppsto
  det sterke normer om produktivitet, arbeidsinnsats og uformell leiing, og gruppemedlemmane
  opplevde sj\u00f8lvstyre og f\u00f8lte seg betydingsfulle.\\nI motsetnad til i scientific
  management, blei det no lagt mykje st\u00f8rre vekt p\u00e5 det sosiale og relasjonelle
  p\u00e5 ein arbeidsplass.\\nKonsekvensen av Hawthorne-prosjektet var at ein begynte
  \u00e5 tenkje i nye banar n\u00e5r det gjaldt tilrettelegging av arbeid. Leiarane
  skulle vere meir tillitvekkjande og medmenneskelege. Det blei lagt vekt p\u00e5
  at arbeidarane og leiing hadde felles interesser, og det blei viktig \u00e5 utvikle
  fellesskapsf\u00f8lelse i bedriftene.\\nHawthorne-effekten\\nI ettertid har prosjektet
  blitt kritisert for \u00e5 ha vore lite vitskapeleg gjennomf\u00f8rt, p\u00e5 same
  m\u00e5te som Taylor sine idear om scientific management. Fr\u00e5 psykologien veit
  vi at merksemd f\u00f8rer til motivasjon. N\u00e5r ein lyttar til folk og tar omsyn
  til \u00f8nska deira, kan det vere nok til at produktiviteten og trivselen blir
  p\u00e5verka i positiv retning. Det \u00e5 bli unders\u00f8kt f\u00f8rte alts\u00e5
  til ei forbetring for gruppa. Dette kallar vi ogs\u00e5 Hawthorne-effekten\u00b9.\\nHuman
  Relations i dagens arbeidsliv?\\nSj\u00f8lv om Hawthorne-prosjektet blei kritisert,
  f\u00f8rte det til ei erkjenning av at dei sosiale og psykologiske faktorane gjer
  noko med arbeidsmilj\u00f8et og produktiviteten p\u00e5 arbeidsplassen.\\nDette
  er like viktig i dag som for nesten 100 \u00e5r sidan, sannsynlegvis i end\u00e5
  st\u00f8rre grad?\\nSom arbeidstakarar \u00f8nskjer vi \u00e5 f\u00f8le at jobben
  v\u00e5r er nyttig og verdfull, og at vi blir h\u00f8yrt og sett.\\nNo kan vi ikkje
  gi Human Relations all \u00e6re for at dei sosiale faktorane er oppskrifta p\u00e5
  suksess i ei bedrift, men det var ein kime til endring, og eit nytt syn p\u00e5
  mennesket som ressurs.\\nOrganisasjonstenking og teoriar innanfor denne retninga
  har etterkvart blitt arbeidd med og vidareutvikla. Blant anna er det blitt vektlagt
  korleis arbeidsplassen er ein stad der vi skal trivast, og der vi f\u00e5r dekt
  fleire behov enn \u00e5 f\u00e5 l\u00f8nn p\u00e5 konto kvar m\u00e5nad. \u00c5
  delta i ein fellesskap, og moglegheita for \u00e5 l\u00e6re og utvikle seg, er ofte
  trekt fram som d\u00f8me p\u00e5 kva folk meiner er viktig i dagens arbeidsliv.\\nVi
  brukar stort sett alltid det engelske uttrykket n\u00e5r vi snakkar om denne retninga.
  Kva betyr \\\"Human Relations\\\"? Overset uttrykket, og fors\u00f8k \u00e5 lage
  ditt eige norske namn.\\nKilder:\\n\u00b9 Svartdal, Frode. (2019, 18. februar).
