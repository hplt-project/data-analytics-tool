  fornamnet ditt og f\u00f8rste bokstav i etternamnet ditt, klikk OK. Klikk p\u00e5
  Video og tast inn f\u00f8lgande testnummer: 998112. F\u00f8lg instruksjonane p\u00e5
  skjermen.\\nVi anbefalar ei bandbredde p\u00e5 minimun 10 mbit/s for \u00e5 gjennomf\u00f8re
  eit stabilt videom\u00f8te/kurs. Dersom du opplev utfordringar, sjekk ulike innstillingar,
  sj\u00e5 sp\u00f8rsm\u00e5l og svar eller f\u00e5 svar via Norsk helsenett sine
  nettsider: Om JOIN\\nKontaktinformasjon og st\u00f8tte\\nHar du utfordringar med
  oppkopling til kurs eller andre tekniske sp\u00f8rsm\u00e5l knytt til digitale kursrom?
  Ta kontakt p\u00e5\\n72 57 40 00 (gjeld berre tekniske sp\u00f8rsm\u00e5l).\\nOpningstid
  alle kvardagar fr\u00e5 kl. 08.30 - 15.00.\\nPersonvern\\nVed at ein skriv inn navnet
  sitt og loggar seg inn i JOIN-l\u00f8ysinga bekreftar ein at man har lest og samtykker
  i Norsk helsenett sine vilk\u00e5r for bruk og personvernreglar.\\nMeir om personvern\\nEin
  har per i dag ikkje h\u00f8ve til \u00e5 bruke Join-m\u00f8terom til sensitivt innhald
  slik som ved videokonsultasjonar. Under digitale kurs for pasientar og p\u00e5r\u00f8rande
  har kursleiar ansvar for at kursrommet l\u00e5sast, kontrollere at dei som er tilstades
  er p\u00e5meldte og informere om personvern.\\nDet skal informerast om moralsk taushetspliktensitive
  opplysningar ein ikkje sj\u00f8lv \u00f8nsker at andre utanfor kurset skal vite
  om. Ein oppfordrar til at kun p\u00e5meldte skal h\u00f8yre innhaldet fra kurset,
  men n\u00e5r kamera er skrudd av kan ein ikkje vere hundre prosent sikker p\u00e5
  om andre enn p\u00e5melde til kursa deltek i det digitale rommet, sj\u00f8lv om
  kursleiar skal arbeide for at ingen uvedkommande deltek.\\nDu finn vilk\u00e5r og
  generell informasjon p\u00e5 heimesidene til Norsk helsenett\\nVed andre sp\u00f8rsm\u00e5l
  knytt til personvern kan personvernombodet kontaktast via e-post til postmottak@helse-mr.no.
  N\u00e6rare informasjon om korleis personopplysingane dine vil bli behandla, st\u00e5r
  i personvernerkl\u00e6ringa v\u00e5r.\\nUnder digitale kurs\\nDu vil f\u00e5 informasjon
  om kurshaldar i starten av kurset korleis kurset vert lagt opp samt om funksjonar
  i det digitale rommet.\\nN\u00e5r du loggar inn i kurs/m\u00f8terommet vil du sj\u00e5
  eit stort vindu der f\u00f8relesarar/vertar og presentasjonar vert vist. Til venstre
  kan du opne opp eit sidepanel med innstillingar og chat. Nedst p\u00e5 skjermen
  din vil du f\u00e5 opp ei verkt\u00f8ylinje med ulike symbol, med forklaring n\u00e5r
  du held musepeikaren over symbolet. Pass p\u00e5 at symbolet heilt til venstre (innkommende
  lyd) ikkje er skrudd av. Kamerasymbolet kan du velge \u00e5 skru av og p\u00e5 etter
  avtale under kurs. Vi anbefalar at du klikkar p\u00e5 symbolet med mikrofon slik
  at du skrur av din eigen mikrofin for \u00e5 ikkje forstyrre. Trykker du p\u00e5
  den raude knappen vil du avslutte/logge av kurset og dette kan gjerast f\u00f8rst
  n\u00e5r kursdagen er over.\\nFinne chat og innstillingar\\nEin kan halde musa p\u00e5
  venstre side av skjermen og klikke p\u00e5 Vis sidepanel, d\u00e5 vil ein f\u00e5
