  djecu i napu\u0161tene \u017eivotinje jer smatra da su oni najranjiviji i da im
  je pomo\u0107 prijeko potrebna.\"", "\"Za uspje\u0161no online poslovanje osim kvalitetnog
  web servera i sadr\u017eaja potrebno je osigurati sigurnu i provjerenu komunikaciju
  s posjetiteljima va\u0161ih web stranica, te jednostavnu mogu\u0107nost provjere
