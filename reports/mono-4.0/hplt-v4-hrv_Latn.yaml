  ne napla\u0107uju se i sve poslove vr\u0161e volonteri.\\nOsim Male \u0161kole privatnosti,
  Hacklab01 tako\u0111er nudi i niz drugih radionica i programa, u sklopu kojih mo\u017eete
  nau\u010diti kako izra\u0111ivati web stranice, koristiti Linux, osigurati ra\u010dunalne
