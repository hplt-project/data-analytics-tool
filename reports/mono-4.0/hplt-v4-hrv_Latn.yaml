  izdava\u010dima, klijentima i partnerima.\\nTako\u0111er, dopu\u0161tamo tre\u0107im
  stranama da prikupljaju podatke o vama putem Tehnologija pra\u0107enja.\\n\u0160to
  su kola\u010di\u0107i?\\nKola\u010di\u0107i su male tekstualne datoteke (sastavljene
  samo od slova i brojeva) koje web-poslu\u017eitelj postavlja na va\u0161e ra\u010dunalo
  ili mobilni ure\u0111aj kada posjetite web-stranicu. Kada se upotrebljava, kola\u010di\u0107
  mo\u017ee pomo\u0107i da na\u0161e Usluge budu prilago\u0111ene korisniku, na primjer,
  pam\u0107enjem va\u0161ih jezi\u010dnih postavki. Vi\u0161e informacija o kola\u010di\u0107ima
  mo\u017eete prona\u0107i na www.allaboutcookies.org.\\nKola\u010di\u0107i su u \u0161irokoj
  upotrebi kako bi web-mjesta funkcionirala na u\u010dinkovit na\u010din. Upotreba
  kola\u010di\u0107a omogu\u0107uje vam u\u010dinkovito kretanje izme\u0111u stranica.
  Kola\u010di\u0107i pamte va\u0161e postavke te \u010dine interakciju izme\u0111u
  vas i Usluga jednostavnijom i u\u010dinkovitijom. Tako\u0111er, kola\u010di\u0107i
  se upotrebljavaju kako bi se osiguralo da su oglasi koje vidite na mre\u017ei relevantni
  za vas i va\u0161e interese.\\nPohrana Tehnologija pra\u0107enja\\nTehnologije pra\u0107enja
  pohranjujemo kada posjetite na\u0161e Usluge ili im pristupite (na primjer, kada
  posjetite na\u0161a web-mjesta) \u2013 one se nazivaju \u201eTehnologije pra\u0107enja
  prve strane\u201d. Osim toga, Tehnologije pra\u0107enja pohranjuju druge tre\u0107e
  strane (na primjer, na\u0161i pru\u017eatelji usluga analize, poslovni partneri
  i ogla\u0161iva\u010di) koji upravljaju sadr\u017eajem u okviru na\u0161ih Usluga
  \u2013 one se nazivaju \u201eTehnologije pra\u0107enja tre\u0107ih strana\u201d.\\nObje
  vrste Tehnologija pra\u0107enja mogu se pohraniti tijekom trajanja va\u0161eg posjeta
  na\u0161im Uslugama ili za ponovljene posjete.\\nKoje vrste Tehnologija pra\u0107enja
  upotrebljavamo?\\nPostoje \u010detiri glavne vrste Tehnologija pra\u0107enja:\\n-
  Strogo potrebne Tehnologije pra\u0107enja Ove su Tehnologije pra\u0107enja klju\u010dne
  kako biste se mogli prijaviti, kretati i upotrebljavati zna\u010dajke na\u0161ih
  Usluga ili kako bi vam se mogla pru\u017eiti usluga koju ste zatra\u017eili (kao
  \u0161to je va\u0161e korisni\u010dko ime). Ne moramo ishoditi va\u0161 pristanak
  za upotrebu ovih Tehnologija pra\u0107enja. Te se Tehnologije pra\u0107enja mogu
  upotrebljavati zbog sigurnosti i integriteta, na primjer, za otkrivanje kr\u0161enja
  na\u0161ih pravila te za pru\u017eanje podr\u0161ke i sigurnosnih zna\u010dajki.\\n-
  Tehnologije pra\u0107enja funkcionalnosti Ove Tehnologije pra\u0107enja omogu\u0107uju
  na\u0161im Uslugama da zapamte va\u0161e izbore (kao \u0161to je va\u0161 jezik)
  te pru\u017ee pobolj\u0161ane i personalizirane zna\u010dajke. Na primjer, ove tehnologije
  pra\u0107enja upotrebljavaju se za provjeru autenti\u010dnosti (kako bi se zapamtilo
  kada ste prijavljeni) i podr\u017eavaju druge zna\u010dajke na\u0161ih Usluga.\\n-
  Tehnologije pra\u0107enja performansi Ove Tehnologije pra\u0107enja prikupljaju
  informacije o va\u0161oj aktivnosti na mre\u017ei (na primjer, trajanje va\u0161eg
  posjeta u okviru na\u0161ih Usluga), uklju\u010duju\u0107i podatke o pona\u0161anju
  i mjerne podatke o interakciji sa sadr\u017eajem. Ove Tehnologije pra\u0107enja
  upotrebljavaju se za analitiku, istra\u017eivanje i izvo\u0111enje statisti\u010dkih
  podataka (na temelju agregiranih informacija).\\n- Tehnologije pra\u0107enja marketinga
  ili ogla\u0161avanja Ove Tehnologije pra\u0107enja upotrebljavaju se za isporuku
  ponuda i reklama prilago\u0111enih va\u0161im potrebama, na temelju va\u0161ih interesa,
  te za provedbu marketin\u0161kih kampanja putem e-po\u0161te. Mogu se upotrebljavati
