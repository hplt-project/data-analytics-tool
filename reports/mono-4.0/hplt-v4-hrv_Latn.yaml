  sve informacije javite se na\\nkontakt mail. Imajte na umu da je raspored podlo\u017ean
  promjenama.\\nDok se ne odlu\u010dite, pogledajte video na temu internetske sigurnosti
  koji smo prona\u0161li na YouTubeu:\\n219992,196334,187674,184361\"", "\"KOPRIVNICA
