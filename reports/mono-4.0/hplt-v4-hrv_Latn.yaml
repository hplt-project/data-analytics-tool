  oprema i vodi Hacklab01 koji slu\u017ei kao slobodan prostor kojem je primarna namjena
  ra\u010dunalna edukacija i promocija otvorenog (eng. ''open source'') softvera,
  koji se financira iz privatnih sredstava \u010dlanova i donacija sudionika.\\nHacklab01
  slu\u017ei kao predavaonica, radionica, cyber-caffe, igraonica, \u010ditaonica i
