  za mjerenje u\u010dinkovitosti ogla\u0161iva\u010dke kampanje. U pravilu ih postavljaju
  na\u0161i ogla\u0161iva\u010di (na primjer, mre\u017ee za ogla\u0161avanje) kako
  bi dobili uvid u to kakve osobe gledaju i stupaju u interakciju s njihovima oglasima,
