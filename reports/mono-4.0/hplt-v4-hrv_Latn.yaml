  i uklju\u010dite ili isklju\u010dite njihovo kori\u0161tenje.\\nStrogo obavezni
  kola\u010di\u0107i\\nStrogo obavezni kola\u010di\u0107i bi trebali biti uklju\u010deni
  u svim slu\u010dajevima kako bi Vam osigrali najbolje mogu\u0107e kori\u0161tenje
  web stranice.\\nAko onemogu\u0107ite ove kola\u010di\u0107e, Va\u0161e postavke
  ne\u0107e mo\u0107i biti spremljene i prilikom svakog posjeta web stranice \u0107ete
  vidjeti ovu poruku.\"", "\"Visoki predstavnik i posebni predstavnik EU, Miroslav
  Laj\u010d\u00e1k, sastao se danas u New Yorku s britanskim ministrom vanjskih poslova,
  Davidom Milibandom, kako bi ga informirao o trenuta\u010dnoj politi\u010dkoj situaciji
  u BiH.\\nVisoki predstavnik i posebni predstavnik EU Laj\u010d\u00e1k izjavio je
  da je BiH spremna da poduzme zna\u010dajan strate\u0161ki korak naprijed na putu
  ka integraciji u EU. \u00abBiH se sada mora usredoto\u010diti na provedbu Sporazuma
  o stabiliziranju i pridru\u017eivanju, koji nosi i obveze i prednosti\u00bb, izjavio
  je Laj\u010d\u00e1k.\\nVeleposlanik Laj\u010d\u00e1k izvijestio je ministra vanjskih
  poslova Milibanda o napretku koji je ostvarila BiH u pogledu ispunjenja pet ciljeva
  i dva uvjeta o kojima se Vije\u0107e za provedbu mira jednoglasno suglasilo na svom
  sastanku odr\u017eanome u velja\u010di, a koji se ti\u010du tranzicije OHR-a u misiju
  koju \u0107e predvoditi Europska unija.\\n\u00ab\u0160to se br\u017ee ostvari napredak
  u pogledu ovih pet ciljeva i dva uvjeta, utoliko prije OHR mo\u017ee prerasti u
  misiju predvo\u0111enu Europskom unijom\u00bb, kazao je Laj\u010d\u00e1k.\"", "\"Izlo\u017ebeni
  prostor jedan je od nekolicine onih koji nisu izvorno galerijski, nego se njihovoj
  izvornoj namjeni uspijeva priklju\u010diti i galerijski program. Kao \u0161to je
  to slu\u010daj s Galerijom VN i Galerijom Prozori koji svoj sadr\u017eaj priklju\u010duju
  onom knji\u017eni\u010dnom, tako i Novak sada svoj smje\u0161ta u lijevi hodnik
  visokog prizemlja Pu\u010dkog otvorenog u\u010dili\u0161ta. Koji ima sli\u010dnu
  karakteristiku kao i ove spomenute, jednu ostakljenu stranu. No, dok Prozori i VN
  gledaju na ulicu, ovdje se kroz stakleni zid vidi unutarnji vrt. U njega je mogu\u0107e
  i u\u0107i, u zidu su i vrata, tako\u0111er staklena, \u0161to vode na balkon, pa
  i stepenice kojima se silazi u vrt. Prozirna stijenka unutarnje odvaja od vanjskog,
  koje je, s obzirom na konfiguraciju zgrade, zapravo unutarnje, pa je malo te\u017ee
  i odrediti \u0161to je unutra a \u0161to vani.\\nPostavljaju\u0107i, reklo bi se,
  klju\u010dan dio in situ video instalacije to\u010dno u sredinu unutarnjeg vrta,
  \u0161to istodobno zna\u010di ili simulira sredinu zgrade, Novak se odnosi spram
  te te\u0161ko odredive kategorizacije progla\u0161avaju\u0107i tu sredinu ipak onim
  unutarnjim. Nagla\u0161eno je to i \u010dinjenicom svjetla, ono je dakle prvo, ono
  dopire iz centra unutra\u0161njosti, kao \u0161to i na\u0161 pogled ili svijest
  tako\u0111er dolazi iz istog mjesta. Pa onda u vidnom polju gledamo projekciju stvarnosti.
  Novakovo svjetlo, me\u0111utim, nije tek simboli\u010dna interpretacija razmi\u0161ljanja
  o temeljnim kiparskim odnosima, niti je to ona \u017earulja koja svojim paljenjem
  ozna\u010dava dolazak ideje, to je baterija od pet iznimno sna\u017enih reflektora
  pravokutna oblika, usmjerenih u izlo\u017ebeni hodnik. Svjetla zasljepljuju, tim
  vi\u0161e \u0161to ne emitiraju ravnomjerno, nego se po nekom na\u010delu zajedno
  ili pojedina\u010dno pale i gase, pa kad su i upaljena doima se kao da lagano titraju.
  Prva je pomisao da se radi o signalima, Morzeovim ili sli\u010dnim. Postavljeni
  u liniju, reflektori izgledaju kao da su dopremljeni s neke velike platforme, \u0161tovi\u0161e,
  da tamo imaju vrlo odgovoran zadatak, recimo do\u010dekati goste iz svemira, re\u0107i
  im ono prvo o nama. Poput leptira privu\u010deni svjetlom, izlazimo na balkon, pobli\u017ee
  pogledati platformu, de\u0161ifrirati poruku i iz prvog reda posvjedo\u010diti susretu.
  Jo\u0161 i ne znamo da smo postali akteri u filmu \u0161to se projicira unutra u
  hodniku, na velikom ekranu, napravljenom za ovu priliku tik uza zid nasuprot staklenoj
  stijenki, \u010diji su lijevi i desni kraj malo odvojeni, pa ekran izgleda kao sinemaskop
  iz nekada\u0161njih kino dvorana. Reflektori postaju projektor, njihovo se svjetlo
  projicira na ekranu, a mi, ba\u0161 kao i sve ostalo izme\u0111u postajemo sjene,
  kretnje su nam otisnute na platno, raspored slu\u010dajan, kompoziciju kadra ostvarujemo
  u zajedni\u0161tvu s tankom metalnom konstrukcijom za velike staklene plohe. Treperenje
  svjetla, me\u0111utim, proizvodi vodoravne svjetlosive pruge, kao da je televizor
  pokvaren, a tempom uklju\u010divanja dobiva se svojevrstan strobo efekt u pomicanju
  sjena, zapravo njegova karikatura, budu\u0107i da su izmjene nepravilne, sa zna\u010dajnim
  pauzama. Kao da su, slijedom nepoznatog ali postoje\u0107eg dramatur\u0161kog narativa,
  izrezani pojedini dijelovi filma. Kompozicija uklju\u010duje sjene prozorskih okvira
  koji definiraju djelove kadra. Udaljenost od projektora rezultira tamnijim i svjetlijim,
  odnosno ve\u0107im i manjim sjenama \u0161to se kre\u0107u u definiranim segmentima
  slike ili pak poni\u0161tavaju te okvire. Sjene se pomi\u010du u treperavom prostoru,
  naoko ispred svjetlih pruga nepoznata porijekla u pozadini platna, \u0161to sveukupno
  doprinosi dinami\u010dnosti prizora, stoga ista situacija neprestano generira efektne
  varijacije.\\nTaj neobi\u010dan eksperimentalan film sniman je i projiciran u istom
  trenutku, akteri su mu istodobno i gledatelji, sadr\u017eaj pronalazi u procesu,
  koji je istodobno i finale. I bez obzira koliko taj sadr\u017eaj bio tek preslika
  stvarnosti, kontekst koji uklju\u010duje filmski ekran, usmjereno projekciono svjetlo,
  stiliziranu sliku, pa i dinamiku zbivanja, sve ga to progla\u0161ava filmom. A ono
  \u0161to ga svrstava u doti\u010dnu kategoriju jest baratanje nosa\u010dem vizualne
  poruke. Dok je, primjerice, za starije eksperimentalne filma\u0161e taj nosa\u010d
  bila traka, a rezultat se ostvarivao intervencijom na njoj, ovdje je ona eliminirana,
  a njenu ulogu preuzima svjetlo. Prazan projekcioni snop prolaskom kroz prostor dobiva
  sadr\u017eaj \u0161to ga predstavlja na platnu i time postaje nosa\u010d informacije.
  Dok je Peter Kubelka unaprijed definiranom metra\u017eom trake odre\u0111ivao trajanje
  sekvence, ovdje ona proizlazi iz algoritma koji odre\u0111uje paljenje i ga\u0161enje
  reflektora.\\nPa kao \u0161to je slo\u017eeno pitanje unutarnjeg i vanjskog rije\u0161io
  pozicijom reflektora, tako je i slika na ekranu, kao svojevrstan preview na\u0161eg
  pogleda, zapravo simulacija pretvorbe stvarnosti u njegovu stiliziranu interpretaciju.
  Primjetno je i baratanje izlo\u017ebenim formatom, svojim se postavom, a naro\u010dito
  intenzitetom, svjetlosna instalacija smjesta name\u0107e kao klju\u010dna figura.
  Tek potom shva\u0107amo kako je ona tek dio kompleksnije instalacije koja, hine\u0107i
  da koristi prostor \u010ditave zgrade, spaja vanjsko i unutarnje, promijeniv\u0161i
  pritom i svoj format u interaktivnu video instalaciju.\\nKojoj pridru\u017eujemo
  i audio kad nam autor uru\u010di slu\u0161alice. Slu\u0161amo soundtrack sniman
  tijekom deset godina, improvizirane Novakove jammove, koji, ba\u0161 kao i slika,
  uklju\u010duju distorzije i prepoznatljive linije. Slu\u0161alice su be\u017ei\u010dne,
  omogu\u0107uju kretanje, nisu, dakle, zvu\u010dna slika filma, nego zvu\u010dni
  provoditelj kroz izlo\u017ebu, primjenjiv kako na dominantnu instalaciju, tako i
  na njene ostale elemente. Zvu\u010dna nas poveznica nastoji provesti kroz vrijeme,
  kroz razvoj njegova autorska interesa, a kao lajt motiv je izabran materijal. Pa
  se tako odmah na ulazu nalazi \u010detiri metra duga\u010dka, masivna \u017eeljezna
  konzola polo\u017eena na dva stupca tankih papira. Na vrhu pone\u0161to ulegnuti
  te\u017einom \u017eeljeza, slojevi papira brojno\u0161\u0107u ipak nadokna\u0111uju
  slabost, pojedini bi dan mo\u017eda i popustio, no potpomognut ostalima izdr\u017eava
  teret sveukupnosti.\\nSirovinski \u0107e nas kontrast ove ready made skulpture mo\u017eda
  i asocirati na hommage Jannisu Kounellisu, ali i na ranije Novakove radove gdje
  se vje\u010dno \u017eeljezo pojavljuje u slu\u017ebi nosa\u010da snopova suhe, reklo
  bi se, privremene trstike. Za koje bi se, pak, ponovo moglo re\u0107i da predstavljaju
  dnevne otkose, koji tek \u010dvrstom odlukom postaju sadr\u017eaj.\\nSlijede\u0107a
  etapa komunicira s prezentom, naime, polica ili vitrina sa staklenim plohama i tankim
  metalnim nosa\u010dima odgovara strukturi dijela zgrade gdje se nalazimo. Na njoj
  su pravokutni blokovi tamnog materijala raznih veli\u010dina, poput ciglica ili
  elemenata spremnih da ih se aktivira. Dijelove budu\u0107e slagalice mogu\u0107e
  je protuma\u010diti i kao posvetu sirovini i strukturi, osobni dijalog s modernizmom
  zgrade. Suo\u010denje s poslovima budu\u0107nosti sirovinom izva\u0111enom iz naslaga
  pro\u0161losti.\\nNa kraju, ili kako saznajemo, na po\u010detku, tako\u0111er bija\u0161e
  svjetlo. Uokviruju\u0107i period od deset godina, pokraj trenutnog svjetlosnog filma
  nalazi se i, formatom ne\u0161to manja, projekcija snimljena svjetla iz 2009., od
  koje je zapravo pri\u010da i krenula. U donjem dijelu kadra, tamo gdje se obi\u010dno
  pojavljuje titl, sada je bijela traka koja povremeno djelomi\u010dno ili posve nestaje,
  ponovo se pojavljuje, dok sasvim ne nestane. To je snimka fluo lampe na izdisaju,
  snimjena u real time-u, prati njene posljednje hropce.\\nU oba se slu\u010daja sve
  vrti oko svjetla, no dok se u pro\u0161losti ono pojavljuje kao sadr\u017eaj filma,
  sada preuzima sve funkcije u njegovoj produkciji, zapo\u010dev\u0161i od redateljske
  koncepcije, preko dramaturgije i snimanja, do monta\u017ee i projekcije. Sve osim
  sadr\u017eaja, to postaje njegov nusproizvod, sjena. Pa kako predstavljena izlo\u017ebena
  cjelina ima vrlo precizan po\u010detak, umiranje fluo lampe, tako je i kona\u010dnica
  precizirana, zato \u0161to je za sadr\u017eaj kojeg gledamo presudan upravo prezent.\\nDrugim
  rije\u010dima, svom kiparskom interesu za sirovinu, mo\u017eda ba\u0161 nagovoren
  dramati\u010dnim svjedo\u010danstvom materijalizacije svjetla, pridodaje i onaj
  filmski, kao \u0161to je \u017eeljezo sinonim materije, tako je i svjetlo sinonim
  nematerije, na toj se razini izjedna\u010davaju.\\nIli se radi o grupnoj terapiji
  publike ve\u0107 pomalo i odba\u010denom metodom sintonike, gdje se svjetla usmjeravaju
  u o\u010di pacijenta u cilju razrije\u0161enja razli\u010ditih tjelesnih i emocinalnih
  problema; tretman je tako\u0111er poznat pod imenom optometrijska fototerapija.\"",
  "\"Lijekovi za sprje\u010davanje crva u odraslih - popis u\u010dinkovitih tableta
  i kako ih poduzeti\\nU\u010dinkovita profilaksa mnogih vrsta crva u odrasloj dobi
  - lijekovi, osobna higijena ja\u010da njihov u\u010dinak na tijelo, laboratorijska
  analiza za prisutnost helminta odre\u0111uje u\u010dinkovitost poduzetih mjera.
  Infekcija s jaja\u0161ima parazitskih crva stalno se javlja pa je pitanje o tome
  \u0161to piti od crva do odrasle osobe za prevenciju uvijek je relevantno.\\nLijekovi
  za prevenciju bjelan\u010devina\\nDvaput godi\u0161nje, prevencija crva u odraslih
  je obavezna. Najbolje je provesti preventivne mjere u prolje\u0107e i jesen. Prisutnost
  helminti, invazije, ne-karioze, enterobioze predstavlja ozbiljnu opasnost za ljudsko
  tijelo. Odricanje ko\u0161ta osobu jako. Odrasli, u \u010dijim ku\u0107ama postoje
  \u017eivotinje, potrebno je dvostruko preventivne mjere uz pravilnu brigu o ku\u0107nim
  ljubimcima.\\nU ljekarni se u rasponu prikazuju antihelminti\u010dki lijekovi za
  prevenciju kod odraslih osoba. Mo\u017eete ih uzimati \u010dak i sa ciljem prevencije
  tek nakon savjetovanja s lije\u010dnikom. U medicinskoj praksi ne postoji konsenzus
  o tome kako i kada uzimati pilule za sprje\u010davanje crva u odraslih osoba. Mnogi
  lije\u010dnici vjeruju da anthelmintics treba koristiti samo u slu\u010daju simptoma
  bolesti.\\nAnthelmintska terapija dodatno uklju\u010duje:\\n- strogo pridr\u017eavanje
  higijenskih standarda;\\n- dostatna toplinska obrada mesa i ribe;\\n- nedopustivost
  pitke vode iz vodenih tijela;\\n- oprez pri radu \u017eivotinja;\\n- temeljito pranje
  vo\u0107a i povr\u0107a te druge sanitarne i higijenske mjere.\\nPostoje dva naj\u010de\u0161\u0107a
  na\u010dina za borbu protiv parazitskog crva: droga i naroda. Vermox, mebendazol,
  vormil, decaris, nemozol i drugi posjeduju efekt glisena. Tijekom lije\u010denja
  lijekom va\u017eno je strogo slijediti upute za uporabu lijeka, uzeti u obzir kontraindikacije,
  dob, individualnu netoleranciju, nuspojave.\\ncrv\\nPreporu\u010da se lijek Vormil
  za prevenciju te\u0161kih tkivnih invazija. Lijek ima destruktivan u\u010dinak na
  bakterijske kosti, koji se parazitiziraju u crijevu, u larve mo\u017ee utjecati
  na plu\u0107a. Vormil uni\u0161tava bjelan\u010devine u svim fazama razvoja: jaja,
  larvanje, odrasle. Na\u010delo djelovanja temelji se na inhibiranju metaboli\u010dkih
  procesa parazita.\\nUnos tableta je dan pojedina\u010dno, doziranje ovisi o te\u017eini
  bolesnika. Nuspojave se mogu promatrati sa strane \u017eiv\u010danog, probavnog,
  krvo\u017eilnog sustava. Postoji smanjenje vidljivosti, mo\u017ee do\u0107i do osipa
  na ko\u017ei. Lijek se ne propisuje za trudno\u0107u i laktaciju. Lijek je dostupan
  u obliku tableta za \u017evakanje i suspenzije.\\npirantel\\nU medicinskoj praksi,
  Pirantel se koristi kao preventivna mjera za ascariasis, prisutnost pinworms i drugih
  bolesti helminth. Lijek paralizira helminte, potpuno izgube sposobnost kretanja,
  proces uklanjanja parazita iz tijela javlja se prirodno. Lijek radi samo na parazitima
  odraslih, pa je po\u017eeljno provesti drugi tretman. Tablete se uzimaju jednom
  dnevno, bez obzira na unos hrane.\\nNije preporu\u010dljivo uzimati trudni lijek,
  tijekom hranjenja djeteta, bolesnika s jetrenom bole\u0161\u0107u. Tijekom primjene
  lijeka, vrtoglavica, mu\u010dnina, mo\u017ee do\u0107i do osipa, a ponekad postoji
  i kr\u0161enje sna, sluha, halucinacija i drugih negativnih pojava. Po zavr\u0161etku
  terapije po\u017eeljno je provesti ponovljenu studiju za prisutnost jaja crva.\\nDecaris
  za prevenciju\\nDecaris za prevenciju odraslih imenuje se jednom. Ovaj lijek paralizira
  helminte s dobro razvijenim mi\u0161i\u0107nim sustavom (ascarids, pinworms). Nakon
  uzimanja lijeka za sljede\u0107i dan, mrtvi se paraziti aktivno izlu\u010duju iz
  ljudskog crijeva. Protiv krvavih crva i masti ovaj lijek je nemo\u0107an. Osim anthelminti\u010dkog
  djelovanja, Decaris je imunomodulator, aktivira krvne stanice koje stimuliraju imunolo\u0161ki
  odgovor tijela.\\nDecaris nije propisan za vrijeme trudno\u0107e i dojenja. Na svom
  ili njegovom prijemu mo\u017ee se prikazati alergija u obliku ko\u017enih osi. Oprez
  treba koristiti takav antihelminti\u010dki lijek za disfunkciju jetre i bubrega.
  Prijam lijeka s mu\u010dninom, povra\u0107anjem, proljevom mo\u017ee odgovoriti
  na probavni sustav. Glavobolja, nesanica, napadaji, groznica - nervozna.\\nNemozol
  za prevenciju bjelan\u010devina\\nNemozol za prevenciju odraslih propisuje terapijski
  te\u010daj, trajanje od 7 do 30 dana. Aktivna komponenta nemozola djeluje destruktivno
  na membrane helminta, razbijaju procese unosa hranjivih tvari, suzbijaju sve metaboli\u010dke
  procese, a paraziti umiru. Ovaj lijek je jedan od najboljih za sprje\u010davanje
  bjelan\u010devina u odraslih osoba.\\nNemozol je usmjeren na uni\u0161tavanje bjelan\u010devina
  u crijevu, u krvi aktivna tvar prakti\u010dki nije odre\u0111ena. Ima \u0161irok
  spektar djelovanja ne samo kod crva, ve\u0107 i kod jednostani\u010dnih parazita
  u ljudskom tijelu. Nuspojave se promatraju od probavnog, \u017eiv\u010danog, cirkulacijskog
  sustava. Kategorije zabranjeno alkohol tijekom unosa Nemosola.\\nVermoxum\\nLije\u010dnici
  propisuju Vermox za prevenciju bolesti s okruglim parazitskim crvima (pinworms,
  trichinella). Njihova prisutnost u tijelu odre\u0111ena je jakim svrbe\u017eom u
  anusu, naro\u010dito no\u0107u. Djelatna tvar lijeka poremetila je proces asimilacije
  glukoze pomo\u0107u parazita, \u0161to je za njih glavni hranjivi sastojak. Dva
  dana kasnije paraziti umiru od iscrpljenosti i uklanjaju se iz crijeva.\\nLijek
  ne smije biti preba\u010den na osobe s kroni\u010dnim bolestima crijeva, jetre,
  trudno\u0107e i laktacije. Pri uzimanju lijeka velika je opasnost od jakih alergijskih
  reakcija. Tu je gubitak kose, oteklina, osip. U tom slu\u010daju lijek se zaustavlja,
  trbuh, crijeva se isperu, uzme se sorbent.\\nalbendazol\\nProfilaksa crva u odraslih
  - lijekovi koji se temelje na albendazolu dobro su dokazani. Albendazol za prevenciju
  bakterijskih bolesti uklju\u010den je u preporu\u010deni popis WHO-a. Lijek uni\u0161tava
  stanice probavnog sustava parazita, uzrokuje inhibiciju vitalnih procesa. Albendazol
  preporu\u010duje se za uzimanje masnom hranom.\\nKada je preosjetljivost na komponente
  lijeka, njegova uporaba se ne preporu\u010duje. Kontraindikacije su trudno\u0107a
  i laktacija. Mogu postojati poreme\u0107aji probavnog sustava, alergijske reakcije,
  konvulzije, promjene raspolo\u017eenja, ponekad postoje problemi s vidom, \u017eutilo
  \u017eu\u010dnog mjehura, poreme\u0107aj bubrega.\\nSprje\u010davanje crva u odraslima
  folklornih lijekova\\nNe samo lijek za prevenciju crva u odraslih se pokazao u\u010dinkovit.
  Prevencija parazita kod ljudi populacijskim sredstvima, homeopatski lijekovi u\u010dinkovita
  su metoda prema pacijentovoj povratnoj informaciji. Sjeme bundeve dobro se preporu\u010duje.
  Za borbu protiv parazita, zobene bundeve treba jesti na praznom \u017eelucu u sirovom
  obliku, prethodno mljeti i pomije\u0161ati s medom. Za helminti\u010dku profilaksu,
  pripremaju se izgaranje sjemena.\\nPostoji mnogo recepata za pripremu anthelmintika
  na bazi sjemenki bundeve. Klice s infuzijom \u010de\u0161njaka rade dobro. Crvi
  umiru ako pijete konjak s ricinusovim uljem, pomije\u0161ane u omjeru 1: 1. Obavezan
  uvjet za djelotvornost narodnih metoda je unos laksativa, pranje crijeva radi uklanjanja
  mrtvih crva. Ovo je va\u017eno, budu\u0107i da se paraziti po\u010dinju raspadati
  u crijevima, otpu\u0161taju\u0107i toksine.\\nCijena lijekova od crva\\nU Moskvi,
  St. Petersburg, cijena lijekova za crve razlikuje se. Zna\u010dajno se razlikuje
  u ljekarnama grada, relativno je jeftino naru\u010diti lijekove u online trgovini,
  odabrati u\u010dinkovite kolege, ovdje mo\u017eete organizirati isporuku. Prosje\u010dna
  cijena anthelmintskih lijekova:\\nProfilakcija crva u djece i odraslih\\nNema mjera
  koje u potpunosti mogu ukloniti rizik od zaraze parazitima. Po\u0161tivanje pravila
  higijene uop\u0107e nije jamstvo da se helminti ne smiruju u tijelu. Mnogi su \u0161okirani
  \u010dinjenicom da je 70-80% ljudi na svijetu zara\u017eeno parazitima, a ponekad
  i nekoliko vrsta istodobno. S obzirom na takvu zapanjuju\u0107u statistiku, postavlja
  se pitanje je li potrebno sprije\u010diti crva u djece i odraslih? Ako se donese
  odluka o poduzimanju preventivnih mjera, koliko \u010desto treba izvr\u0161iti,
  koje lijekove ili narodne recepte treba koristiti za to?\\nCrvi se mogu izbje\u0107i
  uz pomo\u0107 prevencije i pravilne prehrane\\nTrebate li profilaksu protiv crva?\\nJasan
  odgovor na pitanje je li prevencija infekcije od helminti nije nu\u017ena. U suvremenoj
  medicini postoje 3 mi\u0161ljenja:\\n- Provesti lije\u010denje crva samo kada su
  testovi potvrdili njihovu prisutnost i pomogli u utvr\u0111ivanju izgleda parazita
  koji je pogodio tijelo. U preventivne svrhe, uzimanje tableta nije preporu\u010dljivo,
  posebno za djecu, budu\u0107i da su anthelminti\u010dki lijekovi toksi\u010dni.\\n-
  Suprotno gledi\u0161te - potrebno je dva puta godi\u0161nje piti anthelminti\u010dke
  lijekove \u0161irokog spektra djelovanja za prevenciju. Postoje tablete koje uzrokuju
  najmanje nuspojave i omogu\u0107uju za\u0161titu tijela od crva.\\nHelminthiasis
  je opasno za osobu u bilo kojoj dobi, ali ima osobito \u0161tetan u\u010dinak na
  djecu. Paraziti mogu apsolutno nastajati u bilo kojem organu, tkivu: od crijeva,
  do plu\u0107a i mozga. Oni apsorbiraju meso, hranjive tvari, osloba\u0111aju\u0107i
  ogromnu koli\u010dinu toksina koji otrovaju tijelo. U odraslih osoba to uzrokuje
  razvoj kroni\u010dnih bolesti koje se godinama ne mogu izlije\u010diti. U maloj
  djeci, osim bolesti, zapo\u010dinje ka\u0161njenje u tjelesnom razvoju. S obzirom
  na ovu okolnost, bolje je biti siguran i uzimati lijekove nego riskirajte svoje
  zdravlje.\\n- Postoji i alternativna verzija. U skladu s tim, mo\u017eete koristiti
  antihelminti\u010dke lijekove bez davanja testova, ako postoje znakovi parazita.
  Ovo gledi\u0161te dr\u017ei dr. Komarovsky.\\nU kojim je slu\u010dajevima opravdana
  redovita antihelminti\u010dna profilaksa:\\n- s ku\u0107nim ljubimcima ili \u010destim
  kontaktom s \u017eivotinjama;\\n- ako djeca igraju u pje\u0161\u010daniku, kontaktirajte
  s tlom;\\n- kad \u010dovjekov hobi pecanje, lov;\\n- nakon putovanja u egzoti\u010dne
  zemlje.\\nPreventivno odr\u017eavanje obavezno je u \u010destom kontaktu s doma\u0107im
  \u017eivotinjama\\nPotrebno je uzimati lijekove od crva do svih \u010dlanova obitelji,
  ako jedan od njih ima helminse, osobito one koji se prenose izravno od osobe do
  osobe. Tako\u0111er je bolje poduzeti preventivne mjere ako se neka djeca u grupi
  ili dijete klase dijagnosticiraju s parazitima.\\nKako sprije\u010diti\\nSmanjivanje
  opasnosti od zaraze crvima pomo\u0107i \u0107e u uskla\u0111ivanju s jednostavnim
  preventivnim mjerama:\\n- dostatna toplinska obrada hrane, posebno mesa i ribe;\\n-
  pi\u0107e pro\u010di\u0161\u0107ene vode;\\n- po\u0161tivanje osobne higijene, osobito
  pranje ruku sapunom prije svakog obroka i nakon svakog posjeta zahodu;\\n- anthelminti\u010dna
  profilaksa kod ku\u0107nih ljubimaca;\\n- redovita promjena posteljine.\\nAli ponekad
  ove mjere nisu dovoljne, stoga morate uzimati antihelminti\u010dke lijekove.\\nPa\u017eljivo
  pranje ruku smanjuje mogu\u0107nost zaraze parazitima\\nDobre tablete za sprje\u010davanje
  crva\\nPostoji mnogo lijekova namijenjenih za uni\u0161tenje crva u ljekarnama.
  Podijeljeni su na specifi\u010dne i nespecifi\u010dne. Specifi\u010dne pilule poma\u017eu
  da se rije\u0161e odre\u0111ene vrste parazita. Imaju usmjereni u\u010dinak i vi\u0161e
  su toksi\u010dni. Nespecifi\u010dni lijekovi imaju \u0161irok raspon djelovanja,
  uni\u0161tavaju\u0107i razli\u010dite vrste helminti. Imaju najmanje nuspojava,
  pa su pogodni za prevenciju.\\nRazmislite o drogama koje su bolje piti u svrhu profilakse
  protiv crva:\\n- crv - kao aktivni sastojak sadr\u017ei Albendazol, koji je u\u010dinkovit
  za enterobiazu, giardiasis, ascariasis, ne-katorozu i druge oblike zaraze crvima.
  Tablete se uzimaju uz hranu. Mora biti \u017evakanje, opran vodom. Doza lijeka za
  prevenciju - 3 dana 1 tableta dnevno.\\nUzimanje Vormile mo\u017ee izazvati alergiju,
  vrtoglavicu, mu\u010dninu. Kontraindikacija za njegovu upotrebu je trudno\u0107a,
  razdoblje dojenja. Tro\u0161ak lijeka je od 200 rubalja.\\nTablete \\\"Vormil\\\"
  400 mg\\n- Vermoxum - sadr\u017ei Mebendazol, koji uni\u0161tava sve vrste crnih
  crva: pinworms, roundworms, whipworms. S preventivnom svrhom, dovoljno je jednom
  uzeti 1 tabletu. Piti ga je potrebno na prazan \u017eeludac.\\nKontraindikirano
  je ovaj lijek, trudno, uz prisutnost ulkusa, Crohnove bolesti, zatajenja jetre,
  pa \u010dak i tijekom dojenja. Mogu\u0107e komplikacije, kao \u0161to su glavobolja,
  mu\u010dnina, alergijska reakcija. Cijena je od 100 rubalja.\\nVermox - 6 tableta\\n-
  dekaris - sadr\u017ei Levamisol, koji u\u010dinkovito uni\u0161tava pinworm, whipworm,
  ascaris, intestinalne mitesere. Copes with mixed invasion (infekcija), kada tijelo
  istodobno parazits nekoliko vrsta crva. Uzima se jednom, nakon jela. Prednost ovog
  lijeka je da stimulira aktivnost imunolo\u0161kog sustava.\\nKontraindikacije -
  trudno\u0107a, insuficijencija bubrega i jetre, agranulocitoza. Mogu\u0107e nuspojave
  kao \u0161to su alergije, mu\u010dnina, vru\u0107ica, krvarenje maternice. Cijena
  je od 70 rubalja.\\nDekaris - 2 tablete\\n- pirantel - sadr\u017ei aktivnu komponentu
  Pirantela u isporuci. Djelotvoran je protiv zrelih crva razli\u010ditih vrsta, a
  tako\u0111er uni\u0161tava njihove li\u010dinke. Za spre\u010davanje jedne doze
  lijeka. Doza ovisi o dobi i te\u017eini osobe. Odre\u0111uje se iz izra\u010duna
  10 mg lijeka za svaki 1 kg ljudske tjelesne te\u017eine.\\nTablete prakti\u010dki
  ne uzrokuju nuspojave. Mu\u010dnina i glavobolja su mogu\u0107e. Kontraindikacije
  do uzimanja - miastenija gravis, pojedina\u010dna netrpeljivost, trudno\u0107a.
  Cijena je od 40 rubalja.\\nPyrantel u obliku tableta i supozitorija\\nPripreme za
  djecu - kakav je lijek bolji?\\nZa novoro\u0111en\u010de i bebe do godinu dana mo\u017eete
  dati piperazin. Ima slab u\u010dinak, ali gotovo nema nuspojava, \u0161to je va\u017eno
  za malu djecu. Sadr\u017ei aktivni sastojak Adipat Piperazin, u\u010dinkovit protiv
  okruglog bora. Dozu treba odrediti lije\u010dnik. Mogu\u0107e nuspojave poput pove\u0107ane
  kapricioznosti, pogor\u0161anja apetita, problema sa spavanjem. Cijena je od 20
  rubalja.\\nDjeca od 1 do 2 godine mogu dobiti suspenziju Nemosola s aktivnim sastojkom
  Albendazola. Poma\u017ee kod enterobiaze, ascariasis, ankilostomiasis, trichinosis.
  Dovoljno je jednom uzeti 10 ml lijeka. Pijte dok jedete. Nemosol mo\u017ee uzrokovati
  mu\u010dninu, zamagljen vid, glavobolju, stolice. Kontraindicirana je za pojedina\u010dnu
  netoleranciju komponenti, bolesti jetre. Cijena za 20 ml - od 200 rubalja.\\nDjeca
  od 3 godine su prikladna za Albendazole. Djelatna tvar u svom sastavu - Albendazol
  je djelotvorna u enterobiosis, kuka hookworm, klonorokoza, toksokaroza, ne-karotidnih
  i drugih vrsta invazije. Pilula se uzima nakon obroka. Dozu odre\u0111uje lije\u010dnik.
  Mogu\u0107e nuspojave - mu\u010dnina, proljev, konvulzije, pospanost, zbunjenost.
  Kontraindicirani lijek za pojedina\u010dnu netoleranciju. Cijena je od 150 rubalja.\\nOd
  dobi od 5 godina, mogu\u0107e je dati Levamisol, koji je djelotvoran za ne-katoroze,
  ascaridozu, infekciju kuka i mje\u0161ovite helminti\u010dke infekcije. Aktivna
  tvar u svom sastavu je Levamisole. Za profilaksu, tableta se uzima jednom. Nuspojave
  - proljev, povra\u0107anje, alergije. Kontraindikacije - bubre\u017ena bolest, jetra.
  Cijena je od 80 rubalja.\\nEnterosgel - za spre\u010davanje crva\\nBudu\u0107i da
  su anthelminticne dje\u010dje tablete isti lijekovi koji su propisani odraslim osobama,
  oni imaju toksi\u010dni u\u010dinak na tijelo. Da bi je postigao razinu, jedan dan
  nakon profilakti\u010dkog unosa anthelmintskih lijekova, potrebno je djeci davati
  apsorbente, na primjer aktivni ugljen, Enterosgel.\\nFolk lijekovi\\nAko postoje
  simptomi koji bi mogli ukazivati na zarazu s crvima, ili je postojala \u017eelja
  za provo\u0111enjem profilakse bez kori\u0161tenja lijekova, narodni lijekovi \u0107e
  vam pomo\u0107i.\\nPopularne narodne recepte za preventivno lije\u010denje od crva:\\n-
  4 klin\u010di\u0107a sjeckane \u010de\u0161njake soli i ulijte 200 ml mlijeka. Piti
  na prazan \u017eeludac, a nakon toga ni\u0161ta za jesti 2 sata. Za djecu smanjite
  koli\u010dinu sastojaka za pola.\\n- Ulijte listove matice kipu\u0107om vodom i
  ostavite 20 minuta. Pirjajte juhu pripremljenu za kuhanje 25 ml prije svakog obroka
  3 dana.\\n- Za 12 sati inzistirajte listove elekampana, napunjene kipu\u0107om vodom.
  Pijte 4 puta dnevno prije jela.\\n\u010cak i za osobu koja se \u017eeli za\u0161tititi
  od infekcije crvima, korisno je redovito jesti sirove sirovine, za\u010dinsko za\u010din,
  piti svje\u017ee iscije\u0111ene sokove, osobito \u0161ipak, mrkvu. Profilacija
  ljudi s pravilnom primjenom osigurat \u0107e pozitivan rezultat.\\nCrvi se trebaju
  rutinski davati svim \u010dlanovima obitelji. Tako\u0111er bi se trebalo obavljati
  dva puta godi\u0161nje antihelminti\u010dka terapija me\u0111u svim doma\u0107im
  \u017eivotinjama. Zajedno s po\u0161tivanjem pravila osobne higijene i pravilne
  prerade proizvoda prije konzumacije, to \u0107e pomo\u0107i u zna\u010dajnom smanjenju
  rizika zaraze crvima.\\nU\u010dinkoviti lijekovi za prevenciju kormofitije kod odraslih\\nAko
  osoba ima crve, vrlo brzo \u0107e dovesti do mnogih bolesti.\\nHelmintsi mogu znatno
  pogor\u0161ati rad imuniteta i uskoro \u0107e biti kr\u0161enja funkcije mnogih
  tijela sustava:\\n- pojava pote\u0161ko\u0107a s probavom;\\n- smanjeni imunitet;\\n-
  formiranje brojnih bolesti jetre;\\n- problem s vidom.\\nStru\u010dnjaci ka\u017eu
  da danas 95 od 100 ljudi ve\u0107 ima brojne parazite u tijelu. U ovom \u010dlanku
  mo\u017eete saznati najbolje pilule od crva.\\nSprje\u010davanje crva u odraslih\\nTijelo
  \u0107e se boriti s helminths, razvijaju\u0107i niz antitijela za borbu protiv crva,
  ali ipak ova za\u0161tita \u0107e biti premala.\\nKada je potrebno koristiti lijekove
  iz crva:\\n- ako barem jedan \u010dlan obitelji ima crve;\\n- ako u doma\u0107im
  \u017eivotinjama ima crva;\\n- ako dje\u010dak igra dugo vremena na ulici u pje\u0161\u010daniku,
  onda ima crva to\u010dno;\\n- postoji veliki rizik za poljoprivredne radnike koji
  redovito tro\u0161e vrijeme sa \u017eivotinjama\\nDanas postoji ve\u0107 vi\u0161e
  od 270 vrsta razli\u010ditih helminti, iako, kako ka\u017ee medicina, ne mogu biti
  to\u010dno za one gra\u0111ane koji prate njihovo zdravlje i redovito provode prevenciju
  crva.\\nTakva stra\u0161na bolest mo\u017ee biti kod odraslih i djece, pa se ovdje
  mora redovito preventivno odr\u017eavati.\\nDa biste to u\u010dinili, mo\u017eete
  koristiti razli\u010dite lijekove i pilule. Prilikom prolaska op\u0107e medicinske
  profilakse, va\u017eno je pratiti stanje zdravlja i va\u0161e dijete, napominjemo
  da u spre\u010davanju crva mogu postojati nuspojave.\\nLijekovi za prevenciju crva
  u odraslih\\nPostoje \u010detiri osnovna anthelmintika. Razmotrimo ih detaljnije.\\ndekaris\\nDekarys
  - Ovo je jedinstven antihelminti\u010dki agens koji slu\u017ei za uni\u0161tavanje
  crva i raznih crva \u0161irokog djelovanja. Upotreba takvog jedinstvenog lijeka
  jasno inhibira glikolizu i ubija \u017eivot bjelan\u010devina i uzrokuje op\u0107u
  paralizu koja dovodi do smrti tih organizama. Kad crvi nestanu nakon primanja Decarisa,
  ovdje \u0107ete saznati.\\nLijek treba koristiti samo iznutra i samo jednom nakon
  ve\u010dere po stopi od:\\n- Djeca - 2,5 mg po kilogramu te\u017eine.\\n- Odrasli
  bi trebali uzimati 150 mg nakon ve\u010dere.\\nOvaj lijek nema nikakvu nuspojavu,
  jer ga je svaka osoba lako tolerirala, iako i ovdje:\\n- bol u trbuhu i mu\u010dnina;\\n-
  povra\u0107anje, pa \u010dak i probavne smetnje.\\nTakav alat u ljekarni jo\u0161
  se mo\u017ee nazvati, kao Ascaridil ili Ketrax. Svaka tableta sadr\u017ei levamisol
  hidroklorid, a postoji i niz jedinstvenih posebnih agregata.\\nPripravak je napravljen
  samo u obliku be\u017e tableta, jedna tableta sadr\u017ei do 150 mg levamisola,
  osim toga, tako\u0111er se nalazi saharoza i \u0161krob, kao i talk, magnezij i
  laktoza monohidrat.\\nAko je pilula za djecu, onda postoji i okus koji je potreban
  za dobivanje okusa marelice i prekrasnu hladovinu.\\ncrv\\ncrv je anthelmintski
  moderni lijek s velikim spektrom djelovanja. Aktivna glavna supstanca ovdje je albendazol,
  koji poma\u017ee kod crijevnih, tkivnih i drugih oblika parazitske uobi\u010dajene
  bolesti.\\nOvaj lijek:\\n- djeluje i na odrasloj osobi i djetetu;\\n- u\u010dinkovito
  ubija crve i jaja koje ih postavljaju;\\n- ima sposobnost suzbijanja polimerizacije
  tubulina, koja uzrokuje metabolizam helmintih i zatim ih ubija.\\nRazmotrite da
  mogu postojati \u010deste nuspojave:\\nLijek jasno i u\u010dinkovito manifestira
  njegov u\u010dinak na Enterobius vermicularis, kao i Ascaris lumbricoides i mnoge
  druge.\\nTijelo tijelo odmah prepoznaje probavni trakt, apsorbira ga dovoljno lako,
  iako ako se koristi s masnom hranom, apsorbira se ta tvar u tijelu. Albendazol \u0107e
  tada biti izlu\u010den iz tijela s djelovanjem \u017eu\u010di, a tako\u0111er i
  urinom u malim koli\u010dinama.\\nPreporu\u010da se kori\u0161tenje lijeka kada:\\n-
  rudarska glista;\\n- teniasis;\\n- gimenolepidoze;\\n- gnathostomiasis;\\n- ako
  se \u017eelite rije\u0161iti normalnih crva.\\nPravila prijema:\\n- Odrasli 400
  mg dva puta dnevno tijekom 3 dana.\\n- Djeca \u0107e biti dovoljna za 1 tabletu,
  sve ovisi o dobi i masi njegova tijela.\\n- Izra\u010dunavanje lijeka od 15 mg po
  kilogramu dnevno, maksimalna doza je 800 mg na dan, a ako je potrebno, bolje je
  dr\u017eati 2-3 ciklusa takvog lije\u010denja.\\npirantel\\nTakav lijek, poput Pirantela,
  je anthelminti\u010dki lijek za poni\u017eenje \u0161irokog raspona crva. Upute
  za uporabu lijeka Pirantel mogu se na\u0107i ovdje.\\nAko osoba ima enterobiosis
  ili ascariasis, a postoje crijevne bolesti povezane s crvima, tada se ovaj lijek
  treba koristiti po stopi od 10 mg za svaki 1 kg tjelesne mase, a postupak obi\u010dno
  traje 2-3 dana.\\nS takvim terapeutskim sredstvom, prakti\u010dki nema nuspojava,
  pacijenti dobro podnose lijek, iako su mogu\u0107i:\\nKontraindikacija je trudno\u0107a,
  kada se lijek treba uzeti s oprezom.\\nLijek mo\u017ee imati niz analoga:\\n- Kombantrin
  i Agipiprin;\\n- Bifantrel i Helmix;\\n- Triombrin i drugi.\\nDoziranje ovisi o
  dobi i te\u017eini osobe, mo\u017eete mije\u0161ati lijek s sokom ili mlijekom,
  po\u017eeljno je pridr\u017eavati se prehrane, kao i koristiti pomo\u0107ne lijekove.
  Trajanje takvog lije\u010denja je samo 2-3 dana, \u010dak i uz te\u0161ke o\u0161te\u0107enje
  crva.\\nVermoxum\\nLijek je anthelmintik i ima \u0161irok raspon op\u0107ih u\u010dinaka.\\nU\u010dinkovito
  na:\\nVermoxum:\\n- ima jasan i funkcionalni poreme\u0107aj bobina;\\n- iscrpljuje
  ove zalihe rezervata glikogena i inhibira sintezu stani\u010dnog zajedni\u010dkog
  tubulina;\\n- inhibira ATP;\\n- prakti\u010dki ne apsorbira u crijevu, a veza s
  proteinima \u017eivotinjske plazme je samo 90%;\\n- distribuira organima i djeluje
  na li\u010dinke bjelan\u010devina.\\nDjeca, kao i odrasli, obi\u010dno se propisuju
  100 mg svaka, tj. Jedna tableta odjednom, a zatim se ovaj lijek treba uzimati vi\u0161e
  puta nakon 15 dana.\\nMogu\u0107e nuspojave:\\n- mu\u010dnina;\\n- vrtoglavica;\\n-
  pote\u0161ko\u0107e u trbuhu;\\n- obrazovanje alergije, proljev i urtikarija;\\n-
  osip ko\u017ee;\\n- razli\u010dite otekline;\\n- mo\u017ee pove\u0107ati aktivnost
  jetrene transaminaze;\\n- anemija.\\nkontraindikacije:\\n- preosjetljivost i ulcerativni
  kolitis;\\n- Crohnova bolest;\\n- bolesti jetre;\\n- Nemojte ga davati djeci mla\u0111oj
  od 2 godine.\\nProizvod mo\u017eete kupiti u ljekarni, gdje se obi\u010dno prodaje
  samo u tabletama, \u0161to to\u010dno u paketu od \u0161est komada. Sastav lijeka
  je klasi\u010dan, tj. 5-benzol-2-metoksikarbonilamin, tableta je \u017euta i malo
  topiva u vodi, koristi se samo za gutanje. Recenzije o Vermoksu i njegovim tro\u0161kovima
  mo\u017eete prona\u0107i ovdje.\\nKada poduzeti preventivne te\u010dajeve?\\nMoraju
  se provoditi anthelminti\u010dki redovni te\u010dajevi za prevenciju:\\n- U prolje\u0107e,
  to jest, mjesec dana nakon taljenja snijega, obi\u010dno travanj i svibanj.\\n-
  Bli\u017ee do jeseni, kada mraz ide, to je obi\u010dno u listopadu, pa \u010dak
  iu studenom.\\nKako bi se smanjila takva profilaksa, treba se pridr\u017eavati higijene:\\n-
  \u010desto operite ruke;\\n- 2-3 puta oprati vodom;\\n- napustiti sirovo meso;\\n-
  nemojte piti vodu iz slavine.\\nZa prevenciju treba koristiti sveobuhvatan medicinski
  pristup i ovdje je potrebno uhvatiti sve vitalne op\u0107e cikluse razvoja helminti.\\nZar
  profilaksu crva?\\nRedovita i pre\u010deta op\u0107a prevencija potrebna je samo
  u nekim te\u0161kim slu\u010dajevima. Mnogi stru\u010dnjaci ka\u017eu da nije preporu\u010dljivo
  koristiti lijekove samo u slu\u010daju i vrlo \u010desto. To je zbog \u010dinjenice
  da mnogi u\u010dinkoviti lijekovi mogu \u010dak biti \u0161tetni i otrovni.\\nZna\u010dajke
  sprje\u010davanja crva:\\n- Medicinska redovita tradicionalna profilaksa mo\u017ee
  se zahtijevati samo kada su paraziti upravo tu u osobi.\\n- Za dijete je prevencija
  va\u017ena to\u010dka, jer je vrlo sklona parazitima, ali u ovom slu\u010daju je
  potrebno paziti.\\nTri mi\u0161ljenja u medicini o prevenciji kormomtioze\\nMi\u0161ljenja
  lije\u010dnika o prevenciji helmintioze:\\n- Mogu li crvi uzrokovati razli\u010dite
  alergije? Da, doista je poput bobina, nakon \u0161to su se na\u0161li u tijelu,
  nije lako postavljati jaja, umiru i raspadaju, \u0161to uzrokuje opijenost kod ljudi.
  Ako imunitet oslabi, tada \u0107e se boriti protiv crva tijelo \u0107e razviti veliki
  broj za\u0161titnih krvnih stanica, a to definitivno dovodi do alergija. Pored toga,
  helminti mogu uzrokovati \u010deste prehlade i kroni\u010dne bolesti.\\n- Postoje
  li o\u010digledni znakovi i znakovi prisutnosti helminti? Saznajte imate li crve
  iz vi\u0161e razloga, obi\u010dno pod o\u010dima su tamni krugovi, a no\u0107u \u0107e
  biti jaka salivacija, a ujutro izgleda vrlo umorno. Ko\u017ea mo\u017ee postati
  bijela i blijeda, kosa \u0107e postati iscrpljena, a na ko\u017ei peta \u0107e biti
  pilinga i do\u0107i \u0107e do pucanja.\\n- Kako odrediti prisutnost helminti? Ranije
  se mislilo da se takvi opasni bobini mogu izra\u010dunati iz analize krvi. Danas
  postoje vi\u0161e suvremenih metoda detekcije - to je enzimski povezani imunosorbentni
  test i brojne druge. Takva je bolest rezultat prljavih ruku, tako da kad idete ku\u0107i
  s ulice, operite ruke odmah i operite prije jela. Me\u0111u glavnim i jasnim znakovima
  je alergija, kao i nervna uzbu\u0111enja i uzrujan trbuh, mo\u017ee biti umor, pa
  \u010dak i zatvor.\\nKada je opravdana anthelmintska profilaksa?\\nAntihelminti\u010dna
  profilaksa opravdana je u takvim slu\u010dajevima:\\n- Ako je barem jedan \u010dlan
  va\u0161e obitelji zara\u017een crvima, onda \u0107e prevencija crva biti stvarna,
  po\u017eeljno je odmah sprije\u010diti cijelu obitelj.\\n- Ako je analiza parazita
  bila negativna, ali bilo je klini\u010dkih znakova, \u010dak iu obliku malog \u0161uga.\\n-
  U prisutnosti ku\u0107nih ljubimaca ili \u010destog kontakta sa \u017eivotinjama.\\n-
  ako djeca igraju u pje\u0161\u010daniku, kontaktirajte s tlom.\\n- kad mu\u0161karac
  hobi pecanje, lov.\\n- nakon putovanja u egzoti\u010dne zemlje.\\nGlavni lijekovi
  za sprje\u010davanje crva\\nGlavni lijekovi za sprje\u010davanje crva:\\nFolk metode
  prevencije\\nPostoji mnogo razli\u010ditih narodnih lijekova za crve, na primjer:\\n-
  sjemenke bundeve. Prevencija bi trebala trajati mjesec dana, a jo\u0161 vi\u0161e,
  sjeme se najbolje jede samo na prazan \u017eeludac i dovoljno 100 grama dnevno;\\n-
  sok od mrkve za aktiviranje ljudske mo\u0107i;\\n- ricinusovo ulje - dovoljno dnevno
  jednu \u017elicu blagovaonice;\\n- \u010de\u0161njak - dovoljno je 2-3 \u010de\u0161njaka
  dnevno;\\n- prihva\u0107anje ulja konoplje;\\n- bujonska ljekarna kamilice - razrijedite
  otopinu s vodom i pijte 0,5-1 litara dnevno.\\nOsim toga, preporu\u010duje se sljede\u0107e:\\n-
  Pored ovih standardnih metoda, koristite uobi\u010dajene kurativne klice, iako to
  zna\u010di i odnosi se na prili\u010dno slab.\\n- Velika i stvarna korist mo\u017ee
  imati sok od povr\u0107a i vo\u0107a, koja \u0107e izbaciti helminte i oja\u010dati
  imunitet.\\n- Idealna i najbolja opcija je sok od mrkve i repa, samo jo\u0161 treba
  dodati 1 \u017elicu meda za svako staklo.\\n- Tansy ima jedinstveni u\u010dinak,
  budu\u0107i da ova biljka ima antipoot efekt, a odavno se koristi u svijetu za lije\u010denje
  i za\u0161titu od crva.\\nTablete za sprje\u010davanje crva - \u0161to je bolje
  i sigurnije?\\nHelmintiaza je jedna od naj\u010de\u0161\u0107ih bolesti, \u010desto
  se dijagnosticira u djece. Tablete od crva za ljude pomo\u0107i \u0107e vam da izbjegnete
  infekciju, ali biste ih trebali odabrati i odvesti ih ispravno.\\nRoditelji su jednostavno
  du\u017eni ulo\u013eiti u svoje djete elementarne pravila o higijeni kako bi izbjegli
  ozbiljne probleme u budu\u0107nosti zbog helmintija\\nNespecifi\u010dne preventivne
  mjere\\n\u010cak i naju\u010dinkovitiji lijekovi ne mogu za\u0161tititi osobu od
  zaraze ako ne slijedi pravila higijene.\\nKako izbje\u0107i infekciju parazitima:\\n-
  oprati ruke nakon ulice, posjetiti WC, svakako jesti prije - sapun treba primijeniti
  obilno, mora prodrijeti pod noktima, interdigital prostor;\\n- Isperite sve vo\u0107e
  i povr\u0107e s vru\u0107om vodom, ako je proizvod u dodiru s tlom, treba ga natopiti
  15-20 minuta u vodi;\\n- na \u0161etnji koristite antisepti\u010dke naprave i sprejevi,
  osobito nakon dodira s tlom, pijesak;\\n- grani\u010dni kontakt sa zalutalim \u017eivotinjama,
  ku\u0107ni ljubimci, redovito pokazuju veterinara, provode antiparazitsku profilaksu;\\n-
  Nemojte jesti sirovu ribu, slabo pe\u010deno meso;\\n- bolje odrezati meso u rukavicama,
  no\u017eevima i plo\u010di, koje su u dodiru sa sirovim proizvodom, pranje, tretiranje
  soda;\\n- piti samo pro\u010di\u0161\u0107enu vodu;\\n- Nemojte plivati u sumnjivim
  vodenim tijelima, prije planinarenja, tretirati ko\u017eu i odje\u0107u za\u0161titnim
  sredstvima protiv insekata koji krvlju sisaju.\\nObratite pa\u017enju! Glistularna
  invazija ne uvijek ima izrazitu simptomatologiju, ali se u tijelu patolo\u0161kim
  procesima javlja, tijelo pati od intoksikacije, nedostatka korisnih elemenata u
  tragovima, paraziti mogu utjecati na plu\u0107a, mozak, jetru.\\nBilo je potrebno
  piti tablete od crva za profilaksu\\nPo stupnju opasnosti, lije\u010dnici izjedna\u010davaju
  kormilarce s te\u0161kim virusnim i bakterijskim bolestima, ali stru\u010dnjaci
  ne raspola\u017eu konsenzusom o tome kako je prikladno uzimati posebne lijekove
  za prevenciju.\\nProtivnici prevencije droga vjeruju da su lijekovi za lije\u010denje
  helminti\u010dkih invazija vrlo otrovi, pijenje ih bez razloga opasno za zdravlje.\\nDrugi
  stru\u010dnjaci tvrde da ako obitelj ima maleno dijete, djecu osnovne \u0161kole,
  ku\u0107ne ljubimce, a zatim svakih 6 mjeseci, potrebno je uzimati antiparazitske
  lijekove za sve \u010dlanove ku\u0107anstva kako bi sprije\u010dili infekciju.\\nKada
  biste trebali uzimati lijekove za crve za profilaksu:\\n- \u010desti kontakt s kopnom,
  pijeskom:\\n- rad u veterinarskim klinikama, farme, postrojenjima za preradu mesa;\\n-
  poha\u0111anje djeteta pred\u0161kolskih ustanova ili stalni boravak u zakopanim
  dje\u010djim skupinama;\\n- redovito putovanje u egzoti\u010dne zemlje.\\nPrevencija
  kostiju je potrebna za ljubitelje sushija, meso krvi, vodu iz bu\u0161otine, lovci,
  ribari, ljetnikovci, nogometa\u0161i, ljubitelji odbojke na pijesku.\\nDanas u ljekarnama
  postoje mnogi lijekovi za lije\u010denje i prevenciju helmintija. No izbor bi se
  trebao temeljiti na savjetu terapeuta koji uzima u obzir osobine pacijentovog tijela\\nKako
  odabrati pravi antiparazitski\\nOdabir pravog lijeka je te\u017eak zadatak. Lijekovi
  \u0161irokog spektra djelovanja su u\u010dinkoviti, ali toksi\u010dni, lijekovi
  s mek\u0161im djelovanjem utje\u010du samo na odre\u0111ene vrste parazita.\\n\u0160to
  treba uzeti u obzir prilikom odabira lijeka:\\n- starost, te\u017eina, prisutnost
  kroni\u010dnih bolesti;\\n- vrsta crva koja mo\u017ee biti zara\u017eena - djeca
  se ne boje parazita koji \u017eive u mesu i ribi;\\n- prosje\u010dna cijena tableta
  za spre\u010davanje crva u ljudi - 50 do 200 rubalja.Ali skuplji, ne zna\u010di
  bolji i u\u010dinkovitiji, pri odabiru treba usredoto\u010diti na indikacije i nuspojave,
  a ne na cijenu.\\nObratite pa\u017enju! Simptomi helmintijaza su u mnogo\u010demu
  sli\u010dni infekciji protozoom - u takvim slu\u010dajevima nema antiparazitnih
  lijekova.\\nSprje\u010davanje dje\u010djih crva u djece\\nPyrantel je najsigurniji
  antiparazitski lijek, dopu\u0161ten je za lije\u010denje djece starijih od \u0161est
  mjeseci. Prednosti - aktivne tvari lijekova ne apsorbira u krv, djeluje samo u crijevima,
  proizvodi se u obliku tableta i suspenzije, uni\u0161tava zreli uzoraka i parazita
  u ranoj fazi razvoja, ne prelaze 50 rubalja. Nedostaci - djelotvorni samo protiv
  ascarida, nematoda, kuka i pinworms, ne utje\u010du na jaja crva.\\nMogu\u0107e
  nuspojave:\\n- dispepti\u010dki poreme\u0107aji - mu\u010dnina, nadutost, proljev,
  bolovi u trbuhu;\\n- migrena;\\n- pogor\u0161anje kvalitete sna;\\n- alergijske
  reakcije u obliku ko\u0161nica i osipa.\\nDoziranje za djecu dulje od 6 mjeseci
  je 5 ml za svakih 10 kg tjelesne te\u017eine, a te\u017eine od 75 kg trebate jednom
  piti 30 ml sirupa, ako je te\u017eina vi\u0161e, morate uzeti 40 ml lijeka.\\nPyrantel
  u tabletama mo\u017ee se dati djeci starijoj od dvije godine - za prevenciju je
  dovoljno uzeti 0,5 tableta, u 6-12 godina - 2 tablete.\\nEmbonat pirginia je jo\u0161
  jedan siguran lijek za djecu stariju od tri mjeseca, preporu\u010da se djeci da
  se sprije\u010de enterobiasis, jer droga radi samo na pinworms. Lijek se proizvodi
  u peleti od 50 mg i u obliku suspenzije.\\nKako bi sprije\u010dili infekciju, dovoljno
  je uzeti lijek jednom - doza je 5 mg / kg ili 1 draga, 5 ml suspenzije svakih 10
  kg. Lijek se ne mo\u017ee piti s bolestima bubrega, jetre, crijeva, ponekad postoje
  nuspojave u obliku vrtoglavice i dispepti\u010dkih poreme\u0107aja.\\nObratite pa\u017enju!
  Nakon uzimanja Embonate, izmet mo\u017ee postati crven, ali to nije opasno.\\nDo
  danas, ovaj lijek se smatra najsigurnijim i u\u010dinkovitijim u lije\u010denju
  crva u djece, jer je rizik nuspojava od njegove primjene izrazito minimalan\\nKoji
  je lijek prikladan za trudnice za prevenciju bjelan\u010devina?\\nHelminthiasis
  tijekom trudno\u0107e je opasno za majku i bebu, ali antiparazitsku profilaksu treba
  provesti samo ako postoje \u010dimbenici koji mogu izazvati infekciju.\\nJedini
  lijek koji se mo\u017ee uzeti u trudnice je piperazin, a tek nakon kraja I. tromjese\u010dja.
  Lijek se osloba\u0111a u tabletama od 0,2 i 0,5 g, kao suspenzija. Lijek ima minimalnu
  toksi\u010dnost, ko\u0161ta prosje\u010dno 30-59 rubalja, ali se mo\u017ee koristiti
  samo za prevenciju ascaridoze i enterobioze.\\nNuspojave su rijetke, naj\u010de\u0161\u0107e
  postoje pritu\u017ebe na glavobolju, mu\u010dninu, slabost mi\u0161i\u0107a, piperazin
  se ne mo\u017ee uzimati s patologijama sredi\u0161njeg \u017eiv\u010danog sustava.\\nDnevna
  doza je 0,5 g, uzimajte lijek 4-5 dana. Na taj na\u010din, trebate piti vi\u0161e
  vode, ne zaboravite na pravila higijene.\\nKako uzeti Decaris za prevenciju\\nDecaris
  je antiparazitski agens koji se temelji na levamisolu, 50 i 150 mg u tabletama.
  To je jedan od naju\u010dinkovitijih antihelmintika, ali to bi trebao biti kori\u0161ten
  za prevenciju samo ako postoji mogu\u0107nost ugovaranja nekoliko vrsta crva kada
  se to dogodi \u010desto tijekom putovanja u egzoti\u010dne zemlje.\\nMogu\u0107e
  nuspojave:\\n- poreme\u0107aj spavanja;\\n- cephalgia, napadi vrtoglavice;\\n- konvulzije;\\n-
  sr\u010dane palpitacije;\\n- mu\u010dnina, proljev;\\n- osip na ko\u017ei.\\nAli
  s preporu\u010denim dozama, negativne reakcije su rijetke, ljudi u bilo kojoj dobi
  toleriraju lijek dobro.\\nProfilakti\u010dka doza za odrasle - 150 mg jednom prije
  spavanja, djeca do tri godine starosti, doza se izra\u010dunava na 2,5 mg / kg.
  Lijek se ne mo\u017ee uzimati tijekom trudno\u0107e i tijekom dojenja, ako postoje
  problemi s bubrega, jetre, ko\u0161tane sr\u017ei u anamnezi.\\nObratite pa\u017enju!
  Prednost Decarisa - medicina se mo\u017ee primijeniti na ljude oslabljene za\u0161titne
  funkcije tijela, jer stimulira imunolo\u0161ki sustav.\\nKoliko je sigurna Vermox
  za profilaksu\\nVermoxum - jeftin antiparazitno sredstvo sa \u0161irokim spektrom
  djelovanja, na snazi u Ascariasis, enterobioze, trihotsefaleze uklanja odrasle crve,
  jaja\u0161ca i li\u010dinke. No, unato\u010d svim prednostima, lijek se ne mo\u017ee
  smatrati sigurnom - ne prodiru aktivnu tvar u krvi, ali mo\u017ee akumulirati u
  tkivu, koji postaje uzrokom ozbiljnih nuspojava.\\nU preventivne svrhe, uzmite jednu
  tabletu nakon jela, nemojte \u017evakati, piti puno vode.\\n- poreme\u0107aj probavnog
  trakta;\\n- napadi glavobolje;\\n- konvulzije;\\n- alergijske manifestacije.\\nLijek
  se ne mo\u017ee piti ulceroznim kolitisom, jetrenom patologijom, Crohnovom bole\u0161\u0107u,
  lijek je kontraindiciran u trudnica i dojilja, djeca mla\u0111a od dvije godine.\\nObratite
  pa\u017enju! U roku od 24 sata nakon uzimanja Vermoxa, ne smijete jesti masnu hranu,
  alkoholna pi\u0107a.\\nUnato\u010d relativnoj sigurnosti, preporu\u010dujemo da
  uzimate Vermox samo nakon savjetovanja s lije\u010dnikom\\nBiltricid za prevenciju\\nBiltricid
  - antihelmintik formulacija na bazi prazikvantel ispu\u0161ta u obliku tableta od
  600 mg, \u0161tetnog efekta na jetre krakova, Schistosomes, jedan od najskuplji
  za lije\u010denje helmintijaze.\\nDoziranje se izra\u010dunava na temelju te\u017eine
  osobe -40 mg / kg, pije lijek treba biti prije jela ili tijekom obroka, ne \u017evakati,
  piti puno vode. Lijek treba uzeti jednom u ve\u010dernjim satima.\\n- bol u epigastri\u010dnoj
  regiji;\\n- slabost, apatija;\\n- proljev, krvne mrlje mogu biti prisutne u izmetu;\\n-
  mu\u010dnina, glavobolja;\\n- pove\u0107ano znojenje;\\n- svrbe\u017e, osip.\\nBiltricid
  se ne mo\u017ee uzimati u prvom tromjese\u010dju trudno\u0107e, tijekom dojenja,
  djeca mla\u0111oj od \u010detiri godine, s neispravnom jetrenom dozom.\\nAlbendazol
  je u\u010dinkovito sredstvo za prevenciju\\nAlbendazol se bori protiv spolno zrelih
  parazita i njihovih li\u010dinki, lijek ima \u0161irok terapeutski u\u010dinak,
  djelotvoran \u010dak i protiv ekstra-crijevnih parazita. Ali ima prili\u010dno opse\u017ean
  popis nuspojava.\\n- migrena, vrtoglavica;\\n- neugodne senzacije u epigastri\u010dnom
  podru\u010dju, mu\u010dnina;\\n- osip na ko\u017ei, svrbe\u017e;\\n- groznice;\\n-
  privremena hipertenzija.\\nZa profilaksu, morate uzeti 0,4 grama lijeka jednom dnevno,
  doza je izra\u010dunata na 6 mg / kg za djecu. Morate popiti lijek nakon jela.\\nLijek
  je kontraindiciran tijekom trudno\u0107e i prirodnog hranjenja, s o\u0161te\u0107enjem
  mre\u017enice o\u010diju, djeci mla\u0111oj od \u0161est godina.\\nNe mo\u017eete
  zaboraviti stare i u\u010dinkovite recepte za borbu i prevenciju s helminths - to
  su korisni proizvodi kao \u010de\u0161njak i luk u sirovom obliku\\nOd toga je mogu\u0107e
  zamijeniti lijekove\\nVe\u0107ina parazita ne podnosi duhovnu i za\u010dinjenu hranu,
  tako da redovito trebate uklju\u010diti u prehranu luk, \u010de\u0161njak, \u0111umbir,
  cimet, \u010dili. Dobro se bori s crvima, ja\u010da imunolo\u0161ki sustav mrkve
  i sok od \u0161ipaka.\\nU\u010dinkovita preventivna medicina tradicionalne medicine:\\nSkuhajte
  4 \u010de\u0161njaka \u010de\u0161njaka, sipajte 220 ml toplog mlijeka, popijte
  ujutro na prazan \u017eeludac, mo\u017eete doru\u010dkovati za 2 sata. Za djecu
  je potrebno smanjiti koli\u010dinu sastojaka faktorom 2.\\n- S gornjim dijelom ispunjen
  je tamnocrvena posuda s volumenom od 250 ml s razbijenim odjeljcima od orahova,
  posve napunjen vodkom i stavljen u tamno mjesto 7-10 dana. Pijte 5 kapi na prazan
  trbuh dva tjedna.\\n- U 200 ml tople vode otopiti 5 g propolisa, dodati med i \u0111umbir
  na okus, dio lijeka za pi\u0107e u 2 podijeljene doze.\\n- Svakog jutra popijte
  lagani gutljaj \u010da\u0161e vode, u kojoj nave\u010der morate dodati 5 ml meda
  i sok od limuna.\\nZa prevenciju infekcije helmintima treba redovito jedu sjemenke
  sirovi bundeve mogu se \u017evakao suhe kore od agruma jesti na prazan \u017eeludac
  nekoliko listova svje\u017eeg loboda.\\nNajbolji na\u010din izbjegavanja zaraze
  parazitima je strogo pridr\u017eavanje pravila higijene, pa\u017eljiva prerada povr\u0107a
  i vo\u0107a, mesa, ribe, dnevne promjene donjeg rublja. \u0160to pilule za crve
  bolje poduzimaju za profilaksu - bolje je konzultirati lije\u010dnika o ovom pitanju,
  pogotovo ako se radi o djeci i trudnicama.\\nLijekovi od crva\\nOp\u0107e informacije\\nModerni
  anthelmintic agensi se koriste za lije\u010denje ljudi koji pate od razli\u010ditih
  oblika helmintijaze. Svi kori\u0161teni antihelminti\u010dki lijekovi za ljude podijeljeni
  su na pripravke iz \u0161irokog spektra helmina i pripravaka od crva koji utje\u010du
  selektivno na njihove specifi\u010dne vrste.\\nAli doista u\u010dinkovitih farmaceutskih
  protiv glista lijekovi su relativno novi, a prethodno se uglavnom koristi biljni
  lijekovi, kao \u0161to su \u010de\u0161njak, sjemenke bundeve, paprati ekstrakt
  mu\u0161kih i drugih.\\nAli sada postoje uistinu djelotvorni i sigurni anthelmintic
  agenti, koji pokazuju antihelminti\u010dku aktivnost.\\nMe\u0111utim, nemogu\u0107e
  je samostalno odabrati odre\u0111ene pripravke protiv parazita u ljudskom tijelu,
  budu\u0107i da je neophodno utvrditi koji gliste parazitizirati u tijelu. U Rusiji
  je vi\u0161e od 70 vrsta razli\u010ditih parazita \u0161iroko rasprostranjeno, od
  kojih svaki mo\u017ee utjecati na tijelo. \u010cak i oni antihelminti\u010dki lijekovi
  koji poma\u017eu od svih vrsta crva moraju biti uzeti kao \u0161to je propisao lije\u010dnik.
  Uostalom, anthelmintski pripravci za ljude \u0161irokog spektra djelovanja imaju
  mnoge kontraindikacije, dakle, kada zaraze crijevima i drugim vrstama parazita,
  treba ih strogo uzimati prema shemi koju je stru\u010dnjak odredio.\\nNaj\u010de\u0161\u0107i
  su sada pinworms, ve\u0107ina pred\u0161kolske djece. Vrlo \u010desto djeca u analizi
  tako\u0111er odre\u0111uju Giardia, Parazitiraju\u0107i u dvanaesniku i nisu helminti.
  Druga uobi\u010dajena vrsta helminti - roundworm.\\nModerni farmakolozi nude deset
  lijekova koji u\u010dinkovito osloba\u0111aju osobu od zaraze parazitima. Naj\u010de\u0161\u0107e
  invazije na helminci tretiraju se lijekovima Vermox, Pirantel, Wormil, Decaris,
  Nemozol. U nastavku \u0107emo govoriti o tome kako uzimati pilule od crva, o tome
  \u0161to su indikacije i kontraindikacije za kori\u0161tenje, koji je od postoje\u0107ih
  lijekova naju\u010dinkovitiji. Pripreme posljednje generacije iz crva manje su toksi\u010dne,
  ali postoje odre\u0111ene op\u0107e kontraindikacije. Stoga, svaki univerzalni lijek
  treba propisati lije\u010dnik. Dakle, lije\u010denje bjesno\u0107a u odraslih i
  djece ne mo\u017ee se prakticirati ako se pacijentu dijagnosticira akutna crijevna
  infekcija, bilo koja infektivna, virusna, somatska bolest. Nemojte koristiti takve
  tablete na dojenje, a kad trudno\u0107e samo su sredstva dopu\u0161tena piperazin.\\nParazite
  koje osoba mo\u017ee dobiti podijeljena su u razli\u010dite skupine. Svaki od njih
  (cestode, trematode, nematode) pokazuje osjetljivost na odre\u0111ene lijekove.
  Zbog toga se lije\u010denje bolesnika u odrasloj dobi i djece mora obaviti lije\u010dnikom
  nakon svih potrebnih testova, postavljaju\u0107i ili antiparazitske lijekove \u0161irokog
  spektra za ljude ili odre\u0111ene lijekove.\\nKako se tretiraju nematode ili okruglice?\\nOkrugli
  crvi su paraziti koji \u010desto inficiraju osobu. Nematode uklju\u010duju slijede\u0107e
  vrste parazita: roundworm, pinworms, whipworm, Trichinella, Toxocara. Naj\u010de\u0161\u0107i
  me\u0111u njima su okruglice i pinworms. Trenuta\u010dno postoje slijede\u0107e
  pripreme protiv parazita u ljudskom tijelu koje djeluju na okruglice koje parazitizuju
  u crijevu:\\nAko je do\u0161lo do infekcije s izvanintestinalnim nematozama, tada
  se lije\u010denje bjelan\u010devina u odraslih i djece provodi sa sljede\u0107im
  lijekovima:\\nBudu\u0107i da anthelmintski pripravci za ljude u ve\u0107ini slu\u010dajeva
  utje\u010du na parazite odraslih, a jaja i li\u010dinke jedva funkcioniraju, lije\u010denje
  treba ponoviti dva tjedna kasnije. Osim toga, mo\u017ee se pojaviti ponovljena infekcija
  s pinwormovima.\\nDa biste pove\u0107ali djelotvornost procesa uklanjanja parazita,
  uz kori\u0161tenje nekih lijekova ujutro, nave\u010der, trebate napraviti klistir
  ili piti laksativ.\\nLijekovi iz tapeworms ili cestodes\\nTrakavice - zajedni\u010dki
  parazita, koji uklju\u010duju veliki popis razli\u010ditih helminta - hydatidosa
  bolesti, govedina trakavice infekcije, GID, dipilidioz, alveococcosis, Sparganosis,
  patuljak trakavice, gove\u0111i trakavice, svinjetina trakavice, \u0161iroka riba
  trakavice, itd..\\nKod zaraze ove vrste parazita koriste se sljede\u0107e tablete
  protiv ljudskih crva:\\n- niklozamid(fenasal) se primjenjuje ako se udari enteri\u010dki
  paraziti - trakavice.\\n- albendazole(Nemozol) je na snazi u nematosis, kao i kod
  infekcije s mje\u0161ovitim helminti\u010dkim invazijama, echinococcus, neurocysticercosis,
  giardiasis, Nemosol se mo\u017ee koristiti ako je osoba zara\u017eena ekstraintestinalnom
  cestodiasisom.\\n- mepacrine(kinakrin) - anthelmintic agens u\u010dinkovit za infekciju
  s gove\u0111im ili patuljastim lancem, kao i kada je zara\u017eena \u0161irokom
  vrpcom, s giardiasisom itd.\\nKako lije\u010diti bjelan\u010devine trematode ili
  trematode, flatworms\\nPopis helminti pripadaju ovoj klasi vrlo je \u0161irok: ovo
  fasciolasis (hepatitis), opistorhos (ma\u010dka), clonorchiasis (Kineska fluka),
  uotsonioz (hepatitis), paraganimoz (plu\u0107ni flukovi), pliva\u010d \u0161uga
  (svrbe\u017e kupa\u010di). Ova grupa tako\u0111er uklju\u010duje metorhoz, gectrofioza,
  nanofeitoza, gastrodyskoidoza, fasciolopsikoza, \u0161istosomijaza i drugima.\\nOd
  svih gore navedenih vrsta, takve tablete su u\u010dinkovite:\\n- bithionol, hloksilaU\u010dinkovito
  s izvanintestinalnim trematodama.\\n- perkloretilen se koristi za intestinalne trematode.\\n-
  Tsesol, biltricid, Azinoks, Tsistitsid(aktivni sastojak Praziquantel) - lijekovi
  \u0161irokog spektra djelovanja, djeluju za razli\u010dite vrste crva.\\nTreba napomenuti
  da je bilo worming lijekovi, posebno onih koji su propisani biste dobili osloboditi
  od traka crvi i stan, mo\u017eete piti samo u svrhu medicinskih Parasitologists.
  Uostalom, pripreme od parazita su vrlo otrovi, pa se dozu koju propisuje lije\u010dnik
  strogo po\u0161tujte. Kada pacijent uzima lijekove protiv parazita u ljudskom tijelu,
  potrebno je provesti terapiju odr\u017eavanja (pod uvjetom izbacivanja avion i tapeworms).
  Ne mo\u017eete sami uzimati takve lijekove, bez nadzora lije\u010dnika.\\nTreba
  li se antiparazitske lijekove koristiti za prevenciju?\\nAko je jedan od \u010dlanova
  obitelji bio zara\u017een pinworms, onda preventivne metode su potrebne za sve.
  Vrlo je visoka razina infekcije s pinwormima me\u0111u djecom pred\u0161kolske i
  osnovno\u0161kolske dobi. Crv jaja su se vrlo brzo - to se doga\u0111a kroz svakodnevne
  predmete, drhtavih ruku, odje\u0107e zara\u017eene djece, itd Dakle, profilakti\u010dka
  primjena lijekova za odrasle i djecu pitanja nastaju vrlo \u010desto..\\nMi\u0161ljenja
  o tome je li potrebno sprije\u010diti crva u ljudi, stru\u010dnjaci su podijeljeni.
  Neki vjeruju da ako uzimate pilule protiv crva za profilaksu osoba u jednom danu,
  onda je mogu\u0107e da \u0107e se infekcija pojaviti za nekoliko dana i bit \u0107e
  beskorisna. Stoga prevencija helmintioze trebala bi se sastojati od pranja ruku
  \u010desto, odr\u017eavanja intimne higijene, mijenjanja donjeg rublja svako jutro
  i tako dalje. No tablete za prevenciju parazita kod ljudi su nepo\u017eeljne, jer
  su toksi\u010dne i imaju negativan u\u010dinak na tijelo. Stoga je preporu\u010dljivo
  zamijeniti lijekove za sprje\u010davanje crva u odraslih i djece za konzumaciju
  sirovog sjemenki bundeve ili bilo koji narodni lijek za crve za osobu koja sadr\u017ei
  \u010de\u0161njak.\\nMe\u0111utim, postoje druga mi\u0161ljenja. Neki stru\u010dnjaci
  tvrde da osobe \u010dije obitelji imaju malu djecu i mla\u0111e \u0161kolske dobi
  traju svakih \u0161est mjeseci kako bi se sprije\u010dile pirantel. Uostalom, u
  dje\u010djim timovima visoka razina infekcije, a simptomi infekcije ponekad su vrlo
  slabo izra\u017eeni.\\nOsim toga, beba je u stanju pravilno promatrati higijenu
  samo bli\u017ee od 6 godina, tako da se djeca stalno mogu osje\u0107ati otrovanje,
  kao i kod ostalih \u010dlanova obitelji.\\nAko postoji negativan rezultat kada struganje
  na enetrobioz, ali beba je jo\u0161 uvijek \u017ealio na svrbe\u017e u anus, bolovi
  u trbuhu, mu\u010dninu, najbolje je imati dijete na analizu u jutro te no\u0107i
  je spavao lo\u0161e, zabrinut za svoju jakim svrbe\u017eom. Ponovno koprcirano tri
  puta, jedan dan i dva tjedna kasnije, mo\u017eete dobiti pouzdani rezultat.\\nKada
  je potrebno za uzimanje tableta od parazita u ljudskom tijelu za prevenciju:\\n-
  Ako dr\u017eite ku\u0107ne ljubimce u ku\u0107i - psi, ma\u010dke, itd.;\\n- sa
  stalnim kontaktom s tlom (rad na krevetima, igre u pje\u0161\u010daniku);\\n- s
  prebivali\u0161tem djece u zatvorenim dje\u010djim skupinama;\\n- ako netko voli
  lov, odbojku na pijesku, itd.;\\n- s redovitim izletima u egzoti\u010dne zemlje.\\n\u0160to
  ako se crvi pojavljuju tijekom trudno\u0107e?\\nTijekom razdoblja trudno\u0107e
  \u017eena, naravno, mo\u017ee zaraziti parazitima. \u0160to u\u010diniti u ovoj
  situaciji, jer u tom razdoblju do uporabe lijekova treba tretirati vrlo pa\u017eljivo?
  Lije\u010denje crva tijekom trudno\u0107e treba biti vrlo pa\u017eljivo, jer nisu
  svi lijekovi pogodni za \u017eene u tom stanju. Zabranjeno je lije\u010denje trudnica
  uz pomo\u0107 tableta s crvima u prvom tromjese\u010dju. Uostalom, lijekovi su vrlo
  otrovi, pa su oni mnogo opasniji za budu\u0107u majku od parazita. Ako postoje crvi
  u trudnica, \u0161to treba u\u010diniti, lije\u010dnik \u0107e objasniti.\\nTijekom
  trudno\u0107e, paraziti se mogu povu\u0107i s lijekovima samo uz pomo\u0107 lijekova
  piperazin. Uzmite lijekove kako slijedi:\\n- kao lijek za ascaris - dva puta dnevno,
  jedan sat prije jela ili jedan sat nakon toga, dva dana u dozi od 1,5-2 g;\\n- za
  borbu s pinworms - u istoj dozi za pet dana, nakon \u010dega slijedi tjedan pauze,
  svi pro\u0107i od 1 do 3 te\u010dajeva.\\nAko je budu\u0107a majka zara\u017eena
  pinwormsom, briga o tome ne vrijedi. Pod uvjetom da \u017eena strogo pridr\u017eava
  pravila higijene, mo\u017ee do\u0107i do samoizlje\u010denja. Uostalom, razdoblje
  \u017eivota pinworms nije dugo - nekoliko tjedana. Stoga, trebate prati rublje,
  prati \u010de\u0161\u0107e kako bi se izbjegla ponovna invazija. Da biste sprije\u010dili
  infekciju ili ponovno invaziju, trebali biste dobro oprati ruke sapunom:\\n- nakon
  posjete WC-u;\\n- nakon promjene posteljine;\\n- nakon kontakta sa \u017eivotinjama;\\n-
  prije jela.\\nObavezno isperite sve vo\u0107e i povr\u0107e.\\nNaju\u010dinkovitiji
  crvi za ljude\\nVo\u0111eni samo \u010dinjenicom da korisni\u010dke recenzije na
  forumu pokazuju da ta ili ona droga - dobre tablete iz crva, uop\u0107e ne mogu.
  Ne kupujte lijekove, samo znaju\u0107i ime crva od odraslih i djece.\\nO tome \u0161to
  su tablete s crva bolje za odrasle i djecu, uvijek morate pitati stru\u010dnjaka.
  Uostalom, kako bi odabrali naju\u010dinkovitije tablete od crva u ljudi, va\u017eno
  je razmotriti koji paraziti su zara\u017eeni dijete ili odrasla osoba. Zapravo \u010dak
  protivoglistnye pripreme \u0161irokog spektra djelovanja za osobu imaju u strukturi
  razli\u010dite aktivne komponente. Prema tome, kontraindikacije, nuspojave, metoda
  primjene i doziranja se razlikuju. Cijena tableta od crva razlikuje se. Ispod je
  opis kako se crvi nazivaju, kako piti te lijekove, njihove kontraindikacije i mogu\u0107e
  negativne akcije.\\ndekaris\\nAktivna komponenta - levamisol.\\nOvaj u\u010dinkovit
  lijek za crve u odraslih i djece ne samo da ubija parazite, ve\u0107 i proizvodi
  imunomodulacijski u\u010dinak. Me\u0111utim, njegova upotreba je mogu\u0107a tek
  nakon imenovanja lije\u010dnika, kao i tableta nije samo u stanju ubiti helminti,
  ali i na\u0161koditi tijelu kao proizvesti puno nuspojava, i to mo\u017ee izazvati
  negativne u\u010dinke.\\nIndikacije: od \u0161upljina, pinworms, nekatora, hookworm,
  glave vagala, intestinalnog mitesera, toksoplazmoze, trichostrongileza.\\nKontraindicirana
  za djecu mla\u0111u od 3 godine, s torakalno hranjenje, agranulocitoza. Nemojte
  koristiti tablete od 150 mg za lije\u010denje djece. Pa\u017eljivo primijeniti Decaris
  ljudima koji pate bubreg i o\u0161te\u0107enje jetre, kao i bolesnika s ugnjetavanjem
  hematopoezije ko\u0161tane sr\u017ei.\\nUputstvo: odrasle osobe su jedna tableta
  od 150 mg jednom, nakon jela, nave\u010der. Djeca od 3 do 6 godina - jednom 25-50
  mg. Djeca od 6 do 10 godina - jednom 50-75 mg. Djeca od 10 do 14 godina - jednom
  75-100 mg.\\nTe\u010daj se ponavlja nakon 2 tjedna. Dijeta ili uzimanje laksativa
  nije nu\u017eno. Nuspojave: nakon primjene, bol u trbuhu, mu\u010dnina, proljev,
  povra\u0107anje, nesanica, vrtoglavica, alergijske manifestacije, zbunjenost, stomatitis
  itd.\\nCijena je od 80 rubalja.\\nHelminthox, Pirantel, Combantrin, Nemocid\\nAktivna
  komponenta - pirantel.\\npripravci Gelmintoks, Kombantrin i pirantel prikazani su
  s ankilostomiasisom, ascaridozom, trikokafalozom, ne-karotidozom, enterobiazom.
  Te tablete za lije\u010denje parazita u ljudskom tijelu najsigurnije su i naju\u010dinkovitije
  za lije\u010denje djece. Naj\u010de\u0161\u0107e su propisane za ascariasis i enterobiosis.\\nKontraindicirane
  s preosjetljivosti, oprezno se tablete propisuju djeci koja jo\u0161 nisu navr\u0161ila
  \u0161est mjeseci starijih majki, osobe s jetrenom insuficijencijom.\\nOpis uputa:
  Odrasli u slu\u010daju ascariasis, infekcije pinworm ili mje\u0161ovite zaraze su
  dovoljno jednom ujutro, nakon doru\u010dka. Doza se uzima brzinom od 10 mg / kg.
  Prikazana su djeca od \u0161est mjeseci do 2 godine uzimanja 125 mg, djece od 2
  do 6 godina - 250 mg, od 6 do 12 godina - 500 mg.\\nZa borbu protiv parazita bilo
  je uspje\u0161no, nakon 2-3 tjedna treba se ponoviti te\u010daj kako bi se izbjegla
  samoinfekcija.\\nAko se pacijentu dijagnosticira mje\u0161ovita invazija, tada bi
  lijek trebao napiti brzinom od 10 mg / kg dnevno ili dva dana po stopi od 20 mg
  / kg dnevno. Ako je zabilje\u017eena izolirana ascarija, trebate piti lijek jednom
  brzinom od 5 mg / kg. Treba napomenuti da Pirantel - \u017evakanje tablete, tako
  da ih ne treba progutati, ali \u017evakati.\\nMo\u017eete kupiti Helmintox po cijeni
  od 80 rubalja., Pirantel - od 50 rubalja.\\nVermoks, Vormin, Vermakar\\nAktivna
  komponenta - mebendazol.\\nLijek od crva do ljudi s na komponentu prikazanu na Enterobiasis,
  Ascariasis, vi\u0161e nematoda, strongyloidiasis capillariasis, ankilostomidoze,
  trihinelozu, ehinokokoza, taeniasis, Alveococcosis, gnathostomiasis trihotsefaleze.\\nOvo
  je djelotvoran lijek za crve u odraslih i djece, od kojih je svaka posebno korisna
  kada su zara\u017eene pinworms i ascarids.\\nVi ne bi trebali uzimati ove tablete
  tijekom trudno\u0107e i dojenja, ulcerozni kolitis, bolesti jetre, Crohnove bolesti,
  propisati i lijekove za djecu koja su do 2 godine starosti.\\nMetoda i shema primjene:
  Vermakar, Wormin, suspenzija ili Vermox tablete se isperu s malom koli\u010dinom
  teku\u0107ine. Za lije\u010denje enterobioze, djeca od 2 do 10 godina trebaju piti
  25-50 mg jednom dnevno, odrasli - 100 mg. Trebate ga ponovo ponijeti za 2-4 tjedna.\\nAko
  pacijent je dijagnoza strongyloidiasis, taeniasis, trichocephalosis, rudarska glista,
  Ascariasis ili mje\u0161oviti Helmintiaza dehelmintizacije provodi na sljede\u0107i
  na\u010din: 3 dana, dva puta dnevno, uzimati 100 mg.\\nU slu\u010daju trichinosis
  - tri puta dnevno za 200-400 mg, zatim od 4 do 10 dana - 400-500 mg tri puta dnevno.\\nKada
  zarazite sa ehinokokozom, uzimajte 500 mg tri puta dnevno tijekom 3 dana, tada se
  doza treba pove\u0107ati na 25-30 mg po 1 kg tjelesne te\u017eine.\\nNuspojave se
  mogu pojaviti u obliku vrtoglavice, mu\u010dnine, bolova u trbuhu. Ako se proizvod
  upotrebljava dulje vrijeme, mogu\u0107e je povra\u0107anje, alergija, proljev, glavobolja,
  anemija, eozinofilija, leukopenija, cilindrurija i drugi.\\nTro\u0161ak Vormin -
  od 140 rubalja., Vermox - od 100 rubalja.\\nVormil, Nemozol, Aldazol, Helmodol-VM,
  Albendazol, Helmizol\\nAktivna komponenta - albendazol.\\nOni su prikazani na nematodoses
  protiv glista, toxocarosis, strongyloidiasis, ehinokokoza jetre, plu\u0107a, peritoneum,
  ako je pobuda - li\u010dinki obliku Echinococcus granulosus, kao i druge jednostavne
  i giardijaza, mje\u0161ovitih provala, neurocysticercosis, ako je pobuda - li\u010dinki
  obliku teania solium.\\nKontraindicirana u trudno\u0107i, preosjetljivosti, o\u0161te\u0107enja
  mre\u017enice, kao i za djecu mla\u0111u od dvije godine. Tijekom dojenja treba
  paziti ako se smanji nastajanje krvi ili funkcija jetre.\\nUpotreba: Nemozol, Gelmodol-BM,
  Wormil treba piti tijekom jela.\\nNemosol u slu\u010daju nemazodnog napitka jednom:
  lije\u010denje helmintize kod odraslih osigurava 400 mg lijeka, djeca od 2 godine
  - 20 ml suspenzije.\\nAko je pacijent zara\u017een einkinokokozom ili neurocysticercosisom,
  odrasle osobe mase vi\u0161e od 60 kg trebaju piti dva puta dnevno 400 mg, ako je
  te\u017eina manja od 60 kg - 15 mg / kg / te\u017eina dva puta dnevno. Neurocysticercosis
  tijek terapije je 8 do 30 dana, ehinokokoza terapija - tri te\u010dajevi za 28 dana,
  morat \u0107ete uzeti pauze izme\u0111u smjerova 2 tjedna.\\nAko je Nemozol propisano
  za djecu s giardiasisom, a zatim tjedan dana jednom, potrebno je koristiti dozu
  od 10-15 mg / kg.\\nAko dijete ima toksokarozu, pacijenti mla\u0111i od 14 godina
  propisani su tablete dva puta dnevno za 10 mg / kg. Odrasli koji te\u017eine do
  60 kg dva puta dnevno primaju 200 mg lijeka, ako je te\u017eina ve\u0107a od 60
  kg, a dva puta dnevno pacijent prima 400 mg. Tijek lije\u010denja je 1-2 tjedna.\\nAko
  se provodi antiparazitsko lije\u010denje tim lijekovima, bol u trbuhu, disfunkcija
  jetre, mu\u010dnina, povra\u0107anje, glavobolja, vrtoglavica, pove\u0107ana temperatura
  i Krvni tlak, zatajenje bubrega, pancitopenija, leukopenija, trombocitopenija i
  drugi.\\nTro\u0161kovi Nemozola u drogerijama od 175 rbl. Aldazol - od 100 rubalja.\\nCrvi
  koji su \u010desti u Rusiji\\n- I u Rusiji i Ukrajini \u010desto postoje roundwormi
  pinworms, \u0161to je vrlo lako uhvatiti \u010dak iu velikim gradovima - u Moskvi,
  Kijev.\\n- Tako\u0111er je cirkulirao svinjetina, osobito ovaj parazit se nalazi
  u Bjelorusiji i Ukrajini. Tako\u0111er na podru\u010dju tih zemalja postoje Trichinella,
  kao u sjevernoj, sredi\u0161njoj, isto\u010dnoj Rusiji.\\n- U blizini vodenih tijela
  s slatkom vodom \u010desto se nalazi \u0161iroka vrpca, Infekcija nije neuobi\u010dajena
  u Karelia, Sibiru, regiji Volga, Baikal regiji, Dalekom Istoku, Kazahstanu, Balti\u010dkom,
  u bazenima velikih rijeka.\\n- infekcija whipwormjavlja se u tropskim i suptropskim
  zonama, gdje je klima vla\u017ena i topla. Stoga ljudi \u010desto postaju zara\u017eeni
  prilikom posjeta odmarali\u0161tima.\\n- Bull Chain je \u0161iroko rasprostranjena
  u razli\u010ditim zemljama, ali naj\u010de\u0161\u0107e su zara\u017eene u Transkaucazi
  i sredi\u0161njoj Aziji.\\n- Patuljasti teleonnaj\u010de\u0161\u0107i u toplim i
  suhim klimatskim uvjetima.\\n- Najve\u0107i fokusi opisthorchiasisnalaze se u zapadnom
  Sibiru, Kazahstanu, bazena velikih rijeka.\\n- Plu\u0107ni flukovi su \u010desti
  u Dalekom Istoku.\\n- Najve\u0107i d\u017eepovi \u0161irenja hematski trematoda
  nalaze se na sjeverozapadu Rusije, u Transkaucasu, Baltiku, u sredi\u0161njoj Aziji.\\n-
  Pove\u0107ani rizik od infekcije Kineska fluka slavi se na Dalekom Istoku, u Amurovom
  slivu.\\n- rasprostranjenost alveococcosis, ehinokokoza zabilje\u017eeno je u Transkaucazi,
  Ukrajini, Volgogradu i Rostovu, Bashkortostanu, Yakutiji, Stavropolu, Altajima i
  Krasnodarskim krajevima.\\nDijeta pilule s crvima\\nU potrazi za idealnom figurom,
  \u017eene \u010desto odlu\u010duju o raznim trikovima. U nekim slu\u010dajevima
  to je jo\u0161 ekstremnija metoda od stroge prehrane ili \u010di\u0161\u0107enja
  tijela. Postoje \\\"divne\\\" pilule, zara\u017eene crvima i doprinose gubitku te\u017eine.
  Me\u0111utim, svaka \u017eena treba jasno shvatiti da takve pilule predstavljaju
  vrlo opasan proizvod za zdravlje. Ako pijete ove \\\"moderne \u010dudotvorne alate\\\",
  bit \u0107e intoksikacija organizam \u0107e postupno zaraziti otrovima koji lu\u010de
  parazite, zbog \u010dega \u0107e osoba, naravno, odmah izgubiti te\u017einu. Ali
  istodobno \u0107e uvijek biti bolestan, pojavit \u0107e se \u010direvi i osip. Dakle,
  da se takva mr\u0161avljenja i otrovanja tijela definitivno ne isplati. Uostalom,
  na kraju ne\u0107ete se rije\u0161iti prekomjerne tjelesne te\u017eine i razvoja
  ozbiljnih bolesti - kolecistitis, ciroza i drugima.\\nOstali lijekovi\\nPoku\u0161avaju\u0107i
  prona\u0107i najopasnije pripreme od crva do djece \u0161irokog spektra djelovanja,
  roditelji imaju tendenciju obratiti pozornost na najpoznatije imena lijekova i ponekad
  ih kupiti bez konzultacija s lije\u010dnikom. To se u svakom slu\u010daju ne mo\u017ee
  u\u010diniti jer je popis lijekova za parazite u ljudskom tijelu dovoljno \u0161irok,
  a ponekad je neophodno unositi univerzalni lijek, ve\u0107 lijek usmjeren na borbu
  protiv odre\u0111enog parazita. Stoga, samo recenzije o lijekovima na mre\u017ei
  ne bi trebale biti vodi\u010d za akciju.\\nPored gore opisanih lijekova, postoje
  i drugi anthelmintski lijekovi i lijekovi. sredstva ivermektin Jesu li tablete iz
  helminti za ljude \u0161irokog spektra djelovanja. Me\u0111utim, ivermektin je naju\u010dinkovitiji
  u lije\u010denju infekcija koje izazivaju okruglice. Tako\u0111er se koristi u veterinarskoj
  medicini.\\nmetrifonat Koristi se za lije\u010denje urogenitalne schistosomiase.\\nU
  dana\u0161nje vrijeme, tako\u0111er je mogu\u0107e kupiti anthelmintic lijekove
  za ljude, koje lije\u010dnici propisuju za odre\u0111ene vrste parazita.\\nLijek
  Medamin, koji sadr\u017ei aktivni sastojak Carbendacim, je anthelmintski agens koji
  djeluje protiv intestinalnih nematoda. Medamin se koristi ako osoba ima trichocephalus,
  ascariasis, ankylostomiasis, enterobiasis, non-carotidosis. \u0160to ovaj lijek
  uzrokuje kao nuspojave? Mogu\u0107e alergijske manifestacije, slabost, mu\u010dnina.\\nDitrazin
  (Ditrazin citrat) se koristi za lije\u010denje filarijeza - bolesti koja uzrokuje
  crve-phyllaria. Uz ascariasis, to funkcionira, ali je manje djelotvorno od drugih
  lijekova.\\nPonekad je potrebno koristiti dodatna sredstva lokalne akcije. Na primjer,
  laktoza Dermokas Koristi se za dermatoze, s sumnjom na komplikacije izazvane sekundarnom
  infekcijom. Dermokas se tako\u0111er koristi za gljivi\u010dne bolesti ko\u017ee.\\nAko
  se pacijent suo\u010di s pitanjem kako lije\u010diti parazitsku infekciju, mo\u017eete
  obratiti pa\u017enju na pripreme za lije\u010denje crva u odraslih osoba koje sadr\u017ee
  biljne komponente. U pravilu se koriste kao pomo\u0107ne tvari, paralelno s lijekovima,
  koje lije\u010dnik propisuje kao lijek.\\nLijek anthelminthic sadr\u017ei u sastavu
  magnezijev sulfat, \u010de\u0161njak, klin\u010di\u0107i, orasi, gorka pelina, sjemenke
  bundeve. Lijek poma\u017ee da se rije\u0161i parazita i sprje\u010dava otpornost
  na droge od crva.\\nHomeopatski lijek Antigelmin uzmi sublingualno 1-2 mjeseca.\\nkapsule
  Antigelmos uklju\u010duju sastav li\u0161\u0107a eukaliptus rosaceous, yarrow biljka,
  karanfil.\\nTjelesna \u017eena je biolo\u0161ki dodatak, koji se, me\u0111utim,
  tako\u0111er ne mo\u017ee koristiti bez odobrenja lije\u010dnika.\\nStoga, unato\u010d
  bogatstvu sredstava, kako se rije\u0161iti crva u odraslih i djece, lije\u010dnik
  bi trebao objasniti, postavljaju\u0107i odgovaraju\u0107i re\u017eim lije\u010denja,
  s obzirom na kompatibilnost lijekova.\\nFolk lijekovi za crve u odraslih i djece\\nOni
  koji poku\u0161avaju prona\u0107i najbolji lijek za crve u odraslih i djece, trebali
  biste znati da se u nekim slu\u010dajevima lije\u010denje u domu poma\u017ee narodnim
  lijekovima. \u0160to to\u010dno trebate poduzeti i kako se lije\u010diti, lije\u010dnik
  \u0107e vam preporu\u010diti. No osnovni narodni lijekovi dobro su poznati: sjemenke
  bundeve, \u010de\u0161njaka, luka, klin\u010di\u0107a.\\nSvaki takav lijek za parazite
  u ljudskom tijelu op\u0107enito je dostupan i ne uzrokuje nuspojave. Osim toga,
  recenzije o ovoj vrsti proizvoda su pozitivne, kao \u0161to su, na primjer, iste
  sjemenke bundeve jedu s u\u017eivanjem djece.\\nPonekad je odgovor na pitanje kako
  se rije\u0161iti helminths kod ku\u0107e je jednostavan: jesti \u0161to vi\u0161e
  sjemenki bundeve \u0161to je vi\u0161e mogu\u0107e. Me\u0111utim, postoje razli\u010dite
  recepte. Na primjer, med i soda se pomije\u0161aju sa sjemenjem bundeve: 1 \u010da\u0161u
  meda za 1 \u010da\u0161u sjemena i 1 \u017eli\u010dicu meda. soda. Agent se inzistira
  10 dana i tro\u0161i 1 \u017eli\u010dicu. Ujutro prije jela.\\nNeki izvori ka\u017eu
  da s redovitom konzumacijom sjemenki bundeve mo\u017eete se rije\u0161iti tapeworm
  kod ku\u0107e. Da biste se rije\u0161ili trakavice, svakog jutra trebate jesti dvije
  \u017elice sjemenki bundeve, a nakon sat vremena piti dobar laksativ. Koliko dugo
  prakticirati takav tretman ovisi o tijelu. Ali, bolje je konzultirati stru\u010dnjaka
  unaprijed.\\nMnogi ljudi zainteresirani su za uzimanje \u010de\u0161njaka od parazita.
  Da je \u010de\u0161njak iz crva u odraslih djelovao \u0161to je mogu\u0107e u\u010dinkovitije,
  morate ujutro konzumirati \u0161to vi\u0161e zubobolja. Ako osoba ka\u017ee: \\\"Ne
  mogu \u017evakati \u010de\u0161njak\\\", mo\u017eete ga rezati i progutati s kuhanim
  mlijekom.\\nKako se boriti kod ku\u0107e s crvima pomo\u0107u lukova? Da biste to
  u\u010dinili, pripremite infuziju na luk, izre\u017eite srednji \u017earulju i napunite
  toplom vinom za no\u0107. Ujutro je potrebno napiti i piti teku\u0107inu na prazan
  \u017eeludac.\\nPostoje i vi\u0161e proturje\u010dnih narodnih lijekova. Na primjer,
  neki ljudi uzimaju alkohol i poku\u0161avaju se rije\u0161iti crva. Zapravo, takav
  tretman nije u\u010dinkovit. Istina, postoji niz recepata za tinkture, u kojima
  se, izme\u0111u ostalog, koristi alkohol, na primjer, tinktura pelina. Ali konzumirati
  alkohol, na primjer, pivo, vjeruju\u0107i da \u0107ete se rije\u0161iti parazita,
  barem, to je nerazuman.\\nDa bi lije\u010denje bilo u\u010dinkovito, potrebno je
  provesti prema shemi koju propisuje lije\u010dnik, a zatim slijedite sva pravila
  prevencije.\"", "\"Saznajte tko i kako trguje va\u0161im podacima, kako ih prikuplja
  i, najbitnije, kako se od toga za\u0161tititi\\nU tome \u0107e vam pomo\u0107i zagreba\u010dki
  Autonomni kulturni centar Medika u Pierottijevoj 11, gdje u ponedjeljak, 15. listopada,
  od 20 sati mo\u017eete sudjelovati u Maloj \u0161koli privatnosti u organizaciji
