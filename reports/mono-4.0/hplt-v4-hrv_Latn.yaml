  A za to vam je potreban SSL certifikat priznatog izdavatelja certifikata (CA \u2013
  Certified Authority) kome se vjeruje, kojim se jam\u010di da tvrtka postoji i da
  web server radi u skladu sa SSL protokolom. Preporu\u010dujemo i nudimo slijede\u0107e
  certifikatore: GeotrustThawteVerisign\\nSSL je skra\u010denica za Secure Sockets
  Layer, globalni standard sigurnosne tehnologije razvijene od Netscape-a 1994.godine.
  SSL tehnologijom kriptira (\u0161ifrira) se veza izmedju web servera (neka domena)
  i pretra\u017eivaca (browsera) na ra\u010dunalu posjetitelja tog web servera (te
  domene), pa podaci koji se razmjenjuju nemogu biti vidljivi, presretani i de\u0161ifrirani.\\nMnogi
  od vas su se ovih dana upoznali su \u010dinjenicom da su otkriveni podaci milijuna
