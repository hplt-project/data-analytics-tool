sample: '["\"Atena\\nAtena je najstarija prijestolnica zapadnog svijeta, kolijevka
  zapadne kulture, mjesto ro\u0111enja demokracije i jedan od najzna\u010dajnijih
  gradova za \u010dovje\u010danstvo uop\u0107e.\\nPogledajte na\u0161u posebnu ponudu
  za letove za Atenu i kupite svoju avio kartu ovdje.\\nZnamenitosti\\n- Akropola
  - kompleks koji sadr\u017eava: hram bo\u017eice pobjede Nike, monumentalne prilazne
  trijemove propileje, najpoznatiji svjetski hram Partenon, Eskulapovo sveti\u0161te,
  Dionizovo kazali\u0161te, rimsko kazali\u0161te Heroda Atika\\n- Agora - tr\u017enica
  i sredi\u0161te anti\u010dke Atene. Unutar Agore nalazi se Hephaisteion, jedan od
  najbolje o\u010duvanih hramova iz doba anti\u010dke Gr\u010dke.\\n- ostaci hrama
  Olimpa, posve\u0107enog Zeusu, Kerameiskos - groblje starih Atenjana, brdo Areopaga
  na kojemu je bila sudnica za ubojstva, podru\u010dje Ilisa - lokalitet mnogih gr\u010dkih
  i rimskih gra\u0111evina, Erehtejon - hram Atene, Posejdona i prvih atenskih kraljeva,
  Panatenski put, Lizikratov spomenik, Asklepijevo sveti\u0161te, Demetrino sveti\u0161te,
  Stadion Panathinaiko.\\n- Plaka - najstarija \u010detvrt grada s mnogobrojnim tavernama,
  tradicionalnim gr\u010dkim restoranima, no\u0107nim klubovima, kafi\u0107ima, trgovinama,
  suvenirnicama i znamenitostima poput Trga Monastiraki, Nacionalnih vrtova, Bizantskog
  muzeja i muzeja Benaki\\nKultura, znanost i umjetnost\\n- Akropolski muzej (Mouse\u00edo
  Akr\u00f3polis), Nacionalni arheolo\u0161ki muzej (Ethnik\u00f3 Archaiologik\u00f3
  Mouseio) - jedan je od najva\u017enih svjetskih muzeja, Muzej Benaki (Mouseio Benaki),
  Muzej gr\u010dkih glazbala (Mouse\u00edo Ellinik\u00f3n Mousikon Org\u00e1non),
  Muzej narodne umjetnosti (Mouse\u00edo Ellinikis Laikis Technis), Bizantski muzej
  (Vizantino Mouseio), Muzej Agore (Museo tis Agoras)\\n- Akademija, jedna od prvih
  organiziranih \u0161kola u povijesti na\u0161e civilizacije, prvi je dio neoklasicisti\u010dke
  trilogije u Ateni, a osnovao ju je gr\u010dki filozof Platon 387. godine pr. Kr.\\n-
  Moderno sveu\u010dili\u0161te, drugi dio neoklasicisti\u010dke trilogije, utemeljeno
  je 1837. g.\\nNarodna knji\u017enica, tre\u0107i je dio neoklasicisti\u010dke trilogije
  u Ateni\\nGastronomija\\n- Karakteristi\u010dni sastojci: sir feta, maslinovo ulje,
  za\u010dini\\nPredjela:\\n- bourekakia\\n-\\nmale mesne pite\\n-\\ntiganita\\n-\\nrazli\u010dite
  vrste povr\u0107a poput tikvica ili patlid\u017eana, pohane\\n-\\ndolmade - sarmice
  od vinove loze punjene ri\u017eom i drugim povr\u0107em\\n-\\nhoriatiki - salata
  s maslinama, feta sirom, povr\u0107em i klasi\u010dnim dresingom na bazi maslinova
  ulja\\n- tzatziki - umak od jogurta s dodatkom krastavaca i \u010de\u0161njaka\\n-\\ntiropita
  - slana pita sa sirom\\n- spanakopita - slana pita sa \u0161pinatom koja se poslu\u017euje
  i u fast food verziji\\nGlavna jela:\\n-\\nmusaka - zape\u010deni slo\u017eenac
  od mesa, krumpira i povr\u0107a\\n-\\npastisio - tjestenina s mljevenim mesom i
  be\u0161amelom\\n-\\nkeftedes - \u0107ufte, frikase - janjetina u slo\u017eencu
  s celerom i povr\u0107em\\n-\\nsouvlaki - janjetina nasjeckana na kockice i pripremljena
  na ro\u0161tilju, koja se jede s tzatzikijem, kruhom i povr\u0107em\\n-\\ngyros
  - janjetina na okomitom ra\u017enju, poslu\u017euje se s umacima, a sve \u010de\u0161\u0107e
  kao fast food\\nDeserti:\\n- baklava\\n-\\nkoufeta - u\u0161e\u0107ereni bademi\\n-\\nloukumades
  - pr\u017eeno tijesto natopljeno medom i cimetom\\n-\\nkoulourakia - slatki\u0161i
  na bazi maslinovog ulja\\n-\\nkourabiedes - uskrsni kola\u010di\u0107i s bademima,
  posuti \u0161\u0107erom u prahu\\n-\\nvasilopita - pe\u010de se za Novu godinu\\nAlkoholna
  pi\u0107a:\\n-\\nuzo - rakija za\u010dinjena anisom, a ima 80 posto alkohola\\n-\\ntsipouro
  - rakija s jo\u0161 ve\u0107im udjelom alkohola\\n-\\nmetaksa - pi\u0107e sli\u010dno
  brendiju, naj\u010de\u0161\u0107e s udjelom alkohola od 40 posto\\n-\\ngr\u010dka
  vina - opora jer nekim se sortama dodaje borova smola\\nShopping\\n-\\nErmou - ulica
  u pje\u0161a\u010dkoj zoni, neposredno pokraj trga Syntagma, najfrekventnija shopping
  zona, nudi velik izbor cipela, odje\u0107e, suvenira i modnih dodataka\\n- Kolon\u00e1ki
  - \u010detvrt s najboljom ponudom trgovina nakitom, od poznatih me\u0111unarodnih
  marki poput Bvlgarija i gr\u010dkih dizajnera poput Elene Votsi do ljupkih trgovina
  zlatnoga i srebrnog nakita u duhu gr\u010dke tradicije. U ovoj \u010detvrti mo\u017eete
  na\u0107i kvalitetnu robu, keramiku, ko\u017enu galanteriju i alkoholna pi\u0107a.\\n-\\nUlica
  Mitropoleos - odlikuje se najbogatijom ponudom suvenira i nakita\\n-\\nPlaka - \u010detvrt
  poznata po suvenirnicama i trgovinama u kojima se mogu na\u0107i ru\u010dno pleteni
  sagovi - flokate, d\u017eezve, djevi\u010dansko maslinovo uje i med, a sve je otvoreno
  cijeli dan, \u010dak i nedjeljom\\n-\\nMonastir\u00e1ki - \u010detvrt pokraj Plake,
  u kojoj se mo\u017ee prona\u0107i sve: od starih knjiga do kopija dizajnerskih nao\u010dala
  i starih nov\u010di\u0107a\\n-\\nEleftheroudakis na Panepistimiouu - najbolja knji\u017eara
  u gradu s velikim izborom beletristike na engleskom jeziku\\n-\\nNedjeljom je otvoren
  i buvljak, od 8 do 14 sati, a na Agori, centralnoj tr\u017enici u blizini trga Omonia,
  nudi se svje\u017ee meso, riba, vo\u0107e i povr\u0107e, a radi od ranog jutra do
  nave\u010der\\nZabava\\n- blagdan svetog Bazilija, prvi dan nove godine - veliko
  atensko slavlje povodom kojega Grci daruju svoje voljene\\n-\\nThissio, Kolonaki
  - popularne \u010detvrti s mondenim barovima i kafi\u0107ima\\n-\\nTrg Exarchia
  - najpoznatiji lokali s tradicionalnom buzuki ili rembetika\\nNo\u0107ni \u017eivot\\n-\\n\u010detvrti
  Syntagma i Psirri u sredi\u0161tu Atene te \u010detvrti Kifissia, Glyfada, Vouliagm\u00e9ni,
  Voula i Varkiza u predgra\u0111u bogate su no\u0107nim klubovima i barovima, u kojima
  se slu\u0161a popularna me\u0111unarodna glazba. Barovi su otvoreni do 4, a no\u0107ni
  klubovi do 4 ili 6 sati. Alkoholna pi\u0107a poslu\u017euju se osobama starijima
  od 18 godina.\\nSport\\n-\\nnogometni klubovi Olympiacos, Panathinaikos i AEK Atena\\n-\\nko\u0161arka\u0161ki
  klubovi Olympiacos i Panathinaikos\\n-\\nOlimpijski sportski kompleks \\\"Spiros
  Louis\\\" ili OAKA - sportski kompleks, doma\u0107in mnogih \u0161portskih doga\u0111aja
  poput Mediteranskih igara 1991., Svjetskog prvenstva u atletici 1997. i Olimpijskih
  igara 2004. godine.\\n-\\nOlimpijska dvorana - sagra\u0111ena 1995. i kori\u0161tena
  za potrebe sportskih natjecanja za Olimpijskih igara 2004. godine\\n-\\nOlimpijski
  vodeni centar - sagra\u0111en je 1991. za potrebe Mediteranskih igara; dva vanjska
  bazena i jedan unutra\u0161nji\\nSlobodno vrijeme\\n-\\nNacionalni vrtovi - prekrasna
  zelena oaza u milijunskom gradu s mno\u0161tvom klupica, mjesta za piknik, ljupkih
  kafi\u0107a, jezeraca s patkama i malenim zoolo\u0161kim vrtom\\n-\\nBrdo Filopappos
  - povijesno zna\u010dajan park s lijepim pogledom na Akropolu\\n-\\nZabavni park
  - igre, kinodvorane, trgovine, restorani, park\\nPrijevoz\\nJavni gradski prijevoz:\\n-\\nJavni
  je prijevoz jeftin i pokriva veliku povr\u0161inu grada, a dnevne karte ili mjese\u010dna
  propusnica za cijelu gradsku mre\u017eu mogu se kupiti na autobusnim terminalima
  i uli\u010dnim kioscima. Plavo-bijeli autobusi voze svaki dan i no\u0107u na duljim
  linijama. U najposje\u0107enijim dijelovima grada postoji nekoliko ruta \u017eutih
  trolejbusa. Linija 1 podzemne i nadzemne \u017eeljeznica vozi sa sjevera prema jugu
  povezuju\u0107i predgra\u0111e Kifissia i luku Pirej. Linija 2 vozi od Agios Antoniosa
  do Agios Dimitriosa, a linija 3 od \u010detvrti Monastiraki do zra\u010dne luke
  Eleftherios Venizelos. Postoje i dodatne tri linije koje povezuju sredi\u0161te
  grada s obalom: jedna vozi od \u010detvrti Syntagma do Neo Falira, druga od \u010detvrti
  Syntagma do \u010detvrti Glyfada, a tre\u0107a od Neo Falira do Glyfade. Sve informacije
  o javnom prijevozu mo\u017eete pogledati ovdje.\\n-\\nRadiotaksi mo\u017eete rezervirati
  telefonski, a postoji nekoliko poduze\u0107a, npr. Athina 1, Ermis, Hellas, Ikaros.
  Slu\u017ebena taksi vozila \u017eute su boje, registarske su plo\u010dice bijele
  s crvenim brojevima, a mo\u017eete ih zaustaviti na ulici. Taksi usluge u Ateni
  jeftinije su od svih u ostalim europskim metropolama.\\nVeza zra\u010dna luka -
  grad:\\n- Me\u0111unarodna zra\u010dna luka Eleftherios Venizelos udaljena je 27
  km od grada: tri autobusne linije prevoze putnike od zra\u010dne luke do grada ili
  natrag. Vo\u017enja stoji oko 4 eura i vrijedi 24 sata za javni prijevoz (autobus,
  trolejbus, metro). Do grada mo\u017eete i turisti\u010dkim autobusom, limuzinom
  ili taksijem.\"", "\"Kori\u0161tenje More krkavine vo\u0107a varira: oni su jeli
  svje\u017ee, su\u0161ene, mraz, u\u010diniti ih vo\u0107ni napitci, d\u017eem i
  vino. Na mora krkavine ima rijetku zna\u010dajku: zbog izostanka oksidacijskog enzima
  vitamina C u njoj nije uni\u0161ten grijanje. No, ova zna\u010dajka vrijedi samo
  za vitaminom C, a drugi, na \u017ealost, ne vrijedi. Tako se tradicionalno \u0161tede
  preporu\u010diti dokazane metode berbe, jer bobica \u010duvati u hladnjaku nekoliko
  dana.\\nSvezhesobrannuyu, krkavine netaknut, mjesto u plasti\u010dnu vre\u0107icu
  i zamrznite.\\nNa temperaturi od 10-15 \u00b0 C, ostaje Pa 12 mjeseci, gotovo bez
  gubitka okusa i prehrambene kvalitete. Polo\u017eite oguljene vo\u0107e na podlo\u0161ku
  Electrica i suha na temperaturama iznad 60 \u00b0 C do to\u010dke u kojoj vi\u0161e
  ne lijepi za ruke. Spremni krkavine prevesti u staklenku s poklopcem i uskoj \u010cuvati
  na suhom i tamnom mjestu na sobnoj temperaturi.\\nUz more krkavine vo\u0107a pulpe
  mo\u017ee biti pravi multivitaminski koncentrat - masna ulja koja sadr\u017ei karoten
  i karotenoidi, askorbinsku kiselinu, vitamin E i druge ulje poma\u017ee lije\u010diti
  rane, opekline, smrzotine i \u010direva. Lije\u010di korisna svojstva i o\u0161te\u0107enja
  tkiva zra\u010denjem, koji se koristi u praksi, ginekolo\u0161ki pretilosti, \u044dndotservitsytah,
  vrata maternice erozija. Uklanjanje ulcerativnih lezije rektuma, unutarnje hemoroide,
  analne fisure, i ono \u0161to je dio svije\u0107a. To se koristi za bolesti sluznice
  usne \u0161upljine, i parodontnih bolesti di\u0161nih puteva. I mora krkavine ulje
  s blagotvornim svojstvima koriste u kozmetici za suhu i starenje ko\u017ee (za to
  svaki put dodaju\u0107i da kreme nekoliko kapi ulja), pobolj\u0161ava strukturu
  kose i poma\u017ee kod lomljive nokte. I u tu svrhu mo\u017ee se primijeniti lokalno,
  kao i oralno.\\nKrkavine preuzeti i stisnuti sokovnik ili morta. Sok nije potrebno,
  mo\u017ee sa\u010duvati ili popuniti \u0161e\u0107er u omjeru 1:15. Ono \u0161to
  je preostalo nakon uklanjanja puno soka ili suhog elektrosushartsi pe\u0107nici
  na 50-60 \u00b0 C onda ga samljeti sa mljevenje i prelijte profinjenu suncokret
  ili maslinovo ulje u omjeru 1:15 (po te\u017eini). Inzistirati na sobnoj temperaturi
  za 3 tjedna, povremeno mije\u0161aju\u0107i. Zatim lagano ulijte teku\u0107i dio
  tamne boce. Sve ljekovite nafte je spreman!\\nPreuzeti i \u010di\u0161\u0107enje
  bobice su vrijedne korisna svojstva, ocijedite ih s korisnim svojstvima za sok.
  Uz 4 kg vo\u0107a van oko 3 litre soka. Da bi se smanjila kiselost, razrijedite
  ga na pola s kuhanim vodom, instalaciju vode vrata i ostaviti da fermentira. Nakon
  fermentacije ulijte vino u boce, zakuporte i mjesto na hladnom mjestu. Stand tijekom
  godine - Vino ima zlatnu boju, svjetlo ananasa miris i slatko-kiselog okusa.\"",
  "\"Resecurity, istaknuti globalni pru\u017eatelj rje\u0161enja za kiberneti\u010dku
  sigurnost, lansirao je inovativno rje\u0161enje za za\u0161titu identiteta ekskluzivno
  dizajnirano za filipinsko tr\u017ei\u0161te. S naglaskom na uskla\u0111enost sa
  Zakonom o privatnosti podataka (\u201cDPA\u201d), ovo revolucionarno rje\u0161enje
  namijenjeno je promjeni digitalnog krajolika na Filipinima osiguravaju\u0107i identitete
  pojedinaca od curenja nacionalnih identifikacija, podataka o ra\u010dunima, lozinki
  i ostalih osobnih informacija dostupnih na internetu.\\nUz rastu\u0107i broj kiberneti\u010dkih
  prijetnji i intenziviranje vala digitalizacije, Filipini igraju klju\u010dnu ulogu
  u Indo-pacifi\u010dkoj regiji. Me\u0111utim, ova digitalna transformacija neizbje\u017eno
  je u\u010dinila pojedince i tvrtke podlo\u017enima \u0161irokom nizu kiberneti\u010dkih
  rizika poput aktivnosti Tamne mre\u017ee, izlo\u017eenosti osobno prepoznatljivih
  informacija (PII) i preuzimanja ra\u010duna. Napredno rje\u0161enje tvrtke Resecurity,
  prvo takve vrste u regiji, nudi neusporedivu za\u0161titu od ovih digitalnih prijetnji.\\nFilipini
  su do\u017eivjeli brz rast internet penetracije i mobilne povezivosti, poti\u010du\u0107i
  svoju digitalnu evoluciju. Na\u017ealost, ovaj napredak tako\u0111er je u\u010dinio
  zemlju privla\u010dnom metom za kiberneti\u010dke napade i povrede podataka. Kroll,
  vode\u0107a financijska i savjetodavna tvrtka, svrstala je Filipine me\u0111u najranjivije
  zemlje u regiji, isti\u010du\u0107i hitnu potrebu za poja\u010danim kiberneti\u010dkim
  mjerama.\\nBen Ouano, COO tvrtke Resecurity (APAC), istaknuo je va\u017enost prilagodbe
  evoluiraju\u0107em kiberneti\u010dkom krajoliku na Filipinima. Rekao je da je misija
  Resecurity-ja opremiti pojedince i tvrtke potrebnim alatima i resursima kako bi
  za\u0161titili svoje digitalne identitete i umanjili rastu\u0107e prijetnje. Resecurity
  ostaje predan osna\u017eivanju zajednice da se za\u0161tite od kra\u0111e identiteta,
  prijevara i raznih drugih kiberneti\u010dkih prijetnji koje predstavljaju zna\u010dajan
  rizik za njihovu online sigurnost.\\nMalware, ransomware, phishing napadi i povrede
  podataka postali su zabrinjavaju\u0107i problemi za pojedince i tvrtke diljem razli\u010ditih
  sektora na Filipinima. Ovi kiberneti\u010dki incidenti mogu rezultirati ozbiljnim
  posljedicama poput financijskih gubitaka, kra\u0111e podataka, poreme\u0107aja u
  poslovanju i zna\u010dajnih ekonomskih \u0161teta.\\nResecurity-ove usluge za za\u0161titu
  identiteta sada su lako dostupne na Filipinima, nude\u0107i proaktivnu kiberneti\u010dku
  za\u0161titu pojedincima i tvrtkama koje tra\u017ee sna\u017enu obranu protiv suvremenih
  kiberneti\u010dkih prijetnji.\\nZa vi\u0161e informacija o Resecurity-ovim uslugama
  za za\u0161titu identiteta i kako oja\u010dati svoj digitalni identitet, posjetite
  [Resecurity-ovu web stranicu](https://www.resecurity.com/idp).\\nO Resecurity-u:\\nResecurity
  je vode\u0107a kiberneti\u010dka tvrtka koja nudi sveobuhvatan platformu za za\u0161titu
  krajnjih to\u010daka, upravljanje rizicima i kiberneti\u010dko obavje\u0161tajno
  djelovanje. Poznat po svojim progresivnim rje\u0161enjima temeljenim na podacima,
  Resecurity se fokusira na pravovremeno otkrivanje povreda podataka i sveobuhvatnu
  za\u0161titu od kiberneti\u010dkih rizika. Osnovan 2016. godine, tvrtka je stekla
  globalno priznanje kao jedna od najinovativnijih kiberneti\u010dkih tvrtki s misijom
  borbe protiv kiberneti\u010dkih prijetnji bilo koje razine sofisticiranosti. Inc.
  Magazine nedavno je priznao Resecurity kao jednu od deset najbr\u017ee rastu\u0107ih
  privatnih kiberneti\u010dkih tvrtki u Los Angelesu, Kalifornija. Resecurity s ponosom
  sura\u0111uje s uglednim organizacijama, uklju\u010duju\u0107i Svjetski ekonomski
  forum, InfraGard Nacionalno udru\u017eenje \u010dlanova, AFCEA, NDIA, SIA, FS-ISAC
  i razli\u010dite Ameri\u010dke industrijske i trgovinske komore. Za vi\u0161e informacija
  o Resecurity-u, molimo posjetite njihovu [slu\u017ebenu web stranicu](https://resecurity.com).\\nResecurity-ovo
  predstavljanje inovativnog rje\u0161enja za za\u0161titu identiteta za filipinsko
