  09:00\u6377\u904b\u5927\u6e56\u516c\u5712\u7ad9\u2192\u5927\u6e56\u5c71\u838a\u2192\u5927\u6e9d\u6eaa\u89aa\u6c34\u6b65\u9053\u219209:56\u8449\u6c0f\u7956\u5edf\u2192\u5713\u89ba\u6b65\u9053\u219211:53\u5713\u89ba\u5bfa\u219212:13\u78a7\u5c71\u5dd6\u2192\u5c0f2\u516c\u8eca\u81f3\u78a7\u6e56\u570b\u5c0f\u2192\u798f\u4f86\u4f2f\u501f\u9322\u9b5a\u4e38\u5e97\u219213:30\u7d50\u675f\u805a\u6a02\u3002\u2193\u8def\u53e3\u77f3\u7891\u5e36\u7da0\u610f
  \u6709\u5225\u5c71\u838a\u5bcc\u8cb4\u6c23\u8ab0\u8aaa\u9678\u5730\u884c\u821f\u96e3\u5275\u610f\u9020\u578b\u8b93\u4f60\u770b\u6377\u904b\u5927\u6e56\u516c\u5712\u7ad9\u5f77\u5f7f\u5169\u8258\u5927\u5e06\u8239
