  \u53ef\u73fe\u5834\u5e76\u806f\u914d\u7f6e \u53ef\u914d\u7f6e\u591a\u500b\u88dd\u7f6e\u7528\u4e8e\u591a\u76f8\u4f4d\u64cd\u4f5cElgar
  CW\u9023\u7e8c\u6ce2\u7cbe\u5bc6\u4ea4\u6d41\u96fb\u6e90\u5177\u6709\u975e\u5e38\u597d\u7684\u6027\u50f9\u6bd4\uff0c\u5e76\u53ef\u63d0\u4f9b\u6e05\u6f54\u7684\u55ae\u76f8\u96fb\u6e90\u3002Elgar
  CW\u9023\u7e8c\u6ce2\u7cbe\u5bc6\u4ea4\u6d41\u96fb\u6e90\u6709\u5169\u500b\u7cfb\u5217\uff1a\u624b\u52d5(\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403CW-M)\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90\u6216\u53ef\u7de8\u7a0b(CW-P)\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90(\u5177\u6709\u6a19\u6e96\u7684IEEE-488.2\u53caRS-232\u63a7\u5236)\u3002\u5169\u500b\u7cfb\u5217\u90fd\u6709\u4e09\u500b\u529f\u7387\u7d1a\uff1a800VA\u30011250VA\u53ca2500VA\u3002800VA\u53ca1250VA\u578b\u865f\u7684\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90\u9ad8\u5ea6\u90fd\u70ba2U\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u740338ccc,\u5929\u706b\u4f20\u8bf42(3.5\u82f1\u5bf8)\uff0c\u5e76\u4e14\u90fd\u53ef\u5c07\u88ab\u6e2c\u90e8\u4ef6\u9023\u63a5\u81f3\u5176\u524d\u9762\u677f\u6216\u540e\u9762\u677f\u30022500VA\u578b\u865f\u7684\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90\u9ad8\u5ea6\u70ba3U(5.25\u82f1\u5bf8)\uff0c\u5b83\u5e36\u6709\u540e\u9762\u677f\u8f38\u51fa\u9023\u63a5\u9ede\u3002\u6240\u6709\u578b\u865f\u90fd\u53ef\u4ee5\u81fa\u5f0f\u6216\u6a5f\u67b6\u5f0f\u914d\u7f6e\u904b\u884c\u3002\u524d\u9762\u677f\u4e0a\u6709\u5169\u500b\u660e\u4eae\u76844\u4f4d\u30017\u6bb5\u986f\u793a\u5c4f\u3002\u529f\u7387\u56e0\u6578\u6821\u6b63(P38cccFC)\u901a\u7528\u8f38\u5165\u96fb\u58d3\u5141\u8a31\u5f9e\u4ea4\u6d41\u63d2\u5ea7\u8f38\u9001\u6700\u5927\u529f\u7387\uff0c\u7121\u9700\u7528\u6236\u9078\u64c7\u8303\u570d\u3002\u572845Hz\u81f3500Hz\u7684\u6a19\u6e96\u983b\u7387\u8303\u570d\u5167\uff0c\u7121\u8ad6\u662f135
  VAC\u6216270 VAC\u7684\u8f38\u51fa\u96fb\u58d3\u8303\u570d\u90fd\u53ef\u4ee5\u8f38\u51fa\u6eff\u984d\u5b9a\u96fb\u6d41\u3002\u5169\u500b\u7cfb\u5217\u90fd\u53ef\u88ab\u5e76\u9023\u8d77\u4f86\u4ee5\u63d0\u4f9b\u66f4\u591a\u7684\u529f\u7387\u3002\u4e00\u500b\u55ae\u7368\u7684\u8f38\u51fa\u555f\u5929\u706b\u4f20\u8bf42\u7528\u958b\u95dc\u63a7\u5236\u8f38\u9001\u81f3\u8ca0\u8f09\u7684\u529f\u7387\u3002\u9060\u7a0b\u96fb\u58d3\u611f\u61c9\u662f\u6a19\u6e96\u7684\u914d\u7f6e\u3002\u8b8a\u58d3\u5668\u8026\u5408\u8f38\u51fa\u9632\u6b62\u904e\u58d3\u53ca\u904e\u6d41\u3002\u8a72\u88dd\u7f6e\u9084\u53ef\u9632\u6b62\u904e\u6eab\u60c5\u6cc1\u767c\u751f\u3002\u96d9\u901f\u98a8\u6247\u4f7f\u5728\u4f4e\u529f\u7387\u7d1a\u904b\u884c\u6642\u7684\u566a\u8072\u66f4\u4f4e\u3002\u6240\u6709\u7684\u578b\u865f\u90fd\u6709CE\u6a19\u5fd7\u3002Elgar
  CW\u9023\u7e8c\u6ce2\u7cbe\u5bc6\u4ea4\u6d41\u96fb\u6e90\u61c9\u7528\uff1a\u73fe\u5be6\u7684\u6b63\u5f26\u6ce2\u96fb\u6e90\u689d\u5929\u706b\u4f20\u8bf42,\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u740338ccc\u4ef6\uff08\u6539\u70ba\uff1a\u6a21\u64ec\u5be6\u969b\u96fb\u7db2\u4e2d\u6b63\u5f26\u6ce2\u5f62\u7684\u6e2c\u8a66\uff09400Hz\u822a\u7a7a\u96fb\u5b50\u8a2d\u5099\u6e2c\u8a6650/60Hz\u6975\u9650\u6e2c\u8a66\u93ae\u6d41\u5668\u6e2c\u8a66\u90e8\u4ef6\u6e2c\u8a66\u4ea4\u76f4\u6d41\u8b8a\u63db\u5668\u96fb\u6e90\u6e2c\u8a66\u624b\u52d5CW\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90\u529f\u80fd\u53ca\u512a\u9ede\u901a\u904e\u624b\u52d5\u7cfb\u5217\u7684\u524d\u9762\u677f\u65cb\u9215(10\u6a94\u4f4d\u96fb\u4f4d\u8a08)\u53ef\u5feb\u901f\u8abf\u7bc0\u96fb\u58d3\u3001\u96fb\u6d41\u53ca\u983b\u7387\u7684\u8a2d\u7f6e38ccc,\u5929\u706b\u4f20\u8bf42\u3002\u53ef\u901a\u904e\u4e00\u500b0\u81f35V\u7684\u6a21\u64ec\u4fe1\u865f\u5c0d\u983b\u7387\u53ca\u96fb\u58d3\u9032\u884c\u9060\u7a0b\u7de8\u7a0b\u8a2d\u7f6e\u3002\u767c\u5149\u4e8c\u6975\u7ba1\u6307\u793a\uff1a\u8f38\u51fa\u555f\u7528\u3001\u96fb\u58d3\u6216\u96fb\u6d41\u64cd\u4f5c\u6a21\u5f0f\u3001\u6545\u969c\u53ca\u5f9e\u6a5f\u6a21\u5f0f\u3002\u53ef\u7de8\u7a0bCW\u9023\u7e8c\u6ce2\u4ea4\u6d41\u96fb\u6e90\u529f\u80fd\u53ca\u512a\u9ede\u53ef\u901a\u904e\u524d\u9762\u677f\u7de8\u78bc\u5668\u65cb\u9215\u5c0d\u96fb\u58d3\u3001\u96fb\u6d41\u53ca\u983b\u7387\u9032\u884c\u7de8\u7a0b\u8a2d\u7f6e\u3002\u53ef\u901a\u904e\u6309\u9215\u9078\u64c7\u5728\u5169\u500b\u767c38ccc,\u5929\u706b\u4f20\u8bf42,\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\u5149\u4e8c\u6975\u7ba1\u986f\u793a\u5c4f\u4e0a\u67e5\u770b\u7de8\u7a0b\u8a2d\u5b9a\u503c\u6216\u6e2c\u91cf\u503c\u3002\u53ef\u901a\u904e\u83dc\u55ae\u6309\u9215\u8a2d\u7f6e\u7cfb\u7d71\u914d\u7f6e\uff0c\u5305\u62ec\u5e76\u806f\u904b\u884c\u6216\u4e09\u76f8\u904b\u884c\u3002\u9084\u53ef\u901a\u904e\u83dc\u55ae\u8a2d\u7f6e\u91c7\u7528\u96fb\u6d41\u95dc\u9589\u6a21\u5f0f\u9084\u662f\u6298\u8fd4\u6a21\u5f0f\u3002\u5177\u6709\u6a19\u6e96\u7684\u9060\u7a0bIEEE-488.2\u53caRS-232\u63a7\u5236\u63a5\u53e3\u3002\u767c\u5149\u4e8c\u6975\u7ba1\u6307\u793a\uff1a\u9ad8\u8303\u570d\u8f38\u51fa\u96fb\u58d3\u6216\u4f4e\u8303\u5929\u706b\u4f20\u8bf42,\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\u570d\u8f38\u51fa\u96fb\u58d3\u3001\u6e2c\u91cf\u6a21\u5f0f\u6216\u7de8\u7a0b\u6a21\u5f0f\u3001\u96fb\u58d3\u6a21\u5f0f\u904b\u884c\u6216\u96fb\u6d41\u6a21\u5f0f\u904b\u884c\u53ca\u8f38\u51fa\u555f\u7528\u3002\u767c\u5149\u4e8c\u6975\u7ba1\u6307\u793a\u83dc\u55ae/\u72c0\u614b\u3001\u9060\u7a0b\u63a7\u5236\u3001\u9396\u5b9a\u53ca\u6545\u969c\u72c0\u614b\u3002\u57fa\u4e8e\u6578\u5b57\u4fe1\u865f\u8655\u7406(DSP)\u7684\u6e2c\u91cf\u5305\u62ec\u96fb\u58d3\u3001\u96fb\u6d41(\u96fb\u6d41\u3001\u5cf0\u503c\u96fb\u6d41\u3001\u5cf0\u503c\u56e0\u6578)\u3001\u529f\u7387(W\u3001VA\u53ca\u529f\u7387\u56e0\u6578)\u53ca\u983b\u7387\u3002\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\\n\u798f\u5efa\u96fb\u5b50\u6c7d\u8eca\u8861\uff0c100\u5678\u96fb\u5b50\u6c7d\u8eca\u8861\u96fb\u5b50\u6c7d\u8eca\u8861\u4ecb\u7d39\uff1a\u96fb\u5b50\u6c7d\u8eca\u8861\u7684\u50f9\u683c\uff1a\u662f\u7531\u96fb\u5b50\u5730\u78c5\u7684\u5bec\u5ea6\u3001\u9577\u5ea6\u548c\u5678\u4f4d\u6c7a\u5b9a\u7684\uff0c\u4e00\u822c\u662f\u9577\u5ea6\u8d8a\u9577\uff0c\u96fb\u5b50\u5730\u78c5\u7684\u50f9\u683c\u8d8a\u9ad8\uff1a\u96fb\u5b50\u6c7d\u8eca\u8861\u5168\u92fc\u7d50\u69cb\uff08\u50f9\u683c\u504f\u9ad8\uff09\u96fb\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\u5b50\u5730\u78c5\u5728\u5168\u92fc\u7d50\u69cb\u5730\u78c5\u4e2d\u50f9\u683c\u6bd4\u8f03\u6709\u512a\u52e2\uff0c100\u5678\u7684\u5730\u78c53\u7c73\u5bec\uff0c16\u7c73\u9577\uff0c\u57286\u842c3\u5de6\u53f3\uff0c\u5168\u5305\u50f9\u683c\u3002\u627f\u91cd\u50b3\u529b\u6a5f\u69cb:\u5c07\u7269\u9ad4\u7684\u91cd\u91cf\u50b3\u905e\u7d66\u7a31\u91cd\u50b3\u611f\u5668\u7684\u6a5f\u68b0\u5e73\u81fa\uff0c\u5e38\u898b\u6709\u92fc\u7d50\u69cb\u53ca\u92fc\u6df7\u7d50\u69cb\u4e8c\u7a2e\u578b\u5f0f\u3002\u96fb\u5b50\u6c7d\u8eca\u8861\u9ad8\u7cbe\u5ea6\u7a31\u91cd\u50b3\u611f\u5668:\u662f\u96fb\u5b50\u5730\u78c5\u7684\u6838\u5fc3\u90e8\u4ef6\uff0c\u8d77\u845738ccc,\u5929\u706b\u4f20\u8bf42,\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\u4e3b\u8981\u4f5c\u7528\uff0c\u53ef\u4ee5\u8457\u5c07\u91cd\u91cf\u503c\u8f49\u63db\u6210\u5c0d\u61c9\u7684\u53ef\u6e2c\u96fb\u4fe1\u865f\u7684\u4f5c\u7528\uff0c\u5b83\u7684\u512a\u52a3\u6027\u76f4\u63a5\u95dc\u7cfb\u5230\u6574\u81fa\u8861\u5668\u7684\u54c1\u8cea\u3002\u7a31\u91cd\u986f\u793a\u5100:\u7528\u4e8e\u6e2c\u91cf\u50b3\u611f\u5668\u50b3\u8f38\u7684\u96fb\u4fe1\u865f\uff0c\u518d\u901a\u904e\u5c08\u7528\u8edf\u4ef6\u8655\u7406\u986f\u793a\u91cd\u91cf\u8b80\u6578\uff0c\u5e76\u53ef\u5c07\u6578\u64da\u9032\u6b65\u50b3\u905e\u81f3\u6253\u5370\u6a5f\u3001\u5927\u5c4f\u5e55\u986f\u793a\u5668\u3001\u96fb\u8166\u7ba1\u7406\u7cfb\u7d71\u3002\u914d\u4ef6\u7684\u9078\u64c7\u6253\u5370\u6a5f\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u740338ccc,\u5929\u706b\u4f20\u8bf42\uff1a\u7528\u4e8e\u6253\u5370\u91cd\u91cf\u6578\u64da\u8868\u55ae\u5927\u5c4f\u5e55\uff1a\u53ef\u4ee5\u7528\u4e8e\u9060\u8ddd\u96e2\u7684\u8b80\u6578\u96fb\u8166\u7ba1\u7406\u7cfb\u7d71\uff1a\u7528\u4e8e\u91cd\u91cf\u6578\u64da\u7684\u9032\u4e00\u6b65\u8655\u7406\u3001\u5132\u5b58\u3001\u50b3\u8f38\u7b49\u3002\u96fb\u5b50\u6c7d\u8eca\u8861\u5176\u8a2d\u8a08\u7279\u9ede\uff1a1\u3001\u6a21\u584a\u5316\uff1a\u505a\u62105m\uff0f6m\uff0f7m\u4e09\u7a2e\u6a21\u584a\uff0c\u7528\u6236\u53ef\u4ee5\u6839\u64da\u81fa\u9762\u5c3a\u5bf8\u4e0d\u540c\u53ef\u96a8\u610f\u7d44\u5408\uff0c\u4fdd\u8b49\u7522\u54c1\u7684\u4e00\u81f4\u6027\uff0c\u66f4\u6613\u4e8e\u751f\u7522\u7d44\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403\u7e54\u53ca\u73fe\u5834\u5b89\u88dd\u8abf\u8a66\u30022\u3001\u5728\u69cb\u4ef6\u5f62\u72c0\u4e2d\uff0c\u6a6b\u622a\u9762\u4e2d\u5e45\u677f\uff08\u7acb\u7b4b\u677f\uff09\u548c\u7e31\u5411\u622a\u9762\u4e2d\u652f\u9ede\u8de8\u8ddd\u5c0d\u525b\u6027\u5f71\u97ff\u6700\u5927\u3002\u9452\u4e8e\u6b64\uff0c\u672c\u516c\u53f8\u6bcf\u7bc0\u79e4\u81faU\u578b\u4e3b\u68815\uff5e7\u6839\uff08\u6839\u64da\u5678\u4f4d\u53ca\u81fa\u9762\u5c3a\u5bf8\u4e0d\u540c\u8a2d\u8a08\uff09\uff0c\u5f9e\u800c\u4fdd\u8b49\u79e4\u81fa\u6574\u9ad4\u7684\u525b\u6027\u30023\u3001\u516c\u53f8\u5f15\u9032\u5c08\u7528U\u578b\u6881\u6210\u578b\u8a2d\u5099\uff0c\u91c7\u7528U\u578b\u622a\u9762\u7d44\u5c0f\u6258\u9a6c\u65af\u5341\u4f73\u7403,38ccc,\u5929\u706b\u4f20\u8bf42\u710a\uff08\u7b2c\u56db\u4ee3\uff09\uff0c\u69cb\u4ef6\u7531\u5c08\u7528\u8a2d\u5099\u5236\u9020\uff0c\u6574\u9ad4\u7d50\u69cb\u597d\uff0c\u525b\u6027\u9ad8\uff0c\u9019\u5c31\u662f\u79e4\u81fa\u525b\u5ea6\u66f4\u5f37\u7684\u539f\u56e0\u3002\u79e4\u81fa\u5167\u8154\u5168\u5bc6\u5c01\uff0c\u4e0d\u6613\u751f\u92b9\u3002\u92fc\u677f\u7d93\u62cb\u4e38\u9664\u92b9\u8655\u7406\u540e\uff0c\u91c7\u7528\u74b0\u6c27\u5bcc\u92c5\u5e95\u6f06\u548c\u4e19\u7a00\u9178\u8239\u7528\u6f06\uff0c\u6cb9\u819c\u539a\u5be6\uff0c\u539a\u5ea6\u5747\u70ba100\u5fae\u7c73\uff0c\u8010\u78e8\u3001\u8010\u58d3\u3001\u8010\u9178\u3001\u8010\u583f\uff0c\u9632\u8150\u80fd\u529b\u66f4\u5f37\u3002\u798f\u5efa\u96fb38ccc,\u5929\u706b\u4f20\u8bf42\u5b50\u6c7d\u8eca\u8861\uff0c100\u5678\u96fb\u5b50\u6c7d\u8eca\u8861\u798f\u5efa\u96fb\u5b50\u6c7d\u8eca\u8861\uff0c100\u5678\u96fb\u5b50\u6c7d\u8eca\u8861\u4fdd\u4fee\u8aaa\u660e\uff1a\u514d\u8cbb\u4fdd\u4fee\u6642\u9593\uff1a\u53ea\u8981\u662f\u5c6c\u4e8e\u4e0a\u6d77\u6052\u525b\u516c\u53f8\u7684\u7522\u54c1\uff0c\u7522\u54c1\u8cea\u91cf\u539f\u56e0\u6240\u767c\u751f\u7684\u7522\u54c1\u4e4b\u6545\u969c\uff0c\u5747\u81ea\u8cfc\u8cb7\u4e4b\u65e5\u8d77\u6191\u4fdd\u4fee\u55ae\u4fdd\u4fee\u4e00\u5e74\u3002\u53ea\u8981\u8d85\u51fa\u4e00\u5e74\u7684\uff0c\u5747\u6309\u6536\u8cbb\u670d\u52d9\uff0c\u4f9d\u6545\u969c\u72c0\u6cc1\u914c\u60c5\u6536\u53d6\u96f6\u4ef6\u300138ccc,\u5929\u706b\u4f20\u8bf42\u7dad\u4fee\u3001\u6821\u6e96\u7b49\u8cbb\u7528\u3002\u7522\u54c1\u4f7f\u7528\u904e\u4e94\u5e74\u767c\u751f\u6545\u969c\u7684\u6642\u4faf\