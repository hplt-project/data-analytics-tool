  \u9b5a\u9f8d\u66fc\u884d \u5c55\u793a-p2\\n\u5c0f\u8aaa\u2013\u4f0f\u5929\u6c0f\u2013\u4f0f\u5929\u6c0f\\n\u5927\u8c37
  \u5929\u4f7f\\n\u7b2c2335\u7ae0 \u4e0d\u59a5\u534f \u8a00\u4e4b\u6709\u5e8f \u5c3a\u8816\u6c42\u4f38\\n\u5f8c\u55e3\u5c0a\u795e\u4e4b\u4eba\u4e26\u975e\u5c0d\u670b\u53cb\u72e0\uff0c\u9084\u8981\u5c0d\u53cb\u597d\u72e0\u3002\\n\u62a8\u64ca\u589c\u5165\u7684\u90a3\u500f\u5730\uff0c\u4f3c\u5eb7\u838a\u5927\u9053\u90fd\u8981\u6f70\uff0c\u78d0\u77f3\u6230\u9663\u70c8\u70c8\u7684\u632f\u64bc\u7740\uff0c\u6620\u73fe\u4e86\u806f\u624b\u9053\u4e0d\u548c\uff0c\u90a3\u5e45\u53e4\u795e\u822c\u7684\u865b\u5f71\u4f3c\u4e4e\u8981\u7834\u721b\u822c\u3002\\n\u4eca\u65e5\u76e4\u77f3\u6230\u9663\u8f49\u79fb\uff0c\u6bd4\u524d\u66f4\u5f37\uff0c\u8449\u4f0f\u5929\u7adf\u81ea\u4e0d\u52d5\uff0c\u4ed6\u4e0b\u6587\u6709\u4ed8\u4e4b\u6771\u6d41\u7834\u9663\u7684\u8fa6\u6cd5\uff1f\\n\u201c\u65e2\u8af8\u4f4d\u56de\u7d55\u6536\u624b\uff0c\u8449\u7687\u4fbf\u4e5f\u6bcb\u5eb8\u52f8\u8aaa\u4e86\u3002\u201d\u90a3\u82d7\u88d4\u8001\u7fc1\u958b\u8154\u8b1b\u3002\\n\u8aaa\u7f77\uff0c\u4ed6\u770b\u5411\u5b50\u55e3\u7684\u4fee\u9053\u4e4b\u4eba\uff0c\u9053\uff1a\u201c\u80c4\u9019\u5152\uff0c\u53ef\u80fd\u4e5f\u6c7a\u4e0d\u6703\u6709\u4f55\u5b9a\u898b\u5427\uff1f\u201d\\n\u81ea\u7136\u66f4\u751f\u6b7b\u6538\u95dc\u7684\u662f\uff0c\u5f8c\u4ee3\u7684\u8239\u5805\u70ae\u5229\uff0c\u8b93\u4ed6\u5006\u66f4\u60f3\u8981\u53bb\u88e1\u7743\u3002\\n\u81ea\u7136\u66f4\u975e\u540c\u5152\u6232\u7684\u662f\uff0c\u5b50\u5b6b\u7684\u7cbe\uff0c\u8b93\u4ed6\u5006\u66f4\u60f3\u8981\u53bb\u5176\u4e2d\u76ee\u3002\\n\u83ef\u541b\u4f86\u901a\u5f80\u5916\u5708\u770b\u4e86\u4e00\u773c\uff0c\u5c31\u9053\uff1a\u201c\u5ef6\u7e8c\u5427\u3002\u201d\\n\u201c\u9663\u9053\u4e0d\u7834\uff0c\u7109\u80fd\u6536\u6524\u5152\u3002\u201d\u53ea\u807d\u83ef\u541b\u4f86\u767c\u8a71\u63d0\uff0c\u7c21\u660e\u9084\u8981\u505c\u6b62\u4fdd\u885b\uff0c\u76f4\u81f3\u7c89\u788e\u6b64\u9663\u3002\\n\u65e2\u662f\u5b50\u5b6b\u60f3\u8981\u6230\uff0c\u90a3\uff0c\u5979\u5011\u672c\u4f86\u6703\u7389\u6210\uff0c\u7e31\u662f\u66f4\u52d5\u7684\u78d0\u77f3\u6230\u9663\u53c8\u4f55\u4ee5\uff0c\u5979\u5011\u5bf6\u77f3\u6703\u5c07\u4e4b\u8001\u7c97\u78d5\u4f86\uff0c\u96d6\u7136\u5f8c\u751f\u7684\u6545\u4e8b\u4e5f\u8b93\u4ed6\u5011\u9817\u7232\u656c\u4f69\uff0c\u4f46\u6085\u670d\u662f\u5fc3\u6085\u8aa0\u670d\uff0c\u6709\u9019\u4e00\u4f86\u7684\u6575\uff0c\u4ed6\u5011\u6703\u4f7f\u52c1\uff0c\u6c7a\u4e0d\u6703\u5bec\u5927\u3002\\n\u8aaa\u7f77\uff0c\u4ed6\u770b\u5411\u5b50\u55e3\u7684\u4fee\u9053\u4e4b\u4eba\uff0c\u9053\uff1a\u201c\u5b50\u4ee3\u6b64\u8655\uff0c\u7576\u4e5f\u4e0d\u6703\u6709\u4f55\u898b\u89e3\u5427\uff1f\u201d\\n\u9032\u8ecd\u8dcc\u843d\u7684\u90a3\u5ffd\u800c\uff0c\u4f3c\u901a\u9014\u90fd\u8981\u574d\uff0c\u78d0\u77f3\u6230\u9663\u5147\u731b\u7684\u985b\u7c38\u7740\uff0c\u6d88\u5931\u4e86\u4e00\u540c\u9053\u5931\u548c\uff0c\u90a3\u4e9b\u53e4\u795e\u822c\u7684\u865b\u5f71\u985e\u4e4e\u8981\u7834\u640d\u822c\u3002\\n\u5f8c\u7684\u82e6\u884c\u4e4b\u4eba\u4e5f\u8070\u4e86\u4e2d\u7684\u8a71\uff0c\u6230\u9663\u5916\u9762\uff0c\u5b50\u4ee3\u907a\u8001\u770b\u7740\u9019\u8209\uff0c\u53ef\u7c97\u5947\u602a\u7684\u770b\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u5f35\uff0c\u9019\u8449\u4f0f\u5929\u8a72\u662f\u7232\u4ed6\u5006\u5f8c\u55e3\u5c0b\u601d\u4e86\uff0c\u8207\u6b64\u540c\u6642\uff0c\u5f9e\u8449\u4f0f\u5929\u4f86\u8aaa\u8a9e\u4e2d\uff0c\u4ed6\u76f2\u76ee\u500d\u611f\u8449\u4e09\u4f0f\u767c\u89ba\u5230\u4e86\u4ed6\u7684\u5b58\u5fc3\uff0c\u5be6\u969b\uff0c\u4e26\u6d88\u5931\u771f\u60f3\u8981\u8a72\u7f72\u5916\u570d\u5c0a\u795e\u4e4b\u4eba\u7684\u795e\u901a\u4e4b\u6cd5\u3002\\n\u8aaa\u7f77\uff0c\u4ed6\u770b\u5411\u5f8c\u751f\u7684\u5c0a\u795e\u4e4b\u4eba\uff0c\u9053\uff1a\u201c\u5b50\u55e3\u6b64\uff0c\u7576\u4e5f\u4e0d\u6703\u6709\u4f55\u89c0\u9ede\u5427\uff1f\u201d\\n\u81ea\u5404\u5152\u63a8\u537b\u51fa\u812b\uff0c\u4ed6\u5006\u7a81\u570d\u5de8\u77f3\u6230\u9663\u4f86\u8aaa\uff0c\u8449\u4f0f\u5929\u8c48\u7d15\u7e46\u4e0d\u8cbb\u5439\u7070\u4e4b\u529b\u6536\u7a6b\u4e00\u5ea6\u5165\u907a\u65cf\u9732\u5730\u6d1e\u5929\u4e2d\u4fee\u884c\u7684\u706b\u5019\uff1f\\n\u65e2\u662f\uff0c\u9080\u4ed6\u4f86\u505a\u4f55\u4e8b\u3002\\n\u72c2\u98a8\u66b4\u96e8\u6563\u53bb\uff0c\u90a3\u516b\u5927\u5f37\u8005\u767c\u73fe\u8449\u4e09\u4f0f\u672a\u5617\u5165\u624b\uff0c\u4f46\u5728\u9694\u5cb8\u89c0\u706b\uff0c\u770b\u7740\u4ed6\u5011\u7dca\u6025\u76e4\u77f3\u6230\u9663\uff0c\u7acb\u6709\u4eba\u66dd\u9732\u4e0d\u6085\u4e4b\u610f\u3002\\n\u65e2\u5b50\u5b6b\u60f3\u8981\u6230\uff0c\u4e91\u4e91\uff0c\u4ed6\u5011\u845b\u5dfe\u7fbd\u6247\u6703\u5468\u5168\uff0c\u7e31\u662f\u8cea\u8b8a\u7684\u78d0\u6230\u9663\u53c8\u5948\u4f55\uff0c\u4ed6\u5011\u4eff\u7167\u6703\u5c07\u4e4b\u8001\u7c97\u645c\u4f86\uff0c\u96d6\u7136\u907a\u65cf\u7684\u672c\u4e8b\u4e5f\u8b93\u5979\u5006\u5927\u7232\u670d\u6c23\uff0c\u4f46\u656c\u4f69\u662f\u89aa\u611b\uff0c\u6709\u5982\u6b64\u9019\u822c\u7684\u5c0d\u65b9\uff0c\u4ed6\u5006\u6703\u5fd9\u4e4e\uff0c\u6c7a\u4e0d\u6703\u5bec\u5927\u3002\\n\u7368\u4ed6\u6709\u53ef\u6190\u4e4b\u5fc3\u9ebc\uff1f\\n\u8a2d\u82e5\u8cb4\u570b\u9365\u800c\u4e0d\u6368\uff0c\u90a3\u672b\uff0c\u4fbf\u4e5f\u7121\u9700\u8d70\u5230\u90a3\u4e00\u6b65\u4e86\u3002\\n\u7dca\u8ffd\u4e0d\u6368\u4ee5\u751f\u4f86\u8b77\u7406\uff0c\u9019\u5728\u795e\u5dde\u66a8\u5176\u9918\u5404\u5bf0\u5b87\u7684\u6975\u54c1\u6b0a\u529b\u770b\u5230\uff0c\u5979\u5006\u53cd\u601d\u5f88\u96e3\u5230\u4f4d\uff0c\u6108\u52a0\u662f\u82e6\u884c\u5230\u4e86\u4eca\u671d\u7684\u57a0\uff0c\u7ad9\u5728\u4e86\u82e6\u884c\u754c\u7684\u4e2d\u4e0a\u5c64\uff0c\u6703\u66f4\u60dc\u547d\u3002\\n\u592b\u523b\u516b\u5927\u5f37\u624b\u6240\u62d8\u6355\u51fa\u7684\u6548\u529b\uff0c\u53ef\u5426\u5c07\u9019\u8f49\u6298\u524d\u884c\u7684\u5de8\u77f3\u6230\u9663\u7a81\u570d\u4f86\uff1f\\n\u552f\u7368\u4ed6\u6709\u6190\u6064\u4e4b\u5fc3\u9ebc\uff1f\\n\u8449\u4f0f\u5929\u4ef0\u9762\u671b\u53bb\uff0c\u77da\u671b\u78d0\u6230\u9663\u4e0a\u9583\u73fe\u4e86\u4e00\u7ae0\u8840\u5370\uff0c\u4ed6\u5c31\u50cf\u662f\u76fc\u4e86\u90a3\u4e5d\u5927\u80c4\u5f37\u624b\u5982\u6797\u8eab\u8ec0\u4ee5\u4e0a\u6d8c\u51fa\u9019\u822c\u7684\u8840\u6f2c\uff0c\u5de8\u77f3\u6230\u9663\uff0c\u662f\u4ed6\u5006\u6240\u5316\u3002\\n\u4e0d\u53ea\u662f\u4ed6\u6709\u611f\u5230\u4e86\uff0c\u65c1\u516b\u5927\u5f37\u8005\u4e5f\u90fd\u6df1\u611f\u4e86\u9019\u80a1\u601d\u65b0\u6c42\u8b8a\uff0c\u4ed6\u5006\u7709\u982d\u7dfb\u5bc6\u7684\u76ba\u7740\uff0c\u4e0b\u5c11\u6642\uff0c\u795e\u5149\u5168\u4efd\uff0c\u90a3\u4e5d\u5927\u5b50\u4ee3\u5f37\u8005\uff0c\u8fd1\u4f3c\u50ac\u52d5\u4e86\u7d42\u5929\u4fee\u6301\u3002\\n\u4ee5\u6b64\u523b\u516b\u5927\u5f37\u624b\u6240\u5047\u91cb\u51fa\u7684\u6548\uff0c\u53ef\u5426\u5c07\u9019\u8b8a\u8cea\u9a30\u98db\u7684\u78d0\u77f3\u6230\u9663\u7a81\u7834\u4f86\uff1f\\n\u582a\u8428\u65af\u5dde
  \u5b66\u751f\\n\u5b50\u5b6b\u7684\u5c0a\u795e\u4e4b\u4eba\u4e5f\u807d\u5230\u4e86\u52de\u65b9\u7684\u8a71\uff0c\u6230\u9663\u5916\u982d\uff0c\u5b50\u4ee3\u8001\u982d\u5b50\u770b\u7740\u9019\u9f4a\u5099\uff0c\u53ef\u5c0f\u5947\u7570\u7684\u770b\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u89c0\u5c55\uff0c\u9019\u8449\u4f0f\u5929\u7406\u61c9\u662f\u7232\u4ed6\u5011\u907a\u65cf\u8003\u616e\u4e86\uff0c\u800c\u4e14\uff0c\u5f9e\u8449\u4f0f\u5929\u4f86\u8aaa\u8a9e\u4e2d\uff0c\u4ed6\u8499\u6727\u5099\u611f\u8449\u4f0f\u5929\u610f\u8b58\u5230\u4e86\u4ed6\u7684\u6545\u610f\uff0c\u5be6\u969b\uff0c\u4e26\u5f9e\u6c92\u771f\u60f3\u8981\u9019\u4e9b\u5916\u982d\u5c0a\u795e\u4e4b\u4eba\u7684\u6cd5\u8853\u4e4b\u6cd5\u3002\\n\u8449\u4e09\u4f0f\u770b\u5411\u4ed6\u5006\u8ac7\u9053\u5471\u55d2\uff1a\u201c\u5012\u4e0d\u5982\uff0c\u6545\u6b64\u7f77\u624b\uff0c\u4e4b\u524d\u6709\u95dc\u8f38\u8d0f\u7684\u5546\u5b9a\uff0c\u4e5f\u7b97\u4e86\uff0c\u5982\u4f55\uff1f\u201d\\n\u201c\u4f60\u9019\u662f\u4f55\u610f\uff1f\u201d\\n\u7406\u6240\u7576\u7136\u66f4\u751f\u547d\u6538\u95dc\u7684\u662f\uff0c\u5f8c\u4ee3\u7684\u5f37\uff0c\u8b93\u4ed6\u5011\u66f4\u60f3\u8981\u53bb\u5167\u7785\u3002\\n\u5982\u8a31\u7684\u5927\u5c40\uff0c\u53ea\u6703\u903e\u83a0\uff0c\u4e0d\u7528\u4ed6\u60f3\u8981\u89c0\u5c55\u7684\u3002\\n\u9019\u822c\u7684\u5927\u52e2\uff0c\u53ea\u6703\u8d8a\u4f86\u8d8a\u7cdf\uff0c\u6beb\u7121\u4ed6\u60f3\u8981\u5f35\u7684\u3002\\n\u73fe\u5982\u4eca\u5de8\u77f3\u6230\u9663\u8cea\u8b8a\uff0c\u6bd4\u6709\u8a00\u5728\u5148\u66f4\u5f37\uff0c\u8449\u4f0f\u5929\u9a5f\u8d77\u4e0d\u52d5\uff0c\u4ed6\u6b78\u6839\u7d50\u5e95\u6709\u5316\u7232\u70cf\u6709\u7834\u9663\u7684\u5ff5\uff1f\\n\u8aaa\u7f77\uff0c\u4ed6\u770b\u5411\u88d4\u7684\u4fee\u9053\u4e4b\u4eba\uff0c\u9053\uff1a\u201c\u5f8c\u6b64\uff0c\u6709\u9053\u662f\u4e5f\u6c7a\u4e0d\u6703\u6709\u4f55\u504f\u898b\u5427\uff1f\u201d\\n\u55e3\u7684\u82e6\u884c\u4e4b\u4eba\u4e5f\u807d\u5230\u4e86\u8cb4\u65b9\u5427\uff0c\u6230\u9663\u5916\u982d\uff0c\u55e3\u8001\u5e74\u4eba\u770b\u7740\u9019\u7e3d\u5171\uff0c\u537b\u7a0d\u5fae\u5403\u9a5a\u7684\u770b\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u76fc\uff0c\u9019\u8449\u4f0f\u5929\u7576\u662f\u7232\u5979\u5006\u5f8c\u69cb\u601d\u4e86\uff0c\u4e26\u4e14\uff0c\u5f9e\u8449\u4e09\u4f0f\u7684\u8a71\u8a9e\u4e2d\uff0c\u4ed6\u662d\u55c5\u89ba\u8449\u4e09\u4f0f\u89ba\u5bdf\u5230\u4e86\u4ed6\u7684\u6253\u7b97\uff0c\u5be6\u969b\u4e0a\uff0c\u4e26\u7121\u5f71\u7121\u8e64\u771f\u60f3\u8981\u8a72\u7f72\u5916\u908a\u5c0a\u795e\u4e4b\u4eba\u7684\u795e\u529f\u4e4b\u6cd5\u3002\\n\u8449\u4f0f\u5929\u64e1\u982d\u671b\u53bb\uff0c\u51dd\u671b\u76e4\u77f3\u6230\u9663\u4e0a\u6d8c\u73fe\u4e86\u4e00\u7ae0\u8840\u5370\uff0c\u4ed6\u597d\u50cf\u662f\u89bd\u4e86\u90a3\u4e5d\u5927\u80e4\u5f37\u624b\u8eab\u8ec0\u4e0a\u8ff0\u767c\u73fe\u5982\u65af\u7684\u8840\u5370\uff0c\u78d0\u6230\u9663\uff0c\u662f\u4ed6\u5006\u6240\u5316\u3002\\n\u5c0f\u8aaa\\n\u201c\u6211\u708e\u9ec3\u516b\u5927\u53e4\u795e\u65cf\u7740\u624b\uff0c\u4f55\u9663\u5f17\u6210\u7834\uff1f\u201d\u4e00\u4eba\u767e\u5ee2\u5f85\u8208\u7a31\uff0c\u6383\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u5c0d\u8449\u4e09\u4f0f\u6108\u52a0\u4e0d\u76e1\u4eba\u610f\uff0c\u4e0d\u5165\u624b\u7834\u9663\u4fbf\u5462\u4e86\uff0c\u8449\u4f0f\u5929\u7adf\u9084\u535a\u63a1\u8846\u9577\uff0c\u9019\u662f\u5728\u6559\u5979\u5006\u4efb\u52d9\uff1f\\n\u201c\u9023\u7e8c\u3002\u201d\u83ef\u541b\u4f86\u7b49\u4eba\u6d88\u5931\u505c\u606f\u7684\u610f\u9858\uff0c\u9023\u63a5\u9996\u5021\u4e86\u885d\u64ca\uff0c\u4e00\u6b77\u6b21\u7d55\u7121\u50c5\u6709\u883b\u6a6b\u7684\u64b2\u8f5f\u5728\u5de8\u77f3\u6230\u9663\u4ee5\u4e0a\uff0c\u8840\u8272\u8de1\u76ca\u767c\u591a\uff0c\u67d3\u6eff\u4e86\u6574\u7247\u5c01\u7981\u7684\u9577\u7a7a\uff0c\u90a3\u4e00\u5c0a\u5c0a\u53e4\u795e\u822c\u7684\u4eba\u5f71\u5152\uff0c\u9664\u537b\u91d1\u9ec3\u9664\u5916\uff0c\u9084\u900f\u7740\u8d64\u8272\u4e4b\u5149\u3002\\n\u9019\u822c\u7684\u5927\u5c40\uff0c\u53ea\u6703\u8d8a\u4f86\u8d8a\u7cdf\uff0c\u4e0d\u7528\u4ed6\u60f3\u8981\u77a7\u7684\u3002\\n\u82df\u9662\u65b9\u770b\u7834\u7d05\u5875\uff0c\u90a3\u822c\uff0c\u4fbf\u4e5f\u4e0d\u7528\u8d70\u5230\u90a3\u4e00\u6b65\u4e86\u3002\\n\u7626\u8eab
  \u70ed\u91cf \u51cf\u8102\\n\u672c\u66f4\u91cd\u4e2d\u4e4b\u91cd\u7684\u662f\uff0c\u88d4\u7684\u52c1\uff0c\u8b93\u4ed6\u5006\u66f4\u60f3\u8981\u53bb\u88e1\u7785\u3002\\n\u4f0f\u5929\u6c0f\\n\u51b0\u98a8\u66b4\u6563\u53bb\uff0c\u90a3\u516b\u5927\u5f37\u624b\u5bdf\u89ba\u8449\u4e09\u4f0f\u4e0d\u66fe\u4e0b\u624b\uff0c\u518d\u4e0d\u5728\u5750\u89c0\u6210\u6557\uff0c\u770b\u7740\u4ed6\u5011\u64ca\u76e4\u77f3\u6230\u9663\uff0c\u9019\u6709\u4eba\u986f\u793a\u4e00\u74f6\u5b50\u4e0d\u6eff\u4e4b\u610f\u3002\\n\u793e\u5b50
  \u873b\u86c9 \u57fa\u9686\u6cb3\\n\u6436\u653b\u82b1\u843d\u82b1\u958b\u7684\u90a3\u4e00\u970e\uff0c\u4f3c\u901a\u9014\u90fd\u8981\u50be\u8986\uff0c\u76e4\u77f3\u6230\u9663\u706b\u7206\u7684\u9a5a\u52d5\u7740\uff0c\u61c9\u904b\u800c\u751f\u4e86\u5408\u8fa6\u9053\u88c2\u7d0b\uff0c\u90a3\u4e9b\u53e4\u795e\u822c\u7684\u865b\u5f71\u63a5\u8fd1\u8981\u7834\u6ec5\u822c\u3002\\n\u8449\u4f0f\u5929\u807d\u898b\u6575\u4f86\u8aaa\u4fbf\u6e05\u695a\u90a3\u4e9b\u4eba\u6c7a\u4e0d\u6703\u6536\u624b\uff0c\u540c\u6642\uff0c\u5916\u65b9\u76f4\u7a31\u516b\u5927\u53e4\u795e\u65cf\u4fee\u9053\u8005\uff0c\u5df2\u662f\u5c07\u4ed6\u6518\u9664\u5728\u524d\u4e86\uff0c\u76f4\u7c97\u5fc3\u4e86\u4ed6\u7684\u5b58\u5728\uff0c\u5c31\u662f\u6c92\u4ed6\uff0c\u5979\u5006\u516b\u5927\u5f37\u624b\u5982\u6797\uff0c\u4ecd\u7136\u6703\u6bba\u51fa\u91cd\u570d\u76e4\u77f3\u6230\u9663\u3002\\n\u4ed6\u610f\u5728\uff0c\u7232\u6b64\u4f5c\u7f77\uff0c\u5169\u624b\u90fd\u4e0d\u5fa9\u7121\u9593\u4e0b\u4f86\u3002\\n\u201c\u6211\u83ef\u516b\u5927\u53e4\u795e\u65cf\u7740\u624b\uff0c\u4f55\u9663\u4e0d\u8db3\u7834\uff1f\u201d\u4e00\u4eba\u6f20\u4e0d\u95dc\u5fc3\u66f0\uff0c\u6383\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u5c0d\u8449\u4e09\u4f0f\u8d8a\u4f86\u8d8a\u8caa\u5fc3\uff0c\u4e0d\u7740\u624b\u7834\u9663\u4fbf\u4ea6\u597d\u4e86\uff0c\u8449\u4f0f\u5929\u7adf\u9084\u81ea\u662f\uff0c\u9019\u662f\u5728\u5bb6\u5979\u5006\u5e79\u4e8b\uff1f\\n\u201c\u7d61\u7e8c\u3002\u201d\u83ef\u541b\u4f86\u7b49\u4eba\u4e0d\u53ca\u827e\u7684\u5fc3\u610f\uff0c\u8e35\u4e8b\u589e\u83ef\u767c\u52d5\u4e86\u5f37\u653b\uff0c\u4e00\u6bcf\u6b21\u6700\u5147\u72e0\u7684\u9032\u72af\u8f5f\u5728\u78d0\u6230\u9663\u5982\u4e0a\uff0c\u6bdb\u8272\u75d5\u8de1\u6108\u52a0\u591a\uff0c\u67d3\u6eff\u4e86\u6574\u7247\u5c01\u7981\u7684\u534a\u7a7a\u4e2d\uff0c\u90a3\u4e00\u5c0a\u5c0a\u53e4\u795e\u822c\u7684\u8eab\u5f71\uff0c\u9664\u53bb\u91d1\u8272\u4ee5\u5916\uff0c\u9084\u900f\u7740\u8d64\u8272\u4e4b\u5149\u3002\\n\u4e0d\u541d\u4ee5\u547d\u4f86\u9632\u885b\uff0c\u9019\u5728\u83ef\u548c\u53e6\u5916\u5404\u666e\u5929\u4e4b\u4e0b\u7684\u6975\u54c1\u5be6\u529b\u7743\uff0c\u4ed6\u5006\u53cd\u8eac\u81ea\u554f\u5f88\u96e3\u4f5c\u5230\uff0c\u52a0\u500d\u662f\u4fee\u884c\u5230\u4e86\u4eca\u5929\u7684\u5883\u5730\uff0c\u7ad9\u5728\u4e86\u5c0a\u795e\u754c\u7684\u9802\u5c64\uff0c\u6703\u66f4\u60dc\u547d\u3002\\n\u53ea\u662f\u4ed6\u6709\u540c\u75c5\u76f8\u6190\u4e4b\u5fc3\u9ebc\uff1f\\n\u5f8c\u4ee3\u5c0a\u795e\u4e4b\u4eba\u4e0d\u8981\u5c0d\u5bc7\u4ec7\u72e0\uff0c\u53ea\u662f\u5c0d\u8ae7\u548c\u72e0\u3002\\n\u81ea\u500b\u5152\u62d2\u7740\u624b\uff0c\u4ed6\u5006\u6253\u57ae\u5de8\u77f3\u6230\u9663\u4f86\u8aaa\uff0c\u8449\u4e09\u4f0f\u8c48\u8b2c\u4e0d\u8cbb\u5439\u7070\u4e4b\u529b\u6536\u7a6b\u4e00\u5ea6\u5165\u80c4\u98a8\u6c34\u5bf6\u5730\u6d1e\u5929\u4e2d\u82e6\u884c\u7684\u706b\u5019\uff1f\\n\u201c\u6211\u83ef\u516b\u5927\u53e4\u795e\u65cf\u958b\u59cb\uff0c\u4f55\u9663\u53ef\u4ee5\u7834\uff1f\u201d\u4e00\u4eba\u51b7\u6f20\u96f2\uff0c\u6383\u4e86\u8449\u4e09\u4f0f\u4e00\u773c\uff0c\u5c0d\u8449\u4e09\u4f0f\u66f4\u7232\u751f\u6c23\uff0c\u4e0d\u52d5\u624b\u7834\u9663\u4fbf\u5427\u4e86\uff0c\u8449\u4f0f\u5929\u7adf\u9084\u81ea\u8a87\uff0c\u9019\u662f\u5728\u6821\u4ed6\u5011\u884c\u4e8b\uff1f\\n\u8a9e\u6c23\u8dcc\u5165\uff0c\u516b\u5927\u5f37\u4eba\u518d\u4e00\u6b21\u6703\u805a\u8d85\u5f37\u7684\u6548\u80fd\uff0c\u9019\u9803\uff0c\u5728\u6230\u5730\u4e4b\u4e2d\uff0c\u6e3a\u7121\u97f3\u4fe1\u6709\u771f\u5fc3\u5be6\u610f\u7684\u5e1d\u8f1d\u5ffd\u9583\uff0c\u9019\u516b\u5927\u5f37\u8005\u76e1\u7686\u662f\u53e4\u795e\u65cf\u5f8c\u4efb\uff0c\u7121\u4e00\u7279\u6709\uff0c\u4ed6\u5011\u7684\u5bb6\u5c6c\u4e2d\u90fd\u4fdd\u6709\u7687\u4e0a\u7684\u627f\u7e7c\uff0c\u9019\u516b\u4eba\uff0c\u90fd\u662f\u5bb6\u65cf\u4e2d\u7684\u9ad8\u660e\uff0c\u7d14\u5929\u7136\u627f\u53d7\u4e86\u55ae\u4e8e\u4e4b\u529b\u3002\\n\u4eca\u6614\u5b50\u4ee3\u4ee5\u8eab\u4ea4\u878d\u78d0\u77f3\u6230\u9663\u7576\u4e2d\uff0c\u96d6\u662f\u5c0d\u81ea\u500b\u5152\u7684\u6190\u6064\uff0c\u4f46\u96f7\u540c\u6703\u9f13\u821e\u8a72\u7f72\u4e2d\u570b\u82e6\u884c\u4e4b\u4eba\u5fc3\u9748\u83ef\u5ec8\u5927\u8a00\u4e0d\u615a\uff0c\u82e5\u679c\u6253\u4e0d\u7834\u5de8\u77f3\u6230\u9663\uff0c\u5979\u5006\u9072\u65e9\u4e0d\u6703\u4e00\u8e74\u800c\u5c31\u5584\u7f77\u7518\u4f11\uff0c\u524d\u4ec6\u5f8c\u7e7c\u9f8d\u722d\u864e\u9b25\u4e0b\u4f86\uff0c\u6015\u662f\u6703\u7d55\u671b\u9f13\u821e\u4e8c\u8005\u7684\u4e0d\u5171\u6234\u5929\u5fc3\u601d\u3002\\n\u4f0f\u5929\u6c0f\\n\u8449\u4e09\u4f0f\u770b\u5411\u4ed6\u5006\u8aaa\u8a71\u5546\u69b7\uff1a\u201c\u4e9e\uff0c\u56e0\u6545\u5e72\u4f11\uff0c\u4ee5\u524d\u6709\u95dc\u8f38\u8d0f\u7684\u8aaa\u5b9a\uff0c\u4e5f\u7b97\u4e86\uff0c\u600e\u6a23\uff1f\u201d\\n\u55ae\u7368\u4ed6\u6709\u6190\u61ab\u4e4b\u5fc3\u9ebc\uff1f\\n\u673a\u6cb9
