sample: '["\"T\u00e4helepanu! Artikkel on enam kui 5 aastat vana ning kuulub v\u00e4ljaande
  digitaalsesse arhiivi. V\u00e4ljaanne ei uuenda ega kaasajasta arhiveeritud sisu,
  mist\u00f5ttu v\u00f5ib olla vajalik kaasaegsete allikatega tutvumine.\\nKasulik
  tulekahju?\\nOktoobri l\u00f5pus puhkenud p\u00f5leng v\u00f5is k\u00f5rvaldada
  olulise takistuse Tallinna kesklinna magusas piirkonnas kinnisvara arendamisel.\\nEsitanud
  tellimuse, j\u00f5uab Tallinna linnaplaneerimise ameti arhiivist pruun kaust minu
  lauale, selle v\u00e4limus sosistab: ole minuga hell! Lehed kausta vahel on vanad,
  esimene dokument hiljuti p\u00f5lenud Maakri 28 maja kohta on aastast 1879, markidega
  kinnitatud saksakeelne dokument, mille \u00e4\u00e4red on koltunud ja narmendavad.
  Silmad lausa naudivad kalligraafia ilmekust ja osavust.\\nKinnisvaraarendajale t\u00e4hendab
  Maakri 28 hoone aga k\u00f5ike muud kui naudingut. Tegemist on kultuurim\u00e4lestisega.
  See fakt on takistanud hoone asemele 24korruselise pilvel\u00f5hkuja rajamist.\\nHoone
  \u00fcks omanikke, tuntud kinnisvarafirma SRV Kinnisvara on koguni \u00fcritanud
  Maakri 28 hoovipoolse hoone demonteerida ja panna taas p\u00fcsti krundile Wismari
  23. Sellega ei olnud n\u00f5us maa-amet, sest tegemist on kinnism\u00e4lestisega
  ja see v\u00e4listab \u00fcldjuhul objekti asukoha muutmise, r\u00e4\u00e4kimata
  hoone \u00fcmberprojekteerimisest.\\nTuli tegi oma t\u00f6\u00f6. Aastaid vindunud
  probleemile v\u00f5is aga saabuda ootamatu lahendus 25. oktoobril, kui kinnil\u00f6\u00f6dud
  ukse- ja aknaavadega majas p\u00e4\u00e4ses valla punane kukk, mis tekitas hoonele
  palju kahju. P\u00e4\u00e4steamet sai teate kell \u00fcksteist \u00f5htul. Kuna
  tulekahju ohustas k\u00f5rval paiknevaid maju ja asutusi, siis keskenduti tule edasileviku
  takistamisele.\\nP\u00e4\u00e4steameti pressiesindaja \u00fctles p\u00f5lengule
  j\u00e4rgnenud p\u00e4eval, et hoonesse murti sisse ja keegi tegi majja tule. Kuna
  s\u00fc\u00fctevedeliku j\u00e4lgi ei leitud, siis otseselt s\u00fc\u00fctamiseks
  teiselt korruselt alguse saanud p\u00f5lengut ei defineeritud. P\u00f5lengu s\u00fc\u00fcdlast
  politsei otsima ei hakka, sest omanik ei ole p\u00f5lengu asjaolude uurimisest huvitatud.\\n\u201cPolitsei
  ei saa ju uurimist alustada, kui omanik avaldust ei tee. Kui toimub sissemurdmine
  ja korteris toimub vargus, aga omanik avaldust ei tee, siis ei saa ka politsei midagi
  uurida,\u201d selgitas p\u00e4\u00e4steameti pressiesindaja Annika Koppel.\\n\u00c4rip\u00e4ev
  p\u00f5rkus hoone omaniku otsimisel kokku \u00fcllatava probleemiga \u2013 omanikku
  sellel p\u00f5lenud hoonel justkui ei olekski. Kuna Maakri 28 ei ole kinnistatud,
  siis pole hoonet ka ehitisregistrites. Ametnikud viitavad aga justkui \u00fchest
  suust, et hoone omanik on SRV Kinnisvara t\u00fctarettev\u00f5te Mark Invest O\u00dc,
  kes siiani maja puudutavatel teemadel alati kaasa r\u00e4\u00e4kivat.\\nOmanik ei
  taha olla omanik. Esimese p\u00e4rimise peale teatab SRV Kinnisvara arendusjuht
  \u00dclar Hallikivi, et tegemist ei ole nende omanduses oleva majaga. Neil on seal
  ainult paar korterit ja nad ei tea t\u00e4pselt, kus maja otsas need korterid asuvad.\\n\u201cMa
  v\u00f5in eksida, kes selle omanik on. K\u00fcll ei ole selle maja v\u00f5i maa
  omanik SRV Kinnisvara, see on n\u00fc\u00fcd k\u00fcll fakt. Kes t\u00e4pselt selle
  maja omanik on, kas see on linn v\u00f5i riik v\u00f5i keegi teine, aga praegu ei
  saa kindlasti omanik olla SRV Kinnisvara, sest me lihtsalt ei ole seda,\u201d toonitab
  Hallikivi esimeses intervjuus.\\nSRV Kinnisvara on ikkagi omanik. N\u00e4dalap\u00e4evad
  hiljem vastas Hallikivi aga juba teisiti:\\nAjakirjanik: Aga te \u00fctlesite, et
  see maja ei kuulu SRV Kinnisvarale. Hallikivi: T\u00e4hendab ma siis t\u00e4psustan
  v\u00f5ib olla nii palju, et see maa maja all ei kuulu meile. Tegemist ei ole kinnisvaraga,
  tegemist on vallasvaraga. Et meile kuuluvad need korteriomandid, ehk siis, vabandust
  mitte isegi korteriomandid, korteriomand on ka asja\u00f5iguslik m\u00f5iste, aga
  meile kuuluvad korterid... kui vallasvara, ehk siis kinnistut kui sellist veel ei
  ole. Seda alles moodustatakse.\\nAjakirjanik: Sellest ma sain aru, aga sellegipoolest.
  Praegu on SRV Kinnisvara, kes selle maja eest kaasa r\u00e4\u00e4gib ja selle maja
  eest vastutab? Hallikivi: Tegelikult SRV Kinnisvara \u00fcks t\u00fctarettev\u00f5tetest.\\nAjakirjanik:
  Mark Invest? Hallikivi: Jah, t\u00e4pselt.\\nSRV Kinnisvara juhatuse liige Priit
  Sauk, \u00fctleb hiljem, et hoone teatud osa kasutamis\u00f5igus on olnud SRV Kinnisvaral
  alates 2001. aastast. T\u00e4psustamise m\u00f5ttes lisavad Sauk ja Hallikivi, et
  korteriomanikke on veel. T\u00e4psemalt \u00fcks omanik kahe korteriga. Sellest
  omanikust ei tea aga ka SRV Kinnisvara midagi, sest mingit kontakti pole olnud.
  Objekti kinnistamisel loodavad Sauk ja Hallikivi, et v\u00e4ikeomanik ikka notarisse
  ilmub, muidu v\u00f5ib maja kinnistamata j\u00e4\u00e4dagi.\\nMaa maja all ja \u00fcmber
  ei ole kinnistatud ja seega on tegemist vallasvaraga, mille enamusosa omanik on
  siiski SRV Kinnisvara t\u00fctarettev\u00f5ttele Mark Invest O\u00dc, \u00fcks kolmandik
  majast kuulub aga isikule, keda ei \u00f5nnestunud tabada ka \u00c4rip\u00e4eval.
  Ent hoolimata sellest on ka vallasvara varaomaniku kohus talle kuuluvat kultuuriv\u00e4\u00e4rtust
  kaitsta.\\nHoone tulevik s\u00f5ltub ekspertiisist. Mis tules h\u00e4vinud majast
  edasi saab, pole veel teada, ent kultuuriv\u00e4\u00e4rtuste ameti peaspetsialist
  Artur \u00dcmar loodab, et hoone koopiana siiski \u00fcles ehitatakse. V\u00f5imalik,
  et v\u00e4\u00e4rtuslikud detailid korjatakse kokku ja need \u00fcritatakse \u00e4ra
  kasutada. \u201cArendaja kindlasti tahab sinna uut k\u00f5rghoonet ehitada,\u201d
  on \u00dcmar veendunud.\\nSelle aastaid seisnud, lagunenud ja korduvalt ka p\u00f5lenud
  ajaloolise hoone saatus s\u00f5ltub n\u00fc\u00fcd Tallinna kultuuriv\u00e4\u00e4rtuste
  ameti tellitud insenertehnilisest ekspertiisist. Varasemate p\u00f5lengute korral
  on s\u00fc\u00fcdistatud ikka kodutuid, neid keda s\u00fc\u00fcdi m\u00f5ista ja
  vastutusele v\u00f5tta ei saa ning kes p\u00e4rast \u00f5nnetusi j\u00e4ljetult
  kaovad. Naabermajas t\u00f6\u00f6tava naise s\u00f5nul ei ole tema viimase poole
  aasta jooksul selles hoones kodutuid n\u00e4inud. Varemalt nad selles majas olid
  k\u00fcll.\\nP\u00e4rast iga p\u00f5lengut on jutt olnud sarnane \u2013 maja tuleb
  \u00fcles ehitada, kas v\u00f5i koopiana ja suurt k\u00f5rghoonet sinna ehitada
  ei tohi. Kas see jutt kordub ka n\u00fc\u00fcd, s\u00f5ltubki ekspertiisi tulemustest.
  Erinevalt varasematest p\u00f5lengutest oli seekord tule laastamist\u00f6\u00f6
  v\u00f5imsam ja seet\u00f5ttu v\u00f5ib juhtuda, et hoone taastamist enam ei n\u00f5uta.\\nTallinnas
  on t\u00fchjalt seisvaid ja k\u00fclmade saabudes kodutuid majutavaid hooneid umbes
  500, neist ligi 100 kuulub linnale. P\u00e4\u00e4steameti menetleja Vello Teinemaa
  s\u00f5nul linna majadega ravaliselt probleeme ei ole. Eraomanikele kuuluvate hoonete
  kohta sama \u00f6elda ei saa.\\nKonkurss on pooleli\\nPraegu k\u00e4ib Tallinnas
  asuva Maakri kvartali arhitektuurikonkurss. Selle korraldaja arhitekt Toomas Paaver
  kinnitas, et SRV Kinnisvara konkursi tingimustele vastuseisu n\u00e4idanud ei ole.Paaveri
  s\u00f5nul on konkursi teise etapi arhitektuuritingimustes kirjas, et Maakri 28
  kuulub s\u00e4ilitamisele ja arhitektid \u00fcritavad leida parimaid v\u00f5imalikke
  lahendusi kultuuriv\u00e4\u00e4rtuse sobitamisel k\u00f5rghoonete vahele.Paaveri
  s\u00f5nul tundus talle, et omanikud on selle maja alles j\u00e4\u00e4misega leppinud,
  ent varen on sellega probleeme esinenud k\u00fcll, nimelt on omanikud soovinud sinna
  ikka midagi uut ehitada.Kuna aga Maakri kvartalis on palju eri huvide ja soovidega
  omanikke, ei ole siiani rahuldavate kompromissideni j\u00f5utud ja kvartali arenemine
  on liikunud teosammul. SRV Kinnisvara esindajate v\u00e4itel on riigi venitamine
  maja kinnistamisel takistanud kultuuriv\u00e4\u00e4rtust kaitsta. Linnaplaneerimise
  amet vaidleb vastu ning kinnitab, et ehitise kuuluvuse \u00fcle pole vaidlust olnud.
  Ehitise omanik on kohustatud tagama ehitise ohutuse selle kasutajatele ning teiste
  inimeste elule ja tervisele, varale ja keskkonnale. Maja teenindamiseks vajaliku
  maa m\u00e4\u00e4ramise menetlus ei oma seejuures mingit t\u00e4htsust.Tallinna
  kultuuriv\u00e4\u00e4rtuste ameti peaspetsialist Artur \u00dcmar \u00fctles, et
  t\u00f5en\u00e4oliselt ei j\u00f5ua arhitektuurikonkursi teine etapp tulemuseni,
  sest kvartalis asuvate kinnistute omanikud ei leia ka seekord \u00fchist keelt.\\nTaust\\nKodu
  t\u00f6\u00f6stustele\\nMaakri 28 asunud hoones on olnud:kangaste kudumise t\u00f6\u00f6stuskompveki-
  ja \u0161okolaadit\u00f6\u00f6stusOrnlichi trikoo- ja pesut\u00f6\u00f6stustr\u00fckikoda
  EDUTallinna Mere rajooni T\u00f6\u00f6stuskombinaadi puidut\u00f6\u00f6stuse laduAjaloolise
  Lenderi g\u00fcmnaasiumi \u00f5petajate majaAjakirjanduses on ka kirjutatud, et
  hoones on kunagi korter olnud praegusel Tallinna linnapeal Edgar Savisaarel.\"",
  "\"Eesti reiting t\u00f5otab t\u00f5usta\\nReitinguagentuuri Fitch kiitev hinnang
  Eesti majandusele langeb \u00fcldjoontes kokku Eesti Panga n\u00e4gemusega ning
  kinnitab keskpanga teatel, et kasvu j\u00e4tkumiseks on vajalik tasakaalustada riigi
  tulud ja kulud.\\nSeet\u00f5ttu tuleb majanduskasvu kiirenedes arvestada eelarve
  \u00fclej\u00e4\u00e4giga, v\u00e4ltida jooksevkonto defitsiidi olulist kasvu ja
  tagada selle finantseerimine eelk\u00f5ige otseinvesteeringute ja muude pikaajaliste
  stabiilsete rahavoogudega, teatas keskpank. Eesti Pank r\u00f5hutab ka, et l\u00f5pule
  tuleb viia majandusstruktuuri reform, eelk\u00f5ige infrastruktuuriettev\u00f5tete
  \u00fcmberstruktureerimine ja erastamine.\\nRahvusvaheline reitinguagentuur Fitch
  teatas esmasp\u00e4eval, et kaalub Eesti riigireitingu t\u00f5stmist.\\nBNS\\nFond
  toetab ettev\u00f5tjaid\\nMajandusministeeriumi haldusalas Euroopa Liidu Phare projekti
  abiga loodud Stardiabifondi n\u00f5ukogu toetab nelja ettev\u00f5tluse alustamise
  projekti 214 581 krooniga.\\nStardiabi n\u00f5ukogu otsustas eraldada 50 000 krooni
  P\u00f5lvamaale palkmajade t\u00f6\u00f6stuse seadmete soetamiseks, 15 000 krooni
  V\u00f5rumaale m\u00e4ngukeskuse sisseseade soetamiseks, Ida-Virumaale 100 000 krooni
  plekktoodete valmistamise sisseseade ostmiseks ja 49 581 krooni akende ja uste tootmise
  tehnika soetamiseks, teatas stardiabifondi projektijuht Heidi Kohlman.\\nEPL\\nEesti
  ootab EXPOl miljonendat k\u00fclastajat\\nMaailman\u00e4ituse EXPO 2000 Eesti paviljoni
  Hannoveris peaks t\u00e4na hommikul tulema miljones k\u00fclastaja.\\nEesti peakomissar
  Andres Armand Pajuste s\u00f5nul on nii suur k\u00fclastatavus t\u00e4helepanuv\u00e4\u00e4rne.
  Paviljonis on juba viibinud pea sama arv inimesi kui on Eestis kokku elanikke. 1,4
  miljoni k\u00fclastaja piir on lootust \u00fcletada augusti l\u00f5puks. Eesti paviljoni
  auk\u00fclaline saab kingituseks tunnistuse, mis t\u00f5endab, et enne teda on virtuaalse
  Eestiga paviljonis tutvunud 999 999 inimest ning miljonenda k\u00fclastaja au kuulub
  talle.\\nHuvi Eesti ekspositsioonivastu on kasvanud. Kui juunis oli p\u00e4evas
  keskmiselt 12 500 k\u00fclastust, siis augustis on olnud k\u00fclastusi keskmiselt
  16 200 p\u00e4evas.\\nEXPO 2000 on avatud Hannoveris 31. oktoobrini.\\nAare Reivart\"",
  "\"Neoviiri \u00fclevaated prostatiidi kohta\\nSiin on Vitafoni seadme kohta arstide
  \u00fclevaated videodest ning lingid kasutajate arvustustega saitidele, sealhulgas
  negatiivseid kommentaare. K\u00f5igepealt toome teie t\u00e4helepanu arstide ja
  kasutajate videovestlusele Vitafoni kasutamise kohta. Veenduge, et video esitaks
  arstide tegelikku \u00fclevaadet, saate m\u00f5nedele neist n\u00f5ustuda. N\u00f5uetekohase
  ravi korral saate retsidiivi t\u00e4ielikku puudumist. Isegi kui inimene on hiljaks
  muutunud ja tal on p\u00e4rast p\u00fcelonefriiti komplikatsioon - neerude v\u00f5i
  neerupuuduse kokkut\u00f5mbumine, siis v\u00e4hendavad suguartiklid neeru kiulisi
  protsesse ja suurendavad uriini voolu. Sama kehtib ka prostatiidi kohta.Meeste suguelundite
  s\u00fcgeluse p\u00f5hjused on sageli prostatiit, vesikuliit. Sama v\u00f5ib \u00f6elda
  ka prurituse kohta rinna\u00e4\u00e4rmetes raseduse ajal. kortikosteroidid (Metipred,
  prednisoloon), interferoonid (alfa-2b-interferoon, neoviir), ravimid koos A-vitamiin
  (\\\"Tigazon\\\", Don: kasutusjuhised, n\u00e4idustused, \u00fclevaated ja analoogid.
  Lisateavet analoogide, nende hindade ja nende asendajate kohta saate selle artikli
  l\u00f5pus. Laste interferooni \u00fclevaated v\u00f5imaldavad meil j\u00e4reldada,
  et ravim ei Candida, Gardnerella, Trichomonas, papillomatoosi, prostatiit jne).
  Lisaks tuleb m\u00e4rkida, et IFN indutseerijate, nagu Neoviir, Amiksin, Cycloferon
  jne.- Mul on prostatiit, aga mul olid lapsed\\n- Tseftriaksoon prostatiidi ravis\\n-
  Eesn\u00e4\u00e4rme adenoomin\u00e4itus\\n- M\u00fcostimulatsioon prostatiidiga\\nSpemaan
  prostatiidi jaoks: kuidas ravida ravimeid ja milliseid analooge on olemas Eelneva
  p\u00f5letikulise protsessi nimetatakse prostatiidiks. T\u00e4nap\u00e4eval diagnoositakse
  seda haigust \u00fcsna sageli erinevate vanuser\u00fchmade patsientidel ning need
  v\u00f5ivad olla nii \u00e4gedad kui ka kroonilised. Valuvaigistid ja p\u00f5letikuvastased
  k\u00fc\u00fcnlad: nimekiri, kasutusjuhised ja \u00fclevaated - Narkootikume - Sooles
  on suur hulk kasulikke baktereid, mis suudavad seedida toitu ja kaitsta organismi
  kahjulike mikroorganismide eest. Kasulik teave k\u00f5igi \u00fcle aastaste meeste
  kohta. aastal viidi l\u00e4bi 38 Euroopa naise seas anon\u00fc\u00fcmsed uuringud.
  Nende k\u00fcsitluste tulemuste p\u00f5hjal selgus, et v\u00e4hem kui 15% on seksieluga
  t\u00e4iesti rahul, 67% soovib rohkem mehi ja 12% petab oma abikaasat teiste meestega.
