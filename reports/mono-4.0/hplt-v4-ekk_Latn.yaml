  piaksid ikka siikohtas oma s\u00f5na \u00fctlema.\\nLaupa, kahek\u00fcmne seitsmenda
  \u00f5hta kellu seitsmest n\u00e4idatse Hellamaa k\u00fclakeskuses n\u00e4item\u00e4ngi.
  Suure-Jaani n\u00e4itering teeb n\u00f5ukest t\u00fckki, misel oo nimeks \u201cKoristajad\u201d.
  Pileti eest k\u00fcsitse kolm eurut.\\nJa tuleva n\u00e4dali oo neljal p\u00e4\u00e4val
  \u2013 esmasbe, teesibe, neljabe ja riede \u2013 k\u00fclakeskuses kirbukas. Soab
  omad \u00fclearused asjad \u00e4\u00e4 m\u00fc\u00fca v\u00f5i n\u00f5uksi osta,
