  11:45 in Pettused ja Petturid\"", "\"Today we are presenting free printable business
  cards template for Avon representatives, designed on light gray background with
  smooth pink color.\\nKui see on sinu fail palun andke meile teada. Me eemaldada
  faili 24 tunni jooksul v\u00f5i, kui soovite, me \u00fcmber jaotada selle oma kontole.
  Me ei vastuta \u00fcleslaetud faili kohta Xooplate. Liikmed laadida faile ja me
  keelata k\u00f5ikide liikmetele, et rikkuda autori\u00f5igusi.\\nKui see on sinu
  t\u00f6\u00f6 looge oma konto ja n\u00f5ude omandi\u00f5igus selle kirje. Plaadi
  oleks \u00fcmber oma kontole. Alates myxoo teil oleks v\u00f5imalik manipuleerida
  koos oma plaadi.\\nKui tunned, et see fail on autori\u00f5igusega kaitstud palun
  andke meile teada. Me eemaldada faili 24 tunni jooksul. Me ei vastuta \u00fcleslaetud
  faili kohta xooplate. Liikmed laadida faile ja me keelata k\u00f5ikide liikmetele,
  et rikkuda autori\u00f5igusi.\"", "\"Pohmelus p\u00e4rast Higgsi\\nFundamentaalf\u00fc\u00fcsikuid
  on tabanud mitu matsu korraga.\\nViimased viisk\u00fcmmend aastat painas maailma
  parimate f\u00fc\u00fcsikute krobelisi ajusid n\u00e4iliselt lihtne k\u00fcsimus:
  miks on need osakesed, millest koosneme meie ja meid \u00fcmbritsev maailm, massiivsed?
  F\u00fc\u00fcsikateooria j\u00e4rgi peaksid need olema massitud. Kuidas siis nii,
  k\u00fcsime meie, kui raske ohkega vannitoakaalult maha astudes ilmselgelt kogeme
  oma kaalukust. Just nimelt sel p\u00f5hjusel m\u00f5tlesid f\u00fc\u00fcsikud v\u00e4lja
  teooria, mis seletab meie kaalukust ja mis sisaldab ka \u00fcht uut osakest, Higgsi
  bosonit. P\u00e4rast viiek\u00fcmneaastast otsimist on see osake n\u00fc\u00fcd
  l\u00f5puks leitud. Quo vadis, fundamentaalf\u00fc\u00fcsika?\\nIstun h\u00e4maras
  suures saalis, mille lavale on suunatud eredad pro\u017eektorid. Publik on haaratud
  eakast ettekandjast, \u00f5hus on pinget, rahulolu ja uudishimu. Hoolimata sellest,
  et v\u00e4ljas on m\u00f5nus p\u00e4ikseline suveilm, on tuhatkond kuulajat kogunenud
  juba hommikul siia h\u00e4marasse saali j\u00e4lgima professor Peter Higgsi monoetendust
  \u201eMina ja minu boson\u201d.\\nPeter Higgs on staar, osakestef\u00fc\u00fcsika
  megastaar. (Teaduse megastaari staatusele viitab vististi Paul Diracile omistatud
  m\u00f5te, et ta eelistab k\u00fcmne tuhande idioodi tormilistele ovatsioonidele
  k\u00fcmne geeniuse heakskiitvat \u00fcminat.) Megastaari kohta on Higgs tagasihoidliku
  olemisega, isegi kohmetu, aga ootamatult kergesti haarab ta publiku endaga kaasa
  oma eneseirooniliste naljade ja pidevalt sassi minevate ettekandeslaididega. Kuid
  miks ei peaks tema lugu publikut haarama? Selles on olemas k\u00f5ik see, mis teeb
  \u00fche loo huvitavaks: noorp\u00f5lve suured otsimised, avastused ja esimene armastus,
  viisk\u00fcmmend aastat \u00f5nnetut ootamist ning siis \u00f5nnelik l\u00f5pp.
  Ja seda k\u00f5ike jutustab vana mees, t\u00f5siselt ja s\u00e4ravate silmadega.
  Panen t\u00e4hele, et tema monoloogis k\u00f5lab \u00fcllatavalt tihti s\u00f5na
  \u201evein\u201d.\\nProfessor Higgsi monoloogi v\u00f5ib kokku v\u00f5tta nii. F\u00fc\u00fcsika
  on teatavasti teadus, mis uurib meid \u00fcmbritsevat maailma, \u00fcritades seda
  kirjeldada matemaatika keeles. Osakestef\u00fc\u00fcsikat huvitavad k\u00f5ige v\u00e4iksemad
  n\u00e4htused meie \u00fcmber \u2013 kujuteldamatult v\u00e4ikesed osakesed ja see,
  kuidas need \u00fcksteist m\u00f5jutavad. T\u00e4nap\u00e4eval usutakse, et seda
  maailma kirjeldab matemaatiline mudel, mida osakestef\u00fc\u00fcsikud nimetavad
  proosaliselt standardmudeliks. Higgsi boson on standardmudeli \u00fcks nurgakivi.
  Ilma selle bosonita ei osata seletada osakeste masse ja seda, miks on looduses esinev
  \u201en\u00f5rk vastasm\u00f5ju\u201d nii n\u00f5rk. Seega oli p\u00f5hjust k\u00f5vasti
  pingutada bosoni leidmiseks, sest ilma selleta oleks osakestef\u00fc\u00fcsika arusaamine
  meie maailmast sisuliselt kokku kukkunud. Selle k\u00fcbekese, Higgsi bosoni, otsimine
  oli \u00fcks peamisi p\u00f5hjusi, miks ehitati miljardeid eurosid maksma l\u00e4inud
  Tevatroni- ja LHC-nimelised osakestep\u00f5rgatid Ameerikas Chicago ja Euroopas
  Genfi l\u00e4histele.\\nN\u00fc\u00fcd tagasi veini juurde. Vein on teatavasti tarkade
  inimeste jook. Veiniga liialdamine v\u00f5ib pakkuda m\u00f5nusa \u00f5htu, aga
  v\u00e4\u00e4ramatu t\u00f5en\u00e4osusega j\u00e4rgneb sellele ebameeldiv hommik.
  M\u00f5neti sarnasesse olukorda on sattunud osakestef\u00fc\u00fcsika. Higgsi bosoni
  avastamine oli viiek\u00fcmneaastase ponnistuse vili ning see t\u00f5i kaasa eufooria
  ja \u0161ampanjajoad. N\u00fc\u00fcd on boson leitud, pidu l\u00e4bi, \u00f6\u00f6
  m\u00f6\u00f6das ja vaikselt \u00e4rkavad pidulised pilutavad oma paistes silmi,
  tundes, kuidas t\u00fchjus poeb hinge. Viisk\u00fcmmend aastat on ponnistatud, et
  see neetud Higgsi boson k\u00e4tte saada. N\u00fc\u00fcd on see k\u00e4es, k\u00f5ik
  on nagu korras, aga kuidas eluga edasi minna?\\nOlukord on veel hullem\\nViimased
  kolmk\u00fcmmend aastat on paljud f\u00fc\u00fcsikud uskunud, et Higgsi bosoniga
  koos leiame ka m\u00e4rke supers\u00fcmmeetriast. Laskumata detailidesse, siis supers\u00fcmmeetriat
  on vaja selleks, et lahendada mainitud standardmudeli m\u00f5ningaid v\u00e4ikseid
  n\u00f5rkusi. \u00dcks olulisem neist on hierarhia probleem ehk miks on Higgsi boson
  nii kerge. Paljude f\u00fc\u00fcsikute arvates oleks loomulik, et boson on miljardeid
  kordi kaalukam, kui olid ennustanud f\u00fc\u00fcsikaeksperimendid. Supers\u00fcmmeetria
  on \u00fcks v\u00f5imalus selgitada bosoni nii v\u00e4ikest massi. Kui Higgsi bosoni
  massiks m\u00f5\u00f5deti 126 GeV (umbes 126 vesiniku aatomi mass), siis supers\u00fcmmeetria
  fanaatikud h\u00f5\u00f5rusid k\u00e4si \u2013 nii madala massi puhul peaks kindlasti
  leidma uusi osakesi, mida supers\u00fcmmeetria teooria ennustab. Oh h\u00e4da! \u00dchtegi
  sellist osakest ei ole veel leitud. N\u00fc\u00fcd n\u00e4ib hoopis, et supers\u00fcmmeetrikute
  kulmude vahele on tekkinud t\u00f5sine murekorts.\\nSellega mured ei piirdu. Higgsi
  bosoni mass on veel \u00fches m\u00f5ttes huvitav. Nimelt, Higgsi bosoni massist
  s\u00f5ltub, kas vaakum on stabiilne v\u00f5i mitte. N\u00f6rdinud lugeja protestib
  siinkohal: \u201eKui miski siin maailmas on p\u00fcsiv, siis v\u00f5iks see olla
  t\u00e4iesti t\u00fchi ruum.\u201d Rahu, ainult rahu! Lihtsurelike ajaskaalas v\u00f5ime
  muretud olla, vaakum ei hakka veel niipea lagunema. Vaakumi ebastabiilsus avaldub
  k\u00fcmnete-sadade miljardite aastate ajaskaalas. Aga kui vaakum siiski peaks meie
  l\u00e4heduses lagunema hakkama, siis on see s\u00fcndmus meile kindlasti katastroofiline.
  \u201eMeie vaakumi\u201d lagunemine madalama energiaga vaakumiks n\u00e4eks v\u00e4lja
  nagu hiiglasliku tulekera levik l\u00e4bi universumi, kusjuures tulekera leviks
  valguse kiirusega ja see h\u00e4vitaks oma teel k\u00f5ik keerulisemad ainestruktuurid.
  Veidral kombel on Higgsi bosoni mass t\u00e4pselt stabiilse-ebastabiilse juhu piiril:
  kui Higgsi boson oleks raskem, siis oleks vaakum stabiilne, ja kui boson oleks kergem,
  siis oleks vaakum ebastabiilne. Seega on bosoni mass just t\u00e4pselt selline,
  et maailm n-\u00f6 ripub stabiilse-ebastabiilse vaakumi piiril. Kas see on juhus
  v\u00f5i peitub selle taga mingi s\u00fcgavam p\u00f5hjus, seda me kahjuks veel
  ei tea.\\nUnistuste purunemine\\nFundamentaalf\u00fc\u00fcsikuid on tabanud mitu
  matsu korraga. Esiteks, \u00fche suure eesm\u00e4rgi t\u00e4itumine on tekitanud
  kerge pohmeluse ja eesm\u00e4rgituse tunde. Pohmelusega k\u00e4ivad kaasas m\u00f5ned
  t\u00f5sisemad haiguss\u00fcmptomid: unistuste purunemine (supers\u00fcmmeetria),
  Higgsi bosoni veider mass (vaakumi stabiilsus-ebastabiilsus). Tundub, et \u00fchest
  ravivast aspiirinist v\u00f5ib siinkohal v\u00e4heseks j\u00e4\u00e4da. V\u00f5ib-olla
  on see hoopis mingi t\u00f5sisem haigus, mis on k\u00fcpsenud n\u00e4iliselt terves
  kehas juba aastaid? Enne kui asume l\u00f5plikku diagnoosi panema, r\u00e4\u00e4gime
  l\u00fchidalt fundamentaalf\u00fc\u00fcsika tagatoast.\\nFundamentaalf\u00fc\u00fcsika
  tegeleb paratamatult probleemidega, mis on v\u00e4ga sageli eksperimentaalf\u00fc\u00fcsika
  haardeulatusest v\u00e4ljas. F\u00fc\u00fcsikaeksperimentide teostamist piiravad
  meid \u00fcmbritseva f\u00fc\u00fcsilise maailma paratamatused ja raha hulk, mida
  \u00fchiskond on n\u00f5us f\u00fc\u00fcsikaeksperimentidesse panustama. Fundamentaalf\u00fc\u00fcsika
  h\u00fcppab vahel v\u00e4ga kaugele eemale reaalsest f\u00fc\u00fcsilisest maailmast
  ja siis j\u00e4lle t\u00f5mmatakse see kareda ja karmi eksperimentaatorik\u00e4ega
  tagasi elule l\u00e4hemale. Kuna reaalse maailma kainestav m\u00f5ju on n\u00f5rk,
  siis on fundamentaalf\u00fc\u00fcsikas alati olnud oluline roll tagatoal. Kui tagatoas
  on soositud m\u00f5ni f\u00fc\u00fcsikateooria, siis kipub kogu f\u00fc\u00fcsikute
  kogukond seda paratamatult rohkem v\u00f5i v\u00e4hem j\u00e4rgima. Kui suur on
  f\u00fc\u00fcsikute tagatuba? Sajand tagasi koosnes see tinglik tagatuba ehk k\u00fcmmekonnast
  maailma tippf\u00fc\u00fcsikust. N\u00fc\u00fcdseks on f\u00fc\u00fcsikute koguarv
  suurenenud pea sada korda. Nagu \u00fchiskonnas kombeks, siis tagatoad moodustavad
  umbes kuupjuure huvitatud seltskonna koguarvust. Seega v\u00f5iks tinglik t\u00e4nap\u00e4eva
  tagatuba koosneda umbes viiek\u00fcmnest f\u00fc\u00fcsikust.\\nMilline on m\u00f5ttelise
  tagatoa roll f\u00fc\u00fcsikas? M\u00f6\u00f6dunud sajandi seitsmek\u00fcmnendatel
  tehti osakestef\u00fc\u00fcsikas mitu olulist l\u00e4bimurret. M\u00f5eldi v\u00e4lja
  ja kontrolliti eksperimentaalselt tugeva vastasm\u00f5ju olemust. Samal k\u00fcmnendil
  saadi selgust ka n\u00f5rga vastasm\u00f5ju omadustes. Just samadel seitsmek\u00fcmnendatel
  m\u00f5tlesid f\u00fc\u00fcsikateoreetikud v\u00e4lja supers\u00fcmmeetria, stringiteooria
  ja \u00fchendteooriad. \u00dchendteooriate j\u00e4rgi \u00fchinevad k\u00f5ik looduses
  tuntud vastastikm\u00f5jud mingi v\u00e4ga k\u00f5rge energia juures \u00fcheks
  vastasm\u00f5juks. Sellised teooriad on matemaatiliselt paeluvad ja esteetilised.
  Stringiteooria v\u00e4idab ennast \u00fchendavat gravitatsioonin\u00e4htused ja
  osakestef\u00fc\u00fcsikast tuntud elektromagnetilise, n\u00f5rga ja tugeva vastasm\u00f5ju.\\nJuhtus
  nii, et enamik teoreetikuid asus suure hurraaga esteetiliselt nauditavate supers\u00fcmmeetria,
  stringiteooria ja \u00fchendteooriate uurimisele. Samas hoopis p\u00f5letavamad
  ja elulisemad f\u00fc\u00fcsikaprobleemid (tugev vastasm\u00f5ju jm) l\u00fckati
  riiulile paremaid aegu ootama. Seda paljuski p\u00f5hjusel, et neid k\u00e4sitlev
  matemaatika on suhteliselt ebaesteetiline. Ka tagatuba asus igati soosima supers\u00fcmmeetria,
  stringiteooria ja \u00fchendteooriate uurimist ja nii keskendusid tuhanded osakestef\u00fc\u00fcsikud
  neile teemadele aastak\u00fcmneteks. N\u00fc\u00fcd, p\u00e4rast aastak\u00fcmneid
  kestnud rasket t\u00f6\u00f6d v\u00f5ivad supers\u00fcmmeetriaga tegelnud f\u00fc\u00fcsikud
  avastada ennast l\u00f5hkise k\u00fcna eest. Higgsi bosoni avastamine pidi ju tooma
  kaasa ka supers\u00fcmmeetria avastamise! N\u00e4ib, et selle asemel k\u00fcpsetab
  see hoopis revolutsioonilist situatsiooni. Alamkihid ei taha ja \u00fclemkihid enam
