  kodwa kungeke kukhonjwe ukuthi kwenziweni. Lemisebenzi ikhokhisa kakhulu ngento
  engabonakali. Imfihlo yayo yonke inikezwa uSonkontileka oyedwa odlayo nje.\\nKube
  nezikhukhula ezweni lethu ezishiye kukhalwa lapha Ogwini. Kwadilika izindlu, konakala
  imigwaqo kwamuka amabhuloho. Izikhukhula ezazenze lomonakalo ngeminyaka yo 2007,
