sample: '["\"Ufuna imiyalelo yokuthi usetshenziswa kanjani i-BISSELL 1558 Spot Clean
  Pet Pro? Ungabe usabheka okunye! Le manuwali yomsebenzisi ihlanganisa yonke into
  kusukela ekufakweni kuya ekuhlanzweni, iqinisekisa ukuthi ukungcola kwesilwane sakho
  akufani ne-Clean Pet Pro. \u00a92020 BISSELL Inc. Wonke amalungelo agodliwe.\\nFunda
  indlela yokusebenzisa nokunakekela i-Bissell 3624E Series Spot Clean Pet Pro ngale
  manuwali yomsebenzisi ebanzi. Kusukela emiyalweni ebalulekile yokuphepha kuya emininingwaneni
  evela kuSihlalo kanye ne-CEO ye-Bissell, lo mhlahlandlela unakho konke odinga ukukwazi
  ukuze uthole okuningi ku-deep cleaner yakho.\"", "\"- Bathi uzonda amaNdiya nabathathandana
  bewubulili obufanayo\\n- Uyaziphendulela KwelaboHlanga\\nKwake kwaba khona isikhathi
  lapho kukholakala ukuthi ezobulungiswa kuleli kazinachashaza. Lo mbono wabe wesekwa
  wukuhlonipheka kwabantu abangaBehluleli, izinkantolo nezinhlaka zobulungiswa. Konke
  lokho sekungumlando njengoba lolu hlaka loMbuso selaba yibhola lomnqakiswano phakathi
  kwalabo abaseka ezobulungiswa nezinkantolo kanye nalabo abasola lolu hlaka ngokuthatha
  uhlangothi ezimpini zepolitiki yakuleli.\\nKulezi zinyanga ezimbili ezobulungiswa
  zakuleli zike zaba sematheni ngenxa yezinqumo ezenziwe kunhlolokhono kubhekwa ozoba
  yiNhloko YaBehluleli emuva kokushiya kukaMehluleli uMogoeng Mogoeng. Okwesibili
  nokwakamuva kube yisinqumo ngodaba lwalowo okumele abe yiNhloko YaBehluleli KwaZulu-Natal,
  uMehluleli uMjabuliseni Isaac Madondo. Esinqumweni ebesingalindelekile abeJudicial
  Servive Commission (JSC) baphakamise ukuba uMengameli wezwe uRamaphosa angaqoki
  muntu kulesi sikhundla nobekusho ukuthi uMadondo akasaqokeki.\\n\u201cKulandela
  inhlolokhono nokufakana imilomo, iJSC inqume ukuba ibonise uMengameli uCyril Ramaphosa
  ukuba angaqoki mehluleli kulesi sikhundla,\u201d kusho isitatimende.\\nOkuvele njengezizathu
  zalesi sinqumo kubukeka kuyizo eziphakamise izinhlonzi njengoba kube wudaba oluthinta
  ibhuku alibhala elisihloko sithi \u201cRevelation of God\u2019s Truth and Plan\u201d
  (Ukwembulwa Kweqiniso LikaMvelinqangi Nesu Lakhe) phansi kwesihlokwana esikhuluma
  ngobudlelwane bocansi phakathi kwabantu bobulili bunye (obufanayo). Ngesikhathi
  kunenhlolokhono mhla ziyisi-8 kuMbasa uMadondo wabuzwa kabanzi ngalokhu nokwaba
  sobala ukuthi laba abaphikisana naye bamile ekutheni akakwazi ukuba yinhloko yabehluleli
  kweleNdlovukazi uMthaniya uma enemiboni \u201cecwasayo\u201d.\\nNokho kukhona abathi
  lokhu bese kuwukucasha ngesithupha nje ngoba vele uMadondo \u201cujeziselwa izono
  zakhe\u201d. Komunye wabameli elaboHlanga elikhulume naye nonolwazi ngokusebenza
  kweJSC uthe ukungaqokwa kukaMadondo akuyona into entsha. \u201cZimbili izizathu
  ebezizobekwa ukuze uMadondo angaqokwa. Esokuqala bekuyiminyaka yakhe, bekuzoba nesiphakamiso
  sokuthi kuhle kube khona umuntu osazohlala isikhathi eside novunwa yiminyaka\u201d.
  Kusho lommeli onxuse ukuba singalidaluli igama lakhe. Uqhubeke wathi: \u201cOkwenze
  lokho kungaphumeleli yingenxa yesinqumo sikaMengameli uRamaphosa sokuqoka uMehluleli
  uZondo njengenhloko yabehluleli yize esesalelwe yiminyaka emibili vo ngenxa yokukhula
  kwakhe.\u201d\\nLo mthombo uthi kunede kwavela lokho zase ziba zimbili izizathu
  ebezingabekwa ukuvimba uMadondo zombili ezincike kuzinsolo zokucwasa. Isizathu sokuqala
  yizinsolo zokuthi uMadondo wake wanukeka ekucwaseni amaNdiya. Kepha esibonakale
  ngokusho komthombo yileso esilumbanisa uMadondo nezinsolo zokucwasa abathandana
  bebulili obufanayo. \u201cLokhu kubukeke kulula ngoba nguye uMadondo ozibhalele
  yena, ngeke akuphike okubhalwe nguye ebhukwini lakhe,\u201d kusho umthombo.\\nKwelokucwasa
  amaNdiya uMnquhe wasolwa ngokuphawula kwakhe ngomlingane wakhe owabe eyiNhloko YaBehluleli
  uMehluleli uPatel. Kulolu daba uMadondo wathi uPatel kwabe kungamele abe ngumengameli
  wabehluleli KwaZulu-Natal ngoba amaNdiya awacindezelekanga njengaboHlanga.\\n\u201cKuyaphaphalazeka.
  Engangikusho, ngokwezibalo zabantu, angiboni kanjalo. Okwesibili, buningi ubunzima
  phakathi kwabantu abahlupheka. Umuntu oqhamuka kolunye uhlanga ngeke abe sesimweni
  sokuqonda lezi zinhlupheko ngendlela efana nengiziqonda ngayo. Yilokho engangikusho.
  Hhayi ngoba engumNdiya,\u201d kusho uMnquhe.\\nOnguSomlomo wePhalamende uNkk uKaMapisa
  Nqakula wayengagayelwe mphako edudula uMadondo namsola ngokucwasa.\\n\u201cAnginankinga
  nomehluleli ozohlala lapha asekele futhi aqhube uhlangothi oluthile lwenkolo eyodwa
  njengoba sonke sinoMthethosisekelo okhuluma ngeNingizimu Afrika njengombuso angamile
  enkolweni thizeni. Ngihleli lapha ngicabanga ukuthi ngolunye usuku kuzokwenzakalani
  mhla wethulelwa icala elibandakanya ukuhlangana kwababobulili obufanayo. Bazokhululeka
  kanjani futhi baluveze kanjani udaba ngaphambi kukaMehluleli owabhala incwadi echaza
  ubunjalo babo bocansi njengalobo obunobudimoni? Ukungababakezeleli kwakho kucace
  bha, futhi iNingizimu Afrika kufanele ingakuvumeli lokho kwenzeke ngowezi-2022\u201d,
  kubeka uKaMahisa nophethe ngelithi: \u201cOkokugcina, Mehluleli uyabacwasa abobubulili
  obufanayo. Yileso sitatimende engifuna ukusibeka. Ngaphandle kokunanaza uyabacwasa
  abobulili obufanayo futhi akukholeki ukuthi kuyenzeka ngowezi-2022, Ngenzela ukuthi
  kuqoshwe lokhu.\u201d\\nAbeJudges Matter nabo baphawulile ngalokhu bamlahla uMadondo.
  Bathe: \u201cSithola isinyathelo sakhe siyinkinga enkulu, ikakhulukazi ekubeleseleni
  kwakhe ukuthi kungakhona phakathi kwemibono engowaseMaqungebeni nemibono yakhe njengoMehluleli.
  Njengakomishana abaningi bekucacisile, u-Athekili 7 wokuziphatha ngobulungiswa ufuna
  abehluleli bezihlusile ekuphawuleni noma ekuziphatheni okuqhakambisa ukukhipha inyumbazana.\\n\u201cLolu
  wudaba ngempela iKomidi Lokuziphatha Kwezobulungiswa elizoluphenya futhi kunengcuphe
  yokuthi angatholwa enecala ikakhulukazi uma kubhekwa ukuthi okusanda kutholwa lapho
  uMehluleli Omkhulu uMogoeng Mogoeng watholakala enecala kokuncane kunalokhu.\\nOkunye
  okuvezwe wumthombo wukuthi uMadondo uyasoleka ezimpini zangaphakathi kuKhongolose.
  Kukhona abamsola \u201cngokuma neNkandla\u201d okunguMnu uZuma. Kanti abanye bathi
  mhla kunecala elabe lithinta uMnu uSenzo Mchunu noKhongolose uhlangothi oluthile
  lukaMchunu lwabe \u201clungapheli kuMadondo\u201d. Lokhu elaboHlanga alikwazanga
  ukukuqinisekisa.\\nUMadondo uziphendulele kulokhu embhalweni awuthumele kwelaboHlanga.\"",
  "\"IPorsche 911, ekuqaleni eyayibizwa nge-901, yavela ngo-1967 futhi yayitholakala
  ngokulungiswa komzimba okuningi, kufaka phakathi okuhlukile kweTarga. ITarga ingathengwa
  ngokukhethwa kwezinjini ezine, kukhiqizwa amandla amahhashi aphakathi kuka-130 no-160
  njengamanye amamodeli afakwe ochungechungeni lwango-1967.\\nLe modeli ifike nophahla
  olususekayo nesikrini sangemuva esithambile.\\nUmsebenzi wethu: Imoto yangempela
  yazalwa ngenxa yemodeli.\\nUmbono wethu: Vumela amakhasimende aqhubeke nokusidumisa.\\nUmoya
  wethu: Vumela abasebenzi baqhubeke nokusebenza ngokujabula.\\nIfilosofi yethu: Kuhlala
  kunendawo ye-WIN-WIN futhi alikho ibhizinisi elingaxoxwa ngalo.\"", "\"Yini edingekayo
  ukuze ube umyeni omuhle?\\nOwesifazane angaba kanjani umfazi ophumelelayo?\\nYini
  ehilelekile ekubeni umzali omuhle?\\nIzingane zingasiza kanjani ekwenzeni ukuphila
  komkhaya kujabulise?\\n1. Yini eyokwenza ukuphila komkhaya kujabulise?\\nUJEHOVA
  UNKULUNKULU ufuna ukuphila komkhaya wakho kujabulise. IZwi lakhe, iBhayibheli, lineziqondiso
  zelungu ngalinye lomkhaya, ezichaza indima uNkulunkulu afuna ngamunye ayifeze. Uma
  bonke ekhaya befeza izindima zabo ngokuvumelana neseluleko sikaNkulunkulu, kuba
  nemiphumela emihle kakhulu. UJesu wathi: \u201cBayajabula abezwa izwi likaNkulunkulu
  baligcine!\u201d\u2014Luka 11:28.\\n2. Yini okufanele siyiqaphele ukuze umkhaya
  ujabule?\\n2 Ngokuyinhloko injabulo yomkhaya incike ekuqapheleni kwethu ukuthi umkhaya
  wasungulwa uJehova, lowo uJesu ambiza ngokuthi \u2018uBaba wethu.\u2019 (Mathewu
  6:9) Yonke imikhaya emhlabeni ikhona ngenxa kaBaba wethu wasezulwini\u2014futhi
  wazi kahle ukuthi yini eyenza imikhaya ijabule. (Efesu 3:14, 15) Ngakho, lifundisani
  iBhayibheli ngendima yelungu ngalinye lomkhaya?\\nUMKHAYA WASUNGULWA UNKULUNKULU\\n3.
  IBhayibheli lisichaza kanjani isiqalo somkhaya wabantu, futhi sazi kanjani ukuthi
  elikushoyo kuyiqiniso?\\n3 UJehova wadala abantu bokuqala, u-Adamu no-Eva, wabahlanganisa
  njengendoda nomfazi. Wababeka ekhaya elihle eliyipharadesi lasemhlabeni\u2014insimu
  yase-Edene\u2014wabe esethi ababe nezingane. Wathi: \u201cZalani nande nigcwalise
  umhlaba.\u201d (Genesise 1:26-28; 2:18, 21-24) Lokhu akuyona insumansumane noma
  inganekwane, ngoba uJesu wabonisa ukuthi kuyiqiniso lokho okushiwo uGenesise ngesiqalo
  sokuphila komkhaya. (Mathewu 19:4, 5) Nakuba sibhekana nezinkinga eziningi futhi
  nokuphila kwamanje kuhlukile kulokho uNkulunkulu ayekuhlosile, masibone ukuthi kungani
  umkhaya ungaba nayo injabulo.\\n4. (a) Ilungu lomkhaya ngalinye linganikela kanjani
  enjabulweni yomkhaya? (b) Kungani ukufunda ngokuphila kukaJesu kubaluleke kangaka
  enjabulweni yomkhaya?\\n4 Ilungu ngalinye lomkhaya lingasiza ekwenzeni ukuphila
  komkhaya kujabulise ngokulingisa uNkulunkulu ekuboniseni uthando. (Efesu 5:1, 2)
  Kodwa singamlingisa kanjani uNkulunkulu, njengoba singamboni nakumbona? Singayifunda
  indlela uJehova enza ngayo izinto ngoba wathumela iNdodana yakhe eyizibulo emhlabeni
  isuka ezulwini. (Johane 1:14, 18) Lapho isemhlabeni, le Ndodana, uJesu Kristu, yamlingisa
  kahle kakhulu uYise wasezulwini kangangokuthi ukuyibona nokuyilalela kwakufana nokubona
  uJehova nokumuzwa. (Johane 14:9) Ngakho-ke, ngokufunda ngothando uJesu alubonisa
  nangokulandela isibonelo sakhe, ngamunye wethu angasiza ekwenzeni ukuphila komkhaya
  kujabulise.\\nISIBONELO SAMADODA\\n5, 6. (a) Indlela uJesu aliphatha ngayo ibandla
  iwabekela siphi isibonelo amadoda? (b) Yini umuntu okumelwe ayenze ukuze athethelelwe
  izono?\\n5 IBhayibheli lithi amadoda kufanele aphathe omkawo ngendlela efanayo naleyo
  uJesu aphatha ngayo abafundi bakhe. Cabanga ngalesi siqondiso seBhayibheli: \u201cMadoda,
  qhubekani nithanda omkenu, njengoba nje noKristu alithanda ibandla futhi wazinikela
  ngenxa yalo . . . Ngale ndlela, amadoda kufanele athande omkawo njengemizimba yawo
  siqu. Lowo othanda umkakhe uzithanda yena, ngoba akekho umuntu owake wazonda inyama
  yakhe; kodwa uyayondla futhi ayinakekele ngesisa, njengoba noKristu enza kulo ibandla.\u201d\u2014Efesu
  5:23, 25-29.\\n6 Uthando lukaJesu ngebandla labafundi bakhe luyisibonelo esiphelele
  emadodeni. UJesu \u201cwabathanda kwaze kwaba sekupheleni,\u201d wanikela ngokuphila
  kwakhe ngenxa yabo, yize babengaphelele. (Johane 13:1; 15:13) Ngokufanayo, amadoda
  ayanxuswa: \u201cQhubekani nithanda omkenu futhi ningabathukutheleli kakhulu.\u201d
  (Kolose 3:19) Yini eyosiza indoda ukuba isebenzise lesi seluleko, ikakhulukazi uma
  umkayo engenzi ngokuhlakanipha ngezinye izikhathi? Kufanele ikhumbule awayo amaphutha
  nalokho okumelwe ikwenze ukuze ithole intethelelo kaNkulunkulu. Kuyini lokho? Kumelwe
  ibathethelele abantu abayonayo, okuhlanganisa nomkayo. Yebo, nomkayo kufanele enze
  okufanayo. (Mathewu 6:12, 14, 15) Uyabona ukuthi kungani abanye beye bathi umshado
  ophumelelayo uwukuhlangana kwabantu ababili abathethelelayo?\\n7. Yini uJesu ayicabangela,
  ewabekela siphi isibonelo amadoda?\\n7 Amadoda kufanele futhi aphawule ukuthi uJesu
  wayebacabangela njalo abafundi bakhe. Wayecabangela nokungapheleli kwabo nezidingo
  zabo ezingokwenyama. Ngokwesibonelo, lapho bekhathele, wathi: \u201cWozani, nina
  nodwa, ngasese endaweni engenabantu niphumule kancane.\u201d (Marku 6:30-32) Abafazi
  nabo bafanelwe ukucatshangelwa. IBhayibheli libachaza \u2018njengezitsha ezibuthakathaka
  kakhudlwana,\u2019 lezo amadoda ayalwa ukuba \u2018azazise.\u2019 Ngani? Ngoba kokubili
  amadoda nabafazi \u2018banomusa ongafanelwe wokuphila\u2019 olinganayo. (1 Petru
  3:7) Amadoda kufanele akhumbule ukuthi ukwethembeka yiko okwenza umuntu abe yigugu
  kuNkulunkulu, hhayi ukuthi ungowesilisa noma ungowesifazane.\u2014IHubo 101:6.\\n8.
  (a) Kungani kuthiwa indoda \u2018ethanda umkayo izithanda yona\u2019? (b) Ukuba
  \u201cnyamanye\u201d kusho ukuthini endodeni nakumkayo?\\n8 IBhayibheli lithi indoda
  \u2018ethanda umkayo izithanda yona.\u2019 Lokhu kubangelwa ukuthi indoda nomkayo
  \u201cabasebabili, kodwa sebenyamanye,\u201d njengoba kwasho uJesu. (Mathewu 19:6)
  Ngakho ubuhlobo bobulili kumelwe bugcine kubo kuphela. (IzAga 5:15-21; Hebheru 13:4)
  Lokhu kungenzeka uma bezikhathalela ngokungenabugovu izidingo zomunye nomunye. (1
  Korinte 7:3-5) Lesi sikhumbuzo sibalulekile: \u201cAkekho umuntu owake wazonda inyama
  yakhe; kodwa uyayondla futhi ayinakekele ngesisa.\u201d Amadoda kudingeka athande
  omkawo njengoba ezithanda wona, akhumbule ukuthi ayolandisa enhlokweni yawo, uJesu
  Kristu.\u2014Efesu 5:29; 1 Korinte 11:3.\\n9. Iyiphi imfanelo kaJesu evezwe kweyabaseFilipi
  1:8, futhi kungani amadoda kufanele ayibonise komkawo?\\n9 Umphostoli uPawulu wakhuluma
  \u2018ngothando lomzwelo uKristu Jesu analo.\u2019 (Filipi 1:8) Uthando lomzwelo
  uJesu ayenalo lwaluyimfanelo eqabulayo, eyakhanga abesifazane ababa abafundi bakhe.
  (Johane 20:1, 11-13, 16) Kanjalo nabafazi bayalulangazelela uthando lomzwelo lwabayeni
  babo.\\nISIBONELO SABAFAZI\\n10. UJesu ubabekela siphi isibonelo abafazi?\\n10 Umkhaya
  unjengenhlangano okudingeka ibe nenhloko ukuze izinto zihambe ngokushelela. Ngisho
  noJesu uneNhloko azithoba kuyo. \u201cNenhloko kaKristu nguNkulunkulu\u201d njengoba
  nje \u2018nenhloko yowesifazane kuyindoda.\u2019 (1 Korinte 11:3) Ukuzithoba kukaJesu
  ebunhlokweni bukaNkulunkulu kuyisibonelo esihle, njengoba sonke sinenhloko okumelwe
  sizithobe kuyo.\\n11. Isiphi isimo sengqondo okufanele umfazi asibonise kumyeni
  wakhe, futhi ukuziphatha kwakhe kungaba namuphi umphumela?\\n11 Amadoda angaphelele
  enza amaphutha futhi ngokuvamile awazona izinhloko zemikhaya ezikahle. Uma kunjalo,
  umfazi kufanele enzeni? Akufanele ajivaze umyeni wakhe noma azame ukumphuca ubunhloko
  bakhe. Kuhle umfazi akhumbule ukuthi ngokombono kaNkulunkulu, umoya onokuthula nobumnene
  ungowenani elikhulu. (1 Petru 3:4) Uma umfazi enomoya onjalo, kuyoba lula ukubonisa
  ukuzithoba okufunwa uNkulunkulu, ngisho nasezimweni ezinzima. Ngaphezu kwalokho,
  iBhayibheli lithi: \u201cUmfazi kufanele abe nenhlonipho ejulile ngomyeni wakhe.\u201d
  (Efesu 5:33) Kodwa kuthiwani uma indoda ingambheki uKristu njengenhloko yayo? IBhayibheli
  linxusa abafazi: \u201cZithobeni kubayeni benu, ukuze kuthi, uma bekhona abangalilaleli
  izwi, bazuzwe ngaphandle kwezwi ngokuziphatha kwabafazi babo, ngoba beye baba ofakazi
  bokuzibonela bokuziphatha kwenu okumsulwa kanye nenhlonipho ejulile.\u201d\u20141
  Petru 3:1, 2.\\n12. Kungani kungekubi ukuba umfazi aveze imibono yakhe ngenhlonipho?\\n12
  Kungakhathaliseki ukuthi umyeni wakhe ukholwa naye noma cha, umfazi usuke engadeleli
  uma ngokuhlakanipha eveza umbono wakhe ohlukile kowomyeni wakhe. Kungenzeka ukuthi
  umbono wakhe yiwo olungile, futhi wonke umkhaya ungazuza uma indoda imlalela. Nakuba
  u-Abrahama engavumanga lapho umkakhe, uSara, eveza ikhambi elihle lenkinga ethile
  yomkhaya, uNkulunkulu wamtshela: \u201cLalela izwi lakhe.\u201d (Genesise 21:9-12)
  Yebo, lapho indoda yenza isinqumo sokugcina esingangqubuzani nomthetho kaNkulunkulu,
  umkayo uyazithoba, asisekele.\u2014IzEnzo 5:29; Efesu 5:24.\\n13. (a) UThithu 2:4,
  5 unxusa abesifazane abashadile ukuba benzeni? (b) Lithini iBhayibheli ngokuhlala
  ngokwahlukana nesehlukaniso?\\n13 Uma umfazi efeza indima yakhe, kukhulu angakwenza
  ekunakekeleni umkhaya wakhe. Ngokwesibonelo, iBhayibheli libonisa ukuthi abesifazane
  abashadile kufanele \u201cbathande abayeni babo, bathande abantwana babo, babe abahluzekile
  engqondweni, abamsulwa, abasebenzayo ekhaya, abahle, abazithobayo kubayeni babo.\u201d
  (Thithu 2:4, 5) Umfazi ongumama owenza ngale ndlela uyozuza uthando nenhlonipho
  ehlala njalo emkhayeni wakhe. (IzAga 31:10, 28) Nokho, njengoba umshado uhlanganisa
  abantu ababili abangaphelele, ezinye izimo ezibucayi zingaholela ekuhlaleni ngokwahlukana
  noma esehlukanisweni. IBhayibheli liyakuvumela ukuhlala ngokwahlukana ngaphansi
  kwezimo ezithile. Kodwa ukuhlala ngokwahlukana akufanele kuthathwe kalula, ngoba
  iBhayibheli liyeluleka: \u201cUmfazi angamuki kumyeni wakhe; . . . futhi indoda
  akufanele imshiye umkayo.\u201d (1 Korinte 7:10, 11) Kanti kulapho indoda noma umfazi
  efebile kuphela lapho kungaba nesizathu esingokomBhalo sesehlukaniso.\u2014Mathewu
  19:9.\\nISIBONELO ESIPHELELE SABAZALI\\n14. UJesu wabaphatha kanjani abantwana,
  futhi yini abantwana abayidingayo kubazali?\\n14 UJesu wabekela abazali isibonelo
  esiphelele endleleni aphatha ngayo abantwana. Lapho abanye bezama ukuvimba abantwana
  bangezi kuye, wathi: \u201cBayekeni abantwana beze kimi; ningazami ukubavimba.\u201d
  IBhayibheli lithi wabe \u2018esebasingatha abantwana wababusisa, ebabeka izandla.\u2019
  (Marku 10:13-16) Njengoba uJesu achitha isikhathi nabantwana, akufanele yini nawe
  uchithe isikhathi namadodana namadodakazi akho? Abadingi isikhashana nje esincane,
  badinga isikhathi esiningi. Kudingeka ube nesikhathi sokubafundisa, ngoba yilokho
  uJehova athi abazali mabakwenze.\u2014Duteronomi 6:4-9.\\n15. Yini abazali abangayenza
  ukuze bavikele abantababo?\\n15 Njengoba leli zwe liya liba libi, abantwana badinga
  abazali abazobavikela kubantu abafuna ukubalimaza, njengalabo abangabahlukumeza
  ngokobulili. Cabanga ngendlela uJesu abavikela ngayo abafundi bakhe, labo ayebabiza
  ngothando ngokuthi \u201cabantwanyana.\u201d Ngesikhathi eboshwa futhi esezobulawa,
  uJesu wabalungisela indlela yokuphunyuka. (Johane 13:33; 18:7-9) Njengomzali, kudingeka
  uqaphele imizamo kaDeveli yokulimaza abantabakho. Kudingeka ubaxwayise kusengaphambili.
  * (1 Petru 5:8) Ukuphepha kwabo ngokwenyama, ngokomoya nangokuziphatha akukaze kube
  sengozini enkulu kangaka ngaphambili.\\n16. Yini abazali abangayifunda endleleni
  uJesu akusingatha ngayo ukungapheleli kwabafundi bakhe?\\n16 Ngobusuku bangaphambi
  kokufa kukaJesu, abafundi bakhe babephikisana ngokuthi ubani omkhulu phakathi kwabo.
  Kunokuba abathukuthelele, ngothando uJesu waqhubeka ebafinyelela izinhliziyo ngamazwi
  nangesibonelo. (Luka 22:24-27; Johane 13:3-8) Uma ungumzali, ingabe uyabona ukuthi
  ungasilandela kanjani isibonelo sikaJesu endleleni oqondisa ngayo izingane zakho?
  Yiqiniso, ziyakudinga ukuyalwa, kodwa kufanele uziyale \u201cngezinga elifanelekile\u201d
  futhi ungathukuthele. Akufanele uphahluke \u201cnjengokuhlaba kwenkemba.\u201d (Jeremiya
  30:11; IzAga 12:18) Isiyalo kufanele usikhiphe ngendlela ezokwenza ukuba ingane
  yakho ibone kamuva ukuthi besifanelekile.\u2014Efesu 6:4; Hebheru 12:9-11.\\nISIBONELO
  SABANTWANA\\n17. UJesu wababekela ngaziphi izindlela abantwana isibonelo esiphelele?\\n17
  Ingabe abantwana bangafunda kuJesu? Yebo, bangafunda! Ngesibonelo sakhe, uJesu wabonisa
  indlela abantwana okufanele babalalele ngayo abazali babo. Wathi: \u2018Ngikhuluma
  njengoba nje uBaba angifundisa.\u2019 Wanezela: \u201cNgaso sonke isikhathi ngenza
  izinto ezimjabulisayo.\u201d (Johane 8:28, 29) UJesu wayemlalela uYise wasezulwini,
  futhi iBhayibheli litshela abantwana ukuba balalele abazali babo. (Efesu 6:1-3)
  Nakuba uJesu ayeyingane ephelele, wabalalela abazali bakhe ababengaphelele, uJosefa
  noMariya. Ngokuqinisekile lokho kwaba nomthelela enjabulweni yomuntu ngamunye kubo
  kaJesu!\u2014Luka 2:4, 5, 51, 52.\\n18. Kungani uJesu ayemlalela ngaso sonke isikhathi
  uYise wasezulwini, futhi obani abajabulayo uma izingane zilalela abazali bazo namuhla?\\n18
  Ingabe izingane zingazibona izindlela ezingalingisa ngazo uJesu, zijabulise abazali
  bazo? Yiqiniso, ngezinye izikhathi izingane zingase zikuthole kunzima ukulalela
  abazali bazo, kodwa yilokho uNkulunkulu afuna ukuba izingane zikwenze. (IzAga 1:8;
  6:20) UJesu wamlalela ngaso sonke isikhathi uYise wasezulwini, ngisho nasezimweni
  ezinzima. Ngesinye isikhathi lapho intando kaNkulunkulu iwukuba uJesu enze okuthile
  okunzima kakhulu, uJesu wathi: \u201cSusa le ndebe [imfuneko ethile] kimi.\u201d
  Noma kunjalo, uJesu wenza lokho uNkulunkulu ayekufuna, ngoba waqaphela ukuthi uYise
  wazi kangcono. (Luka 22:42) Ngokufunda ukulalela, izingane ziyobajabulisa kakhulu
  abazali bazo kanye noYise wasezulwini. *\u2014IzAga 23:22-25.\\n19. (a) USathane
  uzilinga kanjani izingane? (b) Imuphi umphumela ukuziphatha kabi kwezingane okungaba
  nawo kubazali?\\n19 UDeveli walinga uJesu, futhi singaqiniseka ukuthi uyozilinga
  izingane ukuba zenze okungalungile. (Mathewu 4:1-10) USathane uDeveli usebenzisa
  ukucindezela kontanga, okungaba nzima ukumelana nakho. Yeka ukuthi kubaluleke kanjani-ke
  ukuba izingane zingazihlanganisi nabenzi bokubi! (1 Korinte 15:33) Indodakazi kaJakobe,
  uDina, yayilokhu izihlanganisa nabantu ababengamkhulekeli uJehova, futhi lokho kwaholela
  enkingeni enkulu. (Genesise 34:1, 2) Cabanga indlela umkhaya ongaphatheka kabi ngayo
  uma ilungu lawo lingaziphatha kabi ngokobulili!\u2014IzAga 17:21, 25.\\nISIHLUTHULELO
  SENJABULO YOMKHAYA\\n20. Ukuze ukuphila komkhaya kujabulise, yini okumelwe ilungu
  lomkhaya ngalinye liyenze?\\n20 Kulula ukubhekana nezinkinga zomkhaya uma kusetshenziswa
  iseluleko seBhayibheli. Empeleni, ukusebenzisa leso seluleko kuyisihluthulelo senjabulo
  yomkhaya. Ngakho madoda, thandani omkenu, nibaphathe ngendlela uJesu aphatha ngayo
  ibandla lakhe. Bafazi, zithobeni ebunhlokweni babayeni benu, nilandele isibonelo
  somfazi okhuthele ochazwe encwadini yezAga 31:10-31. Bazali, qeqeshani abantwana
  benu. (IzAga 22:6) Bobaba, \u2018yengamelani imikhaya yenu ngendlela enhle.\u2019
  (1 Thimothewu 3:4, 5; 5:8) Nani bantwana, lalelani abazali benu. (Kolose 3:20) Akekho
  umuntu ophelele ekhaya ngoba bonke bayawenza amaphutha. Ngakho zithobeni, nicele
  intethelelo komunye nomunye.\\n21. Isiphi isikhathi esimangalisayo esibheke kuso,
  futhi singakwenza kanjani ukuphila komkhaya kujabulise ngisho kwamanje?\\n21 Ngempela,
  iBhayibheli linezeluleko neziqondiso eziningi ezibalulekile ngokuphathelene nokuphila
