  sezicwiyiwe zadephunwa kwaba amagebedu. Beningenike nankake amaSonto okungenani
  abefundisi namabandla abo bakhonzele khona kunokucekela phansi ngaloluhlobo.\\nEnye
  inkinga yilena yezimpi zezigodi esifune ukuqala phansi laphaya kuMuziwabantu endaweni
  yakwaMachi. Sikhuluma nje izingane sezifunda zigadwe yizinduna nezinsizwa zendawo
  laphaya esikoleni iSiyaphambili High School ngenxa yezimpi zezigodi. Lapha ngenhla
  kwethu kwavalwa isibhedlela sofuba iDunstan Farrel Hospital kwaSANTA ngoba kuthiwa
  sesigugile. Uyazi umsebenzi walohulumeni ungathi ukuvala nje adlule. Uma isibhedlela
  sigugile akwakhiwa ngani esinye phela ngoba isidingo sona sikhona asigugile. Ngenxa
  yalolunya lokuvala abantu balendawo balahlekelwa yimisebenzi yona belu lena evele
  ingekho.\\nIyacela imiphakathi yalesifunda soGu Mhlonishwa Somlomo. Kuyahlushekwa
  uma abadinga usizo lwamahovisi akwaSocial Development kufanele bafinyelele kuwona.
  AbaseMdoni kudinga baye eMzinto ngoba kawekho asemakhaya kanzima. AbaseMzumbe kudinga
  baye oThuthwini. AbaseMuziwabantu kudinga baye eHarding. Angithi-ke sikhuluma ngosizo
  olusuke ludingwa ngabantu abantula ngempela abasuke beye kofaka zona izicelo zokondliwa
  kodwa kufanele bakhokhe ukuze bafinyelele esicelweni. Lamahovisi mawasondezwe eduze
  kwabantu abawadingayo.\\nNansi enye inkinga Mhlonishwa Somlomo. Izinkantolo zaMakhosi
  azinakiwe. Ngempela kuthiwa amaKhosi nemikhandlu yawo kawasebenze kanjani uma ezinkantolo
  kuzoba sehlathini ngaloluhlobo. Lokhu kwehlisa isithunzi sendawo yenkosi, kwehlise
  isithunzimseNkosi kanye nesomphakathi wendawo.\\nNisebenzile-ke nasibizela laba
  enibakhohlisayo nanikeza bona bodwa itransport ngoba yibo kanye esidinga ukukhuluma
  nabo sibakhulule kulobu bugqila enibafake kubona. Hayi, laba enibagabhe ngezinto
  zokuhamba vele abazidingi lezinkulumo bayalwazi udaba.\\nEgameni likaMhlonishwa
  uBaba uHlabisa, siyathokoza Somlomo.\"", "\"V. Umuntu Kufanele Afakaze Ngephuzu
  Leqiniso Mayelana Nomahluko Phakathi Komsebenzi KaNkulunkulu Wokwahlulela Ezinsukwini
  Zokugcina kanye Nomsebenzi Wakhe Wokusindisa Ngenkathi Yomusa\\n1. Yini umehluko
  phakathi kwamagama akhulunywe yiNkosi uJesu Ngenkathi Yomusa kanye namagama akhulunywe
  uNkulunkulu uSomandla Ngenkathi Yombuso?\\nIzikhombo Zamavesi EBhayibheli:\\n\u201cPhendukani:
  ngoba umbuso wezulu ususondele\u201d (UMathewu: 4:17).\\n\u201cWayesevula ukuqonda
  kwabo, ukuze baqonde imibhalo, wayesethi kubo, Kulotshwe kanje, futhi kanjalo kumele
  uKristu ahlupheke, futhi avuke kwabafileyo ngosuku lwesithathu: Nokuthi ukuphenduka
  nokuthethelelwa kwezono kufanele kushunyayelwe egameni Lakhe ezizweni zonke, kuqalwe
  eJerusalema\u201d (ULuka 24:45-47).\\n\u201cNgisenezinto eziningi engingazisho kini,
  kodwa ningekwazi ukuzithwala manje. Noma kunjalo, uma esefikile yena, uMoya weqiniso,
  uzoniholela kulo lonke iqiniso: ngoba akazukuzikhulumela, kodwa lokho azokuzwa,
  uzokusho: futhi uzonikhombisa okuzayo\u201d (Johane 16:12-13).\\n\u201cFuthi uma
  umuntu ezwa amazwi Ami, angakholwa, angimahluleli: ngoba angizile ukuzokwahlulela
  umhlaba, kodwa ukusondisa umhlaba. Lowo ongalayo, futhi angamukeli amazwi Ami, unalowo
  omehlulelayo: izwi engilikhulumile, yilo eliyomahlulela osukwini lokugcina\u201d
  (UJohane 12:47\u201448).\\nAmazwi KaNkulunkulu Abalulekile:\\nUmsebenzi kaJesu wawumayelana
  nokuhlengwa komuntu kanye nokubethelwa Kwakhe kuphela. Ngakho, sasingekho isidingo
  sokuba asho amazwi amaningi ukuze anqobe umuntu. Okuningi kwalokho akufundisa umuntu
  kwakuthathwe emiBhalweni futhi ngisho nomsebenzi Wakhe awuzange udlulele ngale kwemiBhalo,
  kunalokho Wakwazi ukufeza umsebenzi wokubethelwa. Umsebenzi Wakhe wawungekho mayelana
  nezwe, noma ukunqoba isintu, kodwa wawumayelana nokuhlenga isintu. Waba njengomnikelo
  wesono wesintu, futhi akazange abe njengomthombo wezwi esintwini. Akazange enze
  umsebenzi wabeZizwe, okwakuwumsebenzi wokunqoba isintu, kunalokho wenza umsebenzi
  wokubethelwa, umsebenzi owawenziwa yilabo ababekholwa ukuthi kunoNkulunkulu. Nakuba
  umsebenzi Wakhe wenziwa ngaphezu kwesisekelo semiBhalo, wasebenzisa lokho okwakubikezelwe
  ngabaprofethi abadala ukuze alahle abaFarisi, lokhu kwakwanele ekuqedeni umsebenzi
  wokubethelwa. Ukuba umsebenzi wanamuhla ubusenziwa ususelwa kulokho okwabikezelwa
  ngabaprofethi bakudala emiBhalweni, bekuyoba yinto engenakwenzeka ukuninqoba, ngoba
  iTestamente Elidala alisho lutho ngokungalaleli kwenu nezono zenu maShayina, awukho
  umlando wezono zenu. Ngakho-ke, ukuba lo msebenzi usekhona eBhayibhelini, beningeke
  nehlele ngezansi. Kuncane iBhayibheli elisitshela khona ngama-Israyeli, lowo ongakwazi
  ukuhlukanisa phakathi kowenza okubi noma okuhle noma ukunahlulela. Ake nicabange
  ukube bekufanele nginahlulele ngokomlando wama-Israyeli\u2014beniyoqhubeka ningilandele
  njengoba nenza namuhla? Ingabe niyazi ukuthi nilukhuni kangakanani? Uma engekho
  amazwi akhulunywa phakathi nalesi sigaba, kusho ukuthi umsebenzi wokunqoba ubungeke
  uphele. Ngenxa yokuthi angizelanga ukuzobethelwa esiphambanweni, kumele ngikhulume
  amazwi angahlangene neBhayibheli ukuze ninqotshwe.\\nKucashunwe \u201cUmbono Womsebenzi
  KaNkulunkulu (1)\u201d encwadini ethi Izwi Livela Lisenyameni\\nAke sibheke ingxenye
  ngayinye \u201cyeNtshumayelo yaseNtabeni\u201d Ingabe konke lokhu kumayelana nani?
  Kungashiwo ngesiqiniseko ukuthi konke lokhu kuphakeme, kuliqiniso, futhi kusondelene
  nezimpilo zabantu uma uqhathanisa nemibandela yeNkathi Yomthetho. Uma sikhuluma
  ngolimi lwamanje, kuyahambisana nendlela abantu abaphila ngayo.\\nAke sifunde okuqukethwe
  yilokhu okulandelayo: Kumele ukuqonde kanjani ukubusiseka? Yini okumele uyazi ngomthetho?
  Kumele ichazwe kanjani intukuthelo? Kumele senzenjani mayelana nokuphinga? Kuthiwani,
  futhi imithetho enjani ehambisana nesahlukaniso, ubani ongahlukanisa? Kuthiwani
  ngezifungo, iso ngeso, thanda izitha zakho, isifundiso ngokunikela? Kanye nokunye.
  Zonke lezi zinto zihambisana nayo yonke ingxenye yemikhuba yenkolelo yesintu kuNkulunkulu,
  kanye nokulandela kwabo uNkulunkulu. Eminye yale mikhuba isenziwa nanamuhla, ayimihle
  futhi ayisona isidingo kubantu. Kungamaqiniso abantu abahlangabezana nawo ngenkolelo
  yabo kuNkulunkulu. Kusukela ngesikhathi iNkosi uJesu iqala ukusebenza, Yayisiqalile
  ukusebenza ngesimo sempilo yabantu, kodwa yayisuselwa esisekelweni semithetho. Ingabe
  izimiso kanye nokushiwo kulezi zihloko zazihambisana yini neqiniso? Impela kunjalo!
  Yonke le migomo, izimiso ezidlule, kanye nentshumayelo yeNkathi Yomusa, ingabe kwakuhambisana
  yini nesimo sikaNkulunkulu kanye nalokhu anakho nayikho, kanjalo neqiniso futhi.
  Noma ngabe iyiphi into uNkulunkulu ayishoyo, noma ngabe uyisho kanjani, noma ngabe
  usebenzisa yiphi inhlobo yolimi, isesekelo sayo, umsuka wayo, kanye nalapho iqala
  khona, konke kususelwa emigomeni yesimo sikaNkulunkulu kanye nalokho anakho nayikho.
  Lokhu akunalo iphutha. Noma ngabe lezi zinto zibonakala zingenayo injula, kodwa
  ngeke uthi azinalo iqiniso, ngokuba kwakuyizinto ezazisemqoka kubantu ngeNkathi
  Yomusa ukuze kufezwe intando kaNkulunkulu kanye nokuzuza uguquko esimweni sempilo
  yabo. Ungasho yini uthi ezinye izinto entshumayelweni azihambisani neqiniso? Ngeke!
  Konke ngakunye kuyiqiniso ngoba konke kwakuyilokhu uNkulunkulu ayekudinga esintwini;
  konke kwakuyimigomo kanye nesilinganiso esasinikezwe nguNkulunkulu sokuthi kumele
  umuntu aziphathe kanjani, futhi zimele isimo sikaNkulunkulu. Nokho, kwakuncike ezingeni
  lokukhula kwabo ngaleso sikhathi, babekwazi ukuzamukela nokuqonda kuphela lezi zinto.
  Ngokuba isono sesintu sasingakaxazululeki, iNkosi uJesu yayikwazi ukusho la mazwi
  kuphela, futhi wayengasebenzisa kuphela lezi zifundiso ezilula ngaphakathi kwesilinganiso
  sokutshela abantu bangaleso sikhathi ukuba kumele baziphathe kanjani, kumele benzeni,
  nokuthi kumele bakholwe kanjani kuNkulunkulu futhi bahlangabezane nezidingo Zakhe.
  Konke lokhu kwakunqunyiwe kususelwa esiqwini sesintu ngaleso sikhathi. Kwakungelula
  kubantu ababephila ngaphansi komthetho ukuba bamukele lezimfundiso, ngakho iNkosi
  uJesu kwakumele ifundise ngaphakathi kwaleso silinganiso.\\nKucashunwe \u201cUmsebenzi
  KaNkulunkulu, Isimo SikaNkulunkulu, NoNkulunkulu Uqobo Lwakhe III\u201d encwadini
  ethi Izwi Livela Lisenyameni\\nAmagama akhulunywa uNkulunkulu kule nkathi ahlukile
  kunalawo akhulunywa ngeNkathi Yomthetho, ngakho-ke, nawo, ahlukile emazwini akhulunywa
  ngeNkathi Yomusa. NgeNkathi Yomusa, uNkulunkulu akawenzanga umsebenzi wezwi, kodwa
  wachaza ukubethelwa ukuze ahlenge bonke abantu. IBhayibheli lichaza kuphela ukuthi
  kungani uJesu kwakumele abethelwe, kanye nokuhlupheka okwakumele adlule kukho esiphambanweni,
  nokuthi umuntu kumele abethelwe kanjani ngenxa kaNkulunkulu. Ngale nkathi, wonke
  umsebenzi owenziwa uNkulunkulu wawugxile ekubethelweni. NgeNkathi Yombuso, uNkulunkulu
  osesimweni somuntu ukhuluma amazwi ukuze anqobe bonke abantu abakholwa kuYe. Leli
  \u201cyiZwi elivela enyameni;\u201d uNkulunkulu uze ngezinsuku zokugcina ukuze ezokwenza
  umsebenzi Wakhe, okungukuthi, uze ukuzoqedela ukubaluleka kweZwi elivela enyameni.
  Ukhuluma amazwi kuphela, futhi kumbalwa lapho kunamaqiniso khona. Le yiyona ingqikithi
  yeZwi elivela enyameni, futhi uma uNkulunkulu osesimweni somuntu ekhuluma amazwi
  Akhe, lokhu ukuvela kweZwi enyameni, futhi kuwuLizwi eliza enyameni. \u201cEkuqaleni
  kwakukhona uLizwi, futhi uLizwi wayenoNkulunkulu, futhi uLizwi wayenguNkulunkulu,
  futhi uLizwi waba yinyama.\u201d Lo (umsebenzi wokuvela kukaLizwi enyameni) umsebenzi
  uNkulunkulu azowuqeda ezinsukwini zokugcina, futhi yisahluko sokugcina sohlelo Lwakhe
  lonke lokuphatha, ngakho-ke uNkulunkulu kumele eze emhlabeni azoveza amazwi Akhe
  enyameni. Lokhu okwenziwe namuhla, lokhu okuzokwenziwa esikhathini esizayo, lokhu
  okuzofezwa nguNkulunkulu, isiphetho sokugcina somuntu, labo abazosindiswa, labo
  abazobhujiswa, njalo njalo\u2014lo msebenzi okumele ufezeke ekugcineni ubekwe wacaca,
  futhi wonke umi ngohlelo ukuze uqede ukubaluleka kwangempela kweZwi elivela enyameni.
  Izinqumo zokuphatha nomthetho-sisekelo okwakukhishiwe kuqala, labo abazobhujiswa,
  labo abazongena ekuphumuleni\u2014la mazwi onke kumele agcwaliswe. Lona ngumsebenzi
  omkhulu oqedelwe uNkulunkulu osesimweni somuntu ngesikhathi sezinsuku zokugcina.
  Wenza abantu baqonde ukuthi labo abahlelelwe uNkulunkulu kusengaphambili baya ngakuphi
  nokuthi labo abangamiselwanga kusengaphambili uNkulunkulu bona baya ngakuphi, ukuthi
  abantu Bakhe namadodana Akhe bazohlukaniswa kanjani, kuzokwenzekani ku-Israyeli,
  kuzokwenzekani eGibhithe\u2014esikhathini esizayo, wonke la mazwi azofezwa. Izinyathelo
  zomsebenzi kaNkulunkulu zinyusa isivinini. UNkulunkulu usebenzisa izwi njengendlela
  yokuveza kumuntu ukuthi yini okumele yenziwe inkathi ngayinye, yikuphi okumele kwenziwe
  nguNkulunkulu osesimweni somuntu wezinsuku zokugcina, kanye nenkonzo Yakhe okumele
  yenziwe, kanti wonke la mazwi enzelwe ukufeza ukubaluleka kwangempela kweZwi elivela
  enyameni.\\nKucashunwe \u201cKonke Kuyafezeka Ngezwi LikaNkulunkulu\u201d encwadini
  ethi Izwi Livela Lisenyameni\\nEngikushoyo namuhla ukwahlulela izono zabantu kanye
  nokungalungi kwabo, ukuqalekisa ukuhlubuka kwabantu. Ukukhohlisa nokugwegwa kwabo,
  kanye namazwi nezenzo zabo, zonke lezi zinto ezingahambisani nentando Yakhe kuzobhekana
  nokwahlulelwa, futhi ukuhlubuka kwabantu kuyalahlwa njengokuyisono. Ukhuluma ngokuvumelana
  nezimiso zokwahlulela, futhi uveza isimo Sakhe sokulunga ngokwahlulela ukungalungi
  kwabo, ukuqalekisa ukuhlubuka kwabo, futhi adalule bonke ubuso babo obubi.\\nKucashunwe
  \u201cIndlela Isinyathelo Sesibili Somsebenzi Wokunqoba Esithela Ngayo Izithelo\u201d
  encwadini ethi Izwi Livela Lisenyameni\\nUmsebenzi owenziwa nguNkulunkulu kule nkathi
  owokuhlinzeka ikakhulukazi amazwi empilo yomuntu, ukuvezwa ingqikithi yemvelo yomuntu
  kanye nesimo esonakalisiwe somuntu, ukususa kwemicabango yezenkolo, ukucabanga kwasemandulo,
  ukucabanga osekuphelelwe isikhathi, kanye nolwazi namasiko omuntu. Konke lokhu kufanele
  kunekwe obala futhi kuhlanzwe ngamazwi kaNkulunkulu. Ezinsukwini zokugcina, uNkulunkulu
  usebenzisa amazwi, hhayi izimpawu nezimangaliso, ukuphelelisa umuntu. Usebenzisa
  amazwi akhe ukudalula umuntu, ukwehlulela umuntu, ukusola umuntu futhi nokuphelelisa
  umuntu, ukuze emazwini kaNkulunkulu, umuntu aze abone ukuhlakanipha nobuhle bukaNkulunkulu,
  futhi aze abone isimo sikaNkulunkulu, ukuze ngamazwi kaNkulunkulu, umuntu abone
  izenzo zikaNkulunkulu.\\nKucashunwe \u201cUkwazi Umsebenzi kaNkulunkulu Namhlanje\u201d
  encwadini ethi Izwi Livela Lisenyameni\\nUma kufika egameni elithi \u201cukwahlulela,\u201d
  uzocabanga amazwi akhulunywa nguJehova kuzo zonke izindawo futhi amazwi okusola
  ashiwo nguJesu kubaFarisi. Yize la mazwi ebuhlungu, akasikho ukwahlulela abantu
  okwenziwa uNkulunkulu;l ngamazwi kuphela akhulunywa nguNkulunkulu ezimweni ezahlukene,
  okusho ukuthi, ezindaweni nasezikhathini ezahlukene; futhi awafani namazwi akhulunywa
  nguKristu njengoba ahlulela abantu ezinsukwini zokugcina. Ezinsukwni zokugcina,
  uKristu usebenzisa amaqiniso anhlobonhlobo ukuze afundise abantu, adalule ubunjalo
  bomuntu, futhi acubungule amazwi kanye nezenzo zakhe. Lawa mazwi aqukethe amaqiniso
  anhlobonhlobo, njengomsebenzi womuntu, indlela umuntu okumele alalele uNkulunkulu
  ngayo, indlela umuntu okumele athembeke kuNkulunkulu ngayo, indlela umuntu okumele
  aphile ngayo ubuntu obujwayelekile, kanye nobuhlakani kanye nesimo sikaNkulunkulu,
  njalo njalo. Wonke la mazwi aqondiswe engqikithini yomuntu kanye nasesimweni sakhe
  esikhohlakele. Ikakhulukazi, lawo mazwi adalula ukuthi umuntu umala kanjani uNkulunkulu
  akhulunywa mayelana nokuthi ngakho okuphathelene nokuthi umuntu kungani umuntu eyisiqu
  sikaSathane futhi eyisitha sikaNkulunkulu. Ekwenzeni umsebenzi wakhe wokwahlulela,
  uNkulunkulu akenzi nje kucace imvelo yomuntu ngamazwana ambalwa; uyembula, abhekane,
  futhi athene esikhathini eside. Lezi zindlela zokwambula, ukubhekana, kanye nokuthena
  azikwazi ukushintshaniswa namagama avamile kodwa ngeqiniso umuntu angenalo nhlobo.
  Yizindlela zalolu hlobo kuphela okuthiwa ngukwahlulela; kungokwahlulela kohlobo
  olunje lapho umuntu engathotshiswa khona futhi enziwe akholwe ngokuphelele ukuba
  athobele uNkulunkulu, bese, ngaphezu kwalokho ezuza ulwazi oluyiqiniso ngoNkulunkulu.
  Okulethwa umsebenzi wokwahlulela ukuqonda komuntu ubuso bukaNkulunkulu beqiniso
  kanye neqiniso ngokuhlubuka kwakhe uqobo. Umsebenzi wokwahlulela wenza umuntu athole
  ukuqonda okuningi ngentando kaNkulunkulu, ngenjongo kaNkulunkulu, nezimfihlakalo
  ezingaqondakali kuye. Kuphinde kwenze umuntu abone futhi azi ubunjalo bakhe obukhohlakele
  kanye nomsuka wenkohlakalo yakhe, futhi aphinde akwazi ukubona ububi bomuntu. Le
  miphumela idalwa umsebenzi wokwahlulela, ngoba ingqikithi yalo msebenzi empeleni
  ingumsebenzi wokudalula iqiniso, indlela, kanye nempilo kaNkulunkulu kubo bonke
  abakholwa Kuye. Lo msebenzi ngumsebenzi wokwahlulela owenziwa nguNkulunkulu.\\nKucashunwe
  \u201cUKristu Wenza Umsebenzi Wokwahlulela Ngeqiniso\u201d encwadini ethi Izwi Livela
  Lisenyameni\\nENkathini Yombuso, uNkulunkulu usebenzisa izwi ukungenisa inkathi
  entsha, ukuguquka izindlela zomsebenzi Wakhe, nokwenza umsebenzi waso sonke isikhathi.
  Lesi yisimiso uNkulunkulu asebenza ngaso eNkathini Yezwi. be yinyama womuntu ukuze
  akhulume ngezindlela ezahlukene, ehlomisa umuntu ukuthi abone uNkulunkulu ngeqiniso,
  oyiZwi elivela enyameni, nangobuhlakani nezimangaliso Zakhe. Umsebenzi onjalo wenzelwe
  ukufinyelela kangcono emigomweni yokunqoba umuntu, yokumphelelisa, neyokumsusa.
  Lokhu kuwumqondo wangempela wokusebenzisa izwi ukuthi lisebenze ngeNkathi Yezwi.
  Ngezwi, umuntu ufinyelela ekwazini umsebenzi kaNkulunkulu, isimo siNkulunkulu, ingqikithi
  yomuntu nalokho umuntu afanele ukungena kukhona. Ngezwi, yonke imisebenzi uNkulunkulu
  afisa ukuyenza ngeNkathi Yezwi iyafezeka. Ngezwi, umuntu uyembulwa, uyasuswa abuye
  alingwe. Umuntu ulibonile izwi, walizwa, wabona nokuba khona kwezwi. Ngenxa yalokho,
  umuntu uyakholwa wubukhona bukaNkulunkulu; umuntu ukholwa ukuba namandla onke nobuhlakani
  bukaNkulunkulu, kanye nasenhliziyweni yothando lukaNkulunkulu kumuntu nesifiso Sakhe
  sokusindisa umuntu. Yize igama elithi \u201cizwi\u201d lisobala futhi livamile,
  izwi elivela emlonyeni kaNkulunkulu obe yinyama linyakazisa lonke izulu nomhlaba;
  izwi Lakhe liguqula inhliziyo yomuntu, imicabango nesimo sakhe esidala nokubukeka
  kwakudala komhlaba wonke. Kuyo yonke iminyaka, nguNkulunkulu wanamuhla kuphela osebenza
  ngale ndlela, futhi NguYe kuphela okhuluma futhi asindise umuntu ngale ndlela. Emva
  kwalokho, umuntu uhlala ngaphansi kokuqondiswa yizwi, eluswa futhi ehlinzekwa yizwi;
  bahlala emhlabeni wezwi, baphila phakathi kweziqalekiso nezibusiso zezwi likaNkulunkulu,
  ngaphezu kwalokho bahlala phansi kokwahlulela nokusola kwezwi. La mazwi nalo msebenzi
  kwenzelwe nje insindiso yomuntu, ukufezwa kwentando kaNkulunkulu, nokuguqula isimo
  semvelo somhlaba wendalo endala. UNkulunkulu wadala umhlaba ngezwi, uhola abantu
  emhlabeni wonke ngalo izwi, uyanqoba abuye abasindise ngezwi. Ekugcineni, uzosebenzisa
  izwi ukuqeda wonke umhlaba omdala. Kungaleso sikhathi-ke lapho uhlelo lokuphatha
  lizophelela khona.\\nKucashunwe \u201cINkathi Yombuso YiNkathi Yezwi\u201d encwadini
  ethi Izwi Livela Lisenyameni\\nNgaleso sikhathi, uJesu wenza umsebenzi omningi owawungaqondakali
  kubafundi Bakhe, futhi washo okuningi abantu abangakuqondanga. Lokhu kungenxa yokuthi,
  ngaleso sikhathi, wayenganiki ncazelo. Ngalokho, eminyakeni eminingi emva kokuhamba
  Kwakhe, uMathewu wakha uhlu lozalo Lwakhe, nabanye futhi benza umsebenzi omningi
  owentando yomuntu. UJesu akazelanga ukuzophelelisa nokuzuza umuntu kodwa ukuzokwenza
  isigaba esisodwa somsebenzi: wokuzoletha ivangeli lombuso wasezulwini nokuqedela
  umsebenzi wokubethelwa\u2014futhi lapho uJesu esebethelwe, umsebenzi Wakhe wafika
  ekugcineni. Kodwa kulesi sigaba\u2014umsebenzi wokunqoba\u2014maningi amazwi okumele
  akhulunywe, mningi umsebenzi okumele wenziwe futhi kumele kube nezinqubo eziningi.
  Kulindeleke okufanayo ngezimfihlakalo zomsebenzi kaJesu noJehova okumele zembulwe,
  ukuze bonke abantu babe nokuqonda nokucacelwa ekukholweni kwabo, ngoba lona umsebenzi
  wezinsuku zokugcina futhi izinsuku zokugcina ziwukuphela komsebenzi kaNkulunkulu,
  isikhathi sokuphela kwalo msebenzi. Lesi sigaba somsebenzi sizokukhanyisela umthetho
  kaJehova kanye nokuhlenga kukaJesu, futhi sibalulekile ukuze uqonde wonke umsebenzi
  kaNkulunkulu wohlelo lokuphatha lweminyaka eyizinkulungwane eziyisithupha, nokuthi
  wazise konke ukubaluleka kanye nengqikithi yale minyaka eyizinkulungwane eziyisithupha
  yohlelo lokuphatha ukuze futhi uqonde inhloso yawo wonke umsebenzi owenziwa nguJesu
  kanye namazwi awakhuluma, kanye ngisho nokukholwa kwakho nokuthanda kwakho iBhayibheli.
  Konke lokhu kuzokwenza ukuba ubone. Uzowuqonda umsebenzi owenziwe uJesu kanye nomsebenzi
  kaNkulunkulu namuhla; uzoliqonda futhi ulazi lonke iqiniso, ukuphila nendlela. Esigabeni
  somsebenzi owenziwa uJesu, kungani uJesu ahamba ngaphandle kokuqeda umsebenzi kaNkulunkulu?
  Kungenxa yokuthi isigaba somsebenzi kaJesu sasingewona umsebenzi wesiphetho. Lapho
  ebethelwa esiphambanweni, amazwi Akhe nawo afika ekugcineni; ngemva kokubethelwa
  Kwakhe, umsebenzi Wakhe wawusuqedwe ngokuphelele. Isigaba esikuso manje sihlukile:
  Kuyoba kuphela ngemva kokuba amazwi esekhulunywe kwaze kwaba sekugcineni nomsebenzi
  wonke kaNkulunkulu usuphothuliwe, lapho umsebenzi Wakhe uyoqedwa khona. Phakathi
  nesigaba sikaJesu somsebenzi, maningi amazwi agcina engashiwongo noma angaphiniyiswanga
  ngokugcwele. Kodwa uJesu akakhathazekanga ngalokho akusho noma angakushongo, ngoba
  inkonzo Yakhe kwakungeyona inkonzo yamazwi ngakho ngemva kokubethelwa esiphambanweni
  wahamba. Leso sigaba somsebenzi ikakhulu sasingenxa yokubethelwa, futhi asifani
  nhlobo nesigaba sanamuhla. Lesi sigaba somsebenzi ikakhulu simayelana nokuqedwa,
  ukucaciswa kanye nokufinyelelisa wonke umsebenzi esiphethweni. Uma amazwi engakhulunywanga
  kwaze kwaba sekupheleni kwawo, ngeke ibe khona indlela yokuphetha lo msebenzi ngoba
  kulesi sigaba somsebenzi wonke umsebenzi ufikiswa ekugcineni futhi ufezwa ngokusebenzisa
  amazwi. Ngaleso sikhathi, uJesu wenza umsebenzi omningi ongaqondakali kumuntu. Wahamba
  ngokuthula futhi namuhla baningi abangawaqondi amazwi Akhe, labo abanokuqonda okuyiphutha
  kodwa ababesakholwa ukuthi baneqiniso, abangazi ukuthi baphambukile. Ekugcineni,
  lesi sigaba sanamuhla sizofikisa umsebenzi kaNkulunkulu ekugcineni okuphelele, futhi
  silethe isiphetho sawo. Bonke bayoluqonda futhi balwazi kahle uhlelo lukaNkulunkulu
  lokuphatha. Imibono ekumuntu, izinhloso zakhe, ukuqonda kwakhe okuyiphutha, imicabango
  yakhe ngomsebenzi kaJehova noJesu, imibono yakhe ngokuqondene nabeZizwe, nakho konke
  okunye ukuphambuka namaphutha akhe kuyolungiswa. Umuntu uyoziqonda zonke izindlela
  ezifanele zokuphila nawo wonke umsebenzi owenziwe nguNkulunkulu nalo lonke iqiniso.
  Lapho lokhu kwenzeka, lesi sigaba somsebenzi sizophela.\\nKucashunwe \u201cUmbono
  Womsebenzi KaNkulunkulu (2)\u201d encwadini ethi Izwi Livela Lisenyameni\"", "\"Ukulahlekelwa
  Okudabukisayo kanye Nokulila Kwembulunga yonke\\nIQINISO-HLOLA ISIQINISEKISO\\nUkutsheka
  Kwezepolitiki\\n& Ithoni Yemizwa\\nI-athikili ayithathi hlangothi kwezombusazwe,
  igxile kuphela empilweni nasefa lika-Liam Payne ngaphandle kokuphawula kwezepolitiki.\\nKwenziwe
  kusetshenziswa ubuhlakani bokwenziwa.\\nIphimbo elingokomzwelo ngokuyinhloko libi,
  libonisa usizi nenhlekelele ezungeze ukufa okungazelelwe komdwebi.\\nKwenziwe kusetshenziswa
  ubuhlakani bokwenziwa.\\nKubuyekezwe:\\nFunda\\nU-Liam Payne, owake waba yinhliziyo
  ebuhlungu yebhendi yabafana eyisakhiwo sodumo Isiqondiso esisodwa, udlule kabuhlungu
  eneminyaka engu-31 kuphela ubudala. Lezi zindaba zivele ngo-Okthoba 16, 2024, zathumela
  ukushaqeka embonini yomculo nangale kwalokho. Ukushona okungazelelwe kukaPayne kulandela
  ukuwa kuvulandi I-Buenos Aires, e-Argentina - idolobha elidlangile ngomculo lapho
  ayehambe khona ukuyokweseka umngane wakhe kanye nalowo owayedlala naye eqenjini
  Niall Horan ekhonsathini. Isidumbu sakhe esingaphili satholwa egcekeni elingaphakathi
  lehhotela, senza ithunzi lemfihlakalo ngezimo eziholele kulesi sigameko esibuhlungu.\\nNjengoba
  abaphenyi besebenzela ukuhlanganisa okwenzeka ngalobo busuku benhlekelele, ukuthululwa
  kosizi kuye kwagubuzela labo ababemazi futhi bemthanda. Abalandeli emhlabeni wonke
  babhekene nalokhu kulahlekelwa kungazelelwe. Esitatimendeni somndeni esithinta imizwa,
  u-Payne akakhunjulwanga nje njengomculi onesiphiwo kodwa njengomuntu ongajwayelekile
  othonya lakhe lafinyelela kude. Bazwakalise ukudabuka kwabo okukhulu futhi bacela
  ubumfihlo ngenkathi beveza ukuthi uPayne uthole ukulimala kanzima okuholele ekopheni
  okubulalayo ngaphakathi.\\nIfa kanye nomthelela\\nUhambo luka-Liam lwaqala lapho
  eqala inhlolokhono ye-\u201cThe X Factor\u201d eneminyaka engu-14 kuphela. Ukuzimisela
  kwakhe kanye nethalente lakhe ekugcineni kwamholela ekujoyineni i-One Direction,
  lapho aba yingxenye yeqembu labafana eliphumelela kakhulu emlandweni. Iqembu lizuze
  udumo emhlabeni wonke ngamahithi anjengokuthi \u201cYini Ekwenza Ube Muhle\u201d
  kanye \u201cNendaba Yempilo Yami,\u201d athatha izinhliziyo zezigidi emhlabeni wonke.\\nNgemuva
  kokuthi i-One Direction ithathe ikhefu ngo-2016, u-Liam waqala umsebenzi wakhe eyedwa,
  ekhulula amathrekhi adumile afana ne-\\\"Strip That Down\\\" kanye \\\"ne-Bedroom
  Floor.\\\" Umsebenzi wakhe eyedwa wabonisa ukuguquguquka kwakhe njengeciko futhi
  wamenza waba abalandeli abazinikele. Ngaphandle komculo, uLiam wayaziwa ngemizamo
  yakhe yokupha abantu. Wayesekela izinhlangano eziningi ezisiza abampofu futhi wayethanda
  kakhulu izimbangela zezingane. Umusa wakhe nokuphana kwakhe kwashiya ithonya elihlala
  njalo kulabo ababemazi kanye nalabo ababemhlonipha bekude.\\nEkukhumbuleni u-Liam
  Payne, asihloniphi kuphela izimpumelelo zakhe zomculo kodwa nomoya wakhe - umoya
  okhuthaze abantu abaningi emhlabeni jikelele. Njengoba abalandeli beqhubeka nokwabelana
  ngezinkumbulo futhi begubha impilo yakhe, kuyacaca ukuthi ifa likaLiam lizohlala
  iminyaka ezayo.\\nJoyina ingxoxo!\"", "\"Usayizi Omkhulu Wangaphandle Wezithombe
  Zehhashi Lasebukhosini Elidonswa Ngenqola\\nSenze lokhu setha ikhasimende laseBeijing.Impahla
  iyithusi.Lesi sithombe esiqoshiwe sakhiwe ngezithombe eziqoshiwe zamahhashi amabili,
  izibalo eziyisishiyagalombili kanye nenqola yasebukhosini.Leli qoqo lezithombe likhulu
  kakhulu, lilungele ngaphandle, futhi libukeka lihle kakhulu.\\nIciko Lethu Lenza
  Imodeli Yobumba\\nAmaciko ethu angamamodeli anesipiliyoni seminyaka engaphezu kwe-10
  sokwenza amamodeli obumba.Abanye baze babe neminyaka engu-30 yokuhlangenwe nakho.\\nSingenza
  noma yiziphi izithombe eziqoshiwe ezenziwe ngokwezifiso.Singashintsha imodeli izikhathi
  ezingenamkhawulo kuze kube yilapho sithola ukwaneliseka kwakho.\\nQeda Ukufaka E-Beijing\\nUma
  uthanda noma udinga noma yimuphi umfanekiso, xhumana nathi manje!\"", "\"Besingenza
  kangcono - Jomo Sono\\n2011-10-31 10:31\\nJohannesburg - UJomo Sono uthi iJomo Cosmos
  bekumele iwathathe wonke amaphuzu ngesikhathi ibhekene ne-Orlando Pirates, kubika
