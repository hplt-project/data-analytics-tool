  kokwazi ezinye izindawo phesheya, nazo ezine ...\\nIC\u00f3rdoba, idolobha elinomlando
  omuhle ngemuva kwalo, iminyaka yokunqoba nokunqoba, nezinsalela zamanye amasiko,
  njenge ...\\nICordoba Fair iqala namuhla, ngoMeyi 21 futhi izohlala kuze kube ngoMgqibelo
  ozayo 28. Eyodwa nje ...\\nUma ngesonto eledlule sikulethele i-athikili ebekelwe
  izinto ezi-7 zamahhala ongazibona eSeville, namhlanje wena\u2026\\nNjengomuntu omuhle
  wase-Andalusi futhi emcimbini wokugubha uSuku lwe-Andalusia, kusasa umhla wama-28
  ku ...\"", "\"I-PU Roller yimikhiqizo yabalingisi.uma kuqhathaniswa nama-encapsulates
  avamile (ikakhulukazi i-raber ebhekisela kuyo), inamandla amakhulu omshini (irabha
  yemvelo izikhathi ezingu-2-3), ukumelana kahle nokugqokwa (irabha yemvelo izikhathi
  ezingu-5-10), ukumelana nokucindezelwa okuphuma phambili, ububanzi obuqinile, isenokuqina
  ubulukhuni obuphezulu(amanye amarabha awanazo izici ezinjalo), ukucwebezela okuphezulu,
  ukusebenza kahle komshini wokusebenza, ukunamathela kwayo kwensimbi kungcono kunokuvamile
  futhi kufaneleka kakhulu kujubane elithile lomugqa kanye nendawo yokucindezela okukhulu.\"",
  "\"Isifuba Somoya Sobuntwana\\nIsifuba somoya yisimo samaphaphu esivame kakhulu
  ezinganeni. I-Childhood Asthma yisimo sesikhathi eside esidala ukuthi ulwelwesi
  lwangaphakathi lendlela yomoya luvuvukale livuvuke futhi lukhiqize amafinyila amaningi.
  Kwenza nemisipha ezungeze imigwaqo yomoya iqine. Lapho lezi zinto zenzeka imigwaqo
  yethu yomoya iba mincane (ebizwa nge-bronchoconstriction) futhi sikuthola kunzima
  kakhulu ukuphefumula umoya uphume noma uphume emaphashini ethu.\\nI-Asthma yobuntwana
  ithinta cishe eyodwa kwezingane eziyi-11 e-UK - lokhu kufinyelela cishe Izingane
  eziyizigidi ezingama-1.1 ophila nalesi simo. Kuhlelo I-USA cishe izingane eziyizigidi
  eziyi-6.1 uphethwe yisifuba somoya.\\nAbantu banoma yibuphi ubudala bangaba nesifuba
  somoya. Kodwa-ke izimpawu zivame ukuvela okokuqala ngqa ebuntwaneni futhi imvamisa
  ngaphambi kwengane usuku lokuzalwa lwesihlanu.\\nKungenzeka ukuthi izimpawu ze-asthma
  yengane yakho zizothuthuka njengoba zikhula. Mayelana izingane ezimbili kwezintathu
  bathole ukuthi izimpawu zabo ziyanyamalala lapho sebethomba.\\nI-asthma yobuntwana
  ibangela futhi ibangele\\nAsazi kahle ukuthi yini ebangela i-asthma kepha mhlawumbe
  iyinhlanganisela yezemvelo futhi izici zofuzo. Izingane zinamathuba amaningi okuthuthukisa
  i-asthma uma:\\n- I-eczema noma i-allergies\\n- Yiba nesihlobo esiseduze esine-eczema
  noma i-allergies\\n- Bachayeke ngentuthu kagwayi (noma uma umama wabo evezwa intuthu
  kagwayi ngenkathi ekhulelwe)\\n- Zivezwe kokunye ukungcola kwemvelo\\n- Phila emphakathini
  owentulayo, ohola kancane - lokhu kungenzeka kubangelwe ukumanzi, izindlu ezikhuntile
  kanye nokungcola\\n- Abaphatheki kahle ngokutheleleka ngegciwane lokuphefumula -
  okungenani isigamu sezingane ezidinga ukuya esibhedlela ngegciwane lokuphefumula
  le-syncytial virus (RSV) kamuva ziba nesifuba somoya\\n- Unesisindo esiphansi lapho
  ezalwa.\\nEzinye izimbangela zenza izimpawu zesifuba somoya zibe nzima (zivuleke),
  imvamisa:\\n- Izifo zokuphefumula - imvamisa yigciwane\\n- Ukungezwani komzimba
  - ngokwesibonelo ukufaka indlu uthuli, impova (ie hay fever), ukudla, amaphela,
  izinhlamvu zesikhunta, izilwane nezilwane ezifuywayo kungadala i-asthma ebangelwa
  ukungezwani komzimba\\n- Intuthu kagwayi\\n- Ukungcola - njengokukhipha intuthu
  yemoto nokunye okucasulayo emoyeni\\n- Isimo sezulu esibi - siyashisa, siyabanda,
  sinomswakama noma siyaduma\\n- Ukuzivocavoca\\n- Ukucindezeleka nemizwelo enamandla
  njengokuzizwa uthukuthele kakhulu noma ujabule ngokweqile.\\nIzimbangela ziyinto
  yomuntu siqu futhi eyodwa noma eziningana zalezi zinto ezibangela ukuthi izimpawu
  zengane yakho zivele.\\nIzimpawu nezimpawu ze-asthma ezinganeni\\nIzimpawu ze-Asthma
  Yobuntwana zifaka:\\n- Ukukhwehlela - ikakhulukazi uma ukukhwehlela kuqhubeka noma
  kuqhubeka ukubuya\\n- Ukuqhuma - lokhu kuwumsindo wokushaya amakhwela lapho bephefumula\\n-
  Ukuphelelwa umoya\\n- Ukuqina kwesifuba.\\nIngane yakho ngeke ibe nezimpawu ngaso
  sonke isikhathi - kuya ngokuthi i-asthma yabo ilawulwa kahle noma ingalawuleki kangakanani,
  nokuthi ngabe bavezwa yini kunoma yiziphi izimbangela. Izimpawu zabo zingaba zimbi
  kakhulu ebusuku (kwesinye isikhathi kubizwa ngokuthi i-asthma yasebusuku) noma into
  yokuqala ekuseni lapho bevuka, noma ngemuva kokuzivocavoca noma ukuqhuma kwamandla.\\nUkubona
  izimpawu zesifuba somoya ezinganeni ezingaphansi kweminyaka engu-5\\nUkukhwehlela
  nokuhayiza mhlawumbe yizimpawu ezilula ukuzibona ezinganeni ezingaphansi kweminyaka
  emihlanu. Uma ingane yakho noma ingane encane iphefumula kungenzeka iphefumula ngokushesha
  kunokujwayelekile noma isebenzisa umzimba wayo ukuphefumula (ngokwesibonelo, ukuphakamisa
  amahlombe ayo phezulu naphansi ngomoya ngamunye).\\nIzingane ezingaphansi kweminyaka
  emihlanu ngeke zichaze ukuthi zizizwa kanjani ngendlela efanayo nengane endala noma
  yomuntu omdala. Isibonelo, esikhundleni sokuthi bathi isifuba sabo sizwakala siqinile
  bangathi banesisu esibuhlungu noma ungaqaphela ukuthi bahlikihla isisu noma isifuba
  sabo.\\nUngayihlola kanjani i-asthma enganeni\\nUma ukhathazekile ngokuthi ingane
  yakho ingahle ibe nesifuba somoya, kufanele uyise kudokotela, okungenzeka ukuthi:\\n-
  Buza ngomlando wabo wezokwelapha - noma yiziphi izimpawu nezimbangela okungenzeka
  uzibonile muva nje, nokuthi zenzeka nini\\n- Buza ukuthi ingane yakho noma amanye
  amalungu omndeni ane-eczema noma i-allergies\\n- Yenza ukuhlolwa ngokomzimba - ikakhulukazi
  bazolalela isifuba sengane yakho nganoma yikuphi ukushaywa umoya. Akunasondo akusho
  ukuthi ingane yakho ayinayo i-asthma, noma kunjalo.\\nUma ingane yakho ingaphansi
  kweminyaka engu-5 ingatholakala ukuthi ine-asthma esolwayo ngesisekelo sohlolo olulodwa
  olulula. Ukuze uqiniseke ukuthi i-asthma, noma kunjalo, kuzofanela ulinde baze babe
  badala ngokwanele ukwenza izivivinyo zokuphefumula ezihambisanayo.\\nIzingane eziphakathi
  kuka-5 no-16 kufanele zicelwe ngudokotela wazo ukuthi zenze isivivinyo esisodwa
  noma eziningi zokuphefumula:\\n- I-Spirometry - ingane yakho iceliwe ukuthi ishaye
  into esemlomo ngokushesha futhi isikhathi eside ngangokunokwenzeka ukukala ukuthi
  amaphaphu abo asebenza kanjani.\\n- Ukubuyiselwa emuva kweBronchodilator (BDR) -
  uma lokho kuhlolwa kokuqala kwe-spirometry kuphakamisa ukuthi ingane yakho ayiphefumuli
  kahle, udokotela wakho noma umhlengikazi wesifuba uzobanika umthamo owodwa wemithi
  ye-bronchodilator. Ukuhlolwa okubili kwe-spirometry - okukodwa ngaphambi nangemva
  komuthi - kuzolinganisa noma yikuphi ukuthuthuka. Ukuhlolwa okuhle kwe-BDR kuqinisekisa
  ukuxilongwa kwesifuba somoya.\\n- I-nitric oxide ephume ngokweqile (i-FeNO) - ilinganisa
  izinga lokuvuvukala ezindleleni zomoya zengane yakho.\\n- Ukuqapha kwe-Peir expiratory
  flow (PEF) - ingane yakho ishaya kushubhu elincane ukukala ukuthi ikwazi ukuphefumula
  ngokushesha kangakanani. Uma i-PEF ishintsha kakhulu usuku nosuku lokho kungakhombisa
  ukuxilongwa kwesifuba somoya.\\nUngakhathazeki uma ingane yakho encane ingenakho
  ukuhlangana ngesandla nokuphefumula ukwenza lezi zivivinyo - zingazama futhi njalo
  ezinyangeni eziyisithupha kuya kweziyi-12.\\nUkwelashwa kwe-Asthma ebuntwaneni\\nKunezinhlobo
  ezimbili zomuthi ezisetshenziselwa ukwelapha i-asthma ezinganeni:\\n- I-inhaler
  yokuhlenga noma yokuhlenga (i-bronchodilator) - zisebenzise lezi zikhathi ezithile
  ukukhulula izimpawu zengane yakho lapho zenzeka. Zisebenza ngokushesha ngaphakathi
  kwemizuzu engaba ngu-3. Ama-Reliever inhalers imvamisa aluhlaza okwesibhakabhaka.\\n-
  Isivimbeli (i-anti-inflammatory) inhaler - sisebenzise nsuku zonke ukuvimbela ingane
  yakho ukuthi ibe nezimpawu.\\nAma-inhalers aletha umuthi njengesifutho noma impuphu
  ngqo lapho kudingeka khona - imigwaqo yomoya. Iningi lezingane line-asthma elawulwa
  kahle uma zisebenzisa ama-inhaler (s) azo ngendlela efanele. Ukuxhuma i-spacer noma
  i-nebuliser device kwi-inhaler kungenza kube lula ukuyisebenzisa - ikakhulukazi
  ezinganeni nasezinganeni ezisencane.\\nNgokuya ngokuthi zineminyaka emingaki, izingane
  ezine-asthma okunzima ukuzilawula nazo zingadinga ukuthatha ithebhulethi yansuku
  zonke noma ukushintshela ku-inhaler ehlukile.\\nImithi yokwengeza yokwengeza yezingane
  ezine-asthma enzima ihlanganisa i-theophylline (bushelelezi bemisipha ephumuzayo)
  namaphilisi e-steroid.\\nUkwelashwa kwesifo somoya ngaphansi kwengu-5\\nUkwelashwa
  kwengane noma ingane enesifuba somoya okusolwayo kunqunywe ngezinyathelo:\\n- Uma
  izimpawu zimnene futhi kwesinye isikhathi udokotela wakho angathatha indlela ''yokubuka
  nokulinda'' ukuze abone ukuthi kunephethini lezimpawu zabo. Isibonelo, ingabe avela
  kuphela ngemuva kokubandayo bese aphela?\\n- Faka i-reliever inhaler oyisebenzisayo
  uma kuvela izimpawu.\\n- Uma izimpawu ziqhubeka, nikeza isivivinyo se-inhaler yokuvimbela
  nsuku zonke bese uyayeka. Uma izimpawu zengane yakho zibuya kungakapheli amasonto
  amane, kungenzeka ukuthi zinesifuba somoya. Kule canse, bazocelwa ukuthi baqale
  ukuthatha isivimbela nsuku zonke futhi basebenzise i-reliever inhaler njengoba kudingeka.\\n-
  Faka ithebhulethi yansuku zonke ye-leukotriene receptor antagonist (LTRA) (noma
  isiraphu) yokuvikela okwengeziwe uma kudingeka\\n- Uma izimpawu zibucayi noma ziqhubeka
  ngemuva kokuthi kuthathwe zonke izinyathelo ezingenhla, zizodluliselwa kuchwepheshe.\\nUkwelashwa
  kwesifuba sezingane ezineminyaka engu-5 kuya kwengu-16\\nUma i-asthma ihlolwe kahle
  ngudokotela ngemuva kokuthi ingane yakho yenze izivivinyo zokuphefumula ezifanele,
  ukwelashwa kuzonqunywa kulezi zinyathelo ezilandelayo:\\n- I-Reliever inhaler\\n-
  Faka i-inhaler yokuvikela nsuku zonke\\n- Faka ithebhulethi yansuku zonke yokuvikela
  i-LTRA uma kudingeka\\n- Uma izimpawu ziqhubeka, misa i-LTRA bese ushintshela ku-inhaler
  yokuvimbela esebenza isikhathi eside\\n- Uma izimpawu ziqhubeka, shintshela kwinhlanganisela
  ye-inhaler (kokubili ukuvimbela nokunciphisa)\\n- Cabanga ngesilingo se-theophylline
  njengesivimbeli sansuku zonke\\n- Dlulisela kuchwepheshe uma kudingeka.\\nAmathiphu
  okuphatha nokugcina i-asthma ilawulwa\\n- Sebenzisa bese ulandela uHlelo Lokusebenza
  Lomntwana wakho (i-PAP), kwesinye isikhathi olubizwa nge-Asthma Management Plan
  Yabelana ngayo nothisha, abanakekeli namalungu omndeni asondele.\\n- Sungula isimiso
  sansuku zonke sokuphuza umuthi wokuvimbela - kuzokusiza wena nengane yakho ukuthi
  nikhumbule.\\n- Qiniseka ukuthi ingane yakho iyakwazi ukuthola i-reliever inhaler
  yayo ngaso sonke isikhathi futhi iyazi ukuthi ikuphi.\\n- Thatha ingane yakho ibuyekezwe
  nodokotela wayo noma umhlengikazi wesifuba somoya okungenani kanye ngonyaka.\\n-
  Hlola njalo ukuthi inqubo ye-inhaler (ne-spacer) yengane yakho ilungile. Bheka umhlengikazi
  wakho wesifuba somoya noma udokotela ukuze akukhumbuze uma ungaqiniseki.\\n- Qapha
  izimpawu zengane yakho, gcina idayari yezimpawu / yokunciphisa izifo.\\n- Rekhoda
  izilinganiso zokugeleza okuphezulu njalo ekhaya, uma kunesidingo.\\n- Yazi ukuthi
  yini ebangela izimpawu zengane yakho futhi uyigweme\\n- Uma wena noma omunye ekhaya
  ubhema, yeka.\\n- Khuthaza ingane yakho ukuba izivocavoca umzimba, idle ukudla okufanele
  futhi ilale ngokwanele.\\n- Yazi okufanele ukwenze uma izimpawu ziba zimbi futhi,
  uma zenzeka, uthathe isinyathelo ngaphambi kwesikhathi.\\n- Lapho sezikhulile ngokwanele,
  fundisa ingane yakho ngesifuba somoya ukuze iqonde ukuthi ingaziphatha kanjani izimpawu
  zayo.\\n- Bheka udokotela noma umhlengikazi wakho uma ingane yakho idinga ukusebenzisa
  i-reliever yayo izikhathi ezingaphezu kwezintathu ngesonto.\\nImininingwane nokwesekwa\\nUzothola
  ulwazi oluthe xaxa mayelana nokungezwani komzimba nesifuba somoya kwiwebhusayithi
  yethu, futhi siyethemba ukuthi uzoyihlola. Ngezansi kukhona ezinye izindatshana
  zakamuva. Nawe unga thintana nathi - singathanda ukuzwa kuwe!\\n- Iphepha elibhalwe
  ngokuhlanganyela nguMongameli weGAAPP, uTonya Winders, lanyatheliswa ngoJuni 2020
  JACI futhi lichaza izidingo zomhlaba ezingafinyelelwanga ku-asthma yezingane. Funda
  iphepha lapha.\\n- \u201cUmqulu Womhlaba Wonke Wezingane Ezinesifuba Somoya\u201d
  ungatholakala lapha.\\n- \u201cIsifuba Somoya: Ukusebenza Ngokubambisana Nomhlahlandlela
  Wethimba Lakho Lokunakekelwa Kwezempilo\u201d kungatholakala lapha.\"", "\"Ukujikeleza
  umhlaba - uxazulula kanjani\\nKungathatha isikhathi esingakanani ukujikeleza umhlaba
  wonke?\\nKuzothatha isikhathi esingakanani ukugibela ibhayisikiliukuvakashaemhlabeni
  jikelele? Okungenaniibhayisikiliukuvakashaemhlabeni wonke kungathathawena iminyaka
  engu-1.5 kuya kwengu-2. Kepha kungancika kokuhlukahluka okuningi. Isivinini esimaphakathi
  ongalindela ukuhamba ngaso ukuvakasha okugcwele ngokupheleleibhayisikilikukhona
  phakathi kuka-10 kuye ku-20 km / h (isilinganiso esingu-15 km / h noma amamayela
  ayi-9.3 ngehora).14 2019.\\nSanibonani bantu, nayi iJin evela kuuniverswithme.com.
  Ngigibele ngaphezu kwamakhilomitha angama-84,000 (52,000 mi) emhlabeni wonke kumazwekazi
  ayisithupha.\\nKule ndatshana, ngizokhuluma ngokuthi kungadla malini ukujikeleza
  umhlaba ngesipiliyoni sami kanye nokunye okuhlangenwe nakho okuvela kubagibeli bamabhayisikili
  engizwile ngabo nangocwaningo lwe-inthanethi. Okokuqala, ake sikhulume: kusho ukuthini
  ukuhamba ngebhayisikili emhlabeni? Amakhilomitha amangaki? Mangaki amazwe? Akunampendulo
  kulokho. Ngokuvamile, abagibeli bamabhayisikili balandela imizila emithathu emikhulu.
  1.\\nUkusuka eYurophu kuya e-Asia noma e-Asia kuya eYurophu (kanye neNew Zealand
  ne-Australia) 2. Ukusuka eNyakatho Melika kuya eNingizimu Melika noma okuphambene
  nalokho 3. Ukusuka eGibhithe kuya eNingizimu Afrika noma kolunye uhlangothi Yebo
  ungahamba ngezinye izindlela.\\nNgikhuluma ngomqondo ojwayelekile. Lapho abantu
  begibela komunye wale mizilaBethi ''Ngihamba ngebhayisikili umhlaba'' Kuthatha isikhathi
  esingakanani ukwenza omunye wale mizila? Kuya ngabantu. Ubuncane izinyanga eziyisithupha
  kuya ezinyangeni eziyi-8 Isilinganiso unyaka owodwa unyaka nohhafu womzila owodwa,
  futhi uma uhambo lude kungaba yiminyaka emi-3 kuye kwengu-4 Lapho abantu bexuba
  imizila emibili, i-Real Long Trip ingafana neminyaka engaphezu kwemihlanu uma uhlanganisa
  imizila emithathu.\\nImvamisa kuba nzima ukuhlanganisa imizila. Ngoba ukuwela ulwandle
  kudinga imali eyengeziwe, isikhathi nesibindi sokuhlola izwekazi elisha. Umzila
  odume kakhulu usuka eYurophu uye e-Asia.\\nOkulandelayo kuvela eNyakatho Melika
  kuya eNingizimu Melika. Akunandaba ukuthi uhamba muphi umzila, izindleko zokuhamba
  azishintshi kuwo wonke amazwekazi. Ake ngikuchazele ukuthi kungani izindleko zingashintshi
  yize kuyizwekazi elehlukile.\\nKunezinto ezine eziyinhloko ozobe uzisebenzisa kakhulu
  ohambweni lwakho. Okokuqala, Ezokuhamba, Okwesibili, Indawo yokuhlala, Okwesithathu,
  Ukudla, Okwesine, iVisa, Umshuwalense, Ukuvakasha, Ukulungiswa nokunye. Okokuqala,
  abagibeli bamabhayisikili bonga imali eningi ezintweni zokuhamba ngoba akudingeki
  bagibele ibhasi, isitimela noma indiza kaningi.\\nLokhu kuyinzuzo enkulu kakhulu
  yokuhamba ngebhayisikili emhlabeni wonke. Okwesibili, abagibeli bamabhayisikili
  baphatha izinto zokukhempa abangachithi imali eningi lapho behlala khona. Ubachitha
  izikhathi ezimbalwa ngenyanga njengasehhotela noma ehostela eshibhile.\\nFuthi ayizithinti
  izindleko zakho zenyanga. Ngoba akwenzeki kaningi. Okwesithathu, abagibeli bamabhayisikili
  abachithi imali eningi ohambweni ngoba babona izinto eziningi ezinhle ngenkathi
  behamba ngamabhayisikili ngasolwandle noma ezintabeni.\\nOkwesine, imali ye-visa
  incike lapho uvela khona. Uma unepasipoti eqinile, ingahle isuke ku- $ 200 iye ku-
  $ 500 ngomzila ngamunye. Isondlo futhi singaba kusuka ku- $ 200 kuye ku- $ 500 ngomzila
  ngamunye.\\nFuthi konke lokhu kuyefana kuwo wonke amazwekazi ngoba abagibeli bamabhayisikili
  bahamba ngendlela elula. Ngakho-ke kulapho kuvela khona umbuzo obaluleke kakhulu.
  Udinga imali engakanani inyanga ngayinye ukuhlola umhlaba? Udinga okungenani u-
  $ 300 ngenyanga wegumbi nebhodi.\\nLokho kungama- $ 10 ngosuku ama- $ 3,600 ngonyaka.
  Uzodinga u- $ 1,200 wokuvakasha, ukugcinwa, nokunye. Ngakho-ke udinga okungenani
  u- $ 5,000 ukuhamba emhlabeni jikelele.\\nKepha kuthiwani ngokuthenga kokuqala?
  Kuya ngabantu. Uma ungenayo igiya lokuhamba ngebhayisikili nekamu, uzodinga okungenani
  u- $ 2,000. Uma usuvele unakho konke, okudingayo ngama- $ 500 wezinto ezingeziwe.\\nNgaso
  sonke isikhathi ngicabanga ukuthi amagiya amakamu abizayo abaluleke kakhulu kunamabhayisikili
  abizayo. Ukuba nezimpahla zokukhempa ezinhle, ezibizayo kungenza uhambo lwakho lube
  lula. Uma unebhayisikili elibizayo elibiza cishe u- $ 3,000, alishintshi kakhulu
  ngohambo lwakho.\\nLo akuwona umjaho ongadingi ukuthi uhambe ngokushesha. Ngibone
  abanye abagibeli bamabhayisikili behamba ngamabhayisikili ashibhile kakhulu nazo
  zonke izinto ezishibhile. Ngakho-ke kungenzeka ukuthi ungavele uqale ngama- $ 500
  nje kukho konke.\\nNgakho-ke udinga malini isiyonke ukuze uzungeze umhlaba? Udinga
  okungenani ama- $ 7,000 kufaka phakathi amagiya nakho konke ukuhlola umhlaba. Kumele
  ngikutshele ukuthi lesi yisabelomali esincane kakhulu ngakho-ke kungaba nzima kakhulu
  ukusinda. Kepha ngandlela thile kumnandi ukuthi abagibeli bamabhayisikili abaningi
  basendleleni nalesi sabelomali ngaphandle kwezinkinga ezinkulu.\\nNgakho-ke ungakwenza
  uma ufuna. Yiziphi ezinye izabelomali ezikhona? Abanye abagibeli bamabhayisikili
  abahlanyayo bahamba ngo- $ 2,500 ngonyaka. Futhi angikwazi ukucabanga ukuthi kunjani.\\nKwakunzima
  kakhulu kimi ukuhamba nge $ 5,000. Ngakho-ke, i- $ 2,500 ingaba nzima impela. Kepha
  kusengenzeka ngoba abanye abantu bayakwenza futhi.\\nNgesabelomali sonyaka esingu-5
  000, ngangikwazi ukuhlala emahhotela ashibhile noma emahostela kwesinye isikhathi.
  Futhi bengingathola kuphela ukudla okungu- $ 1 - $ 3, okunzima kakhulu ukuya endaweni
  yokudlela ebiza ngaphezu kuka- $ 10. Ohambweni, benginokukodwa noma ezimbili kuphela
  ezimangazayo ngonyaka njengokuvakashela uhambo lweSerengeti safari ezintathu izinsuku,
  $ 300.\\nUma usebenzisa cishe u- $ 12,000 ngonyaka noma ngaphezulu, uhambo lwakho
  luzoba lula futhi ungadla izitsha ezahlukahlukene endaweni yokudlela cishe u- $
  10. Ungenza izinkambo ezahlukahlukene ngaphezulu. Uma usebenzisa imali eningi, uhambo
  lwakho luzokhululeka.\\nKusobala lokho. Ngendlela, uma ufuna ukuhamba ne- $ 5,000
  njenge-backpacker, kufanele ube yi-hitchhiker. Isabelomali esincane njengojosaka
  siseduze kwe- $ 10,000 njengoba kuzodingeka usebenzise sonke isikhathi endaweni
  yokuhlala nasezokuthutha.\\nIsabelomali esijwayelekile sojosaka singama- $ 20,000
  kuya ku- $ 30,000 ohambweni oluzungeza umhlaba. Njengoba ukwazi ukubona, umhlaba
  wamabhayisikili ubiza kuphela uhhafu wesikhwama njengoba abagibeli bamabhayisikili
  bengasebenzisi imali eningi endaweni yokuhlala nasezokuthutha. Ake sikhulume ngezindleko
  zami zohambo lokuya emhlabeni jikelele.\\nLezi izindleko zami zonyaka. Angizange
  ngithole mali emndenini wami. Ngaqala ngama- $ 10,000 enziwe ngeCanada Working Holiday
  Visa.\\nNgichithe kuphela u- $ 5,000 unyaka ngamunye eMelika nase-Afrika. Ngangikhathazekile
  ngempela ngokusinda eYurophu ngaphambi kokuya lapho ngoba ngangicabanga ukuthi kubiza
  kakhulu. Njengoba ukwazi ukubona, ngisebenzise enye imali eYurophu.\\nKepha isizathu
  ukuthi ngithenge igiya lekhempu lasebusika, igiya elisha lekhamera, nesikhwama sangaphambili
  ngama- $ 2,600. Uma ngikususa lokho, ngichithe kuphela ama- $ 5,500 ngonyaka eYurophu.
  Ngakho-ke kuyafana nonyaka wami wokuqala eMelika nonyaka wami wesibili ngise-Afrika.\\nEYurophu,
  ngenxa yezitolo ezishibhile ezifana neLidl, Aldi, Carrefour, ngikwazile ukuthola
  ukudla okuningi okuhle nokushibhile. Ukuhamba ngebhayisikili eYurophu kwakufana
  nokuba nepikiniki nsuku zonke ngoba kwakushibhile ukuthenga ezitolo futhi kulula
  kunokuhamba ngebhayisikili eLatin America nase-Afrika. Ngisebenzise imali eningi
  kusukela ngo-2016 ngoba sengikhathele ukuhamba isabelomali sonyaka esingu- $ 5,000.\\nFuthi
  ngabona ukuthi ngingenza u- $ 200 kuye ku- $ 400 ngenyanga ngokwenza okuqukethwe
  njalo, futhi kwaqhubeka nokukhula. INew Zealand ne-Australia zibiza kakhulu. Ngakhumbula
  ukuthi inyanga yokuqala ngisanda kufika eNew Zealand ngo-2018, ngihlale ngilambile.\\nNgangicabanga
  ukuthi nginesidlwana esiswini sami ngoba ngangilamba njalo. Kepha bekubiza kakhulu
  ukuthenga izinto esitolo. Uma unesabelomali sonyaka kuphela se-US $ 5,000 ngaphandle
  kwe-visa yokusebenza yeholide, kufanele uphinde ucabange ngokuhamba ngebhayisikili
  e-Oceania.\\nNgo-2019 ngahamba izinyanga eziyisithupha ngabe sengisebenza izinyanga
  eziyisithupha nge-visa yokusebenza kwamaholide yase-Australia. Ngokushesha nje lapho
  ngihlala endaweni eyodwa yomsebenzi, ngangisebenzisa imali ethe xaxa ekuqashiseni,
  ekuphumeni nakwezinye izinto. Ngenxa yalokho, izindleko zanda.\\nNgiyabonga ngokubuka
  i-athikili yami futhi ngiyethemba le ndatshana ikunikeza umbono wezindleko zokuhamba
  ngebhayisikili emhlabeni wonke. Uma unolwazi lokuhamba emhlabeni, sicela ushiye
  amazwana kuzindleko zakho. Izosiza abanye abaningi.\\nEsihlokweni esilandelayo,
  ngizokhuluma ngendlela yokwenza imali ngokuhamba ngebhayisikili emhlabeni wonke.
  Sizokubona esihlokweni esilandelayo. Uhambe kahle.\\nEqinisweni, nansi into emnandi.
  Nginezinkumbulo ezinhle kakhulu lapho ngangihamba ngesabelomali saminyaka yonke
  sama- $ 5,000 ngoba nganginamathuba amaningi okuhlangana nabantu bendawo. Kwenze
  uhambo lwami lucebe ezindabeni ezahlukahlukene.\\nKepha angicabangi ukuthi ngingaphinde
  ngikwenze ngoba bekunzima impela futhi sengikwenzile vele. Sekwanele. Kepha inhlanhla
  uma ufuna.\\nNgabe ukhona ohamba ngebhayisikili emhlabeni jikelele?\\nNgo-18 Septhemba
  2017, uMark Beaumont wafika eParis eseqedile ukuzungeza okusekelwayo kwe-imbulungangebhayisikili
  ngezinsuku ezingama-78 amahora ayi-14, nemizuzu engama-40. Lokhu kushaye umzamo
  wakhe wangaphambilini ongasekelwa ngezinsuku eziyi-115 futhi washaya owedluleumhlabairekhodi
  ngezinsuku ezingama-44 namahora ayi-10 futhi kufanele lithathwe njengerekhodi.\\nYini
  indlela ehamba phambili yokujikeleza emhlabeni wonke?\\n- Umgwaqo Omkhulu Wobungane
  (China) Sula amanzi aluhlaza okwesibhakabhaka: Ubungane Highway, China.\\n- Indlela
  Yabanqobi (ICosta Rica)\\n- Ulwandle lwaseNyakathoUmzila Womjikelezo(EYurophu)\\n-
  I-Shimanami Kaido (Japan)\\n- KuhleHlukanisa IntabaUmzila webhayisikili(I-America
  esenyakatho)\\n- IMunda Biddi Trail (Australia)\\n- ISouth Downs Way (eNgilandi)\\nUkuhamba
  ngebhayisikili kungumdlalo omuhle ngezizathu eziningi ezahlukahlukene, kepha ngicabanga
  ukuthi ibhola mhlawumbe libaluleke kakhulu, iqiniso lokuthi ungazicwilisa ezindaweni
  ezinhle njengalokhu ngokuthembela emilenzeni yakho ukukuhambisa manje kunemizila
  eminingi ehlukene nemigwaqo kepha noma yini oyithandayo, kungaba izintaba ezidlula,
  izindlela zebhayisikili ezithulile noma mhlawumbe izindlela ezimbalwa zomhlaba kukhona
  okukufanele ngakho ungakhathazeki futhi uma ufuna ugqozi ungabe usaqhubeka kusuka
  kithi i-gcn ihlanganisile imigwaqo yethu emihle kakhulu emhlabeni wonke ukuze ukwazi
  ukuhlela uhambo lwakho olulandelayo lwebhayisikili. Mhlawumbe ngiyazibuza ukuthi
  ngiyaphi namhlanje kodwa ngizoveza lokho ngokuhamba kwesikhathi ngoba ngesinye seziphakamiso
  zami ohlwini kepha okokuqala ake siqale ngomqansa wenyoka ongaziwa Lokhu kukhuphuka
  kunabanobuhle abayi-17 ngakho-ke kunengqondo ukuthi kufanele njengoLosse d. I-e
  mont vernier ibizwa nge-e mont vernier esenkabeni ye-alps eduze kwezinye ezidumile
  nge-ferrata ezifana ne-pol de la madelaine, lokhu kukhuphuka kwabonakala kuphela
  esiteji se-18 kuhambo lokuvikela okokuqala ngqa ngo-2015 futhi kwabangela ukuzwa
  lapho kuya ku-mon vernier Ngibheke phambili ekuzameni lokhu, ukukutshela ukuthi
  igama lezingxenye zezinkomo yiScotland Gaelic njengoba ngokomlando lalisetshenziswa
  njenge-drover.\\nUmmemezeli kaNabar ngiyethemba ngithole lelo lungelo Uxolo uma
  ngingenalo, kepha ngithemba ukuthi senginakho lokho manje iScotland akuyona leyo?
  aziwa ngemigwaqo yalo emihle nezinye, mhlawumbe izindawo ezingejwayelekile ezingathi
  kwesinye isikhathi zibe nesibonelo, okusho ukuthi kungenzeka ukuthi zihlobene nesimo
  sezulu. Isimo sezulu eScotland asibalekanga njengase-Ireland. Kepha iBialuk Nabar
  mhlawumbe ingenye yemigwaqo emihle kakhulu emhlabeni, eyaziwa nangokuthi yi-Applecross
  Pathit eyingxenye yogu olusenyakatho 500a umzila ozungeze iScotland, umgwaqo we-cyan
  markbeaumont okhuphuke ngamamitha angama-600 ngamakhilomitha ayisishiyagalolunye
  ngonyaka odlule okuyiwona impela ukukhuphuka okude e-UK, kepha umbono ubufanela
  kahle nobuhlungu bemilenze yakho njengoba uzoklonyeliswa ngemibono emangalisayo
  ye-Isle of Heaven.\\nKuyamangaza impela. Awukwazi ukuzibamba ume nge-gn bese ubuka
  ngokwethuka. Siyathanda ukushayela esiqhingini saseMallorca Kumele kuthiwe kunezindawo
  eziningi ezahlukahlukene zokushayela esiqhingini ezinhle ngokumangalisayo, kepha
  indawo eyodwa yenze ukuthi ube nentshisekelo esihlokweni engingazukukhononda ngaso
  ngempela, ukwethembeka, ngoba umqansa omuhle oholela ngqo emaweni uma wesaba izindawo
  eziphakeme lokhu kungenzeka kungabi ukukhuphuka kwetheku le-sieder lase-aldermosta
  kuyikhaya lezindlu ezimbalwa nendawo yokudlela, kepha ungadli? kakhulu, ngoba lo
  mgwaqo ukuphela kwendlela engena porto uma ubunesikhathi sokujabulela ukubuka izinto
  futhi uthokozele ulwandle, uya ngqo phezulu futhi futhi sengivele ngikhuphuka amamitha
  angama-380 kumakhilomitha ayisihlanu, ngakho-ke akuyona umqansa omncane, ukuthuthela
  okunye kokuqwala okuhamba phambili eLaif manje, hhayi yonke i-USA Mulhollanddrive
  ekhuphuka isuka la ibheke entshonalanga ye-ridgecanyon emuva epaki futhi ingumgwaqo
  we-anepic onemibono emangalisayo yedolobha lase-la manje lihluke kakhulu kunolunye
  Ukukhuphuka kulokhu uhlu ukuthi indawo ibunjiwe ngabantu kunemvelo, kepha ayikwenzi
  kube yinto encane kangako.\\nUmqansa ngokwawo ucace ngamaphesenti amane, okuncane
  kakhulu kunokumelana engisanda kuqhamuka nakho, kepha ukukhuphuka okumangazayo okunemibono
  emihle ye-cityscape nemigwaqo enamagquma emangalisayo nayo. Ngakho-ke uma uthanda
  ukukhuphuka kwakho kancane, lokhu sekube yisixuku sabashayeli bamabhayisikili abangochwepheshe
  be-youdrona eminyakeni yamuva njengoba abaningi sebethuthele edolobheni beyohlala
  nokuqeqesha isizini yomjaho wase-Europe futhi kulula ukubona ukuthi kungani kunemigwaqo
  eminingi emide emide eyisicaba kodwa futhi nezindawo eziningi zezintaba futhi nesimo
  sezulu sihle impela imigwaqo emihle kakhulu eduzane naseDerona ngumgwaqo osogwini
  ohamba kahle ungaphazanyiswa kulo lonke ugu olusempumalanga yeSpain, kepha lesi
  sigaba ikakhulukazi sisondele eTotosa del Mar cishe amakhilomitha angama-20 inde
  futhi imigwaqo iyajika ijike ivuke iwele eduze koLwandle iMedithera futhi iyamangaza
  ngempela, kunezindawo eziningi zokuba nekhofi noma mhlawumbe nokulunywa ukudla futhi
  ngicabanga ukuthi lo mgwaqo kufanele ube yemigwaqo emihle kunayo yonke emhlabeni
  iNorway yizwe elihlaba umxhwele futhi likhaya elihle kakhulu linenani elikhulu labagibeli
  bamabhayisikili abahle kakhulu, manje umgwaqo owodwa omuhle kakhulu ezweni ukwenyuka
  kwe Izinyoka ezi-Roller noma iTroll Wall ezitholakala ogwini olusempumalanga yeNorway,
  iNorway yizwe elihlukile ngokukhethekile lapho kukhuphuka khona okuningi okuqala
  olwandle ngaphambi kokuba bakhuphukele ezindaweni eziphakeme kakhulu, kwakheke imifula
  nezigodi ezihlukile ezibonakala ngokushesha. ITrollstegen iyisibonelo esihle salokhu,
  ukuqala ebangeni elingamamitha angama-30 kunqoba amamitha angama-700 esihlabathini
  samakhilomitha ayisishiyagalolunye ngenhla uklonyeliswa ngokubukwa okuhle kwezinguzunga
  zeqhwa futhi nangombono wamachibi athile angajwayelekile.\\nUma unesibindi ngokwanele,
  kukhona iTroll Vegan Triathlon, esebenzisa ukwenyuka koTroll Wall bese kuba ithanga
  elingaphandle komgwaqo esiqongweni sentaba oh kuzwakala njengelinye labangane bethu
  e-gtn akunjalo, masithembeke , Ngingathanda ukusho ukuthi ukuhamba kuzwakala kumnandi.
  I-Eland Valley iseduze kakhulu ne-gcn hqyeah kuyezwakala ukuthi unezigidi zamamayela
  ukusuka noma yikuphi lapho ushaya imizila ethile yamatshe ebabazekayo i-Inland Valley
  engekho? Ukushoda kwemigwaqo emihle egandayiwe futhi kuzwakala njengendawo enhle
  ye-canyonrail yami, akunjalo, ngokwesibonelo umzila womjikelezo kazwelonke u-81
  usuka e-Eland Village uye e-AberWEISworth ogwini olulandela imigwaqo evulekile yezwe
  evulekile eMid Wales enokubukwa okuhle yamachibi amahle, futhi ungaphinde uphume
  emgwaqweni ukuze uthole injabulo ethe xaxa? emikhakheni embalwa yobhuqu lena mhlawumbe
  umzila waseBrithani ongaconsi phansi owenziwe ngezindawo eziningi ezinamathafa amancane
  nezindawo eziningi ezikhuphukayo ukuze izinto ziqhubeke futhi, kuhlu lwamabhakede
  lwabashayeli abaningi base-UK futhi asikwazi ukulinda yehla uyithokozele maduzane
  Kulungile, lokhu kungeza kwami kuhluI-Southeast Ireland ekugcineni kwayo le ndlela
  yiCopper Coast Road umzila omuhle osuka e-ross lair inwexford uye e-dugarvanin waterford
  amakhilomitha ayi-166 isiyonke ngakho-ke yinde impela kodwa lokhu i-ireland ngombono
  wami omkhulu kunayo yonke indawo engiyibonile futhi ngenze nezikhathi ezithile zokuqeqesha
  ubusika okwenzekile ngiyakutshela ukuthi kuyisipiliyoni manje kunamadolobha amancane
  amancane nezindawo zokucisha ukuluma ukudla, futhi bane-waterford i-greenway oyibonile
  esethulweni salesi sihloko Ubude obungamakhilomitha angama-40 buhlukanise indlela
  yomjikelezo kulo mzila. Ngicabanga ukuthi le ndawo iyintandokazi yami ngokubukwa
  kolwandle, lapha unakho lokhu? Imayini yethusi endala enikeza lo mzila igama layo,
  umgwaqo ogwini lwethusi kanye nedolobha laseBun Mahon ngemuva futhi bathande lo
  mgwaqo oyintandokazi obabazekayo okufanele ube sohlwini, manje osendleleni ehluke
  ngokuphelele neShimanani-Kaido umzila wasejapan, ongaweleli elilodwa, hhayi amabili,
  kepha sekugcwele amabhuloho ayisithupha ngaphezu kwamakhilomitha angama-70 ukusuka
  esiqhingini esikhulu saseJapane iHoncho kuya esiqhingini esincane saseShikoku futhi
  awele iziqhingi eziyisithupha kule nqubo. ukubukwa kubude obude bendlela ye-shimanan
  al-qaida kufanele ngempela ukuyibona futhi nakanjani kunethuba lokuzidela kwe-epikrad
  lapha ngicabanga ukuthi ungazibuza ukuthi kungenzeka yini ukuthi kube nomthamo omningi
  emzileni manje, kodwa kukhona indlela ehlukanisiwe yebhayisikili ubude obugcwele
  beShimananal-Qaeda, okusho ukuthi ungawujabulela umzila ngaphandle kokukhathazeka
  noma ingcindezi futhi uyazi ukuthi iJapan yisizwe esinothe ngamagugu ngamabhayisikili
  namasiko futhi asikwazi ukulinda ukwenza lo mzila njengamanje s kuyinto elula kakhulu
  ye-asphalt e-Iceland futhi mhlawumbe iyamangalisa, kodwa kunendawo eyodwa ekhetheke
  kakhulu.\\nINhlonhlo Yeqhwa entshonalanga ye-Iceland iyindawo ephawulekayo yokugibela
  ibhayisikili. Umugqa ogcwele womgwaqo ozungeze inhlonhlo ingamakhilomitha ayi-150,
  ngakho-ke akunjalo. Impela umzila omfushane, kepha lowo ozokuvuza ngokubukwa okumangazayo
  ngosuku olucacile.\\nUngabona intaba embozwe yiqhwa iSneyfel Snes Jokel, engamamitha
  ayi-1500 ukuphakama. Isikhungo somhlaba kufanele sibe ngaphakathi kwentaba, ngokusho
  kukaJules Vernes Roman kusuka ngo-1864, uma uthanda izindawo ezingenalutho, izimpande
  ezikude namathafa amahle, khona-ke i-iceland kanye nenhlonhlo yaseSchneifeldt Snes
  nakanjani ngizokutshela lokho cabanga ngakho nakimi, ngabe yini obungathanda ukuyifaka
  ohlwini esingakulinganisanga lapho sicela usazise emibhalweni engezansi futhi ngiyethemba
  ukujabulele ukushayela kwami okuncane ngomgwaqo iCopper Coast Road lapha eSoutheast
  Ireland futhi lapho nje isimo sezulu sihle futhi ngilapha nge-Grail, kungcono ngiye
  ezintabeni ngibheke ukuthi ngingayithola yini eminye imizila emisha noma imigwaqo
  emihle, ngiyabonga ngokubuka, sizokubona kungekudala, inhlanhla\\nNgabe ungalahla
  amafutha esiswini ngokuhamba ngebhayisikili?\\nYebo,ibhayisikili lingakwaziUsizoulahlekelwe
  ngamafutha esiswini, kodwa kuzothatha isikhathi. Ucwaningo lwamuva lubonise njaloukuhamba
  ngebhayisikiliingahle ithuthukise konkeukulahleka kwamafuthafuthi ukukhuthaza isisindo
  esinempilo. Kuukunciphisaisiyonkeisisuibhande, ukuvivinya umzimba ngokulingene,
  njengeukuhamba ngebhayisikili(kungaba ngaphakathi noma ngaphandle), kuyasebenza
  ukwehlisaisisindo samafutha.\\nUma inhloso yakho ukunciphisa isisindo esithile,
  khona-ke ukuhamba ngebhayisikili kuyindlela enhle yokukwenza. Futhi ezinye izindaba
  ezimnandi ukuthi, uma ukuhamba ngebhayisikili kungumgomo wakho okuwukuphela kwakho,
  ukwehlisa isisindo ngenkathi ugcina ukusebenza kuzokukwenza usheshe. Yebo, ngakho-ke
  isibonelo umgibeli wamakhilogremu angama-75 akhuphuka intaba ende angafika phezulu
  ngomzuzu ngokushesha uma elahlekelwa amakhilogremu ama-2 - yebo, futhi athathe lesi
  sibonelo ngokweqile, ukuthi Umehluko mkhulu.\\nNgakho-ke umgibeli wamakhilogremu
  angama-90 uzokonga cishe imizuzu emihlanu nohhafu uma bekwazi ukwehlisa amakhilogremu
  ayi-10 ngaphansi kwezimo ezifanayo ncamashi, pho izindlela ezihle zokwehlisa isisindo?
  Nazi izeluleko ezinhlanu ezisheshayo nezilula ezizokusiza ukwenza lokhu. - Eminyakeni
  edlule sonke satshelwa ukuthi indlela engcono yokwehlisa isisindo esithe xaxa ukuchitha
  isikhathi esiningi kulokho okwaziwa ngokuthi ''indawo yokushisa amafutha''. Umbono
  uthi ngamandla aphansi uzoshisa iphesenti elikhulu lamafutha uma uqhathanisa nama-carbohydrate
  kunalokhu ngamandla - futhi kulungile uma uthola usuku lonke lokuzivocavoca umzimba,
  kepha iqiniso ukuthi iningi lethu alinakho lokhu okunethezeka .\\nNgakho-ke, uma
  uzama ukuziqeqesha ngenqubo yesikhathi esigcwele ukuqina okuphezulu kuyinto leyo
  - yebo, uzoshisa amakhalori amaningi ngehora ohambweni olunzima impela, olunamandla
  kunokuhamba umgwaqo omude esihlalweni. Ekupheleni kosuku, ukunciphisa isisindo kumayelana
  nokushisa ama-calories amaningi kunalokhu okudlayo. Futhi, unenzuzo eyengeziwe yokuthi
  ulambile kancane ngemuva kokushayela ngamandla kunangemva kokushayela okude, okuhamba
  kancane, ngakho-ke mancane amathuba okuthi udle ngokweqile uma ungena emnyango.
  - Lapha e-GCN sinezikhathi ezithile ezimfushane, ezinamandla ongazenza endlini.\\nUma
  ufaka phakathi okubili noma kathathu kokuzivocavoca kwakho kwamasonto onke, usendleleni
  efanele. \u266a - Amanzi okuphuza akulungele impela wena, futhi hhayi lokho kuphela,
  angaba yinto yokuncisha ukudla futhi. Manje, ngemuva kokuphuza kahle, ngeke usazizwa
  ulambile.\\nNgakho-ke nali iqhinga elincane elihle kuwe. Uma uqala ukusuka ohambweni
  lwakho, yiba nengilazi enkulu impela yamanzi, mhlawumbe upende noma kunjalo, ngaphambi
  kokudla kwakho. Izosidambisa isisu sakho, ngakho-ke ngeke ulambe ngenkathi udla
  ngakho-ke mancane amathuba okuthi udle ngokweqile.\\nFuthi ungakwenza lobu buqili
  ngaphambi kokudla okuyinhloko kosuku futhi. Ukudla kwasekuseni, isidlo sasemini
  nedina ngisho nangaphambi kokudla kwasekuseni nantambama. Izinsuku ezinhle, ukuhalalisela.
  \u266a \u266a - Ithiphu inombolo yesithathu.\\nYidla okuncane futhi kaningi lapho
  ushayela imizuzu engaphezu kwengu-90. Kungase kuzwakale njengokuphikisana okuncane
  manje ukuze udle okungaphezu kwalokho ovame ukukwenza, ikakhulukazi lapho uzama
