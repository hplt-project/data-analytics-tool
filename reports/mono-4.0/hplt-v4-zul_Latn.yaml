  Ugu lolu zivalwa. Kuthiwa kuzothunyelwa amabhasi azothutha izingane ngoba sezifunda
  kude, wemame dololo amabhasi. Izingane nezincane sezibhadula ngonyawo amabanga amade
  imiphakathi ikhohliswe nguhulumeni. Zivalelwani izikole engabe kwandiswa Othisha
  kusulwe lento okuthiwa wuPPN evalisa umnyango izikole. Vele imiphakathi yasemakhaya
  kayisoze yalingana neyasemadolobheni ngobuningi. Inguquko yavalwa, iSangqu yavalwa,
