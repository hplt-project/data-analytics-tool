  Myopia\\n- Sigurt\u00e0 tat-Traffiku VR Simulazzjoni tas-sewqan\\n- VR ta\u0127ri\u0121
  mediku\"", "\"Is-servizzi G-Billion Logistics jifhem li kull negozju g\u0127andu
