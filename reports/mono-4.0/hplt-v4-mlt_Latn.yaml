  ta'' reviews: 38Konver\u017cjoni ta ''barn awto-kontrollata mill-aqwa \u0121ewwa
  Hurst\"", "\"2009 kienet mitlufa lill settur tal-ener\u0121ija tal-pajji\u017c .\\nWara
  kollox, il-Gvern issa hija ta\u0127t pressjoni mill-Bank Dinji ppjanati\\nfinalment
  jippro\u010bedi bl-ewwel fa\u017ci ta ''introduzzjoni fl-Ukraina tal-mudell kompetittiv\\nsuq
  tal-ener\u0121ija. Madankollu, wara t-trasferimenti ripetuti bidu tal-pro\u0121ett
  ta ''riforma\\nre\u0121g\u0127u tilfu g\u0127al perjodu indefinit. Skedata g\u0127al
  Settembru\\nxahar l-irkant ewwel g\u0127all-bejg\u0127 ta ''elettriku minn kuntratti
  diretti bejn\\nmanifatturi u fornituri ta ''ener\u0121ija mhux se ji\u0121ri. \\\"Na\u0127seb
  li l-irkant\\nmhux se jkun sa Settembru, i\u017cda \u0121eneralment qabel it-tmiem
  tas-sena \\\"- qal li l-\\\" i \\\"sors\\nfil-NAC \\\"Energy Company ''l-Ukraina.\\\"
  Kif di\u0121\u00e0 rappurtati, \\\"i\\\"\\nIl-Kabinett kienet qed tippjana li a\u0127\u0127ar
  ta ''\u0120unju li jissottometti lill-abbozz ta'' emendi lill-parlament\\nil-li\u0121i
  \\\"Fuq l-ener\u0121ija elettrika\\\", li kellu jippermetti produtturi\\nu fornituri
  tal-elettriku li jid\u0127lu kuntratti diretti ma ''xulxin, jinjora l-\\njoperaw
  fl-Ukrajna, l-hekk imsej\u0127a suq bl-ingrossa uniku. Madankollu, id-dokument\\nlill-parlament
  ma jkunx a\u0121ixxa, g\u0127alkemm l-apparenza tal-\u0127itan tal-rre\u0121istrati
  uffi\u010bjalment\\npolza fuq kuntratti diretti tax-xellug l-opportunit\u00e0 settur
  tal-ener\u0121ija Xa\u0127am\\nli jmexxi l-irkant ewwel fuq il-bejg\u0127 dirett
  f''Settembru\\nsena. NERC wara l-adozzjoni ta ''din il-li\u0121i kienet qed tippjana
  li jitqieg\u0127du g\u0127all-irkant\\n10% tal-volum totali mibjug\u0127a fis-suq
  tal-elettriku bl-ingrossa wie\u0127ed annwali\\njiswa madwar 58 biljun UAH. Skond
  l-esperti, x-xog\u0127ol fuq\\ntiffinalizza l-pjan g\u0127ar-riforma Ukrain suq
  bl-ingrossa\\ntkompli, i\u017cda \\\"pjuttost matt\\\", u ma ''l-ener\u0121ija,
  \\\"jidher li di\u0121\u00e0\\nma nemminx fil-su\u010b\u010bess ta ''din l-inizjattiva.
  \\\" \\\"I wkoll dubju li din\\nsena a\u0127na se tibda l-implimentazzjoni tal-pjan.
  Issa, l-interessi kollha huma orjentati\\nfuq il-politika,. ener\u0121ija ma Get
  frott utli ta ''l-implimentazzjoni tal-pro\u0121ett\\nriforma tas-suq l-ener\u0121ija
  ma jkunx immedjatament ta ''su\u010b\u010bess, i\u017cda ji\u0121ru fuq skala kbira\\nkritika
  ta ''l-elezzjoni presidenzjali jistg\u0127u ji\u0121u, \\\"- qal,\\\" i \\\"il-president\\nEner\u0121ija
  Asso\u010bjazzjoni ta ''l-Ukraina Vasyl Kolko. Skond hu, il-pass\\npromozzjoni energoreformy
  jista ''b''mod sinifikanti timbotta l-ka\u017c\\n\u0127atra fil-livell ta ''uffi\u010bjali
  tal-gvern responsabbli\\ng\u0127all-pro\u0121ett. \\\"Xhur ilu, a\u0127na offruti
  sett seven\\nmani\u0121er tal-pro\u0121ett fuq, ji\u0121ifieri, membru tal NERC.
  Imbag\u0127ad, ma ''dan it-tip ta''\\nmiftiehem, u mbag\u0127ad nesa dwar l-idea,
  \\\"- qal is-Sur Kolko.\\nFilwaqt li l-pro\u0121ett ji\u0121i ffri\u017cat fuq il-livell
  ta ''preparazzjoni tal-li\u0121ijiet u regolamenti\\ndokumenti - l-ebda passi pratti\u010bi
  lejn l-istabbiliment fl-Ukraina\\nmudell Ewropew kompetittiv ta ''kuntratti diretti
  bilaterali bejn il-produtturi\\nu l-fornituri ta ''elettriku din is-sena ma jkunx
  sar u x''aktarx\\nqabel it-tmiem tas-sena di\u0121\u00e0 sar mhux se jkun. Madankollu,
  ma tantx huwa veru\\nli jg\u0127idu li l-2009 kienet g\u0127all-ener\u0121ija f''termini
  tal-promozzjoni ta ''riformi\\nsempli\u010biment mitlufa. Affarijiet huma \u0127afna
  ag\u0127ar. Din is-sena, min\u0127abba\\nkri\u017ci ekonomika, kif ukoll l-iffri\u017car
  ta ''rati g\u0127all-gvern\\nkilowatt-sieg\u0127a, l-industrija tal-ener\u0121ija
  tal-pajji\u017c \u0127a daqqa ta ''\u0127arta fil-fond.\\nFl-isfond tat-tnaqqis
  ippro\u0121ettat 15% fil-produzzjoni tal-elettriku\\nsa tmiem l-2009, kif ukoll
  tnaqqis fil-volumi ta ''esportazzjoni, il-volum ta''\\nsussidji lill-industrija
  fis-suq tal-ener\u0121ija tal-popolazzjoni sa l-a\u0127\u0127ar tas-sena se\\n32%.
  Il-po\u017cizzjoni finanzjarja ag\u0127ar fl-industrija \u017cviluppat \u0121enerazzjoni
  termali,\\nli l-gvern kien biss re\u010bentement ippjanat li jbieg\u0127u.\\nG\u0127alhekk,
