u3059\u3002\\n\u3231\u5168\u56fd\u6e29\u6cc9\u65c5\u9928\u540c\u76df\\n\u5f8c\u85e4
  \u6c11\u592b\\n1/4\uff08\u629c\u7c8b\uff09\\n\u7acb\u66ff\u3048\u3066\u9802\u3044\u305f\u6599\u91d1\u7b49\u306f\u5e73\u6210\uff12\uff10\u5e74\uff13\u6708\u672b\u65e5\u8fc4\u306b\u3001\u9806\u6b21\u3054\u8fd4\u91d1\u3055\u305b\u3066\u9802\u304d\u307e\u3059\u306e\u3067\u3001\\n\u4eca\u3057\u3070\u3089\u304f\u304a\u6642\u9593\u3092\u9802\u3051\u308c\u3070\u5e78\u3044\u3067\u3059\u3002\\n\u904e\u53bb\u5341\u6570\u5e74\u306e\u9593\u3001\u822a\u7a7a\u4f1a\u793e\u3068\u306e\u9593\u3067\u5b89\u58f2\u308a\u306b\u95a2\u3057\u3066\u8272\u3005\u3068\u30c8\u30e9\u30d6\u30eb\u304c\u3042\u308a\u307e\u3057\u305f\u304c\u3001\u4eca\u56de\u95a2\u4fc2\u306e\u306a\u3044\u304a\u5ba2\u69d8\u306b\u3054\u8ff7\u60d1\u3092\u304a\u639b\u3051\u3057\u3066\u3001\u5927\u5909\u7533\u8a33\u3054\u3056\u3044\u307e\u305b\u3093\u3002\\n\u904e\u53bb\u5341\u6570\u5e74\u306e\u9593\u3001\u65e5\u672c\u822a\u7a7a\u3068\u5168\u65e5\u7a7a\u306b\u5bfe\u3057\u3066\u6570\u3048\u5207\u308c\u306a\u3044\u7a0b\u306e\u6297\u8b70\u3092\u3057\u3066\u304d\u307e\u3057\u305f\u304c\u3001\u9006\u306b\u51fa\u767a\u76f4\u524d\u306e\u30ad\u30e3\u30f3\u30bb\u30eb\u3001\u4e88\u7d04\u53d7\u4ed8\u505c\u6b62\u7b49\u306e\u5acc\u304c\u3089\u305b\u3092\u53d7\u3051\u7d9a\u3051\u3066\u3044\u307e\u3059\u3002\u3057\u304b\u3057\u65e5\u672c\u5168\u56fd\u3069\u3053\u3067\u3082\uff11\u4e07\u5186\u3092\u76ee\u6307\u3057\u3001\u822a\u7a7a\u8cb4\u65cf\u3068\u306e\u6226\u3044\u3092\u7d9a\u3051\u3066\u3044\u304d\u307e\u3059\u3053\u3068\u3092\u7d04\u675f\u81f4\u3057\u307e\u3059\u3002\\n\u3231\u5168\u56fd\u6e29\u6cc9\u65c5\u9928\u540c\u76df\\n\u9867\u554f\uff1a\u5f8c\u85e4
  \u6c11\u592b\\n1/6\uff08\u629c\u7c8b\uff09\\n\u3054\u8fd4\u91d1\u3055\u305b\u3066\u9802\u304f\u306b\u3042\u305f\u308a\u3001\u91d1\u984d\u30fb\u53e3\u5ea7\u7b49\u306e\u78ba\u8a8d\u306e\u70ba\u30e1\u30fc\u30eb\u3001\u30d5\u30a1\u30c3\u30af\u30b9\u3001\u90f5\u4fbf\u7b49\u3092\u304a\u9001\u308a\u81f4\u3057\u307e\u3059\u3002\\n1\u670815\u65e5\u8fc4\u306b\u306f\u3054\u9023\u7d61\u3055\u305b\u3066\u9802\u304d\u307e\u3059\u306e\u3067\u3001\u3057\u3070\u3089\u304f\u304a\u6642\u9593\u3092\u4e0b\u3055\u3044\u307e\u3059\u3088\u3046\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059\u3002\\n\u3054\u8fd4\u91d1\u306f\u9806\u6b21\u3055\u305b\u3066\u9802\u304d\u307e\u3059\u304c\u3001\u5e73\u6210\uff12\uff10\u5e74\uff13\u6708\u672b\u65e5\u8fc4\u306b\u5b8c\u4e86\u3055\u305b\u308b\u4e88\u5b9a\u3067\u3059\u306e\u3067\u3001\u3054\u7406\u89e3\u9802\u3051\u308c\u3070\u5e78\u3044\u3067\u3059\u3002\\n\u3231\u5168\u56fd\u6e29\u6cc9\u65c5\u9928\u540c\u76df\\n\u9867\u554f\uff1a\u5f8c\u85e4
