053\u3068\u306a\u304c\u3089\u4fa1\u683c\u306f\u4e0a\u6607\u3057\u3066\u304a\u308a\u307e\u3059\u3002\u3080\u3057\u308d\u3001\u826f\u304f\u3082\u60aa\u304f\u3082\u30ac\u30bd\u30ea\u30f3\u4fa1\u683c\u306f\u66ab\u5b9a\u7a0e\u7387\u7d0450\u5186\u304c\u3042\u308b\u5206\u3001\u30ac\u30bd\u30ea\u30f3\u81ea\u4f53\u304c50\u5186\u304b\u3089100\u5186\u306b\u5024\u4e0a\u304c\u308a\u3057\u3066\u3082\u3001\u5143\u306e\u7d04100\u5186\u304b\u30891.5\u500d\u5897\u306e\u7d04150\u5186\u3067\u53ce\u307e\u3063\u3066\u3044\u308b\u3068\u3044\u3046\u5074\u9762\u3082\u3042\u308a\u307e\u3059\u3002\u4ed6\u306e\u77f3\u6cb9\u88fd\u54c1\u306f50\u5186\u304c100\u5186\u306b\u3001\u305d\u306e\u307e\u307e2\u500d\u5897\u306b\u306a\u308b\u3060\u3051\u3067\u3059\u3002\u5f53\u7136\u3001\u30b3\u30b9\u30c8\u304c\u60f3\u5b9a\u3088\u308a\u9ad8\u304f\u306a\u308b\u5272\u5408\u304c\u5927\u304d\u3044\u307b\u3069\u3001\u7d4c\u55b6\u3092\u5727\u8feb\u3057\u307e\u3059\u3002\u3082\u3061\u308d\u30931.5\u500d\u3067\u3082\u5341\u5206\u5927\u304d\u306a\u3082\u306e\u3067\u3059\u304c\u3001\u8a00\u3044\u305f\u3044\u306e\u306f\u4ed6\u306e\u77f3\u6cb9\u88fd\u54c1\u306e\u95a2\u9023\u7523\u696d\u3082\u539f\u6cb9\u9ad8\u9a30\u306e\u5f71\u97ff\u3092\u5927\u304d\u304f\u53d7\u3051\u3066\u3044\u308b\u3068\u3044\u3046\u3053\u3068\u3067\u3059\u3002\u3053\u306e\u72b6\u6cc1\u4e0b\u3067\u3001\u30ac\u30bd\u30ea\u30f3\u3060\u3051\u4fa1\u683c\u3092\u4e0b\u3052\u305f\u3068\u3053\u308d\u3067\u3001\u539f\u6cb9\u4fa1\u683c\u306e\u9ad8\u9a30\u306b\u5bfe\u3059\u308b\u6839\u672c\u7684\u306a\u5bfe\u7b56\u306b\u306f\u306a\u308a\u307e\u305b\u3093\u3002\u307e\u3042\u300c\u6839\u672c\u7684\u300d\u306a\u5bfe\u7b56\u306a\u3069\u3042\u308b\u306e\u304b\u5fae\u5999\u3067\u3059\u304c\u3001\u7d042\u51467000\u5104\u3092\u3069\u3046\u305b\u5bb6\u8a08\u3068\u904b\u8f38\u696d\u754c\u306b\u3070\u3089\u6492\u304f\u304f\u3089\u3044\u306a\u3089\u3001\u77f3\u6cb9\u88fd\u54c1\u3092\u4f7f\u7528\u3059\u308b\u696d\u754c\u5168\u4f53\u306b\u3070\u3089\u6492\u3044\u305f\u65b9\u304c\u30d5\u30a7\u30a2\u3060\u3068\u601d\u3063\u3066\u3044\u307e\u3059\u3002\u3042\u308b\u3044\u306f\u6bce\u5e74\u7d042\u51467000\u5104\u5186\u3092\u6cb9\u7530\u306e\u81ea\u4e3b\u6a29\u76ca\u7372\u5f97\u306e\u305f\u3081\u306b\u4f7f\u3046\u3068\u304b\u3002\u3053\u3061\u3089\u306f\u304a\u91d1\u3060\u3051\u3067\u7372\u5f97\u3067\u304d\u308b\u4e16\u754c\u3067\u306f\u306a\u304f\u306a\u3063\u3066\u3044\u307e\u3059\u304c\u3002\\n\u3068\u306f\u3044\u3048\u3001\u3060\u304b\u3089\u3068\u3044\u3063\u3066\u4eca\u306e\u5236\u5ea6\u306e\u307e\u307e\u3067\u826f\u3044\u3068\u306f\u601d\u3063\u3066\u3044\u307e\u305b\u3093\u3002\u672c\u5247\u3068\u3042\u308f\u305b\u3066\u3053\u308c\u3060\u3051\u306e\u5de8\u984d\u3092\u7279\u5b9a\u8ca1\u6e90\u3068\u3057\u3066\u76ee\u7684\u7a0e\u5316\u3057\u3066\u304a\u304f\u610f\u7fa9\u306f\u65e2\u306b\u5931\u308f\u308c\u3066\u3044\u308b\u3068\u601d\u3044\u307e\u3059\u3002\u6614\u306f\u9ad8\u5ea6\u7d4c\u6e08\u6210\u9577\u306e\u305f\u3081\u306b\u307e\u305a\u9053\u8def\u3092\u3001\u3068\u3044\u3046\u6642\u4ee3\u3067\u3057\u305f\u304c\u3001\u4eca\u306f\u512a\u5148\u9806\u4f4d\u304c\u4e0b\u304c\u3063\u3066\u304d\u3066\u3044\u308b\u306f\u305a\u3067\u3059\u3002\u304a\u305d\u3089\u304f\u5e74\u91d1\u3084\u5c11\u5b50\u5316\u5bfe\u7b56\u306a\u3069\u3088\u308a\u4e0b\u306b\u306a\u308b\u3067\u3057\u3087\u3046\u3002\u305d\u306e\u3088\u3046\u306a\u4e2d\u3001\u7279\u5b9a\u8ca1\u6e90\u3068\u3057\u3066\u8056\u57df\u5316\u3059\u308b\u5fc5\u8981\u6027\u306f\u8584\u308c\u3066\u304a\u308a\u3001\u305d\u308c\u3067\u3082\u5fc5\u8981\u3068\u3044\u3046\u3053\u3068\u3067\u3057\u305f\u3089\u4e00\u822c\u8ca1\u6e90\u306e\u4e2d\u3067\u3001\u4ed6\u306e\u653f\u7b56\u3092\u6291\u3048\u3066\u3001\u3053\u308c\u307e\u3067\u306e\u7279\u5b9a\u8ca1\u6e90\u4ee5\u4e0a\u306e\u4e88\u7b97\u3092\u78ba\u4fdd\u3059\u308c\u3070\u3088\u3044\u306e\u3067\u306f\u306a\u3044\u3067\u3057\u3087\u3046\u304b\u3002\u90fd\u5e02\u90e8\u306e\u9023\u7d9a\u7acb\u4f53\u4ea4\u5dee\u4e8b\u696d\u3084\u65e5\u672c\u6d77\u5074\u306e\u5e79\u7dda\u9053\u8def\u306a\u3069\u5fc5\u8981\u3068\u8a8d\u3081\u3089\u308c\u308b\u3088\u3046\u306a\u4e8b\u696d\u306f\u591a\u304f\u3042\u308b\u306f\u305a\u3067\u3059\u3057\u3001\u9053\u8def\u65cf\u306e\u653f\u6cbb\u529b\u306f\u629c\u7fa4\u306a\u306e\u3067\u3001\u4ed6\u306e\u653f\u7b56\u3088\u308a\u660e\u3089\u304b\u306b\u5fc5\u8981\u3067\u3057\u305f\u3089\u305d\u306e\u5206\u306e\u4e88\u7b97\u3092\u78ba\u4fdd\u3059\u308b\u3053\u3068\u306a\u3069\u5bb9\u6613\u3044\u306f\u305a\u3067\u3059\u3002\u307e\u305f\u3001\u4e00\u822c\u8ca1\u6e90\u5316\u306b\u306a\u308b\u3068\u53d7\u76ca\u8005\u8ca0\u62c5\u304b\u3089\u5916\u308c\u308b\u305f\u3081\u3001\u66ab\u5b9a\u7a0e\u7387\u3092\u7f6e\u304f\u6839\u62e0\u3082\u7121\u304f\u306a\u308b\u3068\u3044\u3046\u610f\u898b\u306f\u305d\u306e\u901a\u308a\u3067\u3059\u304c\u3001\u305d\u306e\u5834\u5408\u306f\u65b0\u305f\u306b\u5730\u7403\u6e29\u6696\u5316\u3084\u4ea4\u901a\u4e8b\u6545\u306a\u3069\u306e\u793e\u4f1a\u7684\u30b3\u30b9\u30c8\u306b\u5bfe\u3059\u308b\u8ab2\u7a0e\u3068\u3044\u3046\u5f62\u3067\u3067\u3082\u518d\u69cb\u7bc9\u3057\u3066\u6cd5\u5236\u5316\u3059\u308c\u3070\u3088\u3044\u8a71\u3060\u3068\u601d\u3063\u3066\u3044\u307e\u3059\u3002\\n\u500b\u4eba\u7684\u306b\u306f\u8eca\u901a\u52e4\u306a\u306e\u3067\u7d0425\u5186\u4e0b\u304c\u3063\u305f\u3089\u3068\u3066\u3082\u5b09\u3057\u3044\u3053\u3068\u3067\u3059\u304c\u3001\u8ca1\u653f\u518d\u5efa\u304c\u6c42\u3081\u3089\u308c\u308b\u4e2d\u3001\u307f\u3059\u307f\u3059\u4f55\u306e\u7d4c\u6e08\u52b9\u679c\u3082\u7121\u3044\u6e1b\u7a0e\u3092\u7d042\u51467000\u5104\u5186\u3082\u884c\u3046\u3068\u3044\u3046\u306e\u306f\u3001\u7acb\u5834\u3092\u5909\u3048\u3066\u8003\u3048\u308b\u3068\u300c\u3082\u3063\u305f\u3044\u306a\u3044\u300d\u3068\u3044\u3046\u6c17\u6301\u3061\u306b\u306a\u3063\u3066\u3057\u307e\u3044\u307e\u3059\u3002\\n\uff08\u53c2\u7167\uff09\u77f3\u6cb9\u7d71\u8a08\u5e74\u5831\u3001\u30a8\u30cd\u30eb\u30ae\u30fc\u7d71\u8a08\u5e74\u5831\\n\u30ec\u30ae\u30e5\u30e9\u30fc\u3068\u30cf\u30a4\u30aa\u30af\u30ac\u30bd\u30ea\u30f3\u306e\u8ca9\u58f2\u91cf\u306e\u7d71\u8a08\u904e\u53bb5\u5e74\u5206\u3067\u3059\u3002\u8eca\u306e\u8ca9\u58f2\u53f0\u6570\u3068\u304b\u30cf\u30a4\u30d6\u30ea\u30c3\u30c9\u8eca\u306e\u5897\u52a0\u3068\u304b\u3082\u3042\u3063\u3066\u3001\u3069\u3046\u8aad\u3080\u304b\u5fae\u5999\u306a\u3068\u3053\u308d\u3067\u3059\u304c\u3001\u5e73\u621018\u5e74\u306eGW\u524d\u3084\u590f\u4f11\u307f\u524d\u306b\u5927\u5e45\u306b\u4fa1\u683c\u304c\u4e0a\u6607\u3057\u305f\u3053\u3068\u3092\u8003\u3048\u308b\u3068\u3001\u4fa1\u683c\u306f\u4f55\u5341\uff05\u3082\u4e0a\u304c\u3063\u305f\u306e\u306b\u3001\u6d88\u8cbb\uff08\u8ca9\u58f2\uff09\u306f\u7d041.6\uff05\u3057\u304b\u4e0b\u304c\u3089\u306a\u304b\u3063\u305f\u3001\u3068\u79c1\u306f\u898b\u3066\u3044\u307e\u3059\u3002\u306a\u304a\u3001\u4fa1\u683c\u9ad8\u9a30\u524d\u304b\u3089\u3053\u306e\u50be\u5411\u304c\u51fa\u3066\u3044\u308b\u306e\u3067\u3001\u3053\u308c\u304c\u5168\u3066\u3067\u306f\u306a\u3044\u3067\u3059\u304c\u3001\u30cf\u30a4\u30aa\u30af\u30ac\u30bd\u30ea\u30f3\u306e\u8ca9\u58f2\u91cf\u304c\u6e1b\u5c11\u3057\u3066\u3044\u308b\u4e00\u3064\u306e\u539f\u56e0\u3068\u3057\u3066\u3001\u4fa1\u683c\u9ad8\u9a30\u306b\u3088\u308b\u30ec\u30ae\u30e5\u30e9\u30fc\u30ac\u30bd\u30ea\u30f3\u3078\u306e\u4e57\u63db\u3048\u304c\u3042\u308b\u3068\u306f\u601d\u3063\u3066\u3044\u307e\u3059\u3002\u305d\u308c\u4ee5\u5916\u306e\u30bb\u30eb\u30d5\u30b9\u30bf\u30f3\u30c9\u306e\u5897\u52a0\u3068\u304b\u306e\u65b9\u304c\u5927\u304d\u3044\u3088\u3046\u3067\u3059\u304c\u3002\\n\u822a\u7a7a\u5238\uff11\uff10\uff10\uff10\u4ef6\u767a\u5238\u51fa\u6765\u305a\u3001\u65c5\u884c\u4f1a\u793e\u8cc7\u91d1\u7e70\u308a\u60aa\u5316\u3067\uff08\u8aad\u58f2\uff09\\nhttp://www.yomiuri.co.jp/national/news/20080111i305.htm\\n\u300c\u98db\u3073\u5f97\u300d\u306a\u3069\u306e\u540d\u3067\u683c\u5b89\u822a\u7a7a\u5238\u3092\u30cd\u30c3\u30c8\u8ca9\u58f2\u3057\u3066\u3044\u305f\u65c5\u884c\u4f1a\u793e\u300c\u5168\u56fd\u6e29\u6cc9\u65c5\u9928\u540c\u76df\u300d\uff08\u6771\u4eac\u90fd\u6e2f\u533a\uff09\u3067\u3001\u822a\u7a7a\u5238\u304c\u4e00\u6642\u7684\u306b\u767a\u5238\u3067\u304d\u306a\u304f\u306a\u3063\u3066\u3044\u305f\u3053\u3068\u304c\uff11\uff11\u65e5\u3001\u5206\u304b\u3063\u305f\u3002\\n\u5168\u56fd\u65c5\u884c\u696d\u5354\u4f1a\u306a\u3069\u306b\u3088\u308b\u3068\u3001\u540c\u793e\u306f\u6628\u5e74\uff11\uff12\u6708\uff12\uff17\u65e5\u304b\u3089\u4eca\u5e74\uff11\u6708\uff16\u65e5\u306e\u9593\u306e\u4e88\u7d04\u3092\u30cd\u30c3\u30c8\u4e0a\u3067\u53d7\u3051\u3066\u3044\u305f\u304c\u3001\u8cc7\u91d1\u7e70\u308a\u306e\u60aa\u5316\u3067\u822a\u7a7a\u5238\u3092\u7528\u610f\u3067\u304d\u306a\u3044\u72b6\u614b\u306b\u9665\u3063\u305f\u3002\u3053\u306e\u305f\u3081\u3001\u5229\u7528\u8005\u306f\u4e88\u7d04\u756a\u53f7\u3092\u7a7a\u6e2f\u306e\u7a93\u53e3\u3067\u544a\u3052\u3066\u3082\u3001\u30c1\u30b1\u30c3\u30c8\u304c\u53d7\u3051\u53d6\u308c\u306a\u304b\u3063\u305f\u3002\u88ab\u5bb3\u306f\uff11\uff10\uff10\uff10\u4ef6\u3001\uff14\uff10\uff10\uff10\u4e07\u5186\u306b\u4e0a\u308b\u3068\u898b\u3089\u308c\u308b\u3002\u540c\u5354\u4f1a\u306b\u306f\u6570\u767e\u4ef6\u306e\u76f8\u8ac7\u304c\u5bc4\u305b\u3089\u308c\u3066\u3044\u308b\u3002\\n\u540c\u793e\u306e\u99d2\u6ca2\u5b5d\u5149\u793e\u9577\u306f\u300c\u8cc7\u91d1\u7e70\u308a\u304c\u60aa\u5316\u3057\u305f\u306e\u306f\u4e00\u6642\u7684\u3067\uff11\u6708\uff17\u65e5\u4ee5\u964d\u306f\u767a\u5238\u3057\u3066\u3044\u308b\u3002\u73fe\u5728\u9867\u5ba2\u306b\u8fd4\u91d1\u6848\u5185\u306e\u30e1\u30fc\u30eb\u3092\u9001\u3063\u3066\u3044\u308b\u3068\u3053\u308d\u3067\u3001\uff13\u6708\u672b\u307e\u3067\u306b\u306f\u8fd4\u91d1\u3057\u305f\u3044\u300d\u3068\u3057\u3066\u3044\u308b\u3002\\n\u9577\u671f\u4f11\u6687\u306e\u53d6\u308c\u308b\u8cb4\u91cd\u306a\u5e74\u672b\u5e74\u59cb\u306b\u3001\u3053\u306e\u3088\u3046\u306a\u65c5\u884c\u4f1a\u793e\u306b\u5f53\u305f\u3063\u3066\u3057\u307e\u3063\u305f\u65b9\u306b\u306f\u3001\u304a\u6c17\u306e\u6bd2\u306b\u3068\u3057\u304b\u8a00\u3044\u3088\u3046\u304c\u3042\u308a\u307e\u305b\u3093\u3002\u4ee5\u4e0b\u306e\u30d6\u30ed\u30b0\u7b49\u306b\u3001\u3088\u308a\u306b\u3088\u3063\u3066\u8a95\u751f\u65e5\u306b\u3053\u306e\u3088\u3046\u306a\u707d\u96e3\u306b\u906d\u308f\u308c\u305f\u88ab\u5bb3\u8005\u306e\u65b9\u306e\u4f53\u9a13\u8ac7\u306a\u3069\u304c\u8a9e\u3089\u308c\u3066\u3044\u307e\u3059\u3002\\n\u3068\u3093\u3060\u8a95\u751f\u65e5\u30fb\u30fb\u30fb\u3060\u304c\u98db\u884c\u6a5f\u306f\u98db\u3093\u3060\u3002\u3057\u3083\u308c\u3066\u308b\u5834\u5408\u304b\u3063(\u6012)\\n\u6c17\u306e\u6bd2\u3067\u3059\u3002\u3053\u306e\u65b0\u805e\u8a18\u4e8b\u3092\u8aad\u3093\u3067\u308b\u3068\u3001\u3053\u306e\u793e\u9577\u306e\u30b3\u30e1\u30f3\u30c8\u304c\u5168\u304f\u60aa\u3073\u308c\u3066\u3044\u306a\u3044\u3053\u3068\u306b\u9055\u548c\u611f\u3092\u6301\u3061\u3001\u3053\u306e\u65c5\u884c\u4f1a\u793e\u300c\u5168\u56fd\u6e29\u6cc9\u65c5\u9928\u540c\u76df\u300d\u3068\u300c\u98db\u3073\u5f97\u300d\u306e\u30b5\u30a4\u30c8\u3092\u691c\u7d22\u3057\u3066\u307f\u307e\u3057\u305f\u3002\u3060\u3063\u3066\u3001\u88ab\u5bb3\u8005\u306b\u8b1d\u308a\u3082\u305b\u305a\uff08\u3053\u306e\u8a18\u4e8b\u304b\u3089\u306f\u7701\u7565\u3055\u308c\u305f\u53ef\u80fd\u6027\u3082\u3042\u308b\u3051\u3069\uff09\u3001\u300c\u8cc7\u91d1\u7e70\u308a\u60aa\u5316\u306f\u4e00\u6642\u7684\u300d\u300c\uff11\u6708\uff17\u65e5\u4ee5\u964d\u306f\u767a\u5238\u300d\u3068\u3082\u3046\u554f\u984c\u306a\u3044\u3053\u3068\u3092\u30a2\u30d4\u30fc\u30eb\u3057\u3064\u3064\u3001\u300c\uff13\u6708\u672b\u307e\u3067\u306b\u306f\u8fd4\u91d1\u3057\u305f\u3044\u300d\u3068\u88ab\u5bb3\u56de\u5fa9\u306f\u304b\u306a\u308a\u5148\u306b\u5148\u9001\u308a\u3057\u3001\u3057\u304b\u3082\u305d\u308c\u304c\u300c\u3057\u305f\u3044\u300d\u3068\u9858\u671b\u306a\u3093\u3060\u3082\u3093\u3002\u3053\u3093\u306a\u4e00\u8a00\u306e\u30b3\u30e1\u30f3\u30c8\u3067\u3053\u3053\u307e\u3067\u300c\u3042\u308c\uff1f\u300d\u3068\u601d\u308f\u305b\u308b\u3088\u30