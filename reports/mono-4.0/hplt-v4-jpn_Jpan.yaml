  \uff13\u5206\u306e\uff12\u304c\u652f\u6301 \u672c\u793e\u30fb\uff26\uff2e\uff2e\u4e16\u8ad6\u8abf\u67fb\uff08\u7523\u7d4c\u65b0\u805e\uff09\\nhttp://headlines.yahoo.co.jp/hl?a=20080116-00000069-san-pol\\n\u5408\u540c\u4e16\u8ad6\u8abf\u67fb\u3067\u306f\u3001\u6b21\u671f\u901a\u5e38\u56fd\u4f1a\u3067\u4e0e\u91ce\u515a\u653b\u9632\u306e\u6700\u5927\u306e\u4e89\u70b9\u306b\u306a\u308b\u3068\u307f\u3089\u308c\u308b\u300c\u63ee\u767a\u6cb9\u7a0e\u306e\u66ab\u5b9a\u7a0e\u7387\u300d\u554f\u984c\u3078\u306e\u610f\u898b\u3082\u805e\u3044\u305f\u3002\u305d\u308c\u306b\u3088\u308b\u3068\u3001\u300c\u5ec3\u6b62\u300d\u3092\u6c42\u3081\u308b\u58f0\u304c\u7d04\uff13\u5206\u306e\uff12\u306b\u4e0a\u308a\u3001\u7a0e\u7387\u7dad\u6301\u3092\u62c5\u4fdd\u3059\u308b\u305f\u3081\u6b73\u5165\u95a2\u9023\u6cd5\u6848\u306e\uff13\u6708\u672b\u307e\u3067\u306e\u6210\u7acb\u3092\u76ee\u6307\u3059\u653f\u5e9c\u30fb\u4e0e\u515a\u306b\u3068\u3063\u3066\u306f\u53b3\u3057\u3044\u7d50\u679c\u304c\u793a\u3055\u308c\u305f\u3002\u6c11\u4e3b\u515a\u306f\u5ec3\u6b62\u306b\u5411\u3051\u3066\u6cd5\u6848\u6210\u7acb\u963b\u6b62\u3067\u5fb9\u5e95\u6297\u6226\u306e\u69cb\u3048\u3092\u793a\u3057\u3066\u304a\u308a\u3001\u3053\u306e\u6cd5\u6848\u306a\u3069\u306e\u4e0d\u6210\u7acb\u306b\u3088\u308b\u300c\uff14\u6708\u30d1\u30cb\u30c3\u30af\u300d\u3082\u4e88\u60f3\u3055\u308c\u308b\u3002\\n\u7a0e\u7387\u7dad\u6301\u306e\u653f\u5e9c\u6848\u304c\u6210\u7acb\u305b\u305a\u3001\u66ab\u5b9a\u7a0e\u7387\u304c\u5ec3\u6b62\u3055\u308c\u305f\u5834\u5408\u3001\u30ac\u30bd\u30ea\u30f3\u304c\uff11\u30ea\u30c3\u30c8\u30eb\u5f53\u305f\u308a\uff12\uff15\u30fb\uff11\u5186\u5b89\u304f\u306a\u308b\u4e00\u65b9\u3001\u7d04\uff11\u5146\uff14\uff17\uff10\uff10\u5104\u5186\u306e\u6e1b\u53ce\u3068\u306a\u308a\u3001\u56fd\u306e\u9053\u8def\u6574\u5099\u8a08\u753b\u306f\u898b\u76f4\u3057\u3092\u8feb\u3089\u308c\u308b\u3002\\n\u753a\u6751\u4fe1\u5b5d\u5b98\u623f\u9577\u5b98\u306f\uff11\uff15\u65e5\u306e\u8a18\u8005\u4f1a\u898b\u3067\u300c