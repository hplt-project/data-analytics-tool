  "\"6\u65e5\u3082\u4ed9\u53f0\u306f\u306f\u3063\u304d\u308a\u3057\u306a\u3044\u5929\u6c17\u3002\\n\u89aa\u7236\u304c\u4f11\u307f\u3060\u3063\u305f\u306e\u3067\u3001\u8eca\u3067\u5c71\u5f62\u8535\u738b\u307e\u3067\u9023\u308c\u3066\u3063\u3066\u3082\u3089\u3063\u305f\u3002\\n\u8535\u738b\u3092\u8d8a\u3048\u3089\u308c\u308b\u96e8\u96f2\u306f\u7121\u3044\u3088\u3046\u3067\u3001\u306a\u304b\u306a\u304b\u306e\u597d\u5929\u3067\u3057\u305f\u3002\\n\u8535\u738b\u3067\u306f\u3001\u30ed\u30fc\u30d7\u30a6\u30a7\u30fc\u3067\u5730\u8535\u5c71\u306b\u767b\u308a\u3001\u30b9\u30ad\u30fc\u5834\u3092\u3066\u304f\u3066\u304f\u964d\u308a\u3066\u304f\u308b\u304a\u6c17\u697d\u30b3\u30fc\u30b9\u3002\\n\u8535\u738b\u306e\u76ee\u6a19\u306e\u4e00\u3064\u306f\u3001\u516b\u7532\u7530\u3067\u3044\u307e\u3044\u3061\u3060\u3063\u305f\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u3002\u305f\u3060\u3001\u5bae\u57ce\u770c\u5074\u3067\u306f\u30ad\u30d9\u30ea\u304c\u3044\u308b\u30dd\u30a4\u30f3\u30c8\u3092\u77e5\u3063\u3066\u3044\u305f\u304c\u3001\u5c71\u5f62\u5074\u3067\u306f\u898b\u305f\u3053\u3068\u304c\u306a\u3044\u306e\u3067\u3061\u3087\u3063\u3068\u5fc3\u914d\u3067\u3057\u305f\u3002\\n\u3068\u3053\u308d\u304c\u3001\u30ed\u30fc\u30d7\u30a6\u30a7\u30fc\u3092\u964d\u308a\u305f\u3089\u3001\u3044\u304d\u306a\u308a\u3044\u307e\u3057\u305f\u3002\u305d\u308c\u3082\u5c71\u9802\u99c5\u306e\u5efa\u7269\u5185\u306b\u3002\\n\u5199\u771f\u3092\u64ae\u3063\u305f\u5f8c\u3001\u8868\u306b\u653e\u3057\u3066\u3084\u3063\u305f\u3002\\n\u99c5\u306e\u88cf\u306b\u3082\u4e8c\u5339\u3044\u3066\u3001\u5199\u771f\u306f\u53d6\u308c\u306a\u304b\u3063\u305f\u304c\u3001\u3053\u308c\u306f\u5e78\u5148\u3044\u3044\u3068\u601d\u3063\u305f\u3002\\n\u3057\u304b\u3057\u3001\u305d\u306e\u5f8c\u3057\u3070\u3089\u304f\u307e\u3063\u305f\u304f\u59ff\u3092\u898b\u305b\u305a\u3002\\n\u6b21\u306b\u51fa\u4f1a\u3063\u305f\u306e\u306f\u3001\u4e2d\u8179\u306e\u590f\u5b63\u4f11\u696d\u4e2d\u306e\u30db\u30c6\u30eb\u88cf\u306b\u3066\u3002\\n\u3088\u3046\u3084\u304f\u3001\u7fc5\u306e\u8868\u3092\u5199\u771f\u3092\u64ae\u3089\u305b\u3066\u3082\u3089\u3063\u305f\u3002\\n\u3053\u306e\u6642\u671f\u306e\u3001\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u306f\u3001\u672c\u5f53\u306b\u7dba\u9e97\u306a\u8776\u3060\u3068\u601d\u3044\u307e\u3059\u3002\u6c17\u54c1\u304c\u3042\u308a\u307e\u3059\u3002\\n\u8d8a\u51ac\u660e\u3051\u306f\u8272\u304c\u629c\u3051\u3066\u30b7\u30ed\u30d9\u30ea\u306b\u306a\u3063\u3066\u3057\u307e\u3044\u307e\u3059\u304c\u3002\\n\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u306f\u3001\u79c1\u306e\u3068\u3066\u3082\u597d\u304d\u306a\u8776\u3067\u3001\u3053\u3053\u306e\u30d6\u30ed\u30b0ID\u3082kiberi\u306b\u306a\u3063\u3066\u3044\u307e\u3059\u3002\\n\u3053\u306e\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u3082\u3001\u79c1\u3092\u6c17\u306b\u5165\u3063\u305f\u3089\u3057\u304f\u3001\u98db\u3073\u7acb\u3064\u3068\u79c1\u306e\u80cc\u4e2d\u306b\u3002\\n\u305d\u306e\u5f8c\u3082\u3001\u4f55\u5ea6\u3082\u79c1\u306b\u3068\u307e\u308b\u3002\\n\u3088\u3063\u307d\u3069\u3001\u6c57\u81ed\u304b\u3063\u305f\u3093\u3067\u3057\u3087\u3046\u306d\u3002\\n\u30db\u30c6\u30eb\u306e\u8fd1\u304f\u306b\u3042\u3063\u305f\u3001\u6728\u9020\u306e\u30c8\u30a4\u30ec\u306e\u8ed2\u5148\u306b\u306f\u3001\u4e09\u982d\u3082\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u304c\u3044\u307e\u3057\u305f\u3002\u6b8b\u5ff5\u306a\u304c\u3089\u3001\u7fc5\u306e\u8868\u306f\u64ae\u308c\u305a\u3002\\n\u88cf\u304b\u3089\u898b\u308b\u3068\u3001\u3068\u3066\u3082\u5730\u5473\u306a\u8776\u3067\u3059\u3002\\n\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u306f\u3001\u5c71\u9593\u306e\u5efa\u7269\u5468\u8fba\u3084\u5d16\u3001\u88f8\u5730\u3067\u3088\u304f\u898b\u307e\u3059\u304c\u3001\u4eca\u56de\u306f\u3059\u3079\u3066\u5efa\u7269\u304c\u3089\u307f\u3067\u3057\u305f\u3002\\n---------------------------------------------------------------------------\\n9/16
  \u8ffd\u8a18\\n\u30b3\u30e1\u30f3\u30c8\\nSECRET: 0\\nPASS: 6d74452b758128a5cea92cd77a1c4cdb\\n\u3044\u3044\u3067\u3059\u306d\u3002\u30ad\u30d9\u30ea\u30bf\u30c6\u30cf\u30fb\u30fb\u30fb\u898b\u3066\u307f\u305f\u3044\u3067\u3059\u3002\\n\u30bf\u30c6\u30cf\u306e\u7cfb\u7d71\u306f\u826f\u304f\u30ba\u30dc\u30f3\u306b\u6b62\u307e\u3063\u305f\u308a\u3057\u307e\u3059\u306d\u3002\u3084\u306f\u308a\u6c57\u306e\u5302\u3044\u306b\u60f9\u304b\u308c\u308b\u306e\u3067\u3057\u3087\u3046\u306d\u3002\\nSECRET:
  0\\nPASS: 74be16979710d4c4e7c6647856088456\\nMG\u3055\u3093\\n\u30ad\u30d9\u30ea\u306f\u3001\u95a2\u897f\u3067\u306f\u898b\u3089\u308c\u307e\u305b\u3093\u304b\u3089\u306d\u3002\u305f\u307e\u305f\u307e\u3001\u3053\u306e\u6642\u671f\u306b\u6771\u5317\u306b\u3044\u3051\u3066\u30e9\u30c3\u30ad\u30fc\u3067\u3057\u305f\u3002\\n\u5199\u771f\u3092\u64ae\u308d\u3046\u3068\u3059\u308b\u3068\u3059\u3050\u9003\u3052\u308b\u306e\u306b\u3001\u6c57\u306e\u5302\u3044\u306b\u5f15\u304b\u308c\u305f\u3068\u304d\u306f\u3001\u3057\u3064\u3053\u304f\u4ed8\u304d\u307e\u3068\u3063\u3066\u304f\u308b\u304b\u3089\u4e0d\u601d\u8b70\u3067\u3059\u3002\"",
  "\"\u65e5\u672c\u6700\u5927\u7d1a\u30da\u30c3\u30c8\u30dd\u30fc\u30bf\u30eb\u30b5\u30a4\u30c8\\n\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u306b\u3044\u308b\u30da\u30c3\u30c8\u304c\u63b2\u8f09\u3055\u308c\u3066\u3044\u308b\u30b5\u30a4\u30c8\u3068\u3057\u3066\u56fd\u5185\u6700\u5927\u7d1a\u306e\u60c5\u5831\u30b5\u30a4\u30c8\u300c\u30da\u30c3\u30c8\u30b9\u30c6\u30fc\u30b7\u30e7\u30f3\u300d\u304c\u30aa\u30fc\u30d7\u30f310\u5468\u5e74\u3092\u8fce\u3048\u3066\u63b2\u8f09\u751f\u4f53\u6570\u304c\u7d2f\u8a08\u306725\u4e07\u982d\u3092\u8d8a\u3048\u305f\u3002\\n\u30da\u30c3\u30c8\u30b9\u30c6\u30fc\u30b7\u30e7\u30f3\u306f2007\u5e74\u306b\u300c\u4eca\u8fd1\u304f\u306b\u3044\u308b\u30da\u30c3\u30c8\u3092\u63a2\u3057\u305f\u3044\u300d\u3092\u53ef\u80fd\u306b\u3059\u308b\u30b5\u30a4\u30c8\u3068\u3057\u3066\u7acb\u3061\u3042\u304c\u308a\u3001\u4ee5\u6765\u30da\u30c3\u30c8\u3068\u5171\u5b58\u3067\u304d\u308b\u793e\u4f1a\u306e\u7406\u60f3\u5f62\u3092\u63a2\u3057\u7d9a\u3051\u308b\u4e8b\u3092\u30df\u30c3\u30b7\u30e7\u30f3\u306b\u3001\u767b\u9332\u30d6\u30ea\u30fc\u30c0\u30fc\u3001\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u3001\u30da\u30c3\u30c8\u3001\u30e6\u30fc\u30b6\u30fc\u306f\u5897\u3048\u7d9a\u3051\u3066\u304d\u305f\u3002\\n\u30d6\u30ea\u30fc\u30c0\u30fc\u76f4\u8ca9\u3092\u3046\u305f\u3044\u306a\u304c\u3089\u88cf\u3067\u8ca9\u58f2\u624b\u6570\u6599\u3092\u8f09\u305b\u3066\u3044\u308b\u30dd\u30fc\u30bf\u30eb\u30b5\u30a4\u30c8\u3070\u304b\u308a\u6b8b\u308a\u3001\u672c\u5f53\u306b\u7121\u6599\u306e\u30b5\u30fc\u30d3\u30b9\u306f\u65e9\u3005\u306b\u6d88\u3048\u53bb\u3063\u3066\u3057\u307e\u3046\u30da\u30c3\u30c8\u306e\u30dd\u30fc\u30bf\u30eb\u30b5\u30a4\u30c8\u696d\u754c\u3067\u3001\u552f\u4e00\u672c\u5f53\u306b\u624b\u6570\u6599\u306a\u3057\u306e\u307e\u307e10\u5e74\u9593\u3084\u3063\u3066\u304d\u305f\u30da\u30c3\u30c8\u30b9\u30c6\u30fc\u30b7\u30e7\u30f3\u3002\\n\u4eca\u73fe\u5728\u3082\u5168\u56fd1000\u5e97\u8217\u4ee5\u4e0a\u306e\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u30fb\u30d6\u30ea\u30fc\u30c0\u30fc\u304c\u4eca\u3044\u308b\u72ac\u3001\u732b\u3001\u305d\u306e\u4ed6\u30da\u30c3\u30c8\u3092\u65e5\u3005\u66f4\u65b0\u3057\u3066\u304a\u308a\u3001\u5357\u306f\u6c96\u7e04\u304b\u3089\u5317\u306f\u5317\u6d77\u9053\u307e\u3067\u5168\u90fd\u9053\u5e9c\u770c\u306e\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u30fb\u30d6\u30ea\u30fc\u30c0\u30fc\u304c\u7db2\u7f85\u3055\u308c\u3066\u3044\u308b\u3002\u88cf\u5074\u3067\u306f\u6fc0\u52d5\u3059\u308b\u52d5\u7269\u611b\u8b77\u95a2\u9023\u306e\u6cd5\u4ee4\u9806\u5b88\u3092\u63a8\u9032\u3059\u308b\u70ba\u3001\u81ea\u6cbb\u4f53\u306b\u63d0\u51fa\u3059\u308b\u3079\u304d\u66f8\u985e\u3092\u30af\u30e9\u30a6\u30c9\u3067\u7ba1\u7406\u3067\u304d\u308b\u30b5\u30fc\u30d3\u30b9\u3092\u56fd\u5185\u3067\u6700\u521d\u306b\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u30fb\u30d6\u30ea\u30fc\u30c0\u30fc\u306b\u63d0\u4f9b\u3057\u305f\u308a\u3001\u30d6\u30ea\u30fc\u30c0\u30fc\u3084\u30da\u30c3\u30c8\u30b7\u30e7\u30c3\u30d7\u540c\u58eb\u3067\u3082\u7ba1\u7406\u753b\u9762\u3067\u5546\u53d6\u5f15\u304c\u81ea\u7531\u306b\u51fa\u6765\u308b\u3088\u3046\u306b\u3057\u305f\u308a\u3059\u308b\u306a\u3069\u3001\u5e38\u306b\u30da\u30c3\u30c8\u696d\u754c\u3092\u88cf\u3068\u8868\u304b\u3089\u652f\u3048\u3066\u304d\u305f\u30b5\u30fc\u30d3\u30b9\u3068\u306a\u3063\u3066\u3044\u308b\u3002\\n\u4eca\u5f8c\u3082\u307e\u3060\u6fc0\u52d5\u304c\u4e88\u60f3\u3055\u308c\u308b\u30da\u30c3\u30c8\u696d\u754c\u306e\u6cd5\u4ee4\u3084\u3001\u3053\u3061\u3089\u3082\u307e\u3060\u307e\u3060\u7a81\u304d\u8a70\u3081\u308b\u5fc5\u8981\u306e\u3042\u308b\u30da\u30c3\u30c8\u3068\u4eba\u9593\u306e\u95a2\u4fc2\u6027\u306a\u3069\u3092IT\u3067\u5168\u822c\u7684\u306b\u30b5\u30dd\u30fc\u30c8\u3057\u3066\u3044\u304f\u30b5\u30fc\u30d3\u30b9\u3068\u3057\u3066\u3001\u307e\u305f\u98fc\u3044\u4e3b\u306b\u306a\u308b\u4eba\u306b\u306f\u4eca\u304a\u3046\u3061\u306b\u8fce\u3048\u3089\u308c\u308b\u30da\u30c3\u30c8\u3092\u7d39\u4ecb\u3059\u308b\u30b5\u30a4\u30c8\u3068\u3057\u3066\u30